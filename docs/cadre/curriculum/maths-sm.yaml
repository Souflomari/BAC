      statut: "PROPOSITION — en attente de research-challenger + validation humaine ; la relecture longue Gemini doit vérifier les capacités 1.2.6/1.2.7/1.3.7/1.3.15 contre le cadre SM scanné et confirmer qu'aucune autre capacité 1.2.x/1.3.x ne manque."
    - date: 2026-09-27
      origine: "signalement d'un auteur de contenu (wave B1), au départ sur le seul PETIT THÉORÈME DE FERMAT. La relecture de la liste COMPLÈTE des 9 capacités du sous-domaine a trouvé deux autres défauts."
      defaut_1_fermat_absent: >-
        Le petit théorème de Fermat ne figurait NULLE PART dans le chapitre arithmetique_z :
        ni `programme`, ni `savoir_faire`. Pire que l'absence : la ligne `limites` nommait
        TROIS exclusions voisines (indicatrice d'Euler, RSA, résidus quadratiques) en restant
        muette sur Fermat — configuration qui se lit comme une décision, alors que c'était un
        oubli. content/maths/arithmetique/lesson.md:591-609 avait explicitement remonté le
        problème au propriétaire du cadre (« cadre silencieux, à confirmer … la ligne de
        programme mériterait d'être complétée explicitement, plutôt que de laisser ce silence
        trancher par défaut à chaque notion qui en a besoin »). Réponse : le cadre n'était pas
        silencieux, NOTRE frontière l'était.
      preuve_1: >-
        Capacité 2.1.8 du cadre SM, verbatim par pdfmath.com/cours/bacsm-2026-sm/ (source 3
        du README) : « Utiliser la divisibilité, la division euclidienne, les théorèmes de
        Gauss, de Bézout et de Fermat, le théorème fondamental et les propriétés des nombres
        premiers. » Seconde jambe (composition des examens nationaux SM) : SIX exercices
        vérifiés du corpus mobilisent Fermat — content/maths/arithmetique/bank.yaml, entrées
        2019 (p=2969), 2020 N (p=13, :262), 2021 N (p=43 et 47, :646 et :695), 2022 N (:377),
        2023 N (:787), 2024 N (deux premiers p et q, :515). Audit indépendant :
        docs/audits/dette-examen/maths.md:51-60 (« GAP-B (inverse): Petit théorème de Fermat
        has no rung ») et :485.
      defaut_2_exclusion_residus_falsifiee: >-
        L'exclusion « pas de résidus quadratiques » était falsifiée par une copie vérifiée :
        bk-2023-n-x4 (2023 N, Exercice 4, SM, 3 points — content/maths/arithmetique/bank.yaml:744-778)
        porte entièrement sur la résolubilité de x² ≡ 2 [p]. Exclusion resserrée sur la THÉORIE
        (symbole de Legendre, critère d'Euler, réciprocité quadratique), avec mention explicite
        que la question concrète est attestée et ne doit pas être écartée. Même mode de défaut
        que celui trouvé le même jour dans maths-sexp.yaml par la passe research-challenger :
        une exclusion `derived` contredite par une annale que la frontière pouvait citer.
      defaut_3_numeration_absente: >-
        TROISIÈME défaut, le plus gros et non signalé par personne : les SYSTÈMES DE NUMÉRATION
        occupent trois des neuf capacités du sous-domaine (2.1.4 « Écrire un entier naturel dans
        un système de numération de base donnée », 2.1.5 « Additionner, multiplier et comparer
        deux entiers dans un système de numération », 2.1.6 « Utiliser les écritures dans des
        systèmes de numération dans des situations d'arithmétique ») et ne figuraient pas au
        programme. Le corpus ne les couvre pas du tout (un seul appariement « numération/base »
        dans tout content/maths/arithmetique/). Ajoutées au programme + savoir_faire, et
        inscrites en LACUNE PRIORITAIRE dans chapitres_cadre_sans_lecon.
      statut_de_la_preuve_de_fermat: >-
        DEMANDÉ : « la preuve est-elle attendue, ou le théorème est-il admis ? » RÉPONSE
        HONNÊTE : **la source ne le tranche pas.** La capacité 2.1.8 commence par « Utiliser »,
        mais ce verbe ne porte aucune information sur Fermat en particulier — 6 des 9 capacités
        du sous-domaine commencent par « Utiliser ». C'est le registre de la liste, pas un
        statut démonstratif. Et un cadre de référence d'EXAMEN énumère ce qui est ÉVALUABLE : il
        est structurellement muet sur ce que le cours démontre. Consigné en
        `_question_ouverte_owner` sur le chapitre, avec le motif d'examen observé (6/6
        applications, 0 demande de preuve) rangé séparément en `_observation_examens` pour
        qu'il ÉCLAIRE la décision sans la prendre. Ce qui EST tranché : le théorème étant nommé
        au cadre, la preuve portée par content/maths/arithmetique/lesson.md R6b (construite sur
        Gauss + lemme d'Euclide) n'est PAS hors-programme ; seule son caractère évaluable reste
        à l'owner.
      correctif: >-
        Chapitre arithmetique_z : deux lignes `programme` ajoutées (Fermat + théorème
        fondamental ; systèmes de numération), deux `savoir_faire` ajoutés, ligne `limites`
        scindée et resserrée, deux nouvelles clés de chapitre `_question_ouverte_owner` et
        `_observation_examens`. coverage_notes : une lacune de couverture ajoutée (numération).
        Aucune `exclusions_transversales` touchée.
      dette_signalee_hors_perimetre: >-
        content/maths/arithmetique/lesson.md:593-594 cite « maths-sm.yaml:277-281 » et « :287 »
        pour le programme et les limites d'arithmétique — références devenues FAUSSES (les
        lignes ont glissé avec les révisions du 2026-09-27 ; c'est aujourd'hui ~:297-318). Le
        fichier de leçon n'est pas dans le périmètre d'édition de cette passe : à corriger par
        qui en a la main (ADR 0031 : une référence croisée est une instruction).
      statut: "PROPOSITION — en attente de research-challenger + validation humaine. La relecture longue Gemini doit vérifier les 9 capacités 2.1.1→2.1.9 contre le cadre SM scanné (en particulier que 2.1.8 nomme bien Fermat et que les trois capacités de numération existent), et trancher le statut de la preuve n'appartient qu'à l'owner."

