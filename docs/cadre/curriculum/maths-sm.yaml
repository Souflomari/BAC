coverage_notes:
  intro: >
    Les 14 leçons content/maths/ sont orientées SM et couvrent bien la plupart des
    chapitres. Restent des LACUNES (chapitres du cadre SM sans leçon dédiée, ou
    notions SM absentes d'une leçon existante) — listées ci-dessous, à corriger en
    amont de l'authoring.

  chapitres_cadre_sans_lecon:         # lesson_slug: null
    - chapitre: "Fonctions primitives (chapitre systématique)"
      lesson_slug: null
      note: "Dispersé (calcul-integral R1, fonction-exponentielle R6) ; pas de chapitre systématique des primitives usuelles/formes. LACUNE."
    - chapitre: "Espaces vectoriels (sous-espaces, familles libres/génératrices, bases, dimension, applications linéaires)"
      lesson_slug: null
      note: "La leçon structures-algebriques (R1-R6) s'arrête aux groupes/anneaux/corps — les ESPACES VECTORIELS, pourtant au cadre SM, n'ont PAS de leçon. LACUNE PRIORITAIRE."
    - chapitre: "Variable aléatoire, loi de probabilité, espérance, LOI BINOMIALE"
      lesson_slug: null
      note: "probabilites-conditionnelles couvre conditionnel/indépendance/totales mais PAS la variable aléatoire ni la loi binomiale. LACUNE PRIORITAIRE."
    - chapitre: "SYSTÈMES DE NUMÉRATION (écriture d'un entier dans une base, opérations et comparaison dans une base, usage en arithmétique)"
      lesson_slug: null
      note: >-
        AJOUT 2026-09-27. TROIS capacités du cadre SM sur les neuf du sous-domaine
        arithmétique (2.1.4, 2.1.5, 2.1.6) — un tiers du bloc — et le corpus ne les couvre
        PAS : un seul appariement de « numération / base » dans tout content/maths/arithmetique/
        (grep lesson.md + items.yaml + bank.yaml + exercises.yaml + checkpoints.yaml).
        Ni rung, ni item, ni annale. LACUNE PRIORITAIRE, probablement la plus grosse de ce
        sous-domaine — trouvée en relisant la liste complète des capacités à l'occasion du
        signalement Fermat, et non signalée par l'audit dette-examen (qui part du corpus, donc
        ne peut pas voir ce qui manque ENTIÈREMENT — cf. ADR 0036 : « un filtre anti-bruit
        bâti sur ce qui EXISTE DÉJÀ est structurellement aveugle à ce qui manque entièrement »).

  notions_manquantes_dans_lecons_existantes:   # la leçon existe mais une notion SM du cadre y manque
    - lesson_slug: derivabilite-etude-fonctions
      manque: "Théorème de ROLLE et théorème/inégalité des ACCROISSEMENTS FINIS (nommés explicitement par le cadre SM ; R1-R5 ne les traitent pas)."
    - lesson_slug: calcul-integral
      manque: "SOMMES DE RIEMANN (construction/encadrement de l'intégrale). Fonctions définies par une intégrale (x↦∫ₐˣf) à vérifier."
    - lesson_slug: equations-differentielles
      manque: "Équation générale du 2e ordre y''+ay'+by=0 (équation caractéristique, cas Δ>0/Δ=0/Δ<0). La leçon (R4) ne traite que y''+ω²y=0."
    - lesson_slug: limites-continuite
      manque: "LIMITES TRIGONOMÉTRIQUES (lim (sin x)/x). À vérifier."
      note_2026_09_27: >-
        Le « théorème/dérivée de la FONCTION RÉCIPROQUE » figurait ici comme lacune : c'est
        FAUX et c'était une erreur de mapping, pas de couverture. Le corpus l'enseigne, mais
        dans une AUTRE leçon : content/maths/derivabilite-etude-fonctions/lesson.md:427-541
        (chapitre R5b « Fonction réciproque » — théorème d'existence, courbe symétrique par
        rapport à y=x, théorème de la dérivée (f⁻¹)'(b)=1/f'(a) avec la condition f'(a)≠0, et
        deux exemples travaillés), plus les items DERIVFCT-34→37
        (content/maths/derivabilite-etude-fonctions/items.yaml:1791-1792, 2049+). Ce qui reste
        vrai et ouvert : le cadre SM range l'EXISTENCE en 1.2.x (bloc continuité) et la
        DÉRIVÉE en 1.3.7 (bloc dérivation), alors que notre corpus met les trois temps dans la
        seule leçon derivabilite-etude-fonctions — divergence de PLACEMENT à arbitrer, pas
        lacune de contenu. Voir aussi content/maths/derivabilite-etude-fonctions/REVIEW-2026-09-20.md,
        qui signale que ce chapitre R5b n'a pas de code/manipulable associé.
    - lesson_slug: fonction-exponentielle
      manque: "Exponentielle de base a (a^x) et FONCTIONS PUISSANCES x^α. À vérifier."
    - lesson_slug: fonction-logarithme
      manque: "Logarithme de base a (au-delà du log décimal en R6). À vérifier."
