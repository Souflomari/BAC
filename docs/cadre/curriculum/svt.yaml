coverage_notes:
  intro: >
    Nos 11 leçons content/svt/ couvrent PROPREMENT quatre des six unités du cadre
    filière SVT : métabolisme (2 des 3 chapitres), génétique formelle (mono/dihybridisme,
    humaine, populations), immunologie (3/3), géologie (3/3). Trois écarts au cadre
    officiel sont documentés ci-dessous ; le contenu SVT étant GELÉ cette campagne,
    ils sont journalisés, pas corrigés.

  mapping_11_lecons:                  # leçon ↔ chapitre du cadre (mapping propre)
    - { lesson_slug: role-enzymes,                          chapitre: role_enzymes,                        etat: "propre" }
    - { lesson_slug: liberation-energie-matiere-organique,  chapitre: liberation_energie,                  etat: "propre" }
    - { lesson_slug: transmission-caracteres,               chapitre: transmission_caracteres,             etat: "propre (mais brassage intrachromosomique différé — voir lacunes)" }
    - { lesson_slug: genetique-humaine,                     chapitre: genetique_humaine,                   etat: "propre" }
    - { lesson_slug: genetique-populations,                 chapitre: genetique_populations,               etat: "propre" }
    - { lesson_slug: soi-non-soi,                           chapitre: soi_non_soi,                          etat: "propre" }
    - { lesson_slug: moyens-de-defense,                     chapitre: moyens_de_defense,                    etat: "propre" }
    - { lesson_slug: dysfonctionnements-immunitaires,       chapitre: dysfonctionnements_immunitaires,      etat: "propre" }
    - { lesson_slug: theorie-tectonique-plaques,            chapitre: tectonique_plaques,                  etat: "propre" }
    - { lesson_slug: chaines-de-montagnes,                  chapitre: chaines_de_montagnes,                etat: "propre" }
    - { lesson_slug: granitisation-deformation,             chapitre: granitisation_deformation,           etat: "propre" }

  unites_cadre_sans_lecon:            # unités/chapitres du cadre SANS leçon (lacunes de couverture)
    - id: information_genetique_genie_genetique
      gravite: "MAJEURE — unité entière"
      note: >
        L'unité « Nature et expression de l'information génétique + génie génétique »
        (ADN, réplication, transcription, traduction, code génétique, mutations,
        transgenèse/OGM) est AU CADRE de la filière SVT et n'est couverte par AUCUNE
        de nos 11 leçons. Nos leçons de génétique sont FORMELLES (Mendel, arbres,
        populations), pas moléculaires. C'est la plus grande lacune de couverture.
      chapitres_attendus:             # source: research-consensus (existence) — non extraits en détail ici
        - "Structure et réplication de l'ADN"
        - "Expression : transcription, traduction, code génétique"
        - "Mutations et variabilité génétique"
        - "Génie génétique et ses applications (transgenèse, OGM, thérapie génique)"
    - id: muscle_strie_squelettique
      gravite: "MODÉRÉE — 1 chapitre"
      note: >
        « Le rôle du muscle strié squelettique dans la conversion de l'énergie »
        (unité métabolisme) : au cadre, sans leçon. Détaillé comme chapitre
        (lesson_slug: null) dans biologie/metabolisme_energie.
    - id: brassage_intrachromosomique
      gravite: "MODÉRÉE — thème d'un chapitre existant"
      note: >
        Le brassage INTRAchromosomique (gènes liés, crossing-over, recombinaison,
        carte génétique) est au programme de transmission filière SVT mais
        EXPLICITEMENT DIFFÉRÉ dans la leçon transmission-caracteres (« ce cas de
        figure sort du programme de cette leçon »). L'eval l'a noté. La leçon ne
        traite que le brassage interchromosomique (gènes indépendants).

  poids_par_domaine:
    statut: "NON CHIFFRÉ"
    note: >
      La répartition en POURCENTAGE par domaine (tableau de spécification du cadre)
      n'est pas lisible (PDF scanné) et n'est publiée dans aucune synthèse récupérée.
      Le SEUL poids publié et confirmé (research-consensus) est le barème TRANSVERSAL
      restitution 25 % / raisonnement-communication 75 %. Récupérer les % par domaine
      est l'upgrade prioritaire (cible de la relecture Gemini du cadre scanné).

  variante_pc:                        # la variante SVT-pour-PC, distincte
    statut: "DISTINCTE — non extraite"
    note: >
      La SVT en filière Sciences Physiques (PC) a un CADRE SÉPARÉ (AlloSchool élément
      48555, distinct du 48556), coefficient 5 (vs 7 en filière SVT ; cf. cadre.yaml),
      et un programme allégé (sous-ensemble des unités). Durée : cadre.yaml retient 3h
      (research-consensus) — à confirmer. Non extraite ici. Nécessitera sa propre passe
      si l'app ouvre la filière PC. Voir README-svt.md source 2.

  claims_derives_les_plus_faibles:    # à attaquer en priorité (research-challenger)
    - "Frontière de profondeur exacte de chaque chapitre (jusqu'où va le bilan de la chaîne respiratoire ; niveau de détail du cycle de Krebs et de la contraction musculaire)."
    - "Statut exact de l'OBDUCTION dans le cadre (citée, profondeur incertaine — PDF scanné)."
    - "Statut exact du brassage INTRAchromosomique/gènes liés (présent au programme filière SVT ? à quelle profondeur ?) — impacte s'il faut une leçon dédiée."
    - "TOUTES les limites/exclusions (couche anti-hors-programme, entièrement derived)."
    - "Absence de répartition en % par domaine (non publiée) — à récupérer sur le cadre scanné."
