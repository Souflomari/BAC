            nom: "الحرية والحتمية — La liberté et le déterminisme"
            programme: ["Déterminismes (physiques, psychiques, sociaux) vs possibilité de la liberté."]
            savoir_faire: ["Discuter la compatibilité liberté / déterminisme."]   # source: derived
          - id: liberte_volonte
            nom: "حرية الإرادة — La liberté de la volonté"
            programme: ["Libre arbitre ; illusion de la liberté ; liberté comme conquête."]
            savoir_faire: ["Problématiser le libre arbitre (réel / illusoire)."]   # source: derived
          - id: liberte_loi
