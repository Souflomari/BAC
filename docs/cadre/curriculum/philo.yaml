          - id: bonheur_devoir_raison
            nom: "السعادة والواجب / العقل — Le bonheur, le devoir et la raison"
            programme: ["Rechercher le bonheur est-il un devoir ? bonheur et vertu/raison."]
            savoir_faire: ["Articuler quête du bonheur et exigence morale (pont vers le Devoir)."]   # source: derived
        limites:                                               # source: derived
          - "SI en scope : philosophie morale au niveau notionnel."

# ════════════════════════════════════════════════════════════════════════
# EXCLUSIONS — ce qui est HORS PÉRIMÈTRE des filières scientifiques
#   (couche `derived` — l'anti-off-syllabus ; à attaquer par le challenger)
# ════════════════════════════════════════════════════════════════════════
exclusions:
  - topic: "Module « العلوم الإنسانية » (Les sciences humaines)"
    raison: "Module réservé à la filière علوم إنسانية (humanités). ABSENT du programme des filières scientifiques. Nous n'avons — à juste titre — aucune leçon pour lui."
    source: research-consensus
  - topic: "Programme FRANÇAIS des 17 notions (art, langage, religion, inconscient, conscience, technique, nature, travail, temps…)"
    raison: "Confusion fréquente des synthèses grand-public. Le programme marocain est structuré en 4 mujazūʾāt, PAS en notions à la française. Ces notions ne sont pas au programme marocain des filières scientifiques (sauf recoupement thématique incident)."
    source: derived
  - topic: "Notions contestées comme notions AUTONOMES : التاريخ (l'histoire), العنف (la violence), السعادة (le bonheur)"
    raison: "Omises des arborescences de cours par filière scientifique (AlloSchool علوم فيزيائية, 9rayti). Signaux CONTRADICTOIRES (profsalmi cite l'histoire ; une قولة violence est tombée en 2023 علوم). NON tranché ici → marquées `statut_scope: flagge`, PAS supprimées. Décision au cadre officiel + humain."
    source: derived
  - topic: "Érudition doxographique / corpus d'auteurs fermé à la française"
    raison: "Le cadre marocain n'impose pas de liste d'auteurs 'au programme' à maîtriser ; l'épreuve (2h, coef 2) évalue la MÉTHODE (problématiser, conceptualiser, argumenter) et l'usage pertinent de positions, pas la couverture encyclopédique. Ne pas sur-charger en références."
    source: derived
  - topic: "Technicité disciplinaire (logique formelle, historiographie, science politique/juridique spécialisée)"
    raison: "Chaque notion est traitée au niveau PHILOSOPHIQUE/notionnel, pas au niveau technique de la discipline mobilisée."
    source: derived

