            savoir_faire: ["Discuter la définissabilité et l'universalité du bonheur."]   # source: derived
          - id: bonheur_plaisir
            nom: "السعادة واللذة — Le bonheur et le plaisir"
            programme: ["Bonheur / plaisir / désir ; hédonisme, eudémonisme."]
