        lesson_slug: la-liberte
        statut_scope: core                                     # source: research-consensus
        note_axe: "La leçon existante est étiquetée 'morale / politique' — la liberté est bien au module Morale, avec un pont légitime vers la Politique (liberté et loi)."   # source: derived
        competences_ciblees:
