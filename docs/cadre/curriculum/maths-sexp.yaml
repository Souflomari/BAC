# ════════════════════════════════════════════════════════════════════════
# Frontière curriculaire — Sciences Expérimentales (PC + SVT) · MATHÉMATIQUES
#
# Cadre source : « Cadre de référence de l'examen national du baccalauréat —
#   Mathématiques — Sciences Expérimentales » (MEN/CNEEO). Cadre 2015 en vigueur
#   pour la session 2026 (version « option français » 2025 : CDR_EXAM_NAT_BAC_25).
#   PDF officiel = image SCANNÉE sans couche texte → voir docs/cadre/sources/README-maths.md
#
# ════════════════════════════════════════════════════════════════════════
# STATUT : PROPOSITION — NON AUTORITATIVE.
#   Ne devient fiable qu'après les TROIS portes (RULES §5) :
#     1. relecture longue Gemini (couverture : aucun savoir-faire perdu/ajouté ;
#        réconciliation des poids) ;
#     2. research-challenger (attaque de la couche `derived` : limites/exclusions) ;
#     3. validation humaine (profondeur).
#   Révision 2026-09-27 (wave B1) : correction de la frontière FONCTION RÉCIPROQUE
#   (la dérivée de f⁻¹ était exclue à tort), puis RESSERRÉE le même jour par la passe
#   research-challenger (deux sur-portées retirées de ma couche `derived` — dont une
#   falsifiée par 2 des 4 copies que je citais en preuve). Détail, preuves et diff :
#   voir `coverage_notes.corrections`, DEUX entrées. Porte 2 passée ; restent la
#   relecture longue Gemini et la validation humaine. Toujours PROPOSITION.
#   Miroir obligatoire : docs/cadre/curriculum/maths-sm.yaml (même date).
# ════════════════════════════════════════════════════════════════════════
#
# ── Convention de provenance (spécifique maths ; PAS de `cadre p.N` ici) ──
#   research-consensus → corroboré par ≥2 sources indépendantes (synthèse
#                        pdfmath.com + cadre.yaml/bac-reference.md du dépôt +
#                        composition des examens nationaux). Structure, poids,
#                        habiletés, présence des chapitres.
#   derived            → reconstruit du programme marocain standard + expertise.
#                        NON vérifié verbatim. Granularité fine des savoir_faire,
#                        TOUTES les limites, TOUTES les exclusions. À VALIDER.
#   ⚠ Le PDF officiel est scanné/non-texte : impossible d'attribuer une page.
#     Aucune provenance `cadre p.N` n'est utilisée — ce serait fabriqué.
#
# ── Structure ──  domaines → sous_domaines → chapitres → {programme, savoir_faire, limites}
# ════════════════════════════════════════════════════════════════════════

filiere: sciences_experimentales      # concerne PC (Sciences Physiques) ET SVT — même cadre maths
matiere: mathematiques
series_concernees: [sciences_physiques, sciences_vie_terre]
cadre_annee: 2015
cadre_session: 2026
coefficient: 7                        # contested 7-vs-5 — voir cadre.yaml ; source: research-consensus
duree_epreuve_h: 3                    # source: research-consensus

habiletes_ratios_examen:              # source: research-consensus (cadre.yaml + pdfmath)
  application_directe: 50             # niveau 1 — application directe des connaissances
  application_non_explicite: 35       # niveau 2 — application dans un contexte familier
  synthese_situations_inhabituelles: 15   # niveau 3 — synthèse / situation nouvelle
  # NB : la répartition par cellule (sous-domaine × niveau) figure au Tableau de
  #      spécification du cadre — non lisible (PDF scanné). Non reproduite ici.

domaines:

  # ══════════════════════════════════════════════════════════════════════
  - id: analyse
    nom: "Analyse"
    poids: { part_examen: 55 }        # source: research-consensus (pdfmath + cadre.yaml)
    sous_domaines:

      # ──────────────────────────────────────────────────────────────────
      - id: suites_numeriques
        nom: "Suites numériques"
        poids: { part_domaine: "Analyse", note: "répartition interne Analyse non publiée à cette granularité" }   # source: derived
        competences_ciblees:          # source: research-consensus (pdfmath : 5 capacités)
          - "Étudier une suite (monotonie, majoration/minoration), reconnaître et exploiter les suites arithmétiques et géométriques, et déterminer la limite d'une suite (comparaison, suite du type u_{n+1}=f(u_n))."
        chapitres:

          - id: suites_generalites_limites
            nom: "Suites numériques : monotonie, convergence, limites"
            lesson_slug: suites-numeriques
            programme:                # source: research-consensus (pdfmath)
              - "Raisonnement par récurrence ; suites majorées/minorées/bornées ; monotonie."
              - "Suites arithmétiques et géométriques (terme général, somme des termes)."
              - "Limite d'une suite ; opérations sur les limites ; théorèmes de comparaison et théorème des gendarmes."
              - "Théorème de la limite monotone (suite croissante majorée / décroissante minorée) ; suites u_{n+1}=f(u_n) : détermination de la limite éventuelle."
            savoir_faire:             # source: derived (programme standard, granularité reconstruite)
              - "Démontrer une propriété par récurrence."
              - "Reconnaître et exploiter une suite arithmétique/géométrique ; calculer une somme de termes consécutifs."
              - "Étudier la monotonie et le caractère borné d'une suite."
              - "Déterminer la limite d'une suite par opérations et par comparaison (gendarmes)."
              - "Utiliser le théorème de la limite monotone pour justifier la convergence, puis (pour u_{n+1}=f(u_n)) déterminer la limite par continuité de f (résolution de ℓ=f(ℓ))."
            limites:                  # source: derived
              - "Suites adjacentes : hors du cœur SExp (relèvent plutôt du programme SM). Convergence justifiée par limite monotone, pas par le critère de Cauchy."
              - "Pas de vitesse/ordre de convergence, pas de séries."

      # ──────────────────────────────────────────────────────────────────
      - id: continuite_derivation_fonctions
        nom: "Continuité, dérivation et étude de fonctions (y compris log, exp, équations différentielles)"
        poids: { part_domaine: "Analyse", note: "sous-domaine le plus lourd de l'Analyse (24 capacités, pdfmath)" }   # source: research-consensus
        competences_ciblees:          # source: research-consensus (pdfmath : ~24 capacités)
          - "Étudier une fonction numérique (limites, continuité, dérivabilité, variations, courbe), maîtriser les fonctions logarithme et exponentielle, et résoudre des équations différentielles simples issues notamment de la physique."
        chapitres:

          - id: limites_continuite
            nom: "Limites et continuité"
            lesson_slug: limites-continuite
            programme:                # source: research-consensus (pdfmath)
              - "Limite d'une fonction en un point / à l'infini ; opérations sur les limites ; formes indéterminées."
              - "Continuité en un point et sur un intervalle ; théorème des valeurs intermédiaires ; méthode de dichotomie."
              - "Image d'un intervalle / d'un segment par une fonction continue."
            savoir_faire:             # source: derived
              - "Calculer une limite ; lever une forme indéterminée par factorisation, quantité conjuguée, ou terme dominant."
              - "Étudier la continuité d'une fonction ; appliquer le TVI pour justifier l'existence d'une solution de f(x)=k."
              - "Encadrer/localiser une solution par dichotomie."
            limites:                  # source: derived
              # ⚠ CORRECTION PROPOSÉE 2026-09-27 (wave B1) — voir coverage_notes.corrections.
              #   La rédaction précédente bornait la réciproque à « existence et sens de
              #   variation de f⁻¹ » et affirmait que « le cadre SExp n'en fait pas un objet
              #   aussi approfondi qu'en SM ». C'était FAUX : la capacité 1.2.11 du cadre SExp
              #   demande explicitement la DÉRIVÉE de la réciproque, et quatre problèmes
              #   nationaux SExp vérifiés la posent. Ligne remplacée ci-dessous.
              - "Répartition entre nos chapitres : CE chapitre porte l'EXISTENCE de f⁻¹ (continuité + stricte monotonie ⇒ bijection sur l'intervalle image, corollaire du TVI) et la détermination de l'intervalle image J. La DÉRIVÉE et la COURBE de f⁻¹ relèvent du chapitre derivabilite_etude_fonctions — et sont AU PROGRAMME SExp (capacité 1.2.11). Ce n'est PAS une exclusion."   # source: derived (découpage entre nos deux chapitres) ; ordre des capacités 1.2.1→1.2.11 (bloc dérivation) : research-consensus (pdfmath)
              - "Limites de fonctions trigonométriques (lim (sin x)/x) : présentes au programme mais peu mobilisées à l'examen SExp — à confirmer (voir coverage_notes)."

          - id: derivabilite_etude_fonctions
            nom: "Dérivabilité et étude de fonctions"
            lesson_slug: derivabilite-etude-fonctions
            programme:                # source: research-consensus (pdfmath)
              - "Nombre dérivé, tangente ; dérivées des fonctions usuelles ; dérivée d'une somme, produit, quotient, composée."
              - "Signe de la dérivée et variations ; extremums ; concavité, dérivée seconde, points d'inflexion."
              - "Branches infinies (asymptotes, directions asymptotiques) ; étude complète et tracé de courbe."
              # AJOUT PROPOSÉ 2026-09-27 (wave B1) — capacité qui manquait entièrement à ce
              # chapitre. Libellé du cadre, reproduit verbatim par la synthèse pdfmath
              # (capacité 1.2.11, sous-domaine 1.2) : « Déterminer la dérivée et la monotonie
              # de la fonction réciproque d'une fonction continue et strictement monotone, et
              # la représenter graphiquement. » Corroboré par la composition des examens
              # nationaux SExp (4 problèmes vérifiés — voir coverage_notes.corrections).
              - "Fonction réciproque d'une fonction continue et strictement monotone : dérivée de f⁻¹ en un point, monotonie de f⁻¹, et représentation graphique de f⁻¹."   # source: research-consensus (capacité 1.2.11, pdfmath + composition des examens nationaux SExp 2020/2021/2022/2024)
            savoir_faire:             # source: derived — sauf les trois derniers, dont les VERBES viennent de la capacité 1.2.11 (research-consensus) ; seule la formulation fine est derived
              - "Calculer une fonction dérivée ; déterminer une équation de tangente."
              - "Dresser un tableau de variations ; déterminer extremums et points d'inflexion."
              - "Étudier les branches infinies et tracer la courbe représentative."
              - "Montrer qu'une fonction continue et strictement monotone sur un intervalle I admet une fonction réciproque f⁻¹, et déterminer l'intervalle J = f(I) sur lequel elle est définie."
              - "Calculer (f⁻¹)'(b) = 1/f'(a) où a = f⁻¹(b) — après avoir identifié l'antécédent a et vérifié f'(a) ≠ 0 ; en déduire le sens de variation de f⁻¹ (le même que celui de f)."
              - "Construire la courbe de f⁻¹ dans le même repère, par symétrie par rapport à la droite (Δ) : y = x."
            limites:                  # source: derived — frontière de profondeur SExp vs SM
              - "PAS de théorème de Rolle ni de théorème/inégalité des accroissements finis (spécifiques SM) — voir coverage_notes."
              - "Dérivabilité traitée via les règles de calcul ; pas de démonstration à partir de la définition au-delà des cas usuels."
              # ⚠ RÉVISION 2026-09-27 (passe research-challenger) — DEUX sur-portées retirées
              #   de la limite ci-dessous. Voir coverage_notes.corrections, entrée « challenger ».
              #   (a) « la réciproque porte toujours sur une RESTRICTION d'une fonction déjà
              #       étudiée » était FAUX, et falsifié par 2 des 4 copies que cette frontière
              #       cite elle-même : bk-2022-n-x3 q7a et bk-2020-n-x4 q8a inversent f
              #       ELLE-MÊME, bijective de ℝ sur ℝ, sans aucune restriction
              #       (content/maths/fonction-exponentielle/bank.yaml:1127 et :1430). Seuls
              #       2021 et 2024 passent par une restriction g. Clause reformulée.
              #   (b) « la dérivée est demandée EN UN POINT, pas comme fonction sur J » ne
              #       repose sur AUCUN libellé du cadre — seulement sur n=3 (les 3 copies
              #       des 4 qui demandent la dérivée). Sortie des
              #       `limites` (où elle pouvait faire exclure un item légitime) et redescendue
              #       en `_observation_examens` ci-dessous, sans valeur de frontière.
              - "Fonction réciproque en SExp — profondeur exacte : le théorème (bijection ⇒ réciproque ; (f⁻¹)' = 1/(f'∘f⁻¹)) est ADMIS et APPLIQUÉ, jamais démontré ; l'EXPRESSION de f⁻¹(x) n'est pas demandée (un énoncé le dit mot pour mot : « Il n'est pas demandé de déterminer g⁻¹(x) », 2024 N II-5a) ; et la réciproque porte toujours sur une fonction (GLOBALE ou RESTREINTE) déjà étudiée dans le problème, jamais introduite ex nihilo."   # source: derived (profondeur reconstruite à partir des 4 problèmes nationaux SExp vérifiés ; resserrée par la passe research-challenger du 2026-09-27)
              - "Ce qui reste SM et n'entre PAS avec la réciproque en SExp : fonction racine n-ième x ↦ ⁿ√x et fonctions puissances x^r comme réciproques nommées ; réciproques des fonctions trigonométriques (arctan, arcsin)."   # source: derived — À VALIDER (décision owner ; maintenue telle quelle par la passe challenger)
            _observation_examens:       # NI programme NI limite — motif OBSERVÉ, sans valeur de frontière. Ne jamais s'en servir pour exclure un item.
              - "À ce jour, les 3 copies SExp vérifiées qui demandent la dérivée de la réciproque la demandent EN UN POINT — (f⁻¹)'(2−ln3) en 2020, (f⁻¹)'(ln 4) en 2022, (g⁻¹)'(1) en 2024 — et aucune ne demande f⁻¹' comme FONCTION sur J. C'est un motif observé sur n=3, adossé à AUCUN libellé du cadre : la capacité 1.2.11 dit « Déterminer la dérivée … », sans restreindre à un point. NON EXTRAPOLABLE en exclusion — un item qui dériverait f⁻¹ sur J n'est pas hors-programme sur cette base."   # source: derived (observation de corpus) — retiré des `limites` par la passe research-challenger du 2026-09-27

          - id: fonction_logarithme
            nom: "Fonction logarithme"
            lesson_slug: fonction-logarithme
            programme:                # source: research-consensus (pdfmath : « logarithmes — algèbre, équations, limites »)
              - "Fonction logarithme népérien ln : définition, propriétés algébriques (ln(ab), ln(a/b), ln(aⁿ)), signe, monotonie."
              - "Dérivée de ln et de ln(u) ; limites de référence ; étude et courbe ; le nombre e."
              - "Logarithme décimal log ; équations et inéquations logarithmiques."
            savoir_faire:             # source: derived
              - "Utiliser les propriétés algébriques de ln pour simplifier/transformer une expression."
              - "Dériver et étudier une fonction contenant ln(u) ; exploiter les limites de référence (lim ln x/x, lim x ln x)."
              - "Résoudre équations et inéquations avec ln et log."
            limites:                  # source: derived
              - "Fonction logarithme de base a : mention possible ; le cœur SExp est ln (+ log décimal). Fonctions puissances x^α : hors cœur SExp (plutôt SM)."

          - id: fonction_exponentielle
            nom: "Fonction exponentielle"
            lesson_slug: fonction-exponentielle
            programme:                # source: research-consensus (pdfmath : « exponentielles — équations, inégalités, limites »)
              - "Fonction exponentielle exp comme réciproque de ln ; propriétés algébriques (e^{a+b}, e^{-a}, (e^a)ⁿ)."
              - "Dérivée de exp et de e^u ; limites de référence et croissances comparées ; étude et courbe."
              - "Primitives faisant intervenir exp ; équations et inéquations exponentielles."
            savoir_faire:             # source: derived
              - "Manipuler les propriétés algébriques de exp ; dériver e^u."
              - "Exploiter les croissances comparées (lim e^x/x, lim x e^x)."
              - "Résoudre équations et inéquations avec exp ; reconnaître une primitive de u'·e^u."
            limites:                  # source: derived
              - "Exponentielle de base a (a^x) : mention ; cœur SExp = e^x. Pas d'étude systématique des fonctions puissances."

          - id: equations_differentielles
            nom: "Équations différentielles"
            lesson_slug: equations-differentielles
            programme:                # source: research-consensus (pdfmath : « équations différentielles »)
              - "Équation y' = a·y ; équation y' = a·y + b : ensemble des solutions, solution vérifiant une condition initiale."
              - "Équation de l'oscillateur y'' + ω²·y = 0 : forme des solutions, condition initiale (lien avec la physique : RC, RL, oscillateur)."
            savoir_faire:             # source: derived
              - "Résoudre y'=ay et y'=ay+b ; déterminer la solution vérifiant une condition initiale."
              - "Donner la forme générale des solutions de y''+ω²y=0 et fixer les constantes par les conditions initiales."
              - "Reconnaître, dans un contexte physique (charge/décharge, oscillateur), l'équation différentielle correspondante."
            limites:                  # source: derived — frontière de profondeur importante
              - "Uniquement : y'=ay+b (1er ordre, coefficients constants) et y''+ω²y=0 (2e ordre SANS terme du 1er ordre). PAS de y''+ay'+by=0 générale (avec amortissement), qui relève du programme SM. PAS de second membre non constant, pas de variation de la constante."
            _flag_derive_fort: "Le périmètre exact du 2e ordre en SExp (présence/forme de y''+ω²y=0) est dérivé ; la synthèse pdfmath mentionne « 1er et 2e ordre » sans détailler → à confirmer."

      # ──────────────────────────────────────────────────────────────────
      - id: calcul_integral
        nom: "Calcul intégral"
        poids: { part_domaine: "Analyse", note: "≈ 4 capacités (pdfmath)" }   # source: research-consensus
        competences_ciblees:          # source: research-consensus (pdfmath)
          - "Calculer des intégrales (primitives, propriétés, intégration par parties) et les utiliser pour des calculs d'aires et de volumes de révolution."
        chapitres:

          - id: integrale_primitives
            nom: "Intégrale, primitives et intégration par parties"
            lesson_slug: calcul-integral
            programme:                # source: research-consensus (pdfmath)
              - "Notion de primitive ; intégrale d'une fonction continue ; lien primitive ↔ intégrale."
              - "Linéarité, relation de Chasles, positivité et comparaison ; inégalité de la moyenne ; valeur moyenne."
              - "Intégration par parties ; calcul d'aires (sous une courbe, entre deux courbes) ; volume d'un solide de révolution."
            savoir_faire:             # source: derived
              - "Déterminer une primitive (fonctions usuelles, formes u'·uⁿ, u'/u, u'·e^u)."
              - "Calculer une intégrale à l'aide d'une primitive ; utiliser linéarité et Chasles."
              - "Appliquer l'intégration par parties ; calculer une aire et un volume de révolution."
            limites:                  # source: derived
              - "SExp : pas de SOMMES DE RIEMANN comme construction (définition/approximation par sommes) — spécifique SM (voir coverage_notes). L'intégrale est introduite via la primitive."
              - "Intégration par parties : une seule fois (éventuellement itérée sur des cas simples) ; pas de changement de variable formel."

  # ══════════════════════════════════════════════════════════════════════
  - id: algebre_geometrie
    nom: "Algèbre et géométrie"
    poids: { part_examen: 45 }        # source: research-consensus (pdfmath + cadre.yaml)
    sous_domaines:

      # ──────────────────────────────────────────────────────────────────
      - id: geometrie_espace
        nom: "Géométrie dans l'espace (produit scalaire, droites, plans, sphère)"
        poids: { part_examen: 15 }    # source: research-consensus (pdfmath « géométrie 15 % » + cadre.yaml « produit scalaire/vectoriel 15 »)
        competences_ciblees:          # source: research-consensus (pdfmath)
          - "Utiliser le produit scalaire dans l'espace et la géométrie analytique (droites, plans, sphère) pour résoudre des problèmes de configuration, d'intersection et de distance."
        chapitres:

          - id: produit_scalaire_espace
            nom: "Produit scalaire dans l'espace et géométrie analytique"
            lesson_slug: geometrie-espace
            programme:                # source: research-consensus (pdfmath)
              - "Repère orthonormé de l'espace : coordonnées, distance, milieu."
              - "Produit scalaire dans l'espace : expression analytique, orthogonalité, norme, angles."
              - "Équation cartésienne d'un plan (vecteur normal) ; représentation paramétrique d'une droite ; positions relatives droites/plans."
              - "Distance d'un point à un plan ; sphère (équation cartésienne, intersection sphère/plan)."
            savoir_faire:             # source: derived
              - "Calculer un produit scalaire dans l'espace ; caractériser l'orthogonalité ; déterminer un angle."
              - "Déterminer l'équation cartésienne d'un plan à partir d'un point et d'un vecteur normal."
              - "Étudier les positions relatives de droites et de plans ; calculer une distance point-plan."
              - "Déterminer l'équation d'une sphère ; étudier l'intersection d'une sphère et d'un plan (cercle : centre, rayon)."
            limites:                  # source: derived
              - "Géométrie ANALYTIQUE dans un repère orthonormé ; pas de géométrie vectorielle abstraite (espaces vectoriels — spécifique SM)."

          - id: produit_vectoriel_sexp
            nom: "Produit vectoriel (statut à confirmer en SExp)"
            lesson_slug: geometrie-espace
            programme:                # source: derived — placement CONTESTÉ (voir coverage_notes)
              - "Produit vectoriel de deux vecteurs de l'espace : direction, norme (aire), applications (équation d'un plan par trois points, distance point-droite)."
            savoir_faire:             # source: derived
              - "Calculer un produit vectoriel ; l'utiliser pour une aire, une normale, ou l'équation d'un plan défini par trois points."
            limites:                  # source: derived — FLAG FORT
              - "⚠ Le produit vectoriel figure comme « produit scalaire/vectoriel 15 » dans cadre.yaml, mais la synthèse pdfmath ne l'isole pas nettement pour SExp. Son statut d'objet TESTÉ (vs simple outil) est incertain. À trancher par l'humain / la relecture Gemini du cadre scanné."
              - "PRODUIT MIXTE / déterminant 3×3 / volume : présent dans la leçon geometrie-espace (R4) mais très probablement HORS cadre SExp (relève du programme SM). Exclu ici par prudence."

      # ──────────────────────────────────────────────────────────────────
      - id: nombres_complexes
        nom: "Nombres complexes"
        poids: { part_examen: 15, note: "≈ moitié du bloc « Complexes + Probabilités = 30 % »" }   # source: derived (répartition du 30 % ; total 30 % = research-consensus)
        competences_ciblees:          # source: research-consensus (pdfmath)
          - "Maîtriser les formes d'un nombre complexe, résoudre des équations dans ℂ, et exploiter l'interprétation géométrique (module, argument, transformations)."
        chapitres:

          - id: complexes_formes_operations
            nom: "Formes algébrique, trigonométrique et exponentielle ; opérations"
            lesson_slug: nombres-complexes-1
            programme:                # source: research-consensus (pdfmath)
              - "Forme algébrique ; parties réelle/imaginaire ; conjugué ; opérations (somme, produit, quotient)."
              - "Module et argument ; forme trigonométrique et forme exponentielle ; propriétés (module/argument d'un produit, d'un quotient)."
            savoir_faire:             # source: derived
              - "Effectuer les opérations dans ℂ ; utiliser le conjugué pour diviser."
              - "Calculer module et argument ; passer d'une forme à l'autre ; exploiter les règles sur produit/quotient."
            limites:                  # source: derived
              - "Formule de Moivre : usage de base (linéarisation simple, puissances). Pas de développement approfondi comme en SM."

          - id: complexes_equations_geometrie
            nom: "Équations dans ℂ et interprétation géométrique"
            lesson_slug: nombres-complexes-2   # SExp n'utilise qu'une PARTIE de cette leçon (voir limites)
            programme:                # source: research-consensus (pdfmath)
              - "Résolution des équations du second degré à coefficients réels dans ℂ (discriminant négatif)."
              - "Interprétation géométrique : affixe, module |z−z'| (distance), argument (angle) ; transformations (translation, homothétie, rotation) via z' = az + b."
              - "Nature d'une configuration (triangle, alignement) à partir des affixes."
            savoir_faire:             # source: derived
              - "Résoudre az²+bz+c=0 (a,b,c réels) dans ℂ."
              - "Interpréter |z−z'| et arg((z−a)/(z−b)) géométriquement ; caractériser une transformation z'=az+b."
              - "Déterminer la nature d'un triangle, un alignement, à partir d'affixes."
            limites:                  # source: derived — frontière SExp vs SM sur les complexes
              - "RACINES n-ièmes générales (racines n-ièmes de l'unité, résolution de zⁿ=a) : HORS cœur SExp — spécifique SM. La leçon nombres-complexes-2 (R4 racines n-ièmes) n'est donc que PARTIELLEMENT dans le périmètre SExp."
              - "Similitudes/compositions de transformations approfondies : plutôt SM. SExp reste à translation/homothétie/rotation via z'=az+b."

      # ──────────────────────────────────────────────────────────────────
      - id: denombrement_probabilites
        nom: "Dénombrement et calcul des probabilités"
        poids: { part_examen: 15, note: "≈ moitié du bloc « Complexes + Probabilités = 30 % »" }   # source: derived (répartition du 30 %)
        competences_ciblees:          # source: research-consensus (pdfmath)
          - "Dénombrer des situations et calculer des probabilités (conditionnelles, indépendance) ; exploiter la variable aléatoire et la loi binomiale."
        chapitres:

          - id: denombrement
            nom: "Dénombrement"
            lesson_slug: denombrement
            programme:                # source: research-consensus (pdfmath « combinatoire »)
              - "Principe multiplicatif ; p-listes (tirages avec remise) ; arrangements ; permutations ; combinaisons."
              - "Propriétés des combinaisons (symétrie, triangle de Pascal)."
            savoir_faire:             # source: derived
              - "Choisir le modèle de dénombrement adapté (avec/sans remise, ordonné/non ordonné)."
              - "Calculer des arrangements, permutations, combinaisons ; utiliser le triangle de Pascal."
            limites:                  # source: derived
              - "Dénombrement au service des probabilités (équiprobabilité) ; pas de combinatoire avancée (formule du binôme comme objet d'étude poussé)."

          - id: probabilites
            nom: "Calcul des probabilités, variable aléatoire, loi binomiale"
            lesson_slug: probabilites-conditionnelles   # ne couvre PAS variable aléatoire / loi binomiale → voir coverage_notes
            programme:                # source: research-consensus (pdfmath « conditional probability, independence, binomial »)
              - "Vocabulaire des probabilités ; équiprobabilité ; probabilité conditionnelle ; arbre pondéré ; formule des probabilités totales."
              - "Événements indépendants ; incompatibilité."
              - "Variable aléatoire : loi de probabilité, espérance, variance, écart-type."
              - "Épreuve de Bernoulli ; loi binomiale."
            savoir_faire:             # source: derived
              - "Calculer une probabilité par équiprobabilité et par dénombrement."
              - "Utiliser un arbre pondéré, la règle du produit, la formule des probabilités totales."
              - "Reconnaître l'indépendance ; distinguer indépendance et incompatibilité."
              - "Déterminer la loi d'une variable aléatoire, son espérance ; reconnaître et exploiter une loi binomiale."
            limites:                  # source: derived
              - "Loi binomiale traitée directement (schéma de Bernoulli, C(n,k)p^k q^{n-k}) ; pas de loi continue, pas d'approximation gaussienne."
              - "Pas de formule de Bayes présentée comme telle (le « retour de l'arbre » suffit) ; pas de chaînes de Markov."

# ════════════════════════════════════════════════════════════════════════
# EXCLUSIONS TRANSVERSALES (frontière anti-hors-programme SExp) — source: derived
# ════════════════════════════════════════════════════════════════════════
exclusions_transversales:             # source: derived — À VALIDER (couche anti-hors-programme)
  - { topic: "Arithmétique dans ℤ (divisibilité, congruences, Bézout, Gauss, équations diophantiennes)", raison: "SPÉCIFIQUE SM. Absent du cadre SExp." }
  - { topic: "Structures algébriques (lois de composition, groupes, anneaux, corps, espaces vectoriels)", raison: "SPÉCIFIQUE SM. Absent du cadre SExp." }
  - { topic: "Théorème de Rolle, théorème/inégalité des accroissements finis", raison: "SPÉCIFIQUE SM. La dérivabilité SExp reste calculatoire." }
  - { topic: "Sommes de Riemann (construction de l'intégrale par sommes)", raison: "SPÉCIFIQUE SM. L'intégrale SExp part de la primitive." }
  - { topic: "Racines n-ièmes générales / résolution de zⁿ=a dans ℂ", raison: "SPÉCIFIQUE SM. SExp : second degré à coefficients réels seulement." }
  - { topic: "Produit mixte / déterminant 3×3 / volumes par déterminant", raison: "Probablement SM ; exclu de SExp par prudence (à confirmer)." }
  - { topic: "Équation différentielle y''+ay'+by=0 générale (avec amortissement)", raison: "SExp limité à y'=ay+b et y''+ω²y=0 ; le cas amorti relève de SM." }
  - { topic: "Lois de probabilité continues, statistique inférentielle", raison: "Hors programme 2e Bac SExp." }

# ════════════════════════════════════════════════════════════════════════
# COVERAGE_NOTES — mapping cadre ↔ nos 14 leçons content/maths/ (source: derived)
# ════════════════════════════════════════════════════════════════════════
coverage_notes:
  intro: >
    Les 14 leçons content/maths/ forment un arbre-UNION orienté SM (elles incluent
    arithmétique, structures algébriques, produit vectoriel/mixte — tous SM). Pour
    SExp, une partie de cet arbre est HORS périmètre, et certains chapitres du
    cadre SExp n'ont pas de leçon dédiée (lacunes ci-dessous).

  lecons_hors_perimetre_sexp:         # leçons existantes NON testées en SExp
    - slug: arithmetique
      raison: "Domaine SM uniquement — pas au cadre SExp."
    - slug: structures-algebriques
      raison: "Domaine SM uniquement — pas au cadre SExp."

  lecons_partiellement_utilisees_sexp:
    - slug: nombres-complexes-2
      raison: "R4 (racines n-ièmes) et configurations avancées relèvent de SM ; SExp n'utilise que formes trigo/exp, second degré réel, transformations z'=az+b."
    - slug: geometrie-espace
      raison: "Produit scalaire + droites/plans/sphère = cœur SExp (15 %). Produit vectoriel = statut incertain. Produit mixte (R4) = hors SExp."

  chapitres_cadre_sans_lecon:         # lacunes de couverture (lesson_slug: null)
    - chapitre: "Variable aléatoire, loi de probabilité, espérance, LOI BINOMIALE"
      lesson_slug: null
      note: "La leçon probabilites-conditionnelles couvre conditionnel/indépendance/probabilités totales mais PAS la variable aléatoire ni la loi binomiale, qui sont pourtant au cadre SExp. LACUNE PRIORITAIRE."
    - chapitre: "Fonctions primitives (chapitre systématique : primitives des fonctions usuelles, formes u'/u, u'uⁿ, u'e^u)"
      lesson_slug: null
      note: "Les primitives sont dispersées (calcul-integral R1, fonction-exponentielle R6) sans chapitre systématique. Lacune modérée."
    - chapitre: "Limites de fonctions trigonométriques (lim (sin x)/x, etc.)"
      lesson_slug: null
      note: "Non couvertes explicitement dans limites-continuite. À vérifier si mobilisées à l'examen SExp."

  divergences_majeures_sexp:
    - "SExp N'A PAS d'arithmétique ni de structures algébriques (2 leçons entières hors périmètre)."
    - "SExp complexes = plus léger que SM (pas de racines n-ièmes générales)."
    - "SExp A la géométrie de l'espace (15 %) — contrairement à SM où elle n'est pas testée au national."
    - "Lacune loi binomiale : au cadre SExp mais sans leçon dédiée."
    - "La FONCTION RÉCIPROQUE n'est PAS une spécificité SM : elle est une capacité explicite du cadre SExp (1.2.11), dérivée comprise. Le cadre SM la nomme de son côté en trois capacités (1.2.6, 1.2.7, 1.3.7) : la capacité est COMMUNE, l'écart est de profondeur. ✔ docs/cadre/curriculum/maths-sm.yaml a été corrigé en conséquence le 2026-09-27 (sa ligne de divergences disait « SM analyse ajoute … fonction réciproque »), même wave, même statut PROPOSITION — voir son `coverage_notes.corrections`. Ce qui reste SM-seul : racine n-ième, puissances réelles (1.3.15), réciproques trigonométriques (arctan)."

  corrections:                        # défauts trouvés APRÈS la rédaction initiale, et ce qui a été changé
    - date: 2026-09-27
      origine: "wave B1 — critique de fidélité bac (contradiction cadre ↔ banque d'annales vérifiées)"
      defaut: >-
        Le chapitre limites_continuite bornait la fonction réciproque à « existence et
        sens de variation de f⁻¹ », en ajoutant que « le cadre SExp n'en fait pas un objet
        aussi approfondi qu'en SM » — ce qui EXCLUAIT de fait la DÉRIVÉE de f⁻¹. Et le
        chapitre derivabilite_etude_fonctions ne mentionnait la réciproque NULLE PART
        (ni programme, ni savoir_faire). La frontière était donc à la fois trop étroite
        et mal placée, et aurait mis hors-programme des questions réellement posées.
      preuve_cadre: >-
        Capacité 1.2.11 du cadre SExp (sous-domaine 1.2 « Continuité, dérivation et étude
        de fonctions »), reproduite verbatim par la synthèse pdfmath.com/cours/bac-2026-pc-svt/
        (= source 4 de docs/cadre/sources/README-maths.md, déjà admise comme jambe
        research-consensus pour ce fichier) : « Déterminer la dérivée et la monotonie de la
        fonction réciproque d'une fonction continue et strictement monotone, et la représenter
        graphiquement. » La page se déclare reproduire le « Cadre de référence de l'examen
        national du baccalauréat — option français — Mathématiques, Sciences Expérimentales,
        CNEEO 2025, applicable session BAC 2026 ». Le PDF officiel reste une image scannée
        sans couche texte (re-vérifié ce jour) → aucune provenance `cadre p.N` possible.
      preuve_examens: >-
        Composition des examens nationaux SExp (jambe de triangulation C du README) — les
        QUATRE problèmes SExp vérifiés du corpus portent une partie « fonction réciproque »,
        et TROIS demandent explicitement la dérivée :
        2020 N q8a/8b/8c — existence, courbe symétrique, (f⁻¹)'(2−ln3) [0,5 pt] :
        content/maths/fonction-exponentielle/bank.yaml:1428-1461 (bk-2020-n-x4) ;
        2022 N q7a/7b — existence, (f⁻¹)'(ln 4) [0,25 pt] :
        content/maths/fonction-exponentielle/bank.yaml:1125-1143 (bk-2022-n-x3) ;
        2024 N Partie II q5a/5b — existence + J, « Vérifier que g⁻¹ est dérivable en 1 et
        calculer (g⁻¹)'(1) » [0,75 pt] :
        content/maths/fonction-logarithme/bank.yaml:1308-1334 (bk-2024-n-x4) ;
        2021 N q7 — existence + J [0,5 pt] et construction de la courbe de g⁻¹ [0,75 pt] :
        content/maths/fonction-logarithme/bank.yaml:1025-1044 (bk-2021-n-x4).
        Les trois verbes de la capacité 1.2.11 (dériver, monotonie, représenter) sont donc
        chacun attestés sur copie.
      correctif: >-
        (1) limites_continuite.limites : ligne fautive remplacée par une ligne de RÉPARTITION
        (existence + J ici ; dérivée + courbe au chapitre dérivabilité) disant explicitement
        que ce n'est pas une exclusion. (2) derivabilite_etude_fonctions : ajout d'une ligne
        `programme` (capacité 1.2.11), de trois `savoir_faire`, et de deux `limites` de
        profondeur. (3) Aucune `exclusions_transversales` touchée — la réciproque n'y figurait
        pas, et ne doit pas y figurer.
      miroir: "docs/cadre/curriculum/maths-sm.yaml — coverage_notes.corrections, entrée du 2026-09-27 (correction jumelle : la réciproque y était donnée pour une spécificité SM). Toute révision future de la frontière « fonction réciproque » doit modifier les DEUX fichiers dans le même geste, sinon ils redivergent."
      statut: "PROPOSITION — porte 2 (research-challenger) PASSÉE le 2026-09-27, avec deux sur-portées retirées (voir l'entrée suivante). Restent la relecture longue Gemini (couverture : la capacité 1.2.11 est-elle bien à cette place ? aucune autre capacité 1.2.x ne manque-t-elle ?) et la validation humaine (profondeur)."

    - date: 2026-09-27
      origine: "passe research-challenger sur la couche `derived` de la correction ci-dessus (porte 2 des trois portes, RULES §5). Deux sur-portées trouvées dans mes propres `limites` — les deux du même type : une généralisation faite sur n=4 et présentée comme une frontière."
      defaut_1_surportee_restriction: >-
        La limite écrite le matin affirmait que « la réciproque porte toujours sur une
        RESTRICTION d'une fonction déjà étudiée dans le problème ». C'est FAUX, et falsifié par
        DEUX des quatre copies que la correction cite elle-même comme preuve : bk-2022-n-x3
        q7a et bk-2020-n-x4 q8a demandent tous deux « Montrer que la fonction f admet une
        fonction réciproque f⁻¹ définie sur ℝ » — f ELLE-MÊME, bijective de ℝ sur ℝ, sans
        aucune restriction (content/maths/fonction-exponentielle/bank.yaml:1127 et :1430).
        Seuls 2021 (g = restriction de f à [1,+∞[) et 2024 (g = restriction à ]-∞,1]) passent
        par une restriction. Leçon à retenir pour les prochaines frontières : j'avais lu la
        moitié du corpus qui confirmait la clause et cité l'autre moitié comme preuve sans la
        relire CONTRE la clause.
      correctif_1: >-
        Clause reformulée en « toujours une fonction (GLOBALE ou RESTREINTE) déjà étudiée dans
        le problème, jamais introduite ex nihilo » — ce qui reste vrai des 4 copies, et qui dit
        la seule chose utile à un auteur d'items : on n'invente pas une fonction pour la
        partie réciproque, on réutilise celle du problème.
      defaut_2_surportee_en_un_point: >-
        La même limite affirmait que « la dérivée est demandée EN UN POINT, pas comme fonction
        f⁻¹' sur J ». Le motif est réel (3/3 des copies qui demandent la dérivée la demandent
        en un point) mais il ne repose sur AUCUN libellé du cadre : la capacité 1.2.11 dit
        « Déterminer la dérivée … » sans restreindre à un point. Laissée dans `limites`, elle
        aurait pu faire déclarer hors-programme un item légitime — c'est-à-dire produire
        exactement le défaut que cette frontière venait de corriger, dans l'autre sens.
      correctif_2: >-
        Sortie des `limites` et redescendue dans une nouvelle clé de chapitre
        `_observation_examens` (même convention que `_flag_derive_fort` du chapitre
        equations_differentielles), qui porte en toutes lettres « motif observé sur n=3,
        NON EXTRAPOLABLE en exclusion ». Une observation de corpus n'est pas une frontière.
      non_modifie: >-
        La limite « racine n-ième / puissances x^r / réciproques trigonométriques restent SM »
        est MAINTENUE telle quelle, toujours marquée « À VALIDER » : c'est une décision owner,
        pas un constat que la passe challenger pouvait trancher. (Côté SM, 1.3.15 « Maîtriser
        le calcul sur les puissances réelles » et arctan attestée sur copie SM la soutiennent —
        voir maths-sm.yaml, chapitre derivabilite_rolle_taf.)
      statut: "PROPOSITION. Porte 2 passée. Restent la relecture longue Gemini et la validation humaine."

  claims_derives_les_plus_faibles:    # à attaquer en priorité (research-challenger)
    - "Statut du PRODUIT VECTORIEL en SExp (objet testé ? outil ? absent ?) — chapitre produit_vectoriel_sexp."
    - "Périmètre exact du 2e ordre en équations différentielles SExp (y''+ω²y=0 ?)."
    - "Sous-répartition Complexes 15 % / Probabilités 15 % (le bloc 30 % est sourcé, le partage interne est dérivé)."
    - "Exclusion du produit mixte de SExp (prudence, non confirmée)."
    - "AJOUT 2026-09-27, resserré le même jour par la passe research-challenger : de la couche `derived` de la fonction réciproque, il ne reste comme `limites` que (a) le théorème admis-et-appliqué + l'expression de f⁻¹(x) non demandée + la fonction déjà étudiée dans le problème, et (b) « racine n-ième / puissances x^r / arctan restent SM » — cette dernière toujours « À VALIDER » (décision owner). Les deux clauses retirées (« toujours une restriction » — falsifiée par 2 des 4 copies citées ; « dérivée en un point et non sur J » — n=3 sans libellé de cadre) ne sont plus des frontières : la première est reformulée, la seconde vit en `_observation_examens`. La capacité 1.2.11 elle-même reste sourcée (verbatim + 4 examens) et n'a pas bougé."
