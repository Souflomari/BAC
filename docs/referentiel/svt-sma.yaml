# Cadre de référence 2025 — SVT — Sciences Mathématiques, filière « A » (option français)
# Transcription mot pour mot, relue sur les 9 pages scannées le 2026-10-22. Format : README.md.
# `notions_app` est NOTRE correspondance avec les dossiers content/svt/ (pas le document).
# Génétique seulement : ni énergie, ni information génétique moléculaire, ni immunologie, ni géologie.

document:
  titre: "Cadres de référence de l'examen national du baccalauréat — Options internationales du baccalauréat marocain – 2025 – option : français - Discipline : Sciences de la Vie et de la Terre — Série: Sciences Mathématiques — Filière : \"A\""
  annee: 2025
  note_ministerielle: "013-25 du 5 février 2025"
  editeur: "Centre National des examens scolaires et de l'Evaluation des apprentissages (CNEE)"
  pages: 9
  source: "https://drive.google.com/file/d/1TJfPFrlydV5lkTRxGHhxDgHWDDlBhAJH/view"
  lu_le: "2026-10-22"
  lecture: "lecture visuelle des 9 pages scannées ; pagination du document = pagination du PDF (« page N sur 9 ») ; pages 5 à 8 en paysage"
filieres: [sm-a]
matiere: svt

# Page 2 — « 1. Les compétences spécifiques visées par le programme de la deuxième année du
# baccalauréat – option Sciences Math «A» ».
competences_visees:
  - { page: 2, libelle: "Acquérir des connaissances sur la transmission de l'information génétique par la reproduction sexuée et sur la génétique humaine, et utiliser ces connaissances pour résoudre des problèmes liés à la transmission des caractères héréditaires et pour sensibiliser aux maladies héréditaire à fin de prendre les précautions nécessaires contre ces maladies ;", note: "« maladies héréditaire à fin de » [sic]" }
  - { page: 2, libelle: "Acquérir des connaissances de base sur la variation génétique et la génétique des populations, et être conscient de l'importance de la sélection dans l'amélioration de la qualité et de la rentabilité de la production agricole, et son impact sur la production économique, ainsi que l'importance des facteurs de l'évolution de la population dans la stabilité de sa structure génétique et de son équilibre avec son milieu de vie ;" }
  - { page: 2, libelle: "Adopter une démarche scientifique convenable pour aborder les problèmes liés à la génétique, à la variation génétique et à la génétique des populations ;" }
  - { page: 2, libelle: "Utiliser les différents modes d'expression (orale, écrite et graphique) pour communiquer et représenter les phénomènes liés à la génétique, à la variation et à la génétique des populations ;" }
  - { page: 2, libelle: "Utiliser correctement le matériel de laboratoire et les technologies de l'information et de la communication dans la collecte et le traitement de données relatives à la génétique, à la variation génétique et à la génétique des populations." }

epreuve:
  # Le document ne donne ni durée ni coefficient : voir examen.yaml (en-têtes NS 36F 2024 et
  # corrigé RA 36F 2026 : 2 h, coefficient 3).
  materiel: "Matériel d'écriture et de dessin : des stylos, des crayons, une règle, une gomme et une taille crayons ; Une calculatrice non programmable ; Du papier millimétré."
  materiel_page: 9
  structure:
    - { partie: "I", points: 5, page: 9, intitule: "Partie I : Restitution des connaissances", contenu: "Vise à examiner le degré de maitrise de connaissances en utilisant : Les questions à choix multiples (QCM) ; Les questions à alternative (vrai ou faux); Les questions à appariement ; Les questions de sériation et de classification; Les questions à réponses courtes (définir ; légender un schéma ou un graphique ; la connaissance des théories, des lois, des termes scientifiques, des faits, des signes …). Cette partie évalue chez l'élève l'un des deux domaines suivants : 1. La transmission de l'information génétique au cours de la reproduction sexuée – La génétique humaine. 2. La variation et la génétique des populations.", poids: 25 }
    - partie: "II"
      points: 15
      page: 9
      intitule: "Partie II : Raisonnement scientifique et communication écrite et graphique."
      poids: 75
      cas:
        - cas: "1er cas"
          exercices:
            - { condition: "1- Dans le cas où le premier domaine ne figure pas dans la partie I.", exercice: "Un ou deux exercices dans le premier domaine.", poids: 50, points: "10" }
            - { condition: "2- Dans le cas où le deuxième domaine figure dans la partie I.", exercice: "Ajout d'un exercice dans le reste du contenu du deuxième domaine qui ne figure pas dans partie I.", poids: 25, points: "5" }
        - cas: "2ème cas"
          exercices:
            - { condition: "1- Dans le cas où le deuxième domaine ne figure pas dans la partie I.", exercice: "Un ou deux exercices dans le deuxième domaine.", poids: 50, points: "10" }
            - { condition: "2- Dans le cas où le premier domaine figure dans la partie I.", exercice: "Ajout d'un exercice dans le reste du contenu du premier domaine qui ne figure pas dans la partie I.", poids: 25, points: "5" }
      nb: "Il est possible que la partie II soit composée de deux exercices intégrant les deux domaines en tenant compte de la répartition des notes sur les deux domaines tout en respectant la notation de la partie I."
  habiletes:
    - nom: "La restitution des connaissances."
      poids: 25
      page: 7
      detail: "La partie de la restitution des connaissances vise à évaluer, chez l'apprenant, le degré de maitrise de connaissance en utilisant : Les questions à choix multiples (QCM) ; Les questions à alternative (vrai ou faux); Les questions à appariement ; Les questions de sériation et de classification; Les questions à réponses courtes (définir ; légender un schéma ou un graphique ; connaitre des théories, des lois, des termes scientifiques, des faits, des signes …)"
    - nom: "Raisonnement scientifique et communication graphique et écrite."
      poids: 75
      page: 7
      detail: "La partie du raisonnement scientifique et communication graphique et écrite vise à évaluer, chez l'apprenant, le degré de maitrise des habiletés et des aptitudes suivantes :"
      aptitudes:
        - "Déterminer et formuler un problème scientifique ;"
        - "Utiliser des connaissances, sélectionner et organiser des informations en relation avec le sujet d'étude ;"
        - "Relier les informations avec les acquis pour résoudre le problème scientifique posé ;"
        - "Proposer et formuler une ou des hypothèses en relation avec le problème scientifique ;"
        - "Mobiliser des informations pour résoudre le problème scientifique posé ou pour expliquer des phénomènes, objet d'étude ;"
        - "Proposer les outils adéquats pour vérifier l'hypothèse ;"
        - "Décrire et analyser des données scientifiques ;"
        - "Comparer et expliquer/interpréter des résultats ;"
        - "Déduire et généraliser ;"
        - "Utiliser des principes, des lois, des modèles pour expliquer les phénomènes et les données scientifiques."
        - "Réaliser une synthèse des informations et des données sous forme de texte ou de schéma ;"
        - "Exprimer une opinion et l'argumenter ;"
        - "Représenter une structure ou un phénomène biologique ou géologique par un schéma ;"
        - "Traduire des données numériques sous formes de tableau ou de graphique ou de texte ;"
        - "Réaliser un schéma fonctionnel ;"
        - "Réaliser un schéma de synthèse."
  specification:
    # Page 8 : note ministérielle n° 10-142 ; « La partie I : La restitution de connaissances permet
    # l'évaluation des connaissances de l'apprenant dans un sous-domaine des deux principaux
    # domaines ; La partie II : L'utilisation des données et la mobilisation des connaissances selon
    # une démarche scientifique (raisonnement scientifique et communication graphique et écrite)
    # permet l'évaluation des acquis de l'apprenant dans les sous-domaines non évalués dans la partie I. »
    page: 8
    restitution: { poids: 25, points: 5, note: "« 25 % Dans l'un des deux domaines »" }
    lignes:
      - { domaines: ["1"], raisonnement: "- 50 % si ce domaine ne figure pas dans la partie I; - 25 % si ce domaine figure dans la partie I (dans le reste de ce domaine qui ne figure pas dans la partie I).", total: "50 %", points: "10 pts" }
      - { domaines: ["2"], raisonnement: "- 50 % si ce domaine ne figure pas dans la partie I; - 25 % si ce domaine figure dans la partie I (dans le reste de ce domaine qui ne figure pas dans la partie I).", total: "50 %", points: "10 pts" }
    totaux: { restitution: "25 % · 5 pts", raisonnement: "75 % · 15 pts", total: "100 % · 20 pts" }

domaines:
  - id: "1"
    nom: "Transmission de l'information génétique par la reproduction sexuée – La génétique humaine."
    poids: 50
    poids_page: 5
    sous_domaines:
      - id: "1.1"
        nom: "Transmission de l'information génétique par la reproduction sexuée."
        connaissances:
          - { page: 5, libelle: "Les étapes de la méiose ;" }
          - { page: 5, libelle: "Caryotypes d'espèces diploïdes ;" }
          - { page: 5, libelle: "Rôle de la méiose et de la fécondation dans le brassage des allèles (brassage interchromosomique et brassage intrachromosomique) et dans le maintien du caryotype aux cours des générations.", incertain: true, note: "« aux cours » [sic] selon notre lecture" }
          - { page: 5, libelle: "Cycles de développement et cycles chromosomiques." }
        capacites:
          - { id: "1.1.1", page: 5, notions_app: [], libelle: "Décrire et reconnaitre les phases de la méiose ;" }
          - { id: "1.1.2", page: 5, notions_app: [], libelle: "Analyser des caryotypes d'espèces diploïdes ;", note: "genetique-humaine (R1) présente le caryotype humain, sans en faire l'analyse" }
          - { id: "1.1.3", page: 5, notions_app: [], libelle: "Analyser des données relatives aux cycles de développement" }
          - { id: "1.1.4", page: 5, notions_app: [], libelle: "Déduire le rôle de la méiose et de la fécondation dans le brassage des allèles et dans le maintien du caryotype chez la même espèce de génération en génération et leur rôle dans la diversité génétique et ce à partir de l'exploitation de données de l'observation et de l'expérimentation ;" }
          - { id: "1.1.5", page: 5, notions_app: [], libelle: "Réaliser des schémas en relation avec les phases de la méiose, les cycles de développement et les cycles chromosomiques." }
      - id: "1.2"
        nom: "Lois statistiques de transmission des caractères héréditaires chez les diploïdes"
        connaissances:
          - { page: 5, libelle: "Les lois de Mendel de la transmission des caractères héréditaires ;" }
          - { page: 5, libelle: "Monohybridisme et dihybridisme ;" }
          - { page: 5, libelle: "Lignée pure et lignée sauvage, homozygotie et hétérozygotie, hybridation, croisement-test (test-cross /croisement en retour) ;" }
          - { page: 5, libelle: "Echiquiers de croisement ;" }
          - { page: 5, libelle: "Hérédité non liée au sexe et hérédité liée au sexe ;" }
          - { page: 5, libelle: "Dominance, codominance et gène létal ;" }
          - { page: 5, libelle: "Gènes indépendants et gènes liés ;" }
          - { page: 5, libelle: "Enjambement (crossing-over), brassage intrachromosomique et diversité génétique ;" }
          - { page: 5, libelle: "La carte factorielle." }
        capacites:
          - { id: "1.2.1", page: 5, notions_app: [transmission-caracteres, genetique-humaine], libelle: "Analyser et interpréter les résultats de la transmission d'un couple d'allèles à partir de l'étude d'un exemple précis (cas d'un gène lié au sexe et cas d'un gène non lié au sexe) ;", note: "codominance et gène létal absents des leçons ; hérédité liée au sexe traitée chez l'Homme seulement" }
          - { id: "1.2.2", page: 5, notions_app: [transmission-caracteres], libelle: "Analyser et interpréter les résultats de la transmission de deux couples d'allèles à partir de l'étude d'un exemple précis (cas de deux gènes indépendants et cas de deux gènes liés) ;", note: "partiel : gènes indépendants seulement" }
          - { id: "1.2.3", page: 5, notions_app: [transmission-caracteres], libelle: "Schématiser le brassage interchromosomique et le brassage intrachromosomique, selon l'exemple étudié ;", note: "partiel : brassage interchromosomique seulement" }
          - { id: "1.2.4", page: 5, notions_app: [], libelle: "Calculer la distance entre les gènes et établir la carte factorielle." }
      - id: "1.3"
        nom: "Génétique humaine."
        connaissances:
          - { page: 5, libelle: "Notion d'arbre généalogique et de caryotype ;" }
          - { page: 5, libelle: "Maladies héréditaires non liées aux chromosomes sexuels ;" }
          - { page: 5, libelle: "Maladies héréditaires liées aux chromosomes sexuels ;" }
          - { page: 5, libelle: "Les anomalies chromosomiques et leurs conséquences." }
          - { page: 5, libelle: "L'interprétation chromosomique des maladies héréditaires ;" }
          - { page: 5, libelle: "Techniques du diagnostic prénatal des anomalies chromosomiques." }
        capacites:
          - { id: "1.3.1", page: 5, notions_app: [genetique-humaine], libelle: "Analyser, interpréter et expliquer les données d'arbres généalogiques et de caryotypes en déduisant le mode de transmission d'un gène dans le cas de : ○ Maladies héréditaires non liées aux chromosomes sexuels ; ○ Maladies héréditaires liées aux chromosomes sexuels ;" }
          - { id: "1.3.2", page: 5, notions_app: [], libelle: "Analyser, interpréter / expliquer les anomalies chromosomiques en réalisant des schémas appropriés ;" }
          - { id: "1.3.3", page: 5, notions_app: [], libelle: "Exprimer son opinion sur le diagnostic prénatal des anomalies chromosomiques à partir de l'exploitation de données." }

  - id: "2"
    nom: "La variation génétique et la génétique des populations."
    poids: 50
    poids_page: 6
    sous_domaines:
      - id: "2.1"
        nom: "Etude quantitative de la variation (La biométrie)."
        connaissances:
          - { page: 6, libelle: "Variation continue et variation discontinue des caractères héréditaires ;" }
          - { page: 6, libelle: "Population homogène et population hétérogène ;" }
          - { page: 6, libelle: "Paramètres de position et paramètres de dispersion et leurs significations statistiques ;" }
          - { page: 6, libelle: "Notion de race pure (sélection efficace et sélection inefficace) ;" }
          - { page: 6, libelle: "Sélection artificielle." }
        capacites:
          - { id: "2.1.1", page: 6, notions_app: [], libelle: "Déterminer les caractéristiques de la variation continue et de la variation discontinue des caractères héréditaires à partir de l'étude d'exemples ;" }
          - { id: "2.1.2", page: 6, notions_app: [], libelle: "Représenter graphiquement la variation continue et la variation discontinue ;" }
          - { id: "2.1.3", page: 6, notions_app: [], libelle: "Calculer les paramètres de position et les paramètres de dispersion et déduire leurs significations statistiques ;" }
          - { id: "2.1.4", page: 6, notions_app: [], libelle: "Déduire le rôle de la sélection artificielle dans l'amélioration du rendement de la productivité." }
      - id: "2.2"
        nom: "La génétique des populations."
        connaissances:
          - { page: 6, libelle: "Les critères d'équilibre de la population à partir : ○ De la notion de population ; ○ Du pool génique (pool de gènes) d'une population ; ○ De la loi de Hardy-Weinberg et son application dans quelques cas de transmission d'un couple d'allèles." }
          - { page: 6, libelle: "Les facteurs de variation d'une population : ○ Les mutations ; ○ La sélection naturelle ; ○ La dérive génétique ; ○ La migration." }
          - { page: 6, libelle: "Les critères caractérisant l'espèce." }
          - { page: 6, libelle: "Définition de l'espèce." }
        capacites:
          - { id: "2.2.1", page: 6, notions_app: [genetique-populations], libelle: "Déduire les caractéristiques d'une population ;" }
          - { id: "2.2.2", page: 6, notions_app: [genetique-populations], libelle: "Appliquer la loi de Hardy-Weinberg dans le cas de la transmission d'un couple d'allèles" }
          - { id: "2.2.3", page: 6, notions_app: [genetique-populations], libelle: "Calculer les fréquences des génotypes et des phénotypes à travers les générations au sein d'une population." }
          - { id: "2.2.4", page: 6, notions_app: [genetique-populations], libelle: "Montrer/mettre en évidence les modes d'action des facteurs de variation génétique de la population sur sa structure génétique à partir de l'exploitation de données ;" }
          - { id: "2.2.5", page: 6, notions_app: [genetique-populations], libelle: "Déduire l'effet des facteurs de variation génétique de la population sur la structure génétique de la population à partir de l'exploitation de données." }
          - { id: "2.2.6", page: 6, notions_app: [], libelle: "Déterminer les critères distinctifs de l'espèce et donner sa définition." }

notes_de_lecture:
  - "NUMÉROTATION RECONSTITUÉE. Le document numérote les domaines (1, 2) et les sous-domaines (1.1 à 2.2), pas les capacités (tirets de la colonne « Objectif de base (notionnels / méthodologiques) », pp. 5-6). Le troisième chiffre est l'ordre d'apparition."
  - "22 capacités : 1.1 (5) · 1.2 (4) · 1.3 (3) · 2.1 (4) · 2.2 (6)."
  - "Propre à SM-A, absent de svt-svt.yaml et svt-pc.yaml : les cycles de développement et cycles chromosomiques (1.1, p. 5 ; en prose p. 3 : « Traiter des exemples de cycles de développement pour mettre en évidence le rôle de l'alternance de la fécondation et de la méiose dans le maintien du caryotype chez les individus d'une même espèce d'une génération à une autre ») et toute la biométrie (2.1)."
  - "La prose de la page 4 précise la biométrie : « Exploiter l'étude biométrique pour déterminer les caractéristiques et les particularités du groupe (homogénéité ou hétérogénéité, lignée pure), et construire la notion de sélection artificielle en mettant en évidence son efficacité dans la sélection des races pures » ; « Utiliser la représentation graphique de la variation continue et de la variation discontinue afin de mettre en évidence ces caractéristiques »."
  - "Le tableau de spécification (p. 8) fait porter la Partie I sur « un sous-domaine des deux principaux domaines », et la Partie II sur le reste : le domaine absent de la Partie I vaut 10 points, le reste du domaine de la Partie I vaut 5 points."
  - "Page 4 : « 3. la répartition semestrielle » renvoie aux programmes. Absents du document : énergie, muscle, ADN, expression des gènes, immunologie, géologie."
  - "Accents transcrits tels que lus (« reconnaitre », « maitrise ») ; un accent sur scan peut être mal lu."
