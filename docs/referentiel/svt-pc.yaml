  - id: "4"
    nom: "Les phénomènes géologiques accompagnant la formation des chaines de montagnes et leur relation avec la tectonique des plaques."
    poids: 25
    poids_page: 14
    sous_domaines:
      - id: "4.1"
        nom: "Les chaines de montagnes récentes et leur relation avec la tectonique des plaques."
        connaissances:
          - { page: 14, libelle: "Les différents types de chaines de montagnes récentes ;" }
          - { page: 14, libelle: "Les caractéristiques structurales et pétrographiques des chaines de subduction, des chaines d'obduction et des chaines de collision ;" }
          - { page: 14, libelle: "Relation des chaines de montagnes récentes avec la tectonique des plaques." }
        capacites:
          - { id: "4.1.1", page: 14, notions_app: [chaines-de-montagnes], libelle: "Dégager les caractéristiques structurales et pétrographiques des chaines de montagnes récentes à partir de l'étude de cartes et de coupes géologiques ;", note: "l'obduction n'est pas nommée dans la leçon (ophiolites seulement)" }
          - { id: "4.1.2", page: 14, notions_app: [chaines-de-montagnes], libelle: "Etablir la relation entre les chaines de montagnes récentes et la dynamique des plaques ;" }
          - { id: "4.1.3", page: 14, notions_app: [chaines-de-montagnes], libelle: "Déterminer les étapes de la genèse des chaines de montagnes récentes à partir de l'exploitation des données de coupes géologiques ;" }
          - { id: "4.1.4", page: 14, notions_app: [chaines-de-montagnes], libelle: "Représenter graphiquement les conditions de formation d'une chaine de montagnes récente ;" }
          - { id: "4.1.5", page: 14, notions_app: [chaines-de-montagnes], libelle: "Réaliser un schéma de synthèse des étapes de formation d'une chaine de montagnes récente." }
      - id: "4.2"
        nom: "Les déformations tectoniques caractérisant les chaines de subduction et les chaines de collision."
        connaissances:
          - { page: 14, libelle: "Les principales déformations tectoniques (plis, failles et nappes de charriage) qui caractérisent les chaines de subduction et les chaines de collision ;" }
          - { page: 14, libelle: "Relation entre les déformations tectoniques et les contraintes tectoniques." }
        capacites:
          - { id: "4.2.1", page: 14, notions_app: [granitisation-deformation, chaines-de-montagnes], libelle: "Classer les plis et les failles ;", note: "pas de classification complète dans les leçons" }
          - { id: "4.2.2", page: 14, notions_app: [chaines-de-montagnes], libelle: "Analyser des cartes et des coupes géologiques de chaines de montagnes récentes ;" }
          - { id: "4.2.3", page: 14, notions_app: [], libelle: "Déterminer les caractéristiques structurales des nappes de charriage ;", note: "« nappe de charriage » absente des leçons ; le sujet 2026 (corrigé RA 34F) en demande la définition en Partie I" }
          - { id: "4.2.4", page: 14, notions_app: [chaines-de-montagnes, granitisation-deformation], libelle: "Etablir la relation entre les déformations et les contraintes tectoniques ;" }
          - { id: "4.2.5", page: 14, notions_app: [chaines-de-montagnes], libelle: "Etablir la relation entre les déformations tectoniques et les conditions de formation des chaines de subduction et de collision ;" }
          - { id: "4.2.6", page: 14, notions_app: [chaines-de-montagnes, granitisation-deformation], libelle: "Schématiser les déformations tectoniques en relation avec les contraintes tectoniques." }
      - id: "4.3"
        nom: "Le métamorphisme et sa relation avec la tectonique des plaques."
        connaissances:
          - { page: 14, libelle: "La notion de métamorphisme ;" }
          - { page: 14, libelle: "Les caractéristiques minéralogiques et structurales des roches métamorphiques dans les zones de subduction et dans les zones de collision ;" }
          - { page: 15, libelle: "Les conditions de température et de pression responsables de la formation des roches métamorphiques ;" }
          - { page: 15, libelle: "La notion de minéral index / indicateur et la notion de série métamorphique;" }
          - { page: 15, libelle: "La notion de métamorphisme dynamique et la notion de métamorphisme thermodynamique." }
        capacites:
          - { id: "4.3.1", page: 14, notions_app: [chaines-de-montagnes, granitisation-deformation], libelle: "Déterminer les caractéristiques minéralogiques et structurales des roches métamorphiques dans les zones de subduction et dans les zones de collision à partir de l'étude d'échantillons de roches et de lames minces, et de l'analyse de données (tableaux de composition minéralogique et chimique) ;", note: "libellé à cheval sur les pages 14 et 15 ; partiel dans les leçons" }
          - { id: "4.3.2", page: 15, notions_app: [], libelle: "Déterminer les domaines de stabilité des minéraux index / indicateurs constituant les roches métamorphiques et les domaines du métamorphisme en utilisant le diagramme pression - température des roches;" }
          - { id: "4.3.3", page: 15, notions_app: [], libelle: "Etablir la relation entre les minéraux index / indicateurs, la série métamorphique et le type de métamorphisme dominant dans les chaines de subduction et dans les chaines de collision ;" }
          - { id: "4.3.4", page: 15, notions_app: [], libelle: "Distinguer/reconnaitre le métamorphisme dynamique et le métamorphisme thermodynamique;" }
          - { id: "4.3.5", page: 15, notions_app: [granitisation-deformation], libelle: "Représenter graphiquement les étapes du métamorphisme en utilisant le diagramme de variation des conditions de pression et de température ;", note: "partiel : série de faciès sans diagramme P-T des minéraux index" }
          - { id: "4.3.6", page: 15, notions_app: [chaines-de-montagnes], libelle: "Déduire, à partir de l'étude de cartes et de coupes géologiques, les caractéristiques minéralogiques et structurales des roches métamorphiques dans les zones de subduction et dans les zones de collision en relation avec la tectonique des plaques." }
      - id: "4.4"
