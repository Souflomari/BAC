      - { domaines: ["2"], raisonnement: "25% si ce domaine principal ne figure pas dans la partie I ; 0% si ce domaine principal figure dans la partie I.", total: "25%", points: "5 pts" }
      - { domaines: ["3"], raisonnement: "25% si ce domaine principal ne figure pas dans la partie I ; 0% si ce domaine principal figure dans la partie I.", total: "25%", points: "5 pts" }
      - { domaines: ["4"], raisonnement: "25% si ce domaine principal ne figure pas dans la partie I ; 0% si ce domaine principal figure dans la partie I.", total: "25%", points: "5 pts" }
    totaux: { restitution: "25% · 5 pts", raisonnement: "75% · 15 pts", total: "100% · 20 pts" }

domaines:
  - id: "1"
    nom: "Consommation de la matière organique et flux d'énergie."
    poids: 25
    poids_page: 8
    sous_domaines:
      - id: "1.1"
        nom: "Les réactions responsables de la libération de l'énergie emmagasinée dans la matière organique au niveau de la cellule."
        connaissances:
          - { page: 8, libelle: "Notion de respiration ;" }
          - { page: 8, libelle: "Notion de fermentation ;" }
          - { page: 8, libelle: "Les étapes essentielles de la glycolyse ;" }
          - { page: 8, libelle: "Bilan énergétique de la glycolyse ;" }
          - { page: 8, libelle: "Structure et ultra-structure de la mitochondrie ;" }
          - { page: 8, libelle: "Les étapes essentielles du cycle de Krebs ;" }
          - { page: 8, libelle: "Bilan énergétique du cycle de Krebs ;" }
          - { page: 8, libelle: "La chaine respiratoire et la phosphorylation oxydative;" }
          - { page: 8, libelle: "Bilan énergétique de la respiration ;" }
          - { page: 8, libelle: "Les étapes essentielles de la fermentation ;" }
          - { page: 8, libelle: "Bilan énergétique de la fermentation ;" }
          - { page: 8, libelle: "Le rendement énergétique." }
        capacites:
          - { id: "1.1.1", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Comparer la respiration et la fermentation à partir de l'exploitation de données d'observation et d'expérimentation ;" }
          - { id: "1.1.2", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Montrer / mettre en évidence la relation entre la respiration, la fermentation et les structures cellulaires intervenant à partir de l'exploitation de données d'observation et d'expérimentation ;" }
          - { id: "1.1.3", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Appliquer le raisonnement scientifique (formuler un problème, proposer et éprouver / vérifier une hypothèse, proposer un protocole expérimental…) sur des données liées à la respiration et à la fermentation ;" }
          - { id: "1.1.4", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Déduire les conditions de la respiration et de la fermentation à partir de l'exploitation des données d'observation et d'expérimentation ;" }
          - { id: "1.1.5", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "déterminer les étapes essentielles des réactions responsables de la libération de l'énergie emmagasinée dans la matière organique, et déduire son bilan énergétique ;" }
          - { id: "1.1.6", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Décrire les constituants, la structure et l'ultrastructure de la mitochondrie et les mettre en relation avec les réactions de la respiration cellulaire ;" }
          - { id: "1.1.7", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Comparer le bilan énergétique de la respiration et de la fermentation ;" }
          - { id: "1.1.8", page: 8, notions_app: [], libelle: "Calculer le rendement énergétique de la respiration et de la fermentation ;", note: "le mot « rendement » n'apparaît pas dans la leçon actuelle" }
          - { id: "1.1.9", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Représenter graphiquement les aspects de la respiration et de la fermentation ;" }
          - { id: "1.1.10", page: 8, notions_app: [liberation-energie-matiere-organique], libelle: "Réaliser un schéma de synthèse du bilan énergétique de la respiration et de la fermentation." }
      - id: "1.2"
        nom: "Rôle du muscle strié squelettique dans le transfert d'énergie."
        connaissances:
