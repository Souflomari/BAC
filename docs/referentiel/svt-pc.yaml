          - { page: 15, libelle: "Origine et mise en place du granite d'anatexie ;" }
          - { page: 15, libelle: "La relation entre le granite d'anatexie et les roches métamorphiques avoisinantes;" }
          - { page: 15, libelle: "La notion de granite intrusif ;" }
          - { page: 16, libelle: "Origine et mise en place du granite intrusif ;" }
          - { page: 16, libelle: "La notion de métamorphisme de contact ;" }
          - { page: 16, libelle: "La relation entre le granite intrusif et les roches métamorphiques avoisinantes." }
        capacites:
