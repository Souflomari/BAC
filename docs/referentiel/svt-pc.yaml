          - { id: "1.2.6", page: 9, notions_app: [], libelle: "Montrer / mettre en évidence la relation entre les phénomènes thermiques et chimiques et la contraction musculaire ;" }
          - { id: "1.2.7", page: 9, notions_app: [], libelle: "Déduire les voies métaboliques de régénération de l'ATP nécessaire à la contraction musculaire ;" }
          - { id: "1.2.8", page: 9, notions_app: [], libelle: "Montrer / mettre en évidence la relation entre les voies de régénération de l'ATP et le type d'effort physique ;" }
          - { id: "1.2.9", page: 9, notions_app: [], libelle: "Réaliser des schémas du mécanisme de la contraction musculaire. (corriger dans les autres options)", note: "la parenthèse « (corriger dans les autres options) » est une note de rédaction restée dans le document officiel, recopiée telle quelle" }
      - id: "1.3"
