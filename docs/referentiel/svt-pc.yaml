          - { id: "4.4.2", page: 15, notions_app: [granitisation-deformation], libelle: "Utiliser le diagramme de variation des conditions de pression et de température pour déterminer l'origine du granite d'anatexie ;", note: "libellé à cheval sur les pages 15 et 16" }
          - { id: "4.4.3", page: 16, notions_app: [], libelle: "Déterminer les caractéristiques minéralogiques et structurales du granite intrusif et des roches métamorphiques avoisinantes en se basant sur l'étude d'échantillons de roches et de lames minces et sur l'analyse de données (tableaux de composition minéralogique et chimique) ;", note: "granite intrusif et métamorphisme de contact absents des leçons" }
          - { id: "4.4.4", page: 16, notions_app: [granitisation-deformation], libelle: "Analyser des cartes et des coupes géologiques montrant la relation entre granitisation et métamorphisme ;", note: "partiel : granite d'anatexie seulement" }
          - { id: "4.4.5", page: 16, notions_app: [granitisation-deformation], libelle: "Exprimer graphiquement la relation entre granitisation et métamorphisme.", note: "partiel : granite d'anatexie seulement" }
