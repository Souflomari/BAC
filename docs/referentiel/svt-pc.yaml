notes_de_lecture:
  - "NUMÉROTATION RECONSTITUÉE. Le document numérote les domaines (1 à 4) et les sous-domaines (1.1 à 4.5), pas les capacités (tirets de la colonne « Objectifs (notionnels/méthodologiques) », pp. 8-16). Le troisième chiffre est l'ordre d'apparition."
  - "89 capacités : 1.1 (10) · 1.2 (9) · 1.3 (1) · 2.1 (10) · 2.2 (4) · 2.3 (4) · 2.4 (4) · 3.1 (8) · 3.2 (6) · 3.3 (7) · 3.4 (2) · 4.1 (5) · 4.2 (6) · 4.3 (6) · 4.4 (5) · 4.5 (2)."
  - "Les domaines 1 et 4 (géologie) reprennent, à quelques mots près, les domaines 1 et 6 de svt-svt.yaml : « transfert d'énergie » (1.2) au lieu de « conversion de l'énergie » ; « ultra-structure du muscle » au lieu de « du muscle squelettique » ; « Décrire les constituants, la structure et l'ultrastructure de la mitochondrie » (1.1.6). Le domaine 2 réunit les domaines 2 (sans le génie génétique) et 3 (sans la génétique humaine) de svt-svt.yaml, gènes liés, crossing-over, carte factorielle et hérédité liée au sexe compris."
  - "Dans 2.4, la colonne « Connaissances » ne contient pas de ligne « Gènes indépendants, gènes liés » (présente dans svt-svt 3.2) ; la capacité 2.4.2 les cite néanmoins. Lecture à confirmer sur un meilleur scan."
  - "Le sous-domaine 3.4 (« Contrôle de la qualité et de la salubrité des milieux naturels », p. 13) est au tableau des contenus mais n'apparaît pas dans le tableau de spécification (p. 19), qui ne liste pour le domaine 3 que les ordures ménagères, les pollutions et les éléments radioactifs (une quatrième ligne y est vide)."
  - "Pages 3 à 7 (« 2. les contenus ») présentent les domaines en prose. Page 7 : « 3. la répartition semestrielle » renvoie aux programmes. Le titre de la couverture porte la coquille « Sciences de la Viet et de la Terre » ; le tableau de spécification (p. 19) écrit « libéralisation de l'énergie » pour « libération »."
  - "Absents du document : enzyme, digestion, immunologie, génétique humaine, Hardy-Weinberg, génie génétique."
  - "Accents transcrits tels que lus (« chaines », « reconnaitre », « maitrise ») ; un accent sur scan peut être mal lu."
