          - { id: "1.2.2", page: 9, notions_app: [], libelle: "Comparer l'état d'une fibre musculaire au repos et au cours d'une contraction ;" }
          - { id: "1.2.3", page: 9, notions_app: [], libelle: "Appliquer le raisonnement scientifique (formuler un problème, proposer et éprouver / vérifier une hypothèse, proposer un protocole expérimental…) sur des données liées à la contraction musculaire ;" }
