# Cadre de référence 2025 — SVT — filière Sciences Physiques (option français)
# Transcription mot pour mot, relue sur les 20 pages scannées le 2026-10-22. Format : README.md.
# `notions_app` est NOTRE correspondance avec les dossiers content/svt/ (pas le document).
# Ce cadre N'EST PAS un sous-ensemble de svt-svt.yaml : il a un domaine propre (3, matières
# organiques et inorganiques) et n'a ni génie génétique, ni génétique humaine, ni génétique des
# populations, ni immunologie.

