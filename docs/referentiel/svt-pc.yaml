  titre: "Cadres de référence de l'examen national du baccalauréat — Options internationales du baccalauréat marocain - 2025 - option : français - Discipline : Sciences de la Viet [sic] et de la Terre — Série : Sciences expérimentales — Filière : Sciences Physiques"
