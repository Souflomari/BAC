# Page 2 — « 1. Les compétences spécifiques visées par le programme de la deuxième année du
# baccalauréat – option PC ».
competences_visees:
  - { page: 2, libelle: "Acquérir des connaissances liées à la consommation de la matière organique et au flux d'énergie au niveau cellulaire pour comprendre l'importance de l'énergie dans l'activité cellulaire et prendre conscience de son rôle dans le maintien des fonctions vitales de l'organisme ;" }
  - { page: 2, libelle: "Approfondir les connaissances sur la nature de l'information génétique et les mécanismes d'expression des gènes, dans le but de les utiliser dans la compréhension et l'explication des phénomènes de l'hérédité chez les êtres vivants ;" }
  - { page: 2, libelle: "Acquérir des connaissances sur la transmission de l'information génétique par la reproduction sexuée, et utiliser ces connaissances pour résoudre quelques problèmes liés à la transmission des caractères héréditaires ;" }
  - { page: 2, libelle: "Acquérir des connaissances sur les phénomènes géologiques liés à la formation des chaînes de montagnes (déformations, métamorphisme, granitisation) et être capable de situer ces phénomènes dans l'espace et dans le temps dans le contexte de la tectonique des plaques ;" }
  - { page: 2, libelle: "Acquérir des connaissances sur l'utilisation des matières organiques et inorganiques, prendre conscience du danger des polluants causé par cette utilisation et proposer des alternatives environnementales pour préserver la salubrité des milieux naturels et la santé des êtres vivants." }
  - { page: 2, libelle: "Utiliser une démarche scientifique convenable pour aborder les problèmes liés à la consommation de la matière organique et au flux d'énergie au niveau de la cellule, à la génétique, à l'utilisation des matières organiques et inorganiques et aux phénomènes géologiques accompagnant la formation des chaines montagnes ;" }
  - { page: 2, libelle: "Utiliser les différents modes d'expression (orale, écrite et graphique) pour communiquer et représenter les phénomènes liés à la consommation de la matière organique et au flux d'énergie à l'intérieur de la cellule, à la génétique, à l'utilisation des matières organiques et inorganiques et aux phénomènes géologiques accompagnant la formation des chaînes de montagnes ;" }
  - { page: 2, libelle: "Utiliser correctement le matériel de laboratoire et les technologies de l'information et de la communication dans la collecte et le traitement des données relatives à la consommation de la matière organique et au flux d'énergie au niveau de la cellule, à la génétique, à l'utilisation des matières organiques et inorganiques et aux phénomènes géologiques accompagnant la formation des chaines de montagnes." }

epreuve:
  # Le document ne donne ni durée ni coefficient : voir examen.yaml. En-têtes relus : RS 34F 2024
  # (3 h, coefficient 5) ; le corrigé RA 34F 2026 imprime « 4 س » (4 h) et coefficient 5 — écart non
  # résolu, cf. docs/bible/sources/verification-svt.md.
  materiel: "Matériel d'écriture et de dessin : des stylos, des crayons, une règle, une gomme et un taille crayons ; Une calculatrice non programmable ; Du papier millimétré."
  materiel_page: 20
  structure:
    - { partie: "I", points: 5, page: 20, intitule: "Partie I : restitution des connaissances", contenu: "Elle vise à examiner le degré de maitrise des connaissances en utilisant : les questions à choix multiples (QCM) ; les questions à alternative (vrai ou faux); les questions à appariement; les questions de sériation et de classification; Les questions à réponses courtes (définir ; légender un schéma ou un graphique ; connaitre des théories, des lois, des termes scientifiques, des faits, des signes …) Cette partie évalue chez l'apprenant l'un des principaux domaines suivants : 1. Consommation de la matière et flux d'énergie 2. Nature de l'information génétique et le mécanisme de son expression – Transmission de l'information génétique au cours de la reproduction sexuée 3. Utilisation des matières organiques et inorganiques. 4. Les phénomènes géologiques relatifs à la formation des chaines de montagne et leur relation avec la tectonique des plaques" }
    - partie: "II"
      points: 15
      page: 20
      intitule: "Partie II : Raisonnement scientifique et communication écrite et graphique"
      contenu: "Elle est constituée de 3 exercices organisés selon ce qui a été évalué dans la partie I"
      exercices:
        - { exercice: "Exercice 1 : lié à un domaine qui n'est pas évalué dans la partie I.", points: "5" }
        - { exercice: "Exercice 2 : lié à un domaine qui n'est pas évalué dans la partie I et dans les exercices 1 et 3.", points: "5" }
        - { exercice: "Exercice 3 : lié à un domaine qui n'est pas évalué dans la partie I et dans les exercices 1 et 2.", points: "5" }
  habiletes:
    - nom: "La restitution des connaissances."
      poids: 25
      page: 17
      detail: "La partie de la restitution des connaissances vise à évaluer, chez l'apprenant, le degré de maitrise de connaissance en utilisant : les questions à choix multiples (QCM) ; les questions à alternative (vrai ou faux); les questions à appariement; Les questions de sériation et de classification; les questions à réponses courtes (définir ; légender un schéma ou un graphique ; connaitre des théories, des lois, des termes scientifiques, des faits, des signes …)"
    - nom: "Raisonnement scientifique et communication écrite et graphique."
      poids: 75
      page: 17
      detail: "La partie du raisonnement scientifique et communication graphique et écrite vise à évaluer, chez l'apprenant(e), le degré de maîtrise des habiletés et des aptitudes suivantes :"
      aptitudes:
        - "Déterminer et formuler un problème scientifique ;"
        - "Utiliser des connaissances, sélectionner et organiser des informations en relation avec le sujet d'étude ;"
        - "Relier les informations avec les acquis pour résoudre le problème scientifique posé ;"
        - "Proposer et formuler une ou des hypothèses en relation avec le problème scientifique ;"
        - "Mobiliser des informations pour résoudre le problème scientifique posé ou pour expliquer des phénomènes, objet d'étude ;"
        - "Proposer les outils adéquats pour vérifier l'hypothèse ;"
        - "Décrire et analyser des données scientifiques ;"
        - "Comparer et expliquer/interpréter des résultats ;"
        - "Déduire et généraliser;"
        - "Utiliser des principes, des lois, des modèles pour expliquer /interpréter les phénomènes et les données scientifiques."
        - "Réaliser une synthèse des informations et des données sous forme de texte ou de schéma ;"
        - "Exprimer une opinion et l'argumenter ;"
        - "Représenter une structure ou un phénomène biologique ou géologique par un schéma ;"
        - "Traduire des données numériques sous forme de tableau ou de graphique ou de texte ;"
        - "Réaliser un schéma fonctionnel ;"
        - "Réaliser un schéma de synthèse."
  specification:
    # Page 18 : note ministérielle n° 10-142 ; « La partie I : La restitution de connaissances qui
    # permet l'évaluation des connaissances de l'apprenant(e) dans l'un des quatre principaux
    # domaines ; La partie II : Utilisation des données et mobilisation des connaissances selon une
    # démarche scientifique (raisonnement scientifique et communication écrite et graphique) qui
    # permet d'évaluer l'élève dans l'un des principaux domaines non évalués dans la partie I. »
    page: 19
    restitution: { poids: 25, points: 5, note: "25 % sur l'un des 4 domaines (case commune du tableau)" }
