          - { page: 9, libelle: "Les phénomènes thermiques et chimiques (consommation du O2 et du glucose…) accompagnant la contraction musculaire ;" }
          - { page: 9, libelle: "Structure et ultra-structure du muscle ;" }
          - { page: 9, libelle: "La structure moléculaire des myofilaments ;" }
          - { page: 9, libelle: "L'origine de l'énergie nécessaire à la contraction musculaire ;" }
          - { page: 9, libelle: "Le mécanisme de la contraction musculaire ;" }
          - { page: 9, libelle: "les voies métaboliques de la régénération de l'ATP." }
