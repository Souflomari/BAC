notes_de_lecture:
  - "NUMÉROTATION RECONSTITUÉE. Le document numérote les domaines (1 à 6) et les sous-domaines (1.1 à 6.5), pas les capacités : ce sont des tirets dans la colonne « Objectifs (notionnels/méthodologiques) » du tableau des contenus (pp. 8-19). Le troisième chiffre (1.1.1, 1.1.2…) est l'ordre d'apparition dans cette colonne. Les « connaissances » (colonne « Connaissances » / « Les connaissances ») sont recopiées sans identifiant."
  - "94 capacités : 1.1 (10) · 1.2 (9) · 1.3 (1) · 2.1 (10) · 2.2 (4) · 2.3 (3) · 3.1 (4) · 3.2 (4) · 3.3 (3) · 4.1 (3) · 4.2 (2) · 4.3 (1) · 5.1 (3) · 5.2 (7) · 5.3 (4) · 5.4 (2) · 6.1 (5) · 6.2 (6) · 6.3 (6) · 6.4 (5) · 6.5 (2)."
  - "Pages 3 à 7 (« 2. Les contenus ») présentent les mêmes domaines en prose ; elles n'ajoutent pas de contenu absent du tableau, sauf l'exigence de fin du domaine 1 : « A la fin de ce domaine, il est nécessaire de construire un schéma bilan résumant les relations entre les différentes réactions qui libèrent l'énergie et celles qui la consomment en montrant le rôle de la molécule d'ATP comme intermédiaire énergétique » (p. 3). Page 7 : « 3. la répartition semestrielle » renvoie aux programmes, sans la donner."
  - "Le document ne contient pas les mots « enzyme » ni « digestion » (lecture visuelle des 23 pages) : la leçon role-enzymes ne correspond à aucune capacité. Il ne contient pas non plus de sous-domaine sur la théorie de la tectonique des plaques elle-même (dérive, expansion océanique) : la leçon theorie-tectonique-plaques relève des prérequis."
