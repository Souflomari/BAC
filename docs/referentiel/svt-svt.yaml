# Page 2 — « 1. Les compétences spécifiques visées par le programme de la deuxième année du
# baccalauréat – option SVT » (« Selon le livret des orientations pédagogiques et des programmes
# spécifiques à l'enseignement des Sciences de la Vie et de la Terre dans le cycle secondaire
# qualifiant, les compétences visées en option Sciences de la Vie et de la Terre sont: »).
competences_visees:
  - { page: 2, libelle: "Acquérir des connaissances liées à la consommation de la matière organique et au flux d'énergie au niveau cellulaire pour comprendre l'importance de l'énergie dans l'activité cellulaire et prendre conscience de son rôle dans le maintien des fonctions vitales de l'organisme ;" }
  - { page: 2, libelle: "Approfondir les connaissances sur la nature de l'information génétique, les mécanismes d'expression des gènes et les principes et les techniques de génie génétique, dans le but de les utiliser dans la compréhension et l'explication des phénomènes de l'hérédité chez les êtres vivants ;" }
  - { page: 2, libelle: "Acquérir des connaissances sur la transmission de l'information génétique par la reproduction sexuée et sur la génétique humaine, et utiliser ces connaissances pour résoudre des problèmes liés à la transmission des caractères héréditaires et pour sensibiliser les apprenants aux maladies héréditaires afin de prendre les précautions nécessaires vis-à-vis de ces maladies ;" }
  - { page: 2, libelle: "Acquérir des connaissances de base sur la génétique des populations et sur l'importance des facteurs de l'évolution dans la stabilité de la structure génétique de la population et de son équilibre avec son milieu de vie ;" }
  - { page: 2, libelle: "Approfondir les connaissances sur le fonctionnement et les dysfonctionnements du système immunitaire, et sur les moyens mis en place pour le renforcer. Utiliser ces connaissances pour comprendre les problèmes liés à l'immunité afin de prendre les précautions nécessaires pour éviter les risques qui en résultent pour la santé ;" }
  - { page: 2, libelle: "Acquérir des connaissances sur les phénomènes géologiques liés à la formation des chaines de montagnes (déformations, métamorphisme, granitisation) et être capable de situer ces phénomènes dans l'espace et dans le temps dans le contexte de la tectonique des plaques ;" }
  - { page: 2, libelle: "Adopter une démarche scientifique convenable pour aborder quelques problèmes liés à la consommation de la matière organique et au flux d'énergie au niveau de la cellule, ainsi qu'à la génétique, à l'immunologie et aux phénomènes géologiques accompagnant la formation des chaines de montagnes ;" }
  - { page: 2, libelle: "Utiliser les différents modes d'expression (orale, écrite et graphique) pour communiquer et représenter les phénomènes liés à la consommation de la matière organique et au flux d'énergie à l'intérieur de la cellule, ainsi qu'à la génétique, à l'immunologie et aux phénomènes géologiques accompagnant la formation des chaines de montagnes ;" }
  - { page: 2, libelle: "Utiliser correctement le matériel de laboratoire et les technologies de l'information et de la communication dans la collecte et le traitement des données relatives à la consommation de la matière organique et au flux d'énergie au niveau de la cellule, ainsi qu'à la génétique, à l'immunologie et aux phénomènes géologiques accompagnant la formation des chaines de montagnes." }

epreuve:
  # Le document ne donne ni durée ni coefficient : voir examen.yaml (en-têtes des sujets NS 32F :
  # 3 h, coefficient 7 ; relu sur NS 32F 2024 et sur le corrigé 2026, cf. docs/bible/sources/verification-svt.md).
  materiel: "Matériel d'écriture et de dessin : des stylos, des crayons, une règle, une gomme et une taille crayons ; Une calculatrice non programmable ; Du papier millimétré."
  materiel_page: 23
  structure:
    - { partie: "I", points: 5, page: 23, intitule: "Partie I : Restitution des connaissances", contenu: "Elle vise à examiner le degré de maitrise des connaissances en utilisant : Les questions à choix multiples (QCM) ; Les questions à alternative (vrai ou faux); Les questions à appariement; Les questions de sériation et de classification; Les questions à réponses courtes (définir ; légender un schéma ou un graphique ; connaitre des théories, des lois, des termes scientifiques, des faits, des signes …). Cette partie évalue chez l'apprenant l'un des principaux domaines suivants : 1. Consommation de la matière organique et flux d'énergie ; 2. Nature de l'information génétique et mécanisme de son expression et le génie génétique ; 3. Transmission de l'information génétique par reproduction sexuée – La génétique humaine. 4. Génétique des populations. 5. Immunologie ; 6. Phénomènes géologiques accompagnant la formation des chaines de montagnes et leur relation avec la tectonique des plaques." }
    - partie: "II"
      points: 15
      page: 23
      intitule: "Partie II : Raisonnement scientifique et communication écrite et graphique"
      contenu: "Elle comporte 3 ou 4 exercices"
      cas:
        - cas: "1er cas : la partie I évalue l'un des principaux domaines de la génétique."
          exercices:
            - { exercice: "Exercice 1 : lié à la consommation de la matière et flux d'énergie", points: "3" }
            - { exercice: "Exercice 2 : lié à un ou à deux domaines de la génétique qui ne sont pas évalués dans la partie I", points: "5" }
            - { exercice: "Exercice 3 : lié à l'immunologie", points: "De 3 à 4" }
            - { exercice: "Exercice 4 : lié aux phénomènes géologiques accompagnant la formation des chaines de montagne et leur relation avec la tectonique des plaques", points: "De 3 à 4" }
        - cas: "2ème cas : la partie I évalue l'un des principaux domaines non liés à la génétique."
          exercices:
            - { exercice: "Un ou deux exercices liés à deux ou à trois domaines de la génétique", points: "9" }
            - { exercice: "Deux exercices ; chacun d'eux recouvre l'un des deux domaines non évalués dans la partie I", points: "6" }
  habiletes:
    - nom: "La restitution des connaissances."
      poids: 25
      page: 20
      detail: "La partie de la restitution des connaissances vise à évaluer, chez l'apprenant, le degré de maitrise de connaissance en utilisant : les questions à choix multiples (QCM) ; Les questions à alternative (vrai ou faux); les questions à appariement; Les questions de sériation et de classification; les questions à réponses courtes (définir ; légender un schéma ou un graphique ; connaitre des théories, des lois, des termes scientifiques, des faits, des signes …)"
    - nom: "Raisonnement scientifique et communication graphique et écrite."
      poids: 75
      page: 20
      detail: "La partie du raisonnement scientifique et communication graphique et écrite vise à évaluer, chez l'apprenant, le degré de maitrise des habiletés et des aptitudes suivantes :"
      aptitudes:
        - "Déterminer et formuler un problème scientifique ;"
        - "Utiliser des connaissances, sélectionner et organiser des informations en relation avec le sujet d'étude ;"
        - "Relier les informations avec les acquis pour résoudre le problème scientifique posé ;"
        - "Proposer et formuler une ou des hypothèses en relation avec le problème scientifique ;"
        - "Mobiliser des informations pour résoudre le problème scientifique posé ou pour expliquer des phénomènes, objet d'étude ;"
        - "Proposer les outils adéquats pour vérifier l'hypothèse ;"
        - "Décrire et analyser des données scientifiques ;"
        - "Comparer et expliquer/interpréter des résultats ;"
        - "Déduire et généraliser;"
        - "Utiliser des principes, des lois, des modèles pour expliquer /interpréter les phénomènes et les données scientifiques."
        - "Réaliser une synthèse des informations et des données sous forme de texte ou de schéma ;"
        - "Exprimer une opinion et l'argumenter ;"
        - "Représenter une structure ou un phénomène biologique ou géologique par un schéma ;"
        - "Traduire des données numériques sous forme de tableau ou de graphique ou de texte ;"
        - "Réaliser un schéma fonctionnel ;"
        - "Réaliser un schéma de synthèse."
