              - { id: "1.4.2.6", page: 9, notions_app: [lois-de-newton], libelle: "Appliquer la deuxième loi de Newton pour établir l'équation différentielle du mouvement du centre d'inertie d'un système sur un plan horizontal ou incliné et déterminer les grandeurs cinématiques et dynamiques caractéristiques du mouvement." }
              - { id: "1.4.2.7", page: 9, notions_app: [chute-mouvements-plans], libelle: "Exploiter un document représentant la trajectoire d'un projectile dans un champ de pesanteur uniforme pour : * déterminer le type du mouvement (plan) ; * représenter les vecteurs vitesse et accélération ; * déterminer les conditions initiales et quelques paramètres caractérisant le mouvement." }
              - { id: "1.4.2.8", page: 9, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton dans le cas d'un projectile pour : * établir les équations différentielles du mouvement ; * en déduire les équations horaires du mouvement et les exploiter ; * trouver l'équation de la trajectoire et établir les expressions de la portée et la flèche et les exploiter." }
