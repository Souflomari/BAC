              - { id: "1.4.2.2", page: 9, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton pour établir l'équation différentielle du mouvement du centre d'inertie d'un solide en chute libre verticale et la résoudre." }
              - { id: "1.4.2.3", page: 9, notions_app: [chute-mouvements-plans], libelle: "Connaître et exploiter les caractéristiques du mouvement rectiligne uniformément varié et ses équations horaires." }
