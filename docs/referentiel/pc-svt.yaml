            page: 12
            capacites:
              - { id: "2.3.6.1", page: 12, notions_app: [evolution-spontanee], libelle: "Calculer la valeur du quotient de réaction Qr d'un système chimique dans un état donné." }
              - { id: "2.3.6.2", page: 12, notions_app: [evolution-spontanee], libelle: "Déterminer le sens d'évolution spontanée d'un système chimique." }
          - id: "2.3.7"
            nom: "7-Transformations spontanées dans les piles et récupération de l'énergie"
            page: 12
            capacites:
              - { id: "2.3.7.1", page: 12, notions_app: [piles], libelle: "Schématiser une pile (schéma conventionnel, schéma)" }
              - { id: "2.3.7.2", page: 12, notions_app: [piles], libelle: "Déterminer le sens de déplacement des porteurs de charges dans une pile en utilisant le critère d'évolution spontanée." }
              - { id: "2.3.7.3", page: 12, notions_app: [piles], libelle: "Interpréter le fonctionnement d'une pile en disposant d'une information parmi les suivantes : le sens de du courant électrique, la f.é.m, les réactions aux électrodes, la polarité des électrodes ou le mouvement des porteurs de charges.", note: "« le sens de du courant » [sic]" }
              - { id: "2.3.7.4", page: 12, notions_app: [piles], libelle: "Écrire les équations des réactions aux électrodes (avec double flèche) et l'équation bilan lors du fonctionnement de la pile (avec une seule flèche)." }
              - { id: "2.3.7.5", page: 12, notions_app: [piles], libelle: "Établir la relation entre les quantités de matière des espèces formées ou consommées, l'intensité du courant et la durée de fonctionnement de la pile. Exploiter cette relation pour déterminer d'autres grandeurs (quantité d'électricité, l'avancement de la réaction, variation de masse…)." }
      - id: "2.4"
