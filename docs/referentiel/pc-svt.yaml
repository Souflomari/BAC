notes_de_lecture:
  - "IDENTITÉ DU DOCUMENT [NC]. Couverture : « Filière : Sciences agronomiques » ; pied de page : « Filière : Sciences Agricoles » ; page 4 : « série Sciences Expérimentales - Filière Sciences Agricoles ». Le document ne porte ni « Options internationales » ni « option français » (les cadres PC et SM, si). Son emploi pour la filière SVT (BIOF) repose sur le relais tawjihnet (docs/refonte/01-programme-bac-maroc.md §2.1, §3.5) et sur la cohérence des sujets NS 27F avec lui ; aucun cadre PC intitulé « filière SVT » n'a été trouvé (docs/bible/sources/verification-pc.md)."
  - "Autres traits propres : le ministère s'appelle « Ministère de l'Éducation Nationale du Préscolaire et des Sports » (p. 2) au lieu de « … et de la Formation Professionnelle » (cadres PC et SM) ; numéros de téléphone et de fax du pied de page différents ; listes de capacités encadrées ; PAS D'ANNEXE (ni programme, ni liste de travaux pratiques, ni compétences ciblées : la rubrique « Annexes » de la page 3 des autres cadres est absente). La clé `programme:` est donc absente de ce fichier."
  - "NUMÉROTATION : en physique, chapitres « 1- », « 2- »… qui repartent à 1 dans chaque sous-domaine ; en chimie, chapitres numérotés de 1 à 9 à la suite (« 3- » à « 5- » dans le sous-domaine 2, « 6- » et « 7- » dans le 3, « 8- » et « 9- » dans le 4). Les identifiants gardent ces numéros ; le 4ᵉ chiffre est reconstitué."
  - "201 capacités : physique 138 — 1.1 ondes 28 (7 · 8 · 13) · 1.2 nucléaire 24 (15 · 9) · 1.3 électricité 48 (18 · 16 · 14) · 1.4 mécanique 38 (10 · 8 · 14 · 6) ; chimie 63 — 2.1 (2 · 12) · 2.2 (6 · 5 · 14) · 2.3 (2 · 5) · 2.4 (9 · 8)."
  - "CE QUE LE CADRE N'A PAS, par rapport à pc-pc.yaml : en nucléaire, la fission et la fusion (pas de « Définir la fission et la fusion », ni de lecture de la courbe d'Aston pour leur intérêt énergétique, ni d'équations de fission / fusion, ni de « Reconnaître le type de réaction nucléaire ») ; en électricité, tout le chapitre « Applications » (ondes électromagnétiques, modulation et démodulation d'amplitude) et les tirets « Etablir l'expression de l'énergie » emmagasinée dans le condensateur et dans la bobine (seul « Connaître et exploiter » reste) ; en mécanique, le frottement fluide et la chute verticale avec frottement, la méthode d'Euler, la force de Lorentz et la particule chargée, les lois de Kepler, la gravitation et les satellites, toute la rotation autour d'un axe fixe, le pendule de torsion, le pendule pesant et le pendule simple, l'atome et la mécanique de Newton ; le ressort n'est étudié qu'« en position horizontale » (1.4.3.7 à 1.4.3.11) ; en chimie, les chocs efficaces, la conductivité / pression / volume parmi les courbes de suivi, et tout le chapitre des transformations forcées (électrolyse)."
  - "CE QUE LE CADRE A EN PLUS (par rapport à pc-pc.yaml) : « l'état de vibration d'un point par rapport à un autre point » et « une amplitude » parmi ce qu'on détermine sur des documents (1.1.1.6) ; « Reconnaître l'intérêt d'un montage mettant en jeu un dipôle RC » (1.3.1.15) et « … un dipôle RL » (1.3.2.13) ; « Connaître les facteurs cinétiques : concentration des réactifs et température » (2.1.2.6) et leur influence sur le temps de demi-réaction (2.1.2.12) ; « l'influence de la dilution sur le taux d'avancement final » (2.2.3.6) ; « Représenter et exploiter le diagramme de prédominance » (2.2.5.9, sans « et de distribution ») ; « l'expression de la constante d'équilibre K » de l'estérification et de l'hydrolyse (2.4.8.6)."
  - "LE CIRCUIT RLC SÉRIE EST AU PROGRAMME (oscillations libres et entretenues, 14 tirets, p. 8) : docs/refonte/01-programme-bac-maroc.md §3.5 ne l'exclut pas mais ne le cite pas non plus parmi les contenus ; la résonance mécanique (excitateur, résonateur) aussi (1.4.3.13-14)."
  - "Variantes de mots (même sens) : « l'établissement et la rupture du courant » (1.3.2.8 ; PC : « disparition ») ; « 1 Bq représente » (1.2.1.11 ; PC : « est égal à ») ; « types de résonance » (1.4.3.14 ; PC : « régimes ») ; « Exploiter cette relation » (2.3.7.5 ; PC : « Utiliser »)."
