# Cadre de référence 2025 — Physique-Chimie — Sciences Expérimentales, filière « Sciences agronomiques »
# (« Sciences Agricoles » en pied de page), DONNÉ POUR LA FILIÈRE SVT. Transcription mot pour mot,
# relue sur les 15 pages scannées le 2026-10-22. Format : README.md, avec le niveau « chapitres » de
# pc-pc.yaml. Identifiant = domaine.sous-domaine.chapitre.rang ; en physique, les chapitres repartent
# à 1 dans chaque sous-domaine ; EN CHIMIE, CE DOCUMENT NUMÉROTE SES CHAPITRES DE 1 À 9 À LA SUITE
# (sous-domaine 2 = chapitres 3, 4, 5 ; sous-domaine 3 = 6, 7 ; sous-domaine 4 = 8, 9) : les
# identifiants gardent ces numéros (`pc-svt 2.2.5.3` = 3ᵉ tiret du chapitre « 5- » du sous-domaine 2).
# ATTENTION : ce document ne porte PAS la mention « Options internationales / option français » des
# deux autres cadres PC ; son rattachement à la filière SVT (BIOF) repose sur la liste relayée par
# tawjihnet (docs/refonte/01-programme-bac-maroc.md §2.1, §3.5) [NC] — voir notes_de_lecture.
# `notions_app` est NOTRE correspondance avec les dossiers content/pc/ (pas le document).

