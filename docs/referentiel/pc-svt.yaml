              - { id: "2.4.9.5", page: 13, notions_app: [controle-catalyse], libelle: "Connaître les caractéristiques de la réaction d'un anhydride d'acide avec un alcool (rapide et totale)." }
              - { id: "2.4.9.6", page: 13, notions_app: [controle-catalyse], libelle: "Calculer le rendement d'une transformation chimique." }
              - { id: "2.4.9.7", page: 13, notions_app: [controle-catalyse], libelle: "Reconnaître la partie hydrophile et la partie hydrophobe d'un ion carboxylate à chaîne longue." }
