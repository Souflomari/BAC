            capacites:
              - { id: "2.4.8.1", page: 12, notions_app: [esterification-hydrolyse], libelle: "Reconnaître dans la formule d'une espèce chimique organique les groupes caractéristiques : –OH (hydroxyle) ; –CO2H (carboxyle) ; –CO2R (ester) ; –CO–O–CO– (anhydride)." }
              - { id: "2.4.8.2", page: 12, notions_app: [esterification-hydrolyse], libelle: "Écrire les équations des réactions d'estérification et d'hydrolyse." }
              - { id: "2.4.8.3", page: 12, notions_app: [esterification-hydrolyse], libelle: "Retrouver, à partir de la formule semi-développée de l'ester, les formules de l'acide carboxylique et de l'alcool correspondants." }
              - { id: "2.4.8.4", page: 12, notions_app: [esterification-hydrolyse], libelle: "Nommer les esters comportant cinq atomes de carbone au maximum." }
              - { id: "2.4.8.5", page: 12, notions_app: [esterification-hydrolyse], libelle: "Connaître les caractéristiques des réactions d'estérification et d'hydrolyse (lentes et limitées)." }
              - { id: "2.4.8.6", page: 12, notions_app: [esterification-hydrolyse], libelle: "Écrire et exploiter l'expression de la constante d'équilibre K correspondant aux équations des réactions d'estérification et d'hydrolyse." }
              - { id: "2.4.8.7", page: 12, notions_app: [esterification-hydrolyse], libelle: "Savoir que le catalyseur est une espèce qui augmente la vitesse d'une réaction chimique sans modifier l'état d'équilibre du système." }
              - { id: "2.4.8.8", page: 12, notions_app: [esterification-hydrolyse], libelle: "Savoir que la présence de l'un des réactifs en excès ou l'élimination de l'un des produits déplace l'état d'équilibre du système dans le sens direct." }
              - { id: "2.4.8.9", page: 12, notions_app: [esterification-hydrolyse], libelle: "Déterminer la composition du mélange réactionnel à un instant donné." }
