    - { page: 4, libelle: "L'épreuve de l'examen national de Physique Chimie, série Sciences Expérimentales - Filière Sciences Agricoles, se compose de 3 ou 4 exercices thématiques." }
  exercices: "3 ou 4 exercices thématiques"
  duree_h: 3
  duree_page: 4
  # Le document ne donne pas de coefficient : voir examen.yaml (en-têtes des sujets NS 27F : coefficient 5).
  materiel: "une calculatrice scientifique non programmable ; de quoi écrire et de quoi dessiner."
