              - { id: "1.4.3.11", page: 10, notions_app: [systemes-oscillants], libelle: "Connaître et exploiter l'expression de la période propre et la fréquence propre du système oscillant (corps solide-ressort horizontal)." }
              - { id: "1.4.3.12", page: 10, notions_app: [systemes-oscillants], libelle: "Déterminer les deux types d'amortissement (solide et fluide) à partir des formes des diagrammes d'espace x_G(t)." }
              - { id: "1.4.3.13", page: 10, notions_app: [systemes-oscillants], libelle: "Reconnaître l'excitateur, le résonateur et le phénomène de résonance mécanique ainsi que les conditions de sa production." }
              - { id: "1.4.3.14", page: 10, notions_app: [systemes-oscillants], libelle: "Reconnaître l'influence de l'amortissement sur les types de résonance." }
