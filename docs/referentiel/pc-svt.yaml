    page: 4
    items: ["QCM (questions à choix multiple) ; Vrai/Faux ; appariement… ;", "Questions à courte réponse ; questions à développement ;", "Questions de synthèse ; questions complexes (dont la solution nécessite la mobilisation de savoirs et savoir-faire en rapport avec un ou plusieurs domaines)."]
  contenus_couverts:
    page: 4
    libelle: "L'épreuve de l'examen national de baccalauréat en Physique - Chimie couvre les contenus du programme indiqués ci-dessous."
    physique: ["Ondes", "Transformations nucléaires", "Électricité", "Mécanique"]
    chimie: ["Transformations rapides et transformations lentes d'un système chimique", "Transformations non totales d'un système chimique", "Sens d'évolution d'un système chimique", "Méthode de contrôle de l'évolution des systèmes chimiques"]
  # Pages 13-14, « 3-Tableau des niveaux d'habileté, leurs composantes et leur poids ».
  habiletes:
    - nom: "Utilisation des ressources (Connaissances et savoir-faire)"
      poids: 60
      page: 13
      composantes: ["Connaître et utiliser : les symboles - les conventions - les unités - l'ordre de grandeur - les définitions - les lois - les principes - les modèles - les formules - les relations…", "Décrire et expliquer un phénomène.", "Prévoir l'évolution d'un phénomène physique ou d'un système chimique."]
    - nom: "Application d'une solution expérimentale"
      poids: 15
      page: 14
      composantes: ["Proposer un protocole expérimental.", "Proposer le schéma d'un montage expérimental.", "Distinguer les différentes parties d'un montage expérimental et déterminer la fonction de chaque partie.", "Exploiter les données expérimentales, les analyser et en tirer des conclusions.", "Prévoir les dangers possibles en situation expérimentale et utiliser les moyens de sécurité adéquats."]
    - nom: "Résolution de problème"
      poids: 25
      page: 14
      composantes: ["Mobiliser les ressources nécessaires.", "Organiser les étapes de résolution.", "Utiliser les outils mathématiques, les courbes et les tableaux.", "Construire une déduction logique ou la prouver.", "Décrire et analyser des données ou résultats scientifiques ; présenter des conclusions pratiques.", "Donner une opinion ou émettre un avis critique"]
  # Pages 14-15, « 4-Tableau de spécification ». « Application d'une solution expérimentale » :
  # cellule fusionnée, 10 % pour la physique, 5 % pour la chimie.
  specification:
    page: 14
    lignes:
