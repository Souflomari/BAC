              - { id: "1.3.3.4", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter l'expression de la charge q(t), de la tension u_C(t) et en déduire l'expression de l'intensité i(t) passant dans le circuit et l'exploiter dans le cas d'un amortissement négligeable." }
              - { id: "1.3.3.5", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter l'expression de la période propre." }
              - { id: "1.3.3.6", page: 8, notions_app: [rlc-serie], libelle: "Expliquer, du point de vue énergétique, les trois régimes." }
              - { id: "1.3.3.7", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter les diagrammes d'énergie." }
              - { id: "1.3.3.8", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter l'expression de l'énergie totale du circuit." }
              - { id: "1.3.3.9", page: 8, notions_app: [rlc-serie], libelle: "Établir l'équation différentielle vérifiée par la tension aux bornes du condensateur ou par sa charge dans le cas d'amortissement." }
              - { id: "1.3.3.10", page: 8, notions_app: [rlc-serie], libelle: "Connaître le rôle du dispositif d'entretien d'oscillations, qui consiste à compenser l'énergie dissipée par effet Joule dans le circuit." }
              - { id: "1.3.3.11", page: 8, notions_app: [rlc-serie], libelle: "Établir l'équation différentielle vérifiée par la tension aux bornes du condensateur ou par sa charge q(t) dans le cas d'un circuit RLC entretenu par l'utilisation d'un générateur délivrant une tension proportionnelle à l'intensité : u_G(t) = k.i(t)." }
