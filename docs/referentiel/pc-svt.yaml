              - { id: "1.4.1.4", page: 9, notions_app: [lois-de-newton], libelle: "Exploiter le produit a⃗.v⃗ pour déterminer la nature du mouvement (accéléré - retardé)." }
              - { id: "1.4.1.5", page: 9, notions_app: [lois-de-newton], libelle: "Connaître le référentiel galiléen." }
