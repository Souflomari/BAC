              - { id: "1.4.3.3", page: 9, notions_app: [systemes-oscillants], libelle: "Reconnaître l'amortissement des oscillations, ses différents types et ses régimes." }
              - { id: "1.4.3.4", page: 9, notions_app: [systemes-oscillants], libelle: "Connaître que dans le cas d'un amortissement faible (régime pseudopériodique), la pseudo-période est voisine de la période propre" }
              - { id: "1.4.3.5", page: 9, notions_app: [systemes-oscillants], libelle: "Connaître les caractéristiques de la force de rappel exercée par un ressort sur un solide en mouvement." }
              - { id: "1.4.3.6", page: 9, notions_app: [systemes-oscillants], libelle: "Exploiter les courbes : x_G(t), v_G(t) et a_G(t)." }
