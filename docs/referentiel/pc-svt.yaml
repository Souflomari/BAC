              - { id: "1.4.3.8", page: 10, notions_app: [systemes-oscillants], libelle: "Déterminer la nature du mouvement du système oscillant (corps solide-ressort horizontal) et écrire les équations x_G(t), v_G(t) = dx/dt et ẍ_G(t) et les exploiter.", note: "point de dérivation imprimé comme un glyphe manquant ; restitué" }
