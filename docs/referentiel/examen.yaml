    pc: { coefficient: 5, duree_h: 3 }
    svt: { coefficient: 7, duree_h: 3 }
    philosophie: { coefficient: 2, duree_h: 2 }
    anglais: { coefficient: 2, duree_h: 2 }
somme_des_coefficients: 23

