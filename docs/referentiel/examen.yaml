    maths: { coefficient: 9, duree_h: 4 }
    pc: { coefficient: 7, duree_h: 4 }
    sciences_ingenieur: { coefficient: 3, duree_h: 3, source: "SEC (9rayti) pour le coefficient ; durée OFF (Guide 2022, annexe 1/8)" }
    philosophie: { coefficient: 2, duree_h: 2 }
    anglais: { coefficient: 2, duree_h: 2 }
  pc:
