# Règles communes de l'examen du baccalauréat (2ème Bac, filières scientifiques)
# Ce que les cadres de référence ne disent pas : la formule de la note, le rattrapage, les
# coefficients et durées (imprimés sur les sujets), le calendrier. Chaque valeur porte sa source.
# Étiquettes : OFF (document officiel, page), OFF-sujet (en-tête d'un sujet national),
# SEC (source secondaire sérieuse), NC (non confirmé), NT (non trouvé).
# Détails et URL : docs/refonte/01-programme-bac-maroc.md §1, §9.

note:
  formule: "(2 × examen national + examen régional + contrôle continu) / 4"
  poids: { examen_national: 0.50, examen_regional: 0.25, controle_continu: 0.25 }
  source: "OFF — Guide du candidat 2022, p. 6 et 9"
  composante: "moyenne pondérée par les coefficients : Σ note × coef / Σ coef (OFF — Guide 2022, p. 9)"

admission:
  seuil: 10
  condition: "moyenne ≥ 10/20 et aucune note éliminatoire"
  source: "OFF — Guide 2022, p. 9"

rattrapage:
  acces:
    - "moyenne ≥ 7/20 sans note éliminatoire"
    - "ou moyenne ≥ 10/20 avec une note éliminatoire dans une seule matière du national"
    - "ou absence pour force majeure"
  contenu: "toutes les épreuves de l'examen national"
  calcul: "meilleure note de chaque épreuve entre les deux sessions (depuis 2012), si toutes les épreuves des deux sessions ont été passées"
  source: "OFF — Guide 2022, p. 8-9"

note_eliminatoire: { valeur: null, statut: "NC — un forum indique 0/20 ; texte officiel non retrouvé" }
mentions: { seuils: null, statut: "NT — le guide cite AB, B, TB sans seuils" }

# Coefficients et durées, lus sur les en-têtes des sujets nationaux (OFF-sujet, 2014-2024)
