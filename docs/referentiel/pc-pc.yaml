# Cadre de référence 2025 — Physique-Chimie — filière Sciences Physiques (option français)
# Transcription mot pour mot, relue sur les 29 pages scannées le 2026-10-22. Format : README.md, avec
# UN NIVEAU DE PLUS : le document range ses capacités (« savoirs et savoir-faire exigibles ») dans des
# chapitres numérotés (« 1- Dipôle RC ») à l'intérieur de chaque sous-domaine. Identifiant d'une
# capacité = domaine.sous-domaine.chapitre.rang : `pc-pc 1.3.1.7` = 7ᵉ tiret du chapitre « 1- Dipôle RC »
# du « Sous domaine 3 : Electricité » du domaine Physique. Domaines, sous-domaines et chapitres sont
# numérotés par le document ; le rang (4ᵉ chiffre) est l'ordre d'apparition des tirets (reconstitué).
# `notions_app` est NOTRE correspondance avec les dossiers content/pc/ (pas le document).
# Formules : notation linéaire (u_C(t), t_1/2, a⃗.v⃗) ; le document les imprime en notation mathématique.

document:
  titre: "Cadre de référence de l'examen national du baccalauréat — Filières internationales du baccalauréat marocain - 2025 - option français – Discipline : Physique Chimie — Série : Sciences Expérimentales — Filière : Sciences Physiques"
  annee: 2025
  note_ministerielle: "013-25 du 5 février 2025"
  note_ministerielle_source: "non imprimée dans le document ; liste des cadres de la note relayée par tawjihnet (docs/refonte/01-programme-bac-maroc.md §2.1)"
  editeur: "Centre National des examens scolaires et de l'Evaluation des apprentissages"
  pages: 29
  source: "https://drive.google.com/file/d/1-wXw-Htm5DJh3Ln8oJOLDomT7R7a4Bw6/view"
  copie_depot: "docs/cadre/sources/CDR_EXAM_NAT_BAC_25_PC-PC_Op_FR.pdf"
  lu_le: "2026-10-22"
  lecture: "lecture visuelle des 29 pages de la copie du dépôt (scan sans filigrane) ; la copie Drive (même scan, filigrane tawjihnet ajouté) a été comparée page à page (pixels hors bandeaux, et pages 9, 19, 23 relues) : même contenu. Pagination du document = pagination du PDF (« Page N sur 29 »)."
filieres: [pc]
matiere: pc

epreuve:
  # Page 4, « 1.2. Structure de l'épreuve de l'examen national ».
  composantes:
    - { page: 4, libelle: "L'épreuve de l'examen national de Physique Chimie du secondaire qualifiant couvre tout le programme de l'année scolaire et a lieu à la fin de la deuxième année du cycle du baccalauréat." }
    - { page: 4, libelle: "L'épreuve de l'examen national de Physique Chimie, série des sciences expérimentales ; filière sciences physiques, se compose de 3 ou 4 exercices thématiques." }
  exercices: "3 ou 4 exercices thématiques"
  duree_h: 3
  duree_page: 4
  # Le document ne donne pas de coefficient : voir examen.yaml (en-têtes des sujets NS 28F : coefficient 7).
  materiel: "une calculatrice scientifique non programmable ; de quoi écrire et de quoi dessiner."
  materiel_page: 4
  grille_correction: { page: 4, libelle: "Elle doit comprendre le numéro de l'exercice et la note qui lui est attribuée ; les numéros des questions ; les éléments de réponse assignés à chaque question ; la note réservée à chaque question ; une colonne qui mentionne la référence de la question, d'après le cadre de référence." }
  styles_evaluation:
    page: 4
    items: ["QCM (questions à choix multiple) ; Vrai/Faux ; appariement… ;", "questions à courte réponse ; questions à développement;", "questions de synthèse ; questions complexes (dont la solution nécessite la mobilisation de savoirs et savoir-faire en rapport avec un ou plusieurs domaines)."]
  situations_evaluatives:
    - { page: 3, libelle: "Chacun de ces exercices thématiques peut être introduit par une situation évaluative, comme il peut être présenté sous forme de parties indépendantes les unes des autres, avec des questions à difficulté progressive." }
    - { page: 4, libelle: "La situation évaluative peut également contenir des questions qui couvrent les différentes parties du programme." }
  # Page 18, « 3-Tableau des niveaux d'habiletés, leurs composantes et leur poids ».
  habiletes:
    - nom: "Utilisation des ressources (connaissances et savoir-faire)"
      poids: 50
      page: 18
      composantes: ["Connaître et utiliser : les symboles - les conventions - les unités - l'ordre de grandeur - les définitions - les lois - les principes - les modèles - les formules - les relations…", "Décrire et expliquer un phénomène.", "Prévoir l'évolution d'un phénomène physique ou d'un système chimique."]
    - nom: "Application d'une solution expérimentale"
      poids: 15
      page: 18
      composantes: ["Proposer un protocole expérimental.", "Proposer le schéma d'un montage expérimental.", "Distinguer les différentes parties d'un montage expérimental et déterminer la fonction de chaque partie.", "Exploiter les données expérimentales, les analyser et en tirer des conclusions.", "Prévoir les dangers possibles en situation expérimentale et utiliser les moyens de sécurité adéquats."]
    - nom: "Résolution de problème"
      poids: 35
      page: 18
      composantes: ["Mobiliser les ressources nécessaires.", "Organiser les étapes de résolution.", "Utiliser les outils mathématiques, les courbes et les tableaux.", "Construire une déduction logique ou la prouver.", "Décrire et analyser des données ou résultats scientifiques ; présenter des conclusions pratiques.", "Donner une opinion ou émettre un avis critique"]
  # Page 19, « 4-Tableau de spécification » : % de l'épreuve, sous-domaine × niveau d'habileté.
  # La colonne « Application d'une solution expérimentale » est une cellule fusionnée : 10 % pour
  # toute la physique, 5 % pour toute la chimie.
  specification:
    page: 19
    lignes:
      - { sous_domaine: "1.1", nom: "Ondes", utilisation: 5.5, resolution: 3.85, total: 11 }
      - { sous_domaine: "1.2", nom: "Transformations nucléaires", utilisation: 4, resolution: 2.80, total: 8 }
      - { sous_domaine: "1.3", nom: "Electricité", utilisation: 10.5, resolution: 7.35, total: 21 }
      - { sous_domaine: "1.4", nom: "Mécanique", utilisation: 13.5, resolution: 9.45, total: 27 }
      - { sous_domaine: "2.1", nom: "Transformations rapides et transformation lentes d'un système chimique", utilisation: 3, resolution: 2.10, total: 6 }
      - { sous_domaine: "2.2", nom: "Transformations non totales d'un système chimique", utilisation: 5, resolution: 3.5, total: 10 }
      - { sous_domaine: "2.3", nom: "Sens d'évolution d'un système chimique", utilisation: 5, resolution: 3.5, total: 10 }
      - { sous_domaine: "2.4", nom: "Méthode de contrôle de l'évolution des systèmes chimiques", utilisation: 3.5, resolution: 2.45, total: 7 }
    application_experimentale: { physique: 10, chimie: 5 }
    totaux: { utilisation: 50, application: 15, resolution: 35, total: 100 }

# Poids des sous-domaines : « Domaines des contenus et leur poids », page 18 (repris page 19).
# Le document n'imprime pas de poids par domaine principal ; la somme des sous-domaines donne
# physique 67 %, chimie 33 % (calcul, non imprimé).

domaines:
  - id: "1"
    nom: "PREMIER DOMAINE PRINCIPAL : PHYSIQUE"
    sous_domaines:
      - id: "1.1"
        nom: "Sous domaine 1 : Ondes"
        poids: 11
        poids_page: 18
        chapitres:
          - id: "1.1.1"
            nom: "1- Ondes mécaniques progressives"
            page: 5
            capacites:
              - { id: "1.1.1.1", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Définir une onde mécanique et sa célérité." }
              - { id: "1.1.1.2", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Définir une onde transversale et une onde longitudinale." }
              - { id: "1.1.1.3", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Définir une onde progressive." }
              - { id: "1.1.1.4", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Connaître la relation entre l'élongation d'un point du milieu de propagation et l'élongation de la source : y_M(t) = y_S(t − τ)." }
              - { id: "1.1.1.5", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Exploiter la relation entre le retard temporel, la distance et la célérité." }
              - { id: "1.1.1.6", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Exploiter des documents expérimentaux et des données pour déterminer : * une distance * un retard temporel. * une célérité." }
              - { id: "1.1.1.7", page: 5, notions_app: [ondes-mecaniques-progressives], libelle: "Proposer le schéma d'un montage expérimental permettant la mesure du retard temporel ou de déterminer la célérité lors de la propagation d'une onde." }
          - id: "1.1.2"
            nom: "2- Ondes mécaniques progressives périodiques"
            page: 5
            capacites:
              - { id: "1.1.2.1", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Reconnaître une onde progressive périodique et sa période." }
              - { id: "1.1.2.2", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Définir une onde progressive sinusoïdale, la période, la fréquence et la longueur d'onde." }
              - { id: "1.1.2.3", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Connaître et exploiter la relation λ = v.T ." }
              - { id: "1.1.2.4", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Connaître la condition d'obtention du phénomène de diffraction : dimension de l'ouverture inférieure ou égale à la longueur d'onde." }
              - { id: "1.1.2.5", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Connaître les caractéristiques de l'onde diffractée." }
              - { id: "1.1.2.6", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Définir un milieu dispersif." }
              - { id: "1.1.2.7", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Exploiter des documents expérimentaux pour reconnaître le phénomène de diffraction et mettre en évidence les caractéristiques de l'onde diffractée." }
              - { id: "1.1.2.8", page: 5, notions_app: [ondes-mecaniques-periodiques], libelle: "Proposer le schéma d'un montage expérimental permettant de mettre en évidence le phénomène de diffraction dans le cas des ondes mécaniques sonores et ultrasonores." }
          - id: "1.1.3"
            nom: "3- Propagation d'une onde lumineuse"
            page: 5
            capacites:
              - { id: "1.1.3.1", page: 5, notions_app: [propagation-onde-lumineuse], libelle: "Savoir que la lumière a un aspect ondulatoire, en se basant sur le phénomène de diffraction." }
              - { id: "1.1.3.2", page: 5, notions_app: [propagation-onde-lumineuse], libelle: "Connaître l'influence de la dimension de l'ouverture ou de l'obstacle sur le phénomène de diffraction." }
              - { id: "1.1.3.3", page: 5, notions_app: [propagation-onde-lumineuse], libelle: "Exploiter un document ou une figure de diffraction dans le cas des ondes lumineuses." }
              - { id: "1.1.3.4", page: 5, notions_app: [propagation-onde-lumineuse], libelle: "Connaître et exploiter la relation λ = c / ν." }
              - { id: "1.1.3.5", page: 5, notions_app: [propagation-onde-lumineuse], libelle: "Définir une lumière monochromatique et une lumière polychromatique." }
              - { id: "1.1.3.6", page: 5, notions_app: [propagation-onde-lumineuse], libelle: "Connaître les limites des longueurs d'onde dans le vide du spectre visible et les couleurs correspondantes." }
              - { id: "1.1.3.7", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Savoir que la fréquence d'une radiation monochromatique ne change pas lorsqu'elle passe d'un milieu transparent à un autre." }
              - { id: "1.1.3.8", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Savoir que les milieux transparents sont plus ou moins dispersifs." }
              - { id: "1.1.3.9", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Connaître et exploiter la relation n = c / v ." }
              - { id: "1.1.3.10", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Déterminer l'indice de réfraction d'un milieu transparent pour une fréquence donnée." }
              - { id: "1.1.3.11", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Proposer le schéma d'un montage expérimental permettant de mettre en évidence le phénomène de diffraction dans le cas des ondes lumineuses." }
              - { id: "1.1.3.12", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Connaître et exploiter la relation θ = λ/a et connaitre l'unité et la signification de θ et λ." }
              - { id: "1.1.3.13", page: 6, notions_app: [propagation-onde-lumineuse], libelle: "Exploiter des mesures expérimentales pour vérifier la relation θ = λ/a ." }
      - id: "1.2"
        nom: "Sous domaine 2 : Transformation nucléaires"
        poids: 8
        poids_page: 18
        chapitres:
          - id: "1.2.1"
            nom: "1- Décroissance radioactive"
            page: 6
            capacites:
              - { id: "1.2.1.1", page: 6, notions_app: [decroissance-radioactive], libelle: "Connaître la signification du symbole ᴬ_Z X et donner la composition du noyau correspondant." }
              - { id: "1.2.1.2", page: 6, notions_app: [decroissance-radioactive], libelle: "Reconnaître les isotopes d'un élément chimique." }
              - { id: "1.2.1.3", page: 6, notions_app: [decroissance-radioactive], libelle: "Reconnaître les domaines de stabilité et d'instabilité des noyaux sur le diagramme (N, Z)." }
              - { id: "1.2.1.4", page: 6, notions_app: [decroissance-radioactive], libelle: "Exploiter le diagramme (N, Z)." }
              - { id: "1.2.1.5", page: 6, notions_app: [decroissance-radioactive], libelle: "Définir un noyau radioactif." }
              - { id: "1.2.1.6", page: 6, notions_app: [decroissance-radioactive], libelle: "Connaître et exploiter les deux lois de conservation." }
              - { id: "1.2.1.7", page: 6, notions_app: [decroissance-radioactive], libelle: "Définir les radioactivités α , β⁺ , β⁻ et l'émission γ ." }
              - { id: "1.2.1.8", page: 6, notions_app: [decroissance-radioactive], libelle: "Ecrire l'équation d'une réaction nucléaire en appliquant les deux lois de conservation." }
              - { id: "1.2.1.9", page: 6, notions_app: [decroissance-radioactive], libelle: "Reconnaître le type de radioactivité à partir de l'équation d'une réaction nucléaire." }
              - { id: "1.2.1.10", page: 6, notions_app: [decroissance-radioactive], libelle: "Connaître et exploiter la loi de décroissance radioactive et exploiter sa courbe correspondante." }
              - { id: "1.2.1.11", page: 6, notions_app: [decroissance-radioactive], libelle: "Savoir que 1 Bq est égal à une désintégration par seconde." }
              - { id: "1.2.1.12", page: 6, notions_app: [decroissance-radioactive], libelle: "Définir de la constante de temps τ et la demi-vie t_1/2 .", note: "« Définir de la » [sic]" }
              - { id: "1.2.1.13", page: 6, notions_app: [decroissance-radioactive], libelle: "Exploiter les relations entre τ, λ et t_1/2 ." }
              - { id: "1.2.1.14", page: 6, notions_app: [decroissance-radioactive], libelle: "Utiliser l'équation aux dimensions pour déterminer les unités de λ et τ ." }
              - { id: "1.2.1.15", page: 6, notions_app: [decroissance-radioactive], libelle: "Déterminer le radioélément convenable pour dater un événement donné." }
          - id: "1.2.2"
            nom: "2- Noyaux- Masse et énergie"
            page: 6
            capacites:
              - { id: "1.2.2.1", page: 6, notions_app: [noyaux-masse-energie], libelle: "Définir et calculer le défaut de masse et l'énergie de liaison." }
              - { id: "1.2.2.2", page: 6, notions_app: [noyaux-masse-energie], libelle: "Définir et calculer l'énergie de liaison par nucléon et l'exploiter." }
              - { id: "1.2.2.3", page: 6, notions_app: [noyaux-masse-energie], libelle: "Utiliser les différentes unités de masse et d'énergie et les relations entre ces unités." }
              - { id: "1.2.2.4", page: 6, notions_app: [noyaux-masse-energie], libelle: "Exploiter la courbe d'Aston pour identifier les noyaux les plus stables." }
              - { id: "1.2.2.5", page: 6, notions_app: [noyaux-masse-energie], libelle: "Connaître la relation d'équivalence masse-énergie et calculer l'énergie de masse." }
              - { id: "1.2.2.6", page: 6, notions_app: [noyaux-masse-energie], libelle: "Définir la fission et la fusion." }
              - { id: "1.2.2.7", page: 6, notions_app: [noyaux-masse-energie], libelle: "Analyser la courbe d'Aston pour dégager l'intérêt énergétique de la fission et la fusion." }
              - { id: "1.2.2.8", page: 6, notions_app: [noyaux-masse-energie], libelle: "Ecrire les équations des réactions nucléaires de fission et de fusion en appliquant les deux lois de conservation." }
              - { id: "1.2.2.9", page: 6, notions_app: [noyaux-masse-energie], libelle: "Reconnaître le type de réaction nucléaire à partir de l'équation de la réaction." }
              - { id: "1.2.2.10", page: 6, notions_app: [noyaux-masse-energie], libelle: "Faire le bilan énergétique ΔE d'une réaction nucléaire en utilisant : les énergies de masse ; les énergies de liaisons ; le diagramme d'énergie." }
              - { id: "1.2.2.11", page: 6, notions_app: [noyaux-masse-energie], libelle: "Calculer l'énergie libérée (produite) par une réaction nucléaire : E_libérée = |ΔE| ." }
              - { id: "1.2.2.12", page: 6, notions_app: [noyaux-masse-energie], libelle: "Reconnaître quelques applications de la radioactivité." }
              - { id: "1.2.2.13", page: 7, notions_app: [noyaux-masse-energie], libelle: "Connaître quelques dangers de la radioactivité." }
      - id: "1.3"
        nom: "Sous domaine 3 : Electricité"
        poids: 21
        poids_page: 18
        chapitres:
          - id: "1.3.1"
            nom: "1- Dipôle RC"
            page: 7
            capacites:
              - { id: "1.3.1.1", page: 7, notions_app: [rc-charge], libelle: "Représenter les tensions u_R et u_C en convention récepteur et préciser les signes des charges des deux armatures d'un condensateur." }
              - { id: "1.3.1.2", page: 7, notions_app: [rc-charge], libelle: "Connaître et exploiter la relation i = dq/dt pour un condensateur en convention récepteur." }
              - { id: "1.3.1.3", page: 7, notions_app: [rc-charge], libelle: "Connaitre et exploiter la relation q = C.u." }
              - { id: "1.3.1.4", page: 7, notions_app: [rc-charge], libelle: "Connaître la capacité d'un condensateur, son unité F et ses sous multiples µF, nF et pF ." }
              - { id: "1.3.1.5", page: 7, notions_app: [rc-charge], libelle: "Déterminer la capacité d'un condensateur graphiquement et par calcul." }
              - { id: "1.3.1.6", page: 7, notions_app: [rc-charge], libelle: "Connaitre la capacité du condensateur équivalent des montages en série et en parallèle, et l'intérêt de chaque montage." }
              - { id: "1.3.1.7", page: 7, notions_app: [rc-charge], libelle: "Etablir l'équation différentielle et vérifier sa solution lorsque le dipôle RC est soumis à un échelon de tension." }
              - { id: "1.3.1.8", page: 7, notions_app: [rc-charge], libelle: "Déterminer l'expression de la tension u_C(t) aux bornes du condensateur lorsque le dipôle RC est soumis à un échelon de tension, et en déduire l'expression de l'intensité du courant dans le circuit et l'expression de la charge du condensateur." }
              - { id: "1.3.1.9", page: 7, notions_app: [rc-charge], libelle: "Reconnaître et représenter les courbes de variation en fonction du temps, de la tension u_C(t) aux bornes du condensateur et les différentes grandeurs qui lui sont liées, et les exploiter." }
              - { id: "1.3.1.10", page: 7, notions_app: [rc-charge], libelle: "Connaitre que la tension aux bornes d'un condensateur est une fonction du temps continue, et que l'intensité est une fonction discontinue à t=0." }
              - { id: "1.3.1.11", page: 7, notions_app: [rc-charge], libelle: "Connaître et exploiter l'expression de la constante de temps." }
              - { id: "1.3.1.12", page: 7, notions_app: [rc-charge], libelle: "Utiliser les équations aux dimensions." }
              - { id: "1.3.1.13", page: 7, notions_app: [rc-charge], libelle: "Exploiter des documents expérimentaux pour : * reconnaître les tensions observées. * mettre en évidence l'influence de R et de C sur les opérations de la charge et de la décharge. * déterminer la constante de temps et la durée de charge. * déterminer le type du régime (transitoire - permanent) et l'intervalle temporel de chacun des deux régimes." }
              - { id: "1.3.1.14", page: 7, notions_app: [rc-charge], libelle: "Proposer le schéma d'un montage expérimental permettant l'étude de la réponse d'un dipôle RC soumis à un échelon de tension." }
              - { id: "1.3.1.15", page: 7, notions_app: [rc-charge], libelle: "Connaître comment brancher un oscilloscope et un système d'acquisition informatisé pour visualiser les différentes tensions." }
              - { id: "1.3.1.16", page: 7, notions_app: [rc-charge], libelle: "Déterminer l'influence de R, de C et de l'amplitude de l'échelon de tension sur la réponse d'un dipôle RC." }
              - { id: "1.3.1.17", page: 7, notions_app: [rc-charge], libelle: "Etablir l'expression de l'énergie électrique emmagasinée dans un condensateur." }
              - { id: "1.3.1.18", page: 7, notions_app: [rc-charge], libelle: "Connaître et exploiter l'expression de l'énergie électrique emmagasinée dans un condensateur." }
          - id: "1.3.2"
            nom: "2- Dipôle RL"
            page: 8
            capacites:
              - { id: "1.3.2.1", page: 8, notions_app: [dipole-rl], libelle: "Représenter les tensions u_R et u_L en convention récepteur." }
              - { id: "1.3.2.2", page: 8, notions_app: [dipole-rl], libelle: "Connaître et exploiter l'expression de la tension u = r.i + L.di/dt aux bornes d'une bobine en convention récepteur." }
              - { id: "1.3.2.3", page: 8, notions_app: [dipole-rl], libelle: "Connaître la signification des grandeurs qui interviennent dans l'expression de la tension u aux bornes d'une bobine et leurs unités." }
              - { id: "1.3.2.4", page: 8, notions_app: [dipole-rl], libelle: "Déterminer les deux caractéristiques d'une bobine (l'inductance L, la résistance r) à partir des résultats expérimentaux." }
              - { id: "1.3.2.5", page: 8, notions_app: [dipole-rl], libelle: "Etablir l'équation différentielle et vérifier sa solution lorsque le dipôle RL est soumis à un échelon de tension." }
              - { id: "1.3.2.6", page: 8, notions_app: [dipole-rl], libelle: "Déterminer l'expression de l'intensité du courant i(t) lorsque le dipôle RL est soumis à un échelon de tension et en déduire l'expression de la tension aux bornes de la bobine et aux bornes du conducteur ohmique." }
              - { id: "1.3.2.7", page: 8, notions_app: [dipole-rl], libelle: "Reconnaître et représenter les courbes de variation, en fonction du temps, de l'intensité du courant i(t) passant dans la bobine et les grandeurs qui lui sont liées et les exploiter." }
              - { id: "1.3.2.8", page: 8, notions_app: [dipole-rl], libelle: "Connaître qu'une bobine retarde l'établissement et la disparition du courant et que l'intensité i(t) est une fonction du temps continue et que la tension entre ses bornes est une fonction discontinue à t=0." }
              - { id: "1.3.2.9", page: 8, notions_app: [dipole-rl], libelle: "Connaître et exploiter l'expression de la constante de temps." }
              - { id: "1.3.2.10", page: 8, notions_app: [dipole-rl], libelle: "Utiliser les équations aux dimensions." }
              - { id: "1.3.2.11", page: 8, notions_app: [dipole-rl], libelle: "Exploiter des documents expérimentaux pour : * reconnaître les tensions observées. * mettre en évidence l'influence de R et de L sur la réponse d'un dipôle RL. * déterminer la constante de temps." }
              - { id: "1.3.2.12", page: 8, notions_app: [dipole-rl], libelle: "Proposer le schéma d'un montage expérimental permettant l'étude de la réponse d'un dipôle RL soumis à un échelon de tension." }
              - { id: "1.3.2.13", page: 8, notions_app: [dipole-rl], libelle: "Connaître comment brancher un oscilloscope et un système d'acquisition informatisé pour visualiser les différentes tensions." }
              - { id: "1.3.2.14", page: 8, notions_app: [dipole-rl], libelle: "Déterminer l'influence de R, de L et de l'amplitude de l'échelon de tension sur la réponse d'un dipôle RL." }
              - { id: "1.3.2.15", page: 8, notions_app: [dipole-rl], libelle: "Etablir l'expression de l'énergie magnétique emmagasinée dans une bobine." }
              - { id: "1.3.2.16", page: 8, notions_app: [dipole-rl], libelle: "Connaître et exploiter l'expression de l'énergie magnétique emmagasinée dans une bobine." }
          - id: "1.3.3"
            nom: "3- Circuit RLC série"
            page: 8
            capacites:
              - { id: "1.3.3.1", page: 8, notions_app: [rlc-serie], libelle: "Définir et reconnaitre les régimes périodique, pseudo-périodique et apériodique." }
              - { id: "1.3.3.2", page: 8, notions_app: [rlc-serie], libelle: "Reconnaître et représenter les courbes de variation de la tension aux bornes du condensateur en fonction du temps pour les trois régimes et les exploiter." }
              - { id: "1.3.3.3", page: 8, notions_app: [rlc-serie], libelle: "Etablir l'équation différentielle pour la tension aux bornes du condensateur ou pour sa charge q(t) dans le cas d'un amortissement négligeable et vérifier sa solution." }
              - { id: "1.3.3.4", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter l'expression de la charge q(t) et en déduire l'expression de l'intensité i(t) passant dans le circuit et l'exploiter." }
              - { id: "1.3.3.5", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter l'expression de la période propre." }
              - { id: "1.3.3.6", page: 8, notions_app: [rlc-serie], libelle: "Expliquer, du point de vue énergétique, les trois régimes." }
              - { id: "1.3.3.7", page: 8, notions_app: [rlc-serie], libelle: "Connaître et exploiter les diagrammes d'énergie." }
              - { id: "1.3.3.8", page: 9, notions_app: [rlc-serie], libelle: "Connaître et exploiter l'expression de l'énergie totale du circuit." }
              - { id: "1.3.3.9", page: 9, notions_app: [rlc-serie], libelle: "Etablir l'équation différentielle vérifiée par la tension aux bornes du condensateur ou par sa charge dans le cas d'amortissement." }
              - { id: "1.3.3.10", page: 9, notions_app: [rlc-serie], libelle: "Connaître le rôle du dispositif d'entretien d'oscillations, qui consiste à compenser l'énergie dissipée par effet Joule dans le circuit." }
              - { id: "1.3.3.11", page: 9, notions_app: [rlc-serie], libelle: "Etablir l'équation différentielle vérifiée par la tension aux bornes du condensateur ou par sa charge q(t) dans le cas d'un circuit RLC entretenu par l'utilisation d'un générateur délivrant une tension proportionnelle à l'intensité : u_G(t) = k.i(t)." }
              - { id: "1.3.3.12", page: 9, notions_app: [rlc-serie], libelle: "Exploiter des documents expérimentaux pour : * reconnaître les tensions observées, * reconnaître les régimes d'amortissement, * mettre en évidence l'influence de R, de L et de C sur le phénomène d'oscillations, * déterminer la valeur de la pseudo-période et de la période propre." }
              - { id: "1.3.3.13", page: 9, notions_app: [rlc-serie], libelle: "Proposer le schéma d'un montage expérimental permettant l'étude des oscillations libres dans un circuit RLC série." }
              - { id: "1.3.3.14", page: 9, notions_app: [rlc-serie], libelle: "Connaître comment brancher un oscilloscope et un système d'acquisition informatisé pour visualiser les différentes tensions." }
          - id: "1.3.4"
            nom: "4- Applications :"
            page: 9
            capacites:
              - { id: "1.3.4.1", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître les principales opérations nécessaires pour la transformation des informations en messages oraux ou écrits." }
              - { id: "1.3.4.2", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître la vitesse de transmission des informations." }
              - { id: "1.3.4.3", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître que la lumière fait partie des ondes électromagnétiques et correspond à un domaine restreint de fréquences." }
              - { id: "1.3.4.4", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître que pour une antenne émettrice, l'onde électromagnétique émise a la même fréquence que celle du signal électrique qui lui est transmis." }
              - { id: "1.3.4.5", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître que dans une antenne réceptrice, l'onde électromagnétique engendre un signal électrique de même fréquence." }
              - { id: "1.3.4.6", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître l'expression mathématique d'une tension sinusoïdale." }
              - { id: "1.3.4.7", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître que la transmission des informations par une onde électromagnétique se fait par transport d'énergie mais sans transport de matière." }
              - { id: "1.3.4.8", page: 9, notions_app: [ondes-em-modulation], libelle: "Savoir qu'une antenne peut être utilisée comme émetteur et récepteur (cas d'un téléphone portable par exemple)." }
              - { id: "1.3.4.9", page: 9, notions_app: [ondes-em-modulation], libelle: "Savoir qu'une modulation d'amplitude est de rendre l'amplitude du signal modulé fonction affine de la tension modulante." }
              - { id: "1.3.4.10", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître les conditions à remplir pour éviter la surmodulation." }
              - { id: "1.3.4.11", page: 9, notions_app: [ondes-em-modulation], libelle: "Reconnaître les étapes de la modulation d'amplitude." }
              - { id: "1.3.4.12", page: 9, notions_app: [ondes-em-modulation], libelle: "Exploiter les différentes courbes obtenues expérimentalement." }
              - { id: "1.3.4.13", page: 9, notions_app: [ondes-em-modulation], libelle: "Reconnaître, à partir d'un schéma, les différents étages du montage de modulation et de démodulation d'amplitude." }
              - { id: "1.3.4.14", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître le rôle des différents filtres utilisés." }
              - { id: "1.3.4.15", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître et exploiter le spectre de fréquences." }
              - { id: "1.3.4.16", page: 9, notions_app: [ondes-em-modulation], libelle: "Reconnaître les étapes de la démodulation." }
              - { id: "1.3.4.17", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître les conditions permettant d'obtenir une modulation d'amplitude et une détection d'enveloppe de bonne qualité." }
              - { id: "1.3.4.18", page: 9, notions_app: [ondes-em-modulation], libelle: "Connaître le rôle sélectif du circuit bouchon LC pour la tension modulée." }
              - { id: "1.3.4.19", page: 9, notions_app: [ondes-em-modulation], libelle: "Reconnaître les constituants essentiels qui constituent le montage d'un récepteur radio AM, et leurs rôles dans la démodulation." }
      - id: "1.4"
        nom: "Sous domaine 4 : Mécanique"
        poids: 27
        poids_page: 18
        chapitres:
          - id: "1.4.1"
            nom: "1- Lois de Newton"
            page: 10
            capacites:
              - { id: "1.4.1.1", page: 10, notions_app: [lois-de-newton], libelle: "Connaître et exploiter les expressions du vecteur vitesse instantanée et du vecteur accélération." }
              - { id: "1.4.1.2", page: 10, notions_app: [lois-de-newton], libelle: "Connaître l'unité de l'accélération." }
              - { id: "1.4.1.3", page: 10, notions_app: [lois-de-newton], libelle: "Connaître les coordonnées du vecteur accélération dans un repère cartésien et dans la base de Freinet.", note: "« Freinet » [sic] pour Frenet" }
              - { id: "1.4.1.4", page: 10, notions_app: [lois-de-newton], libelle: "Exploiter le produit a⃗.v⃗ pour déterminer la nature du mouvement (accéléré - retardé)." }
              - { id: "1.4.1.5", page: 10, notions_app: [lois-de-newton], libelle: "Connaître le référentiel galiléen." }
              - { id: "1.4.1.6", page: 10, notions_app: [lois-de-newton], libelle: "Connaître la deuxième loi de Newton ΣF⃗ext = m.ΔV⃗G/Δt et ΣF⃗ext = m.a⃗G ; et son domaine de validité." }
              - { id: "1.4.1.7", page: 10, notions_app: [lois-de-newton], libelle: "Reconnaître le rôle de la masse dans l'inertie d'un système." }
              - { id: "1.4.1.8", page: 10, notions_app: [lois-de-newton], libelle: "Appliquer la deuxième loi de Newton pour déterminer les grandeurs cinématiques v⃗G et a⃗G et les grandeurs dynamiques et les exploiter." }
              - { id: "1.4.1.9", page: 10, notions_app: [lois-de-newton], libelle: "Connaître et utiliser la troisième loi de Newton." }
              - { id: "1.4.1.10", page: 10, notions_app: [lois-de-newton], libelle: "Utiliser les équations aux dimensions." }
          - id: "1.4.2"
            nom: "2- Applications"
            page: 10
            capacites:
              - { id: "1.4.2.1", page: 10, notions_app: [chute-mouvements-plans], libelle: "Connaître et exploiter les deux modèles de frottement fluide : F⃗ = −k.v.i⃗ et F⃗ = −k.v².i⃗ ." }
              - { id: "1.4.2.2", page: 10, notions_app: [chute-mouvements-plans], libelle: "Exploiter la courbe v_G = f(t) pour déterminer : * la vitesse limite v_l * le temps caractéristique τ. * le régime initial et le régime permanent." }
              - { id: "1.4.2.3", page: 10, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton pour établir l'équation différentielle du mouvement du centre d'inertie d'un solide en chute verticale avec frottement." }
              - { id: "1.4.2.4", page: 10, notions_app: [chute-mouvements-plans], libelle: "Connaître et appliquer la méthode d'Euler pour la résolution approchée d'une équation différentielle." }
              - { id: "1.4.2.5", page: 10, notions_app: [chute-mouvements-plans], libelle: "Définir la chute libre verticale." }
              - { id: "1.4.2.6", page: 10, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton pour établir l'équation différentielle du mouvement du centre d'inertie d'un solide en chute libre verticale et la résoudre." }
              - { id: "1.4.2.7", page: 10, notions_app: [chute-mouvements-plans], libelle: "Connaître et exploiter les caractéristiques du mouvement rectiligne uniformément varié et ses équations horaires." }
              - { id: "1.4.2.8", page: 10, notions_app: [chute-mouvements-plans], libelle: "Exploiter le diagramme de la vitesse v_G = f(t)." }
              - { id: "1.4.2.9", page: 10, notions_app: [chute-mouvements-plans], libelle: "Choisir le référentiel convenable à l'étude du mouvement." }
              - { id: "1.4.2.10", page: 10, notions_app: [lois-de-newton], libelle: "Appliquer la deuxième loi de Newton pour établir l'équation différentielle du mouvement du centre d'inertie d'un système sur un plan horizontal ou incliné et déterminer les grandeurs cinématiques et dynamiques caractéristiques du mouvement." }
              - { id: "1.4.2.11", page: 10, notions_app: [chute-mouvements-plans], libelle: "Exploiter un document représentant la trajectoire d'un projectile dans un champ de pesanteur uniforme pour : *déterminer le type du mouvement (plan). *représenter les vecteurs vitesse et accélération. *déterminer les conditions initiales et quelques paramètres caractérisant le mouvement.", note: "libellé à cheval sur les pages 10 et 11" }
              - { id: "1.4.2.12", page: 11, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton dans le cas d'un projectile pour : *établir les équations différentielles du mouvement. *en déduire les équations horaires du mouvement et les exploiter. * trouver l'équation de la trajectoire. établir et exploiter les expressions de la portée et la flèche." }
              - { id: "1.4.2.13", page: 11, notions_app: [chute-mouvements-plans], libelle: "Connaître les caractéristiques de la force de Lorentz et la règle pour déterminer son sens." }
              - { id: "1.4.2.14", page: 11, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton dans le cas d'une particule chargée se trouvant dans un champ magnétique uniforme, avec B⃗ perpendiculaire à v⃗0 pour : * déterminer la nature du mouvement. * calculer la déflexion magnétique." }
              - { id: "1.4.2.15", page: 11, notions_app: [chute-mouvements-plans], libelle: "Connaître les référentiels héliocentrique et géocentrique." }
              - { id: "1.4.2.16", page: 11, notions_app: [chute-mouvements-plans], libelle: "Connaître les trois lois de Kepler." }
              - { id: "1.4.2.17", page: 11, notions_app: [chute-mouvements-plans], libelle: "Appliquer les trois lois de Kepler dans le cas d'une trajectoire circulaire." }
              - { id: "1.4.2.18", page: 11, notions_app: [chute-mouvements-plans], libelle: "Connaître la loi de gravitation universelle sous sa forme vectorielle." }
              - { id: "1.4.2.19", page: 11, notions_app: [chute-mouvements-plans], libelle: "Etablir la troisième loi de Kepler dans le cas où la trajectoire est circulaire." }
              - { id: "1.4.2.20", page: 11, notions_app: [chute-mouvements-plans], libelle: "Connaître que la force gravitationnelle appliquée au centre d'inertie d'un satellite ou d'une planète est centripète." }
              - { id: "1.4.2.21", page: 11, notions_app: [chute-mouvements-plans], libelle: "Appliquer la deuxième loi de Newton au centre d'inertie d'un satellite ou d'une planète pour déterminer la nature du mouvement ou l'un des paramètres caractérisant le mouvement." }
          - id: "1.4.3"
            nom: "3- Relation quantitative entre la somme des moments ΣM_Δ et l'accélération angulaire θ̈"
            page: 11
            capacites:
              - { id: "1.4.3.1", page: 11, notions_app: [rotation-axe-fixe], libelle: "Repérer un point du solide en rotation autour d'un axe fixe par son abscisse angulaire." }
              - { id: "1.4.3.2", page: 11, notions_app: [rotation-axe-fixe], libelle: "Connaître l'expression de l'accélération angulaire et son unité." }
              - { id: "1.4.3.3", page: 11, notions_app: [rotation-axe-fixe], libelle: "Connaître et exploiter les expressions des deux composantes a_N et a_T en fonction des grandeurs angulaires." }
              - { id: "1.4.3.4", page: 11, notions_app: [rotation-axe-fixe], libelle: "Connaître et appliquer la relation fondamentale de la dynamique dans le cas de la rotation autour d'un axe fixe pour établir l'équation différentielle du mouvement et la résoudre." }
              - { id: "1.4.3.5", page: 11, notions_app: [rotation-axe-fixe], libelle: "Connaître l'unité du moment d'inertie." }
              - { id: "1.4.3.6", page: 11, notions_app: [rotation-axe-fixe], libelle: "Connaître et exploiter les caractéristiques du mouvement de rotation uniformément varié et ses équations horaires." }
              - { id: "1.4.3.7", page: 11, notions_app: [rotation-axe-fixe], libelle: "Appliquer la deuxième loi de Newton et la relation fondamentale de la dynamique dans le cas de la rotation à un système mécanique composé de deux solides , l'un en mouvement de translation rectiligne et l'autre en rotation autour d'un axe fixe, pour établir les équations différentielles du mouvement et déterminer des grandeurs cinématiques et des grandeurs dynamiques." }
          - id: "1.4.4"
            nom: "4- Systèmes oscillants"
            page: 11
            capacites:
              - { id: "1.4.4.1", page: 11, notions_app: [systemes-oscillants], libelle: "Connaître le mouvement oscillatoire." }
              - { id: "1.4.4.2", page: 11, notions_app: [systemes-oscillants], libelle: "Reconnaître les oscillations libres." }
              - { id: "1.4.4.3", page: 11, notions_app: [systemes-oscillants], libelle: "Reconnaître l'amortissement des oscillations, ses différents types et ses régimes." }
              - { id: "1.4.4.4", page: 11, notions_app: [systemes-oscillants], libelle: "Connaître que dans le cas d'un amortissement faible (régime pseudopériodique), la pseudo-période est voisine de la période propre" }
              - { id: "1.4.4.5", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître les caractéristiques de la force de rappel exercée par un ressort sur un solide en mouvement." }
              - { id: "1.4.4.6", page: 12, notions_app: [systemes-oscillants], libelle: "Exploiter les courbes : x_G(t), v_G(t) et a_G(t)." }
              - { id: "1.4.4.7", page: 12, notions_app: [systemes-oscillants], libelle: "Appliquer la deuxième loi de Newton à un système oscillant (corps solide-ressort) pour établir l'équation différentielle du mouvement et vérifier sa solution dans les cas où le système oscillant est en position horizontale ou inclinée ou verticale." }
              - { id: "1.4.4.8", page: 12, notions_app: [systemes-oscillants], libelle: "Déterminer la nature du mouvement du système oscillant (corps solide-ressort) et écrire les équations x_G(t), v_G(t) = dx/dt et ẍ_G(t) et les exploiter.", note: "le point de dérivation est imprimé comme un glyphe manquant (case vide) ; restitué d'après le sens" }
              - { id: "1.4.4.9", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître la signification des grandeurs physiques intervenant dans l'expression de l'équation horaire x_G(t) du système oscillant (corps solide-ressort) et les déterminer à partir des conditions initiales." }
              - { id: "1.4.4.10", page: 12, notions_app: [systemes-oscillants], libelle: "Etablir l'expression de la période propre du système oscillant (corps solide-ressort)." }
              - { id: "1.4.4.11", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître et exploiter l'expression de la période propre et la fréquence propre du système oscillant (corps solide-ressort)." }
              - { id: "1.4.4.12", page: 12, notions_app: [systemes-oscillants], libelle: "Déterminer les deux types d'amortissement (solide et fluide) à partir des formes des diagrammes d'espace x_G(t)." }
              - { id: "1.4.4.13", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître l'expression du couple de rappel exercé par un fil de torsion sur un corps solide oscillant." }
              - { id: "1.4.4.14", page: 12, notions_app: [systemes-oscillants], libelle: "Appliquer la relation fondamentale de la dynamique à un pendule de torsion pour établir l'équation différentielle du mouvement dans le cas des frottements négligeables." }
              - { id: "1.4.4.15", page: 12, notions_app: [systemes-oscillants], libelle: "Déterminer la nature du mouvement du pendule de torsion, écrire et exploiter les équations du mouvement : θ(t), θ̇(t) = dθ/dt et θ̈(t).", note: "points de dérivation imprimés comme glyphes manquants ; restitués" }
              - { id: "1.4.4.16", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître la signification des grandeurs physiques intervenant dans l'expression de l'équation horaire θ(t) du pendule de torsion et les déterminer à partir des conditions initiales." }
              - { id: "1.4.4.17", page: 12, notions_app: [systemes-oscillants], libelle: "Etablir l'expression de la période propre du pendule de torsion." }
              - { id: "1.4.4.18", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître et exploiter l'expression de la période propre et la fréquence propre du pendule de torsion." }
              - { id: "1.4.4.19", page: 12, notions_app: [systemes-oscillants], libelle: "Exploiter les diagrammes θ(t), θ̇(t) et θ̈(t) pour déterminer les grandeurs qui caractérisent le mouvement du pendule de torsion." }
              - { id: "1.4.4.20", page: 12, notions_app: [systemes-oscillants], libelle: "Déterminer les deux types d'amortissement (solide et fluide) à partir des formes des diagrammes θ(t)." }
              - { id: "1.4.4.21", page: 12, notions_app: [systemes-oscillants], libelle: "Appliquer la relation fondamentale de la dynamique, dans le cas de la rotation, à un pendule pesant pour établir l'équation différentielle du mouvement dans le cas des petites oscillations ; les frottements étant négligeables." }
              - { id: "1.4.4.22", page: 12, notions_app: [systemes-oscillants], libelle: "Déterminer la nature du mouvement du pendule pesant, dans le cas de faibles oscillations, et écrire et exploiter les équations du mouvement : θ(t), θ̇(t) et θ̈(t)." }
              - { id: "1.4.4.23", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître la signification des grandeurs physiques intervenant dans l'expression de l'équation horaire θ(t) du pendule pesant, et les déterminer à partir des conditions initiales." }
              - { id: "1.4.4.24", page: 12, notions_app: [systemes-oscillants], libelle: "Etablir l'expression de la période propre du pendule pesant." }
              - { id: "1.4.4.25", page: 12, notions_app: [systemes-oscillants], libelle: "Connaître et exploiter l'expression de la période propre et la fréquence propre du pendule pesant dans le cas des petites oscillations." }
              - { id: "1.4.4.26", page: 13, notions_app: [systemes-oscillants], libelle: "Exploiter les diagrammes θ(t), θ̇(t) et θ̈(t) pour déterminer les grandeurs qui caractérisent le mouvement du pendule pesant dans le cas de faibles oscillations." }
              - { id: "1.4.4.27", page: 13, notions_app: [systemes-oscillants], libelle: "Définir le pendule simple synchrone au pendule pesant." }
              - { id: "1.4.4.28", page: 13, notions_app: [systemes-oscillants], libelle: "Connaître l'expression de la période propre d'un pendule simple." }
              - { id: "1.4.4.29", page: 13, notions_app: [systemes-oscillants], libelle: "Reconnaître l'excitateur, le résonateur et le phénomène de résonance mécanique ainsi que les conditions de sa production." }
              - { id: "1.4.4.30", page: 13, notions_app: [systemes-oscillants], libelle: "Reconnaître l'influence de l'amortissement sur les régimes de résonance." }
              - { id: "1.4.4.31", page: 13, notions_app: [systemes-oscillants, rotation-axe-fixe], libelle: "Appliquer la deuxième loi de Newton et la relation fondamentale de la dynamique dans le cas de la rotation à un système mécanique oscillant composé et constitué d'un corps en mouvement de translation rectiligne et d'un autre en rotation autour d'un axe fixe et dans différentes situations, pour établir les équations différentielles du mouvement et déterminer des grandeurs cinématiques et des grandeurs dynamiques." }
          - id: "1.4.5"
            nom: "5- Aspects énergétiques"
            page: 13
            capacites:
              - { id: "1.4.5.1", page: 13, notions_app: [aspects-energetiques], libelle: "Déterminer le travail d'une force extérieure exercée par un ressort." }
              - { id: "1.4.5.2", page: 13, notions_app: [aspects-energetiques], libelle: "Connaître et exploiter l'expression de l'énergie potentielle élastique." }
              - { id: "1.4.5.3", page: 13, notions_app: [aspects-energetiques], libelle: "Connaître et exploiter la relation entre le travail d'une force appliquée par un ressort et la variation de l'énergie potentielle élastique." }
              - { id: "1.4.5.4", page: 13, notions_app: [aspects-energetiques], libelle: "Connaître et exploiter l'expression de l'énergie mécanique d'un système solide-ressort." }
              - { id: "1.4.5.5", page: 13, notions_app: [aspects-energetiques], libelle: "Exploiter la conservation et la non-conservation de l'énergie mécanique d'un système solide-ressort." }
              - { id: "1.4.5.6", page: 13, notions_app: [aspects-energetiques], libelle: "Exploiter les diagrammes d'énergie." }
              - { id: "1.4.5.7", page: 13, notions_app: [aspects-energetiques], libelle: "Déterminer le travail du couple de torsion." }
              - { id: "1.4.5.8", page: 13, notions_app: [aspects-energetiques], libelle: "Connaître et exploiter l'expression de l'énergie potentielle de torsion." }
              - { id: "1.4.5.9", page: 13, notions_app: [aspects-energetiques], libelle: "Connaître et exploiter la relation entre le travail du couple de torsion et la variation de l'énergie potentielle de torsion." }
              - { id: "1.4.5.10", page: 13, notions_app: [aspects-energetiques], libelle: "Connaître et exploiter l'expression de l'énergie mécanique du pendule de torsion." }
              - { id: "1.4.5.11", page: 13, notions_app: [aspects-energetiques], libelle: "Exploiter la conservation et la non-conservation de l'énergie mécanique du pendule de torsion." }
              - { id: "1.4.5.12", page: 13, notions_app: [aspects-energetiques], libelle: "Exploiter les diagrammes d'énergie." }
              - { id: "1.4.5.13", page: 13, notions_app: [aspects-energetiques], libelle: "Exploiter l'expression de l'énergie potentielle de pesanteur et l'expression de l'énergie cinétique pour déterminer l'énergie mécanique du pendule pesant dans le cas de faibles oscillations." }
              - { id: "1.4.5.14", page: 13, notions_app: [aspects-energetiques], libelle: "Exploiter la conservation de l'énergie mécanique du pendule pesant dans le cas de faibles oscillations." }
          - id: "1.4.6"
            nom: "6- Atome et mécanique de Newton"
            page: 13
            capacites:
              - { id: "1.4.6.1", page: 13, notions_app: [atome-mecanique-newton], libelle: "Connaître les expressions de la force d'interaction gravitationnelle et de la force d'interaction électrostatique." }
              - { id: "1.4.6.2", page: 13, notions_app: [atome-mecanique-newton], libelle: "Connaître que l'énergie de l'atome est quantifiée." }
              - { id: "1.4.6.3", page: 13, notions_app: [atome-mecanique-newton], libelle: "Savoir que la mécanique de Newton ne permet pas d'expliquer la quantification de l'énergie de l'atome." }
              - { id: "1.4.6.4", page: 13, notions_app: [atome-mecanique-newton], libelle: "Connaître et exploiter la relation ΔE = h.ν ." }
              - { id: "1.4.6.5", page: 13, notions_app: [atome-mecanique-newton], libelle: "Expliquer le spectre de raies." }
  - id: "2"
    nom: "DEUXIEME DOMAINE PRINCIPAL : CHIMIE"
    sous_domaines:
      - id: "2.1"
        nom: "Sous domaine 1 : Transformations rapides et transformations lentes d'un système chimique"
        poids: 6
        poids_page: 18
        chapitres:
          - id: "2.1.1"
            nom: "1- Transformations lentes et transformations rapides"
            page: 14
            capacites:
              - { id: "2.1.1.1", page: 14, notions_app: [transformations-lentes-rapides], libelle: "Ecrire l'équation de la réaction modélisant une transformation d'oxydoréduction et identifier les deux couples intervenants." }
              - { id: "2.1.1.2", page: 14, notions_app: [transformations-lentes-rapides], libelle: "Déterminer, à partir des résultats expérimentaux, l'influence des facteurs cinétiques sur la vitesse de réaction." }
          - id: "2.1.2"
            nom: "2- Suivi temporel d'une transformation - vitesse de réaction"
            page: 14
            capacites:
              - { id: "2.1.2.1", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Justifier les différentes opérations réalisées lors du suivi de l'évolution temporelle d'un système et exploiter les résultats expérimentaux." }
              - { id: "2.1.2.2", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Repérer l'équivalence lors d'un titrage et l'exploiter." }
              - { id: "2.1.2.3", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Exploiter les différentes courbes d'évolution de la quantité de matière d'une espèce chimique, sa concentration, l'avancement de réaction, sa conductivité électrique, sa conductance, la pression ou le volume d'un réactif ou d'un produit." }
              - { id: "2.1.2.4", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Dresser le tableau d'avancement d'une réaction et l'exploiter." }
              - { id: "2.1.2.5", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Connaître l'expression de la vitesse volumique de réaction." }
              - { id: "2.1.2.6", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Connaître l'influence de la concentration des réactifs et de la température sur la vitesse volumique de réaction." }
              - { id: "2.1.2.7", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Interpréter qualitativement la variation de la vitesse de réaction à l'aide d'une des courbes d'évolution tracées." }
              - { id: "2.1.2.8", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Déterminer graphiquement la valeur de la vitesse volumique de réaction." }
              - { id: "2.1.2.9", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Définir le temps de demi-réaction t_1/2 ." }
              - { id: "2.1.2.10", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Déterminer le temps de demi-réaction graphiquement ou en exploitant des résultats expérimentaux." }
              - { id: "2.1.2.11", page: 14, notions_app: [suivi-temporel-vitesse], libelle: "Interpréter l'influence de la concentration de l'un des réactifs et/ou de la température sur le nombre de chocs efficaces par unité de temps." }
      - id: "2.2"
        nom: "Sous domaine2 : Transformations non totales d'un système chimique"
        poids: 10
        poids_page: 18
        chapitres:
          - id: "2.2.1"
            nom: "1- Transformations chimiques qui ont lieu dans les deux sens"
            page: 14
            capacites:
              - { id: "2.2.1.1", page: 14, notions_app: [transformations-deux-sens], libelle: "Définir un acide et une base selon Bronsted." }
              - { id: "2.2.1.2", page: 14, notions_app: [transformations-deux-sens], libelle: "Ecrire l'équation de la réaction modélisant une transformation acido-basique et identifier les deux couples intervenants." }
              - { id: "2.2.1.3", page: 14, notions_app: [transformations-deux-sens], libelle: "Déterminer le pH d'une solution aqueuse." }
              - { id: "2.2.1.4", page: 14, notions_app: [transformations-deux-sens], libelle: "Calculer l'avancement final de la réaction d'un acide avec l'eau, connaissant la valeur de la concentration et du pH de la solution de cet acide, et le comparer à l'avancement maximal." }
              - { id: "2.2.1.5", page: 14, notions_app: [transformations-deux-sens], libelle: "Définir le taux d'avancement final d'une réaction et le déterminer à partir de données expérimentales." }
              - { id: "2.2.1.6", page: 14, notions_app: [transformations-deux-sens], libelle: "Interpréter à l'échelle microscopique, l'état d'équilibre d'un système chimique." }
          - id: "2.2.2"
            nom: "2- Etat d'équilibre d'un système chimique"
            page: 15
            capacites:
              - { id: "2.2.2.1", page: 15, notions_app: [etat-equilibre], libelle: "Utiliser la relation liant la conductance G, d'une partie de solution, aux concentrations molaires effectives [Xi] des ions Xi en solution." }
              - { id: "2.2.2.2", page: 15, notions_app: [etat-equilibre], libelle: "Savoir que, lorsque l'état d'équilibre du système est atteint, les quantités de matière n'évoluent plus, et que cet état d'équilibre est dynamique." }
              - { id: "2.2.2.3", page: 15, notions_app: [etat-equilibre], libelle: "Donner et utiliser l'expression littérale du quotient de réaction Qr à partir de l'équation de la réaction." }
              - { id: "2.2.2.4", page: 15, notions_app: [etat-equilibre], libelle: "Savoir que le quotient de réaction Q_r,éq , associée à l'équation de la réaction, à l'état d'équilibre d'un système, prend une valeur, indépendante des concentrations, nommée constante d'équilibre K ." }
              - { id: "2.2.2.5", page: 15, notions_app: [etat-equilibre], libelle: "Savoir que, pour une transformation donnée, le taux d'avancement final dépend de la constante d'équilibre et de l'état initial du système." }
          - id: "2.2.3"
            nom: "3- Transformations associées à des réactions acido-basiques en solution aqueuse"
            page: 15
            capacites:
              - { id: "2.2.3.1", page: 15, notions_app: [reactions-acido-basiques], libelle: "Savoir que le produit ionique de l'eau, Ke , est la constante d'équilibre associée à l'équation de la réaction d'autoprotolyse de l'eau." }
              - { id: "2.2.3.2", page: 15, notions_app: [reactions-acido-basiques], libelle: "Connaitre la relation pKe = − log Ke" }
              - { id: "2.2.3.3", page: 15, notions_app: [reactions-acido-basiques], libelle: "Déterminer la nature d'une solution aqueuse (acide ou basique ou neutre) à partir de la valeur de son pH" }
              - { id: "2.2.3.4", page: 15, notions_app: [reactions-acido-basiques], libelle: "Déterminer la valeur du pH d'une solution aqueuse à partir de la concentration molaire des ions H3O⁺ ou HO⁻." }
              - { id: "2.2.3.5", page: 15, notions_app: [reactions-acido-basiques], libelle: "Ecrire et utiliser l'expression de la constante d'acidité KA associée à l'équation de la réaction d'un acide avec l'eau." }
              - { id: "2.2.3.6", page: 15, notions_app: [reactions-acido-basiques], libelle: "Connaître la relation pKA = − log KA ." }
              - { id: "2.2.3.7", page: 15, notions_app: [reactions-acido-basiques], libelle: "Déterminer la constante d'équilibre associée à l'équation d'une réaction acido-basique à l'aide des constantes d'acidité des couples en présence." }
              - { id: "2.2.3.8", page: 15, notions_app: [reactions-acido-basiques], libelle: "Indiquer l'espèce prédominante connaissant le pH d'une solution aqueuse et le pKA du couple acide/base." }
              - { id: "2.2.3.9", page: 15, notions_app: [reactions-acido-basiques], libelle: "Exploiter le diagramme de prédominance et de distribution des espèces acides et basiques présentes en solution aqueuse." }
              - { id: "2.2.3.10", page: 15, notions_app: [reactions-acido-basiques], libelle: "Ecrire l'équation de réaction de dosage (en utilisant une seule flèche)." }
              - { id: "2.2.3.11", page: 15, notions_app: [reactions-acido-basiques], libelle: "Connaître le montage expérimental d'un dosage acido-basique." }
              - { id: "2.2.3.12", page: 15, notions_app: [reactions-acido-basiques], libelle: "Exploiter la courbe ou les résultats du dosage." }
              - { id: "2.2.3.13", page: 15, notions_app: [reactions-acido-basiques], libelle: "Repérer et exploiter le point d'équivalence." }
              - { id: "2.2.3.14", page: 15, notions_app: [reactions-acido-basiques], libelle: "Justifier le choix de l'indicateur coloré adéquat pour repérer l'équivalence." }
      - id: "2.3"
        nom: "Sous domaine 3 : Sens d'évolution d'un système chimique"
        poids: 10
        poids_page: 18
        chapitres:
          - id: "2.3.1"
            nom: "1- Evolution spontanée d'un système chimique"
            page: 15
            capacites:
              - { id: "2.3.1.1", page: 15, notions_app: [evolution-spontanee], libelle: "Calculer la valeur du quotient de réaction Qr d'un système chimique dans un état donné." }
              - { id: "2.3.1.2", page: 15, notions_app: [evolution-spontanee], libelle: "Déterminer le sens d'évolution spontanée d'un système chimique." }
          - id: "2.3.2"
            nom: "2- Transformations spontanées dans les piles et récupération de l'énergie"
            page: 15
            capacites:
              - { id: "2.3.2.1", page: 15, notions_app: [piles], libelle: "Schématiser une pile (schéma conventionnel, schéma)" }
              - { id: "2.3.2.2", page: 16, notions_app: [piles], libelle: "Déterminer le sens de déplacement des porteurs de charges dans une pile en utilisant le critère d'évolution spontanée." }
              - { id: "2.3.2.3", page: 16, notions_app: [piles], libelle: "Interpréter le fonctionnement d'une pile en disposant d'une information parmi les suivantes : le sens de du courant électrique, la f.é.m , les réactions aux électrodes, la polarité des électrodes ou le mouvement des porteurs de charges.", note: "« le sens de du courant » [sic]" }
              - { id: "2.3.2.4", page: 16, notions_app: [piles], libelle: "Ecrire les équations des réactions aux électrodes (avec double flèche) et l'équation bilan lors du fonctionnement de la pile (avec une seule flèche)." }
              - { id: "2.3.2.5", page: 16, notions_app: [piles], libelle: "Etablir la relation entre les quantités de matière des espèces formées ou consommées, l'intensité du courant et la durée de fonctionnement de la pile. Utiliser cette relation pour déterminer d'autres grandeurs (quantité d'électricité, l'avancement de la réaction, variation de masse…)." }
          - id: "2.3.3"
            nom: "3- Exemples de transformations forcées"
            page: 16
            capacites:
              - { id: "2.3.3.1", page: 16, notions_app: [electrolyse], libelle: "Savoir qu'une électrolyse est une transformation forcée." }
              - { id: "2.3.3.2", page: 16, notions_app: [electrolyse], libelle: "Reconnaitre l'électrode à laquelle se produit la réaction d'oxydation (anode) ou l'électrode à laquelle se produit la réaction de réduction (cathode), connaissant le sens du courant imposé par le générateur." }
              - { id: "2.3.3.3", page: 16, notions_app: [electrolyse], libelle: "Schématiser le montage expérimental de l'électrolyse." }
              - { id: "2.3.3.4", page: 16, notions_app: [electrolyse], libelle: "Ecrire les équations des réactions aux électrodes (avec double flèche) et l'équation bilan (simple flèche) lors d'une électrolyse." }
              - { id: "2.3.3.5", page: 16, notions_app: [electrolyse], libelle: "Etablir la relation entre les quantités de matière des espèces formées ou consommées, l'intensité du courant et la durée de l'électrolyse. Utiliser cette relation pour déterminer d'autres grandeurs (l'avancement de réaction, variation de masse, volume d'un gaz…)." }
      - id: "2.4"
        nom: "Sous domaine 4: Méthode de contrôle de l'évolution des systèmes chimiques"
        poids: 7
        poids_page: 18
        chapitres:
          - id: "2.4.1"
            nom: "1- Les réactions d'estérification et d'hydrolyse"
            page: 16
            capacites:
              - { id: "2.4.1.1", page: 16, notions_app: [esterification-hydrolyse], libelle: "Reconnaître dans la formule d'une espèce chimique organique les groupes caractéristiques : – OH (hydroxyle) ; –CO2H (carboxyle) ; –CO2R (ester) ; –CO–O–CO– (anhydride)." }
              - { id: "2.4.1.2", page: 16, notions_app: [esterification-hydrolyse], libelle: "Écrire les équations des réactions d'estérification et d'hydrolyse." }
              - { id: "2.4.1.3", page: 16, notions_app: [esterification-hydrolyse], libelle: "Retrouver, à partir de la formule semi-développée de l'ester, les formules de l'acide carboxylique et de l'alcool correspondants." }
              - { id: "2.4.1.4", page: 16, notions_app: [esterification-hydrolyse], libelle: "Nommer les esters comportant cinq atomes de carbone au maximum." }
              - { id: "2.4.1.5", page: 16, notions_app: [esterification-hydrolyse], libelle: "Connaitre les caractéristiques des réactions d'estérification et d'hydrolyse (lentes et limitées)." }
              - { id: "2.4.1.6", page: 16, notions_app: [esterification-hydrolyse], libelle: "Savoir que le catalyseur est une espèce qui augmente la vitesse d'une réaction chimique sans modifier l'état d'équilibre du système." }
              - { id: "2.4.1.7", page: 16, notions_app: [esterification-hydrolyse], libelle: "Savoir que la présence de l'un des réactifs en excès ou l'élimination de l'un des produits déplace l'état d'équilibre du système dans le sens direct." }
              - { id: "2.4.1.8", page: 16, notions_app: [esterification-hydrolyse], libelle: "Déterminer la composition du mélange réactionnel à un instant donné." }
          - id: "2.4.2"
            nom: "2- Contrôle de l'évolution des systèmes chimiques par changement d'un réactif ou par catalyse"
            page: 16
            capacites:
              - { id: "2.4.2.1", page: 16, notions_app: [controle-catalyse], libelle: "Justifier le choix du matériel expérimental à utiliser : chauffage à reflux, distillation fractionnée, cristallisation, et filtration sous vide." }
              - { id: "2.4.2.2", page: 16, notions_app: [controle-catalyse], libelle: "Reconnaitre les règles de sécurité." }
              - { id: "2.4.2.3", page: 16, notions_app: [controle-catalyse], libelle: "Proposer un protocole expérimental, et justifier ses étapes." }
              - { id: "2.4.2.4", page: 17, notions_app: [controle-catalyse], libelle: "Écrire l'équation de la réaction d'un anhydride d'acide avec un alcool et celle de l'hydrolyse basique d'un ester." }
              - { id: "2.4.2.5", page: 17, notions_app: [controle-catalyse], libelle: "Connaitre les caractéristiques de la réaction d'un anhydride d'acide avec un alcool (rapide et totale)." }
              - { id: "2.4.2.6", page: 17, notions_app: [controle-catalyse], libelle: "Calculer le rendement d'une transformation chimique." }
              - { id: "2.4.2.7", page: 17, notions_app: [controle-catalyse], libelle: "Reconnaitre la partie hydrophile et la partie hydrophobe d'un ion carboxylate à chaîne longue." }
              - { id: "2.4.2.8", page: 17, notions_app: [controle-catalyse], libelle: "Connaitre les rôles accélérateur et sélectif du catalyseur." }

# Annexe 1 (pp. 20-25) : « Annexe 1 : Programme de Physique Chimie ». Mot pour mot ; les contenus
