  - { domaine: "Physique", sous_domaine: "Sous domaine 4 : Mécanique", chapitre: "4. Systèmes oscillants.", page: 22, contenus: ["4.1. Présentation de systèmes mécaniques oscillants. - pendule pesant, pendule simple, pendule de torsion et le système (solide-ressort) en oscillations libres : position d'équilibre, amplitude et période propre. - amortissement des oscillations.", "4.2. Système oscillant (solide-ressort) : - force de rappel exercée par un ressort - équation différentielle du mouvement d'un solide dans le cas de faibles frottements - période propre- amortissement.", "4.3. Pendule de torsion : - couple de rappel - équation différentielle dans le cas de faibles frottements - période propre – amortissement.", "4.4. Pendule pesant : - équation différentielle - période propre - amortissement.", "4.5. Phénomène de résonance : - présentation expérimentale du phénomène : excitateur – résonateur - amplitude et période des oscillations - influence de l'amortissement - exemples de résonnance mécanique."] }
