# Annexe 3 (p. 29) : « Annexe 3 : Compétences ciblées ».
competences_ciblees:
  - { page: 29, domaine: "Ondes", libelle: "Utiliser le modèle ondulatoire pour interpréter les phénomènes liés à la propagation des ondes mécaniques ou optiques et résoudre des situations problème sur la propagation des ondes." }
  - { page: 29, domaine: "Les transformations nucléaires", libelle: "Modéliser des transformations nucléaires et datation d'un fait par l'application de la loi de désintégration radioactive ; faire le bilan énergétique d'une transformation nucléaire et résoudre des situations problème sur les transformations nucléaires." }
  - { page: 29, domaine: "Les transformations nucléaires", libelle: "Savoir l'intérêt des transformations nucléaires dans l'évolution technologique et ses effets probables sur l'environnement et les mesures de précaution à prendre." }
  - { page: 29, domaine: "L'électricité", libelle: "Modéliser le comportement du condensateur et de la bobine dans un circuit électrique et analyser leurs réponses à un échelon de tension ; étudier les oscillations libres dans un circuit RLC série." }
  - { page: 29, domaine: "L'électricité", libelle: "Interpréter les constituants et le rôle des éléments d'une chaine d'émission et être conscient de son intérêt dans la communication." }
  - { page: 29, domaine: "La mécanique", libelle: "Analyser, suivre et prévoir l'évolution d'un système mécanique en adoptant un modèle simple." }
  - { page: 29, domaine: "La mécanique", libelle: "Résoudre une situation problème liée à un système mécanique en mouvement par une étude dynamique ou énergétique." }
  - { page: 29, domaine: "Transformations rapides et transformations lentes d'un système chimique", libelle: "Contrôler la vitesse de réaction en agissant sur les facteurs cinétiques pour accélérer la synthèse d'une espèce chimique, ou pour éliminer les effets des produits utilisés, ou pour diminuer la vitesse de réaction afin de conserver les produits alimentaires et de les protéger de la corrosion" }
  - { page: 29, domaine: "Transformations non totales d'un système chimique", libelle: "Utiliser le taux d'avancement final pour distinguer entre la transformation totale et les transformations non totales et déterminer la composition de l'état final d'un système chimique en utilisant la constante d'équilibre dans des différents cas." }
  - { page: 29, domaine: "Sens d'évolution d'un système chimique", libelle: "Utiliser le critère de l'évolution pour déterminer le sens de l'évolution spontanée d'un système et exploiter ce sens pour récupérer de l'énergie électrique dans le cas des réactions d'oxydo-réduction." }
  - { page: 29, domaine: "Sens d'évolution d'un système chimique", libelle: "Analyser une transformation chimique forcée et appliquer l'électrolyse pour charger des accumulateurs , purifier les métaux et les protéger de la rouille." }
  - { page: 29, domaine: "Méthode de contrôle de l'évolution des systèmes chimiques", libelle: "Exécuter un protocole expérimental pour fabriquer une espèce chimique déterminée et augmenter son rendement en utilisant un réactif plus efficace et un catalyseur convenable." }

notes_de_lecture:
  - "NUMÉROTATION. Le document numérote les domaines principaux (« PREMIER / DEUXIEME DOMAINE PRINCIPAL »), les sous-domaines (« Sous domaine 1 » à « 4 », la numérotation repart à 1 en chimie) et les chapitres (« 1- », « 2- »… qui repartent à 1 dans chaque sous-domaine). Les capacités sont des tirets ; le 4ᵉ chiffre de l'identifiant est leur ordre d'apparition (reconstitué)."
  - "277 capacités : physique 211 — 1.1 ondes 28 (7 · 8 · 13) · 1.2 nucléaire 28 (15 · 13) · 1.3 électricité 67 (18 · 16 · 14 · 19) · 1.4 mécanique 88 (10 · 21 · 7 · 31 · 14 · 5) ; chimie 66 — 2.1 (2 · 11) · 2.2 (6 · 5 · 14) · 2.3 (2 · 5 · 5) · 2.4 (8 · 8)."
  - "Le chapitre « 2- Applications » de la mécanique (pp. 10-11) réunit dans une seule liste : frottement fluide et chute verticale avec frottement, méthode d'Euler, chute libre, plan horizontal ou incliné, projectile, force de Lorentz et particule dans un champ magnétique, lois de Kepler et satellites. L'annexe 1 (p. 22) les répartit en « 2.1 Chute verticale d'un solide », « 2.2 Mouvements plans », « 2.3 Satellites artificiels et planètes »."
  - "Le chapitre « 4- Applications : » de l'électricité (p. 9) est celui des ondes électromagnétiques et de la modulation d'amplitude (annexe 1, p. 21 : « 4.1. Ondes électromagnétiques- Transmission d'informations » … « 4.4. Réalisation d'un dispositif permettant de capter une émission radio en modulation d'amplitude »)."
  - "Pas d'oscillations forcées dans un circuit RLC (pas d'impédance, de résonance d'intensité, de facteur de qualité) : elles sont propres au cadre SM (pc-sm.yaml). Pas de particule dans un champ électrique non plus (même remarque)."
  - "Coquilles du document, recopiées : « Transformation nucléaires » (titre du sous-domaine 2, p. 6 ; « Transformations nucléaires » partout ailleurs) ; « base de Freinet » pour Frenet (pp. 10, 21) ; « Définir de la constante de temps » (1.2.1.12) ; « le sens de du courant » (2.3.2.3) ; « résonnance » (annexe 1, p. 22)."
  - "Les points de dérivation (θ̇, θ̈, ẍ) sont imprimés comme des glyphes manquants (petites cases) aux pages 12-13 ; ils sont restitués d'après le sens."
  - "Aucun travail pratique n'est listé pour le sous-domaine 2 (transformations nucléaires) : l'annexe 2 passe de « Sous domaine 1 : Ondes » à « Sous domaine 3 : Electricité » (p. 26)."
  - "Le document ne contient ni coefficient, ni barème par exercice, ni répartition physique / chimie en points. Les « 7 points de chimie » observés dans les sujets (docs/refonte/01-programme-bac-maroc.md §3.3) sont un constat d'annales, pas une règle du cadre ; le cadre donne 33 % (somme des sous-domaines de chimie, p. 18), soit 6,6 points sur 20."
  - "Les pages 2-4 (introduction, objectifs, structure, fonctionnalité, contenus, types d'évaluation) sont communes, à quelques mots près, aux cadres PC-SM et PC « Sciences agricoles » ; voir docs/bible/sources/verification-pc.md."
