  - { domaine: "Deuxième domaine principal : Chimie", chapitre: "Introduction : Questions qui se posent au chimiste", page: 23, contenus: ["- Inventorier les activités du chimiste et les enjeux de la chimie dans la société.", "- Dégager quelques questions qui se posent au chimiste dans ses activités professionnelles."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 1 : Transformations rapides et transformations lentes d'un système chimique.", chapitre: "1. Transformations lentes et transformations rapides.", page: 23, contenus: ["- Rappels sur les couples Ox/Red et écriture des équations de réactions d'oxydo-réduction en utilisant le symbole ⇄ dans l'écriture de la demi-équation caractéristique d'un couple Ox/Red.", "- Mise en évidence expérimentale des transformations lentes et des transformations rapides.", "- Mise en évidence expérimentale des facteurs cinétiques : température et concentration des réactifs"] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 1", chapitre: "2. Suivi temporel d'une transformation – vitesse de réaction.", page: 23, contenus: ["- Tracé des courbes d'évolution de la quantité de matière ou de la concentration d'une espèce chimique ou de l'avancement d'une réaction au cours du temps : Utilisation du tableau descriptif d'évolution d'un système chimique et exploitation d'expériences.", "- Vitesse de réaction : Définition de la vitesse volumique de réaction exprimée en unité de quantité de matière par unité de temps et de volume : v = (1/V).dx/dt avec x avancement de la réaction et V volume de la solution.", "- Evolution de la vitesse de réaction au cours du temps.", "- temps de demi-réaction noté (t1/2) : sa définition et méthodes de sa détermination - choix d'une méthode de suivi d'une transformation selon la valeur de (t1/2).", "- interprétation au niveau microscopique : o interprétation de la réaction chimique en termes de chocs efficaces. o interprétation de l'influence de la concentration des entités réactives et de la température sur le nombre de chocs efficaces par unité de temps."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 2 : Transformations non totales d'un système chimique", chapitre: "1. Transformations chimiques qui ont lieu dans les deux sens.", page: 23, contenus: ["- introduction de la notion pH - mesure du pH.", "- mise en évidence expérimentale d'un avancement final différent de l'avancement maximal, dans une transformation chimique donnée.", "- modélisation d'une transformation chimique limitée par deux réactions inverses et simultanées en utilisant l'écriture : ⇄ (double flèche)", "- caractérisation d'une transformation limitée (non totale) : avancement x_f < x_max .", "- taux d'avancement final d'une réaction : τ = x_f / x_max , avec τ ≤ 1.", "- interprétation à l'échelle microscopique de l'état d'équilibre en tenant compte des chocs efficaces entre les espèces réactives d'une part et les espèces produites d'autre part."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 2", chapitre: "2.État d'équilibre d'un système chimique.", page: 24, contenus: ["- Quotient de réaction Qr : Expression littérale en fonction des concentrations molaires des espèces chimiques dissoutes pour un état donné du système.", "- Généralisation à différents cas : solution aqueuse homogène ou hétérogène (présence de solides).", "- Détermination de la valeur du quotient de réaction Qr,éq dans un état d'équilibre d'un système.", "- Constante d'équilibre K associée à l'équation d'une réaction, à une température donnée.", "- Influence de l'état initial d'un système sur le taux d'avancement final d'une réaction."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 2", chapitre: "3. Transformations associées à des réactions acido-basiques en solution aqueuse.", page: 24, contenus: ["- Autoprotolyse de l'eau ;", "- Produit ionique de l'eau, notée Ke.", "- Echelle de pH : solution acide, solution basique et solution neutre.", "- Constante d'acidité d'un couple acide/ base, notée KA .", "- Comparaison des comportements, en solution aqueuse, des acides ou des bases ayant même concentration.", "- Constante d'équilibre associée à une réaction acido-basique.", "- Diagrammes de prédominance et de distribution d'espèces acides et basiques en solution aqueuse.", "- Zone de virage d'un indicateur coloré acide-base.", "- Titrage pH-métrique d'un acide ou d'une base en solution aqueuse pour déterminer le volume versé à l'équivalence et choisir un indicateur coloré convenable.", "- Réaction totale : détermination du taux d'avancement finale à partir d'un exemple de dosage acido-basique."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 3 : Sens d'évolution d'un système chimique", chapitre: "1. Evolution spontanée d'un système chimique.", page: 24, contenus: ["- critère d'évolution spontanée : au cours du temps, la valeur du quotient de réaction Qr tend vers la constante d'équilibre K.", "- illustration de ce critère sur des réactions acido-basiques et des réactions d'oxydo-réduction."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 3", chapitre: "2. Transformations spontanées dans les piles et récupération de l'énergie.", page: 24, contenus: ["- Transfert spontané d'électrons entre des espèces chimiques (mélangées ou séparées) de deux couples Ox/Red de type ion métallique/métal, Mⁿ⁺/M(s).", "- Constitution et fonctionnement d'une pile : Observation du sens de circulation du courant électrique, mesure de la force électromotrice E (f.é.m), mouvement des porteurs de charges, rôle du pont salin (jonction électrolytique), réactions aux électrodes.", "- La pile un système hors équilibre au cours de son fonctionnement en générateur. Lors de l'évolution spontanée, la valeur du quotient de réaction tend vers la constante d'équilibre.", "- La pile à l'équilibre \"pile usée\" : quantité d'électricité maximale débitée dans un circuit."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 3", chapitre: "3. Exemples de transformations forcées :", page: 24, contenus: ["- mise en évidence expérimentale de la possibilité de changer, dans certains cas, le sens d'évolution d'un système en imposant un courant de sens inverse à celui observé lorsque le système évolue spontanément (transformation forcée).", "- réactions aux niveaux des électrodes : anode et cathode.", "- application à l'électrolyse : principe et exemples d'applications courantes et industrielles."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 4 : Méthode de contrôle de l'évolution des systèmes chimiques", chapitre: "1. Les réactions d'estérification et d'hydrolyse.", page: 25, contenus: ["- Formation d'un ester à partir d'un acide carboxylique et d'un alcool, écriture de l'équation de la réaction correspondante.", "- Hydrolyse d'un ester, écriture de l'équation de la réaction correspondante.", "- Mise en évidence expérimentale d'un état d'équilibre lors des transformations faisant intervenir des réactions d'estérification et d'hydrolyse.", "- Définition du rendement d'une transformation.", "- Définition d'un catalyseur.", "- Contrôle de la vitesse de réaction : température et catalyseur.", "- Contrôle de l'état final d'un système : excès d'un réactif ou élimination d'un produit."] }
  - { domaine: "Chimie", sous_domaine: "Sous domaine 4", chapitre: "2. Contrôle de l'évolution de systèmes chimiques par changement d'un réactif ou par catalyse.", page: 25, contenus: ["- Synthèse d'un ester à partir d'un anhydride d'acide et d'un alcool.", "- Hydrolyse basique des esters : applications à la saponification des corps gras (Préparation du savon, reconnaissance de ses propriétés, relations structure-propriétés)."] }

