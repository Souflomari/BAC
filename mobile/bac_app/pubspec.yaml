name: bac_app
description: Duolingo-style Moroccan Baccalauréat exam prep app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.0

  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10
  flutter_math_fork: ^0.7.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.0

  # Offline / Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  collection: ^1.18.0
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  image_picker: ^1.1.2

  # Observability — both no-op until env DSN/key is set at build time.
  sentry_flutter: ^8.6.0
  posthog_flutter: ^4.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # fonts loaded via google_fonts package
