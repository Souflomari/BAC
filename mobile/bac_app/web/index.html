  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Loading screen — Papier-styled, shown while Flutter bundle loads */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4EEDC;
      font-family: 'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #1F1A14;
      }
      .loader-text { color: #F4EEDC !important; }
      .loader-tagline { color: rgba(244, 238, 220, 0.72) !important; }
      .loader-rule { background: rgba(244, 238, 220, 0.6) !important; }
      .loader-dot { background: #C24545 !important; }
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-text {
      color: #111111;
      font-size: 36px;
      font-style: italic;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .loader-rule {
      width: 28px;
      height: 1.5px;
      background: #111111;
      opacity: 0.65;
    }
    .loader-tagline {
      color: rgba(17, 17, 17, 0.62);
      font-size: 12px;
      font-style: italic;
      letter-spacing: 0.6px;
    }
    .loader-dot {
      width: 6px;
      height: 6px;
      background: #C24545;
      border-radius: 50%;
      margin-top: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* Print styles — when the user prints from a long lesson, hide the
       app shell chrome and force readable contrast. Flutter web renders
       to <flt-glass-pane> + <flt-scene-host>; we let those keep their
       paint and just override the page background and hide overlays. */
    @media print {
      html, body {
        background: white !important;
      }
      #loader { display: none !important; }
      /* Browsers print 1 page per scroll page by default; this lets the
         lesson flow naturally across pages. */
      flt-glass-pane, flt-scene-host {
        background: white !important;
      }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-text">BacPrep</div>
    <div class="loader-rule"></div>
    <div class="loader-tagline">PRÉPARATION AU BAC</div>
    <div class="loader-dot"></div>
  </div>

  <script>
    // Hide the loader once Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (l) {
        l.classList.add('hidden');
        setTimeout(function () { l.remove(); }, 400);
      }
    });

    // Service worker update handling:
    // When a new SW is waiting, activate it immediately and reload once
    // so users always get the latest deploy without closing all tabs.
    if ('serviceWorker' in navigator) {
      var _reloading = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!_reloading) {
          _reloading = true;
          window.location.reload();
        }
      });

      navigator.serviceWorker.ready.then(function (reg) {
        // Already waiting (page loaded after a deploy)
        if (reg.waiting) {
          reg.waiting.postMessage('skipWaiting');
        }
        // New SW found after page load
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage('skipWaiting');
            }
          });
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
