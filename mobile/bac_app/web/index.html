  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    /* Loading screen — shown while Flutter bundle loads */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #0F172A;
      }
      .loader-text { color: #F1F5F9; }
      .loader-tagline { color: #94A3B8; }
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1A56DB 0%, #3B82F6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      box-shadow: 0 8px 24px rgba(26, 86, 219, 0.25);
    }
    .loader-text {
      color: #0F172A;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .loader-tagline {
      color: #64748B;
      font-size: 14px;
    }
    .loader-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(26, 86, 219, 0.15);
      border-top-color: #1A56DB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-logo">B</div>
    <div class="loader-text">BacPrep</div>
    <div class="loader-tagline">Votre Bac, notre mission</div>
    <div class="loader-spinner"></div>
  </div>

  <script>
    // Hide the loader once Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (l) {
        l.classList.add('hidden');
        setTimeout(function () { l.remove(); }, 400);
      }
    });

    // Service worker update handling:
    // When a new SW is waiting, activate it immediately and reload once
    // so users always get the latest deploy without closing all tabs.
    if ('serviceWorker' in navigator) {
      var _reloading = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!_reloading) {
          _reloading = true;
          window.location.reload();
        }
      });

      navigator.serviceWorker.ready.then(function (reg) {
        // Already waiting (page loaded after a deploy)
        if (reg.waiting) {
          reg.waiting.postMessage('skipWaiting');
        }
        // New SW found after page load
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage('skipWaiting');
            }
          });
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
