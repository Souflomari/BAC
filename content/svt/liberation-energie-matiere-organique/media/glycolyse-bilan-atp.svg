<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Bilan de la glycolyse. Une molécule de glucose à 6 carbones, dans le cytoplasme, avec un compteur d’ATP à 0. Deux ATP sont investis pour l’activer : le compteur descend à −2. Le glucose est ensuite scindé en deux fragments à 3 carbones chacun — 6 égale 3 plus 3, aucun CO2 libéré à cette étape. Enfin, la phase de remboursement produit 4 ATP et 2 NADH,H+ — un coenzyme distinct, qui n’est pas de l’ATP ; le compteur remonte de −2 à +2 : le bilan net encadré est +2 ATP par glucose, et non 4.">
  <title>La glycolyse : bilan net de 2 ATP, pas 4</title>

  <!--
    glycolyse-bilan-atp.svg — figure STAGÉE, 4 étapes
    (docs/design/LESSON-EXPERIENCE-SPEC.md §2), R2.

    Placement : après le paragraphe qui clôt "Pourquoi le bilan net n'est
    que de 2 ATP" (juste après la mention de la phosphorylation au niveau
    du substrat), avant "L'erreur classique".

    Cible pédagogique : l'erreur classique nommée juste après cette
    figure — confondre le bilan BRUT (4 ATP produits) avec le bilan NET
    (4 − 2 = 2 ATP). Le compteur d'ATP, à droite, est un LEDGER qui
    s'écrit ligne après ligne (jamais retouché, seulement complété) —
    exactement le geste additif de la mise en étapes.

    Mise en scène :
      step-1 : glucose (6 C) + le cadre du compteur ATP (vide, encore à
               "Départ : 0 ATP").
      step-2 : AJOUT — 2 jetons ATP investis (flèches vers le glucose) +
               ligne 2 du compteur ("−2 ATP → total −2").
      step-3 : AJOUT — le glucose scindé en 2 fragments à 3 C (6 = 3+3,
               aucun CO2 — pas de ligne de compteur, cette étape ne
               change pas le bilan ATP).
      step-4 : AJOUT — étiquette "pyruvate" dans chaque fragment, jeton
               "4 ATP" + jeton NADH,H+ distinct (hexagone, forme
               différente pour NE PAS le compter comme de l'ATP), ligne 3
               du compteur, et l'encart accent final "BILAN NET : +2 ATP"
               — la SEULE idée que cette figure marque en accent
               (DESIGN-BIBLE §6).

    Simplification pédagogique assumée : glucose et fragments sont des
    blocs génériques avec un compte de carbones (6 C / 3 C), pas des
    formules développées — hors du programme de ce rung, qui porte sur
    le bilan ATP et le compte de carbones, pas la structure moléculaire.
  -->

  <!-- Titre -->
  <text x="350" y="22" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    La glycolyse : bilan net, pas brut
  </text>

  <!-- ══════════════════════════ STEP 1 — glucose + compteur vide ══════════════════════ -->
  <g id="step-1">
    <!-- glucose -->
    <rect x="100" y="100" width="110" height="52" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="155" y="122" text-anchor="middle" font-size="12" fill="var(--figure-ink)">Glucose</text>
    <text x="155" y="140" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">(6 <tspan font-style="italic">C</tspan> — cytoplasme)</text>

    <!-- cadre du compteur ATP -->
    <rect x="470" y="60" width="190" height="152" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="565" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-ink)">Compteur ATP</text>
    <line x1="470" y1="92" x2="660" y2="92" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="470" y1="132" x2="660" y2="132" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="470" y1="172" x2="660" y2="172" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="482" y="116" font-size="10" fill="var(--figure-ink)">Départ : 0 ATP</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════ STEP 2 — investissement (−2 ATP) ══════════════════════ -->
  <g id="step-2">
    <rect x="40" y="60" width="50" height="26" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <text x="65" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--figure-ink)">ATP</text>
    <path d="M65,86 Q80,100 100,118" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <polygon points="100,118 87,111 90,123" fill="var(--figure-ink)"/>

    <rect x="230" y="60" width="50" height="26" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <text x="255" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--figure-ink)">ATP</text>
    <path d="M255,86 Q235,100 210,118" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <polygon points="210,118 223,111 220,123" fill="var(--figure-ink)"/>

    <text x="482" y="156" font-size="10" font-weight="600" fill="var(--figure-ink)">− 2 ATP → total : −2</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════ STEP 3 — scission en 2 fragments à 3 C ══════════════════════ -->
  <g id="step-3">
    <line x1="130" y1="152" x2="95" y2="190" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <polygon points="95,190 100,177 108,185" fill="var(--figure-ink)"/>
    <line x1="180" y1="152" x2="215" y2="190" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <polygon points="215,190 210,177 202,185" fill="var(--figure-ink)"/>

    <rect x="55" y="190" width="80" height="46" rx="9"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <rect x="175" y="190" width="80" height="46" rx="9"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="95" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="var(--figure-ink)">3 <tspan font-style="italic">C</tspan></text>
    <text x="215" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="var(--figure-ink)">3 <tspan font-style="italic">C</tspan></text>

    <text x="155" y="272" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--figure-ink)">6 = 3 + 3 — aucun <tspan font-style="italic">CO</tspan><tspan dy="3" font-size="7.5">2</tspan><tspan dy="-3"> ici</tspan></text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════ STEP 4 — remboursement (+4 ATP, bilan net +2) ══════════════════════ -->
  <g id="step-4">
    <text x="95" y="227" text-anchor="middle" font-size="8.5" font-style="italic" fill="var(--figure-ink-soft)">pyruvate</text>
    <text x="215" y="227" text-anchor="middle" font-size="8.5" font-style="italic" fill="var(--figure-ink-soft)">pyruvate</text>

    <!-- 4 ATP produits -->
    <rect x="270" y="195" width="90" height="34" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="315" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="var(--figure-ink)">4 ATP</text>

    <!-- 2 NADH,H+ : forme DIFFÉRENTE (hexagone) — pour bien marquer que ce n'est pas de l'ATP -->
    <polygon points="270,255 287,241 340,241 357,255 340,269 287,269"
             fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <text x="313" y="251" text-anchor="middle" font-size="9" font-weight="700" fill="var(--figure-ink)"
          >2 <tspan font-style="italic">NADH</tspan>,<tspan font-style="italic">H</tspan><tspan dy="-4" font-size="7">+</tspan></text>
    <text x="313" y="264" text-anchor="middle" font-size="8" fill="var(--figure-ink-soft)">(≠ ATP)</text>

    <text x="482" y="196" font-size="10" font-weight="600" fill="var(--figure-ink)">+ 4 ATP → total : 4 − 2 = +2</text>

    <!-- bilan net — SEUL accent de la figure -->
    <rect x="470" y="224" width="190" height="56" rx="10"
          fill="var(--figure-accent)" fill-opacity="0.1" stroke="var(--figure-accent)" stroke-width="2.4"/>
    <text x="565" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--figure-accent)">BILAN NET</text>
    <text x="565" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--figure-accent)">+2 ATP / glucose</text>
  </g><!-- /step-4 -->

</svg>
