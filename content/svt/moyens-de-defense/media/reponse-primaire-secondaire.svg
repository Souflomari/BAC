<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -2 893 434"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le titre d’anticorps au cours du temps (échelle logarithmique), pour deux rencontres avec le même antigène : la réponse primaire démarre lentement (délai de 7 à 14 jours) et culmine vers 100 UA au jour 14 ; la réponse secondaire, après la seconde injection, démarre en 2 à 5 jours et culmine vers 10 000 UA au jour 33 — plus rapide, plus intense, plus durable, grâce aux cellules mémoire.">
  <title>Réponse primaire vs réponse secondaire : le titre d’anticorps, échelle log</title>

  <!--
    reponse-primaire-secondaire.svg — STAGED, 4 étapes cumulatives,
    ordre canonique GRAPHE (axes → données → lecture), mais découpé en 4
    par le brief (axes / réponse primaire / réponse secondaire / lecture).

    step-1 : les axes — t (jours) en abscisse, titre d'anticorps (UA) en
             ordonnée LOGARITHMIQUE (nécessaire : les deux pics diffèrent
             d'un facteur ~100, cf. R9), + les deux injections du MÊME
             antigène marquées sur l'axe des temps (t=0 et t=28).
    step-2 : + la courbe de la réponse primaire (t=0→28), pic ≈ 100 UA au
             jour 14 — couleur neutre (ink).
    step-3 : + la courbe de la réponse secondaire (t=28→42), pic ≈ 10 000
             UA au jour 33 (5 jours après le rappel) — accent (l'idée :
             un pic bien plus haut).
    step-4 : + la lecture : plus rapide, plus intense, plus durable,
             cellules mémoire — accent (la conclusion pédagogique).

    Valeurs cohérentes avec R9 (pic primaire ≈ 100 UA au jour 14 ; pic
    secondaire ≈ 10 000 UA, 5 jours après le rappel).

    SIMPLIFICATIONS ASSUMÉES (disclosure) :
      (1) Une échelle logarithmique ne peut pas représenter zéro : le
          titre "quasiment nul" du texte est donc dessiné au niveau du
          repère le plus bas (1 UA), une convention visuelle, pas une
          valeur mesurée.
      (2) La courbe entre les points clés (t, titre) — eux-mêmes
          positionnés par un calcul log10 exact sur l'axe des ordonnées —
          est une interpolation lissée à la main (aucune formule n'est
          donnée pour la cinétique d'un titre d'anticorps dans ce
          chapitre) : seule la POSITION des points clés est calculée,
          pas la forme entre eux. Même esprit que regimes-uc.svg.
      (3) Les deux injections sont montrées sur UNE MÊME frise temporelle
          partagée (t=28 = "3 mois plus tard" du texte R9, compressés
          pour tenir dans un seul cadre) — la courbe est continue : c'est
          LE MÊME titre, mesuré en continu, qui redémarre après le rappel.

    Repère des pixels (x = 90 + 690/42 · t ; y = 380 − 80 · log10(v)) :
      t=0→x=90, t=7→205, t=14→320, t=21→435, t=28→550, t=35→665, t=42→780
      v=1→y=380, v=10→300, v=100→220, v=1000→140, v=10000→60
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes + les deux injections
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="430" y="16" text-anchor="middle"
          font-size="12.5" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Réponse primaire vs réponse secondaire — le titre d’anticorps (échelle log)
    </text>

    <!-- Étiquettes des deux injections (au-dessus du panneau) -->
    <text x="90" y="34" text-anchor="middle" font-size="8.5" fill="var(--figure-ink)">1<tspan font-size="6" dy="-3">re</tspan><tspan dy="3"> injection</tspan></text>
    <text x="550" y="34" text-anchor="middle" font-size="8.5" fill="var(--figure-ink)">2<tspan font-size="6" dy="-3">e</tspan><tspan dy="3"> injection (même antigène)</tspan></text>

    <!-- Fond du panneau -->
    <rect x="54" y="44" width="756" height="362" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Repères verticaux des deux injections -->
    <line x1="90" y1="44" x2="90" y2="380" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <polygon points="90,40 86,48 94,48" fill="var(--figure-ink-soft)"/>
    <line x1="550" y1="44" x2="550" y2="380" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <polygon points="550,40 546,48 554,48" fill="var(--figure-ink-soft)"/>

    <!-- Grille horizontale (décades log) -->
    <line x1="90" y1="300" x2="800" y2="300" stroke="var(--figure-grid)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="90" y1="220" x2="800" y2="220" stroke="var(--figure-grid)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="90" y1="140" x2="800" y2="140" stroke="var(--figure-grid)" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="90" y1="60" x2="800" y2="60" stroke="var(--figure-grid)" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Axe des abscisses : t (jours) -->
    <line x1="90" y1="380" x2="800" y2="380" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="810,380 798,375.5 798,384.5" fill="var(--figure-ink-soft)"/>
    <!-- Le nom de l'axe passe AU-DESSUS de l'axe : posé à y=384 il était
         traversé par l'axe lui-même sur toute sa largeur (mesuré 99 %), et
         la ligne des graduations occupe y=398 juste dessous. -->
    <text x="800" y="370" text-anchor="end" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">t (jours)</text>

    <!-- Axe des ordonnées : titre d'anticorps, log -->
    <line x1="90" y1="380" x2="90" y2="45" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,35 85.5,47 94.5,47" fill="var(--figure-ink-soft)"/>
    <text x="24" y="230" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)"
          transform="rotate(-90 24 230)">titre d’anticorps (UA)</text>

    <!-- Graduations x -->
    <g font-size="9.5" fill="var(--figure-ink-soft)" text-anchor="middle">
      <text x="90" y="398">0</text>
      <text x="205" y="398">7</text>
      <text x="320" y="398">14</text>
      <text x="435" y="398">21</text>
      <text x="550" y="398">28</text>
      <text x="665" y="398">35</text>
      <text x="780" y="398">42</text>
    </g>

    <!-- Graduations y -->
    <g font-size="9.5" fill="var(--figure-ink-soft)" text-anchor="end">
      <text x="82" y="384">1</text>
      <text x="82" y="304">10</text>
      <text x="82" y="224">100</text>
      <text x="82" y="144">1000</text>
      <text x="82" y="64">10 000</text>
    </g>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — réponse primaire (t=0 → 28), pic ≈ 100 UA (j14)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="
      M90,380
      C120,378 150,378 172,374
      C185,372 195,364 205,356
      C220,344 240,310 254,286
      C265,268 275,254 287,244
      C300,234 310,226 320,220
      C340,226 355,232 369,238
      C390,246 415,258 435,268
      C455,278 480,290 501,300
      C520,308 538,318 550,324
    " fill="none" stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>

    <circle cx="320" cy="220" r="3.2" fill="var(--figure-ink)"/>
    <line x1="320" y1="220" x2="320" y2="196" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="320" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-ink)">réponse primaire</text>
    <text x="320" y="196" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">pic ≈ 100 UA (j. 14)</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — réponse secondaire (t=28 → 42), pic ≈ 10 000 UA (j33)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path d="
      M550,324
      C558,324 562,324 566,324
      C572,324 578,250 583,182
      C588,150 592,138 599,126
      C610,105 620,80 632,60
      C650,63 668,70 681,78
      C698,87 715,94 731,102
      C748,110 765,118 780,126
    " fill="none" stroke="var(--figure-accent)" stroke-width="2.4" stroke-linecap="round"/>

    <circle cx="632" cy="60" r="3.6" fill="var(--figure-accent)"/>
    <line x1="632" y1="60" x2="615" y2="55" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="610" y="50" text-anchor="end" font-size="11" font-weight="600" fill="var(--figure-accent)">réponse secondaire</text>
    <text x="610" y="64" text-anchor="end" font-size="9.5" fill="var(--figure-accent)">pic ≈ 10 000 UA (j. 33)</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — la lecture : plus rapide, plus intense, plus durable
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <text x="104" y="76" font-size="10.5" fill="var(--figure-accent)">plus rapide — délai ≈ 2–5 j (au lieu de 7–14 j)</text>
    <text x="104" y="94" font-size="10.5" fill="var(--figure-accent)">plus intense — pic ×100 environ</text>
    <text x="104" y="112" font-size="10.5" fill="var(--figure-accent)">plus durable — décline plus lentement</text>
    <text x="104" y="132" font-size="10.5" font-weight="600" fill="var(--figure-accent)">→ effet des lymphocytes B et T mémoire</text>
  </g><!-- /step-4 -->

</svg>
