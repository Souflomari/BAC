<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Les deux voies de l'immunité adaptative : à gauche, un antigène libre sélectionne un lymphocyte B qui se différencie, après expansion clonale et signal du lymphocyte T4, en plasmocyte sécrétant des anticorps — une action indirecte (neutralise, agglutine, marque) sur une cible extracellulaire. À droite, une cellule infectée affichant un fragment viral sélectionne un lymphocyte T8 qui se différencie, après expansion clonale et signal du lymphocyte T4, en lymphocyte T cytotoxique détruisant la cellule infectée par contact direct — la seule des deux voies qui détruit réellement sa cible.">
  <title>Les deux voies de l'immunité adaptative : action à distance vs contact direct</title>

  <!--
    reponse-humorale-cellulaire.svg — figure STATIQUE (pas de step-groups).
    Cible précise, DEUX erreurs classiques nommées dans le texte, qui se
    recoupent structurellement au même embranchement :
      - R5 : « les anticorps détruisent directement l'agent infectieux » —
        FAUX, leur action est toujours indirecte (neutralise / agglutine /
        marque) sur des cibles EXTRACELLULAIRES.
      - R4/R6 : « les lymphocytes B et T ont le même rôle » — FAUX, ce sont
        deux lignées distinctes, avec deux mécanismes d'action différents
        (sécrétion à distance vs contact direct) et deux types de cibles
        (antigène libre vs cellule déjà infectée).
    Le lymphocyte T4 (R7) est représenté au centre, envoyant un signal
    (ligne pointillée, sans tête de flèche — lien conceptuel, pas un flux
    physique) vers les deux branches, sans détruire ni sécréter lui-même.

    Layout (haut → bas, deux colonnes symétriques) :
      Entrée (antigène libre / fragment viral affiché)
      → sélection clonale (LB / LT8)
      → expansion clonale (LB / LT8)  ←— signal du LT4 (au centre)
      → différenciation (plasmocyte / lymphocyte T cytotoxique)
      → mode d'action + cible (action indirecte / contact direct → destruction)

    Convention couleur : le seul accent (--figure-accent) de la figure marque
    la case finale de la voie cellulaire (« Contact DIRECT → destruction ») —
    c'est la seule action réellement destructrice montrée ici, et c'est
    précisément le point que les deux erreurs classiques ci-dessus confondent
    avec l'action (indirecte) des anticorps. Tout le reste du diagramme reste
    en --figure-ink / --figure-ink-soft, sans hiérarchie de couleur
    supplémentaire (un seul accent, une seule idée).
  -->

  <!-- Titre -->
  <text x="380" y="20" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Deux voies de l'immunité adaptative : action à distance vs contact direct
  </text>

  <!-- En-têtes de colonnes -->
  <text x="190" y="37" text-anchor="middle" font-size="10.5" font-weight="600"
        letter-spacing="0.02em" fill="var(--figure-ink-soft)">Voie humorale (LB)</text>
  <text x="570" y="37" text-anchor="middle" font-size="10.5" font-weight="600"
        letter-spacing="0.02em" fill="var(--figure-ink-soft)">Voie cellulaire (LT8)</text>

  <!-- ── Ligne 1 : entrée ────────────────────────────────────────────────── -->
  <rect x="80" y="48" width="220" height="46" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <text x="190" y="68" text-anchor="middle" font-size="12" fill="var(--figure-ink)">Antigène libre</text>
  <text x="190" y="84" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">(extracellulaire)</text>

  <rect x="460" y="48" width="220" height="46" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <text x="570" y="68" text-anchor="middle" font-size="12" fill="var(--figure-ink)">Fragment viral affiché</text>
  <text x="570" y="84" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">(cellule infectée)</text>

  <!-- Flèche 1 → 2 -->
  <line x1="190" y1="94" x2="190" y2="122" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="184,122 196,122 190,128" fill="var(--figure-ink)"/>
  <line x1="570" y1="94" x2="570" y2="122" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="564,122 576,122 570,128" fill="var(--figure-ink)"/>

  <!-- ── Ligne 2 : sélection clonale ─────────────────────────────────────── -->
  <rect x="80" y="128" width="220" height="46" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="190" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">Lymphocyte B (LB)</text>
  <text x="190" y="164" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">sélection clonale</text>

  <rect x="460" y="128" width="220" height="46" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="570" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">Lymphocyte T8</text>
  <text x="570" y="164" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">sélection clonale</text>

  <!-- Flèche 2 → 3 -->
  <line x1="190" y1="174" x2="190" y2="202" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="184,202 196,202 190,208" fill="var(--figure-ink)"/>
  <line x1="570" y1="174" x2="570" y2="202" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="564,202 576,202 570,208" fill="var(--figure-ink)"/>

  <!-- ── Ligne 3 : expansion clonale ─────────────────────────────────────── -->
  <rect x="80" y="208" width="220" height="46" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="190" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">Expansion clonale</text>

  <rect x="460" y="208" width="220" height="46" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="570" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">Expansion clonale</text>

  <!-- ── Lymphocyte T4 : signal de coordination (centre) ────────────────── -->
  <rect x="305" y="277" width="150" height="48" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
  <text x="380" y="297" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-ink)">Lymphocyte T4</text>
  <text x="380" y="313" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">(signal de coordination)</text>

  <!-- Signal pointillé LT4 → différenciation (lien conceptuel, sans tête) -->
  <line x1="305" y1="301" x2="250" y2="348" stroke="var(--figure-ink-soft)" stroke-width="1.4"
        stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="455" y1="301" x2="510" y2="348" stroke="var(--figure-ink-soft)" stroke-width="1.4"
        stroke-dasharray="3,3" opacity="0.6"/>
  <!-- ÉCARTÉES DE LEUR FILET (2026-09-04) : centrées sur le trait pointillé
       qu'elles nomment, les deux étiquettes en étaient rayées sur 41 % de
       leur largeur. Chacune passe du côté EXTÉRIEUR de son filet — à gauche
       pour celui de gauche, à droite pour celui de droite — donc toujours
       accolée, jamais dessus, et la symétrie de la figure est conservée. -->
  <text x="256" y="333" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">signal</text>
  <text x="504" y="333" text-anchor="start" font-size="9" fill="var(--figure-ink-soft)">signal</text>

  <!-- Flèche 3 → 4 (colonnes, passent de part et d'autre du LT4) -->
  <line x1="190" y1="254" x2="190" y2="342" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="184,342 196,342 190,348" fill="var(--figure-ink)"/>
  <line x1="570" y1="254" x2="570" y2="342" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="564,342 576,342 570,348" fill="var(--figure-ink)"/>

  <!-- ── Ligne 4 : différenciation ───────────────────────────────────────── -->
  <rect x="80" y="348" width="220" height="48" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="190" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">Plasmocyte</text>

  <rect x="460" y="348" width="220" height="48" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="570" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-ink)">Lymphocyte T</text>
  <text x="570" y="386" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-ink)">cytotoxique (LTc)</text>

  <!-- Flèche 4 → 5 -->
  <line x1="190" y1="396" x2="190" y2="424" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="184,424 196,424 190,430" fill="var(--figure-ink)"/>
  <line x1="570" y1="396" x2="570" y2="424" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="564,424 576,424 570,430" fill="var(--figure-ink)"/>

  <!-- ── Ligne 5 : mode d'action + cible ─────────────────────────────────── -->
  <rect x="80" y="430" width="220" height="64" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <text x="190" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="var(--figure-ink)">Action INDIRECTE</text>
  <text x="190" y="468" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">(neutralise, agglutine, marque)</text>
  <text x="190" y="484" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">cible : agent extracellulaire</text>

  <rect x="460" y="430" width="220" height="64" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="2.4"/>
  <text x="570" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="var(--figure-accent)">Contact DIRECT</text>
  <text x="570" y="468" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-accent)">→ destruction</text>
  <text x="570" y="484" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">cible : cellule infectée</text>

  <!-- Légende de clôture -->
  <text x="380" y="512" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">
    Seul le contact direct (LTc) détruit ; l'anticorps agit toujours à distance, jamais par destruction directe.
  </text>
</svg>
