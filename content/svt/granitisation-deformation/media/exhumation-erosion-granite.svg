<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Coupe verticale d'une chaîne de collision juste après l'épaississement : un gneiss vers 20 kilomètres et un pluton de granite vers 30 kilomètres, tous deux enfouis sous une haute chaîne. Le soulèvement tectonique pousse la croûte vers le haut pendant que l'érosion décape progressivement le sommet, exposant d'abord le gneiss puis, bien plus tard, le granite.">
  <title>Exhumer le granite : soulèvement et érosion</title>

  <!--
    exhumation-erosion-granite.svg — figure STAGED, 4 étapes (LESSON-
    EXPERIENCE-SPEC §2). Cible : R5 du lesson.md — le granite occupe la
    racine d'une chaîne de collision (≈30 km) ; il faut le même mécanisme
    d'exhumation qu'un gneiss (soulèvement + érosion), mais poussé plus
    loin, pour l'amener à l'air libre.

    Contrat DOM-additif : la position du gneiss et du pluton de granite est
    fixée UNE SEULE FOIS en step-1 et ne bouge jamais. Ce qui change à
    chaque étape n'est jamais un déplacement de matière déjà dessinée, mais
    un AJOUT : des flèches de soulèvement (step-2), une hachure "matière
    érodée" + une nouvelle ligne de surface + un anneau de mise en évidence
    autour du gneiss déjà dessiné (step-3, même procédé que l'anneau de
    surbrillance d'arbre-pondere.svg — jamais une retouche de la forme
    d'origine), puis la même chose pour le granite (step-4).

    step-1 : coupe enfouie juste après la collision — relief initial élevé,
             gneiss (≈20 km) et pluton de granite, la racine (≈30 km,
             --figure-accent, seule idée accentuée — cohérent avec
             granite-texture-grenue.svg).
    step-2 : AJOUTE les flèches de soulèvement tectonique.
    step-3 : AJOUTE l'érosion jusqu'au niveau du gneiss — nouvelle ligne de
             surface + hachures "matière décapée" + anneau + étiquette
             "exposé" sur le gneiss (déjà dessiné, jamais redessiné).
    step-4 : AJOUTE l'érosion jusqu'au niveau du granite — même procédé sur
             le pluton + le rappel R0 (Massif central, Bretagne, Meseta).

    Hors sujet ici (R3/R4, déjà traités par d'autres figures) : aucune
    explication de l'anatexie, aucune texture de cristaux — le granite est
    une masse simplement étiquetée. Profondeurs en ordre de grandeur ;
    soulèvement et érosion schématiques, sans taux quantifié.
  -->

  <!-- Titre -->
  <text x="320" y="22" text-anchor="middle" font-size="13.5" font-weight="600"
        letter-spacing="0.01em" fill="var(--figure-ink)">
    Exhumer le granite : soulèvement et érosion
  </text>

  <!-- Axe de profondeur (convention reprise de granite-texture-grenue.svg) -->
  <line x1="70" y1="90" x2="70" y2="470" stroke="var(--figure-ink)" stroke-width="1.6"/>
  <polygon points="70,482 64,468 76,468" fill="var(--figure-ink)"/>
  <text x="70" y="80" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>
  <text x="70" y="498" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">≈35 km</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — état enfoui, juste après la collision
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Relief initial, élevé -->
    <polygon points="320,90 375,60 430,90" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="480" y="70" font-size="9.5" fill="var(--figure-ink-soft)">haute chaîne,</text>
    <text x="480" y="83" font-size="9.5" fill="var(--figure-ink-soft)">juste après la collision</text>

    <!-- Panneau : la coupe de croûte -->
    <rect x="190" y="90" width="370" height="380" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.8"/>

    <!-- Gneiss, ≈20 km -->
    <rect x="205" y="290" width="340" height="34" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="375" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="var(--figure-ink)">GNEISS</text>

    <!-- Pluton de granite, la racine, ≈30 km -->
    <ellipse cx="375" cy="416" rx="95" ry="38" fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="2.4"/>
    <text x="375" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--figure-accent)">GRANITE</text>
    <text x="375" y="427" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">(la racine)</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — soulèvement tectonique
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="150" y1="460" x2="150" y2="112" stroke="var(--figure-ink)" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="150,98 144,114 156,114" fill="var(--figure-ink)"/>
    <line x1="600" y1="460" x2="600" y2="112" stroke="var(--figure-ink)" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="600,98 594,114 606,114" fill="var(--figure-ink)"/>
    <text x="375" y="490" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink)">
      soulèvement tectonique
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — l'érosion atteint le niveau du gneiss
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="190" y1="307" x2="560" y2="307" stroke="var(--figure-ink)" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="566" y="303" font-size="9.5" fill="var(--figure-ink-soft)">surface</text>
    <text x="566" y="315" font-size="9.5" fill="var(--figure-ink-soft)">érodée</text>

    <!-- Matière décapée (hachures) -->
    <g stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
      <line x1="215" y1="115" x2="235" y2="130"/>
      <line x1="255" y1="110" x2="275" y2="125"/>
      <line x1="300" y1="120" x2="320" y2="135"/>
      <line x1="345" y1="105" x2="365" y2="120"/>
      <line x1="390" y1="130" x2="410" y2="145"/>
      <line x1="435" y1="110" x2="455" y2="125"/>
      <line x1="480" y1="125" x2="500" y2="140"/>
      <line x1="520" y1="115" x2="540" y2="130"/>
      <line x1="230" y1="180" x2="250" y2="195"/>
      <line x1="310" y1="190" x2="330" y2="205"/>
      <line x1="400" y1="185" x2="420" y2="200"/>
      <line x1="470" y1="195" x2="490" y2="210"/>
      <line x1="250" y1="250" x2="270" y2="265"/>
      <line x1="340" y1="255" x2="360" y2="270"/>
      <line x1="430" y1="245" x2="450" y2="260"/>
      <line x1="500" y1="260" x2="520" y2="275"/>
    </g>

    <!-- Mise en évidence : le gneiss est maintenant exposé -->
    <rect x="199" y="284" width="352" height="46" fill="none" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <text x="375" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-accent)">
      gneiss — exposé
    </text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — l'érosion atteint le niveau du granite
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="190" y1="416" x2="560" y2="416" stroke="var(--figure-ink)" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="566" y="412" font-size="9.5" fill="var(--figure-ink-soft)">surface</text>
    <text x="566" y="424" font-size="9.5" fill="var(--figure-ink-soft)">érodée</text>

    <!-- Matière décapée (hachures), du gneiss au granite -->
    <g stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
      <line x1="220" y1="335" x2="240" y2="350"/>
      <line x1="270" y1="345" x2="290" y2="360"/>
      <line x1="330" y1="330" x2="350" y2="345"/>
      <line x1="390" y1="345" x2="410" y2="360"/>
      <line x1="450" y1="335" x2="470" y2="350"/>
      <line x1="510" y1="345" x2="530" y2="360"/>
      <line x1="230" y1="385" x2="250" y2="400"/>
      <line x1="300" y1="395" x2="320" y2="400"/>
      <line x1="370" y1="385" x2="390" y2="400"/>
      <line x1="440" y1="395" x2="460" y2="400"/>
      <line x1="500" y1="385" x2="520" y2="400"/>
    </g>

    <!-- Mise en évidence : le granite est maintenant exposé -->
    <ellipse cx="375" cy="416" rx="101" ry="44" fill="none" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <text x="375" y="472" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-accent)">
      granite — exposé
    </text>

    <text x="375" y="515" text-anchor="middle" font-size="10.5" fill="var(--figure-ink)">
      Massif central, Bretagne, Meseta marocaine :
    </text>
    <text x="375" y="530" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">
      des chaînes anciennes, décapées jusqu'à leur racine
    </text>
  </g><!-- /step-4 -->

</svg>
