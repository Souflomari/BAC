notion: dysfonctionnements-immunitaires
skill_code: svt_dysfonctionnements_immunitaires
misconceptions: []
items:
  - id: DI-1
    rung: "R4"
    difficulty_level: 2
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Quel type d'immunite la vaccination confere-t-elle ?
    type: mcq
    choices:
      - id: A
        text: "Une immunite active et durable, car elle provoque la formation de cellules memoire"
        correct: true
      - id: B
        text: "Une immunite passive et immediate, car on injecte directement des anticorps"
        correct: false
        feedback: >
          Ca, c'est la serotherapie. La vaccination n'injecte pas d'anticorps
          tout prets : elle expose l'organisme a un antigene inoffensif pour
          qu'il fabrique LUI-MEME sa reponse et sa memoire.
      - id: C
        text: "Une immunite qui agit des l'injection, sans delai"
        correct: false
        feedback: >
          Non : la reponse vaccinale demande plusieurs jours (le temps de la
          selection clonale et de la production). C'est la serotherapie qui
          agit immediatement.
      - id: D
        text: "Une protection definitive contre toutes les maladies"
        correct: false
        feedback: >
          Un vaccin protege contre UN agent precis (celui dont il porte
          l'antigene), et souvent des rappels sont necessaires. Il n'immunise
          pas contre tout.
    correct_feedback: >
      Exact : le vaccin fait produire par l'organisme lui-meme des lymphocytes
      memoire (immunite active), d'ou une protection differee mais durable.
    solution: |
      La vaccination introduit un antigene rendu inoffensif. L'organisme monte
      une reponse adaptative primaire et conserve des lymphocytes memoire.
      Lors d'un contact ulterieur avec le vrai agent, la reponse secondaire est
      rapide et intense. C'est une immunite ACTIVE (l'organisme fabrique sa
      reponse) et DURABLE (grace a la memoire).

  - id: DI-2
    rung: "R5"
    difficulty_level: 2
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      La serotherapie consiste a injecter directement des anticorps prets a
      l'emploi. Quelle immunite obtient-on ?
    type: mcq
    choices:
      - id: A
        text: "Immediate mais de courte duree (passive), car le patient ne fabrique ni ces anticorps ni de cellules memoire"
        correct: true
      - id: B
        text: "Differee mais durable, comme un vaccin"
        correct: false
        feedback: >
          C'est l'inverse. Les anticorps injectes agissent tout de suite, mais
          comme le patient ne les produit pas lui-meme et ne garde pas de
          memoire, la protection disparait quand ils sont degrades.
      - id: C
        text: "Durable, car les anticorps injectes se multiplient dans l'organisme"
        correct: false
        feedback: >
          Les anticorps ne se multiplient pas (ce sont des molecules, pas des
          cellules). Ils sont progressivement elimines, d'ou une protection
          breve.
      - id: D
        text: "Aucune : injecter des anticorps ne sert a rien"
        correct: false
        feedback: >
          Au contraire, c'est tres utile en URGENCE (venin, toxine) : les
          anticorps neutralisent immediatement la cible. Simplement, l'effet
          ne dure pas.
    correct_feedback: >
      Oui : anticorps tout prets = action immediate, mais sans production ni
      memoire propre au patient, donc protection passive et breve.
    solution: |
      En serotherapie, on apporte des anticorps deja fabriques (par un autre
      organisme). Ils neutralisent l'antigene DES l'injection : action
      immediate. Mais le patient ne les produit pas et ne developpe pas de
      cellules memoire ; les anticorps sont degrades en quelques semaines. La
      protection est donc PASSIVE et COURTE.

  - id: DI-3
    rung: "R6"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Une personne vient d'etre mordue par un serpent venimeux et sa vie est en
      danger immediat. Quelle approche est adaptee ?
    type: mcq
    choices:
      - id: A
        text: "La serotherapie, car son action est immediate"
        correct: true
      - id: B
        text: "La vaccination, car elle protege durablement"
        correct: false
        feedback: >
          Une vaccination mettrait plusieurs jours a agir : bien trop tard face
          a un venin qui agit en quelques minutes ou heures. Il faut une action
          IMMEDIATE, donc la serotherapie.
      - id: C
        text: "Attendre que l'organisme fabrique lui-meme ses anticorps"
        correct: false
        feedback: >
          La reponse adaptative primaire est trop lente pour une urgence
          vitale. On apporte des anticorps deja prets (serotherapie).
      - id: D
        text: "Un vaccin suivi immediatement d'un rappel"
        correct: false
        feedback: >
          Meme avec rappel, la production d'anticorps par l'organisme prend du
          temps. En urgence, seule la serotherapie agit assez vite.
    correct_feedback: >
      Exact : face a une urgence (venin, toxine), on injecte des anticorps deja
      prets pour neutraliser tout de suite. La vaccination, lente, est
      preventive, pas curative en urgence.
    solution: |
      Le choix depend du DELAI d'action requis. Un venin agit vite : il faut
      neutraliser la toxine immediatement. Seule la serotherapie (anticorps
      prets a l'emploi, immunite passive) offre cette action immediate. La
      vaccination est preventive et lente : inadaptee a une urgence deja
      declaree.

  - id: DI-4
    rung: "R2"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Qu'est-ce qui caracterise une maladie auto-immune ?
    type: mcq
    choices:
      - id: A
        text: "Une rupture de la tolerance au soi : le systeme immunitaire attaque les propres molecules de l'organisme"
        correct: true
      - id: B
        text: "Une reaction exageree du systeme immunitaire face a une substance etrangere inoffensive"
        correct: false
        feedback: >
          Ca, c'est une ALLERGIE (reaction excessive a un allergene EXTERIEUR).
          Dans une maladie auto-immune, la cible n'est pas exterieure : c'est
          le soi.
      - id: C
        text: "Une destruction des lymphocytes T4 par un virus"
        correct: false
        feedback: >
          C'est le mecanisme du SIDA (deficit immunitaire du au VIH), pas une
          maladie auto-immune. Ici il n'y a pas d'agression du soi par
          lui-meme.
      - id: D
        text: "Une incapacite totale a produire des anticorps"
        correct: false
        feedback: >
          Une maladie auto-immune n'est pas un DEFICIT : le systeme fonctionne
          (parfois trop), mais il se trompe de cible en s'attaquant au soi.
    correct_feedback: >
      Oui : le probleme est une perte de la tolerance au soi. Le systeme, qui
      devrait epargner les molecules du soi, les prend pour cibles.
    solution: |
      Normalement, le systeme immunitaire tolere le soi (les marqueurs CMH et
      molecules propres). Dans une maladie auto-immune, cette tolerance est
      rompue : des lymphocytes ou auto-anticorps s'attaquent aux cellules ou
      molecules de l'organisme lui-meme (ex. diabete de type 1, polyarthrite
      rhumatoide).

  - id: DI-5
    rung: "R2"
    difficulty_level: 4
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Qu'est-ce qui distingue fondamentalement une allergie d'une maladie
      auto-immune ?
    type: mcq
    choices:
      - id: A
        text: "La cible de la reaction : un element etranger inoffensif pour l'allergie, une molecule du soi pour l'auto-immunite"
        correct: true
      - id: B
        text: "L'allergie touche les enfants, l'auto-immunite les adultes"
        correct: false
        feedback: >
          L'age n'est pas le critere. Les deux peuvent survenir a tout age. La
          difference de fond est la NATURE de la cible attaquee.
      - id: C
        text: "L'allergie est genetique, l'auto-immunite est infectieuse"
        correct: false
        feedback: >
          Ni l'une ni l'autre n'est "infectieuse", et les deux ont des
          composantes de terrain. Le vrai critere est la cible : allergene
          exterieur contre molecule du soi.
      - id: D
        text: "L'allergie detruit les lymphocytes, l'auto-immunite les active"
        correct: false
        feedback: >
          Aucune des deux ne se resume a cela. Toutes deux sont des reponses
          MAL DIRIGEES ; ce qui les separe, c'est CONTRE QUOI elles se
          dirigent : le non-soi inoffensif ou le soi.
    correct_feedback: >
      Exact : les deux sont des dysfonctionnements par exces/erreur, mais
      l'allergie vise un allergene EXTERIEUR inoffensif, l'auto-immunite vise
      le SOI.
    solution: |
      Les deux sont des reponses immunitaires inappropriees, mais leur CIBLE
      differe :
      - allergie : reaction exageree contre un allergene EXTERIEUR et
      normalement inoffensif (pollen, aliment) ;
      - maladie auto-immune : agression des molecules ou cellules du SOI, par
      rupture de la tolerance.

  - id: DI-6
    rung: "R3"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Pourquoi l'infection par le VIH conduit-elle a un effondrement des
      defenses immunitaires ?
    type: mcq
    choices:
      - id: A
        text: "Il infecte et detruit les lymphocytes T4, desorganisant la cooperation de toute la reponse immunitaire"
        correct: true
      - id: B
        text: "Il detruit directement tous les globules blancs de l'organisme"
        correct: false
        feedback: >
          Le VIH cible specifiquement les LT4 (porteurs du recepteur qu'il
          reconnait), pas indistinctement tous les leucocytes. C'est la perte
          des LT4, chefs d'orchestre, qui paralyse le reste.
      - id: C
        text: "Il empeche uniquement la phagocytose"
        correct: false
        feedback: >
          Le probleme n'est pas la phagocytose (immunite innee) mais la
          destruction des LT4, qui coordonnent les reponses adaptatives
          humorale et cellulaire.
      - id: D
        text: "Il fabrique des anticorps contre l'organisme"
        correct: false
        feedback: >
          Le VIH ne fabrique pas d'anticorps : c'est un virus. Il detruit les
          LT4 auxiliaires, sans lesquels la coordination immunitaire s'effondre.
    correct_feedback: >
      Oui : les LT4 sont les coordinateurs de la reponse adaptative. En les
      detruisant, le VIH prive humoral et cellulaire de leur chef d'orchestre,
      d'ou les infections opportunistes du stade SIDA.
    solution: |
      Le VIH infecte les lymphocytes T4 auxiliaires, cellules qui activent et
      coordonnent a la fois la reponse humorale (LB) et la reponse cellulaire
      (LT8). En detruisant progressivement les LT4, le virus desorganise toute
      la cooperation cellulaire : au stade SIDA, l'organisme ne se defend plus
      contre des agents habituellement benins (infections opportunistes).
