notion: dysfonctionnements-immunitaires
skill_code: svt_dysfonctionnements_immunitaires
misconceptions:
  # Inventaire écrit le 2026-09-05, tiré des feedbacks déjà présents.
  - id: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
    label: "« Vaccination et sérothérapie, c'est la même chose »"
    description: >
      L'élève échange les deux dispositifs : il croit qu'un vaccin injecte des
      anticorps prêts à l'emploi et protège dès l'injection, ou qu'une
      sérothérapie déclenche une mémoire immunitaire durable, ou qu'un vaccin
      (même suivi d'un rappel) peut sauver quelqu'un dans l'heure.
    contradicts_principle: >
      Le vaccin apporte un ANTIGÈNE rendu inoffensif : c'est l'organisme du
      vacciné qui sélectionne, multiplie et différencie ses propres lymphocytes
      — une réponse primaire, donc plusieurs jours à quelques semaines, mais une
      mémoire durable. La sérothérapie apporte des ANTICORPS déjà fabriqués par
      un autre organisme : action immédiate, aucune mémoire, protection brève.

  - id: mc.svt.svt_dysfonctionnements_immunitaires.immunite-passive-mal-comprise
    label: "« Les anticorps injectés se multiplient dans le receveur — ou bien ils ne servent à rien »"
    description: >
      L'élève traite les anticorps injectés comme des cellules vivantes qui se
      multiplieraient et resteraient ; ou, à l'inverse, il juge tout apport
      extérieur inutile puisque seule une réponse produite par l'organisme
      protégerait vraiment.
    contradicts_principle: >
      Un anticorps est une MOLÉCULE, pas une cellule : il ne se multiplie jamais
      chez le receveur et finit reconnu comme étranger puis éliminé — d'où une
      protection brève. Mais dans l'intervalle il neutralise, agglutine ou
      marque sa cible dès son arrivée : c'est précisément ce qui rend la
      sérothérapie précieuse en urgence (venin, toxine).

  - id: mc.svt.svt_dysfonctionnements_immunitaires.vaccin-protection-universelle
    label: "« Un vaccin protège définitivement, et contre toutes les maladies »"
    description: >
      L'élève généralise la protection vaccinale : le vacciné deviendrait
      capable de reconnaître n'importe quel agent infectieux, et pour toujours.
    contradicts_principle: >
      Un vaccin protège contre UN agent précis — celui dont il porte l'antigène.
      Et la population de lymphocytes mémoire décroît avec le temps : des
      rappels sont parfois nécessaires pour la maintenir.

  - id: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
    label: "« Allergie, maladie auto-immune et déficit immunitaire se ressemblent »"
    description: >
      L'élève interchange les trois dysfonctionnements : il décrit une allergie
      pour définir une maladie auto-immune, invoque la destruction des LT4 par
      un virus, parle d'une incapacité à produire des anticorps, ou prête au VIH
      la fabrication d'auto-anticorps.
    contradicts_principle: >
      Trois mécanismes distincts. ALLERGIE : réaction excessive contre un
      allergène EXTÉRIEUR et inoffensif. AUTO-IMMUNITÉ : rupture de la tolérance
      au soi, le système fonctionne mais se trompe de cible. DÉFICIT (SIDA) :
      destruction des LT4 par le VIH, le système perd ses coordinateurs. Ce qui
      les sépare est la CIBLE, pas l'intensité.

  - id: mc.svt.svt_dysfonctionnements_immunitaires.critere-de-distinction-non-pertinent
    label: "« Ce qui distingue allergie et auto-immunité, c'est l'âge, ou l'origine génétique »"
    description: >
      Pour séparer les deux, l'élève choisit un critère extérieur au mécanisme :
      l'âge du patient, une origine héréditaire d'un côté et infectieuse de
      l'autre.
    contradicts_principle: >
      Les deux surviennent à tout âge et peuvent avoir une composante de
      terrain. Le seul critère de fond est la NATURE DE LA CIBLE attaquée :
      un allergène extérieur pour l'allergie, une molécule du soi pour
      l'auto-immunité.

  - id: mc.svt.svt_dysfonctionnements_immunitaires.cible-du-vih-mal-identifiee
    label: "« Le VIH détruit tous les globules blancs, ou bloque la phagocytose »"
    description: >
      L'élève rend le VIH indifféremment destructeur, ou lui fait attaquer
      l'immunité innée.
    contradicts_principle: >
      Le VIH reconnaît SPÉCIFIQUEMENT le récepteur CD4, porté au premier chef par les lymphocytes T4. C'est la perte progressive de cette population — les
      coordinateurs de la réponse adaptative — qui désorganise l'ensemble, non
      une destruction générale ni un blocage de la phagocytose.

items:
  - id: DI-1
    rung: "R4"
    difficulty_level: 2
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Quel type d'immunité la vaccination confère-t-elle ?
    type: mcq
    choices:
      - id: A
        text: "Une immunité active et durable, car c'est l'organisme du vacciné lui-même qui produit sa réponse et conserve des lymphocytes mémoire"
        correct: true
      - id: B
        text: "Une immunité passive et immédiate, car on injecte directement des anticorps prêts à l'emploi, que l'organisme n'a pas eu à fabriquer lui-même"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Ça, c'est la sérothérapie, pas la vaccination. Le vaccin n'injecte
          aucun anticorps tout prêt : il apporte seulement un antigène rendu
          inoffensif, et c'est l'organisme du vacciné qui sélectionne,
          multiplie et différencie lui-même ses lymphocytes B et T pour
          fabriquer SA propre réponse et SA propre mémoire. D'où une immunité
          ACTIVE, pas passive.
      - id: C
        text: "Une immunité qui agit dès l'injection, sans le moindre délai, parce que le produit injecté contient déjà tout ce qui protège le vacciné"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Non : comme toute réponse primaire, la réponse vaccinale exige
          d'abord la sélection puis l'expansion du clone de lymphocytes
          spécifiques de l'antigène injecté, ce qui prend plusieurs jours à
          quelques semaines. Seule la sérothérapie, qui apporte des anticorps
          déjà tout faits, agit sans délai dès l'injection.
      - id: D
        text: "Une protection définitive contre toutes les maladies, l'organisme vacciné devenant capable de reconnaître n'importe quel agent infectieux"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccin-protection-universelle
        feedback: >
          Un vaccin protège contre UN agent précis (celui dont il porte
          l'antigène), pas contre toutes les maladies, et des rappels sont
          parfois nécessaires pour maintenir une population suffisante de
          lymphocytes mémoire. Il n'immunise ni contre tout, ni forcément à
          vie sans entretien.
    correct_feedback: >
      Exact : le vaccin fait produire par l'organisme lui-même des
      lymphocytes B et T mémoire (immunité active), d'où une protection
      différée le temps de la réponse primaire, mais durable grâce à cette
      mémoire.
    solution: |
      La vaccination introduit un antigène rendu inoffensif (agent atténué,
      inactivé, ou simple fragment). L'organisme monte une réponse adaptative
      primaire (sélection clonale, expansion, différenciation en plasmocytes
      et en lymphocytes T cytotoxiques) et conserve des lymphocytes B et T
      mémoire. Lors d'un contact ultérieur avec le véritable agent, la
      réponse secondaire, appuyée sur cette mémoire, est rapide et intense.
      C'est une immunité ACTIVE (l'organisme fabrique lui-même sa réponse) et
      DURABLE (grâce à la mémoire).

  - id: DI-2
    rung: "R5"
    difficulty_level: 2
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      La sérothérapie consiste à injecter directement des anticorps prêts à
      l'emploi. Quelle immunité obtient-on ?
    type: mcq
    choices:
      - id: A
        text: "Immédiate mais de courte durée (immunité passive), car le patient reçoit des anticorps déjà fabriqués par un autre organisme, sans activer lui-même le moindre lymphocyte, et ne constitue donc aucune cellule mémoire"
        correct: true
      - id: B
        text: "Différée mais durable, comme après un vaccin : les anticorps injectés stimulent les lymphocytes du patient, qui prennent le relais et gardent la mémoire de l'agent infectieux rencontré"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          C'est l'inverse de la réalité. Les anticorps injectés agissent tout
          de suite, sans le délai d'une réponse primaire ; mais comme le
          patient ne les produit pas lui-même et ne développe aucune cellule
          mémoire, ils sont progressivement dégradés et éliminés : la
          protection s'efface en quelques semaines, contrairement à celle
          d'un vaccin, différée mais durable.
      - id: C
        text: "Durable, car les anticorps injectés se multiplient dans l'organisme du patient au même titre que ses cellules immunitaires, et y restent présents longtemps après l'injection"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.immunite-passive-mal-comprise
        feedback: >
          Les anticorps sont des molécules, pas des cellules vivantes : ils
          ne se multiplient jamais dans l'organisme receveur. Au contraire,
          ils sont progressivement reconnus comme étrangers et éliminés,
          d'où une protection brève et non renouvelée.
      - id: D
        text: "Aucune : injecter des anticorps tout faits ne sert à rien, puisque seule une réponse fabriquée par l'organisme lui-même est capable de le protéger contre un agent infectieux"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.immunite-passive-mal-comprise
        feedback: >
          Au contraire, c'est justement ce qui rend la sérothérapie précieuse
          en URGENCE (venin, toxine) : les anticorps injectés neutralisent,
          agglutinent ou marquent la cible dès leur arrivée, sans attendre la
          lente sélection clonale d'une réponse primaire. Simplement, cette
          protection ne dure pas, faute de mémoire.
    correct_feedback: >
      Oui : des anticorps tout prêts agissent immédiatement, mais comme ils
      ne sont ni produits ni renouvelés par le patient, et qu'aucune mémoire
      ne se constitue, la protection reste passive et brève.
    solution: |
      En sérothérapie, on apporte des anticorps déjà fabriqués par un autre
      organisme. Ils neutralisent l'antigène dès l'injection : action
      immédiate, sans délai de sélection clonale. Mais le patient ne les
      produit pas lui-même et ne développe aucune cellule mémoire ; ces
      anticorps étrangers sont progressivement dégradés et éliminés en
      quelques semaines. La protection est donc PASSIVE et COURTE, à
      l'opposé de la vaccination.

  - id: DI-3
    rung: "R6"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Une personne vient d'être mordue par un serpent venimeux et sa vie est
      en danger immédiat. Quelle approche est adaptée ?
    type: mcq
    choices:
      - id: A
        text: "La sérothérapie, car elle apporte des anticorps déjà prêts, actifs dès l'injection, sans le délai qu'exigerait une réponse produite par l'organisme lui-même"
        correct: true
      - id: B
        text: "La vaccination, car elle protège durablement contre le venin et permet à l'organisme de fabriquer lui-même les anticorps dont il a besoin"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Une vaccination déclencherait une réponse primaire, qui exige
          plusieurs jours de sélection puis d'expansion clonale avant de
          produire des anticorps en quantité efficace : bien trop tard face
          à un venin qui agit en quelques minutes ou heures. Il faut ici une
          action IMMÉDIATE, donc la sérothérapie, quitte à ce que sa
          protection soit brève.
      - id: C
        text: "Attendre que l'organisme fabrique lui-même ses anticorps, une réponse plus solide qu'un apport extérieur et qui laissera en outre une mémoire immunitaire"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Attendre reviendrait à laisser s'installer une réponse primaire,
          bien trop lente (plusieurs jours) pour une urgence vitale. Il faut
          apporter des anticorps déjà prêts depuis l'extérieur
          (sérothérapie) plutôt que d'attendre que le patient les fabrique
          lui-même.
      - id: D
        text: "Un vaccin suivi immédiatement d'un rappel, afin d'accélérer la production d'anticorps et d'obtenir une protection en quelques heures"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Même enchaînés, un vaccin puis un rappel exigent que l'organisme du
          patient sélectionne et différencie ses propres lymphocytes, ce qui
          prend du temps — le rappel n'est rapide que si une mémoire est déjà
          installée depuis une primo-vaccination antérieure. En urgence
          immédiate, seule l'injection d'anticorps tout faits (sérothérapie)
          agit assez vite.
    correct_feedback: >
      Exact : face à une urgence vitale (venin, toxine), on injecte des
      anticorps déjà prêts pour neutraliser tout de suite la cible. La
      vaccination, plus lente à agir, reste un outil préventif, pas curatif
      en urgence immédiate.
    solution: |
      Le choix dépend du DÉLAI d'action requis. Un venin agit vite : il faut
      neutraliser la toxine immédiatement. Seule la sérothérapie (anticorps
      prêts à l'emploi, immunité passive) offre cette action immédiate. La
      vaccination est préventive et lente à s'installer (le temps d'une
      réponse primaire) : elle est inadaptée à une urgence déjà déclarée.

  - id: DI-4
    rung: "R2"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Qu'est-ce qui caractérise une maladie auto-immune ?
    type: mcq
    choices:
      - id: A
        text: "Une rupture de la tolérance au soi : un clone de lymphocytes auto-réactifs, qui aurait dû être éliminé ou rester silencieux, s'active et attaque les propres molécules ou cellules de l'organisme"
        correct: true
      - id: B
        text: "Une réaction exagérée du système immunitaire face à une substance étrangère et pourtant inoffensive, qui déclenche des symptômes sans qu'aucun agent dangereux ne soit en cause"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          Ça, c'est une ALLERGIE : une réaction excessive dirigée contre un
          allergène EXTÉRIEUR et normalement inoffensif (pollen, venin,
          aliment). Dans une maladie auto-immune, la cible n'est pas un
          intrus extérieur : c'est une molécule ou une cellule du soi
          lui-même.
      - id: C
        text: "Une destruction des lymphocytes T4 par un virus, qui prive l'organisme des cellules chargées de coordonner l'ensemble de sa réponse immunitaire adaptative"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          C'est le mécanisme du SIDA (déficit immunitaire dû au VIH, qui
          détruit spécifiquement les LT4), pas celui d'une maladie
          auto-immune. Ici, il n'y a ni virus ni perte de lymphocytes : le
          système reste fonctionnel, mais il se trompe de cible en
          s'attaquant au soi.
      - id: D
        text: "Une incapacité totale à produire des anticorps, le système immunitaire restant muet face aux agents infectieux comme face aux molécules du soi"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          Une maladie auto-immune n'est pas un DÉFICIT de production : le
          système immunitaire fonctionne, parfois même avec excès
          (auto-anticorps, lymphocytes T cytotoxiques actifs), mais il se
          trompe de cible en s'attaquant aux molécules ou cellules du soi.
    correct_feedback: >
      Oui : le problème est une perte de la tolérance au soi. Un clone
      auto-réactif qui aurait dû rester silencieux ou être éliminé s'active
      et prend pour cible les molécules ou cellules propres à l'organisme.
    solution: |
      Normalement, la tolérance immunitaire élimine ou neutralise, dès le
      développement, les lymphocytes capables de reconnaître une molécule du
      soi. Dans une maladie auto-immune, cette tolérance est rompue : un
      clone de lymphocytes auto-réactifs survit, est activé, et s'attaque aux
      cellules ou molécules de l'organisme lui-même — par exemple les
      lymphocytes T cytotoxiques qui détruisent les cellules β du pancréas
      (diabète de type 1), ou des auto-anticorps qui s'accumulent dans les
      articulations (polyarthrite rhumatoïde).

  - id: DI-5
    rung: "R2"
    difficulty_level: 4
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Qu'est-ce qui distingue fondamentalement une allergie d'une maladie
      auto-immune ?
    type: mcq
    choices:
      - id: A
        text: "La cible de la réaction : un élément étranger inoffensif pour l'allergie, une molécule du soi pour l'auto-immunité"
        correct: true
      - id: B
        text: "L'allergie touche surtout les enfants, tandis que l'auto-immunité se déclare à l'âge adulte"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.critere-de-distinction-non-pertinent
        feedback: >
          L'âge n'est pas le critère : les deux peuvent survenir à tout âge
          (on peut devenir allergique adulte, ou développer un diabète de
          type 1 enfant). La différence de fond est la NATURE de la cible
          attaquée, pas l'âge du patient.
      - id: C
        text: "L'allergie est d'origine génétique, tandis que l'auto-immunité est déclenchée par une infection"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.critere-de-distinction-non-pertinent
        feedback: >
          Ni l'une ni l'autre n'est « infectieuse » à proprement parler, et
          les deux peuvent avoir une composante de terrain (génétique ou
          autre). Le vrai critère qui les sépare est la cible de la
          réaction : un allergène extérieur pour l'une, une molécule du soi
          pour l'autre.
      - id: D
        text: "L'allergie détruit les lymphocytes, tandis que l'auto-immunité les active de façon excessive"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          Aucune des deux ne se résume à cela : l'allergie, comme
          l'auto-immunité, repose au contraire sur l'ACTIVATION de
          lymphocytes (production d'IgE par des plasmocytes pour l'allergie ;
          lymphocytes ou auto-anticorps pour l'auto-immunité). Ce qui les
          sépare, c'est CONTRE QUOI cette activation se dirige : le non-soi
          inoffensif, ou le soi.
    correct_feedback: >
      Exact : les deux sont des dysfonctionnements par excès ou erreur de
      ciblage, mais l'allergie vise un allergène EXTÉRIEUR inoffensif, tandis
      que l'auto-immunité vise le SOI, par rupture de tolérance.
    solution: |
      Les deux sont des réponses immunitaires inappropriées, mais leur CIBLE
      diffère :
      - allergie : réaction exagérée contre un allergène EXTÉRIEUR et
      normalement inoffensif (pollen, venin, aliment), via des IgE fixées sur
      des mastocytes qui libèrent brutalement de l'histamine lors d'un
      contact ultérieur ;
      - maladie auto-immune : agression des molécules ou cellules du SOI,
      par rupture de la tolérance immunitaire normalement acquise dès le
      développement.

  - id: DI-6
    rung: "R3"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: []
    stem: >
      Pourquoi l'infection par le VIH conduit-elle à un effondrement des
      défenses immunitaires ?
    type: mcq
    choices:
      - id: A
        text: "Il reconnaît spécifiquement le récepteur CD4 porté par les lymphocytes T4, les infecte puis les détruit, désorganisant ainsi la coordination de toute la réponse adaptative"
        correct: true
      - id: B
        text: "Il détruit directement tous les globules blancs de l'organisme, qui se retrouve alors sans aucune cellule capable de le défendre"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.cible-du-vih-mal-identifiee
        feedback: >
          Le VIH ne détruit pas indifféremment tous les globules blancs : il
          reconnaît spécifiquement le récepteur CD4, porté au premier chef par les lymphocytes T4. C'est la perte progressive de cette population
          précise — les coordinateurs de la réponse adaptative — qui
          paralyse le reste, pas une destruction généralisée et immédiate de
          toutes les cellules immunitaires.
      - id: C
        text: "Il empêche uniquement la phagocytose, première étape de toute réponse immunitaire, ce qui bloque du même coup la réponse adaptative qui devait la suivre"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.cible-du-vih-mal-identifiee
        feedback: >
          Le problème n'est pas la phagocytose (un mécanisme de l'immunité
          innée que le VIH ne cible pas) mais la destruction des LT4, qui
          coordonnent normalement la différenciation des lymphocytes B en
          plasmocytes et des lymphocytes T8 en lymphocytes T cytotoxiques. Ce
          sont les deux voies de la réponse ADAPTATIVE qui s'effondrent, pas
          la phagocytose.
      - id: D
        text: "Il fabrique des anticorps dirigés contre l'organisme lui-même, qui détruisent progressivement les cellules immunitaires du malade"
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          Le VIH ne fabrique aucun anticorps : c'est un virus, pas une
          cellule immunitaire ; confondre les deux mécanismes reviendrait à
          confondre le VIH avec une maladie auto-immune. Le VIH détruit les
          lymphocytes T4 auxiliaires, et c'est la perte de leur signal de
          coordination qui effondre la coopération entre lymphocytes B et
          T8.
    correct_feedback: >
      Oui : les LT4 coordonnent la réponse adaptative. En les détruisant, le
      VIH prive les voies humorale et cellulaire de leur signal de
      coordination, d'où les infections opportunistes qui caractérisent le
      stade SIDA.
    solution: |
      Le VIH reconnaît le récepteur CD4 porté par les lymphocytes T4
      auxiliaires, cellules qui coordonnent normalement la différenciation
      des lymphocytes B en plasmocytes et des lymphocytes T8 en lymphocytes T
      cytotoxiques. En détruisant progressivement les LT4 pendant plusieurs
      années, le virus désorganise cette coopération cellulaire ; au stade
      SIDA, l'organisme ne peut plus contenir des infections dites
      opportunistes (ou certains cancers), qui deviennent la cause réelle et
      indirecte de la mortalité.

  # ── CINQ ITEMS AJOUTÉS LE 2026-09-05 ───────────────────────────────────────
  # Motif : quatre des six erreurs déclarées étaient sous le plancher de 3
  # items du banc, donc inévaluables. Ces cinq items comblent ce déficit-là.
  # CORRIGÉ le 2026-09-19 : la note disait « TROIS items » — il y en a cinq
  # (DI-7 à DI-11) — et « le périmètre de lesson.md (R1 à R6) », alors que la
  # leçon va de R0 à R7 et qu'AUCUN des cinq n'est de rang R1. La dette qui
  # subsiste est à nommer plutôt qu'à refermer par inadvertance : le rang R1
  # (le mécanisme de l'allergie — IgE, mastocytes, pontage, dégranulation,
  # histamine) reste à ZÉRO item de banc.
  - id: DI-7
    rung: "R6"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: [vaccination, serotherapie, titre_anticorps]
    stem: >
      On mesure le titre d'anticorps dans le sang de deux patients. Chez le
      premier, il reste quasi nul plusieurs jours, monte progressivement, puis
      se maintient en plateau pendant des années. Chez le second, il est déjà
      élevé dès les premières heures, puis décline jusqu'à devenir quasi nul
      en quelques semaines. Qu'a reçu chacun ?
    type: mcq
    choices:
      - id: A
        text: "Le premier a été vacciné (réponse construite par ses propres lymphocytes, entretenue par la mémoire) ; le second a reçu une sérothérapie (anticorps injectés, non renouvelés)."
        correct: true
      - id: B
        text: "Le premier a reçu une sérothérapie et le second un vaccin : les anticorps injectés lors d'un sérum se multiplient dans l'organisme du patient, ce qui explique le plateau durable observé chez le premier."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.immunite-passive-mal-comprise
        feedback: >
          Un anticorps est une MOLÉCULE, pas une cellule vivante : il ne se
          multiplie jamais chez le receveur. Les anticorps injectés sont au
          contraire progressivement éliminés, d'où le déclin — c'est la
          signature du second patient, pas du premier.
      - id: C
        text: "Les deux ont été vaccinés, contre deux agents différents : la durée de protection d'un vaccin dépend de l'agent visé, un vaccin protégeant de toute façon contre l'ensemble des maladies rencontrées ensuite."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccin-protection-universelle
        feedback: >
          Un vaccin protège contre UN agent précis, celui dont il porte
          l'antigène — jamais contre l'ensemble des maladies. Et la courbe du
          second patient n'a pas la forme d'une réponse vaccinale : elle
          commence haut et s'effondre, sans plateau ni mémoire.
      - id: D
        text: "Le premier a été vacciné et le second aussi, mais plus récemment : la différence entre les deux courbes tient uniquement au moment de la mesure, pas à la nature du produit injecté."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Le décalage dans le temps n'explique pas la forme des courbes : une
          réponse vaccinale commence TOUJOURS par plusieurs jours de titre
          quasi nul, jamais par un pic immédiat. Un titre élevé dès les
          premières heures signe des anticorps apportés de l'extérieur.
    correct_feedback: >
      Les deux courbes sont des miroirs inversés. Le vaccin apporte un
      antigène : le titre monte lentement, le temps de la réponse primaire,
      puis se maintient grâce aux cellules mémoire. Le sérum apporte des
      anticorps tout prêts : le titre est immédiat, puis s'effondre, faute de
      cellules du patient pour en produire.
    solution: |
      **Ce que la forme d'une courbe révèle :** le DÉLAI de montée dit qui
      produit les anticorps ; la DURÉE dit s'il existe une mémoire.

      **Premier patient :** montée lente (sélection puis expansion clonale) et
      plateau durable (cellules mémoire) — c'est une immunité ACTIVE, donc une
      vaccination.

      **Second patient :** pic immédiat (rien à construire) et déclin sans
      remontée (rien pour renouveler) — c'est une immunité PASSIVE, donc une
      sérothérapie.

  - id: DI-8
    rung: "R3"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: [vih, sida, lt4, deficit_immunitaire]
    stem: >
      Un patient séropositif au VIH, non traité, développe des infections dues
      à des micro-organismes habituellement inoffensifs, et ses réponses à
      anticorps comme ses réponses cytotoxiques s'effondrent toutes deux.
      Comment un seul virus produit-il un effondrement aussi général ?
    type: mcq
    choices:
      - id: A
        text: "Il infecte et détruit les lymphocytes T4, qui coordonnent la différenciation des lymphocytes B en plasmocytes comme celle des lymphocytes T8 en cellules cytotoxiques : perdre le coordinateur désorganise les deux voies."
        correct: true
      - id: B
        text: "Il détruit indifféremment toutes les cellules immunitaires qu'il rencontre dans le sang, sans reconnaissance particulière : c'est cette destruction générale qui explique que les deux types de réponse s'effondrent ensemble."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.cible-du-vih-mal-identifiee
        feedback: >
          Le VIH reconnaît SPÉCIFIQUEMENT le récepteur CD4, porté au premier chef par les lymphocytes T4. Sa cible est étroite ; c'est la POSITION de
          cette cible dans l'organisation de la réponse — un coordinateur —
          qui rend ses conséquences générales.
      - id: C
        text: "Il détruit une part importante des molécules du soi affichées à la surface des cellules, si bien que le système immunitaire ne parvient plus à distinguer ses propres cellules des agents infectieux qu'il devrait combattre."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          C'est décrire une rupture de la tolérance au soi, c'est-à-dire une
          maladie AUTO-IMMUNE. Le SIDA est un DÉFICIT : le système ne se
          trompe pas de cible, il perd les cellules qui coordonnent sa
          réponse.
      - id: D
        text: "Il bloque la phagocytose, première étape de toute réponse immunitaire, ce qui empêche mécaniquement toutes les étapes suivantes de se mettre en place, anticorps comme cellules cytotoxiques."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.cible-du-vih-mal-identifiee
        feedback: >
          La phagocytose relève de l'immunité innée, et le VIH ne la cible
          pas. Ce qu'il détruit, ce sont les LT4 — des acteurs de l'immunité
          ADAPTATIVE, situés en amont des deux voies effectrices.
    correct_feedback: >
      Le VIH reconnaît spécifiquement le récepteur CD4 des lymphocytes T4, les
      infecte et les détruit. Ces lymphocytes coordonnent la différenciation
      des LB en plasmocytes et des LT8 en cellules cytotoxiques : leur
      disparition progressive désorganise l'ensemble de la réponse adaptative.
    solution: |
      **La cible est étroite :** le récepteur CD4, porté au premier chef par les lymphocytes T4. Le VIH ne détruit ni les hématies, ni les phagocytes, ni
      « tous les globules blancs ».

      **La conséquence est large :** parce que les LT4 sont des
      COORDINATEURS. Sans eux, ni les lymphocytes B ne se différencient
      correctement en plasmocytes, ni les LT8 en cellules cytotoxiques.

      **Ce que cela n'est pas :** ni une maladie auto-immune (le système ne se
      trompe pas de cible), ni un blocage de l'immunité innée.

  - id: DI-9
    rung: "R2"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: [allergie, auto_immunite, critere_de_distinction]
    stem: >
      Deux patientes du même âge consultent le même jour : la première réagit
      violemment au pollen de bouleau, la seconde produit des anticorps
      dirigés contre les cellules de sa propre thyroïde. Sur quel critère
      range-t-on l'une du côté de l'allergie et l'autre du côté de
      l'auto-immunité ?
    type: mcq
    choices:
      - id: A
        text: "Sur la nature de la cible attaquée : un élément extérieur et inoffensif pour l'allergie, une molécule du soi pour l'auto-immunité — l'intensité de la réaction n'entre pas dans le classement."
        correct: true
      - id: B
        text: "Sur l'âge d'apparition et sur l'origine : l'allergie se déclare typiquement dans l'enfance et relève d'un terrain héréditaire, tandis que l'auto-immunité apparaît à l'âge adulte à la suite d'une infection."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.critere-de-distinction-non-pertinent
        feedback: >
          Les deux surviennent à tout âge — on devient allergique adulte, on
          développe un diabète de type 1 enfant — et les deux peuvent avoir
          une composante de terrain. Ni l'âge ni l'origine ne séparent les
          deux catégories.
      - id: C
        text: "Sur l'existence d'un traitement préventif : une allergie se prévient par une désensibilisation, alors qu'une maladie auto-immune ne se prévient jamais, ce qui suffit à les distinguer l'une de l'autre."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.critere-de-distinction-non-pertinent
        feedback: >
          La prise en charge est une conséquence, pas un critère de
          définition. Ce qui range un dysfonctionnement d'un côté ou de
          l'autre, c'est ce que le système immunitaire ATTAQUE, jamais la
          façon dont on le soigne.
      - id: D
        text: "Sur la présence d'anticorps : la seconde patiente en produit, donc son cas est immunitaire, alors que la réaction de la première relève d'une intolérance sans production d'anticorps particulière."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          L'allergie repose elle aussi sur la production d'anticorps — des IgE
          sécrétées par des plasmocytes après une première exposition
          sensibilisante. Les deux cas sont immunitaires ; ce qui les sépare
          est la cible, pas la présence d'anticorps.
    correct_feedback: >
      Le seul critère de fond est la NATURE DE LA CIBLE : un allergène
      extérieur et normalement inoffensif dans un cas, une molécule du soi
      dans l'autre. Les deux reposent sur une activation excessive de
      lymphocytes et peuvent survenir à tout âge.
    solution: |
      **Le critère qui range :** ce que le système immunitaire attaque.
      Extérieur et inoffensif → allergie. Molécule du soi → auto-immunité.

      **Les critères qui ne rangent rien :** l'âge (les deux surviennent à
      tout âge), l'origine (les deux ont une composante de terrain),
      l'intensité (les deux sont des réactions excessives), la présence
      d'anticorps (les deux en produisent).

      **Le troisième larron, à ne pas oublier :** le DÉFICIT immunitaire
      (SIDA), où le système ne se trompe pas de cible — il perd les cellules
      qui coordonnent sa réponse.

  - id: DI-10
    rung: "R3"
    difficulty_level: 4
    skill_code: svt_dysfonctionnements_immunitaires
    tags: [vih, allergie, auto_immunite, classement]
    stem: >
      Un élève range le SIDA, l'allergie au pollen et le diabète de type 1
      dans une même catégorie, « les maladies du système immunitaire », et en
      conclut qu'un même traitement pourrait les viser toutes les trois. Que
      manque-t-il à ce raisonnement ?
    type: mcq
    choices:
      - id: A
        text: "Que les trois reposent sur des mécanismes opposés : un déficit de coordination dans un cas, une réaction excessive contre un allergène extérieur dans le deuxième, une rupture de la tolérance au soi dans le troisième."
        correct: true
      - id: B
        text: "Que les trois se distinguent par leur gravité et par leur fréquence dans la population, seuls critères qui permettent de décider si un même traitement pourrait raisonnablement les viser ensemble."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.critere-de-distinction-non-pertinent
        feedback: >
          Gravité et fréquence sont des données épidémiologiques, pas des
          critères de classement immunologique. Ce qui range un
          dysfonctionnement, c'est le MÉCANISME : que fait le système, et
          contre quelle cible.
      - id: C
        text: "Que le VIH s'attaque en réalité à l'ensemble des globules blancs, ce qui distingue le SIDA des deux autres cas, où seule une catégorie précise de cellules immunitaires est touchée par la maladie."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.cible-du-vih-mal-identifiee
        feedback: >
          Le VIH est au contraire très sélectif : il reconnaît le récepteur
          CD4, porté au premier chef par les lymphocytes T4. Ce qui distingue le SIDA
          des deux autres n'est pas l'étendue de sa cible, mais le fait qu'il
          RETIRE une cellule au système au lieu de le faire réagir à tort.
      - id: D
        text: "Qu'un vaccin bien choisi suffirait à traiter les trois, puisque la vaccination construit une mémoire immunitaire capable de corriger n'importe quel dérèglement de la réponse."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccination-serotherapie-confondues
        feedback: >
          Un vaccin apporte un ANTIGÈNE pour préparer une réponse contre un
          agent précis : il ne corrige aucun dérèglement. Il ne rendrait ni sa
          tolérance à un système auto-immun, ni ses LT4 à un patient
          séropositif.
    correct_feedback: >
      Trois mécanismes distincts, non trois degrés d'une même maladie. SIDA :
      déficit, le système perd ses coordinateurs. Allergie : réaction
      excessive contre un allergène extérieur inoffensif. Auto-immunité :
      rupture de la tolérance, le système attaque le soi.
    solution: |
      **Ce que le mot « immunitaire » ne dit pas :** trois maladies peuvent
      concerner le même système et fonctionner à l'envers l'une de l'autre.

      **Trois questions pour trancher.** Le système réagit-il trop, ou pas
      assez ? Contre quelle cible ? Quelle cellule est en cause ?

      **Les trois réponses.** SIDA : pas assez, faute de LT4. Allergie : trop,
      contre un allergène extérieur. Auto-immunité : trop, contre le soi.

  - id: DI-11
    rung: "R5"
    difficulty_level: 3
    skill_code: svt_dysfonctionnements_immunitaires
    tags: [serotherapie, vaccination, urgence]
    stem: >
      Un enfant non vacciné se blesse profondément avec un objet rouillé. Le
      médecin lui administre à la fois un sérum antitétanique et une première
      dose de vaccin. Pourquoi les deux à la fois ?
    type: mcq
    choices:
      - id: A
        text: "Le sérum protège immédiatement mais quelques semaines seulement ; le vaccin ne protégera qu'au bout de plusieurs jours, mais durablement, grâce à la mémoire que l'enfant construira lui-même."
        correct: true
      - id: B
        text: "Le sérum sert à amorcer la réponse : les anticorps injectés se multiplient dans l'organisme de l'enfant et y restent, le vaccin ne venant qu'entretenir cette population d'anticorps déjà installée."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.immunite-passive-mal-comprise
        feedback: >
          Les anticorps injectés ne se multiplient jamais : ce sont des
          molécules, progressivement reconnues comme étrangères puis
          éliminées. Ils agissent tout de suite, mais ne laissent rien
          derrière eux — d'où la nécessité du vaccin en parallèle.
      - id: C
        text: "Le vaccin est administré par précaution générale : une fois vacciné contre le tétanos, l'enfant sera protégé contre l'ensemble des infections que pourrait provoquer une plaie souillée."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.vaccin-protection-universelle
        feedback: >
          Un vaccin protège contre UN agent précis, celui dont il porte
          l'antigène — ici la toxine tétanique. Il ne couvre pas les autres
          micro-organismes susceptibles d'infecter une plaie.
      - id: D
        text: "Le sérum sert à calmer une réaction allergique au métal rouillé, et le vaccin à empêcher que le système immunitaire ne se retourne ensuite contre les tissus lésés de l'enfant."
        correct: false
        misconception: mc.svt.svt_dysfonctionnements_immunitaires.dysfonctionnements-confondus
        feedback: >
          Ni allergie ni auto-immunité ne sont en cause ici : le risque est
          une INFECTION par une bactérie et sa toxine. Sérum et vaccin visent
          tous deux cet agent précis, l'un dans l'urgence, l'autre pour la
          suite.
    correct_feedback: >
      Les deux logiques se complètent exactement là où chacune est faible. Le
      sérum comble le délai que le vaccin ne peut pas éviter ; le vaccin
      comble l'absence de mémoire que le sérum ne peut pas fournir.
    solution: |
      **Le problème du moment :** la toxine tétanique peut agir en quelques
      jours. Une réponse primaire, elle, demande plusieurs jours à quelques
      semaines. Le temps manque.

      **Ce que le sérum apporte :** des anticorps déjà fabriqués, actifs dès
      l'injection — mais non renouvelés, donc éliminés en quelques semaines.

      **Ce que le vaccin apporte :** un antigène qui déclenche la réponse de
      l'enfant, lente à venir mais durable, avec des cellules mémoire pour les
      années suivantes.

