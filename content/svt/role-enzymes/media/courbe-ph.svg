<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Activité enzymatique selon le pH : l’amylase salivaire atteint son optimum vers pH 7, celui de la bouche ; la pepsine atteint le sien vers pH 2, celui de l’estomac — chaque enzyme a son propre optimum de pH.">
  <title>Courbes activité-pH — amylase salivaire et pepsine</title>

  <!--
    courbe-ph.svg — graphe STAGÉ, 3 étapes, cible R4 (fin) / prépare R6.
    Courbes qualitatives (deux cloches) : aucune constante précise, seule
    la POSITION de chaque optimum (≈7, ≈2) est fidèle au texte.

    step-1 : les axes seuls — pH (0-14) en x, activité en y. Échelle pH
             reprise EXACTEMENT de diagramme-predominance.svg (PC) pour la
             cohérence inter-matière : x(pH) = 70 + 38·pH.
    step-2 : la cloche de l'amylase, centrée pH=7, + son optimum (accent).
    step-3 : la cloche de la pepsine, centrée pH=2, + son optimum (accent) —
             les deux courbes visibles ensemble.

    Convention couleur : courbes en --figure-ink (amylase, introduite en
    premier) / --figure-ink-soft (pepsine, la comparaison) — pas de
    troisième teinte. Accent réservé à UNE seule idée, répétée deux fois :
    « voici l'optimum » (une fois par enzyme), jamais aux courbes elles-mêmes.
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="320" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Activité enzymatique selon le pH du milieu
    </text>

    <rect x="40" y="32" width="590" height="200" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <line x1="70" y1="208" x2="612" y2="208" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="612,208 600,203.5 600,212.5" fill="var(--figure-ink-soft)"/>
    <line x1="70" y1="208" x2="70" y2="50" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="70,50 65.5,61 74.5,61" fill="var(--figure-ink-soft)"/>

    <text x="618" y="212" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">pH</text>
    <text x="62" y="54" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">activité</text>

    <line x1="70" y1="204" x2="70" y2="212" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="70" y="224" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <line x1="336" y1="204" x2="336" y2="212" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="336" y="224" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">7</text>
    <line x1="602" y1="204" x2="602" y2="212" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="602" y="224" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">14</text>

    <text x="320" y="260" text-anchor="middle" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">
      activité = vitesse de la réaction enzymatique
    </text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — l'amylase salivaire, optimum ≈ pH 7
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="M203,208 C245,208 300,84 336,80 C372,84 427,208 469,208"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="336" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-ink)">
      amylase salivaire
    </text>

    <circle cx="336" cy="80" r="3.2" fill="var(--figure-accent)"/>
    <line x1="336" y1="80" x2="336" y2="208" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="336" y1="204" x2="336" y2="212" stroke="var(--figure-accent)" stroke-width="1.6"/>

    <!-- Les deux « optimum ≈ pH … » se rejoignaient dans la vallée entre les
         deux cloches et s'imprimaient l'un sur l'autre à 76 % : le mot le
         plus important de la figure — celui qui dit que chaque enzyme a SON
         optimum — était le seul illisible. Chacun repart désormais du côté
         libre de sa propre cloche : la pepsine vers l'intérieur gauche de la
         vallée, l'amylase vers la droite, au-delà de sa base. -->
    <line x1="340" y1="84" x2="474" y2="114" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="480" y="122" text-anchor="start" font-size="10.5" font-weight="600" fill="var(--figure-accent)">
      optimum ≈ pH 7
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la pepsine, optimum ≈ pH 2
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path d="M70,208 C95,165 125,85 146,80 C168,85 200,165 222,208"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="146" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-ink-soft)">
      pepsine
    </text>

    <circle cx="146" cy="80" r="3.2" fill="var(--figure-accent)"/>
    <line x1="146" y1="80" x2="146" y2="208" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="146" y1="204" x2="146" y2="212" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="146" y="224" text-anchor="middle" font-size="10" fill="var(--figure-accent)">2</text>

    <line x1="150" y1="92" x2="172" y2="116" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="176" y="124" text-anchor="start" font-size="10.5" font-weight="600" fill="var(--figure-accent)">
      optimum ≈ pH 2
    </text>
  </g><!-- /step-3 -->

</svg>
