<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 992 324"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Deux expériences côte à côte : à quantité d'enzyme fixée, la vitesse augmente avec la concentration en substrat puis atteint un palier de saturation, tous les sites actifs étant occupés ; à substrat en excès, la vitesse croît proportionnellement à la quantité d'enzyme, sans palier. Deux mécanismes différents : un palier d'un côté, une droite de l'autre.">
  <title>Vitesse enzymatique selon la concentration en substrat, puis en enzyme</title>

  <!--
    concentration-substrat-enzyme.svg — graphe STAGÉ, 4 étapes, 2 panneaux
    côte à côte, cible R5.

    step-1 : panneau A (gauche) — axes seuls, [substrat] en x, vitesse en
             y, annoté "quantité d'enzyme fixée". Panneau B pas encore
             présent (contrat additif — apparaît en step-3, avec sa donnée,
             tel qu'autoré).
    step-2 : panneau A — la courbe : montée quasi proportionnelle puis
             PALIER (saturation des sites actifs), étiqueté en accent.
    step-3 : panneau B (droite) — axes + la droite : [enzyme] en x
             (substrat en excès), vitesse en y, montée proportionnelle,
             SANS palier.
    step-4 : synthèse — bandeau accent sur le palier (panneau A) et sur la
             droite (panneau B), + phrase de clôture qui nomme les deux
             formes.

    Courbes qualitatives : aucune constante numérique, seule la FORME
    (palier vs droite) est fidèle au texte. Accent réservé à UNE seule
    idée, introduite seulement à l'étape finale : la lecture contrastée
    des deux formes (jamais aux étapes 2-3, qui restent en ink/ink-soft —
    la forme s'installe d'abord, elle n'est nommée en accent qu'au moment
    de la comparer).
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — panneau A : les axes + enzyme fixée
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="490" y="22" text-anchor="middle"
          font-size="13" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Vitesse selon la concentration en substrat, puis en enzyme
    </text>

    <rect x="30" y="40" width="430" height="200" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <line x1="80" y1="240" x2="440" y2="240" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="440,240 428,235.5 428,244.5" fill="var(--figure-ink-soft)"/>
    <line x1="80" y1="240" x2="80" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,60 75.5,71 84.5,71" fill="var(--figure-ink-soft)"/>

    <text x="446" y="244" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">[substrat]</text>
    <text x="72" y="64" text-anchor="end" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">vitesse</text>
    <text x="80" y="254" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <text x="260" y="80" text-anchor="middle" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">
      quantité d'enzyme fixée
    </text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — panneau A : montée puis palier de saturation
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="M80,240 C160,220 205,130 245,102 C295,76 350,70 440,70"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="350" y1="70" x2="440" y2="70" stroke="var(--figure-accent)"
          stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="395" y1="64" x2="395" y2="70" stroke="var(--figure-accent)" stroke-width="1.2"/>
    <text x="395" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">
      palier (saturation)
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — panneau B : axes + droite proportionnelle
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <rect x="520" y="40" width="430" height="200" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <line x1="570" y1="240" x2="930" y2="240" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="930,240 918,235.5 918,244.5" fill="var(--figure-ink-soft)"/>
    <line x1="570" y1="240" x2="570" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="570,60 565.5,71 574.5,71" fill="var(--figure-ink-soft)"/>

    <text x="936" y="244" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">[enzyme]</text>
    <text x="562" y="64" text-anchor="end" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">vitesse</text>
    <text x="570" y="254" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <text x="750" y="80" text-anchor="middle" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">
      substrat en excès
    </text>

    <path d="M570,240 L900,90" fill="none" stroke="var(--figure-ink)" stroke-width="2.4" stroke-linecap="round"/>

    <text x="790" y="200" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">
      droite : pas de palier
    </text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — synthèse : deux formes différentes
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="350" y1="54" x2="440" y2="54" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="350" y1="50" x2="350" y2="58" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="440" y1="50" x2="440" y2="58" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="395" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-accent)">PALIER</text>

    <text x="762" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-accent)">DROITE</text>

    <text x="490" y="300" text-anchor="middle" font-size="12" fill="var(--figure-ink)">
      Deux mécanismes différents : <tspan font-weight="700" fill="var(--figure-accent)">un palier</tspan> d'un côté,
      <tspan font-weight="700" fill="var(--figure-accent)"> une droite</tspan> de l'autre.
    </text>
  </g><!-- /step-4 -->

</svg>
