        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          L'énoncé précise que les deux transfusions sont de groupe O, comme
          la receveuse : l'appariement ABO est correct dans les deux cas.
          Le seul facteur qui change entre les deux épisodes est l'anticorps
          anti-D, absent la première fois, présent la seconde.
      - id: D
        text: "Les hématies Rh+ de la seconde poche portaient une quantité d'antigène D bien plus élevée que celles de la première, ce qui explique qu'elles aient franchi le seuil de déclenchement de la réaction."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
        feedback: >
