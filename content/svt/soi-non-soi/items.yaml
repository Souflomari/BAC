notion: soi-non-soi
skill_code: svt_soi_non_soi
misconceptions:
  # Inventaire écrit le 2026-09-05. Les six items existaient, leurs feedbacks
  # nommaient déjà chaque erreur avec précision — mais aucun distracteur ne
  # portait de tag, donc le modèle apprenant ne pouvait rien conclure de cette
  # notion. Les erreurs ci-dessous sont TIRÉES des feedbacks, pas inventées.
  - id: mc.svt.svt_soi_non_soi.tolerance-passive
    label: "« Si l'organisme n'attaque pas son propre soi, c'est qu'il n'a rien à y voir »"
    description: >
      L'élève explique la tolérance immunitaire par une absence : le soi ne
      porterait aucun antigène, ou le non-soi n'existerait pas encore à la
      naissance, ou la frontière soi/non-soi serait inscrite une fois pour
      toutes dans les gènes. Dans les trois cas, il n'y a rien à apprendre et
      rien à faire — la tolérance serait donnée, pas construite.
    contradicts_principle: >
      Les molécules du soi (CMH, marqueurs ABO) sont parfaitement détectables —
      c'est bien pour cela qu'une greffe incompatible est repérée par le système
      immunitaire d'un AUTRE individu. La tolérance est un processus ACTIF :
      pendant la vie embryonnaire, les cellules immunitaires capables de réagir
      contre les molécules déjà présentes sont éliminées ou neutralisées.

  - id: mc.svt.svt_soi_non_soi.reconnaissance-non-specifique
    label: "« Le système immunitaire réagit à “l'étranger” en général, pas à un antigène précis »"
    description: >
      L'élève remplace la reconnaissance moléculaire par une réaction à
      l'étrangeté : un anticorps se lierait à n'importe quelle cellule venue
      d'ailleurs, une cellule anormale serait attaquée sans reconnaissance
      préalable. La spécificité antigène-anticorps disparaît de son modèle.
    contradicts_principle: >
      Chaque anticorps reconnaît UN antigène précis. Si l'étrangeté suffisait,
      un sérum anti-A agglutinerait les quatre groupes O, A, B et AB ; seuls A
      et AB réagissent, parce que seuls eux portent l'antigène A. Même exigence
      pour une cellule infectée : elle est ciblée sur des molécules précises
      affichées à sa surface, jamais sur son seul caractère « anormal ».

  - id: mc.svt.svt_soi_non_soi.antigene-anticorps-confondus
    label: "« Antigène et anticorps désignent la même chose sous deux noms »"
    description: >
      L'élève traite les deux termes comme interchangeables et imagine
      l'agglutination comme la rencontre de deux molécules identiques.
    contradicts_principle: >
      Ce sont deux entités différentes et complémentaires : l'antigène est la
      molécule RECONNUE (portée ici par les hématies), l'anticorps la molécule
      qui la reconnaît (présente ici dans le sérum). L'agglutination est leur
      liaison, pas leur ressemblance.

  - id: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
    label: "« ABO, Rhésus et CMH sont interchangeables : l'un renseigne sur la compatibilité gouvernée par l'autre »"
    description: >
      L'élève traite les trois systèmes de marqueurs comme un seul : un groupe
      ABO identique garantirait la compatibilité d'une greffe, ou le facteur
      Rhésus déciderait d'une transfusion à la place du système ABO, ou ABO et
      Rhésus ne concerneraient que les organes.
    contradicts_principle: >
      Trois systèmes indépendants, trois portées distinctes : ABO et Rhésus sont
      des marqueurs des HÉMATIES et gouvernent les transfusions ; le CMH,
      extrêmement polymorphe et quasi unique à chaque individu (sauf vrais
      jumeaux), gouverne le rejet des GREFFES d'organes. L'identité sur l'un ne
      dit rien de la compatibilité sur l'autre.

  - id: mc.svt.svt_soi_non_soi.mauvais-antigene-vise
    label: "« On vérifie l'antigène du receveur au lieu de celui que porte le sang du donneur »"
    description: >
      Dans un raisonnement transfusionnel, l'élève cherche l'antigène du
      receveur chez le donneur (« les hématies du donneur ne portent pas
      l'antigène B, donc pas de risque ») au lieu de confronter l'antigène
      RÉELLEMENT porté par le donneur aux anticorps du receveur.
    contradicts_principle: >
      Le risque naît de la rencontre entre l'antigène porté par les hématies du
      DONNEUR et l'anticorps présent dans le plasma du RECEVEUR. Un receveur B
      possède l'anticorps anti-A ; des hématies A portent l'antigène A : la
      rencontre a lieu, l'agglutination aussi.

  - id: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
    label: "« Une première transfusion sans réaction prouve l'absence de risque futur »"
    description: >
      L'élève applique à l'anticorps anti-D ce qui vaut pour les agglutinines
      naturelles du système ABO : il les croit présents dès la naissance, donc
      immédiatement actifs — d'où sa conclusion qu'une absence de réaction
      immédiate signe une tolérance définitive. Variante : il croit que ce sont
      les anticorps du donneur qui attaquent le receveur.
    contradicts_principle: >
      L'anticorps anti-D est un anticorps IMMUN : il n'apparaît qu'APRÈS une
      première exposition à l'antigène D, dans les semaines qui suivent. La
      première transfusion sensibilise ; c'est la seconde qui est dangereuse.
      Et l'anticorps en cause est produit par le RECEVEUR, pas apporté par le
      sang du donneur.

  - id: mc.svt.svt_soi_non_soi.soi-modifie-devient-etranger
    label: "« Une cellule infectée ou cancéreuse change de patrimoine, ou perd tous ses marqueurs »"
    description: >
      Pour expliquer qu'une cellule du soi puisse être ciblée, l'élève la fait
      sortir du soi : elle deviendrait génétiquement étrangère, ou elle perdrait
      entièrement ses molécules de CMH, devenant une cellule sans signature.
    contradicts_principle: >
      La cellule reste génétiquement une cellule DE l'organisme. Ce qui change,
      c'est le profil moléculaire qu'elle AFFICHE : elle présente des molécules
      anormales ou étrangères (fragments viraux, protéines mutées) qui ne
      correspondent plus au soi appris. C'est une signature modifiée, détectable
      — pas une signature absente.

items:
  - id: SNS-1
    rung: "R1"
    difficulty_level: 2
    skill_code: svt_soi_non_soi
    tags: [soi_non_soi, tolerance_immunitaire]
    stem: >
      Pourquoi le système immunitaire d'un individu ne réagit-il pas contre
      les molécules du soi de ce même individu, alors qu'il est parfaitement
      capable de les détecter ?
    type: mcq
    choices:
      - id: A
        text: "Parce que, dès la vie embryonnaire, les cellules immunitaires capables de réagir contre les molécules déjà présentes dans l'organisme sont éliminées ou neutralisées : c'est la tolérance immunitaire."
        correct: true
      - id: B
        text: "Parce que les molécules du soi ne portent aucun antigène : dépourvues de tout déterminant reconnaissable, elles échappent à la surveillance des cellules immunitaires, qui n'ont rien à quoi réagir."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.tolerance-passive
        feedback: >
          C'est l'inverse : les molécules du soi (CMH, marqueurs sanguins)
          sont bel et bien détectables — c'est justement ce qui permet, par
          exemple, à une greffe ou à une transfusion incompatible d'être
          repérée par le système immunitaire d'un AUTRE individu. Ce n'est
          pas leur invisibilité qui explique la tolérance, mais un
          apprentissage précoce à ne pas y réagir.
      - id: C
        text: "Parce que le non-soi n'existe pas encore à la naissance : aucun agent étranger n'ayant encore été rencontré, le système immunitaire n'a rien à distinguer du soi à ce stade."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.tolerance-passive
        feedback: >
          Le non-soi (agents pathogènes, greffons éventuels) peut se
          présenter à tout âge, y compris très tôt après la naissance. La
          tolérance ne repose pas sur l'absence de non-soi, mais sur
          l'élimination précoce des cellules immunitaires qui auraient
          réagi contre le soi lui-même.
      - id: D
        text: "Parce que le soi et le non-soi sont deux catégories fixées une fois pour toutes, inscrites dans le patrimoine génétique, indépendamment de tout apprentissage du système immunitaire."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.tolerance-passive
        feedback: >
          La tolérance montre au contraire que la non-réaction contre le
          soi résulte d'un processus actif (l'élimination des cellules
          immunitaires auto-réactives pendant la vie embryonnaire), pas
          d'une catégorie figée dès le départ.
    correct_feedback: >
      La tolérance immunitaire, mise en place pendant la vie embryonnaire,
      élimine les cellules immunitaires qui auraient réagi contre les
      molécules du soi déjà présentes. C'est ce processus actif, et non une
      absence de détection, qui explique que l'organisme ne s'attaque pas
      lui-même.
    solution: |
      **Ce qu'il faut écarter :** les molécules du soi sont bien détectables
      (le CMH et les marqueurs sanguins le prouvent dès qu'ils changent
      d'organisme, chapitres 3 à 5) — la tolérance n'est donc pas une question
      d'invisibilité.

      **Le mécanisme réel :** pendant la vie embryonnaire, les cellules
      immunitaires capables de réagir contre les molécules déjà présentes
      dans l'organisme sont éliminées ou neutralisées. Le système immunitaire
      « apprend » ainsi, tôt, à tolérer ce qui compose l'organisme lui-même.

  - id: SNS-2
    rung: "R2"
    difficulty_level: 2
    skill_code: svt_soi_non_soi
    tags: [antigene_anticorps, specificite]
    stem: >
      On ajoute un sérum contenant des anticorps anti-A à quatre échantillons
      d'hématies, de groupes O, A, B et AB respectivement. On observe une
      agglutination uniquement avec les échantillons des groupes A et AB.
      Quel principe explique le mieux ce résultat ?
    type: mcq
    choices:
      - id: A
        text: "Chaque anticorps reconnaît spécifiquement un antigène précis (ici l'antigène A) : seules les hématies qui portent cet antigène sont agglutinées, quel que soit le groupe d'origine du sérum."
        correct: true
      - id: B
        text: "Les anticorps se lient à n'importe quelle hématie étrangère au sérum utilisé : c'est le caractère étranger de la cellule, et non un antigène particulier qu'elle porterait, qui provoque l'agglutination."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.reconnaissance-non-specifique
        feedback: >
          Si c'était le cas, les quatre échantillons (O, A, B, AB) auraient
          tous été agglutinés par le sérum anti-A, puisque tous sont
          « étrangers » au sérum. Ce n'est pas ce qu'on observe : seuls A et
          AB réagissent, parce que seuls A et AB portent l'antigène A —
          preuve d'une reconnaissance spécifique, pas générale.
      - id: C
        text: "Antigène et anticorps désignent la même chose sous deux noms : l'agglutination se produit simplement quand deux de ces molécules identiques se rencontrent, quel que soit l'échantillon d'hématies testé."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.antigene-anticorps-confondus
        feedback: >
          Antigène et anticorps sont deux entités différentes et
          complémentaires : l'antigène est la molécule reconnue (ici, porté
          par les hématies), l'anticorps est la molécule qui la reconnaît
          spécifiquement (ici, dans le sérum). Ce ne sont pas des synonymes.
      - id: D
        text: "L'agglutination dépend uniquement du groupe sanguin d'origine du sérum : c'est la nature de ce sérum qui décide à elle seule des échantillons qui agglutinent, indépendamment des hématies testées."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.reconnaissance-non-specifique
        feedback: >
          Le résultat observé dépend précisément de la présence ou de
          l'absence de l'antigène A sur les hématies testées (A et AB
          réagissent, O et B non) — c'est la présence de l'antigène cible qui
          détermine la réaction, pas une propriété générale du sérum.
    correct_feedback: >
      L'anticorps anti-A ne se lie qu'à l'antigène A : c'est le principe
      clé-serrure. Seules les hématies porteuses de cet antigène précis (A et
      AB) sont agglutinées ; O et B, qui n'en portent pas, ne réagissent pas.
    solution: |
      **Observation :** agglutination avec A et AB, pas avec O et B.

      **Interprétation :** l'anticorps anti-A ne reconnaît que l'antigène A.
      A et AB portent cet antigène ; O n'en porte aucun, B ne porte que
      l'antigène B. Seuls les échantillons portant la cible spécifique de
      l'anticorps réagissent — la reconnaissance antigène-anticorps est
      spécifique, jamais générale.

  - id: SNS-3
    rung: "R3"
    difficulty_level: 4
    skill_code: svt_soi_non_soi
    tags: [cmh, greffe, jumeaux]
    stem: >
      Un patient a besoin d'une greffe de rein. Deux donneurs se présentent :
      son frère jumeau monozygote, et un donneur non apparenté dont le groupe
      sanguin ABO est identique au sien. Lequel de ces deux donneurs présente
      a priori le risque de rejet le plus faible, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Le frère jumeau monozygote, car il partage un patrimoine génétique identique au patient, donc des molécules de CMH strictement identiques, reconnues comme du soi à 100 %."
        correct: true
      - id: B
        text: "Le donneur non apparenté, car un groupe sanguin ABO identique garantit à lui seul une compatibilité complète : dès lors que les hématies appartiennent au même groupe, l'organe greffé ne peut être rejeté."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          La compatibilité ABO concerne les hématies (transfusions) et ne
          renseigne en rien sur la compatibilité du CMH, qui gouverne le
          risque de rejet d'un greffon d'organe. Ce sont deux systèmes de
          marqueurs du soi indépendants : un donneur ABO-compatible peut
          très bien avoir un CMH totalement différent de celui du receveur.
      - id: C
        text: "Les deux donneurs présentent exactement le même risque, puisque le rejet de greffe ne dépend pas des molécules du CMH mais de la seule qualité de l'intervention chirurgicale et du traitement qui la suit."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          C'est au contraire le CMH, extrêmement polymorphe et quasiment
          unique à chaque individu (sauf vrais jumeaux), qui gouverne la
          reconnaissance du greffon comme soi ou non-soi. Les deux donneurs
          ne sont donc pas équivalents.
      - id: D
        text: "Le frère jumeau, mais uniquement parce que deux jumeaux ont automatiquement le même groupe sanguin ABO : c'est cette identité ABO, et non le patrimoine génétique dans son ensemble, qui écarte le rejet."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          Deux jumeaux monozygotes ont bien le même groupe ABO — la prémisse
          est juste, c'est le lien de cause à effet qui ne tient pas. Si
          l'identité ABO suffisait à écarter le rejet, n'importe quel inconnu
          de même groupe ferait un aussi bon donneur : la leçon vient de
          montrer le contraire. Ce qui rend le risque quasi nul, c'est
          l'identité de leur CMH, issue d'un patrimoine génétique identique.
    correct_feedback: >
      Le CMH, et non le groupe sanguin ABO, gouverne le risque de rejet d'un
      greffon d'organe. Les vrais jumeaux, génétiquement identiques,
      partagent un CMH strictement identique : le greffon est reconnu comme
      du soi à 100 % par le système immunitaire du receveur.
    solution: |
      **Ce qui gouverne le rejet de greffe :** la compatibilité du CMH, pas
      la compatibilité ABO (qui concerne les transfusions).

      **Le frère jumeau monozygote** partage, par construction, un
      patrimoine génétique identique à celui du patient — donc des
      molécules de CMH strictement identiques. Risque de rejet lié au CMH :
      quasi nul.

      **Le donneur non apparenté**, même ABO-compatible, porte presque
      certainement un CMH différent : ses cellules seront détectées comme
      non-soi, avec un risque de rejet nettement plus élevé.

  - id: SNS-4
    rung: "R4"
    difficulty_level: 3
    skill_code: svt_soi_non_soi
    tags: [groupe_sanguin, abo, transfusion]
    stem: >
      Une personne de groupe sanguin B peut-elle recevoir, sans risque, une
      transfusion de sang du groupe A ?
    type: mcq
    choices:
      - id: A
        text: "Non, car son plasma contient l'anticorps anti-A, qui reconnaîtra spécifiquement l'antigène A porté par les hématies du donneur et provoquera une agglutination."
        correct: true
      - id: B
        text: "Oui, car les hématies du donneur (groupe A) ne portent pas l'antigène B : le receveur étant de groupe B, rien dans le sang reçu ne peut réagir avec son plasma, et la transfusion se déroule sans risque."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.mauvais-antigene-vise
        feedback: >
          C'est regarder le mauvais antigène. La réaction ne vient pas de
          l'antigène B (absent chez le donneur), mais de l'antigène A que
          les hématies du donneur portent bel et bien — et que l'anticorps
          anti-A du receveur reconnaît spécifiquement.
      - id: C
        text: "Oui, car le système ABO ne concerne que les greffes d'organes : pour une simple transfusion sanguine, seul le volume transfusé importe, et non la correspondance des groupes entre donneur et receveur."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          C'est l'inverse : le système ABO est précisément le système de
          marqueurs qui conditionne la compatibilité des transfusions
          sanguines. La compatibilité des greffes d'organes dépend, elle,
          du CMH (chapitre 4) — un système différent.
      - id: D
        text: "Non, mais uniquement à cause du facteur Rhésus : c'est lui, et non le système ABO, qui décide de la compatibilité entre un donneur et un receveur lors d'une transfusion de sang total."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          Le facteur Rhésus n'est pas en cause ici : le problème vient
          directement du système ABO — l'anticorps anti-A du receveur (groupe
          B) reconnaît l'antigène A porté par les hématies du donneur. Ce
          risque existe indépendamment de tout facteur Rhésus.
    correct_feedback: >
      Le plasma d'un individu de groupe B contient l'anticorps anti-A. Les
      hématies transfusées du groupe A portent l'antigène A : la
      reconnaissance spécifique anticorps-antigène provoque une
      agglutination — la transfusion est incompatible.
    solution: |
      **Antigènes et anticorps en présence :** hématies du donneur (groupe
      A) portent l'antigène A ; plasma du receveur (groupe B) contient
      l'anticorps anti-A.

      **Conséquence :** l'anti-A du receveur reconnaît spécifiquement
      l'antigène A du donneur (principe clé-serrure, chapitre 3) et provoque une
      agglutination des hématies transfusées — transfusion incompatible et
      dangereuse.

  - id: SNS-5
    rung: "R4"
    difficulty_level: 3
    skill_code: svt_soi_non_soi
    tags: [rhesus, anticorps_immun, transfusion]
    stem: >
      Un individu Rhésus négatif reçoit, par erreur, une première
      transfusion de sang Rhésus positif. Aucune réaction grave n'est
      observée sur le moment. Peut-on en conclure qu'il pourra recevoir sans
      risque du sang Rhésus positif à l'avenir ?
    type: mcq
    choices:
      - id: A
        text: "Non : cette première exposition a pu sensibiliser son organisme (production d'anticorps anti-D dans les semaines suivantes), rendant une seconde exposition à du sang Rh+ dangereuse."
        correct: true
      - id: B
        text: "Oui, car l'absence de réaction lors de cette première transfusion prouve que son organisme tolère l'antigène D et qu'il ne produira donc jamais d'anticorps anti-D, quel que soit le nombre d'expositions."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
        feedback: >
          C'est confondre l'absence de réaction immédiate avec une absence
          définitive de risque. Contrairement aux agglutinines du système
          ABO (présentes dès les premiers mois de la vie), l'anticorps anti-D est un
          anticorps « immun » : il n'apparaît qu'après une exposition à
          l'antigène D, et sa production prend du temps — ce qui explique
          l'absence de réaction visible lors de cette première exposition.
      - id: C
        text: "Oui, car le système Rhésus ne concerne que les greffes d'organes : lors d'une transfusion, seule la compatibilité ABO est en jeu, le facteur Rhésus restant sans effet."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.systemes-de-marqueurs-confondus
        feedback: >
          Le système Rhésus, comme le système ABO, est un système de
          marqueurs des hématies : il concerne directement les transfusions
          sanguines, pas les greffes d'organes (qui dépendent du CMH, chapitre 4).
      - id: D
        text: "Non, car le sang Rh+ transfusé contient toujours des anticorps anti-D qui attaquent directement les hématies du receveur, dès la première transfusion comme lors de toutes les suivantes."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
        feedback: >
          Le risque ne vient pas d'anticorps apportés par le sang du
          donneur, mais de l'anticorps anti-D que LE RECEVEUR peut
          développer après avoir été exposé à l'antigène D porté par les
          hématies transfusées.
    correct_feedback: >
      L'anti-D est un anticorps immun : il n'existe pas naturellement chez
      un individu Rh-, mais peut apparaître après une première exposition à
      l'antigène D. L'absence de réaction immédiate ne dit rien sur le
      risque d'une exposition future, une fois l'organisme sensibilisé.
    solution: |
      **Différence avec le système ABO :** les agglutinines anti-A/anti-B
      sont naturellement présentes dès les premiers mois de vie ; l'anticorps
      anti-D, lui, n'apparaît qu'après une exposition à l'antigène D — c'est
      un anticorps « immun », pas « naturel ».

      **Conséquence :** la première exposition Rh+ peut sensibiliser
      l'organisme sans réaction visible immédiate (le temps que l'anti-D se
      forme) ; une seconde exposition à du sang Rh+ déclenchera, elle, une
      agglutination franche.

  - id: SNS-6
    rung: "R5"
    difficulty_level: 3
    skill_code: svt_soi_non_soi
    tags: [soi_modifie, non_soi, cellule_infectee]
    stem: >
      Une cellule infectée par un virus, ou une cellule devenue cancéreuse,
      peut être reconnue et ciblée par le système immunitaire de l'organisme
      auquel elle appartient génétiquement. Pourquoi, alors qu'elle provient
      bien du soi de cet individu ?
    type: mcq
    choices:
      - id: A
        text: "Parce que l'infection ou la transformation cancéreuse modifie les molécules que la cellule présente à sa surface, qui ne correspondent plus à la signature habituelle du soi : on parle de « soi modifié »."
        correct: true
      - id: B
        text: "Parce qu'une cellule infectée ou cancéreuse devient génétiquement étrangère à l'organisme : son patrimoine n'étant plus celui de l'individu, elle bascule automatiquement dans le non-soi au sens strict."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.soi-modifie-devient-etranger
        feedback: >
          Le patrimoine génétique de la cellule ne change pas de propriétaire
          : elle reste, génétiquement, une cellule DE l'organisme. Ce qui
          change, c'est le profil moléculaire qu'elle affiche à sa surface —
          pas son origine génétique.
      - id: C
        text: "Parce que le système immunitaire attaque systématiquement toute cellule infectée ou anormale, sans aucune reconnaissance moléculaire préalable : c'est l'anomalie elle-même qui déclenche la destruction."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.reconnaissance-non-specifique
        feedback: >
          Cela contredirait le principe de spécificité vu au chapitre 3 : la
          reconnaissance repose toujours sur des molécules précises
          (fragments viraux, molécules anormales issues de mutations)
          affichées à la surface de la cellule, pas sur une attaque
          générale et non ciblée.
      - id: D
        text: "Parce qu'une cellule infectée ou cancéreuse perd entièrement ses molécules de CMH : privée de toute signature de surface, elle n'est plus reconnue comme du soi et se trouve automatiquement éliminée."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.soi-modifie-devient-etranger
        feedback: >
          Ce n'est pas le mécanisme décrit ici : la cellule affiche des
          molécules ANORMALES ou ÉTRANGÈRES (fragments viraux, molécules
          mutées) plutôt que de perdre toute molécule de surface — c'est
          cette signature modifiée, détectable, qui la fait reconnaître
          comme non conforme au soi habituel.
    correct_feedback: >
      Une cellule infectée ou cancéreuse reste génétiquement « soi », mais
      affiche à sa surface des molécules anormales (fragments viraux,
      molécules mutées) qui ne correspondent plus à la signature habituelle
      du soi. C'est cette signature modifiée — le « soi modifié » — qui la
      rend détectable comme non-soi.
    solution: |
      **Ce qui ne change pas :** l'origine génétique de la cellule — elle
      appartient toujours à l'organisme.

      **Ce qui change :** les molécules affichées à sa surface (fragments
      viraux pour une cellule infectée, molécules anormales issues de
      mutations pour une cellule cancéreuse).

      **Conséquence :** cette signature moléculaire modifiée ne correspond
      plus au répertoire habituel du soi ; le système immunitaire la traite
      comme du non-soi, alors même que la cellule provient génétiquement de
      l'individu — c'est le principe du « soi modifié ».

  # ── SIX ITEMS AJOUTÉS LE 2026-09-05 ────────────────────────────────────────
  # Motif : couverture-diagnostique.mjs montrait 6 misconceptions déclarées sur
  # 7 SOUS LE PLANCHER de 3 items du banc — donc inévaluables par le modèle
  # apprenant, quoi que fasse l'élève. Les six items ci-dessous sont écrits
  # pour combler exactement ce déficit, en restant dans le périmètre de
  # lesson.md (chapitres R1 à R5) : aucune notion nouvelle, aucun auteur.
  # RÉSERVE MESURÉE le 2026-09-19 : la note disait aussi « aucun fait qui ne
  # soit déjà enseigné plus haut ». Grep refait sur la notion — c'est faux.
  # SNS-12 introduit l'autogreffe et le grand brûlé, qui n'apparaissent nulle
  # part dans lesson.md. La biologie de SNS-12 est juste et l'item reste ;
  # c'est la NOTE qui était périmée. Deux issues pour l'auteur : introduire
  # l'autogreffe en R5 (elle en est le contre-exemple implicite), ou assumer
  # ce fait comme le seul apport du banc.
  - id: SNS-7
    rung: "R1"
    difficulty_level: 2
    skill_code: svt_soi_non_soi
    tags: [soi_non_soi, tolerance_immunitaire]
    stem: >
      Un nouveau-né possède-t-il, dans son sang, des cellules immunitaires
      capables de réagir contre les molécules de son propre foie ?
    type: mcq
    choices:
      - id: A
        text: "Presque aucune : celles qui auraient réagi contre les molécules déjà présentes dans l'organisme ont été éliminées ou neutralisées pendant la vie embryonnaire, avant même la naissance."
        correct: true
      - id: B
        text: "Oui, il en possède, mais elles restent inactives : les molécules du foie ne portent aucun déterminant reconnaissable, si bien qu'aucune cellule immunitaire n'a jamais rien à quoi se lier."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.tolerance-passive
        feedback: >
          Les molécules du soi sont parfaitement détectables — c'est
          justement pour cela qu'un greffon incompatible est repéré par le
          système immunitaire d'un AUTRE individu. La non-réaction ne vient
          pas d'une invisibilité, mais de l'élimination précoce des cellules
          immunitaires qui auraient réagi.
      - id: C
        text: "Non, aucune : la frontière entre le soi et le non-soi est inscrite dans le patrimoine génétique dès la fécondation, sans qu'aucun apprentissage n'ait à se produire pendant le développement."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.tolerance-passive
        feedback: >
          La tolérance n'est pas une catégorie figée héritée telle quelle :
          c'est un PROCESSUS ACTIF, qui se déroule pendant la vie
          embryonnaire et élimine les cellules immunitaires auto-réactives.
          Sans ce tri, l'organisme s'attaquerait lui-même.
      - id: D
        text: "Non, aucune : le système immunitaire ne fabrique jamais de cellules dirigées contre des molécules internes, puisqu'il ne réagit par principe qu'à ce qui vient de l'extérieur de l'organisme."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.reconnaissance-non-specifique
        feedback: >
          Le système immunitaire ne trie pas selon la provenance d'une
          molécule, mais selon la RECONNAISSANCE de molécules précises. Des
          cellules capables de réagir contre le soi apparaissent bel et bien
          au cours du développement : c'est parce qu'elles sont éliminées
          ensuite que l'organisme se tolère.
    correct_feedback: >
      La tolérance immunitaire est un tri actif, mené pendant la vie
      embryonnaire : les cellules immunitaires capables de réagir contre les
      molécules déjà présentes sont éliminées ou neutralisées. C'est ce tri,
      et non une invisibilité des molécules du soi, qui explique qu'un
      organisme ne s'auto-détruise pas.
    solution: |
      **Ce qu'il faut écarter :** l'idée que les molécules du foie seraient
      indétectables. Elles sont détectables — le rejet d'un greffon de foie
      chez un autre individu le prouve.

      **Le mécanisme réel :** pendant la vie embryonnaire, l'organisme met en
      place ses molécules du soi ; les cellules immunitaires qui se montrent
      capables de réagir contre elles sont éliminées ou neutralisées avant la
      naissance.

      **Conséquence :** la tolérance est apprise, pas donnée. C'est ce qui la
      rend fragile — et c'est pourquoi sa rupture existe.

  - id: SNS-8
    rung: "R2"
    difficulty_level: 2
    skill_code: svt_soi_non_soi
    tags: [antigene_anticorps, specificite]
    stem: >
      Les molécules de groupe sanguin portées par les hématies d'un donneur
      sont qualifiées d'antigènes lorsqu'elles arrivent chez un receveur
      incompatible. Pourtant, aucun microbe n'intervient dans cette
      transfusion. Qu'est-ce que cela apprend sur la notion d'antigène ?
    type: mcq
    choices:
      - id: A
        text: "Qu'un antigène est simplement une molécule reconnaissable spécifiquement par le système immunitaire d'un individu donné : aucun agent pathogène n'est requis pour qu'une molécule ait ce statut."
        correct: true
      - id: B
        text: "Que ces molécules de groupe sanguin sont en réalité des anticorps, puisque ce sont elles qui déclenchent la reconnaissance et provoquent la réaction observée chez le receveur incompatible."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.antigene-anticorps-confondus
        feedback: >
          Les deux rôles sont inversés. L'ANTIGÈNE est la molécule reconnue,
          portée ici par les hématies du donneur ; l'ANTICORPS est la molécule
          qui la reconnaît, présente ici dans le plasma du receveur. Ce sont
          deux entités complémentaires, jamais interchangeables.
      - id: C
        text: "Que le système immunitaire du receveur réagit à tout ce qui lui est étranger, quelle que soit la molécule portée par les cellules qu'il rencontre, sans reconnaissance préalable."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.reconnaissance-non-specifique
        feedback: >
          Si l'étrangeté suffisait, un receveur de groupe A agglutinerait
          aussi bien du sang O que du sang B — ce n'est pas ce qu'on observe.
          Seules les hématies portant l'antigène visé par une agglutinine
          présente dans le plasma sont agglutinées.
      - id: D
        text: "Que les mots antigène et anticorps désignent au fond la même famille de molécules, l'un servant à décrire ce qui vient du donneur et l'autre ce qui vient du receveur."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.antigene-anticorps-confondus
        feedback: >
          Ce n'est pas la provenance qui distingue les deux mots, mais la
          FONCTION : l'antigène est reconnu, l'anticorps reconnaît. Un
          receveur porte lui aussi des antigènes sur ses propres hématies, et
          un donneur des anticorps dans son plasma.
    correct_feedback: >
      Un antigène est une molécule capable d'être reconnue spécifiquement par
      le système immunitaire, et de déclencher une réaction s'il la considère
      étrangère. Les molécules de groupe sanguin le deviennent dès qu'elles
      changent d'organisme — sans qu'aucun microbe soit impliqué.
    solution: |
      **Ce que dit la définition :** un antigène est une molécule
      RECONNAISSABLE, pas nécessairement dangereuse ni microbienne.

      **Ce que montre la transfusion :** les agglutinogènes des hématies du
      donneur sont, pour le receveur, des molécules jamais tolérées — donc
      des antigènes, au sens strict.

      **Le mot voisin, à ne pas confondre :** l'anticorps est la protéine qui
      se lie spécifiquement à cet antigène. Ici, l'agglutinine du plasma du
      receveur.

  - id: SNS-9
    rung: "R3"
    difficulty_level: 3
    skill_code: svt_soi_non_soi
    tags: [cmh, soi_non_soi, statut_relatif]
    stem: >
      Une molécule de CMH portée par les cellules de Karim est-elle un
      antigène ?
    type: mcq
    choices:
      - id: A
        text: "Cela dépend de l'organisme qui la rencontre : pour Karim elle fait partie du soi et reste tolérée, mais transplantée chez un autre individu elle devient pour lui un antigène."
        correct: true
      - id: B
        text: "Non, jamais : une molécule qui appartient au soi d'un individu ne porte, par définition, aucun déterminant susceptible d'être reconnu par un système immunitaire, quel qu'il soit."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.tolerance-passive
        feedback: >
          Appartenir au soi de quelqu'un ne rend pas une molécule
          indétectable : cela signifie seulement que SON système immunitaire a
          appris à ne pas y réagir. Les molécules de CMH sont d'ailleurs
          parfaitement détectables — c'est bien pour cela qu'un greffon est
          rejeté.
      - id: C
        text: "Oui, toujours : une molécule de CMH est un anticorps de surface, et tout anticorps est par nature un antigène pour l'organisme qui le porte comme pour ceux qui le rencontrent."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.antigene-anticorps-confondus
        feedback: >
          Une molécule de CMH n'est pas un anticorps : c'est une
          glycoprotéine de surface, une molécule RECONNUE. L'anticorps, lui,
          est la protéine qui reconnaît. Les deux ne se confondent pas, et
          aucune des deux n'est « par nature » un antigène : le statut dépend
          de qui regarde.
      - id: D
        text: "Non : elle ne le deviendrait qu'après avoir été profondément modifiée par une infection ou une mutation, comme le sont les molécules affichées par une cellule cancéreuse."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.soi-modifie-devient-etranger
        feedback: >
          Le soi modifié est un cas de figure parmi d'autres, pas la condition
          générale. Une molécule de CMH parfaitement normale, non modifiée,
          devient un antigène du seul fait de changer d'organisme : c'est tout
          le problème du rejet de greffe.
    correct_feedback: >
      Le statut d'une molécule n'est pas absolu : il dépend du système
      immunitaire qui la rencontre. Une molécule du soi de Karim, tolérée
      chez lui depuis la vie embryonnaire, devient un antigène chez un
      receveur qui ne l'a jamais tolérée.
    solution: |
      **La règle générale :** une molécule est « soi » pour l'organisme qui
      l'a apprise comme sienne pendant la tolérance immunitaire, et
      « antigène » pour tout organisme qui ne l'a pas apprise.

      **Appliquée au CMH :** les molécules de CMH de Karim sont du pur soi
      pour lui. Transplantées avec un greffon, elles rencontrent un système
      immunitaire qui ne les a jamais tolérées : elles deviennent le signal
      de non-soi qui déclenche le rejet.

      **Ce que cela n'exige pas :** aucune modification de la molécule, aucun
      microbe. Le changement de statut vient du changement d'organisme.

  - id: SNS-10
    rung: "R4"
    difficulty_level: 3
    skill_code: svt_soi_non_soi
    tags: [groupe_sanguin, abo, transfusion]
    stem: >
      Une personne de groupe sanguin A reçoit une transfusion de sang de
      groupe B. Quelle est la cause précise de la réaction d'agglutination
      observée ?
    type: mcq
    choices:
      - id: A
        text: "L'agglutinine anti-B du plasma du receveur reconnaît l'agglutinogène B porté par les hématies du donneur, et relie ces hématies entre elles en amas."
        correct: true
      - id: B
        text: "L'agglutinine anti-A du plasma du donneur reconnaît l'agglutinogène A porté par les hématies du receveur, et provoque de cette façon l'agglutination du sang du receveur."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.mauvais-antigene-vise
        feedback: >
          C'est le bon couple antigène-anticorps, mais pris dans le mauvais
          sens. La règle de compatibilité regarde les agglutinines du
          RECEVEUR face aux agglutinogènes du DONNEUR : le plasma du donneur
          est très dilué dans celui du receveur et n'est pas le facteur
          déterminant.
      - id: C
        text: "L'absence de l'agglutinogène A sur les hématies du donneur est reconnue comme une anomalie par le plasma du receveur, ce qui déclenche à soi seul l'agglutination des hématies transfusées."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.mauvais-antigene-vise
        feedback: >
          Une agglutinine se lie à un agglutinogène PRÉSENT, elle ne détecte
          jamais une absence. C'est pour cette raison que les hématies du
          groupe O, qui n'en portent aucun, ne sont agglutinées par aucun
          plasma — d'où le donneur universel.
      - id: D
        text: "Le receveur fabrique, dans les jours qui suivent la transfusion, un anticorps anti-B qu'il ne possédait pas auparavant, et c'est cet anticorps nouveau qui agglutine les hématies reçues."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
        feedback: >
          C'est le comportement de l'anticorps anti-D du système Rhésus, pas
          celui des agglutinines ABO. Les agglutinines sont des anticorps
          NATURELS, présents dès les premiers mois de la vie sans aucun
          contact préalable : elles réagissent dès la première transfusion
          incompatible.
    correct_feedback: >
      Un receveur de groupe A possède naturellement l'agglutinine anti-B. Les
      hématies du donneur de groupe B portent l'agglutinogène B : la
      reconnaissance spécifique a lieu, et chaque anticorps reliant plusieurs
      hématies, celles-ci s'agglutinent en amas.
    solution: |
      **La règle de compatibilité :** une transfusion est sans risque, au sens
      ABO, si le plasma du RECEVEUR ne contient aucune agglutinine dirigée
      contre un agglutinogène porté par les hématies du DONNEUR.

      **Appliquée ici :** receveur A, donc plasma contenant anti-B. Donneur B,
      donc hématies portant l'agglutinogène B. La rencontre a lieu.

      **Le mécanisme :** chaque anticorps peut se lier à plusieurs hématies à
      la fois ; il les relie entre elles, d'où des amas visibles capables
      d'obstruer de petits vaisseaux et de provoquer une hémolyse massive.

