          provient elle aussi du corps du patient, et serait donc épargnée.
          La reconnaissance passe toujours par des molécules PRÉCISES
          affichées à la surface, jamais par une origine ou une impression
          d'anormalité.
      - id: D
        text: "La cellule infectée perd la totalité de ses molécules de CMH, et c'est cette disparition complète de signature qui la fait éliminer, alors que la peau greffée conserve les siennes."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.soi-modifie-devient-etranger
        feedback: >
          Ce n'est pas le mécanisme décrit dans la leçon : la cellule infectée
          AFFICHE des molécules anormales ou étrangères (fragments viraux),
          plutôt que de perdre toute molécule de surface. C'est une signature
          modifiée, détectable, pas une signature absente.
    correct_feedback: >
      Une autogreffe porte exactement la signature du soi que le système
      immunitaire a apprise : rien à signaler. Une cellule infectée reste
      génétiquement du soi, mais affiche en plus des fragments viraux — c'est
      cette signature modifiée, et elle seule, qui la rend détectable.
    solution: |
      **Le critère commun :** dans les deux cas, le système immunitaire lit
      les molécules AFFICHÉES à la surface des cellules.

      **Autogreffe :** les cellules de peau du patient affichent son propre
      CMH, tolérée depuis la vie embryonnaire. Aucune réaction — c'est
      d'ailleurs pourquoi l'autogreffe est la solution de référence chez le
      grand brûlé.

      **Cellule infectée :** même origine génétique, mais des fragments
      viraux s'ajoutent à la surface. Le répertoire affiché ne correspond plus
      au soi appris : la cellule est traitée comme du non-soi.

      **Ce qu'il ne faut pas en conclure :** ni que la cellule a changé de
      patrimoine, ni qu'elle a perdu sa signature. Elle en a acquis une
      seconde.

  # ── SNS-13 (2026-09-23) — le receveur O. Écrit pour ramener
  # `mauvais-antigene-vise` au plancher, dans la forme que demandait la note de
  # couverture : un cas où l'élève doit décider lui-même quel côté porte
  # l'antigène et quel côté porte l'anticorps, sans que l'énoncé le lui dise.
  # Le receveur O est le piège exact : ses hématies ne portent rien, et c'est
  # justement ce qui fait croire qu'il peut tout recevoir.
  - id: SNS-13
    rung: "R4"
    difficulty_level: 3
    skill_code: svt_soi_non_soi
    tags: [groupe_sanguin, abo, transfusion]
    stem: >
      Un patient de groupe sanguin O, qui n'a jamais été transfusé, doit
      recevoir du sang en urgence. L'hôpital dispose de poches des groupes O,
      A, B et AB, toutes de même Rhésus que lui. Quelles poches peut-il
      recevoir sans risque d'agglutination ?
    type: mcq
    choices:
      - id: A
        text: "Les quatre poches : ses propres hématies ne portant ni l'agglutinogène A ni l'agglutinogène B, le sang reçu ne trouve chez lui rien à reconnaître."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.mauvais-antigene-vise
        feedback: >
          C'est regarder le mauvais côté. Que le receveur ne porte pas
          d'agglutinogène ne le protège de rien : le danger vient des
          agglutinogènes des hématies du DONNEUR, face aux agglutinines du
          plasma du RECEVEUR. Or un patient O possède à la fois l'anti-A et
          l'anti-B : il agglutinerait des hématies A, B ou AB. Donneur
          universel, il n'est receveur que du groupe O.
      - id: B
        text: "La poche AB seulement : c'est la seule dont le plasma est dépourvu d'agglutinines, donc la seule qui ne peut pas s'attaquer à ses hématies."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.mauvais-antigene-vise
        feedback: >
          C'est le bon couple antigène-anticorps, pris dans le mauvais sens :
          la règle ne regarde pas le plasma du donneur, très dilué dans celui
          du receveur, mais les agglutinines du RECEVEUR face aux
          agglutinogènes du DONNEUR. Et des hématies AB portent A et B à la
          fois : face à l'anti-A et à l'anti-B du patient, c'est la pire poche
          possible. AB est le receveur universel, pas le donneur universel.
      - id: C
        text: "La poche O seulement : son plasma contient à la fois l'anti-A et l'anti-B, qui agglutineraient les hématies de chacune des trois autres poches."
        correct: true
      - id: D
        text: "Les quatre poches, pour cette première transfusion : ses agglutinines anti-A et anti-B ne se formeront qu'après un premier contact avec un sang étranger."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
        feedback: >
          Ce raisonnement vaut pour l'anticorps anti-D du système Rhésus, pas
          pour les agglutinines ABO. Celles-ci sont des anticorps NATURELS,
          présents dans le plasma dès les premiers mois de la vie, sans aucun
          contact préalable avec un sang étranger : elles agglutinent dès la
          première transfusion incompatible.
    correct_feedback: >
      Un individu de groupe O possède naturellement l'anti-A et l'anti-B. Les
      hématies des poches A, B et AB portent l'agglutinogène A, B, ou les deux
      : elles seraient reconnues et agglutinées. Seule la poche O, dont les
      hématies ne portent ni A ni B, ne trouve rien à reconnaître.
    solution: |
      **La règle :** confronter les agglutinines du plasma du RECEVEUR aux
      agglutinogènes portés par les hématies du DONNEUR.

      **Le receveur :** groupe O, donc un plasma qui contient l'anti-A et
      l'anti-B. Ses propres hématies ne portent aucun agglutinogène — ce qui,
      pour lui en tant que receveur, ne compte pas.

      **Poche par poche :** A porte l'agglutinogène A, reconnu par l'anti-A —
      non. B porte l'agglutinogène B, reconnu par l'anti-B — non. AB porte les
      deux — non. O ne porte ni A ni B — oui.

      **Conclusion :** la poche O seulement. Le groupe O est le donneur
      universel ; la même règle, lue du côté du receveur, en fait le receveur
      le plus restreint.

