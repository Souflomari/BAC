      - id: C
        text: "La seconde transfusion a été mal appariée sur le système ABO, ce qui suffit à expliquer l'agglutination observée ; le facteur Rhésus n'intervient pas dans ce contraste entre les deux épisodes."
        correct: false
        # RÉÉTIQUETÉ le 2026-09-19. Portait `mauvais-antigene-vise`, dont le
        # registre dit « on vérifie l'antigène du RECEVEUR au lieu de celui que
        # porte le sang du DONNEUR » : l'élève qui coche C n'inverse rien, il
        # rabat le Rhésus sur l'ABO. Le même raisonnement est déjà étiqueté
        # `systemes-de-marqueurs-confondus` dans checkpoints.yaml (cp-r4-rhesus,
        # choix C, « les deux poches sont de groupe O, le donneur universel »).
