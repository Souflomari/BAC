    type: mcq
    choices:
      - id: A
        text: "La première transfusion a sensibilisé l'organisme, qui a produit des anticorps anti-D dans les semaines suivantes ; ces anticorps, présents lors de la seconde, agglutinent les hématies Rh+ reçues."
        correct: true
      - id: B
        text: "L'anticorps anti-D était déjà présent dès la naissance chez cette personne, comme les agglutinines du système ABO ; il a simplement fallu deux expositions successives pour qu'il atteigne une concentration suffisante."
        correct: false
        misconception: mc.svt.svt_soi_non_soi.anticorps-immun-vs-naturel
        feedback: >
          C'est justement la différence entre les deux systèmes. Les
