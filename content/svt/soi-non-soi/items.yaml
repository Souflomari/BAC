    rung: "R4"
    difficulty_level: 4
    skill_code: svt_soi_non_soi
    tags: [rhesus, anticorps_immun, transfusion]
    stem: >
      Une personne de groupe O Rhésus négatif reçoit par erreur du sang O
      Rhésus positif. Aucune réaction n'est observée sur le moment. Six mois
      plus tard, une seconde transfusion de sang O Rh+ provoque une
