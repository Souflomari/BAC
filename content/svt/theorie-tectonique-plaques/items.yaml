notion: theorie-tectonique-plaques
skill_code: svt_tectonique_plaques
misconceptions: []
items:
  - id: TTP-1
    rung: "R1"
    difficulty_level: 3
    skill_code: svt_tectonique_plaques
    tags: [derive_continents, tectonique_plaques, histoire_des_sciences]
    stem: >
      Wegener, en 1912, a proposé la dérive des continents ; aujourd'hui, on
      enseigne la théorie de la tectonique des plaques. Quelle affirmation
      décrit correctement la relation entre ces deux idées ?
    type: mcq
    choices:
      - id: A
        text: "La dérive des continents est l'intuition initiale de Wegener (l'observation que les continents ont bougé) ; la tectonique des plaques est la théorie moderne complète, qui ajoute le mécanisme (expansion océanique, convection mantellique) qui manquait du temps de Wegener."
        correct: true
      - id: B
        text: "Ce sont deux noms différents pour exactement la même théorie, proposée intégralement par Wegener dès 1912."
        correct: false
        feedback: >
          C'est confondre l'intuition initiale et la théorie complète.
          L'hypothèse de Wegener a justement été rejetée pendant près de
          cinquante ans parce qu'il lui manquait un mécanisme crédible ;
          ce mécanisme (expansion océanique, convection mantellique) n'a été
          établi que des décennies plus tard. Wegener n'a pas proposé la
          tectonique des plaques telle qu'on la connaît aujourd'hui.
      - id: C
        text: "La tectonique des plaques a précédé la dérive des continents, qui n'est qu'une simplification pédagogique moderne de la théorie complète."
        correct: false
        feedback: >
          C'est l'ordre chronologique inverse. La dérive des continents de
          Wegener (1912) est historiquement antérieure ; la tectonique des
          plaques (années 1960-1970) est venue après, en s'appuyant sur des
          découvertes que Wegener n'avait pas (expansion océanique,
          anomalies magnétiques).
      - id: D
        text: "La dérive des continents est fausse et a été entièrement remplacée par la tectonique des plaques, qui n'a aucun rapport avec les arguments de Wegener."
        correct: false
        feedback: >
          Les quatre arguments de Wegener (concordance des côtes, fossiles,
          structures géologiques, traces climatiques) n'ont jamais été
          invalidés : ils restent aujourd'hui cités comme preuves de
          l'ancienne Pangée. Ce qui manquait n'était pas la validité des
          preuves, mais le mécanisme physique. La tectonique des plaques
          intègre ces arguments, elle ne les jette pas.
    correct_feedback: >
      La dérive des continents est l'observation initiale et globalement
      juste de Wegener, restée incomplète faute de mécanisme ; la tectonique
      des plaques est la théorie moderne qui reprend cette observation et lui
      ajoute enfin un moteur physique plausible, la convection mantellique.
    solution: |
      **Ce qui ne change pas entre les deux :** les quatre arguments de
      Wegener (côtes, fossiles, géologie, paléoclimat) restent valides et
      intégrés tels quels dans la théorie moderne.

      **Ce qui change :** la tectonique des plaques ajoute ce qui manquait à
      Wegener — le mécanisme de l'expansion océanique (renouvellement du
      plancher, anomalies magnétiques symétriques, âge croissant des
      sédiments) et le moteur de la convection mantellique, qui expliquent
      enfin COMMENT et POURQUOI les continents se déplacent.

  - id: TTP-2
    rung: "R2"
    difficulty_level: 3
    skill_code: svt_tectonique_plaques
    tags: [rejet_hypothese, moteur, histoire_des_sciences]
    stem: >
      Au début du XXe siècle, la communauté scientifique a rejeté l'hypothèse
      de Wegener malgré des arguments (concordance des côtes, fossiles,
      structures géologiques, traces climatiques) déjà convaincants sur le
      papier. Pourquoi ce rejet ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'aucun mécanisme physique plausible n'expliquait comment des continents entiers pourraient se déplacer à travers un plancher océanique rigide ; les forces proposées par Wegener (marées, force centrifuge) se sont révélées bien trop faibles."
        correct: true
      - id: B
        text: "Parce que les fossiles identiques trouvés sur des continents séparés se sont révélés être, après vérification, des espèces différentes."
        correct: false
        feedback: >
          C'est l'inverse : c'est justement parce qu'il s'agissait de la MÊME
          espèce (Mesosaurus, Glossopteris) sur des continents séparés par un
          océan infranchissable que l'argument paléontologique restait fort.
          Le problème n'a jamais été la qualité des preuves, mais l'absence
          de mécanisme.
      - id: C
        text: "Parce que la concordance des côtes entre l'Afrique et l'Amérique du Sud a été démontrée comme une simple coïncidence géométrique sans signification."
        correct: false
        feedback: >
          La concordance des côtes n'a jamais été invalidée : elle reste
          citée aujourd'hui comme une preuve valide. Ce n'est pas la preuve
          qui a été réfutée, c'est le mécanisme proposé par Wegener pour
          l'expliquer qui s'est révélé physiquement impossible.
      - id: D
        text: "Parce qu'à cette époque, on ignorait encore l'existence des fossiles retrouvés sur plusieurs continents séparés."
        correct: false
        feedback: >
          Ces fossiles étaient déjà connus et cités par Wegener lui-même
          parmi ses arguments en 1912. Le rejet ne vient pas d'un manque de
          connaissance des preuves, mais du calcul (notamment celui du
          géophysicien Jeffreys) montrant que les forces invoquées par
          Wegener étaient bien trop faibles.
    correct_feedback: >
      Les preuves de Wegener n'ont jamais été réfutées. Ce qui a manqué,
      c'est un mécanisme physique crédible : les forces qu'il proposait
      (marées, force centrifuge) étaient des millions de fois trop faibles
      pour déplacer des continents à travers un plancher océanique rigide.
    solution: |
      **Ce qui n'a pas été remis en cause :** les quatre arguments de
      Wegener (chapitre 2) sont restés valides.

      **Ce qui a coulé l'hypothèse :** l'absence de moteur physiquement
      plausible. Wegener imaginait les continents « labourant » le plancher
      océanique, poussés par les marées et la force centrifuge terrestre —
      des forces calculées, par des physiciens comme Jeffreys, comme bien
      trop faibles pour ce travail. Une observation juste, un mécanisme
      intenable : voilà pourquoi l'hypothèse a été mise de côté pendant
      près de cinquante ans, jusqu'à la découverte de l'expansion océanique
      (chapitre 4).

  - id: TTP-3
    rung: "R3"
    difficulty_level: 4
    skill_code: svt_tectonique_plaques
    tags: [expansion_oceanique, anomalies_magnetiques, age_sediments]
    stem: >
      De part et d'autre d'une dorsale océanique, on observe des bandes
      d'anomalies magnétiques disposées en un motif symétrique par rapport à
      l'axe de la dorsale, et l'âge des sédiments les plus anciens augmente
      régulièrement à mesure qu'on s'éloigne de cet axe. Que démontre le
      mieux cette double observation ?
    type: mcq
    choices:
      - id: A
        text: "Que le plancher océanique se forme en continu au niveau de la dorsale et s'écarte ensuite symétriquement de part et d'autre, chaque flanc emportant avec lui l'enregistrement des inversions du champ magnétique terrestre au moment de sa formation."
        correct: true
      - id: B
        text: "Que le champ magnétique terrestre est plus intense près des dorsales qu'ailleurs, ce qui explique les bandes observées."
        correct: false
        feedback: >
          Les bandes n'enregistrent pas une variation d'INTENSITÉ du champ
          magnétique, mais son ORIENTATION (nord ou sud) au moment où la
          roche s'est solidifiée. La symétrie vient du fait que chaque flanc
          enregistre la même succession d'inversions, pas d'une intensité
          plus forte près de la dorsale.
      - id: C
        text: "Que les sédiments océaniques se déposent plus vite près de la dorsale qu'au large, ce qui explique leur âge croissant avec la distance."
        correct: false
        feedback: >
          Cela inverse la cause et la conséquence. L'âge croissant ne vient
          pas d'une vitesse de dépôt différente, mais du fait que la roche
          volcanique elle-même, sous les sédiments, est plus jeune près de
          la dorsale et plus ancienne au large : elle a eu plus ou moins de
          temps pour accumuler des sédiments par-dessus, selon son propre
          âge.
      - id: D
        text: "Que les continents dérivent indépendamment du plancher océanique, qui resterait fixe pendant que les continents se déplacent au-dessus de lui."
        correct: false
        feedback: >
          C'est exactement l'inverse de ce que montre l'expansion océanique :
          c'est le plancher océanique lui-même qui se crée et se déplace, en
          emportant avec lui tout ce qu'il porte, continents compris. Ce
          n'est pas un continent qui glisse seul sur un plancher fixe — c'est
          l'idée du mécanisme de Wegener (chapitre 3), qui s'est révélée intenable.
    correct_feedback: >
      La symétrie des bandes magnétiques et l'âge croissant des sédiments
      avec la distance à l'axe sont deux preuves indépendantes du même
      phénomène : le plancher océanique se crée en continu à la dorsale et
      s'écarte ensuite dans les deux sens, comme un tapis roulant.
    solution: |
      **Symétrie magnétique :** chaque flanc de la dorsale enregistre, au
      moment de sa formation, l'orientation du champ magnétique terrestre.
      Un plancher qui se crée à l'axe et s'écarte également des deux côtés
      doit produire la même séquence d'inversions, en miroir — c'est ce
      qu'on observe.

      **Âge croissant des sédiments :** la roche près de l'axe est jeune (peu
      de temps pour accumuler des sédiments), la roche loin de l'axe est
      ancienne (beaucoup de temps accumulé). Ce gradient est la signature
      directe d'une création continue à l'axe, suivie d'un écartement.

  - id: TTP-4
    rung: "R4"
    difficulty_level: 3
    skill_code: svt_tectonique_plaques
    tags: [lithosphere, croute, asthenosphere]
    stem: >
      Quelle affirmation décrit correctement la différence entre la croûte
      et la lithosphère ?
    type: mcq
    choices:
      - id: A
        text: "La croûte est définie par sa composition chimique (continentale ou océanique) ; la lithosphère est une couche mécanique plus épaisse et rigide, qui inclut la croûte ET la partie la plus haute et la plus froide du manteau sous-jacent."
        correct: true
      - id: B
        text: "Croûte et lithosphère désignent exactement la même couche : ce sont deux noms interchangeables pour la même limite du globe."
        correct: false
        feedback: >
          Ce sont deux limites différentes, définies par deux critères
          différents : la limite croûte/manteau est une limite de
          COMPOSITION chimique ; la limite lithosphère/asthénosphère est une
          limite de COMPORTEMENT mécanique (rigide contre ductile), située
          plus bas, à l'intérieur même du manteau. Une plaque tectonique est
          un morceau de lithosphère, pas seulement de croûte.
      - id: C
        text: "La lithosphère est une fine pellicule à la surface de la croûte, plus mince qu'elle."
        correct: false
        feedback: >
          C'est l'inverse : la lithosphère est plus ÉPAISSE que la croûte,
          puisqu'elle inclut la croûte plus une partie rigide du manteau
          située juste en dessous. Ce n'est pas une pellicule superficielle
          plus fine que la croûte.
      - id: D
        text: "La croûte inclut la lithosphère et une partie du manteau ; la lithosphère n'est qu'une sous-partie de la croûte."
        correct: false
        feedback: >
          La relation d'inclusion est inversée : c'est la LITHOSPHÈRE qui
          inclut la croûte (plus la partie rigide du manteau supérieur), pas
          l'inverse. La croûte est une sous-partie de la lithosphère, pas le
          contraire.
    correct_feedback: >
      La croûte (limite de composition chimique) et la lithosphère (limite de
      comportement mécanique, rigide contre ductile) ne se superposent pas :
      la lithosphère est plus épaisse, elle inclut la croûte et le sommet
      rigide du manteau. C'est un morceau de lithosphère, pas de croûte
      seule, qui constitue une plaque tectonique.
    solution: |
      **Croûte :** définie par la composition chimique (granite continental,
      basalte océanique) — la couche la plus superficielle.

      **Lithosphère :** définie par le comportement mécanique (rigide,
      cassante) — elle inclut la croûte ET la partie supérieure, froide et
      rigide, du manteau.

      **Asthénosphère :** sous la lithosphère, même roche mantellique mais
      plus chaude, donc ductile (capable de fluer très lentement sans être
      liquide).

      Une plaque tectonique est un bloc de lithosphère ; elle ne s'arrête pas
      à la limite croûte/manteau, elle se prolonge dans le manteau supérieur
      rigide.

  - id: TTP-5
    rung: "R4"
    difficulty_level: 2
    skill_code: svt_tectonique_plaques
    tags: [asthenosphere, plaques_flottantes, ductile]
    stem: >
      Une élève affirme : « les plaques tectoniques flottent sur les océans,
      comme des radeaux sur l'eau. » Qu'est-ce qui ne va pas dans cette
      affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Les plaques reposent sur l'asthénosphère, une couche du manteau ductile mais SOLIDE (elle peut fluer très lentement, sur des millions d'années, mais ce n'est pas un liquide) ; ce n'est pas un radeau flottant sur de l'eau liquide, et l'eau des océans n'a aucun rôle mécanique porteur."
        correct: true
      - id: B
        text: "C'est correct : les plaques flottent bel et bien sur l'eau des océans, ce qui explique qu'elles peuvent se déplacer librement."
        correct: false
        feedback: >
          C'est confondre l'eau des océans (qui n'a aucun rôle mécanique de
          soutien, elle repose simplement dans les creux du relief rigide)
          avec l'asthénosphère ductile du manteau, qui se trouve sous la
          lithosphère. Une plaque entièrement continentale, sans aucun océan
          à sa surface, repose exactement de la même façon sur
          l'asthénosphère et se déplace tout autant.
      - id: C
        text: "C'est correct, mais uniquement pour les plaques entièrement océaniques ; les plaques continentales, elles, sont fixées directement au manteau rigide."
        correct: false
        feedback: >
          Toutes les plaques, qu'elles portent un océan, un continent, ou les
          deux à leur surface, reposent de la même manière sur
          l'asthénosphère ductile en profondeur. Il n'existe pas de plaque
          continentale « fixée » directement à un manteau rigide sans
          intermédiaire ductile.
      - id: D
        text: "C'est faux : les plaques ne reposent sur rien, elles sont suspendues dans le vide au centre de la Terre."
        correct: false
        feedback: >
          Les plaques (blocs de lithosphère rigide) reposent bel et bien sur
          une couche matérielle, l'asthénosphère ductile du manteau — elles
          ne flottent pas dans le vide. L'erreur de l'affirmation initiale
          n'est pas d'imaginer un support, mais de confondre ce support (une
          roche ductile) avec de l'eau liquide.
    correct_feedback: >
      Les plaques ne flottent pas sur l'eau des océans : elles reposent sur
      l'asthénosphère, une roche mantellique ductile mais solide, capable de
      fluer très lentement. L'eau des océans n'a aucun rôle de soutien
      mécanique.
    solution: |
      **L'erreur à corriger :** confondre l'eau des océans (sans rôle
      mécanique) avec l'asthénosphère (le vrai support ductile des plaques).

      **Ce qui est vrai :** l'asthénosphère est une roche du manteau, plus
      chaude que la lithosphère, capable de se déformer très lentement sans
      être liquide. C'est sur elle, et non sur l'eau, que reposent toutes
      les plaques — qu'elles portent un océan, un continent, ou les deux.

  - id: TTP-6
    rung: "R6"
    difficulty_level: 3
    skill_code: svt_tectonique_plaques
    tags: [preuves_modernes, seismes_volcans, gps, convection]
    stem: >
      La répartition mondiale des séismes et des volcans, ainsi que les
      mesures GPS actuelles, sont considérées comme des preuves modernes de
      la tectonique des plaques. Pourquoi ces deux types d'observations
      sont-elles si convaincantes ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'elles montrent, en temps réel et indépendamment des reconstitutions du passé, que les frontières de plaques sont des zones de déformation active aujourd'hui même : séismes et volcans concentrés le long de lignes précises, déplacements mesurés directement par GPS."
        correct: true
      - id: B
        text: "Parce que les séismes et les volcans se répartissent uniformément sur toute la surface du globe, confirmant que toute la Terre est également active."
        correct: false
        feedback: >
          C'est l'inverse de ce qu'on observe : séismes et volcans se
          concentrent le long de lignes fines et précises (les frontières de
          plaques), pas de manière uniforme sur tout le globe. C'est
          justement cette concentration, et non une répartition uniforme,
          qui constitue la preuve.
      - id: C
        text: "Parce que le GPS mesure directement la vitesse de la convection mantellique à la surface du globe."
        correct: false
        feedback: >
          Le GPS mesure le déplacement de points à la surface des plaques,
          pas la convection elle-même, qui se produit en profondeur dans le
          manteau et n'est pas directement accessible à une mesure de
          position en surface. Le déplacement mesuré est la CONSÉQUENCE de
          la convection, pas la convection elle-même.
      - id: D
        text: "Parce que les séismes et les volcans sont la cause de la convection mantellique, que le GPS permet ensuite de mesurer."
        correct: false
        feedback: >
          La causalité est inversée : c'est la convection mantellique (chapitre 8)
          qui entraîne le mouvement des plaques, et ce mouvement produit, à
          leurs frontières, séismes et volcanisme. Les séismes et les
          volcans sont une conséquence en surface, pas la cause du moteur
          profond.
    correct_feedback: >
      Ces observations sont convaincantes parce qu'elles montrent la
      tectonique des plaques en train de se produire maintenant, et pas
      seulement dans le passé géologique : concentration précise des
      séismes et volcans sur les frontières de plaques, déplacements
      directement mesurés par GPS, à des vitesses cohérentes avec celles
      déduites de l'âge des roches océaniques (chapitre 4).
    solution: |
      **Séismes et volcans :** concentrés le long de lignes fines qui
      dessinent exactement les frontières de plaques (chapitre 6) — une répartition
      qui n'aurait aucune raison d'exister si les plaques n'étaient pas des
      blocs rigides en mouvement relatif.

      **GPS :** mesure directe, année après année, du déplacement de points à
      la surface de différentes plaques — à des vitesses cohérentes avec
      celles déduites indirectement de l'âge du plancher océanique (chapitre 4).

      **Ce que ça prouve ensemble :** la tectonique des plaques n'est pas
      seulement une reconstitution du passé ; c'est un phénomène mesurable,
      actif aujourd'hui.
