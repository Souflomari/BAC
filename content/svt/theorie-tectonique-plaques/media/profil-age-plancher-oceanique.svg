<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Graphe âge du plancher océanique en fonction de la distance à l’axe de la dorsale, ouest en négatif et est en positif. Les points (0 ; 0), (±50 ; 5), (±150 ; 15) et (±300 ; 30) forment un V parfaitement symétrique. La lecture ajoute l’axe de symétrie à la verticale de la dorsale et la pente du flanc ouest : 300 km parcourus en 30 millions d’années, soit 1 centimètre par an par flanc, donc 2 centimètres par an d’écartement total.">
  <title>Profil d’âge du plancher océanique — distance à l’axe vs âge</title>

  <!--
    profil-age-plancher-oceanique.svg — STAGED, 3 étapes, graphe canonique
    (LESSON-EXPERIENCE-SPEC §2.5 : "graphes toujours stagés, axes -> données
    -> lecture"). Sert l'exercice travaillé du R8, tableau de données
    reproduit littéralement du texte.

    step-1 (axes) : distance à l'axe de la dorsale en abscisse (ouest
      négatif, est positif, km) ; âge en ordonnée (Ma). Chrome neutre.
    step-2 (données) : les 7 points de l'énoncé + le profil qui les relie —
      un V, pas une courbe devinée : voir le calcul de colinéarité ci-dessous.
    step-3 (lecture) : l'axe de symétrie (= l'axe de la dorsale, à distance
      0) et la construction de la pente sur le flanc ouest, avec le résultat
      chiffré (1 cm/an par flanc, 2 cm/an au total) — relié au R6 (GPS).

    Géométrie (calculée depuis le tableau de l'énoncé, pas devinée) :
      mapping : x_px = 360 + distance_km  (échelle 1 px/km, dorsale à x=360)
                y_px = 370 - (âge_Ma / 30) × 310
      donc (0 km, 0 Ma) -> (360, 370) ; (±300 km, 30 Ma) -> (60, 60) / (660, 60).

      Colinéarité vérifiée (le "V" est deux segments DROITS, pas une
      polyligne à coudes arrondis à la main) : sur le flanc ouest,
      âge/|distance| = 5/50 = 15/150 = 30/300 = 0,1 Ma/km, EXACT aux trois
      points intermédiaires — donc (-300,30), (-150,15), (-50,5) et (0,0)
      sont rigoureusement alignés. Même chose, en miroir, côté est. C'est la
      signature attendue d'une vitesse d'écartement constante (l'hypothèse
      même de la question 2 de l'exercice).

      Points (x,y) : (0,0)->(360,370) ; (-50,5)->(310,318.33) ;
      (50,5)->(410,318.33) ; (-150,15)->(210,215) ; (150,15)->(510,215) ;
      (-300,30)->(60,60) ; (300,30)->(660,60).

    Convention couleur (5 tokens) :
      axes, ticks, chrome                          : --figure-ink-soft
      SEUL accent, la même idée du début à la fin — le profil lui-même et sa
      lecture (points, V, axe de symétrie, construction de pente, encart
      vitesse) : --figure-accent.

    Simplification assumée : les 7 points sont reliés par des segments
    droits (exact, voir calcul de colinéarité ci-dessus) — aucune vitesse
    d'écartement variable n'est représentée, conformément à l'énoncé qui ne
    fournit que ces 7 mesures.
  -->

  <g id="step-1">
    <!-- Titre -->
    <text x="360" y="22" text-anchor="middle"
          font-size="13" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Âge du plancher océanique selon la distance à l’axe de la dorsale
    </text>

    <!-- Axe des abscisses (distance) -->
    <line x1="24" y1="370" x2="690" y2="370" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="690,370 678,365.5 678,374.5" fill="var(--figure-ink-soft)"/>
    <polygon points="24,370 36,365.5 36,374.5" fill="var(--figure-ink-soft)"/>
    <text x="690" y="358" text-anchor="end" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">distance à l’axe (km)</text>

    <!-- Axe des ordonnées (âge) -->
    <line x1="40" y1="370" x2="40" y2="45" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="40,45 35.5,56 44.5,56" fill="var(--figure-ink-soft)"/>
    <text x="10" y="44" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">âge (Ma)</text>

    <!-- Ticks abscisse : -300,-150,-50,0,50,150,300 -> x=60,210,310,360,410,510,660 -->
    <g stroke="var(--figure-ink-soft)" stroke-width="1.2">
      <line x1="60" y1="365" x2="60" y2="375"/>
      <line x1="210" y1="365" x2="210" y2="375"/>
      <line x1="310" y1="365" x2="310" y2="375"/>
      <line x1="360" y1="365" x2="360" y2="375"/>
      <line x1="410" y1="365" x2="410" y2="375"/>
      <line x1="510" y1="365" x2="510" y2="375"/>
      <line x1="660" y1="365" x2="660" y2="375"/>
    </g>
    <g font-size="9.5" fill="var(--figure-ink-soft)" text-anchor="middle">
      <text x="60" y="386">-300</text>
      <text x="210" y="386">-150</text>
      <text x="310" y="386">-50</text>
      <text x="360" y="386">0</text>
      <text x="410" y="386">50</text>
      <text x="510" y="386">150</text>
      <text x="660" y="386">300</text>
    </g>
    <text x="140" y="405" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">ouest</text>
    <text x="580" y="405" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">est</text>

    <!-- Ticks ordonnée : 0,5,15,30 -> y=370,318.33,215,60 -->
    <g stroke="var(--figure-ink-soft)" stroke-width="1.2">
      <line x1="34" y1="370" x2="46" y2="370"/>
      <line x1="34" y1="318.33" x2="46" y2="318.33"/>
      <line x1="34" y1="215" x2="46" y2="215"/>
      <line x1="34" y1="60" x2="46" y2="60"/>
    </g>
    <g font-size="9.5" fill="var(--figure-ink-soft)" text-anchor="end">
      <text x="30" y="373">0</text>
      <text x="30" y="321.33">5</text>
      <text x="30" y="218">15</text>
      <text x="30" y="63">30</text>
    </g>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!-- Profil : deux segments droits, symétriques (voir calcul de
         colinéarité en tête de fichier) -->
    <path d="M60,60 L210,215 L310,318.33 L360,370 L410,318.33 L510,215 L660,60"
          fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Points de données -->
    <g fill="var(--figure-accent)">
      <circle cx="360" cy="370" r="3.4"/>
      <circle cx="310" cy="318.33" r="3.4"/>
      <circle cx="410" cy="318.33" r="3.4"/>
      <circle cx="210" cy="215" r="3.4"/>
      <circle cx="510" cy="215" r="3.4"/>
      <circle cx="60" cy="60" r="3.4"/>
      <circle cx="660" cy="60" r="3.4"/>
    </g>

    <!-- Cette étiquette nomme le SOMMET du V, à (360;370) — elle était posée
         tout en haut du cadre, à y=70, c'est-à-dire exactement là où
         l'étape 3 écrit « axe de symétrie / (axe de la dorsale) » : les deux
         se recouvraient à 65 % et disaient presque la même chose. Elle
         descend sous l'origine, au contact de ce qu'elle décrit. -->
    <text x="360" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">axe de la dorsale — âge ≈ 0</text>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- Axe de symétrie : la verticale de la dorsale, distance = 0 -->
    <line x1="360" y1="45" x2="360" y2="370" stroke="var(--figure-accent)" stroke-width="1.4" stroke-dasharray="6,4"/>
    <text x="368" y="56" font-size="10.5" font-weight="600" fill="var(--figure-accent)">axe de symétrie</text>
    <text x="368" y="68" font-size="9.5" fill="var(--figure-accent)">(axe de la dorsale)</text>

    <!-- Construction de la pente, flanc ouest : Δdistance (haut, horizontal)
         puis Δâge (le "run" vertical réutilise l'axe de symétrie lui-même,
         déjà tracé ci-dessus de (360,45) à (360,370) — même segment, pas de
         doublon) -->
    <line x1="60" y1="60" x2="360" y2="60" stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="60" y1="55" x2="60" y2="65" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="210" y="48" text-anchor="middle" font-size="10" fill="var(--figure-accent)">Δdistance = 300 km</text>
    <text x="372" y="219" font-size="10" fill="var(--figure-accent)">Δâge = 30 Ma</text>

    <!-- Encart vitesse -->
    <rect x="205" y="412" width="310" height="44" rx="8" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="360" y="429" text-anchor="middle" font-size="11" fill="var(--figure-accent)">300 km / 30 Ma = 1 cm/an (par flanc)</text>
    <text x="360" y="447" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-accent)">⇒ 2 cm/an d’écartement total (≈ GPS)</text>
  </g><!-- /step-3 -->

</svg>
