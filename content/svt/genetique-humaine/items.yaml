notion: genetique-humaine
skill_code: svt_genetique_humaine
misconceptions: []
items:
  - id: GH-1
    rung: "R1"
    difficulty_level: 2
    skill_code: svt_genetique_humaine
    tags: [vocabulaire, autosome_gonosome]
    stem: >
      Le caryotype humain compte 46 chromosomes, organisés en 23 paires.
      Combien de ces paires sont des autosomes, et combien sont des
      gonosomes (chromosomes sexuels) ?
    type: mcq
    choices:
      - id: A
        text: "22 paires d'autosomes et 1 paire de gonosomes (les chromosomes X et Y)."
        correct: true
      - id: B
        text: "23 paires d'autosomes, et aucune paire de gonosomes : tous les chromosomes se transmettent de la même façon."
        correct: false
        feedback: >
          C'est l'inverse de ce que montre la leçon : c'est justement parce
          que la 23ᵉ paire (X et Y) ne se transmet PAS de la même façon
          selon le sexe de l'enfant qu'on la distingue des 22 autres paires
          sous le nom de gonosomes. Confondre les deux catégories revient à
          effacer la distinction sur laquelle repose tout le raisonnement du
          R3.
      - id: C
        text: "11 paires d'autosomes et 12 paires de gonosomes."
        correct: false
        feedback: >
          Il n'existe qu'UNE seule paire de gonosomes chez l'être humain (la
          23ᵉ paire, X et Y) — jamais douze. Les 22 autres paires sont toutes
          des autosomes, identiques en nombre et en nature chez l'homme et la
          femme.
      - id: D
        text: "22 paires d'autosomes et 2 paires de gonosomes, une pour chaque sexe."
        correct: false
        feedback: >
          Il n'y a qu'UNE seule paire de gonosomes au total, pas deux
          paires séparées selon le sexe : c'est la COMPOSITION de cette
          unique paire qui diffère (XX chez la femme, XY chez l'homme), pas
          son nombre.
    correct_feedback: >
      22 paires d'autosomes (identiques chez les deux sexes) et 1 paire de
      gonosomes (X et Y), dont la composition diffère entre l'homme (XY) et
      la femme (XX) — c'est cette 23ᵉ paire qui rendra possible, au R3, la
      distinction entre transmission autosomale et transmission liée au
      sexe.
    solution: |
      **Autosomes :** 22 paires, rigoureusement identiques chez l'homme et
      la femme — un gène qui s'y trouve se transmet indépendamment du sexe
      de l'enfant.

      **Gonosomes :** 1 seule paire (la 23ᵉ), de composition XX (femme) ou
      XY (homme) — un gène qui s'y trouve (presque toujours sur l'X) se
      transmet de façon différente selon que l'enfant est un fils ou une
      fille.

  - id: GH-2
    rung: "R2"
    difficulty_level: 3
    skill_code: svt_genetique_humaine
    tags: [recessif_dominant, arbre_genealogique]
    stem: >
      Un couple dont les deux membres sont phénotypiquement sains a un
      enfant atteint d'une maladie génétique rare. Que peut-on affirmer,
      avec certitude, sur le mode de dominance de l'allèle responsable ?
    type: mcq
    choices:
      - id: A
        text: "L'allèle est récessif ; les deux parents sont nécessairement hétérozygotes, porteurs sains de l'allèle."
        correct: true
      - id: B
        text: "L'allèle est dominant, puisqu'il a bien fini par s'exprimer chez l'enfant."
        correct: false
        feedback: >
          Un allèle dominant s'exprime dès qu'il est présent en un seul
          exemplaire — il ne peut donc jamais rester invisible chez un
          parent qui le porte. Si l'allèle était dominant, l'un des deux
          parents serait lui-même atteint. Comme aucun des deux ne l'est,
          l'hypothèse dominante est directement contredite par
          l'observation.
      - id: C
        text: "On ne peut rien conclure : un enfant peut être atteint sans que le mode de dominance soit déterminable à partir de ce seul fait."
        correct: false
        feedback: >
          C'est justement le test décisif du R2 : « enfant atteint, deux
          parents sains » élimine mécaniquement l'hypothèse dominante (elle
          exigerait qu'un parent soit lui-même atteint), donc l'allèle est
          nécessairement récessif. Ce n'est pas une question ouverte, c'est
          un raisonnement par élimination.
      - id: D
        text: "L'allèle est nécessairement lié au chromosome X, puisque les deux parents sont sains."
        correct: false
        feedback: >
          Ce test répond à une seule question — récessif ou dominant — pas
          à l'autre — autosomal ou lié à l'X. Ce sont deux axes de décision
          séparés (R2 et R3), qui demandent chacun leur propre test ; le
          fait que les deux parents soient sains ne dit rien, à lui seul,
          sur le chromosome porteur.
    correct_feedback: >
      Si l'allèle était dominant, tout parent qui le transmet devrait
      lui-même être atteint. Comme les deux parents sont phénotypiquement
      sains, l'allèle ne peut être que récessif, et les deux parents sont
      hétérozygotes.
    solution: |
      **Hypothèse dominante testée :** un parent portant un allèle dominant
      serait lui-même atteint. Contredite ici (les deux parents sont sains).

      **Conclusion :** l'allèle est récessif ; l'enfant atteint est
      homozygote, chaque parent hétérozygote ayant transmis son exemplaire
      récessif sans être lui-même affecté par lui.

  - id: GH-3
    rung: "R3"
    difficulty_level: 4
    skill_code: svt_genetique_humaine
    tags: [pedigree_reasoning, lie_x, autosomal_vs_gonosomal]
    stem: >
      Dans une famille, une fille est atteinte d'une maladie génétique
      récessive rare. Son père est phénotypiquement sain (aucun signe de la
      maladie). Peut-on, à partir de cette seule observation, écarter
      l'hypothèse d'une transmission récessive liée au chromosome X ?
    type: mcq
    choices:
      - id: A
        text: "Oui : une fille atteinte d'une maladie récessive liée à l'X doit recevoir un chromosome X porteur de l'allèle de CHAQUE parent, y compris de son père — qui n'a qu'un seul X à transmettre. Un père sain ne peut transmettre qu'un X porteur de l'allèle normal ; le mode est donc plutôt autosomal."
        correct: true
      - id: B
        text: "Non : le père a pu transmettre l'allèle malade à sa fille sans être lui-même atteint, comme n'importe quel porteur sain hétérozygote."
        correct: false
        feedback: >
          C'est oublier l'hémizygotie masculine (R4) : un homme n'a qu'un
          seul chromosome X, sans second exemplaire pour masquer un allèle
          récessif. Il ne peut donc pas exister de « porteur sain » masculin
          pour un gène de l'X — quel que soit l'allèle sur son unique X, il
          s'exprime directement. Un père phénotypiquement sain a
          nécessairement un X porteur de l'allèle normal, point final.
      - id: C
        text: "Non, cela confirme au contraire une transmission liée à l'X, puisque les filles héritent souvent d'un chromosome X de leur père."
        correct: false
        feedback: >
          Le problème n'est pas de savoir SI la fille hérite d'un X de son
          père (elle en hérite toujours un) : le problème est LEQUEL. Le
          test A du R3 montre précisément que le X que ce père peut
          transmettre est provablement porteur de l'allèle normal, puisque
          lui-même n'est pas atteint — ce qui exclut, plutôt que confirme,
          l'hypothèse liée à l'X récessive pour cette fille.
      - id: D
        text: "On ne peut rien en conclure sans connaître aussi le phénotype de la mère."
        correct: false
        feedback: >
          Le phénotype de la mère n'est pas nécessaire ici : que la mère
          soit porteuse ou non ne change rien au fait que le père,
          hémizygote et phénotypiquement sain, ne peut transmettre qu'un X
          normal. Cela suffit, à lui seul, pour exclure la transmission
          récessive liée à l'X pour cette fille atteinte.
    correct_feedback: >
      Une fille atteinte d'une maladie récessive liée à l'X est
      obligatoirement homozygote ($X^aX^a$) : elle doit recevoir un $X^a$ de
      chacun de ses deux parents. Un père hémizygote et phénotypiquement
      sain ne peut transmettre qu'un $X$ porteur de l'allèle normal — la
      transmission liée à l'X récessive est donc impossible ici ; il faut
      chercher du côté d'une maladie autosomale récessive.
    solution: |
      **Ce qu'exige l'hypothèse liée à l'X récessive :** la fille atteinte
      doit être $X^{a}X^{a}$, donc recevoir un $X^{a}$ de son père.

      **Ce que montre l'observation :** le père est phénotypiquement sain ;
      étant hémizygote, son unique X est nécessairement $X^{A}$ (l'allèle
      normal) — il ne peut transmettre que celui-là.

      **Conclusion :** contradiction avec l'hypothèse liée à l'X récessive.
      Le mode de transmission le plus probable devient autosomal récessif
      (les deux parents hétérozygotes, comme au R2).

  - id: GH-4
    rung: "R4"
    difficulty_level: 3
    skill_code: svt_genetique_humaine
    tags: [hemizygotie, lie_x]
    stem: >
      Pourquoi un homme ne peut-il jamais être « porteur sain » (hétérozygote
      sans être atteint) d'une maladie récessive liée au chromosome X ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'il ne possède qu'un seul chromosome X (il est hémizygote pour les gènes de l'X) : il n'a pas de second exemplaire pour masquer un allèle récessif, qui s'exprime donc directement."
        correct: true
      - id: B
        text: "Parce qu'un homme ne peut de toute façon jamais être atteint d'une maladie liée à l'X."
        correct: false
        feedback: >
          C'est l'inverse de ce que montre la leçon : les hommes sont au
          contraire BEAUCOUP plus souvent atteints de maladies récessives
          liées à l'X que les femmes (R4, fermeture de l'arc du R0),
          précisément parce qu'un seul exemplaire de l'allèle récessif
          suffit à provoquer la maladie chez eux.
      - id: C
        text: "Parce que l'allèle situé sur son chromosome Y compense automatiquement l'allèle récessif situé sur son X."
        correct: false
        feedback: >
          Pour la quasi-totalité des gènes portés par l'X, le chromosome Y
          — beaucoup plus petit — ne porte pas de version équivalente du
          gène. Il n'y a donc rien sur le Y qui puisse « compenser » quoi
          que ce soit : c'est justement L'ABSENCE de ce second exemplaire qui
          explique que l'allèle de l'X s'exprime sans être masqué.
      - id: D
        text: "Parce que chez l'homme, l'allèle récessif devient automatiquement dominant."
        correct: false
        feedback: >
          La dominance est une relation entre deux allèles d'un même gène
          présents ensemble dans un génotype — elle ne « change » pas selon
          le sexe. Chez l'homme, il n'y a tout simplement qu'un seul allèle
          présent (pas de second exemplaire pour définir une relation de
          dominance) : c'est l'absence de partenaire allélique, pas une
          conversion de récessif en dominant, qui explique l'expression
          directe.
    correct_feedback: >
      Un homme est hémizygote pour les gènes portés par l'X : un seul
      exemplaire, sans second chromosome homologue pour le masquer. L'allèle
      présent sur son unique X s'exprime donc toujours directement dans le
      phénotype — il n'existe pas de case « porteur sain » masculine pour un
      gène de l'X.
    solution: |
      **Chez la femme (deux X) :** un allèle récessif peut être masqué par
      l'allèle dominant du second X — génotype $X^AX^a$, phénotype sain.

      **Chez l'homme (un seul X, hémizygote) :** il n'y a pas de second
      exemplaire pour masquer quoi que ce soit. $X^aY$ n'a pas d'équivalent
      « porteur sain » : l'allèle sur l'unique X s'exprime directement.

      **Conséquence :** un seul exemplaire de l'allèle récessif suffit à
      rendre un homme atteint, contre deux exemplaires nécessaires chez la
      femme — d'où la fréquence beaucoup plus grande des maladies comme le
      daltonisme ou l'hémophilie chez les hommes.

  - id: GH-5
    rung: "R5"
    difficulty_level: 5
    skill_code: svt_genetique_humaine
    tags: [calcul_probabilite, genotype_incertain]
    stem: >
      Un couple, tous deux hétérozygotes ($A//a$) pour une maladie
      autosomale récessive, a deux enfants : l'un est atteint de la maladie,
      l'autre est phénotypiquement sain. Quelle est la probabilité que
      l'enfant sain soit lui-même porteur (hétérozygote $A//a$) ?
    type: mcq
    choices:
      - id: A
        text: "$\\frac{2}{3}$"
        correct: true
      - id: B
        text: "$\\frac{1}{2}$"
        correct: false
        feedback: >
          Ce chiffre traiterait $A//A$ et $A//a$ comme deux issues
          également probables — mais dans l'échiquier complet, elles ne le
          sont pas ($\frac14$ contre $\frac24$). Une fois qu'on sait que
          l'enfant est sain, il faut recompter les proportions
          UNIQUEMENT parmi les issues compatibles avec « sain » (en
          excluant $a//a$), pas supposer une égalité de départ.
      - id: C
        text: "$\\frac{1}{4}$"
        correct: false
        feedback: >
          $\frac14$ est la proportion de $A//a$ dans l'échiquier COMPLET
          (toutes issues confondues, y compris $a//a$). Mais on sait déjà
          que cet enfant est sain — cette information doit être utilisée
          pour éliminer la possibilité $a//a$ et renormaliser les
          proportions restantes, pas ignorée.
      - id: D
        text: "$1$"
        correct: false
        feedback: >
          Ce n'est pas une certitude : un enfant sain issu de deux parents
          hétérozygotes peut tout aussi bien être homozygote sain ($A//A$),
          ce qui arrive dans $\frac13$ des cas compatibles avec « sain ».
          Seule une déduction basée sur un parent hémizygote (comme au R3)
          donne une certitude absolue — ici, l'incertitude est réelle.
    correct_feedback: >
      Dans l'échiquier $A//a \times A//a$, les issues sont $\frac14$
      $A//A$, $\frac24$ $A//a$, $\frac14$ $a//a$. Sachant l'enfant sain, on
      élimine $a//a$ et on renormalise sur les $\frac34$ restants :
      $P(A//a \mid \text{sain}) = \frac{2/4}{3/4} = \frac23$.
    solution: |
      **Échiquier complet :** $\frac14$ $A//A$, $\frac24$ $A//a$, $\frac14$
      $a//a$.

      **Restriction au phénotype sain :** on retire $a//a$ ; il reste
      $\frac14 + \frac24 = \frac34$ des cas.

      $$P(A//a \mid \text{sain}) = \frac{2/4}{3/4} = \frac{2}{3} \qquad P(A//A \mid \text{sain}) = \frac{1/4}{3/4} = \frac{1}{3}$$

      **Conclusion :** un enfant phénotypiquement sain issu de deux parents
      hétérozygotes a $\frac23$ de chances d'être lui-même porteur.

  - id: GH-6
    rung: "R3"
    difficulty_level: 3
    skill_code: svt_genetique_humaine
    tags: [chromosome_y, transmission_holandrique]
    stem: >
      Un caractère héréditaire $M$ est porté par le chromosome Y. Un homme
      atteint de $M$ a deux fils et une fille. Quel est le phénotype attendu
      chez chacun de ces trois enfants pour le caractère $M$ ?
    type: mcq
    choices:
      - id: A
        text: "Les deux fils sont atteints (ils reçoivent le chromosome Y de leur père, donc l'allèle $M$) ; la fille n'est jamais concernée, puisqu'elle ne reçoit pas de chromosome Y."
        correct: true
      - id: B
        text: "Seule la moitié des fils est atteinte, comme pour un caractère porté par le chromosome X."
        correct: false
        feedback: >
          Ce résultat importe à tort le raisonnement de l'X (où une mère
          hétérozygote transmet l'un ou l'autre de ses deux X, chacun avec
          une probabilité $\frac12$). Un homme n'a qu'UN SEUL chromosome Y,
          transmis intégralement et systématiquement à chacun de ses fils —
          il n'existe pas de second Y qui viendrait diluer la transmission
          à $\frac12$.
      - id: C
        text: "La fille est atteinte, car elle reçoit un chromosome X de son père."
        correct: false
        feedback: >
          La fille reçoit effectivement un X de son père — mais le
          caractère $M$ est porté par le chromosome Y, pas par l'X. Or une
          fille ne reçoit jamais le chromosome Y de son père (elle reçoit un
          X de chacun de ses deux parents) : elle ne peut donc jamais
          hériter d'un allèle qui n'existe que sur le Y.
      - id: D
        text: "Aucun enfant n'est atteint, car un caractère héréditaire saute toujours une génération."
        correct: false
        feedback: >
          Ce « saut de génération » est la signature d'une transmission
          RÉCESSIVE (R2), pas d'une localisation chromosomique. La
          transmission liée au chromosome Y est au contraire la plus directe
          et la plus certaine des trois : chaque fils reçoit intégralement
          le Y de son père, sans aucune possibilité de saut.
    correct_feedback: >
      Le chromosome Y ne se transmet que du père vers ses fils, en entier et
      sans exception ; une fille n'en reçoit jamais. Tout fils d'un père
      atteint d'un caractère lié à l'Y est donc atteint avec certitude, et
      aucune fille ne l'est jamais.
    solution: |
      **Règle d'origine (R3) :** un fils reçoit le chromosome Y de son
      père ; une fille ne reçoit que des chromosomes X (un de chaque
      parent), jamais de Y.

      **Conséquence pour un caractère porté par l'Y :** les deux fils
      reçoivent chacun le Y paternel intact, donc l'allèle $M$ — ils sont
      tous deux atteints. La fille ne reçoit pas de Y : elle n'est jamais
      concernée par $M$, quel que soit par ailleurs son génotype pour ses
      chromosomes X.
