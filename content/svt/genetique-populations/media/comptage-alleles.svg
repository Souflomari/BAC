<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Comptage des allèles dans une population de 1 000 escargots : 550 individus B//B, 300 B//b et 150 b//b donnent 1 400 exemplaires de l'allèle B et 600 exemplaires de l'allèle b — la fréquence allélique p = 0,70 diffère de la fréquence génotypique f(B//B) = 0,55, car chaque hétérozygote compte pour une moitié dans chaque camp, jamais pour un individu entier.">
  <title>Compter des individus n'est pas compter des allèles</title>

  <!--
    comptage-alleles.svg — figure STATIQUE (pas de step-groups).
    Cible précise : l'erreur nommée EXPLICITEMENT en R1 du lesson.md
    ("Arrête-toi — fréquence allélique et fréquence génotypique ne sont PAS
    le même nombre", qualifiée dans le texte de "l'erreur la plus fréquente
    de tout ce chapitre"). Reprend le SEUL exemple numérique travaillé du
    rung (les 1 000 escargots : 550 B//B, 300 B//b, 150 b//b → compte(B) =
    1 400, compte(b) = 600, p = 0,70, q = 0,30 ; f(B//B) = 0,55 ≠ p = 0,70).

    Deux barres empilées, MÊME largeur totale (480 px = 100 %), à deux
    échelles différentes :
      Barre 1 (haut)  — comptage par INDIVIDUS,  N  = 1 000 → 0,48 px/individu
      Barre 2 (bas)   — comptage par ALLÈLES,    2N = 2 000 → 0,24 px/exemplaire
    Coïncidence arithmétique exploitée pour l'alignement visuel : un
    homozygote porte 2 exemplaires, donc sa largeur ne change PAS d'une
    barre à l'autre (2 × échelle-moitié = même largeur). Un hétérozygote,
    lui, porte 1 exemplaire de chaque allèle : sa tranche unique de la
    barre 1 se scinde en DEUX tranches adjacentes de même largeur totale
    dans la barre 2 — une pour B, une pour b. C'est cette scission, et
    elle seule, qui porte l'accent visuel.

    Convention couleur : classes homozygotes (B//B, b//b) en
    --figure-ink / --figure-ink-soft (neutre, non concernées par la
    scission). Classe hétérozygote B//b et ses DEUX contributions dans la
    barre du bas : seule idée accentuée (--figure-accent) — c'est elle qui
    explique tout l'écart entre 0,55 et 0,70.
  -->

  <!-- Titre -->
  <text x="320" y="26" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    L'hétérozygote compte à moitié dans chaque camp, jamais en entier
  </text>

  <!-- ── Légende ligne 1 ─────────────────────────────────────────────── -->
  <text x="320" y="50" text-anchor="middle"
        font-size="11" fill="var(--figure-ink-soft)">
    Comptage des individus — fréquence génotypique (N = 1 000)
  </text>

  <!-- ── Barre 1 : individus (échelle 0,48 px / individu) ──────────────── -->
  <!-- B//B : 550 individus, x 80→344 -->
  <rect x="80" y="60" width="264" height="48"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
  <text x="212" y="80" text-anchor="middle"
        font-size="12" font-weight="700" font-style="italic"
        fill="var(--figure-ink)">B//B</text>
  <text x="212" y="99" text-anchor="middle"
        font-size="10" fill="var(--figure-ink-soft)">550</text>

  <!-- B//b : 300 individus, x 344→488 — classe accentuée -->
  <rect x="344" y="60" width="144" height="48"
        fill="var(--figure-accent)" fill-opacity="0.14"
        stroke="var(--figure-accent)" stroke-width="1.8"/>
  <text x="416" y="80" text-anchor="middle"
        font-size="12" font-weight="700" font-style="italic"
        fill="var(--figure-accent)">B//b</text>
  <text x="416" y="99" text-anchor="middle"
        font-size="10" fill="var(--figure-ink-soft)">300</text>

  <!-- b//b : 150 individus, x 488→560 -->
  <rect x="488" y="60" width="72" height="48"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
  <text x="524" y="80" text-anchor="middle"
        font-size="12" font-weight="700" font-style="italic"
        fill="var(--figure-ink)">b//b</text>
  <text x="524" y="99" text-anchor="middle"
        font-size="10" fill="var(--figure-ink-soft)">150</text>

  <!-- ── Connecteurs (individus → exemplaires de gène) ─────────────────── -->
  <!-- B//B → tout entier dans le camp B (pas de scission) -->
  <line x1="212" y1="108" x2="212" y2="188"
        stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- b//b → tout entier dans le camp b (pas de scission) -->
  <line x1="524" y1="108" x2="524" y2="188"
        stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- B//b → SCISSION : une moitié dans le camp B, une moitié dans le camp b -->
  <line x1="416" y1="108" x2="380" y2="188"
        stroke="var(--figure-accent)" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.65"/>
  <line x1="416" y1="108" x2="452" y2="188"
        stroke="var(--figure-accent)" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.65"/>

  <!-- ── Légende ligne 2 ─────────────────────────────────────────────── -->
  <text x="320" y="196" text-anchor="middle"
        font-size="11" fill="var(--figure-ink-soft)">
    Comptage des exemplaires de gène — fréquence allélique (2N = 2 000)
  </text>

  <!-- ── Barre 2 : exemplaires de gène (échelle 0,24 px / exemplaire) ──── -->
  <!-- Contribution de B//B : 2 × 550 = 1 100 exemplaires de B, x 80→344 -->
  <rect x="80" y="200" width="264" height="48"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
  <text x="212" y="222" text-anchor="middle"
        font-size="12" fill="var(--figure-ink)">1 100</text>
  <text x="212" y="238" text-anchor="middle"
        font-size="8.5" fill="var(--figure-ink-soft)">(2 × 550)</text>

  <!-- Contribution de B//b côté B : 1 × 300 = 300 exemplaires de B, x 344→416 -->
  <rect x="344" y="200" width="72" height="48"
        fill="var(--figure-accent)" fill-opacity="0.14"
        stroke="var(--figure-accent)" stroke-width="1.8"/>
  <text x="380" y="222" text-anchor="middle"
        font-size="11" fill="var(--figure-accent)">300</text>
  <text x="380" y="238" text-anchor="middle"
        font-size="7.5" fill="var(--figure-ink-soft)">(1 × 300)</text>

  <!-- Contribution de B//b côté b : 1 × 300 = 300 exemplaires de b, x 416→488 -->
  <rect x="416" y="200" width="72" height="48"
        fill="var(--figure-accent)" fill-opacity="0.14"
        stroke="var(--figure-accent)" stroke-width="1.8"/>
  <text x="452" y="222" text-anchor="middle"
        font-size="11" fill="var(--figure-accent)">300</text>
  <text x="452" y="238" text-anchor="middle"
        font-size="7.5" fill="var(--figure-ink-soft)">(1 × 300)</text>

  <!-- Contribution de b//b : 2 × 150 = 300 exemplaires de b, x 488→560 -->
  <rect x="488" y="200" width="72" height="48"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
  <text x="524" y="222" text-anchor="middle"
        font-size="11" fill="var(--figure-ink)">300</text>
  <text x="524" y="238" text-anchor="middle"
        font-size="7.5" fill="var(--figure-ink-soft)">(2 × 150)</text>

  <!-- ── Accolades de regroupement : camp B (1 400) / camp b (600) ─────── -->
  <!-- Camp B : x 84→412 -->
  <line x1="84" y1="248" x2="84" y2="264" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="412" y1="248" x2="412" y2="264" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="84" y1="264" x2="412" y2="264" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="248" y="282" text-anchor="middle" font-size="11" fill="var(--figure-ink)">
    exemplaires de <tspan font-style="italic">B</tspan>
  </text>
  <text x="248" y="300" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">
    <tspan font-style="italic">p</tspan> = 1 400 / 2 000 = 0,70
  </text>

  <!-- Camp b : x 420→556 -->
  <line x1="420" y1="248" x2="420" y2="264" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="556" y1="248" x2="556" y2="264" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="420" y1="264" x2="556" y2="264" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="488" y="282" text-anchor="middle" font-size="11" fill="var(--figure-ink)">
    exemplaires de <tspan font-style="italic">b</tspan>
  </text>
  <text x="488" y="300" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">
    <tspan font-style="italic">q</tspan> = 600 / 2 000 = 0,30
  </text>

  <!-- ── Encart final : le contraste qui referme la boucle ─────────────── -->
  <rect x="70" y="316" width="500" height="74" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="1.6"/>

  <!-- Colonne gauche : fréquence génotypique -->
  <text x="200" y="340" text-anchor="middle" font-size="13" fill="var(--figure-ink)">
    <tspan font-style="italic">f</tspan>(<tspan font-style="italic" font-weight="700">B//B</tspan>) = 0,55
  </text>
  <text x="200" y="358" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">
    fréquence génotypique
  </text>

  <!-- Symbole central : PAS égaux -->
  <text x="320" y="352" text-anchor="middle" font-size="22" font-weight="700"
        fill="var(--figure-accent)">≠</text>

  <!-- Colonne droite : fréquence allélique -->
  <text x="440" y="340" text-anchor="middle" font-size="13" fill="var(--figure-ink)">
    <tspan font-style="italic">p</tspan> = 0,70
  </text>
  <text x="440" y="358" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">
    fréquence allélique
  </text>
</svg>
