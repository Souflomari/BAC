<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Quatre coupes empilées, une par temps de l'histoire Inde-Asie. Il y a plus de 100 millions d'années, un océan, la Téthys, sépare l'Inde de l'Asie et sa lithosphère océanique plonge sous l'Asie, comme aux Andes. La subduction consomme l'océan, qui rétrécit. L'océan disparaît entièrement : les deux marges continentales entrent en contact direct, trop légères pour plonger — la subduction s'arrête. La convergence continue : la croûte se raccourcit et s'empile, son épaisseur double, d'environ 35 à 70-80 kilomètres — c'est cet épaississement qui porte la chaîne si haut.">
  <title>La collision Inde-Asie, en quatre temps</title>

  <!--
    collision-himalaya.svg — STAGED, 4 étapes (R2). Séquence TEMPORELLE :
    contrairement à subduction-andes.svg (une coupe qui se complète par
    ajouts), l'histoire Inde-Asie change réellement de géométrie au cours
    du temps (l'océan rétrécit puis disparaît) — un contenu que le contrat
    DOM-absence du renderer ne permet PAS de représenter en modifiant une
    même forme d'étape en étape (les groupes stagés ne font qu'ADDITIONNER,
    jamais retirer/redimensionner un élément déjà posé).

    Solution retenue, IDENTIQUE à celle déjà documentée dans
    frontieres-plaques-quatre-types.svg (même dossier de leçons, même
    contrainte) : quatre PANNEAUX empilés, un temps par panneau, chaque
    panneau une scène indépendante et complète. Le mécanisme d'empilement
    par défaut de StagedFigure (panneaux déjà vus estompés à 0.55, pas de
    recadrage de viewBox) est utilisé tel quel — l'enregistrer dans
    VERTICALLY_STACKED_PANELS demanderait d'éditer
    web/src/components/notion/MediaDiagram.tsx, hors périmètre de cette
    passe de contenu. Au dernier stade, les quatre temps restent tous
    visibles (les trois premiers estompés) : le lecteur voit l'histoire
    complète, dans l'ordre, en un coup d'œil.

      panneau 1 (y=34..176)  : l'océan Téthys plonge sous l'Asie (comme R1)
      panneau 2 (y=176..318) : la subduction consomme l'océan, qui rétrécit
      panneau 3 (y=318..460) : contact direct, la subduction s'arrête
      panneau 4 (y=460..602) : la croûte s'épaissit (35 → 70-80 km)

    Convention couleur : l'Inde et l'Asie (structure établie) restent en
    --figure-ink / --figure-surface à chaque panneau. L'accent marque la
    seule idée nouvelle de CE panneau : l'océan qui plonge (1), l'océan qui
    rétrécit (2), le contact direct (3), l'épaississement (4). Les
    panneaux 1-3 n'affichent délibérément NI arc volcanique actif NI plan
    sismique profond une fois la collision entamée (panneaux 3-4) — cette
    absence, par contraste avec subduction-andes.svg, est elle-même la
    confrontation R1↔R2 que le texte fait à ce moment de la leçon.

    Simplification pédagogique assumée : schéma de principe, pas à
    l'échelle (durées, distances et épaisseurs sont exagérées pour rester
    lisibles) ; l'épaississement du panneau 4 est montré à l'échelle de la
    COLONNE crustale (35 → 70-80 km), pas à l'échelle de l'affleurement
    (plis/chevauchements) — ce niveau-là est le domaine de
    plis-chevauchement.svg (R4), volontairement absent ici.
  -->

  <text x="350" y="20" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    La collision Inde-Asie : quatre temps d'une même histoire
  </text>

  <!-- ══════════════════════════════════════════════════════════════════
       PANNEAU 1 — Il y a plus de 100 Ma : la Téthys plonge sous l'Asie
       y = 34..176
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="30" y="54" font-size="12.5" font-weight="700" fill="var(--figure-ink)">
      1 — il y a plus de 100 Ma : un océan sépare l'Inde de l'Asie
    </text>
    <text x="670" y="54" text-anchor="end" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">
      la Téthys
    </text>

    <rect x="40" y="95" width="170" height="45" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="125" y="121" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-ink)">Inde</text>

    <rect x="480" y="80" width="180" height="60" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="570" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-ink)">Asie</text>

    <!-- Lithosphère océanique de la Téthys, plongeant sous l'Asie (accent — la preuve du parallèle avec R1) -->
    <rect x="210" y="118" width="190" height="10" fill="var(--figure-accent)" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <polygon points="400,120 430,126 470,230 445,240"
             fill="var(--figure-accent)" fill-opacity="0.7" stroke="var(--figure-accent)" stroke-width="1.4"/>

    <!-- Marge active de type andin (contexte, discret) -->
    <polygon points="500,80 515,58 530,80" fill="var(--figure-ink-soft)" fill-opacity="0.5" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="536" y="70" text-anchor="start" font-size="8.5" font-style="italic" fill="var(--figure-ink-soft)">
      marge active (comme aux Andes)
    </text>

    <text x="305" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">
      la Téthys plonge sous l'Asie — exactement comme aux Andes
    </text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════════════════
       PANNEAU 2 — La subduction consomme l'océan : la Téthys rétrécit
       y = 176..318
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="20" y1="176" x2="680" y2="176" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="30" y="196" font-size="12.5" font-weight="700" fill="var(--figure-ink)">
      2 — la subduction consomme l'océan : la Téthys rétrécit
    </text>
    <text x="670" y="196" text-anchor="end" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">
      quelques dizaines de Ma plus tard
    </text>

    <rect x="220" y="237" width="170" height="45" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="305" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-ink)">Inde</text>

    <rect x="480" y="222" width="180" height="60" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="570" y="248" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-ink)">Asie</text>

    <!-- Ce qui reste de la Téthys : bande océanique et plongée, nettement plus étroites qu'au panneau 1 (accent) -->
    <rect x="390" y="258" width="60" height="8" fill="var(--figure-accent)" stroke="var(--figure-accent)" stroke-width="1.2"/>
    <polygon points="450,260 470,264 488,340 466,346"
             fill="var(--figure-accent)" fill-opacity="0.7" stroke="var(--figure-accent)" stroke-width="1.2"/>

    <line x1="168" y1="212" x2="212" y2="212" stroke="var(--figure-ink)" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="222,212 210,207 210,217" fill="var(--figure-ink)"/>
    <text x="190" y="205" text-anchor="middle" font-size="8.5" fill="var(--figure-ink-soft)">convergence continue</text>

    <text x="330" y="303" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">
      chaque kilomètre englouti rétrécit l'océan
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════════════════
       PANNEAU 3 — L'océan disparu : contact direct, la subduction s'arrête
       y = 318..460
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="20" y1="318" x2="680" y2="318" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="30" y="338" font-size="12.5" font-weight="700" fill="var(--figure-ink)">
      3 — l'océan a disparu : contact direct, la subduction s'arrête
    </text>

    <text x="470" y="352" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">
      contact direct — plus aucun océan entre les deux
    </text>

    <rect x="280" y="379" width="190" height="45" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="375" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-ink)">Inde</text>

    <rect x="470" y="364" width="190" height="60" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="565" y="398" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-ink)">Asie</text>

    <!-- La ligne de contact — la preuve de ce panneau (accent) -->
    <line x1="470" y1="364" x2="470" y2="424" stroke="var(--figure-accent)" stroke-width="3.2" stroke-linecap="round"/>

    <text x="470" y="442" text-anchor="middle" font-size="9" font-style="italic" fill="var(--figure-ink-soft)">
      la croûte continentale, trop légère, ne peut plonger
    </text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════════════════
       PANNEAU 4 — La convergence continue : la croûte s'épaissit
       y = 460..602
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="20" y1="460" x2="680" y2="460" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="30" y="480" font-size="12.5" font-weight="700" fill="var(--figure-ink)">
      4 — la convergence continue : la croûte s'épaissit (35 → 70-80 km)
    </text>

    <rect x="280" y="500" width="190" height="45" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="330" y="527" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--figure-ink)">Inde</text>

    <rect x="560" y="500" width="100" height="45" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="610" y="527" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--figure-ink)">Asie</text>

    <!-- Zone d'épaississement à la suture — l'idée du panneau (accent) -->
    <rect x="440" y="468" width="120" height="77" rx="3"
          fill="var(--figure-accent)" fill-opacity="0.22" stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="440" y1="490" x2="560" y2="490" stroke="var(--figure-accent)" stroke-width="1" opacity="0.6"/>
    <line x1="440" y1="512" x2="560" y2="512" stroke="var(--figure-accent)" stroke-width="1" opacity="0.6"/>
    <line x1="440" y1="527" x2="560" y2="527" stroke="var(--figure-accent)" stroke-width="1" opacity="0.6"/>

    <!-- Comparatif d'épaisseur -->
    <line x1="250" y1="500" x2="250" y2="545" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="246" y1="500" x2="254" y2="500" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="246" y1="545" x2="254" y2="545" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <text x="240" y="526" text-anchor="end" font-size="9.5" fill="var(--figure-ink)">≈ 35 km</text>

    <line x1="580" y1="468" x2="580" y2="545" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="576" y1="468" x2="584" y2="468" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="576" y1="545" x2="584" y2="545" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="590" y="510" text-anchor="start" font-size="9.5" font-weight="700" fill="var(--figure-accent)">70-80 km</text>

    <text x="330" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">
      la croûte double d'épaisseur — c'est elle qui porte la chaîne si haut
    </text>
  </g><!-- /step-4 -->

</svg>
