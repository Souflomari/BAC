<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Coupe de la subduction andine : la plaque océanique de Nazca plonge sous la plaque continentale sud-américaine. À l'aplomb de la plongée se creuse une fosse océanique. En s'enfonçant, la plaque relâche de l'eau vers le manteau au-dessus d'elle ; cette eau abaisse le seuil de fusion du manteau, qui fond partiellement — le magma remonte et forme une chaîne de volcans andésitiques, décalée vers l'intérieur du continent par rapport à la fosse. Les foyers sismiques s'alignent sur un plan incliné qui s'enfonce vers l'intérieur : le plan de Wadati-Benioff, la preuve qu'une plaque rigide plonge encore aujourd'hui.">
  <title>La subduction andine : quatre étapes du mécanisme</title>

  <!--
    subduction-andes.svg — STAGED, 4 étapes (R1). Une SEULE coupe qui se
    construit par ajouts successifs (jamais de retrait ni de restyle d'un
    élément déjà posé — contrat DOM-absence du renderer) :

      step-1 : les deux plaques (Nazca océanique / sud-américaine
               continentale), la fosse océanique à l'aplomb de la plongée,
               les flèches de convergence.
      step-2 : + l'eau relâchée par la plaque qui s'enfonce, remontant vers
               le coin de manteau au-dessus d'elle (petites flèches).
      step-3 : + la zone de fusion partielle (déclenchée par l'eau, PAS par
               un excès de chaleur), le conduit magmatique et le volcan en
               surface — visiblement DÉCALÉ vers l'intérieur par rapport à
               la fosse, jamais à son aplomb.
      step-4 : + les foyers sismiques (points), alignés sur un plan incliné
               qui s'enfonce vers l'intérieur — le plan de Wadati-Benioff.

    Convention couleur : les deux plaques (structure établie, jamais le
    point culminant d'une étape) restent en --figure-ink / --figure-surface.
    L'accent marque, À CHAQUE étape, la seule idée NOUVELLE de cette
    étape : la fosse (1), l'eau relâchée (2), la fusion + le volcan décalé
    (3), le plan sismique incliné (4). Les flèches de convergence (contexte
    mécanique, pas la preuve elle-même) restent en --figure-ink.

    Simplification pédagogique assumée : schéma de principe, pas à
    l'échelle réelle (l'angle du panneau plongeant, la profondeur des
    foyers et la distance fosse-arc sont exagérés pour rester lisibles à
    cette taille).
  -->

  <text x="350" y="22" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    La subduction andine : la plaque de Nazca plonge sous l'Amérique du Sud
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Les deux plaques, la fosse, la convergence
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Manteau / asthénosphère (fond) -->
    <rect x="40" y="95" width="620" height="280" rx="4"
          fill="var(--figure-grid)" opacity="0.3" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <!-- Plaque continentale sud-américaine -->
    <rect x="330" y="52" width="330" height="90"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="495" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-ink)">
      Amérique du Sud
    </text>
    <text x="495" y="94" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">
      (plaque continentale)
    </text>

    <!-- Plaque océanique de Nazca — segment horizontal avant la fosse -->
    <rect x="40" y="84" width="230" height="16"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <text x="155" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--figure-ink)">
      Plaque de Nazca (océanique)
    </text>

    <!-- Panneau plongeant (même plaque, qui continue sous la fosse) -->
    <polygon points="270,84 300,90 555,345 525,362"
             fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>

    <!-- Fosse océanique : la preuve à l'aplomb de la plongée (accent) -->
    <path d="M270,84 L300,138 L330,52"
          fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"/>
    <text x="300" y="158" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--figure-accent)">
      fosse océanique
    </text>

    <!-- Flèches de convergence (contexte mécanique, pas le point culminant) -->
    <line x1="130" y1="65" x2="222" y2="65" stroke="var(--figure-ink)" stroke-width="1.7" stroke-linecap="round"/>
    <polygon points="234,65 220,59 220,71" fill="var(--figure-ink)"/>
    <line x1="600" y1="34" x2="508" y2="34" stroke="var(--figure-ink)" stroke-width="1.7" stroke-linecap="round"/>
    <polygon points="496,34 510,28 510,40" fill="var(--figure-ink)"/>
    <text x="176" y="55" text-anchor="middle" font-size="9" fill="var(--figure-ink-soft)">convergence</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — L'eau relâchée par la plaque qui s'enfonce
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="345" y1="150" x2="345" y2="112" stroke="var(--figure-accent)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="345,102 339,114 351,114" fill="var(--figure-accent)"/>

    <line x1="395" y1="202" x2="395" y2="160" stroke="var(--figure-accent)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="395,150 389,162 401,162" fill="var(--figure-accent)"/>

    <line x1="445" y1="254" x2="445" y2="196" stroke="var(--figure-accent)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="445,186 439,198 451,198" fill="var(--figure-accent)"/>

    <text x="465" y="178" text-anchor="start" font-size="10" font-weight="600" fill="var(--figure-accent)">
      eau libérée
    </text>
    <text x="465" y="191" text-anchor="start" font-size="10" font-weight="600" fill="var(--figure-accent)">
      vers le manteau
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — Fusion partielle (par l'eau), magma, volcan décalé
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <ellipse cx="430" cy="210" rx="32" ry="22"
             fill="var(--figure-accent)" fill-opacity="0.2" stroke="var(--figure-accent)" stroke-width="1.5"/>
    <text x="430" y="214" text-anchor="middle" font-size="8.5" font-weight="600" fill="var(--figure-accent)">
      fusion partielle
    </text>

    <line x1="430" y1="188" x2="430" y2="56" stroke="var(--figure-accent)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="430,46 423,60 437,60" fill="var(--figure-accent)"/>

    <polygon points="410,52 430,26 450,52" fill="var(--figure-accent)" stroke="var(--figure-accent)" stroke-width="1.2"/>
    <text x="456" y="40" text-anchor="start" font-size="10" font-weight="700" fill="var(--figure-accent)">
      volcan
    </text>
    <text x="456" y="52" text-anchor="start" font-size="9" fill="var(--figure-accent)">
      (andésite)
    </text>

    <text x="430" y="240" text-anchor="middle" font-size="8.5" font-style="italic" fill="var(--figure-accent)">
      décalé vers l'intérieur
    </text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — Foyers sismiques : le plan de Wadati-Benioff
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="311" y1="114" x2="502" y2="314"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

    <circle cx="311" cy="114" r="2.8" fill="var(--figure-accent)"/>
    <circle cx="349" cy="154" r="2.8" fill="var(--figure-accent)"/>
    <circle cx="387" cy="194" r="2.8" fill="var(--figure-accent)"/>
    <circle cx="425" cy="234" r="2.8" fill="var(--figure-accent)"/>
    <circle cx="464" cy="274" r="2.8" fill="var(--figure-accent)"/>
    <circle cx="502" cy="314" r="2.8" fill="var(--figure-accent)"/>

    <text x="518" y="308" text-anchor="start" font-size="9.5" font-weight="700" fill="var(--figure-accent)">
      plan de Wadati-Benioff
    </text>
    <text x="518" y="320" text-anchor="start" font-size="8.5" fill="var(--figure-accent)">
      (foyers de plus en plus
    </text>
    <text x="518" y="330" text-anchor="start" font-size="8.5" fill="var(--figure-accent)">
      profonds vers l'intérieur)
    </text>
  </g><!-- /step-4 -->

</svg>
