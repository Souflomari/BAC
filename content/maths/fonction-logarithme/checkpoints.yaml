#                                       "ln x -> -infty en 0" trap misapplied
#                                       here).
#   cp-r4-facteur-oublie (in R4)      — SECOND commit gate, ajouté 2026-09-27
#                                       (wave-1, critique pédagogie I-3),
#                                       placed right AFTER the worked example
