# SEULS sujets vérifiés recensés pour cette notion à ce jour : 2019, 2021,
# 2023 et 2024, tous quatre session normale, filière Sciences Expérimentales,
# tous quatre le « Problème » (4ᵉ composante du sujet NS 22F, après les trois
# exercices) sur leur copie (barème : 11, 9, 11 et 8 points respectivement).
# Aucun autre sujet n'est disponible — introuvable = absent, jamais inventé.
# Raisonnement rédigé à la voix experte de la maison sur 100 % des questions ;
# barème transcrit tel quel dans les énoncés ; conventions KaTeX (block
# scalars pour la prose, KaTeX brut entre apostrophes simples dans
