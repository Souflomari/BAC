      - id: q9
        stem: |-
          **(0,75 pt)** Calculer $\displaystyle\lim_{x \to -\infty} \dfrac{f(x)}{x}$ puis déduire que la courbe $(\mathcal{C}_f)$ admet une branche parabolique de direction la droite d'équation $y = x$ au voisinage de $-\infty$.
        reasoning: |-
          On divise la forme de la question précédente par $x$ (négatif, non nul) et on pose $X=-x$ (qui tend vers $+\infty$) pour se ramener aux limites de référence. Le terme $\dfrac{\ln(-x)}{x}$ devient $-\dfrac{\ln X}{X}\to0$ par croissances comparées (chapitre 5, même limite de référence que dans la leçon, ici appliquée à $X$). Le dernier terme tend aussi vers $0$ : $xe^{-x}=-Xe^X\to-\infty$ (l'exponentielle écrase $X$, hors socle), donc $\dfrac1{xe^{-x}}\to0$ et $\ln\left(1-\dfrac1{xe^{-x}}\right)\to\ln(1)=0$. Il reste $\dfrac{f(x)}{x}\to1$ : c'est la direction de $(\Delta):y=x$. Mais l'écart $f(x)-x=1-\ln(e^x-x)$ tend vers $-\infty$ (question 7) — pas de limite finie, donc pas d'asymptote : c'est une branche parabolique de direction $(\Delta)$.
