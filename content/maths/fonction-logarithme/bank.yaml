            note: "Premier terme de l'identité de 4-a : même taux d'accroissement de ln qu'a la question 1."
          - math: '\dfrac{\ln x-x+1}{2(x-1)^2} = \dfrac12\times\dfrac{1-x+\ln x}{(x-1)^2} \ \xrightarrow[x\to1^+]{} \ \dfrac12\times\left(-\dfrac12\right) = -\dfrac14 \quad (\text{via question 3-c})'
            note: "Second terme : reutilisation directe du résultat de la question 3-c."
          - math: '\lim_{x\to1^+} \dfrac{f(x)-\frac12}{x-1} = -\dfrac14-\dfrac14 = -\dfrac12 \implies f''_d(1) = -\dfrac12'
            note: "Somme des deux limites : f dérivable à droite en 1."
          - math: '(C) \text{ admet en } A\!\left(1,\dfrac12\right) \text{ une demi-tangente à droite de coefficient directeur } -\dfrac12'
