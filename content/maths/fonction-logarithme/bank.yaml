    intro: |-
      **Problème (examen national, session normale 2023, Sciences Expérimentales).**

      On considère la fonction numérique $f$ définie sur $]0,+\infty[$ par $f(x) = 2 - \dfrac{2}{x} + (1 - \ln x)^2$, et $(C_f)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i},\vec{j})$ *(unité : 1 cm)*.

      Deux techniques reviennent tout au long du problème et méritent d'être repérées d'emblée : la substitution $t=\sqrt x$ pour ramener une limite en $x$ à une croissance comparée de référence (R4), et la lecture du signe de $f''$ directement sur les VARIATIONS déjà connues de $f'$ (pas besoin de recalculer $f''$ à chaque fois : $f''=(f')'$).
    questions:
      - id: q1
        part: "Partie 1 — Limites, asymptote et branche parabolique"
        stem: |-
          **(0,25 pt)** Vérifier que pour tout $x \in ]0,+\infty[$ : $f(x) = \dfrac{3x - 2 - 2x\ln x + x(\ln x)^2}{x}$.
        reasoning: |-
          Vérification directe : on développe $(1-\ln x)^2=1-2\ln x+(\ln x)^2$, on ajoute $2-\frac2x$, puis on réduit tout au même dénominateur $x$.
        steps:
          - math: 'f(x) = 2-\dfrac2x+(1-\ln x)^2 = 3-\dfrac2x-2\ln x+(\ln x)^2'
            note: "On developpe le carre : (1-ln x) carre = 1 - 2 ln x + (ln x) carre."
          - math: 'f(x) = \dfrac{3x-2-2x\ln x+x(\ln x)^2}{x}'
            note: "Chaque terme mis sur le denominateur commun x."
      - id: q2
        stem: |-
          **(0,5 pt)** Montrer que $\displaystyle\lim_{x \to 0^+} x(\ln x)^2 = 0$ et que $\displaystyle\lim_{x \to +\infty} \dfrac{(\ln x)^2}{x} = 0$ *(On peut poser : $t = \sqrt{x}$)*.
        reasoning: |-
          Les deux limites se ramènent, via $t=\sqrt x$, aux résultats de référence du cours (R4). En $0^+$ : $x=t^2$, $t\to0^+$, et $\ln x=2\ln t$, donc $x(\ln x)^2=4t^2(\ln t)^2=4(t\ln t)^2$ ; or $t\ln t\to0$ (corollaire des croissances comparées, R4), donc le carré aussi. En $+\infty$ : $t\to+\infty$, $\frac{(\ln x)^2}{x}=\frac{4(\ln t)^2}{t^2}=4\left(\frac{\ln t}{t}\right)^2\to0$ par croissances comparées (R4).
        steps:
          - math: 't=\sqrt{x}\to0^+, \quad x(\ln x)^2 = t^2(2\ln t)^2 = 4(t\ln t)^2 \to 0'
            note: "t ln t tend vers 0 en 0+ (corollaire des croissances comparees, R4)."
          - math: 't=\sqrt{x}\to+\infty, \quad \dfrac{(\ln x)^2}{x} = \dfrac{4(\ln t)^2}{t^2} = 4\left(\dfrac{\ln t}{t}\right)^2 \to 0'
            note: "Croissances comparees en +infini (R4)."
      - id: q3
        stem: |-
          **(0,5 pt)** Déduire que $\displaystyle\lim_{x \to 0^+} f(x) = -\infty$, puis donner une interprétation géométrique du résultat.
        reasoning: |-
          On repart de la forme de la question 1 : $f(x)=\frac{3x-2-2x\ln x+x(\ln x)^2}{x}$. Au numérateur, quand $x\to0^+$ : $3x\to0$, $x\ln x\to0$ (limite de référence, R4) et $x(\ln x)^2\to0$ (question précédente) — il ne reste que le $-2$. Le numérateur tend donc vers $-2$, et le dénominateur $x\to0^+$ : le quotient tend vers $-\infty$. Une limite infinie en une borne finie du domaine signifie que $x=0$ est asymptote verticale à $(C_f)$.
        steps:
          - math: '3x-2-2x\ln x+x(\ln x)^2 \xrightarrow[x\to0^+]{} 0-2-2\times0+0 = -2'
            note: "x ln x tend vers 0 (R4), x (ln x) carre tend vers 0 (question precedente)."
          - math: '\lim_{x\to0^+} f(x) = \lim_{x\to0^+}\dfrac{-2}{x} = -\infty'
            note: "Numerateur vers -2, denominateur vers 0+ : asymptote verticale x=0."
      - id: q4
        stem: |-
          **(0,75 pt)** Calculer $\displaystyle\lim_{x \to +\infty} f(x)$, puis montrer que la courbe $(C_f)$ admet une branche parabolique de direction l'axe des abscisses au voisinage de $+\infty$.
        reasoning: |-
          Pour la limite : $-\frac2x\to0$ et $(1-\ln x)^2\to+\infty$ (car $\ln x\to+\infty$), donc $f(x)\to+\infty$. Pour la branche parabolique de direction l'axe des abscisses, il faut montrer $\frac{f(x)}{x}\to0$ (la courbe monte, mais infiniment plus lentement qu'aucune droite non horizontale). On développe $(1-\ln x)^2/x$ et on reconnaît des croissances comparées : $\frac{(\ln x)^2}{x}\to0$ (question 2) et $\frac{\ln x}{x}\to0$ (R4).
        steps:
          - math: '\lim_{x\to+\infty}\left(2-\dfrac2x\right) = 2, \quad \lim_{x\to+\infty}(1-\ln x)^2 = +\infty \implies \lim_{x\to+\infty} f(x) = +\infty'
            note: "(1-ln x) carre part vers +infini."
          - math: '\dfrac{f(x)}{x} = \dfrac2x-\dfrac{2}{x^2}+\dfrac{(\ln x)^2-2\ln x+1}{x} \xrightarrow[x\to+\infty]{} 0'
            note: "Chaque terme tend vers 0 (croissances comparees, R4, et question 2) : branche parabolique de direction l'axe des abscisses."
      - id: q5
        part: "Partie 2 — Dérivée, variations et concavité"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x \in ]0,+\infty[$ : $f'(x) = \dfrac{2(1 - x + x\ln x)}{x^2}$.
        reasoning: |-
          On dérive $f(x)=2-\frac2x+(1-\ln x)^2$ terme à terme. $-\frac2x$ se dérive en $\frac{2}{x^2}$. Le carré est une composée : $\left((1-\ln x)^2\right)'=2(1-\ln x)\cdot\left(-\frac1x\right)$, en appliquant $(\ln u)'=\frac{u'}{u}$ à l'intérieur $1-\ln x$ (règle du R3, ici combinée à la règle de la composée par un carré). On réduit ensuite au même dénominateur $x^2$.
        steps:
          - math: 'f''(x) = \dfrac{2}{x^2} - 2(1-\ln x)\cdot\dfrac1x = \dfrac{2}{x^2}-\dfrac{2(1-\ln x)}{x}'
            note: "Derivee de -2/x, et du carre (1-ln x) au carre via (ln u)'=u'/u (R3)."
          - math: 'f''(x) = \dfrac{2-2x(1-\ln x)}{x^2} = \dfrac{2-2x+2x\ln x}{x^2} = \dfrac{2(1-x+x\ln x)}{x^2}'
            note: "Reduction au denominateur commun x carre, puis facteur 2."
      - id: q6
        stem: |-
          En exploitant le tableau de variation ci-dessous, de la fonction dérivée $f'$ de $f$ sur $]0,+\infty[$ *(on donne $\beta \approx 4{,}9$)* : $f'$ part de $+\infty$ en $0^+$, décroît jusqu'à $0$ en $x=1$, croît jusqu'à $f'(\beta)$, puis décroît vers $0$ en $+\infty$ — autrement dit $f'(x) \ge 0$ sur $]0,+\infty[$, nul seulement en $x=1$.

          **(0,5 pt)** Prouver que $f$ est strictement croissante sur $]0,+\infty[$ puis dresser le tableau de variations de $f$.
        reasoning: |-
          Le tableau donné dit exactement $f'(x)\ge0$ sur tout le domaine, avec égalité seulement au point isolé $x=1$ : une dérivée positive ou nulle, nulle en un point isolé seulement, suffit pour une stricte croissance. Le tableau de variations de $f$ tient donc en une seule flèche montante, de $\displaystyle\lim_{x\to0^+}f(x)=-\infty$ (question 3) à $\displaystyle\lim_{x\to+\infty}f(x)=+\infty$ (question 4), avec un point de repère utile $f(1)=2-2+(1-0)^2=1$.
        steps:
          - math: 'f''(x)\ge0 \text{ sur } ]0,+\infty[, \text{ nul seulement en } x=1 \implies f \text{ strictement croissante}'
            note: "Derivee positive ou nulle, nulle en un point isole : stricte croissance."
          - math: 'f(1) = 2-2+(1-\ln1)^2 = 1'
            note: "Point de repere. f croit de -infini (en 0+) a +infini, en passant par 1 en x=1."
      - id: q7
        stem: |-
          **(0,5 pt)** Donner le tableau de signe de la dérivée seconde $f''$ de la fonction $f$ sur $]0,+\infty[$.
        reasoning: |-
          Pas besoin de recalculer $f''$ explicitement : $f''=(f')'$, donc le signe de $f''$ est celui de la variation de $f'$, déjà donnée dans le tableau : $f'$ décroît sur $]0,1[$ (donc $f''<0$), croît sur $]1,\beta[$ (donc $f''>0$), décroît sur $]\beta,+\infty[$ (donc $f''<0$), avec $f''(1)=0$ et $f''(\beta)=0$ aux deux points où $f'$ change de sens de variation.
        steps:
          - math: 'f'' \text{ decroissante sur } ]0,1[ \implies f''''(x)<0 \text{ sur } ]0,1['
            note: "Le signe de f'' est celui de la variation de f'."
          - math: 'f'' \text{ croissante sur } ]1,\beta[ \implies f''''(x)>0 \text{ sur } ]1,\beta['
            note: "f' croit : sa derivee f'' est positive."
          - math: 'f'' \text{ decroissante sur } ]\beta,+\infty[ \implies f''''(x)<0 \text{ sur } ]\beta,+\infty[, \quad f''''(1)=f''''(\beta)=0'
            note: "Aux deux points ou f' change de sens (x=1 et x=beta), f'' s'annule."
      - id: q8
        stem: |-
          **(1 pt)** Déduire la concavité de la courbe $(C_f)$ en précisant les abscisses de ses deux points d'inflexion.
        reasoning: |-
          $f''<0$ signifie $(C_f)$ concave, $f''>0$ signifie $(C_f)$ convexe. D'après le tableau de signe précédent : $(C_f)$ est concave sur $]0,1[$, convexe sur $]1,\beta[$, de nouveau concave sur $]\beta,+\infty[$. La concavité change en $x=1$ et en $x=\beta$ : ce sont les abscisses des deux points d'inflexion de $(C_f)$.
        steps:
          - math: '(C_f) \text{ concave sur } ]0,1[, \text{ convexe sur } ]1,\beta[, \text{ concave sur } ]\beta,+\infty['
            note: "Lecture directe du tableau de signe de f'' (question precedente)."
          - math: '\text{Points d''inflexion en } x=1 \text{ et } x=\beta'
            note: "La concavite change exactement la ou f'' s'annule en changeant de signe."
      - id: q9
        part: "Partie 3 — Position de (Δ) par rapport à (C_f), à partir de (C_g)"
