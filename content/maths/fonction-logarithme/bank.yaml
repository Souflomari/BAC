    intro: |-
      **Problème (examen national, session normale 2023, Sciences Expérimentales).**

      On considère la fonction numérique $f$ définie sur $]0,+\infty[$ par $f(x) = 2 - \dfrac{2}{x} + (1 - \ln x)^2$, et $(C_f)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i},\vec{j})$ *(unité : 1 cm)*.

      Deux techniques reviennent tout au long du problème et méritent d'être repérées d'emblée : la substitution $t=\sqrt x$ pour ramener une limite en $x$ à une croissance comparée de référence (chapitre 5), et la lecture du signe de $f''$ directement sur les VARIATIONS déjà connues de $f'$ (pas besoin de recalculer $f''$ à chaque fois : $f''=(f')'$).
    questions:
      - id: q1
        part: "Partie 1 — Limites, asymptote et branche parabolique"
        stem: |-
          **(0,25 pt)** Vérifier que pour tout $x \in ]0,+\infty[$ : $f(x) = \dfrac{3x - 2 - 2x\ln x + x(\ln x)^2}{x}$.
        reasoning: |-
          Vérification directe : on développe $(1-\ln x)^2=1-2\ln x+(\ln x)^2$, on ajoute $2-\frac2x$, puis on réduit tout au même dénominateur $x$.
        steps:
          - math: 'f(x) = 2-\dfrac2x+(1-\ln x)^2 = 3-\dfrac2x-2\ln x+(\ln x)^2'
            note: "On developpe le carré : (1-ln x) carré = 1 - 2 ln x + (ln x) carré."
          - math: 'f(x) = \dfrac{3x-2-2x\ln x+x(\ln x)^2}{x}'
            note: "Chaque terme mis sur le dénominateur commun x."
      - id: q2
        stem: |-
          **(0,5 pt)** Montrer que $\displaystyle\lim_{x \to 0^+} x(\ln x)^2 = 0$ et que $\displaystyle\lim_{x \to +\infty} \dfrac{(\ln x)^2}{x} = 0$ *(On peut poser : $t = \sqrt{x}$)*.
        reasoning: |-
          Les deux limites se ramènent, via $t=\sqrt x$, aux résultats de référence du cours (chapitre 5). En $0^+$ : $x=t^2$, $t\to0^+$, et $\ln x=2\ln t$, donc $x(\ln x)^2=4t^2(\ln t)^2=4(t\ln t)^2$ ; or $t\ln t\to0$ (corollaire des croissances comparées, chapitre 5), donc le carré aussi. En $+\infty$ : $t\to+\infty$, $\frac{(\ln x)^2}{x}=\frac{4(\ln t)^2}{t^2}=4\left(\frac{\ln t}{t}\right)^2\to0$ par croissances comparées (chapitre 5).
        steps:
          - math: 't=\sqrt{x}\to0^+, \quad x(\ln x)^2 = t^2(2\ln t)^2 = 4(t\ln t)^2 \to 0'
            note: "t ln t tend vers 0 en 0+ (corollaire des croissances comparees, chapitre 5)."
          - math: 't=\sqrt{x}\to+\infty, \quad \dfrac{(\ln x)^2}{x} = \dfrac{4(\ln t)^2}{t^2} = 4\left(\dfrac{\ln t}{t}\right)^2 \to 0'
            note: "Croissances comparees en +infini (chapitre 5)."
      - id: q3
        stem: |-
          **(0,5 pt)** Déduire que $\displaystyle\lim_{x \to 0^+} f(x) = -\infty$, puis donner une interprétation géométrique du résultat.
        reasoning: |-
          On repart de la forme de la question 1 : $f(x)=\frac{3x-2-2x\ln x+x(\ln x)^2}{x}$. Au numérateur, quand $x\to0^+$ : $3x\to0$, $x\ln x\to0$ (limite de référence, chapitre 5) et $x(\ln x)^2\to0$ (question précédente) — il ne reste que le $-2$. Le numérateur tend donc vers $-2$, et le dénominateur $x\to0^+$ : le quotient tend vers $-\infty$. Une limite infinie en une borne finie du domaine signifie que $x=0$ est asymptote verticale à $(C_f)$.
        steps:
          - math: '3x-2-2x\ln x+x(\ln x)^2 \xrightarrow[x\to0^+]{} 0-2-2\times0+0 = -2'
            note: "x ln x tend vers 0 (chapitre 5), x (ln x) carré tend vers 0 (question précédente)."
          - math: '\lim_{x\to0^+} f(x) = \lim_{x\to0^+}\dfrac{-2}{x} = -\infty'
            note: "Numérateur vers -2, dénominateur vers 0+ : asymptote verticale x=0."
      - id: q4
        stem: |-
          **(0,75 pt)** Calculer $\displaystyle\lim_{x \to +\infty} f(x)$, puis montrer que la courbe $(C_f)$ admet une branche parabolique de direction l'axe des abscisses au voisinage de $+\infty$.
        reasoning: |-
          Pour la limite : $-\frac2x\to0$ et $(1-\ln x)^2\to+\infty$ (car $\ln x\to+\infty$), donc $f(x)\to+\infty$. Pour la branche parabolique de direction l'axe des abscisses, il faut montrer $\frac{f(x)}{x}\to0$ (la courbe monte, mais infiniment plus lentement qu'aucune droite non horizontale). On développe $(1-\ln x)^2/x$ et on reconnaît des croissances comparées : $\frac{(\ln x)^2}{x}\to0$ (question 2) et $\frac{\ln x}{x}\to0$ (chapitre 5).
        steps:
          - math: '\lim_{x\to+\infty}\left(2-\dfrac2x\right) = 2, \quad \lim_{x\to+\infty}(1-\ln x)^2 = +\infty \implies \lim_{x\to+\infty} f(x) = +\infty'
            note: "(1-ln x) carré part vers +infini."
          - math: '\dfrac{f(x)}{x} = \dfrac2x-\dfrac{2}{x^2}+\dfrac{(\ln x)^2-2\ln x+1}{x} \xrightarrow[x\to+\infty]{} 0'
            note: "Chaque terme tend vers 0 (croissances comparees, chapitre 5, et question 2) : branche parabolique de direction l'axe des abscisses."
