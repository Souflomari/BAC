          - math: 'g(0) = 0+\dfrac{0}{1}-2\ln(1) = 0'
            note: "Valeur de g en 0, nécessaire avant d'intégrer."
          - math: '\int_0^x g''(t)\,dt = g(x)-g(0) = g(x), \qquad \int_0^x t^2\,dt = \dfrac{x^3}{3}'
            note: "Intégration de chaque membre de l'encadrement de la question 2-b, entre 0 et x."
          - math: '\forall x \in I\ ;\quad 0 \le g(x) \le \dfrac{x^3}{3}'
            note: "Intégration de l'encadrement 0 <= g'(t) <= t carré, bornes dans l'ordre 0 <= x."
      - id: q4d
        stem: |-
          **2- d)** (0,25 pt) Déterminer le sens de variation de $f$ sur $I$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Assembler deux résultats déjà établis : l'expression de $f'$ en fonction de $g$ (question 2-a) et le signe de $g$ (question 2-c).

          **Le signe de $g$.** La question 2-c donne $g(x)\ge0$ pour tout $x\in I$ ; en fait $g$ y est strictement positive dès que $x>0$, puisque $g'(x)=\left(\dfrac{x}{x+1}\right)^2>0$ pour $x>0$ (question 2-b) rend $g$ strictement croissante sur $]0,+\infty[$ à partir de $g(0)=0$.

          **Le signe de $f'$.** Pour $x>0$ : $f'(x) = -\dfrac{g(x)}{x^3}$ (question 2-a), avec $x^3>0$ et $g(x)>0$ : donc $f'(x)<0$ strictement, pour tout $x>0$.

          **Conclusion.**

          $$\boxed{f \text{ est strictement décroissante sur } ]0,+\infty[}$$

          et, par continuité à droite en $0$ (établie en 1-a), $f$ est strictement décroissante sur $I=[0,+\infty[$ tout entier.

          **Le piège nommé de cette question.** Conclure seulement « $f'\le0$ » sans vérifier si l'inégalité est stricte partout : $g(x)>0$ pour $x>0$ (pas seulement $\ge0$) donne une décroissance strictement, sans aucun palier — un détail qui compte pour le tableau de variations de la question suivante.
        steps:
          - math: 'g''(x) = \left(\dfrac{x}{x+1}\right)^2 > 0 \text{ pour } x>0, \ g(0)=0 \implies g(x)>0 \text{ pour } x>0'
            note: "g strictement croissante à partir de 0 : elle est strictement positive au-dela."
          - math: 'x>0 \implies f''(x) = -\dfrac{g(x)}{x^3} < 0 \quad (g(x)>0, \ x^3>0)'
            note: "Report du signe de g dans l'expression de f' de la question 2-a."
          - math: 'f \text{ strictement décroissante sur } ]0,+\infty[, \text{ donc sur } I \text{ (continuité à droite en 0, question 1-a)}'
            note: "Extension a I tout entier grâce a la continuité déjà établie."
      - id: q5a
