          **(0,5 pt)** À partir de la courbe $(C_g)$, déterminer le signe de la fonction $g$ sur $]0,+\infty[$.
        reasoning: |-
          On lit directement le signe sur la description de $(C_g)$ : elle est sous l'axe des abscisses (négative) avant $\alpha$, au-dessus (positive) entre $\alpha$ et $1$, de nouveau en dessous après $1$.
