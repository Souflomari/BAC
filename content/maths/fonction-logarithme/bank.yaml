            note: "Borne supérieure, par passage a la limite dans l'encadrement déjà établi."
          - math: '(S_n) \text{ croissante} \implies \ell \ge S_n \ \forall n, \text{ en particulier } \ell \ge S_1 \quad (\text{question 2-a})'
            note: "Une suite croissante est majorée par sa limite en chaque terme."
          - math: 'S_1 = \Delta_0 = f(0)-\int_0^1 f(t)\,dt = \dfrac12-(2\ln2-1) = \dfrac32-2\ln2 \quad (\text{Partie D, question 2-b})'
            note: "Calcul explicite du premier terme, seul terme calculable a ce stade."
          - math: '\boxed{\dfrac32-2\ln2 \le \ell \le \dfrac12}'
            note: "Rassemblement des deux bornes."
