      - id: q10a
        part: "Partie E — 1. Encadrement de Delta_k, puis de la somme S_n"
        stem: |-
          **1- a)** (0,25 pt) On pose : pour tout $k$ de $\mathbb{N}$, $\Delta_k = f(k) - \displaystyle\int_k^{k+1} f(t)\,dt$, et pour tout $n$ de $\mathbb{N}^{*}$, $S_n = \displaystyle\sum_{k=0}^{n-1} \Delta_k$. Vérifier que : $\left(\forall k \in \mathbb{N}\right)\ ;\quad 0 \le \Delta_k \le f(k) - f(k+1)$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $\Delta_k$ compare la valeur $f(k)$ à la moyenne de $f$ sur $[k,k+1]$ (l'intégrale sur un intervalle de longueur $1$ EST cette moyenne). Le levier naturel est la décroissance de $f$ (Partie B, question 2-d, chapitre « Dérivabilité et étude des fonctions ») : sur $[k,k+1]$, $f$ varie entre ses deux valeurs extrêmes $f(k+1)$ et $f(k)$, ce qui encadre directement l'intégrale.

          **L'encadrement de $f$ sur $[k,k+1]$.** $f$ strictement décroissante sur $I$ : pour tout $t\in[k,k+1]$, $t\ge k \Rightarrow f(t)\le f(k)$, et $t\le k+1 \Rightarrow f(t)\ge f(k+1)$. Donc :

          $$\forall t\in[k,k+1]\ ;\quad f(k+1) \le f(t) \le f(k)$$

          **On intègre sur $[k,k+1]$**, intervalle de longueur $1$ : intégrer une constante sur un intervalle de longueur $1$ redonne cette constante.

          $$f(k+1) \le \int_k^{k+1} f(t)\,dt \le f(k)$$

          **On soustrait chaque membre à $f(k)$**, ce qui inverse le sens des inégalités (chapitre « Calcul intégral », hors socle de cette leçon, pour l'usage de l'intégrale comme moyenne) :

          $$f(k) - f(k) \le f(k) - \int_k^{k+1} f(t)\,dt \le f(k) - f(k+1)$$

          c'est-à-dire, avec $\Delta_k = f(k) - \displaystyle\int_k^{k+1} f(t)\,dt$ :

          $$\boxed{\forall k \in \mathbb{N}\ ;\quad 0 \le \Delta_k \le f(k)-f(k+1)}$$

          **Le piège nommé de cette question.** Encadrer $\displaystyle\int_k^{k+1} f(t)\,dt$ sans vérifier que l'intervalle a bien pour longueur $1$ : c'est cette longueur précise qui permet à l'intégrale d'une constante $f(k)$ (ou $f(k+1)$) sur $[k,k+1]$ de redonner exactement cette même constante, sans facteur multiplicatif.
        steps:
          - math: 'f \text{ décroissante sur } I \implies \forall t\in[k,k+1]\ ;\quad f(k+1) \le f(t) \le f(k)'
            note: "Encadrement de f sur l'intervalle, par décroissance."
          - math: 'f(k+1) \le \int_k^{k+1} f(t)\,dt \le f(k) \quad (\text{intervalle de longueur 1})'
            note: "Intégration de l'encadrement sur un intervalle de longueur 1."
          - math: '0 \le f(k)-\int_k^{k+1}f(t)\,dt \le f(k)-f(k+1) \implies \boxed{0 \le \Delta_k \le f(k)-f(k+1)}'
            note: "Soustraction a f(k), qui inverse le sens des inégalités."
      - id: q10b
        stem: |-
          **1- b)** (0,5 pt) En déduire que : $\left(\forall n \in \mathbb{N}^{*}\right)\ ;\quad 0 \le S_n \le \dfrac{1}{2}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Sommer l'encadrement de $\Delta_k$ (question 1-a) pour $k$ allant de $0$ à $n-1$. La borne de droite $f(k)-f(k+1)$ est le signal d'une somme télescopique (chapitre « Suites numériques », hors socle de cette leçon) : la plupart des termes s'annulent deux à deux.

          **La borne inférieure.** Chaque $\Delta_k \ge 0$ (question 1-a) : une somme de termes positifs ou nuls est positive ou nulle.

          $$S_n = \sum_{k=0}^{n-1} \Delta_k \ge 0$$

          **La borne supérieure, par télescopage.** On somme l'inégalité $\Delta_k \le f(k)-f(k+1)$ pour $k=0,\dots,n-1$ :

          $$S_n \le \sum_{k=0}^{n-1} \bigl(f(k)-f(k+1)\bigr) = f(0)-f(n)$$

          (chaque $f(k)$ intermédiaire, $k=1,\dots,n-1$, apparaît une fois avec $+$ et une fois avec $-$ : seuls le premier et le dernier terme survivent).

          **On majore $f(0)-f(n)$.** $f$ est positive sur $I$ (décroissante de $\dfrac12$ vers $0$, sans jamais devenir négative — Partie B, question 3-a), donc $f(n)\ge0$, d'où $f(0)-f(n) \le f(0) = \dfrac12$.

          $$S_n \le \frac12$$

          **Conclusion.**

          $$\boxed{\forall n \in \mathbb{N}^{*}\ ;\quad 0 \le S_n \le \frac12}$$

          **Le piège nommé de cette question.** Sommer terme à terme sans repérer le télescopage, et essayer de majorer chaque $f(k)-f(k+1)$ séparément : la somme de $n$ écarts individuels se réduit à deux termes seulement une fois le télescopage repéré — le rater rend la question bien plus longue qu'elle ne devrait l'être pour $0{,}5$ point.
        steps:
          - math: 'S_n = \sum_{k=0}^{n-1} \Delta_k \ge 0 \quad (\text{somme de termes positifs ou nuls, question 1-a})'
            note: "Borne inférieure : chaque terme de la somme est positif ou nul."
          - math: 'S_n \le \sum_{k=0}^{n-1}\bigl(f(k)-f(k+1)\bigr) = f(0)-f(n) \quad (\text{telescopage})'
            note: "Somme de l'encadrement, les termes intermédiaires s'annulent deux a deux."
          - math: 'f(n) \ge 0 \implies f(0)-f(n) \le f(0) = \dfrac12 \implies \boxed{0 \le S_n \le \dfrac12}'
            note: "f reste positive, donc l'écart télescope est majore par f(0)."
      - id: q11a
        part: "Partie E — 2. Monotonie, convergence et encadrement de la limite de (S_n)"
        stem: |-
          **2- a)** (0,25 pt) Montrer que la suite $(S_n)_{n \in \mathbb{N}^{*}}$ est monotone.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Étudier le signe de $S_{n+1}-S_n$ : c'est la définition même de la monotonie d'une suite (chapitre « Suites numériques »).

          **La différence.** $S_{n+1} = \displaystyle\sum_{k=0}^{n} \Delta_k = \displaystyle\sum_{k=0}^{n-1}\Delta_k + \Delta_n = S_n+\Delta_n$, donc :

          $$S_{n+1}-S_n = \Delta_n$$

          **Le signe de $\Delta_n$.** La question 1-a donne $\Delta_n \ge 0$ pour tout $n\in\mathbb{N}$, en particulier pour $n\ge1$.

          **Conclusion.**

          $$\boxed{S_{n+1}-S_n = \Delta_n \ge 0 \implies (S_n)_{n\in\mathbb{N}^{*}} \text{ est croissante}}$$

          — donc monotone.

          **Le piège nommé de cette question.** Recalculer $\Delta_n$ ou $S_n$ depuis la définition plutôt que de reconnaître que $S_{n+1}-S_n$ est simplement le dernier terme ajouté — un réflexe d'écriture de somme (indice de sommation qui change de borne) plus qu'un nouveau calcul.
        steps:
          - math: 'S_{n+1} = \sum_{k=0}^{n}\Delta_k = S_n+\Delta_n \implies S_{n+1}-S_n = \Delta_n'
            note: "Le terme ajoute en passant de S_n a S_(n+1)."
          - math: '\Delta_n \ge 0 \quad (\text{question 1-a}) \implies S_{n+1}-S_n \ge 0'
            note: "Signe de l'écart, déjà établi."
          - math: '\boxed{(S_n)_{n\in\mathbb{N}^{*}} \text{ est croissante}}'
            note: "Conclusion : suite monotone (croissante)."
      - id: q11b
        stem: |-
          **2- b)** (0,25 pt) En déduire que la suite $(S_n)_{n \in \mathbb{N}^{*}}$ est convergente.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le théorème de la limite monotone (chapitre « Suites numériques ») : une suite croissante et majorée converge. Les deux ingrédients viennent d'être établis séparément.

          **Croissante.** $(S_n)$ est croissante (question 2-a).

          **Majorée.** $S_n \le \dfrac12$ pour tout $n$ (question 1-b) : $(S_n)$ est majorée par $\dfrac12$.

          **Le théorème de la limite monotone.** Une suite croissante et majorée converge vers une limite finie $\ell$, avec $\ell \le \dfrac12$ (la limite d'une suite majorée reste inférieure ou égale au majorant).

          $$\boxed{(S_n)_{n\in\mathbb{N}^{*}} \text{ converge}}$$

          **Le piège nommé de cette question.** Invoquer seulement la croissance, sans la majoration : une suite croissante mais NON majorée diverge vers $+\infty$ — les deux hypothèses sont nécessaires ensemble, jamais l'une sans l'autre.
        steps:
          - math: '(S_n) \text{ croissante} \quad (\text{question 2-a})'
            note: "Première hypothèse du théorème de la limite monotone."
          - math: '\forall n\ ;\quad S_n \le \dfrac12 \quad (\text{question 1-b})'
            note: "Deuxième hypothèse : suite majorée."
          - math: '\boxed{(S_n)_{n\in\mathbb{N}^{*}} \text{ converge, vers une limite } \ell \le \dfrac12} \quad (\text{limite monotone})'
            note: "Croissante et majorée : convergence garantie par le théorème de la limite monotone."
      - id: q11c
        stem: |-
          **2- c)** (0,25 pt) Montrer que la limite $\ell$ de la suite $(S_n)_{n \in \mathbb{N}^{*}}$ vérifie : $\dfrac{3}{2} - 2\ln 2 \le \ell \le \dfrac{1}{2}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux bornes à établir séparément. La borne supérieure est déjà acquise ; la borne inférieure demande un argument propre à une suite croissante : sa limite majore chacun de ses termes.

          **La borne supérieure, immédiate.** $S_n \le \dfrac12$ pour tout $n$ (question 1-b) ; en passant à la limite (qui conserve les inégalités larges), $\ell \le \dfrac12$.

          **La borne inférieure, via la croissance.** $(S_n)$ est croissante (question 2-a) : sa limite $\ell$ majore chacun de ses termes, en particulier $\ell \ge S_1$.

          **Le calcul de $S_1$.** $S_1 = \displaystyle\sum_{k=0}^{0}\Delta_k = \Delta_0 = f(0) - \displaystyle\int_0^1 f(t)\,dt$. Or $f(0)=\dfrac12$ et $\displaystyle\int_0^1 f(t)\,dt = 2\ln2-1$ (Partie D, question 2-b, chapitre « Calcul intégral ») :

          $$S_1 = \frac12-(2\ln2-1) = \frac12-2\ln2+1 = \frac32-2\ln2$$

          **Conclusion.**

          $$\boxed{\frac32-2\ln2 \le \ell \le \frac12}$$

          **Le contrôle qui rassure.** Numériquement, $\dfrac32-2\ln2 \approx 1{,}5-1{,}386 = 0{,}114$ : l'encadrement $0{,}114 \le \ell \le 0{,}5$ est cohérent, et sa borne inférieure est exactement $S_1$ — l'encadrement n'est pas approximatif, il est optimal au premier rang de la suite.

          **Le piège nommé de cette question.** Chercher $\ell \ge S_n$ pour un $n$ arbitraire, ou tenter de calculer $\ell$ exactement : la question ne demande qu'un encadrement, obtenu en choisissant le premier terme utile de la suite croissante ($S_1$, le seul dont la valeur est calculable explicitement à ce stade).
        steps:
