            note: "On factorise par -x, strictement positif pour x négatif ; e^x/x = 1/(x e^-x)."
          - math: '\ln(e^x-x) = \ln(-x) + \ln\left(1-\dfrac{1}{xe^{-x}}\right) \quad (\text{propriété du produit, chapitre 3})'
            note: "Les deux facteurs -x et 1-1/(x e^-x) sont strictement positifs pour x<0."
