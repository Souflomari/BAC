          **2- b)** (0,5 pt) Calculer $\displaystyle\lim_{x \to 0^{+}} F(x)$, puis en déduire que : $\displaystyle\int_0^{1} f(t)\,dt = 2\ln 2 - 1$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Faire tendre $x\to0^+$ dans l'expression explicite de $F$ trouvée en 2-a, puis relier cette limite à $\displaystyle\int_0^1 f$ via la continuité de $F$.

          **Le seul terme à étudier.** $2\ln2$ est constant ; il reste à calculer $\displaystyle\lim_{x\to0^+}\left(1+\frac1x\right)\ln(1+x)$.

          **On développe.** $\left(1+\dfrac1x\right)\ln(1+x) = \ln(1+x) + \dfrac{\ln(1+x)}{x}$.

          **Les deux limites connues.** $\ln(1+x)\to\ln1=0$ quand $x\to0^+$ (continuité de $\ln$). Et $\dfrac{\ln(1+x)}{x}\to1$ quand $x\to0^+$ : c'est le taux d'accroissement de $\ln$ en $1$, appliqué en $1+x\to1$ (chapitre « Limites et continuité », hors socle de cette leçon).

          **La somme.**

          $$\lim_{x\to0^+}\left(1+\frac1x\right)\ln(1+x) = 0+1 = 1$$

          **La limite de $F$.**

          $$\boxed{\lim_{x\to0^+} F(x) = 2\ln2-1}$$

          **Le pont vers $\displaystyle\int_0^1 f$.** $f$ est continue sur $I$ (Partie B), donc $F(x)=\displaystyle\int_x^1 f(t)\,dt$ est elle-même continue sur $I$ tout entier, y compris en $0$ (question 1 de cette partie, $F$ y est même dérivable). Donc $\displaystyle\lim_{x\to0^+}F(x) = F(0)$. Or, par définition, $F(0) = \displaystyle\int_0^1 f(t)\,dt$.

          $$\boxed{\int_0^1 f(t)\,dt = 2\ln2-1}$$

          **Le piège nommé de cette question.** Calculer la limite de $F(x)$ sans jamais relier explicitement cette limite à $F(0)$ par continuité : le lien n'est pas automatique, il repose sur la continuité de $F$ en $0$, établie à la question 1 de cette partie.
        steps:
