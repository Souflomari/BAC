      - id: q6
        part: "Partie C — 1. Existence et unicité d'un point fixe alpha"
        stem: |-
          **1)** (0,5 pt) Montrer qu'il existe un unique réel $\alpha \in\, ]0\,;1[$ tel que $f(\alpha) = \alpha$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « Il existe un unique » : deux affirmations distinctes, deux outils distincts. L'existence vient du théorème des valeurs intermédiaires (chapitre « Dérivabilité et étude des fonctions », hors socle de cette leçon), l'unicité de la stricte monotonie. Ni l'un ni l'autre ne suffit seul.

          **On introduit une fonction auxiliaire.** Pose $h(x) = f(x)-x$ sur $[0,1]$ : résoudre $f(x)=x$ revient à résoudre $h(x)=0$.

          **La continuité de $h$.** $f$ est continue sur $I$ (Partie B, questions 1-a et 2-a), $x\mapsto x$ est continue partout : $h$, différence de deux fonctions continues, est continue sur $[0,1]$.

          **Les valeurs aux bornes.** $h(0) = f(0)-0 = \dfrac12 > 0$. $h(1) = f(1)-1 = \bigl(1-\ln2\bigr)-1 = -\ln2 < 0$ (car $\ln2>0$). $h$ change strictement de signe entre $0$ et $1$.

          **L'existence, par le TVI.** $h$ continue sur $[0,1]$, avec $h(0)>0$ et $h(1)<0$ : par le théorème des valeurs intermédiaires, il existe au moins un $\alpha\in\,]0,1[$ tel que $h(\alpha)=0$, c'est-à-dire $f(\alpha)=\alpha$.

          **L'unicité, par la stricte monotonie.** $h(x) = f(x)-x$ : $f$ est strictement décroissante sur $I$ (Partie B, question 2-d) et $x\mapsto -x$ l'est aussi, donc $h$, somme de deux fonctions strictement décroissantes, est strictement décroissante sur $[0,1]$. Une fonction strictement monotone est injective : elle ne peut s'annuler qu'en un seul point.

          **Conclusion.**

          $$\boxed{\exists! \, \alpha \in\, ]0,1[\ ;\quad f(\alpha) = \alpha}$$

          **Le piège nommé de cette question.** N'invoquer que le TVI (donne l'existence, pas l'unicité) ou que la monotonie (donne l'unicité seulement si l'existence est déjà acquise) : les deux arguments sont nécessaires et doivent apparaître explicitement, chacun avec ses propres hypothèses vérifiées.
        steps:
          - math: 'h(x) = f(x)-x, \qquad h \text{ continue sur } [0,1] \quad (\text{f continue, Partie B})'
            note: "Fonction auxiliaire et continuité, première hypothèse du TVI."
          - math: 'h(0) = \dfrac12 > 0, \qquad h(1) = (1-\ln2)-1 = -\ln2 < 0'
            note: "Changement de signe entre les deux bornes."
          - math: '\exists\, \alpha\in\,]0,1[\ ;\quad h(\alpha)=0 \quad (\text{TVI})'
            note: "Existence par le théorème des valeurs intermédiaires."
          - math: 'h \text{ strictement décroissante sur } [0,1] \implies \alpha \text{ unique}'
            note: "Unicité par stricte monotonie (f décroissante, Partie B question 2-d)."
      - id: q7a
        part: "Partie C — 2. La suite u0=1/3, u(n+1)=f(un), convergence vers alpha"
        stem: |-
          **2- a)** (0,5 pt) Montrer que : $\left(\forall n \in \mathbb{N}\right)\ ;\quad u_n \in [0\,;1]$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une récurrence, avec un ingrédient clé : $f$ envoie $[0,1]$ dans lui-même — la stabilité de l'intervalle, condition nécessaire pour que la suite $u_{n+1}=f(u_n)$ y reste indéfiniment (chapitre « Suites numériques », hors socle de cette leçon).

          **La stabilité de $[0,1]$ par $f$.** $f$ est strictement décroissante sur $I$ (Partie B, question 2-d), donc sur $[0,1]$ en particulier : l'image de l'intervalle $[0,1]$ par $f$ est $[f(1),f(0)] = [1-\ln2\,;\,\tfrac12]$ (les bornes s'échangent parce que $f$ décroît). Or $1-\ln2 \approx 0{,}307 \ge 0$ et $\tfrac12 \le 1$ : donc $[1-\ln2\,;\,\tfrac12] \subset [0,1]$, c'est-à-dire $f([0,1]) \subset [0,1]$.

          **L'initialisation.** $u_0 = \dfrac13 \in [0,1]$ : vraie.

          **L'hérédité.** Supposons $u_n \in [0,1]$. Comme $f([0,1])\subset[0,1]$, $u_{n+1}=f(u_n) \in [0,1]$.

          **Conclusion, par récurrence.**

          $$\boxed{\forall n \in \mathbb{N}\ ;\quad u_n \in [0,1]}$$

          **Le piège nommé de cette question.** Vérifier la stabilité de $[0,1]$ seulement « aux bornes » sans justifier que $f$ y est monotone : c'est précisément parce que $f$ est décroissante que l'image de l'intervalle est encadrée par $f(1)$ et $f(0)$ (dans cet ordre inversé) — sur une fonction croissante le raisonnement serait le même mais sans inverser les bornes.
        steps:
          - math: 'f \text{ décroissante sur } [0,1] \implies f([0,1]) = [f(1)\,;\,f(0)] = [1-\ln2\,;\,\tfrac12]'
            note: "Image de l'intervalle par une fonction décroissante : les bornes s'échangent."
          - math: '1-\ln2 \approx 0{,}307 \ge 0, \qquad \tfrac12 \le 1 \implies f([0,1]) \subset [0,1]'
            note: "Stabilité de l'intervalle [0,1] par f."
          - math: 'u_0 = \dfrac13 \in [0,1] \quad (\text{initialisation})'
            note: "Premier terme de la suite, dans l'intervalle."
          - math: 'u_n \in [0,1] \implies u_{n+1} = f(u_n) \in [0,1] \quad (\text{hérédité, par stabilité})'
            note: "Récurrence : l'image par f reste dans l'intervalle stable."
      - id: q7b
        stem: |-
          **2- b)** (0,5 pt) Montrer que : $\left(\forall n \in \mathbb{N}\right)\ ;\quad |u_{n+1} - \alpha| \le \dfrac{1}{3}|u_n - \alpha|$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une majoration de $|f(u_n)-f(\alpha)|$ (puisque $f(\alpha)=\alpha$, question 1) par un multiple de $|u_n-\alpha|$ : c'est exactement la situation où le théorème des accroissements finis (chapitre « Dérivabilité et étude des fonctions », hors socle de cette leçon) s'applique, à condition de disposer d'abord d'une borne sur $|f'|$ — c'est le rôle de la Partie B, question 2-c, déjà établie.

          **La borne sur $|f'|$, tirée de la Partie B.** Pour $x\in\,]0,1]$, $f'(x)=-\dfrac{g(x)}{x^3}$ (Partie B, question 2-a) avec $0\le g(x)\le\dfrac{x^3}{3}$ (Partie B, question 2-c), donc $|f'(x)| = \dfrac{g(x)}{x^3} \le \dfrac{x^3/3}{x^3} = \dfrac13$. En $x=0$, $f'_d(0)=-\dfrac13$ (Partie B, question 1-b), donc $|f'_d(0)|=\dfrac13$ également. Sur $[0,1]$ tout entier :

          $$|f'(x)| \le \frac13$$

          **Le théorème des accroissements finis, appliqué entre $u_n$ et $\alpha$.** $u_n$ et $\alpha$ sont tous deux dans $[0,1]$ (question 1 de cette partie, et $\alpha\in\,]0,1[$), et $f$ y est continue et dérivable : il existe $c$ entre $u_n$ et $\alpha$ tel que

          $$f(u_n)-f(\alpha) = f'(c)\,(u_n-\alpha)$$

          **On passe à la valeur absolue.** Comme $u_{n+1}=f(u_n)$ et $f(\alpha)=\alpha$ :

          $$|u_{n+1}-\alpha| = |f'(c)|\cdot|u_n-\alpha|$$

          Or $c\in[0,1]$ (entre deux points de $[0,1]$), donc $|f'(c)|\le\dfrac13$ :

          $$\boxed{\forall n\in\mathbb{N}\ ;\quad |u_{n+1}-\alpha| \le \frac13|u_n-\alpha|}$$

          **Le piège nommé de cette question.** Oublier de vérifier que $c$ appartient bien à $[0,1]$ (pas seulement « quelque part ») avant d'appliquer la borne $\dfrac13$ trouvée sur cet intervalle précis — la borne sur $|f'|$ n'a été établie que sur $[0,1]$, pas sur $I$ tout entier.
        steps:
          - math: 'x\in\,]0,1]\ ;\quad |f''(x)| = \dfrac{g(x)}{x^3} \le \dfrac{x^3/3}{x^3} = \dfrac13 \quad (\text{Partie B, question 2-c}), \qquad |f''_d(0)| = \dfrac13'
            note: "Borne sur f prime en valeur absolue, tirée de l'encadrement de g établi en Partie B."
          - math: '\exists\, c \text{ entre } u_n \text{ et } \alpha, \text{ tous deux dans } [0,1]\ ;\quad f(u_n)-f(\alpha) = f''(c)(u_n-\alpha) \quad (\text{TAF})'
            note: "Théorème des accroissements finis entre u_n et alpha."
          - math: '|u_{n+1}-\alpha| = |f''(c)|\cdot|u_n-\alpha| \le \dfrac13|u_n-\alpha|'
            note: "Passage a la valeur absolue et report de la borne 1/3."
      - id: q7c
        stem: |-
          **2- c)** (0,5 pt) Montrer par récurrence que : $\left(\forall n \in \mathbb{N}\right)\ ;\quad |u_n - \alpha| \le \left(\dfrac{1}{3}\right)^{n}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une récurrence classique, dont l'hérédité est exactement la question 2-b appliquée au bon rang.

          **L'initialisation, $n=0$.** $\left(\dfrac13\right)^0 = 1$. $u_0=\dfrac13$ et $\alpha\in\,]0,1[$ sont tous deux dans $[0,1]$, donc leur écart est au plus la longueur de l'intervalle : $|u_0-\alpha| \le 1$. L'inégalité $|u_0-\alpha|\le\left(\dfrac13\right)^0$ tient.

          **L'hérédité.** Supposons $|u_n-\alpha| \le \left(\dfrac13\right)^n$ pour un $n$ donné. La question 2-b donne :

          $$|u_{n+1}-\alpha| \le \frac13|u_n-\alpha|$$

          En reportant l'hypothèse de récurrence :

          $$|u_{n+1}-\alpha| \le \frac13\left(\frac13\right)^n = \left(\frac13\right)^{n+1}$$

          **Conclusion, par récurrence.**

          $$\boxed{\forall n\in\mathbb{N}\ ;\quad |u_n-\alpha| \le \left(\frac13\right)^{n}}$$

          **Le piège nommé de cette question.** Chercher à retrouver un facteur $|u_0-\alpha|$ devant $\left(\dfrac13\right)^n$, par habitude d'autres suites du même type : ici l'initialisation tient sans lui, parce que $u_0$ et $\alpha$ sont tous deux dans $[0,1]$, ce qui borne directement leur écart par $1=\left(\dfrac13\right)^0$ — ajouter un facteur non demandé changerait, à tort, la forme de la conclusion.
        steps:
          - math: '\left(\dfrac13\right)^0 = 1, \quad u_0=\dfrac13 \in [0,1], \ \alpha\in\,]0,1[ \implies |u_0-\alpha|\le 1 \quad (\text{initialisation})'
            note: "Les deux termes sont dans [0,1], leur écart est au plus 1."
          - math: '|u_n-\alpha|\le\left(\dfrac13\right)^n \implies |u_{n+1}-\alpha| \le \dfrac13|u_n-\alpha| \le \dfrac13\left(\dfrac13\right)^n = \left(\dfrac13\right)^{n+1}'
            note: "Hérédité : on reporte l'hypothèse de récurrence dans l'inégalité de la question 2-b."
          - math: '\forall n\in\mathbb{N}\ ;\quad |u_n-\alpha| \le \left(\dfrac13\right)^{n}'
            note: "Conclusion par recurrence."
      - id: q7d
        stem: |-
          **2- d)** (0,25 pt) En déduire que la suite $(u_n)_{n \in \mathbb{N}}$ converge vers $\alpha$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Passer de l'encadrement de $|u_n-\alpha|$ (question 2-c) à la convergence de $(u_n)$, par le théorème des gendarmes.

          **L'encadrement de départ.** Une valeur absolue est toujours $\ge0$, donc pour tout $n$ :

          $$0 \le |u_n-\alpha| \le \left(\frac13\right)^n$$

          **La limite de la borne de droite.** $\left(\dfrac13\right)^n \to 0$ quand $n\to+\infty$ (suite géométrique de raison $\dfrac13$, $\left|\dfrac13\right|<1$ — chapitre « Suites numériques »).

          **Le théorème des gendarmes.** Les deux bornes tendent vers $0$ : le milieu, encadré, converge aussi vers $0$.

          $$\lim_{n\to+\infty} |u_n-\alpha| = 0$$

          **Conclusion.** $|u_n-\alpha|\to0$ signifie, par définition de la limite d'une suite, que $u_n\to\alpha$ :

          $$\boxed{(u_n)_{n\in\mathbb{N}} \text{ converge vers } \alpha}$$

          **Le piège nommé de cette question.** Invoquer la monotonie de $(u_n)$ pour conclure à sa convergence : rien n'établit que $(u_n)$ est monotone — elle pourrait osciller de part et d'autre de $\alpha$ tout en s'en rapprochant. Seul l'encadrement de $|u_n-\alpha|$ donne, en une étape, à la fois la convergence et l'identité de sa limite.
        steps:
          - math: '0 \le |u_n-\alpha| \le \left(\dfrac13\right)^n \quad (\text{question 2-c, valeur absolue toujours} \ge 0)'
            note: "Encadrement de départ."
          - math: '\lim_{n\to+\infty} \left(\dfrac13\right)^n = 0 \ (|q|<1) \quad (\text{suite géométrique})'
            note: "Limite de référence des suites géométriques de raison entre -1 et 1."
          - math: '\lim_{n\to+\infty} |u_n-\alpha| = 0 \quad (\text{gendarmes}) \implies \boxed{\lim_{n\to+\infty} u_n = \alpha}'
            note: "Théorème des gendarmes, puis définition de la limite d'une suite."
      - id: q8
        part: "Partie D — 1. F(x), intégrale de x a 1 de f, et sa dérivée"
        stem: |-
          **1)** (0,5 pt) Pour tout $x \in I$, on pose : $F(x) = \displaystyle\int_x^{1} f(t)\,dt$. Montrer que la fonction $F$ est dérivable sur $I$ et calculer $F'(x)$ pour tout $x \in I$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $F(x) = \displaystyle\int_x^1 f(t)\,dt$ : c'est une fonction définie comme une intégrale à borne variable, et le théorème fondamental du calcul intégral (chapitre « Calcul intégral », hors socle de cette leçon) donne directement sa dérivabilité et sa dérivée dès que l'intégrande est continu.

          **On réécrit $F$ pour se ramener à la forme usuelle du théorème.**

          $$F(x) = \int_x^1 f(t)\,dt = -\int_1^x f(t)\,dt$$

          **Le théorème fondamental.** $f$ est continue sur $I$ (Partie B, questions 1-a et 2-a) : la fonction $x \mapsto \displaystyle\int_1^x f(t)\,dt$ est donc dérivable sur $I$, de dérivée $f(x)$ en tout point.

          **On reporte le signe.**

          $$F'(x) = -f(x)$$

          **Conclusion.**

          $$\boxed{F \text{ est dérivable sur } I, \quad \forall x\in I\ ;\quad F'(x) = -f(x)}$$

          **Le piège nommé de cette question.** Oublier le signe « moins » venant de la borne variable en position inférieure (et non supérieure comme dans la forme usuelle du théorème) : $\displaystyle\int_x^1$ n'est pas $\displaystyle\int_1^x$, l'échange des bornes inverse le signe.
        steps:
          - math: 'F(x) = \int_x^1 f(t)\,dt = -\int_1^x f(t)\,dt'
            note: "Echange des bornes pour se ramener a la forme usuelle du théorème fondamental."
          - math: 'f \text{ continue sur } I \ (\text{Partie B}) \implies x\mapsto\int_1^x f(t)\,dt \text{ dérivable sur } I, \text{ de dérivée } f(x)'
            note: "Théorème fondamental du calcul intégral."
          - math: '\boxed{F''(x) = -f(x) \quad \forall x \in I}'
            note: "Report du signe issu de l'echange des bornes."
      - id: q9a
        part: "Partie D — 2. Expression explicite de F par IPP, limite en 0 et aire"
        stem: |-
          **2- a)** (0,5 pt) En utilisant la méthode d'intégration par parties, montrer que : $\left(\forall x \in\, ]0, +\infty[\right)\ ;\quad F(x) = 2\ln 2 - \left(1 + \dfrac{1}{x}\right)\ln(1+x)$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $F(x)=\displaystyle\int_x^1 f(t)\,dt$ avec $f(t)=\dfrac{t-\ln(1+t)}{t^2}$. Sépare la fraction : $f(t) = \dfrac1t - \dfrac{\ln(1+t)}{t^2}$. Le premier morceau s'intègre directement ; le second contient un produit $\ln(1+t)\times\dfrac{1}{t^2}$, ce qui signale une intégration par parties (chapitre « Calcul intégral », hors socle de cette leçon) — l'énoncé le confirme.

          **On sépare l'intégrale.**

          $$F(x) = \int_x^1 \frac{dt}{t} - \int_x^1 \frac{\ln(1+t)}{t^2}\,dt$$

          **Le premier morceau, direct.**

          $$\int_x^1 \frac{dt}{t} = \bigl[\ln t\bigr]_x^1 = \ln 1 - \ln x = -\ln x$$

          **Le second morceau, par IPP.** Pose $u(t)=\ln(1+t)$ et $v'(t)=\dfrac1{t^2}$, donc $u'(t)=\dfrac{1}{1+t}$ et $v(t)=-\dfrac1t$.

          $$\int_x^1 \frac{\ln(1+t)}{t^2}\,dt = \left[-\frac{\ln(1+t)}{t}\right]_x^1 + \int_x^1 \frac{1}{t(1+t)}\,dt$$

          **La décomposition en éléments simples**, pour la dernière intégrale : $\dfrac{1}{t(1+t)} = \dfrac1t-\dfrac{1}{1+t}$ (vérifiable en réduisant au même dénominateur).

          $$\int_x^1 \left(\frac1t-\frac{1}{1+t}\right)dt = \bigl[\ln t - \ln(1+t)\bigr]_x^1 = (0-\ln2) - (\ln x - \ln(1+x)) = -\ln2-\ln x+\ln(1+x)$$

          **Le terme entre crochets.**

          $$\left[-\frac{\ln(1+t)}{t}\right]_x^1 = -\ln2 - \left(-\frac{\ln(1+x)}{x}\right) = -\ln2+\frac{\ln(1+x)}{x}$$

          **On rassemble le second morceau.**

          $$\int_x^1 \frac{\ln(1+t)}{t^2}\,dt = -\ln2+\frac{\ln(1+x)}{x} - \ln2-\ln x+\ln(1+x) = -2\ln2+\frac{\ln(1+x)}{x}-\ln x+\ln(1+x)$$

          **On reporte dans $F(x)$.**

          $$F(x) = -\ln x - \left(-2\ln2+\frac{\ln(1+x)}{x}-\ln x+\ln(1+x)\right) = 2\ln2-\frac{\ln(1+x)}{x}-\ln(1+x)$$

          **On factorise $\ln(1+x)$.**

          $$\boxed{F(x) = 2\ln2 - \left(1+\frac1x\right)\ln(1+x)}$$

          **Le piège nommé de cette question.** Oublier la décomposition en éléments simples de $\dfrac{1}{t(1+t)}$ après l'IPP, et essayer d'intégrer $\dfrac{1}{t(1+t)}$ « à vue » — une fraction rationnelle à deux pôles simples se décompose systématiquement avant de s'intégrer, jamais après coup.
        steps:
          - math: 'F(x) = \int_x^1 \dfrac{dt}{t} - \int_x^1 \dfrac{\ln(1+t)}{t^2}\,dt, \qquad \int_x^1 \dfrac{dt}{t} = -\ln x'
            note: "Separation de f, premier morceau integre directement."
          - math: 'u=\ln(1+t), \ v''=\dfrac1{t^2} \implies u''=\dfrac{1}{1+t}, \ v=-\dfrac1t, \qquad \int_x^1 \dfrac{\ln(1+t)}{t^2}dt = \left[-\dfrac{\ln(1+t)}{t}\right]_x^1+\int_x^1\dfrac{dt}{t(1+t)}'
            note: "Intégration par parties du second morceau."
          - math: '\dfrac{1}{t(1+t)} = \dfrac1t-\dfrac{1}{1+t} \implies \int_x^1\dfrac{dt}{t(1+t)} = -\ln2-\ln x+\ln(1+x)'
            note: "Décomposition en éléments simples, puis intégration directe."
          - math: '\boxed{F(x) = 2\ln2-\left(1+\dfrac1x\right)\ln(1+x)}'
            note: "Rassemblement des deux morceaux et factorisation de ln(1+x)."
