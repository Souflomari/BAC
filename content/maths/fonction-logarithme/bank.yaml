    intro: |-
      **Problème d'analyse (examen national, Sciences Mathématiques, session normale 2022 — Exercice 1, 10 points).**

      *L'épreuve dure 4 heures et comporte cinq exercices indépendants, traitables dans l'ordre choisi par le candidat. Cet exercice à lui seul pèse la moitié du barème. L'usage de la calculatrice n'est pas autorisé.*

      **Partie A.** On établit un encadrement algébrique élémentaire, puis on l'intègre entre $0$ et $x$ pour obtenir un encadrement de $x - \dfrac{x^2}{2} + \dfrac{x^3}{3} - \ln(1+x)$ — l'outil qui va porter presque tout le reste du problème.

      **Partie B.** On étudie $f(x) = \dfrac{x-\ln(1+x)}{x^2}$ sur $I=[0,+\infty[$ (avec $f(0)=\frac12$ posé par prolongement), et $(C)$ sa courbe dans un repère orthonormé $(O\,;\vec i,\vec j)$ : continuité et dérivabilité à droite en $0$ (tirées de l'encadrement de la Partie A), limite en $+\infty$, expression de $f'$, encadrement d'une fonction auxiliaire $g$ par intégration, sens de variation, tableau de variations, courbe.

      **Partie C.** On montre que $f(x)=x$ admet une unique solution $\alpha \in\,]0,1[$, puis on étudie la suite $(u_n)$ définie par $u_0=\frac13$ et $u_{n+1}=f(u_n)$ : stabilité de $[0,1]$, contraction de rapport $\frac13$ (tirée de l'encadrement de $g$ établi en Partie B), majoration géométrique de $|u_n-\alpha|$, convergence vers $\alpha$.

      **Partie D.** On pose $F(x)=\displaystyle\int_x^1 f(t)\,dt$ et on en donne une expression explicite par intégration par parties, ce qui permet de calculer $\displaystyle\int_0^1 f$ et l'aire du domaine sous $(C)$ entre $0$ et $1$.

      **Partie E.** On compare, pour chaque entier $k$, la valeur $f(k)$ à l'intégrale de $f$ sur $[k,k+1]$ : l'écart $\Delta_k$ est encadré grâce à la décroissance de $f$, ce qui permet d'encadrer puis d'étudier la convergence de la somme $S_n=\sum_{k=0}^{n-1}\Delta_k$.

