# Sujets réels d'examen national, cartes attempt-first (BANK-SPEC §2/§3). CE
# N'EST PAS exercises.yaml : aucune entrée ici ne porte de marqueur
# [[exercise:…]] dans lesson.md — c'est la couche de VOLUME derrière le sommet
# de leçon (r-bac + r-variation, [[exercise:]] à R7), pas la rampe embarquée.
#
# `sourcing` est AUTHORING-SIDE UNIQUEMENT (jamais rendu — même contrat que
# exercises.yaml). Les quatre entrées sont des transcriptions FIDÈLES des
# quatre entrées « vérifié » de docs/sujets/maths/fonction-logarithme.md —
# 2019 et 2023 (re-fetch AlloSchool indépendant + diff caractère-par-
# caractère, agent-vérificateur-adversarial, 2026-07-12), puis 2021 et 2024
# (même protocole, agent-vérificateur-adversarial, 2026-08-06 ; 2024 porte le
# statut « vérifié (corrigé sur re-lecture) », deux corrections mineures
