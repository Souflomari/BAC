    intro: |-
      **Problème d'analyse (examen national, Sciences Mathématiques, session normale 2024 — Exercice 1, 7,5 points).**

      *L'épreuve dure 4 heures et comporte cinq exercices indépendants, traitables dans l'ordre choisi par le candidat. Cet exercice à lui seul pèse plus du tiers du barème. L'usage de la calculatrice n'est pas autorisé.*

      Soit $f$ la fonction numérique définie sur l'intervalle $[1,+\infty[$ par : $f(1) = \dfrac12$, et pour tout $x\in\,]1,+\infty[$, $f(x) = \dfrac{\ln x}{x^2-1}$. Soit $(C)$ la courbe représentative de $f$ dans un repère orthogonal $(O,\vec i,\vec j)$.

      *Le fil de l'exercice.* Après continuité et une première limite (questions 1-2), l'exercice construit un encadrement délicat par le théorème des accroissements finis (question 3), qui sert ensuite à établir la dérivabilité à droite en $1$ (question 4). La question 5 retrouve le signe de $f'$ par un détour inattendu — deux intégrales, $I(x)$ et $J(x)$ — plutôt que par un calcul direct de dérivée seule. Les questions 6 et 7 en tirent le tableau de variations, la courbe et l'existence d'un unique point fixe $a$ dans $]1,2[$ de $x\mapsto1+f(x)$ — que la question 8 approche par une suite itérée, avec une vitesse de convergence géométrique explicite.

      *Aucune figure n'est imprimée : la question 6-b demande au candidat de construire la courbe lui-même. La carte des domaines : cette leçon (« Fonction logarithme ») porte l'ossature — le taux d'accroissement de $\ln$ en $1$ (chapitre 4), la limite de référence $\ln x/x\to0$ (chapitre 5) — mais les questions 1, 2 et 3-c empruntent aux limites et à la continuité, la question 3-b au théorème des accroissements finis (dérivabilité et étude de fonctions, spécifique SM, énoncé et appliqué au point d'usage, jamais supposé acquis), les questions 4, 5-c/5-d, 6 et 7 à la dérivabilité et à l'étude de fonctions, la question 5 dans son entier au calcul intégral, et la question 8 aux suites numériques — avec, pour la question 8-a, un second usage du même théorème des accroissements finis qu'à la question 3-b.*
    questions:
      - id: q1
        part: "1. Continuité à droite en 1"
        stem: |-
          **(0,5 pt)** Montrer que $f$ est continue à droite en $1$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « Continue à droite en $1$ » signifie $\displaystyle\lim_{x\to 1^+} f(x) = f(1) = \frac12$. Sur $]1,+\infty[$, $f(x)=\dfrac{\ln x}{x^2-1}$ : en $x=1$, le numérateur $\ln(1)=0$ et le dénominateur $1^2-1=0$ — c'est une forme $\frac00$, et la façon la plus directe de la lever ici est de factoriser $x^2-1=(x-1)(x+1)$ pour faire apparaître un taux d'accroissement connu.

          **La factorisation et le découpage en deux facteurs.**

          $$f(x) = \frac{\ln x}{(x-1)(x+1)} = \frac{\ln x - \ln 1}{x-1} \times \frac{1}{x+1}$$

          **Le premier facteur : un taux d'accroissement de $\ln$.** $\dfrac{\ln x-\ln 1}{x-1}$ est exactement le taux d'accroissement de $\ln$ entre $1$ et $x$. Comme $\ln$ est dérivable en $1$ (chapitre 4 de cette leçon), avec $\ln'(1)=\dfrac11=1$, ce taux tend vers $\ln'(1)=1$ quand $x\to 1$.

          **Le second facteur, immédiat.** $\dfrac{1}{x+1} \to \dfrac{1}{2}$ quand $x\to 1$.

          **Le produit.**

          $$\lim_{x\to 1^+} f(x) = 1 \times \frac12 = \frac12 = f(1)$$

          $f$ est donc continue à droite en $1$.

          **Le piège nommé de cette question.** Essayer une factorisation ou un développement limité de $\ln x$ au voisinage de $1$, hors programme. Le taux d'accroissement de $\ln$ en $1$ vaut $\ln'(1)=1$, puisque la dérivée de $\ln$ est $1/x$ (chapitre 2) — inutile de chercher plus loin.
        steps:
          - math: 'f(x) = \dfrac{\ln x}{(x-1)(x+1)} = \dfrac{\ln x - \ln 1}{x-1} \times \dfrac{1}{x+1}'
            note: "Factorisation du dénominateur, pour faire apparaître un taux d'accroissement."
          - math: '\lim_{x\to 1} \dfrac{\ln x - \ln 1}{x-1} = \ln''(1) = 1 \quad (\text{chapitre 2\,: dérivée de ln égale } 1/x)'
            note: "Taux d'accroissement de ln en 1, égal a la dérivée de ln en 1."
          - math: '\lim_{x\to 1^+} f(x) = 1 \times \dfrac{1}{1+1} = \dfrac12 = f(1)'
            note: "Produit des deux limites : f continue à droite en 1."
      - id: q2
        part: "2. Limite en +infini et interprétation graphique"
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} f(x)$ puis interpréter graphiquement le résultat obtenu.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $f(x)=\dfrac{\ln x}{x^2-1}$ : le numérateur $\ln x \to +\infty$ et le dénominateur $x^2-1\to+\infty$ également — forme $\dfrac{\infty}{\infty}$. Le réflexe est de faire apparaître la limite de référence $\dfrac{\ln x}{x}\to 0$ (chapitre 5), en factorisant un $x$ au dénominateur.

          **La réécriture.**

          $$f(x) = \frac{\ln x}{x^2-1} = \frac{\ln x}{x} \times \frac{x}{x^2-1} = \frac{\ln x}{x} \times \frac{1}{x - \frac1x}$$

          **Les deux facteurs séparément.** $\dfrac{\ln x}{x} \to 0$ quand $x\to+\infty$ (chapitre 5, limite de référence). Et $x-\dfrac1x \to +\infty$, donc $\dfrac{1}{x-\frac1x} \to 0$.

          **Le produit.** Deux facteurs qui tendent chacun vers $0$ : pas d'indétermination, le produit tend vers $0$.

          $$\boxed{\lim_{x\to+\infty} f(x) = 0}$$

          **L'interprétation graphique.** $(C)$ admet la droite $y=0$ — l'axe des abscisses — comme asymptote horizontale au voisinage de $+\infty$.

          **Le piège nommé de cette question.** Écrire $\dfrac{\ln x}{x^2-1} \sim \dfrac{\ln x}{x^2}$ sans justifier l'équivalence, ou invoquer directement « croissances comparées » sans jamais faire apparaître $\dfrac{\ln x}{x}$ — la forme du chapitre 5 exacte du cours. Le détour par $\dfrac{\ln x}{x}\times\dfrac{1}{x-\frac1x}$ relie proprement cette limite à la limite de référence, sans admettre une extension non démontrée.
        steps:
          - math: 'f(x) = \dfrac{\ln x}{x^2-1} = \dfrac{\ln x}{x} \times \dfrac{1}{x-\frac1x}'
            note: "On fait apparaître la limite de référence ln(x)/x en factorisant x au dénominateur."
          - math: '\lim_{x\to+\infty} \dfrac{\ln x}{x} = 0 \ (\text{chapitre 5}), \qquad \lim_{x\to+\infty}\left(x-\dfrac1x\right) = +\infty \implies \lim_{x\to+\infty}\dfrac{1}{x-\frac1x} = 0'
            note: "Deux facteurs, chacun tend vers 0 : produit direct, pas d'indetermination."
          - math: '\lim_{x\to+\infty} f(x) = 0 \implies (C) \text{ admet } y=0 \text{ pour asymptote horizontale en } +\infty'
            note: "Limite finie (0) en plus l'infini : lecture graphique directe."
      - id: q3a
        part: "3. Un changement de variable, puis un encadrement par le TAF"
        stem: |-
          **3- a)** (0,25 pt) Soit $x \in\, ]1, +\infty[$. En posant $t = (x-1)^2$, vérifier que : $\dfrac{1 - x + \ln(x)}{(x-1)^2} = \dfrac{-\sqrt{t} + \ln(1+\sqrt{t})}{t}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une vérification par substitution : exprimer $x$ en fonction de $t$, puis remplacer dans le membre de gauche pour retomber exactement sur le membre de droite.

          **Isoler $x$ en fonction de $t$.** Pour $x>1$, $x-1>0$, donc $t=(x-1)^2$ donne, par racine carrée (les deux membres étant positifs) : $\sqrt t = x-1$, c'est-à-dire $x = 1+\sqrt t$.

          **Le numérateur.** $1-x+\ln x = 1-(1+\sqrt t)+\ln(1+\sqrt t) = -\sqrt t + \ln(1+\sqrt t)$.

          **Le dénominateur.** $(x-1)^2 = t$, directement par définition de $t$.

          **Conclusion.**

          $$\frac{1-x+\ln x}{(x-1)^2} = \frac{-\sqrt t + \ln(1+\sqrt t)}{t}$$

          **Le piège nommé de cette question.** Écrire $\sqrt{(x-1)^2}=x-1$ sans justifier le signe — ce n'est vrai que parce que $x>1$ rend $x-1$ positif ; pour $x<1$ ce serait $1-x$.
        steps:
          - math: 'x>1 \implies x-1>0, \qquad t=(x-1)^2 \implies \sqrt{t} = x-1 \implies x = 1+\sqrt{t}'
            note: "Racine carree des deux membres, licite car x-1 positif pour x>1."
          - math: '1-x+\ln x = 1-(1+\sqrt{t})+\ln(1+\sqrt{t}) = -\sqrt{t}+\ln(1+\sqrt{t}), \qquad (x-1)^2 = t'
            note: "Report de x = 1 + racine de t dans le numérateur et le dénominateur."
          - math: '\dfrac{1-x+\ln x}{(x-1)^2} = \dfrac{-\sqrt{t}+\ln(1+\sqrt{t})}{t}'
            note: "Identité vérifiée par substitution directe."
      - id: q3b
        stem: |-
          **3- b)** (0,5 pt) Montrer que $\left(\forall t \in\, ]0, +\infty[\right)$, $\quad -\dfrac{1}{2} < \dfrac{-\sqrt{t} + \ln\left(1+\sqrt{t}\right)}{t} < \dfrac{-1}{2(1+\sqrt{t})}$

          *(On pourra utiliser le théorème des accroissements finis sur l'intervalle $[0\,;t]$)*
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'énoncé lui-même indique la voie : le théorème des accroissements finis (TAF) sur $[0,t]$. Ce théorème n'appartient pas au socle des chapitres 1 à 7 de cette leçon (domaine « dérivabilité et étude des fonctions », spécifique au programme SM) : il faut l'énoncer, vérifier ses hypothèses, puis l'appliquer — jamais le supposer acquis.

          **Le théorème des accroissements finis (TAF), énoncé ici.** Si $h$ est continue sur un intervalle fermé $[p,q]$ et dérivable sur l'intervalle ouvert $]p,q[$, alors il existe $c\in\,]p,q[$ tel que $h(q)-h(p)=h'(c)(q-p)$.

          **La fonction auxiliaire.** Pose $\varphi(u) = -\sqrt u + \ln(1+\sqrt u)$, pour $u\ge 0$. Le membre de gauche de l'identité de la question 3-a est exactement $\dfrac{\varphi(t)-\varphi(0)}{t-0}$, puisque $\varphi(0) = -\sqrt0+\ln(1+\sqrt0) = 0$.

          **Les hypothèses, vérifiées pour $\varphi$ sur $[0,t]$.** $u\mapsto\sqrt u$ est continue sur $[0,+\infty[$ et dérivable sur $]0,+\infty[$ ; $u\mapsto 1+\sqrt u$ reste toujours $\ge 1>0$, donc $u\mapsto\ln(1+\sqrt u)$ est continue sur $[0,+\infty[$ (composée de fonctions continues) et dérivable sur $]0,+\infty[$ (composée de fonctions dérivables). $\varphi$, différence des deux, est donc continue sur $[0,t]$ et dérivable sur $]0,t[$ : les deux hypothèses du TAF sont réunies.

          **La dérivée de $\varphi$.**

          $$\varphi'(u) = -\frac{1}{2\sqrt u} + \frac{1}{1+\sqrt u}\times\frac{1}{2\sqrt u} = \frac{1}{2\sqrt u}\left(-1+\frac{1}{1+\sqrt u}\right) = \frac{1}{2\sqrt u}\times\frac{-\sqrt u}{1+\sqrt u} = \frac{-1}{2(1+\sqrt u)}$$

          **L'application du TAF.** Il existe $c\in\,]0,t[$ tel que :

          $$\frac{\varphi(t)-\varphi(0)}{t} = \varphi'(c) = \frac{-1}{2(1+\sqrt c)}$$

          c'est-à-dire, avec $\varphi(0)=0$ :

          $$\frac{-\sqrt t+\ln(1+\sqrt t)}{t} = \frac{-1}{2(1+\sqrt c)}$$

          **L'encadrement de $c$, puis de $\dfrac{-1}{2(1+\sqrt c)}$.** $0<c<t$, et $u\mapsto\sqrt u$ est strictement croissante, donc $0<\sqrt c<\sqrt t$, c'est-à-dire $1<1+\sqrt c<1+\sqrt t$. La fonction $v\mapsto\dfrac1v$ est strictement décroissante sur $]0,+\infty[$, donc en l'appliquant à l'encadrement précédent, le sens s'inverse :

          $$\frac{1}{1+\sqrt t} < \frac{1}{1+\sqrt c} < 1$$

          En multipliant par $-\dfrac12$ (négatif : le sens s'inverse une seconde fois) :

          $$-\frac12 < \frac{-1}{2(1+\sqrt c)} < \frac{-1}{2(1+\sqrt t)}$$

          **La conclusion**, en reportant $\varphi'(c)=\dfrac{-1}{2(1+\sqrt c)}$ :

          $$\boxed{-\frac12 < \frac{-\sqrt t + \ln(1+\sqrt t)}{t} < \frac{-1}{2(1+\sqrt t)}}$$

          **Le piège nommé de cette question.** Appliquer le TAF sans vérifier que $1+\sqrt u>0$ partout (ce qui garantit la dérivabilité du logarithme composé) — c'est vrai ici, mais ça doit être dit. Second piège, le plus fréquent : se tromper de sens en multipliant l'encadrement de $\frac{1}{1+\sqrt c}$ par $-\frac12$, un nombre négatif — deux inversions de sens successives (le passage à l'inverse, puis la multiplication par un négatif) rendent l'erreur de signe facile si elles ne sont pas faites une à la fois.
        steps:
          - math: '\varphi(u) = -\sqrt{u}+\ln(1+\sqrt{u}), \quad \varphi(0)=0, \qquad \varphi \text{ continue sur } [0,t], \text{ dérivable sur } ]0,t['
            note: "Fonction auxiliaire et vérification des deux hypothèses du TAF."
          - math: '\varphi''(u) = -\dfrac{1}{2\sqrt{u}}+\dfrac{1}{(1+\sqrt{u})\,2\sqrt{u}} = \dfrac{-1}{2(1+\sqrt{u})}'
            note: "Dérivée de phi, calculée à partir de la dérivée de racine et de ln compose."
          - math: '\exists\, c\in\,]0,t[\ ;\quad \dfrac{\varphi(t)-\varphi(0)}{t} = \varphi''(c) = \dfrac{-1}{2(1+\sqrt{c})} \quad (\text{TAF sur } [0,t])'
            note: "Application du théorème des accroissements finis, hors socle de cette leçon."
          - math: '0<c<t \implies 1<1+\sqrt{c}<1+\sqrt{t} \implies \dfrac{1}{1+\sqrt{t}} < \dfrac{1}{1+\sqrt{c}} < 1'
            note: "Inversion (fonction 1/v décroissante) : le sens de l'encadrement se retourne une première fois."
          - math: '-\dfrac12 < \dfrac{-1}{2(1+\sqrt{c})} < \dfrac{-1}{2(1+\sqrt{t})} \implies \boxed{-\dfrac12 < \dfrac{-\sqrt{t}+\ln(1+\sqrt{t})}{t} < \dfrac{-1}{2(1+\sqrt{t})}}'
            note: "Multiplication par -1/2 (négatif) : le sens se retourne une seconde fois, puis report de la dérivée de phi en c."
      - id: q3c
        stem: |-
          **3- c)** (0,25 pt) En déduire que : $\displaystyle\lim_{x \to 1^{+}} \dfrac{1 - x + \ln(x)}{(x-1)^2} = -\dfrac{1}{2}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « En déduire » : combiner l'identité de la question 3-a et l'encadrement de la question 3-b, puis faire tendre $t\to 0^+$ — sans reprendre la fonction $f$ ni chercher un nouvel outil.

          **Le pont entre $x\to 1^+$ et $t\to 0^+$.** $t=(x-1)^2$ : quand $x\to1^+$, $x-1\to0^+$, donc $t=(x-1)^2\to0^+$.

          **L'encadrement de la question 3-b vaut pour tout $t>0$**, donc en particulier quand $t\to0^+$ :

          $$-\frac12 < \frac{-\sqrt t+\ln(1+\sqrt t)}{t} < \frac{-1}{2(1+\sqrt t)}$$

          **Les limites des deux bornes.** La borne de gauche est la constante $-\frac12$. La borne de droite : $\sqrt t\to0$ quand $t\to0^+$, donc $\dfrac{-1}{2(1+\sqrt t)} \to \dfrac{-1}{2(1+0)} = -\frac12$.

          **Le théorème des gendarmes.** Les deux bornes tendent vers la **même** valeur $-\frac12$ : le milieu, encadré, est forcé de converger vers cette même valeur.

          $$\lim_{t\to0^+} \frac{-\sqrt t+\ln(1+\sqrt t)}{t} = -\frac12$$

          **Le retour à $x$, via l'identité de 3-a.** Le membre de gauche de la question 3-a étant égal à celui de droite pour tout $x>1$ (donc pour tout $t>0$ correspondant), et $t\to0^+ \iff x\to1^+$ :

          $$\boxed{\lim_{x\to1^+} \frac{1-x+\ln x}{(x-1)^2} = -\frac12}$$

          **Le piège nommé de cette question.** Oublier de repasser par l'identité de la question 3-a pour reformuler la conclusion en termes de $x$ — la question 3-b conclut sur une limite en $t$, pas encore sur la limite en $x$ demandée ici.
        steps:
          - math: 't=(x-1)^2, \qquad x\to1^+ \implies t \to 0^+'
            note: "Le pont entre la variable x et la variable t introduite a la question 3-a."
          - math: '-\dfrac12 < \dfrac{-\sqrt{t}+\ln(1+\sqrt{t})}{t} < \dfrac{-1}{2(1+\sqrt{t})} \ \xrightarrow[t\to 0^+]{} \ -\dfrac12 \le \cdot \le -\dfrac12'
            note: "Les deux bornes de l'encadrement de la question 3-b tendent toutes deux vers -1/2."
          - math: '\lim_{t\to0^+} \dfrac{-\sqrt{t}+\ln(1+\sqrt{t})}{t} = -\dfrac12 \quad (\text{gendarmes})'
            note: "Théorème des gendarmes : le milieu converge vers la même valeur que les deux bornes."
          - math: '\boxed{\lim_{x\to1^+} \dfrac{1-x+\ln x}{(x-1)^2} = -\dfrac12} \quad (\text{via l''identité de la question 3-a})'
            note: "Retour a x, par l'identité établie a la question 3-a."
      - id: q4a
        part: "4. Dérivabilité à droite en 1"
        stem: |-
          **4- a)** (0,5 pt) Montrer que : $\forall x \in\, ]1, +\infty[\ ,\quad \dfrac{f(x) - \dfrac{1}{2}}{x - 1} = -\dfrac{\ln(x)}{x-1} \times \dfrac{1}{2(x+1)} + \dfrac{\ln(x) - x + 1}{2(x-1)^2}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une identité algébrique : le plus sûr est de partir du membre le plus compliqué — ici, celui de droite, une somme de deux fractions — et de le réduire au même dénominateur pour retomber sur le membre de gauche.

          **Le dénominateur commun.** Les deux fractions du membre de droite ont pour dénominateurs $2(x-1)(x+1)$ et $2(x-1)^2$ : leur dénominateur commun est $2(x-1)^2(x+1)$.

          **Le premier terme, réécrit.**

          $$-\frac{\ln x}{x-1}\times\frac{1}{2(x+1)} = \frac{-\ln x\,(x-1)}{2(x-1)^2(x+1)}$$

          **Le second terme, réécrit.**

          $$\frac{\ln x-x+1}{2(x-1)^2} = \frac{(\ln x-x+1)(x+1)}{2(x-1)^2(x+1)}$$

          **La somme des numérateurs.** Développe $(\ln x-x+1)(x+1) = x\ln x+\ln x-x^2-x+x+1 = x\ln x+\ln x-x^2+1$, et $-\ln x(x-1) = -x\ln x+\ln x$. En additionnant :

          $$(-x\ln x+\ln x) + (x\ln x+\ln x-x^2+1) = 2\ln x - x^2+1$$

          Le terme $-x\ln x$ et le terme $+x\ln x$ s'annulent — un télescopage.

          **Le membre de droite, donc.**

          $$\frac{2\ln x-x^2+1}{2(x-1)^2(x+1)}$$

          **Le membre de gauche, réduit lui aussi.** $f(x)-\frac12 = \dfrac{\ln x}{x^2-1}-\frac12 = \dfrac{2\ln x-(x^2-1)}{2(x^2-1)} = \dfrac{2\ln x-x^2+1}{2(x-1)(x+1)}$. En divisant par $x-1$ :

          $$\frac{f(x)-\frac12}{x-1} = \frac{2\ln x-x^2+1}{2(x-1)^2(x+1)}$$

          **Les deux membres coïncident exactement.**

          $$\boxed{\forall x\in\,]1,+\infty[\ ,\quad \frac{f(x)-\frac12}{x-1} = -\frac{\ln x}{x-1}\times\frac{1}{2(x+1)}+\frac{\ln x-x+1}{2(x-1)^2}}$$

          **Le piège nommé de cette question.** Se perdre dans les signes en développant $(\ln x-x+1)(x+1)$ — c'est l'endroit exact où une erreur silencieuse coûte le plus cher, précisément parce que le résultat final resterait plausible malgré une erreur de signe compensée par une autre plus loin. Développer terme à terme, sans regrouper trop vite, est plus lent mais plus sûr.
        steps:
          - math: '-\dfrac{\ln x}{x-1}\times\dfrac{1}{2(x+1)} + \dfrac{\ln x-x+1}{2(x-1)^2} = \dfrac{-\ln x\,(x-1) + (\ln x-x+1)(x+1)}{2(x-1)^2(x+1)}'
            note: "Réduction au même dénominateur commun aux deux termes du membre de droite."
          - math: '-\ln x\,(x-1) + (\ln x-x+1)(x+1) = (-x\ln x+\ln x) + (x\ln x+\ln x-x^2+1) = 2\ln x - x^2+1'
            note: "Développement du numérateur : le terme en x ln x se télescope."
          - math: '\dfrac{f(x)-\frac12}{x-1} = \dfrac{2\ln x-(x^2-1)}{2(x-1)(x+1)(x-1)} = \dfrac{2\ln x-x^2+1}{2(x-1)^2(x+1)}'
            note: "Membre de gauche réduit au même dénominateur : les deux membres coïncident."
      - id: q4b
        stem: |-
          **4- b)** (0,5 pt) En déduire que $f$ est dérivable à droite en $1$ puis interpréter graphiquement le résultat obtenu.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $f$ dérivable à droite en $1$ signifie que $\dfrac{f(x)-f(1)}{x-1}=\dfrac{f(x)-\frac12}{x-1}$ a une limite finie quand $x\to1^+$. L'identité de la question 4-a exprime exactement ce taux d'accroissement comme une somme de deux morceaux, dont chacun a déjà une limite connue — l'un par la question 1, l'autre par la question 3-c.

          **La limite du premier terme.** $-\dfrac{\ln x}{x-1}\times\dfrac{1}{2(x+1)}$ : $\dfrac{\ln x}{x-1}=\dfrac{\ln x-\ln1}{x-1}\to \ln'(1)=1$ (comme à la question 1), et $\dfrac{1}{2(x+1)}\to\dfrac{1}{4}$. Le produit tend donc vers $-1\times\dfrac14=-\dfrac14$.

          **La limite du second terme.** $\dfrac{\ln x-x+1}{2(x-1)^2} = \dfrac12\times\dfrac{1-x+\ln x}{(x-1)^2} \to \dfrac12\times\left(-\dfrac12\right) = -\dfrac14$ par la question 3-c.

          **La somme.**

          $$\lim_{x\to1^+} \frac{f(x)-\frac12}{x-1} = -\frac14 + \left(-\frac14\right) = -\frac12$$

          $f$ est donc dérivable à droite en $1$, avec $f_d'(1) = -\dfrac12$.

          **L'interprétation graphique.** $(C)$ admet, au point $A\!\left(1,\frac12\right)$, une demi-tangente à droite de coefficient directeur $-\dfrac12$.

          **Le piège nommé de cette question.** Recalculer $\dfrac{1-x+\ln x}{(x-1)^2}$ depuis zéro au lieu de relire son résultat déjà établi à la question 3-c — c'est exactement ce que la décomposition de la question 4-a préparait.
        steps:
