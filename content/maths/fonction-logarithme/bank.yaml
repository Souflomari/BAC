      - id: q5a
        part: "5. Deux intégrales pour retrouver le signe de f'"
        stem: |-
          **5- a)** (0,5 pt) Pour tout $x \in [1, +\infty[$ on pose $I(x) = \displaystyle\int_1^x \frac{t^2-1}{t^3}\,dt$ et $J(x) = \displaystyle\int_1^x \frac{t^2-1}{t^2}\,dt$.

          Montrer que : $\forall x \in [1, +\infty[$, $\ 0 \le I(x) \le J(x)$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $I$ et $J$ sont deux intégrales entre les mêmes bornes $1$ et $x\ge1$ : les comparer revient à comparer leurs intégrandes sur $[1,x]$, puis à intégrer l'inégalité (domaine « calcul intégral », chapitre 5 de ce chapitre — positivité et comparaison — hors socle de cette leçon).

          **Le cas $x=1$.** Les deux intégrales sont nulles (bornes égales) : $I(1)=J(1)=0$, l'inégalité $0\le I(1)\le J(1)$ est une égalité.

          **Le cas $x>1$, en comparant les intégrandes.** Pour $t\in[1,x]$ (donc $t\ge1$) : $t^3\ge t^2>0$, et $t^2-1\ge0$ (car $t\ge1$). Diviser un même numérateur positif ou nul par un dénominateur plus grand donne un résultat plus petit :

          $$0 \le \frac{t^2-1}{t^3} \le \frac{t^2-1}{t^2}$$

          **L'intégration de cet encadrement sur $[1,x]$.** Par positivité et comparaison de l'intégrale (chapitre 5, calcul intégral — hors socle de cette leçon), intégrer une inégalité entre fonctions continues sur $[1,x]$ (avec $1\le x$) conserve son sens :

          $$\int_1^x 0\,dt \ \le\ \int_1^x \frac{t^2-1}{t^3}\,dt \ \le\ \int_1^x \frac{t^2-1}{t^2}\,dt$$

          c'est-à-dire $0 \le I(x) \le J(x)$.

          $$\boxed{\forall x\in[1,+\infty[\ ,\quad 0\le I(x)\le J(x)}$$

          **Le piège nommé de cette question.** Comparer les intégrandes seulement pour $t=x$ (la borne) au lieu de pour **tout** $t$ dans l'intervalle d'intégration $[1,x]$ — la comparaison d'intégrales exige l'inégalité **sur tout l'intervalle**, pas seulement en un point.
        steps:
          - math: 't\ge1 \implies t^3\ge t^2>0 \text{ et } t^2-1\ge0 \implies 0\le\dfrac{t^2-1}{t^3}\le\dfrac{t^2-1}{t^2}'
            note: "Comparaison des integrandes sur [1,x] : même numérateur positif, dénominateur plus grand à gauche."
          - math: '\int_1^x 0\,dt \le \int_1^x \dfrac{t^2-1}{t^3}\,dt \le \int_1^x \dfrac{t^2-1}{t^2}\,dt \quad (\text{positivité et comparaison des intégrales, chapitre Calcul intégral, hors socle})'
            note: "Intégration de l'encadrement des integrandes sur [1,x], bornes dans l'ordre 1 <= x."
          - math: '\boxed{0 \le I(x) \le J(x)} \quad \forall x\in[1,+\infty['
            note: "I(x) et J(x) sont exactement les deux intégrales encadrees."
      - id: q5b
        stem: |-
          **5- b)** (0,5 pt) Montrer que pour tout $x \in [1, +\infty[$, $\ I(x) = \ln(x) - \dfrac{x^2-1}{2x^2}$ et $J(x) = \dfrac{(x-1)^2}{x}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux calculs de primitives directs : décomposer chaque intégrande en une somme de termes simples, primitiver terme à terme (linéarité, chapitre 3 de calcul intégral), puis évaluer entre $1$ et $x$.

          **Le calcul de $I(x)$.** Sépare l'intégrande :

          $$\frac{t^2-1}{t^3} = \frac{t^2}{t^3}-\frac{1}{t^3} = \frac1t-\frac{1}{t^3}$$

          Une primitive de $\dfrac1t$ est $\ln t$ (pour $t>0$) ; une primitive de $\dfrac1{t^3}=t^{-3}$ est $-\dfrac{1}{2t^2}$. Donc :

          $$I(x) = \int_1^x\left(\frac1t-\frac{1}{t^3}\right)dt = \left[\ln t+\frac{1}{2t^2}\right]_1^x = \left(\ln x+\frac{1}{2x^2}\right)-\left(0+\frac12\right) = \ln x+\frac{1}{2x^2}-\frac12$$

          En mettant $\dfrac{1}{2x^2}-\dfrac12$ au même dénominateur : $\dfrac{1-x^2}{2x^2} = -\dfrac{x^2-1}{2x^2}$. Donc :

          $$\boxed{I(x) = \ln x - \frac{x^2-1}{2x^2}}$$

          **Le calcul de $J(x)$.** Sépare l'intégrande :

          $$\frac{t^2-1}{t^2} = 1-\frac{1}{t^2}$$

          Une primitive de $1$ est $t$ ; une primitive de $\dfrac{1}{t^2}=t^{-2}$ est $-\dfrac1t$. Donc :

          $$J(x) = \int_1^x\left(1-\frac{1}{t^2}\right)dt = \left[t+\frac1t\right]_1^x = \left(x+\frac1x\right)-(1+1) = x+\frac1x-2$$

          En mettant au même dénominateur : $\dfrac{x^2+1-2x}{x} = \dfrac{(x-1)^2}{x}$. Donc :

          $$\boxed{J(x) = \frac{(x-1)^2}{x}}$$

          **Le piège nommé de cette question.** Se tromper de signe dans la primitive de $t^{-3}$ : $\displaystyle\int t^{-3}\,dt = \dfrac{t^{-2}}{-2}=-\dfrac{1}{2t^2}$, et non $+\dfrac{1}{2t^2}$ — un oubli fréquent sur les puissances négatives.
        steps:
          - math: '\dfrac{t^2-1}{t^3} = \dfrac1t - \dfrac{1}{t^3} \implies I(x) = \left[\ln t + \dfrac{1}{2t^2}\right]_1^x = \ln x + \dfrac{1}{2x^2} - \dfrac12'
            note: "Décomposition, primitives ln(t) et -1/(2t au carré), evaluees entre 1 et x."
          - math: 'I(x) = \ln x + \dfrac{1-x^2}{2x^2} = \boxed{\ln x - \dfrac{x^2-1}{2x^2}}'
            note: "Mise au même dénominateur du terme constant."
          - math: '\dfrac{t^2-1}{t^2} = 1-\dfrac{1}{t^2} \implies J(x) = \left[t+\dfrac1t\right]_1^x = x+\dfrac1x-2 = \boxed{\dfrac{(x-1)^2}{x}}'
            note: "Decomposition, primitives t et -1/t, evaluees entre 1 et x, puis mise au même dénominateur."
      - id: q5c
        stem: |-
          **5- c)** (0,5 pt) Montrer que : $\forall x \in\, ]1, +\infty[$, $\ f'(x) = \dfrac{-2}{(x+1)^2} \times \dfrac{I(x)}{J(x)}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux chemins mènent au même résultat : dériver $f$ directement (quotient), ou combiner les expressions de $I(x)$ et $J(x)$ obtenues à la question 5-b. Le second est celui que l'énoncé prépare depuis la question 5-a — c'est lui qui est suivi ici, la dérivée directe servant de contrôle indépendant.

          **La dérivée de $f$, directement (domaine « dérivabilité et étude des fonctions », dérivée d'un quotient — hors socle de cette leçon).** $f(x)=\dfrac{\ln x}{x^2-1}$ :

          $$f'(x) = \frac{\frac1x(x^2-1)-\ln x\times2x}{(x^2-1)^2} = \frac{\frac{x^2-1}{x}-2x\ln x}{(x^2-1)^2} = \frac{x^2-1-2x^2\ln x}{x(x^2-1)^2}$$

          **Le membre de droite, à partir de $I(x)$ et $J(x)$.**

          $$\frac{-2}{(x+1)^2}\times\frac{I(x)}{J(x)} = \frac{-2}{(x+1)^2}\times\frac{\ln x-\frac{x^2-1}{2x^2}}{\frac{(x-1)^2}{x}} = \frac{-2}{(x+1)^2}\times\frac{2x^2\ln x-(x^2-1)}{2x^2}\times\frac{x}{(x-1)^2}$$

          $$= \frac{-2}{(x+1)^2}\times\frac{2x^2\ln x-x^2+1}{2x(x-1)^2} = \frac{-\left(2x^2\ln x-x^2+1\right)}{x(x-1)^2(x+1)^2} = \frac{x^2-1-2x^2\ln x}{x(x-1)^2(x+1)^2}$$

          **On rassemble les deux dénominateurs.** $(x-1)^2(x+1)^2 = \left[(x-1)(x+1)\right]^2 = (x^2-1)^2$. Le membre de droite devient donc :

          $$\frac{x^2-1-2x^2\ln x}{x(x^2-1)^2}$$

          **Les deux membres coïncident exactement**, terme à terme :

          $$\boxed{\forall x\in\,]1,+\infty[\ ,\quad f'(x) = \frac{-2}{(x+1)^2}\times\frac{I(x)}{J(x)}}$$

          **Le piège nommé de cette question.** Oublier de regrouper $(x-1)^2(x+1)^2$ en $(x^2-1)^2$ à la fin — les deux écritures sont mathématiquement identiques, mais seule la seconde permet de reconnaître le dénominateur $(x^2-1)^2$ de la dérivée calculée directement, et donc de conclure à l'égalité.
        steps:
          - math: 'f''(x) = \dfrac{\frac1x(x^2-1)-2x\ln x}{(x^2-1)^2} = \dfrac{x^2-1-2x^2\ln x}{x(x^2-1)^2}'
            note: "Dérivée directe de f, formule du quotient (hors socle de cette leçon)."
          - math: '\dfrac{-2}{(x+1)^2}\times\dfrac{I(x)}{J(x)} = \dfrac{-2}{(x+1)^2}\times\dfrac{2x^2\ln x - x^2+1}{2x(x-1)^2} = \dfrac{x^2-1-2x^2\ln x}{x(x-1)^2(x+1)^2}'
            note: "Report des expressions de I(x) et J(x) etablies a la question 5-b, puis simplification."
          - math: '(x-1)^2(x+1)^2 = (x^2-1)^2 \implies \dfrac{-2}{(x+1)^2}\times\dfrac{I(x)}{J(x)} = \dfrac{x^2-1-2x^2\ln x}{x(x^2-1)^2} = f''(x)'
            note: "Regroupement du dénominateur : les deux membres coïncident exactement."
      - id: q5d
        stem: |-
          **5- d)** (0,5 pt) En déduire que : $\forall x \in\, ]1, +\infty[$, $\ -\dfrac{1}{2} \le f'(x) \le 0$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La question 5-a a encadré $\dfrac{I(x)}{J(x)}$ entre $0$ et $1$ ; la question 5-c exprime $f'(x)$ comme ce rapport multiplié par un facteur connu. Il reste à combiner les deux, en faisant attention au signe négatif du facteur.

          **L'encadrement de $\dfrac{I(x)}{J(x)}$, pour $x>1$.** La question 5-a donne $0\le I(x)\le J(x)$. Pour $x>1$, $J(x)=\dfrac{(x-1)^2}{x}>0$ (strictement, car $x\ne1$) : on peut donc diviser par $J(x)$ sans changer le sens des inégalités :

          $$0 \le \frac{I(x)}{J(x)} \le 1$$

          **La multiplication par $\dfrac{-2}{(x+1)^2}$, négatif : le sens s'inverse.**

          $$\frac{-2}{(x+1)^2}\times1 \ \le\ \frac{-2}{(x+1)^2}\times\frac{I(x)}{J(x)} \ \le\ \frac{-2}{(x+1)^2}\times0$$

          c'est-à-dire, avec $f'(x)=\dfrac{-2}{(x+1)^2}\times\dfrac{I(x)}{J(x)}$ (question 5-c) :

          $$\frac{-2}{(x+1)^2} \le f'(x) \le 0$$

          **La borne de gauche, encore à affiner.** Pour $x>1$ : $x+1>2$, donc $(x+1)^2>4$, donc $\dfrac{2}{(x+1)^2}<\dfrac12$, donc $\dfrac{-2}{(x+1)^2}>-\dfrac12$. En chaînant avec l'encadrement précédent :

          $$-\frac12 < \frac{-2}{(x+1)^2} \le f'(x)$$

          d'où, a fortiori, $-\dfrac12 \le f'(x)$.

          **La conclusion.**

          $$\boxed{\forall x\in\,]1,+\infty[\ ,\quad -\frac12 \le f'(x) \le 0}$$

          **Le piège nommé de cette question.** Multiplier l'encadrement $0\le\frac{I(x)}{J(x)}\le1$ par $\dfrac{-2}{(x+1)^2}$ sans inverser le sens des inégalités — un facteur négatif retourne toujours l'encadrement, et l'oublier donnerait $0\le f'(x)\le -\frac{2}{(x+1)^2}$, un encadrement absurde (borne de gauche supérieure à celle de droite).
        steps:
          - math: 'x>1 \implies J(x)=\dfrac{(x-1)^2}{x}>0 \implies 0 \le \dfrac{I(x)}{J(x)} \le 1 \quad (\text{question 5-a, divise par } J(x)>0)'
            note: "Division par J(x), strictement positif pour x>1 : le sens de l'encadrement est conserve."
          - math: '\dfrac{-2}{(x+1)^2}\times1 \le f''(x) \le \dfrac{-2}{(x+1)^2}\times0 \implies \dfrac{-2}{(x+1)^2} \le f''(x) \le 0'
            note: "Multiplication par -2/(x+1) au carré, négatif : le sens de l'encadrement s'inverse."
          - math: 'x>1 \implies (x+1)^2>4 \implies \dfrac{-2}{(x+1)^2} > -\dfrac12'
            note: "Affinement de la borne de gauche."
          - math: '\boxed{-\dfrac12 \le f''(x) \le 0} \quad \forall x\in\,]1,+\infty['
            note: "Chainage des deux encadrements : la borne -1/2 est atteinte au sens large."
      - id: q6a
        part: "6. Tableau de variations et courbe"
        stem: |-
          **6- a)** (0,25 pt) Dresser le tableau de variations de la fonction $f$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le tableau de variations rassemble en un seul objet trois faits déjà établis séparément : le signe précis de $f'$ (affiné ci-dessous à partir de la question 5-d), et les valeurs/limites aux bornes du domaine ($f(1)$ et la limite en $+\infty$).

          **Le signe exact de $f'$ sur $]1,+\infty[$.** La question 5-d donne $-\frac12 \le f'(x) \le 0$, une borne large. Regarde d'où viendrait un zéro éventuel : $f'(x)=0 \iff I(x)=0$ (question 5-c, puisque $-2/(x+1)^2$ ne s'annule jamais). Or $I(x)=\int_1^x \frac{t^2-1}{t^3}dt$ est l'intégrale d'une fonction continue **strictement positive** sur $]1,x]$ dès que $x>1$ (le numérateur $t^2-1>0$ pour $t>1$) : donc $I(x)>0$ pour tout $x>1$, et $f'(x)<0$ **strictement** sur $]1,+\infty[$.

          **Les valeurs aux bornes.** $f(1)=\frac12$ (donné par l'énoncé) ; $\displaystyle\lim_{x\to+\infty}f(x)=0$ (question 2).

          **Le tableau.** $f$ décroît strictement, sans interruption, de $f(1)=\frac12$ vers une limite $0$ jamais atteinte.

          **Le piège nommé de cette question.** Écrire $f'(x)\le 0$ au tableau (l'inégalité large de la question 5-d) sans vérifier si l'égalité est atteinte quelque part : un tableau de variations avec une case « $f'=0$ » isolée changerait la nature de la décroissance (un palier local). Ici, il n'y a aucun point où $f'$ s'annule sur $]1,+\infty[$.
        steps:
          - math: 'f''(x) = 0 \iff I(x) = 0, \quad I(x) = \int_1^x \dfrac{t^2-1}{t^3}\,dt > 0 \ \forall x>1 \implies f''(x) < 0 \text{ strictement sur } ]1,+\infty['
            note: "Signe strict de f' affine à partir de la question 5-c : I(x) strictement positif pour x>1."
          - math: 'f(1) = \dfrac12, \qquad \lim_{x\to+\infty} f(x) = 0'
            note: "Valeurs aux bornes, déjà etablies (donnée de l'énoncé et question 2)."
          - math: 'f \text{ strictement décroissante sur } [1,+\infty[, \text{ de } \dfrac12 \text{ vers } 0 \text{ (limite jamais atteinte)}'
            note: "Tableau de variations complet : une seule fleche descendante."
      - id: q6b
        stem: |-
          **6- b)** (0,5 pt) Tracer la courbe $(C)$. *(On prendra $\|\vec{i}\| = 1\ \text{cm}$ et $\|\vec{j}\| = 2\ \text{cm}$)*
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Aucun calcul supplémentaire : tracer, c'est assembler tout ce que l'exercice a déjà établi, dans le bon repère. Le repère est **orthogonal**, pas orthonormé — les deux échelles ($1\,\text{cm}$ en abscisse, $2\,\text{cm}$ en ordonnée) sont différentes, et l'oublier fausse visuellement la pente de la demi-tangente.

          **Les quatre ingrédients à placer, dans l'ordre.**

          1. Le point de départ $A\!\left(1,\frac12\right)$ — $f(1)=\frac12$ est une valeur **atteinte**, le domaine commence en $x=1$ inclus.
          2. La demi-tangente à droite en $A$, de coefficient directeur $f_d'(1)=-\frac12$ (question 4-b) — nettement inclinée, pas horizontale.
          3. Une décroissance stricte et continue sur tout $[1,+\infty[$ (question 6-a), sans palier ni remontée.
          4. L'asymptote horizontale $y=0$ (l'axe des abscisses) en $+\infty$, approchée sans jamais être atteinte (question 2) — la courbe finit par passer sous la demi-tangente initiale sans jamais recouper l'axe.

          **Le piège nommé de cette question.** Tracer une tangente horizontale en $A$ par réflexe : ici $f_d'(1)=-\frac12$ est clairement négatif, la demi-tangente part en descendant fort. Second piège : faire toucher la courbe à l'axe des abscisses en un point fini — c'est une limite, jamais une valeur atteinte, et avec l'échelle $\|\vec j\|=2\,\text{cm}$ un contact visuel trop appuyé se voit immédiatement sur la copie.
        steps:
          - math: 'A\left(1\,;\,\dfrac12\right) \quad (\text{point de départ, } f(1)=\dfrac12 \text{ atteint})'
            note: "Premier ingredient : la valeur en 1, donnée par l'énoncé."
          - math: 'f''_d(1) = -\dfrac12 \quad (\text{question 4-b, pente de la demi-tangente à droite en 1})'
            note: "Deuxième ingredient : la pente de départ, oblique et nettement négative."
          - math: 'f \text{ strictement décroissante sur } [1,+\infty[ \quad (\text{question 6-a})'
            note: "Troisième ingredient : un seul sens de variation, sans palier."
          - math: 'f(x) \to 0^{+} \text{ quand } x \to +\infty \quad (\text{question 2, asymptote } y=0)'
            note: "Quatrième ingredient : la courbe s'approche de l'axe des abscisses sans le toucher."
      - id: q7
        part: "7. Une équation f(x) = x - 1"
        stem: |-
          **(0,5 pt)** Montrer que l'équation $f(x) = x - 1$ admet une unique solution $a$ dans $]1,2[$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « Une unique solution » : deux affirmations distinctes, l'existence et l'unicité, données par deux outils complémentaires — TVI pour l'existence, stricte monotonie pour l'unicité (corollaire du théorème des valeurs intermédiaires, domaine « dérivabilité et étude des fonctions », hors socle de cette leçon).

          **La fonction auxiliaire.** Pose $h(x) = f(x)-(x-1) = f(x)-x+1$ sur $[1,+\infty[$ : résoudre $f(x)=x-1$ revient à résoudre $h(x)=0$.

          **La continuité de $h$ sur $[1,+\infty[$.** $f$ est continue à droite en $1$ (question 1) et continue sur $]1,+\infty[$ (quotient de fonctions continues, dénominateur non nul), donc continue sur $[1,+\infty[$ ; $x\mapsto x-1$ est continue partout. $h$, différence, est continue sur $[1,+\infty[$.

          **La stricte décroissance de $h$ sur $[1,+\infty[$.** Sur $]1,+\infty[$, $h'(x)=f'(x)-1$. Par la question 5-d, $f'(x)\le0$, donc $h'(x)=f'(x)-1 \le 0-1=-1<0$. $h$ est donc strictement décroissante sur $]1,+\infty[$, et par continuité en $1$, sur $[1,+\infty[$ tout entier.

          **Les valeurs qui encadrent le zéro cherché.** $h(1)=f(1)-(1-1)=\dfrac12-0=\dfrac12>0$. $h(2)=f(2)-(2-1)=\dfrac{\ln2}{2^2-1}-1=\dfrac{\ln2}{3}-1$. Numériquement, $\ln2\approx0{,}693$, donc $h(2)\approx0{,}231-1=-0{,}769<0$.

          **La conclusion, par le corollaire du TVI.** $h$ continue et strictement décroissante sur $[1,2]$, avec $h(1)>0>h(2)$ : $h$ réalise une bijection de $[1,2]$ sur $[h(2),h(1)]$, et $0$ appartient à cet intervalle. Il existe donc un **unique** $a\in[1,2]$ tel que $h(a)=0$. Comme $h(1)=\dfrac12\ne0$ et $h(2)\ne0$, $a\ne1$ et $a\ne2$ : $a\in\,]1,2[$.

          $$\boxed{\text{L’équation } f(x)=x-1 \text{ admet une unique solution } a \text{ dans } ]1,2[}$$

          **Le piège nommé de cette question.** Invoquer seulement le changement de signe entre $h(1)$ et $h(2)$ (un simple TVI) sans mentionner la stricte monotonie — cela donnerait l'existence, jamais l'unicité, et la question demande explicitement les deux.
        steps:
          - math: 'h(x) = f(x)-x+1 \quad \text{sur } [1,+\infty[, \qquad h \text{ continue (f continue + x-1 continue)}'
            note: "Fonction auxiliaire. Continuité obtenue de f (question 1) et de la fonction affine."
          - math: 'h''(x) = f''(x)-1 \le 0-1 = -1 < 0 \ (x>1, \text{question 5-d}) \implies h \text{ strictement décroissante sur } [1,+\infty['
            note: "Stricte monotonie, via le signe de f' établi a la question 5-d."
          - math: 'h(1) = \dfrac12 > 0, \qquad h(2) = \dfrac{\ln 2}{3}-1 \approx -0{,}769 < 0'
            note: "Valeurs aux bornes de [1,2], de signes opposés."
          - math: 'h \text{ bijection de } [1,2] \text{ sur } [h(2),h(1)] \ni 0 \implies \exists!\, a\in\,]1,2[,\ h(a)=0'
            note: "Corollaire du TVI (continuité + stricte monotonie), hors socle de cette leçon."
      - id: q8a
        part: "8. La suite (a_n), point fixe de x -> 1+f(x)"
        stem: |-
          Soit $(a_n)_{n \in \mathbb{N}}$ la suite numérique définie par $a_0 \in [1,+\infty[$ et, pour tout $n\in\mathbb{N}$, $a_{n+1} = 1+f(a_n)$.

          **8- a)** (0,5 pt) Montrer que : $(\forall n \in \mathbb{N})$, $\ |a_{n+1} - a| \le \dfrac{1}{2}|a_n - a|$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La suite est définie par $a_{n+1}=1+f(a_n)$ ; remarque que $a$, la solution de la question 7, vérifie $f(a)=a-1$, c'est-à-dire $1+f(a)=a$ — **$a$ est le point fixe** de $x\mapsto1+f(x)$, exactement la valeur que la suite cherche à atteindre. Majorer $|a_{n+1}-a|$ en fonction de $|a_n-a|$ est une comparaison de $\varphi(x)=1+f(x)$ entre deux points : l'outil, hors du socle de cette leçon, est de nouveau le **théorème des accroissements finis** — déjà énoncé et appliqué à la question 3-b, réutilisé ici.

          **Un préalable : $a_n\ge1$ pour tout $n$, par récurrence.** $a_0\ge1$ par hypothèse. Si $a_n\ge1$, alors $a_n$ est dans le domaine $[1,+\infty[$ de $f$, et $f(a_n)\ge0$ (car $f$ décroît de $f(1)=\frac12$ vers une limite $0$ jamais négative, question 6-a) : donc $a_{n+1}=1+f(a_n)\ge1$. Par récurrence, $a_n\ge1$ pour tout $n\in\mathbb{N}$.

          **L'application du TAF, à $\varphi(x)=1+f(x)$, entre $a_n$ et $a$ (tous deux $\ge1$).** $\varphi$ est continue sur $[1,+\infty[$ (car $f$ l'est) et dérivable sur $]1,+\infty[$, avec $\varphi'(x)=f'(x)$. Le TAF (énoncé à la question 3-b) donne l'existence de $c$, strictement entre $a_n$ et $a$ — donc $c>1$ dès que $a_n\ne a$ —, tel que :

          $$\varphi(a_n)-\varphi(a) = \varphi'(c)\,(a_n-a)$$

          Or $\varphi(a_n)=a_{n+1}$ (définition de la suite) et $\varphi(a)=1+f(a)=a$ (point fixe, ci-dessus) :

          $$a_{n+1}-a = f'(c)\,(a_n-a)$$

          **La borne sur $f'(c)$.** Comme $c>1$, la question 5-d donne $-\dfrac12\le f'(c)\le0$, donc $|f'(c)|\le\dfrac12$.

          **La conclusion, en valeur absolue.**

          $$|a_{n+1}-a| = |f'(c)|\,|a_n-a| \le \frac12|a_n-a|$$

          (le cas $a_n=a$ est trivial : $a_{n+1}=\varphi(a)=a$, l'inégalité devient l'égalité $0\le0$.)

          $$\boxed{\forall n\in\mathbb{N}\ ,\quad |a_{n+1}-a| \le \frac12|a_n-a|}$$

          **Le piège nommé de cette question.** Oublier de vérifier $a_n\ge1$ avant d'appliquer le TAF sur $]1,+\infty[$, l'intervalle où la formule de $f'$ (question 5-c/d) est établie — sans ce préalable, rien ne garantit que le TAF s'applique dans le bon domaine.
        steps:
          - math: '\text{Recurrence\,: } a_0\ge1, \quad a_n\ge1 \implies f(a_n)\ge0 \implies a_{n+1}=1+f(a_n)\ge1'
            note: "Préalable : a_n reste dans le domaine [1, plus infini[ de f pour tout n."
          - math: '\varphi(x)=1+f(x), \qquad \varphi(a) = 1+f(a) = a \quad (\text{question 7\,: } f(a)=a-1)'
            note: "a est le point fixe de phi : c'est ce qui relie la question 7 a celle-ci."
          - math: '\exists\, c \text{ entre } a_n \text{ et } a\ (c\ge1),\quad a_{n+1}-a = \varphi(a_n)-\varphi(a) = f''(c)(a_n-a) \quad (\text{TAF, déjà énoncé a la question 3-b})'
            note: "Reutilisation du théorème des accroissements finis, hors socle de cette leçon."
          - math: '-\dfrac12\le f''(c)\le0 \ (\text{question 5-d, car } c>1) \implies |f''(c)|\le\dfrac12'
            note: "Borne sur f' reutilisee de la question 5-d."
          - math: '\boxed{|a_{n+1}-a| = |f''(c)|\,|a_n-a| \le \dfrac12|a_n-a|}'
            note: "Valeur absolue de l'égalité du TAF, puis la borne sur f' de c."
      - id: q8b
        stem: |-
          **8- b)** (0,5 pt) Montrer par récurrence que : $(\forall n \in \mathbb{N})$, $\ |a_n - a| \le \left(\dfrac{1}{2}\right)^n |a_0 - a|$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La question 8-a a établi le passage d'un rang au suivant (diviser l'écart par $2$) ; il reste à enchaîner ce passage $n$ fois, par une récurrence propre, initialisation et hérédité séparées.

          **Initialisation ($n=0$).** Membre de gauche : $|a_0-a|$. Membre de droite : $\left(\dfrac12\right)^0|a_0-a| = 1\times|a_0-a| = |a_0-a|$. Les deux membres sont égaux : l'inégalité est vraie au rang $0$ (avec égalité).

          **Hérédité.** Suppose $|a_n-a| \le \left(\dfrac12\right)^n|a_0-a|$ pour un rang $n$ fixé (HR). De la question 8-a : $|a_{n+1}-a| \le \dfrac12|a_n-a|$. En appliquant HR au membre de droite, et en multipliant HR par $\dfrac12>0$ (le sens se conserve) :

          $$\frac12|a_n-a| \le \frac12\times\left(\frac12\right)^n|a_0-a| = \left(\frac12\right)^{n+1}|a_0-a|$$

          En chaînant :

          $$|a_{n+1}-a| \le \frac12|a_n-a| \le \left(\frac12\right)^{n+1}|a_0-a|$$

          La propriété est vraie au rang $n+1$.

          **Conclusion.** Par le principe de récurrence :

          $$\boxed{\forall n\in\mathbb{N}\ ,\quad |a_n-a| \le \left(\frac12\right)^n|a_0-a|}$$

          **Le piège nommé de cette question.** Appliquer directement la question 8-a à $|a_n-a|$ au lieu de partir de $|a_{n+1}-a|$ — il faut toujours partir du terme au rang $n+1$, lui appliquer 8-a, puis invoquer HR sur le terme au rang $n$ qui en résulte, jamais l'inverse.
        steps:
          - math: '\text{Initialisation\,: } |a_0-a| = \left(\dfrac12\right)^0|a_0-a| \quad (\text{égalité au rang } 0)'
            note: "Membres de gauche et de droite égaux au rang 0."
          - math: '\text{HR\,: } |a_n-a| \le \left(\dfrac12\right)^n|a_0-a| \quad \text{(hypothèse, rang } n\text{)}'
            note: "Ce qu'on suppose connu, a un rang n fixe quelconque."
          - math: '|a_{n+1}-a| \le \dfrac12|a_n-a| \ (\text{question 8-a}) \ \le\ \dfrac12\times\left(\dfrac12\right)^n|a_0-a| \ (\text{HR}) \ = \left(\dfrac12\right)^{n+1}|a_0-a|'
            note: "Hérédité : question 8-a d'abord, puis HR appliquee au terme qui en résulte."
          - math: '\boxed{\forall n\in\mathbb{N}\ ,\ |a_n-a| \le \left(\dfrac12\right)^n|a_0-a|} \quad (\text{recurrence complete})'
            note: "Initialisation et hérédité etablies séparément : la récurrence est complete."
      - id: q8c
        stem: |-
          **8- c)** (0,25 pt) En déduire que la suite $(a_n)_{n \in \mathbb{N}}$ est convergente.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On dispose d'un encadrement de $|a_n-a|$ (question 8-b) ; il reste à en tirer la convergence par le théorème des gendarmes, sans jamais affirmer une monotonie de $(a_n)$ qui n'a été établie nulle part.

          **L'encadrement de départ.** Une valeur absolue est toujours $\ge0$, donc pour tout $n$ :

          $$0 \le |a_n-a| \le \left(\frac12\right)^n|a_0-a|$$

          **La limite de la borne de droite.** $|a_0-a|$ est une constante ; $\left(\dfrac12\right)^n\to0$ quand $n\to+\infty$ (suite géométrique de raison $\dfrac12$, $\left|\dfrac12\right|<1$ — chapitre « suites numériques »). Donc $\left(\dfrac12\right)^n|a_0-a| \to 0$.

          **Le théorème des gendarmes.** Les deux bornes tendent vers $0$ : le milieu, encadré, converge aussi vers $0$ :

          $$\lim_{n\to+\infty} |a_n-a| = 0$$

          **La conclusion.** $|a_n-a|\to0$ signifie, par définition même de la limite d'une suite, que $a_n\to a$ :

          $$\boxed{(a_n)_{n\in\mathbb{N}} \text{ converge, vers } a}$$

          **Le piège nommé de cette question.** Conclure « la suite est décroissante et minorée, donc convergente » : rien n'établit que $(a_n)$ est monotone — elle pourrait très bien osciller autour de $a$ en s'en rapprochant. Seul l'encadrement de $|a_n-a|$ par le théorème des gendarmes donne, en une seule étape, à la fois la convergence et l'identité de sa limite.
        steps:
          - math: '0 \le |a_n-a| \le \left(\dfrac12\right)^n|a_0-a| \quad (\text{question 8-b, valeur absolue toujours} \ge 0)'
            note: "Encadrement de départ : la valeur absolue est bornée des deux cotes."
          - math: '\lim_{n\to+\infty} \left(\dfrac12\right)^n = 0 \ (|q|<1) \implies \lim_{n\to+\infty} \left(\dfrac12\right)^n|a_0-a| = 0'
            note: "Suite géométrique de raison 1/2 : limite de référence du chapitre suites numériques."
          - math: '\lim_{n\to+\infty} |a_n-a| = 0 \quad (\text{théorème des gendarmes})'
            note: "Les deux bornes tendent vers 0 : le milieu aussi."
          - math: '\boxed{\lim_{n\to+\infty} a_n = a}'
            note: "Par définition : l'écart de a_n a a qui tend vers 0 signifie que a_n tend vers a."
