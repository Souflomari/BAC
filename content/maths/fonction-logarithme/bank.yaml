      - id: q16
        stem: |-
          **(0,75 pt)** Vérifier que $g^{-1}$ est dérivable en $1$ et calculer $\left(g^{-1}\right)'(1)$.
        reasoning: |-
          Le théorème de la dérivée d'une fonction réciproque (chapitre « Dérivabilité et étude de fonctions », hors socle de cette leçon) dit : si $g$ est dérivable en $x_0$ avec $g'(x_0)\ne0$, alors $g^{-1}$ est dérivable en $y_0=g(x_0)$, et $(g^{-1})'(y_0)=\dfrac1{g'(x_0)}$. Ici on cherche $x_0\in I$ tel que $g(x_0)=1$ : $x_0=0$ convient, car $f(0)=0+1-\ln(e^0-0)=1-\ln1=1$. On calcule ensuite $g'(0)=f'(0)$ avec la formule de la question 10 : $f'(0)=\dfrac{1-0}{e^0-0}=1$, qui est non nul. Le théorème s'applique donc, et $(g^{-1})'(1)=\dfrac1{g'(0)}=1$.
        steps:
          - math: 'g(0) = f(0) = 0+1-\ln(e^0-0) = 1-\ln(1) = 1'
            note: "On cherche x0 tel que g(x0)=1 : x0=0 convient (0 appartient a I)."
          - math: 'g''(0) = f''(0) = \dfrac{1-0}{e^0-0} = 1 \ne 0'
            note: "Derivee de f en 0 (formule de la question 10), non nulle."
          - math: 'g \text{ derivable en } 0,\ g''(0)\ne0 \implies g^{-1} \text{ derivable en } g(0)=1, \quad \left(g^{-1}\right)''(1) = \dfrac{1}{g''(0)} = 1'
            note: "Theoreme de la derivee d'une reciproque (chapitre Derivabilite et etude de fonctions, hors socle de cette lecon)."
