entries:
  # ── bk-2019-n-x4 — 2019 N, Problème : étude de f avec ln, IPP, suite ──────
  # Même sujet que le sommet de leçon r-bac (exercises.yaml). Voir note éditoriale en tête.
  - id: bk-2019-n-x4
    title: "Étude d'une fonction avec ln, aire par intégration par parties et suite récurrente"
    source:
      year: 2019
      session: normale
      filiere: "SExp"
      exercise_label: "Problème"
    bareme_total: 11
    duration_min: 75
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national SExp BIOF (SVT et Sciences
        Physiques), Mathématiques (3 h, coef 7), code NS 22F, AlloSchool
        NS22F, element/68527 (Problème, 11 points, pages 3-4 du scan).
        Transcription fidèle de l'entrée « vérifié » de
        docs/sujets/maths/fonction-logarithme.md, section « 2019 — session
        normale — Problème » (re-fetch AlloSchool indépendant
        element/68527 → course-438/upload-54971 + diff caractère-par-
        caractère conforme au scan, y compris le tableau de variations et la
        figure, agent-vérificateur-adversarial, 2026-07-12). NB : ce même
        sujet sous-tend aussi le sommet de leçon r-bac (exercises.yaml,
        marqueur [[exercise:r-bac]] à R7) — recoupement assumé, voir note
        éditoriale en tête de fichier. Recoupe aussi `calcul-integral` (Q6,
        IPP) et `suites-numeriques` (deuxième partie).
    intro: |-
      **Problème (examen national, session normale 2019, Sciences Expérimentales).**

      Soit $f$ la fonction numérique définie sur $]0,+\infty[$ par :

      $$f(x) = x + \frac{1}{2} - \ln x + \frac{1}{2}(\ln x)^2$$

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i},\vec{j})$ *(unité : 1 cm)*.

      Point de vigilance qui traverse tout le problème : $\ln$ n'existe que sur $]0,+\infty[$, et $(\ln u)' = \dfrac{u'}{u}$ ne se lit que là où $u>0$. Garde en tête la hiérarchie des croissances vue en cours (chapitre 5) : $x$ écrase $\ln x$ à l'infini.

      La **première partie** étudie $f$ (limites, variations, convexité, position par rapport à la droite $(\Delta):y=x$, puis une aire). La **deuxième partie** exploite cette étude pour la suite $(u_n)$ définie par $u_0=1$ et $u_{n+1}=f(u_n)$.
    questions:
      - id: q1
        part: "Première partie — Limites, asymptote et branche parabolique"
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{\substack{x \to 0 \\ x > 0}} f(x)$ puis interpréter le résultat géométriquement.
        reasoning: |-
          En $0^+$, on examine chaque morceau de $f$ séparément : $x\to 0$ (fini), mais $\ln x \to -\infty$ (limite de référence, chapitre 5), donc $-\ln x\to+\infty$ et $(\ln x)^2\to+\infty$. Tous les termes qui bougent partent vers $+\infty$ — aucune indétermination, la somme suit. Une limite infinie en une borne finie du domaine se lit toujours de la même façon géométriquement : $x=0$ est asymptote verticale à $(C)$.
        steps:
          - math: '\lim_{x \to 0^+} \ln x = -\infty \implies \lim_{x \to 0^+} (\ln x)^2 = +\infty'
            note: "Limite de référence en 0+ (chapitre 5), au carré."
          - math: '\lim_{x \to 0^+} f(x) = \lim_{x \to 0^+}\left(x+\tfrac12-\ln x+\tfrac12(\ln x)^2\right) = +\infty'
            note: "Somme de termes qui partent tous vers +infini : pas d'indetermination. Asymptote verticale x=0."
      - id: q2
        stem: |-
          **(0,25 pt)** Vérifier que pour tout $x$ de $]0,+\infty[$, $f(x) = x + \dfrac{1}{2} + \left(\dfrac{1}{2}\ln x - 1\right)\ln x$.
        reasoning: |-
          Une vérification se fait dans le sens le plus sûr : on développe le membre proposé et on retombe sur $f$. Le facteur $\left(\frac12\ln x-1\right)\ln x$ se distribue en $\frac12(\ln x)^2-\ln x$ ; il ne reste qu'à ajouter $x+\frac12$.
        steps:
          - math: '\left(\tfrac12\ln x - 1\right)\ln x = \tfrac12(\ln x)^2 - \ln x'
            note: "On distribue le facteur sur ln x."
          - math: 'x+\tfrac12+\tfrac12(\ln x)^2-\ln x = x+\tfrac12-\ln x+\tfrac12(\ln x)^2 = f(x)'
            note: "On retrouve f(x) : égalité vérifiée."
      - id: q3
        stem: |-
          **(0,5 pt)** En déduire que $\displaystyle\lim_{x \to +\infty} f(x) = +\infty$.
        reasoning: |-
          La forme factorisée de la question précédente sert exactement à lever l'indétermination $\infty-\infty$ qui apparaîtrait sinon. Quand $x\to+\infty$, $\ln x\to+\infty$ (chapitre 5), donc $\frac12\ln x - 1 \to+\infty$ : le produit de deux facteurs tendant vers $+\infty$ tend vers $+\infty$, et $x+\frac12\to+\infty$ s'ajoute sans changer le sens.
        steps:
          - math: '\lim_{x\to+\infty}\left(\tfrac12\ln x - 1\right) = +\infty, \quad \lim_{x\to+\infty}\ln x = +\infty'
            note: "Les deux facteurs du produit tendent vers +infini."
          - math: '\lim_{x\to+\infty}\left(\tfrac12\ln x-1\right)\ln x = +\infty \implies \lim_{x\to+\infty} f(x) = +\infty'
            note: "Produit de deux termes vers +infini, plus x+1/2 vers +infini."
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x$ de $]0,+\infty[$, $\dfrac{(\ln x)^2}{x} = 4\left(\dfrac{\ln\sqrt{x}}{\sqrt{x}}\right)^2$ puis en déduire que $\displaystyle\lim_{x \to +\infty} \dfrac{(\ln x)^2}{x} = 0$.
        reasoning: |-
          On part du membre de droite : $\ln\sqrt x = \frac12\ln x$ (propriété racine carrée, chapitre 3) et $(\sqrt x)^2=x$. Le carré fait apparaître $\frac14\frac{(\ln x)^2}{x}$, et le facteur $4$ compense exactement ce quart. Une fois l'égalité posée, la limite se lit sur le carré de $\frac{\ln\sqrt x}{\sqrt x}$ : en posant $t=\sqrt x$ (qui tend vers $+\infty$ avec $x$), c'est $\left(\frac{\ln t}{t}\right)^2$, qui tend vers $0$ par croissances comparées (chapitre 5).
        steps:
          - math: '\ln\sqrt{x} = \tfrac12\ln x, \qquad (\sqrt{x})^2 = x'
            note: "Propriété racine carree (chapitre 3)."
          - math: '4\left(\dfrac{\ln\sqrt{x}}{\sqrt{x}}\right)^2 = 4\cdot\dfrac{\frac14(\ln x)^2}{x} = \dfrac{(\ln x)^2}{x}'
            note: "Le carré du 1/2 donne 1/4, compense par le facteur 4."
          - math: 't=\sqrt{x}\to+\infty, \quad \dfrac{\ln t}{t}\to 0 \implies \dfrac{(\ln x)^2}{x} = 4\left(\dfrac{\ln t}{t}\right)^2 \to 0'
            note: "Croissances comparees (chapitre 5) appliquees a t = racine de x."
      - id: q5
        stem: |-
          **(0,75 pt)** Montrer que $(C)$ admet au voisinage de $+\infty$ une branche parabolique de direction asymptotique la droite $(\Delta)$ d'équation $y = x$.
        reasoning: |-
          Une branche parabolique de direction $(\Delta):y=x$ demande deux vérifications : la pente $\frac{f(x)}{x}$ tend vers $1$ (la direction), mais l'écart $f(x)-x$ ne tend pas vers un réel fini — sinon $(\Delta)$ serait une vraie asymptote. Pour la pente, on divise chaque terme par $x$ et on utilise les croissances comparées : $\frac{\ln x}{x}\to0$ (chapitre 5) et $\frac{(\ln x)^2}{x}\to0$ (question précédente). Pour l'écart, $\frac12(\ln x)^2$ domine et pousse vers $+\infty$.
        steps:
          - math: '\dfrac{f(x)}{x} = 1+\dfrac{1}{2x}-\dfrac{\ln x}{x}+\dfrac{(\ln x)^2}{2x} \xrightarrow[x\to+\infty]{} 1'
            note: "Chaque terme sauf 1 tend vers 0 (croissances comparees) : la pente tend vers 1."
          - math: 'f(x)-x = \tfrac12-\ln x+\tfrac12(\ln x)^2 \xrightarrow[x\to+\infty]{} +\infty'
            note: "Le terme en (ln x) carré l'emporte : pas d'asymptote, branche parabolique de direction y=x."
      - id: q6
        part: "Première partie — Dérivée, variations et convexité"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x$ de $]0,1]$ : $(x-1) + \ln x \le 0$ et que pour tout $x$ de $[1,+\infty[$ : $(x-1) + \ln x \ge 0$.
        reasoning: |-
          On fixe le signe d'une expression par sa monotonie : soit $g(x)=x-1+\ln x$. $g'(x)=1+\frac1x>0$ sur $]0,+\infty[$ (somme de deux termes positifs), donc $g$ est strictement croissante. Comme $g(1)=0$, la stricte croissance fait tout le travail : avant $1$, $g$ est en dessous de $g(1)=0$ ; après $1$, au-dessus.
        steps:
          - math: 'g(x)=x-1+\ln x, \qquad g''(x) = 1+\dfrac1x > 0 \text{ sur } ]0,+\infty['
            note: "g strictement croissante."
          - math: 'g(1) = 1-1+\ln 1 = 0'
            note: "Zéro de g en x=1."
          - math: 'x\le 1 \implies g(x)\le 0 \qquad ; \qquad x\ge 1 \implies g(x)\ge 0'
            note: "Lecture directe de la stricte croissance autour du zéro."
      - id: q7
        stem: |-
          **(1 pt)** Montrer que pour tout $x$ de $]0,+\infty[$, $f'(x) = \dfrac{x - 1 + \ln x}{x}$.
        reasoning: |-
          On dérive terme à terme, en traitant $\frac12(\ln x)^2$ comme une composée : $(\ln u)'=\frac{u'}{u}$ étendu au carré (chapitre 4) donne $\left(\frac12u^2\right)'=u'u$ avec $u=\ln x$, $u'=\frac1x$, soit $\frac{\ln x}{x}$. Les deux autres termes donnent $1$ et $-\frac1x$. On réduit au même dénominateur $x$.
        steps:
          - math: 'f''(x) = 1-\dfrac1x+\dfrac{\ln x}{x}'
            note: "Dérivée de x, -ln x, et 1/2 (ln x) carré (règle (ln u)'=u'/u, chapitre 4)."
          - math: 'f''(x) = \dfrac{x-1+\ln x}{x}'
            note: "Réduction au même dénominateur x."
      - id: q8
        stem: |-
          **(0,5 pt)** Dresser le tableau de variations de la fonction $f$.
        reasoning: |-
          Le dénominateur de $f'(x)$ est $x>0$ : le signe de $f'$ est donc celui du numérateur $x-1+\ln x$, connu par la question précédente (négatif sur $]0,1]$, positif sur $[1,+\infty[$, nul en $1$). On lit les variations : $f$ décroît sur $]0,1]$, croît sur $[1,+\infty[$, avec un minimum en $x=1$. On complète avec les limites déjà établies ($+\infty$ en $0^+$ et en $+\infty$) et $f(1)=1+\frac12-0+0=\frac32$.
        steps:
          - math: 'f''(x)=\dfrac{x-1+\ln x}{x}, \quad x>0 \implies \text{signe}(f'') = \text{signe}(x-1+\ln x)'
            note: "Dénominateur positif : le signe est celui du numérateur (question précédente)."
          - math: 'f(1) = 1+\tfrac12-\ln 1+\tfrac12(\ln 1)^2 = \tfrac32'
            note: "Minimum de f, atteint en x=1 : f décroît de +infini a 3/2, puis croit de 3/2 a +infini."
      - id: q9
        stem: |-
          **(0,5 pt)** Montrer que $f''(x) = \dfrac{2 - \ln x}{x^2}$ pour tout $x$ de $]0,+\infty[$.
        reasoning: |-
          On dérive $f'(x)=1-\frac1x+\frac{\ln x}{x}$. Le terme $-\frac1x$ donne $\frac1{x^2}$. Le terme $\frac{\ln x}{x}$ est un quotient : $\left(\frac{\ln x}{x}\right)'=\frac{\frac1x\cdot x-\ln x}{x^2}=\frac{1-\ln x}{x^2}$ (dérivée d'un quotient, hors socle de cette leçon — vu au chapitre « Dérivabilité et étude des fonctions »). On additionne et on regroupe sur $x^2$.
        steps:
          - math: 'f''''(x) = \dfrac{1}{x^2}+\dfrac{1-\ln x}{x^2}'
            note: "Dérivée de -1/x, plus dérivée du quotient ln x sur x."
          - math: 'f''''(x) = \dfrac{2-\ln x}{x^2}'
            note: "On regroupe les numérateurs."
      - id: q10
        stem: |-
          **(0,5 pt)** En déduire que $(C)$ admet un point d'inflexion dont on déterminera les coordonnées.
        reasoning: |-
          Un point d'inflexion est un point où $f''$ change de signe. Le dénominateur $x^2>0$ ne change jamais de signe : tout dépend du numérateur $2-\ln x$, qui s'annule en $x=e^2$ en passant du positif au négatif. La convexité change bien là : c'est un point d'inflexion. On calcule l'ordonnée en remplaçant $\ln(e^2)=2$.
        steps:
          - math: 'f''''(x)=0 \iff \ln x = 2 \iff x=e^2'
            note: "f'' change de signe en x = e au carré : point d'inflexion."
          - math: 'f(e^2) = e^2+\tfrac12-2+\tfrac12\cdot 2^2 = e^2+\tfrac12'
            note: "ln(e^2)=2. Point d'inflexion I(e^2 , e^2 + 1/2)."
      - id: q11
        part: "Première partie — Position relative et aire"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x$ de $]0,+\infty[$, $f(x) - x = \dfrac{1}{2}(\ln x - 1)^2$ et déduire la position relative de $(C)$ et $(\Delta)$.
        reasoning: |-
          On calcule $f(x)-x=\frac12-\ln x+\frac12(\ln x)^2$ et on y reconnaît un carré : $(\ln x)^2-2\ln x+1=(\ln x-1)^2$. Un carré est toujours $\ge0$, donc $f(x)\ge x$ : $(C)$ reste au-dessus de $(\Delta)$ sur tout le domaine, avec contact seulement quand le carré est nul, c'est-à-dire $\ln x=1$, soit $x=e$.
        steps:
          - math: 'f(x)-x = \tfrac12-\ln x+\tfrac12(\ln x)^2 = \tfrac12\left[(\ln x)^2-2\ln x+1\right] = \tfrac12(\ln x-1)^2'
            note: "Identité remarquable : carré parfait."
          - math: '\tfrac12(\ln x-1)^2 \ge 0 \implies f(x)\ge x, \quad \text{égalité} \iff x=e'
            note: "(C) au-dessus de (Delta) partout, contact unique en (e,e)."
      - id: q12
        stem: |-
          **(1 pt)** Construire $(\Delta)$ et $(C)$ dans le même repère $(O,\vec{i},\vec{j})$.
        reasoning: |-
          On ne construit pas au hasard : on reporte les éléments déjà établis. La droite $(\Delta):y=x$ d'abord. Pour $(C)$ : l'asymptote verticale $x=0$ (question 1), le minimum $\left(1,\frac32\right)$ (question sur les variations), le point d'inflexion $I\left(e^2,e^2+\frac12\right)$ (question précédente), le fait que $(C)$ reste au-dessus de $(\Delta)$ en la touchant seulement en $(e,e)$, et la branche parabolique de direction $(\Delta)$ au voisinage de $+\infty$ (la courbe s'écarte de plus en plus au-dessus de la première bissectrice). $(C)$ descend de $+\infty$ le long de $x=0$ jusqu'au minimum en $1$, puis remonte en restant au-dessus de $(\Delta)$.
      - id: q13
        stem: |-
          **(0,5 pt)** Montrer que la fonction $H : x \mapsto x\ln x - x$ est une primitive de la fonction $h : x \mapsto \ln x$ sur $]0,+\infty[$.
        reasoning: |-
          Montrer que $H$ est une primitive de $h$, c'est vérifier $H'=h$. On dérive $x\ln x$ comme un produit : $(x\ln x)'=1\cdot\ln x+x\cdot\frac1x=\ln x+1$ (règle du produit, hors socle de cette leçon). En retirant la dérivée de $-x$, qui vaut $-1$, il reste $\ln x$.
        steps:
          - math: '(x\ln x)'' = \ln x + x\cdot\dfrac1x = \ln x+1'
            note: "Dérivée d'un produit u=x, v=ln x."
          - math: 'H''(x) = (\ln x+1)-1 = \ln x = h(x)'
            note: "H'=h sur ]0,+infini[ : H est une primitive de h."
      - id: q14
        stem: |-
          **(0,75 pt)** À l'aide d'une intégration par parties, montrer que $\displaystyle\int_1^e (\ln x)^2\, dx = e - 2$.
        reasoning: |-
          L'intégration par parties (technique du chapitre « Calcul intégral ») lit $(\ln x)^2=\ln x\cdot\ln x$ : on dérive $u=\ln x$ (plus simple, $u'=\frac1x$) et on primitive $v'=\ln x$ en $v=H(x)=x\ln x-x$ (question précédente). Le crochet $\big[\ln x\,(x\ln x-x)\big]_1^e$ s'annule aux deux bornes ($\ln e=1$ et $e-e=0$ ; $\ln1=0$). Il reste $-\int_1^e\frac1x(x\ln x-x)\,dx=-\int_1^e(\ln x-1)\,dx$, qu'on calcule avec $H$.
        steps:
          - math: 'u=\ln x,\ u''=\dfrac1x\ ; \quad v''=\ln x,\ v=H(x)=x\ln x-x'
            note: "Choix IPP : dériver ln x, primitiver ln x via H."
          - math: '\int_1^e(\ln x)^2\,dx = \big[\ln x\,(x\ln x-x)\big]_1^e - \int_1^e\dfrac1x(x\ln x-x)\,dx'
            note: "Formule de l'IPP. Le crochet vaut 0 aux deux bornes."
          - math: '\int_1^e(\ln x-1)\,dx = \big[x\ln x-2x\big]_1^e = (e-2e)-(0-2) = 2-e'
            note: "Une primitive de ln x - 1 est x ln x - 2x."
          - math: '\int_1^e(\ln x)^2\,dx = 0-(2-e) = e-2'
            note: "Crochet nul moins (2-e)."
      - id: q15
        stem: |-
          **(0,5 pt)** Calculer en $\text{cm}^2$ l'aire du domaine plan limité par $(C)$ et $(\Delta)$ et les droites d'équations $x = 1$ et $x = e$.
        reasoning: |-
          Sur $[1,e]$, $(C)$ est au-dessus de $(\Delta)$ (question sur la position relative), donc l'aire vaut $\int_1^e(f(x)-x)\,dx=\int_1^e\frac12(\ln x-1)^2\,dx$. On développe le carré et on réutilise $\int_1^e(\ln x)^2\,dx=e-2$ (question précédente) et $\int_1^e\ln x\,dx=[H]_1^e=1$. Le repère étant orthonormé d'unité $1$ cm, une unité d'aire vaut $1\ \text{cm}^2$.
        steps:
          - math: '\mathcal{A} = \int_1^e(f(x)-x)\,dx = \int_1^e\left(\tfrac12(\ln x)^2-\ln x+\tfrac12\right)dx'
            note: "(C) au-dessus de (Delta) sur [1,e] : aire = intégrale de f(x)-x."
          - math: '\int_1^e \ln x\,dx = \big[x\ln x-x\big]_1^e = (e-e)-(0-1) = 1'
            note: "Avec la primitive H."
          - math: '\mathcal{A} = \tfrac12(e-2)-1+\tfrac12(e-1) = e-\tfrac52'
            note: "En réutilisant les deux intégrales de référence."
          - math: '\mathcal{A} = \left(e-\tfrac52\right)\text{cm}^2 \approx 0{,}22\ \text{cm}^2'
            note: "Unité orthonormee 1 cm : aire positive, comme attendu."
      - id: q16
        part: "Deuxième partie — La suite $u_0=1$, $u_{n+1}=f(u_n)$"
        stem: |-
          Soit $(u_n)$ la suite numérique définie par : $u_0 = 1$ et $u_{n+1} = f(u_n)$ pour tout $n$ de $\mathbb{N}$.

          **(0,5 pt)** Montrer par récurrence que $1 \le u_n \le e$ pour tout $n$ de $\mathbb{N}$.
        reasoning: |-
          Récurrence d'encadrement classique pour $u_{n+1}=f(u_n)$ (chapitre « Suites numériques »). Initialisation : $u_0=1$ vérifie $1\le1\le e$. Hérédité : on suppose $1\le u_n\le e$, et on exploite que $f$ est croissante sur $[1,e]$ (établi dans le tableau de variations, valable car $[1,e]\subset[1,+\infty[$) : $f(1)\le f(u_n)\le f(e)$. Avec $f(1)=\frac32$ et $f(e)=e+\frac12-1+\frac12=e$, on obtient $\frac32\le u_{n+1}\le e$, et comme $\frac32\ge1$, l'encadrement passe au rang $n+1$.
        steps:
          - math: '\text{Initialisation\,: } u_0=1, \quad 1\le1\le e \ \checkmark'
            note: "Rang 0."
          - math: 'f \text{ croissante sur } [1,e] \implies f(1)\le f(u_n)\le f(e)'
            note: "Monotonie de f appliquee a l'hypothèse de récurrence."
          - math: 'f(1)=\tfrac32, \quad f(e)=e \implies 1\le\tfrac32\le u_{n+1}\le e'
            note: "f(e)=e car ln e=1. L'encadrement passe au rang n+1."
      - id: q17
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_n)$ est croissante.
        reasoning: |-
          On étudie le signe de $u_{n+1}-u_n=f(u_n)-u_n$. C'est exactement la différence calculée plus haut : $f(x)-x=\frac12(\ln x-1)^2\ge0$. Appliquée à $x=u_n$, elle donne $u_{n+1}-u_n\ge0$.
        steps:
          - math: 'u_{n+1}-u_n = f(u_n)-u_n = \tfrac12(\ln u_n-1)^2 \ge 0'
            note: "Reutilisation de f(x)-x = 1/2 (ln x - 1) carré, un carré donc positif."
      - id: q18
        stem: |-
          **(0,5 pt)** En déduire que la suite $(u_n)$ est convergente.
        reasoning: |-
          $(u_n)$ est croissante (question précédente) et majorée par $e$ (question sur l'encadrement) : le théorème de convergence monotone (chapitre « Suites numériques ») conclut directement.
        steps:
          - math: '(u_n) \text{ croissante et majoree par } e \implies (u_n) \text{ converge}'
            note: "Théorème de la convergence monotone."
      - id: q19
        stem: |-
          **(0,75 pt)** Calculer la limite de la suite $(u_n)$.
        reasoning: |-
          Notons $\ell$ la limite. En passant l'encadrement $1\le u_n\le e$ à la limite, $\ell\in[1,e]$, en particulier $\ell>0$. Comme $f$ est continue (composée/somme de fonctions continues sur $]0,+\infty[$) et $u_{n+1}=f(u_n)$, en passant à la limite : $\ell=f(\ell)$. Or $f(\ell)=\ell\iff\frac12(\ln\ell-1)^2=0\iff\ln\ell=1\iff\ell=e$, et $e\in[1,e]$.
        steps:
          - math: '1\le u_n\le e \implies \ell\in[1,e]\ ; \quad u_{n+1}=f(u_n), f \text{ continue} \implies \ell=f(\ell)'
            note: "La limite est un point fixe de f, dans [1,e]."
          - math: 'f(\ell)=\ell \iff \tfrac12(\ln\ell-1)^2=0 \iff \ell=e'
            note: "Reutilisation de f(x)-x = 1/2 (ln x -1) carré. Comme e appartient a [1,e] : lim u_n = e."

