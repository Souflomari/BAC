          **La formule du quotient.**

          $$f'(x) = \frac{N'(x)\,x^2 - N(x)\cdot 2x}{x^4} = \frac{N'(x)\,x - 2N(x)}{x^3}$$

          (on a simplifié par $x$ au numérateur et au dénominateur, licite car $x\ne0$).

