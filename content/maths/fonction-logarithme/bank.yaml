            note: "Développement du produit avant de passer a la limite."
          - math: '\lim_{x\to0^+}\ln(1+x) = 0, \qquad \lim_{x\to0^+}\dfrac{\ln(1+x)}{x} = 1 \quad (\text{dérivée de ln en 1})'
            note: "Deux limites de référence : l'une par continuité de ln, l'autre par dérivabilité de ln en 1."
          - math: '\lim_{x\to0^+} F(x) = 2\ln2-1'
            note: "Report des deux limites dans l'expression de F trouvée en 2-a."
          - math: 'F \text{ continue en } 0 \ (\text{question 1}) \implies F(0) = \lim_{x\to0^+}F(x), \quad F(0)=\int_0^1 f(t)\,dt \implies \boxed{\int_0^1 f(t)\,dt = 2\ln2-1}'
            note: "Continuité de F en 0, puis identification de F(0) a l'intégrale demandee."
      - id: q9c
        stem: |-
          **2- c)** (0,5 pt) Calculer, en $cm^2$, l'aire du domaine plan limité par la courbe $(C)$, l'axe des abscisses, l'axe des ordonnées et la droite d'équation $x = 1$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'aire sous une courbe entre deux abscisses est une intégrale, à condition que la courbe reste au-dessus de l'axe des abscisses sur l'intervalle considéré — un point à justifier, pas à supposer.

          **Le signe de $f$ sur $[0,1]$.** $f$ est strictement décroissante sur $I$ (Partie B, question 2-d), de $f(0)=\dfrac12$ à $f(1)=1-\ln2\approx0{,}307$ : les deux valeurs extrêmes sur $[0,1]$ sont strictement positives, donc $f(x)>0$ pour tout $x\in[0,1]$.

          **L'aire, en unités d'aire.** Comme $f\ge0$ sur $[0,1]$, l'aire du domaine limité par $(C)$, l'axe des abscisses, l'axe des ordonnées et la droite $x=1$ vaut :

          $$\mathcal{A} = \int_0^1 f(t)\,dt = 2\ln2-1 \quad \text{(question 2-b)}$$

          en unités d'aire.

          **La conversion en $cm^2$.** Le repère est orthonormé avec $\|\vec i\|=\|\vec j\|=2\,\text{cm}$ (Partie B) : une unité d'aire vaut $\|\vec i\|\times\|\vec j\| = 2\,\text{cm}\times2\,\text{cm} = 4\,\text{cm}^2$.

          **Conclusion.**

          $$\boxed{\mathcal{A} = (2\ln2-1)\times4 = (8\ln2-4)\ \text{cm}^2}$$

          Numériquement, $\mathcal{A} \approx 0{,}386 \times 4 \approx 1{,}55\ \text{cm}^2$ — une aire modeste, cohérente avec une courbe qui reste sous $y=\dfrac12$ sur tout $[0,1]$.

          **Le piège nommé de cette question.** Oublier la conversion d'unités d'aire en $cm^2$ : sur un repère où $\|\vec i\|\ne\|\vec j\|\ne1\,\text{cm}$, une unité d'aire graphique n'est PAS un $cm^2$ — le facteur de conversion est le produit des deux échelles, jamais l'une seule.
