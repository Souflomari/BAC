# FLAG DE JUMELAGE — bk-2023-n-x1 face à bk-2023-r-x1 et bk-2024-r-x1
# (ci-dessous). Les trois sont des problèmes d'analyse SM à quatre exercices
# indépendants, bâtis sur une suite avec une majoration géométrique. Mais la
# ressemblance s'arrête au vocabulaire ; le mécanisme diffère sur les trois
# points qui comptent :
#   — 2023 R et 2024 R étudient une FAMILLE de fonctions indexée par $n$
#     ($f_n$), avec une suite définie soit par évaluation en un point fixe
#     ($u_n=f_n(\beta)$), soit IMPLICITEMENT par une équation $f_n(x_n)=1$ ou
#     $f_n(\alpha_n)=0$ ; leur limite se détermine par un raisonnement PAR
#     L'ABSURDE (deux expressions de la même limite qui se contredisent).
#   — 2023 N (cette entrée) étudie UNE SEULE fonction fixe $f$ ; le "$n$" de
#     Partie III n'indexe aucune famille de fonctions mais les ITÉRÉS d'une
#     récurrence $u_{n+1}=\tfrac13 f(u_n)$ — une itération de point fixe
#     (méthode de Picard), technique absente des deux autres entrées. Sa
#     limite $\alpha$ n'est pas cherchée par l'absurde : elle est le point
#     fixe de $F=\tfrac13 f$, obtenu par TVI + stricte monotonie dès la
#     Partie III q1, et la convergence de $(u_n)$ vers ce point fixe se
#     démontre par une majoration géométrique EXPLICITE de la vitesse de
#     convergence ($|u_n-\alpha|\le 2^{-n}|\beta-\alpha|$), obtenue par le TAF
#     — un outil et une structure de preuve qu'aucune des deux autres
#     entrées n'emploie.
#   — 2023 N est en outre la seule des trois en session NORMALE (2023 R et
#     2024 R sont toutes deux en rattrapage), et la seule bâtie en deux
#     fonctions superposées : $g(x)=\ln(1+x)/x$ d'abord encadrée (Partie I),
#     puis $f(x)=g(x)e^{-x}$ construite dessus (Partie II) — une construction
#     en cascade que ni 2023 R ni 2024 R ne pratiquent.
# Garder les trois : elles enseignent trois usages différents du même
# vocabulaire (« suite indexée par $n$ », « limite par majoration ou par
# l'absurde »), précisément ce qui prévient la mémorisation d'un seul patron.
#
