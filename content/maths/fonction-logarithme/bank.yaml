#   italique) -> alpha · ò (0xF2) -> signe integrale · å (0xE5) -> signe
#   somme · æ ç è ö ÷ ø -> les six fragments d'une parenthese extensible ·
#   « p,+¥[ » -> ]0,+infini[ (le « p » n'est pas un crochet seul : c'est le
#   crochet ] ET le chiffre 0 en chevauchement de crenage — le zero est
#   bien imprime).
#
# TROIS FAITS DE CETTE VÉRIFICATION, CONSIGNÉS ICI PARCE QU'ILS SONT
# CONTRE-INTUITIFS :
#   1. LE GLYPHE ¥ NE DISCRIMINE PAS : il vaut tantôt N (mathbb{N}) tantôt
#      +infini SELON LE CONTEXTE SEUL, jamais selon sa forme (les deux
#      rôles rendent le même glyphe, corrélation mesurée 0,90). Compté
#      EXHAUSTIVEMENT sur le sujet entier : 18 occurrences, dont 5 en
#      +infini et 13 en N/N*. (Une première estimation avait dit « une
#      dizaine » : compter n'est pas estimer — c'est le compte exhaustif
#      qui fait foi.) Règle de départage vérifiée sans exception sur les
#      18 : précédé d'un « + » et enfermé dans des crochets => +infini ;
#      suit un « in » ou un « de » => N.
#   2. LE Δ DE LA PARTIE E EST ADJUGÉ PAR DÉCODAGE, PAS PAR LA FORME DE LA
#      LETTRE — la police du scan est détruite, un Δ ne peut littéralement
#      pas s'y montrer. Le glyphe qui indexe Δ_k (et compose
#      S_n = somme des Δ_k) avait été lu par une première passe comme un D
#      latin ; c'est faux. Trois indices convergents établissent Δ_k :
#      décodage Symbol (0x44 = Δ), contraste romain droit/italique
#      identique à celui du α de la Partie C, et identité au pixel près
#      (19×20 px, écart moyen 0,09/255) avec le Δ du discriminant de
#      l'exercice 2 du même sujet. C'EST LA SEULE CERTITUDE INFÉRENTIELLE
#      DU DOSSIER, pas une lecture visuelle directe. AUCUN RISQUE
#      PÉDAGOGIQUE N'Y EST ATTACHÉ : la Partie E ne change pas d'un iota
#      selon qu'on écrive D_k ou Δ_k — mêmes bornes, même démonstration —
#      le point est consigné pour l'honnêteté du dossier, pas comme réserve
#      sur l'exploitabilité de l'exercice. Pour cette raison, le
#      `reasoning` des questions de la Partie E ci-dessous reste focalisé
#      sur les mathématiques et NE reprend PAS cette archéologie de scan :
#      elle est consignée ici, pas devant l'élève.
#   3. AUCUNE IDENTITÉ IMPRIMÉE N'EST FAUSSE, AUCUNE DONNÉE NE MANQUE :
#      toutes les questions sont résolubles avec le seul énoncé transcrit —
#      la substitution de police, aussi massive soit-elle, ne touche AUCUNE
#      valeur numérique (barèmes, bornes, exposants, dénominateurs, tous
#      relus sur l'image).
#
# SCOPE NOTE (cross-lists nommés au point d'usage dans le `reasoning` de
# chaque question concernée, jamais supposés acquis du socle R0–R6 de cette
# leçon) : `limites-continuite` (Partie B-1 tout entière — la continuité à
# droite de B-1-a et la limite en +infini de B-1-c) ;
# `derivabilite-etude-fonctions` (B-1-b, B-2 et B-3 tout entières —
# dérivabilité à droite, expression de f', encadrement de g, sens de
# variation, tableau, tangente, existence-unicité d'un point fixe par TVI
# en Partie C-1) ; `suites-numeriques` (Partie C-2 et Partie E tout
# entières — la suite itérée u_{n+1}=f(u_n) et la somme télescopique S_n) ;
# `calcul-integral` (Partie D tout entière — F(x), l'intégration par
# parties, l'aire — et Partie E, qui réutilise l'intégrale de f sur
# [k,k+1] comme une moyenne). Contrairement aux deux autres entrées SM de
# ce fichier (bk-2023-n-x1, bk-2024-n-x1, juste en dessous), ce problème ne
# mobilise ni fonction exponentielle ni théorème des accroissements finis :
# chaque limite délicate s'y résout par encadrement direct (Partie A, puis
# son intégration), jamais par un TAF ni par un facteur exponentiel — un
# quatrième patron de résolution dans le corpus SM, à ne pas confondre avec
# les trois autres.

