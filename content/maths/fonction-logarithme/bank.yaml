            note: "Traduction geometrique directe."
          - math: 'g<0 \text{ sur } ]0,\alpha[ \text{ et } ]1,+\infty[ \implies (\Delta) \text{ au-dessus de } (C_f) \text{ sur ces intervalles}'
            note: "Meme traduction, signe oppose."
      - id: q11
