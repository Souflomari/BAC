      - id: q12
        part: "Partie 5 — Primitive, intégration par parties et aire"
        stem: |-
          **(0,5 pt)** Vérifier que la fonction $x \mapsto 2x - x\ln x$ est une primitive de la fonction $x \mapsto 1 - \ln x$ sur $[\alpha,1]$.
        reasoning: |-
          On dérive $F(x)=2x-x\ln x$ : $F'(x)=2-\left(\ln x+x\cdot\frac1x\right)=2-\ln x-1=1-\ln x$ (dérivée d'un produit pour $x\ln x$, hors socle de cette leçon). C'est exactement la fonction annoncée.
        steps:
          - math: 'F(x)=2x-x\ln x, \quad F''(x) = 2-\left(\ln x + x\cdot\dfrac1x\right) = 2-\ln x-1'
            note: "Derivee d'un produit pour x ln x."
          - math: 'F''(x) = 1-\ln x'
            note: "F est bien une primitive de 1 - ln x sur [alpha,1]."
      - id: q13
        stem: |-
          **(1 pt)** En utilisant une intégration par parties, montrer que $\displaystyle\int_\alpha^1 (1 - \ln x)^2\, dx = 5(1 - \alpha) + \alpha(4 - \ln\alpha)\ln\alpha$.
        reasoning: |-
          On lit $(1-\ln x)^2=(1-\ln x)\cdot(1-\ln x)$ : on dérive $u=1-\ln x$ ($u'=-\frac1x$) et on primitive $v'=1-\ln x$ en $v=F(x)=2x-x\ln x$ (question précédente) — technique d'IPP du chapitre « Calcul intégral ». Le crochet $\big[(1-\ln x)(2x-x\ln x)\big]_\alpha^1$ vaut $2$ en $x=1$ (car $\ln1=0$). Il reste $+\int_\alpha^1(2x-x\ln x)\cdot\frac1x\,dx=\int_\alpha^1(2-\ln x)\,dx$, dont une primitive est $3x-x\ln x$.
        steps:
          - math: 'u=1-\ln x,\ u''=-\dfrac1x\ ; \quad v''=1-\ln x,\ v=F(x)=2x-x\ln x'
            note: "Choix IPP : deriver 1-ln x, primitiver 1-ln x via F (question precedente)."
          - math: '\int_\alpha^1(1-\ln x)^2 dx = \big[(1-\ln x)(2x-x\ln x)\big]_\alpha^1 + \int_\alpha^1(2-\ln x)\,dx'
            note: "Formule de l'IPP : le u prime negatif transforme le moins en plus."
          - math: '\big[(1-\ln x)(2x-x\ln x)\big]_\alpha^1 = 2 - \alpha(1-\ln\alpha)(2-\ln\alpha) = 2-2\alpha+3\alpha\ln\alpha-\alpha(\ln\alpha)^2'
            note: "Valeur en 1 : (1-0)(2-0)=2. Valeur en alpha developpee."
          - math: '\int_\alpha^1(2-\ln x)\,dx = \big[3x-x\ln x\big]_\alpha^1 = 3-(3\alpha-\alpha\ln\alpha) = 3-3\alpha+\alpha\ln\alpha'
            note: "Primitive de 2 - ln x : 3x - x ln x."
          - math: '\int_\alpha^1(1-\ln x)^2 dx = 5-5\alpha+4\alpha\ln\alpha-\alpha(\ln\alpha)^2 = 5(1-\alpha)+\alpha(4-\ln\alpha)\ln\alpha'
            note: "Somme des deux morceaux, factoree."
      - id: q14
        stem: |-
          **(0,75 pt)** Déduire en fonction de $\alpha$ l'aire de la partie du plan délimitée par la courbe $(C_f)$, l'axe des abscisses et les droites d'équations $x = \alpha$ et $x = 1$.
        reasoning: |-
          Sur $[\alpha,1]$, $(\Delta):y=x$ est en dessous de $(C_f)$ (question 10), et $y=x>0$ sur ce domaine puisque $x>0$ ; donc $f(x)\ge x>0$ sur $[\alpha,1]$ : $(C_f)$ reste au-dessus de l'axe des abscisses, pas besoin de valeur absolue. L'aire est $\int_\alpha^1 f(x)\,dx$, qu'on décompose en trois morceaux élémentaires, dont le carré $(1-\ln x)^2$ calculé à la question précédente.
        steps:
          - math: '\int_\alpha^1 f(x)\,dx = \int_\alpha^1 2\,dx - \int_\alpha^1\dfrac2x\,dx + \int_\alpha^1(1-\ln x)^2\,dx'
            note: "On decompose f(x) = 2 - 2/x + (1-ln x) carre (position au-dessus de l'axe garantie par la question 10)."
          - math: '\int_\alpha^1 2\,dx = 2(1-\alpha), \qquad \int_\alpha^1\dfrac2x\,dx = 2\big[\ln x\big]_\alpha^1 = -2\ln\alpha'
            note: "Deux integrales elementaires."
          - math: '\mathcal{A} = 2(1-\alpha)+2\ln\alpha+5(1-\alpha)+\alpha(4-\ln\alpha)\ln\alpha'
            note: "On reutilise le resultat de la question precedente pour le troisieme morceau."
          - math: '\mathcal{A} = 7(1-\alpha) + 2(1+2\alpha)\ln\alpha - \alpha(\ln\alpha)^2 \quad \text{cm}^2'
            note: "Regroupement final en fonction de alpha (aire en cm carre, repere orthonorme unite 1 cm)."
      - id: q15
        part: "Partie 6 — La suite (u_n)"
        stem: |-
          Soit la suite numérique $(u_n)$ définie par $u_0 \in ]\alpha,1[$ et la relation $u_{n+1} = f(u_n)$, pour tout $n \in \mathbb{N}$.

          **(0,5 pt)** Montrer par récurrence que $\alpha < u_n < 1$, pour tout $n$ de $\mathbb{N}$.
        reasoning: |-
          Le point clé : $\alpha$ et $1$ sont tous deux des zéros de $g=f(x)-x$ (donnés dans l'énoncé), donc des points fixes de $f$ : $f(\alpha)=\alpha$ et $f(1)=1$ (déjà calculé, question 6). Comme $f$ est strictement croissante sur $]0,+\infty[$ (question 6), pour $x\in]\alpha,1[$ : $f(\alpha)<f(x)<f(1)$, c'est-à-dire $\alpha<f(x)<1$. Initialisation : $u_0\in]\alpha,1[$ donné. Hérédité : si $\alpha<u_n<1$, la stricte croissance donne $\alpha=f(\alpha)<f(u_n)<f(1)=1$, soit $\alpha<u_{n+1}<1$.
        steps:
          - math: 'f(\alpha)=\alpha, \quad f(1)=1 \quad (\alpha \text{ et } 1 \text{ sont des zeros de } g=f(x)-x)'
            note: "Points fixes de f, donnes par l'enonce de la question 9."
          - math: '\alpha<u_n<1, \ f \text{ strict. croissante} \implies f(\alpha)<f(u_n)<f(1) \implies \alpha<u_{n+1}<1'
            note: "On applique la stricte croissance de f (question 6) a l'hypothese de recurrence."
      - id: q16
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_n)$ est croissante. *(on peut utiliser la question 4) b))*
        reasoning: |-
          $u_{n+1}-u_n=f(u_n)-u_n=g(u_n)$. La question 10 donne $(\Delta)$ en dessous de $(C_f)$ sur $[\alpha,1]$, c'est-à-dire $g>0$ sur cet intervalle. Comme $u_n\in]\alpha,1[$ (question précédente), $g(u_n)>0$, donc $u_{n+1}>u_n$.
        steps:
          - math: 'u_{n+1}-u_n = f(u_n)-u_n = g(u_n)'
            note: "Difference consecutive = g evaluee en u_n."
          - math: 'u_n\in\,]\alpha,1[ \text{ et } g>0 \text{ sur } ]\alpha,1[ \ (\text{question 9-10}) \implies g(u_n)>0 \implies u_{n+1}>u_n'
            note: "(u_n) est croissante."
      - id: q17
        stem: |-
          **(0,75 pt)** En déduire que la suite $(u_n)$ est convergente et calculer sa limite.
        reasoning: |-
          $(u_n)$ est croissante (question précédente) et majorée par $1$ (question sur l'encadrement) : elle converge, vers une limite $\ell$ avec $\ell\le1$ (passage à la limite dans $u_n<1$) et $\ell\ge u_0>\alpha$ (suite croissante à partir de $u_0$). Comme $f$ est continue et $u_{n+1}=f(u_n)$, $\ell$ vérifie $\ell=f(\ell)$, c'est-à-dire $g(\ell)=0$. Les seuls zéros de $g$ sur $]0,+\infty[$ sont $\alpha$ et $1$ (donnés) ; comme $\ell>\alpha$, il reste $\ell=1$.
        steps:
          - math: '(u_n) \text{ croissante et majoree par } 1 \implies (u_n) \text{ converge vers } \ell, \quad \ell>\alpha, \ \ell\le1'
            note: "Theoreme de la convergence monotone ; u_0 > alpha et suite croissante donnent la limite > alpha."
          - math: '\ell=f(\ell) \iff g(\ell)=0 \iff \ell=\alpha \text{ ou } \ell=1'
            note: "Les seuls zeros de g sont alpha et 1 (donnes dans l'enonce)."
          - math: '\ell>\alpha \implies \ell = 1'
            note: "On elimine alpha : la limite de la suite est 1."

  # ── bk-2021-n-x4 — 2021 N, Problème : f prolongee en 0, minimum/inegalite, reciproque, h par morceaux ──
  - id: bk-2021-n-x4
    title: "Étude d'une fonction avec ln prolongée en 0, minimum et inégalité, fonction réciproque et fonction par morceaux"
    source:
