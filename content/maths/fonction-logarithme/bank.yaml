    intro: |-
      **Problème (examen national, session normale 2024, Sciences Expérimentales).**

      **Partie I.** On considère les deux fonctions $u$ et $v$ définies sur $\mathbb{R}$ par : $u(x) = e^x$ et $v(x) = x$.

      **Partie II.** On considère la fonction numérique $f$ définie par $f(x) = x + 1 - \ln\left(e^x - x\right)$.

      Point de vigilance qui traverse tout le problème : la Partie I n'est pas un hors-d'œuvre isolé — elle sert à garantir que $e^x-x>0$ pour tout $x$ réel, condition sans laquelle $\ln(e^x-x)$ de la Partie II n'aurait aucun sens (rappel du chapitre 2 : $\ln$ n'existe que sur $]0,+\infty[$).
    questions:
      - id: q1
        part: "Partie I — Comparer u(x)=e^x et v(x)=x, puis une aire"
        stem: |-
          **(0,5 pt)** Tracer dans un même repère orthonormé les courbes $(\mathcal{C}_u)$ et $(\mathcal{C}_v)$ des fonctions $u$ et $v$.
        reasoning: |-
          $(\mathcal{C}_v)$ est la droite $y=x$, la première bissectrice. $(\mathcal{C}_u)$ est la courbe de l'exponentielle (chapitre « Fonction exponentielle », hors socle de cette leçon) : elle passe par $(0,1)$, est strictement croissante, tend vers $0$ en $-\infty$ (asymptote horizontale) et vers $+\infty$ en $+\infty$, en restant strictement au-dessus de $(\mathcal{C}_v)$ — c'est justement ce que la question suivante demande de justifier.
      - id: q2
        stem: |-
          **(0,25 pt)** Justifier graphiquement que $e^x - x > 0$ pour tout $x$ de $\mathbb{R}$.
        reasoning: |-
          Sur le tracé de la question précédente, $(\mathcal{C}_u)$ reste strictement au-dessus de $(\mathcal{C}_v)$ pour tout $x$ réel — les deux courbes ne se croisent jamais. Lire graphiquement $u(x)>v(x)$ pour tout $x$, c'est lire $e^x>x$, c'est-à-dire $e^x-x>0$.
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer l'aire de la partie du plan délimitée par la courbe $(\mathcal{C}_u)$, la courbe $(\mathcal{C}_v)$ et les droites d'équations $x = 0$ et $x = 1$.
        reasoning: |-
          $(\mathcal{C}_u)$ est au-dessus de $(\mathcal{C}_v)$ partout (question précédente), donc en particulier sur $[0,1]$ : l'aire vaut $\displaystyle\int_0^1(e^x-x)\,dx$, une primitive élémentaire (technique du chapitre « Calcul intégral », hors socle de cette leçon).
        steps:
          - math: '\mathcal{A} = \int_0^1 (u(x)-v(x))\,dx = \int_0^1 (e^x-x)\,dx'
            note: "u au-dessus de v sur [0,1] (question précédente)."
          - math: '\int_0^1 (e^x-x)\,dx = \left[e^x - \dfrac{x^2}{2}\right]_0^1 = \left(e-\dfrac12\right) - (1-0)'
            note: "Primitive elementaire de e^x - x."
          - math: '\mathcal{A} = e - \dfrac32 \quad \text{unités d''aire}'
            note: "Aire positive, coherente avec la position relative etablie."
      - id: q4
        part: "Partie II — Domaine, une autre écriture de f et limite en +infini"
        stem: |-
          **(0,25 pt)** Vérifier que $f$ est définie sur $\mathbb{R}$.
        reasoning: |-
          $f(x)=x+1-\ln(e^x-x)$ n'a de sens que là où $e^x-x>0$ (rappel de domaine du $\ln$, chapitre 2). Or c'est précisément ce que la Partie I vient d'établir pour tout $x$ réel : $f$ est donc définie sur $\mathbb{R}$ tout entier.
        steps:
          - math: '\forall x\in\mathbb{R},\ e^x - x > 0 \quad (\text{Partie I, question 2})'
            note: "Reutilisation directe du résultat de la Partie I."
          - math: 'e^x-x>0 \implies \ln(e^x-x) \text{ existe pour tout } x \implies f \text{ est définie sur } \mathbb{R}'
            note: "Le domaine du ln (chapitre 2) est verifie partout : f est définie sur R tout entier."
      - id: q5
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x \in \mathbb{R}$, $f(x) = 1 - \ln\left(1 - xe^{-x}\right)$.
        reasoning: |-
          On factorise l'intérieur du $\ln$ par $e^x$ (jamais nul) : $e^x-x=e^x\left(1-xe^{-x}\right)$. La propriété du produit (chapitre 3) donne $\ln(e^x-x)=\ln(e^x)+\ln(1-xe^{-x})$, et $\ln(e^x)=x$ pour tout réel $x$ (propriété de la réciprocité entre $\ln$ et l'exponentielle, chapitre « Fonction exponentielle », hors socle de cette leçon). En remplaçant dans $f(x)=x+1-\ln(e^x-x)$, les deux $x$ s'annulent.
        steps:
          - math: 'e^x - x = e^x\left(1-xe^{-x}\right)'
            note: "On factorise par e^x, jamais nul."
          - math: '\ln(e^x-x) = \ln(e^x) + \ln\left(1-xe^{-x}\right) = x + \ln\left(1-xe^{-x}\right)'
            note: "Propriété du produit (chapitre 3) ; ln(e^x)=x, propriété de la réciproque de ln, chapitre Fonction exponentielle, hors socle."
          - math: 'f(x) = x+1-\Big(x+\ln(1-xe^{-x})\Big) = 1 - \ln\left(1-xe^{-x}\right)'
            note: "Les x s'annulent."
      - id: q6
        stem: |-
          **(0,5 pt)** En déduire que $\displaystyle\lim_{x \to +\infty} f(x) = 1$, puis interpréter géométriquement ce résultat.
        reasoning: |-
          On part de l'écriture de la question précédente. Quand $x\to+\infty$, $xe^{-x}\to0$ (limite de référence de l'exponentielle, analogue de la limite $x\ln x\to0$ du chapitre 5 mais pour $e^{-x}$, chapitre « Fonction exponentielle », hors socle de cette leçon), donc $1-xe^{-x}\to1$, et par continuité de $\ln$ en $1$ (chapitres 2 et 6), $\ln(1-xe^{-x})\to\ln(1)=0$. Donc $f(x)\to1-0=1$. Géométriquement, la droite $y=1$ est asymptote horizontale à $(\mathcal{C}_f)$ au voisinage de $+\infty$.
        steps:
          - math: '\lim_{x\to+\infty} xe^{-x} = 0 \quad (\text{limite de référence de l''exponentielle, hors socle})'
            note: "Analogue, pour l'exponentielle, du corollaire x ln x tend vers 0 du chapitre 5."
          - math: '\lim_{x\to+\infty}\big(1-xe^{-x}\big) = 1 \implies \lim_{x\to+\infty}\ln\big(1-xe^{-x}\big) = \ln(1) = 0'
            note: "Continuité de ln en 1, déjà établie aux chapitres 2 et 6."
          - math: '\lim_{x\to+\infty} f(x) = 1-0 = 1'
            note: "Asymptote horizontale y=1 en plus l'infini."
      - id: q7
        part: "Partie II — Limite en -infini et branche parabolique"
        stem: |-
          **(0,25 pt)** Calculer $\displaystyle\lim_{x \to -\infty} f(x)$.
        reasoning: |-
          Quand $x\to-\infty$, $e^x\to0$ (limite de référence de l'exponentielle, hors socle) et $-x\to+\infty$ : leur somme $e^x-x\to+\infty$. Par la limite de référence du $\ln$ en $+\infty$ (chapitre 5), $\ln(e^x-x)\to+\infty$. Donc $f(x)=x+1-\ln(e^x-x)$ est somme de deux termes qui tendent tous les deux vers $-\infty$ ($x+1\to-\infty$ et $-\ln(e^x-x)\to-\infty$) : pas d'indétermination, $f(x)\to-\infty$.
        steps:
          - math: '\lim_{x\to-\infty} e^x = 0, \quad \lim_{x\to-\infty} (-x) = +\infty \implies \lim_{x\to-\infty} (e^x-x) = +\infty'
            note: "Limite de référence de l'exponentielle en moins l'infini (hors socle), plus -x qui domine."
          - math: '\lim_{x\to-\infty} \ln(e^x-x) = +\infty \quad (\text{chapitre 5, argument qui tend vers } +\infty)'
            note: "Limite de référence du ln en plus l'infini, appliquee a l'argument e^x - x."
          - math: '\lim_{x\to-\infty} (x+1) = -\infty, \quad \lim_{x\to-\infty} \ln(e^x-x) = +\infty \implies \lim_{x\to-\infty} f(x) = -\infty'
            note: "x+1 tend vers moins l'infini, ln(e^x-x) vers plus l'infini : deux termes qui tirent vers moins l'infini, sans indetermination."
      - id: q8
        stem: |-
          **(0,5 pt)** Vérifier que pour tout $x < 0$, $f(x) = x + 1 - \ln(-x) - \ln\left(1 - \dfrac{1}{xe^{-x}}\right)$.
        reasoning: |-
          Pour $x<0$, on factorise cette fois par $-x$ (strictement positif) plutôt que par $e^x$ : $e^x-x=-x\left(1-\dfrac{e^x}{x}\right)$, et $\dfrac{e^x}{x}=\dfrac1{xe^{-x}}$. La propriété du produit (chapitre 3) s'applique car les deux facteurs $-x$ et $1-\dfrac1{xe^{-x}}$ sont strictement positifs pour $x<0$. En substituant dans $f(x)=x+1-\ln(e^x-x)$, on obtient l'écriture demandée.
