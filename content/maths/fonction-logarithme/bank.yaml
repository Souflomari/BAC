    intro: |-
      **Problème (examen national, session normale 2021, Sciences Expérimentales).**

      Soit $f$ la fonction définie sur $[0,+\infty[$ par : $f(0) = 0$ et $f(x) = 2x\ln x - 2x$ si $x > 0$,

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O, \vec{i}, \vec{j})$ *(unité : 1cm)*.

      Point de vigilance qui traverse tout le problème : $f$ est prolongée par continuité en $0$ — le vérifier est justement la première question. Garde en tête le corollaire de croissances comparées vu en cours (chapitre 5) : $x\ln x \to 0$ quand $x\to 0^+$, c'est ce qui rend ce prolongement possible.
    questions:
      - id: q1
        part: "Continuité de f en 0"
        stem: |-
          **(0,5 pt)** Montrer que $f$ est continue à droite au point $0$.
        reasoning: |-
          Continue à droite en $0$ signifie $\displaystyle\lim_{x\to0^+} f(x) = f(0)$. On calcule cette limite avec le corollaire de croissances comparées de la leçon (chapitre 5) : $x\ln x \to 0$ quand $x\to0^+$. Comme $f(x)=2x\ln x-2x$ pour $x>0$, chaque terme tend vers $0$, et la limite vaut $f(0)=0$.
        steps:
          - math: '\lim_{x \to 0^+} x\ln x = 0'
            note: "Corollaire de croissances comparées, chapitre 5 (limite de référence en 0+)."
          - math: '\lim_{x\to0^+} f(x) = \lim_{x\to0^+}\left(2x\ln x - 2x\right) = 2\times 0 - 0 = 0 = f(0)'
            note: "Les deux termes tendent vers 0 : continuité à droite en 0 vérifiée."
      - id: q2
        part: "Limites en +infini et direction asymptotique"
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} f(x)$.
        reasoning: |-
          On met $2x$ en facteur commun : $f(x)=2x(\ln x - 1)$. Quand $x\to+\infty$, $\ln x\to+\infty$ (chapitre 5), donc $\ln x - 1\to+\infty$ : les deux facteurs $2x$ et $\ln x-1$ tendent vers $+\infty$, leur produit aussi. Pas d'indétermination.
        steps:
          - math: 'f(x) = 2x\ln x - 2x = 2x(\ln x - 1)'
            note: "Mise en facteur de 2x."
          - math: '\lim_{x\to+\infty}(\ln x - 1) = +\infty \ \text{(chapitre 5)}, \quad \lim_{x\to+\infty} 2x = +\infty \implies \lim_{x\to+\infty} f(x) = +\infty'
            note: "Produit de deux facteurs qui tendent vers plus l'infini."
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} \dfrac{f(x)}{x}$ puis interpréter géométriquement le résultat.
        reasoning: |-
          En divisant la forme factorisée de la question précédente par $x$, il reste $\dfrac{f(x)}{x}=2\ln x - 2$, qui tend vers $+\infty$ car $\ln x\to+\infty$ (chapitre 5). Quand le rapport $\dfrac{f(x)}{x}$ part lui-même à l'infini, la courbe grossit plus vite que n'importe quelle droite passant par l'origine : c'est une branche parabolique de direction $(O,\vec{j})$ (l'axe des ordonnées).
        steps:
          - math: '\dfrac{f(x)}{x} = \dfrac{2x(\ln x - 1)}{x} = 2\ln x - 2'
            note: "Division par x, x non nul."
          - math: '\lim_{x\to+\infty} (2\ln x - 2) = +\infty \ \text{(chapitre 5)}'
            note: "Ln x tend vers plus l'infini."
          - math: '\lim_{x\to+\infty} \dfrac{f(x)}{x} = +\infty \implies (C) \text{ admet une branche parabolique de direction } (O,\vec{j}) \text{ au voisinage de } +\infty'
            note: "Rapport infini : la courbe grossit plus vite que toute droite issue de l'origine, direction verticale."
      - id: q4
        part: "Taux d'accroissement en 0, dérivée et tableau de variations"
        stem: |-
          **(0,75 pt)** Calculer $\displaystyle\lim_{x \to 0^+} \dfrac{f(x)}{x}$ et interpréter géométriquement le résultat.
        reasoning: |-
          Comme $f(0)=0$, ce rapport est exactement le taux d'accroissement de $f$ entre $0$ et $x$ : $\dfrac{f(x)}{x}=\dfrac{f(x)-f(0)}{x-0}$. Sur $]0,+\infty[$, $\dfrac{f(x)}{x}=2\ln x-2$ (même calcul que la question précédente, valable ici aussi), qui tend vers $-\infty$ quand $x\to0^+$ car $\ln x\to-\infty$ (chapitre 5). Un taux d'accroissement qui part à l'infini signale une tangente verticale : $(C)$ admet une demi-tangente verticale au point $(0,0)$.
        steps:
          - math: '\dfrac{f(x)}{x} = \dfrac{f(x)-f(0)}{x-0} = 2\ln x - 2 \quad (x>0)'
            note: "Taux d'accroissement en 0, même formule que f(x)/x."
          - math: '\lim_{x\to0^+} (2\ln x - 2) = -\infty \ \text{(chapitre 5)}'
            note: "Ln x tend vers moins l'infini en 0+."
          - math: '\lim_{x\to0^+} \dfrac{f(x)}{x} = -\infty \implies (C) \text{ admet une demi-tangente verticale au point } (0,0)'
            note: "Taux d'accroissement infini : tangente verticale à l'origine."
      - id: q5
        stem: |-
          **(0,5 pt)** Calculer $f'(x)$ pour tout $x$ de $]0, +\infty[$.
        reasoning: |-
          $f(x)=2x\ln x-2x$. On dérive $2x\ln x$ comme un produit (dérivée d'un produit, chapitre « Dérivabilité et étude des fonctions », hors socle de cette leçon) : $(2x\ln x)'=2\ln x+2x\cdot\dfrac1x=2\ln x+2$. On retire ensuite la dérivée de $2x$, qui vaut $2$.
        steps:
          - math: '(2x\ln x)'' = 2\ln x + 2x\cdot\dfrac1x = 2\ln x + 2'
            note: "Dérivée d'un produit u=2x, v=ln x, hors socle de cette leçon."
          - math: 'f''(x) = (2\ln x + 2) - 2 = 2\ln x'
            note: "On retire la dérivée de -2x, qui vaut -2."
      - id: q6
        stem: |-
          **(0,5 pt)** Dresser le tableau de variations de la fonction $f$ sur $[0, +\infty[$.
        reasoning: |-
          Le signe de $f'(x)=2\ln x$ est celui de $\ln x$ (le facteur $2$ est positif) : négatif sur $]0,1[$, nul en $1$, positif sur $]1,+\infty[$ (chapitre 2). $f$ décroît donc sur $[0,1]$ puis croît sur $[1,+\infty[$, avec un minimum en $x=1$ valant $f(1)=2\ln1-2=-2$. On complète avec $f(0)=0$ (donné) et $\displaystyle\lim_{x\to+\infty}f(x)=+\infty$ (question 2).
        steps:
          - math: 'f''(x) = 2\ln x, \quad x>0 \implies \text{signe}(f'') = \text{signe}(\ln x)'
            note: "Le facteur 2 est positif : le signe de f' suit celui de ln x."
          - math: 'f''(x) < 0 \text{ sur } ]0,1[, \quad f''(1)=0, \quad f''(x) > 0 \text{ sur } ]1,+\infty['
            note: "Signe de ln x autour de 1 (chapitre 2)."
          - math: 'f(1) = 2\ln 1 - 2 = -2'
            note: "Minimum de f, atteint en x=1. f décroît de f(0)=0 a -2, puis croit de -2 a plus l'infini."
      - id: q7
        part: "Équations f(x)=0, f(x)=x et construction de (C)"
        stem: |-
          **(0,5 pt)** Résoudre dans l'intervalle $]0, +\infty[$ les équations $f(x) = 0$ et $f(x) = x$.
        reasoning: |-
          Pour $f(x)=0$, on repart de la forme factorisée $f(x)=2x(\ln x-1)$ (question 2) : sur $]0,+\infty[$, $x\ne0$, donc l'équation équivaut à $\ln x=1$, soit $x=e$ (définition de $e$, chapitre 6). Pour $f(x)=x$, on regroupe : $2x\ln x-3x=0$, soit $x(2\ln x-3)=0$ ; comme $x\ne0$, il reste $\ln x=\dfrac32$, soit $x=e^{3/2}$ — cohérent avec l'indication $e^{3/2}\simeq4.5$ donnée à la question suivante pour la construction.
        steps:
          - math: 'f(x)=0 \iff 2x(\ln x - 1) = 0 \iff \ln x = 1 \iff x = e \quad (x\ne0 \text{ sur } ]0,+\infty[)'
            note: "Produit nul, x non nul sur le domaine considere. x=e par définition de e (chapitre 6)."
          - math: 'f(x)=x \iff 2x\ln x - 3x = 0 \iff x(2\ln x - 3) = 0 \iff \ln x = \dfrac32 \iff x = e^{3/2}'
            note: "Même méthode, x non nul."
      - id: q8
        stem: |-
          **(1 pt)** Construire la courbe $(C)$ dans le repère $(O, \vec{i}, \vec{j})$ *(on prend $e^{\frac{3}{2}} \simeq 4.5$)*.
        reasoning: |-
          On reporte tout ce qui a déjà été établi. La demi-tangente verticale à l'origine $(0,0)$ (question 4) ; le minimum au point $(1,-2)$ (question 6) ; le zéro de $f$ au point $(e,0)$ et le point $(e^{3/2},e^{3/2})\approx(4{,}5\,;\,4{,}5)$ où $(C)$ croise la droite $y=x$ (question 7) ; et la branche parabolique de direction $(O,\vec{j})$ au voisinage de $+\infty$ (question 3), c'est-à-dire une courbe qui remonte de plus en plus abruptement. $(C)$ part du point $(0,0)$ avec une tangente verticale, descend jusqu'au minimum $(1,-2)$, puis remonte en traversant l'axe des abscisses en $e$ et la droite $y=x$ en $e^{3/2}$.
      - id: q9
        part: "Intégration par parties et aire"
        stem: |-
          **(0,5 pt)** En utilisant une intégration par parties, montrer que $\displaystyle\int_1^e x\ln x\, dx = \dfrac{1 + e^2}{4}$.
        reasoning: |-
          Technique du chapitre « Calcul intégral », hors socle de cette leçon. On lit $x\ln x$ comme un produit à intégrer par parties : on dérive $u=\ln x$ (plus simple, $u'=\dfrac1x$) et on primitive $v'=x$ en $v=\dfrac{x^2}{2}$. Le crochet se calcule aux bornes $1$ et $e$ avec $\ln e=1$ et $\ln 1=0$, puis il reste une intégrale élémentaire de $x/2$.
        steps:
          - math: 'u=\ln x,\ u''=\dfrac1x\ ; \quad v''=x,\ v=\dfrac{x^2}{2}'
            note: "Choix IPP : dériver ln x, primitiver x."
          - math: '\int_1^e x\ln x\,dx = \left[\dfrac{x^2}{2}\ln x\right]_1^e - \int_1^e \dfrac{x}{2}\,dx'
            note: "Formule de l'IPP."
          - math: '\left[\dfrac{x^2}{2}\ln x\right]_1^e = \dfrac{e^2}{2}\times 1 - \dfrac{1}{2}\times 0 = \dfrac{e^2}{2}'
            note: "Ln e=1, ln 1=0."
          - math: '\int_1^e \dfrac{x}{2}\,dx = \left[\dfrac{x^2}{4}\right]_1^e = \dfrac{e^2}{4} - \dfrac{1}{4}'
            note: "Primitive elementaire de x/2."
          - math: '\int_1^e x\ln x\,dx = \dfrac{e^2}{2} - \left(\dfrac{e^2}{4} - \dfrac14\right) = \dfrac{e^2}{4} + \dfrac14 = \dfrac{1+e^2}{4}'
            note: "Regroupement final."
      - id: q10
        stem: |-
          **(0,5 pt)** En déduire : $\displaystyle\int_1^e f(x)\, dx$.
        reasoning: |-
          $f(x)=2x\ln x-2x$, donc par linéarité $\displaystyle\int_1^e f(x)\,dx = 2\int_1^e x\ln x\,dx - 2\int_1^e x\,dx$. On réutilise le résultat de la question précédente pour le premier terme, et une primitive élémentaire de $x$ pour le second.
        steps:
          - math: '\int_1^e f(x)\,dx = 2\int_1^e x\ln x\,dx - 2\int_1^e x\,dx'
            note: "Linéarité de l'intégrale."
          - math: '\int_1^e x\,dx = \left[\dfrac{x^2}{2}\right]_1^e = \dfrac{e^2-1}{2}'
            note: "Primitive elementaire."
          - math: '\int_1^e f(x)\,dx = 2\cdot\dfrac{1+e^2}{4} - 2\cdot\dfrac{e^2-1}{2} = \dfrac{1+e^2}{2} - (e^2-1)'
            note: "Reutilisation de la question précédente."
          - math: '\int_1^e f(x)\,dx = \dfrac{3-e^2}{2}'
            note: "Regroupement final."
      - id: q11
        part: "Minimum de f et une inégalité"
        stem: |-
          **(0,25 pt)** Déterminer le minimum de $f$ sur $]0, +\infty[$.
        reasoning: |-
          Lecture directe du tableau de variations (question 6) : $f$ décroît puis croît, avec un minimum en $x=1$.
        steps:
          - math: 'f \text{ décroît sur } ]0,1] \text{ puis croit sur } [1,+\infty[ \implies \min_{]0,+\infty[} f = f(1)'
            note: "Lecture directe du tableau de variations (question 6)."
          - math: 'f(1) = 2\ln 1 - 2 = -2'
            note: "Le minimum de f sur ]0,+infini[ vaut -2, atteint en x=1."
      - id: q12
        stem: |-
          **(0,5 pt)** En déduire que pour tout $x$ de $]0, +\infty[$, $\ln x \ge \dfrac{x - 1}{x}$.
        reasoning: |-
          Comme $f(1)=-2$ est le minimum global de $f$ sur $]0,+\infty[$ (question précédente), $f(x)\ge f(1)$ pour tout $x>0$, soit $2x\ln x-2x\ge-2$. On divise par $2x$, strictement positif, ce qui préserve le sens de l'inégalité : $\ln x - 1 \ge -\dfrac1x$, c'est-à-dire $\ln x \ge 1-\dfrac1x=\dfrac{x-1}{x}$.
        steps:
          - math: '\forall x>0,\ f(x)\ge f(1) \iff 2x\ln x - 2x \ge -2'
            note: "f(1)=-2 est le minimum global de f (question précédente)."
          - math: '2x\ln x - 2x \ge -2 \iff \ln x - 1 \ge -\dfrac1x \quad (\text{division par } 2x>0)'
            note: "On divise par 2x, strictement positif : le sens de l'inégalité est preserve."
          - math: '\ln x \ge 1 - \dfrac1x = \dfrac{x-1}{x}'
            note: "Inégalité demandee."
      - id: q13
        part: "Fonction réciproque de la restriction g de f a [1,+infini["
        stem: |-
          Soit $g$ la restriction de la fonction $f$ à l'intervalle $[1, +\infty[$.

          **(0,5 pt)** Montrer que la fonction $g$ admet une fonction réciproque $g^{-1}$ définie sur un intervalle $J$ qu'on déterminera.
        reasoning: |-
          $g$ hérite de $f$ sa continuité et sa stricte croissance sur $[1,+\infty[$ (question 6). Une fonction continue et strictement monotone sur un intervalle réalise une bijection de cet intervalle vers l'intervalle image (corollaire du théorème des valeurs intermédiaires, chapitre « Dérivabilité et étude des fonctions », hors socle de cette leçon). L'intervalle image se lit aux bornes : $g(1)=f(1)=-2$ (question 11) et $\displaystyle\lim_{x\to+\infty}g(x)=\lim_{x\to+\infty}f(x)=+\infty$ (question 2). Donc $g$ admet une réciproque $g^{-1}$ définie sur $J=[-2,+\infty[$.
        steps:
          - math: 'g \text{ continue et strictement croissante sur } [1,+\infty[ \quad (\text{restriction de } f, \text{ question 6})'
            note: "Continuite et stricte croissance heritees de f."
          - math: 'g(1) = f(1) = -2 \quad (\text{question 11}), \qquad \lim_{x\to+\infty} g(x) = \lim_{x\to+\infty} f(x) = +\infty \quad (\text{question 2})'
            note: "Images des bornes de l'intervalle de départ."
          - math: 'g \text{ realise une bijection de } [1,+\infty[ \text{ sur } J = [-2,+\infty['
            note: "Corollaire du théorème des valeurs intermédiaires (continuité + stricte monotonie), hors socle de cette leçon."
      - id: q14
        stem: |-
          **(0,75 pt)** Construire dans le même repère $(O, \vec{i}, \vec{j})$ la courbe représentative de la fonction $g^{-1}$.
        reasoning: |-
          La courbe d'une fonction réciproque est le symétrique de la courbe de la fonction de départ par rapport à la droite $(\Delta):y=x$. La courbe de $g$ est la portion de $(C)$ pour $x\ge1$ : elle part du minimum $(1,-2)$, passe par $(e,0)$ et par $(e^{3/2},e^{3/2})$, puis remonte indéfiniment (questions 6 et 7). En reflétant cette portion par rapport à $(\Delta)$, on obtient la courbe de $g^{-1}$, définie sur $J=[-2,+\infty[$, qui part du point $(-2,1)$, passe par $(0,e)$ et par $(e^{3/2},e^{3/2})$ (point fixe commun aux deux courbes, sur $(\Delta)$), puis continue de monter.
      - id: q15
        part: "Une fonction définie par morceaux : h"
        stem: |-
          On considère la fonction $h$ définie sur $\mathbb{R}$ par $\begin{cases} h(x) = x^3 + 3x & ;\ x \le 0 \\ h(x) = 2x\ln x - 2x & ;\ x > 0 \end{cases}$

          **(0,5 pt)** Étudier la continuité de $h$ au point $0$.
        reasoning: |-
          On calcule les deux limites latérales et on les compare à $h(0)$. À gauche, $h$ est le polynôme $x^3+3x$, continu partout, donc $\displaystyle\lim_{x\to0^-}h(x)=0=h(0)$. À droite, $h(x)=f(x)$ pour $x>0$ : c'est exactement le calcul de la question 1, qui donnait $\displaystyle\lim_{x\to0^+}f(x)=0$. Les deux limites latérales coïncident avec $h(0)=0$ : $h$ est continue en $0$.
        steps:
          - math: '\lim_{x\to0^-} h(x) = \lim_{x\to0^-} (x^3+3x) = 0 = h(0)'
            note: "Polynôme, continu partout."
          - math: '\lim_{x\to0^+} h(x) = \lim_{x\to0^+} (2x\ln x - 2x) = 0 \quad (\text{même calcul que la question 1})'
            note: "Reutilisation du corollaire x ln x tend vers 0."
          - math: '\lim_{x\to0^-} h(x) = \lim_{x\to0^+} h(x) = h(0) = 0 \implies h \text{ continue en } 0'
            note: "Limites à gauche et à droite égales a h(0)."
      - id: q16
        stem: |-
          **(0,5 pt)** Étudier la dérivabilité de la fonction $h$ à gauche au point $0$ puis interpréter géométriquement le résultat.
        reasoning: |-
          On calcule la limite à gauche du taux d'accroissement de $h$ en $0$ : $\dfrac{h(x)-h(0)}{x-0}=\dfrac{x^3+3x}{x}=x^2+3$ pour $x\ne0$ (on simplifie par $x$). Cette expression a une limite finie, $3$, quand $x\to0^-$ : $h$ est dérivable à gauche en $0$. Géométriquement, $(C_h)$ admet au point $(0,0)$ une demi-tangente à gauche de coefficient directeur $3$.
        steps:
          - math: '\dfrac{h(x)-h(0)}{x-0} = \dfrac{x^3+3x}{x} = x^2+3 \quad (x\ne0)'
            note: "Taux d'accroissement, simplification par x."
          - math: '\lim_{x\to0^-} (x^2+3) = 3'
            note: "Limite finie : h dérivable à gauche en 0."
          - math: '\text{Interpretation\,: } (C_h) \text{ admet en } (0,0) \text{ une demi-tangente à gauche de coefficient directeur } 3'
            note: "Interprétation géométrique de la dérivabilité à gauche."
      - id: q17
        stem: |-
          **(0,25 pt)** La fonction $h$ est-elle dérivable au point $0$ ? justifier.
        reasoning: |-
          $h$ est dérivable en $0$ seulement si les deux demi-dérivées existent ET coïncident. À droite, le taux d'accroissement de $h$ en $0$ est exactement celui de $f$ (question 4), qui tend vers $-\infty$ : ce n'est même pas une demi-dérivée finie. À gauche, la demi-dérivée vaut $3$ (question précédente), un nombre fini. Une limite finie ne peut pas égaler une limite infinie : les deux demi-dérivées ne coïncident pas, donc $h$ n'est pas dérivable en $0$.
        steps:
          - math: '\lim_{x\to0^+} \dfrac{h(x)-h(0)}{x-0} = \lim_{x\to0^+} \dfrac{f(x)}{x} = -\infty \quad (\text{question 4})'
            note: "Reutilisation du taux d'accroissement de f en 0, déjà calcule."
          - math: '\lim_{x\to0^-} \dfrac{h(x)-h(0)}{x-0} = 3 \ne \lim_{x\to0^+} \dfrac{h(x)-h(0)}{x-0} = -\infty'
            note: "Les deux demi-derivees ne coïncident pas : l'une finie, l'autre infinie."
          - math: 'h \text{ n''est pas dérivable en } 0'
            note: "Conclusion : pas de dérivabilité en 0 (mais deux demi-tangentes distinctes)."

