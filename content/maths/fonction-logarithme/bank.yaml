    intro: |-
      **Problème (examen national, session normale 2024, Sciences Expérimentales).**

      **Partie I.** On considère les deux fonctions $u$ et $v$ définies sur $\mathbb{R}$ par : $u(x) = e^x$ et $v(x) = x$.

      **Partie II.** On considère la fonction numérique $f$ définie par $f(x) = x + 1 - \ln\left(e^x - x\right)$.

      Point de vigilance qui traverse tout le problème : la Partie I n'est pas un hors-d'œuvre isolé — elle sert à garantir que $e^x-x>0$ pour tout $x$ réel, condition sans laquelle $\ln(e^x-x)$ de la Partie II n'aurait aucun sens (rappel R1 : $\ln$ n'existe que sur $]0,+\infty[$).
    questions:
      - id: q1
        part: "Partie I — Comparer u(x)=e^x et v(x)=x, puis une aire"
        stem: |-
          **(0,5 pt)** Tracer dans un même repère orthonormé les courbes $(\mathcal{C}_u)$ et $(\mathcal{C}_v)$ des fonctions $u$ et $v$.
        reasoning: |-
          $(\mathcal{C}_v)$ est la droite $y=x$, la première bissectrice. $(\mathcal{C}_u)$ est la courbe de l'exponentielle (chapitre « Fonction exponentielle », hors socle de cette leçon) : elle passe par $(0,1)$, est strictement croissante, tend vers $0$ en $-\infty$ (asymptote horizontale) et vers $+\infty$ en $+\infty$, en restant strictement au-dessus de $(\mathcal{C}_v)$ — c'est justement ce que la question suivante demande de justifier.
      - id: q2
        stem: |-
          **(0,25 pt)** Justifier graphiquement que $e^x - x > 0$ pour tout $x$ de $\mathbb{R}$.
        reasoning: |-
          Sur le tracé de la question précédente, $(\mathcal{C}_u)$ reste strictement au-dessus de $(\mathcal{C}_v)$ pour tout $x$ réel — les deux courbes ne se croisent jamais. Lire graphiquement $u(x)>v(x)$ pour tout $x$, c'est lire $e^x>x$, c'est-à-dire $e^x-x>0$.
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer l'aire de la partie du plan délimitée par la courbe $(\mathcal{C}_u)$, la courbe $(\mathcal{C}_v)$ et les droites d'équations $x = 0$ et $x = 1$.
        reasoning: |-
          $(\mathcal{C}_u)$ est au-dessus de $(\mathcal{C}_v)$ partout (question précédente), donc en particulier sur $[0,1]$ : l'aire vaut $\displaystyle\int_0^1(e^x-x)\,dx$, une primitive élémentaire (technique du chapitre « Calcul intégral », hors socle de cette leçon).
        steps:
          - math: '\mathcal{A} = \int_0^1 (u(x)-v(x))\,dx = \int_0^1 (e^x-x)\,dx'
            note: "u au-dessus de v sur [0,1] (question precedente)."
          - math: '\int_0^1 (e^x-x)\,dx = \left[e^x - \dfrac{x^2}{2}\right]_0^1 = \left(e-\dfrac12\right) - (1-0)'
            note: "Primitive elementaire de e^x - x."
          - math: '\mathcal{A} = e - \dfrac32 \quad \text{unites d''aire}'
            note: "Aire positive, coherente avec la position relative etablie."
      - id: q4
        part: "Partie II — Domaine, une autre ecriture de f et limite en +infini"
        stem: |-
          **(0,25 pt)** Vérifier que $f$ est définie sur $\mathbb{R}$.
        reasoning: |-
          $f(x)=x+1-\ln(e^x-x)$ n'a de sens que là où $e^x-x>0$ (rappel de domaine du $\ln$, R1). Or c'est précisément ce que la Partie I vient d'établir pour tout $x$ réel : $f$ est donc définie sur $\mathbb{R}$ tout entier.
        steps:
          - math: '\forall x\in\mathbb{R},\ e^x - x > 0 \quad (\text{Partie I, question 2})'
            note: "Reutilisation directe du resultat de la Partie I."
          - math: 'e^x-x>0 \implies \ln(e^x-x) \text{ existe pour tout } x \implies f \text{ est definie sur } \mathbb{R}'
            note: "Le domaine du ln (R1) est verifie partout : f est definie sur R tout entier."
      - id: q5
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x \in \mathbb{R}$, $f(x) = 1 - \ln\left(1 - xe^{-x}\right)$.
        reasoning: |-
          On factorise l'intérieur du $\ln$ par $e^x$ (jamais nul) : $e^x-x=e^x\left(1-xe^{-x}\right)$. La propriété du produit (R2) donne $\ln(e^x-x)=\ln(e^x)+\ln(1-xe^{-x})$, et $\ln(e^x)=x$ pour tout réel $x$ (propriété de la réciprocité entre $\ln$ et l'exponentielle, chapitre « Fonction exponentielle », hors socle de cette leçon). En remplaçant dans $f(x)=x+1-\ln(e^x-x)$, les deux $x$ s'annulent.
        steps:
          - math: 'e^x - x = e^x\left(1-xe^{-x}\right)'
            note: "On factorise par e^x, jamais nul."
          - math: '\ln(e^x-x) = \ln(e^x) + \ln\left(1-xe^{-x}\right) = x + \ln\left(1-xe^{-x}\right)'
            note: "Propriete du produit (R2) ; ln(e^x)=x, propriete de la reciproque de ln, chapitre Fonction exponentielle, hors socle."
          - math: 'f(x) = x+1-\Big(x+\ln(1-xe^{-x})\Big) = 1 - \ln\left(1-xe^{-x}\right)'
            note: "Les x s'annulent."
      - id: q6
        stem: |-
          **(0,5 pt)** En déduire que $\displaystyle\lim_{x \to +\infty} f(x) = 1$, puis interpréter géométriquement ce résultat.
        reasoning: |-
          On part de l'écriture de la question précédente. Quand $x\to+\infty$, $xe^{-x}\to0$ (limite de référence de l'exponentielle, analogue de la limite $x\ln x\to0$ du R4 mais pour $e^{-x}$, chapitre « Fonction exponentielle », hors socle de cette leçon), donc $1-xe^{-x}\to1$, et par continuité de $\ln$ en $1$ (R1/R5), $\ln(1-xe^{-x})\to\ln(1)=0$. Donc $f(x)\to1-0=1$. Géométriquement, la droite $y=1$ est asymptote horizontale à $(\mathcal{C}_f)$ au voisinage de $+\infty$.
        steps:
          - math: '\lim_{x\to+\infty} xe^{-x} = 0 \quad (\text{limite de reference de l''exponentielle, hors socle})'
            note: "Analogue, pour l'exponentielle, du corollaire x ln x tend vers 0 du R4."
          - math: '\lim_{x\to+\infty}\big(1-xe^{-x}\big) = 1 \implies \lim_{x\to+\infty}\ln\big(1-xe^{-x}\big) = \ln(1) = 0'
            note: "Continuite de ln en 1, deja etablie R1/R5."
          - math: '\lim_{x\to+\infty} f(x) = 1-0 = 1'
            note: "Asymptote horizontale y=1 en plus l'infini."
      - id: q7
        part: "Partie II — Limite en -infini et branche parabolique"
        stem: |-
          **(0,25 pt)** Calculer $\displaystyle\lim_{x \to -\infty} f(x)$.
        reasoning: |-
          Quand $x\to-\infty$, $e^x\to0$ (limite de référence de l'exponentielle, hors socle) et $-x\to+\infty$ : leur somme $e^x-x\to+\infty$. Par la limite de référence du $\ln$ en $+\infty$ (R4), $\ln(e^x-x)\to+\infty$. Donc $f(x)=x+1-\ln(e^x-x)$ est somme de deux termes qui tendent tous les deux vers $-\infty$ ($x+1\to-\infty$ et $-\ln(e^x-x)\to-\infty$) : pas d'indétermination, $f(x)\to-\infty$.
        steps:
          - math: '\lim_{x\to-\infty} e^x = 0, \quad \lim_{x\to-\infty} (-x) = +\infty \implies \lim_{x\to-\infty} (e^x-x) = +\infty'
            note: "Limite de reference de l'exponentielle en moins l'infini (hors socle), plus -x qui domine."
          - math: '\lim_{x\to-\infty} \ln(e^x-x) = +\infty \quad (\text{R4, argument qui tend vers } +\infty)'
            note: "Limite de reference du ln en plus l'infini, appliquee a l'argument e^x - x."
          - math: '\lim_{x\to-\infty} (x+1) = -\infty, \quad \lim_{x\to-\infty} \ln(e^x-x) = +\infty \implies \lim_{x\to-\infty} f(x) = -\infty'
            note: "x+1 tend vers moins l'infini, ln(e^x-x) vers plus l'infini : deux termes qui tirent vers moins l'infini, sans indetermination."
      - id: q8
        stem: |-
          **(0,5 pt)** Vérifier que pour tout $x < 0$, $f(x) = x + 1 - \ln(-x) - \ln\left(1 - \dfrac{1}{xe^{-x}}\right)$.
        reasoning: |-
          Pour $x<0$, on factorise cette fois par $-x$ (strictement positif) plutôt que par $e^x$ : $e^x-x=-x\left(1-\dfrac{e^x}{x}\right)$, et $\dfrac{e^x}{x}=\dfrac1{xe^{-x}}$. La propriété du produit (R2) s'applique car les deux facteurs $-x$ et $1-\dfrac1{xe^{-x}}$ sont strictement positifs pour $x<0$. En substituant dans $f(x)=x+1-\ln(e^x-x)$, on obtient l'écriture demandée.
        steps:
          - math: 'x<0 \implies e^x - x = -x\left(1-\dfrac{e^x}{x}\right) = -x\left(1-\dfrac{1}{xe^{-x}}\right)'
            note: "On factorise par -x, strictement positif pour x negatif ; e^x/x = 1/(x e^-x)."
          - math: '\ln(e^x-x) = \ln(-x) + \ln\left(1-\dfrac{1}{xe^{-x}}\right) \quad (\text{propriete du produit, R2})'
            note: "Les deux facteurs -x et 1-1/(x e^-x) sont strictement positifs pour x<0."
          - math: 'f(x) = x+1-\ln(e^x-x) = x+1-\ln(-x)-\ln\left(1-\dfrac{1}{xe^{-x}}\right)'
            note: "Substitution directe dans f(x)."
      - id: q9
        stem: |-
          **(0,75 pt)** Calculer $\displaystyle\lim_{x \to -\infty} \dfrac{f(x)}{x}$ puis déduire que la courbe $(\mathcal{C}_f)$ admet une branche parabolique de direction la droite d'équation $y = x$ au voisinage de $-\infty$.
        reasoning: |-
          On divise la forme de la question précédente par $x$ (négatif, non nul) et on pose $X=-x$ (qui tend vers $+\infty$) pour se ramener aux limites de référence. Le terme $\dfrac{\ln(-x)}{x}$ devient $-\dfrac{\ln X}{X}\to0$ par croissances comparées (R4, même limite de référence que dans la leçon, ici appliquée à $X$). Le dernier terme tend aussi vers $0$ : $xe^{-x}=-Xe^X\to-\infty$ (l'exponentielle écrase $X$, hors socle), donc $\dfrac1{xe^{-x}}\to0$ et $\ln\left(1-\dfrac1{xe^{-x}}\right)\to\ln(1)=0$. Il reste $\dfrac{f(x)}{x}\to1$ : c'est la direction de $(\Delta):y=x$. Mais l'écart $f(x)-x=1-\ln(e^x-x)$ tend vers $-\infty$ (question 7) — pas de limite finie, donc pas d'asymptote : c'est une branche parabolique de direction $(\Delta)$.
        steps:
          - math: '\dfrac{f(x)}{x} = 1+\dfrac1x-\dfrac{\ln(-x)}{x}-\dfrac1x\ln\left(1-\dfrac{1}{xe^{-x}}\right) \quad (x<0)'
            note: "On divise par x la forme de la question precedente."
          - math: 'X=-x\to+\infty,\quad \dfrac{\ln(-x)}{x} = \dfrac{\ln X}{-X} = -\dfrac{\ln X}{X} \to 0 \quad (\text{croissances comparees, R4})'
            note: "Meme limite de reference que R4, avec le changement de variable X=-x."
          - math: 'xe^{-x} = -Xe^{X} \to -\infty \implies \dfrac{1}{xe^{-x}} \to 0 \implies \ln\left(1-\dfrac{1}{xe^{-x}}\right) \to \ln(1) = 0'
            note: "L'exponentielle ecrase X (hors socle) ; continuite de ln en 1 (R1/R5)."
          - math: '\lim_{x\to-\infty} \dfrac{f(x)}{x} = 1+0-0-0 = 1'
            note: "La pente tend vers 1 : direction de (Delta):y=x."
          - math: 'f(x)-x = 1-\ln(e^x-x) \xrightarrow[x\to-\infty]{} -\infty \quad (\text{question 7})'
            note: "L'ecart ne tend pas vers une limite finie : pas d'asymptote, branche parabolique de direction y=x."
      - id: q10
        part: "Partie II — Derivee, tableau de variations et un zero de f"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x \in \mathbb{R}$ : $f'(x) = \dfrac{1 - x}{e^x - x}$.
        reasoning: |-
          On dérive $f(x)=x+1-\ln(e^x-x)$ : le terme $\ln(e^x-x)$ est une composée, on applique $(\ln u)'=\dfrac{u'}{u}$ (R3) avec $u(x)=e^x-x$, $u'(x)=e^x-1$. Il reste à réduire $1-\dfrac{e^x-1}{e^x-x}$ au même dénominateur.
        steps:
          - math: 'u(x)=e^x-x,\ u''(x)=e^x-1 \implies \big(\ln(e^x-x)\big)'' = \dfrac{e^x-1}{e^x-x} \quad (\text{regle } (\ln u)''=u''/u, \text{ R3})'
            note: "On derive l'interieur du ln."
          - math: 'f''(x) = 1-\dfrac{e^x-1}{e^x-x} = \dfrac{(e^x-x)-(e^x-1)}{e^x-x}'
            note: "Derivee de x+1 moins la derivee du ln, meme denominateur."
          - math: 'f''(x) = \dfrac{1-x}{e^x-x}'
            note: "Simplification du numerateur : les e^x s'annulent."
      - id: q11
        stem: |-
          **(0,5 pt)** Etudier le signe de la fonction dérivée de $f$, puis déduire le tableau de variations de $f$ sur $\mathbb{R}$.
        reasoning: |-
          Le dénominateur $e^x-x$ est strictement positif pour tout $x$ (Partie I), donc ne compte pas dans le signe : le signe de $f'(x)$ est celui de $1-x$, positif avant $1$, nul en $1$, négatif après. $f$ croît donc sur $]-\infty,1]$ puis décroît sur $[1,+\infty[$, avec un maximum en $x=1$ valant $f(1)=1+1-\ln(e-1)=2-\ln(e-1)$. On complète avec les deux limites déjà établies : $-\infty$ en $-\infty$ (question 7) et $1$ en $+\infty$ (question 6, asymptote).
        steps:
          - math: 'e^x-x>0 \text{ pour tout } x \quad (\text{Partie I}) \implies \text{signe}(f'') = \text{signe}(1-x)'
            note: "Le denominateur ne change jamais de signe."
          - math: 'f''(x) > 0 \text{ sur } ]-\infty,1[, \quad f''(1)=0, \quad f''(x) < 0 \text{ sur } ]1,+\infty['
            note: "Signe de 1-x autour de 1."
          - math: 'f(1) = 1+1-\ln(e-1) = 2-\ln(e-1)'
            note: "Maximum de f, atteint en x=1. f croit de moins l'infini a 2-ln(e-1), puis decroit vers 1 (asymptote)."
      - id: q12
        stem: |-
          **(0,75 pt)** Montrer que l'équation $f(x) = 0$ admet une solution unique dans l'intervalle $]-1, 0[$.
        reasoning: |-
          $f$ est continue et strictement croissante sur $]-\infty,1]$ (question précédente), donc en particulier sur $[-1,0]$ : elle y est injective. On calcule $f(-1)$ et $f(0)$ : les deux valeurs sont de signes opposés, ce qui donne l'existence d'un zéro, et le corollaire du théorème des valeurs intermédiaires (continuité + stricte monotonie, hors socle de cette leçon) garantit que ce zéro est unique.
        steps:
          - math: 'f(-1) = -1+1-\ln\left(e^{-1}+1\right) = -\ln\left(\dfrac1e+1\right) < 0 \quad \left(\dfrac1e+1>1\right)'
            note: "Valeur en -1, negative car l'interieur du ln depasse 1."
          - math: 'f(0) = 0+1-\ln(e^0-0) = 1-\ln(1) = 1 > 0'
            note: "Valeur en 0, positive."
          - math: 'f \text{ continue et strictement croissante sur } [-1,0] \ (\subset\, ]-\infty,1], \text{ question 11}), \quad f(-1)<0<f(0)'
            note: "Corollaire du theoreme des valeurs intermediaires, hors socle de cette lecon."
          - math: '\implies \exists!\, x_0 \in\, ]-1,0[,\ f(x_0)=0'
            note: "Unicite garantie par la stricte monotonie (injectivite) de f sur cet intervalle."
      - id: q13
        part: "Partie II — Deux points fixes alpha et beta"
        stem: |-
          La courbe $(\mathcal{C}_f)$ ci-contre est la représentation graphique de $f$ dans un repère orthonormé : cadre gradué de $-4$ à $4$ en abscisse et de $-3$ à $4$ en ordonnée, avec deux tracés — une droite non étiquetée passant par l'origine, de pente $1$ (la droite $(\Delta):y=x$), et la courbe $(\mathcal{C}_f)$ elle-même, étiquetée juste en dessous d'elle. La courbe monte depuis le coin inférieur gauche du cadre (où elle est sous $(\Delta)$ et plus pentue qu'elle), coupe $(\Delta)$ une première fois dans le troisième quadrant, coupe l'axe des abscisses une unique fois entre $-1$ et $0$ (question 12), passe par le point $(0,1)$, atteint un maximum aux alentours de $1{,}5$ en $x=1$, recoupe $(\Delta)$ une seconde fois entre $1$ et $2$, puis redescend lentement vers l'asymptote $y=1$ en restant sous $(\Delta)$.

          **(0,5 pt)** Justifier graphiquement que l'équation $f(x) = x$ admet deux solutions $\alpha$ et $\beta$.
        reasoning: |-
          Sur le graphique, $(\mathcal{C}_f)$ croise la droite $(\Delta):y=x$ en exactement deux points : l'un dans le troisième quadrant, l'autre entre les abscisses $1$ et $2$. Ce n'est pas seulement une lecture graphique isolée : comme $f$ est strictement croissante sur $]-\infty,1]$ puis strictement décroissante sur $[1,+\infty[$ (question 11), l'équation $f(x)=x$ a au plus une solution sur chacune de ces deux branches monotones (stricte monotonie = injectivité). La lecture graphique montrant une intersection sur chaque branche, il y a donc exactement deux solutions, notées $\alpha$ (sur la branche croissante) et $\beta$ (sur la branche décroissante).
        steps:
          - math: '(\mathcal{C}_f) \text{ croise } (\Delta) \text{ en un point du troisieme quadrant, puis en un second point entre } x=1 \text{ et } x=2'
            note: "Lecture directe de la figure."
          - math: 'f \text{ strictement croissante sur } ]-\infty,1] \text{ puis strictement decroissante sur } [1,+\infty[ \implies \text{au plus une solution de } f(x)=x \text{ par branche}'
            note: "Stricte monotonie = injectivite sur chaque branche (question 11)."
          - math: '\implies \text{exactement deux solutions } \alpha \text{ (branche croissante) et } \beta \text{ (branche decroissante)}'
            note: "Une intersection observee sur chaque branche : deux solutions au total."
      - id: q14
        stem: |-
          **(0,5 pt)** Montrer que : $e^{\alpha} - e^{\beta} = \alpha - \beta$.
        reasoning: |-
          On réécrit d'abord l'équation $f(x)=x$ sous une forme plus maniable, avec la méthode du R6 : isoler le $\ln$ puis utiliser l'injectivité de $\ln$. $f(x)=x \iff \ln(e^x-x)=1$. Or $1=\ln(e)$ (définition de $e$, R5), donc par injectivité de $\ln$ (R1, stricte croissance) : $e^x-x=e$. En appliquant cette équivalence aux deux solutions $\alpha$ et $\beta$ de la question précédente, on obtient deux égalités qu'il suffit de soustraire.
        steps:
          - math: 'f(x)=x \iff x+1-\ln(e^x-x)=x \iff \ln(e^x-x)=1'
            note: "On isole le terme en ln."
          - math: '\ln(e^x-x) = 1 = \ln(e) \iff e^x-x=e \quad (\text{injectivite de ln, R1/R6}; \ \ln(e)=1 \text{ par definition, R5})'
            note: "Equation resolue par injectivite, comme au R6."
          - math: 'f(\alpha)=\alpha,\ f(\beta)=\beta \implies e^{\alpha}-\alpha = e \quad \text{et} \quad e^{\beta}-\beta = e'
            note: "Alpha et beta sont les deux solutions donnees par la question precedente."
          - math: '\big(e^{\alpha}-\alpha\big)-\big(e^{\beta}-\beta\big) = 0 \implies e^{\alpha}-e^{\beta} = \alpha-\beta'
            note: "On soustrait les deux egalites et on regroupe."
      - id: q15
        part: "Partie II — Fonction reciproque g et sa derivee en 1"
        stem: |-
          Soit $g$ la restriction de la fonction $f$ sur l'intervalle $I = ]-\infty, 1]$.

          **(0,5 pt)** Montrer que $g$ admet une fonction réciproque $g^{-1}$ définie sur un intervalle $J$ que l'on déterminera. *(Il n'est pas demandé de déterminer $g^{-1}(x)$)*.
        reasoning: |-
          $g$ hérite de $f$ sa continuité et sa stricte croissance sur $I=]-\infty,1]$ (question 11). Une fonction continue et strictement monotone sur un intervalle réalise une bijection vers l'intervalle image (corollaire du théorème des valeurs intermédiaires, hors socle de cette leçon). L'intervalle image se lit aux bornes de $I$ : $\displaystyle\lim_{x\to-\infty}g(x)=-\infty$ (question 7) et $g(1)=f(1)=2-\ln(e-1)$ (question 11). Donc $g$ admet une réciproque $g^{-1}$ définie sur $J=\left]-\infty,\,2-\ln(e-1)\right]$.
        steps:
          - math: 'g \text{ continue et strictement croissante sur } I=\,]-\infty,1] \quad (\text{restriction de } f, \text{ question 11})'
            note: "Continuite et stricte monotonie heritees de f."
          - math: '\lim_{x\to-\infty} g(x) = -\infty \ (\text{question 7}), \qquad g(1) = f(1) = 2-\ln(e-1) \ (\text{question 11})'
            note: "Images des bornes de l'intervalle I."
          - math: 'g \text{ realise une bijection de } I \text{ sur } J = \left]-\infty,\, 2-\ln(e-1)\right]'
            note: "Corollaire du theoreme des valeurs intermediaires (continuite + stricte monotonie), hors socle de cette lecon."
      - id: q16
        stem: |-
          **(0,75 pt)** Vérifier que $g^{-1}$ est dérivable en $1$ et calculer $\left(g^{-1}\right)'(1)$.
        reasoning: |-
          Le théorème de la dérivée d'une fonction réciproque (chapitre « Dérivabilité et étude de fonctions », hors socle de cette leçon) dit : si $g$ est dérivable en $x_0$ avec $g'(x_0)\ne0$, alors $g^{-1}$ est dérivable en $y_0=g(x_0)$, et $(g^{-1})'(y_0)=\dfrac1{g'(x_0)}$. Ici on cherche $x_0\in I$ tel que $g(x_0)=1$ : $x_0=0$ convient, car $f(0)=0+1-\ln(e^0-0)=1-\ln1=1$. On calcule ensuite $g'(0)=f'(0)$ avec la formule de la question 10 : $f'(0)=\dfrac{1-0}{e^0-0}=1$, qui est non nul. Le théorème s'applique donc, et $(g^{-1})'(1)=\dfrac1{g'(0)}=1$.
        steps:
          - math: 'g(0) = f(0) = 0+1-\ln(e^0-0) = 1-\ln(1) = 1'
            note: "On cherche x0 tel que g(x0)=1 : x0=0 convient (0 appartient a I)."
          - math: 'g''(0) = f''(0) = \dfrac{1-0}{e^0-0} = 1 \ne 0'
            note: "Derivee de f en 0 (formule de la question 10), non nulle."
          - math: 'g \text{ derivable en } 0,\ g''(0)\ne0 \implies g^{-1} \text{ derivable en } g(0)=1, \quad \left(g^{-1}\right)''(1) = \dfrac{1}{g''(0)} = 1'
            note: "Theoreme de la derivee d'une reciproque (chapitre Derivabilite et etude de fonctions, hors socle de cette lecon)."
