        stem: |-
          Soit la suite numérique $(u_n)$ définie par $u_0 \in ]\alpha,1[$ et la relation $u_{n+1} = f(u_n)$, pour tout $n \in \mathbb{N}$.

          **(0,5 pt)** Montrer par récurrence que $\alpha < u_n < 1$, pour tout $n$ de $\mathbb{N}$.
        reasoning: |-
          Le point clé : $\alpha$ et $1$ sont tous deux des zéros de $g=f(x)-x$ (donnés dans l'énoncé), donc des points fixes de $f$ : $f(\alpha)=\alpha$ et $f(1)=1$ (déjà calculé, question 6). Comme $f$ est strictement croissante sur $]0,+\infty[$ (question 6), pour $x\in]\alpha,1[$ : $f(\alpha)<f(x)<f(1)$, c'est-à-dire $\alpha<f(x)<1$. Initialisation : $u_0\in]\alpha,1[$ donné. Hérédité : si $\alpha<u_n<1$, la stricte croissance donne $\alpha=f(\alpha)<f(u_n)<f(1)=1$, soit $\alpha<u_{n+1}<1$.
        steps:
          - math: 'f(\alpha)=\alpha, \quad f(1)=1 \quad (\alpha \text{ et } 1 \text{ sont des zéros de } g=f(x)-x)'
            note: "Points fixes de f, donnes par l'énoncé de la question 9."
          - math: '\alpha<u_n<1, \ f \text{ strict. croissante} \implies f(\alpha)<f(u_n)<f(1) \implies \alpha<u_{n+1}<1'
            note: "On applique la stricte croissance de f (question 6) a l'hypothèse de récurrence."
      - id: q16
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_n)$ est croissante. *(on peut utiliser la question 4) b))*
        reasoning: |-
          $u_{n+1}-u_n=f(u_n)-u_n=g(u_n)$. La question 10 donne $(\Delta)$ en dessous de $(C_f)$ sur $[\alpha,1]$, c'est-à-dire $g>0$ sur cet intervalle. Comme $u_n\in]\alpha,1[$ (question précédente), $g(u_n)>0$, donc $u_{n+1}>u_n$.
        steps:
          - math: 'u_{n+1}-u_n = f(u_n)-u_n = g(u_n)'
            note: "Différence consecutive = g evaluee en u_n."
          - math: 'u_n\in\,]\alpha,1[ \text{ et } g>0 \text{ sur } ]\alpha,1[ \ (\text{question 9-10}) \implies g(u_n)>0 \implies u_{n+1}>u_n'
            note: "(u_n) est croissante."
      - id: q17
        stem: |-
          **(0,75 pt)** En déduire que la suite $(u_n)$ est convergente et calculer sa limite.
        reasoning: |-
          $(u_n)$ est croissante (question précédente) et majorée par $1$ (question sur l'encadrement) : elle converge, vers une limite $\ell$ avec $\ell\le1$ (passage à la limite dans $u_n<1$) et $\ell\ge u_0>\alpha$ (suite croissante à partir de $u_0$). Comme $f$ est continue et $u_{n+1}=f(u_n)$, $\ell$ vérifie $\ell=f(\ell)$, c'est-à-dire $g(\ell)=0$. Les seuls zéros de $g$ sur $]0,+\infty[$ sont $\alpha$ et $1$ (donnés) ; comme $\ell>\alpha$, il reste $\ell=1$.
        steps:
          - math: '(u_n) \text{ croissante et majoree par } 1 \implies (u_n) \text{ converge vers } \ell, \quad \ell>\alpha, \ \ell\le1'
            note: "Théorème de la convergence monotone ; u_0 > alpha et suite croissante donnent la limite > alpha."
          - math: '\ell=f(\ell) \iff g(\ell)=0 \iff \ell=\alpha \text{ ou } \ell=1'
            note: "Les seuls zéros de g sont alpha et 1 (donnes dans l'énoncé)."
          - math: '\ell>\alpha \implies \ell = 1'
            note: "On elimine alpha : la limite de la suite est 1."

