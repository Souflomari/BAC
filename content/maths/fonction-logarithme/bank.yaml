            note: "f garde un signe constant positif sur [0,1], entre ses deux valeurs extrêmes."
          - math: '\mathcal{A} = \int_0^1 f(t)\,dt = 2\ln2-1 \quad (\text{unités d''aire, question 2-b})'
            note: "Aire sous la courbe, f étant positive sur l'intervalle."
          - math: '1 \text{ unité d''aire} = \|\vec i\|\times\|\vec j\| = 2\,\text{cm}\times2\,\text{cm} = 4\,\text{cm}^2'
            note: "Conversion : le facteur est le produit des deux échelles du repère orthonormé."
          - math: '\boxed{\mathcal{A} = (2\ln2-1)\times4 = (8\ln2-4)\ \text{cm}^2 \approx 1{,}55\ \text{cm}^2}'
