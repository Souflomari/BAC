      $$\frac{3\ln(1+2x)}{x} = 3\times\frac{\ln(1+2x)}{x}$$

      **La limite de référence, coefficient $2$.** En posant $t=2x$ :
      $$\frac{\ln(1+2x)}{x} = 2\times\frac{\ln(1+t)}{t} \to 2$$

      **Le produit.**
      $$\lim_{x\to0}\frac{3\ln(1+2x)}{x} = 3\times2 = 6$$

  - id: LOG-29
    rung: "R4"
    difficulty_level: 4
    habilete: synthese
    skill_code: maths_fonction_logarithme
    tags: ["limites", "taux-accroissement", "quotient-factorise"]
    primary_misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
    stem: >
      Que vaut $\displaystyle\lim_{x \to 2} \dfrac{\ln(2x-3)}{x^{2}-4}$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{1}{2}$"
        correct: true
      - id: B
        text: "$\\dfrac{1}{4}$"
        correct: false
        misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
        feedback: >
          Tu as bien factorisé le dénominateur, mais oublié le facteur $2$
          caché dans $2x-3=1+2(x-2)$ : $\ln(1+2h)/h\to2$, pas $1$, en posant
          $h=x-2$.
      - id: C
        text: "$2$"
        correct: false
        misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
        feedback: >
          Le facteur $2$ du numérateur est correct, mais tu as oublié de le
          multiplier par le second facteur issu de la factorisation du
          dénominateur, $\dfrac{1}{x+2}\to\dfrac14$.
      - id: D
        text: >-
          $0$, en substituant directement $x=2$ dans le numérateur seul :
          $\ln(2\times2-3)=\ln(1)=0$, donc tout le quotient est nul.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          Constater que le numérateur s'annule en $x=2$ dit seulement qu'il y
          a une forme $\frac00$ à lever (le dénominateur s'annule aussi) —
          pas que le quotient vaut $0$. Il faut factoriser le dénominateur et
          faire apparaître le taux d'accroissement caché avant de conclure.
    correct_feedback: >
      Exactement : en posant $h=x-2$ (donc $2x-3=1+2h$) et en factorisant
      $x^2-4=(x-2)(x+2)$, l'expression devient
      $\dfrac{\ln(1+2h)}{h}\times\dfrac{1}{x+2}\to2\times\dfrac14=\dfrac12$.
    solution: |
      **Factoriser le dénominateur.** $x^2-4=(x-2)(x+2)$.

      **Reconnaître le numérateur.** $2x-3=1+2(x-2)$ ; en posant $h=x-2$
      (donc $h\to0$ quand $x\to2$) :
      $$\frac{\ln(2x-3)}{x^2-4} = \frac{\ln(1+2h)}{h(x+2)}$$
      $$= \frac{\ln(1+2h)}{h}\times\frac{1}{x+2}$$

      **Les deux limites.** $\dfrac{\ln(1+2h)}{h}\to2$ (référence,
      coefficient $2$) et $\dfrac{1}{x+2}\to\dfrac{1}{2+2}=\dfrac14$ quand
      $x\to2$ :
      $$\lim_{x\to2}\frac{\ln(2x-3)}{x^2-4} = 2\times\frac14 = \frac12$$

