  - id: LOG-25
    rung: "R4"
    difficulty_level: 2
    habilete: application_directe
    skill_code: maths_fonction_logarithme
    tags: ["limites", "taux-accroissement", "forme-indeterminee"]
    primary_misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
    stem: >
      Que vaut $\displaystyle\lim_{x \to 0} \dfrac{\ln(1+6x)}{x}$ ?
    type: mcq
    choices:
      - id: A
        text: "$6$"
        correct: true
      - id: B
        text: >-
          $\frac00$ est une forme indéterminée : la limite n'existe pas.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          « Indéterminée » ne veut pas dire « sans réponse » : ça veut dire
          qu'il faut reconnaître ce que l'expression cache. Ici, c'est le
          taux d'accroissement de $\ln$ entre $1$ et $1+6x$ — un calcul de
          plus suffit à conclure, la limite existe bel et bien.
      - id: C
        text: >-
          $0$, en remplaçant directement $x$ par $0$ :
          $\ln(1+0)/0=\ln(1)/0=0/0=0$.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          Substituer $x=0$ directement dans l'expression telle quelle ne
          calcule rien : $\frac00$ n'est pas $0$ « par défaut », c'est un
          signal qu'il faut retravailler l'écriture avant de faire tendre $x$
          vers $0$.
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
        feedback: >
          Tu as reconnu le taux d'accroissement de référence, mais oublié
          l'ajustement : $\ln(1+6x)/x$ n'est PAS $\ln(1+6x)/(6x)$. Il faut
          multiplier et diviser par $6$ pour faire apparaître le même nombre
          à l'intérieur du $\ln$ et au dénominateur.
    correct_feedback: >
      Exactement : en posant $t=6x$, $\dfrac{\ln(1+6x)}{x}=6\times\dfrac{\ln(1+t)}{t}\to6\times1=6$.
    solution: |
      **Le signal $\frac00$.** $\ln(1+6x)\to\ln(1)=0$ et $x\to0$ : forme
      indéterminée, pas absence de réponse.

      **Le geste : faire apparaître le même $t$ des deux côtés.** Pose $t=6x$ :
      $$\frac{\ln(1+6x)}{x} = 6\times\frac{\ln(1+6x)}{6x} = 6\times\frac{\ln(1+t)}{t}$$

      Quand $x\to0$, $t\to0$ aussi, et $\dfrac{\ln(1+t)}{t}\to1$ (limite de
      référence, chapitre 4) :
      $$\lim_{x\to0}\frac{\ln(1+6x)}{x} = 6\times1 = 6$$

  - id: LOG-26
    rung: "R4"
    difficulty_level: 3
    habilete: application_non_explicite
    skill_code: maths_fonction_logarithme
    tags: ["limites", "taux-accroissement", "forme-indeterminee", "coefficient-negatif"]
    primary_misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
    stem: >
      Que vaut $\displaystyle\lim_{x \to 0} \dfrac{\ln(1-4x)}{5x}$ ?
    type: mcq
    choices:
      - id: A
        text: "$-\\dfrac{4}{5}$"
        correct: true
      - id: B
        text: >-
          $\frac00$ divisée par $5$ reste indéterminée : la limite n'existe
          pas.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          Le facteur $\frac15$ au dénominateur ne change rien au fait qu'il
          faut LEVER l'indétermination du quotient, pas la déclarer
          insoluble. Une fois le taux d'accroissement reconnu, la limite
          existe et se calcule.
      - id: C
        text: >-
          $0$, en substituant $x=0$ dans le seul numérateur : $\ln(1-4\times0)=\ln(1)=0$,
          donc tout le quotient est nul.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          Le dénominateur $5x$ tend AUSSI vers $0$ — ce n'est pas « $0$
          divisé par un nombre », c'est $\frac00$. Substituer $x=0$ dans le
          seul numérateur ignore que le dénominateur s'effondre en même
          temps.
      - id: D
        text: "$-4$"
        correct: false
        misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
        feedback: >
          Tu as correctement retrouvé le taux d'accroissement intérieur,
          $\ln(1-4x)/x\to-4$, mais oublié le facteur $\frac15$ apporté par le
          dénominateur $5x$ (et non $x$ seul). Il manque la dernière
          multiplication.
    correct_feedback: >
      Exactement : $\dfrac{\ln(1-4x)}{5x}=\dfrac15\times\dfrac{\ln(1-4x)}{x}\to\dfrac15\times(-4)=-\dfrac45$.
    solution: |
      **Séparer le facteur $\frac15$.**
      $$\frac{\ln(1-4x)}{5x} = \frac15 \times \frac{\ln(1-4x)}{x}$$

      **Le taux d'accroissement intérieur.** En posant $t=-4x$ :
      $$\frac{\ln(1-4x)}{x} = -4\times\frac{\ln(1+t)}{t} \to -4\times1 = -4$$

      **Le produit.**
      $$\lim_{x\to0}\frac{\ln(1-4x)}{5x} = \frac15\times(-4) = -\frac45$$

  - id: LOG-27
    rung: "R4"
    difficulty_level: 3
    habilete: application_non_explicite
    skill_code: maths_fonction_logarithme
    tags: ["limites", "taux-accroissement", "changement-variable", "infini-fois-zero"]
    primary_misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
    stem: >
      Que vaut $\displaystyle\lim_{x \to +\infty} x\ln\!\left(1-\dfrac{5}{x}\right)$ ?
    type: mcq
    choices:
      - id: A
        text: "$-5$"
        correct: true
      - id: B
        text: "$0$"
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          $x\to+\infty$ et $\ln(1-5/x)\to0$ : c'est une forme
          $\infty\times0$, pas un produit qu'on peut lire directement. « Un
          facteur tend vers $0$ » ne suffit pas à conclure que le produit
          tend vers $0$ — il faut d'abord comparer les vitesses, ici par un
          changement de variable.
      - id: C
        text: >-
          La limite n'existe pas : $\infty\times0$ est une forme
          indéterminée non levée.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          Indéterminée signifie qu'il faut transformer l'écriture, pas
          qu'aucune valeur n'existe. Le changement de variable $t=-5/x$
          ramène exactement à la limite de référence $\ln(1+t)/t\to1$, qui,
          elle, existe.
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
        feedback: >
          Tu as retrouvé la bonne stratégie (poser $t=-5/x$) et la bonne
          limite de référence $\ln(1+t)/t\to1$, mais oublié de reporter le
          facteur $-5$ qui accompagne $t$ dans $x=-5/t$.
    correct_feedback: >
      Exactement : en posant $t=-\dfrac5x$ (donc $x=-\dfrac5t$, et
      $t\to0^-$ quand $x\to+\infty$), l'expression devient
      $-5\times\dfrac{\ln(1+t)}{t}\to-5\times1=-5$.
    solution: |
      **L'obstacle.** $x\to+\infty$, $\ln(1-5/x)\to0$ : forme
      $\infty\times0$.

      **Le changement de variable.** Pose $t=-\dfrac5x$ ; quand
      $x\to+\infty$, $t\to0^-$, et $x=-\dfrac5t$ :
      $$x\ln\!\left(1-\frac5x\right) = -\frac5t\ln(1+t) = -5\times\frac{\ln(1+t)}{t}$$

      **La limite de référence.** $\dfrac{\ln(1+t)}{t}\to1$ quand $t\to0$
      (chapitre 4), donc :
      $$\lim_{x\to+\infty} x\ln\!\left(1-\frac5x\right) = -5\times1 = -5$$

