          référence.
    correct_feedback: >
      Exactement : en posant $u=7x$, $\dfrac{\ln(1+7x)}{7x}=\dfrac{\ln(1+u)}{u}\to1$.
      Le coefficient $7$ figure déjà identiquement à l'intérieur du $\ln$ ET
      au dénominateur — aucun ajustement supplémentaire n'est nécessaire.
    solution: |
      **Le signal $\frac00$.** $\ln(1+7x)\to0$ et $7x\to0$ : forme
      indéterminée, pas absence de réponse.

      **Le même nombre des deux côtés, déjà en place.** Pose $u=7x$ : quand
      $x\to0$, $u\to0$ aussi, et
      $$\frac{\ln(1+7x)}{7x} = \frac{\ln(1+u)}{u} \to 1$$

      **Le point de vigilance.** Contrairement aux exemples précédents (où
      le dénominateur était $x$ seul, sans le coefficient de l'intérieur du
      $\ln$), ici le dénominateur contient déjà le facteur $7$ : il n'y a
      rien à multiplier ou diviser en plus. La limite vaut $1$, exactement
      le cas non habillé.

