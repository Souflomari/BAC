  # ── Wave-1 fixes (critiques bac + pédagogie), ajouté 2026-09-27 ───────────
  # LOG-31 répond au critique bac (direction M-2/I-1) : le bank.yaml cite
  # systématiquement ce taux de référence dans un registre de DÉRIVABILITÉ
  # (« en déduire que f est dérivable à droite en 0 », demi-tangente), jamais
  # en simple « que vaut cette limite ? ». Coefficient propre ($4$), distinct
  # des autres items de ce lot (6, -4, -5, 2). Ses distracteurs réutilisent
  # l'inventaire existant (aucun nouveau modèle, pour ne pas passer sous le
  # plancher de 3 en PRIMARY) : primary forme-0-sur-0-non-reconnue, secondary
  # facteur-multiplicatif-oublie et — pour le distracteur demi-tangente —
  # domaine-neglige, réutilisé ici pour l'erreur MIROIR (restreindre le
  # domaine à droite quand il ne l'est pas), une extension honnête à relire
  # par un humain si un modèle dédié à la tangente s'avère préférable.
  # LOG-32 répond au critique pédagogie I-2 (le « tell » du gabarit) : dans
  # LOG-25 à LOG-30, la clé n'est jamais un simple 1 — ici, le coefficient à
  # l'intérieur du ln (7) figure DÉJÀ identiquement au dénominateur, donc la
  # limite vaut exactement 1.
  - id: LOG-31
    rung: "R7"
    difficulty_level: 4
    habilete: synthese
    skill_code: maths_fonction_logarithme
    tags: ["limites", "taux-accroissement", "derivabilite", "interpretation-graphique"]
    primary_misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
    stem: >
      Soit $h$ la fonction définie sur $\left]-\dfrac14,+\infty\right[$ par
      $h(x) = \ln(1+4x)$. En utilisant le taux d'accroissement de $h$ entre
      $0$ et $t$, que peut-on affirmer sur la dérivabilité de $h$ en $0$, et
      quelle tangente cela donne-t-il à sa courbe au point d'abscisse $0$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $h$ est dérivable en $0$, avec $h'(0)=4$ : la courbe de $h$ admet,
          au point $(0\,;0)$, une tangente de coefficient directeur $4$.
        correct: true
      - id: B
        text: >-
          $\dfrac{\ln(1+4t)}{t}$ est une forme $\frac00$ : elle établit la
          continuité de $h$ en $0$, mais conclure à sa dérivabilité
          demanderait un calcul distinct de cette seule limite.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.forme-0-sur-0-non-reconnue
        feedback: >
          Cette limite ne se contente pas de montrer une continuité :
          reconnaître une forme $\frac00$ comme un taux d'accroissement,
          c'est reconnaître EXACTEMENT la définition du nombre dérivé — sa
          limite, quand elle est finie, EST la dérivabilité en ce point, pas
          un indice partiel qui resterait à confirmer.
      - id: C
        text: >-
          $h'(0)=1$, car $\dfrac{\ln(1+4t)}{t}$ se ramène à la limite de
          référence $\dfrac{\ln(1+u)}{u}\to1$.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.facteur-multiplicatif-oublie
        feedback: >
          Tu as reconnu la forme de référence, mais oublié d'ajuster le
          facteur : en posant $u=4t$, $\dfrac{\ln(1+4t)}{t}=4\times
          \dfrac{\ln(1+u)}{u}$, et seul le second facteur tend vers $1$. Le
          coefficient $4$ ne doit pas disparaître.
      - id: D
        text: >-
          $h$ n'est dérivable qu'à droite en $0$, le domaine de $h$
          empêchant d'approcher $0$ par la gauche, avec une demi-tangente de
          coefficient directeur $4$ au point $(0\,;0)$.
        correct: false
        misconception: mc.math.maths_fonction_logarithme.domaine-neglige
        feedback: >
          Le domaine de $h$ est $\left]-\frac14,+\infty\right[$ : il contient
          des réels des deux côtés de $0$ (par exemple $t=-0{,}1$ vérifie
          $1+4t=0{,}6>0$). Rien n'empêche d'approcher $0$ par la gauche ici
          — la tangente est entière, pas une demi-tangente.
    correct_feedback: >
      Exactement : reconnaître $\dfrac{\ln(1+4t)}{t}$ comme le taux
      d'accroissement de $h$ entre $0$ et $t$ prouve, d'un seul geste, que
      $h$ est dérivable en $0$ avec $h'(0)=4$ — et cela donne directement
      l'équation de la tangente en $(0\,;0)$.
    solution: |
      **Le taux d'accroissement, directement.** Puisque $h(0)=\ln(1)=0$ :
      $$\frac{h(t)-h(0)}{t} = \frac{\ln(1+4t)}{t}$$

      **La limite de référence, avec facteur $4$.** En posant $u=4t$ (donc
      $u\to0$ quand $t\to0$) :
      $$\frac{\ln(1+4t)}{t} = 4\times\frac{\ln(1+u)}{u}$$

      $$\lim_{t\to0}\frac{\ln(1+u)}{u} = 1$$
      $$\lim_{t\to0}\frac{\ln(1+4t)}{t} = 4\times1 = 4$$

      **La conclusion.** Cette limite existe et est finie : $h$ est
      dérivable en $0$, avec $h'(0)=4$.

      **L'interprétation graphique.** La courbe de $h$ admet, au point
      $(0\,;0)$, une tangente de coefficient directeur $4$ — le domaine de
      $h$ entoure $0$ des deux côtés, ce n'est pas une demi-tangente.

