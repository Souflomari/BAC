      - id: q7
        stem: |-
          Vérifier que $H:x\mapsto x\ln x - x$ est une primitive de $x\mapsto \ln x$ sur $]0,+\infty[$, puis, à l'aide d'une intégration par parties, montrer que $\displaystyle\int_1^e (\ln x)^2\,dx = e - 2$.
