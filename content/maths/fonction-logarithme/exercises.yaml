          Montrer que $f(x) - x = -(\ln x - 1)^2$, et en déduire la position relative de $(C)$ et $(\Delta)$.
        reasoning: |-
          Directement, $f(x) - x = -(\ln x - 1)^2$. Un carré étant $\ge 0$, son opposé est $\le 0$ : $f(x) \le x$, donc **$(C)$ est en dessous de $(\Delta)$** sur tout $]0,+\infty[$. L'égalité (contact) a lieu uniquement quand $\ln x - 1 = 0$, soit $x = e$ : les deux courbes se touchent au point $(e,e)$. C'est le miroir exact de la position du sujet 2019 (où la courbe était au-dessus).
