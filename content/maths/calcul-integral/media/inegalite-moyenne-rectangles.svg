<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="L’inégalité de la moyenne sur eˣ entre 0 et 1 : le minimum m = 1 et le maximum M = e encadrent la fonction ; un rectangle bas de hauteur 1 tient entièrement sous la courbe, un rectangle haut de hauteur e la recouvre entièrement, ce qui encadre l’aire sous la courbe entre 1 et e.">
  <title>L’inégalité de la moyenne — eˣ encadré par deux rectangles sur [0, 1]</title>
  <!--
    inegalite-moyenne-rectangles.svg — figure STAGED (3 étapes), rung R5.

    Exemple travaillé du R5 : eˣ sur [0,1], m = e⁰ = 1 (minimum, en x=0),
    M = e¹ = e (maximum, en x=1) — eˣ est strictement croissante, donc son
    minimum et son maximum sur [0,1] sont exactement ses valeurs aux bornes.

    Géométrie (calculée, pas devinée) :
      x_px = 100 + 400·x ,  y_px = 350 − 100·eˣ   (baseline eˣ=0 en y=350 ;
      la courbe elle-même ne touche jamais cette baseline, eˣ ≥ 1 > 0)
      x=0 → (100, 250)  [m = 1]     x=1 → (500, 78,2)  [M = e ≈ 2,718]
      échantillonné à pas régulier de 0,05 en x (21 points).

    Rectangle bas (inscrit) : x∈[100,500], y∈[250,350] — hauteur m=1,
      largeur 1 (unité de repère) ⇒ aire = m·(b−a) = 1.
    Rectangle haut (circonscrit) : x∈[100,500], y∈[78,2 ; 350] — hauteur
      M=e, aire = M·(b−a) = e ≈ 2,718. Il contient strictement le rectangle
      bas ; la courbe eˣ (et donc l'aire sous elle) reste coincée entre les
      deux, exactement l'inégalité 1 ≤ ∫₀¹eˣdx ≤ e.

    Rôle des couleurs :
      courbe eˣ, repères m/M, bornes 0/1     : --figure-ink / --figure-ink-soft
        (données — étape 1)
      rectangle bas, rectangle haut, boîte
        formule                               : --figure-accent (le foyer)
      axes                                    : --figure-ink-soft (chrome neutre)

    Les deux rectangles se recouvrent sur [250,350] (le rectangle haut
    contient le bas) : ils sont peints à des opacités DIRECTES différentes
    (pas de superposition calculée) — bas 0,20 (plein, la certitude : cette
    aire est GARANTIE sous la courbe), haut 0,12 avec un contour tireté
    (la borne SUPÉRIEURE, pas une certitude d'inclusion complète). La
    différence de contour (plein vs tireté) code visuellement lequel est
    la garantie et lequel est la limite.

    Mise en étapes (LESSON-EXPERIENCE-SPEC §2.5 — graphe, ordre canonique
    axes → données → lecture ; axes en chrome permanent, non-stepped) :
      step-1 : la courbe eˣ, les niveaux m et M repérés (données).
      step-2 : le rectangle bas, aire = m(b−a) = 1 (lecture 1).
      step-3 : le rectangle haut, aire = M(b−a) = e, et l'encadrement
               1 ≤ ∫₀¹eˣdx ≤ e dans la boîte formule (lecture 2).

    Les captions sont portées par inegalite-moyenne-rectangles.stages.json
    — aucun texte de légende baké ici.
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    L’inégalité de la moyenne — eˣ encadré par deux rectangles sur [0, 1]
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="350" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Axes — ink-soft, chrome neutre, toujours visibles -->
  <line x1="60" y1="350" x2="615" y2="350"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="615,350 603,345.5 603,354.5" fill="var(--figure-ink-soft)"/>
  <line x1="100" y1="350" x2="100" y2="55"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="100,55 95.5,66 104.5,66" fill="var(--figure-ink-soft)"/>
  <text x="622" y="354" text-anchor="middle" font-size="12" font-style="italic"
        fill="var(--figure-ink-soft)">x</text>
  <text x="92" y="59" text-anchor="end" font-size="12" font-style="italic"
        fill="var(--figure-ink-soft)">y</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — la courbe eˣ, les niveaux m et M (données)
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <path d="M100,250 L120,244.9 L140,239.5 L160,233.8 L180,227.9 L200,221.6
             L220,215 L240,208.1 L260,200.8 L280,193.2 L300,185.1
             L320,176.7 L340,167.8 L360,158.5 L380,148.6 L400,138.3
             L420,127.5 L440,116 L460,104 L480,91.4 L500,78.2"
          fill="none" stroke="var(--figure-ink)"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="430" y="103" font-size="13" fill="var(--figure-ink)"
          ><tspan font-style="italic">e</tspan><tspan dy="-5" font-size="8">x</tspan></text>

    <!-- Niveaux m et M — repères tiretés, sur toute la largeur du domaine -->
    <line x1="100" y1="250" x2="500" y2="250"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="97" y1="250" x2="103" y2="250" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="90" y="254" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">m = 1</text>

    <line x1="100" y1="78.2" x2="500" y2="78.2"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="97" y1="78.2" x2="103" y2="78.2" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="90" y="82" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">M = e</text>

    <!-- Bornes 0 et 1 -->
    <text x="100" y="364" text-anchor="middle" font-size="11"
          fill="var(--figure-ink-soft)">0</text>
    <text x="500" y="364" text-anchor="middle" font-size="11"
          fill="var(--figure-ink-soft)">1</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — le rectangle bas, inscrit (lecture 1)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <rect x="100" y="250" width="400" height="100"
          fill="var(--figure-accent)" fill-opacity="0.20"
          stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="300" y="304" text-anchor="middle" font-size="11"
          fill="var(--figure-ink)">aire = m(b−a) = 1</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — le rectangle haut, circonscrit, l'encadrement (lecture 2)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <rect x="100" y="78.2" width="400" height="271.8"
          fill="var(--figure-accent)" fill-opacity="0.12"
          stroke="var(--figure-accent)" stroke-width="1.4" stroke-dasharray="6,3"/>
    <text x="300" y="160" text-anchor="middle" font-size="11"
          fill="var(--figure-accent)">aire = M(b−a) = e ≈ 2,718</text>

    <!-- Boîte formule — l'encadrement complet -->
    <rect x="150" y="42" width="230" height="50" rx="8"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="265" y="74" text-anchor="middle" font-size="13"
          fill="var(--figure-accent)"><tspan>1 ≤ </tspan><tspan
          font-size="18">&#8747;</tspan><tspan
          dy="-8" font-size="8">1</tspan><tspan
          dy="8" dx="-5" font-size="8">0</tspan><tspan
          dy="0"> e</tspan><tspan
          dy="-6" font-size="8">x</tspan><tspan
          dy="6"> dx ≤ e</tspan></text>
  </g><!-- /step-3 -->

</svg>
