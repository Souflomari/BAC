<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="Aire entre deux courbes : f(x) = x et g(x) = x au carré, qui se croisent en (0,0) et (1,1) ; f est au-dessus de g sur [0,1] ; la région comprise entre les deux courbes, hachurée, vaut 1/6.">
  <title>Aire entre deux courbes — f(x) = x et g(x) = x² sur [0, 1]</title>
  <!--
    aire-entre-courbes.svg — figure STATIQUE, géométrie calculée (pas devinée).
    STAGED (docs/design/LESSON-EXPERIENCE-SPEC.md §2.5 : graphe -> toujours
    staged, ordre canonique axes -> données -> lecture ; les axes restent un
    chrome permanent, non-stepped, comme dans aire-sous-courbe.svg /
    tangente-derivee.svg / regimes-uc.svg).
      step-1 : les deux courbes f(x) = x et g(x) = x² (données).
      step-2 : + la région hachurée entre elles, les points d'intersection,
               les bornes 0/1, la boîte formule (lecture).

    Fonctions tracées (exemple travaillé du rung "Aire entre deux courbes") :
      f(x) = x       (en ink)
      g(x) = x²      (en ink-soft)
    Points d'intersection : f(x) = g(x) ⟺ x(1−x) = 0 ⟺ x = 0 ou x = 1.
    Sur ]0,1[, un point test (x=0,5) donne f=0,5 > g=0,25 : f ≥ g sur [0,1].

    Correspondance repère -> pixels :
      origine (x=0, y=0)  : (x0,y0) = (140, 330)
      échelle (identique sur les deux axes) : 220 px par unité
      x(u) = 140 + 220·u        y_f(u) = 330 − 220·u        (pour f(x)=x)
                                 y_g(u) = 330 − 220·u²       (pour g(x)=x²)

    Points calculés à pas réguliers de 0,05 en x, de x=0 à x=1,05 (léger
    prolongement au-delà de x=1 pour montrer que les courbes continuent
    et redivergent — g reprend le dessus dès x>1, cohérent avec le test
    de signe fait dans la leçon). Vérification de quelques points :
      x=0    -> f:(140,330)  g:(140,330)   (les deux courbes se touchent)
      x=0,5  -> f:(250,220)  g:(250,275)   (écart maximal : f−g = 0,25)
      x=1    -> f:(360,110)  g:(360,110)   (les deux courbes se touchent)
      x=1,05 -> f:(371,99)   g:(371,87.45) (g repasse au-dessus de f)

    Aire hachurée = ∫₀¹ (f−g)(x) dx = ∫₀¹ (x − x²) dx
                  = [x²/2 − x³/3]₀¹ = (1/2 − 1/3) − 0 = 1/6.

    Rôle des couleurs (règle stricte de cette figure : l'accent sert
    UNIQUEMENT le foyer, c'est-à-dire la région hachurée et ce qui
    l'annote directement) :
      région hachurée (remplissage seul, bornée par les deux courbes
        elles-mêmes), les deux points d'intersection, les bornes 0 et 1,
        la formule                                    : --figure-accent
      courbe de f                                       : --figure-ink
      courbe de g                                       : --figure-ink-soft
      axes, flèches, labels x/y                          : --figure-ink-soft
      fond du panneau                                    : --figure-surface

    Les captions sont portées par aire-entre-courbes.stages.json — aucun
    texte de légende baké ici (même convention que aire-sous-courbe.svg).
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Aire entre deux courbes — f(x) = x et g(x) = x² sur [0, 1]
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="350" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Axes — ink-soft, chrome neutre, toujours visibles -->
  <line x1="140" y1="330" x2="480" y2="330"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="480,330 468,325.5 468,334.5" fill="var(--figure-ink-soft)"/>
  <line x1="140" y1="330" x2="140" y2="50"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="140,50 135.5,61 144.5,61" fill="var(--figure-ink-soft)"/>
  <text x="487" y="334" font-size="12" font-style="italic"
        fill="var(--figure-ink-soft)">x</text>
  <text x="132" y="54" text-anchor="end" font-size="12" font-style="italic"
        fill="var(--figure-ink-soft)">y</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les deux courbes, les données
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Courbe de f(x) = x — ink, prolongée légèrement au-delà de x=1 -->
    <path d="M140,330 L151,319 L162,308 L173,297 L184,286 L195,275
             L206,264 L217,253 L228,242 L239,231 L250,220
             L261,209 L272,198 L283,187 L294,176 L305,165
             L316,154 L327,143 L338,132 L349,121 L360,110 L371,99"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Courbe de g(x) = x² — ink-soft, prolongée légèrement au-delà de x=1 -->
    <path d="M140,330 L151,329.45 L162,327.8 L173,325.05 L184,321.2 L195,316.25
             L206,310.2 L217,303.05 L228,294.8 L239,285.45 L250,275
             L261,263.45 L272,250.8 L283,237.05 L294,222.2 L305,206.25
             L316,189.2 L327,171.05 L338,151.8 L349,131.45 L360,110 L371,87.45"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Labels des courbes, à côté d'elles (pas de légende séparée) -->
    <text x="248" y="182" font-size="13" font-style="italic"
          fill="var(--figure-ink)">f(x) = x</text>
    <text x="180" y="300" font-size="13" font-style="italic"
          fill="var(--figure-ink-soft)">g(x) = x²</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la région hachurée, les intersections, les bornes,
       la formule : la lecture
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Région hachurée entre f et g sur [0,1] — LE FOYER.
         Remplissage seul (accent, opacité faible) ; les courbes
         elles-mêmes (step-1, déjà tracées) en forment le contour —
         pas de contour accent séparé ici. -->
    <path d="M140,330 L151,319 L162,308 L173,297 L184,286 L195,275
             L206,264 L217,253 L228,242 L239,231 L250,220
             L261,209 L272,198 L283,187 L294,176 L305,165
             L316,154 L327,143 L338,132 L349,121 L360,110
             L349,131.45 L338,151.8 L327,171.05 L316,189.2 L305,206.25
             L294,222.2 L283,237.05 L272,250.8 L261,263.45 L250,275
             L239,285.45 L228,294.8 L217,303.05 L206,310.2 L195,316.25
             L184,321.2 L173,325.05 L162,327.8 L151,329.45 Z"
          fill="var(--figure-accent)" fill-opacity="0.18" stroke="none"/>

    <!-- Points d'intersection — (0,0) et (1,1), le foyer -->
    <circle cx="140" cy="330" r="3" fill="var(--figure-accent)"/>
    <circle cx="360" cy="110" r="3" fill="var(--figure-accent)"/>

    <!-- Bornes 0 et 1, sur l'axe des x -->
    <line x1="360" y1="325" x2="360" y2="335"
          stroke="var(--figure-accent)" stroke-width="1.2"/>
    <text x="140" y="344" text-anchor="middle" font-size="11"
          fill="var(--figure-accent)">0</text>
    <text x="360" y="344" text-anchor="middle" font-size="11"
          fill="var(--figure-accent)">1</text>

    <!-- Boîte formule — pointe vers la région hachurée -->
    <line x1="405" y1="222" x2="250" y2="247"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="250" cy="247" r="2.5" fill="var(--figure-accent)"/>

    <rect x="405" y="170" width="190" height="90" rx="8"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="500" y="186" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-accent)">aire entre les courbes</text>
    <text x="500" y="213" text-anchor="middle" font-size="14"
          fill="var(--figure-accent)"><tspan>Aire = </tspan><tspan
          font-size="22">&#8747;</tspan><tspan
          dy="-10" font-size="9">1</tspan><tspan
          dy="12" dx="-6" font-size="9">0</tspan><tspan
          dy="-2" dx="4" font-style="italic"> (f&#8722;g)(x) dx</tspan></text>
    <text x="500" y="238" text-anchor="middle" font-size="13"
          fill="var(--figure-accent)">= 1/6 u.a.</text>
  </g><!-- /step-2 -->

</svg>
