          vaut $3$ cm, donc le nombre change bel et bien.
    correct_feedback: >
      $1$ u.v. $=3^3=27\ \text{cm}^3$. D'où $2\pi$ u.v.
      $=2\pi\times27=54\pi\ \text{cm}^3$.
    solution: |
      $$1\ \text{u.v.} = 3^3 = 27\ \text{cm}^3$$
      $$2\pi\ \text{u.v.} = 2\pi\times27 = 54\pi\ \text{cm}^3$$

  - id: CI-48
    rung: "R9"
    habilete: application_directe
    difficulty_level: 3
    skill_code: maths_calcul_integral
    tags: [volume_revolution, unites_volume, comparaison]
    primary_misconception: mc.math.maths_calcul_integral.conversion-unites-volume
    stem: >
      Un solide de révolution a un volume de $3$ unités de volume. Dans un
      repère orthonormé où $\|\vec i\,\|=1\ \text{cm}$, puis dans un repère
      orthonormé où $\|\vec i\,\|=2\ \text{cm}$, ce volume vaut
      respectivement, en $\text{cm}^3$ :
    type: mcq
    choices:
      - id: A
        text: "$3$ et $12$"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Le premier repère ($k=1$) est correct : $1$ u.v. $=1^3=1\
          \text{cm}^3$, le nombre ne change pas. Mais le second ($k=2$)
          applique le facteur de l'AIRE, $2^2=4$, au lieu du CUBE $2^3=8$ :
          $3\times4=12$ compte deux directions là où il y en a trois.
      - id: B
        text: "$3$ et $6$"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Le premier repère ($k=1$) est correct. Mais le second ($k=2$)
          applique le facteur d'une LONGUEUR, $2$, au lieu du CUBE $2^3=8$ :
          une seule direction sur les trois qui composent un volume.
      - id: C
        text: "$3$ et $24$"
        correct: true
      - id: D
        text: "$3$ et $3$"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Le premier repère ($k=1$) est correct. Mais le second ($k=2$)
          n'applique AUCUNE conversion : c'est justement parce que le bac
          écrit souvent $\|\vec i\,\|=1$ cm — où u.v. et cm³ coïncident —
          que cette conversion est facile à oublier le jour où l'unité
          change.
    correct_feedback: >
      Avec $k=1$ : $1$ u.v. $=1^3=1\ \text{cm}^3$, donc $3$ u.v.
      $=3\ \text{cm}^3$ — le nombre ne bouge pas, et c'est bien pour ça que
      la conversion passe inaperçue au bac. Avec $k=2$ : $1$ u.v.
      $=2^3=8\ \text{cm}^3$, donc $3$ u.v. $=24\ \text{cm}^3$.
    solution: |
      **Avec $k=1$ :** $1$ u.v. $=1^3=1\ \text{cm}^3$, donc $3$ u.v.
      $=3\ \text{cm}^3$ — le nombre ne bouge pas.

      **Avec $k=2$ :** $1$ u.v. $=2^3=8\ \text{cm}^3$, donc $3$ u.v.
      $=24\ \text{cm}^3$.

      C'est parce que le bac écrit presque toujours $\|\vec i\,\|=1$ cm
      que cette conversion ne s'exerce jamais — jusqu'au jour où l'énoncé
      change d'unité.

  # CI-49 — synthèse R10 : la donnée (une IPP déjà résolue, ∫ln x = e²+1) fixe
  # ∫f² directement, sans passer par le choix « f au carré ou pas ». Un
  # élève « oubli-du-carre » n'a donc, dans cette graine précise, aucune
  # valeur DISTINCTE à produire (il devrait intégrer √(ln x), non fourni) —
  # taguer ce distracteur aurait exigé un nombre non dérivable des données ou
  # aurait fait coïncider deux modèles. Gardé : `sans-pi` et deux variantes
  # de `conversion-unites-volume` (k² et ×1), qui restent honnêtement
  # calculables sur cette graine. Décision d'auteur, pas une case du tableau
  # §7.2 laissée vide par erreur — voir le rapport de livraison.
  - id: CI-49
    rung: "R10"
    habilete: synthese
    difficulty_level: 5
    skill_code: maths_calcul_integral
    tags: [volume_revolution, synthese, integration_par_parties, unites_volume]
    primary_misconception: mc.math.maths_calcul_integral.conversion-unites-volume
    stem: >
      Soit $f$ la fonction définie sur $\left[1,e^2\right]$ par
      $f(x)=\sqrt{\ln x}$. On donne $\displaystyle\int_1^{e^2} \ln x\,
      \mathrm{d}x = e^2+1$. Dans un repère orthonormé où $\|\vec
      i\,\|=2\ \text{cm}$, quel est, en $\text{cm}^3$, le volume du solide
      engendré par la rotation d'un tour complet autour de l'axe des
      abscisses de la portion de courbe de $f$ relative à $\left[1,e^2
      \right]$ ?
    type: mcq
    choices:
      - id: A
        text: "$4\\pi(e^2+1)\\ \\text{cm}^3$"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Le volume en u.v. est correct, $\pi(e^2+1)$, mais la conversion
          applique le facteur de l'AIRE, $2^2=4$, au lieu du CUBE $2^3=8$ :
          deux directions comptées sur trois.
      - id: B
        text: "$8(e^2+1)\\ \\text{cm}^3$"
        correct: false
        misconception: mc.math.maths_calcul_integral.volume-integrale-sans-pi
        feedback: >
          Modèle détecté : l'intégrale rendue telle quelle, sans le $\pi$.
          $f(x)^2=\ln x$, donc $\int_1^{e^2}\big(f(x)\big)^2\,
          \mathrm{d}x=e^2+1$ — mais il manque le $\pi$ avant de convertir :
          $8(e^2+1)$ oublie la moitié du travail de la rotation.
      - id: C
        text: "$8\\pi(e^2+1)\\ \\text{cm}^3$"
        correct: true
      - id: D
        text: "$\\pi(e^2+1)\\ \\text{cm}^3$"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Le volume en u.v. est correct, $\pi(e^2+1)$, mais aucune
          conversion n'a été appliquée : ici $\|\vec i\,\|=2$ cm, pas $1$
          cm, donc $1$ u.v. $=2^3=8\ \text{cm}^3$, pas $1\ \text{cm}^3$.
    correct_feedback: >
      $f(x)^2=\big(\sqrt{\ln x}\big)^2=\ln x$ : le carré supprime la
      racine, et l'intégrale voulue est exactement celle qui est donnée.
      $V=\pi\int_1^{e^2}\ln x\,\mathrm{d}x=\pi(e^2+1)$ u.v. Avec $\|\vec
      i\,\|=2$ cm, $1$ u.v. $=2^3=8\ \text{cm}^3$, donc
      $V=8\pi(e^2+1)\ \text{cm}^3$.
    solution: |
      **Le carré fait disparaître la racine :** $f(x)^2=\ln x$, et
      l'intégrale voulue est exactement celle qui est donnée :

      $$V = \pi\int_1^{e^2}\ln x\,\mathrm{d}x = \pi(e^2+1)\ \text{u.v.}$$

      **La conversion** ($\|\vec i\,\|=2$ cm) : $1$ u.v. $=2^3=8\
      \text{cm}^3$, donc

      $$V = 8\pi(e^2+1)\ \text{cm}^3$$

  - id: CI-50
    rung: "R10"
    habilete: synthese
    difficulty_level: 5
    skill_code: maths_calcul_integral
    tags: [volume_revolution, synthese, integration_par_parties, carre_mal_place]
    primary_misconception: [mc.math.maths_calcul_integral.volume-carre-mal-place, mc.math.maths_calcul_integral.linearite-abusive]
    stem: >
      Soit $f$ la fonction définie sur $[1,e]$ par $f(x)=\sqrt{x\ln x}$. On
      donne $\displaystyle\int_1^e t\ln t\,\mathrm{d}t = \dfrac{e^2+1}{4}$.
      Quel est le volume, en unités de volume, du solide engendré par la
      rotation d'un tour complet autour de l'axe des abscisses de la
      portion de courbe de $f$ relative à $[1,e]$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{\\pi(e^2+1)^2}{16}$"
        correct: false
        misconception: [mc.math.maths_calcul_integral.volume-carre-mal-place, mc.math.maths_calcul_integral.linearite-abusive]
        feedback: >
          Modèle détecté : le carré posé sur l'intégrale au lieu de la
          fonction. Ce choix reprend la valeur donnée comme si elle était
          $\int_1^e f(x)\,\mathrm{d}x$, puis l'élève au carré — mais
          $f(x)^2=x\ln x$ est déjà le résultat du carré : l'intégrale
          donnée EST $\int_1^e f^2$, elle n'a pas besoin d'être élevée au
          carré une seconde fois.
      - id: B
        text: "$\\dfrac{e^2+1}{4}$"
        correct: false
        misconception: mc.math.maths_calcul_integral.volume-integrale-sans-pi
        feedback: >
          Modèle détecté : l'intégrale rendue telle quelle, sans le $\pi$.
          $f(x)^2=x\ln x$, donc $\int_1^e \big(f(x)\big)^2\,\mathrm{d}x=
          \frac{e^2+1}{4}$ est la bonne intégrale, mais il manque le $\pi$
          qui en fait un volume.
      - id: C
        text: "$\\dfrac{\\pi(e^2+1)}{4}$"
        correct: true
    correct_feedback: >
      $f(x)^2=\big(\sqrt{x\ln x}\big)^2=x\ln x$ : le carré supprime la
      racine, et l'intégrale voulue, $\int_1^e x\ln x\,\mathrm{d}x$, est
      exactement celle qui est donnée (avec $t$ renommée $x$). $V=
      \pi\times\dfrac{e^2+1}{4}=\dfrac{\pi(e^2+1)}{4}$ u.v. — le montage
      standard d'une question de volume au bac : une racine dans $f$, une
      IPP qui vient d'être préparée.
    solution: |
      **Le carré fait disparaître la racine :** $f(x)^2=x\ln x$, et
      l'intégrale voulue, $\int_1^e x\ln x\,\mathrm{d}x$, est exactement
      celle qui est donnée (avec $t$ renommée $x$) :

      $$V = \pi\int_1^e \big(f(x)\big)^2\,\mathrm{d}x = \pi\times\frac{e^2+1}{4} = \frac{\pi(e^2+1)}{4}\ \text{u.v.}$$

      Le montage est celui du bac (§8.1/§8.4) : une racine dans $f$ pour
      que $f^2$ soit une intégrale déjà rencontrée.

