        feedback: >
          Modèle détecté : le facteur d'une LONGUEUR ($k$) appliqué à un
          volume. Un volume est un produit de trois longueurs ;
          multiplier une seule fois par l'échelle ne convertirait qu'une
          longueur.
      - id: B
        text: "$54\\pi\\ \\text{cm}^3$, l'unité de volume valant $3^3=27\\ \\text{cm}^3$"
        correct: true
      - id: C
        text: "$18\\pi\\ \\text{cm}^3$, en multipliant par $3^2$, comme pour une aire"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Modèle détecté : le facteur de l'AIRE ($k^2$) appliqué à un
          volume. $1$ u.v. est le volume d'un CUBE, pas l'aire d'un
          carré : il faut le cube de l'échelle, pas son carré.
      - id: D
        text: "$2\\pi\\ \\text{cm}^3$, le nombre restant inchangé d'une unité à l'autre"
        correct: false
        misconception: mc.math.maths_calcul_integral.conversion-unites-volume
        feedback: >
          Modèle détecté : aucune conversion appliquée. u.v. et cm³ ne
