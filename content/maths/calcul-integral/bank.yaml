        vérifie 0 < x_k < 1/n <= 1 pour k dans {1,...,n}, ce qui autorise (5)
        terme à terme, d'où 0 <= w_n - u_n <= (e/2) somme des x_k^2 ;
        (7) la dérivée de (1+x^2)^(-2) vaut -4x/(1+x^2)^3, strictement
        négative sur ]0;1] ; (8) la décroissance donne, sur chaque tranche
        [(k-1)/n ; k/n], la minoration de l'intégrale par (1/n)(1+(k/n)^2)^(-2) ;
        (9) x_k^2 = (1/n) x [(1/n)(1+(k/n)^2)^(-2)], donc par (8) puis Chasles
