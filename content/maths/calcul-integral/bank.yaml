    intro: |-
      **Analyse — sommes de Riemann et encadrement de l'exponentielle (examen national, session de rattrapage 2024, Sciences Mathématiques — Exercice 2, 3,5 points).**

      *Le fil de l'exercice.* Tout part d'une seule intégrale, $\displaystyle\int_0^1 \frac{1}{1+x^2}\,\mathrm{d}x$, et d'une seule idée : la somme $u_n = \sum_{k=1}^{n} \frac{n}{n^2+k^2}$ est **exactement** une somme de Riemann de $x \mapsto \frac{1}{1+x^2}$ sur $[0,1]$ — il suffit de factoriser $n^2$ au dénominateur pour la voir. Sa limite tombe alors sans calcul supplémentaire.

      La suite $(w_n)$ remplace chaque terme $\frac{n}{n^2+k^2}$ par $e^{\frac{n}{n^2+k^2}} - 1$. Comme $e^t - 1 \approx t$ quand $t$ est petit, on devine que $w_n$ et $u_n$ finissent par se confondre — mais deviner ne suffit pas. Les questions 2 à 5 construisent, brique par brique, la **majoration explicite** de l'écart : d'abord $0 \leq e^t - 1 - t \leq \frac{e}{2}t^2$, puis la somme des carrés $\sum \left(\frac{n}{n^2+k^2}\right)^2$ comparée à une intégrale découpée en tranches, jusqu'à l'encadrement final $0 \leq w_n - u_n \leq \frac{e}{2n}$, qui tend vers $0$. Chaque question est une marche de cet escalier : aucune n'est décorative.
    questions:
      - id: q1-a
        part: "Question 1 — L'intégrale de référence, puis la somme de Riemann"
        stem: |-
          **(0,25 pt)** Calculer l'intégrale : $\displaystyle\int_0^1 \frac{1}{1+x^2}\, dx$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Calculer une intégrale, c'est toujours le même geste depuis le R1 : trouver une primitive $F$ de l'intégrande, puis écrire $F(b)-F(a)$. Toute la question tient donc dans une seule reconnaissance — quelle fonction a pour dérivée $\dfrac{1}{1+x^2}$ ?

          C'est la fonction **arctangente**, la réciproque de la restriction de $\tan$ à $\left]-\frac{\pi}{2},\frac{\pi}{2}\right[$ : par construction, $\arctan$ est dérivable sur $\mathbb{R}$ et

          $$\left(\arctan x\right)^{\prime} = \frac{1}{1+x^2}$$

          C'est une primitive de référence du programme de Sciences Mathématiques, au même titre que $\ln$ pour $\dfrac1x$ ou $e^x$ pour lui-même : elle se reconnaît, elle ne se redémontre pas en pleine épreuve. Le $0{,}25$ point du barème dit d'ailleurs exactement cela — c'est une question de lecture, pas de calcul.

          Applique alors la définition du R1 :

          $$\int_0^1 \frac{1}{1+x^2}\,\mathrm{d}x = \left[\arctan x\right]_0^1 = \arctan(1) - \arctan(0)$$

          $\tan\left(\frac{\pi}{4}\right) = 1$ et $\frac{\pi}{4}$ appartient bien à $\left]-\frac{\pi}{2},\frac{\pi}{2}\right[$, donc $\arctan(1) = \dfrac{\pi}{4}$ ; et $\tan(0)=0$ donne $\arctan(0)=0$.

          $$\boxed{\int_0^1 \frac{1}{1+x^2}\,\mathrm{d}x = \frac{\pi}{4}}$$

          **Le piège à éviter.** Le réflexe « je divise par la dérivée du dénominateur » : écrire $\displaystyle\int \frac{1}{1+x^2}\,\mathrm{d}x = \frac{\ln(1+x^2)}{2x}$ ou quelque chose d'approchant. Ce réflexe vient de la forme $\dfrac{u^{\prime}}{u}$, dont une primitive est $\ln|u|$ — mais ici le numérateur est $1$, pas $2x$. La forme $\dfrac{u^{\prime}}{u}$ ne s'applique **pas**, et rien ne permet de « sortir » un $\dfrac{1}{2x}$ d'une intégrale : $x$ est la variable d'intégration, jamais une constante qu'on met devant le signe somme. Retiens plutôt le résultat que cette question installe : $\dfrac{\pi}{4}$ est la valeur vers laquelle tout l'exercice va converger, deux fois.
        steps:
          - math: '\left(\arctan x\right)^{\prime} = \dfrac{1}{1+x^2} \qquad (x \in \mathbb{R})'
            note: "Primitive de référence du programme SM : arctan est la primitive de 1/(1+x^2) qui s'annule en 0."
          - math: '\int_0^1 \dfrac{1}{1+x^2}\,\mathrm{d}x = \bigl[\arctan x\bigr]_0^1 = \arctan(1) - \arctan(0)'
            note: "Définition du R1 : F(1) moins F(0)."
          - math: '\arctan(1) = \dfrac{\pi}{4},\qquad \arctan(0) = 0 \qquad\Longrightarrow\qquad \int_0^1 \dfrac{1}{1+x^2}\,\mathrm{d}x = \dfrac{\pi}{4}'
            note: "tan(pi/4) = 1 et tan(0) = 0, avec pi/4 dans l'intervalle de définition de arctan."
      - id: q1-b
        part: "Question 1 — L'intégrale de référence, puis la somme de Riemann"
        stem: |-
          **(0,5 pt)** Pour tout entier $n \geq 1$, on pose : $u_n = \displaystyle\sum_{k=1}^{k=n} \frac{n}{n^2+k^2}$

          Montrer que la suite $(u_n)_{n\geq 1}$ est convergente puis déterminer sa limite.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On te demande la limite d'une somme dont le **nombre de termes grandit avec $n$** — donc aucune règle d'opérations sur les limites ne s'applique : on ne peut pas « passer à la limite terme par terme » quand le nombre de termes bouge. Le seul outil du programme SM qui traite ce cas s'appelle **somme de Riemann**, et il faut faire apparaître sa forme exacte :

          $$S_n = \frac{1}{n}\sum_{k=1}^{n} f\!\left(\frac{k}{n}\right) \xrightarrow[n\to+\infty]{} \int_0^1 f(x)\,\mathrm{d}x \qquad (f \text{ continue sur } [0,1])$$

          Le geste qui révèle cette forme est toujours le même : **factoriser la puissance de $n$ la plus haute** au dénominateur, pour ne plus voir que le rapport $\frac{k}{n}$.

          $$\frac{n}{n^2+k^2} = \frac{n}{n^2\left(1+\dfrac{k^2}{n^2}\right)} = \frac{1}{n}\cdot\frac{1}{1+\left(\dfrac{k}{n}\right)^2}$$

          Le facteur $\dfrac1n$ sort de la somme, et il reste exactement $f\!\left(\frac{k}{n}\right)$ avec $f(x) = \dfrac{1}{1+x^2}$ :

          $$u_n = \frac{1}{n}\sum_{k=1}^{n} f\!\left(\frac{k}{n}\right)$$

          $f$ est continue sur $[0,1]$ (quotient de fonctions continues, dénominateur $1+x^2 \geq 1$ ne s'annulant jamais). Le théorème s'applique : $(u_n)$ **converge**, et sa limite est l'intégrale — celle que la question 1-a vient de calculer.

          $$\boxed{\lim_{n\to+\infty} u_n = \int_0^1 \frac{1}{1+x^2}\,\mathrm{d}x = \frac{\pi}{4}}$$

          **Le contrôle qui rassure.** Calcule les premiers termes à la main : $u_1 = \dfrac{1}{1+1} = \dfrac12$, puis $u_2 = \dfrac{2}{4+1}+\dfrac{2}{4+4} = \dfrac25+\dfrac14 = \dfrac{13}{20} = 0{,}65$. La suite monte vers $\dfrac{\pi}{4} \approx 0{,}785$ — cohérent.

          **Le piège à éviter.** Perdre le facteur $\dfrac1n$. C'est LUI qui fait la somme de Riemann : sans lui, la somme $\sum f\!\left(\frac{k}{n}\right)$ compte $n$ termes qui ne tendent pas vers $0$, et elle diverge vers $+\infty$. Second piège, plus discret : s'inquiéter parce que la somme démarre à $k=1$ et non à $k=0$. Les deux conventions — extrémités gauches ou droites des $n$ tranches de $[0,1]$ — donnent la **même** limite ; ce qui compte, c'est que les points $\frac{k}{n}$ balaient $[0,1]$ avec un pas de $\frac1n$.
        steps:
          - math: '\dfrac{n}{n^2+k^2} = \dfrac{n}{n^2\left(1+\left(\frac{k}{n}\right)^2\right)} = \dfrac{1}{n}\cdot\dfrac{1}{1+\left(\frac{k}{n}\right)^{2}}'
            note: "On factorise n^2 au dénominateur pour ne plus voir que le rapport k/n."
          - math: 'u_n = \dfrac{1}{n}\sum_{k=1}^{n} f\!\left(\dfrac{k}{n}\right) \qquad\text{avec}\qquad f(x) = \dfrac{1}{1+x^2}'
            note: "Forme exacte d'une somme de Riemann : le facteur 1/n devant, f(k/n) dedans."
          - math: 'f \text{ continue sur } [0,1] \ \Longrightarrow\ \lim_{n\to+\infty} u_n = \int_0^1 f(x)\,\mathrm{d}x'
            note: "Théorème des sommes de Riemann (programme SM) : la continuité de f sur [0,1] est l'unique hypothèse à vérifier."
          - math: '\lim_{n\to+\infty} u_n = \int_0^1 \dfrac{1}{1+x^2}\,\mathrm{d}x = \dfrac{\pi}{4}'
            note: "L'intégrale est celle de la question 1-a : rien de nouveau à calculer."
      - id: q2
        part: "Question 2 — Une majoration volontairement grossière"
        stem: |-
          **(0,25 pt)** Montrer que : $\displaystyle\int_0^1 \frac{1}{\left(1+x^2\right)^2}\, dx \leq 1$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Première réaction à corriger : on ne te demande **pas** de calculer cette intégrale. Regarde le barème — $0{,}25$ point. Une valeur exacte ne vaudrait jamais si peu ; on te demande une **majoration**, et la majoration la plus simple qui soit. C'est le R4 (comparaison) qui est visé, pas une primitive.

          Le geste : majorer l'intégrande par une constante sur $[0,1]$, puis intégrer l'inégalité.

          Pour $x \in [0,1]$ — en fait pour tout réel $x$ — on a $x^2 \geq 0$, donc :

          $$1+x^2 \geq 1 \quad\Longrightarrow\quad \left(1+x^2\right)^2 \geq 1 \quad\Longrightarrow\quad \frac{1}{\left(1+x^2\right)^2} \leq 1$$

          (le passage au carré conserve l'inégalité parce que les deux membres sont positifs ; le passage à l'inverse la retourne, pour la même raison.)

          Applique la comparaison du R4 sur $[0,1]$, où les bornes sont bien dans l'ordre $0 \leq 1$ :

          $$\int_0^1 \frac{1}{\left(1+x^2\right)^2}\,\mathrm{d}x \leq \int_0^1 1\,\mathrm{d}x = \bigl[x\bigr]_0^1 = 1$$

          $$\boxed{\int_0^1 \frac{1}{\left(1+x^2\right)^2}\,\mathrm{d}x \leq 1}$$

          C'est aussi, mot pour mot, l'inégalité de la moyenne du R5 avec $M=1$ et $b-a=1$ : les deux rédactions valent le même point.

          **Le piège à éviter.** Vouloir la valeur exacte. Elle existe — elle vaut $\dfrac{\pi}{8}+\dfrac14 \approx 0{,}643$ — mais elle s'obtient par un changement de variable ou une intégration par parties astucieuse qui **ne sont pas au programme de 2ème Bac**. En te lançant dedans, tu perds dix minutes sur une question à $0{,}25$ point, et tu rates les questions 4 et 5 qui en valent $1{,}75$. Retiens la leçon générale : **quand un énoncé demande $\leq$ et non $=$, il demande une majoration, et le barème te dit à quel point elle a le droit d'être grossière.** Ici $0{,}643 \leq 1$ : la majoration est large, et c'est parfaitement suffisant pour la question 5-a.
        steps:
          - math: '(\forall x \in [0,1])\ ;\quad x^2 \geq 0 \ \Longrightarrow\ 1+x^2 \geq 1 \ \Longrightarrow\ \left(1+x^2\right)^{2} \geq 1'
            note: "Les deux membres sont positifs, donc le passage au carré conserve le sens de l'inégalité."
          - math: '(\forall x \in [0,1])\ ;\quad \dfrac{1}{\left(1+x^2\right)^{2}} \leq 1'
            note: "Passage à l'inverse entre nombres strictement positifs : le sens s'inverse."
          - math: '\int_0^1 \dfrac{1}{\left(1+x^2\right)^{2}}\,\mathrm{d}x \leq \int_0^1 1\,\mathrm{d}x = \bigl[x\bigr]_0^1 = 1'
            note: "Comparaison du R4, bornes dans l'ordre 0 <= 1. Rédaction équivalente : inégalité de la moyenne (R5) avec M = 1."
      - id: q3-a
        part: "Question 3 — Encadrer $e^x-1$, puis $e^x-1-x$"
        stem: |-
          **(0,5 pt)** Montrer que : $\left(\forall x \in [0,1]\right)$ ; $0 \leq e^x - 1 \leq e.x$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux inégalités, deux méthodes différentes — ne pas chercher à les traiter d'un seul bloc.

          **L'inégalité de gauche** sort directement de la stricte croissance de $\exp$ (chapitre « Fonction exponentielle ») : pour $x \geq 0$,

          $$e^x \geq e^0 = 1 \quad\Longrightarrow\quad e^x - 1 \geq 0$$

          **L'inégalité de droite** ne se démontre pas en « manipulant » l'inégalité de départ — on ne sait pas encore qu'elle est vraie, donc on n'a pas le droit de partir d'elle. La méthode générale, celle qui marche toujours : **étudier le signe de la différence**. On pose

          $$g(x) = e\,x - e^x + 1 \qquad \text{sur } [0,1]$$

          et l'objectif devient : montrer $g \geq 0$ sur $[0,1]$.

          $g$ est dérivable sur $[0,1]$ et $g^{\prime}(x) = e - e^x$. Or $\exp$ est croissante, donc pour $x \leq 1$ on a $e^x \leq e^1 = e$, c'est-à-dire $g^{\prime}(x) \geq 0$ sur $[0,1]$ : $g$ y est croissante.

          Une fonction croissante sur $[0,1]$ est minorée par sa valeur en $0$ :

          $$g(0) = e\times 0 - e^0 + 1 = 0 - 1 + 1 = 0$$

          Donc $g(x) \geq g(0) = 0$ pour tout $x \in [0,1]$, ce qui est exactement $e^x - 1 \leq e\,x$.

          $$\boxed{\left(\forall x \in [0,1]\right)\ ;\quad 0 \leq e^x - 1 \leq e\,x}$$

          **Le piège à éviter, et il est majeur pour la suite.** L'inégalité de droite est **fausse en dehors de $[0,1]$** — ce n'est pas une précaution de rédaction, c'est une vraie frontière. Vérifie en $x=2$ : $e^2 - 1 \approx 6{,}39$, alors que $e \times 2 \approx 5{,}44$. L'inégalité s'effondre. La raison se lit sur $g^{\prime}$ : dès que $x > 1$, $e^x > e$ et $g^{\prime}$ devient négative, donc $g$ redescend et finit par passer sous $0$. Retiens-le : à la question 4-a, il faudra **vérifier** que les nombres auxquels on applique cet encadrement sont bien dans $[0,1]$. Sans cette vérification, tout l'exercice s'écroule.
        steps:
          - math: '(\forall x \in [0,1])\ ;\quad x \geq 0 \ \Longrightarrow\ e^{x} \geq e^{0} = 1 \ \Longrightarrow\ e^{x} - 1 \geq 0'
            note: "Inégalité de gauche : stricte croissance de exp, rien de plus."
          - math: 'g(x) = e\,x - e^{x} + 1 \quad\text{sur } [0,1],\qquad g^{\prime}(x) = e - e^{x}'
            note: "On étudie le signe de la différence, jamais l'inégalité elle-même."
          - math: '(\forall x \in [0,1])\ ;\quad x \leq 1 \ \Longrightarrow\ e^{x} \leq e \ \Longrightarrow\ g^{\prime}(x) \geq 0'
            note: "exp croissante : sur [0,1] la dérivée de g est positive, donc g est croissante."
          - math: 'g(0) = 0 - 1 + 1 = 0 \quad\text{et } g \text{ croissante} \ \Longrightarrow\ (\forall x \in [0,1])\ ;\ g(x) \geq 0'
            note: "Une fonction croissante sur [0,1] est minorée par sa valeur en 0."
          - math: '(\forall x \in [0,1])\ ;\quad 0 \leq e^{x} - 1 \leq e\,x'
            note: "g(x) >= 0 se réécrit exactement e^x - 1 <= e.x."
      - id: q3-b
        part: "Question 3 — Encadrer $e^x-1$, puis $e^x-1-x$"
        stem: |-
          **(0,25 pt)** En déduire que : $\left(\forall x \in [0,1]\right)$ ; $0 \leq e^x - 1 - x \leq \dfrac{e}{2} x^2$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le « en déduire » interdit de repartir d'une nouvelle étude de fonction : il faut **utiliser** la question 3-a. Compare les deux énoncés — à gauche $e^x-1$ devient $e^x-1-x$, à droite $e\,x$ devient $\dfrac{e}{2}x^2$. Ces deux transformations sont la **même** : ce sont les primitives, prises entre $0$ et $x$. Le geste est donc d'intégrer l'encadrement de 3-a.

          Attention d'abord à une précaution de rédaction : dans 3-a la variable s'appelle $x$, et c'est aussi $x$ qui va servir de borne. On renomme donc la variable d'intégration en $t$.

          Soit $x \in [0,1]$. Pour tout $t \in [0,x]$, on a $t \in [0,1]$ (puisque $[0,x] \subset [0,1]$), donc 3-a s'applique :

          $$0 \leq e^t - 1 \leq e\,t$$

          Les bornes sont dans l'ordre ($0 \leq x$), donc la comparaison du R4 autorise à intégrer les trois membres entre $0$ et $x$ :

          $$\int_0^x 0\,\mathrm{d}t \ \leq\ \int_0^x \left(e^t-1\right)\mathrm{d}t \ \leq\ \int_0^x e\,t\,\mathrm{d}t$$

          Reste à calculer les trois morceaux, par le R1. Le membre de gauche vaut $0$. Le membre du milieu, avec la primitive $t \mapsto e^t - t$ :

          $$\int_0^x \left(e^t-1\right)\mathrm{d}t = \bigl[e^t - t\bigr]_0^x = \left(e^x - x\right) - \left(e^0 - 0\right) = e^x - x - 1$$

          Et le membre de droite, avec $t \mapsto \dfrac{t^2}{2}$ :

          $$\int_0^x e\,t\,\mathrm{d}t = e\left[\frac{t^2}{2}\right]_0^x = \frac{e}{2}x^2$$

          $$\boxed{\left(\forall x \in [0,1]\right)\ ;\quad 0 \leq e^x - 1 - x \leq \frac{e}{2}x^2}$$

          **Le piège à éviter.** Intégrer une inégalité n'est légitime que si les bornes sont **dans l'ordre croissant** — c'est une hypothèse explicite du R4, pas un détail. Ici $0 \leq x$ le garantit, mais il faut le dire. Et garde en tête ce que cet encadrement raconte : $e^x$ est coincé entre $1+x$ et $1+x+\frac{e}{2}x^2$. Quand $x$ est petit, l'erreur commise en remplaçant $e^x-1$ par $x$ est d'ordre $x^2$ — donc négligeable devant $x$. C'est exactement le levier qui va faire s'effondrer l'écart $w_n-u_n$ dans les questions suivantes.
        steps:
          - math: 'x \in [0,1] \ \Longrightarrow\ [0,x] \subset [0,1] \ \Longrightarrow\ (\forall t \in [0,x])\ ;\ 0 \leq e^{t} - 1 \leq e\,t'
            note: "Question 3-a appliquée à t, après renommage de la variable pour ne pas confondre variable et borne."
          - math: '\int_0^x 0\,\mathrm{d}t \ \leq\ \int_0^x \left(e^{t}-1\right)\mathrm{d}t \ \leq\ \int_0^x e\,t\,\mathrm{d}t'
            note: "Comparaison du R4, licite parce que les bornes sont dans l'ordre 0 <= x."
          - math: '\int_0^x \left(e^{t}-1\right)\mathrm{d}t = \bigl[e^{t} - t\bigr]_0^x = e^{x} - x - 1'
            note: "Primitive de e^t - 1 : e^t - t. En 0 elle vaut 1, d'où le -1 final."
          - math: '\int_0^x e\,t\,\mathrm{d}t = e\left[\dfrac{t^{2}}{2}\right]_0^x = \dfrac{e}{2}x^{2}'
            note: "e est une constante : elle sort par linéarité (R2)."
          - math: '(\forall x \in [0,1])\ ;\quad 0 \leq e^{x} - 1 - x \leq \dfrac{e}{2}x^{2}'
            note: "L'erreur commise en remplaçant e^x - 1 par x est d'ordre x au carré."
      - id: q4-a
        part: "Question 4 — L'écart $w_n-u_n$, et une intégrale par tranches"
        stem: |-
          **(0,25 pt)** Pour tout entier $n \geq 1$, on pose : $w_n = \displaystyle\sum_{k=1}^{k=n} \left( e^{\frac{n}{n^2+k^2}} - 1 \right)$

          Montrer que pour tout entier $n \geq 1$, on a : $0 \leq w_n - u_n \leq \dfrac{e}{2} \displaystyle\sum_{k=1}^{k=n} \left( \frac{n}{n^2+k^2} \right)^2$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Compare les deux sommes : $w_n$ et $u_n$ ont le **même nombre de termes**, indexés par le même $k$. On peut donc les soustraire terme à terme — et l'inégalité demandée n'est rien d'autre que celle de 3-b, appliquée $n$ fois puis additionnée.

          Pose, pour alléger, $x_k = \dfrac{n}{n^2+k^2}$. Alors $u_n = \sum_{k=1}^n x_k$ et $w_n = \sum_{k=1}^n \left(e^{x_k}-1\right)$, donc :

          $$w_n - u_n = \sum_{k=1}^{n}\left(e^{x_k}-1\right) - \sum_{k=1}^{n} x_k = \sum_{k=1}^{n}\left(e^{x_k}-1-x_k\right)$$

          **La vérification sans laquelle rien ne tient.** La question 3-b n'est valable que pour un argument dans $[0,1]$ — et on a vu en 3-a que l'encadrement est faux au-delà. Il faut donc prouver $x_k \in [0,1]$. Pour $k \in \{1,\dots,n\}$ et $n \geq 1$ :

          $$n^2 + k^2 > n^2 \quad\Longrightarrow\quad 0 < x_k = \frac{n}{n^2+k^2} < \frac{n}{n^2} = \frac{1}{n} \leq 1$$

          Donc $x_k \in\ ]0,1[\ \subset [0,1]$ : 3-b s'applique à chaque $x_k$.

          $$\left(\forall k \in \{1,\dots,n\}\right)\ ;\quad 0 \leq e^{x_k}-1-x_k \leq \frac{e}{2}x_k^2$$

          On somme ces $n$ encadrements (additionner des inégalités de même sens est toujours licite) :

          $$0 \leq \sum_{k=1}^{n}\left(e^{x_k}-1-x_k\right) \leq \frac{e}{2}\sum_{k=1}^{n} x_k^2$$

          $$\boxed{0 \leq w_n - u_n \leq \frac{e}{2}\sum_{k=1}^{n}\left(\frac{n}{n^2+k^2}\right)^{2}}$$

          **Le piège à éviter.** Appliquer 3-b sans vérifier que $x_k$ est dans $[0,1]$. C'est la faute la plus coûteuse de l'exercice, et la plus facile à commettre : l'encadrement « a l'air » universel, il ne l'est pas. Le correcteur cherche cette ligne. Note d'ailleurs que la majoration $x_k < \frac1n$ est bien plus forte que ce qu'on demande ici — c'est la même idée, en plus fin, qui reviendra en 5-a.
        steps:
          - math: 'x_k = \dfrac{n}{n^2+k^2},\qquad u_n = \sum_{k=1}^{n} x_k,\qquad w_n = \sum_{k=1}^{n}\left(e^{x_k}-1\right)'
            note: "Même indexation, même nombre de termes : les deux sommes se soustraient terme à terme."
          - math: 'w_n - u_n = \sum_{k=1}^{n}\left(e^{x_k}-1-x_k\right)'
            note: "Regroupement terme à terme, licite car les deux sommes ont exactement n termes."
          - math: '(\forall k \in \{1,\dots,n\})\ ;\quad n^2+k^2 > n^2 \ \Longrightarrow\ 0 < x_k < \dfrac{n}{n^2} = \dfrac{1}{n} \leq 1'
            note: "Vérification indispensable : chaque x_k est dans [0,1], donc la question 3-b s'y applique."
          - math: '(\forall k \in \{1,\dots,n\})\ ;\quad 0 \leq e^{x_k}-1-x_k \leq \dfrac{e}{2}x_k^{2}'
            note: "Question 3-b appliquée à x = x_k."
          - math: '0 \leq w_n - u_n \leq \dfrac{e}{2}\sum_{k=1}^{n}\left(\dfrac{n}{n^2+k^2}\right)^{2}'
            note: "On additionne les n encadrements : additionner des inégalités de même sens est toujours licite."
      - id: q4-b
        part: "Question 4 — L'écart $w_n-u_n$, et une intégrale par tranches"
        stem: |-
          **(0,25 pt)** Montrer que la fonction : $x \mapsto \left(1+x^2\right)^{-2}$ est strictement décroissante sur $[0,1]$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une question de méthode pure, à $0{,}25$ point : le sens de variation se lit sur le signe de la dérivée (chapitre « Dérivation »). Nomme la fonction pour pouvoir en parler :

          $$\varphi(x) = \left(1+x^2\right)^{-2}$$

          C'est une puissance d'une fonction, de la forme $u^{\alpha}$ avec $u(x)=1+x^2$ et $\alpha=-2$, dont la dérivée est $\alpha\,u^{\prime}u^{\alpha-1}$. Ici $u^{\prime}(x)=2x$, donc :

          $$\varphi^{\prime}(x) = -2 \times 2x \times \left(1+x^2\right)^{-3} = \frac{-4x}{\left(1+x^2\right)^{3}}$$

          Le dénominateur $\left(1+x^2\right)^3$ est strictement positif pour tout réel $x$ (c'est le cube d'un nombre $\geq 1$). Le signe de $\varphi^{\prime}$ est donc celui de $-4x$ :

          $$\left(\forall x \in\ ]0,1]\right)\ ;\quad \varphi^{\prime}(x) < 0$$

          $\varphi$ est donc **strictement décroissante sur $[0,1]$**.

          **Une autre rédaction, sans dérivée, tout aussi valable.** Sur $[0,1]$, $x \mapsto x^2$ est strictement croissante, donc $x \mapsto 1+x^2$ l'est aussi, à valeurs $\geq 1 > 0$ ; élever au carré conserve la croissance pour des nombres positifs, donc $x \mapsto \left(1+x^2\right)^2$ est strictement croissante et strictement positive ; passer à l'inverse retourne le sens. Conclusion identique.

          **Le piège à éviter.** Voir $\varphi^{\prime}(0)=0$ et en conclure que la décroissance n'est « pas stricte » sur $[0,1]$. C'est faux : une dérivée qui s'annule en un point **isolé** n'empêche jamais la stricte monotonie — le théorème demande $\varphi^{\prime} \leq 0$ avec annulation en des points isolés seulement, ce qui est bien le cas ici (seul $x=0$). Ne rate pas non plus l'exposant $-3$ : dériver $u^{-2}$ donne $-2u^{\prime}u^{-3}$, l'exposant **descend** de $1$ même quand il est négatif.
        steps:
          - math: '\varphi(x) = \left(1+x^2\right)^{-2},\qquad u(x) = 1+x^2,\qquad u^{\prime}(x) = 2x'
            note: "Forme u puissance alpha avec alpha = -2 : la dérivée vaut alpha fois u prime fois u puissance (alpha - 1)."
          - math: '\varphi^{\prime}(x) = -2 \times 2x \times \left(1+x^2\right)^{-3} = \dfrac{-4x}{\left(1+x^2\right)^{3}}'
            note: "L'exposant descend de 1 : de -2 il passe à -3, même pour un exposant négatif."
          - math: '\left(1+x^2\right)^{3} > 0 \ \Longrightarrow\ \operatorname{signe}\left(\varphi^{\prime}(x)\right) = \operatorname{signe}(-4x)'
            note: "Le dénominateur est le cube d'un nombre supérieur ou égal à 1, donc strictement positif."
          - math: '\left(\forall x \in\ ]0,1]\right)\ ;\ \varphi^{\prime}(x) < 0 \ \Longrightarrow\ \varphi \text{ strictement décroissante sur } [0,1]'
            note: "L'annulation en x = 0 est isolée : elle n'empêche pas la stricte décroissance."
      - id: q4-c
        part: "Question 4 — L'écart $w_n-u_n$, et une intégrale par tranches"
        stem: |-
          **(0,25 pt)** En déduire que pour tout entier $n \geq 1$ et pour tout entier $k \in \{1, 2, \ldots, n\}$, on a :
          $$\frac{1}{n}\left(1+\left(\frac{k}{n}\right)^2\right)^{-2} \leq \int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2} dx$$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Regarde le membre de gauche : $\dfrac{1}{n}$ est exactement la **longueur** de l'intervalle d'intégration $\left[\frac{k-1}{n},\frac{k}{n}\right]$, et $\left(1+\left(\frac{k}{n}\right)^2\right)^{-2}$ est exactement $\varphi\!\left(\frac{k}{n}\right)$, la valeur de $\varphi$ à l'**extrémité droite** de cet intervalle. Le membre de gauche est donc l'aire d'un rectangle : largeur $\frac1n$, hauteur $\varphi\!\left(\frac{k}{n}\right)$. L'inégalité dit que ce rectangle est **sous** la courbe. C'est le R5 (inégalité de la moyenne), ou le R4 appliqué à une fonction constante — au choix.

          D'abord, l'intervalle est bien dans le domaine où l'on sait travailler : pour $k \in \{1,\dots,n\}$, $\dfrac{k-1}{n} \geq 0$ et $\dfrac{k}{n} \leq 1$, donc $\left[\frac{k-1}{n},\frac{k}{n}\right] \subset [0,1]$.

          Ensuite, la minoration de $\varphi$ sur cette tranche. $\varphi$ est décroissante sur $[0,1]$ (question 4-b), et tout $x$ de la tranche vérifie $x \leq \dfrac{k}{n}$ :

          $$\left(\forall x \in \left[\tfrac{k-1}{n},\tfrac{k}{n}\right]\right)\ ;\quad x \leq \frac{k}{n} \ \Longrightarrow\ \varphi(x) \geq \varphi\!\left(\frac{k}{n}\right)$$

          $\varphi\!\left(\frac{k}{n}\right)$ est une **constante** sur cette tranche ($k$ et $n$ y sont fixés, seul $x$ varie). Intègre l'inégalité sur $\left[\frac{k-1}{n},\frac{k}{n}\right]$, dont les bornes sont dans l'ordre :

          $$\int_{\frac{k-1}{n}}^{\frac{k}{n}} \varphi(x)\,\mathrm{d}x \ \geq\ \int_{\frac{k-1}{n}}^{\frac{k}{n}} \varphi\!\left(\frac{k}{n}\right)\mathrm{d}x = \varphi\!\left(\frac{k}{n}\right) \times \left(\frac{k}{n}-\frac{k-1}{n}\right) = \frac{1}{n}\,\varphi\!\left(\frac{k}{n}\right)$$

          $$\boxed{\frac{1}{n}\left(1+\left(\frac{k}{n}\right)^2\right)^{-2} \leq \int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2}\mathrm{d}x}$$

          **Le piège à éviter.** Se tromper d'extrémité. $\varphi$ **décroît** : sur la tranche, son **minimum** est atteint à droite, en $\frac{k}{n}$, et son maximum à gauche, en $\frac{k-1}{n}$. C'est donc la valeur de **droite** qui minore l'intégrale — et l'énoncé demande bien une minoration. Si tu prends l'extrémité gauche, tu obtiens une majoration, l'inégalité part dans l'autre sens, et la question 5-a devient impossible à conclure : la chaîne entière repose sur ce choix d'extrémité.
        steps:
          - math: '(\forall k \in \{1,\dots,n\})\ ;\quad \left[\tfrac{k-1}{n},\tfrac{k}{n}\right] \subset [0,1]'
            note: "(k-1)/n est positif ou nul et k/n est inférieur ou égal à 1 : la tranche vit bien dans [0,1]."
          - math: '\left(\forall x \in \left[\tfrac{k-1}{n},\tfrac{k}{n}\right]\right)\ ;\quad x \leq \dfrac{k}{n} \ \Longrightarrow\ \varphi(x) \geq \varphi\!\left(\dfrac{k}{n}\right)'
            note: "phi décroît (question 4-b) : son minimum sur la tranche est atteint à l'extrémité DROITE."
          - math: '\int_{\frac{k-1}{n}}^{\frac{k}{n}} \varphi(x)\,\mathrm{d}x \geq \int_{\frac{k-1}{n}}^{\frac{k}{n}} \varphi\!\left(\dfrac{k}{n}\right)\mathrm{d}x = \varphi\!\left(\dfrac{k}{n}\right) \times \dfrac{1}{n}'
            note: "phi(k/n) est une constante sur la tranche : son intégrale est la constante fois la longueur 1/n."
          - math: '\dfrac{1}{n}\left(1+\left(\dfrac{k}{n}\right)^{2}\right)^{-2} \leq \int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2}\mathrm{d}x'
            note: "Un rectangle de largeur 1/n et de hauteur phi(k/n) tient sous la courbe sur cette tranche."
      - id: q5-a
        part: "Question 5 — La conclusion : $w_n$ tend vers $\\pi/4$"
        stem: |-
          **(0,5 pt)** Montrer que pour tout entier $n \geq 1$, on a : $0 \leq w_n - u_n \leq \dfrac{e}{2n}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est la question charnière : elle branche ensemble tout ce qui précède. La question 4-a a majoré l'écart par $\dfrac{e}{2}\sum x_k^2$ ; il suffit donc de montrer que $\sum_{k=1}^n x_k^2 \leq \dfrac1n$. Et le seul outil disponible pour majorer cette somme est la question 4-c — encore faut-il faire apparaître sa forme exacte.

          **Le calcul qui débloque tout.** Reprends la factorisation de la question 1-b :

          $$x_k = \frac{n}{n^2+k^2} = \frac{1}{n}\left(1+\left(\frac{k}{n}\right)^2\right)^{-1}$$

          Élève au carré :

          $$x_k^2 = \frac{1}{n^2}\left(1+\left(\frac{k}{n}\right)^2\right)^{-2} = \frac{1}{n} \times \underbrace{\left[\frac{1}{n}\left(1+\left(\frac{k}{n}\right)^2\right)^{-2}\right]}_{\text{c'est le membre de gauche de 4-c}}$$

          C'est là toute l'astuce : $x_k^2$ n'est pas la quantité de 4-c, c'est **$\dfrac1n$ fois** cette quantité. Applique alors 4-c :

          $$x_k^2 \leq \frac{1}{n}\int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2}\mathrm{d}x$$

          Somme sur $k$ de $1$ à $n$. Les $n$ intégrales portent sur des tranches consécutives et adjacentes : $\left[0,\frac1n\right]$, $\left[\frac1n,\frac2n\right]$, …, $\left[\frac{n-1}{n},1\right]$. Par la relation de Chasles (R3), appliquée $n-1$ fois, elles se recollent exactement en une seule intégrale de $0$ à $1$ :

          $$\sum_{k=1}^{n} x_k^2 \ \leq\ \frac{1}{n}\sum_{k=1}^{n}\int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2}\mathrm{d}x \ =\ \frac{1}{n}\int_{0}^{1}\left(1+x^2\right)^{-2}\mathrm{d}x$$

          Et la question 2 dit précisément que cette intégrale est $\leq 1$ :

          $$\sum_{k=1}^{n} x_k^2 \ \leq\ \frac{1}{n} \times 1 = \frac{1}{n}$$

          Il ne reste qu'à reporter dans 4-a :

          $$0 \leq w_n - u_n \leq \frac{e}{2}\sum_{k=1}^{n} x_k^2 \leq \frac{e}{2} \times \frac{1}{n}$$

          $$\boxed{\left(\forall n \geq 1\right)\ ;\quad 0 \leq w_n - u_n \leq \frac{e}{2n}}$$

          **Le contrôle qui rassure.** Pour $n=1$ : $w_1 - u_1 = e^{1/2}-1-\frac12 = \sqrt{e}-\frac32 \approx 0{,}149$, face à $\frac{e}{2} \approx 1{,}359$. L'encadrement tient largement, comme prévu — les majorations successives ont été généreuses.

          **Le piège à éviter.** Oublier le facteur $\dfrac1n$ en passant de $x_k^2$ au membre de gauche de 4-c. Si tu écris directement $x_k^2 \leq \int_{\frac{k-1}{n}}^{\frac{k}{n}}\varphi$, tu conclus $\sum x_k^2 \leq 1$ puis $w_n - u_n \leq \dfrac{e}{2}$ — une majoration **par une constante**, qui ne tend pas vers $0$ et ne permet plus de conclure quoi que ce soit à la question 5-b. Tout l'exercice se joue sur ce $\dfrac1n$ : c'est lui qui transforme une borne inutile en une borne qui s'effondre.
        steps:
          - math: 'x_k = \dfrac{n}{n^2+k^2} = \dfrac{1}{n}\left(1+\left(\dfrac{k}{n}\right)^{2}\right)^{-1}'
            note: "Même factorisation qu'à la question 1-b."
          - math: 'x_k^{2} = \dfrac{1}{n^{2}}\left(1+\left(\dfrac{k}{n}\right)^{2}\right)^{-2} = \dfrac{1}{n}\times\left[\dfrac{1}{n}\left(1+\left(\dfrac{k}{n}\right)^{2}\right)^{-2}\right]'
            note: "Le crochet est EXACTEMENT le membre de gauche de 4-c ; x_k au carré vaut 1/n fois ce crochet."
          - math: 'x_k^{2} \leq \dfrac{1}{n}\int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2}\mathrm{d}x'
            note: "Question 4-c multipliée par 1/n, qui est positif : le sens de l'inégalité est conservé."
          - math: '\sum_{k=1}^{n} x_k^{2} \leq \dfrac{1}{n}\sum_{k=1}^{n}\int_{\frac{k-1}{n}}^{\frac{k}{n}} \left(1+x^2\right)^{-2}\mathrm{d}x = \dfrac{1}{n}\int_{0}^{1}\left(1+x^2\right)^{-2}\mathrm{d}x'
            note: "Les n tranches sont adjacentes : la relation de Chasles (R3) les recolle en une seule intégrale de 0 à 1."
          - math: '\int_0^1 \left(1+x^2\right)^{-2}\mathrm{d}x \leq 1 \quad\Longrightarrow\quad \sum_{k=1}^{n} x_k^{2} \leq \dfrac{1}{n}'
            note: "C'est la question 2, qui trouve ici son unique emploi de tout l'exercice."
          - math: '0 \leq w_n - u_n \leq \dfrac{e}{2}\sum_{k=1}^{n} x_k^{2} \leq \dfrac{e}{2}\times\dfrac{1}{n} = \dfrac{e}{2n}'
            note: "Report dans la question 4-a. Contrôle pour n = 1 : racine de e moins 3/2, soit 0,149, contre e/2 = 1,359."
      - id: q5-b
        part: "Question 5 — La conclusion : $w_n$ tend vers $\\pi/4$"
        stem: |-
          **(0,5 pt)** En déduire que la suite $(w_n)_{n\geq 1}$ est convergente et déterminer sa limite.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux choses sont demandées — la convergence, puis la valeur — et elles s'obtiennent d'un même mouvement. On ne sait rien de $w_n$ directement ; on sait seulement deux choses : ce que vaut la limite de $u_n$ (question 1-b) et à quel point $w_n$ est proche de $u_n$ (question 5-a). Le geste : écrire $w_n$ **comme la somme de ce qu'on connaît**.

          **Premier temps — l'écart tend vers $0$.** La question 5-a donne :

          $$\left(\forall n \geq 1\right)\ ;\quad 0 \leq w_n - u_n \leq \frac{e}{2n}$$

          Or $\displaystyle\lim_{n\to+\infty} \frac{e}{2n} = 0$ (c'est $\frac{e}{2}$ fois $\frac1n$, et $e$ est une constante) et la suite constante nulle tend vers $0$. Le théorème des gendarmes (chapitre « Suites numériques », R6) s'applique aux trois membres :

          $$\lim_{n\to+\infty} \left(w_n - u_n\right) = 0$$

          **Deuxième temps — recomposer $w_n$.** L'écriture qui conclut :

          $$w_n = u_n + \left(w_n - u_n\right)$$

          C'est une somme de deux suites **convergentes** : $u_n \to \dfrac{\pi}{4}$ (question 1-b) et $w_n - u_n \to 0$. La limite d'une somme est la somme des limites :

          $$\lim_{n\to+\infty} w_n = \frac{\pi}{4} + 0$$

          $$\boxed{(w_n)_{n\geq 1} \text{ converge, et } \lim_{n\to+\infty} w_n = \frac{\pi}{4}}$$

          **Ce que l'exercice a vraiment construit.** L'intuition de départ était simple : quand $t$ est petit, $e^t-1 \approx t$, donc $w_n \approx u_n$. Mais « approximativement égal » n'est pas un argument de démonstration — et c'est pour cela que les questions 2 à 5-a existent : elles transforment un $\approx$ en un $\leq \frac{e}{2n}$ explicite, une borne qu'on peut faire tendre vers $0$. C'est le mouvement typique de l'analyse : remplacer une intuition par une majoration chiffrée.

          **Le piège à éviter.** Écrire « $w_n - u_n \to 0$ donc $w_n$ et $u_n$ ont la même limite » sans dire que $(u_n)$ **converge**. Le raisonnement serait faux en général : $w_n = n+\frac1n$ et $u_n = n$ vérifient $w_n - u_n \to 0$ alors qu'aucune des deux ne converge. C'est la convergence de $(u_n)$, établie en 1-b, qui rend la conclusion légitime — et c'est exactement pour ça que l'écriture $w_n = u_n + (w_n-u_n)$ vaut mieux qu'une phrase : elle exhibe la somme de deux suites convergentes.
        steps:
          - math: '(\forall n \geq 1)\ ;\quad 0 \leq w_n - u_n \leq \dfrac{e}{2n} \qquad\text{et}\qquad \lim_{n\to+\infty}\dfrac{e}{2n} = 0'
            note: "Question 5-a, plus la limite de e/(2n) : e est une constante, 1/n tend vers 0."
          - math: '\lim_{n\to+\infty}\left(w_n - u_n\right) = 0'
            note: "Théorème des gendarmes (Suites numériques, R6) appliqué aux trois membres."
          - math: 'w_n = u_n + \left(w_n - u_n\right)'
            note: "L'écriture qui conclut : w_n est la somme de deux suites dont on connaît les limites."
          - math: '\lim_{n\to+\infty} w_n = \dfrac{\pi}{4} + 0 = \dfrac{\pi}{4}'
            note: "Limite d'une somme de deux suites convergentes. La convergence de u_n vient de la question 1-b."
