    intro: |-
      **Équations différentielles et calcul intégral (examen national, session normale 2022) — partie « calcul intégral ».**

      On considère la fonction $h$ définie sur $\mathbb{R}$ par $h(x) = (x+1)e^x$.

      Le sujet complet vaut 2,5 pts et enchaîne une équation différentielle et ce calcul intégral ; seule la partie « calcul intégral » (1,5 pt, questions 1a et 1b ci-dessous) est reprise ici.
    questions:
      - id: q1a
        part: "Question 1a — Vérifier une primitive, puis calculer $I$"
        stem: |-
          **(0,75 pt)** Vérifier que la fonction $x \mapsto x\,e^x$ est une primitive de la fonction $h$ sur $\mathbb{R}$, puis calculer $I = \displaystyle\int_{-1}^{0} h(x)\,\mathrm{d}x$.
        reasoning: |-
          Deux tâches sont emboîtées ici, et il ne faut pas les confondre.

          « Vérifier qu'une fonction proposée est une primitive » ne demande jamais d'intégrer : ça demande de **dériver** la fonction proposée et de retomber sur $h$. $x \mapsto x\,e^x$ est un produit, donc on applique la règle de dérivation d'un produit avec $u(x)=x$ et $v(x)=e^x$ (chapitre « Dérivation »).

          Une fois la primitive $F(x)=x\,e^x$ confirmée, calculer $I$ ne demande rien de plus que la définition du chapitre 2 : $I = F(0)-F(-1)$. le chapitre 2 a déjà réglé une inquiétude possible — le choix de la primitive ne change jamais le résultat, puisqu'une éventuelle constante additive s'annulerait dans la soustraction — donc on prend directement cette primitive, la plus simple à écrire, sans en chercher une autre. Le seul point à surveiller : le signe en $x=-1$, où $F(-1) = -1\times e^{-1} = -e^{-1}$ est négatif, et l'on soustrait ce nombre négatif.
        steps:
          - math: '\bigl(x\,e^x\bigr)^{\prime} = 1\cdot e^x + x\cdot e^x = (x+1)e^x = h(x)'
            note: "On dérive la candidate x fois e^x (règle du produit) et on retrouve h(x) : c'est bien une primitive de h."
          - math: 'I = \int_{-1}^{0} h(x)\,\mathrm{d}x = \bigl[x\,e^x\bigr]_{-1}^{0} = 0\cdot e^{0} - (-1)\cdot e^{-1}'
            note: "Définition du chapitre 2 : F(0) moins F(-1), avec F(x) = x fois e^x."
          - math: 'I = 0 - \bigl(-e^{-1}\bigr) = e^{-1} = \dfrac{1}{e}'
            note: "En 0, x fois e^x vaut 0 ; en -1, il vaut -1/e. Donc I = 0 moins (-1/e) = 1/e."
      - id: q1b
        part: "Question 1b — Une intégration par parties : le calcul de $J$"
        stem: |-
          **(0,75 pt)** À l'aide d'une intégration par parties, calculer $J = \displaystyle\int_{-1}^{0} (x+1)^2 e^x\,\mathrm{d}x$.
        reasoning: |-
          $(x+1)^2 e^x$ est un produit de deux facteurs qui ne se primitivent pas facilement l'un sans l'autre — exactement le signal repéré au chapitre 8 pour sortir l'intégration par parties. Reste à décider lequel des deux facteurs on dérive et lequel on primitive.

          Dériver $(x+1)^2$ donne $2(x+1)$ — un facteur de degré plus bas, donc plus simple. Primitiver $e^x$ redonne $e^x$ — immédiat. On pose donc $u=(x+1)^2$ (à dériver) et $v'=e^x$ (à primitiver), jamais l'inverse : prendre $u=e^x$ ne simplifierait rien, puisque dériver l'exponentielle la laisse identique à elle-même.

          La formule du chapitre 8, $\int u\,v' = [uv] - \int u'v$, transforme alors $J$ en un terme de bord moins $\displaystyle\int_{-1}^{0} 2(x+1)e^x\,\mathrm{d}x$. Et ce n'est pas une nouvelle intégrale à calculer depuis zéro : $(x+1)e^x$, c'est exactement $h(x)$ — la fonction de la question 1a, déjà intégrée sur ce même intervalle. L'intégrale restante vaut donc $2I$, directement, sans reprendre le calcul depuis le départ.
        steps:
          - math: 'u = (x+1)^2,\quad u^{\prime} = 2(x+1),\qquad v^{\prime} = e^x,\quad v = e^x'
            note: "On dérive (x+1) au carré (ça devient 2(x+1)) et on primitive e^x (ça reste e^x)."
          - math: 'J = \bigl[(x+1)^2 e^x\bigr]_{-1}^{0} - \int_{-1}^{0} 2(x+1)e^x\,\mathrm{d}x'
            note: "Formule du chapitre 8 : terme de bord moins l'intégrale du produit dérivé fois primitivé."
          - math: '\bigl[(x+1)^2 e^x\bigr]_{-1}^{0} = (0+1)^2 e^{0} - (-1+1)^2 e^{-1} = 1 - 0 = 1'
            note: "En 0 : 1 au carré fois 1 = 1. En -1 : 0 au carré fois 1/e = 0. Le terme de bord vaut 1."
          - math: '\int_{-1}^{0} 2(x+1)e^x\,\mathrm{d}x = 2\int_{-1}^{0} (x+1)e^x\,\mathrm{d}x = 2\int_{-1}^{0} h(x)\,\mathrm{d}x = 2I'
            note: "(x+1)e^x, c'est exactement h(x) : l'intégrale restante vaut 2 fois I, déjà calculé à la question 1a."
