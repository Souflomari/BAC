        RE-DÉMONSTRATION INDÉPENDANTE de tous les résultats, aucun repris de
        la source sans recalcul, aucun arrondi de complaisance :
        (1) l'intégrale de 1/(1+x^2) sur [0;1] vaut pi/4, par la primitive
        arctan ; (2) n/(n^2+k^2) = (1/n) x 1/(1+(k/n)^2), donc u_n est la
        somme de Riemann de f(x)=1/(1+x^2) sur [0;1] à pas 1/n et u_n tend
        vers pi/4 — contrôles à la main : u_1 = 1/2, u_2 = 2/5 + 2/8 = 13/20
