    intro: |-
      **Fonction définie par une intégrale, bijection réciproque et somme de Riemann (examen national, Sciences Mathématiques, session normale 2024 — Exercice 2, 2,5 points).**

      Soit $F$ la fonction numérique définie sur $[0,1]$ par $F(x) = \displaystyle\int_0^x e^{t^2}\,dt$.

      *Le fil de l'exercice.* La question 1 établit que $F$ est continue, strictement croissante, donc bijective de $[0,1]$ vers $[0,\beta]$ avec $\beta = \displaystyle\int_0^1 e^{t^2}\,dt$. La question 2 construit, à l'aide de la bijection réciproque $F^{-1}$, une somme $S_n$ qui est une somme de Riemann — outil du programme SM, hors socle de cette leçon, voir SCOPE NOTE 1 en tête de fichier — et calcule sa limite $\ell$ par un changement de variable qui repose sur la dérivabilité de $F^{-1}$.

      *Aucune figure n'accompagne ce sujet. Carte des domaines : la construction de $F$ et le calcul final de $\ell$ relèvent de ce chapitre (calcul intégral) ; l'existence de la bijection $F^{-1}$ et sa dérivée relèvent du chapitre « dérivabilité et étude de fonctions » (pontées au point d'usage, hors socle de cette leçon) ; la convergence de $(S_n)$ relève à la fois des sommes de Riemann (calcul intégral, programme SM, hors socle) et du chapitre « suites numériques » ; l'intégrande $e^{t^2}$ est un objet du chapitre « fonction exponentielle ».*
    questions:
      - id: q1a
        part: "Question 1 — F continue, strictement croissante, bijective"
        stem: |-
          **1- a)** (0,5 pt) Montrer que $F$ est continue, strictement croissante sur $[0\,;1]$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $F(x)=\displaystyle\int_0^x e^{t^2}\,dt$ est, par définition même de l'intégrale comme primitive (chapitre 2 de ce chapitre — exactement le geste qui donnait $\int_1^x \frac1t\,dt=\ln x$), une primitive de $t\mapsto e^{t^2}$ sur $[0,1]$, décalée pour s'annuler en $0$.

          $t\mapsto e^{t^2}$ est continue sur $[0,1]$ (composée de $t\mapsto t^2$, continue, et de $\exp$, continue — domaine « fonction exponentielle »), donc elle y admet des primitives (fait admis pour toute fonction continue sur un intervalle). $F$ est l'une de ces primitives : elle est donc **dérivable** sur $[0,1]$, avec $F^{\prime}(x) = e^{x^2}$.

          L'exponentielle est strictement positive en tout point de $\mathbb{R}$, donc $F^{\prime}(x) = e^{x^2} > 0$ pour tout $x\in[0,1]$ : $F$ est **strictement croissante**. Étant dérivable, $F$ est en particulier **continue**.

          **Le piège nommé de cette question.** Vouloir calculer $F(x)$ explicitement pour en étudier le sens de variation — $t\mapsto e^{t^2}$ n'a **aucune primitive exprimable** avec les fonctions usuelles du programme. Toute la force de cette question tient dans le fait qu'on n'a **jamais besoin** de connaître $F(x)$ : le signe de $F^{\prime}$ suffit, et $F^{\prime}$, lui, est connu immédiatement.
        steps:
          - math: 't \mapsto e^{t^2} \text{ continue sur } [0,1] \quad (\text{composee, admet des primitives})'
            note: "Fonction continue sur un intervalle : elle y admet des primitives (fait admis)."
          - math: 'F \text{ est une primitive de } t\mapsto e^{t^2} \text{ sur } [0,1] \implies F \text{ derivable}, \quad F^{\prime}(x) = e^{x^2}'
            note: "Definition de l'integrale comme primitive (chapitre 2), appliquee a F elle-meme."
          - math: 'F^{\prime}(x) = e^{x^2} > 0 \ \forall x \implies F \text{ strictement croissante sur } [0,1]; \quad F \text{ derivable} \implies F \text{ continue}'
            note: "Exponentielle toujours strictement positive : le signe de F prime est immediat."
      - id: q1b
        stem: |-
          **1- b)** (0,5 pt) En déduire que $F$ est une bijection de $[0\,;1]$ vers $[0\,;\beta]$ avec $\beta = \displaystyle\int_0^1 e^{t^2}\,dt$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « En déduire » : il ne reste rien à calculer, seulement à appliquer le corollaire du théorème des valeurs intermédiaires à ce que la question 1-a vient d'établir — continuité et stricte monotonie, exactement les deux hypothèses de ce corollaire (chapitre « dérivabilité et étude de fonctions », hors socle de ce chapitre).

          **Le corollaire du TVI, rappelé ici.** Si $g$ est continue et strictement monotone sur un intervalle $I$, alors $g$ réalise une bijection de $I$ sur l'intervalle image $J=g(I)$, délimité par les valeurs (ou limites) de $g$ aux bornes de $I$, dans l'ordre qui suit son sens de variation.

          **L'application.** $F$ est continue et strictement croissante sur $[0,1]$ (question 1-a). $F$ étant croissante, l'intervalle image se lit dans le même ordre que les bornes de $[0,1]$ :

          $$J = \bigl[F(0),\,F(1)\bigr]$$

          $F(0)=\displaystyle\int_0^0 e^{t^2}\,dt = 0$ (intégrale entre deux bornes égales), et $F(1)=\displaystyle\int_0^1 e^{t^2}\,dt = \beta$ par définition même de $\beta$ donnée par l'énoncé. Donc $J=[0,\beta]$.

          $$\boxed{F \text{ realise une bijection de } [0,1] \text{ sur } [0,\beta]}$$

          **Le piège nommé de cette question.** Écrire l'intervalle image dans le mauvais ordre par réflexe — ici $F$ croît, donc l'ordre de $[0,1]$ se conserve, mais ce ne serait pas vrai si $F$ décroissait (le pont complet entre sens de variation et ordre des bornes est démontré au chapitre « dérivabilité et étude de fonctions »). Deuxième piège : oublier de justifier séparément la continuité **et** la stricte monotonie — le TVI seul donnerait l'existence d'un antécédent, jamais son unicité.
        steps:
          - math: 'F \text{ continue et strictement croissante sur } [0,1] \quad (\text{question 1-a})'
            note: "Les deux hypotheses du corollaire du TVI, deja etablies."
          - math: 'F(0) = \int_0^0 e^{t^2}\,dt = 0, \qquad F(1) = \int_0^1 e^{t^2}\,dt = \beta \quad (\text{definition de beta})'
            note: "Images des bornes : F croissante donc l'intervalle image suit le meme ordre."
          - math: 'F \text{ bijection de } [0,1] \text{ sur } J = [F(0), F(1)] = [0,\beta] \quad (\text{corollaire du TVI, hors socle de ce chapitre})'
            note: "Corollaire du theoreme des valeurs intermediaires : continuite + stricte monotonie."
      - id: q2a
        part: "Question 2 — La suite (S_n), somme de Riemann via F inverse"
        stem: |-
          On note $F^{-1}$ la bijection réciproque de $F$. Pour tout $n \in \mathbb{N}^{*}$, on pose : $S_n = \dfrac{1}{n}\displaystyle\sum_{k=1}^{k=n} F^{-1}\!\left(\dfrac{k}{n}\beta\right)$

          **2- a)** (0,5 pt) Montrer que la suite $(S_n)_{n \in \mathbb{N}^{*}}$ est convergente de limite $\ell = \dfrac{1}{\beta}\displaystyle\int_0^{\beta} F^{-1}(t)\,dt$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $S_n$ a la forme $\dfrac1n\displaystyle\sum_{k=1}^n \varphi\!\left(\dfrac{k}{n}\right)$, avec $\varphi(u) = F^{-1}(u\beta)$ : c'est une **somme de Riemann** aux points **droits** de la subdivision régulière de $[0,1]$ — outil du programme SM qui n'appartient pas au socle de ce chapitre (voir SCOPE NOTE 1 en tête de fichier), et qu'il faut donc énoncer avant de l'utiliser.

          **Le théorème des sommes de Riemann, énoncé ici.** Si $h$ est continue sur $[0,1]$, alors $\dfrac1n\displaystyle\sum_{k=1}^{n} h\!\left(\dfrac{k}{n}\right) \xrightarrow[n\to+\infty]{} \displaystyle\int_0^1 h(u)\,du$.

          **La continuité de $\varphi$, à vérifier avant d'appliquer le théorème.** $F$ est une bijection continue et strictement croissante de $[0,1]$ sur $[0,\beta]$ (question 1-b) : sa réciproque $F^{-1}$ est donc elle-même continue sur $[0,\beta]$ (une bijection continue strictement monotone sur un intervalle a une réciproque continue — chapitre « dérivabilité et étude de fonctions »). $u\mapsto u\beta$ est continue sur $[0,1]$ à valeurs dans $[0,\beta]$, donc par composition $\varphi(u) = F^{-1}(u\beta)$ est continue sur $[0,1]$.

          **L'application du théorème.**

          $$S_n = \frac1n\sum_{k=1}^n \varphi\!\left(\frac{k}{n}\right) \xrightarrow[n\to+\infty]{} \int_0^1 \varphi(u)\,du = \int_0^1 F^{-1}(u\beta)\,du$$

          **Le changement de variable qui donne la forme demandée.** Pose $t=u\beta$ (linéaire, $\beta>0$ fixé) : $dt = \beta\,du$, et les bornes $u=0\mapsto t=0$, $u=1\mapsto t=\beta$. Donc :

          $$\int_0^1 F^{-1}(u\beta)\,du = \frac1\beta\int_0^\beta F^{-1}(t)\,dt$$

          $$\boxed{\lim_{n\to+\infty} S_n = \ell = \frac1\beta\int_0^\beta F^{-1}(t)\,dt}$$

          **Le piège nommé de cette question.** Confondre le rôle du $\frac1n$ et celui du $\beta$ : le $\frac1n$ est le pas de la subdivision — c'est lui qui fait de $S_n$ une somme de Riemann — tandis que le $\beta$, lui, est **interne** à $F^{-1}$, un simple facteur d'échelle qui redimensionne $[0,1]$ en $[0,\beta]$. Les deux ne jouent pas le même rôle et il ne faut surtout pas les échanger.
        steps:
          - math: '\varphi(u) = F^{-1}(u\beta), \qquad S_n = \dfrac1n\sum_{k=1}^{n} \varphi\!\left(\dfrac{k}{n}\right)'
            note: "S_n reconnue comme somme de Riemann aux points droits, de pas 1/n."
          - math: 'F^{-1} \text{ continue sur } [0,\beta] \ (\text{reciproque de bijection continue}), \quad u \mapsto u\beta \text{ continue} \implies \varphi \text{ continue sur } [0,1]'
            note: "Hypothese de continuite du theoreme des sommes de Riemann, verifiee par composition."
          - math: 'S_n \xrightarrow[n\to+\infty]{} \int_0^1 \varphi(u)\,du = \int_0^1 F^{-1}(u\beta)\,du \quad (\text{sommes de Riemann, hors socle, programme SM})'
            note: "Application du theoreme des sommes de Riemann a phi, continue sur [0,1]."
          - math: 't = u\beta,\ dt = \beta\,du \implies \int_0^1 F^{-1}(u\beta)\,du = \dfrac1\beta\int_0^\beta F^{-1}(t)\,dt = \ell'
            note: "Changement de variable lineaire t = u fois beta pour retomber sur la forme demandee."
      - id: q2b
        stem: |-
          **2- b)** (0,5 pt) Montrer que $\ell = \dfrac{1}{\beta}\displaystyle\int_0^1 u\,e^{u^2}\,du$

          *(On pourra effectuer le changement de variable $u = F^{-1}(t)$)*
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'indication impose le changement de variable $u=F^{-1}(t)$ dans $\displaystyle\int_0^\beta F^{-1}(t)\,dt$ (question 2-a). Un tel changement de variable n'est légitime que si la fonction qui relie $u$ et $t$ est **dérivable** — ce qui n'est pas immédiat ici, puisque $F^{-1}$ n'a jamais été construite explicitement : c'est exactement le rôle du théorème de la dérivée d'une fonction réciproque (chapitre « dérivabilité et étude de fonctions », hors socle de ce chapitre), qu'il faut énoncer et vérifier avant de s'en servir.

          **Le théorème de la dérivée d'une fonction réciproque, énoncé ici.** Soit $g$ une bijection d'un intervalle $I$ sur $J$, dérivable en un point $a$ de $I$, et $b=g(a)$. Si $g^{\prime}(a)\ne 0$, alors $g^{-1}$ est dérivable en $b$, et $\left(g^{-1}\right)^{\prime}(b) = \dfrac{1}{g^{\prime}(a)}$.

          **Les hypothèses, vérifiées pour $F$ sur $[0,1]$.** $F$ est une bijection de $[0,1]$ sur $[0,\beta]$ (question 1-b), dérivable en tout point de $[0,1]$ avec $F^{\prime}(x)=e^{x^2}$ (question 1-a), et $F^{\prime}(x)=e^{x^2}$ **ne s'annule jamais** (l'exponentielle est toujours strictement positive). Le théorème s'applique donc en **tout** point de $[0,1]$ : $F^{-1}$ est dérivable en tout point de $[0,\beta]$, avec $\left(F^{-1}\right)^{\prime}(t) = \dfrac{1}{F^{\prime}\!\left(F^{-1}(t)\right)}$. C'est cette dérivabilité, acquise partout et non en un seul point, qui rend légitime le changement de variable $u=F^{-1}(t)$ sur l'intégrale entière $\displaystyle\int_0^\beta F^{-1}(t)\,dt$, et non pas seulement en un point isolé.

          **Le changement de variable, mené concrètement.** Poser $u=F^{-1}(t)$ équivaut à $t=F(u)$ (définition même de la réciproque). En différentiant cette relation (licite, puisque $F$ est dérivable, avec $F^{\prime}(u)=e^{u^2}$) :

          $$t = F(u) \implies dt = F^{\prime}(u)\,du = e^{u^2}\,du$$

          **Les bornes.** $t=0 \iff u=F^{-1}(0)$ ; or $F(0)=0$ (question 1-b), donc $F^{-1}(0)=0$. $t=\beta \iff u=F^{-1}(\beta)$ ; or $F(1)=\beta$ (question 1-b), donc $F^{-1}(\beta)=1$.

          **La substitution.**

          $$\int_0^\beta F^{-1}(t)\,dt = \int_0^1 u\cdot e^{u^2}\,du$$

          puisque $F^{-1}(t)=u$ dans l'intégrande, et $dt=e^{u^2}du$. En reprenant le résultat de la question 2-a :

          $$\boxed{\ell = \frac1\beta\int_0^\beta F^{-1}(t)\,dt = \frac1\beta\int_0^1 u\,e^{u^2}\,du}$$

          **Le piège nommé de cette question.** Effectuer le changement de variable comme un pur geste mécanique — remplacer $F^{-1}(t)$ par $u$ et $dt$ par $F^{\prime}(u)du$ sans jamais justifier que $F^{-1}$ est dérivable. Le résultat numérique serait identique, mais la démonstration perdrait son fondement : c'est précisément parce que $F^{\prime}$ ne s'annule jamais sur $[0,1]$ que $F^{-1}$ est dérivable **partout** sur $[0,\beta]$, et donc que le changement de variable est licite sur l'intégrale entière, pas seulement suggéré par l'énoncé comme un raccourci de calcul.
        steps:
          - math: 'F \text{ bijection derivable sur } [0,1], \quad F^{\prime}(x) = e^{x^2} \ne 0 \ \forall x \implies F^{-1} \text{ derivable sur } [0,\beta]'
            note: "Theoreme de la derivee d'une fonction reciproque, hors socle de ce chapitre : F prime ne s'annule jamais."
          - math: 'u = F^{-1}(t) \iff t = F(u) \implies dt = F^{\prime}(u)\,du = e^{u^2}\,du'
            note: "Differentiation de t = F(u), licite car F derivable de derivee connue."
          - math: 't=0 \implies u = F^{-1}(0) = 0 \ (\text{car } F(0)=0), \qquad t=\beta \implies u = F^{-1}(\beta) = 1 \ (\text{car } F(1)=\beta)'
            note: "Bornes transportees via F(0)=0 et F(1)=beta, etablies a la question 1-b."
          - math: '\int_0^\beta F^{-1}(t)\,dt = \int_0^1 u\,e^{u^2}\,du \implies \boxed{\ell = \dfrac1\beta\int_0^1 u\,e^{u^2}\,du}'
            note: "Substitution complete : integrande, differentielle et bornes tous transportes."
      - id: q2c
        stem: |-
          **2- c)** (0,5 pt) En déduire que : $\ell = \dfrac{e-1}{2\beta}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Il reste un seul calcul, purement mécanique : une primitive de $u\mapsto u\,e^{u^2}$. La forme $u\,e^{u^2}$ est du type $u^{\prime}(x)\,e^{u(x)}$ avec $u(x)=x^2$ (à une constante $\frac12$ près) : c'est la dérivée d'une composée $e^{u(x)}$, reconnaissable directement sans changement de variable supplémentaire.

          **La primitive.** $\dfrac{d}{du}\left[\dfrac12 e^{u^2}\right] = \dfrac12 \times 2u \times e^{u^2} = u\,e^{u^2}$ : la fonction $u\mapsto \dfrac12 e^{u^2}$ est donc une primitive de $u\mapsto u\,e^{u^2}$ sur $\mathbb{R}$, en particulier sur $[0,1]$.

          **Le calcul.**

          $$\int_0^1 u\,e^{u^2}\,du = \left[\frac12 e^{u^2}\right]_0^1 = \frac12 e^{1} - \frac12 e^{0} = \frac{e-1}{2}$$

          **La conclusion**, en reprenant la question 2-b :

          $$\ell = \frac1\beta \times \frac{e-1}{2} = \boxed{\frac{e-1}{2\beta}}$$

          **Ce que le problème vient de démontrer, relu d'ensemble.** La moyenne des valeurs de $F^{-1}$ sur $[0,\beta]$ — c'est ce que $\ell$ représente, à $\frac1\beta$ près (chapitre 7, valeur moyenne d'une fonction) — ne dépendait, au bout du compte, que de $e$ et de $\beta$ : la fonction $F^{-1}$ elle-même n'a jamais eu besoin d'être connue explicitement, exactement comme $F$ à la question 1-a. Le changement de variable de la question 2-b a transporté tout le problème sur le terrain où $F$, elle, **est** connue.

          **Le piège nommé de cette question.** Refaire un changement de variable ($w=u^2$, par exemple) alors que la primitive $\frac12 e^{u^2}$ se lit directement, en reconnaissant la forme $u^{\prime}e^u$ composée — un détour inutile sur une question à $0{,}5$ point qui se termine en une ligne.
        steps:
          - math: '\left(\dfrac12 e^{u^2}\right)^{\prime} = u\,e^{u^2} \quad (\text{primitive directe, forme } u^{\prime}e^{u})'
            note: "Reconnaissance de la forme derivee d'une composee, sans changement de variable supplementaire."
          - math: '\int_0^1 u\,e^{u^2}\,du = \left[\dfrac12 e^{u^2}\right]_0^1 = \dfrac12 e - \dfrac12 = \dfrac{e-1}{2}'
            note: "Evaluation de la primitive entre 0 et 1."
          - math: '\ell = \dfrac1\beta \times \dfrac{e-1}{2} = \boxed{\dfrac{e-1}{2\beta}}'
            note: "Report dans l'expression de ell etablie a la question 2-b."
