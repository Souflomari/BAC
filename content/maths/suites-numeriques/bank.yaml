# numérisation du sujet officiel, mais le **sous-échantillonnage 300 →
# 150 dpi qu'AlloSchool applique** pour produire les JPG qu'il sert. Le
# sujet officiel est impeccable ici — lecture retenue, définitivement :
# $u_{n+1}=f_0(u_n)$, jamais $u_{n\div1}$ (qui n'aurait de toute façon aucun
