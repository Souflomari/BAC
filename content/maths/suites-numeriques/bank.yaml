      - id: q3-3a
        part: "Partie III, 3 — Limites de x_n et de n fois x_n"
        stem: |-
          **(0,5 pt)** Montrer que pour tout entier $n \ge 2$, $\dfrac{1}{n} < x_n < \dfrac{1}{n}\left(\dfrac{2e}{1+e}\right)$
        reasoning: |-
          Repars de la définition de $x_n$ : $f_n(x_n)=0$ s'écrit $\dfrac{-2e^{x_n}}{1+e^{x_n}}+nx_n=0$, soit $n x_n = \dfrac{2e^{x_n}}{1+e^{x_n}}$ — le membre de droite est une fonction de $x_n$ seul, qu'il suffit d'encadrer avec ce qu'on connaît déjà de $x_n$ (question 1-b : $0<x_n<1$).

          Pose $h(x)=\dfrac{2e^x}{1+e^x}$. C'est une fonction strictement croissante : $h(x)=2-\dfrac{2}{1+e^x}$, et $\dfrac{2}{1+e^x}$ décroît strictement (dénominateur croissant), donc $h$ croît strictement. Comme $0<x_n<1$ et $h$ strictement croissante, $h(0)<h(x_n)<h(1)$ :

          $$h(0) = \frac{2}{2} = 1 \qquad\qquad h(1) = \frac{2e}{1+e}$$

          $$1 < nx_n < \frac{2e}{1+e}$$

          Il ne reste qu'à diviser par $n>0$, sans changer le sens des inégalités :

          $$\frac{1}{n} < x_n < \frac{1}{n}\left(\frac{2e}{1+e}\right)$$
        steps:
          - math: 'f_n(x_n)=0 \iff \dfrac{-2e^{x_n}}{1+e^{x_n}}+nx_n=0 \iff nx_n = \dfrac{2e^{x_n}}{1+e^{x_n}}'
            note: "On réécrit la définition de x_n pour isoler n fois x_n."
          - math: 'h(x)=\dfrac{2e^x}{1+e^x} = 2-\dfrac{2}{1+e^x} \ \Rightarrow\ h \text{ strictement croissante}'
            note: "h est 2 moins une fonction décroissante (2 sur 1+e^x) : h croit strictement."
          - math: '0<x_n<1,\ h \text{ croissante} \ \Rightarrow\ h(0)<h(x_n)<h(1),\quad h(0)=1,\ h(1)=\dfrac{2e}{1+e}'
            note: "On encadre h(x_n) grâce a l'encadrement de x_n de la question 1-b."
          - math: '1 < nx_n < \dfrac{2e}{1+e} \ \Rightarrow\ \dfrac1n < x_n < \dfrac1n\left(\dfrac{2e}{1+e}\right) \quad (n>0)'
            note: "On divise par n, strictement positif : le sens des inégalités ne change pas."
      - id: q3-3b
        stem: |-
          **(0,5 pt)** En déduire $\displaystyle\lim_{n \to +\infty} x_n$, puis montrer que $\displaystyle\lim_{n \to +\infty} n x_n = 1$
        reasoning: |-
          Le membre de gauche $\dfrac1n$ et le membre de droite $\dfrac1n\left(\dfrac{2e}{1+e}\right)$ de l'encadrement précédent tendent tous deux vers $0$ quand $n\to+\infty$ ($\dfrac{2e}{1+e}$ est une constante) : par le théorème des gendarmes (chapitre 7), $x_n\to0$.

          Pour la seconde limite, repars de l'égalité établie à la question 3-a, $nx_n=\dfrac{2e^{x_n}}{1+e^{x_n}}$ : c'est une fonction continue de $x_n$, et $x_n\to0$, donc par continuité de $\exp$ et opérations usuelles sur les limites (chapitre 6) :

          $$\lim_{n\to+\infty} nx_n = \frac{2e^0}{1+e^0} = \frac{2}{2} = 1$$
        steps:
          - math: '\dfrac1n\to0,\quad \dfrac1n\left(\dfrac{2e}{1+e}\right)\to0 \ \Rightarrow\ x_n\to0 \quad (\text{théorème des gendarmes, chapitre 7, question 3-a})'
            note: "Les deux bornes de l'encadrement tendent vers 0 : x_n aussi."
          - math: 'nx_n = \dfrac{2e^{x_n}}{1+e^{x_n}} \quad (\text{question 3-a}),\quad x_n\to0 \ \Rightarrow\ e^{x_n}\to e^0=1'
            note: "On reutilise l'égalité de la question 3-a ; continuité de exp en 0."
          - math: '\lim_{n\to+\infty} nx_n = \dfrac{2\times1}{1+1} = 1'
            note: "On passe a la limite dans le quotient : numérateur et dénominateur ont une limite finie, dénominateur non nul."
      - id: q3-4a
        part: "Partie III, 4 — Comparaison à x_2 et limite de (x_n) puissance n"
        stem: |-
          **(0,5 pt)** Montrer que pour tout entier $n \ge 2$, on a : $x_n \le x_2$
        reasoning: |-
