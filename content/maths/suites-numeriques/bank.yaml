            note: "On élève a la puissance n, qui conserve l'ordre entre deux quantités positives."
          - math: '0<x_2<1 \ \Rightarrow\ \lim_{n\to+\infty} (x_2)^n = 0 \quad (\text{chapitre 6})'
            note: "x_2 est une constante entre 0 et 1 : sa puissance n-ieme tend vers 0."
          - math: '0<(x_n)^n\le(x_2)^n\to0 \ \Rightarrow\ \lim_{n\to+\infty} (x_n)^n = 0 \quad (\text{théorème des gendarmes, chapitre 7})'
            note: "Encadrement final : conclusion par le théorème des gendarmes."
