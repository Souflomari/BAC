      - id: q3-4b
        stem: |-
          **(0,5 pt)** En déduire $\displaystyle\lim_{n \to +\infty} (x_n)^{n}$
        reasoning: |-
          Deux ingrédients à combiner : $0<x_n\le x_2$ pour tout $n\ge2$ (question précédente et question 1-b), et $x_2<1$ (question 1-b appliquée au rang $n=2$ — une constante fixe qui ne dépend plus de $n$). La fonction $t\mapsto t^n$ est croissante sur les positifs, donc élever à la puissance $n$ conserve l'inégalité $x_n\le x_2$ :

          $$0 < (x_n)^n \le (x_2)^n$$

          Or $0<x_2<1$ : $(x_2)^n$ est une suite géométrique de raison dans $]0,1[$, donc $(x_2)^n\to0$ (chapitre 6, même mécanisme que $\left(\dfrac12\right)^n$ en Partie II). Le théorème des gendarmes (chapitre 7), appliqué à $0<(x_n)^n\le(x_2)^n\to0$, donne :

          $$\lim_{n\to+\infty} (x_n)^n = 0$$
        steps:
