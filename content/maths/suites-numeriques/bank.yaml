# UN FAIT DE MÉTHODE QUI VAUT POUR TOUT LE CORPUS — LE « + » DE $u_{n+1}$ QUI
# N'ÉTAIT PAS CASSÉ. La ligne de définition de la suite $(u_n)$ (« $u_0=0$
