    intro: |-
      **Étude de fonction à paramètre (examen national, session normale 2021, Sciences Mathématiques) — Parties II et III.**

      Pour tout entier naturel $n$, on considère la fonction $f_n$ définie sur $\mathbb{R}$ par :

      $$f_n(x) = \dfrac{-2e^x}{1+e^x} + nx$$

      Soit $(C_n)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i},\vec{j})$.

      **Portée de cette carte.** Cette carte reprend les **Parties II et III** de l'exercice 1 (7,0 pts sur les 12 de l'exercice complet) : deux études de suites bâties sur $f_n$. La **Partie I** (5,0 pts, l'étude de $f_n$ elle-même) vit dans une carte sœur, au banc de la leçon « Fonction exponentielle ». Cette carte est **autonome** : tout ce dont les questions ci-dessous ont besoin de la Partie I (dérivée de $f_n$, monotonie, limites aux bornes) est redémontré au point d'usage, jamais simplement cité.

      **Partie II.** On considère la suite $(u_n)_{n \ge 0}$ définie par :

      $$u_0 = 0 \qquad\text{et}\qquad (\forall n \in \mathbb{N})\ ;\quad u_{n+1} = f_0(u_n)$$
    questions:
      - id: q2-1a
        part: "Partie II, 1 — Point fixe de f0"
        stem: |-
          **(0,5 pt)** Montrer que l'équation $f_0(x) = x$ admet une unique solution $\alpha$ dans $\mathbb{R}$
        reasoning: |-
          $f_0(x) = \dfrac{-2e^x}{1+e^x}$ (cas $n=0$ de $f_n$). Une équation $f_0(x)=x$ se lit comme la recherche d'un **point fixe** : étudie la fonction auxiliaire $g(x)=f_0(x)-x$, dont un zéro est exactement une solution.

          $g$ est dérivable sur $\mathbb{R}$ (différence de deux fonctions dérivables : $f_0$, quotient à dénominateur $1+e^x$ jamais nul ; et la fonction identité). En dérivant le quotient ($u=-2e^x$, $v=1+e^x$) :

          $$f_0'(x) = \frac{-2e^x(1+e^x)-(-2e^x)(e^x)}{(1+e^x)^2} = \frac{-2e^x}{(1+e^x)^2}$$

          (les deux termes en $e^{2x}$ s'annulent). Cette expression est **négative pour tout $x$** : $-2e^x<0$ et $(1+e^x)^2>0$ toujours. Donc $g'(x)=f_0'(x)-1<0-1<0$ : $g$ est strictement décroissante sur $\mathbb{R}$ tout entier.

          Limites : divise numérateur et dénominateur de $f_0(x)$ par $e^x$, $f_0(x)=\dfrac{-2}{e^{-x}+1}$. Quand $x\to-\infty$, $e^{-x}\to+\infty$, donc $f_0(x)\to0$, et $g(x)=f_0(x)-x\to0-(-\infty)=+\infty$. Quand $x\to+\infty$, $e^{-x}\to0$, donc $f_0(x)\to-2$, et $g(x)\to-2-(+\infty)=-\infty$.

          $g$ continue (dérivable), strictement décroissante, avec une limite $+\infty$ en $-\infty$ et $-\infty$ en $+\infty$ : par le corollaire du théorème des valeurs intermédiaires pour une fonction strictement monotone (« Limites et continuité »), $g$ prend la valeur $0$ **exactement une fois**. Ce zéro unique est l'unique réel $\alpha$ tel que $f_0(\alpha)=\alpha$.
        steps:
          - math: 'f_0(x) = \dfrac{-2e^x}{1+e^x} \ \Rightarrow\ f_0''(x) = \dfrac{-2e^x(1+e^x)-(-2e^x)(e^x)}{(1+e^x)^2} = \dfrac{-2e^x}{(1+e^x)^2}'
            note: "Dérivée de f0, quotient de deux fonctions dérivables ; les termes en e^2x s'annulent."
          - math: '-2e^x<0,\ (1+e^x)^2>0 \ \Rightarrow\ f_0''(x)<0 \quad (g(x)=f_0(x)-x \ \Rightarrow\ g''(x)=f_0''(x)-1<0)'
            note: "f0 prime est négative pour tout x : g prime aussi, strictement négative."
          - math: '\lim_{x\to-\infty} f_0(x) = 0 \ \Rightarrow\ \lim_{x\to-\infty} g(x) = +\infty \qquad \lim_{x\to+\infty} f_0(x) = -2 \ \Rightarrow\ \lim_{x\to+\infty} g(x) = -\infty'
            note: "Limites de f0 aux deux bornes (numérateur et dénominateur divises par e^x), puis de g."
          - math: '\Rightarrow\ \exists!\ \alpha\in\mathbb{R} \text{ tel que } g(\alpha)=0,\ \text{soit } f_0(\alpha)=\alpha \quad (\text{corollaire du TVI})'
            note: "g continue, strictement décroissante, change de signe une seule fois : un unique zéro."
      - id: q2-1b
        stem: |-
          **(0,5 pt)** Montrer que : $(\forall x \in \mathbb{R})\ ;\quad \big|f_0'(x)\big| \le \dfrac{1}{2}$
        reasoning: |-
          La formule de $f_0'(x)=\dfrac{-2e^x}{(1+e^x)^2}$ vient d'être établie (question précédente) ; il reste à majorer $\big|f_0'(x)\big|=\dfrac{2e^x}{(1+e^x)^2}$. Compare ce quotient à $\dfrac12$ en ramenant tout au même dénominateur, toujours strictement positif :

          $$(1+e^x)^2 - 4e^x = 1+2e^x+e^{2x}-4e^x = 1-2e^x+e^{2x} = (1-e^x)^2 \ge 0$$

          un carré, donc toujours positif ou nul, quel que soit $x$. Donc $(1+e^x)^2\ge4e^x$, et en divisant par $(1+e^x)^2>0$ (le sens de l'inégalité se conserve) :

          $$\frac{4e^x}{(1+e^x)^2}\le1 \quad\text{soit}\quad \frac{2e^x}{(1+e^x)^2}\le\frac12$$

          Or $\big|f_0'(x)\big| = \dfrac{2e^x}{(1+e^x)^2}$ (la valeur absolue efface le signe moins de la question précédente) : donc $\big|f_0'(x)\big|\le\dfrac12$ pour tout $x$.

          *(Ce calcul — l'identité $(1+e^x)^2-4e^x=(1-e^x)^2$ — est le même que celui qui sert de point de départ dans la Partie I, au banc de la leçon « Fonction exponentielle » (même sujet, Partie I), où il est établi pour $f_n'$ en général. Il est refait ici en entier, pour le cas particulier $n=0$, pour que cette carte reste autonome.)*
        steps:
          - math: '(1+e^x)^2-4e^x = 1-2e^x+e^{2x} = (1-e^x)^2 \ge 0 \quad (\forall x\in\mathbb{R})'
            note: "Un carré est toujours positif ou nul."
          - math: '\Rightarrow\ (1+e^x)^2\ge4e^x \ \Rightarrow\ \dfrac{4e^x}{(1+e^x)^2}\le1 \quad (\text{on divise par } (1+e^x)^2>0)'
            note: "On divise par le carré du dénominateur, strictement positif."
          - math: '\big|f_0''(x)\big| = \dfrac{2e^x}{(1+e^x)^2} \le \dfrac12'
            note: "On divise l'inégalité précédente par 2 ; la valeur absolue efface le signe moins de f0 prime."
      - id: q2-2a
        part: "Partie II, 2 — Contraction et convergence vers alpha"
        stem: |-
          **(0,5 pt)** Montrer que : $(\forall n \in \mathbb{N})\ ;\quad |u_{n+1} - \alpha| \le \dfrac{1}{2}|u_n - \alpha|$
        reasoning: |-
          C'est le pas central de toute la Partie II : transformer une borne sur la dérivée (question 1-b) en une borne sur l'écart entre deux termes consécutifs de la suite. L'outil est l'**inégalité des accroissements finis** (corollaire du théorème des accroissements finis, notion « Dérivabilité et étude des fonctions » : si $f$ est dérivable sur un intervalle et $|f'|\le k$ partout sur cet intervalle, alors $|f(b)-f(a)|\le k|b-a|$ pour tous $a,b$ de l'intervalle) — outil hors du corps des chapitres 1 à 12 de cette leçon, déjà mobilisé pour la même construction au banc de la leçon « Fonction exponentielle » (sujet 2025).

          Applique-la à $f_0$ (dérivable sur $\mathbb{R}$, $|f_0'|\le\dfrac12$ partout, question 1-b) entre $a=\alpha$ et $b=u_n$ :

          $$\big|f_0(u_n)-f_0(\alpha)\big| \le \frac12|u_n-\alpha|$$

          Or $f_0(u_n)=u_{n+1}$ (définition de la suite) et $f_0(\alpha)=\alpha$ (définition de $\alpha$, question 1-a) : le membre de gauche est exactement $|u_{n+1}-\alpha|$.
        steps:
          - math: 'f_0 \text{ dérivable sur } \mathbb{R},\ |f_0''|\le\dfrac12 \ \Rightarrow\ \big|f_0(b)-f_0(a)\big|\le\dfrac12|b-a| \quad (\forall a,b\in\mathbb{R})'
            note: "Inégalité des accroissements finis, appliquee a f0 sur R tout entier."
          - math: '\text{avec } a=\alpha,\ b=u_n\ :\ \big|f_0(u_n)-f_0(\alpha)\big|\le\dfrac12|u_n-\alpha|'
            note: "On applique l'inégalité entre alpha et u_n."
          - math: 'f_0(u_n)=u_{n+1},\quad f_0(\alpha)=\alpha \ \Rightarrow\ |u_{n+1}-\alpha|\le\dfrac12|u_n-\alpha|'
            note: "$u_{n+1}$ est f0 de u_n par définition ; alpha est point fixe de f0 par définition."
      - id: q2-2b
        stem: |-
          **(0,5 pt)** En déduire que : $(\forall n \in \mathbb{N})\ ;\quad |u_n - \alpha| \le \left(\dfrac{1}{2}\right)^{n}|\alpha|$
        reasoning: |-
          La question précédente donne un pas : d'un rang au suivant, l'écart à $\alpha$ est au moins divisé par $2$. Empile ce pas $n$ fois, par récurrence (chapitre 2), pour obtenir la borne au rang $n$ à partir du rang $0$.

          **Initialisation.** Au rang $0$ : $|u_0-\alpha|=|0-\alpha|=|\alpha|=\left(\dfrac12\right)^0|\alpha|$ — égalité, donc vraie.

          **Hérédité.** Suppose $|u_n-\alpha|\le\left(\dfrac12\right)^n|\alpha|$. D'après la question 2-a, $|u_{n+1}-\alpha|\le\dfrac12|u_n-\alpha|$, donc en combinant les deux :

          $$|u_{n+1}-\alpha| \le \frac12\times\left(\frac12\right)^n|\alpha| = \left(\frac12\right)^{n+1}|\alpha|$$

          C'est exactement l'inégalité au rang $n+1$ : par récurrence, elle est vraie pour tout $n$.
        steps:
          - math: 'n=0\ :\ |u_0-\alpha| = |0-\alpha| = |\alpha| = \left(\dfrac12\right)^0|\alpha|'
            note: "Initialisation : égalité au rang 0, car u0 = 0."
          - math: '|u_n-\alpha|\le\left(\dfrac12\right)^n|\alpha| \ \Rightarrow\ |u_{n+1}-\alpha|\le\dfrac12|u_n-\alpha|\le\dfrac12\left(\dfrac12\right)^n|\alpha| = \left(\dfrac12\right)^{n+1}|\alpha|'
            note: "Hérédité : on reinjecte la question 2-a dans l'hypothèse de récurrence."
          - math: '\Rightarrow\ (\forall n\in\mathbb{N})\ ;\ |u_n-\alpha|\le\left(\dfrac12\right)^n|\alpha| \quad (\text{par recurrence})'
            note: "Conclusion par recurrence."
      - id: q2-2c
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_n)_{n \ge 0}$ converge vers $\alpha$
        reasoning: |-
          On tient un encadrement de $|u_n-\alpha|$ entre $0$ et une suite explicite qui tend vers $0$ : $\left(\dfrac12\right)^n$ est géométrique de raison $\dfrac12\in\,]{-1};1[$, donc $\left(\dfrac12\right)^n\to0$ (chapitre 6), et $|\alpha|$ est une constante, donc $\left(\dfrac12\right)^n|\alpha|\to0$ aussi. Le théorème des gendarmes (chapitre 7), appliqué à $0\le|u_n-\alpha|\le\left(\dfrac12\right)^n|\alpha|$, donne $|u_n-\alpha|\to0$ — c'est-à-dire, par définition, $u_n\to\alpha$.
        steps:
          - math: '\left|\dfrac12\right|<1 \ \Rightarrow\ \lim_{n\to+\infty}\left(\dfrac12\right)^n = 0 \ \Rightarrow\ \lim_{n\to+\infty}\left(\dfrac12\right)^n|\alpha| = 0'
            note: "Suite géométrique de raison entre -1 et 1 (chapitre 6) : elle tend vers 0."
          - math: '0\le|u_n-\alpha|\le\left(\dfrac12\right)^n|\alpha|,\quad \left(\dfrac12\right)^n|\alpha|\to0 \ \Rightarrow\ |u_n-\alpha|\to0 \quad (\text{théorème des gendarmes, chapitre 7})'
            note: "u_n moins alpha est encadre par 0 et une suite qui tend vers 0."
          - math: '\Rightarrow\ \lim_{n\to+\infty} u_n = \alpha'
            note: "Par définition de la limite : (u_n) converge vers alpha."
      - id: q3-1a
        part: "Partie III, 1 — Existence et encadrement de x_n (n supérieur ou égal à 2)"
        stem: |-
          **On suppose dans cette partie que $n \ge 2$.**

          **(0,5 pt)** Montrer que pour tout entier $n \ge 2$, il existe un unique réel $x_n$ solution de l'équation $f_n(x) = 0$
        reasoning: |-
          Même schéma de preuve qu'à la question 1-a de la Partie II — existence et unicité d'un zéro par un corollaire du TVI (« Limites et continuité ») — mais appliqué directement à $f_n$, pas à une fonction auxiliaire.

          $f_n$ est dérivable sur $\mathbb{R}$, avec $f_n'(x) = \dfrac{-2e^x}{(1+e^x)^2}+n$ (calcul de quotient identique à celui de la question 1-a, plus la dérivée de $nx$ qui vaut $n$). Réutilise l'inégalité $\dfrac{2e^x}{(1+e^x)^2}\le\dfrac12$ établie en question 1-b : pour $n\ge2$,

          $$f_n'(x) = n - \frac{2e^x}{(1+e^x)^2} \ge n-\frac12 \ge 2-\frac12 = \frac32 > 0$$

          $f_n$ est donc strictement croissante sur $\mathbb{R}$ tout entier, pour tout $n\ge2$.

          Pour les limites aux bornes, écris $f_n(x) = nx + \dfrac{-2e^x}{1+e^x}$ : le second terme est borné (compris strictement entre $-2$ et $0$ pour tout $x$, car $\dfrac{2e^x}{1+e^x}$ reste strictement entre $0$ et $2$), donc c'est le terme $nx$ qui pilote entièrement le comportement à l'infini, puisque $n>0$ : une quantité qui diverge vers $\pm\infty$, additionnée d'une quantité bornée, diverge encore vers $\pm\infty$.

          $$\lim_{x\to-\infty} f_n(x) = -\infty \qquad\qquad \lim_{x\to+\infty} f_n(x) = +\infty$$

          $f_n$ continue (dérivable), strictement croissante, d'une limite $-\infty$ à une limite $+\infty$ : par le corollaire du théorème des valeurs intermédiaires pour une fonction strictement monotone, l'équation $f_n(x)=0$ admet une unique solution $x_n$.
        steps:
          - math: 'f_n''(x) = \dfrac{-2e^x}{(1+e^x)^2}+n \quad (\text{calcul de quotient identique a la question 1-a})'
            note: "Dérivée de f_n pour n quelconque : même calcul que pour f0, le terme n s'ajoute."
          - math: 'n\ge2,\ \dfrac{2e^x}{(1+e^x)^2}\le\dfrac12 \quad(\text{q1-b}) \ \Rightarrow\ f_n''(x) \ge n-\dfrac12 \ge \dfrac32 > 0'
            note: "On reutilise l'inégalité de la question 1-b : f_n prime reste strictement positive pour n supérieur ou égal a 2."
          - math: '\dfrac{-2e^x}{1+e^x}\in\,]-2,0[ \quad (\text{terme borne}) \ \Rightarrow\ \lim_{x\to-\infty} f_n(x) = -\infty,\quad \lim_{x\to+\infty} f_n(x) = +\infty \quad (n>0)'
            note: "Le terme exponentiel reste borne ; c'est le terme n fois x qui pilote le comportement à l'infini."
          - math: '\Rightarrow\ \exists!\ x_n\in\mathbb{R} \text{ tel que } f_n(x_n)=0 \quad (\text{corollaire du TVI})'
            note: "Continue, strictement croissante, de moins l'infini a plus l'infini : un unique zéro."
      - id: q3-1b
        stem: |-
          **(0,5 pt)** Montrer que pour tout entier $n \ge 2$, $0 < x_n < 1$ *(On prendra $\dfrac{2e}{1+e} < 1{,}47$)*
        reasoning: |-
          $f_n$ est strictement croissante (question précédente) : pour encadrer son unique zéro $x_n$ entre deux valeurs, il suffit de vérifier que $f_n$ change de signe entre elles.

          $$f_n(0) = \frac{-2e^0}{1+e^0}+0 = \frac{-2}{2} = -1 < 0$$

          $$f_n(1) = \frac{-2e}{1+e}+n$$

          L'indication $\dfrac{2e}{1+e}<1{,}47$ sert exactement ici : comme $n\ge2$, $f_n(1) = n-\dfrac{2e}{1+e} \ge 2-1{,}47 = 0{,}53 > 0$.

          $f_n(0)<0<f_n(1)$, et $f_n$ strictement croissante : son unique zéro $x_n$ est donc strictement compris entre $0$ et $1$.
        steps:
          - math: 'f_n(0) = \dfrac{-2}{1+1}+0 = -1 < 0'
            note: "On evalue f_n en 0."
          - math: 'f_n(1) = \dfrac{-2e}{1+e}+n \ge n-1{,}47 \ge 2-1{,}47 = 0{,}53 > 0 \quad (\text{indication}\ \tfrac{2e}{1+e}<1{,}47,\ n\ge2)'
            note: "On evalue f_n en 1 et on utilise l'indication de l'énoncé avec n supérieur ou égal a 2."
          - math: 'f_n(0)<0<f_n(1),\ f_n \text{ strictement croissante} \ \Rightarrow\ 0<x_n<1'
            note: "Le zéro unique de f_n est encadre par 0 et 1."
      - id: q3-2a
        part: "Partie III, 2 — Décroissance et convergence de (x_n)"
        stem: |-
          **(0,5 pt)** Montrer que pour tout entier $n \ge 2$, $f_{n+1}(x_n) > 0$
        reasoning: |-
          Astuce clé : relier $f_{n+1}$ à $f_n$ dans leur définition, plutôt que de recalculer $f_{n+1}(x_n)$ depuis zéro. Par définition, $f_{n+1}(x)-f_n(x) = (n+1)x-nx = x$ pour tout $x$ (le morceau exponentiel est identique, seul le terme en $x$ change) — donc $f_{n+1}(x)=f_n(x)+x$.

          En $x=x_n$ : $f_{n+1}(x_n) = f_n(x_n)+x_n = 0+x_n = x_n$, puisque $f_n(x_n)=0$ par définition de $x_n$ (question 1-a). Et $x_n>0$ (question 1-b) : donc $f_{n+1}(x_n)=x_n>0$.
        steps:
          - math: 'f_{n+1}(x)-f_n(x) = (n+1)x-nx = x \ \Rightarrow\ f_{n+1}(x) = f_n(x)+x \quad (\forall x\in\mathbb{R})'
            note: "Le morceau exponentiel de f_n ne dépend pas de n : seul le terme en x change entre f_n et $f_{n+1}$."
          - math: 'f_{n+1}(x_n) = f_n(x_n)+x_n = 0+x_n = x_n \quad (\text{car } f_n(x_n)=0)'
            note: "On evalue en x_n, ou f_n s'annule par définition."
          - math: 'x_n>0 \quad (\text{question 1-b}) \ \Rightarrow\ f_{n+1}(x_n) = x_n > 0'
            note: "x_n est strictement positif : conclusion."
      - id: q3-2b
        stem: |-
