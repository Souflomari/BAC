<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img" aria-label="Construction en escalier de la suite récurrente u(n+1) = f(u_n), avec f(x) = 0,5x + 10 : la droite y = f(x), la droite y = x, et l'escalier partant de u0 = 100 qui converge vers le point fixe ℓ = 20.">
  <title>Construction en escalier — u(n+1) = f(u_n), suite du réservoir (R0/R8)</title>
  <!--
    suite-escalier.svg — construction en escalier (cobweb) STATIQUE, pour la
    suite récurrente du réservoir filée tout au long de la leçon
    (R0, R1, R3, R4, R7, R8) — aucune suite inventée, mêmes nombres que le
    texte :

      u_0 = 100,   u_(n+1) = f(u_n) = 0,5 u_n + 10

    f est affine : "la courbe y = f(x)" est ici exactement une DROITE — pas
    une approximation graphique, f est réellement affine — tracée par ses
    deux points terminaux, jamais devinée à la main.

    Point fixe (R8, "Fermeture de l'arc") :
      L = f(L)  =>  L = 0,5 L + 10  =>  0,5 L = 10  =>  L = 20

    Valeurs de la suite utilisées pour l'escalier (identiques au calcul du
    R0 du texte) :
      u0 = 100
      u1 = f(u0) = 0,5×100+10 = 60
      u2 = f(u1) = 0,5×60+10  = 40
      u3 = f(u2) = 0,5×40+10  = 30
      u4 = f(u3) = 0,5×30+10  = 25
      u5 = f(u4) = 0,5×25+10  = 22,5

    Repère écran : origine (donnée x=0,y=0) au pixel (100,480) ; échelle
    4 px/unité ; px = 100 + 4x,  py = 480 - 4y. Domaine tracé x,y ∈ [0,108]
    (légère marge au-delà de u0 = 100, pour dessiner droite/diagonale un
    peu plus loin que le premier terme).

    Droite y = f(x)  : (0,10)→(108,64)   pixel (100,440) → (532,224)
    Droite y = x     : (0,0)→(108,108)   pixel (100,480) → (532,48)
    Point fixe (20,20)                   pixel (180,400)

    Sommets de l'escalier (alternance verticale/horizontale, calculés à
    partir des u_n ci-dessus ; chaque saut vertical applique f, chaque
    saut horizontal reporte la valeur sur la diagonale y = x) :
      (u0,0)      = (100,0)     → (500,480)
      (u0,u1)     = (100,60)    → (500,240)   monte à la droite : u1=f(u0)
      (u1,u1)     = (60,60)     → (340,240)   horizontale jusqu'à y=x
      (u1,u2)     = (60,40)     → (340,320)   monte à la droite : u2=f(u1)
      (u2,u2)     = (40,40)     → (260,320)
      (u2,u3)     = (40,30)     → (260,360)
      (u3,u3)     = (30,30)     → (220,360)
      (u3,u4)     = (30,25)     → (220,380)
      (u4,u4)     = (25,25)     → (200,380)
      (u4,u5)     = (25,22.5)   → (200,390)
      (u5,u5)     = (22.5,22.5) → (190,390)

    Couleurs : droite y=x et axes en --figure-ink-soft (repères neutres) ;
    droite y=f(x) en --figure-ink (elle définit la récurrence) ;
    l'escalier (le trajet u0→u1→u2→…→ℓ) et le point fixe ℓ en
    --figure-accent — seul foyer visuel de la figure, conformément à la
    charte (accent réservé à UN SEUL point d'attention).
  -->

  <rect x="20" y="34" width="600" height="506" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <text x="320" y="14" text-anchor="middle" font-size="12.5" font-weight="600"
        fill="var(--figure-ink)">Construction en escalier : u<tspan dy="3" font-size="9">n+1</tspan><tspan dy="-3"> = f(u</tspan><tspan dy="3" font-size="9">n</tspan><tspan dy="-3">)</tspan></text>
  <text x="320" y="28" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">réservoir (R0/R8) : u<tspan dy="3" font-size="8">0</tspan><tspan dy="-3"> = 100,  u</tspan><tspan dy="3" font-size="8">n+1</tspan><tspan dy="-3"> = 0,5 u</tspan><tspan dy="3" font-size="8">n</tspan><tspan dy="-3"> + 10  &#x2192;  converge vers ℓ = 20</tspan></text>

  <!-- axes -->
  <line x1="100" y1="480" x2="574" y2="480" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="574,480 562,475.5 562,484.5" fill="var(--figure-ink-soft)"/>
  <line x1="100" y1="480" x2="100" y2="48" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="100,40 95.5,51 104.5,51" fill="var(--figure-ink-soft)"/>
  <text x="580" y="498" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="8">n</tspan></text>
  <text x="72" y="66" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="8">n+1</tspan></text>

  <!-- droite y = x (repère) -->
  <line x1="100" y1="480" x2="532" y2="48" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="538" y="52" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">y = x</text>

  <!-- droite y = f(x) = 0,5x + 10 -->
  <line x1="100" y1="440" x2="532" y2="224" stroke="var(--figure-ink)" stroke-width="2"/>
  <text x="538" y="222" font-size="11" font-style="italic" fill="var(--figure-ink)">f(x) = 0,5x + 10</text>

  <!-- point fixe ℓ = 20 : repères pointillés vers les deux axes -->
  <line x1="180" y1="400" x2="180" y2="480" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="400" x2="180" y2="400" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- escalier (accent, seul foyer de la figure) -->
  <path d="M500,480 L500,240 L340,240 L340,320 L260,320 L260,360 L220,360 L220,380 L200,380 L200,390 L190,390"
        fill="none" stroke="var(--figure-accent)" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="500" cy="480" r="3" fill="var(--figure-accent)"/>
  <circle cx="500" cy="240" r="3" fill="var(--figure-accent)"/>
  <circle cx="340" cy="320" r="3" fill="var(--figure-accent)"/>
  <circle cx="260" cy="360" r="3" fill="var(--figure-accent)"/>
  <circle cx="220" cy="380" r="3" fill="var(--figure-accent)"/>
  <circle cx="200" cy="390" r="3" fill="var(--figure-accent)"/>
  <circle cx="180" cy="400" r="4" fill="var(--figure-accent)"/>

  <!-- ticks + labels u0, u1, u2, ℓ (sur l'axe des abscisses) -->
  <line x1="500" y1="480" x2="500" y2="488" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="340" y1="480" x2="340" y2="488" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="260" y1="480" x2="260" y2="488" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <line x1="180" y1="480" x2="180" y2="488" stroke="var(--figure-accent)" stroke-width="1.4"/>

  <text x="500" y="500" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink)">u<tspan dy="3" font-size="8">0</tspan></text>
  <text x="340" y="500" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink)">u<tspan dy="3" font-size="8">1</tspan></text>
  <text x="260" y="500" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink)">u<tspan dy="3" font-size="8">2</tspan></text>
  <text x="180" y="500" text-anchor="middle" font-size="12" font-weight="600" font-style="italic" fill="var(--figure-accent)">ℓ</text>

  <!-- légende de la construction -->
  <text x="320" y="560" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">escalier : verticale jusqu'à la droite (u<tspan dy="2" font-size="7.5">n+1</tspan><tspan dy="-2"> = f(u</tspan><tspan dy="2" font-size="7.5">n</tspan><tspan dy="-2">)), horizontale jusqu'à y = x, puis on recommence.</tspan></text>
  <text x="320" y="577" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">la suite se rapproche de ℓ = 20, le point fixe où f(ℓ) = ℓ (R8).</text>
</svg>
