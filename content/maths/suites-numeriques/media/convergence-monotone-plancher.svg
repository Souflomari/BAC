<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img" aria-label="Une suite décroissante et minorée converge : elle descend, de moins en moins vite, vers une limite L=2 ; mais le minorant m=1 utilisé pour prouver la convergence reste bien en dessous de la vraie limite — le plancher n'est pas la limite.">
  <title>Décroissante et minorée : convergence garantie, mais le plancher n'est pas la limite</title>
  <!--
    convergence-monotone-plancher.svg — STAGED (docs/design/LESSON-EXPERIENCE-SPEC.md §2).
    Suite GÉNÉRIQUE, distincte à dessein de la suite du réservoir (R0/R5/R8) —
    là-bas le minorant (20) est EXACTEMENT la limite, ce qui détruirait le
    point de cette figure. Ici : u_n = 2 + 6 x 0,5^n (décroissante,
    décélérante, limite exacte L=2), minorant choisi m=1, nettement sous L :

      n=0 u=8         n=1 u=5         n=2 u=3,5       n=3 u=2,75
      n=4 u=2,375     n=5 u=2,1875    n=6 u=2,09375   n=7 u=2,046875

    Repère écran : px = 90 + 60·n,  py = 430 - 45·u  (u=0 -> 430, u=8 -> 70).
      n=0 (90,70)     n=1 (150,205)    n=2 (210,272.5)   n=3 (270,306.25)
      n=4 (330,323.125) n=5 (390,331.5625) n=6 (450,335.78125) n=7 (510,337.890625)

    m = 1 -> py = 430-45  = 385
    L = 2 -> py = 430-90  = 340   (45 px d'écart visible entre les deux —
                                    le point de la figure)

    STAGED, 3 étapes (LESSON-EXPERIENCE-SPEC §2.5) :
      step-1 : axes seuls, échelle 0..8, sans ligne horizontale.
      step-2 : la suite décroissante et décélérante (en ink — données).
      step-3 : DEUX droites en accent : m=1 (bas, le plancher qu'on a
               utilisé pour prouver la convergence) et L=2 (au-dessus,
               là où les termes s'entassent réellement) — la conclusion
               du R7 : décroissante+minorée -> converge, mais L >= m,
               le plancher n'est pas la limite.

    Couleurs : axes en --figure-ink-soft (chrome) ; la suite en
    --figure-ink (données) ; m et L en --figure-accent (seul foyer —
    les deux droites du R7, m distinguée par son opacité réduite pour
    rester lisible sous L sans rivaliser avec elle).

    Les captions vivent dans convergence-monotone-plancher.stages.json —
    aucun texte de légende baké ici (même convention que
    convergence-limite.svg).
  -->

  <rect x="20" y="34" width="600" height="430" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <text x="320" y="14" text-anchor="middle" font-size="12.5" font-weight="600"
        fill="var(--figure-ink)">Décroissante et minorée : converge, mais vers où ?</text>
  <text x="320" y="28" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="8">n</tspan><tspan dy="-3"> décroît vers L = 2 ; le minorant m = 1 n'est qu'un plancher, pas la limite</tspan></text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — axes seuls
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="90" y1="430" x2="560" y2="430" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="572,430 560,425.5 560,434.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="430" x2="90" y2="51" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,40 85.5,51 94.5,51" fill="var(--figure-ink-soft)"/>
    <text x="576" y="434" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">n</text>
    <text x="70" y="48" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="8">n</tspan></text>

    <!-- ticks y : 0 et 8 seulement (minimalisme, voir convergence-limite) -->
    <line x1="82" y1="430" x2="90" y2="430" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="82" y1="70"  x2="90" y2="70"  stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="78" y="434" text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">0</text>
    <text x="78" y="74"  text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">8</text>

    <!-- ticks x : n = 0..7 -->
    <line x1="90"  y1="430" x2="90"  y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="150" y1="430" x2="150" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="210" y1="430" x2="210" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="270" y1="430" x2="270" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="330" y1="430" x2="330" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="390" y1="430" x2="390" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="450" y1="430" x2="450" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <line x1="510" y1="430" x2="510" y2="438" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="90"  y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">0</text>
    <text x="150" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">1</text>
    <text x="210" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">2</text>
    <text x="270" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">3</text>
    <text x="330" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">4</text>
    <text x="390" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">5</text>
    <text x="450" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">6</text>
    <text x="510" y="450" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">7</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — données : suite décroissante, décélérante
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <polyline points="90,70 150,205 210,272.5 270,306.25 330,323.125 390,331.5625 450,335.78125 510,337.890625"
              fill="none" stroke="var(--figure-ink-soft)" stroke-width="1" opacity="0.55"/>
    <circle cx="90"  cy="70"        r="2.5" fill="var(--figure-ink)"/>
    <circle cx="150" cy="205"       r="2.5" fill="var(--figure-ink)"/>
    <circle cx="210" cy="272.5"     r="2.5" fill="var(--figure-ink)"/>
    <circle cx="270" cy="306.25"    r="2.5" fill="var(--figure-ink)"/>
    <circle cx="330" cy="323.125"   r="2.5" fill="var(--figure-ink)"/>
    <circle cx="390" cy="331.5625"  r="2.5" fill="var(--figure-ink)"/>
    <circle cx="450" cy="335.78125" r="2.5" fill="var(--figure-ink)"/>
    <circle cx="510" cy="337.890625" r="2.5" fill="var(--figure-ink)"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — lecture : le minorant m et la vraie limite L, séparés
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="90" y1="385" x2="540" y2="385" stroke="var(--figure-accent)" stroke-width="1.4"
          stroke-dasharray="5,3" opacity="0.55"/>
    <text x="78" y="389" text-anchor="end" font-size="10.5" font-weight="600" font-style="italic"
          fill="var(--figure-accent)">m = 1</text>

    <line x1="90" y1="340" x2="540" y2="340" stroke="var(--figure-accent)" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="78" y="336" text-anchor="end" font-size="11" font-weight="600" font-style="italic"
          fill="var(--figure-accent)">L = 2</text>
  </g><!-- /step-3 -->

</svg>
