    intro: |-
      **Équations différentielles (examen national, session normale 2022, Sciences Expérimentales BIOF).**

      On considère la fonction $h$ définie sur $\mathbb{R}$ par $h(x) = (x+1)e^{x}$.

      *(Les questions 1) a) et 1) b) du sujet portent sur le calcul intégral — hors du périmètre de cette notion, transcrites dans la banque sœur `calcul-integral/bank.yaml`.)*
    questions:
      - id: q2a
        part: "Résoudre l'équation caractéristique et donner la solution générale"
        stem: |-
          **(0,5 pt)** Résoudre l'équation différentielle $(E) : y'' - 2y' + y = 0$
        reasoning: |-
          $(E)$ est une équation linéaire du second ordre à coefficients constants, $y''-2y'+y=0$ — le chapitre 5 de cette leçon ne traite formellement que le cas particulier $y''+\omega^2y=0$ (sans terme en $y'$) ; voir la SCOPE NOTE en tête de fichier pour cet écart. L'outil qui s'applique ici est l'**équation caractéristique** : on cherche une solution de la forme $y=e^{rx}$, et comme chaque dérivée de $e^{rx}$ multiplie simplement par $r$ (donc $y'=re^{rx}$, $y''=r^2e^{rx}$), remplacer dans $(E)$ donne $e^{rx}\left(r^2-2r+1\right)=0$. Le facteur $e^{rx}$ n'est jamais nul, donc résoudre $(E)$ revient exactement à annuler le polynôme $r^2-2r+1$.

          Ce polynôme a pour discriminant $0$ : une **racine double**. C'est précisément ce cas — par opposition à deux racines distinctes ou à des racines complexes, non traités ici — qui impose le facteur $x$ supplémentaire dans la solution générale $(Ax+B)e^{rx}$ : une équation du second ordre réclame **deux** constantes libres, et $Ax+B$ en fournit deux, là où une simple constante $C$ devant $e^{rx}$ n'en fournirait qu'une.
        steps:
          - math: 'r^{2} - 2r + 1 = 0'
            note: "Équation caractéristique associée à (E) : on cherche r tel que y = e^{rx} soit solution, ce qui transforme (E) en un polynôme en r."
          - math: '\Delta = (-2)^{2} - 4\times 1\times 1 = 4 - 4 = 0'
            note: "Discriminant nul : le second degré en r admet une racine double."
          - math: 'r = \dfrac{2}{2} = 1 \quad (\text{racine double, issue de } \Delta = 0)'
            note: "L'unique racine (double) de l'équation caractéristique vaut r = 1."
          - math: 'y(x) = (A\,x+B)\,e^{x}, \quad A,B \in \mathbb{R}'
            note: "Solution générale de (E) dans le cas racine double : le facteur (Ax+B) remplace la simple constante C du cas racine simple."
      - id: q2b
        part: "Identifier h dans la famille de solutions"
        stem: |-
          **(0,5 pt)** Montrer que la fonction $h$ est la solution de $(E)$ qui vérifie les conditions $h(0) = 1$ et $h'(0) = 2$
        reasoning: |-
          Deux choses à établir, dans l'ordre. D'abord, que $h$ appartient bien à la famille de solutions trouvée en a) : $h(x)=(x+1)e^{x}$ a exactement la forme $(Ax+B)e^{x}$, avec $A=1$ et $B=1$ — pas besoin de reprendre le calcul depuis $(E)$, la question a) a déjà réglé une fois pour toutes que toute fonction de cette forme est solution. Ensuite, que $h$ est bien **la** solution associée aux deux conditions $h(0)=1$ et $h'(0)=2$ — et comme une solution du second ordre est fixée de façon unique par la donnée conjointe de $y(0)$ et $y'(0)$ (deux conditions pour deux constantes), il suffit de vérifier ces deux égalités sur $h$, sans chercher $A$ et $B$ séparément : ils sont déjà connus par construction ($A=1$, $B=1$).

          On calcule donc $h'(x)$ (dérivée d'un produit), puis on évalue $h$ et $h'$ en $0$.
        steps:
          - math: 'h(x) = (x+1)e^{x} = (1\times x + 1)e^{x}'
            note: "h a la forme (Ax+B)e^x avec A = 1 et B = 1 : c'est donc une solution de (E), d'après la question a)."
          - math: "h'(x) = e^{x} + (x+1)e^{x} = (x+2)e^{x}"
            note: "Dérivée d'un produit, u(x) = x+1 et v(x) = e^{x} : (uv)' = u'v + uv'."
          - math: 'h(0) = (0+1)e^{0} = 1'
            note: "Première condition vérifiée : h(0) = 1."
          - math: "h'(0) = (0+2)e^{0} = 2"
            note: "Seconde condition vérifiée : h'(0) = 2 — les deux conditions imposées sont satisfaites, donc h est bien la solution de (E) associée à ces conditions."
