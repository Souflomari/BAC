<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'IBM Plex Sans', system-ui, sans-serif" role="img"
     aria-label="La solution y = 3 cos(4x) + 2 sin(4x) de l'oscillateur y seconde plus oméga carré y = 0, avec oméga = 4 : la position d'équilibre y = 0, le départ y(0) = A = 3, la courbe tracée sur un peu plus d'une période et demie, puis la lecture — la période T = 2π/ω = π/2 mesurée entre deux crêtes consécutives, et l'amplitude R = racine de 13, la hauteur maximale de la courbe au-dessus de l'équilibre.">
  <title>La solution de l'oscillateur y'' + ω²y = 0 (exemple travaillé)</title>
  <!--
    oscillateur-periode.svg — graphe STATIQUE de la solution travaillée au
    R4 (content/maths/equations-differentielles/lesson.md, ligne 316) :
        y(x) = 3 cos(4x) + 2 sin(4x),   ω = 4  (car ω² = 16, ω > 0)
    solution de y'' + 16y = 0 avec y(0) = 3, y'(0) = 8 (exemple travaillé).

    Forme amplitude-phase (R4, "Remarque", ligne 288) : y = R cos(ωx − φ),
    avec R = √(A²+B²) = √13 ≈ 3,6056 et φ = arctan(B/A) = arctan(2/3)
    ≈ 0,5880 rad (cosφ = A/R, sinφ = B/R). Les crêtes (y = R) tombent donc
    exactement en x = φ/ω = φ/4 ≈ 0,1470, puis à x = φ/4 + 2π/4 ≈ 1,7178
    (crête suivante, une période T = 2π/ω = π/2 ≈ 1,5708 plus tard).

    VÉRIFICATION : y(0) = 3cos(0)+2sin(0) = 3 = A ✓ (marqué sur l'axe,
    step-1). y(3π/4) = 3cos(3π)+2sin(3π) = 3×(−1)+2×0 = −3 (borne de
    tracé, x = 1,5T = 3π/4 ≈ 2,3562, "un peu plus d'une période et demie").

    GÉOMÉTRIE (calculée point par point depuis la vraie formule, jamais
    une bézier devinée — le gabarit crête-creux de regimes-uc.svg ne
    convient pas ici car la courbe NE PART PAS d'une crête ou d'un zéro :
    y(0) = 3 est une valeur intermédiaire, pas un point remarquable du
    cosinus) :
      origine (x=0, y=0)     : (x0,y0) = (90, 235)
      échelle horizontale     : 200 px / unité de x   → x_px = 90 + 200x
      échelle verticale       : 35 px / unité de y (y croît vers le haut)
                                                        → y_px = 235 - 35y
      crête 1 (x≈0,1470,y=R)  : (119,4 ; 108,8)
      crête 2 (x≈1,7178,y=R)  : (433,6 ; 108,8)

    Courbe : polyligne à pas constant Δx=0,1 de x=0,0 à x=2,3 (24 points),
    plus le point final x=3π/4≈2,3562 (y=−3 exact) — 25 points, chaque
    y(x) = 3cos(4x)+2sin(4x) calculé directement (table en radians par
    pas de 0,4 sur l'argument 4x, valeurs trigonométriques standard).

    Rôle des couleurs :
      courbe y(x)                              : --figure-ink (structure
                                                   donnée, cf. tangente-
                                                   derivee.svg où la
                                                   courbe "donnée" est
                                                   aussi en ink)
      équilibre y=0 (= l'axe des x)             : --figure-ink-soft
      départ y(0)=A=3 (step-1)                  : --figure-ink
      lecture (période T, ligne-plafond R,
      repère d'amplitude, formules)             : --figure-accent — LE
                                                   sujet de la figure
                                                   (§2.5 : la lecture)

    MISE EN ÉTAPES (LESSON-EXPERIENCE-SPEC §2.5, graphe → toujours staged,
    axes → données → lecture) :
      step-1 : le repère, l'équilibre y=0, et y(0)=A=3 marqué sur l'axe —
               avant qu'aucune courbe n'apparaisse.
      step-2 : la courbe se trace, sur un peu plus d'une période et demie.
      step-3 : la lecture — la période T entre deux crêtes, la ligne-
               plafond à y=R marquant l'amplitude au-dessus de l'équilibre,
               et les deux formules (T = 2π/ω, R = √(A²+B²)).
  -->

  <g id="step-1">
    <!-- Titre -->
    <text x="320" y="20" text-anchor="middle" font-size="12" font-weight="600"
          letter-spacing="0.01em" fill="var(--figure-ink)">La solution de l'oscillateur : y = 3 cos(4x) + 2 sin(4x)</text>

    <!-- Fond du panneau -->
    <rect x="40" y="32" width="560" height="380" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="90" y1="235" x2="590" y2="235" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="590,235 578,230.5 578,239.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="400" x2="90" y2="45" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,45 85.5,56 94.5,56" fill="var(--figure-ink-soft)"/>
    <text x="598" y="239" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">x</text>
    <text x="78" y="50" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">y</text>
    <text x="82" y="247" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <!-- Position d'équilibre, y = 0 (l'axe lui-même) -->
    <text x="150" y="228" text-anchor="middle" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">y = 0 (équilibre)</text>

    <!-- Départ : y(0) = A = 3, marqué sur l'axe avant toute courbe -->
    <line x1="84" y1="130" x2="96" y2="130" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <text x="78" y="134" text-anchor="end" font-size="11" font-weight="600" fill="var(--figure-ink)">3</text>
    <!-- REMONTÉE AU-DESSUS DE LA CRÊTE (2026-09-04) : posée à y=124, à
         hauteur du départ de la courbe, elle était traversée DEUX FOIS — par
         la montée puis par la descente de la première arche (29 % rayés).
         Au-dessus de la crête et à droite du repère pointillé (x=119,4), la
         bande jusqu'à la mesure de période est libre. -->
    <text x="128" y="99" font-size="10.5" fill="var(--figure-ink)">y(0) = A = 3</text>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!--
      y(x) = 3cos(4x) + 2sin(4x), x = 0,0 .. 2,3 (pas 0,1) puis x = 3π/4.
      x_px = 90 + 200x ; y_px = 235 - 35y.
    -->
    <path d="M90.0,130.0 L110.0,111.0 L130.0,111.6 L150.0,131.7 L170.0,168.1 L190.0,215.0 L210.0,265.1 L230.0,310.5 L250.0,343.9 L270.0,360.1 L290.0,356.6 L310.0,333.9 L330.0,295.5 L350.0,247.7 L370.0,197.8 L390.0,153.7 L410.0,122.6 L430.0,109.1 L450.0,115.7 L470.0,140.9 L490.0,180.9 L510.0,229.6 L530.0,279.1 L550.0,321.7 L561.2,340.0"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- Période T : bracket entre les deux crêtes (x=119,4 et x=433,6) -->
    <line x1="119.4" y1="108.8" x2="119.4" y2="70" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="433.6" y1="108.8" x2="433.6" y2="70" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="119.4" y1="64" x2="433.6" y2="64" stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="119.4" y1="59" x2="119.4" y2="69" stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="433.6" y1="59" x2="433.6" y2="69" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="276.5" y="55" text-anchor="middle" font-size="13" font-style="italic" font-weight="600" fill="var(--figure-accent)">T</text>

    <!-- Ligne-plafond à y = R : les deux crêtes touchent la même hauteur -->
    <line x1="90" y1="108.8" x2="590" y2="108.8" stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>

    <!-- Repère d'amplitude : bracket vertical, équilibre → plafond, dans
         l'espace libre après la fin de la courbe (x=575, courbe finit à
         561,2) -->
    <line x1="570" y1="235" x2="580" y2="235" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="570" y1="108.8" x2="580" y2="108.8" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="575" y1="235" x2="575" y2="108.8" stroke="var(--figure-accent)" stroke-width="1.6"/>

    <!-- Formules de lecture, groupées dans l'espace libre en haut à droite -->
    <text x="500" y="64" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-accent)">T = 2π/ω = π/2</text>
    <text x="500" y="78" text-anchor="middle" font-size="9" fill="var(--figure-accent)">ω fixe la période</text>
    <text x="500" y="100" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-accent)">R = √13 ≈ 3,6</text>
  </g><!-- /step-3 -->

</svg>
