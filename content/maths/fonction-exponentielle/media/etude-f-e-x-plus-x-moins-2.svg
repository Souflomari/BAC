<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="Courbe de f(x) = e puissance x plus x moins 2, strictement croissante sur R, avec f(0) = -1 sous l'axe des abscisses et f(1) = e-1 environ 1,718 au-dessus. La courbe traverse l'axe une seule fois, en un point alpha strictement compris entre 0 et 1 : f est négative avant alpha, positive après.">
  <title>Étude de f(x) = eˣ + x − 2 : existence et unicité de la solution α</title>
  <!--
    etude-f-e-x-plus-x-moins-2.svg — STAGED (docs/design/LESSON-EXPERIENCE-SPEC.md §2).
    R8 — exercice travaillé (pas une leçon dupliquée : f(x)=eˣ+x-2 est une
    fonction DIFFÉRENTE de exp seule, R5/R4). Illustre le raisonnement TVI
    existence-et-unicité + encadrement déjà rédigé dans le texte du R8.
    Gabarit directement inspiré de continuite-tvi.svg (même dispositif
    pédagogique : axes -> courbe+bornes -> lecture du point garanti par le
    TVI), adapté aux 4 étapes du callout (axes / courbe / bornes / lecture,
    séparées explicitement plutôt que fusionnées courbe+bornes).

    Repère (calculé, pas deviné) :
      px_x(x) = 395 + 150·x       px_y(y) = 203 - 35·y
      -> x=0 : px_x=395            y=0 : px_y=203 (l'axe des abscisses)
      fenêtre visible : x ∈ [-2,1 ; 1,4], y ∈ [-4,2 ; 3,7]

    f(x) = eˣ + x - 2 — valeurs EXACTES (pas devinées), pas de 0,3 en x,
    plus x=1 inséré explicitement (c'est le point f(1) du texte) :
      f(-2.1)=e^-2.1-4.1=0,122456-4,1=-3,977544
      f(-1.8)=e^-1.8-3.8=0,165299-3,8=-3,634701
      f(-1.5)=e^-1.5-3.5=0,223130-3,5=-3,276870
      f(-1.2)=e^-1.2-3.2=0,301194-3,2=-2,898806
      f(-0.9)=e^-0.9-2.9=0,406570-2,9=-2,493430
      f(-0.6)=e^-0.6-2.6=0,548812-2,6=-2,051188
      f(-0.3)=e^-0.3-2.3=0,740818-2,3=-1,559182
      f(0.0)=e^0-2=1-2=-1                          (= f(0) du texte, exact)
      f(0.3)=e^0.3-1.7=1,349859-1,7=-0,350141
      f(0.6)=e^0.6-1.4=1,822119-1,4=0,422119
      f(0.9)=e^0.9-1.1=2,459603-1,1=1,359603
      f(1.0)=e^1-1=2,718282-1=1,718282             (= f(1) = e-1 ≈ 1,718 du texte)
      f(1.2)=e^1.2-0.8=3,320117-0,8=2,520117
      f(1.4)=e^1.4-0.6=4,055200-0,6=3,455200

    Racine α (Newton, x_{n+1}=x_n-f(x_n)/f'(x_n), f'(x)=eˣ+1, départ
      x0=0,44) : converge vers α≈0,442857 — AUCUNE valeur numérique de α
      n'apparaît dans le texte du R8 (seulement 0<α<1) : la figure ne
      montre donc que l'étiquette "α", pas de décimale, pour rester fidèle
      au texte. px_x(α)=395+150×0,442857=461,43 ; px_y=203 (α est racine,
      f(α)=0, donc exactement sur l'axe des abscisses).

    Rôle des couleurs :
      la courbe de f (le sujet général)                : --figure-ink
      les bornes (0,-1) et (1,e-1) (données de l'énoncé) : --figure-ink,
        guides pointillés --figure-ink-soft (même convention que
        continuite-tvi.svg : a, b, f(a), f(b) neutres)
      α, le changement de signe (LA lecture du théorème)  : --figure-accent

    Mise en étapes (ordre du callout R8, 4 étapes, axes comme étape à part
    entière) :
      step-1 : les axes.
      step-2 : la courbe de f, avec sa formule.
      step-3 : les deux bornes (0,-1) et (1,e-1), avec leurs guides et
               graduations.
      step-4 : la lecture — α, le changement de signe.

    Les captions sont portées par etude-f-e-x-plus-x-moins-2.stages.json —
    aucun texte de légende baké ici (même convention que continuite-tvi.svg).
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Étude de <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) = <tspan
    font-style="italic">e</tspan><tspan dy="-4" font-size="8.5" font-style="italic">x</tspan><tspan
    dy="4"> + </tspan><tspan font-style="italic">x</tspan><tspan> − 2</tspan>
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="32" width="600" height="340" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="50" y1="203" x2="605" y2="203"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="617,203 605,198.5 605,207.5" fill="var(--figure-ink-soft)"/>
    <text x="623" y="207" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">x</text>

    <line x1="395" y1="355" x2="395" y2="48"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="395,36 390.5,48 399.5,48" fill="var(--figure-ink-soft)"/>
    <text x="403" y="44" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">y</text>

    <text x="386" y="216" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la courbe de f, avec sa formule
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <rect x="30" y="40" width="205" height="30" rx="5"
          fill="var(--figure-ink)" fill-opacity="0.08"/>
    <text x="132" y="60" text-anchor="middle" font-size="12.5" fill="var(--figure-ink)">
      <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) = <tspan
      font-style="italic">e</tspan><tspan dy="-4" font-size="8" font-style="italic">x</tspan><tspan
      dy="4"> + </tspan><tspan font-style="italic">x</tspan><tspan> − 2</tspan>
    </text>

    <path d="M80.0,342.21 L125.0,330.21 L170.0,317.69 L215.0,304.46 L260.0,290.27
             L305.0,274.79 L350.0,257.57 L395.0,238.00 L440.0,215.25 L485.0,188.23
             L530.0,155.41 L545.0,142.86 L575.0,114.80 L605.0,82.07"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — les deux bornes (0,-1) et (1,e-1), guides et graduations
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Point (0, -1) : sur l'axe des ordonnées, sous l'axe des abscisses -->
    <line x1="395" y1="238.00" x2="395" y2="203"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="395" cy="238.00" r="3.2" fill="var(--figure-ink)"/>
    <line x1="387" y1="238.00" x2="403" y2="238.00" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="379" y="241" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">−1</text>
    <text x="405" y="255" font-size="10.5" fill="var(--figure-ink)">(0, −1)</text>

    <!-- Point (1, e-1) : au-dessus de l'axe des abscisses -->
    <line x1="545" y1="142.86" x2="545" y2="203"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="545" y1="142.86" x2="395" y2="142.86"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="545" cy="142.86" r="3.2" fill="var(--figure-ink)"/>

    <line x1="541" y1="199" x2="541" y2="207" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="545" y="220" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">1</text>

    <line x1="387" y1="142.86" x2="403" y2="142.86" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="379" y="146" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">
      <tspan font-style="italic">e</tspan> − 1
    </text>

    <text x="553" y="135" font-size="10.5" fill="var(--figure-ink)">(1, <tspan
      font-style="italic">e</tspan> − 1)</text>
    <text x="553" y="148" font-size="9" fill="var(--figure-ink-soft)">&#8776; 1,718</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — la lecture : α, le changement de signe
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <circle cx="461.43" cy="203" r="4" fill="var(--figure-accent)"/>
    <line x1="461.43" y1="199" x2="461.43" y2="207" stroke="var(--figure-accent)" stroke-width="1.8"/>
    <text x="461.43" y="221" text-anchor="middle" font-size="12" font-style="italic"
          fill="var(--figure-accent)">&#945;</text>

    <text x="270" y="245" text-anchor="middle" font-size="11" fill="var(--figure-accent)">
      <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) &lt; 0
    </text>
    <text x="550" y="245" text-anchor="middle" font-size="11" fill="var(--figure-accent)">
      <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) &gt; 0
    </text>

    <rect x="430" y="78" width="175" height="38" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="517" y="94" text-anchor="middle" font-size="12" fill="var(--figure-accent)">
      <tspan font-style="italic">f</tspan>(&#945;) = 0
    </text>
    <text x="517" y="109" text-anchor="middle" font-size="11" fill="var(--figure-accent)">
      avec 0 &lt; &#945; &lt; 1
    </text>
  </g><!-- /step-4 -->

</svg>
