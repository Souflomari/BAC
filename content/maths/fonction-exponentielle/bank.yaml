          $f(2+\ln4)$ : $e^{x-2}=4$, et $4-4=0$ annule le second terme entièrement. $f(2+\ln4) = -(2+\ln4)+\frac52-\frac12\times4\times0 = \frac12-\ln4$. Comme $\ln4\approx1{,}4>\frac12$, $\frac12-\ln4<0$.

          $f(2+\ln3)>0>f(2+\ln4)$, et $f$ est strictement décroissante entre ces deux points : par le même corollaire du théorème des valeurs intermédiaires, il existe un unique $\alpha \in\,]2+\ln3,\,2+\ln4[$ tel que $f(\alpha)=0$ — et c'est nécessairement le même $\alpha$ que celui trouvé sur $\mathbb{R}$ tout entier, puisque la solution y est unique.
