            note: "Changement de variable t = 1 - x, avec les bornes transformees."
          - math: '\int_{1/2}^{1} f(x)\,dx = \int_0^{1/2} f(1-t)\,dt'
            note: "L'inversion des bornes (de 1/2 a 0 puis de 0 a 1/2) compense le signe moins du dx."
          - math: 'f(1-t)=f(t) \quad (\text{I-1a}) \ \Rightarrow\ \int_{1/2}^{1} f(x)\,dx = \int_0^{1/2} f(t)\,dt = \int_0^{1/2} f(x)\,dx'
            note: "La symetrie de la question I-1a transforme f(1-t) en f(t) : les deux integrales coincident."
