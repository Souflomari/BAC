    intro: |-
      **Problème (examen national, session normale 2022).**

      On considère la fonction numérique $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = x\left(e^{\frac{x}{2}} - 1\right)^2$$

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i},\vec{j})$ *(unité : 1 cm)*.

      Fil conducteur : ce problème enchaîne toute la boîte à outils du chapitre — limites et croissances comparées, position par rapport à une asymptote, dérivée d'un produit contenant $e^{u}$, tableau de variations, concavité lue à travers une fonction auxiliaire $g$, fonction réciproque, puis une suite $u_{n+1}=f(u_n)$. À chaque étape, garde en tête que $e^{\frac{x}{2}}>0$ ne change jamais de signe : c'est ce facteur toujours positif qui pilote tous les signes de l'étude.
    questions:
      - id: q1
        part: "Partie A — Limites et asymptote"
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} f(x)$ et $\displaystyle\lim_{x \to -\infty} f(x)$.
        reasoning: |-
          On regarde chaque morceau. En $+\infty$ : $e^{\frac{x}{2}} \to +\infty$ (R4), donc $\left(e^{\frac{x}{2}}-1\right)^2 \to +\infty$, et le facteur $x \to +\infty$ : le produit tend vers $+\infty$, sans indétermination (deux facteurs qui explosent vers $+\infty$).

          En $-\infty$ : $e^{\frac{x}{2}} \to 0$ (limite de référence, R4), donc $\left(e^{\frac{x}{2}}-1\right)^2 \to (0-1)^2 = 1$ — un facteur fini. Le facteur $x \to -\infty$ l'emporte : le produit tend vers $-\infty$. Ici encore aucune indétermination : un facteur fini non nul multiplié par une quantité qui diverge suit cette dernière.
        steps:
          - math: '\lim_{x \to +\infty} e^{\frac{x}{2}} = +\infty \ \Rightarrow\ \lim_{x \to +\infty}\left(e^{\frac{x}{2}}-1\right)^2 = +\infty'
            note: "En plus l'infini, e puissance x sur 2 tend vers plus l'infini donc son carré diminué de 1 tend vers plus l'infini."
          - math: '\lim_{x \to +\infty} f(x) = \lim_{x \to +\infty} x\left(e^{\frac{x}{2}}-1\right)^2 = +\infty'
            note: "Produit de deux facteurs tendant vers plus l'infini."
          - math: '\lim_{x \to -\infty} e^{\frac{x}{2}} = 0 \ \Rightarrow\ \left(e^{\frac{x}{2}}-1\right)^2 \to (0-1)^2 = 1'
            note: "En moins l'infini, e puissance x sur 2 tend vers 0 (limite de référence R4) : le carré tend vers 1, valeur finie."
          - math: '\lim_{x \to -\infty} f(x) = \lim_{x \to -\infty} x \times 1 = -\infty'
            note: "x tend vers moins l'infini multiplié par un facteur qui tend vers 1 : pas d'indétermination, la limite est moins l'infini."
      - id: q2
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} \dfrac{f(x)}{x}$ et interpréter géométriquement le résultat.
        reasoning: |-
          Au voisinage de $+\infty$, $x\neq 0$ : on simplifie $\dfrac{f(x)}{x} = \left(e^{\frac{x}{2}}-1\right)^2$, qui tend vers $+\infty$ (question 1).

          Interprétation : quand $\dfrac{f(x)}{x} \to +\infty$, la courbe monte plus vite que n'importe quelle droite passant par l'origine — $(C)$ admet une branche parabolique de direction l'axe des ordonnées $(Oy)$ au voisinage de $+\infty$.
        steps:
          - math: '\frac{f(x)}{x} = \frac{x\left(e^{\frac{x}{2}}-1\right)^2}{x} = \left(e^{\frac{x}{2}}-1\right)^2'
            note: "Simplification par x (non nul au voisinage de plus l'infini)."
          - math: '\lim_{x \to +\infty} \frac{f(x)}{x} = +\infty'
            note: "f(x)/x tend vers plus l'infini : (C) admet une branche parabolique de direction l'axe (Oy) au voisinage de plus l'infini."
      - id: q3a
        stem: |-
          **(0,5 pt)** Montrer que la droite $(\Delta)$ d'équation $y = x$ est asymptote à la courbe $(C)$ au voisinage de $-\infty$.
        reasoning: |-
          Une droite $y=x$ est asymptote en $-\infty$ si l'écart $f(x)-x$ tend vers $0$. On factorise cet écart : $f(x)-x = x\left[\left(e^{\frac{x}{2}}-1\right)^2 - 1\right] = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right)$.

          Or $x\,e^{\frac{x}{2}} \to 0$ en $-\infty$ par croissances comparées (en posant $X=\frac{x}{2}\to-\infty$, $x\,e^{\frac{x}{2}} = 2X\,e^{X} \to 0$), tandis que $e^{\frac{x}{2}}-2 \to -2$. Le produit tend donc vers $0\times(-2)=0$ : $(\Delta):y=x$ est asymptote à $(C)$ en $-\infty$.
        steps:
          - math: 'f(x) - x = x\left[\left(e^{\frac{x}{2}}-1\right)^2 - 1\right] = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right)'
            note: "On factorise l'écart entre f(x) et x."
          - math: '\lim_{x \to -\infty} x\,e^{\frac{x}{2}} = 0 \qquad (X=\tfrac{x}{2},\ \text{croissances comparées})'
            note: "x fois e puissance x sur 2 vaut 2X e puissance X avec X = x/2 tendant vers moins l'infini ; croissances comparées : X e^X tend vers 0."
          - math: 'f(x) - x = \underbrace{x\,e^{\frac{x}{2}}}_{\to\, 0}\left(e^{\frac{x}{2}}-2\right) \xrightarrow[x \to -\infty]{} 0 \times (-2) = 0'
            note: "L'écart f(x)-x tend vers 0 : la droite (Delta) d'équation y=x est asymptote à (C) en moins l'infini."
      - id: q3b
        stem: |-
          **(0,75 pt)** Étudier le signe de $\big(f(x) - x\big)$ pour tout $x$ de $\mathbb{R}$ et en déduire la position relative de la courbe $(C)$ et de la droite $(\Delta)$.
        reasoning: |-
          On repart de la forme factorisée $f(x)-x = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right)$. Le facteur $e^{\frac{x}{2}}$ est toujours strictement positif (R1) : il ne compte pas dans le signe. Reste le signe de $x\left(e^{\frac{x}{2}}-2\right)$.

          On localise le zéro de $e^{\frac{x}{2}}-2$ : $e^{\frac{x}{2}}=2 \iff \frac{x}{2}=\ln 2 \iff x = 2\ln 2 = \ln 4$. Ainsi $e^{\frac{x}{2}}-2>0 \iff x>\ln 4$. En croisant avec le signe de $x$ (zéro en $0$) :

          — sur $]-\infty,0[$ : $x<0$ et $e^{\frac{x}{2}}-2<0$, produit positif ;
          — sur $]0,\ln 4[$ : $x>0$ et $e^{\frac{x}{2}}-2<0$, produit négatif ;
          — sur $]\ln 4,+\infty[$ : les deux facteurs positifs, produit positif.

          Donc $(C)$ est au-dessus de $(\Delta)$ sur $]-\infty,0[$ et $]\ln 4,+\infty[$, en dessous sur $]0,\ln 4[$ ; les deux se coupent aux points $(0,0)$ et $(\ln 4,\ln 4)$ (car $f(0)=0$ et $f(\ln 4)=\ln 4$).
        steps:
          - math: 'f(x) - x = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right), \qquad e^{\frac{x}{2}} > 0'
            note: "Le facteur e^{x/2} est toujours positif : le signe ne dépend que de x et de (e^{x/2}-2)."
          - math: 'e^{\frac{x}{2}} - 2 = 0 \iff \tfrac{x}{2} = \ln 2 \iff x = 2\ln 2 = \ln 4'
            note: "e^{x/2}-2 est positif si et seulement si x est supérieur à ln4 (passage au ln, exp strictement croissante)."
          - math: 'f(x)-x > 0 \text{ sur } ]-\infty,0[\,\cup\,]\ln 4,+\infty[\ ;\quad f(x)-x < 0 \text{ sur } ]0,\ln 4[\ ;\quad f(0)=0,\ f(\ln 4)=\ln 4'
            note: "(C) au-dessus de (Delta) sur les deux extrémités, en dessous sur l'intervalle intermédiaire ; contact en (0,0) et (ln4, ln4)."
      - id: q4a
        part: "Partie B — Dérivée et variations"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x$ de $\mathbb{R}$ : $f'(x) = \left(e^{\frac{x}{2}} - 1\right)^2 + x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}} - 1\right)$.
        reasoning: |-
          $f$ est un produit $f=u\,v$ avec $u(x)=x$ et $v(x)=\left(e^{\frac{x}{2}}-1\right)^2$. On dérive $v$ comme une composée : $v'(x) = 2\left(e^{\frac{x}{2}}-1\right)\cdot\frac{1}{2}e^{\frac{x}{2}} = e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right)$ (la dérivée de l'intérieur $e^{\frac{x}{2}}$ vaut $\frac{1}{2}e^{\frac{x}{2}}$, sans condition de signe puisque $e^{u}$ est dérivable partout, R3). La règle du produit $(uv)'=u'v+uv'$ donne alors directement l'expression demandée.
        steps:
          - math: 'u(x) = x,\quad v(x) = \left(e^{\frac{x}{2}}-1\right)^2,\qquad v''(x) = 2\left(e^{\frac{x}{2}}-1\right)\cdot\tfrac{1}{2}e^{\frac{x}{2}} = e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right)'
            note: "Dérivée de la composée (e^{x/2}-1) au carré : 2(e^{x/2}-1) fois la dérivée de l'intérieur, un demi e^{x/2}."
          - math: 'f''(x) = u''v + uv'' = \left(e^{\frac{x}{2}}-1\right)^2 + x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right)'
            note: "Règle du produit (uv)' = u'v + uv'."
      - id: q4b
        stem: |-
          **(0,5 pt)** Vérifier que $x\left(e^{\frac{x}{2}} - 1\right) \ge 0$ pour tout $x$ de $\mathbb{R}$, puis en déduire le signe de la dérivée $f'$ sur $\mathbb{R}$.
        reasoning: |-
          Le facteur $e^{\frac{x}{2}}-1$ a le signe de $x$ : $e^{\frac{x}{2}}-1>0 \iff \frac{x}{2}>0 \iff x>0$ (exp strictement croissante, $e^0=1$). Donc $x$ et $e^{\frac{x}{2}}-1$ ont toujours le même signe, et leur produit $x\left(e^{\frac{x}{2}}-1\right)$ est $\ge 0$, nul seulement en $x=0$.

          On relit alors $f'(x) = \left(e^{\frac{x}{2}}-1\right)^2 + e^{\frac{x}{2}}\cdot x\left(e^{\frac{x}{2}}-1\right)$ : c'est une somme de deux termes positifs ou nuls — un carré, et $e^{\frac{x}{2}}>0$ multiplié par la quantité $\ge 0$ qu'on vient d'établir. Donc $f'(x)\ge 0$, nul uniquement en $x=0$ : $f$ est strictement croissante sur $\mathbb{R}$.
        steps:
          - math: 'e^{\frac{x}{2}} - 1 \text{ a le signe de } x \ \Rightarrow\ x\left(e^{\frac{x}{2}}-1\right) \ge 0'
            note: "x et e^{x/2}-1 changent de signe en même temps, en 0 : leur produit est positif ou nul."
          - math: 'f''(x) = \left(e^{\frac{x}{2}}-1\right)^2 + e^{\frac{x}{2}}\underbrace{\,x\left(e^{\frac{x}{2}}-1\right)\,}_{\ge\, 0} \ge 0'
            note: "Somme d'un carré et de e^{x/2} positif fois une quantité positive ou nulle : f prime est positive ou nulle, nulle seulement en 0."
      - id: q4c
        stem: |-
          **(0,25 pt)** Dresser le tableau de variations de la fonction $f$ sur $\mathbb{R}$.
        reasoning: |-
          Tout est réuni : $f'(x)\ge 0$ avec égalité seulement en $x=0$ (question précédente), donc $f$ est strictement croissante sur $\mathbb{R}$ tout entier — une seule flèche montante. On complète avec les limites de la question 1 : $\displaystyle\lim_{x\to-\infty}f(x)=-\infty$ et $\displaystyle\lim_{x\to+\infty}f(x)=+\infty$, et le passage remarquable $f(0)=0$. Le tableau tient en une ligne, de $-\infty$ à $+\infty$, traversant $0$ en $x=0$.
      - id: q5a
        part: "Partie C — Concavité (lecture d'une courbe)"
        stem: |-
          **(0,5 pt)** Montrer que $f''(x) = \dfrac{1}{2}e^{\frac{x}{2}}\,g(x)$, où $g(x) = (2x + 4)e^{\frac{x}{2}} - x - 4$, pour tout $x$ de $\mathbb{R}$.
        reasoning: |-
          Pour éviter d'empiler les apostrophes dans les champs de calcul, on note ici $f^{(2)}$ la dérivée seconde de $f$ — même objet que $f''$ dans l'énoncé.

          On développe d'abord $f'$ pour en faciliter la dérivation : $\left(e^{\frac{x}{2}}-1\right)^2 = e^{x} - 2e^{\frac{x}{2}} + 1$ et $x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right) = x\,e^{x} - x\,e^{\frac{x}{2}}$, d'où $f'(x) = (1+x)e^{x} - (2+x)e^{\frac{x}{2}} + 1$.

          On dérive terme à terme : $\big((1+x)e^{x}\big)' = (2+x)e^{x}$ et $\big(-(2+x)e^{\frac{x}{2}}\big)' = -\frac{x+4}{2}e^{\frac{x}{2}}$. Il reste à factoriser $\frac{1}{2}e^{\frac{x}{2}}$ : $(2+x)e^{x} = \frac{1}{2}e^{\frac{x}{2}}(2x+4)e^{\frac{x}{2}}$ et $-\frac{x+4}{2}e^{\frac{x}{2}} = \frac{1}{2}e^{\frac{x}{2}}(-x-4)$, ce qui reconstitue exactement $\frac{1}{2}e^{\frac{x}{2}}g(x)$.
        steps:
          - math: 'f''(x) = \left(e^{\frac{x}{2}}-1\right)^2 + x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right) = (1+x)e^{x} - (2+x)e^{\frac{x}{2}} + 1'
            note: "On développe f prime, établi à la question 4-a."
          - math: 'f^{(2)}(x) = (2+x)e^{x} - \frac{x+4}{2}e^{\frac{x}{2}}'
            note: "Dérivée terme à terme : ((1+x)e^x)' = (2+x)e^x ; (-(2+x)e^{x/2})' = -((x+4)/2) e^{x/2}."
          - math: 'f^{(2)}(x) = \frac{1}{2}e^{\frac{x}{2}}\Big[(2x+4)e^{\frac{x}{2}} - x - 4\Big] = \frac{1}{2}e^{\frac{x}{2}}\,g(x)'
            note: "On factorise un demi e^{x/2} ; le crochet est exactement g(x)."
      - id: q5b
        stem: |-
          **(0,5 pt)** La courbe $(C_g)$ ci-dessous représente la fonction $g$. En la lisant, déterminer le signe de $g(x)$ sur $\mathbb{R}$. *(Remarque : $g(\alpha) = 0$.)*

          **Description de la courbe $(C_g)$ fournie** *(transcrite fidèlement du scan)* : la courbe de $g$ est tracée sur la fenêtre $x \in [-5\,;\,0{,}5]$, $y \in [-2\,;\,4]$. Elle s'annule en **deux** points : en $x = \alpha \approx -4{,}5$ (marqué sur l'axe des abscisses) et en $x = 0$ (l'origine). Elle est **positive sur $]-\infty,\alpha[$** (petite portion visible au bord gauche, d'ordonnée $\approx +0{,}5$ en $x=-5$), **négative sur $]\alpha,0[$** avec un minimum d'ordonnée $\approx -2$ au voisinage de $x=-2$, puis de nouveau **positive sur $]0,+\infty[$** en croissant fortement (elle atteint $\approx +4$ au bord droit du cadre).
        reasoning: |-
          On lit les deux changements de signe directement sur $(C_g)$, en s'appuyant sur les deux zéros $x=\alpha$ et $x=0$ :

          $$g(x) > 0 \text{ sur } ]-\infty,\alpha[\ ;\quad g(\alpha)=0\ ;\quad g(x) < 0 \text{ sur } ]\alpha,0[\ ;\quad g(0)=0\ ;\quad g(x) > 0 \text{ sur } ]0,+\infty[.$$

          Un contrôle algébrique confirme le zéro en $0$ : $g(0) = (0+4)e^{0} - 0 - 4 = 4 - 4 = 0$. Ces deux changements de signe, en $\alpha$ et en $0$, sont exactement les deux abscisses de points d'inflexion attendues à la question suivante — c'est ce qui rendait l'ancienne description « un seul changement de signe » incohérente, et pourquoi la figure a été corrigée (voir `sourcing.note` de cette entrée).
      - id: q5c
        stem: |-
          **(0,5 pt)** Étudier la concavité de la courbe $(C)$ et déterminer les abscisses des deux points d'inflexion.
        reasoning: |-
          On a $f''(x) = \frac{1}{2}e^{\frac{x}{2}}g(x)$, et $\frac{1}{2}e^{\frac{x}{2}}>0$ toujours : le signe de $f''$ est exactement celui de $g$ (question 5b). Donc $f''>0$ (courbe convexe) sur $]-\infty,\alpha[$ et sur $]0,+\infty[$, et $f''<0$ (courbe concave) sur $]\alpha,0[$.

          $f''$ change de signe en $x=\alpha$ et en $x=0$ : la concavité change en ces deux points, qui sont donc les deux points d'inflexion, d'abscisses $\alpha$ et $0$.
        steps:
          - math: '\tfrac{1}{2}e^{\frac{x}{2}} > 0 \ \Rightarrow\ \text{signe de } f^{(2)}(x) = \text{signe de } g(x)'
            note: "Le facteur un demi e^{x/2} est toujours positif : f seconde a le signe de g (question 5-b)."
          - math: 'f^{(2)} > 0 \text{ sur } ]-\infty,\alpha[\,\cup\,]0,+\infty[ \ (\text{convexe})\ ;\quad f^{(2)} < 0 \text{ sur } ]\alpha,0[ \ (\text{concave})'
            note: "(C) est convexe là où f seconde est positive, concave là où elle est négative."
          - math: 'f^{(2)} \text{ change de signe en } x=\alpha \text{ et en } x=0'
            note: "f seconde change de signe en alpha et en 0 : ce sont les deux points d'inflexion, d'abscisses alpha et 0."
      - id: q6
        stem: |-
          **(1 pt)** Construire la courbe $(C)$ dans le repère $(O,\vec{i},\vec{j})$. *(On prend $\ln 4 \approx 1{,}4$, $\alpha \approx -4{,}5$ et $f(\alpha) \approx -3{,}5$.)*
        reasoning: |-
          On ne trace pas au hasard : on reporte tous les éléments établis.

          — **Asymptote et allure en $-\infty$** : la droite $(\Delta):y=x$ est asymptote en $-\infty$ (question 3a), et $(C)$ y est au-dessus de $(\Delta)$ (question 3b) ; la courbe descend le long de $(\Delta)$ vers $-\infty$.
          — **Croisements avec $(\Delta)$** : $(C)$ coupe $(\Delta)$ en $(0,0)$ et $(\ln 4,\ln 4)\approx(1{,}4\,;\,1{,}4)$, en passant en dessous de $(\Delta)$ sur $]0,\ln 4[$ puis au-dessus au-delà (question 3b).
          — **Variations** : $f$ est strictement croissante partout (question 4c), sans extremum, avec $f(0)=0$.
          — **Branche en $+\infty$** : branche parabolique de direction $(Oy)$ (question 2) — la courbe s'élève de plus en plus vite.
          — **Concavité** : convexe sur $]-\infty,\alpha[$, concave sur $]\alpha,0[$, convexe sur $]0,+\infty[$ (question 5c), avec deux points d'inflexion, en $x=\alpha\approx-4{,}5$ (où $f(\alpha)\approx-3{,}5$) et en $x=0$.

          On place ces repères, puis on relie par une courbe croissante respectant la concavité annoncée.
      - id: q7a
        part: "Partie D — Fonction réciproque et suite"
        stem: |-
          **(0,5 pt)** Montrer que la fonction $f$ admet une fonction réciproque $f^{-1}$ définie sur $\mathbb{R}$.
        reasoning: |-
          $f$ est continue (car dérivable, question 4a) et strictement croissante sur $\mathbb{R}$ (question 4b). Une fonction continue et strictement monotone sur un intervalle réalise une bijection de cet intervalle sur son image. Ici l'image est $f(\mathbb{R}) = \left]\displaystyle\lim_{x\to-\infty}f,\ \displaystyle\lim_{x\to+\infty}f\right[ = \,]-\infty,+\infty[ = \mathbb{R}$ (question 1). Donc $f$ réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$, et admet une fonction réciproque $f^{-1}$ définie sur $\mathbb{R}$.
      - id: q7b
        stem: |-
          **(0,25 pt)** Calculer $\left(f^{-1}\right)'(\ln 4)$.
        reasoning: |-
          On a montré (question 3b) que $f(\ln 4)=\ln 4$, donc $f^{-1}(\ln 4)=\ln 4$. La dérivée de la réciproque s'obtient par $\left(f^{-1}\right)'(y) = \dfrac{1}{f'\!\left(f^{-1}(y)\right)}$, ici $\left(f^{-1}\right)'(\ln 4) = \dfrac{1}{f'(\ln 4)}$.

          On calcule $f'(\ln 4)$ en remarquant $e^{\frac{\ln 4}{2}} = e^{\ln 2} = 2$ : $f'(\ln 4) = (2-1)^2 + \ln 4\cdot 2\,(2-1) = 1 + 2\ln 4$. D'où $\left(f^{-1}\right)'(\ln 4) = \dfrac{1}{1+2\ln 4}$.
        steps:
          - math: 'f(\ln 4) = \ln 4 \ \Rightarrow\ f^{-1}(\ln 4) = \ln 4\ ;\qquad e^{\frac{\ln 4}{2}} = e^{\ln 2} = 2'
            note: "f(ln4)=ln4 (question 3-b) ; e^{(ln4)/2} = e^{ln2} = 2."
          - math: 'f''(\ln 4) = (2-1)^2 + \ln 4\cdot 2\,(2-1) = 1 + 2\ln 4'
            note: "On remplace e^{(ln4)/2}=2 dans f'(x)=(e^{x/2}-1)^2 + x e^{x/2}(e^{x/2}-1)."
          - math: '\left(f^{-1}\right)''(\ln 4) = \frac{1}{f''(\ln 4)} = \frac{1}{1 + 2\ln 4}'
            note: "Dérivée de la réciproque : (f inverse) prime de ln4 vaut 1 sur f prime de ln4."
      - id: q8a
        stem: |-
          **(0,5 pt)** Soit $(u_n)$ la suite numérique définie par $u_0 = 1$ et $u_{n+1} = f(u_n)$ pour tout $n$ de $\mathbb{N}$. Montrer par récurrence que $0 < u_n < \ln 4$ pour tout $n$ de $\mathbb{N}$.
        reasoning: |-
          **Initialisation :** $u_0 = 1$, et $0 < 1 < \ln 4$ (car $\ln 4 \approx 1{,}39$). L'encadrement est vrai au rang $0$.

          **Hérédité :** supposons $0 < u_n < \ln 4$. Comme $f$ est strictement croissante (question 4b), elle conserve l'ordre : $f(0) < f(u_n) < f(\ln 4)$. Or $f(0)=0$ et $f(\ln 4)=\ln 4$ (question 3b), donc $0 < u_{n+1} < \ln 4$. L'encadrement se transmet, il est vrai pour tout $n$.
        steps:
          - math: '\text{Initialisation : } u_0 = 1,\quad 0 < 1 < \ln 4 \ \ (\ln 4 \approx 1{,}39)'
            note: "Le rang 0 vérifie l'encadrement."
          - math: '0 < u_n < \ln 4 \ \Rightarrow\ f(0) < f(u_n) < f(\ln 4) \ \Rightarrow\ 0 < u_{n+1} < \ln 4'
            note: "f strictement croissante (question 4-b) ; f(0)=0 et f(ln4)=ln4."
      - id: q8b
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_n)$ est décroissante.
        reasoning: |-
          On étudie le signe de $u_{n+1} - u_n = f(u_n) - u_n$. La question 3b a montré que $f(x)-x < 0$ sur $]0,\ln 4[$. Comme $0 < u_n < \ln 4$ (question 8a), on a $f(u_n) - u_n < 0$, c'est-à-dire $u_{n+1} - u_n < 0$ : la suite $(u_n)$ est décroissante.
        steps:
          - math: 'u_{n+1} - u_n = f(u_n) - u_n < 0 \qquad (\text{car } 0 < u_n < \ln 4)'
            note: "On réutilise f(x)-x < 0 sur ]0,ln4[ (question 3-b) avec x = u_n."
      - id: q8c
        stem: |-
          **(0,25 pt)** En déduire que la suite $(u_n)$ est convergente.
        reasoning: |-
          La suite $(u_n)$ est décroissante (question 8b) et minorée par $0$ (question 8a : $0 < u_n$). Par le théorème de la convergence monotone, toute suite décroissante et minorée converge : $(u_n)$ converge vers une limite finie $\ell \ge 0$.
      - id: q8d
        stem: |-
          **(0,5 pt)** Calculer la limite de la suite $(u_n)$.
        reasoning: |-
          Notons $\ell$ la limite. En passant l'encadrement $0 < u_n < \ln 4$ à la limite, $\ell \in [0,\ln 4]$. Comme $f$ est continue et $u_{n+1}=f(u_n)$, la limite vérifie $\ell = f(\ell)$, donc $f(\ell)-\ell = 0$, soit $\ell\,e^{\frac{\ell}{2}}\left(e^{\frac{\ell}{2}}-2\right)=0$ : les points fixes possibles sont $\ell = 0$ et $\ell = \ln 4$.

          La suite est décroissante et part de $u_0 = 1 < \ln 4$ : tous ses termes, et donc sa limite, sont $< \ln 4$. On écarte $\ell=\ln 4$. La limite est donc $\ell = 0$.
        steps:
          - math: '0 \le \ell \le \ln 4\ ;\quad u_{n+1}=f(u_n),\ f \text{ continue} \ \Rightarrow\ \ell = f(\ell)'
            note: "La limite est un point fixe de f, situé dans [0, ln4]."
          - math: 'f(\ell) = \ell \iff \ell\,e^{\frac{\ell}{2}}\left(e^{\frac{\ell}{2}}-2\right) = 0 \iff \ell = 0 \ \text{ ou }\ \ell = \ln 4'
            note: "f(x)-x = x e^{x/2}(e^{x/2}-2) ; ses zéros sont 0 et ln4."
          - math: '(u_n) \text{ décroissante},\ u_0 = 1 < \ln 4 \ \Rightarrow\ \ell < \ln 4 \ \Rightarrow\ \ell = 0'
            note: "La suite décroît en partant de 1, inférieur à ln4 : la limite ne peut pas être ln4, donc lim u_n = 0."

