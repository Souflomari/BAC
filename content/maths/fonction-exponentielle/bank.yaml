        AlloSchool indépendant (→ course-438/upload-84495, pages 3-4) et
        diff conforme au scan, MAIS la description de la figure $(C_g)$ de
        la question 5b était erronée dans une première lecture (un seul
        changement de signe indiqué) — le scan montre $g$ s'annulant en
        DEUX points ($\alpha\approx-4,5$ et $0$), cohérent avec les deux
        points d'inflexion demandés en 5c ; description corrigée d'après le
