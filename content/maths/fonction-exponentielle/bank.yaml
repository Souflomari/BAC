          - math: 'f \text{ croissante sur } \left]-\infty,\tfrac12\right],\ \text{decroissante sur } \left[\tfrac12,+\infty\right[ \ \Rightarrow\ \max_{\mathbb{R}} f = f\left(\tfrac12\right)'
            note: "Tableau de variations : maximum global atteint en x = un demi."
          - math: 'f\left(\dfrac12\right) = \dfrac{e^{1/2}}{e+e} = \dfrac{\sqrt e}{2e} = \dfrac{1}{2\sqrt e} \approx 0{,}3033'
            note: "On evalue f en un demi et on simplifie racine de e sur e en 1 sur racine de e."
          - math: '\dfrac{1}{2\sqrt e} < \dfrac12 \ \Rightarrow\ (\forall x\in\mathbb{R})\ ;\ 0<f(x)<\dfrac12'
