          Réécris $f(x)\,dx$ en fonction de $t$ : $f(x)=\dfrac{e^x}{e^{2x}+e}=\dfrac{t}{t^2+e}$ (on a remplacé $e^x$ par $t$ et $e^{2x}=(e^x)^2$ par $t^2$). Donc :

          $$f(x)\,dx = \dfrac{t}{t^2+e}\times\dfrac{dt}{t} = \dfrac{dt}{t^2+e}$$

          (le facteur $t$ se simplifie exactement avec le $t$ au dénominateur du $dx$ — ce n'est pas une coïncidence, c'est ce qui rend ce changement de variable utile ici). En reportant les bornes :

          $$\int_0^{1/2} f(x)\,dx = \int_1^{\sqrt e} \dfrac{dt}{t^2+e}$$
        steps:
