      - id: qI-5b
        stem: |-
          **(0,5 pt)** Montrer que : $\displaystyle\int_0^{\frac{1}{2}} f(x)\,dx = \dfrac{1}{\sqrt{e}}\left(\arctan\left(\sqrt{e}\right) - \dfrac{\pi}{4}\right)$
        reasoning: |-
          Il reste à calculer $\displaystyle\int_1^{\sqrt e}\dfrac{dt}{t^2+e}$ (I-5a) : c'est une primitive de $\dfrac{1}{t^2+e}$ qu'il faut reconnaître. Cette famille de primitives est bâtie sur la fonction ARCTANGENTE, déjà pontée dans ce dépôt pour un exercice SM voisin — content/maths/calcul-integral/bank.yaml, entrée bk-2024-r-x2, question q1-a, primitive de $\frac{1}{1+x^2}$ sur $[0,1]$ — et on réutilise ICI exactement le même fait de référence, pas un second.

          $\arctan$ est la fonction réciproque de la restriction de $\tan$ à $\left]-\frac{\pi}{2},\frac{\pi}{2}\right[$ ; par construction elle est dérivable sur $\mathbb{R}$ et

          $$\left(\arctan x\right)^{\prime} = \dfrac{1}{1+x^2}$$

          C'est une primitive de référence du programme de Sciences Mathématiques, au même titre que $\ln$ pour $\frac1x$ : elle se reconnaît, elle ne se redémontre pas en pleine épreuve.

          Ici le dénominateur est $t^2+e$, pas $1+t^2$ : il faut GÉNÉRALISER le fait de référence, pas le réciter tel quel. Écris $e=(\sqrt e)^2$ et pose $a=\sqrt e$, de sorte que $t^2+e=a^2\left(1+\left(\frac{t}{a}\right)^2\right)$. La règle de dérivation d'une fonction composée applique alors le fait de référence à $u=\frac{t}{a}$ :

          $$\dfrac{d}{dt}\left[\dfrac1a\arctan\left(\dfrac ta\right)\right] = \dfrac1a\times\dfrac{1/a}{1+(t/a)^2} = \dfrac{1}{a^2+t^2} = \dfrac{1}{t^2+e}$$

          Donc $t\mapsto\dfrac{1}{\sqrt e}\arctan\left(\dfrac{t}{\sqrt e}\right)$ est une primitive de $\dfrac1{t^2+e}$. Applique-la entre $1$ et $\sqrt e$ :

          $$\int_1^{\sqrt e}\dfrac{dt}{t^2+e} = \dfrac{1}{\sqrt e}\left[\arctan\left(\dfrac{\sqrt e}{\sqrt e}\right)-\arctan\left(\dfrac{1}{\sqrt e}\right)\right] = \dfrac{1}{\sqrt e}\left(\dfrac{\pi}{4}-\arctan\left(\dfrac{1}{\sqrt e}\right)\right)$$

          (avec $\arctan(1)=\frac\pi4$, même valeur de référence que bk-2024-r-x2). Ce n'est pas encore la forme demandée — elle porte $\arctan\left(\frac1{\sqrt e}\right)$, l'énoncé veut $\arctan(\sqrt e)$. Le pont entre les deux est une identité de complémentarité : pour $u>0$, en posant $\theta=\arctan u\in\left]0,\frac\pi2\right[$, on a $\tan\left(\frac\pi2-\theta\right)=\frac{1}{\tan\theta}=\frac1u$, et $\frac\pi2-\theta$ est bien dans $\left]-\frac\pi2,\frac\pi2\right[$, donc

          $$\arctan\left(\dfrac1u\right) = \dfrac\pi2-\arctan(u) \qquad (u>0)$$

          Applique avec $u=\sqrt e$ : $\arctan\left(\frac1{\sqrt e}\right)=\frac\pi2-\arctan(\sqrt e)$. Reporte :

          $$\int_1^{\sqrt e}\dfrac{dt}{t^2+e} = \dfrac{1}{\sqrt e}\left(\dfrac\pi4-\dfrac\pi2+\arctan(\sqrt e)\right) = \dfrac{1}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac\pi4\right)$$

          — exactement la forme demandée. Avec I-5a :

          $$\int_0^{1/2} f(x)\,dx = \dfrac{1}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac\pi4\right)$$
