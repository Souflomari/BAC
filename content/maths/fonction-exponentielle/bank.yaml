      - id: qII-1
        part: "Partie II, 1 — Une inégalité sur la dérivée"
        stem: |-
          **PARTIE II.** On considère la suite $(u_n)_{n \in \mathbb{N}}$ définie par : $u_0 \in\, \left]0\,;\dfrac{1}{2}\right[$ et $(\forall n \in \mathbb{N})\ ;\quad u_{n+1} = f(u_n)$

          **(0,5 pt)** En utilisant le résultat de la question I.2-a), montrer que :

          $$(\forall x \in \mathbb{R})\ ;\quad |f'(x)| \le f(x)$$
        reasoning: |-
          D'après I-2a, $f'(x)=f(x)\times\dfrac{1-e^{2x-1}}{1+e^{2x-1}}$. Pose $u=e^{2x-1}$ : $u>0$ pour tout réel $x$ (exponentielle toujours strictement positive, R1). Montrer $|f'(x)|\le f(x)$ revient, puisque $f(x)>0$ (I-2b), à montrer $\left|\dfrac{1-u}{1+u}\right|\le1$.

          C'est une inégalité générale sur $u>0$ : il faut vérifier les deux sens. D'un côté $1-u<1+u \iff -u<u \iff 0<2u$, vrai car $u>0$ — donc $\dfrac{1-u}{1+u}<1$. De l'autre, $-(1+u)<1-u \iff -1-u<1-u \iff -1<1$, toujours vrai — donc $-1<\dfrac{1-u}{1+u}$. Les deux bornes tiennent :

          $$-1 < \dfrac{1-u}{1+u} < 1 \ \Rightarrow\ \left|\dfrac{1-u}{1+u}\right| \le 1$$

          Donc $|f'(x)| = f(x)\left|\dfrac{1-e^{2x-1}}{1+e^{2x-1}}\right| \le f(x)$.
        steps:
          - math: 'u = e^{2x-1} > 0 \quad (\forall x\in\mathbb{R})'
            note: "u est toujours strictement positif : exponentielle."
          - math: '1-u < 1+u \quad (\text{car } u>0) \ \Rightarrow\ \dfrac{1-u}{1+u} < 1'
            note: "On compare 1-u a 1+u : la difference est 2u, positive."
          - math: '-(1+u) < 1-u \quad (\text{car } -1<1) \ \Rightarrow\ -1 < \dfrac{1-u}{1+u}'
            note: "L'autre sens de l'encadrement, toujours vrai."
          - math: '\left|\dfrac{1-u}{1+u}\right|\le1 \ \Rightarrow\ |f^{\prime}(x)| = f(x)\left|\dfrac{1-u}{1+u}\right| \le f(x)'
            note: "f(x) est strictement positive (I-2b) : on multiplie l'encadrement par f(x) sans changer de sens."
      - id: qII-2a
        part: "Partie II, 2 — Point fixe de f"
        stem: |-
          **(0,5 pt)** Montrer que : $\left(\forall x \in \left[0\,;\dfrac{1}{2}\right]\right)\ ;\quad 0 \le f'(x) < \dfrac{1}{2}$
        reasoning: |-
          Sur $\left[0,\frac12\right]$, $f$ est croissante (I-2b : $f$ croît sur $\left]-\infty,\frac12\right]$), donc $f'(x)\ge0$ sur cet intervalle — la dérivée d'une fonction croissante est positive ou nulle.

          Pour la majoration, réutilise II-1 : $|f'(x)|\le f(x)$ pour tout $x$, et $f(x)<\frac12$ pour tout $x$ (I-2b). Donc $|f'(x)|<\frac12$. Comme $f'(x)\ge0$ sur $\left[0,\frac12\right]$, $f'(x)=|f'(x)|$ ici, donc $f'(x)<\frac12$.

          $$(\forall x\in\left[0,\tfrac12\right])\ ;\quad 0\le f'(x)<\dfrac12$$
        steps:
          - math: 'f \text{ croissante sur } \left]-\infty,\tfrac12\right] \quad (\text{I-2b}) \ \Rightarrow\ (\forall x\in\left[0,\tfrac12\right])\ ;\ f^{\prime}(x)\ge0'
            note: "Une fonction croissante a une derivee positive ou nulle."
          - math: '|f^{\prime}(x)|\le f(x)<\dfrac12 \quad (\text{II-1 et I-2b})'
            note: "On combine la majoration de la question precedente avec l'encadrement de f."
          - math: 'f^{\prime}(x)\ge0 \ \Rightarrow\ f^{\prime}(x) = |f^{\prime}(x)| < \dfrac12'
            note: "Comme f prime est positive ici, sa valeur absolue ne change rien : on obtient la majoration stricte."
      - id: qII-2b
        stem: |-
          **(0,25 pt)** Montrer que la fonction $g : x \mapsto g(x) = f(x) - x$ est strictement décroissante sur $\mathbb{R}$
        reasoning: |-
          $g$ est dérivable sur $\mathbb{R}$ comme somme de $f$ (dérivable, I-2a) et de $x\mapsto -x$. $g'(x)=f'(x)-1$.

          D'après II-1, $|f'(x)|\le f(x)$ pour tout $x$ ; et $f(x)<\frac12$ pour tout $x$ (I-2b). Donc $f'(x)\le|f'(x)|\le f(x)<\frac12$, en particulier $f'(x)<\frac12$ pour TOUT réel $x$, pas seulement sur $\left[0,\frac12\right]$.

          $$g'(x) = f'(x)-1 < \dfrac12-1 = -\dfrac12 < 0$$

          $g'(x)<0$ pour tout $x\in\mathbb{R}$ : $g$ est strictement décroissante sur $\mathbb{R}$.
        steps:
          - math: 'g(x) = f(x)-x \ \Rightarrow\ g^{\prime}(x) = f^{\prime}(x)-1'
            note: "g est la somme de f et de moins x, toutes deux derivables sur R."
          - math: 'f^{\prime}(x) \le |f^{\prime}(x)| \le f(x) < \dfrac12 \quad (\forall x\in\mathbb{R})'
            note: "Meme majoration que la question precedente, mais valable ici sur R tout entier."
          - math: 'g^{\prime}(x) = f^{\prime}(x)-1 < \dfrac12-1 = -\dfrac12 < 0 \ \Rightarrow\ g \text{ strictement decroissante sur } \mathbb{R}'
            note: "g prime est strictement negative partout : g decroit strictement sur R tout entier."
      - id: qII-2c
        stem: |-
          **(0,5 pt)** En déduire qu'il existe un unique réel $\alpha \in\, \left]0\,;\dfrac{1}{2}\right[$ tel que : $f(\alpha) = \alpha$
        reasoning: |-
          $f(\alpha)=\alpha \iff g(\alpha)=0$ : chercher un point fixe de $f$, c'est chercher un zéro de $g$. $g$ est continue (car dérivable, question précédente) et strictement décroissante sur $\mathbb{R}$, donc en particulier sur $\left[0,\frac12\right]$ — il suffit d'un changement de signe aux bornes pour conclure par le corollaire du théorème des valeurs intermédiaires.

          $$g(0) = f(0)-0 = f(0) = \dfrac{1}{1+e} \approx 0{,}27 > 0$$

          $$g\left(\dfrac12\right) = f\left(\dfrac12\right)-\dfrac12 = \dfrac{1}{2\sqrt e}-\dfrac12 \approx 0{,}30-0{,}50 = -0{,}20 < 0$$

          $g(0)>0>g\left(\frac12\right)$, $g$ continue et strictement décroissante entre les deux : il existe un unique $\alpha\in\left]0,\frac12\right[$ tel que $g(\alpha)=0$, c'est-à-dire $f(\alpha)=\alpha$.
        steps:
          - math: 'f(\alpha)=\alpha \iff g(\alpha)=0'
            note: "Chercher un point fixe de f revient a chercher un zero de g."
          - math: 'g(0) = f(0) = \dfrac{1}{1+e} \approx 0{,}27 > 0'
            note: "On evalue g en 0 : f(0) moins 0, soit f(0) directement."
          - math: 'g\left(\dfrac12\right) = f\left(\dfrac12\right)-\dfrac12 = \dfrac{1}{2\sqrt e}-\dfrac12 \approx -0{,}20 < 0'
            note: "On evalue g en un demi, avec le maximum de f deja calcule en I-2b."
          - math: 'g(0)>0>g\left(\dfrac12\right),\ g \text{ continue et strictement decroissante} \ \Rightarrow\ \exists!\,\alpha\in\left]0,\tfrac12\right[,\ f(\alpha)=\alpha'
            note: "Changement de signe sur un intervalle ou g est continue et strictement monotone : existence et unicite."
      - id: qII-3a
        part: "Partie II, 3 — La suite (u_n) : encadrement, contraction, convergence"
        stem: |-
          **(0,5 pt)** Montrer que : $(\forall n \in \mathbb{N})\ ;\quad 0 < u_n < \dfrac{1}{2}$
        reasoning: |-
          Récurrence. **Initialisation** : $u_0\in\left]0,\frac12\right[$ est l'hypothèse de départ sur la suite (donnée dans l'énoncé de la Partie II).

          **Hérédité** : même sans supposer $0<u_n<\frac12$, le résultat de I-2b, $0<f(x)<\frac12$, est vrai pour TOUT réel $x$, donc en particulier pour $x=u_n$, quel que soit $u_n$ :

          $$0 < f(u_n) < \dfrac12 \quad \text{c'est-à-dire} \quad 0 < u_{n+1} < \dfrac12$$

          La propriété se transmet à tous les rangs : $(\forall n\in\mathbb{N})\ ; 0<u_n<\frac12$.
        steps:
          - math: 'u_0 \in\, \left]0,\tfrac12\right[ \quad (\text{hypothese initiale})'
            note: "Rang 0 : c'est la definition de la suite donnee dans l'enonce."
          - math: 'u_{n+1} = f(u_n),\qquad 0<f(x)<\dfrac12 \quad (\forall x\in\mathbb{R},\ \text{I-2b})'
            note: "Le resultat de I-2b vaut pour tout reel x, sans condition sur x : il s'applique donc a u_n quel qu'il soit."
          - math: '\Rightarrow\ 0 < u_{n+1} < \dfrac12 \ \Rightarrow\ (\forall n\in\mathbb{N})\ ;\ 0<u_n<\dfrac12'
            note: "La propriete se transmet a tous les rangs par recurrence."
      - id: qII-3b
        stem: |-
          **(0,5 pt)** Montrer que : $(\forall n \in \mathbb{N})\ ;\quad |u_{n+1} - \alpha| \le \dfrac{1}{2}|u_n - \alpha|$
        reasoning: |-
          On veut majorer $|u_{n+1}-\alpha|=|f(u_n)-f(\alpha)|$ (en utilisant $f(\alpha)=\alpha$, II-2c) par une quantité proportionnelle à $|u_n-\alpha|$. C'est exactement le rôle de l'INÉGALITÉ DES ACCROISSEMENTS FINIS — un corollaire du théorème des accroissements finis (TAF), un outil hors du corps de cette leçon, déjà mobilisé pour un autre sujet de cette même banque (bk-2019-n-x4, questions 3a/3b, où il est introduit de la même façon) : si $f$ est dérivable sur un intervalle $I$ et $|f'|\le k$ sur $I$, alors pour tous $a,b\in I$, $|f(b)-f(a)|\le k|b-a|$.

          $u_n\in\left]0,\frac12\right[$ (question précédente) et $\alpha\in\left]0,\frac12\right[$ (II-2c) : les deux points, et donc tout le segment entre eux, vivent dans $\left[0,\frac12\right]$. Sur cet intervalle, $|f'|<\frac12$ (II-2a) — en particulier $|f'|\le\frac12$. L'inégalité des accroissements finis, appliquée à $f$ entre $u_n$ et $\alpha$ avec $k=\frac12$, donne :

          $$|f(u_n)-f(\alpha)| \le \dfrac12|u_n-\alpha|$$

          Or $f(u_n)=u_{n+1}$ et $f(\alpha)=\alpha$ : c'est exactement $|u_{n+1}-\alpha|\le\frac12|u_n-\alpha|$.
        steps:
          - math: 'u_n,\alpha \in\, \left]0,\tfrac12\right[ \ \Rightarrow\ [u_n,\alpha] \subset \left[0,\tfrac12\right] \quad (\text{ou } [\alpha,u_n])'
            note: "Les deux points vivent dans [0, un demi] : tout le segment entre eux aussi."
          - math: '|f^{\prime}| < \dfrac12 \text{ sur } \left[0,\tfrac12\right] \quad (\text{II-2a})'
            note: "Majoration de la derivee sur l'intervalle qui contient u_n et alpha."
          - math: '|f(u_n)-f(\alpha)| \le \dfrac12|u_n-\alpha| \quad (\text{inegalite des accroissements finis})'
            note: "Corollaire du theoreme des accroissements finis (TAF) : la derivee majoree par un demi majore l'ecart des images."
          - math: 'f(u_n)=u_{n+1},\ f(\alpha)=\alpha \ \Rightarrow\ |u_{n+1}-\alpha| \le \dfrac12|u_n-\alpha|'
            note: "u_{n+1} est f(u_n) par definition, et f(alpha) vaut alpha (II-2c)."
      - id: qII-3c
        stem: |-
          **(0,5 pt)** Montrer par récurrence que : $(\forall n \in \mathbb{N})\ ;\quad |u_n - \alpha| \le \left(\dfrac{1}{2}\right)^{n+1}$
        reasoning: |-
          **Initialisation ($n=0$)** : $u_0$ et $\alpha$ vivent tous les deux dans $\left]0,\frac12\right[$, un intervalle de longueur $\frac12$ : leur écart est donc strictement inférieur à $\frac12$, en particulier $|u_0-\alpha|\le\left(\frac12\right)^{0+1}=\frac12$.

          **Hérédité** : suppose $|u_n-\alpha|\le\left(\frac12\right)^{n+1}$. La question précédente donne $|u_{n+1}-\alpha|\le\frac12|u_n-\alpha|$. Combine les deux :

          $$|u_{n+1}-\alpha| \le \dfrac12\times\left(\dfrac12\right)^{n+1} = \left(\dfrac12\right)^{n+2} = \left(\dfrac12\right)^{(n+1)+1}$$

          — exactement la propriété au rang $n+1$. Elle se transmet donc à tous les rangs.

          *(Remarque : contrairement à d'autres sujets qui portent un facteur $|u_0-\alpha|$ dans cette majoration, celui-ci n'apparaît pas ici — c'est licite précisément parce que $u_0$ et $\alpha$ vivent tous deux dans $\left]0,\frac12\right[$, ce qui fournit déjà $|u_0-\alpha|<\frac12$ au rang 0.)*
        steps:
          - math: 'u_0,\alpha \in\, \left]0,\tfrac12\right[ \ \Rightarrow\ |u_0-\alpha| < \dfrac12 = \left(\dfrac12\right)^{0+1}'
            note: "Rang 0 : les deux valeurs sont dans un intervalle de longueur un demi, donc leur ecart est inferieur a un demi."
          - math: '|u_n-\alpha|\le\left(\dfrac12\right)^{n+1} \ \Rightarrow\ |u_{n+1}-\alpha| \le \dfrac12\left(\dfrac12\right)^{n+1} = \left(\dfrac12\right)^{n+2}'
            note: "On applique la question precedente a l'hypothese de recurrence."
          - math: '\Rightarrow\ (\forall n\in\mathbb{N})\ ;\ |u_n-\alpha| \le \left(\dfrac12\right)^{n+1}'
            note: "La propriete se transmet a tous les rangs : recurrence close."
      - id: qII-3d
        stem: |-
          **(0,25 pt)** En déduire que la suite $(u_n)_{n \in \mathbb{N}}$ converge vers $\alpha$
        reasoning: |-
          $\left(\frac12\right)^{n+1}\to0$ quand $n\to+\infty$ (suite géométrique de raison $\frac12\in\,]0,1[$). L'encadrement $0\le|u_n-\alpha|\le\left(\frac12\right)^{n+1}$ (question précédente) coince $|u_n-\alpha|$ entre deux suites qui tendent toutes les deux vers $0$ : par le théorème des gendarmes, $|u_n-\alpha|\to0$, c'est-à-dire $u_n\to\alpha$.
        steps:
          - math: '\left(\dfrac12\right)^{n+1} \xrightarrow[n\to+\infty]{} 0 \quad (\text{suite geometrique de raison } \tfrac12\in\,]0,1[)'
            note: "Raison entre 0 et 1 : la suite geometrique tend vers 0."
          - math: '0\le|u_n-\alpha|\le\left(\dfrac12\right)^{n+1} \ \Rightarrow\ |u_n-\alpha|\to0 \quad (\text{gendarmes}) \ \Rightarrow\ u_n\to\alpha'
            note: "Theoreme des gendarmes : encadre par deux suites qui tendent vers 0, u_n moins alpha tend vers 0."
      - id: qIII-1a
        part: "Partie III, 1 — Réécriture de S_n et un pont vers la Partie I"
        stem: |-
          **PARTIE III.** On considère la suite numérique $(S_n)_{n \in \mathbb{N}}$ définie par :

          $$(\forall n \in \mathbb{N}^{*})\ ;\qquad S_n = \frac{1}{n(n+1)}\sum_{k=1}^{k=n} \frac{k}{e^{\frac{k}{n}} + e^{\frac{n-k}{n}}}$$

          **(0,25 pt)** Vérifier que : $(\forall n \in \mathbb{N}^{*})\ ;\quad S_n = \dfrac{1}{n+1}\displaystyle\sum_{k=1}^{k=n} \dfrac{k}{n}\,f\!\left(\dfrac{k}{n}\right)$
        reasoning: |-
          Le terme général de la somme de $S_n$ ressemble à $f$ évaluée quelque part, mais pas immédiatement — il faut RECONNAÎTRE la structure. Réécris $f$ sous une forme équivalente en divisant sa définition par $e^x$ :

          $$f(x) = \dfrac{e^x}{e^{2x}+e} = \dfrac{1}{e^x + \dfrac{e}{e^x}} = \dfrac{1}{e^x+e^{1-x}}$$

          Applique cette forme à $x=\dfrac kn$ : comme $\dfrac{n-k}{n}=1-\dfrac kn$,

          $$f\!\left(\dfrac kn\right) = \dfrac{1}{e^{k/n}+e^{1-k/n}} = \dfrac{1}{e^{k/n}+e^{(n-k)/n}}$$

          — exactement le dénominateur du terme général de $S_n$. Donc chaque terme $\dfrac{k}{e^{k/n}+e^{(n-k)/n}}$ vaut $k\times f\!\left(\dfrac kn\right)$, que l'on réécrit $n\times\dfrac kn\times f\!\left(\dfrac kn\right)$ (multiplier et diviser par $n$ fait apparaître le rapport $\frac kn$ dont on aura besoin plus tard). Report dans $S_n$ :

          $$S_n = \dfrac{1}{n(n+1)}\sum_{k=1}^n n\times\dfrac kn\, f\!\left(\dfrac kn\right) = \dfrac{n}{n(n+1)}\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right) = \dfrac{1}{n+1}\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right)$$

          (le facteur $n$ sort de la somme car il ne dépend pas de $k$, puis se simplifie avec le $n$ du dénominateur).
        steps:
          - math: 'f(x) = \dfrac{e^{x}}{e^{2x}+e} = \dfrac{1}{e^{x}+e^{1-x}} \quad (\text{on divise numerateur et denominateur par } e^{x})'
            note: "Forme equivalente de f, obtenue en divisant par e puissance x."
          - math: '\dfrac{n-k}{n} = 1-\dfrac kn \ \Rightarrow\ f\!\left(\dfrac kn\right) = \dfrac{1}{e^{k/n}+e^{(n-k)/n}}'
            note: "On applique la forme equivalente de f au point k sur n."
          - math: '\dfrac{k}{e^{k/n}+e^{(n-k)/n}} = k\,f\!\left(\dfrac kn\right) = n\times\dfrac kn\,f\!\left(\dfrac kn\right)'
            note: "Le terme general de la somme est exactement k fois f(k/n), reecrit en faisant apparaitre k sur n."
          - math: 'S_n = \dfrac{1}{n(n+1)}\times n\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right) = \dfrac{1}{n+1}\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right)'
            note: "Le facteur n sort de la somme et se simplifie avec le n du denominateur n(n+1)."
      - id: qIII-1b
        stem: |-
          **(0,5 pt)** Montrer que : $\displaystyle\int_0^{1} x\,f(x)\,dx = \int_0^{\frac{1}{2}} f(x)\,dx$

          *(On pourra effectuer le changement de variables : $t = 1 - x$)*
        reasoning: |-
          Note $I=\displaystyle\int_0^1 x\,f(x)\,dx$. Pose $t=1-x$ comme suggéré : $x=1-t$, $dx=-dt$, bornes $x=0\to t=1$, $x=1\to t=0$.

          $$I = \int_1^0 (1-t)f(1-t)(-dt) = \int_0^1 (1-t)f(1-t)\,dt$$

          Or $f(1-t)=f(t)$ pour tout $t$ (I-1a — la même symétrie qui a déjà servi en I-4a) :

          $$I = \int_0^1 (1-t)f(t)\,dt = \int_0^1 f(t)\,dt - \int_0^1 t\,f(t)\,dt = \int_0^1 f(x)\,dx - I$$

          (on a distribué le produit, puis renommé $t$ en $x$ dans la deuxième intégrale, qui n'est autre que $I$ elle-même). On obtient une équation en $I$ :

          $$2I = \int_0^1 f(x)\,dx \ \Rightarrow\ I = \dfrac12\int_0^1 f(x)\,dx$$

          Et $\dfrac12\displaystyle\int_0^1 f(x)\,dx = \displaystyle\int_0^{1/2} f(x)\,dx$ est exactement le résultat de I-4b, lu à l'envers. Donc $I=\displaystyle\int_0^{1/2} f(x)\,dx$ — l'exercice se recoupe avec lui-même, comme prévu par sa construction.
        steps:
          - math: 't=1-x,\quad dx=-dt,\qquad x=0\to t=1,\quad x=1\to t=0'
            note: "Changement de variable suggere par l'enonce."
          - math: 'I = \int_0^1 (1-t)f(1-t)\,dt = \int_0^1 (1-t)f(t)\,dt \quad (f(1-t)=f(t),\ \text{I-1a})'
            note: "Meme symetrie qu'en I-4a et I-4b, reutilisee ici."
          - math: 'I = \int_0^1 f(t)\,dt - \int_0^1 t\,f(t)\,dt = \int_0^1 f(x)\,dx - I'
            note: "On distribue le produit (1-t) f(t) : la seconde integrale est I elle-meme, renommee."
          - math: '2I = \int_0^1 f(x)\,dx \ \Rightarrow\ I = \dfrac12\int_0^1 f(x)\,dx = \int_0^{1/2} f(x)\,dx \quad (\text{I-4b})'
            note: "Equation en I : on la resout, puis on relie a I-4b pour retomber sur l'integrale deja connue."
      - id: qIII-2
        part: "Partie III, 2 — Convergence de S_n par somme de Riemann"
        stem: |-
          **(0,5 pt)** Montrer que la suite $(S_n)_{n \in \mathbb{N}}$ est convergente et déterminer sa limite.
        reasoning: |-
          D'après III-1a, $S_n = \dfrac{1}{n+1}\displaystyle\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right)$. Fais apparaître une SOMME DE RIEMANN : pose $g(x)=x\,f(x)$ et réécris

          $$S_n = \dfrac{n}{n+1}\times\dfrac1n\sum_{k=1}^n g\!\left(\dfrac kn\right)$$

          (on a multiplié et divisé par $n$). Le facteur $\dfrac1n\sum_{k=1}^n g\!\left(\dfrac kn\right)$ est EXACTEMENT la forme d'une somme de Riemann — le même théorème, sous la même forme exacte, que celui déjà mobilisé pour un sujet SM voisin de cette banque, content/maths/calcul-integral/bank.yaml, entrée bk-2024-r-x2, question q1-b :

          $$\dfrac1n\sum_{k=1}^n h\!\left(\dfrac kn\right) \xrightarrow[n\to+\infty]{} \int_0^1 h(x)\,dx \qquad (h \text{ continue sur } [0,1])$$

          Ici $h=g$ : $g(x)=x\,f(x)$ est continue sur $[0,1]$ (produit de deux fonctions continues, $x\mapsto x$ et $f$, cette dernière continue car dérivable sur $\mathbb{R}$ tout entier, I-2a). Le théorème s'applique :

          $$\dfrac1n\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right) \xrightarrow[n\to+\infty]{} \int_0^1 x\,f(x)\,dx$$

          Et $\dfrac{n}{n+1}\to1$ quand $n\to+\infty$ (quotient de deux termes de même degré en $n$). $S_n$ est donc le PRODUIT de deux suites convergentes :

          $$S_n \xrightarrow[n\to+\infty]{} 1\times\int_0^1 x\,f(x)\,dx = \int_0^1 x\,f(x)\,dx$$

          Il reste à identifier cette limite avec un nombre déjà connu. D'après III-1b, $\displaystyle\int_0^1 x\,f(x)\,dx=\int_0^{1/2}f(x)\,dx$, et d'après I-5b, $\displaystyle\int_0^{1/2}f(x)\,dx=\dfrac{1}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac\pi4\right)$. L'exercice boucle sur lui-même : I-5b, puis III-1b, ferment maintenant III-2.

          $$\boxed{\lim_{n\to+\infty} S_n = \dfrac{1}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac\pi4\right) \approx 0{,}1457}$$
