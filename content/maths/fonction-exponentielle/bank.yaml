            note: "u_{n+1} moins u_n vaut f(u_n), négatif ou nul : la suite décroît."
      - id: q7a
        part: "Partie II, 2 — Cas 0 ≤ u₀ : minoration et limite"
        stem: |-
          **On suppose que $0 \le u_0$** et on pose $(\forall x \in \mathbb{R})\ ;\ g(x) = e^{-x} + \dfrac{1}{2}x - \dfrac{3}{4}$

          **(0,5 pt)** Montrer que : $(\forall x \in \mathbb{R})\ ;\ g(x) > 0$ *(On prendra : $\ln 2 = 0,69$)*
        reasoning: |-
          $g$ est construite comme $f$, à partir de $e^{-x}$ et d'un polynôme : dérivable sur $\mathbb{R}$ (R3), $g'(x)=-e^{-x}+\tfrac12$. Cette dérivée s'annule quand $e^{-x}=\tfrac12$, c'est-à-dire $x=\ln2$ (en passant au $\ln$, R1). $g$ décroît avant $\ln2$, croît après : $g$ atteint son minimum global en $x=\ln2$.

          $g(\ln2) = e^{-\ln2}+\tfrac{\ln2}{2}-\tfrac34 = \tfrac12+\tfrac{\ln2}{2}-\tfrac34 = \tfrac{\ln2}{2}-\tfrac14$. Avec l'indication $\ln2\approx0{,}69$ : $g(\ln2)\approx0{,}345-0{,}25=0{,}095>0$.

          Le minimum de $g$ sur $\mathbb{R}$ est strictement positif : donc $g(x)>0$ pour tout réel $x$.
        steps:
          - math: 'g''(x) = -e^{-x}+\dfrac12'
            note: "Dérivée de g, construite comme f : dérivable partout (rung R3)."
          - math: 'g''(x) = 0 \iff e^{-x} = \dfrac12 \iff x = \ln 2'
            note: "On résout g prime égale zéro, en passant au logarithme."
          - math: 'g \text{ décroît sur } ]-\infty,\ln2],\ \text{croît sur } [\ln2,+\infty[ \ \Rightarrow\ \min_{\mathbb{R}} g = g(\ln2)'
            note: "Tableau de variations de g : minimum global atteint en ln2."
          - math: 'g(\ln2) = e^{-\ln2}+\dfrac{\ln2}{2}-\dfrac34 = \dfrac12+\dfrac{\ln2}{2}-\dfrac34 = \dfrac{\ln2}{2}-\dfrac14'
            note: "On évalue g en ln2, avec e puissance moins ln2 égal un demi."
          - math: 'g(\ln2) \approx \dfrac{0{,}69}{2}-0{,}25 = 0{,}095 > 0 \ \Rightarrow\ (\forall x\in\mathbb{R})\ g(x)>0'
            note: "Avec l'indication ln2 = 0,69, le minimum vaut environ 0,095, strictement positif : g est positive partout."
      - id: q7b
        stem: |-
          **(0,5 pt)** En utilisant le résultat de la question précédente, montrer que : $(\forall n \in \mathbb{N})\ ;\ 0 \le u_n$ *(On remarque que : $f(x) + x = 4x\,g(x)$)*
        reasoning: |-
          On vérifie d'abord la remarque : $f(x)+x = 4x\left(e^{-x}+\tfrac12x-1\right)+x = 4xe^{-x}+2x^2-3x$, et $4x\,g(x) = 4x\left(e^{-x}+\tfrac12x-\tfrac34\right) = 4xe^{-x}+2x^2-3x$ — les deux coïncident.

          Donc $u_{n+1}=f(u_n)+u_n=4u_n\,g(u_n)$. Récurrence : au rang $0$, $u_0\ge0$ (hypothèse de ce cas) et $g(u_0)>0$ (question précédente), donc $u_1=4u_0g(u_0)\ge0$. Hérédité : si $u_n\ge0$, alors $g(u_n)>0$ toujours, donc $u_{n+1}=4u_n\,g(u_n)\ge0$ (produit d'un facteur $\ge0$ par un facteur $>0$). La propriété se transmet.
        steps:
          - math: 'f(x)+x = 4x\left(e^{-x}+\tfrac12x-1\right)+x = 4xe^{-x}+2x^2-3x'
            note: "On développe f(x) + x."
          - math: '4x\,g(x) = 4x\left(e^{-x}+\tfrac12x-\tfrac34\right) = 4xe^{-x}+2x^2-3x \ \Rightarrow\ f(x)+x=4x\,g(x)'
            note: "On développe 4x g(x) : les deux expressions coïncident, ce qui vérifie la remarque de l'énoncé."
          - math: 'u_{n+1} = f(u_n)+u_n = 4u_n\,g(u_n)'
            note: "On applique la remarque à x = u_n."
          - math: 'u_0\ge0,\ g(u_0)>0 \ \Rightarrow\ u_1 = 4u_0\,g(u_0)\ge0 \quad (\text{initialisation})'
            note: "Rang 0 : u_0 positif ou nul, g(u_0) strictement positif, le produit est positif ou nul."
          - math: 'u_n\ge0,\ g(u_n)>0 \ \Rightarrow\ u_{n+1}=4u_n\,g(u_n)\ge0 \quad (\text{hérédité})'
            note: "Même argument au rang n : la propriété se transmet."
      - id: q7c
        stem: |-
          **(0,25 pt)** Montrer que la suite $(u_n)_{n \in \mathbb{N}}$ est convergente.
        reasoning: |-
          $(u_n)$ est décroissante (question 6b, valable dans tous les cas) et minorée par $0$ (question précédente, sous l'hypothèse $0\le u_0$). Le théorème de la limite monotone — une suite décroissante et minorée converge — s'applique : $(u_n)$ converge.
        steps:
          - math: '(u_n) \text{ décroissante (6-b) et minorée par } 0 \text{ (7-b)} \ \Rightarrow\ (u_n) \text{ converge}'
            note: "Théorème de la limite monotone : décroissante et minorée entraîne convergente."
      - id: q7d
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{n \to +\infty} u_n$
        reasoning: |-
          Notons $\ell$ la limite. En passant $0\le u_n<\alpha$ à la limite : $0\le\ell\le\alpha$. La suite vérifie $u_{n+1}=f(u_n)+u_n$ et $f$ est continue : en passant à la limite, $\ell=f(\ell)+\ell$, donc $f(\ell)=0$.

          D'après le tableau de variations de $f$ (question 2b) : $f$ croît de $-\infty$ à $0$ sur $]-\infty,0]$ sans s'annuler avant $0$, décroît puis recroît ensuite sans s'annuler avant $\alpha$ : les SEULS zéros de $f$ sur $\mathbb{R}$ sont $0$ et $\alpha$. Donc $\ell\in\{0,\alpha\}$.

          Or $(u_n)$ est décroissante (question 6b) et $u_0<\alpha$ (hypothèse de départ de la suite) : tous les termes, et donc la limite, vérifient $\ell\le u_0<\alpha$. On écarte $\ell=\alpha$. Il reste $\ell=0$.
        steps:
          - math: '0\le u_n<\alpha \ \Rightarrow\ 0\le\ell\le\alpha \quad (\text{passage à la limite})'
            note: "L'encadrement de u_n passe à la limite."
          - math: 'u_{n+1}=f(u_n)+u_n,\ f \text{ continue} \ \Rightarrow\ \ell=f(\ell)+\ell \ \Rightarrow\ f(\ell)=0'
            note: "La limite est un point fixe de la relation de récurrence."
          - math: 'f(x)=0 \iff x=0 \text{ ou } x=\alpha \quad (\text{seuls zéros de } f,\ \text{tableau de variations, question 2-b})'
            note: "D'après les variations de f, ses seuls zéros sur R sont 0 et alpha."
          - math: '(u_n) \text{ décroissante},\ u_0<\alpha \ \Rightarrow\ \ell\le u_0<\alpha \ \Rightarrow\ \ell\neq\alpha \ \Rightarrow\ \ell=0'
            note: "La suite décroît depuis u_0, strictement inférieur à alpha : la limite ne peut pas être alpha."
      - id: q8a
        part: "Partie II, 3 — Cas u₀ < 0 : comportement et limite"
        stem: |-
          **On suppose que $u_0 < 0$**

          **(0,5 pt)** Montrer que : $(\forall n \in \mathbb{N})\ ;\ u_{n+1} - u_n \le f(u_0)$
        reasoning: |-
          $u_{n+1}-u_n=f(u_n)$, comme toujours. $(u_n)$ est décroissante (question 6b), donc $u_n\le u_0<0$ pour tout $n$ : tous les termes restent dans $]-\infty,0]$, là où $f$ est strictement croissante (question 2b). Croissance de $f$ appliquée à $u_n\le u_0$ : $f(u_n)\le f(u_0)$. D'où $u_{n+1}-u_n\le f(u_0)$.
        steps:
          - math: 'u_{n+1}-u_n = f(u_n)'
            note: "Différence de deux termes consécutifs, par définition de la récurrence."
          - math: '(u_n) \text{ décroissante} \ \Rightarrow\ u_n\le u_0<0 \quad (\text{tous les termes dans } ]-\infty,0])'
            note: "La décroissance (question 6-b) place tous les termes sous u_0, lui-même négatif."
          - math: 'f \text{ croissante sur } ]-\infty,0] \quad (\text{Partie I, question 2-b})\ \Rightarrow\ u_n\le u_0 \ \Rightarrow\ f(u_n)\le f(u_0)'
            note: "f est croissante sur cette zone : elle conserve l'ordre."
          - math: '\Rightarrow\ u_{n+1}-u_n\le f(u_0)'
            note: "On combine les deux lignes précédentes."
      - id: q8b
        stem: |-
          **(0,5 pt)** Montrer que : $(\forall n \in \mathbb{N})\ ;\ u_n \le u_0 + n\,f(u_0)$
        reasoning: |-
          C'est une somme télescopique à partir de l'inégalité précédente. Pour chaque $k$ de $0$ à $n-1$ : $u_{k+1}-u_k\le f(u_0)$. On additionne ces $n$ inégalités : à gauche, les termes intermédiaires se compensent et il reste $u_n-u_0$ ; à droite, on additionne $n$ fois la même constante $f(u_0)$.
        steps:
          - math: '\text{Pour } k=0,\dots,n-1:\quad u_{k+1}-u_k\le f(u_0) \quad (\text{question précédente})'
            note: "L'inégalité de la question précédente, valable à chaque rang k."
          - math: '\sum_{k=0}^{n-1}(u_{k+1}-u_k) \le n\,f(u_0) \ \Rightarrow\ u_n-u_0\le n\,f(u_0)'
            note: "On additionne les n inégalités : la somme télescope à gauche en u_n moins u_0."
          - math: '\Rightarrow\ u_n\le u_0+n\,f(u_0)'
            note: "On isole u_n."
      - id: q8c
        stem: |-
          **(0,25 pt)** En déduire $\displaystyle\lim_{n \to +\infty} u_n$
        reasoning: |-
          $u_0<0$ et $f$ est strictement croissante sur $]-\infty,0]$ avec $f(0)=0$ (question 2b) : donc $f(u_0)<f(0)=0$, une constante strictement négative.

          Dans l'inégalité de la question précédente, $u_0+n\,f(u_0)$ est une expression linéaire en $n$ de coefficient directeur $f(u_0)<0$ : elle tend vers $-\infty$ quand $n\to+\infty$. Comme $u_n$ reste toujours en dessous de cette quantité qui part vers $-\infty$, $u_n$ est forcé de suivre : $\displaystyle\lim_{n\to+\infty}u_n=-\infty$.
        steps:
          - math: 'u_0<0 \ \Rightarrow\ f(u_0)<f(0)=0 \quad (f \text{ croissante sur } ]-\infty,0],\ \text{Partie I question 2-b})'
            note: "u_0 négatif et f croissante avec f(0)=0 : f(u_0) est strictement négatif."
          - math: '\lim_{n\to+\infty}\big(u_0+n\,f(u_0)\big) = -\infty \quad (f(u_0)<0)'
            note: "Expression linéaire en n de coefficient négatif : elle tend vers moins l'infini."
          - math: 'u_n\le u_0+n\,f(u_0) \ \Rightarrow\ \lim_{n\to+\infty} u_n = -\infty'
            note: "u_n reste toujours sous une quantité qui tend vers moins l'infini : il est forcé de suivre."

