            note: "f strictement croissante (question 4-b) ; f(0)=0 et f(ln4)=ln4."
      - id: q8b
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_n)$ est décroissante.
        reasoning: |-
          On étudie le signe de $u_{n+1} - u_n = f(u_n) - u_n$. La question 3b a montré que $f(x)-x < 0$ sur $]0,\ln 4[$. Comme $0 < u_n < \ln 4$ (question 8a), on a $f(u_n) - u_n < 0$, c'est-à-dire $u_{n+1} - u_n < 0$ : la suite $(u_n)$ est décroissante.
        steps:
          - math: 'u_{n+1} - u_n = f(u_n) - u_n < 0 \qquad (\text{car } 0 < u_n < \ln 4)'
            note: "On réutilise f(x)-x < 0 sur ]0,ln4[ (question 3-b) avec x = u_n."
      - id: q8c
        stem: |-
          **(0,25 pt)** En déduire que la suite $(u_n)$ est convergente.
        reasoning: |-
          La suite $(u_n)$ est décroissante (question 8b) et minorée par $0$ (question 8a : $0 < u_n$). Par le théorème de la convergence monotone, toute suite décroissante et minorée converge : $(u_n)$ converge vers une limite finie $\ell \ge 0$.
      - id: q8d
        stem: |-
          **(0,5 pt)** Calculer la limite de la suite $(u_n)$.
        reasoning: |-
