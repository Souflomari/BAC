            note: "La limite est un point fixe de f, situé dans [0, ln4]."
          - math: 'f(\ell) = \ell \iff \ell\,e^{\frac{\ell}{2}}\left(e^{\frac{\ell}{2}}-2\right) = 0 \iff \ell = 0 \ \text{ ou }\ \ell = \ln 4'
