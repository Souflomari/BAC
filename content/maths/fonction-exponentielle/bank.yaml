          - math: 'S_n = \dfrac{n}{n+1}\times\dfrac1n\sum_{k=1}^n g\!\left(\dfrac kn\right) \quad (g(x)=x\,f(x))'
            note: "On multiplie et divise par n pour faire apparaitre la forme exacte d'une somme de Riemann."
          - math: '\dfrac1n\sum_{k=1}^n h\!\left(\dfrac kn\right) \xrightarrow[n\to+\infty]{} \int_0^1 h(x)\,dx \quad (h \text{ continue sur } [0,1])'
            note: "Theoreme des sommes de Riemann (programme SM), meme forme que bk-2024-r-x2 question q1-b."
          - math: 'g(x)=x\,f(x) \text{ continue sur } [0,1] \ \Rightarrow\ \dfrac1n\sum_{k=1}^n \dfrac kn\,f\!\left(\dfrac kn\right) \xrightarrow[n\to+\infty]{} \int_0^1 x\,f(x)\,dx'
            note: "g est continue comme produit de deux fonctions continues : le theoreme s'applique."
          - math: '\dfrac{n}{n+1}\to1 \ \Rightarrow\ S_n \xrightarrow[n\to+\infty]{} \int_0^1 x\,f(x)\,dx'
            note: "Produit de deux suites convergentes : la limite est le produit des limites."
