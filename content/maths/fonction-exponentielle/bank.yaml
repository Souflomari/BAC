      - id: q5a
        part: "Partie I, 5 — Signe de f et calcul intégral"
        stem: |-
          **(0,25 pt)** Vérifier que : $(\forall x \in ]-\infty,\alpha])\ ;\ f(x) \le 0$
        reasoning: |-
          On découpe $]-\infty,\alpha]$ selon le tableau de variations de $f$ (question 2b) et on utilise la monotonie sur chaque morceau.

          Sur $]-\infty,0]$ : $f$ croissante, donc $f(x)\le f(0)=0$ pour $x\le0$.

          Sur $[0,1]$ : $f$ décroissante à partir de $f(0)=0$, donc $f(x)\le f(0)=0$ pour $x\in[0,1]$.

          Sur $[1,\alpha]\subset[1,+\infty[$ : $f$ croissante, donc $f(x)\le f(\alpha)=0$ pour $x\le\alpha$.

          Les trois morceaux recouvrent $]-\infty,\alpha]$ tout entier : $f(x)\le0$ partout sur cet intervalle.
        steps:
          - math: 'x\le 0 \ \Rightarrow\ f(x)\le f(0) = 0 \quad (f \text{ croissante sur } ]-\infty,0])'
            note: "Premier morceau : f croissante, valeur de départ nulle."
          - math: '0\le x\le 1 \ \Rightarrow\ f(x)\le f(0) = 0 \quad (f \text{ décroissante sur } [0,1])'
            note: "Deuxième morceau : f décroissante à partir de 0."
          - math: '1\le x\le \alpha \ \Rightarrow\ f(x)\le f(\alpha) = 0 \quad (f \text{ croissante sur } [1,+\infty[)'
            note: "Troisième morceau : f croissante jusqu'à sa valeur nulle en alpha."
          - math: '\Rightarrow\ (\forall x\in\,]-\infty,\alpha])\ f(x)\le 0'
            note: "Les trois morceaux recouvrent tout l'intervalle : f est négative ou nulle partout dessus."
      - id: q5b
        stem: |-
          **(0,75 pt)** Montrer que : $\displaystyle\int_0^\alpha f(x)\,dx = \dfrac{2}{3}\alpha\left(\alpha^2 - 3\right)$, en déduire que : $\dfrac{3}{2} < \alpha \le \sqrt{3}$
        reasoning: |-
          On cherche une primitive de $f(x)=4xe^{-x}+2x^2-4x$. Le terme $2x^2-4x$ se primitive directement. Le terme $4xe^{-x}$ n'est PAS de la forme $u'e^u$ (R6 ne s'applique pas ici : l'exposant est $-x$ mais le facteur devant est $4x$, pas une constante fois $-1$) — il faut une intégration par parties (IPP), un outil de la notion `calcul-integral`, pas du corps R0–R7 de cette leçon. Avec $u=x$, $dv=4e^{-x}dx$ : $\int 4xe^{-x}dx = -4xe^{-x}+\int4e^{-x}dx = -4(x+1)e^{-x}$.

          Une primitive de $f$ est donc $F(x) = -4(x+1)e^{-x} + \tfrac23x^3 - 2x^2$. On calcule $F(0)=-4$ et $F(\alpha)$, en utilisant l'identité $e^{-\alpha}=1-\tfrac{\alpha}2$ (question 2d) pour remplacer $e^{-\alpha}$ et simplifier : les termes en $\alpha^2$ s'annulent, il reste $F(\alpha)=\tfrac23\alpha^3-2\alpha-4$.

          $\displaystyle\int_0^\alpha f = F(\alpha)-F(0) = \tfrac23\alpha^3-2\alpha = \tfrac23\alpha(\alpha^2-3)$ — exactement la formule demandée.

          Pour l'encadrement : $f\le0$ sur $[0,\alpha]\subset\,]-\infty,\alpha]$ (question 5a), donc l'intégrale d'une fonction $\le0$ sur $[0,\alpha]$ (avec $\alpha>0$) est $\le0$. Or elle vaut $\tfrac23\alpha(\alpha^2-3)$, avec $\tfrac23\alpha>0$ (car $\alpha>\tfrac32>0$) : le signe de l'intégrale est celui de $(\alpha^2-3)$. Intégrale $\le0$ force donc $\alpha^2\le3$, soit $\alpha\le\sqrt3$ (car $\alpha>0$). Combiné à $\alpha>\tfrac32$ (question 2c) : $\tfrac32<\alpha\le\sqrt3$.
        steps:
          - math: 'F(x) = -4(x+1)e^{-x} + \dfrac{2}{3}x^3 - 2x^2 \quad (\text{primitive de } f,\ \text{IPP sur } 4xe^{-x})'
            note: "Primitive obtenue par intégration par parties sur le terme 4x e puissance moins x."
          - math: 'F(0) = -4'
            note: "On évalue la primitive en 0."
          - math: 'F(\alpha) = -4(\alpha+1)e^{-\alpha} + \dfrac{2}{3}\alpha^3 - 2\alpha^2'
            note: "On évalue la primitive en alpha."
          - math: 'e^{-\alpha} = 1-\dfrac{\alpha}{2} \ \Rightarrow\ -4(\alpha+1)e^{-\alpha} = 2\alpha^2-2\alpha-4'
            note: "On remplace e puissance moins alpha par l'identité de la question 2d, puis on développe."
          - math: 'F(\alpha) = \dfrac{2}{3}\alpha^3 - 2\alpha - 4 \quad (\text{les deux termes en } \alpha^2 \text{ se compensent})'
            note: "Après substitution, les deux termes en alpha carré se compensent exactement."
          - math: '\int_0^\alpha f(x)\,dx = F(\alpha)-F(0) = \dfrac{2}{3}\alpha^3-2\alpha = \dfrac{2}{3}\alpha(\alpha^2-3)'
            note: "On soustrait F(0) = -4 et on factorise : c'est la formule demandée."
          - math: '\int_0^\alpha f(x)\,dx \le 0 \quad (f\le 0 \text{ sur } [0,\alpha],\ \text{question 5-a})'
            note: "f est négative ou nulle sur [0, alpha] : son intégrale sur cet intervalle est négative ou nulle."
          - math: '\dfrac{2}{3}\alpha(\alpha^2-3)\le 0,\ \alpha>0 \ \Rightarrow\ \alpha^2\le 3 \ \Rightarrow\ \alpha\le\sqrt3'
            note: "Comme deux tiers alpha est positif, le signe de l'intégrale est celui de alpha carré moins 3."
          - math: '\Rightarrow\ \dfrac32<\alpha\le\sqrt3 \quad (\text{borne basse : question 2-c})'
            note: "On combine avec l'encadrement déjà connu, trois demis inférieur à alpha."
