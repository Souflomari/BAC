        reasoning: |-
          $\dfrac{f(x)}{x} = -1+\dfrac{5}{2x} - \dfrac{1}{2x}e^{x-2}\left(e^{x-2}-4\right)$ pour $x\neq0$. Les deux premiers termes sont bornés ou s'effacent ; tout se joue sur le troisième, qui porte le facteur exponentiel.

          Pour $x$ assez grand (dès que $e^{x-2}\ge8$, c'est-à-dire $x\ge2+\ln8$) : $e^{x-2}-4\ge\dfrac12e^{x-2}$ (car cette inégalité équivaut à $\dfrac12e^{x-2}\ge4$, soit $e^{x-2}\ge8$). Donc, à partir de ce rang :

          $$e^{x-2}\left(e^{x-2}-4\right) \ge e^{x-2}\times\dfrac12e^{x-2} = \dfrac12e^{2x-4}$$

          Or $\dfrac{e^{2x-4}}{x}\to+\infty$ : en posant $X=2x-4$ (donc $x=\dfrac{X+4}{2}$, et $X\to+\infty$ avec $x$), $\dfrac{e^{2x-4}}{x} = \dfrac{e^{X}}{(X+4)/2} = 2\times\dfrac{e^{X}}{X}\times\dfrac{X}{X+4}$ — le premier facteur tend vers $+\infty$ (R4, croissances comparées) et le second vers $1$ : le produit tend vers $+\infty$.

          Comme $e^{x-2}(e^{x-2}-4)$ reste toujours au-dessus d'une quantité, $\dfrac12e^{2x-4}$, dont le quotient par $x$ tend déjà vers $+\infty$, $\dfrac{e^{x-2}(e^{x-2}-4)}{x}\to+\infty$ aussi, forcée de suivre.

          Donc $\dfrac{f(x)}{x} \to -1+0-\dfrac12\times(+\infty) = -\infty$.

          Interprétation géométrique : quand $\dfrac{f(x)}{x}\to\pm\infty$, la courbe s'éloigne plus vite que n'importe quelle droite passant par l'origine — $(C)$ admet une branche parabolique de direction l'axe des ordonnées $(Oy)$ au voisinage de $+\infty$.
        steps:
