    intro: |-
      **Problème (examen national, session normale 2020, Sciences Expérimentales).**

      On considère la fonction numérique $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = -x + \dfrac{5}{2} - \dfrac{1}{2}e^{x-2}\left(e^{x-2} - 4\right)$$

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i}\,;\vec{j})$ *(unité : 2 cm)*.

      Fil conducteur : ce problème enchaîne limites et asymptote oblique, position relative à une droite, une dérivée qui se reconnaît comme l'opposé d'un carré (donc jamais positive), un point d'inflexion, une équation résolue par le théorème des valeurs intermédiaires, une construction de courbe, puis une fonction réciproque. Garde en tête que $e^{x-2}>0$ ne change jamais de signe (R1) : c'est ce facteur toujours positif qui pilote une bonne partie des signes de l'étude — combiné ici au signe d'un carré, toujours négatif une fois l'opposé pris.
    questions:
      - id: q1
        part: "Limites de f aux bornes du domaine"
        stem: |-
          **(0,5 pt)** Montrer que $\displaystyle\lim_{x \to -\infty} f(x) = +\infty$ et $\displaystyle\lim_{x \to +\infty} f(x) = -\infty$
        reasoning: |-
          On isole d'abord le comportement du facteur exponentiel $e^{x-2}$ — limite de référence du R4, appliquée à l'exposant $x-2$ plutôt qu'à $x$ directement.

          En $-\infty$ : $e^{x-2}\to0$, donc le produit $e^{x-2}\left(e^{x-2}-4\right)\to0\times(-4)=0$ (un facteur qui s'efface multiplié par un facteur qui tend vers une valeur finie). Il reste $f(x) = -x + \dfrac52 - \dfrac12\,e^{x-2}(e^{x-2}-4)$ : un terme qui explose vers $+\infty$, plus une constante, moins une quantité qui s'efface — aucune indétermination, la limite est $+\infty$.

          En $+\infty$ : $e^{x-2}\to+\infty$, donc $e^{x-2}-4\to+\infty$ aussi, et leur produit $e^{x-2}(e^{x-2}-4)\to+\infty$ (produit de deux facteurs qui explosent). Ici, pas besoin de factoriser pour lever une indétermination : $-x\to-\infty$ ET $-\dfrac12\,e^{x-2}(e^{x-2}-4)\to-\infty$ — les deux termes de $f$ partent déjà dans la même direction. Une somme de deux quantités qui tendent toutes deux vers $-\infty$ (plus une constante) tend vers $-\infty$, sans qu'il y ait à trancher un $+\infty-\infty$.
        steps:
          - math: '\lim_{x\to-\infty} e^{x-2} = 0 \quad (R4)'
            note: "En moins l'infini, e puissance x moins 2 tend vers 0, meme limite que e puissance x (rung R4), appliquee a l'exposant x moins 2."
          - math: 'e^{x-2}\left(e^{x-2}-4\right) \xrightarrow[x\to-\infty]{} 0\times(-4) = 0'
            note: "Le produit tend vers 0 : un facteur qui s'efface multiplie par un facteur qui tend vers moins 4."
          - math: 'f(x) = -x+\tfrac52-\tfrac12\,e^{x-2}(e^{x-2}-4) \ \Rightarrow\ \lim_{x\to-\infty} f(x) = +\infty'
            note: "Pas d'indetermination : moins x explose vers plus l'infini, le reste s'efface."
          - math: '\lim_{x\to+\infty} e^{x-2} = +\infty \ \Rightarrow\ \lim_{x\to+\infty} e^{x-2}\left(e^{x-2}-4\right) = +\infty'
            note: "En plus l'infini, e puissance x moins 2 tend vers plus l'infini ; le produit de deux facteurs qui explosent aussi."
          - math: '-x \to -\infty,\quad -\tfrac12\,e^{x-2}(e^{x-2}-4) \to -\infty \ \Rightarrow\ \lim_{x\to+\infty} f(x) = -\infty'
            note: "Les deux morceaux de f partent deja vers moins l'infini : la somme suit, sans forme indeterminee a lever."
      - id: q2a
        part: "Asymptote oblique et position relative"
        stem: |-
          **(0,5 pt)** Démontrer que la droite $(\Delta)$ d'équation $y = -x + \dfrac{5}{2}$ est une asymptote à la courbe $(C)$ au voisinage de $-\infty$
        reasoning: |-
          Une droite $y=ax+b$ est asymptote à $(C)$ en $-\infty$ si l'écart $f(x)-(ax+b)$ tend vers $0$. Ici $(\Delta):y=-x+\frac52$ reprend exactement les deux premiers termes de $f$ : l'écart se réduit donc au troisième terme seul.

          $$f(x) - \left(-x+\frac52\right) = -\frac12 e^{x-2}\left(e^{x-2}-4\right)$$

          En $-\infty$, $e^{x-2}\to0$ (R4), donc ce produit tend vers $-\frac12\times0\times(-4)=0$. L'écart s'annule à la limite : $(\Delta)$ est bien asymptote à $(C)$ au voisinage de $-\infty$.
        steps:
          - math: 'f(x) - \left(-x+\tfrac52\right) = -\tfrac12 e^{x-2}\left(e^{x-2}-4\right)'
            note: "L'ecart entre f et la droite (Delta) se reduit au troisieme terme de f : les deux premiers coincident exactement avec (Delta)."
          - math: '\lim_{x\to-\infty} e^{x-2} = 0 \quad (R4)'
            note: "En moins l'infini, e puissance x moins 2 tend vers 0."
          - math: '\lim_{x\to-\infty}\left[-\tfrac12 e^{x-2}\left(e^{x-2}-4\right)\right] = -\tfrac12\times0\times(-4) = 0'
            note: "L'ecart tend vers 0 : (Delta) est bien asymptote a (C) en moins l'infini."
      - id: q2b
        stem: |-
          **(0,75 pt)** Résoudre l'équation $e^{x-2} - 4 = 0$ puis montrer que la courbe $(C)$ est au dessus de $(\Delta)$ sur l'intervalle $]-\infty, 2 + \ln 4]$ et en dessous de $(\Delta)$ sur l'intervalle $[2 + \ln 4, +\infty[$
        reasoning: |-
          On résout d'abord $e^{x-2}=4$ : par l'identité fondamentale $e^{X}=k \iff X=\ln k$ (R7, ici $k=4>0$), $x-2=\ln4$, donc $x=2+\ln4$ — l'unique solution, par injectivité de $\exp$.

          On repart de l'écart calculé à la question précédente, $f(x)-\left(-x+\frac52\right) = -\frac12 e^{x-2}(e^{x-2}-4)$. Le facteur $e^{x-2}$ est toujours strictement positif (R1) : il ne compte pas dans le signe. Le signe de l'écart est donc celui de $-\left(e^{x-2}-4\right)$, c'est-à-dire celui de $4-e^{x-2}$.

          $\exp$ étant strictement croissante (R1), $e^{x-2}<4 \iff x-2<\ln4 \iff x<2+\ln4$. Donc pour $x\le2+\ln4$ : $4-e^{x-2}\ge0$, l'écart est $\ge0$, $(C)$ est au-dessus de $(\Delta)$. Pour $x\ge2+\ln4$ : $4-e^{x-2}\le0$, l'écart est $\le0$, $(C)$ est en dessous de $(\Delta)$. Les deux courbes se touchent exactement en $x=2+\ln4$.
        steps:
          - math: 'e^{x-2}=4 \iff x-2=\ln4 \iff x=2+\ln4 \quad (R7)'
            note: "Injectivite de exp (rung R7) : on passe au logarithme des deux cotes de l'equation."
          - math: 'f(x)-\left(-x+\tfrac52\right) = -\tfrac12 e^{x-2}\left(e^{x-2}-4\right), \qquad e^{x-2}>0 \quad (R1)'
            note: "Le facteur e puissance x moins 2 est toujours strictement positif : il ne change jamais le signe de l'ecart."
          - math: 'f(x)-\left(-x+\tfrac52\right) \text{ a le signe de } \left(4-e^{x-2}\right)'
            note: "On isole le seul facteur qui varie en signe."
          - math: 'x\le2+\ln4 \iff e^{x-2}\le4 \ \Rightarrow\ f(x)-\left(-x+\tfrac52\right)\ge0'
            note: "Sur cette moitie, la courbe est au-dessus de la droite (Delta)."
          - math: 'x\ge2+\ln4 \iff e^{x-2}\ge4 \ \Rightarrow\ f(x)-\left(-x+\tfrac52\right)\le0'
            note: "Sur l'autre moitie, la courbe passe en dessous de (Delta)."
      - id: q3
        stem: |-
          **(0,5 pt)** Montrer que $\displaystyle\lim_{x \to +\infty} \dfrac{f(x)}{x} = -\infty$ puis interpréter géométriquement le résultat
        reasoning: |-
          $\dfrac{f(x)}{x} = -1+\dfrac{5}{2x} - \dfrac{1}{2x}e^{x-2}\left(e^{x-2}-4\right)$ pour $x\neq0$. Les deux premiers termes sont bornés ou s'effacent ; tout se joue sur le troisième, qui porte le facteur exponentiel.

          Pour $x$ assez grand (dès que $e^{x-2}\ge8$, c'est-à-dire $x\ge2+\ln8$) : $e^{x-2}-4\ge\dfrac12e^{x-2}$ (car cette inégalité équivaut à $\dfrac12e^{x-2}\ge4$, soit $e^{x-2}\ge8$). Donc, à partir de ce rang :

          $$e^{x-2}\left(e^{x-2}-4\right) \ge e^{x-2}\times\dfrac12e^{x-2} = \dfrac12e^{2x-4}$$

          Or $\dfrac{e^{2x-4}}{x}\to+\infty$ : en posant $X=2x-4$ (donc $x=\dfrac{X+4}{2}$, et $X\to+\infty$ avec $x$), $\dfrac{e^{2x-4}}{x} = \dfrac{e^{X}}{(X+4)/2} = 2\times\dfrac{e^{X}}{X}\times\dfrac{X}{X+4}$ — le premier facteur tend vers $+\infty$ (R4, croissances comparées) et le second vers $1$ : le produit tend vers $+\infty$.

          Comme $e^{x-2}(e^{x-2}-4)$ reste toujours au-dessus d'une quantité, $\dfrac12e^{2x-4}$, dont le quotient par $x$ tend déjà vers $+\infty$, $\dfrac{e^{x-2}(e^{x-2}-4)}{x}\to+\infty$ aussi, forcée de suivre.

          Donc $\dfrac{f(x)}{x} \to -1+0-\dfrac12\times(+\infty) = -\infty$.

          Interprétation géométrique : quand $\dfrac{f(x)}{x}\to\pm\infty$, la courbe s'éloigne plus vite que n'importe quelle droite passant par l'origine — $(C)$ admet une branche parabolique de direction l'axe des ordonnées $(Oy)$ au voisinage de $+\infty$.
        steps:
          - math: '\dfrac{f(x)}{x} = -1+\dfrac{5}{2x} - \dfrac{1}{2x}e^{x-2}\left(e^{x-2}-4\right) \quad (x\neq0)'
            note: "On divise f(x) par x, terme a terme."
          - math: 'e^{x-2}\ge8 \ \Rightarrow\ e^{x-2}-4\ge\tfrac12e^{x-2} \ \Rightarrow\ e^{x-2}\left(e^{x-2}-4\right)\ge\tfrac12e^{2x-4}'
            note: "Pour x assez grand, on minore le produit par la moitie du carre du terme exponentiel."
          - math: '\dfrac{e^{2x-4}}{x} = 2\times\dfrac{e^{X}}{X}\times\dfrac{X}{X+4} \xrightarrow[X=2x-4\to+\infty]{} +\infty \quad (R4)'
            note: "Changement de variable X egal 2x moins 4 : on retrouve directement la croissance comparee du rung R4."
          - math: '\dfrac{e^{x-2}(e^{x-2}-4)}{x} \ge \dfrac12\dfrac{e^{2x-4}}{x} \ \Rightarrow\ \dfrac{e^{x-2}(e^{x-2}-4)}{x} \to +\infty'
            note: "Minoree par une quantite qui explose : forcee de suivre."
          - math: '\dfrac{f(x)}{x} \to -1+0-\tfrac12\times(+\infty) = -\infty'
            note: "Les deux premiers termes restent finis ou s'effacent ; le troisieme explose avec un signe moins devant."
          - math: '(C) \text{ admet une branche parabolique de direction } (Oy) \text{ au voisinage de } +\infty'
            note: "f(x)/x tend vers l'infini : branche parabolique de direction l'axe (Oy)."
      - id: q4a
        part: "Dérivée et variations"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x$ de $\mathbb{R}$, $f'(x) = -\left(e^{x-2} - 1\right)^2$
        reasoning: |-
          On pose $u=e^{x-2}$ : $u$ est dérivable sur $\mathbb{R}$ et égale à sa propre dérivée, $u'(x)=e^{x-2}=u$ (R3, la fonction intérieure $x-2$ ayant pour dérivée $1$). En termes de $u$, $f(x) = -x+\frac52 - \frac12u(u-4) = -x+\frac52-\frac12u^2+2u$.

          On dérive terme à terme, en utilisant $u'=u$ : $f'(x) = -1 - u\,u'+2u' = -1+u'(2-u) = -1+u(2-u)$ (on remplace $u'$ par $u$).

          $$f'(x) = -1+2u-u^2 = -\left(u^2-2u+1\right) = -(u-1)^2$$

          On reconnaît le carré parfait $u^2-2u+1=(u-1)^2$, d'où, en revenant à $u=e^{x-2}$ :

          $$f'(x) = -\left(e^{x-2}-1\right)^2$$
        steps:
          - math: 'u = e^{x-2}, \qquad f(x) = -x + \tfrac52 - \tfrac12u^2 + 2u \quad (\text{substitution})'
            note: "On pose u egal e puissance x moins 2 : f se reecrit comme un polynome du second degre en u."
          - math: 'f''(x) = -1 + 2u - u^2 \quad (\text{derivation terme a terme, u est sa propre derivee, R3})'
            note: "On derive terme a terme ; u etant sa propre derivee (rung R3), le facteur u apparait directement."
          - math: 'f''(x) = -\left(u^2 - 2u + 1\right) = -(u-1)^2'
            note: "On reconnait le carre parfait u au carre moins 2u plus 1."
          - math: 'f''(x) = -\left(e^{x-2}-1\right)^2 \quad (\text{retour a } u = e^{x-2})'
            note: "On revient a la variable x en remplacant u par e puissance x moins 2 : c'est la formule demandee."
      - id: q4b
        stem: |-
          **(0,25 pt)** Dresser le tableau de variations de la fonction $f$
        reasoning: |-
          $f'(x)=-(e^{x-2}-1)^2$ (question précédente) est l'opposé d'un carré : toujours $\le0$, quel que soit $x$. L'égalité $f'(x)=0$ n'a lieu que si $e^{x-2}-1=0$, c'est-à-dire $e^{x-2}=1 \iff x-2=0 \iff x=2$ (R1) — un seul point isolé. Comme $f'$ ne s'annule qu'en un point isolé sans y changer de signe (elle reste négative de part et d'autre), $f$ reste strictement décroissante sur $\mathbb{R}$ tout entier, sans aucun palier.

          On complète avec les limites de la question 1 et la valeur remarquable en $x=2$ : $f(2) = -2+\frac52-\frac12\times1\times(1-4) = \frac12+\frac32 = 2$.
        steps:
          - math: 'f''(x) = -\left(e^{x-2}-1\right)^2 \le 0,\ \text{nul seulement en } x=2 \quad (R1)'
            note: "f prime est l'oppose d'un carre : toujours negative ou nulle, nulle seulement en un point isole."
          - math: 'f(2) = -2+\tfrac52-\tfrac12\times1\times(1-4) = 2'
            note: "Valeur remarquable au point ou f prime s'annule."
          - math: '\lim_{x\to-\infty}f(x)=+\infty,\quad \lim_{x\to+\infty}f(x)=-\infty \quad (\text{question 1})'
            note: "On complete avec les limites deja etablies : f decroit de plus l'infini a moins l'infini, en passant par le point (2, 2)."
      - id: q5
        part: "Concavité et point d'inflexion"
        stem: |-
          **(0,75 pt)** Calculer $f''(x)$ pour tout $x$ de $\mathbb{R}$ puis montrer que $A(2,2)$ est un point d'inflexion de $(C)$
        reasoning: |-
          La notion de point d'inflexion par changement de signe de $f''$ est un outil de la notion `derivabilite-etude-fonctions` — on l'applique ici tel quel, comme au problème 2022 de cette même banque (question 5c).

          On repart de $f'(x) = -(e^{x-2}-1)^2$ (question précédente), une composée du carré appliqué à $v(x)=e^{x-2}-1$. La dérivée de $v$ est $v'(x)=e^{x-2}$ (dérivée de $e^{x-2}$, R3 ; la constante $-1$ disparaît). La règle de dérivation d'une composée $(-v^2)' = -2v\,v'$ donne directement :

          $$f''(x) = -2\left(e^{x-2}-1\right)\times e^{x-2} = -2e^{x-2}\left(e^{x-2}-1\right)$$

