  - id: bk-2019-n-x4
    title: "Étude d'une fonction avec l'exponentielle : Rolle, accroissements finis, intégrale et suite récurrente"
    source:
      year: 2019
      session: normale
      filiere: "SM"
      exercise_label: "Exercice 4"
    bareme_total: 10
    duration_min: 70
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national Sciences Mathématiques (SM-A
        et SM-B, BIOF), Mathématiques (4 h, coef 9), code NS 24F, AlloSchool
        element/68482 (Exercice 4, 10 points). Transcription VÉRIFIÉE :
        re-fetch AlloSchool indépendant (→ course-436/upload-54931, pages
        4-5) et diff caractère-par-caractère conforme au scan,
        agent-vérificateur-adversarial, 2026-07-12
        (docs/sujets/maths/fonction-exponentielle.md, statut « vérifié »).
    intro: |-
      **Étude de fonction (examen national, session normale 2019, Sciences Mathématiques).**

      **PARTIE I.** On considère la fonction $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = 4x\left(e^{-x} + \dfrac{1}{2}x - 1\right)$$

      et on note $(C)$ sa courbe représentative dans un repère orthonormé $(O;\vec{i},\vec{j})$.
    questions:
      - id: q1
        part: "Partie I, 1 — Limites de f"
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to -\infty} f(x)$ et $\displaystyle\lim_{x \to +\infty} f(x)$.
        reasoning: |-
          Développe d'abord le produit pour séparer les deux régimes : $f(x) = 4x\,e^{-x} + 2x^2 - 4x$. C'est cette forme qui rend chaque limite lisible.

          En $+\infty$ : $x\,e^{-x}\to 0$ — c'est l'inverse de la croissance comparée $\dfrac{e^x}{x}\to+\infty$ (R4) — donc $4x\,e^{-x}\to 0$. Le reste, $2x^2-4x$, est dominé par $2x^2\to+\infty$. Une quantité qui tend vers $0$ plus une quantité qui tend vers $+\infty$ : pas d'indétermination, la somme suit le terme qui diverge.

          En $-\infty$, c'est plus délicat : $x\,e^{-x}$ est un produit de $x\to-\infty$ par $e^{-x}\to+\infty$ — jamais indéterminé, un produit de deux limites infinies de signes opposés donne directement $-\infty$ — donc $4x\,e^{-x}\to-\infty$ ; mais $2x^2-4x\to+\infty$ aussi. Cette fois on a $-\infty+\infty$, une vraie indétermination : il faut comparer la vitesse des deux termes. On factorise par le terme exponentiel, qui l'emporte toujours sur un polynôme :

          $$f(x) = 4x\,e^{-x}\left[1 + \frac{2x^2-4x}{4x\,e^{-x}}\right] = 4x\,e^{-x}\left[1 + \frac{(x-2)e^{x}}{2}\right]$$

          Le crochet tend vers $1$ : $x\,e^{x}\to 0$ en $-\infty$ (c'est le corollaire du R4) et $e^{x}\to 0$, donc $(x-2)e^x = xe^x - 2e^x \to 0$. Il reste $4x\,e^{-x}\to-\infty$ multiplié par un facteur qui tend vers $1$ : la limite est $-\infty$.
        steps:
          - math: 'f(x) = 4x\,e^{-x} + 2x^2 - 4x'
            note: "On développe le produit : 4x fois e puissance moins x, plus 4x fois un demi x moins 4x."
          - math: '\lim_{x\to+\infty} x\,e^{-x} = 0 \quad (\text{inverse de } e^x/x\to+\infty,\ R4)'
            note: "En plus l'infini, x fois e puissance moins x tend vers 0 : c'est l'inverse de la croissance comparée du rung R4."
          - math: '\lim_{x\to+\infty} (2x^2-4x) = +\infty \ \Rightarrow\ \lim_{x\to+\infty} f(x) = +\infty'
            note: "Le polynôme 2x carré moins 4x tend vers plus l'infini ; la somme suit ce terme, pas d'indétermination."
          - math: 'f(x) = 4x\,e^{-x}\left[1 + \frac{(x-2)e^{x}}{2}\right]'
            note: "On factorise par le terme exponentiel pour lever l'indétermination en moins l'infini."
          - math: '\lim_{x\to-\infty} x\,e^{x} = 0 \quad (\text{corollaire } R4) \ \Rightarrow\ \lim_{x\to-\infty}\left[1+\frac{(x-2)e^x}{2}\right] = 1'
            note: "x fois e puissance x tend vers 0 en moins l'infini (corollaire du rung R4) : le crochet tend vers 1."
          - math: '\lim_{x\to-\infty} 4x\,e^{-x} = -\infty \ \Rightarrow\ \lim_{x\to-\infty} f(x) = -\infty'
            note: "Produit direct, x vers moins l'infini fois e puissance moins x vers plus l'infini : moins l'infini, multiplié par un facteur qui tend vers 1."
      - id: q2a
        part: "Partie I, 2 — Dérivée, variations et existence de α"
        stem: |-
          **(0,5 pt)** Montrer que $f$ est dérivable sur $\mathbb{R}$ et que $(\forall x \in \mathbb{R})\ ;\ f'(x) = 4\left(e^{-x} - 1\right)(1 - x)$
        reasoning: |-
          $f$ est bâtie sur $x\mapsto e^{-x}$, dérivable sur $\mathbb{R}$ sans aucune condition de signe à vérifier (R3 : $e^{u}$ est dérivable dès que $u$ l'est, ici $u(x)=-x$), et sur des termes polynomiaux. Somme et produit de fonctions dérivables sur $\mathbb{R}$ : $f$ est dérivable sur $\mathbb{R}$.

          On dérive à partir de la forme développée $f(x)=4xe^{-x}+2x^2-4x$ (question 1) : $(4xe^{-x})' = 4e^{-x} - 4xe^{-x}$ (règle du produit, avec $(e^{-x})'=-e^{-x}$ par R3), et $(2x^2-4x)'=4x-4$. Il reste à vérifier que la somme obtenue coïncide avec la forme factorisée demandée, en développant celle-ci à l'envers.
        steps:
          - math: '(4x\,e^{-x})'' = 4e^{-x} + 4x(-e^{-x}) = 4e^{-x} - 4x\,e^{-x}'
            note: "Dérivée du produit 4x fois e puissance moins x, avec la dérivée de e puissance moins x égale à moins e puissance moins x (rung R3)."
          - math: 'f''(x) = 4e^{-x} - 4x\,e^{-x} + 4x - 4'
            note: "On ajoute la dérivée du reste, 2x carré moins 4x, qui vaut 4x moins 4."
          - math: '4(e^{-x}-1)(1-x) = 4\left[e^{-x} - x\,e^{-x} - 1 + x\right] = 4e^{-x} - 4x\,e^{-x} - 4 + 4x'
            note: "On développe l'expression demandée : elle coïncide terme à terme avec f prime."
      - id: q2b
        stem: |-
          **(0,75 pt)** Étudier les variations de $f$ sur $\mathbb{R}$, puis donner son tableau de variations.
        reasoning: |-
          Le facteur $4$ est positif : le signe de $f'$ est celui du produit $(e^{-x}-1)(1-x)$. On étudie chaque facteur séparément.

          $e^{-x}-1$ : $\exp$ est strictement croissante (R1), donc $e^{-x}>e^0=1 \iff -x>0 \iff x<0$. Ce facteur est positif pour $x<0$, nul en $0$, négatif pour $x>0$.

          $1-x$ : positif pour $x<1$, nul en $1$, négatif pour $x>1$.

          On croise les deux signes : sur $]-\infty,0[$ les deux facteurs sont positifs ($f'>0$) ; sur $]0,1[$ le premier devient négatif, le second reste positif ($f'<0$) ; sur $]1,+\infty[$ les deux sont négatifs ($f'>0$ à nouveau). $f'$ s'annule exactement en $0$ et en $1$.

          $f$ est donc strictement croissante sur $]-\infty,0]$, strictement décroissante sur $[0,1]$, strictement croissante sur $[1,+\infty[$. Valeurs remarquables : $f(0)=0$ (le facteur $x$ s'annule dans la définition de $f$), et $f(1)=4\left(e^{-1}+\tfrac12-1\right)=\dfrac{4}{e}-2\approx-0{,}53$.
        steps:
          - math: 'f''(x) = 4(e^{-x}-1)(1-x)'
            note: "Le facteur 4 est positif : il ne compte pas dans le signe."
          - math: 'e^{-x}-1>0 \iff x<0 \quad (\exp \text{ strictement croissante, } e^0=1)'
            note: "e puissance moins x moins 1 change de signe en x = 0."
          - math: '1-x>0 \iff x<1'
            note: "1 moins x change de signe en x = 1."
          - math: 'f''>0 \text{ sur } ]-\infty,0[\, ;\quad f''<0 \text{ sur } ]0,1[\, ;\quad f''>0 \text{ sur } ]1,+\infty['
            note: "En croisant les deux signes : f croît, puis décroît, puis croît de nouveau."
          - math: 'f(0) = 0\ ;\qquad f(1) = 4\left(e^{-1}+\tfrac12-1\right) = \dfrac{4}{e}-2 \approx -0{,}53'
            note: "Valeurs remarquables aux deux points où f prime s'annule."
      - id: q2c
        stem: |-
          **(0,5 pt)** Montrer qu'il existe un unique réel $\alpha$ dans l'intervalle $\left]\dfrac{3}{2},2\right[$ tel que $f(\alpha) = 0$ *(On prendra $e^{\frac{3}{2}} = 4,5$)*
        reasoning: |-
          $f$ est continue (car dérivable) et strictement croissante sur $[1,+\infty[$ (question précédente) — en particulier sur $\left[\tfrac32,2\right]$. Il suffit de vérifier un changement de signe aux deux bornes : le corollaire du théorème des valeurs intermédiaires, pour une fonction continue strictement monotone, garantit alors une unique solution entre elles.

          $f\!\left(\tfrac32\right) = 6\left(e^{-3/2}-\tfrac14\right)$. Avec l'indication $e^{3/2}=4{,}5$, $e^{-3/2}=\tfrac{1}{4{,}5}=\tfrac29\approx0{,}222$, donc $f\!\left(\tfrac32\right)\approx6(0{,}222-0{,}25)<0$.

          $f(2)=8e^{-2}$, strictement positif ($e^{-2}>0$ toujours, R1).

          $f\!\left(\tfrac32\right)<0<f(2)$ sur un intervalle où $f$ est continue et strictement croissante : il existe un unique $\alpha\in\left]\tfrac32,2\right[$ tel que $f(\alpha)=0$.
        steps:
          - math: 'f\!\left(\tfrac32\right) = 4\times\tfrac32\left(e^{-3/2}+\tfrac34-1\right) = 6\left(e^{-3/2}-\tfrac14\right)'
            note: "On évalue f en trois demis, en remplaçant x par 3/2 dans la définition de f."
          - math: 'e^{-3/2} = \dfrac{1}{4{,}5} = \dfrac{2}{9} \approx 0{,}222 \ \Rightarrow\ f\!\left(\tfrac32\right) \approx 6(0{,}222-0{,}25) < 0'
            note: "Avec e puissance trois demis égal 4,5 (indication de l'énoncé), e puissance moins trois demis vaut environ 0,222 : f(3/2) est négatif."
          - math: 'f(2) = 8e^{-2} > 0 \quad (e^{-2}>0 \text{ toujours, } R1)'
            note: "f(2) est strictement positif, car e puissance moins 2 est toujours strictement positif."
          - math: 'f\!\left(\tfrac32\right)<0<f(2) \ \Rightarrow\ \exists!\,\alpha\in\left]\tfrac32,2\right[,\ f(\alpha)=0'
            note: "Changement de signe entre 3/2 et 2, sur un intervalle où f est continue et strictement croissante : existence et unicité de alpha."
      - id: q2d
        stem: |-
          **(0,25 pt)** Vérifier que : $e^{-\alpha} = 1 - \dfrac{\alpha}{2}$
        reasoning: |-
          $f(\alpha)=0$ se traduit par $4\alpha\left(e^{-\alpha}+\tfrac{\alpha}{2}-1\right)=0$. Comme $\alpha\in\left]\tfrac32,2\right[$, $\alpha\neq0$, donc on divise par le facteur non nul $4\alpha$ : il reste $e^{-\alpha}+\tfrac{\alpha}{2}-1=0$, c'est-à-dire $e^{-\alpha}=1-\tfrac{\alpha}{2}$.
        steps:
          - math: '4\alpha\left(e^{-\alpha}+\tfrac{\alpha}{2}-1\right)=0,\ \alpha\neq 0 \ \Rightarrow\ e^{-\alpha}+\tfrac{\alpha}{2}-1=0'
            note: "f(alpha)=0 et alpha différent de 0 : on divise par 4 alpha."
          - math: 'e^{-\alpha} = 1 - \dfrac{\alpha}{2}'
            note: "On isole e puissance moins alpha."
      - id: q3a
        part: "Partie I, 3 — Théorèmes de Rolle et des accroissements finis"
        stem: |-
          **(0,5 pt)** En appliquant le théorème de ROLLE à la fonction $f'$, montrer qu'il existe un réel $x_0$ de l'intervalle $]0,1[$ tel que : $f''(x_0) = 0$
        reasoning: |-
          Rolle et les accroissements finis ne font pas partie du corps de cette leçon (R0–R7) — ce sont des outils de la notion `derivabilite-etude-fonctions` ; on les mobilise ici tels quels, en admettant leurs énoncés (voir la SCOPE NOTE en tête de fichier). Pour éviter d'empiler les apostrophes dans les champs de calcul, on y note $f^{(2)}$ et $f^{(3)}$ les dérivées seconde et troisième de $f$ — même objet que $f''$ et $f'''$ dans l'énoncé.

          Le théorème de Rolle s'applique à une fonction continue sur $[a,b]$, dérivable sur $]a,b[$, prenant la même valeur aux deux bornes : il garantit alors un point où la dérivée s'annule. On l'applique ici à $f'$ elle-même (pas à $f$) sur $[0,1]$ : $f'$ est continue sur $[0,1]$ et dérivable sur $]0,1[$ (construite comme $f$, à partir de $e^{-x}$ et d'un polynôme), et $f'(0)=f'(1)=0$ (question 2b) — les deux bornes coïncident. Rolle appliqué à $f'$ garantit donc l'existence d'un réel $x_0\in\,]0,1[$ tel que $(f')'(x_0)=f^{(2)}(x_0)=0$.
        steps:
          - math: 'f''(0) = f''(1) = 0'
            note: "Les deux valeurs de f prime aux bornes de [0,1] coïncident (question 2b) : c'est l'hypothèse de Rolle."
          - math: '\exists\,x_0\in\,]0,1[,\ f^{(2)}(x_0) = 0 \quad (\text{Rolle appliqué à } f'' \text{ sur } [0,1])'
            note: "f prime continue sur [0,1], dérivable sur ]0,1[, mêmes valeurs aux bornes : Rolle donne un point où sa dérivée, f seconde, s'annule."
      - id: q3b
        stem: |-
          **(0,5 pt)** En appliquant le théorème des accroissements finis à la fonction $f''$, montrer que, pour tout réel $x$ différent de $x_0$ de l'intervalle $[0,1]$, on a : $\dfrac{f''(x)}{x - x_0} > 0$
        reasoning: |-
          On calcule d'abord $f^{(2)}$ explicitement, en dérivant $f'(x)=4e^{-x}-4xe^{-x}+4x-4$ (question 2a) : $f^{(2)}(x) = -4e^{-x} - 4\left(e^{-x}-xe^{-x}\right) + 4 = 4\left[1+(x-2)e^{-x}\right]$. On en déduit $f^{(3)}$, sa dérivée : $f^{(3)}(x) = 4e^{-x}(3-x)$.

          Sur $[0,1]$, $3-x\in[2,3]$, donc $f^{(3)}(x)>0$ pour tout $x$ de $[0,1]$ (produit de $4e^{-x}>0$ par $3-x>0$).

          Fixe $x\in[0,1]$, $x\neq x_0$. Le théorème des accroissements finis, appliqué à $f^{(2)}$ entre $x$ et $x_0$ ($f^{(2)}$ continue sur $[0,1]$, dérivable sur $]0,1[$, de dérivée $f^{(3)}$), donne un réel $c$ strictement compris entre $x$ et $x_0$ tel que $f^{(2)}(x)-f^{(2)}(x_0) = f^{(3)}(c)(x-x_0)$. Or $f^{(2)}(x_0)=0$ (question 3a), donc $f^{(2)}(x) = f^{(3)}(c)(x-x_0)$, c'est-à-dire, puisque $x\neq x_0$ : $\dfrac{f^{(2)}(x)}{x-x_0} = f^{(3)}(c)$.

          Comme $c$ est entre $x$ et $x_0$, deux points de $[0,1]$, $c$ appartient lui aussi à $[0,1]$ : donc $f^{(3)}(c)>0$ (établi ci-dessus). D'où $\dfrac{f''(x)}{x-x_0}>0$.
        steps:
          - math: 'f^{(2)}(x) = -4e^{-x} - 4\left(e^{-x}-xe^{-x}\right) + 4 = 4\left[1+(x-2)e^{-x}\right]'
            note: "On dérive f prime, obtenue à la question 2a."
          - math: 'f^{(3)}(x) = 4\left[e^{-x} - (x-2)e^{-x}\right] = 4e^{-x}(3-x)'
            note: "On dérive f seconde ; le facteur se simplifie en 4 e puissance moins x fois (3 moins x)."
          - math: 'x\in[0,1] \ \Rightarrow\ 3-x \in [2,3] \ \Rightarrow\ f^{(3)}(x) > 0 \text{ sur } [0,1]'
            note: "Sur [0,1], 3 moins x est toujours strictement positif : f troisième est strictement positive sur tout l'intervalle."
          - math: '\exists\,c \text{ entre } x \text{ et } x_0,\quad f^{(2)}(x)-f^{(2)}(x_0) = f^{(3)}(c)(x-x_0) \quad (\text{TAF appliqué à } f^{(2)})'
            note: "Théorème des accroissements finis appliqué à f seconde entre x et x0."
          - math: 'f^{(2)}(x_0)=0 \ \Rightarrow\ \dfrac{f^{(2)}(x)}{x-x_0} = f^{(3)}(c) > 0 \quad (c\in[0,1])'
            note: "f seconde de x0 est nulle (question 3a) ; c est aussi dans [0,1], donc f troisième de c est positive : le quotient est positif."
      - id: q3c
        stem: |-
