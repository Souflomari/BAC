        reasoning: |-
          On calcule d'abord $f^{(2)}$ explicitement, en dérivant $f'(x)=4e^{-x}-4xe^{-x}+4x-4$ (question 2a) : $f^{(2)}(x) = -4e^{-x} - 4\left(e^{-x}-xe^{-x}\right) + 4 = 4\left[1+(x-2)e^{-x}\right]$. On en déduit $f^{(3)}$, sa dérivée : $f^{(3)}(x) = 4e^{-x}(3-x)$.

          Sur $[0,1]$, $3-x\in[2,3]$, donc $f^{(3)}(x)>0$ pour tout $x$ de $[0,1]$ (produit de $4e^{-x}>0$ par $3-x>0$).

          Fixe $x\in[0,1]$, $x\neq x_0$. Le théorème des accroissements finis, appliqué à $f^{(2)}$ entre $x$ et $x_0$ ($f^{(2)}$ continue sur $[0,1]$, dérivable sur $]0,1[$, de dérivée $f^{(3)}$), donne un réel $c$ strictement compris entre $x$ et $x_0$ tel que $f^{(2)}(x)-f^{(2)}(x_0) = f^{(3)}(c)(x-x_0)$. Or $f^{(2)}(x_0)=0$ (question 3a), donc $f^{(2)}(x) = f^{(3)}(c)(x-x_0)$, c'est-à-dire, puisque $x\neq x_0$ : $\dfrac{f^{(2)}(x)}{x-x_0} = f^{(3)}(c)$.

          Comme $c$ est entre $x$ et $x_0$, deux points de $[0,1]$, $c$ appartient lui aussi à $[0,1]$ : donc $f^{(3)}(c)>0$ (établi ci-dessus). D'où $\dfrac{f''(x)}{x-x_0}>0$.
