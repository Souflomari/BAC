    intro: |-
      **Étude d'une fonction exponentielle (examen national, session normale 2025, Sciences Mathématiques).**

      On considère la fonction numérique $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = \dfrac{e^{x}}{e^{2x} + e}$$

      et soit $(\Gamma)$ sa courbe représentative dans un repère **orthogonal** (non orthonormé) $(O\,;\vec{i}, \vec{j})$.
    questions:
      - id: qI-1a
        part: "Partie I, 1 — Symétrie et limites"
        stem: |-
          **(0,25 pt)** Montrer que : $(\forall x \in \mathbb{R})\ ;\quad f(1-x) = f(x)$
        reasoning: |-
          Une égalité à montrer pour TOUT réel $x$ se prouve en général par calcul direct : on part de $f(1-x)$, on substitue dans la définition de $f$, et on manipule jusqu'à retomber sur $f(x)$.

          $$f(1-x) = \dfrac{e^{1-x}}{e^{2(1-x)}+e} = \dfrac{e^{1-x}}{e^{2-2x}+e}$$

          Divise numérateur et dénominateur par $e$ pour faire apparaître une forme plus simple :

          $$f(1-x) = \dfrac{e^{-x}}{e^{1-2x}+1}$$

          Multiplie maintenant numérateur et dénominateur par $e^{2x}$ — un facteur strictement positif, l'égalité ne change pas de sens :

          $$f(1-x) = \dfrac{e^{-x}\cdot e^{2x}}{\left(e^{1-2x}+1\right)e^{2x}} = \dfrac{e^{x}}{e^{1-2x+2x}+e^{2x}} = \dfrac{e^{x}}{e+e^{2x}} = f(x)$$

          Donc $(\forall x\in\mathbb{R})\ ; f(1-x)=f(x)$. C'est cette symétrie qui porte toute la suite du problème : la partie I-4 et la partie III-1b s'y adossent directement.
        steps:
          - math: 'f(1-x) = \dfrac{e^{1-x}}{e^{2-2x}+e} = \dfrac{e^{-x}}{e^{1-2x}+1}'
            note: "On divise numerateur et denominateur par e."
          - math: 'f(1-x) = \dfrac{e^{-x}\cdot e^{2x}}{\left(e^{1-2x}+1\right)e^{2x}} = \dfrac{e^{x}}{e+e^{2x}}'
            note: "On multiplie numerateur et denominateur par e puissance 2x, un facteur strictement positif."
          - math: 'f(1-x) = \dfrac{e^{x}}{e^{2x}+e} = f(x)'
            note: "C'est exactement la definition de f(x)."
      - id: qI-1b
        stem: |-
          **(0,25 pt)** Interpréter graphiquement le résultat obtenu.
        reasoning: |-
          Une égalité du type $f(a-x)=f(x)$ pour tout $x$ dit toujours la même chose sur la courbe : les points d'abscisses $x$ et $a-x$ ont la même ordonnée, donc ils sont symétriques l'un de l'autre par rapport à la droite verticale $x=\frac{a}{2}$.

          Ici $a=1$ : la droite $x=\dfrac12$ est axe de symétrie de $(\Gamma)$. Concrètement, la moitié droite de la courbe ($x\ge\frac12$) est l'image miroir de la moitié gauche ($x\le\frac12$) — c'est pour cela qu'à la question I-3, tracer $(\Gamma)$ sur $\left[\frac12,1\right]$ ne demande rien de plus qu'un reflet de ce qui est tracé sur $\left[0,\frac12\right]$.
      - id: qI-1c
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to -\infty} f(x)$ puis en déduire $\displaystyle\lim_{x \to +\infty} f(x)$
        reasoning: |-
          En $-\infty$, chaque brique de $f$ a une limite connue : $e^x\to0$ et $e^{2x}\to0$ (croissance stricte de exp, R1). Le numérateur tend vers $0$, le dénominateur vers $0+e=e$ — pas d'indétermination, un quotient dont le dénominateur tend vers une limite non nulle se traite terme à terme.

          $$\lim_{x\to-\infty} f(x) = \dfrac{0}{0+e} = 0$$

          Pour $+\infty$, l'énoncé demande explicitement d'EN DÉDUIRE la limite, pas de la recalculer : c'est un signal à exploiter la symétrie de la question I-1a plutôt que refaire un calcul de limite. Pose $x\to+\infty$ ; alors $1-x\to-\infty$, et $f(x)=f(1-x)$ pour tout $x$ (I-1a) donne directement :

          $$\lim_{x\to+\infty} f(x) = \lim_{x\to+\infty} f(1-x) = \lim_{u\to-\infty} f(u) = 0$$

          (le changement de nom $u=1-x$ ne fait que suivre où va la limite déjà calculée). Les deux limites valent $0$.
        steps:
          - math: '\lim_{x\to-\infty} e^{x} = 0,\quad \lim_{x\to-\infty} e^{2x} = 0 \ \Rightarrow\ \lim_{x\to-\infty} f(x) = \dfrac{0}{e} = 0'
            note: "e puissance x et e puissance 2x tendent tous deux vers 0 en moins l'infini (rung R1) : le denominateur tend vers e, non nul."
          - math: 'x\to+\infty \ \Rightarrow\ 1-x\to-\infty,\quad f(x)=f(1-x) \quad (\text{I-1a})'
            note: "On reutilise la symetrie plutot que refaire le calcul : quand x tend vers plus l'infini, 1-x tend vers moins l'infini."
          - math: '\lim_{x\to+\infty} f(x) = \lim_{u\to-\infty} f(u) = 0'
            note: "Meme limite que celle deja calculee en moins l'infini."
      - id: qI-1d
        stem: |-
          **(0,5 pt)** Interpréter graphiquement les deux résultats obtenus.
        reasoning: |-
          Une limite finie $\ell$ de $f$ quand $x\to\pm\infty$ se lit toujours comme une asymptote horizontale d'équation $y=\ell$. Ici $\ell=0$ des deux côtés (question précédente) : la droite $y=0$, c'est-à-dire l'axe des abscisses, est asymptote à $(\Gamma)$ à la fois en $-\infty$ et en $+\infty$. La courbe s'aplatit contre l'axe des abscisses des deux côtés sans jamais le toucher, puisque $f(x)>0$ pour tout $x$ (établi à la question suivante).
      - id: qI-2a
        part: "Partie I, 2 — Dérivée et variations"
        stem: |-
          **(0,5 pt)** Montrer que : $(\forall x \in \mathbb{R})\ ;\quad f'(x) = f(x)\,\dfrac{1 - e^{2x-1}}{1 + e^{2x-1}}$
        reasoning: |-
          $f$ est un quotient de fonctions dérivables sur $\mathbb{R}$ (numérateur et dénominateur bâtis sur $e^x$, dérivable partout sans condition, R3), et le dénominateur $e^{2x}+e$ ne s'annule jamais (somme de deux termes strictement positifs) : $f$ est dérivable sur $\mathbb{R}$. La règle du quotient donne directement une première forme de $f'$, qu'il faut ensuite faire correspondre à la forme demandée — pas la retrouver par hasard, la RECONNAÎTRE en factorisant $e^{2x-1}=\frac{e^{2x}}{e}$.

          $$f'(x) = \dfrac{e^x(e^{2x}+e) - e^x\cdot 2e^{2x}}{(e^{2x}+e)^2} = \dfrac{e^x(e-e^{2x})}{(e^{2x}+e)^2}$$

          C'est la forme brute. Pour la faire apparaître comme $f(x)$ fois quelque chose, factorise le numérateur et le dénominateur de la forme demandée par $e$ : avec $e^{2x-1}=\frac{e^{2x}}{e}$,

          $$\dfrac{1-e^{2x-1}}{1+e^{2x-1}} = \dfrac{1-\frac{e^{2x}}{e}}{1+\frac{e^{2x}}{e}} = \dfrac{e-e^{2x}}{e+e^{2x}}$$

          (numérateur et dénominateur multipliés par $e$). Donc

          $$f(x)\,\dfrac{1-e^{2x-1}}{1+e^{2x-1}} = \dfrac{e^x}{e^{2x}+e}\times\dfrac{e-e^{2x}}{e+e^{2x}} = \dfrac{e^x(e-e^{2x})}{(e^{2x}+e)^2}$$

          — exactement la forme brute obtenue au départ. Les deux expressions coïncident.
        steps:
          - math: 'f^{\prime}(x) = \dfrac{e^{x}(e^{2x}+e) - e^{x}\cdot 2e^{2x}}{(e^{2x}+e)^{2}} = \dfrac{e^{x}(e-e^{2x})}{(e^{2x}+e)^{2}}'
            note: "Regle du quotient, applicable partout car le denominateur ne s'annule jamais."
          - math: 'e^{2x-1} = \dfrac{e^{2x}}{e} \ \Rightarrow\ \dfrac{1-e^{2x-1}}{1+e^{2x-1}} = \dfrac{e-e^{2x}}{e+e^{2x}}'
            note: "On multiplie haut et bas par e pour faire disparaitre la fraction interne."
          - math: 'f(x)\,\dfrac{1-e^{2x-1}}{1+e^{2x-1}} = \dfrac{e^{x}}{e^{2x}+e}\times\dfrac{e-e^{2x}}{e+e^{2x}} = \dfrac{e^{x}(e-e^{2x})}{(e^{2x}+e)^{2}} = f^{\prime}(x)'
            note: "Les deux expressions coincident : c'est bien la meme derivee."
      - id: qI-2b
        stem: |-
          **(1 pt)** Donner les variations de $f$ puis en déduire que :

          $$(\forall x \in \mathbb{R})\ ;\qquad 0 < f(x) < \frac{1}{2}$$
        reasoning: |-
          Le signe de $f'(x)=f(x)\frac{1-e^{2x-1}}{1+e^{2x-1}}$ (I-2a) est celui du facteur $\frac{1-e^{2x-1}}{1+e^{2x-1}}$ seul : $f(x)$ est un quotient de deux quantités strictement positives (numérateur $e^x>0$, dénominateur $e^{2x}+e>0$), donc $f(x)>0$ pour tout $x$ ; et $1+e^{2x-1}>0$ toujours, donc le dénominateur du facteur ne change jamais le signe non plus. Reste le numérateur $1-e^{2x-1}$.

          $\exp$ strictement croissante (R1) : $e^{2x-1}<1=e^0 \iff 2x-1<0 \iff x<\dfrac12$. Donc $f'(x)>0$ sur $\left]-\infty,\frac12\right[$, $f'\left(\frac12\right)=0$, $f'(x)<0$ sur $\left]\frac12,+\infty\right[$ : $f$ est strictement croissante sur $\left]-\infty,\frac12\right]$, strictement décroissante sur $\left[\frac12,+\infty\right[$, avec un MAXIMUM en $x=\frac12$.

          $$f\left(\dfrac12\right) = \dfrac{e^{1/2}}{e^{1}+e} = \dfrac{\sqrt e}{2e} = \dfrac{1}{2\sqrt e}$$

          (on a simplifié $\frac{\sqrt e}{e}=\frac1{\sqrt e}$). Numériquement $\frac{1}{2\sqrt e}\approx0{,}3033$, donc STRICTEMENT inférieur à $\frac12$. Comme $f(x)\le f\left(\frac12\right)$ pour tout $x$ (le maximum global) et que ce maximum est déjà $<\frac12$, on a $f(x)<\frac12$ pour tout $x$ — l'inégalité ne devient jamais une égalité avec $\frac12$ lui-même. Combiné à $f(x)>0$ déjà établi :

          $$(\forall x\in\mathbb{R})\ ;\quad 0<f(x)<\dfrac12$$
        steps:
