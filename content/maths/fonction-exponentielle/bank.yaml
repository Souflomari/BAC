      - id: qI-4a
        part: "Partie I, 4 — Relation de Chasles via la symétrie"
        stem: |-
          **(0,5 pt)** Montrer que : $\displaystyle\int_0^{\frac{1}{2}} f(x)\,dx = \int_{\frac{1}{2}}^{1} f(x)\,dx$
        reasoning: |-
          Deux intégrales de la même fonction sur deux intervalles différents qui doivent coïncider : le signal est un changement de variable qui envoie l'un des intervalles sur l'autre, combiné à la symétrie de I-1a.

          Pose $t=1-x$ dans $\displaystyle\int_{1/2}^1 f(x)\,dx$ : quand $x=\frac12$, $t=\frac12$ ; quand $x=1$, $t=0$ ; et $dx=-dt$.

          $$\int_{1/2}^{1} f(x)\,dx = \int_{1/2}^{0} f(1-t)\,(-dt) = \int_0^{1/2} f(1-t)\,dt$$

          Or $f(1-t)=f(t)$ pour tout $t$ (I-1a) : la fonction sous l'intégrale se réécrit $f(t)$, sans rien changer aux bornes.

          $$\int_{1/2}^{1} f(x)\,dx = \int_0^{1/2} f(t)\,dt = \int_0^{1/2} f(x)\,dx$$

          (renommer la variable d'intégration ne change jamais la valeur de l'intégrale).
        steps:
