          - math: '\Rightarrow\ u_n\le u_0+n\,f(u_0)'
            note: "On isole u_n."
      - id: q8c
        stem: |-
          **(0,25 pt)** En déduire $\displaystyle\lim_{n \to +\infty} u_n$
        reasoning: |-
          $u_0<0$ et $f$ est strictement croissante sur $]-\infty,0]$ avec $f(0)=0$ (question 2b) : donc $f(u_0)<f(0)=0$, une constante strictement négative.

          Dans l'inégalité de la question précédente, $u_0+n\,f(u_0)$ est une expression linéaire en $n$ de coefficient directeur $f(u_0)<0$ : elle tend vers $-\infty$ quand $n\to+\infty$. Comme $u_n$ reste toujours en dessous de cette quantité qui part vers $-\infty$, $u_n$ est forcé de suivre : $\displaystyle\lim_{n\to+\infty}u_n=-\infty$.
        steps:
          - math: 'u_0<0 \ \Rightarrow\ f(u_0)<f(0)=0 \quad (f \text{ croissante sur } ]-\infty,0],\ \text{Partie I question 2-b})'
            note: "u_0 négatif et f croissante avec f(0)=0 : f(u_0) est strictement négatif."
          - math: '\lim_{n\to+\infty}\big(u_0+n\,f(u_0)\big) = -\infty \quad (f(u_0)<0)'
            note: "Expression linéaire en n de coefficient négatif : elle tend vers moins l'infini."
          - math: 'u_n\le u_0+n\,f(u_0) \ \Rightarrow\ \lim_{n\to+\infty} u_n = -\infty'
            note: "u_n reste toujours sous une quantité qui tend vers moins l'infini : il est forcé de suivre."

