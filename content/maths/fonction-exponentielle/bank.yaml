    intro: |-
      **Problème (examen national, session normale 2020, Sciences Expérimentales).**

      On considère la fonction numérique $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = -x + \dfrac{5}{2} - \dfrac{1}{2}e^{x-2}\left(e^{x-2} - 4\right)$$

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i}\,;\vec{j})$ *(unité : 2 cm)*.

      Fil conducteur : ce problème enchaîne limites et asymptote oblique, position relative à une droite, une dérivée qui se reconnaît comme l'opposé d'un carré (donc jamais positive), un point d'inflexion, une équation résolue par le théorème des valeurs intermédiaires, une construction de courbe, puis une fonction réciproque. Garde en tête que $e^{x-2}>0$ ne change jamais de signe (R1) : c'est ce facteur toujours positif qui pilote une bonne partie des signes de l'étude — combiné ici au signe d'un carré, toujours négatif une fois l'opposé pris.
    questions:
      - id: q1
        part: "Limites de f aux bornes du domaine"
        stem: |-
          **(0,5 pt)** Montrer que $\displaystyle\lim_{x \to -\infty} f(x) = +\infty$ et $\displaystyle\lim_{x \to +\infty} f(x) = -\infty$
        reasoning: |-
          On isole d'abord le comportement du facteur exponentiel $e^{x-2}$ — limite de référence du R4, appliquée à l'exposant $x-2$ plutôt qu'à $x$ directement.

          En $-\infty$ : $e^{x-2}\to0$, donc le produit $e^{x-2}\left(e^{x-2}-4\right)\to0\times(-4)=0$ (un facteur qui s'efface multiplié par un facteur qui tend vers une valeur finie). Il reste $f(x) = -x + \dfrac52 - \dfrac12\,e^{x-2}(e^{x-2}-4)$ : un terme qui explose vers $+\infty$, plus une constante, moins une quantité qui s'efface — aucune indétermination, la limite est $+\infty$.

          En $+\infty$ : $e^{x-2}\to+\infty$, donc $e^{x-2}-4\to+\infty$ aussi, et leur produit $e^{x-2}(e^{x-2}-4)\to+\infty$ (produit de deux facteurs qui explosent). Ici, pas besoin de factoriser pour lever une indétermination : $-x\to-\infty$ ET $-\dfrac12\,e^{x-2}(e^{x-2}-4)\to-\infty$ — les deux termes de $f$ partent déjà dans la même direction. Une somme de deux quantités qui tendent toutes deux vers $-\infty$ (plus une constante) tend vers $-\infty$, sans qu'il y ait à trancher un $+\infty-\infty$.
        steps:
          - math: '\lim_{x\to-\infty} e^{x-2} = 0 \quad (R4)'
            note: "En moins l'infini, e puissance x moins 2 tend vers 0, meme limite que e puissance x (rung R4), appliquee a l'exposant x moins 2."
          - math: 'e^{x-2}\left(e^{x-2}-4\right) \xrightarrow[x\to-\infty]{} 0\times(-4) = 0'
            note: "Le produit tend vers 0 : un facteur qui s'efface multiplie par un facteur qui tend vers moins 4."
          - math: 'f(x) = -x+\tfrac52-\tfrac12\,e^{x-2}(e^{x-2}-4) \ \Rightarrow\ \lim_{x\to-\infty} f(x) = +\infty'
            note: "Pas d'indetermination : moins x explose vers plus l'infini, le reste s'efface."
          - math: '\lim_{x\to+\infty} e^{x-2} = +\infty \ \Rightarrow\ \lim_{x\to+\infty} e^{x-2}\left(e^{x-2}-4\right) = +\infty'
            note: "En plus l'infini, e puissance x moins 2 tend vers plus l'infini ; le produit de deux facteurs qui explosent aussi."
          - math: '-x \to -\infty,\quad -\tfrac12\,e^{x-2}(e^{x-2}-4) \to -\infty \ \Rightarrow\ \lim_{x\to+\infty} f(x) = -\infty'
            note: "Les deux morceaux de f partent deja vers moins l'infini : la somme suit, sans forme indeterminee a lever."
      - id: q2a
        part: "Asymptote oblique et position relative"
        stem: |-
          **(0,5 pt)** Démontrer que la droite $(\Delta)$ d'équation $y = -x + \dfrac{5}{2}$ est une asymptote à la courbe $(C)$ au voisinage de $-\infty$
        reasoning: |-
          Une droite $y=ax+b$ est asymptote à $(C)$ en $-\infty$ si l'écart $f(x)-(ax+b)$ tend vers $0$. Ici $(\Delta):y=-x+\frac52$ reprend exactement les deux premiers termes de $f$ : l'écart se réduit donc au troisième terme seul.

          $$f(x) - \left(-x+\frac52\right) = -\frac12 e^{x-2}\left(e^{x-2}-4\right)$$

          En $-\infty$, $e^{x-2}\to0$ (R4), donc ce produit tend vers $-\frac12\times0\times(-4)=0$. L'écart s'annule à la limite : $(\Delta)$ est bien asymptote à $(C)$ au voisinage de $-\infty$.
        steps:
          - math: 'f(x) - \left(-x+\tfrac52\right) = -\tfrac12 e^{x-2}\left(e^{x-2}-4\right)'
            note: "L'ecart entre f et la droite (Delta) se reduit au troisieme terme de f : les deux premiers coincident exactement avec (Delta)."
          - math: '\lim_{x\to-\infty} e^{x-2} = 0 \quad (R4)'
            note: "En moins l'infini, e puissance x moins 2 tend vers 0."
          - math: '\lim_{x\to-\infty}\left[-\tfrac12 e^{x-2}\left(e^{x-2}-4\right)\right] = -\tfrac12\times0\times(-4) = 0'
            note: "L'ecart tend vers 0 : (Delta) est bien asymptote a (C) en moins l'infini."
      - id: q2b
        stem: |-
          **(0,75 pt)** Résoudre l'équation $e^{x-2} - 4 = 0$ puis montrer que la courbe $(C)$ est au dessus de $(\Delta)$ sur l'intervalle $]-\infty, 2 + \ln 4]$ et en dessous de $(\Delta)$ sur l'intervalle $[2 + \ln 4, +\infty[$
        reasoning: |-
          On résout d'abord $e^{x-2}=4$ : par l'identité fondamentale $e^{X}=k \iff X=\ln k$ (R7, ici $k=4>0$), $x-2=\ln4$, donc $x=2+\ln4$ — l'unique solution, par injectivité de $\exp$.

