            note: "Primitive de reference du programme SM, reutilisee ici sans redemonstration."
          - math: '\dfrac{d}{dt}\left[\dfrac1{\sqrt e}\arctan\left(\dfrac{t}{\sqrt e}\right)\right] = \dfrac{1}{t^{2}+e}'
            note: "Generalisation par changement d'echelle : on verifie la derivee directement (regle de la fonction composee)."
          - math: '\int_1^{\sqrt e}\dfrac{dt}{t^{2}+e} = \dfrac{1}{\sqrt e}\left[\arctan\left(\dfrac{t}{\sqrt e}\right)\right]_1^{\sqrt e} = \dfrac{1}{\sqrt e}\left(\dfrac{\pi}{4}-\arctan\left(\dfrac{1}{\sqrt e}\right)\right)'
            note: "On evalue la primitive entre 1 et racine de e, avec arctan(1) = pi/4."
          - math: '\arctan\left(\dfrac1u\right) = \dfrac{\pi}{2}-\arctan(u) \quad (u>0) \ \Rightarrow\ \arctan\left(\dfrac{1}{\sqrt e}\right) = \dfrac{\pi}{2}-\arctan(\sqrt e)'
            note: "Identite de complementarite de arctan, appliquee avec u = racine de e."
          - math: '\int_1^{\sqrt e}\dfrac{dt}{t^{2}+e} = \dfrac{1}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac{\pi}{4}\right) \ \Rightarrow\ \int_0^{1/2} f(x)\,dx = \dfrac{1}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac{\pi}{4}\right)'
            note: "On reporte l'identite de complementarite, puis on relie a I-5a."
      - id: qI-5c
        stem: |-
          **(0,25 pt)** En déduire l'aire, en $cm^2$, du domaine plan délimité par $(\Gamma)$, les droites d'équations respectives : $x = 0$, $x = 1$ et $y = 0$
        reasoning: |-
          Le domaine est délimité par $(\Gamma)$, l'axe des abscisses et les droites $x=0$, $x=1$ : comme $f(x)>0$ sur $\mathbb{R}$ tout entier (I-2b), la courbe reste au-dessus de l'axe sur $[0,1]$, et l'aire en unités d'aire vaut simplement $\displaystyle\int_0^1 f(x)\,dx$, sans valeur absolue à poser.

          $$\int_0^1 f(x)\,dx = 2\int_0^{1/2} f(x)\,dx \quad (\text{I-4b}) = \dfrac{2}{\sqrt e}\left(\arctan(\sqrt e)-\dfrac\pi4\right) \quad (\text{I-5b})$$

