    intro: |-
      **Problème (examen national, session normale 2022).**

      On considère la fonction numérique $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = x\left(e^{\frac{x}{2}} - 1\right)^2$$

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O,\vec{i},\vec{j})$ *(unité : 1 cm)*.

      Fil conducteur : ce problème enchaîne toute la boîte à outils du chapitre — limites et croissances comparées, position par rapport à une asymptote, dérivée d'un produit contenant $e^{u}$, tableau de variations, concavité lue à travers une fonction auxiliaire $g$, fonction réciproque, puis une suite $u_{n+1}=f(u_n)$. À chaque étape, garde en tête que $e^{\frac{x}{2}}>0$ ne change jamais de signe : c'est ce facteur toujours positif qui pilote tous les signes de l'étude.
    questions:
      - id: q1
        part: "Partie A — Limites et asymptote"
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} f(x)$ et $\displaystyle\lim_{x \to -\infty} f(x)$.
        reasoning: |-
          On regarde chaque morceau. En $+\infty$ : $e^{\frac{x}{2}} \to +\infty$ (R4), donc $\left(e^{\frac{x}{2}}-1\right)^2 \to +\infty$, et le facteur $x \to +\infty$ : le produit tend vers $+\infty$, sans indétermination (deux facteurs qui explosent vers $+\infty$).

          En $-\infty$ : $e^{\frac{x}{2}} \to 0$ (limite de référence, R4), donc $\left(e^{\frac{x}{2}}-1\right)^2 \to (0-1)^2 = 1$ — un facteur fini. Le facteur $x \to -\infty$ l'emporte : le produit tend vers $-\infty$. Ici encore aucune indétermination : un facteur fini non nul multiplié par une quantité qui diverge suit cette dernière.
        steps:
          - math: '\lim_{x \to +\infty} e^{\frac{x}{2}} = +\infty \ \Rightarrow\ \lim_{x \to +\infty}\left(e^{\frac{x}{2}}-1\right)^2 = +\infty'
            note: "En plus l'infini, e puissance x sur 2 tend vers plus l'infini donc son carré diminué de 1 tend vers plus l'infini."
          - math: '\lim_{x \to +\infty} f(x) = \lim_{x \to +\infty} x\left(e^{\frac{x}{2}}-1\right)^2 = +\infty'
            note: "Produit de deux facteurs tendant vers plus l'infini."
          - math: '\lim_{x \to -\infty} e^{\frac{x}{2}} = 0 \ \Rightarrow\ \left(e^{\frac{x}{2}}-1\right)^2 \to (0-1)^2 = 1'
            note: "En moins l'infini, e puissance x sur 2 tend vers 0 (limite de référence R4) : le carré tend vers 1, valeur finie."
          - math: '\lim_{x \to -\infty} f(x) = \lim_{x \to -\infty} x \times 1 = -\infty'
            note: "x tend vers moins l'infini multiplié par un facteur qui tend vers 1 : pas d'indétermination, la limite est moins l'infini."
      - id: q2
        stem: |-
          **(0,5 pt)** Calculer $\displaystyle\lim_{x \to +\infty} \dfrac{f(x)}{x}$ et interpréter géométriquement le résultat.
        reasoning: |-
          Au voisinage de $+\infty$, $x\neq 0$ : on simplifie $\dfrac{f(x)}{x} = \left(e^{\frac{x}{2}}-1\right)^2$, qui tend vers $+\infty$ (question 1).

          Interprétation : quand $\dfrac{f(x)}{x} \to +\infty$, la courbe monte plus vite que n'importe quelle droite passant par l'origine — $(C)$ admet une branche parabolique de direction l'axe des ordonnées $(Oy)$ au voisinage de $+\infty$.
        steps:
          - math: '\frac{f(x)}{x} = \frac{x\left(e^{\frac{x}{2}}-1\right)^2}{x} = \left(e^{\frac{x}{2}}-1\right)^2'
            note: "Simplification par x (non nul au voisinage de plus l'infini)."
          - math: '\lim_{x \to +\infty} \frac{f(x)}{x} = +\infty'
            note: "f(x)/x tend vers plus l'infini : (C) admet une branche parabolique de direction l'axe (Oy) au voisinage de plus l'infini."
      - id: q3a
        stem: |-
          **(0,5 pt)** Montrer que la droite $(\Delta)$ d'équation $y = x$ est asymptote à la courbe $(C)$ au voisinage de $-\infty$.
        reasoning: |-
          Une droite $y=x$ est asymptote en $-\infty$ si l'écart $f(x)-x$ tend vers $0$. On factorise cet écart : $f(x)-x = x\left[\left(e^{\frac{x}{2}}-1\right)^2 - 1\right] = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right)$.

          Or $x\,e^{\frac{x}{2}} \to 0$ en $-\infty$ par croissances comparées (en posant $X=\frac{x}{2}\to-\infty$, $x\,e^{\frac{x}{2}} = 2X\,e^{X} \to 0$), tandis que $e^{\frac{x}{2}}-2 \to -2$. Le produit tend donc vers $0\times(-2)=0$ : $(\Delta):y=x$ est asymptote à $(C)$ en $-\infty$.
        steps:
          - math: 'f(x) - x = x\left[\left(e^{\frac{x}{2}}-1\right)^2 - 1\right] = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right)'
            note: "On factorise l'écart entre f(x) et x."
          - math: '\lim_{x \to -\infty} x\,e^{\frac{x}{2}} = 0 \qquad (X=\tfrac{x}{2},\ \text{croissances comparées})'
            note: "x fois e puissance x sur 2 vaut 2X e puissance X avec X = x/2 tendant vers moins l'infini ; croissances comparées : X e^X tend vers 0."
          - math: 'f(x) - x = \underbrace{x\,e^{\frac{x}{2}}}_{\to\, 0}\left(e^{\frac{x}{2}}-2\right) \xrightarrow[x \to -\infty]{} 0 \times (-2) = 0'
            note: "L'écart f(x)-x tend vers 0 : la droite (Delta) d'équation y=x est asymptote à (C) en moins l'infini."
      - id: q3b
        stem: |-
          **(0,75 pt)** Étudier le signe de $\big(f(x) - x\big)$ pour tout $x$ de $\mathbb{R}$ et en déduire la position relative de la courbe $(C)$ et de la droite $(\Delta)$.
        reasoning: |-
          On repart de la forme factorisée $f(x)-x = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right)$. Le facteur $e^{\frac{x}{2}}$ est toujours strictement positif (R1) : il ne compte pas dans le signe. Reste le signe de $x\left(e^{\frac{x}{2}}-2\right)$.

          On localise le zéro de $e^{\frac{x}{2}}-2$ : $e^{\frac{x}{2}}=2 \iff \frac{x}{2}=\ln 2 \iff x = 2\ln 2 = \ln 4$. Ainsi $e^{\frac{x}{2}}-2>0 \iff x>\ln 4$. En croisant avec le signe de $x$ (zéro en $0$) :

          — sur $]-\infty,0[$ : $x<0$ et $e^{\frac{x}{2}}-2<0$, produit positif ;
          — sur $]0,\ln 4[$ : $x>0$ et $e^{\frac{x}{2}}-2<0$, produit négatif ;
          — sur $]\ln 4,+\infty[$ : les deux facteurs positifs, produit positif.

          Donc $(C)$ est au-dessus de $(\Delta)$ sur $]-\infty,0[$ et $]\ln 4,+\infty[$, en dessous sur $]0,\ln 4[$ ; les deux se coupent aux points $(0,0)$ et $(\ln 4,\ln 4)$ (car $f(0)=0$ et $f(\ln 4)=\ln 4$).
        steps:
          - math: 'f(x) - x = x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-2\right), \qquad e^{\frac{x}{2}} > 0'
            note: "Le facteur e^{x/2} est toujours positif : le signe ne dépend que de x et de (e^{x/2}-2)."
          - math: 'e^{\frac{x}{2}} - 2 = 0 \iff \tfrac{x}{2} = \ln 2 \iff x = 2\ln 2 = \ln 4'
            note: "e^{x/2}-2 est positif si et seulement si x est supérieur à ln4 (passage au ln, exp strictement croissante)."
          - math: 'f(x)-x > 0 \text{ sur } ]-\infty,0[\,\cup\,]\ln 4,+\infty[\ ;\quad f(x)-x < 0 \text{ sur } ]0,\ln 4[\ ;\quad f(0)=0,\ f(\ln 4)=\ln 4'
            note: "(C) au-dessus de (Delta) sur les deux extrémités, en dessous sur l'intervalle intermédiaire ; contact en (0,0) et (ln4, ln4)."
      - id: q4a
        part: "Partie B — Dérivée et variations"
        stem: |-
          **(0,5 pt)** Montrer que pour tout $x$ de $\mathbb{R}$ : $f'(x) = \left(e^{\frac{x}{2}} - 1\right)^2 + x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}} - 1\right)$.
        reasoning: |-
          $f$ est un produit $f=u\,v$ avec $u(x)=x$ et $v(x)=\left(e^{\frac{x}{2}}-1\right)^2$. On dérive $v$ comme une composée : $v'(x) = 2\left(e^{\frac{x}{2}}-1\right)\cdot\frac{1}{2}e^{\frac{x}{2}} = e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right)$ (la dérivée de l'intérieur $e^{\frac{x}{2}}$ vaut $\frac{1}{2}e^{\frac{x}{2}}$, sans condition de signe puisque $e^{u}$ est dérivable partout, R3). La règle du produit $(uv)'=u'v+uv'$ donne alors directement l'expression demandée.
        steps:
          - math: 'u(x) = x,\quad v(x) = \left(e^{\frac{x}{2}}-1\right)^2,\qquad v''(x) = 2\left(e^{\frac{x}{2}}-1\right)\cdot\tfrac{1}{2}e^{\frac{x}{2}} = e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right)'
            note: "Dérivée de la composée (e^{x/2}-1) au carré : 2(e^{x/2}-1) fois la dérivée de l'intérieur, un demi e^{x/2}."
          - math: 'f''(x) = u''v + uv'' = \left(e^{\frac{x}{2}}-1\right)^2 + x\,e^{\frac{x}{2}}\left(e^{\frac{x}{2}}-1\right)'
            note: "Règle du produit (uv)' = u'v + uv'."
      - id: q4b
        stem: |-
          **(0,5 pt)** Vérifier que $x\left(e^{\frac{x}{2}} - 1\right) \ge 0$ pour tout $x$ de $\mathbb{R}$, puis en déduire le signe de la dérivée $f'$ sur $\mathbb{R}$.
        reasoning: |-
          Le facteur $e^{\frac{x}{2}}-1$ a le signe de $x$ : $e^{\frac{x}{2}}-1>0 \iff \frac{x}{2}>0 \iff x>0$ (exp strictement croissante, $e^0=1$). Donc $x$ et $e^{\frac{x}{2}}-1$ ont toujours le même signe, et leur produit $x\left(e^{\frac{x}{2}}-1\right)$ est $\ge 0$, nul seulement en $x=0$.

          On relit alors $f'(x) = \left(e^{\frac{x}{2}}-1\right)^2 + e^{\frac{x}{2}}\cdot x\left(e^{\frac{x}{2}}-1\right)$ : c'est une somme de deux termes positifs ou nuls — un carré, et $e^{\frac{x}{2}}>0$ multiplié par la quantité $\ge 0$ qu'on vient d'établir. Donc $f'(x)\ge 0$, nul uniquement en $x=0$ : $f$ est strictement croissante sur $\mathbb{R}$.
        steps:
          - math: 'e^{\frac{x}{2}} - 1 \text{ a le signe de } x \ \Rightarrow\ x\left(e^{\frac{x}{2}}-1\right) \ge 0'
            note: "x et e^{x/2}-1 changent de signe en même temps, en 0 : leur produit est positif ou nul."
          - math: 'f''(x) = \left(e^{\frac{x}{2}}-1\right)^2 + e^{\frac{x}{2}}\underbrace{\,x\left(e^{\frac{x}{2}}-1\right)\,}_{\ge\, 0} \ge 0'
            note: "Somme d'un carré et de e^{x/2} positif fois une quantité positive ou nulle : f prime est positive ou nulle, nulle seulement en 0."
