  # ── M3 · independant-egale-incompatible ─────────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M3-1
    rung: "R3"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, independance]
    stem: >
      $A$ et $B$ sont deux événements avec $P(A)=0{,}4$, $P(B)=0{,}5$ et
      $P(A \cap B)=0$. Laquelle de ces affirmations est vraie ?
    type: mcq
    choices:
      - id: A
        text: "$A$ et $B$ sont incompatibles mais PAS indépendants."
        correct: true
      - id: B
        text: "$A$ et $B$ sont indépendants car ils n'ont aucun lien."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          « Aucun lien » est la définition intuitive fausse de l'indépendance.
          Si $P(A \cap B)=0$ alors $P(B|A)=0 \neq 0{,}5=P(B)$ : savoir que $A$
          est réalisé modifie totalement la probabilité de $B$ (elle devient 0).
          C'est l'influence maximale — l'opposé de l'indépendance. Modèle
          erroné : « indépendants = incompatibles. »
      - id: C
        text: "$A$ et $B$ sont à la fois incompatibles et indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          C'est la fusion littérale des deux notions. Si $P(A)>0$ et $P(B)>0$,
          des événements incompatibles ne peuvent jamais être indépendants :
          $P(A \cap B)=0 \neq P(A) \cdot P(B)=0{,}2$. Modèle erroné :
          « indépendants = incompatibles. »
      - id: D
        text: "$A$ et $B$ sont indépendants car $P(A \\cap B)=0$."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
        also_reveals: [mc.math.sma_prob_conditionnelle.independant-egale-incompatible]
        feedback: >
          Ce raisonnement inverse : il conclut à l'indépendance parce que
          l'intersection est nulle. C'est exactement l'opposé — si
          $P(A \cap B)=0 \neq P(A) \cdot P(B)=0{,}2$, les événements sont
          dépendants (incompatibles). Modèle erroné : M4 (indépendants ⇒
          $P(A \cap B)=0$) doublé de la confusion M3.
    correct_feedback: >
      $P(A \cap B)=0$ signifie que $A$ et $B$ sont incompatibles (ils ne peuvent
      pas se réaliser ensemble). L'indépendance exigerait $P(A \cap B)=P(A) \cdot
      P(B)=0{,}2 \neq 0$ : ils sont donc dépendants. Incompatibilité et
      indépendance sont des notions opposées.
    solution: |
      **Test d'incompatibilité :** $P(A \cap B)=0$ ✓ → $A$ et $B$ sont incompatibles.

      **Test d'indépendance :** $P(A) \cdot P(B) = 0{,}4 \times 0{,}5 = 0{,}2 \neq 0 = P(A \cap B)$ → ils ne sont PAS indépendants.

      **Conclusion :** $A$ et $B$ sont incompatibles mais pas indépendants.

      **Principe clé :** si $P(A)>0$ et $P(B)>0$, des événements incompatibles
      sont toujours dépendants, car $P(B|A)=0 \neq P(B)$.

