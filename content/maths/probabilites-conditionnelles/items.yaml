          $B$ — il ne correspond à aucun calcul lié à ce qui est demandé.
    correct_feedback: >
      $P(D)=0{,}70 \times 0{,}02 + 0{,}30 \times 0{,}05 = 0{,}014+0{,}015=0{,}029$.
      Puis $P(A|D)=\tfrac{0{,}014}{0{,}029}\approx 0{,}483$.
    solution: |
