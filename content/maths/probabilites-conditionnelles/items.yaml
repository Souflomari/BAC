  # ── M7 · totales-sans-ponderation ───────────────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M7-1
    rung: "R4"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, probabilites_totales]
    stem: >
      On donne : $P(A)=0{,}6$, $P(B|A)=0{,}5$, $P(\bar{A})=0{,}4$,
      $P(B|\bar{A})=0{,}2$.
      Que vaut $P(B)$ par la formule des probabilités totales ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}38$"
        correct: true
      - id: B
        text: "$0{,}7$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.totales-sans-ponderation
        also_reveals: []
        feedback: >
          Ce choix additionne directement $P(B|A)+P(B|\bar{A})=0{,}5+0{,}2=
          0{,}7$ sans pondérer par les poids des branches. Or $0{,}7$ est en
          dehors de l'intervalle $[0{,}2\,;\,0{,}5]$ des taux partiels : $P(B)$
          doit nécessairement se trouver entre les deux taux. On pondère chaque
          conditionnel par la probabilité de sa branche : $0{,}6 \times 0{,}5 +
          0{,}4 \times 0{,}2 = 0{,}38$. Modèle erroné : « probabilités totales
          sans pondérer. »
      - id: C
        text: "$0{,}35$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.totales-sans-ponderation
        also_reveals: []
        feedback: >
          Ce choix calcule la moyenne simple $(0{,}5+0{,}2)/2=0{,}35$, une
          variante du même modèle erroné : on fait la moyenne non pondérée des
          taux conditionnels. Il faut pondérer par $P(A)=0{,}6$ et
          $P(\bar{A})=0{,}4$, qui ne sont pas égaux (sinon la moyenne simple
          serait juste). Modèle erroné : absence de pondération.
      - id: D
        text: "$0{,}10$"
        correct: false
        misconception: null
        feedback: >
          Ce résultat vient de soustraire $P(\bar{A})=0{,}4$ à $P(B|A)=0{,}5$
          ($0{,}5-0{,}4=0{,}1$) : on retranche un poids de branche à un taux
          conditionnel, deux grandeurs de natures différentes. Aucune formule
          des probabilités totales ne fait cela — il faut pondérer, pas
          soustraire.
    correct_feedback: >
      $P(B)=P(A) \cdot P(B|A)+P(\bar{A}) \cdot P(B|\bar{A}) = 0{,}6 \times
      0{,}5 + 0{,}4 \times 0{,}2 = 0{,}30 + 0{,}08 = 0{,}38$. Le résultat
      $0{,}38$ est bien compris entre $0{,}2$ et $0{,}5$, cohérent.
    solution: |
      **Loi des probabilités totales :**
      $$P(B) = P(A) \cdot P(B|A) + P(\bar{A}) \cdot P(B|\bar{A})$$
      $$= 0{,}6 \times 0{,}5 + 0{,}4 \times 0{,}2$$
      $$= 0{,}30 + 0{,}08 = 0{,}38$$

      **Vérification :** $0{,}2 \leq 0{,}38 \leq 0{,}5$ ✓ (compris entre les
      deux taux partiels).

