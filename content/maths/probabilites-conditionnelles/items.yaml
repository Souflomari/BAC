          d'événements incompatibles ; ici on cherche l'intersection
          d'événements indépendants, qui se multiplie. De plus,
          $\tfrac{3}{5} > \tfrac{3}{10}=P(R_1)$ : absurde, car la probabilité
          de deux événements simultanés ne peut dépasser l'un d'eux. Modèle
