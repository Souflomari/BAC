  # ── M8 · rebours-mauvais-denominateur ───────────────────────────────────────
  # Canonical (spec's distinguishing stem) — deux machines
  - id: PC-M8-1
    rung: "R5"
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, lecture_inverse, deux_machines]
    stem: >
      Une usine possède deux machines. $M_1$ fabrique $60\,\%$ des pièces avec
      un taux de pièces défectueuses de $5\,\%$ : $P(D|M_1)=0{,}05$. $M_2$
      fabrique $40\,\%$ des pièces avec $3\,\%$ de défectueux :
      $P(D|M_2)=0{,}03$. On prélève au hasard une pièce défectueuse.
      Quelle est la probabilité qu'elle provienne de $M_1$, c'est-à-dire
      $P(M_1|D)$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{5}{7}$"
        correct: true
      - id: B
        text: "$0{,}05$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.transpose-conditionnel
        also_reveals: [mc.math.sma_prob_conditionnelle.rebours-mauvais-denominateur]
        feedback: >
          Ce choix retourne $P(D|M_1)=0{,}05$, la probabilité qu'une pièce de
          $M_1$ soit défectueuse — c'est le conditionnel inverse de ce qui est
          demandé. Deux modèles erronés convergent ici : M1 (lire
          $P(D|M_1)$ comme $P(M_1|D)$) et M8 (oublier de calculer le bon
          dénominateur $P(D)$). On cherche $P(M_1|D)=P(M_1 \cap D)/P(D)$.
      - id: C
        text: "$0{,}6$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.rebours-mauvais-denominateur
        also_reveals: []
        feedback: >
          Ce choix retourne $P(M_1)=0{,}6$, la part de production de $M_1$,
          ignorant l'information apportée par le défaut. C'est utiliser $P(M_1)$
          comme dénominateur au lieu de $P(D)$. « Sachant $D$ » impose de
          restreindre l'univers à $D$ entier — la somme de toutes les feuilles
          où $D$ se réalise. Modèle erroné : mauvais dénominateur dans la
          lecture inverse.
      - id: D
        text: "$0{,}03$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne $P(D|M_2)=0{,}03$, le taux de défaut de $M_2$, qui
          n'est pas lié à $P(M_1|D)$.
    correct_feedback: >
      $P(M_1 \cap D)=0{,}60 \times 0{,}05=0{,}030$. $P(M_2 \cap D)=0{,}40
      \times 0{,}03=0{,}012$. $P(D)=0{,}030+0{,}012=0{,}042$. Donc
      $P(M_1|D)=\tfrac{0{,}030}{0{,}042}=\tfrac{5}{7}\approx 0{,}71$.
    solution: |
      **Étape 1 — Feuilles de l'arbre :**
      $$P(M_1 \cap D) = 0{,}60 \times 0{,}05 = 0{,}030$$
      $$P(M_2 \cap D) = 0{,}40 \times 0{,}03 = 0{,}012$$

      **Étape 2 — Assembler $P(D)$ (dénominateur correct) :**
      $$P(D) = P(M_1 \cap D) + P(M_2 \cap D) = 0{,}030 + 0{,}012 = 0{,}042$$

      **Étape 3 — Lecture inverse :**
      $$P(M_1|D) = \frac{P(M_1 \cap D)}{P(D)} = \frac{0{,}030}{0{,}042} = \frac{5}{7} \approx 0{,}714$$

      Le dénominateur est $P(D)=0{,}042$, pas $P(M_1)=0{,}60$ ni $P(D|M_1)=0{,}05$.

