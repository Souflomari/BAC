notion: probabilites-conditionnelles
skill_code: sma_prob_conditionnelle   # proposed; supabase-architect reconciles at step 7

misconceptions:
  - id: mc.math.sma_prob_conditionnelle.transpose-conditionnel
    label: "« P(A|B) et P(B|A) sont la même chose »"
    description: "L'élève traite la probabilité conditionnelle comme symétrique : il lit $P(B|A)$ et $P(A|B)$ comme interchangeables, car « la probabilité de A et B ensemble » lui semble indépendante de l'ordre, comme $A \\cap B$. La barre est lue « et » au lieu de « sachant que »."
    contradicts_principle: "$P(B|A) = \\dfrac{P(A \\cap B)}{P(A)}$ et $P(A|B) = \\dfrac{P(A \\cap B)}{P(B)}$ partagent le même numérateur mais ont des dénominateurs différents. Elles sont égales seulement si $P(A)=P(B)$. L'événement conditionneur est le dénominateur — « sachant B » signifie restreindre l'univers à $B$ puis mesurer $A$ à l'intérieur."

  - id: mc.math.sma_prob_conditionnelle.conditionnelle-egale-intersection
    label: "« P(A|B) = P(A∩B) »"
    description: "L'élève confond la probabilité conditionnelle avec la probabilité conjointe — il omet la division par $P(B)$. « Sachant B » et « et B » s'effondrent en une seule idée : les deux semblent signifier « A et B se réalisent »."
    contradicts_principle: "La probabilité conditionnelle renormalise à l'événement conditionneur : $P(A|B) = \\dfrac{P(A \\cap B)}{P(B)}$. La conjointe $P(A \\cap B)$ est mesurée dans l'univers entier $\\Omega$ ; la conditionnelle est mesurée dans l'univers restreint $B$. Diviser par $P(B)$ est l'acte qui réduit l'univers à $B$."

  - id: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
    label: "« Indépendants = incompatibles »"
    description: "L'élève fusionne les deux relations introduites successivement dans le cours. « Indépendant » (sans influence) et « incompatible / disjoint » (ne peuvent se réaliser ensemble) sont entendus comme des synonymes de « séparés, sans lien »."
    contradicts_principle: "Ce sont des notions opposées. Incompatibles : $A \\cap B = \\emptyset$, donc $P(A \\cap B)=0$. Savoir que $A$ est réalisé signifie que $B$ ne peut pas l'être — c'est une influence maximale, l'opposé de l'indépendance. Indépendants : $P(A \\cap B)=P(A) \\cdot P(B)$. Deux événements de probabilité non nulle ne peuvent pas être à la fois incompatibles et indépendants."

  - id: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
    label: "« Indépendants ⇒ P(A∩B) = 0 »"
    description: "L'élève croit que l'indépendance signifie que les événements ne se chevauchent pas, donc $P(A \\cap B)=0$. C'est une conséquence opératoire séparable de la fusion conceptuelle M3 : un élève peut tenir M4 (« les choses indépendantes ne se croisent pas ») même s'il est flou sur le mot « incompatible »."
    contradicts_principle: "Des événements indépendants de probabilité non nulle doivent se chevaucher : $P(A \\cap B)=P(A) \\cdot P(B) \\neq 0$. L'indépendance concerne la valeur du chevauchement (elle est égale au produit), pas l'absence de chevauchement."

  - id: mc.math.sma_prob_conditionnelle.independant-somme
    label: "« Indépendants ⇒ P(A∩B) = P(A) + P(B) »"
    description: "L'élève connaît l'idée qu'il existe une formule pour l'indépendance, mais récupère la mauvaise opération — il additionne au lieu de multiplier. L'addition vient d'une contamination par la formule des événements incompatibles $P(A \\cup B)=P(A)+P(B)$ : le « + » de l'union se propage sur l'intersection."
    contradicts_principle: "Pour des événements indépendants, l'intersection se multiplie : $P(A \\cap B)=P(A) \\cdot P(B)$. L'addition s'applique à l'union d'événements incompatibles. Deux opérations différentes, deux relations différentes, deux opérations ensemblistes différentes ($\\cap$ vs $\\cup$). De plus, $P(A \\cap B) \\leq \\min(P(A), P(B))$ toujours — une somme qui dépasse chaque terme est absurde."

  - id: mc.math.sma_prob_conditionnelle.arbre-additionne-branche
    label: "« On additionne le long d'une branche : P(A∩B) = P(A) + P(B|A) »"
    description: "En lisant un arbre pondéré, l'élève additionne les deux probabilités des arêtes le long d'un chemin racine-à-feuille au lieu de les multiplier. La représentation visuelle « descendre deux étapes » se lit comme « accumuler / additionner », à la façon dont des distances s'additionnent."
    contradicts_principle: "Le long d'une branche, on multiplie (la règle composée $P(A \\cap B)=P(A) \\cdot P(B|A)$ est exactement « la chaîne des étapes conditionnelles ») ; entre les branches / sur les feuilles, on additionne (la somme des probabilités totales). Multiplier en descendant, additionner en travers. Le produit est juste car chaque arête est une proportion conditionnelle de ce qui est arrivé au nœud au-dessus."

  - id: mc.math.sma_prob_conditionnelle.totales-sans-ponderation
    label: "« Probabilités totales sans pondérer : P(B) = P(B|A) + P(B|Ā) »"
    description: "En appliquant la loi des probabilités totales, l'élève somme directement les probabilités conditionnelles, oubliant de pondérer chacune par la probabilité de sa branche. La structure $P(B)=\\sum\\ldots$ est mémorisée, mais le facteur $P(A_i) \\cdot$ est oublié."
    contradicts_principle: "$P(B)=P(A) \\cdot P(B|A)+P(\\bar{A}) \\cdot P(B|\\bar{A})$ — chaque conditionnelle est pondérée par la fréquence de sa branche. On ne peut pas faire la moyenne de deux taux sans pondérer par la taille de la population. Et les poids doivent provenir d'une partition ($A \\cup \\bar{A}=\\Omega$, $A \\cap \\bar{A}=\\emptyset$, somme des $P(A_i)=1$)."

  - id: mc.math.sma_prob_conditionnelle.rebours-mauvais-denominateur
    label: "« Lecture inverse de l'arbre : mauvais dénominateur pour P(A|B) »"
    description: "En lisant l'arbre à rebours pour obtenir $P(A|B)$, l'élève divise la feuille favorable par le mauvais dénominateur — typiquement $P(A)$ (la branche en avant qu'il a descendue) au lieu de $P(B)$ (la somme de toutes les feuilles où $B$ se réalise). Il normalise par rapport à la cause au lieu de l'effet observé."
    contradicts_principle: "$P(A|B)=\\dfrac{P(A \\cap B)}{P(B)}$, et $P(B)$ doit être assemblé à partir de l'arbre entier par la loi des probabilités totales ($P(B)=P(A \\cap B)+P(\\bar{A} \\cap B)$, la somme de chaque feuille où $B$ se réalise). Le dénominateur est l'événement observé $B$ (toutes les façons dont il a pu se produire), pas le seul chemin en question."

items:

  # ── M1 · transpose-conditionnel ─────────────────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M1-1
    rung: "R5"
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, depistage_medical]
    stem: >
      Une maladie touche $1\,\%$ de la population. Un test détecte $95\,\%$ des
      malades : $P(T^+|M)=0{,}95$. Il donne aussi $10\,\%$ de faux positifs :
      $P(T^+|\bar{M})=0{,}10$. Une personne est testée positive.
      Quelle est $P(M|T^+)$, la probabilité qu'elle soit réellement malade ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 0{,}09$"
        correct: true
      - id: B
        text: "$0{,}95$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.transpose-conditionnel
        also_reveals: []
        feedback: >
          Ce choix confond $P(M|T^+)$ avec $P(T^+|M)=0{,}95$, qui est la
          sensibilité du test — la probabilité d'un test positif sachant qu'on
          est malade. On cherche l'inverse : la probabilité d'être malade sachant
          que le test est positif. Ce sont deux conditionnelles différentes car
          leurs dénominateurs sont différents ($P(T^+)$ vs $P(M)$). Modèle
          erroné : « $P(A|B)$ et $P(B|A)$ sont la même chose. »
      - id: C
        text: "$0{,}50$"
        correct: false
        misconception: null
        feedback: >
          Ce choix ignore toute l'information numérique et suppose une
          probabilité « fifty-fifty ». Il ne correspond à aucun calcul structuré.
      - id: D
        text: "$0{,}01$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne simplement $P(M)=0{,}01$, la prévalence de la
          maladie, sans tenir compte du résultat du test. Il ignore l'information
          apportée par le test positif.
    correct_feedback: >
      On construit l'arbre : $P(M \cap T^+)=0{,}01 \times 0{,}95=0{,}0095$ et
      $P(\bar{M} \cap T^+)=0{,}99 \times 0{,}10=0{,}099$. Donc
      $P(T^+)=0{,}0095+0{,}099=0{,}1085$. Puis
      $P(M|T^+)=\tfrac{0{,}0095}{0{,}1085}\approx 0{,}09$. La plupart des
      positifs viennent de la grande population saine, ce qui dilue fortement
      la valeur prédictive positive.
    solution: |
      **Données :** $P(M)=0{,}01$, $P(\bar{M})=0{,}99$, $P(T^+|M)=0{,}95$,
      $P(T^+|\bar{M})=0{,}10$.

      **Étape 1 — Calculer les feuilles de l'arbre :**
      $$P(M \cap T^+) = P(M) \times P(T^+|M) = 0{,}01 \times 0{,}95 = 0{,}0095$$
      $$P(\bar{M} \cap T^+) = P(\bar{M}) \times P(T^+|\bar{M}) = 0{,}99 \times 0{,}10 = 0{,}099$$

      **Étape 2 — Probabilités totales (assembler $P(T^+)$) :**
      $$P(T^+) = 0{,}0095 + 0{,}099 = 0{,}1085$$

      **Étape 3 — Lecture inverse (sachant $T^+$, remonter vers $M$) :**
      $$P(M|T^+) = \frac{P(M \cap T^+)}{P(T^+)} = \frac{0{,}0095}{0{,}1085} \approx 0{,}0875 \approx 0{,}09$$

      Le résultat est $\approx 9\,\%$, très loin de la sensibilité $95\,\%$. La
      grande majorité des tests positifs viennent des $99\,\%$ de personnes
      saines, même si le taux de faux positifs n'est que $10\,\%$.

  # Variant 2 — M1 : contexte urne (sans inversée notée explicitement)
  - id: PC-M1-2
    rung: "R5"
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, depistage_medical]
    stem: >
      Un laboratoire fabrique des vaccins par deux procédés. Le procédé $A$
      produit $70\,\%$ des lots ; $2\,\%$ de ses lots sont défectueux :
      $P(D|A)=0{,}02$. Le procédé $B$ produit $30\,\%$ des lots ; $5\,\%$ de
      ses lots sont défectueux : $P(D|B)=0{,}05$. Un lot défectueux est
      découvert. Quelle est la probabilité qu'il provienne du procédé $A$,
      c'est-à-dire $P(A|D)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}02$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.transpose-conditionnel
        also_reveals: []
        feedback: >
          Ce choix retourne $P(D|A)=0{,}02$, la probabilité qu'un lot du
          procédé $A$ soit défectueux — l'inverse de ce qui est demandé.
          $P(A|D)$ et $P(D|A)$ ont le même numérateur $P(A \cap D)$ mais des
          dénominateurs différents ($P(D)$ vs $P(A)$). Modèle erroné :
          « $P(A|B)$ et $P(B|A)$ sont la même chose. »
      - id: B
        text: "$\\approx 0{,}48$"
        correct: true
      - id: C
        text: "$0{,}70$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.rebours-mauvais-denominateur
        also_reveals: [mc.math.sma_prob_conditionnelle.transpose-conditionnel]
        feedback: >
          Ce choix retourne $P(A)=0{,}70$, la proportion du procédé $A$ dans la
          production totale — il ignore l'information apportée par le fait que le
          lot soit défectueux. Le dénominateur doit être $P(D)$, pas $P(A)$.
          Modèle erroné : mauvais dénominateur dans la lecture inverse.
      - id: D
        text: "$0{,}05$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne $P(D|B)=0{,}05$, le taux de défectueux du procédé
          $B$ — il ne correspond à aucun calcul lié à ce qui est demandé.
    correct_feedback: >
      $P(D)=0{,}70 \times 0{,}02 + 0{,}30 \times 0{,}05 = 0{,}014+0{,}015=0{,}029$.
      Puis $P(A|D)=\tfrac{0{,}014}{0{,}029}\approx 0{,}483$.
    solution: |
      **Données :** $P(A)=0{,}70$, $P(B)=0{,}30$, $P(D|A)=0{,}02$, $P(D|B)=0{,}05$.

      **Étape 1 — Feuilles de l'arbre :**
      $$P(A \cap D) = 0{,}70 \times 0{,}02 = 0{,}014$$
      $$P(B \cap D) = 0{,}30 \times 0{,}05 = 0{,}015$$

      **Étape 2 — Probabilités totales :**
      $$P(D) = 0{,}014 + 0{,}015 = 0{,}029$$

      **Étape 3 — Lecture inverse :**
      $$P(A|D) = \frac{P(A \cap D)}{P(D)} = \frac{0{,}014}{0{,}029} = \frac{14}{29} \approx 0{,}483$$

  # Variant 3 — M1 : filtre anti-spam, contexte différent
  - id: PC-M1-3
    rung: "R7"
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, variation_fraiche]
    stem: >
      Un filtre anti-spam analyse les courriels. $20\,\%$ des courriels reçus
      sont des spams. Le filtre détecte $90\,\%$ des spams (il les classe
      « spam ») : $P(C|S)=0{,}90$. Il classe aussi incorrectement $5\,\%$ des
      courriels légitimes comme spam : $P(C|\bar{S})=0{,}05$. Un courriel est
      classé « spam » par le filtre. Quelle est la probabilité qu'il soit
      réellement un spam, c'est-à-dire $P(S|C)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}90$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.transpose-conditionnel
        also_reveals: []
        feedback: >
          Ce choix retourne $P(C|S)=0{,}90$, la sensibilité du filtre — la
          probabilité qu'un spam soit classé spam. On cherche $P(S|C)$, la
          probabilité inverse : qu'un courriel classé spam soit réellement un
          spam. Ce sont deux conditionnelles distinctes. Modèle erroné :
          « $P(A|B)$ et $P(B|A)$ sont la même chose. »
      - id: B
        text: "$0{,}20$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne $P(S)=0{,}20$, la prévalence des spams, sans
          tenir compte du classement du filtre.
      - id: C
        text: "$\\approx 0{,}82$"
        correct: true
      - id: D
        text: "$0{,}05$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne $P(C|\bar{S})=0{,}05$, le taux de faux positifs du
          filtre sur les courriels légitimes — ce n'est pas ce qui est demandé.
    correct_feedback: >
      $P(C)=0{,}20 \times 0{,}90 + 0{,}80 \times 0{,}05 = 0{,}18+0{,}04=0{,}22$.
      $P(S|C)=\tfrac{0{,}18}{0{,}22}=\tfrac{9}{11}\approx 0{,}818$.
    solution: |
      **Données :** $P(S)=0{,}20$, $P(\bar{S})=0{,}80$, $P(C|S)=0{,}90$,
      $P(C|\bar{S})=0{,}05$.

      **Étape 1 — Feuilles :**
      $$P(S \cap C) = 0{,}20 \times 0{,}90 = 0{,}18$$
      $$P(\bar{S} \cap C) = 0{,}80 \times 0{,}05 = 0{,}04$$

      **Étape 2 — Probabilités totales :**
      $$P(C) = 0{,}18 + 0{,}04 = 0{,}22$$

      **Étape 3 — Lecture inverse :**
      $$P(S|C) = \frac{0{,}18}{0{,}22} = \frac{9}{11} \approx 0{,}818$$

  # ── M2 · conditionnelle-egale-intersection ──────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M2-1
    rung: "R1"
    difficulty_level: 2
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, definition]
    stem: >
      On donne $P(A \cap B)=0{,}3$ et $P(B)=0{,}5$.
      Que vaut $P(A|B)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}6$"
        correct: true
      - id: B
        text: "$0{,}3$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.conditionnelle-egale-intersection
        also_reveals: []
        feedback: >
          Ce choix retourne $P(A \cap B)=0{,}3$ sans diviser par $P(B)$. La
          probabilité conjointe et la probabilité conditionnelle ont le même
          numérateur mais des dénominateurs différents : la conjointe rapporte à
          $\Omega$ entier, la conditionnelle rapporte uniquement à $B$. Il faut
          diviser par $P(B)=0{,}5$ pour restreindre l'univers. Modèle erroné :
          « $P(A|B) = P(A \cap B)$. »
      - id: C
        text: "$0{,}8$"
        correct: false
        misconception: null
        feedback: >
          Ce choix additionne $P(A \cap B)+P(B)=0{,}3+0{,}5=0{,}8$. L'addition
          n'a pas de sens ici ; la définition est $P(A|B)=P(A \cap B)/P(B)$.
      - id: D
        text: "$0{,}15$"
        correct: false
        misconception: null
        feedback: >
          Ce choix calcule $P(A \cap B) \times P(B) = 0{,}3 \times 0{,}5=0{,}15$,
          un produit au lieu d'un quotient. On divise, on ne multiplie pas.
    correct_feedback: >
      $P(A|B) = \dfrac{P(A \cap B)}{P(B)} = \dfrac{0{,}3}{0{,}5} = 0{,}6$.
      « Sachant $B$ » signifie restreindre l'univers à $B$ : on divise
      le numérateur $P(A \cap B)$ par la taille de ce nouvel univers $P(B)$.
    solution: |
      **Application directe de la définition :**
      $$P(A|B) = \frac{P(A \cap B)}{P(B)} = \frac{0{,}3}{0{,}5} = 0{,}6$$

      **Vérification de cohérence :** $0{,}6 > 0{,}3 = P(A \cap B)$, ce qui
      est normal car on a restreint l'univers à $B$ (qui est plus petit que
      $\Omega$), donc la proportion augmente.

  # Variant 2 — M2 : contexte classe / sportifs
  - id: PC-M2-2
    rung: "R1"
    difficulty_level: 2
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, definition]
    stem: >
      Dans une classe, $60\,\%$ des élèves sont sportifs ($P(S)=0{,}6$) et
      $24\,\%$ sont à la fois sportifs et membres du club de maths
      ($P(S \cap M)=0{,}24$). Quelle est la probabilité qu'un élève soit
      membre du club de maths, sachant qu'il est sportif, c'est-à-dire
      $P(M|S)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}24$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.conditionnelle-egale-intersection
        also_reveals: []
        feedback: >
          Ce choix retourne $P(S \cap M)=0{,}24$, la fraction de toute la classe
          qui est à la fois sportive et membre du club. Mais on cherche la
          fraction des sportifs qui sont au club — il faut ramener l'univers aux
          sportifs, donc diviser par $P(S)=0{,}6$. Modèle erroné :
          « $P(M|S) = P(S \cap M)$. »
      - id: B
        text: "$0{,}40$"
        correct: true
      - id: C
        text: "$0{,}84$"
        correct: false
        misconception: null
        feedback: >
          Ce choix additionne $P(S)+P(S \cap M)=0{,}6+0{,}24=0{,}84$. La
          définition requiert une division, pas une addition.
      - id: D
        text: "$0{,}144$"
        correct: false
        misconception: null
        feedback: >
          Ce choix multiplie $P(S) \times P(S \cap M) = 0{,}6 \times 0{,}24$.
          On divise $P(S \cap M)$ par $P(S)$, on ne les multiplie pas.
    correct_feedback: >
      $P(M|S) = \dfrac{P(S \cap M)}{P(S)} = \dfrac{0{,}24}{0{,}6} = 0{,}4$.
      Parmi les $60\,\%$ de sportifs, $24\,\%$ de la classe entière sont aussi
      au club — soit $40\,\%$ des sportifs.
    solution: |
      **On restreint l'univers aux sportifs :**
      $$P(M|S) = \frac{P(S \cap M)}{P(S)} = \frac{0{,}24}{0{,}6} = 0{,}40$$

  # Variant 3 — M2 : nombres différents, contexte production
  - id: PC-M2-3
    rung: "R2"
    difficulty_level: 2
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, definition]
    stem: >
      Une usine produit des pièces. On sait que $P(B)=0{,}4$ (probabilité que
      la pièce provienne de la machine $B$) et $P(B \cap D)=0{,}12$ (probabilité
      qu'une pièce provienne de $B$ et soit défectueuse). Que vaut $P(D|B)$,
      la probabilité qu'une pièce soit défectueuse sachant qu'elle vient de $B$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}52$"
        correct: false
        misconception: null
        feedback: >
          Ce choix additionne $P(B)+P(B \cap D)=0{,}4+0{,}12=0{,}52$. La
          définition de la probabilité conditionnelle requiert une division.
      - id: B
        text: "$0{,}12$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.conditionnelle-egale-intersection
        also_reveals: []
        feedback: >
          Ce choix retourne $P(B \cap D)=0{,}12$ directement. C'est la
          probabilité qu'une pièce soit simultanément de $B$ et défectueuse —
          mesurée dans l'univers entier. On cherche la proportion de défectueux
          parmi les pièces de $B$ seulement, donc on divise par $P(B)=0{,}4$.
          Modèle erroné : « $P(D|B) = P(B \cap D)$. »
      - id: C
        text: "$0{,}30$"
        correct: true
      - id: D
        text: "$0{,}048$"
        correct: false
        misconception: null
        feedback: >
          Ce choix multiplie $P(B) \times P(B \cap D)=0{,}4 \times 0{,}12$.
          On divise, on ne multiplie pas.
    correct_feedback: >
      $P(D|B) = \dfrac{P(B \cap D)}{P(B)} = \dfrac{0{,}12}{0{,}4} = 0{,}30$.
    solution: |
      $$P(D|B) = \frac{P(B \cap D)}{P(B)} = \frac{0{,}12}{0{,}4} = 0{,}30$$

  # ── M3 · independant-egale-incompatible ─────────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M3-1
    rung: "R3"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, independance]
    stem: >
      $A$ et $B$ sont deux événements avec $P(A)=0{,}4$, $P(B)=0{,}5$ et
      $P(A \cap B)=0$. Laquelle de ces affirmations est vraie ?
    type: mcq
    choices:
      - id: A
        text: "$A$ et $B$ sont incompatibles mais PAS indépendants."
        correct: true
      - id: B
        text: "$A$ et $B$ sont indépendants car ils n'ont aucun lien."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          « Aucun lien » est la définition intuitive fausse de l'indépendance.
          Si $P(A \cap B)=0$ alors $P(B|A)=0 \neq 0{,}5=P(B)$ : savoir que $A$
          est réalisé modifie totalement la probabilité de $B$ (elle devient 0).
          C'est l'influence maximale — l'opposé de l'indépendance. Modèle
          erroné : « indépendants = incompatibles. »
      - id: C
        text: "$A$ et $B$ sont à la fois incompatibles et indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          C'est la fusion littérale des deux notions. Si $P(A)>0$ et $P(B)>0$,
          des événements incompatibles ne peuvent jamais être indépendants :
          $P(A \cap B)=0 \neq P(A) \cdot P(B)=0{,}2$. Modèle erroné :
          « indépendants = incompatibles. »
      - id: D
        text: "$A$ et $B$ sont indépendants car $P(A \\cap B)=0$."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
        also_reveals: [mc.math.sma_prob_conditionnelle.independant-egale-incompatible]
        feedback: >
          Ce raisonnement inverse : il conclut à l'indépendance parce que
          l'intersection est nulle. C'est exactement l'opposé — si
          $P(A \cap B)=0 \neq P(A) \cdot P(B)=0{,}2$, les événements sont
          dépendants (incompatibles). Modèle erroné : M4 (indépendants ⇒
          $P(A \cap B)=0$) doublé de la confusion M3.
    correct_feedback: >
      $P(A \cap B)=0$ signifie que $A$ et $B$ sont incompatibles (ils ne peuvent
      pas se réaliser ensemble). L'indépendance exigerait $P(A \cap B)=P(A) \cdot
      P(B)=0{,}2 \neq 0$ : ils sont donc dépendants. Incompatibilité et
      indépendance sont des notions opposées.
    solution: |
      **Test d'incompatibilité :** $P(A \cap B)=0$ ✓ → $A$ et $B$ sont incompatibles.

      **Test d'indépendance :** $P(A) \cdot P(B) = 0{,}4 \times 0{,}5 = 0{,}2 \neq 0 = P(A \cap B)$ → ils ne sont PAS indépendants.

      **Conclusion :** $A$ et $B$ sont incompatibles mais pas indépendants.

      **Principe clé :** si $P(A)>0$ et $P(B)>0$, des événements incompatibles
      sont toujours dépendants, car $P(B|A)=0 \neq P(B)$.

  # Variant 2 — M3 : dé à 6 faces, contexte différent
  - id: PC-M3-2
    rung: "R3"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, independance]
    stem: >
      On lance un dé équilibré à 6 faces. Soit $A=\{2\}$ (obtenir un 2) et
      $B=\{5\}$ (obtenir un 5). Sachant que $A$ s'est réalisé, que vaut
      $P(B|A)$ ? Que peut-on conclure sur l'indépendance de $A$ et $B$ ?
    type: mcq
    choices:
      - id: A
        text: "$P(B|A) = \\dfrac{1}{6}$, donc $A$ et $B$ sont indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          Si on a obtenu un 2, il est impossible d'avoir obtenu un 5 sur le même
          lancer : $P(B|A)=0$, pas $\tfrac{1}{6}$. $A$ et $B$ sont incompatibles
          (disjoints), ce qui les rend fortement dépendants, pas indépendants.
          Modèle erroné : « incompatibles = indépendants. »
      - id: B
        text: "$P(B|A) = 0$, donc $A$ et $B$ sont indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          $P(B|A)=0$ est juste, mais la conclusion est fausse. $P(B|A)=0 \neq
          \tfrac{1}{6}=P(B)$ : savoir que $A$ est réalisé a changé la
          probabilité de $B$ (de $\tfrac{1}{6}$ à $0$). C'est de la dépendance,
          pas de l'indépendance. Modèle erroné : confondre « aucune coréalisation
          possible » avec « aucune influence ».
      - id: C
        text: "$P(B|A) = 0$, donc $A$ et $B$ sont dépendants (incompatibles)."
        correct: true
      - id: D
        text: "$P(B|A) = \\dfrac{1}{6}$, donc $A$ et $B$ sont dépendants."
        correct: false
        misconception: null
        feedback: >
          $P(B|A) \neq \tfrac{1}{6}$. Si on a obtenu un 2, la probabilité
          d'avoir obtenu un 5 est $0$, pas $\tfrac{1}{6}$.
    correct_feedback: >
      $A \cap B = \emptyset$, donc $P(B|A)=0$. Or $P(B)=\tfrac{1}{6} \neq 0$.
      Connaître $A$ change radicalement la probabilité de $B$ : ils sont
      dépendants (incompatibles). L'incompatibilité est l'opposé de
      l'indépendance.
    solution: |
      **$A \cap B = \{2\} \cap \{5\} = \emptyset$** : les événements sont incompatibles.

      $$P(B|A) = \frac{P(A \cap B)}{P(A)} = \frac{0}{1/6} = 0$$

      **Test d'indépendance :** $P(B|A) = 0 \neq \dfrac{1}{6} = P(B)$ → dépendants.

      Les événements incompatibles (de probabilité non nulle) sont toujours
      dépendants : savoir que l'un s'est réalisé exclut totalement l'autre.

  # Variant 3 — M3 : deux urnes, contexte structurellement différent
  - id: PC-M3-3
    rung: "R3"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, independance]
    stem: >
      On considère deux événements $A$ et $B$ tels que $P(A)=0{,}3$,
      $P(B)=0{,}4$ et $P(A \cup B)=0{,}7$. Calculer $P(A \cap B)$ puis
      déterminer si $A$ et $B$ sont indépendants ou incompatibles.
    type: mcq
    choices:
      - id: A
        text: "$P(A \\cap B)=0$ ; $A$ et $B$ sont incompatibles et indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          $P(A \cap B) = P(A)+P(B)-P(A \cup B) = 0{,}3+0{,}4-0{,}7=0$. Le
          calcul de $P(A \cap B)=0$ est correct : $A$ et $B$ sont bien
          incompatibles. Mais ils ne sont pas indépendants : $P(A) \cdot P(B)=
          0{,}12 \neq 0$. Incompatibilité et indépendance sont des notions
          opposées. Modèle erroné : « incompatibles = indépendants ».
      - id: B
        text: "$P(A \\cap B)=0$ ; $A$ et $B$ sont incompatibles mais PAS indépendants."
        correct: true
      - id: C
        text: "$P(A \\cap B)=0{,}12$ ; $A$ et $B$ sont indépendants."
        correct: false
        misconception: null
        feedback: >
          $P(A \cap B) = P(A)+P(B)-P(A \cup B) = 0{,}3+0{,}4-0{,}7=0$, pas
          $0{,}12$. Le calcul de l'intersection est incorrect ici.
      - id: D
        text: "$P(A \\cap B)=0{,}12$ ; $A$ et $B$ sont dépendants."
        correct: false
        misconception: null
        feedback: >
          $P(A \cap B) = 0{,}3+0{,}4-0{,}7=0 \neq 0{,}12$. Le calcul est
          incorrect.
    correct_feedback: >
      $P(A \cap B)=P(A)+P(B)-P(A \cup B)=0{,}3+0{,}4-0{,}7=0$ : $A$ et $B$
      sont incompatibles. Test d'indépendance : $P(A) \cdot P(B)=0{,}12 \neq 0$,
      donc ils ne sont pas indépendants.
    solution: |
      **Calcul de $P(A \cap B)$ par la formule de l'union :**
      $$P(A \cap B) = P(A)+P(B)-P(A \cup B) = 0{,}3+0{,}4-0{,}7 = 0$$

      → $A$ et $B$ sont incompatibles ($A \cap B = \emptyset$).

      **Test d'indépendance :**
      $$P(A) \cdot P(B) = 0{,}3 \times 0{,}4 = 0{,}12 \neq 0 = P(A \cap B)$$

      → $A$ et $B$ ne sont PAS indépendants.

      **Conclusion :** incompatibles et dépendants — les deux propriétés ne
      peuvent pas coexister pour des événements de probabilité non nulle.

  # ── M4 · independant-implique-intersection-nulle ────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M4-1
    rung: "R3"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, independance]
    stem: >
      $A$ et $B$ sont deux événements indépendants avec $P(A)=0{,}4$ et
      $P(B)=0{,}5$. Que vaut $P(A \cap B)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}2$"
        correct: true
      - id: B
        text: "$0$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
        also_reveals: []
        feedback: >
          Ce choix suppose que des événements indépendants ne se chevauchent
          pas, donc $P(A \cap B)=0$. Mais l'indépendance porte sur la valeur du
          chevauchement (elle égale le produit $P(A) \cdot P(B)$), pas sur
          l'absence de chevauchement. Exemple : lancer deux pièces —
          « pile au 1er lancer » et « pile au 2e lancer » sont indépendants, et
          on peut obtenir deux piles. Modèle erroné : « indépendants ⇒
          $P(A \cap B)=0$. »
      - id: C
        text: "$0{,}9$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-somme
        also_reveals: []
        feedback: >
          Ce choix additionne $P(A)+P(B)=0{,}4+0{,}5=0{,}9$. L'addition
          s'applique à l'union d'événements incompatibles, pas à l'intersection
          d'événements indépendants. Pour des indépendants, on multiplie.
          Modèle erroné : « indépendants ⇒ $P(A \cap B)=P(A)+P(B)$. »
      - id: D
        text: "$0{,}1$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne $|P(A)-P(B)|=|0{,}4-0{,}5|=0{,}1$, une différence
          qui n'a pas de signification probabiliste ici. La formule de
          l'indépendance est $P(A \cap B)=P(A) \cdot P(B)$.
    correct_feedback: >
      Par définition de l'indépendance : $P(A \cap B)=P(A) \cdot P(B) =
      0{,}4 \times 0{,}5 = 0{,}2$. L'intersection n'est pas nulle — les deux
      événements peuvent se réaliser ensemble, et ils le font avec probabilité
      $0{,}2$.
    solution: |
      **Définition de l'indépendance :**
      $$A \text{ et } B \text{ indépendants} \iff P(A \cap B) = P(A) \cdot P(B)$$

      **Application :**
      $$P(A \cap B) = 0{,}4 \times 0{,}5 = 0{,}2$$

      **Vérification de cohérence :** $0{,}2 \leq \min(0{,}4; 0{,}5)=0{,}4$ ✓
      (l'intersection ne peut dépasser ni l'un ni l'autre des événements).

  # Variant 2 — M4 : deux pièces, contexte concret
  - id: PC-M4-2
    rung: "R3"
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, independance]
    stem: >
      On lance deux pièces de monnaie équilibrées. Soit $A$ = « la première
      pièce tombe sur pile » et $B$ = « la deuxième pièce tombe sur pile ».
      $A$ et $B$ sont indépendants avec $P(A)=P(B)=\tfrac{1}{2}$.
      Quelle est $P(A \cap B)$, la probabilité d'obtenir deux piles ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{1}{4}$"
        correct: true
      - id: B
        text: "$0$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
        also_reveals: []
        feedback: >
          Obtenir deux piles est clairement possible ! L'indépendance ne
          signifie pas que les événements ne peuvent pas se co-réaliser — elle
          signifie que la réalisation de l'un n'influence pas l'autre. On peut
          obtenir pile-pile avec probabilité $\tfrac{1}{2} \times \tfrac{1}{2}=
          \tfrac{1}{4}$. Modèle erroné : « indépendants ⇒ $P(A \cap B)=0$. »
      - id: C
        text: "$1$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-somme
        also_reveals: []
        feedback: >
          Ce choix additionne $\tfrac{1}{2}+\tfrac{1}{2}=1$, ce qui est
          absurde : obtenir deux piles n'est pas certain. L'addition s'applique
          à l'union d'événements incompatibles ; pour des indépendants on
          multiplie. Modèle erroné : addition au lieu de multiplication.
      - id: D
        text: "$\\dfrac{1}{2}$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne $P(A)$ ou $P(B)$ sans calculer l'intersection. La
          probabilité d'obtenir deux piles est inférieure à celle d'obtenir
          pile au premier lancer seulement.
    correct_feedback: >
      $P(A \cap B) = P(A) \cdot P(B) = \tfrac{1}{2} \times \tfrac{1}{2} =
      \tfrac{1}{4}$. On peut tout à fait obtenir deux piles — c'est même
      l'un des 4 résultats équiprobables de l'expérience.
    solution: |
      **Univers :** $\{(P,P),\,(P,F),\,(F,P),\,(F,F)\}$, équiprobable.
      $$P(A \cap B) = P(\{(P,P)\}) = \frac{1}{4}$$

      **Par la formule d'indépendance :**
      $$P(A \cap B) = P(A) \cdot P(B) = \frac{1}{2} \times \frac{1}{2} = \frac{1}{4} \checkmark$$

