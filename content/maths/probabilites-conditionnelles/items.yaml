        also_reveals: []
        feedback: >
          Ce choix additionne $P(A)+P(B)=0{,}4+0{,}5=0{,}9$. L'addition
          s'applique à l'union d'événements incompatibles, pas à l'intersection
          d'événements indépendants. Pour des indépendants, on multiplie.
