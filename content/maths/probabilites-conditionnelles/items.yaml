          pas, donc $P(A \cap B)=0$. Mais l'indépendance porte sur la valeur du
          chevauchement (elle égale le produit $P(A) \cdot P(B)$), pas sur
          l'absence de chevauchement. Exemple : lancer deux pièces —
          « pile au 1er lancer » et « pile au 2e lancer » sont indépendants, et
