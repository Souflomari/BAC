notion: probabilites-conditionnelles
skill_code: sma_prob_conditionnelle   # proposed; supabase-architect reconciles at step 7

misconceptions:
  - id: mc.math.sma_prob_conditionnelle.transpose-conditionnel
    label: "« P(A|B) et P(B|A) sont la même chose »"
    description: "L'élève traite la probabilité conditionnelle comme symétrique : il lit $P(B|A)$ et $P(A|B)$ comme interchangeables, car « la probabilité de A et B ensemble » lui semble indépendante de l'ordre, comme $A \\cap B$. La barre est lue « et » au lieu de « sachant que »."
    contradicts_principle: "$P(B|A) = \\dfrac{P(A \\cap B)}{P(A)}$ et $P(A|B) = \\dfrac{P(A \\cap B)}{P(B)}$ partagent le même numérateur mais ont des dénominateurs différents. Elles sont égales seulement si $P(A)=P(B)$. L'événement conditionneur est le dénominateur — « sachant B » signifie restreindre l'univers à $B$ puis mesurer $A$ à l'intérieur."

  - id: mc.math.sma_prob_conditionnelle.conditionnelle-egale-intersection
    label: "« P(A|B) = P(A∩B) »"
    description: "L'élève confond la probabilité conditionnelle avec la probabilité conjointe — il omet la division par $P(B)$. « Sachant B » et « et B » s'effondrent en une seule idée : les deux semblent signifier « A et B se réalisent »."
    contradicts_principle: "La probabilité conditionnelle renormalise à l'événement conditionneur : $P(A|B) = \\dfrac{P(A \\cap B)}{P(B)}$. La conjointe $P(A \\cap B)$ est mesurée dans l'univers entier $\\Omega$ ; la conditionnelle est mesurée dans l'univers restreint $B$. Diviser par $P(B)$ est l'acte qui réduit l'univers à $B$."

  - id: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
    label: "« Indépendants = incompatibles »"
    description: "L'élève fusionne les deux relations introduites successivement dans le cours. « Indépendant » (sans influence) et « incompatible / disjoint » (ne peuvent se réaliser ensemble) sont entendus comme des synonymes de « séparés, sans lien »."
    contradicts_principle: "Ce sont des notions opposées. Incompatibles : $A \\cap B = \\emptyset$, donc $P(A \\cap B)=0$. Savoir que $A$ est réalisé signifie que $B$ ne peut pas l'être — c'est une influence maximale, l'opposé de l'indépendance. Indépendants : $P(A \\cap B)=P(A) \\cdot P(B)$. Deux événements de probabilité non nulle ne peuvent pas être à la fois incompatibles et indépendants."

  - id: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
    label: "« Indépendants ⇒ P(A∩B) = 0 »"
    description: "L'élève croit que l'indépendance signifie que les événements ne se chevauchent pas, donc $P(A \\cap B)=0$. C'est une conséquence opératoire séparable de la fusion conceptuelle M3 : un élève peut tenir M4 (« les choses indépendantes ne se croisent pas ») même s'il est flou sur le mot « incompatible »."
    contradicts_principle: "Des événements indépendants de probabilité non nulle doivent se chevaucher : $P(A \\cap B)=P(A) \\cdot P(B) \\neq 0$. L'indépendance concerne la valeur du chevauchement (elle est égale au produit), pas l'absence de chevauchement."

  - id: mc.math.sma_prob_conditionnelle.independant-somme
    label: "« Indépendants ⇒ P(A∩B) = P(A) + P(B) »"
    description: "L'élève connaît l'idée qu'il existe une formule pour l'indépendance, mais récupère la mauvaise opération — il additionne au lieu de multiplier. L'addition vient d'une contamination par la formule des événements incompatibles $P(A \\cup B)=P(A)+P(B)$ : le « + » de l'union se propage sur l'intersection."
    contradicts_principle: "Pour des événements indépendants, l'intersection se multiplie : $P(A \\cap B)=P(A) \\cdot P(B)$. L'addition s'applique à l'union d'événements incompatibles. Deux opérations différentes, deux relations différentes, deux opérations ensemblistes différentes ($\\cap$ vs $\\cup$). De plus, $P(A \\cap B) \\leq \\min(P(A), P(B))$ toujours — une somme qui dépasse chaque terme est absurde."

  - id: mc.math.sma_prob_conditionnelle.arbre-additionne-branche
    label: "« On additionne le long d'une branche : P(A∩B) = P(A) + P(B|A) »"
    description: "En lisant un arbre pondéré, l'élève additionne les deux probabilités des arêtes le long d'un chemin racine-à-feuille au lieu de les multiplier. La représentation visuelle « descendre deux étapes » se lit comme « accumuler / additionner », à la façon dont des distances s'additionnent."
    contradicts_principle: "Le long d'une branche, on multiplie (la règle composée $P(A \\cap B)=P(A) \\cdot P(B|A)$ est exactement « la chaîne des étapes conditionnelles ») ; entre les branches / sur les feuilles, on additionne (la somme des probabilités totales). Multiplier en descendant, additionner en travers. Le produit est juste car chaque arête est une proportion conditionnelle de ce qui est arrivé au nœud au-dessus."

  - id: mc.math.sma_prob_conditionnelle.totales-sans-ponderation
    label: "« Probabilités totales sans pondérer : P(B) = P(B|A) + P(B|Ā) »"
    description: "En appliquant la loi des probabilités totales, l'élève somme directement les probabilités conditionnelles, oubliant de pondérer chacune par la probabilité de sa branche. La structure $P(B)=\\sum\\ldots$ est mémorisée, mais le facteur $P(A_i) \\cdot$ est oublié."
    contradicts_principle: "$P(B)=P(A) \\cdot P(B|A)+P(\\bar{A}) \\cdot P(B|\\bar{A})$ — chaque conditionnelle est pondérée par la fréquence de sa branche. On ne peut pas faire la moyenne de deux taux sans pondérer par la taille de la population. Et les poids doivent provenir d'une partition ($A \\cup \\bar{A}=\\Omega$, $A \\cap \\bar{A}=\\emptyset$, somme des $P(A_i)=1$)."

  - id: mc.math.sma_prob_conditionnelle.rebours-mauvais-denominateur
    label: "« Lecture inverse de l'arbre : mauvais dénominateur pour P(A|B) »"
    description: "En lisant l'arbre à rebours pour obtenir $P(A|B)$, l'élève divise la feuille favorable par le mauvais dénominateur — typiquement $P(A)$ (la branche en avant qu'il a descendue) au lieu de $P(B)$ (la somme de toutes les feuilles où $B$ se réalise). Il normalise par rapport à la cause au lieu de l'effet observé."
    contradicts_principle: "$P(A|B)=\\dfrac{P(A \\cap B)}{P(B)}$, et $P(B)$ doit être assemblé à partir de l'arbre entier par la loi des probabilités totales ($P(B)=P(A \\cap B)+P(\\bar{A} \\cap B)$, la somme de chaque feuille où $B$ se réalise). Le dénominateur est l'événement observé $B$ (toutes les façons dont il a pu se produire), pas le seul chemin en question."

  # ── M9-M15 : ajoutés le 2026-09-27, remboursement DETTE-EXAMEN GAP-B ────────
  # (docs/audits/dette-examen/maths.md, § probabilites-conditionnelles) :
  # « Law of a random variable and the binomial law — worked, never tested ».
  # La leçon travaille la variable aléatoire (loi de X, espérance) et la loi
  # binomiale (reconnaissance du schéma de Bernoulli, P(X=k), P(X>=1), E(X)=np)
  # aux deux chapitres non numérotés « Variable aléatoire » et « La loi
  # binomiale » — sans un seul item derrière. Aucun item ci-dessous ne teste
  # la variance/l'écart-type : le cadre (maths-sexp.yaml:307, maths-sm.yaml:322)
  # les nomme, mais lesson.md ne les travaille nulle part (grep "variance"
  # vide) — GAP-A, hors périmètre de ce remboursement GAP-B (prose requise
  # d'abord). Owner : à statuer séparément.
  - id: mc.math.sma_prob_conditionnelle.va-chemins-non-rassembles
    label: "« Un seul chemin compte pour P(X=x_i) »"
    description: "En construisant la loi de $X$, l'élève ne retient qu'UN SEUL chemin de l'arbre menant à la valeur $x_i$, alors qu'un autre chemin peut donner la même valeur — il oublie de rassembler toutes les feuilles concernées avant de sommer."
    contradicts_principle: "$P(X=x_i)$ est la somme des probabilités de TOUTES les feuilles de l'arbre où $X$ vaut $x_i$ — exactement le même geste que les probabilités totales (chapitre 4). Une valeur de $X$ peut être atteinte par plusieurs chemins incompatibles ; en oublier un revient à sous-compter $P(X=x_i)$."

  - id: mc.math.sma_prob_conditionnelle.va-valeurs-equiprobables
    label: "« Les valeurs de X sont équiprobables »"
    description: "L'élève affecte $1/n$ à chacune des $n$ valeurs de $X$, simplement parce qu'il y a $n$ valeurs distinctes dans le tableau — sans revenir aux feuilles de l'arbre qui les ont produites."
    contradicts_principle: "Les probabilités $P(X=x_i)$ viennent de la somme des feuilles de l'arbre qui donnent la valeur $x_i$ ; rien ne garantit qu'elles soient égales. Seule la somme $\\sum_i P(X=x_i)=1$ est garantie, jamais l'égalité des termes entre eux."

  - id: mc.math.sma_prob_conditionnelle.esperance-sans-ponderation
    label: "« E(X) = moyenne simple des valeurs »"
    description: "L'élève calcule $E(X)$ comme la moyenne arithmétique NON pondérée des valeurs $x_i$ (leur somme divisée par le nombre de valeurs), en oubliant de multiplier chaque valeur par sa probabilité."
    contradicts_principle: "$E(X)=\\sum_i x_i P(X=x_i)$ pondère chaque valeur par sa probabilité — une moyenne pondérée, pas une moyenne simple. Les deux ne coïncident que dans le cas particulier où toutes les valeurs sont équiprobables."

  - id: mc.math.sma_prob_conditionnelle.binomiale-oubli-coefficient
    label: "« P(X=k) sans le coefficient C(n,k) »"
    description: "L'élève calcule $p^k(1-p)^{n-k}$ directement, oubliant le facteur $\\binom{n}{k}$ qui compte le nombre de façons de choisir lesquelles des $n$ répétitions sont les $k$ succès."
    contradicts_principle: "$P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k}$ : $\\binom{n}{k}$ dénombre les chemins de l'arbre donnant $k$ succès parmi $n$ répétitions, avant de multiplier par la probabilité commune à chacun de ces chemins. L'omettre revient à ne compter qu'un seul chemin sur $\\binom{n}{k}$."

  - id: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
    label: "« Toute répétition d'expérience est une loi binomiale »"
    description: "L'élève applique la formule binomiale à une situation qui ne vérifie pas les trois conditions du schéma de Bernoulli — le plus souvent un tirage simultané ou un tirage sans remise, où la probabilité de succès change d'une répétition à l'autre."
    contradicts_principle: "Une loi binomiale suppose $n$ répétitions indépendantes d'une même expérience à deux issues, avec la MÊME probabilité de succès $p$ à chaque répétition — ce que garantit la remise. Un tirage simultané ou sans remise change la composition de l'urne d'un tirage à l'autre : $p$ n'est plus constant, l'indépendance tombe, et le dénombrement / l'équiprobabilité s'utilisent à la place."

  - id: mc.math.sma_prob_conditionnelle.binomiale-complement-echec
    label: "« P(X≥1) = 1 − p^n »"
    description: "Pour calculer $P(X \\geq 1)$ par l'événement contraire, l'élève complémente la probabilité de SUCCÈS répétée ($1-p^n$) au lieu de la probabilité d'ÉCHEC répétée $n$ fois ($1-(1-p)^n$)."
    contradicts_principle: "L'événement contraire de « au moins un succès sur $n$ répétitions » est « aucun succès », c'est-à-dire « échec à chacune des $n$ répétitions » : $P(X=0)=(1-p)^n$. Donc $P(X \\geq 1)=1-(1-p)^n$, jamais $1-p^n$ (qui complémenterait un événement sans rapport, « succès à toutes les répétitions »)."

  - id: mc.math.sma_prob_conditionnelle.binomiale-exposants-inverses
    label: "« P(X=k) avec les exposants échangés »"
    description: "L'élève écrit $\\binom{n}{k}p^{n-k}(1-p)^k$ : il affecte l'exposant $n-k$ (le nombre d'échecs) à la probabilité de succès $p$, et l'exposant $k$ (le nombre de succès) à la probabilité d'échec $1-p$."
    contradicts_principle: "Dans $P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k}$, l'exposant de $p$ (succès) est $k$, le nombre de succès ; l'exposant de $(1-p)$ (échec) est $n-k$, le nombre d'échecs. Chaque probabilité porte l'exposant qui compte SA PROPRE issue, jamais celui de l'autre."

  # ── M16-M22 : ajoutés le 2026-09-27, suite au retour CI (ratchet
  # couverture-diagnostique) : chaque distracteur neuf (M9-M14) doit porter un
  # id déclaré — `misconception: null` était la dette que ce ratchet arrête,
  # même si des items plus anciens du fichier en portent encore. Les sept ids
  # ci-dessous couvrent les distracteurs qui n'avaient pas de modèle propre ;
  # deux valeurs ont été RECALCULÉES pour correspondre exactement au modèle
  # déclaré (M12-2, M12-3 : voir le commentaire au fil des items).
  - id: mc.math.sma_prob_conditionnelle.va-valeur-confondue
    label: "« P(X=x_i) confondu avec P(X=x_j) »"
    description: "L'élève calcule correctement la probabilité d'UNE valeur de $X$, mais répond avec la probabilité d'une AUTRE valeur $x_j$ que celle demandée — il confond les valeurs de $X$ entre elles plutôt que de mal calculer."
    contradicts_principle: "Chaque valeur $x_i$ de $X$ a sa propre probabilité $P(X=x_i)$, obtenue en rassemblant les feuilles de l'arbre où $X$ vaut PRÉCISÉMENT $x_i$. Répondre avec $P(X=x_j)$ pour $x_j \\neq x_i$ ne calcule pas la bonne valeur, même si le calcul intermédiaire est juste."

  - id: mc.math.sma_prob_conditionnelle.esperance-terme-omis
    label: "« E(X) = somme de certains termes seulement »"
    description: "En calculant $E(X)=\\sum_i x_i P(X=x_i)$, l'élève additionne certains termes $x_iP(X=x_i)$ mais en oublie au moins un — le plus souvent le dernier — sans vérifier son résultat contre l'encadrement (plus petite valeur $\\leq E(X) \\leq$ plus grande valeur)."
    contradicts_principle: "$E(X)$ additionne TOUS les termes $x_iP(X=x_i)$, un par valeur possible de $X$. Une somme partielle ignore une partie de la loi de $X$ et ne peut donc pas représenter l'espérance."

  - id: mc.math.sma_prob_conditionnelle.esperance-associations-inversees
    label: "« E(X) avec les valeurs et les probabilités mal appariées »"
    description: "L'élève calcule $\\sum_i x_i P(X=x_{n+1-i})$ : il pondère chaque valeur par la probabilité d'une AUTRE valeur (l'appariement valeur / probabilité est permuté), au lieu de multiplier chaque $x_i$ par SA PROPRE probabilité $P(X=x_i)$."
    contradicts_principle: "Cours : « dans $E(X)$, chaque terme est un produit de l'une par l'autre » — mais c'est la MÊME ligne du tableau qui doit se répondre : $x_i$ avec $P(X=x_i)$, jamais $x_i$ avec la probabilité d'une valeur différente."

  - id: mc.math.sma_prob_conditionnelle.binomiale-oubli-echec
    label: "« P(X=k) = C(n,k)p^k, sans le facteur d'échec »"
    description: "L'élève calcule $\\binom{n}{k}p^k$ et s'arrête là, oubliant complètement le facteur d'échec $(1-p)^{n-k}$ — à la différence de l'oubli du seul coefficient, ici c'est un facteur entier de la formule qui disparaît."
    contradicts_principle: "$P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k}$ a TROIS facteurs : le coefficient, la probabilité des $k$ succès, ET la probabilité des $n-k$ échecs restants. Omettre le troisième revient à ne compter que les chemins de succès, sans jamais vérifier que les répétitions restantes ont bien échoué."

  - id: mc.math.sma_prob_conditionnelle.binomiale-condition-erronee
    label: "« Bonne conclusion, mauvaise condition invoquée »"
    description: "L'élève conclut correctement qu'une loi binomiale ne s'applique pas, mais justifie ce refus par une condition sans rapport avec le schéma de Bernoulli (une composition d'urne jugée trop déséquilibrée, un $n$ jugé trop petit) au lieu de la vraie raison : une probabilité de succès qui ne reste pas constante d'une répétition à l'autre."
    contradicts_principle: "Les trois conditions du schéma de Bernoulli sont précises : deux issues, même $p$ à chaque répétition, indépendance. Un refus correct doit s'appuyer sur LAQUELLE de ces trois conditions tombe réellement — ici la constance de $p$ — et non sur une caractéristique de l'énoncé qui n'en fait pas partie."

  - id: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-confondu-p
    label: "« P(X≥1) confondu avec p »"
    description: "Pour répondre à $P(X\\geq1)$ sur $n$ répétitions, l'élève retourne directement $p$, la probabilité de succès à UN SEUL essai, en perdant de vue que l'expérience est répétée $n$ fois."
    contradicts_principle: "$P(X\\geq1)$ porte sur les $n$ répétitions ensemble, pas sur un unique essai : elle vaut $1-(1-p)^n$, une expression qui dépend de $n$. Répondre $p$ ignore la répétition elle-même, pas seulement la formule du complémentaire."

  - id: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-np-confondu
    label: "« P(X≥1) confondu avec E(X)=np »"
    description: "Pour répondre à $P(X\\geq1)$, l'élève calcule $n\\times p$ — la formule de l'espérance d'une loi binomiale — en confondant une probabilité (bornée par $1$) avec une espérance (un nombre de succès attendu, qui peut dépasser $1$)."
    contradicts_principle: "$E(X)=np$ et $P(X\\geq1)=1-(1-p)^n$ répondent à deux questions différentes : « combien de succès en moyenne ? » contre « quelle probabilité d'au moins un succès ? ». La première n'est pas bornée par $1$ ; la seconde l'est toujours, par définition d'une probabilité."

items:

  # ── M1 · transpose-conditionnel ─────────────────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M1-1
    rung: "R5"
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, depistage_medical]
    stem: >
      Une maladie touche $1\,\%$ de la population. Un test détecte $95\,\%$ des
      malades : $P(T^+|M)=0{,}95$. Il donne aussi $10\,\%$ de faux positifs :
      $P(T^+|\bar{M})=0{,}10$. Une personne est testée positive.
      Quelle est $P(M|T^+)$, la probabilité qu'elle soit réellement malade ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 0{,}09$"
        correct: true
      - id: B
        text: "$0{,}95$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.transpose-conditionnel
        also_reveals: []
        feedback: >
          Ce choix confond $P(M|T^+)$ avec $P(T^+|M)=0{,}95$, qui est la
          sensibilité du test — la probabilité d'un test positif sachant qu'on
          est malade. On cherche l'inverse : la probabilité d'être malade sachant
          que le test est positif. Ce sont deux conditionnelles différentes car
          leurs dénominateurs sont différents ($P(T^+)$ vs $P(M)$). Modèle
          erroné : « $P(A|B)$ et $P(B|A)$ sont la même chose. »
      - id: C
        text: "$0{,}50$"
        correct: false
        misconception: null
        feedback: >
          Ce choix ignore toute l'information numérique et suppose une
          probabilité « fifty-fifty ». Il ne correspond à aucun calcul structuré.
      - id: D
        text: "$0{,}01$"
        correct: false
        misconception: null
        feedback: >
          Ce choix retourne simplement $P(M)=0{,}01$, la prévalence de la
          maladie, sans tenir compte du résultat du test. Il ignore l'information
          apportée par le test positif.
    correct_feedback: >
      On construit l'arbre : $P(M \cap T^+)=0{,}01 \times 0{,}95=0{,}0095$ et
      $P(\bar{M} \cap T^+)=0{,}99 \times 0{,}10=0{,}099$. Donc
      $P(T^+)=0{,}0095+0{,}099=0{,}1085$. Puis
      $P(M|T^+)=\tfrac{0{,}0095}{0{,}1085}\approx 0{,}09$. La plupart des
      positifs viennent de la grande population saine, ce qui dilue fortement
      la valeur prédictive positive.
    solution: |
      **Données :** $P(M)=0{,}01$, $P(\bar{M})=0{,}99$, $P(T^+|M)=0{,}95$,
      $P(T^+|\bar{M})=0{,}10$.

      **Étape 1 — Calculer les feuilles de l'arbre :**
      $$P(M \cap T^+) = P(M) \times P(T^+|M) = 0{,}01 \times 0{,}95 = 0{,}0095$$
      $$P(\bar{M} \cap T^+) = P(\bar{M}) \times P(T^+|\bar{M}) = 0{,}99 \times 0{,}10 = 0{,}099$$

      **Étape 2 — Probabilités totales (assembler $P(T^+)$) :**
      $$P(T^+) = 0{,}0095 + 0{,}099 = 0{,}1085$$

      **Étape 3 — Lecture inverse (sachant $T^+$, remonter vers $M$) :**
      $$P(M|T^+) = \frac{P(M \cap T^+)}{P(T^+)} = \frac{0{,}0095}{0{,}1085} \approx 0{,}0875 \approx 0{,}09$$

      Le résultat est $\approx 9\,\%$, très loin de la sensibilité $95\,\%$. La
      grande majorité des tests positifs viennent des $99\,\%$ de personnes
      saines, même si le taux de faux positifs n'est que $10\,\%$.

  # Variant 2 — M1 : contexte urne (sans inversée notée explicitement)
  - id: PC-M1-2
    rung: "R5"
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, depistage_medical]
    stem: >
      Un laboratoire fabrique des vaccins par deux procédés. Le procédé $A$
      produit $70\,\%$ des lots ; $2\,\%$ de ses lots sont défectueux :
      $P(D|A)=0{,}02$. Le procédé $B$ produit $30\,\%$ des lots ; $5\,\%$ de
      ses lots sont défectueux : $P(D|B)=0{,}05$. Un lot défectueux est
      découvert. Quelle est la probabilité qu'il provienne du procédé $A$,
      c'est-à-dire $P(A|D)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}02$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.transpose-conditionnel
        also_reveals: []
        feedback: >
          Ce choix retourne $P(D|A)=0{,}02$, la probabilité qu'un lot du
          procédé $A$ soit défectueux — l'inverse de ce qui est demandé.
          $P(A|D)$ et $P(D|A)$ ont le même numérateur $P(A \cap D)$ mais des
          dénominateurs différents ($P(D)$ vs $P(A)$). Modèle erroné :
          « $P(A|B)$ et $P(B|A)$ sont la même chose. »
      - id: B
        text: "$\\approx 0{,}48$"
        correct: true
      - id: C
        text: "$0{,}70$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.rebours-mauvais-denominateur
        also_reveals: [mc.math.sma_prob_conditionnelle.transpose-conditionnel]
        feedback: >
          Ce choix retourne $P(A)=0{,}70$, la proportion du procédé $A$ dans la
          production totale — il ignore l'information apportée par le fait que le
          lot soit défectueux. Le dénominateur doit être $P(D)$, pas $P(A)$.
          Modèle erroné : mauvais dénominateur dans la lecture inverse.
      - id: D
        text: "$0{,}05$"
        correct: false
        misconception: null
        feedback: >
