  # ── binomiale-hors-cadre + binomiale-condition-erronee (tirage simultané /
  # sans remise) ───────────────────────────────────────────────────────────────
  # Chaque item a désormais 4 choix tagués (0 `misconception: null`) : deux
  # variantes de binomiale-hors-cadre (« oui, ça s'applique », avec ou sans
  # ajustement de n/p) et une de binomiale-condition-erronee (bonne conclusion
  # « non », mauvaise raison invoquée) — ajoutée le 2026-09-27, retour CI. Les
  # 4 textes de choix sont rééquilibrés en longueur et sans absolu
  # (« uniquement » retiré du choix qui le portait).
  - id: PC-M13-1
    rung: "R5c"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale, reconnaissance]
    stem: >
      Une urne contient $5$ boules vertes et $5$ boules jaunes,
      indiscernables au toucher. On tire **simultanément** $3$ boules de
      l'urne. Soit $X$ le nombre de boules vertes parmi les $3$ boules
      tirées. Peut-on affirmer que $X$ suit la loi binomiale
      $\mathcal{B}\!\left(3\,;\,0{,}5\right)$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : le tirage simultané n'est pas une répétition de $3$
          épreuves indépendantes — c'est un dénombrement.
        correct: true
      - id: B
        text: >-
          Oui : il y a $n=3$ tirages avec $p=0{,}5$ à chaque tirage, donc
          $X\sim\mathcal{B}(3\,;\,0{,}5)$.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
        also_reveals: []
        feedback: >
          Un tirage simultané n'a pas de « premier, deuxième, troisième
          tirage » avec remise entre chacun : les trois boules sortent d'un
          coup, et la composition retenue pour l'une dépend des deux
          autres. La loi binomiale exige $n$ répétitions indépendantes
          d'une même expérience, avec le même $p$ à chaque fois — ce n'est
          pas le cas ici. Modèle erroné : « toute répétition d'expérience
          est une loi binomiale ».
      - id: C
        text: >-
          Non, mais parce que $n=3$ serait trop petit pour qu'une loi
          binomiale puisse s'appliquer ici.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-condition-erronee
        also_reveals: []
        feedback: >
          La conclusion (« non ») est correcte, mais la raison invoquée ne
          l'est pas : la taille de $n$ n'a rien à voir avec le problème.
          Même avec un $n$ plus grand, un tirage simultané ne fournirait
          pas non plus de répétitions indépendantes de même probabilité —
          la vraie raison est que la composition retenue pour une boule
          dépend des deux autres tirées avec elle. Modèle erroné : bonne
          conclusion, mauvaise condition invoquée.
      - id: D
        text: >-
          Oui, à condition de remplacer $p=0{,}5$ par $p=0{,}3$ dans la
          formule binomiale.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
        also_reveals: []
        feedback: >
          Changer $p$ ne répare rien : le problème est que le tirage
          simultané ne fournit pas $3$ répétitions indépendantes de même
          probabilité — aucune valeur de $p$ ne rend la loi binomiale
          applicable ici. Modèle erroné : « toute répétition d'expérience
          est une loi binomiale ».
    correct_feedback: >
      Le tirage est simultané : les trois boules sortent en une seule
      fois, sans succession de $3$ épreuves indépendantes de même
      probabilité $p$. Ce cas relève du dénombrement et de l'équiprobabilité
      (combinaisons), pas de la loi binomiale.
    solution: |
      **Les trois conditions du schéma de Bernoulli (cours) :** deux issues
      seulement à chaque répétition ; la même probabilité de succès $p$ à
      chaque répétition ; des répétitions indépendantes.

      **Ici :** le tirage est simultané — il n'y a pas de répétitions du
      tout, seulement UN tirage de $3$ boules à la fois. Aucune des trois
      conditions ne peut même être vérifiée puisqu'il n'y a pas d'épreuves
      successives.

      **Conclusion :** $X$ ne suit pas une loi binomiale ; son calcul relève
      du dénombrement (combinaisons) et de l'équiprobabilité.

  - id: PC-M13-2
    rung: "R5c"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale, reconnaissance]
    stem: >
      Une urne contient $6$ boules rouges et $4$ boules bleues. On tire une
      boule, on note sa couleur, on la **garde de côté sans la remettre**,
      puis on recommence deux fois — trois tirages en tout, chacun sans
      remise. Soit $X$ le nombre de boules rouges obtenues sur les trois
      tirages. Peut-on affirmer que $X$ suit la loi binomiale
      $\mathcal{B}\!\left(3\,;\,0{,}6\right)$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : sans remise, la probabilité de succès change à chaque
          tirage — les épreuves ne sont plus identiques.
        correct: true
      - id: B
        text: >-
          Oui : $3$ tirages avec $p=0{,}6$, la proportion de rouges au
          départ, donc $X\sim\mathcal{B}(3\,;\,0{,}6)$.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
        also_reveals: []
        feedback: >
          La remise est précisément ce qui garantit le même $p$ à chaque
          répétition. Ici, une fois une boule rouge tirée puis mise de
          côté, il reste moins de boules rouges pour le tirage suivant :
          $p$ change à chaque tirage. Sans remise, l'une des trois
          conditions de la loi binomiale tombe. Modèle erroné : « toute
          répétition d'expérience est une loi binomiale ».
      - id: C
        text: >-
          Non, mais parce qu'il y a plus de boules rouges que de boules
          bleues au départ dans l'urne.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-condition-erronee
        also_reveals: []
        feedback: >
          La conclusion (« non ») est correcte, mais la raison invoquée ne
          l'est pas : le déséquilibre $6$ contre $4$ donne bien $p=0{,}6$
          au premier tirage, ce n'est pas le problème. La vraie raison est
          que ce $p$ change ensuite, tirage après tirage, faute de remise.
          Modèle erroné : bonne conclusion, mauvaise condition invoquée.
      - id: D
        text: >-
          Oui, à condition de remplacer $p=0{,}6$ par la proportion de
          rouges restant à la fin.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
        also_reveals: []
        feedback: >
          Changer $p$ ne répare rien : le problème est que la probabilité
          de succès change à CHAQUE tirage sans remise, pas seulement entre
          le début et la fin — aucune valeur unique de $p$ ne convient pour
          les trois tirages. Modèle erroné : « toute répétition d'expérience
          est une loi binomiale ».
    correct_feedback: >
      Sans remise, l'urne perd une boule après chaque tirage : la
      probabilité de tirer rouge au tirage suivant dépend de ce qui a déjà
      été tiré. Les trois tirages ne sont ni indépendants, ni de même
      probabilité — la loi binomiale ne s'applique pas.
    solution: |
      **Vérification des trois conditions :** au premier tirage,
      $p=\dfrac{6}{10}=0{,}6$. Si ce premier tirage est rouge, il reste $5$
      rouges sur $9$ boules : $p'=\dfrac{5}{9}\neq 0{,}6$ au tirage suivant.
      La probabilité de succès change d'un tirage à l'autre : l'indépendance
      et la constance de $p$ tombent toutes les deux.

      **Conclusion :** $X$ ne suit pas une loi binomiale.

  - id: PC-M13-3
    rung: "R5c"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale, reconnaissance, variation_fraiche]
    stem: >
      Un sac contient $8$ jetons, dont $3$ portent un symbole gagnant. On
      tire un jeton, on regarde s'il est gagnant, on le **met de côté sans
      le remettre**, puis on tire un second jeton, puis un troisième —
      toujours sans remise. Soit $X$ le nombre de jetons gagnants obtenus
      sur les $3$ tirages. Peut-on affirmer que
      $X \sim \mathcal{B}\!\left(3\,;\,\dfrac{3}{8}\right)$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : sans remise, la probabilité de succès change à chaque
          tirage — les tirages ne sont plus identiques.
        correct: true
      - id: B
        text: >-
          Oui : $n=3$ tirages avec $p=\dfrac38$, la proportion de gagnants
          au départ, donc $X$ suit cette loi binomiale.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
        also_reveals: []
        feedback: >
          $p=\tfrac38$ n'est valable qu'AU PREMIER tirage. Dès que le
          premier jeton est mis de côté sans être remis, il ne reste plus
          que $7$ jetons dont $2$ ou $3$ gagnants selon ce qui vient de
          sortir : $p$ ne reste pas constant, et les tirages ne sont plus
          indépendants. Modèle erroné : « toute répétition d'expérience est
          une loi binomiale ».
      - id: C
        text: >-
          Non, mais parce qu'il y a plus de jetons perdants que de jetons
          gagnants au départ dans le sac.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-condition-erronee
        also_reveals: []
        feedback: >
          La conclusion (« non ») est correcte, mais la raison invoquée ne
          l'est pas : $\tfrac38$ est bien la probabilité de tirer un jeton
          gagnant au premier tirage, ce n'est pas le problème. La vraie
          raison est que cette probabilité change ensuite, selon ce qui a
          déjà été tiré. Modèle erroné : bonne conclusion, mauvaise
          condition invoquée.
      - id: D
        text: >-
          Oui, à condition de remplacer $p=\dfrac38$ par la proportion de
          gagnants restant à la fin.
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-hors-cadre
        also_reveals: []
        feedback: >
          $n\times p$ ou une proportion finale ne répare rien : ce qui
          manque, c'est une probabilité de succès qui reste LA MÊME à
          chacun des trois tirages — pas une valeur ajustée après coup.
          Modèle erroné : « toute répétition d'expérience est une loi
          binomiale ».
    correct_feedback: >
      Sans remise, la composition du sac change après chaque tirage : la
      probabilité de tirer un jeton gagnant n'est plus constante, et les
      tirages ne sont plus indépendants. La loi binomiale ne s'applique pas.
    solution: |
      **Au premier tirage :** $p=\dfrac{3}{8}$. **Si ce tirage est
      gagnant :** il reste $2$ jetons gagnants sur $7$ au tirage suivant,
      $p'=\dfrac{2}{7}\neq\dfrac{3}{8}$. **Si ce tirage n'est pas gagnant :**
      il reste $3$ jetons gagnants sur $7$, $p''=\dfrac{3}{7}\neq\dfrac{3}{8}$
      non plus. Dans tous les cas, $p$ change au deuxième tirage.

      **Conclusion :** $X$ ne suit pas une loi binomiale.

  # ── binomiale-complement-echec (P(X≥1) = 1 − p^n au lieu de 1 − (1−p)^n) +
  # binomiale-au-moins-un-confondu-p + binomiale-au-moins-un-np-confondu ─────
  # Les deux dernières ajoutées le 2026-09-27 (retour CI, à la place d'un
  # `misconception: null`) : les valeurs des distracteurs ($p$ seul, $np$) sont
  # inchangées, seul le tag et l'explication du modèle ont été ajoutés.
  - id: PC-M14-1
    rung: "R5c"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale]
    stem: >
      $X$ suit la loi binomiale $\mathcal{B}(4\,;\,0{,}3)$. Que vaut
      $P(X \geq 1)$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 0{,}76$"
        correct: true
      - id: B
        text: "$\\approx 0{,}99$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-complement-echec
        also_reveals: []
        feedback: >
          Ce choix calcule $1-0{,}3^4\approx 0{,}99$ : c'est la probabilité
          de succès qui est complémentée, pas la probabilité d'échec.
          L'événement contraire de « au moins un succès » est « aucun
          succès », c'est-à-dire « échec aux $4$ répétitions » —
          $P(X=0)=(1-p)^4=0{,}7^4$, pas $p^4$. Modèle erroné :
          « $P(X\geq1)=1-p^n$ ».
      - id: C
        text: "$0{,}3$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-confondu-p
        also_reveals: []
        feedback: >
          Ce choix retourne $p=0{,}3$ seul, la probabilité de succès à UN
          SEUL essai — en perdant de vue que l'expérience est répétée $4$
          fois. $P(X\geq1)$ porte sur les $4$ répétitions ensemble, pas sur
          un unique essai. Modèle erroné : « $P(X\geq1)$ confondu avec $p$ ».
      - id: D
        text: "$1{,}2$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-np-confondu
        also_reveals: []
        feedback: >
          Ce choix calcule $4\times0{,}3=1{,}2$ : c'est la formule de
          l'espérance $E(X)=np$, pas celle de $P(X\geq1)$. Une probabilité
          est toujours comprise entre $0$ et $1$ ; $1{,}2$ le signale déjà
          comme une confusion. Modèle erroné : « $P(X\geq1)$ confondu avec
          $E(X)=np$ ».
    correct_feedback: >
      $P(X\geq1)=1-P(X=0)=1-0{,}7^4=1-0{,}2401\approx 0{,}76$.
    solution: |
      $$P(X \geq 1) = 1 - P(X=0) = 1 - (1-p)^4 = 1 - 0{,}7^4 = 1 - 0{,}2401 \approx 0{,}76$$

  - id: PC-M14-2
    rung: "R5c"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale]
    stem: >
      $X$ suit la loi binomiale $\mathcal{B}(5\,;\,0{,}2)$. Que vaut
      $P(X \geq 1)$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 0{,}67$"
        correct: true
      - id: B
        text: "$\\approx 1{,}00$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-complement-echec
        also_reveals: []
        feedback: >
          Ce choix calcule $1-0{,}2^5\approx 1{,}00$ : c'est la probabilité
          de succès qui est complémentée. L'événement contraire de « au
          moins un succès » est « échec aux $5$ répétitions »,
          $P(X=0)=(1-p)^5=0{,}8^5$, pas $p^5$. Modèle erroné :
          « $P(X\geq1)=1-p^n$ ».
      - id: C
        text: "$0{,}2$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-confondu-p
        also_reveals: []
        feedback: >
          Ce choix retourne $p=0{,}2$ seul, la probabilité de succès à UN
          SEUL essai — en perdant de vue que l'expérience est répétée $5$
          fois. Modèle erroné : « $P(X\geq1)$ confondu avec $p$ ».
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-np-confondu
        also_reveals: []
        feedback: >
          Ce choix calcule $5\times0{,}2=1$ : c'est la formule de
          l'espérance $E(X)=np$, pas celle de $P(X\geq1)$. Le résultat
          « $1$ », une certitude, devrait déjà alerter. Modèle erroné :
          « $P(X\geq1)$ confondu avec $E(X)=np$ ».
    correct_feedback: >
      $P(X\geq1)=1-P(X=0)=1-0{,}8^5=1-0{,}32768\approx 0{,}67$.
    solution: |
      $$P(X \geq 1) = 1 - (1-p)^5 = 1 - 0{,}8^5 = 1 - 0{,}32768 \approx 0{,}672$$

  - id: PC-M14-3
    rung: "R5c"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale, variation_fraiche]
    stem: >
      Un standard téléphonique reçoit des appels indépendants les uns des
      autres. La probabilité qu'un appel donné soit une réclamation est
      $0{,}1$. Sur $6$ appels reçus, soit $X$ le nombre de réclamations.
      Que vaut $P(X \geq 1)$, la probabilité d'au moins une réclamation ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 0{,}47$"
        correct: true
      - id: B
        text: "$\\approx 1{,}00$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-complement-echec
        also_reveals: []
        feedback: >
          Ce choix calcule $1-0{,}1^6\approx 1{,}00$ : c'est la probabilité
          de « réclamation » qui est complémentée, pas celle de « pas de
          réclamation ». L'événement contraire de « au moins une
          réclamation » est « aucune réclamation sur les $6$ appels »,
          $P(X=0)=(1-p)^6=0{,}9^6$, pas $p^6$. Modèle erroné :
          « $P(X\geq1)=1-p^n$ ».
      - id: C
        text: "$0{,}1$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-confondu-p
        also_reveals: []
        feedback: >
          Ce choix retourne $p=0{,}1$ seul, la probabilité qu'UN SEUL appel
          soit une réclamation — en perdant de vue que $6$ appels sont
          reçus. Modèle erroné : « $P(X\geq1)$ confondu avec $p$ ».
      - id: D
        text: "$0{,}6$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-au-moins-un-np-confondu
        also_reveals: []
        feedback: >
          Ce choix calcule $6\times0{,}1=0{,}6$ : c'est la formule de
          l'espérance $E(X)=np$ (le nombre moyen de réclamations attendu),
          pas celle de $P(X\geq1)$. Modèle erroné : « $P(X\geq1)$ confondu
          avec $E(X)=np$ ».
    correct_feedback: >
      $P(X\geq1)=1-P(X=0)=1-0{,}9^6=1-0{,}531441\approx 0{,}47$.
    solution: |
      $$P(X \geq 1) = 1 - (1-p)^6 = 1 - 0{,}9^6 = 1 - 0{,}531441 \approx 0{,}469$$

