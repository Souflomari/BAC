  # ── binomiale-oubli-coefficient + binomiale-exposants-inverses +
  # binomiale-oubli-echec ─────────────────────────────────────────────────────
  # Les trois misconceptions partagent les 3 mêmes items : la formule
  # binomiale au format demandé par l'audit (P(X=k), n petit), chacune sur son
  # propre choix (« C(n,k) manquant », « exposants échangés », « facteur
  # d'échec manquant » — ajouté le 2026-09-27, retour CI, à la place d'un
  # `misconception: null`).
  - id: PC-M12-1
    rung: "R5c"
    habilete: application_directe
    difficulty_level: 3
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, loi_binomiale]
    stem: >
      Une expérience de Bernoulli de paramètre $p=0{,}3$ est répétée $n=3$
      fois de manière indépendante. Soit $X$ le nombre de succès. Que vaut
      $P(X=2)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}189$"
        correct: true
      - id: B
        text: "$0{,}063$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-oubli-coefficient
        also_reveals: []
        feedback: >
          Ce choix calcule $0{,}3^2\times0{,}7=0{,}063$, en oubliant le
          coefficient $\binom{3}{2}=3$ qui compte les $3$ façons de choisir
          lesquels des $3$ tirages sont les $2$ succès. Modèle erroné :
          « $P(X=k)$ sans le coefficient $\binom{n}{k}$ ».
      - id: C
        text: "$0{,}441$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-exposants-inverses
        also_reveals: []
        feedback: >
          Ce choix calcule $\binom{3}{2}\times0{,}3^1\times0{,}7^2=0{,}441$ :
          les exposants sont échangés — $p$ (succès) devrait porter
          l'exposant $2$ (le nombre de succès demandé), pas $1$. Modèle
          erroné : « $P(X=k)$ avec les exposants échangés ».
      - id: D
        text: "$0{,}27$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.binomiale-oubli-echec
        also_reveals: []
        feedback: >
          Ce choix calcule $\binom{3}{2}\times0{,}3^2=0{,}27$, en oubliant
          entièrement le facteur d'échec $(1-p)^{n-k}=0{,}7^1$ — pas
          seulement le coefficient, tout un facteur de la formule disparaît.
          Modèle erroné : « $P(X=k)=\binom{n}{k}p^k$, sans le facteur
          d'échec ».
    correct_feedback: >
      $P(X=2)=\binom{3}{2}\times0{,}3^2\times0{,}7^1=3\times0{,}09\times0{,}7=0{,}189$.
    solution: |
      $$P(X=2) = \binom{3}{2}\,p^2\,(1-p)^1 = 3\times0{,}3^2\times0{,}7 = 3\times0{,}09\times0{,}7 = 0{,}189$$

