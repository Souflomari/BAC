  # ── va-chemins-non-rassembles + va-valeurs-equiprobables +
  # va-valeur-confondue ────────────────────────────────────────────────────────
  # Les trois misconceptions partagent les 3 mêmes items : chacune a sa propre
  # case dédiée dans le même QCM (loi de X depuis un arbre à deux étapes
  # dépendantes — la dépendance vient du cours R2-R5, la loi de X est neuve).
  # va-valeur-confondue ajoutée le 2026-09-27 (retour CI, à la place d'un
  # `misconception: null`).
  - id: PC-M9-1
    rung: "R5b"
    habilete: synthese
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, variable_aleatoire]
    stem: >
      Une usine teste ses pièces en deux étapes de contrôle. Une pièce a une
      probabilité $0{,}7$ de passer la première étape. Si elle passe la
      première étape, elle a une probabilité $0{,}8$ de passer aussi la
      seconde. Si elle échoue à la première étape, une reprise lui donne
      quand même une probabilité $0{,}3$ de passer la seconde étape. Soit $X$
      le nombre d'étapes passées ($0$, $1$ ou $2$). Que vaut $P(X=1)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}23$"
        correct: true
      - id: B
        text: "$\\approx 0{,}33$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.va-valeurs-equiprobables
        also_reveals: []
        feedback: >
          Ce choix affecte $\tfrac{1}{3}$ à chacune des trois valeurs $0$,
          $1$, $2$, comme si elles étaient équiprobables. Rien ne le
          garantit : les probabilités de $X$ viennent des feuilles de
          l'arbre, qui n'ont aucune raison d'être égales. Ici elles valent
          $0{,}21$ ; $0{,}23$ ; $0{,}56$ — très inégales. Modèle erroné :
          « les valeurs de $X$ sont équiprobables ».
      - id: C
        text: "$0{,}14$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.va-chemins-non-rassembles
        also_reveals: []
        feedback: >
          Ce choix ne retient que le chemin « passe la première étape puis
          échoue la seconde » ($0{,}7\times0{,}2=0{,}14$), en oubliant
          l'autre chemin qui donne aussi $X=1$ : « échoue la première puis
          passe la seconde » ($0{,}3\times0{,}3=0{,}09$). Une valeur de $X$
          peut être atteinte par plusieurs feuilles de l'arbre : il faut
          toutes les rassembler avant d'additionner. Modèle erroné : chemin
          oublié dans la loi de $X$.
      - id: D
        text: "$0{,}56$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.va-valeur-confondue
        also_reveals: []
        feedback: >
          Ce choix calcule correctement $P(X=2)=0{,}7\times0{,}8=0{,}56$ —
          mais c'est la probabilité de réussir les DEUX étapes, pas celle
          demandée ($X=1$, une seule étape passée). Modèle erroné :
          confondre la valeur $x_i$ demandée avec une autre valeur de $X$.
    correct_feedback: >
      $P(X=1)$ regroupe deux chemins incompatibles : « passe puis échoue »
      ($0{,}7\times0{,}2=0{,}14$) et « échoue puis passe »
      ($0{,}3\times0{,}3=0{,}09$). $P(X=1)=0{,}14+0{,}09=0{,}23$.
    solution: |
      **Arbre à deux étapes :**
      $$P(\text{passe}_1)=0{,}7, \quad P(\text{échoue}_1)=0{,}3$$
      $$P(\text{passe}_2\mid\text{passe}_1)=0{,}8, \quad P(\text{échoue}_2\mid\text{passe}_1)=0{,}2$$
      $$P(\text{passe}_2\mid\text{échoue}_1)=0{,}3, \quad P(\text{échoue}_2\mid\text{échoue}_1)=0{,}7$$

      **Les quatre feuilles, et la valeur de $X$ sur chacune :**
      $$P(\text{PP})=0{,}56\ (X=2) \qquad P(\text{P}\overline{\text{P}})=0{,}14\ (X=1)$$
      $$P(\overline{\text{P}}\text{P})=0{,}09\ (X=1) \qquad P(\overline{\text{P}}\,\overline{\text{P}})=0{,}21\ (X=0)$$

      **Rassembler les feuilles où $X=1$ :**
      $$P(X=1) = 0{,}14+0{,}09 = 0{,}23$$

      **Contrôle :** $0{,}21+0{,}23+0{,}56=1$ ✓.

  - id: PC-M9-2
    rung: "R5b"
    habilete: synthese
    difficulty_level: 4
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, variable_aleatoire]
    stem: >
      Un joueur dispose de deux essais à un jeu d'adresse. Il réussit le
      premier essai avec probabilité $0{,}4$. S'il a réussi le premier essai,
      la confiance aidant, il réussit le second avec probabilité $0{,}6$.
      S'il a échoué le premier essai, il réussit quand même le second avec
      probabilité $0{,}25$. Soit $X$ le nombre de succès sur les deux
      essais. Que vaut $P(X=1)$ ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}31$"
        correct: true
      - id: B
        text: "$\\approx 0{,}33$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.va-valeurs-equiprobables
        also_reveals: []
        feedback: >
          Ce choix affecte $\tfrac{1}{3}$ à chacune des trois valeurs $0$,
          $1$, $2$, comme s'il y avait équiprobabilité. Les probabilités
          réelles ($0{,}45$ ; $0{,}31$ ; $0{,}24$) viennent des feuilles de
          l'arbre et n'ont aucune raison d'être égales. Modèle erroné :
          « les valeurs de $X$ sont équiprobables ».
      - id: C
        text: "$0{,}16$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.va-chemins-non-rassembles
        also_reveals: []
        feedback: >
          Ce choix ne retient que le chemin « réussit puis échoue »
          ($0{,}4\times0{,}4=0{,}16$), en oubliant l'autre chemin qui donne
          aussi $X=1$ : « échoue puis réussit » ($0{,}6\times0{,}25=0{,}15$).
          Modèle erroné : chemin oublié dans la loi de $X$.
      - id: D
        text: "$0{,}24$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.va-valeur-confondue
        also_reveals: []
        feedback: >
          Ce choix calcule correctement $P(X=2)=0{,}4\times0{,}6=0{,}24$ —
          mais c'est la probabilité de réussir les DEUX essais, pas celle
          demandée ($X=1$, un seul succès). Modèle erroné : confondre la
          valeur $x_i$ demandée avec une autre valeur de $X$.
    correct_feedback: >
      $P(X=1)$ regroupe « réussit puis échoue » ($0{,}4\times0{,}4=0{,}16$)
      et « échoue puis réussit » ($0{,}6\times0{,}25=0{,}15$).
      $P(X=1)=0{,}16+0{,}15=0{,}31$.
    solution: |
      **Les quatre feuilles :**
      $$P(\text{RR})=0{,}4\times0{,}6=0{,}24\ (X=2) \qquad P(\text{R}\overline{\text{R}})=0{,}4\times0{,}4=0{,}16\ (X=1)$$
      $$P(\overline{\text{R}}\text{R})=0{,}6\times0{,}25=0{,}15\ (X=1) \qquad P(\overline{\text{R}}\,\overline{\text{R}})=0{,}6\times0{,}75=0{,}45\ (X=0)$$

      $$P(X=1) = 0{,}16+0{,}15 = 0{,}31$$

      **Contrôle :** $0{,}24+0{,}31+0{,}45=1$ ✓.

