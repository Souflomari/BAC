    type: mcq
    choices:
      - id: A
        text: "$P(B|A) = \\dfrac{1}{6}$, donc $A$ et $B$ sont indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          Si on a obtenu un 2, il est impossible d'avoir obtenu un 5 sur le même
          lancer : $P(B|A)=0$, pas $\tfrac{1}{6}$. $A$ et $B$ sont incompatibles
          (disjoints), ce qui les rend fortement dépendants, pas indépendants.
          Modèle erroné : « incompatibles = indépendants. »
      - id: B
        text: "$P(B|A) = 0$, donc $A$ et $B$ sont indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-egale-incompatible
        also_reveals: []
        feedback: >
          $P(B|A)=0$ est juste, mais la conclusion est fausse. $P(B|A)=0 \neq
          \tfrac{1}{6}=P(B)$ : savoir que $A$ est réalisé a changé la
          probabilité de $B$ (de $\tfrac{1}{6}$ à $0$). C'est de la dépendance,
          pas de l'indépendance. Modèle erroné : confondre « aucune coréalisation
          possible » avec « aucune influence ».
      - id: C
        text: "$P(B|A) = 0$, donc $A$ et $B$ sont dépendants (incompatibles)."
        correct: true
      - id: D
        text: "$P(B|A) = \\dfrac{1}{6}$, donc $A$ et $B$ sont dépendants."
        correct: false
        misconception: null
        feedback: >
          $P(B|A) \neq \tfrac{1}{6}$. Si on a obtenu un 2, la probabilité
          d'avoir obtenu un 5 est $0$, pas $\tfrac{1}{6}$.
    correct_feedback: >
      $A \cap B = \emptyset$, donc $P(B|A)=0$. Or $P(B)=\tfrac{1}{6} \neq 0$.
      Connaître $A$ change radicalement la probabilité de $B$ : ils sont
      dépendants (incompatibles). L'incompatibilité est l'opposé de
      l'indépendance.
    solution: |
      **$A \cap B = \{2\} \cap \{5\} = \emptyset$** : les événements sont incompatibles.

      $$P(B|A) = \frac{P(A \cap B)}{P(A)} = \frac{0}{1/6} = 0$$

      **Test d'indépendance :** $P(B|A) = 0 \neq \dfrac{1}{6} = P(B)$ → dépendants.

      Les événements incompatibles (de probabilité non nulle) sont toujours
      dépendants : savoir que l'un s'est réalisé exclut totalement l'autre.

