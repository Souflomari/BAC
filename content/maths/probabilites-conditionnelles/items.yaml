        text: "$0{,}24$"
        correct: true
      - id: B
        text: "$1{,}0$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.arbre-additionne-branche
        also_reveals: []
        feedback: >
          Ce choix additionne $P(A)+P(B|A)=0{,}6+0{,}4=1{,}0$. Le résultat
          $1{,}0$ devrait alerter : une feuille d'arbre ne peut pas avoir une
          probabilité égale à l'univers entier. Le long d'une branche, on
          multiplie : chaque arête donne la proportion de ce qui est arrivé au
          nœud précédent. « $40\,\%$ de ceux qui ont fait $A$ » = $40\,\% \times
          60\,\% = 24\,\%$ de tout le monde. Modèle erroné : « on additionne
          le long d'une branche. »
      - id: C
        text: "$0{,}2$"
        correct: false
        misconception: null
        feedback: >
          Ce choix correspond à la différence $P(A)-P(B|A)=0{,}6-0{,}4=0{,}2$,
          qui n'a pas de sens probabiliste sur un arbre. Le long d'une branche,
          on multiplie : $P(A) \times P(B|A)$.
      - id: D
        text: "$0{,}5$"
        correct: false
        misconception: null
        feedback: >
          Ce résultat ($\approx$ la moyenne de $0{,}6$ et $0{,}4$) n'est pas une
          opération définie sur l'arbre pour cette feuille. On multiplie les
          probabilités des arêtes.
    correct_feedback: >
      $P(A \cap B)=P(A) \times P(B|A)=0{,}6 \times 0{,}4=0{,}24$. Le long
      d'une branche, on multiplie (règle composée). Additionner donnerait
      $1{,}0$, une probabilité impossible pour une feuille.
    solution: |
      **Règle composée (multiplication le long de la branche) :**
      $$P(A \cap B) = P(A) \times P(B|A) = 0{,}6 \times 0{,}4 = 0{,}24$$

      **Pourquoi on multiplie :** $P(B|A)=0{,}4$ est la proportion de $B$
      parmi ceux qui ont fait $A$ (soit $60\,\%$ de l'univers). La proportion
      de $B$ dans tout l'univers vaut $40\,\%$ de ces $60\,\%$ = $0{,}4 \times
      0{,}6 = 0{,}24$.

