  - id: PC-M11-1
    rung: "R5b"
    habilete: application_directe
    difficulty_level: 2
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, variable_aleatoire, esperance]
    stem: >
      Un jeu de hasard donne un gain de $-10$ dirhams (une perte) avec
      probabilité $0{,}2$, un gain nul avec probabilité $0{,}5$, et un gain
      de $20$ dirhams avec probabilité $0{,}3$. Soit $X$ le gain du joueur.
      Que vaut $E(X)$ ?
    type: mcq
    choices:
      - id: A
        text: "$4$"
        correct: true
      - id: B
        text: "$\\approx 3{,}33$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.esperance-sans-ponderation
        also_reveals: []
        feedback: >
          Ce choix calcule $\dfrac{-10+0+20}{3}\approx 3{,}33$, la moyenne
          simple des trois valeurs, sans les pondérer par leurs
          probabilités $0{,}2$ ; $0{,}5$ ; $0{,}3$. $E(X)$ n'est pas une
          moyenne arithmétique des valeurs : c'est une moyenne PONDÉRÉE.
          Modèle erroné : « $E(X)$ = moyenne simple des valeurs ».
      - id: C
        text: "$1$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.esperance-associations-inversees
        also_reveals: []
        feedback: >
          Ce choix calcule $(-10)\times0{,}3+0\times0{,}5+20\times0{,}2=1$ :
          chaque valeur est pondérée par la probabilité D'UNE AUTRE valeur
          (les probabilités sont prises dans l'ordre inverse). $-10$ doit se
          multiplier par SA PROPRE probabilité $0{,}2$, pas par $0{,}3$.
          Modèle erroné : valeurs et probabilités mal appariées.
      - id: D
        text: "$6$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.esperance-terme-omis
        also_reveals: []
        feedback: >
          Ce choix ne retient que le dernier terme, $20\times0{,}3=6$, en
          oubliant les deux premiers termes $(-10)\times0{,}2$ et
          $0\times0{,}5$ de la somme. Modèle erroné : $E(X)$ = somme de
          certains termes seulement.
    correct_feedback: >
      $E(X)=(-10)\times0{,}2+0\times0{,}5+20\times0{,}3=-2+0+6=4$.
    solution: |
      $$E(X) = (-10)\times0{,}2 + 0\times0{,}5 + 20\times0{,}3 = -2+0+6 = 4$$

