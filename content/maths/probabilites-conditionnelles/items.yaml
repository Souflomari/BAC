        feedback: >
          Ce choix calcule $\binom{4}{1}\times\left(\tfrac14\right)^3\times
          \tfrac34=\tfrac{3}{64}$ : les exposants sont échangés — $p$
          (succès) devrait porter l'exposant $1$ (le nombre de succès
