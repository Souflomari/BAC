    choices:
      - id: A
        text: "Non — la bonne formule est $P(A \\cap B)=P(A) \\cdot P(B)$, et ici $0{,}6 \\times 0{,}3 = 0{,}18 = P(A \\cap B)$, donc $A$ et $B$ sont indépendants."
        correct: true
      - id: B
        text: "Oui — $P(A \\cap B) \\neq P(A)+P(B)$ confirme qu'ils ne sont pas indépendants."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-somme
        also_reveals: []
        feedback: >
          L'élève applique la mauvaise formule. L'indépendance se teste avec la
          multiplication, pas l'addition : $P(A \cap B) \stackrel{?}{=} P(A)
          \cdot P(B)$. Ici $0{,}6 \times 0{,}3=0{,}18=P(A \cap B)$, donc ils
          sont bien indépendants. L'addition ($P(A)+P(B)=0{,}9$) s'applique à
          l'union d'incompatibles. Modèle erroné.
      - id: C
        text: "Non — $A$ et $B$ sont indépendants car $P(A \\cap B)=0$."
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.independant-implique-intersection-nulle
        also_reveals: []
        feedback: >
          $P(A \cap B)=0{,}18 \neq 0$. Et même si l'intersection était nulle,
          cela signifierait incompatibilité, pas indépendance. Modèle erroné.
      - id: D
        text: "Oui — $0{,}18 < 0{,}9$ confirme que l'intersection est plus petite que la somme, donc ils sont dépendants."
        correct: false
        misconception: null
        feedback: >
          Il est toujours vrai que $P(A \cap B) \leq P(A)+P(B)$ (pour tout $A$
          et $B$), mais cela n'a rien à voir avec l'indépendance. Le critère
          est $P(A \cap B) = P(A) \cdot P(B)$.
    correct_feedback: >
      La formule de l'indépendance est $P(A \cap B)=P(A) \cdot P(B)=0{,}6
      \times 0{,}3=0{,}18$. Or $P(A \cap B)=0{,}18$ : l'égalité est vérifiée,
      $A$ et $B$ sont indépendants.
    solution: |
      **Test d'indépendance :**
      $$P(A) \cdot P(B) = 0{,}6 \times 0{,}3 = 0{,}18 = P(A \cap B) \checkmark$$

      → $A$ et $B$ sont indépendants.

      L'élève a utilisé la formule de l'union des incompatibles ($P(A)+P(B)$)
      au lieu du produit. Ces deux formules n'ont rien à voir l'une avec l'autre.

  # ── M6 · arbre-additionne-branche ───────────────────────────────────────────
  # Canonical (spec's distinguishing stem)
  - id: PC-M6-1
    rung: "R2"
    difficulty_level: 2
    skill_code: sma_prob_conditionnelle
    tags: [misconception_driven, sma_prob_conditionnelle, arbre_pondere]
    stem: >
      Sur un arbre de probabilités pondéré : $P(A)=0{,}6$ et $P(B|A)=0{,}4$.
      Que vaut $P(A \cap B)$, la probabilité de la feuille « $A$ puis $B$ » ?
    type: mcq
    choices:
      - id: A
        text: "$0{,}24$"
        correct: true
      - id: B
        text: "$1{,}0$"
        correct: false
        misconception: mc.math.sma_prob_conditionnelle.arbre-additionne-branche
        also_reveals: []
        feedback: >
          Ce choix additionne $P(A)+P(B|A)=0{,}6+0{,}4=1{,}0$. Le résultat
          $1{,}0$ devrait alerter : une feuille d'arbre ne peut pas avoir une
          probabilité égale à l'univers entier. Le long d'une branche, on
          multiplie : chaque arête donne la proportion de ce qui est arrivé au
          nœud précédent. « $40\,\%$ de ceux qui ont fait $A$ » = $40\,\% \times
          60\,\% = 24\,\%$ de tout le monde. Modèle erroné : « on additionne
          le long d'une branche. »
      - id: C
        text: "$0{,}2$"
        correct: false
        misconception: null
        feedback: >
          Ce choix correspond à la différence $P(A)-P(B|A)=0{,}6-0{,}4=0{,}2$,
          qui n'a pas de sens probabiliste sur un arbre. Le long d'une branche,
          on multiplie : $P(A) \times P(B|A)$.
      - id: D
        text: "$0{,}5$"
        correct: false
        misconception: null
        feedback: >
          Ce résultat ($\approx$ la moyenne de $0{,}6$ et $0{,}4$) n'est pas une
          opération définie sur l'arbre pour cette feuille. On multiplie les
          probabilités des arêtes.
    correct_feedback: >
      $P(A \cap B)=P(A) \times P(B|A)=0{,}6 \times 0{,}4=0{,}24$. Le long
      d'une branche, on multiplie (règle composée). Additionner donnerait
      $1{,}0$, une probabilité impossible pour une feuille.
    solution: |
      **Règle composée (multiplication le long de la branche) :**
      $$P(A \cap B) = P(A) \times P(B|A) = 0{,}6 \times 0{,}4 = 0{,}24$$

      **Pourquoi on multiplie :** $P(B|A)=0{,}4$ est la proportion de $B$
      parmi ceux qui ont fait $A$ (soit $60\,\%$ de l'univers). La proportion
      de $B$ dans tout l'univers vaut $40\,\%$ de ces $60\,\%$ = $0{,}4 \times
      0{,}6 = 0{,}24$.

