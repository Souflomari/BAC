<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Cadenas à 4 roues : un réservoir de 10 chiffres (0 à 9) alimente chacune des 4 roues, toujours avec 10 choix car le chiffre tiré est remis avant le tirage suivant. Le produit 10 × 10 × 10 × 10 = 10 puissance 4 = 10 000 est mis en évidence en bas, avec la forme générale n puissance p.">
  <title>p-liste du cadenas — tirage avec remise, n^p</title>

  <!--
    p-liste-cadenas.svg — R2, "Résolvons enfin le cadenas du départ".
    Reprend TEL QUEL le cadenas du R0/R2 : 4 roues, chiffres 0 à 9,
    répétitions autorisées (tirage avec remise).

    PAS un arbre (reste distinct de arbre-denombrement.svg) : un diagramme
    réservoir → créneaux, en grammaire commune avec sa figure-sœur R3
    (arrangement-reservoir.svg) — même schéma "réservoir + slots", mais ici
    le réservoir NE se vide JAMAIS (remise), alors qu'en R3 il se vide à
    chaque tirage. Le contraste (constant vs décroissant) EST le point
    pédagogique de la paire.

    Rôle des couleurs (5 jetons seulement) :
      structure (réservoir, roues, chiffres, flèches, libellés) : --figure-ink
      / --figure-ink-soft / --figure-grid / --figure-surface
      SEULE emphase : le produit final 10×10×10×10=10⁴=10 000            : --figure-accent
    (convention "un seul accent" héritée de arbre-denombrement.svg et
    arrangement-combinaison.svg — ce lot de figures panneau/mécanisme
    réserve l'accent au résultat final, contrairement au lot
    grille/table de triangle-pascal.svg qui l'utilise à chaque étape.)

    STAGED (docs/design/LESSON-EXPERIENCE-SPEC.md §2.5) — le geste
    d'enseignement suit exactement le texte du R2 : le réservoir et les 4
    roues d'abord (structure), puis le mécanisme de la remise (invariance),
    puis le produit qui résout le cadenas :
      step-1 : réservoir des 10 chiffres + les 4 roues, encore vides.
      step-2 : chaque roue puise dans le MÊME réservoir (4 flèches depuis un
               point commun, aucun chiffre retiré) — "10 choix" sous chaque
               roue + le rappel "on remet → le nombre de choix ne change pas".
      step-3 : le produit 10×10×10×10 = 10⁴ = 10 000, avec la forme
               générale n^p annotée au-dessus.
  -->

  <style>
    .plc-title      { font: 600 15px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .plc-subtitle   { font: 600 13px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .plc-box        { fill: var(--figure-surface); stroke: var(--figure-grid); stroke-width: 1.5; }
    .plc-slot       { fill: var(--figure-surface); stroke: var(--figure-grid); stroke-width: 1.5; }
    .plc-token      { fill: var(--figure-surface); stroke: var(--figure-ink-soft); stroke-width: 1.3; }
    .plc-tokenlabel { font: 600 11px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .plc-slotlabel  { font: 600 13.5px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .plc-slotsub    { font: 500 11.5px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .plc-n          { font: 500 12px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .plc-edge       { stroke: var(--figure-ink-soft); stroke-width: 1.5; fill: none; }
    .plc-dot        { fill: var(--figure-ink-soft); }
    .plc-recycle    { font: 600 15px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .plc-callout    { fill: var(--figure-surface); stroke: var(--figure-ink-soft); stroke-width: 1.3; stroke-dasharray: 4 3; }
    .plc-calloutlabel { font: 600 12.5px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .plc-formhead   { font: 500 12px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .plc-form       { font: 700 19px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .plc-accentbox  { fill: var(--figure-surface); stroke: var(--figure-accent); stroke-width: 1.75; }
    .plc-accent     { font: 700 16px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-accent); }
    text { text-anchor: middle; }
  </style>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le réservoir des 10 chiffres + les 4 roues, encore vides
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text class="plc-title" x="400" y="26">Cadenas à 4 roues — tirage avec remise</text>

    <text class="plc-subtitle" x="145" y="56">Réservoir : chiffres 0 → 9</text>
    <text class="plc-subtitle" x="520" y="56">Les 4 roues</text>

    <rect class="plc-box" x="50" y="70" width="190" height="150" rx="16"/>
    <!-- 10 chiffres, 5 colonnes x 2 lignes -->
    <circle class="plc-token" cx="80"  cy="114" r="14"/><text class="plc-tokenlabel" x="80"  y="118">0</text>
    <circle class="plc-token" cx="114" cy="114" r="14"/><text class="plc-tokenlabel" x="114" y="118">1</text>
    <circle class="plc-token" cx="148" cy="114" r="14"/><text class="plc-tokenlabel" x="148" y="118">2</text>
    <circle class="plc-token" cx="182" cy="114" r="14"/><text class="plc-tokenlabel" x="182" y="118">3</text>
    <circle class="plc-token" cx="216" cy="114" r="14"/><text class="plc-tokenlabel" x="216" y="118">4</text>
    <circle class="plc-token" cx="80"  cy="162" r="14"/><text class="plc-tokenlabel" x="80"  y="166">5</text>
    <circle class="plc-token" cx="114" cy="162" r="14"/><text class="plc-tokenlabel" x="114" y="166">6</text>
    <circle class="plc-token" cx="148" cy="162" r="14"/><text class="plc-tokenlabel" x="148" y="166">7</text>
    <circle class="plc-token" cx="182" cy="162" r="14"/><text class="plc-tokenlabel" x="182" y="166">8</text>
    <circle class="plc-token" cx="216" cy="162" r="14"/><text class="plc-tokenlabel" x="216" y="166">9</text>
    <text class="plc-n" x="145" y="200">n = 10</text>

    <!-- les 4 roues, vides -->
    <rect class="plc-slot" x="280" y="105" width="90" height="80" rx="14"/>
    <text class="plc-slotlabel" x="325" y="138">roue 1</text>
    <rect class="plc-slot" x="410" y="105" width="90" height="80" rx="14"/>
    <text class="plc-slotlabel" x="455" y="138">roue 2</text>
    <rect class="plc-slot" x="540" y="105" width="90" height="80" rx="14"/>
    <text class="plc-slotlabel" x="585" y="138">roue 3</text>
    <rect class="plc-slot" x="670" y="105" width="90" height="80" rx="14"/>
    <text class="plc-slotlabel" x="715" y="138">roue 4</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — chaque roue puise dans le MÊME réservoir : 10 choix partout,
       parce qu'on remet le chiffre avant le tirage suivant
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- le même point de départ pour les 4 flèches : rien n'est retiré du réservoir -->
    <line class="plc-edge" x1="240" y1="145" x2="325" y2="105"/>
    <line class="plc-edge" x1="240" y1="145" x2="455" y2="105"/>
    <line class="plc-edge" x1="240" y1="145" x2="585" y2="105"/>
    <line class="plc-edge" x1="240" y1="145" x2="715" y2="105"/>
    <circle class="plc-dot" cx="240" cy="145" r="3.5"/>

    <text class="plc-recycle" x="224" y="90">&#x21ba;</text>

    <text class="plc-slotsub" x="325" y="163">10 choix</text>
    <text class="plc-slotsub" x="455" y="163">10 choix</text>
    <text class="plc-slotsub" x="585" y="163">10 choix</text>
    <text class="plc-slotsub" x="715" y="163">10 choix</text>

    <rect class="plc-callout" x="195" y="230" width="420" height="44" rx="12"/>
    <text class="plc-calloutlabel" x="405" y="257">on remet &#x2192; le nombre de choix ne change pas</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — le produit qui résout le cadenas, avec la forme générale n^p
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <text class="plc-formhead" x="400" y="298">forme générale d'une p-liste</text>
    <text class="plc-form" x="400" y="326"><tspan font-style="italic">n</tspan><tspan dy="-7" font-size="62%" font-style="italic">p</tspan><tspan dy="7"> </tspan></text>

    <rect class="plc-accentbox" x="250" y="346" width="300" height="54" rx="14"/>
    <text class="plc-accent" x="400" y="380"><tspan>10 &#xD7; 10 &#xD7; 10 &#xD7; 10 = 10</tspan><tspan dy="-7" font-size="62%">4</tspan><tspan dy="7"> = 10 000</tspan></text>
  </g><!-- /step-3 -->

</svg>
