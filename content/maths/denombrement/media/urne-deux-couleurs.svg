<svg style="text-anchor:middle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Urne de 9 boules, 5 rouges et 4 vertes : card(Omega) = C(9,3) = 84. L’événement favorable se décompose en deux pools séparés, 2 rouges parmi 5 (C(5,2)=10) ET 1 verte parmi 4 (C(4,1)=4), reliés par le connecteur ET qui multiplie. En bas, card(E) = 10 × 4 = 40 et la probabilité P(E) = 40/84 = 10/21 sont mises en évidence.">
  <title>Urne à deux couleurs — équiprobabilité et principe multiplicatif</title>

  <!--
    urne-deux-couleurs.svg — R7, "Exemple travaillé : une urne à deux
    couleurs". Reprend TEL QUEL l'exemple du R7 (9 boules, 5 rouges + 4
    vertes, tirage simultané de 3, card(Omega)=C(9,3)=84,
    card(E)=C(5,2)xC(4,1)=10x4=40, P(E)=40/84=10/21).

    Contrainte de palette : les tokens --figure-* ne fournissent AUCUNE
    couleur "rouge" ni "verte" (5 jetons neutres + 1 accent teal — voir
    globals.css, DESIGN-BIBLE §6, "aucune couleur en dur"). La distinction
    rouge/verte est donc encodée par la FORME (plein vs creux) et une
    lettre (R/V) plutôt que par la teinte — un choix délibéré, pas un
    oubli : inventer un hex "rouge"/"vert" violerait la palette à jetons.

    Rôle des couleurs (5 jetons seulement) :
      structure (urne, boules, pools, libellés)          : --figure-ink /
      --figure-ink-soft / --figure-grid / --figure-surface
      boules "rouges" : plein ink + lettre surface ; "vertes" : creux
      surface/ink-soft + lettre ink-soft (encodage plein/creux, pas de teinte)
      SEULE emphase : le résultat final P(E) = 40/84 = 10/21             : --figure-accent
    (même discipline "un seul accent, réservé au résultat final" que
    p-liste-cadenas.svg / arrangement-reservoir.svg / arbre-denombrement.svg.)

    STAGED (docs/design/LESSON-EXPERIENCE-SPEC.md §2.5) :
      step-1 : l'urne Omega, 9 boules (5 pleines + 4 creuses), avec
               card(Omega) = C(9,3) = 84.
      step-2 : l'événement favorable partitionné en deux pools séparés —
               2 rouges choisies parmi 5 (C(5,2)=10) ET 1 verte parmi 4
               (C(4,1)=4) — reliés par le connecteur "ET -> x".
      step-3 : card(E) = 10x4 = 40 assemblé, puis la probabilité
               P(E) = 40/84 = 10/21 mise en évidence.
  -->

  <style>
    .urn-title    { font: 600 15px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .urn-jar      { fill: var(--figure-surface); stroke: var(--figure-ink-soft); stroke-width: 1.5; }
    .urn-red      { fill: var(--figure-ink); stroke: var(--figure-ink); stroke-width: 1; }
    .urn-redlabel { font: 700 10px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-surface); }
    .urn-green    { fill: var(--figure-surface); stroke: var(--figure-ink-soft); stroke-width: 1.5; }
    .urn-greenlabel { font: 700 10px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .urn-legend   { font: 500 12.5px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .urn-formula  { font: 700 15px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .urn-poolbox  { fill: var(--figure-surface); stroke: var(--figure-grid); stroke-width: 1.5; }
    .urn-pooltitle{ font: 600 13px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .urn-selring  { fill: none; stroke: var(--figure-ink); stroke-width: 2.25; }
    .urn-poolform { font: 600 15px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .urn-poolsub  { font: 500 11px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
    .urn-etbox    { fill: var(--figure-surface); stroke: var(--figure-ink-soft); stroke-width: 1.3; stroke-dasharray: 4 3; }
    .urn-et       { font: 700 13px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink); }
    .urn-accentbox{ fill: var(--figure-surface); stroke: var(--figure-accent); stroke-width: 1.75; }
    .urn-accent   { font: 700 16px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-accent); }
    .urn-approx   { font: 500 12px 'IBM Plex Sans', system-ui, sans-serif; fill: var(--figure-ink-soft); }
  </style>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — l'urne Omega : 9 boules, card(Omega) = C(9,3) = 84
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text class="urn-title" x="400" y="26">Urne à deux couleurs — tirage simultané de 3 boules</text>

    <rect class="urn-jar" x="300" y="56" width="200" height="170" rx="28"/>
    <!-- 5 boules "rouges" (pleines) -->
    <circle class="urn-red" cx="340" cy="96"  r="13"/><text class="urn-redlabel" x="340" y="100">R</text>
    <circle class="urn-red" cx="400" cy="96"  r="13"/><text class="urn-redlabel" x="400" y="100">R</text>
    <circle class="urn-red" cx="460" cy="96"  r="13"/><text class="urn-redlabel" x="460" y="100">R</text>
    <circle class="urn-red" cx="340" cy="136" r="13"/><text class="urn-redlabel" x="340" y="140">R</text>
    <circle class="urn-red" cx="400" cy="136" r="13"/><text class="urn-redlabel" x="400" y="140">R</text>
    <!-- 4 boules "vertes" (creuses) -->
    <circle class="urn-green" cx="460" cy="136" r="13"/><text class="urn-greenlabel" x="460" y="140">V</text>
    <circle class="urn-green" cx="340" cy="176" r="13"/><text class="urn-greenlabel" x="340" y="180">V</text>
    <circle class="urn-green" cx="400" cy="176" r="13"/><text class="urn-greenlabel" x="400" y="180">V</text>
    <circle class="urn-green" cx="460" cy="176" r="13"/><text class="urn-greenlabel" x="460" y="180">V</text>

    <text class="urn-legend" x="400" y="250">&#x3A9; : 9 boules — 5 rouges (R) + 4 vertes (V)</text>
    <text class="urn-formula" x="400" y="276"><tspan>card(&#x3A9;) = </tspan><tspan font-style="italic">C</tspan><tspan dy="4" font-size="65%">9</tspan><tspan dy="-9" font-size="65%">3</tspan><tspan dy="5"> = 84</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — l'événement favorable partitionné : 2 rouges ET 1 verte
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <rect class="urn-poolbox" x="140" y="330" width="220" height="170" rx="16"/>
    <text class="urn-pooltitle" x="250" y="356">Pool rouge (5)</text>
    <circle class="urn-red" cx="170" cy="390" r="13"/><text class="urn-redlabel" x="170" y="394">R</text>
    <circle class="urn-red" cx="210" cy="390" r="13"/><text class="urn-redlabel" x="210" y="394">R</text>
    <circle class="urn-red" cx="250" cy="390" r="13"/><text class="urn-redlabel" x="250" y="394">R</text>
    <circle class="urn-red" cx="290" cy="390" r="13"/><text class="urn-redlabel" x="290" y="394">R</text>
    <circle class="urn-red" cx="330" cy="390" r="13"/><text class="urn-redlabel" x="330" y="394">R</text>
    <circle class="urn-selring" cx="170" cy="390" r="17"/>
    <circle class="urn-selring" cx="210" cy="390" r="17"/>
    <text class="urn-poolform" x="250" y="432"><tspan font-style="italic">C</tspan><tspan dy="4" font-size="65%">5</tspan><tspan dy="-9" font-size="65%">2</tspan><tspan dy="5"> = 10</tspan></text>
    <text class="urn-poolsub" x="250" y="454">2 rouges choisies parmi 5</text>

    <rect class="urn-poolbox" x="440" y="330" width="220" height="170" rx="16"/>
    <text class="urn-pooltitle" x="550" y="356">Pool verte (4)</text>
    <circle class="urn-green" cx="480" cy="390" r="13"/><text class="urn-greenlabel" x="480" y="394">V</text>
    <circle class="urn-green" cx="530" cy="390" r="13"/><text class="urn-greenlabel" x="530" y="394">V</text>
    <circle class="urn-green" cx="580" cy="390" r="13"/><text class="urn-greenlabel" x="580" y="394">V</text>
    <circle class="urn-green" cx="630" cy="390" r="13"/><text class="urn-greenlabel" x="630" y="394">V</text>
    <circle class="urn-selring" cx="480" cy="390" r="17"/>
    <text class="urn-poolform" x="550" y="432"><tspan font-style="italic">C</tspan><tspan dy="4" font-size="65%">4</tspan><tspan dy="-9" font-size="65%">1</tspan><tspan dy="5"> = 4</tspan></text>
    <text class="urn-poolsub" x="550" y="454">1 verte choisie parmi 4</text>

    <rect class="urn-etbox" x="362" y="400" width="56" height="30" rx="15"/>
    <text class="urn-et" x="390" y="420">ET &#x2192; &#xD7;</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — card(E) = 10x4 = 40, puis P(E) = 40/84 = 10/21
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <text class="urn-formula" x="400" y="530"><tspan>card(E) = </tspan><tspan font-style="italic">C</tspan><tspan dy="4" font-size="65%">5</tspan><tspan dy="-9" font-size="65%">2</tspan><tspan dy="5"> &#xD7; </tspan><tspan font-style="italic">C</tspan><tspan dy="4" font-size="65%">4</tspan><tspan dy="-9" font-size="65%">1</tspan><tspan dy="5"> = 10 &#xD7; 4 = 40</tspan></text>

    <rect class="urn-accentbox" x="280" y="550" width="240" height="54" rx="14"/>
    <text class="urn-accent" x="400" y="583">P(E) = 40/84 = 10/21</text>
    <text class="urn-approx" x="400" y="618">&#x2248; 0,476</text>
  </g><!-- /step-3 -->

</svg>
