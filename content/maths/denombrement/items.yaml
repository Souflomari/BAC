    correct_feedback: >
      Trois postes distincts occupés chacun par une personne différente :
      un arrangement, $A_{12}^3 = 12 \times 11 \times 10 = 1\,320$.
    solution: |
      **Ce qu'on cherche :** trois postes distincts, aucune personne ne
