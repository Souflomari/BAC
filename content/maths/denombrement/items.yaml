        text: "$126$"
        correct: false
        misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
        feedback: >
          Ce résultat est une combinaison, $\binom{9}{4}=126$, qui ignore
          l'ordre des 4 premières places. Mais 1er, 2e, 3e et 4e sont quatre
          rôles distincts : le classement (Ali, Sara, Karim, Nadia) est
          différent du classement (Sara, Ali, Karim, Nadia). Il faut un
          arrangement, pas une combinaison.
      - id: C
        text: "$6\\,561$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Ce résultat ($9^4$) traite le tirage comme s'il y avait remise,
          comme si un coureur déjà classé pouvait l'être une seconde fois à
          un autre rang. Un coureur ne peut occuper qu'UN SEUL rang : le
          nombre de choix diminue à chaque rang attribué (9, puis 8, puis 7,
