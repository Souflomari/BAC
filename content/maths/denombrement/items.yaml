        correct: true
      - id: B
        text: "$4^{26}$"
        correct: false
        misconception: mc.math.maths_denombrement.base-exposant-inverse
        feedback: >
          Tu as inversé les rôles de $n$ (le nombre de possibilités par
          position) et $p$ (le nombre de positions). Ici, il y a $26$
          lettres possibles pour chacune des $4$ positions : $n=26$, $p=4$,
          ce qui donne $n^p=26^4$ — pas $4^{26}$, qui prend $4$ comme base
          et $26$ comme exposant.
      - id: C
        text: "$358\\,800$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Ce résultat ($26 \times 25 \times 24 \times 23$) calcule un
          arrangement, en supposant qu'une lettre déjà utilisée ne peut plus
          resservir. Mais l'énoncé autorise explicitement la répétition :
