    (id de l'inventaire, ou null quand il correspond a une erreur hors-modele
    comme un comptage partiel ou une valeur particuliere). Le plancher >= 3 est
    atteint pour les 5 modeles. Honnetete (recette summit, etape 6) : trois
    items (DENOMB-20 symetrie, DENOMB-21 relation de Pascal, DENOMB-22 valeurs
    particulieres binom(n,0)) portent sur des PROPRIETES des combinaisons et
    n'ont pas de misconception primaire de l'inventaire ; leur primary est
    null (hors-inventaire), et ils ne comptent pas dans le plancher. Ces
    proprietes meriteraient leur propre modele de misconception dans une passe
    d'items ulterieure. Par ailleurs les items de probabilite DENOMB-24 et
    DENOMB-27 gatent en priorite les ruptures ordre / remise (choix du bon
    univers), pas proba-quotient-denombrement : ce dernier est gate par
    DENOMB-6, DENOMB-23 et DENOMB-26 (exactement au plancher de 3).
