    stem: >
      Pour te rendre au lycée, tu peux prendre SOIT un bus (3 lignes
      possibles), SOIT un tram (2 lignes possibles), mais jamais les deux à
      la fois pour un même trajet. Combien de façons différentes as-tu de te
      rendre au lycée ?
    type: mcq
    choices:
      - id: A
        text: "$5$"
        correct: true
      - id: B
        text: "$6$"
        correct: false
        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Tu as multiplié $3 \times 2 = 6$ au lieu d'additionner. Bus et
          tram sont deux façons ALTERNATIVES de faire le trajet (un "ou",
          pas un "et") : les deux familles de lignes ne se combinent jamais
          ensemble pour un même trajet. C'est le principe additif qui
          s'applique ici, pas le principe multiplicatif.
      - id: C
        text: "$3$"
        correct: false
        misconception: null
        feedback: >
          Ce choix ne retient que les lignes de bus, en oubliant
          complètement le tram comme option alternative.
      - id: D
        text: "$2$"
        correct: false
        misconception: null
        feedback: >
          Ce choix ne retient que les lignes de tram, en oubliant
          complètement le bus comme option alternative.
    correct_feedback: >
      Bus et tram sont deux façons qui s'excluent (un seul trajet, soit bus,
      soit tram) : $3+2=5$.
    solution: |
      **Ce qu'on cherche :** une alternative entre deux groupes disjoints de
      lignes (bus OU tram) — le principe additif s'applique.
      $$3 + 2 = 5$$
      Il y a 5 façons différentes de se rendre au lycée.

