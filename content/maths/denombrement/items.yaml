      - id: D
        text: "$104$"
        correct: false
        misconception: mc.math.maths_denombrement.base-exposant-inverse
        feedback: >
          Ce résultat ($26 \times 4$) multiplie le nombre de lettres
          possibles par le nombre de positions, au lieu d'élever à la
          puissance. Il faut multiplier $26$ par lui-même $4$ fois
          ($26^4$), pas multiplier $26$ par $4$.
    correct_feedback: >
      Chaque position a 26 choix indépendants (répétition autorisée) :
      c'est une p-liste, $26^4 = 456\,976$.
    solution: |
      **Ce qu'on cherche :** un tirage successif AVEC remise sur 4
      positions : une p-liste avec $n=26$, $p=4$.
      $$26^4 = 456\,976$$
      Il y a 456 976 codes possibles.

  - id: DENOMB-13
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_denombrement
    tags: ["p-liste", "tirage-avec-remise"]
    primary_misconception: mc.math.maths_denombrement.remise-avec-vs-sans
    stem: >
      On lance un dé à 6 faces trois fois de suite, et on note le résultat
      de chaque lancer dans l'ordre (par exemple $(3,3,6)$ est un résultat
      possible, tout comme $(6,3,3)$, qui est différent). Combien de
      résultats ordonnés différents sont possibles ?
    type: mcq
    choices:
      - id: A
        text: "$216$"
        correct: true
      - id: B
        text: "$20$"
        correct: false
        misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
        feedback: >
          Ce résultat est une combinaison, $\binom{6}{3}=20$, comme si
          l'ordre des trois lancers n'avait pas d'importance et qu'une même
          face ne pouvait pas ressortir. Mais $(3,3,6)$ et $(6,3,3)$
          comptent ici comme deux résultats DIFFÉRENTS, et le dé "se remet"
          à chaque lancer : c'est une p-liste, pas une combinaison.
      - id: C
        text: "$120$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Ce résultat ($6 \times 5 \times 4$) calcule un arrangement sans
          répétition, comme si une face déjà obtenue ne pouvait plus
          ressortir aux lancers suivants. Mais chaque lancer est indépendant
          des précédents : le dé peut parfaitement retomber sur la même face
          plusieurs fois.
      - id: D
        text: "$18$"
        correct: false
        misconception: mc.math.maths_denombrement.base-exposant-inverse
        feedback: >
          Ce résultat ($6 \times 3$) multiplie le nombre de faces par le
          nombre de lancers, au lieu d'élever à la puissance. Chaque lancer
          ajoute un facteur $6$ multiplicatif : il faut $6 \times 6 \times
          6 = 6^3$, pas $6 \times 3$.
    correct_feedback: >
      Trois lancers indépendants, chacun avec 6 issues possibles, où
      l'ordre est significatif et la répétition possible : une p-liste,
      $6^3=216$.
    solution: |
      **Ce qu'on cherche :** un tirage successif avec remise (le dé se
      "remet" à chaque lancer) sur 3 positions ordonnées : une p-liste avec
      $n=6$, $p=3$.
      $$6^3 = 216$$
      Il y a 216 résultats ordonnés possibles.

  - id: DENOMB-14
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_denombrement
    tags: ["arrangement", "tirage-sans-remise", "ordre"]
    primary_misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
    stem: >
      Une course rassemble 9 coureurs. On veut connaître le classement
