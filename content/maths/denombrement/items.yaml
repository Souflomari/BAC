        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Tu as additionné $\binom{8}{3} + \binom{5}{1} = 56+5=61$ au lieu
          de multiplier. "3 scientifiques ET 1 littéraire" combine deux
          choix simultanés : c'est le principe multiplicatif entre les deux
          combinaisons, $\binom{8}{3} \times \binom{5}{1}$, pas une somme.
      - id: C
        text: "$\\dfrac{280}{56}$"
        correct: false
        misconception: mc.math.maths_denombrement.proba-quotient-denombrement
        feedback: >
          Tu as utilisé $\binom{8}{3}=56$ comme dénominateur, comme si
          l'univers ne contenait que les scientifiques. Mais l'univers est
          l'ensemble des 13 candidats (scientifiques ET littéraires
          confondus) : le dénominateur correct est $\binom{13}{4}=715$, le
          nombre total de jurys possibles, pas un sous-groupe.
      - id: D
        text: "$\\dfrac{280}{17\\,160}$"
        correct: false
        misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
        feedback: >
          Tu as utilisé $A_{13}^4=17\,160$ au dénominateur, un arrangement
