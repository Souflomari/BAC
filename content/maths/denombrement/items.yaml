          \times 12 = 32\,760$, qui distingue l'ordre des 4 élèves. Mais une
          délégation "sans hiérarchie" ne distingue aucun ordre : chaque
          groupe de 4 est compté $4!=24$ fois dans cet arrangement. Il faut
          diviser par $4!$ pour ne compter chaque délégation qu'une seule
          fois.
      - id: C
        text: "$60$"
        correct: false
        misconception: mc.math.maths_denombrement.base-exposant-inverse
        feedback: >
          Ce résultat ($15 \times 4$) multiplie le nombre d'élèves par le
          nombre de places dans la délégation, au lieu d'utiliser le
          mécanisme de la combinaison. Il faut d'abord former l'arrangement
          $A_{15}^4$, puis diviser par $4!$ — pas multiplier $15$ par $4$.
      - id: D
        text: "$50\\,625$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Ce résultat ($15^4$) suppose qu'un même élève pourrait être choisi
          plusieurs fois pour la délégation, comme dans une p-liste avec
          répétition. Mais chaque élève ne peut faire partie de la
          délégation qu'une seule fois.
    correct_feedback: >
      Une délégation sans hiérarchie est un tirage simultané : une
      combinaison. $\binom{15}{4} = \dfrac{A_{15}^4}{4!} =
      \dfrac{32\,760}{24} = 1\,365$.
    solution: |
      **Ce qu'on cherche :** 4 élèves choisis parmi 15, sans ordre — une
      combinaison.
      $$A_{15}^4 = 15 \times 14 \times 13 \times 12 = 32\,760$$
      $$\binom{15}{4} = \frac{32\,760}{4!} = \frac{32\,760}{24} = 1\,365$$
      Il y a 1 365 délégations possibles.

  - id: DENOMB-20
    rung: "R6"
    difficulty_level: 2
    skill_code: maths_denombrement
    tags: ["combinaison", "symetrie"]
    primary_misconception: null
    stem: >
      On sait que $\binom{12}{5} = 792$. En utilisant la propriété de
      symétrie, que vaut $\binom{12}{7}$ ?
    type: mcq
    choices:
      - id: A
        text: "$792$"
        correct: true
      - id: B
        text: "$5$"
        correct: false
        misconception: null
        feedback: >
          Tu as confondu la propriété de symétrie avec une simple
          différence : $12-7=5$, mais $\binom{12}{7}$ n'est PAS égal à
          $12-7$. La symétrie dit que $\binom{12}{7} = \binom{12}{12-7} =
          \binom{12}{5}$ (donc $792$), pas que $\binom{12}{7}$ vaut
          littéralement $5$.
      - id: C
        text: "$396$"
        correct: false
        misconception: null
        feedback: >
          Tu as divisé $792$ par $2$, comme si $\binom{12}{7}$ et
          $\binom{12}{5}$ se partageaient la valeur totale. En réalité, ces
          deux quantités sont EXACTEMENT ÉGALES (chaque choix de 7 éléments
          à garder correspond exactement à un choix de 5 éléments à
          écarter) — ce n'est pas la moitié l'une de l'autre.
      - id: D
        text: "On ne peut pas savoir sans refaire tout le calcul avec les factorielles"
        correct: false
        misconception: null
        feedback: >
          C'est justement l'intérêt de la propriété de symétrie,
          $\binom{n}{p} = \binom{n}{n-p}$ : elle permet de retrouver
          $\binom{12}{7}$ directement à partir de $\binom{12}{5}$ déjà
          connu, sans repasser par les factorielles.
    correct_feedback: >
      $12-7=5$, donc par symétrie $\binom{12}{7} = \binom{12}{5} = 792$ :
      chaque choix de 7 éléments à garder détermine exactement un choix de 5
      éléments à écarter, et réciproquement.
    solution: |
      Propriété de symétrie : $\binom{n}{p} = \binom{n}{n-p}$, avec $n=12$,
      $p=7$. Comme $12-7=5$ :
      $$\binom{12}{7} = \binom{12}{5} = 792$$

  - id: DENOMB-21
    rung: "R6"
    difficulty_level: 3
    skill_code: maths_denombrement
    tags: ["combinaison", "triangle-de-pascal", "relation-de-pascal"]
    primary_misconception: null
    stem: >
      En utilisant la relation de Pascal, sachant que $\binom{6}{2}=15$ et
      $\binom{6}{3}=20$, que vaut $\binom{7}{3}$ ?
    type: mcq
    choices:
      - id: A
        text: "$35$"
        correct: true
      - id: B
        text: "$300$"
        correct: false
        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Tu as multiplié $15 \times 20 = 300$ au lieu d'additionner. La
          relation de Pascal repose sur un principe ADDITIF : un groupe
          contient l'élément fixé, ou il ne le contient pas — deux cas
          disjoints qu'on additionne, jamais qu'on multiplie.
          $\binom{n}{p} = \binom{n-1}{p-1} + \binom{n-1}{p}$.
      - id: C
        text: "$5$"
        correct: false
        misconception: null
        feedback: >
          Tu as soustrait $20-15=5$ au lieu d'additionner. La relation de
          Pascal additionne les deux cas disjoints (le groupe contient
          l'élément fixé, ou il ne le contient pas), elle ne les soustrait
          jamais.
      - id: D
        text: "$20$"
        correct: false
        misconception: null
        feedback: >
          Tu n'as gardé que $\binom{6}{3}=20$, en oubliant complètement le
          second terme $\binom{6}{2}=15$ de la relation de Pascal. Il faut
          additionner les DEUX termes, pas n'en retenir qu'un seul.
    correct_feedback: >
      Relation de Pascal : $\binom{7}{3} = \binom{6}{2} + \binom{6}{3} = 15
      + 20 = 35$.
    solution: |
      $$\binom{n}{p} = \binom{n-1}{p-1} + \binom{n-1}{p}$$
      avec $n=7$, $p=3$ :
      $$\binom{7}{3} = \binom{6}{2} + \binom{6}{3} = 15 + 20 = 35$$
      (Vérification directe : $\binom{7}{3} = \frac{7 \times 6 \times 5}{3
      \times 2 \times 1} = 35$.)

  - id: DENOMB-22
    rung: "R6"
    difficulty_level: 1
    skill_code: maths_denombrement
    tags: ["combinaison", "valeurs-particulieres"]
    primary_misconception: null
    stem: >
      Sans calculer de factorielle, que vaut $\binom{9}{0}$ ?
    type: mcq
    choices:
      - id: A
        text: "$1$"
        correct: true
      - id: B
        text: "$0$"
        correct: false
        misconception: null
        feedback: >
          Tu penses que "choisir 0 élément" signifie "aucune possibilité",
          donc $0$. Mais il existe justement UNE seule façon de ne rien
          choisir (le groupe vide), pas zéro façon : $\binom{n}{0}=1$ pour
          tout $n$, jamais $0$.
      - id: C
        text: "$9$"
        correct: false
        misconception: null
        feedback: >
          Tu confonds $\binom{9}{0}$ avec $\binom{9}{1}$ (choisir 1 élément
          parmi 9, qui vaut bien $9$). Ici c'est $0$ élément à choisir, pas
          $1$ : la bonne valeur est $\binom{9}{0}=1$.
      - id: D
        text: "Cette expression n'a pas de sens, car on ne peut pas choisir 0 élément"
        correct: false
        misconception: null
        feedback: >
          $\binom{9}{0}$ est parfaitement défini : c'est le nombre de
          façons de choisir un groupe VIDE parmi 9 éléments, et il n'y en a
          qu'une seule (ne rien prendre) — cette expression a un sens
          précis et une valeur bien définie, $1$.
    correct_feedback: >
      Il n'y a qu'une seule façon de choisir "rien du tout" parmi 9
      éléments (le groupe vide) : $\binom{9}{0}=1$, quel que soit $n$.
    solution: |
      $\binom{n}{0}=1$ pour tout $n$ (une seule façon de ne rien choisir :
      le groupe vide). Ici, $\binom{9}{0}=1$.

  - id: DENOMB-23
    rung: "R7"
    difficulty_level: 4
    skill_code: maths_denombrement
    tags: ["probabilite", "equiprobabilite", "combinaison"]
    primary_misconception: mc.math.maths_denombrement.proba-quotient-denombrement
    stem: >
      Une urne contient 6 boules rouges et 5 boules bleues, indiscernables
      au toucher. On tire simultanément 4 boules. Quelle est la probabilité
      d'obtenir exactement 2 boules rouges et 2 boules bleues ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{5}{11}$"
        correct: true
      - id: B
        text: "$\\dfrac{25}{330}$"
        correct: false
        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Tu as additionné $\binom{6}{2} + \binom{5}{2} = 15+10=25$ au lieu
          de multiplier. Mais "2 rouges ET 2 bleues" combine DEUX groupes
          différents en même temps (pas une alternative entre eux) : c'est
          le principe multiplicatif qui s'applique au numérateur,
          $\binom{6}{2} \times \binom{5}{2}$, pas le principe additif.
      - id: C
        text: "$\\dfrac{150}{15}$"
        correct: false
        misconception: mc.math.maths_denombrement.proba-quotient-denombrement
        feedback: >
          Tu as utilisé $\binom{6}{4}=15$ comme dénominateur, comme si
          l'univers ne contenait QUE les boules rouges. Mais l'univers est
          TOUTE l'urne (11 boules, rouges et bleues confondues) : le
          dénominateur d'une probabilité par équiprobabilité est toujours le
          nombre total de tirages possibles dans TOUT l'univers,
          $\binom{11}{4}=330$, pas un sous-groupe. (Remarque : $150/15=10$
          n'est même pas une probabilité valide, un signal que quelque
          chose ne va pas.)
      - id: D
        text: "$\\dfrac{15}{330}$"
        correct: false
        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Tu as gardé seulement $\binom{6}{2}=15$ au numérateur, en
          oubliant complètement la condition sur les boules bleues.
          L'événement demande 2 rouges ET 2 bleues : il faut le produit des
          deux choix, $\binom{6}{2} \times \binom{5}{2}=150$, pas un seul
          des deux facteurs.
    correct_feedback: >
      Univers : $\binom{11}{4}=330$ (tirage simultané de 4 boules parmi 11).
      Favorable : $\binom{6}{2} \times \binom{5}{2} = 15 \times 10 = 150$ (2
      rouges ET 2 bleues, principe multiplicatif entre deux combinaisons).
      $P = \dfrac{150}{330} = \dfrac{5}{11}$.
    solution: |
      **Univers :** choisir 4 boules parmi les 11 de l'urne.
      $$\text{card}(\Omega) = \binom{11}{4} = \frac{11 \times 10 \times 9
      \times 8}{4 \times 3 \times 2 \times 1} = 330$$

      **Événement favorable :** 2 rouges parmi les 6, ET 2 bleues parmi les
      5.
      $$\text{card}(E) = \binom{6}{2} \times \binom{5}{2} = 15 \times 10 = 150$$

      **Probabilité :**
      $$P(E) = \frac{150}{330} = \frac{5}{11}$$

  - id: DENOMB-24
    rung: "R7"
    difficulty_level: 4
    skill_code: maths_denombrement
    tags: ["probabilite", "equiprobabilite", "arrangement"]
    primary_misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
    stem: >
      On tire successivement et sans remise 3 cartes parmi 10 cartes
      numérotées de 1 à 10, en notant l'ordre du tirage. Quelle est la
      probabilité que les 3 cartes tirées soient exactement, dans cet
      ordre, 1 puis 2 puis 3 ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{1}{720}$"
        correct: true
      - id: B
        text: "$\\dfrac{6}{720}$"
        correct: false
        misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
        feedback: >
          Tu as compté $3!=6$ cas favorables, comme si n'importe quel ORDRE
          des cartes 1, 2, 3 convenait. Mais l'énoncé impose un ordre précis
          (1 PUIS 2 PUIS 3), pas n'importe lequel des $3!$ arrangements
          possibles de ces trois cartes : il n'y a qu'UN SEUL tirage
          favorable, pas six.
      - id: C
        text: "$\\dfrac{1}{120}$"
        correct: false
        misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
        feedback: >
          Tu as utilisé $\binom{10}{3}=120$ au dénominateur, une
          combinaison qui ignore l'ordre. Mais ici le tirage est SUCCESSIF
          et un ordre précis est demandé (1er, 2e, 3e tirage) : l'univers
          est un arrangement, $A_{10}^3=720$, pas une combinaison.
      - id: D
        text: "$\\dfrac{1}{1\\,000}$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Tu as utilisé $10^3=1\,000$ au dénominateur, comme si les cartes
          étaient remises après chaque tirage. Mais "sans remise" signifie
          qu'une carte déjà tirée ne peut plus ressortir : l'univers est
          l'arrangement $A_{10}^3=10 \times 9 \times 8=720$, pas une
          puissance.
    correct_feedback: >
      Tirage successif sans remise, avec un ordre exigé : univers =
      $A_{10}^3=720$. Un seul tirage donne exactement (1,2,3) dans cet
      ordre : favorable = 1. $P = \dfrac{1}{720}$.
    solution: |
      **Univers :** tirage ordonné sans remise de 3 cartes parmi 10.
      $$\text{card}(\Omega) = A_{10}^3 = 10 \times 9 \times 8 = 720$$

      **Événement favorable :** un seul résultat convient, l'ordre exact
      (1, 2, 3).
      $$\text{card}(E) = 1$$

      **Probabilité :**
      $$P(E) = \frac{1}{720}$$

  - id: DENOMB-25
    rung: "R8"
    difficulty_level: 4
    skill_code: maths_denombrement
    tags: ["p-liste", "principe-multiplicatif", "application"]
    primary_misconception: mc.math.maths_denombrement.base-exposant-inverse
    stem: >
      Un code de réduction est formé de 2 lettres majuscules (parmi les 26)
      suivies de 3 chiffres (parmi 0 à 9). Les lettres peuvent se répéter
      entre elles, et les chiffres aussi. Combien de codes de réduction
      différents existe-t-il ?
    type: mcq
    choices:
      - id: A
        text: "$676\\,000$"
        correct: true
      - id: B
        text: "$1\\,560$"
        correct: false
        misconception: mc.math.maths_denombrement.base-exposant-inverse
        feedback: >
          Ce résultat ($26 \times 2 \times 10 \times 3$) multiplie le
          nombre de lettres par le nombre de positions de lettres, et le
          nombre de chiffres par le nombre de positions de chiffres, au lieu
          d'élever chaque partie à la puissance correspondante. Chaque
          lettre est un choix indépendant parmi 26 (donc $26^2$, pas $26
          \times 2$), et chaque chiffre un choix indépendant parmi 10 (donc
          $10^3$, pas $10 \times 3$).
      - id: C
        text: "$1\\,676$"
        correct: false
        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Ce résultat ($676+1\,000$) additionne les deux parties du code
          (lettres et chiffres) au lieu de les multiplier. Un code complet
          est composé de 2 lettres ET 3 chiffres qui se combinent ENSEMBLE
          : c'est le principe multiplicatif entre les deux blocs, $26^2
          \times 10^3$, pas une somme.
      - id: D
        text: "$468\\,000$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Ce résultat ($26 \times 25 \times 10 \times 9 \times 8$) calcule
          comme si les lettres ne pouvaient pas se répéter entre elles ($26
          \times 25$) et les chiffres non plus ($10 \times 9 \times 8$).
          Mais l'énoncé autorise explicitement la répétition pour les deux
          : chaque lettre garde 26 choix (donc $26^2$), chaque chiffre garde
          10 choix (donc $10^3$).
    correct_feedback: >
      2 lettres avec répétition ($26^2=676$) ET 3 chiffres avec répétition
      ($10^3=1\,000$), deux blocs qui se combinent : $676 \times 1\,000 =
      676\,000$.
    solution: |
      **Bloc lettres :** p-liste, $n=26$, $p=2$ : $26^2=676$.
      **Bloc chiffres :** p-liste, $n=10$, $p=3$ : $10^3=1\,000$.
      Les deux blocs se combinent (principe multiplicatif) :
      $$676 \times 1\,000 = 676\,000$$
      Il y a 676 000 codes de réduction possibles.

