      - id: D
        text: "$362\\,880$"
        correct: false
        misconception: null
        feedback: >
          Ce résultat est $9!$, le nombre de façons de classer les 9
          coureurs EN ENTIER. Mais l'énoncé ne demande que les 4 premières
          places : il faut s'arrêter après 4 facteurs ($9 \times 8 \times 7
          \times 6$), pas continuer jusqu'à $1$.
    correct_feedback: >
      L'ordre compte (4 rôles distincts) et un coureur classé ne peut plus
      l'être une seconde fois : un arrangement, $A_9^4 = 9 \times 8 \times 7
      \times 6 = 3\,024$.
    solution: |
      **Ce qu'on cherche :** un tirage sans remise, ordonné (4 rôles
      distincts) parmi 9 coureurs : $A_9^4$.
      $$A_9^4 = 9 \times 8 \times 7 \times 6 = 3\,024$$
      Il y a 3 024 classements possibles pour les 4 premières places.

  - id: DENOMB-15
    rung: "R3"
