          entre ses membres : il faut une combinaison, $\binom{13}{4}=715$,
          pas un arrangement.
    correct_feedback: >
      Univers : $\binom{13}{4}=715$. Favorable : $\binom{8}{3} \times
      \binom{5}{1} = 56 \times 5 = 280$. $P = \dfrac{280}{715} =
      \dfrac{56}{143}$.
    solution: |
      **Univers :** choisir 4 personnes parmi les 13 candidats.
      $$\text{card}(\Omega) = \binom{13}{4} = \frac{13 \times 12 \times 11
      \times 10}{4 \times 3 \times 2 \times 1} = 715$$

      **Événement favorable :** 3 scientifiques parmi les 8, ET 1
      littéraire parmi les 5.
      $$\text{card}(E) = \binom{8}{3} \times \binom{5}{1} = 56 \times 5 = 280$$

      **Probabilité :**
      $$P(E) = \frac{280}{715} = \frac{56}{143}$$

