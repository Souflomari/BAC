  - id: DENOMB-18
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_denombrement
    tags: ["combinaison", "tirage-simultane"]
    primary_misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
    stem: >
      On doit former une équipe de 5 joueurs à partir de 11 candidats, sans
      distinction de poste entre les 5 joueurs retenus. Combien d'équipes
      différentes peut-on former ?
    type: mcq
    choices:
      - id: A
        text: "$462$"
        correct: true
      - id: B
        text: "$55\\,440$"
        correct: false
        misconception: mc.math.maths_denombrement.ordre-arrangement-vs-combinaison
        feedback: >
          Ce résultat est l'arrangement $A_{11}^5 = 11 \times 10 \times 9
          \times 8 \times 7 = 55\,440$, qui distingue l'ordre des 5 joueurs.
          Mais une équipe "sans distinction de poste" ne distingue aucun
          ordre : chaque groupe de 5 est compté $5!=120$ fois dans cet
          arrangement. Il faut diviser par $5!$ pour ne compter chaque
          équipe qu'une seule fois.
      - id: C
        text: "$16$"
        correct: false
        misconception: mc.math.maths_denombrement.additif-vs-multiplicatif
        feedback: >
          Ce résultat additionne $11+5=16$ au lieu d'appliquer le mécanisme
          de la combinaison. Former une équipe n'est ni une alternative
          entre deux familles séparées, ni une simple somme : c'est un
          tirage simultané d'un groupe, qui se calcule avec $\binom{n}{p}$.
      - id: D
        text: "$161\\,051$"
        correct: false
        misconception: mc.math.maths_denombrement.remise-avec-vs-sans
        feedback: >
          Ce résultat ($11^5$) suppose qu'un même candidat pourrait être
          choisi plusieurs fois pour l'équipe, comme dans une p-liste avec
          répétition. Mais chaque candidat ne peut faire partie de l'équipe
          qu'une seule fois.
    correct_feedback: >
      Une équipe sans rôles distincts est un tirage simultané : une
      combinaison. $\binom{11}{5} = \dfrac{A_{11}^5}{5!} =
      \dfrac{55\,440}{120} = 462$.
    solution: |
      **Ce qu'on cherche :** 5 joueurs choisis parmi 11, sans ordre — une
      combinaison.
      $$A_{11}^5 = 11 \times 10 \times 9 \times 8 \times 7 = 55\,440$$
      $$\binom{11}{5} = \frac{55\,440}{5!} = \frac{55\,440}{120} = 462$$
      Il y a 462 équipes possibles.

