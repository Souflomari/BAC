<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" width="640" height="414" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Cascade des divisions de 2025 par 7 : 2025 = 7 × 289 + 2, puis 289 = 7 × 41 + 2, puis 41 = 7 × 5 + 6, puis 5 = 7 × 0 + 5, où le quotient nul arrête la cascade. Chaque reste, encadré, est un chiffre de l’écriture en base 7 et porte un poids : le premier reste, 2, est celui des unités, puis viennent les poids 7, 49 et 343. Lus de bas en haut, les restes donnent l’écriture 5622 en base 7.">
  <title>2025 en base 7, par divisions successives</title>

  <!--
    numeration-cascade-2025-base7.svg — cascade STAGÉE des divisions
    euclidiennes successives par 7, sur l'exemple travaillé « écrire 2025 en
    base 7 » de la leçon (chapitre des systèmes de numération).

    Brief (commentaire d'auteur de la leçon, repris tel quel) :
      type: structural-diagram · tool: svg+katex (taxonomie ADR 0017)
      stages:
        1. les quatre divisions écrites de haut en bas, restes non marqués ;
        2. les quatre restes encadrés et étiquetés a0 … a3 : chaque reste
           porte un poids, et le premier porte 7 puissance 0 ;
        3. la flèche remontante et l'écriture assemblée, avec la légende :
           on lit de bas en haut parce que le premier reste est celui des
           unités.

    PLACEMENT : APRÈS le point d'arrêt sur l'ordre des restes. L'étape 3
    donne la réponse à ce point d'arrêt ; posée avant, elle viderait
    l'engagement de l'élève.

    Arithmétique vérifiée à la génération (assertions) :
      2025 = 7 × 289 + 2 ; 289 = 7 × 41 + 2 ; 41 = 7 × 5 + 6 ; 5 = 7 × 0 + 5
      chiffres lus de bas en haut : 5, 6, 2, 2 ;
      5 × 343 + 6 × 49 + 2 × 7 + 2 = 1715 + 294 + 14 + 2 = 2025.

    MÊME GRAMMAIRE VISUELLE qu'euclide-cascade (même notion) : une ligne par
    division, de haut en bas ; un connecteur en tirets qui porte le quotient
    d'une ligne vers le dividende de la suivante (le geste récursif) ; les
    nombres-clés en accent ; une lecture finale sous la cascade. Différence
    assumée : PAS de barres à l'échelle — 2025 et 5 diffèrent d'un facteur
    400, une échelle commune rendrait les dernières lignes invisibles. Ce que
    la figure enseigne ici est l'ORDRE des restes et leur poids, pas une
    grandeur.

    Couleurs : jetons figure-ink / figure-ink-soft ; l'ACCENT (figure-accent)
    marque une seule idée — les restes sont les chiffres (cadres des restes,
    étiquettes a0 … a3, flèche de lecture, chiffres de l'écriture assemblée).
    Cadres en contour seul (pas d'aplat) : rien ne passe par-dessus le texte
    de l'étape 1.
  -->

  <rect width="640" height="414" fill="var(--figure-surface)"/>

  <!-- Titre -->
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700"
        fill="var(--figure-ink)">2025 en base 7 — la cascade des divisions par 7</text>

  <!-- ══════════════ Étape 1 : les quatre divisions, restes non marqués ══════════════ -->
  <g id="step-1">
    <text x="190" y="92" text-anchor="end" font-size="18" fill="var(--figure-ink)">2025</text>
    <text x="205" y="92" text-anchor="middle" font-size="18" fill="var(--figure-ink)">=</text>
    <text x="220" y="92" font-size="18" fill="var(--figure-ink)">7 ×</text>
    <text x="262" y="92" font-size="18" fill="var(--figure-ink)">289</text>
    <text x="318" y="92" text-anchor="middle" font-size="18" fill="var(--figure-ink)">+</text>
    <text x="352" y="92" text-anchor="middle" font-size="18" fill="var(--figure-ink)">2</text>
    <text x="190" y="152" text-anchor="end" font-size="18" fill="var(--figure-ink)">289</text>
    <text x="205" y="152" text-anchor="middle" font-size="18" fill="var(--figure-ink)">=</text>
    <text x="220" y="152" font-size="18" fill="var(--figure-ink)">7 ×</text>
    <text x="262" y="152" font-size="18" fill="var(--figure-ink)">41</text>
    <text x="318" y="152" text-anchor="middle" font-size="18" fill="var(--figure-ink)">+</text>
    <text x="352" y="152" text-anchor="middle" font-size="18" fill="var(--figure-ink)">2</text>
    <text x="190" y="212" text-anchor="end" font-size="18" fill="var(--figure-ink)">41</text>
    <text x="205" y="212" text-anchor="middle" font-size="18" fill="var(--figure-ink)">=</text>
    <text x="220" y="212" font-size="18" fill="var(--figure-ink)">7 ×</text>
    <text x="262" y="212" font-size="18" fill="var(--figure-ink)">5</text>
    <text x="318" y="212" text-anchor="middle" font-size="18" fill="var(--figure-ink)">+</text>
    <text x="352" y="212" text-anchor="middle" font-size="18" fill="var(--figure-ink)">6</text>
    <text x="190" y="272" text-anchor="end" font-size="18" fill="var(--figure-ink)">5</text>
    <text x="205" y="272" text-anchor="middle" font-size="18" fill="var(--figure-ink)">=</text>
    <text x="220" y="272" font-size="18" fill="var(--figure-ink)">7 ×</text>
    <text x="262" y="272" font-size="18" fill="var(--figure-ink)">0</text>
    <text x="318" y="272" text-anchor="middle" font-size="18" fill="var(--figure-ink)">+</text>
    <text x="352" y="272" text-anchor="middle" font-size="18" fill="var(--figure-ink)">5</text>
    <g stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3 3">
      <line x1="278.2" y1="99.0" x2="182.4" y2="130.2"/>
      <line x1="272.8" y1="159.0" x2="187.7" y2="189.9"/>
      <line x1="267.4" y1="219.0" x2="192.9" y2="249.6"/>
    </g>
    <polygon points="173.8,133.0 181.0,125.9 183.8,134.5" fill="var(--figure-ink-soft)"/>
    <polygon points="179.2,193.0 186.1,185.7 189.2,194.2" fill="var(--figure-ink-soft)"/>
    <polygon points="184.6,253.0 191.2,245.4 194.6,253.7" fill="var(--figure-ink-soft)"/>
    <text x="267.4" y="298" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">quotient nul : on s’arrête</text>
  </g>

  <!-- ══════════════ Étape 2 : chaque reste encadré, étiqueté, avec son poids ══════════════ -->
  <g id="step-2">
    <rect x="334" y="68" width="36" height="32" rx="5" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="420" y="92" font-size="16" font-weight="600" fill="var(--figure-accent)"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="11">0</tspan></text>
    <text x="446" y="92" font-size="12.5" fill="var(--figure-ink-soft)">poids 7<tspan dy="-6" font-size="9">0</tspan><tspan dy="6"> = 1, les unités</tspan></text>
    <rect x="334" y="128" width="36" height="32" rx="5" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="420" y="152" font-size="16" font-weight="600" fill="var(--figure-accent)"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="11">1</tspan></text>
    <text x="446" y="152" font-size="12.5" fill="var(--figure-ink-soft)">poids 7<tspan dy="-6" font-size="9">1</tspan><tspan dy="6"> = 7</tspan></text>
    <rect x="334" y="188" width="36" height="32" rx="5" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="420" y="212" font-size="16" font-weight="600" fill="var(--figure-accent)"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="11">2</tspan></text>
    <text x="446" y="212" font-size="12.5" fill="var(--figure-ink-soft)">poids 7<tspan dy="-6" font-size="9">2</tspan><tspan dy="6"> = 49</tspan></text>
    <rect x="334" y="248" width="36" height="32" rx="5" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="420" y="272" font-size="16" font-weight="600" fill="var(--figure-accent)"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="11">3</tspan></text>
    <text x="446" y="272" font-size="12.5" fill="var(--figure-ink-soft)">poids 7<tspan dy="-6" font-size="9">3</tspan><tspan dy="6"> = 343</tspan></text>
  </g>

  <!-- ══════════════ Étape 3 : on remonte, et l'écriture s'assemble ══════════════ -->
  <g id="step-3">
    <line x1="395" y1="284" x2="395" y2="75" stroke="var(--figure-accent)" stroke-width="2"/>
    <polygon points="395,64 390,76 400,76" fill="var(--figure-accent)"/>
    <text x="268" y="352" text-anchor="end" font-size="22" fill="var(--figure-ink)">2025 =</text>
    <text x="292" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="var(--figure-accent)">5</text>
    <text x="308.5" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="var(--figure-accent)">6</text>
    <text x="325" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="var(--figure-accent)">2</text>
    <text x="341.5" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="var(--figure-accent)">2</text>
    <line x1="282" y1="327" x2="351" y2="327" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <text x="355" y="359" font-size="13" fill="var(--figure-ink)">(7)</text>
    <text x="292" y="374" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan><tspan dy="3" font-size="8">3</tspan></text>
    <text x="308.5" y="374" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan><tspan dy="3" font-size="8">2</tspan></text>
    <text x="325" y="374" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan><tspan dy="3" font-size="8">1</tspan></text>
    <text x="341.5" y="374" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan><tspan dy="3" font-size="8">0</tspan></text>
    <text x="320" y="400" text-anchor="middle" font-size="12.5" fill="var(--figure-ink)">On lit les restes de bas en haut : le premier reste est le chiffre des unités.</text>
  </g>
</svg>
