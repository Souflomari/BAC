<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Remontée de l'algorithme d'Euclide pour PGCD(252,198)=18 : on isole 18 égale 54 moins 36, puis on substitue 36 égale 198 moins 54 fois 3 pour obtenir 18 égale 54 fois 4 moins 198 fois 1, puis on substitue 54 égale 252 moins 198 pour obtenir 18 égale 252 fois 4 moins 198 fois 5, soit u égale 4, v égale moins 5.">
  <title>La remontée de Bézout — retrouver u, v tels que 252u + 198v = 18</title>
  <!--
    bezout-remontee.svg — StagedFigure, R4 de arithmetique/lesson.md.
    L'inverse délibéré de euclide-cascade.svg (R3) : celui-ci DESCEND vers
    le PGCD, celui-ci REMONTE pour l'écrire comme combinaison 252u+198v.

    CHROME (fixe, avant tout step) : les 3 lignes de descente de R3,
    grisées ("rappel") — jamais recolorées, jamais retirées : elles restent
    la référence pendant toute la remontée.

    "Deux jetons de coefficient" (demande du callout) : PAS une nouvelle
    teinte (le système n'autorise qu'un seul accent restreint). Distinction
    par TRAITEMENT : le terme qui deviendra le multiple de 252 est souligné
    d'un trait plein accent ; le terme qui reste attaché à 198 est souligné
    d'un trait accent EN POINTILLÉS. Cette convention (plein vs pointillé,
    même teinte) est réutilisée telle quelle entre step-2 et step-3 — on
    peut suivre un même jeton d'une étape à l'autre par son style de trait,
    pas par sa couleur.

    step-1 : isoler 18 = 54 - 36×1 (dernière ligne utile de la cascade).
    step-2 : substituer 36 = 198-54×3 -> 18 = 54×4 - 198×1. Le terme
             "54×4" (futur multiple de 252, trait plein) et "198×1"
             (déjà attaché à 198, trait pointillé).
    step-3 : substituer 54 = 252-198×1 -> le jeton "54×4" éclate en
             252×4 - 198×4, qui rejoint le jeton "198" (déjà -198×1) pour
             donner -198×5. Résultat encadré : 18 = 252×4 - 198×5,
             u = 4, v = -5.
  -->

  <rect width="700" height="500" fill="var(--figure-surface)"/>

  <text x="350" y="24" text-anchor="middle" font-size="13.5" font-weight="700"
        fill="var(--figure-ink)">Remonter l'algorithme d'Euclide pour écrire 18 = 252u + 198v</text>

  <!-- ══════════════ Chrome : rappel de la cascade descendante (R3), grisée ══════════════ -->
  <text x="60" y="54" font-size="10.5" font-style="italic" fill="var(--figure-ink-soft)">rappel — la cascade descendante (R3) :</text>
  <text x="60" y="74" font-size="12" fill="var(--figure-ink-soft)">252 = 198 &#215; 1 + 54</text>
  <text x="60" y="94" font-size="12" fill="var(--figure-ink-soft)">198 = 54 &#215; 3 + 36</text>
  <text x="60" y="114" font-size="12" fill="var(--figure-ink-soft)">54 = 36 &#215; 1 + 18</text>
  <line x1="30" y1="128" x2="670" y2="128" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════ Étape 1 : isoler 18 = 54 - 36×1 ══════════════ -->
  <g id="step-1">
    <text x="60" y="160" font-size="11" fill="var(--figure-ink-soft)">Étape 1 — isoler le reste de la dernière ligne utile :</text>
    <text x="60" y="190" font-size="17" font-weight="700" fill="var(--figure-ink)">18 = 54 &#8722; 36 &#215; 1</text>
  </g>

  <!-- ══════════════ Étape 2 : substituer 36 = 198-54×3 ══════════════ -->
  <g id="step-2">
    <text x="60" y="230" font-size="11" fill="var(--figure-ink-soft)">Étape 2 — remplacer 36 (ligne 2 : 36 = 198 &#8722; 54 &#215; 3) :</text>
    <text x="60" y="258" font-size="13.5" fill="var(--figure-ink)">18 = 54 &#8722; (198 &#8722; 54 &#215; 3) &#215; 1</text>
    <text x="60" y="282" font-size="13.5" fill="var(--figure-ink)">18 = 54 + 54 &#215; 3 &#8722; 198</text>

    <text x="60" y="316" font-size="17" font-weight="700" fill="var(--figure-ink)">18 =</text>
    <text x="110" y="316" font-size="17" font-weight="700" fill="var(--figure-ink)">54 &#215; 4</text>
    <line x1="110" y1="322" x2="168" y2="322" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="180" y="316" font-size="17" font-weight="700" fill="var(--figure-ink)">&#8722;</text>
    <text x="200" y="316" font-size="17" font-weight="700" fill="var(--figure-ink)">198 &#215; 1</text>
    <line x1="200" y1="322" x2="264" y2="322" stroke="var(--figure-accent)" stroke-width="2" stroke-dasharray="4,3"/>

    <text x="139" y="340" text-anchor="middle" font-size="10" font-style="italic" fill="var(--figure-accent)">deviendra ×252</text>
    <text x="232" y="340" text-anchor="middle" font-size="10" font-style="italic" fill="var(--figure-accent)">reste attaché à 198</text>
  </g>

  <!-- ══════════════ Étape 3 : substituer 54 = 252-198×1, résultat final ══════════════ -->
  <g id="step-3">
    <text x="60" y="374" font-size="11" fill="var(--figure-ink-soft)">Étape 3 — remplacer 54 (ligne 1 : 54 = 252 &#8722; 198 &#215; 1) :</text>
    <text x="60" y="400" font-size="13" fill="var(--figure-ink)">54 &#215; 4 = (252 &#8722; 198) &#215; 4 = 252 &#215; 4 &#8722; 198 &#215; 4</text>
    <text x="60" y="422" font-size="13" fill="var(--figure-ink)">18 = 252 &#215; 4 &#8722; 198 &#215; 4 &#8722; 198 &#215; 1</text>

    <rect x="42" y="438" width="330" height="42" rx="7" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="207" y="466" text-anchor="middle" font-size="18" font-weight="700" fill="var(--figure-ink)">18 = 252 &#215; 4 &#8722; 198 &#215; 5</text>

    <text x="440" y="452" font-size="14" fill="var(--figure-accent)"><tspan font-style="italic">u</tspan> = 4</text>
    <text x="440" y="474" font-size="14" fill="var(--figure-accent)"><tspan font-style="italic">v</tspan> = &#8722;5</text>
  </g>

</svg>
