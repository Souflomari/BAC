<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Quatre instantanés d’un bidon de 3 litres et d’un bidon de 5 litres : (3,0) après avoir rempli le petit bidon, (0,3) après l’avoir versé dans le grand (il reste 2 L de place), (3,3) après l’avoir rempli à nouveau, puis (1,5) après avoir complété le grand bidon — il reste exactement 1 L dans le petit, la réponse cherchée.">
  <title>Les deux bidons (3 L, 5 L) : la suite de versements qui donne 1 L</title>

  <!--
    bidons-3-5.svg — StagedFigure, R0 de arithmetique/lesson.md.

    INTERPRÉTATION DE "structure fixe" : le callout demande "a fixed
    two-jug frame ... that reveals the winning pour sequence one state at
    a time". Le contrat StagedFigure (LESSON-EXPERIENCE-SPEC §2.3) ne
    permet que des AJOUTS entre étapes (les groupes step-N antérieurs
    restent dans le DOM, assourdis à 0.55 — jamais retirés/redessinés) ;
    réutiliser UNE SEULE paire de bidons et faire "monter/descendre" le
    niveau d'eau d'une étape à l'autre exigerait de faire disparaître de
    l'eau déjà versée (ex. le bidon de 3 L, plein à l'étape 1, redevient
    vide à l'étape 2) — impossible sans repeindre par-dessus, ce qui
    casserait l'assourdissement des étapes passées. Solution retenue,
    EXACTEMENT le motif déjà utilisé par euclide-cascade.svg (référence
    de ce lot) : chaque étape est un INSTANTANÉ spatialement
    distinct, avec le même gabarit de bidons (mêmes largeurs, même
    échelle, mêmes graduations) répété à chaque panneau — la "structure
    fixe" est le GABARIT (bidons + graduations), pas une unique instance
    partagée. Les 4 panneaux restent visibles (assourdis) une fois
    révélés : on voit la suite entière se construire de gauche à droite.

    Échelle UNIQUE, honnête, partagée par les deux bidons : 20 px / litre.
    Bidon 3 L : 50×60 px. Bidon 5 L : 60×100 px. Ligne de base commune
    (le fond des deux bidons) : y = 320, pour chacun des 4 panneaux.

    Rôle des couleurs : structure (bidons, graduations, textes d'état)
    en --figure-ink / --figure-ink-soft ; l'eau versée, dans les deux
    bidons, en --figure-accent (seul accent, sans nouvelle teinte) ; à
    l'étape 4, le bidon de 3 L (qui porte la réponse, 1 L) reçoit un
    contour accent plus épais — même hiérarchie que "le PGCD en accent
    plein" dans euclide-cascade, pas une couleur supplémentaire.

    step-1 : (3, 0) — le bidon de 3 L rempli à ras bord.
    step-2 : (0, 3) — versé dans le bidon de 5 L ; il reste 2 L de place.
    step-3 : (3, 3) — le bidon de 3 L rempli à nouveau.
    step-4 : (1, 5) — versé jusqu'à ce que le bidon de 5 L soit plein ;
              il reste exactement 1 L dans le petit bidon — la réponse.
  -->

  <rect width="960" height="380" fill="var(--figure-surface)"/>

  <!-- Titre (chrome) -->
  <text x="480" y="24" text-anchor="middle" font-size="14" font-weight="700"
        fill="var(--figure-ink)">Un bidon de 3 L, un bidon de 5 L — obtenir 1 L</text>
  <text x="480" y="40" text-anchor="middle" font-size="10.5" font-style="italic"
        fill="var(--figure-ink-soft)">En accent : l’eau versée dans chaque bidon</text>

  <!-- ══════════════ Étape 1 : (3, 0) — le bidon de 3 L plein ══════════════ -->
  <g id="step-1">
    <!-- bidon 3 L, plein -->
    <rect x="40" y="260" width="50" height="60" fill="var(--figure-accent)"/>
    <rect x="40" y="260" width="50" height="60" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="34" y1="300" x2="40" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="34" y1="280" x2="40" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="30" y="304" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">1</text>
    <text x="30" y="284" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">2</text>
    <text x="30" y="264" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">3</text>
    <text x="65" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="var(--figure-surface)">3</text>
    <text x="65" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 3 L</text>

    <!-- bidon 5 L, vide -->
    <rect x="120" y="220" width="60" height="100" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="114" y1="300" x2="120" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="114" y1="280" x2="120" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="114" y1="260" x2="120" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="114" y1="240" x2="120" y2="240" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="110" y="304" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">1</text>
    <text x="110" y="284" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">2</text>
    <text x="110" y="264" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">3</text>
    <text x="110" y="244" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">4</text>
    <text x="110" y="224" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">5</text>
    <text x="150" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 5 L</text>

    <text x="110" y="358" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-ink)">État : (3 L, 0 L)</text>
  </g>

  <!-- ══════════════ Étape 2 : (0, 3) — versé dans le bidon de 5 L ══════════════ -->
  <g id="step-2">
    <!-- bidon 3 L, vide -->
    <rect x="280" y="260" width="50" height="60" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="274" y1="300" x2="280" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="274" y1="280" x2="280" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="305" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 3 L</text>

    <!-- bidon 5 L, rempli à 3 L -->
    <rect x="360" y="220" width="60" height="100" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <rect x="360" y="260" width="60" height="60" fill="var(--figure-accent)"/>
    <rect x="360" y="220" width="60" height="100" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="354" y1="300" x2="360" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="354" y1="280" x2="360" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="354" y1="260" x2="360" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="354" y1="240" x2="360" y2="240" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="390" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="var(--figure-surface)">3</text>
    <text x="390" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 5 L</text>

    <!-- annotation : la place restante, dans le vide au-dessus de l'eau -->
    <text x="390" y="238" text-anchor="middle" font-size="10" font-style="italic" fill="var(--figure-accent)">reste 2 L</text>
    <text x="390" y="250" text-anchor="middle" font-size="10" font-style="italic" fill="var(--figure-accent)">de place</text>

    <text x="350" y="358" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-ink)">État : (0 L, 3 L)</text>
  </g>

  <!-- ══════════════ Étape 3 : (3, 3) — le bidon de 3 L rempli à nouveau ══════════════ -->
  <g id="step-3">
    <!-- bidon 3 L, plein -->
    <rect x="520" y="260" width="50" height="60" fill="var(--figure-accent)"/>
    <rect x="520" y="260" width="50" height="60" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="514" y1="300" x2="520" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="514" y1="280" x2="520" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="545" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="var(--figure-surface)">3</text>
    <text x="545" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 3 L</text>

    <!-- bidon 5 L, toujours à 3 L -->
    <rect x="600" y="220" width="60" height="100" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <rect x="600" y="260" width="60" height="60" fill="var(--figure-accent)"/>
    <rect x="600" y="220" width="60" height="100" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="594" y1="300" x2="600" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="594" y1="280" x2="600" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="594" y1="260" x2="600" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="594" y1="240" x2="600" y2="240" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="630" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="var(--figure-surface)">3</text>
    <text x="630" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 5 L</text>

    <text x="590" y="358" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-ink)">État : (3 L, 3 L)</text>
  </g>

  <!-- ══════════════ Étape 4 : (1, 5) — la réponse : 1 L dans le petit bidon ══════════════ -->
  <g id="step-4">
    <!-- bidon 3 L, réduit à 1 L — la réponse, contour accent renforcé -->
    <rect x="760" y="260" width="50" height="60" fill="none" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <rect x="760" y="280" width="50" height="40" fill="var(--figure-accent)"/>
    <rect x="760" y="260" width="50" height="60" fill="none" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="754" y1="300" x2="760" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="754" y1="280" x2="760" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="785" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="var(--figure-surface)">1</text>
    <text x="785" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 3 L</text>

    <!-- bidon 5 L, plein -->
    <rect x="840" y="220" width="60" height="100" fill="var(--figure-accent)"/>
    <rect x="840" y="220" width="60" height="100" fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <line x1="834" y1="300" x2="840" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="834" y1="280" x2="840" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="834" y1="260" x2="840" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="834" y1="240" x2="840" y2="240" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="870" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="var(--figure-surface)">5</text>
    <text x="870" y="336" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">bidon 5 L</text>

    <text x="830" y="358" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--figure-ink)">État : (<tspan fill="var(--figure-accent)">1 L</tspan>, 5 L) — la réponse</text>
  </g>

</svg>
