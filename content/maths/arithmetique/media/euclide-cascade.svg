<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Cascade de l'algorithme d'Euclide pour PGCD(252, 198) : quatre lignes de division à l'échelle — 252 = 198×1+54, puis 198 = 54×3+36, puis 54 = 36×1+18, puis 36 = 18×2+0 — chaque barre proportionnelle aux nombres réels, jusqu'au reste nul ; le dernier reste non nul, 18, est le PGCD, colorié en accent partout où il apparaît.">
  <title>PGCD(252, 198) par l'algorithme d'Euclide, à l'échelle</title>

  <!--
    euclide-cascade.svg — cascade STATIQUE de l'algorithme d'Euclide,
    sur l'exemple travaillé du R3 de la leçon (PGCD(252,198) = 18).

    Échelle UNIQUE pour les 4 lignes (pas de renormalisation par ligne) :
      s = 20/9 px par unité  →  252→560px, 198→440px, 54→120px, 36→80px,
      18→40px. Tous des entiers exacts, aucun arrondi.

    Chaque ligne représente a = b×q + r comme UNE barre de longueur a
    (à l'échelle), coupée en une zone "quotient" (q cellules de largeur b,
    séparées par de fines graduations) et une zone "reste" r.

    Correspondance géométrique EXACTE (pas décorative) : comme la ligne
    suivante a pour dividende l'ancien diviseur (a_{k+1} = b_k), la barre
    de la ligne k+1 se termine très exactement là où se termine, dans la
    ligne k, la première cellule de largeur b_k — d'où les connecteurs
    verticaux en tirets, posés pile à ces abscisses (488, 168, 128) :
      488 = 48 + 198×s  (fin de la ligne 2, = frontière quotient/reste L1)
      168 = 48 +  54×s  (fin de la ligne 3, = 1ère graduation de L2)
      128 = 48 +  36×s  (fin de la ligne 4, = frontière quotient/reste L3)

    Couleurs : zones "quotient" ordinaires en --figure-ink-soft ; zones
    "reste" en --figure-accent, à opacité CROISSANTE (0,28 → 0,55 → 1)
    à mesure qu'on approche le dernier reste non nul ; le nombre 18 —
    reste final ET diviseur qui le fait apparaître deux fois à la
    dernière ligne — est en accent plein partout où il figure. Aucune
    autre teinte n'est utilisée : un seul accent, réservé au PGCD.
  -->

  <rect width="640" height="410" fill="var(--figure-surface)"/>

  <!-- Titre -->
  <text x="320" y="22" text-anchor="middle" font-size="15" font-weight="700"
        fill="var(--figure-ink)">PGCD(252, 198) — l'algorithme d'Euclide, à l'échelle</text>

  <!-- Légende de couleur -->
  <text x="320" y="40" text-anchor="middle" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">En accent : le nombre 18, qui devient le PGCD</text>

  <!-- ══════════════ Connecteurs (le reste devient le prochain diviseur) ══════════════ -->
  <g stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="488" y1="94" x2="488" y2="142"/>
    <line x1="168" y1="172" x2="168" y2="220"/>
    <line x1="128" y1="250" x2="128" y2="298"/>
  </g>
  <g fill="var(--figure-ink-soft)">
    <polygon points="488,142 484,133 492,133"/>
    <polygon points="168,220 164,211 172,211"/>
    <polygon points="128,298 124,289 132,289"/>
  </g>

  <!-- ══════════════ Ligne 1 : 252 = 198 × 1 + 54 ══════════════ -->
  <g>
    <rect x="48" y="64" width="440" height="30" rx="3" fill="var(--figure-ink-soft)"/>
    <rect x="488" y="64" width="120" height="30" rx="3" fill="var(--figure-accent)" fill-opacity="0.28"/>
    <rect x="48" y="64" width="560" height="30" rx="3" fill="none" stroke="var(--figure-ink)" stroke-width="1.25"/>
    <text x="48" y="58" font-size="10.5" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan> = 252</text>
    <text x="268" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">198</text>
    <text x="548" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">54</text>
    <text x="328" y="110" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">252 = 198 × 1 + 54</text>
  </g>

  <!-- ══════════════ Ligne 2 : 198 = 54 × 3 + 36 ══════════════ -->
  <g>
    <rect x="48"  y="142" width="360" height="30" rx="3" fill="var(--figure-ink-soft)"/>
    <line x1="168" y1="142" x2="168" y2="172" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="288" y1="142" x2="288" y2="172" stroke="var(--figure-grid)" stroke-width="1"/>
    <rect x="408" y="142" width="80" height="30" rx="3" fill="var(--figure-accent)" fill-opacity="0.55"/>
    <rect x="48"  y="142" width="440" height="30" rx="3" fill="none" stroke="var(--figure-ink)" stroke-width="1.25"/>
    <text x="48" y="136" font-size="10.5" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan> = 198</text>
    <text x="108" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">54</text>
    <text x="228" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">54</text>
    <text x="348" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">54</text>
    <text x="448" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">36</text>
    <text x="268" y="188" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">198 = 54 × 3 + 36</text>
  </g>

  <!-- ══════════════ Ligne 3 : 54 = 36 × 1 + 18 (18 apparaît : futur PGCD) ══════════════ -->
  <g>
    <rect x="48"  y="220" width="80" height="30" rx="3" fill="var(--figure-ink-soft)"/>
    <rect x="128" y="220" width="40" height="30" rx="3" fill="var(--figure-accent)"/>
    <rect x="48"  y="220" width="120" height="30" rx="3" fill="none" stroke="var(--figure-ink)" stroke-width="1.25"/>
    <text x="48" y="214" font-size="10.5" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan> = 54</text>
    <text x="88" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">36</text>
    <text x="148" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">18</text>
    <text x="108" y="266" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">54 = 36 × 1 + 18</text>
  </g>

  <!-- ══════════════ Ligne 4 : 36 = 18 × 2 + 0 (18 tapisse toute la barre, reste nul) ══════════════ -->
  <g>
    <rect x="48" y="298" width="80" height="30" rx="3" fill="var(--figure-accent)"/>
    <line x1="88" y1="298" x2="88" y2="328" stroke="var(--figure-surface)" stroke-width="1.5"/>
    <rect x="48" y="298" width="80" height="30" rx="3" fill="none" stroke="var(--figure-ink)" stroke-width="1.25"/>
    <text x="48" y="292" font-size="10.5" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan> = 36</text>
    <text x="68"  y="318" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">18</text>
    <text x="108" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="var(--figure-ink)">18</text>
    <text x="138" y="318" font-size="10.5" fill="var(--figure-ink-soft)">reste = 0 → arrêt</text>
    <text x="88" y="344" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">36 = 18 × 2 + 0</text>
  </g>

  <!-- ══════════════ Conclusion ══════════════ -->
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">Dernier reste non nul :</text>
  <text x="320" y="390" text-anchor="middle" font-size="17" font-weight="700"
        fill="var(--figure-ink)">PGCD(252, 198) = <tspan fill="var(--figure-accent)">18</tspan></text>
</svg>
