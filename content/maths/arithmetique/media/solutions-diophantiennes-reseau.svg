<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Un repère (x,y) avec la droite 252x+198y=36, portant la solution particulière (8,-10). Les solutions entières voisines, (-3,4) et (19,-24), sont marquées de part et d'autre, régulièrement espacées d'un pas (11,-14) : le paramètre entier t indique quel point du réseau on regarde.">
  <title>Les solutions entières de 252x + 198y = 36 — un réseau régulier sur une droite</title>
  <!--
    solutions-diophantiennes-reseau.svg — StagedFigure, R7 de
    arithmetique/lesson.md. Ordre canonique "graphe" : axes -> données ->
    lecture (LESSON-EXPERIENCE-SPEC §2.5).

    SCHÉMATIQUE, PAS À L'ÉCHELLE (demande explicite du callout : les
    coefficients 252/198 sont trop grands pour une échelle honnête ; ce
    qui compte est "des points entiers régulièrement espacés sur une
    droite", pas une pente exacte). La grille et les axes sont un simple
    repère (x,y) ; l'origine (0,0) n'est volontairement PAS sur la droite
    tracée (au vrai rapport, la droite 252x+198y=36 ne passe pas près de
    l'origine à cette échelle non plus — c'est donc honnête, pas trompeur).

    Repère écran (schématique) : origine O_px = (110, 430). Grille de
    fond tous les 60 px (repère visuel seulement, pas d'unité réelle).
    La droite et ses points sont positionnés arbitrairement dans le
    quadrant supérieur droit, espacés d'un pas RÉGULIER (55.6, 70.7) px
    représentant le vecteur direction (b',-a')=(11,-14) normalisé — la
    régularité du pas est ce qui est démontré, pas sa longueur réelle.

    step-1 : le repère (x,y), la grille, l'origine.
    step-2 : la droite 252x+198y=36 et le point particulier (8,-10), t=0.
    step-3 : les solutions voisines t=-1, t=1, le vecteur-pas (11,-14),
             et la formule générale x=8+11t, y=-10-14t.
  -->

  <rect width="700" height="500" fill="var(--figure-surface)"/>

  <text x="350" y="24" text-anchor="middle" font-size="13.5" font-weight="700"
        fill="var(--figure-ink)">Les solutions entières de 252x + 198y = 36</text>
  <text x="350" y="40" text-anchor="middle" font-size="10" font-style="italic"
        fill="var(--figure-ink-soft)">repère schématique — la régularité du pas compte, pas l'échelle</text>

  <!-- ══════════════ Étape 1 : le repère, la grille, l'origine ══════════════ -->
  <g id="step-1">
    <g stroke="var(--figure-grid)" stroke-width="1">
      <line x1="70"  y1="40"  x2="70"  y2="430"/>
      <line x1="130" y1="40"  x2="130" y2="430"/>
      <line x1="190" y1="40"  x2="190" y2="430"/>
      <line x1="250" y1="40"  x2="250" y2="430"/>
      <line x1="310" y1="40"  x2="310" y2="430"/>
      <line x1="370" y1="40"  x2="370" y2="430"/>
      <line x1="430" y1="40"  x2="430" y2="430"/>
      <line x1="490" y1="40"  x2="490" y2="430"/>
      <line x1="550" y1="40"  x2="550" y2="430"/>
      <line x1="610" y1="40"  x2="610" y2="430"/>
      <line x1="670" y1="40"  x2="670" y2="430"/>
      <line x1="60"  y1="70"  x2="670" y2="70"/>
      <line x1="60"  y1="130" x2="670" y2="130"/>
      <line x1="60"  y1="190" x2="670" y2="190"/>
      <line x1="60"  y1="250" x2="670" y2="250"/>
      <line x1="60"  y1="310" x2="670" y2="310"/>
      <line x1="60"  y1="370" x2="670" y2="370"/>
    </g>

    <line x1="60" y1="430" x2="670" y2="430" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
    <polygon points="682,430 670,425.5 670,434.5" fill="var(--figure-ink-soft)"/>
    <line x1="110" y1="430" x2="110" y2="30" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
    <polygon points="110,18 105.5,30 114.5,30" fill="var(--figure-ink-soft)"/>
    <text x="662" y="450" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">x</text>
    <text x="118" y="24" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">y</text>
    <text x="98" y="442" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">O</text>
  </g>

  <!-- ══════════════ Étape 2 : la droite et la solution particulière (8,-10), t=0 ══════════════ -->
  <g id="step-2">
    <line x1="300" y1="55" x2="545" y2="360" stroke="var(--figure-accent)" stroke-width="2" stroke-linecap="round"/>
    <text x="552" y="378" font-size="11.5" fill="var(--figure-accent)">252<tspan
          font-style="italic">x</tspan> + 198<tspan font-style="italic">y</tspan> = 36</text>

    <circle cx="420" cy="220" r="5.5" fill="var(--figure-accent)"/>
    <text x="434" y="210" font-size="13" font-weight="700" fill="var(--figure-accent)">(8, &#8722;10)</text>
    <text x="420" y="240" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink)"><tspan
          font-style="italic">t</tspan> = 0</text>
  </g>

  <!-- ══════════════ Étape 3 : les solutions voisines et le pas (11,-14) ══════════════ -->
  <g id="step-3">
    <!-- continuation en pointillé, au-delà des points marqués -->
    <line x1="260" y1="20" x2="300" y2="55" stroke="var(--figure-accent)" stroke-width="1.6" stroke-dasharray="5,4"/>
    <line x1="545" y1="360" x2="585" y2="405" stroke="var(--figure-accent)" stroke-width="1.6" stroke-dasharray="5,4"/>
    <text x="248" y="20" font-size="14" fill="var(--figure-ink-soft)">&#8230;</text>
    <text x="592" y="415" font-size="14" fill="var(--figure-ink-soft)">&#8230;</text>

    <!-- t = -1 -->
    <circle cx="364.4" cy="149.3" r="4" fill="var(--figure-accent)"/>
    <text x="352" y="138" text-anchor="end" font-size="12" fill="var(--figure-ink)">(&#8722;3, 4)</text>
    <text x="364.4" y="170" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink)"><tspan
          font-style="italic">t</tspan> = &#8722;1</text>

    <!-- t = 1 -->
    <circle cx="475.6" cy="290.7" r="4" fill="var(--figure-accent)"/>
    <text x="490" y="284" font-size="12" fill="var(--figure-ink)">(19, &#8722;24)</text>
    <text x="475.6" y="310" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--figure-ink)"><tspan
          font-style="italic">t</tspan> = 1</text>

    <!-- vecteur-pas, entre t=0 et t=1, décalé perpendiculairement -->
    <line x1="406" y1="231" x2="461.6" y2="301.7" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <polygon points="461.6,301.7 449.5,298 453.7,289" fill="var(--figure-accent)"/>
    <text x="428" y="256" text-anchor="middle" font-size="10.5" fill="var(--figure-accent)">(+11, &#8722;14)</text>

    <!-- même pas, entre t=-1 et t=0, sans réétiqueter -->
    <line x1="350.3" y1="160.4" x2="405.9" y2="231.1" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <polygon points="405.9,231.1 393.8,227.4 398,218.4" fill="var(--figure-accent)"/>

    <rect x="200" y="450" width="300" height="30" rx="6" fill="none" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="350" y="470" text-anchor="middle" font-size="12.5" fill="var(--figure-ink)"><tspan
          font-style="italic">x</tspan> = 8 + 11<tspan font-style="italic">t</tspan>,  <tspan
          font-style="italic">y</tspan> = &#8722;10 &#8722; 14<tspan font-style="italic">t</tspan>  (<tspan
          font-style="italic">t</tspan> &#8712; &#8484;)</text>
  </g>

</svg>
