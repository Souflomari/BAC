        recompté question par question sur le scan et revérifié ici :
        0,5 + 0,5 + 0,75 + 0,75 + 0,5 = 3, conforme à l'annonce de la page 1.
        Transcription vérifiée par une passe adversariale indépendante
        (2026-08-23, docs/sujets/_incoming/maths-sm-2024-r.md, statut
        « vérifié ») : re-fetch de element/145741, re-dérivation des chemins
        d'images depuis le HTML, et re-lecture de la page sur l'image — chaque
        nombre, indice, exposant, borne et barème relu sur le scan et jamais
        sur le texte transcrit. Aucune figure n'accompagne cet exercice.
        CONTRE-CALCUL REFAIT ICI, chiffre par chiffre. Question 1, algorithme
        d'Euclide descendant : 23 = 2 x 10 + 3, puis 10 = 3 x 3 + 1, puis
        3 = 3 x 1 + 0 — le PGCD vaut 1, ce qui garantit l'existence de
        l'inverse. Remontée : 1 = 10 - 3 x 3 = 10 - 3 x (23 - 2 x 10) =
        7 x 10 - 3 x 23, d'où u = 7, et le contrôle direct 70 = 3 x 23 + 1
        confirme 10 x 7 congru a 1 modulo 23. La valeur 7 appartient bien à
        l'ensemble {1, ..., 22} demandé. Question 3-b, résolution : 23 divise
        (q + 7) donne q = 23k - 7, et la contrainte q entier naturel impose
        k >= 1 ; d'où x = 10q + 2 = 230k - 68, soit x = 230t + 162 avec
        t = k - 1 entier naturel. Contrôle du plus petit élément : 162 = 7 x 23
        + 1 donc x congru a 1 modulo 23 ✔, et 162 = 16 x 10 + 2 donc x congru a
        2 modulo 10 ✔. Le module 230 est bien le PPCM de 23 et 10, premiers
        entre eux. Ces valeurs coïncident avec la re-dérivation du
        vérificateur, qui annonce u = 7 (car 70 = 3 x 23 + 1) et
        x = 230t + 162 avec t entier naturel. NB DE PÉRIMÈTRE : contrairement
        aux neuf autres entrées de cette banque, cet exercice ne mobilise PAS
        le petit théorème de Fermat. Il n'utilise que des rungs de la leçon —
        R1 division euclidienne, R2 congruences, R4 Bézout et coprimalité,
        R5 théorème de Gauss — sans aucun outil hors-rung. AJOUT DE CETTE
        ENTRÉE AU CORPUS : l'épreuve SM 2024 rattrapage passe de 10,50 à
