  # **critère de divisibilité** — « 23 divise m si et seulement si 23 divise
  # q + 7r », où q et r sont le quotient et le reste de m par 10 — puis s'en
  # sert pour résoudre un système de congruences. C'est le seul exercice de la
  # banque où l'arithmétique modulaire sert à FABRIQUER un outil de calcul
