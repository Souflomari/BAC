    intro: |-
      **Arithmétique (examen national Sciences Mathématiques, session normale 2023, Exercice 4).**

      Soit $p$ un nombre premier impair. On considère dans $\mathbb{Z}$ l'équation $(E) : x^2 \equiv 2\ [p]$.

      L'exercice combine le petit théorème de Fermat — hors-rung, déjà rencontré au sommet de leçon 2019 (rupture-gate cp-r6-fermat) —, le lemme d'Euclide (R6) et le théorème de Gauss (R5), avec deux outils entièrement extérieurs au corps de la leçon arithmétique : une identité combinatoire sur les coefficients binomiaux $C_p^k$ (fournie par l'énoncé, non démontrée dans la leçon) et la formule de Moivre en forme trigonométrique — un registre qui relève de la notion nombres complexes, pas de l'arithmétique. Les deux sont bridgés au point d'usage dans le raisonnement, jamais supposés acquis.
    questions:
      - id: q1
        part: "Partie A — Fermat, puis un carré qui se factorise"
        stem: |-
          **(0,25 pt)** Montrer que : $2^{p-1} \equiv 1\ [p]$
        reasoning: |-
          $p$ est premier et **impair** (hypothèse de l'énoncé), donc $p \neq 2$ : le seul diviseur premier de $2$ étant $2$ lui-même, $p$ ne divise pas $2$. Comme $p$ est premier, cela donne $\mathrm{PGCD}(p,2)=1$ (rung R4).

          C'est ici qu'intervient le **petit théorème de Fermat** — hors-rung, déjà rencontré au sommet de leçon 2019 (rupture-gate cp-r6-fermat) : $p$ premier et $p \nmid a$ entraîne $a^{p-1} \equiv 1 \pmod p$. Avec $a=2$, cela donne directement $2^{p-1} \equiv 1 \pmod p$.
        steps:
          - math: 'p\ \text{premier et impair} \implies p \nmid 2 \implies \mathrm{PGCD}(p,2) = 1'
            note: "p est impair donc different de 2, seul diviseur premier de 2 : p ne divise pas 2 (R4)."
          - math: '2^{p-1} \equiv 1 \pmod p'
            note: "Petit theoreme de Fermat avec a = 2 : p premier et p ne divise pas 2."
      - id: q2
        stem: |-
          **(0,25 pt)** En déduire que : $2^{\frac{p-1}{2}} \equiv 1\ [p]$ ou $2^{\frac{p-1}{2}} \equiv -1\ [p]$ *(On remarque que : $\left(2^{\frac{p-1}{2}} - 1\right)\left(2^{\frac{p-1}{2}} + 1\right) = 2^{p-1} - 1$)*
        reasoning: |-
          $p \mid (2^{p-1}-1)$ d'après la question précédente. Le facteur donné par l'énoncé fait apparaître exactement cette quantité comme un produit :

          $$\left(2^{\frac{p-1}{2}}-1\right)\left(2^{\frac{p-1}{2}}+1\right) = 2^{p-1}-1$$

          Donc $p$ divise ce produit. Comme $p$ est premier, le lemme d'Euclide (rung R6 : « un premier qui divise un produit divise l'un des deux facteurs ») donne $p \mid \left(2^{\frac{p-1}{2}}-1\right)$ ou $p \mid \left(2^{\frac{p-1}{2}}+1\right)$ — c'est-à-dire $2^{\frac{p-1}{2}} \equiv 1 \pmod p$ ou $2^{\frac{p-1}{2}} \equiv -1 \pmod p$.
        steps:
          - math: 'p \mid (2^{p-1}-1)'
            note: "Reecriture de la question precedente : 2 puissance p moins 1 congru a 1."
          - math: '\left(2^{\frac{p-1}{2}}-1\right)\left(2^{\frac{p-1}{2}}+1\right) = 2^{p-1}-1'
            note: "Identite fournie par l'enonce : le produit indique se developpe exactement en 2 puissance p moins 1, moins 1."
          - math: 'p\ \text{premier et}\ p \mid \left(2^{\frac{p-1}{2}}-1\right)\left(2^{\frac{p-1}{2}}+1\right) \implies 2^{\frac{p-1}{2}} \equiv 1 \pmod p \ \text{ou}\ 2^{\frac{p-1}{2}} \equiv -1 \pmod p'
            note: "Lemme d'Euclide (R6) : p premier divise un produit, donc divise l'un des deux facteurs."
      - id: q3
        part: "Partie B — Une solution de l'équation (E) : coprimalité avec p"
        stem: |-
          **(0,5 pt)** Soit $x$ une solution de l'équation $(E)$. Montrer que $p$ et $x$ sont premiers entre eux.
        reasoning: |-
          Si $p \mid x$, alors $x^2 \equiv 0 \pmod p$ ; or $(E)$ dit $x^2 \equiv 2 \pmod p$, donc $0 \equiv 2 \pmod p$, c'est-à-dire $p \mid 2$. Mais $p$ est un premier **impair**, donc $p \geq 3 > 2$ : $p$ ne peut pas diviser $2$. Contradiction : $p$ ne divise pas $x$.

          Comme $p$ est premier, son seul diviseur commun possible avec $x$ est alors $1$ : $\mathrm{PGCD}(p,x)=1$ (rung R4).
        steps:
          - math: 'p \mid x \implies x^2 \equiv 0 \pmod p'
            note: "Hypothese absurde : si p divise x, son carre est congru a 0."
          - math: '0 \equiv 2 \pmod p \implies p \mid 2'
            note: "Or (E) donne x carre congru a 2 : contradiction avec 0 congru a 2."
          - math: 'p\ \text{premier impair} \implies p \geq 3 \implies p \nmid 2 \implies \mathrm{PGCD}(p,x) = 1'
            note: "p est superieur ou egal a 3 et ne divise pas 2 : impossible, donc p ne divise pas x, et p premier donne p premier avec x (R4)."
      - id: q4
        stem: |-
          **(0,5 pt)** En déduire que : $2^{\frac{p-1}{2}} \equiv 1\ [p]$ *(On pourra utiliser le théorème de Fermat.)*
        reasoning: |-
          C'est le **petit théorème de Fermat**, déjà mobilisé au sommet de leçon 2019 (rupture-gate cp-r6-fermat) : $p$ premier et $p \nmid x$ (question précédente) entraîne $x^{p-1} \equiv 1 \pmod p$.

          Or $x^{p-1} = \left(x^2\right)^{\frac{p-1}{2}}$ (l'exposant $\frac{p-1}{2}$ est un entier, car $p$ est impair, donc $p-1$ est pair). Comme $x^2 \equiv 2 \pmod p$ (l'équation $(E)$), la compatibilité des congruences avec les puissances (rung R2) donne $\left(x^2\right)^{\frac{p-1}{2}} \equiv 2^{\frac{p-1}{2}} \pmod p$.

          En combinant les deux : $2^{\frac{p-1}{2}} \equiv x^{p-1} \equiv 1 \pmod p$.
        steps:
          - math: 'p \nmid x \implies x^{p-1} \equiv 1 \pmod p'
            note: "Petit theoreme de Fermat, applique a x (question precedente)."
          - math: 'x^{p-1} = \left(x^2\right)^{\frac{p-1}{2}} \equiv 2^{\frac{p-1}{2}} \pmod p'
            note: "p impair rend (p moins 1)/2 entier ; x carre congru a 2 (equation E), eleve a cette puissance (R2)."
          - math: '2^{\frac{p-1}{2}} \equiv x^{p-1} \equiv 1 \pmod p'
            note: "Les deux congruences partagent le meme x puissance p moins 1 : elles se recoupent."
      - id: q5
        part: "Partie C — p divise les coefficients binomiaux $C_p^k$"
        stem: |-
          **(0,25 pt)** Montrer que pour tout $k \in \{1, 2, \ldots, p-1\}$, $p$ divise $C_p^k$. *(On rappelle que : $\left(\forall k \in \{1, 2, \ldots, p-1\}\right)\ C_p^k = \dfrac{p!}{k!\,(p-k)!}$ et que $k\,C_p^k = p\,C_{p-1}^{k-1}$.)*
        reasoning: |-
          L'identité $k\,C_p^k = p\,C_{p-1}^{k-1}$ est **fournie par l'énoncé** — c'est un fait de dénombrement (coefficients binomiaux), extérieur au corps de la leçon arithmétique (R0–R8 ne couvrent pas les $C_p^k$) : on l'utilise telle quelle, sans la redémontrer.

          Elle dit que $p \mid k\,C_p^k$ (le membre de droite est visiblement un multiple de $p$). Pour $k \in \{1, \ldots, p-1\}$, on a $1 \leq k < p$ et $p$ est premier, donc $p \nmid k$, c'est-à-dire $\mathrm{PGCD}(p,k)=1$ (rung R4).

          Le théorème de Gauss (rung R5) s'applique alors : $p \mid k\,C_p^k$ et $\mathrm{PGCD}(p,k)=1$ entraîne $p \mid C_p^k$.
        steps:
          - math: 'k\,C_p^k = p\,C_{p-1}^{k-1} \implies p \mid k\,C_p^k'
            note: "Identite fournie par l'enonce : le membre de droite est un multiple de p."
          - math: 'k \in \{1,\ldots,p-1\} \implies 1 \leq k < p \implies p \nmid k \implies \mathrm{PGCD}(p,k) = 1'
            note: "p est premier et strictement superieur a k : p ne divise pas k (R4)."
          - math: 'p \mid k\,C_p^k \ \text{et}\ \mathrm{PGCD}(p,k)=1 \implies p \mid C_p^k'
            note: "Theoreme de Gauss (R5) : on simplifie le facteur k, premier avec p."
      - id: q6
        part: "Partie D — La formule de Moivre pour $(1+i)^p$"
        stem: |-
          **(0,25 pt)** En utilisant la formule de Moivre, montrer que : $(1+i)^p = 2^{\frac{p}{2}}\cos\!\left(p\dfrac{\pi}{4}\right) + i\,2^{\frac{p}{2}}\sin\!\left(p\dfrac{\pi}{4}\right)$ *($i$ étant le nombre complexe tel que : $i^2 = -1$)*
        reasoning: |-
          Cette question quitte entièrement le terrain de l'arithmétique : elle mobilise la **forme trigonométrique** d'un nombre complexe et la **formule de Moivre** — un registre qui relève de la notion nombres complexes, absent du corps R0–R8 de la leçon arithmétique. On le convoque ici tel qu'il est enseigné dans cette autre notion.

          On écrit $1+i$ sous forme trigonométrique : son module est $|1+i| = \sqrt{1^2+1^2} = \sqrt{2}$, et son argument est $\frac{\pi}{4}$ (car $\cos\frac{\pi}{4} = \sin\frac{\pi}{4} = \frac{\sqrt2}{2}$). Donc $1+i = \sqrt{2}\left(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\right)$.

          La formule de Moivre, $\left(\cos\theta+i\sin\theta\right)^n = \cos(n\theta)+i\sin(n\theta)$, donne alors, en élevant à la puissance $p$ :

          $$(1+i)^p = \left(\sqrt2\right)^p \left(\cos\frac{p\pi}{4} + i\sin\frac{p\pi}{4}\right) = 2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) + i\,2^{\frac{p}{2}}\sin\!\left(p\frac{\pi}{4}\right)$$

          puisque $\left(\sqrt2\right)^p = \left(2^{1/2}\right)^p = 2^{p/2}$.
        steps:
          - math: '1+i = \sqrt{2}\left(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\right)'
            note: "Forme trigonometrique de 1 plus i : module racine de 2, argument pi sur 4 (notion nombres complexes, hors lecon arithmetique)."
          - math: '(1+i)^p = \left(\sqrt2\right)^p\left(\cos\frac{p\pi}{4} + i\sin\frac{p\pi}{4}\right)'
            note: "Formule de Moivre, appliquee a la forme trigonometrique precedente."
          - math: '\left(\sqrt2\right)^p = 2^{\frac{p}{2}} \implies (1+i)^p = 2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) + i\,2^{\frac{p}{2}}\sin\!\left(p\frac{\pi}{4}\right)'
            note: "Racine de 2 puissance p egale 2 puissance p demi : c'est exactement l'egalite demandee."
      - id: q7
        stem: |-
          **(0,5 pt)** On admet que : $(1+i)^p = \displaystyle\sum_{k=0}^{k=\frac{p-1}{2}} (-1)^k C_p^{2k} + i \sum_{k=0}^{k=\frac{p-1}{2}} (-1)^k C_p^{2k+1}$. Montrer que : $2^{\frac{p}{2}}\cos\!\left(p\dfrac{\pi}{4}\right) \in \mathbb{Z}$ et $2^{\frac{p}{2}}\cos\!\left(p\dfrac{\pi}{4}\right) \equiv 1\ [p]$ *(on pourra utiliser la question 3-)*
        reasoning: |-
          On égale les parties réelles des deux écritures de $(1+i)^p$ : la question 4-a) donne $2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right)$, et la somme admise par l'énoncé donne $\displaystyle\sum_{k=0}^{\frac{p-1}{2}} (-1)^k C_p^{2k}$. Ces deux quantités sont donc égales.

          Chaque $C_p^{2k}$ est un coefficient binomial, donc un **entier** — et une somme finie de tels termes (multipliés par $\pm1$) est encore un entier. Donc $2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) \in \mathbb{Z}$.

          Pour la congruence, on isole le terme $k=0$ : $C_p^0 = 1$. Pour $k$ allant de $1$ à $\frac{p-1}{2}$, l'indice $2k$ parcourt $2, 4, \ldots, p-1$ — tous dans $\{1,\ldots,p-1\}$ — donc la question 3 s'applique : $p \mid C_p^{2k}$ pour chacun de ces termes, c'est-à-dire $C_p^{2k} \equiv 0 \pmod p$. Modulo $p$, la somme se réduit donc au seul terme $k=0$ (compatibilité de la congruence avec la somme, rung R2) :

          $$\sum_{k=0}^{\frac{p-1}{2}} (-1)^k C_p^{2k} \equiv (-1)^0 C_p^0 = 1 \pmod p$$

          Donc $2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) \equiv 1 \pmod p$.
        steps:
          - math: '2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) = \sum_{k=0}^{\frac{p-1}{2}} (-1)^k C_p^{2k}'
            note: "On egale les deux ecritures de la partie reelle de (1+i) puissance p."
          - math: 'C_p^{2k} \in \mathbb{Z}\ \text{pour tout}\ k \implies \sum_{k=0}^{\frac{p-1}{2}} (-1)^k C_p^{2k} \in \mathbb{Z}'
            note: "Une somme finie de coefficients binomiaux, entiers par nature, reste un entier."
          - math: 'k \in \{1,\ldots,\tfrac{p-1}{2}\} \implies 2k \in \{1,\ldots,p-1\} \implies p \mid C_p^{2k}'
            note: "Pour k allant de 1 a (p-1)/2, l'indice 2k reste dans l'intervalle vise par la question 3."
          - math: '\sum_{k=0}^{\frac{p-1}{2}} (-1)^k C_p^{2k} \equiv (-1)^0 C_p^0 = 1 \pmod p'
            note: "Modulo p, tous les termes k de 1 a (p-1)/2 s'annulent (question 3) ; il ne reste que le terme k=0, qui vaut 1."
      - id: q8
        part: "Partie E — Conclusion : le cas $p$ congru à $5$ modulo $8$"
        stem: |-
          **(0,5 pt)** En déduire que si $p \equiv 5\ [8]$ alors l'équation $(E)$ n'admet pas de solution dans $\mathbb{Z}$.
        reasoning: |-
          $p \equiv 5 \pmod 8$ signifie $p = 8m+5$ pour un entier $m$. Alors $p\frac{\pi}{4} = 2m\pi + \frac{5\pi}{4}$, et le cosinus est $2\pi$-périodique, donc $\cos\!\left(p\frac{\pi}{4}\right) = \cos\!\left(\frac{5\pi}{4}\right) = -\frac{\sqrt2}{2}$.

          En reportant dans le résultat de la question 4-b) : $2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) = 2^{\frac{p}{2}} \times \left(-\frac{\sqrt2}{2}\right) = -2^{\frac{p}{2}} \times 2^{-\frac12} = -2^{\frac{p-1}{2}}$. Or la question 4-b) donne aussi que cette quantité est $\equiv 1 \pmod p$. Donc $-2^{\frac{p-1}{2}} \equiv 1 \pmod p$, c'est-à-dire $2^{\frac{p-1}{2}} \equiv -1 \pmod p$.

          Supposons maintenant, par l'absurde, que $(E)$ admette une solution $x$ dans $\mathbb{Z}$. La question 2-b) donnerait alors $2^{\frac{p-1}{2}} \equiv 1 \pmod p$. Combiné à ce qu'on vient d'obtenir, $1 \equiv -1 \pmod p$, c'est-à-dire $p \mid 2$ — impossible, puisque $p$ est un premier impair ($p \geq 3$). Contradiction : $(E)$ n'admet pas de solution dans $\mathbb{Z}$ quand $p \equiv 5 \pmod 8$.
        steps:
          - math: 'p \equiv 5 \pmod 8 \implies \cos\!\left(p\frac{\pi}{4}\right) = \cos\!\left(\frac{5\pi}{4}\right) = -\frac{\sqrt2}{2}'
            note: "p = 8m+5 : p pi sur 4 vaut 2m pi plus 5 pi sur 4, et le cosinus est periodique de periode 2 pi."
          - math: '2^{\frac{p}{2}}\cos\!\left(p\frac{\pi}{4}\right) = -2^{\frac{p}{2}} \times 2^{-\frac12} = -2^{\frac{p-1}{2}}'
            note: "On reporte la valeur du cosinus ; racine de 2 sur 2 vaut 2 puissance moins un demi."
          - math: '-2^{\frac{p-1}{2}} \equiv 1 \pmod p \implies 2^{\frac{p-1}{2}} \equiv -1 \pmod p'
            note: "La question 4-b donne aussi que cette quantite est congrue a 1 modulo p."
          - math: '(E)\ \text{a une solution} \implies 2^{\frac{p-1}{2}} \equiv 1 \pmod p \ \text{(question 2-b)} \implies 1 \equiv -1 \pmod p \implies p \mid 2'
            note: "Si (E) avait une solution, la question 2-b et le resultat precedent donneraient deux valeurs contradictoires pour la meme quantite."
          - math: 'p\ \text{premier impair} \implies p \geq 3 \implies p \nmid 2'
            note: "Impossible : l'hypothese de depart, (E) admet une solution, est donc fausse quand p est congru a 5 modulo 8."

