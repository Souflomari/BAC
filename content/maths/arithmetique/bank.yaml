  - id: bk-2024-r-x5
    title: "Inverse de 10 modulo 23 par l'algorithme d'Euclide, critère de divisibilité par 23, et système de deux congruences"
    source:
      year: 2024
      session: rattrapage
      filiere: "SM"
      exercise_label: "Exercice 5 — Arithmétique (3 points)"
    bareme_total: 3
    duration_min: 18
    sourcing:
      status: sourced
      note: >-
        2024 session de rattrapage — examen national Mathématiques, filière
        Sciences Mathématiques (A) et (B), option française, 4 h, coefficient
        9, code sujet RS 25, AlloSchool element/145741, scan
