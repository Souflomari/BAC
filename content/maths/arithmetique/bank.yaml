    intro: |-
      **Arithmétique (examen national Sciences Mathématiques, session normale 2024, Exercice 5 — en-tête imprimé sur la copie ; les consignes de la page 1 l'étiquettent par erreur Exercice 4).**

      Soient $p$ et $q$ deux nombres premiers distincts et $r$ un entier naturel premier avec $p$ et avec $q$.

      L'exercice construit une version « à deux modules » du petit théorème de Fermat — hors-rung, déjà rencontré au sommet de leçon 2019 (rupture-gate cp-r6-fermat) — en s'appuyant sur le corollaire du théorème de Gauss (R5), puis l'applique à une équation modulaire concrète, où l'exposant $192$ se révèle être exactement $(p-1)(q-1)$ pour $p=13$ et $q=17$.
    questions:
      - id: q1
        part: "Partie A — Fermat pour $p$, puis pour $q$"
        stem: |-
          **(1 pt)** Montrer que $p$ divise $r^{p-1} - 1$ et que $q$ divise $r^{q-1} - 1$.
        reasoning: |-
          Le petit théorème de Fermat — hors-rung, déjà mobilisé au sommet de leçon 2019 (rupture-gate cp-r6-fermat) : si un nombre premier $\pi$ ne divise pas un entier $a$, alors $a^{\pi-1} \equiv 1 \pmod \pi$, c'est-à-dire $\pi \mid (a^{\pi-1}-1)$.

          On l'applique une première fois avec $\pi = p$ et $a = r$ : $r$ est premier avec $p$ par hypothèse, donc $p \mid (r^{p-1}-1)$. On l'applique une seconde fois avec $\pi = q$ et $a = r$ : $r$ est aussi premier avec $q$ par hypothèse, donc $q \mid (r^{q-1}-1)$.
        steps:
          - math: 'p\ \text{premier},\ p \nmid r \implies r^{p-1} \equiv 1 \pmod p \implies p \mid (r^{p-1}-1)'
            note: "Petit theoreme de Fermat applique avec le premier p : r est premier avec p par hypothese."
          - math: 'q\ \text{premier},\ q \nmid r \implies r^{q-1} \equiv 1 \pmod q \implies q \mid (r^{q-1}-1)'
            note: "Meme theoreme applique avec le premier q : r est aussi premier avec q par hypothese."
      - id: q2
        stem: |-
          **(0,5 pt)** En déduire que $p$ et $q$ divisent $r^{(p-1)(q-1)} - 1$.
        reasoning: |-
          On repart de $p \mid (r^{p-1}-1)$, c'est-à-dire $r^{p-1} \equiv 1 \pmod p$. On élève cette congruence à la puissance $(q-1)$ (rung R2 : compatibilité des congruences avec les puissances) : $r^{(p-1)(q-1)} = \left(r^{p-1}\right)^{q-1} \equiv 1^{q-1} = 1 \pmod p$. Donc $p \mid \left(r^{(p-1)(q-1)}-1\right)$.

          Le même argument, en partant de $q \mid (r^{q-1}-1)$ et en élevant à la puissance $(p-1)$ cette fois, donne $r^{(p-1)(q-1)} \equiv 1 \pmod q$, donc $q \mid \left(r^{(p-1)(q-1)}-1\right)$.
        steps:
          - math: 'r^{p-1} \equiv 1 \pmod p \implies \left(r^{p-1}\right)^{q-1} \equiv 1 \pmod p \implies p \mid \left(r^{(p-1)(q-1)}-1\right)'
            note: "On eleve la congruence de la question precedente a la puissance (q-1)."
          - math: 'r^{q-1} \equiv 1 \pmod q \implies \left(r^{q-1}\right)^{p-1} \equiv 1 \pmod q \implies q \mid \left(r^{(p-1)(q-1)}-1\right)'
            note: "Meme argument avec les roles de p et q echanges : on eleve a la puissance (p-1)."
      - id: q3
        stem: |-
          **(0,5 pt)** Montrer que $pq$ divise $r^{(p-1)(q-1)} - 1$.
        reasoning: |-
          $p$ et $q$ sont deux nombres premiers **distincts**, donc $\mathrm{PGCD}(p,q)=1$. On dispose (question précédente) de $p \mid c$ et $q \mid c$, avec $c = r^{(p-1)(q-1)}-1$. C'est exactement la situation du corollaire du théorème de Gauss (rung R5) : si $a \mid c$, $b \mid c$ et $\mathrm{PGCD}(a,b)=1$, alors $ab \mid c$. Avec $a=p$, $b=q$, on obtient $pq \mid \left(r^{(p-1)(q-1)}-1\right)$.
        steps:
          - math: '\mathrm{PGCD}(p,q) = 1'
            note: "p et q sont deux premiers distincts : leur seul diviseur commun possible est 1."
          - math: 'p \mid c\ \text{et}\ q \mid c\ \text{et}\ \mathrm{PGCD}(p,q)=1 \implies pq \mid c \qquad (c = r^{(p-1)(q-1)}-1)'
            note: "Corollaire du theoreme de Gauss (R5) : deux diviseurs premiers entre eux d'un meme nombre, leur produit le divise aussi."
      - id: q4
        part: 'Partie B — Résoudre $2024^{192}x \equiv 3\ [221]$'
        stem: |-
          **(1 pt)** Résoudre dans $\mathbb{Z}$ l'équation $2024^{192}\, x \equiv 3\ [221]$. *(On donne : $221 = 13 \times 17$.)*
        reasoning: |-
          L'exposant $192$ n'est pas choisi au hasard : avec $p=13$ et $q=17$ (les deux facteurs premiers donnés de $221$), $(p-1)(q-1) = 12 \times 16 = 192$ — exactement l'exposant de l'équation. Ça invite à réutiliser la question 1.c) avec $r = 2024$.

          Reste à vérifier l'hypothèse : $2024$ est-il premier avec $13$ et avec $17$ ? Division euclidienne : $2024 = 13 \times 155 + 9$, donc $2024 \equiv 9 \pmod{13}$, un reste non nul — $13 \nmid 2024$, et $13$ étant premier, $2024$ et $13$ sont premiers entre eux (rung R4). De même $2024 = 17 \times 119 + 1$, donc $2024 \equiv 1 \pmod{17}$, reste non nul également — $2024$ et $17$ sont premiers entre eux.

          La question 1.c) s'applique donc avec $p=13$, $q=17$, $r=2024$ : $pq = 221$ divise $2024^{192}-1$, c'est-à-dire $2024^{192} \equiv 1 \pmod{221}$.

          L'équation $2024^{192}x \equiv 3\ [221]$ se réduit alors à $1 \times x \equiv 3 \pmod{221}$, c'est-à-dire $x \equiv 3 \pmod{221}$.
        steps:
          - math: '2024 = 13 \times 155 + 9 \implies 2024 \equiv 9 \pmod{13}'
            note: "Division euclidienne de 2024 par 13 : reste 9, non nul."
          - math: '2024 = 17 \times 119 + 1 \implies 2024 \equiv 1 \pmod{17}'
            note: "Division euclidienne de 2024 par 17 : reste 1, non nul."
          - math: '13 \nmid 2024\ \text{et}\ 17 \nmid 2024 \implies \mathrm{PGCD}(2024,13) = \mathrm{PGCD}(2024,17) = 1'
            note: "13 et 17 sont premiers : ne pas diviser 2024 signifie etre premier avec 2024."
          - math: '(p-1)(q-1) = 12 \times 16 = 192 \qquad (p=13,\ q=17)'
            note: "L'exposant de l'equation est exactement (p-1)(q-1) avec p = 13 et q = 17."
          - math: '221 \mid \left(2024^{192}-1\right) \implies 2024^{192} \equiv 1 \pmod{221}'
            note: "Question 1.c appliquee avec p=13, q=17, r=2024 : pq=221 divise r puissance (p-1)(q-1) moins 1."
          - math: '2024^{192}x \equiv 3\ [221] \implies x \equiv 3 \pmod{221}'
            note: "On remplace 2024 puissance 192 par 1 : il reste x congru a 3 modulo 221."
          - math: 'S = \{\, 3 + 221k \ : \ k \in \mathbb{Z} \,\}'
            note: "Ensemble des solutions de l'equation dans Z."

  # ── bk-2021-n-x3 — 2021 N, Exercice 3 : Bézout 47x-43y=1, Fermat modulo 43 et 47, restes chinois modulo 2021 ──
  - id: bk-2021-n-x3
    title: "Bézout modulo 43, petit théorème de Fermat et restes chinois modulo 2021 (2021)"
    source:
      year: 2021
      session: normale
      filiere: "SM"
