    intro: |-
      **Arithmétique (examen national Sciences Mathématiques, session normale 2025, Exercice 3).**

      Soient $p$ un nombre premier impair et $a$ un entier premier avec $p$.

      L'exercice construit, de A à Z, le **critère d'Euler** — hors-chapitre, dérivé ici uniquement à partir du petit théorème de Fermat (lui-même hors-chapitre, déjà rencontré au sommet de leçon 2019, rupture-gate cp-r6-fermat) et du lemme d'Euclide (chapitre 7) — puis l'applique deux fois, avec $p=11$ à chaque fois : une fois pour garantir, via Bézout (chapitre 5), l'existence d'une solution à une équation diophantienne paramétrée par $n$, une fois pour montrer qu'une équation modulo $11$ n'a aucune solution entière.
    questions:
      - id: q1
        part: "Partie A — Fermat et un carré qui se factorise"
        stem: |-
          **(0,5 pt)** Montrer que $a^{\frac{p-1}{2}} \equiv 1\ [p]$ ou $a^{\frac{p-1}{2}} \equiv -1\ [p]$.
        reasoning: |-
          $a$ est premier avec $p$ par hypothèse (chapitre 5), donc le **petit théorème de Fermat** — hors-chapitre, déjà rencontré au sommet de leçon 2019 (rupture-gate cp-r6-fermat) — s'applique : $a^{p-1} \equiv 1 \pmod p$.

          On retrouve ici le même geste qu'à chaque fois qu'une puissance paire cache une différence de carrés : $a^{p-1} - 1 = \left(a^{\frac{p-1}{2}}\right)^2 - 1 = \left(a^{\frac{p-1}{2}}-1\right)\left(a^{\frac{p-1}{2}}+1\right)$ (l'exposant $\frac{p-1}{2}$ est un entier, car $p$ est impair). Comme $p \mid (a^{p-1}-1)$, $p$ divise ce produit. $p$ étant premier, le lemme d'Euclide (chapitre 7) donne $p \mid \left(a^{\frac{p-1}{2}}-1\right)$ ou $p \mid \left(a^{\frac{p-1}{2}}+1\right)$ — c'est-à-dire $a^{\frac{p-1}{2}} \equiv 1 \pmod p$ ou $a^{\frac{p-1}{2}} \equiv -1 \pmod p$.
        steps:
          - math: 'a^{p-1} \equiv 1 \pmod p'
            note: "Petit théorème de Fermat : a premier avec p."
          - math: 'a^{p-1} - 1 = \left(a^{\frac{p-1}{2}}-1\right)\left(a^{\frac{p-1}{2}}+1\right)'
            note: "Différence de carrés : p impair rend (p moins 1)/2 entier."
          - math: 'p \mid \left(a^{\frac{p-1}{2}}-1\right)\left(a^{\frac{p-1}{2}}+1\right) \implies a^{\frac{p-1}{2}} \equiv 1 \pmod p \ \text{ou}\ a^{\frac{p-1}{2}} \equiv -1 \pmod p'
            note: "Lemme d'Euclide (chapitre 7) : p premier divise un produit, donc l'un des deux facteurs."
      - id: q2
        part: "Partie B — L'équation (E) : une solution $x_0$"
        stem: |-
          **(0,5 pt)** On considère dans $\mathbb{Z}$ l'équation : $ax^2 \equiv 1\ [p]$. Soit $x_0$ une solution de cette équation. Montrer que : $x_0^{\,p-1} \equiv 1\ [p]$
        reasoning: |-
          Si $p \mid x_0$, alors $x_0^2 \equiv 0 \pmod p$, donc $a\,x_0^2 \equiv 0 \pmod p$ ; or l'équation dit $a\,x_0^2 \equiv 1 \pmod p$, donc $0 \equiv 1 \pmod p$, c'est-à-dire $p \mid 1$ — impossible, puisque $p \geq 2$. Contradiction : $p$ ne divise pas $x_0$.

          Comme $p$ est premier, $\mathrm{PGCD}(p,x_0)=1$ (chapitre 5). Le petit théorème de Fermat — hors-chapitre, déjà mobilisé à la question 1 — s'applique alors à $x_0$ : $x_0^{p-1} \equiv 1 \pmod p$.
        steps:
          - math: 'p \mid x_0 \implies a\,x_0^2 \equiv 0 \pmod p'
            note: "Hypothèse absurde : si p divise x zéro, son carré et donc a fois son carré sont congrus a 0."
          - math: '0 \equiv 1 \pmod p \implies p \mid 1'
            note: "Or l'équation donne a fois x zéro carré congru a 1 : contradiction, p diviserait 1."
          - math: 'p \nmid x_0 \implies \mathrm{PGCD}(p,x_0) = 1 \implies x_0^{p-1} \equiv 1 \pmod p'
            note: "p premier avec x zéro (chapitre 5) ; petit théorème de Fermat (question 1)."
      - id: q3
        stem: |-
          **(0,25 pt)** En déduire que : $a^{\frac{p-1}{2}} \equiv 1\ [p]$
        reasoning: |-
          On élève l'équation $a\,x_0^2 \equiv 1 \pmod p$ à la puissance $\frac{p-1}{2}$ (chapitre 3 : compatibilité de la congruence avec les puissances) :

          $$\left(a\,x_0^2\right)^{\frac{p-1}{2}} \equiv 1^{\frac{p-1}{2}} = 1 \pmod p$$

          Le membre de gauche se factorise : $\left(a\,x_0^2\right)^{\frac{p-1}{2}} = a^{\frac{p-1}{2}} \times \left(x_0^2\right)^{\frac{p-1}{2}} = a^{\frac{p-1}{2}} \times x_0^{\,p-1}$. Or $x_0^{\,p-1} \equiv 1 \pmod p$ (question précédente), donc, en substituant :

          $$a^{\frac{p-1}{2}} \times 1 \equiv 1 \pmod p \implies a^{\frac{p-1}{2}} \equiv 1 \pmod p$$
        steps:
          - math: '\left(a\,x_0^2\right)^{\frac{p-1}{2}} \equiv 1 \pmod p'
            note: "On élève l'équation de départ a la puissance (p-1)/2 (chapitre 3)."
          - math: '\left(a\,x_0^2\right)^{\frac{p-1}{2}} = a^{\frac{p-1}{2}} \times x_0^{\,p-1}'
            note: "On factorise le membre de gauche."
          - math: 'x_0^{\,p-1} \equiv 1 \pmod p \implies a^{\frac{p-1}{2}} \equiv 1 \pmod p'
            note: "On remplace x zéro puissance p moins un par 1 (question précédente) : il reste a puissance (p-1)/2 congru a 1."
      - id: q4
        part: "Partie C — Un diviseur premier de $2^{2n+1}-1$"
        stem: |-
          **(0,5 pt)** Soit $n$ un entier naturel non nul. Montrer que si $p$ divise $2^{2n+1} - 1$ alors $2^{\frac{p-1}{2}} \equiv 1\ [p]$
        reasoning: |-
          L'hypothèse $p \mid \left(2^{2n+1}-1\right)$ se lit $2^{2n+1} \equiv 1 \pmod p$. On réécrit l'exposant impair $2n+1 = 1 + 2n$ : $2^{2n+1} = 2 \times \left(2^n\right)^2$. Donc $2 \times \left(2^n\right)^2 \equiv 1 \pmod p$.

          C'est exactement la forme de l'équation $a\,x^2 \equiv 1 \pmod p$ étudiée à la question 2, avec $a=2$ et $x_0 = 2^n$ ($p$ toujours premier impair et, ici, $a=2$ premier avec $p$ puisque $p$ est impair). La question 2-b) s'applique donc directement, avec $a=2$ : $2^{\frac{p-1}{2}} \equiv 1 \pmod p$.
        steps:
          - math: 'p \mid \left(2^{2n+1}-1\right) \implies 2^{2n+1} \equiv 1 \pmod p'
            note: "Reecriture directe de l'hypothèse p divise 2 puissance 2n+1 moins 1."
          - math: '2^{2n+1} = 2 \times \left(2^n\right)^2 \implies 2 \times \left(2^n\right)^2 \equiv 1 \pmod p'
            note: "L'exposant impair 2n+1 se decompose en 1 plus 2n : on isole un facteur 2 et un carré parfait."
          - math: '2^{\frac{p-1}{2}} \equiv 1 \pmod p'
            note: "C'est exactement l'équation a fois x carré congru a 1 de la question 2, avec a = 2 et x zéro = 2 puissance n : la question 2-b s'applique."
      - id: q5
        stem: |-
          **(0,5 pt)** En déduire que l'équation $(E) : 11x + \left(2^{2n+1} - 1\right)y = 1$ admet au moins une solution dans $\mathbb{Z}^2$.
        reasoning: |-
          Le théorème de Bézout (chapitre 5, cas particulier à $1$) garantit une solution entière à $11x + \left(2^{2n+1}-1\right)y = 1$ dès que $11$ et $2^{2n+1}-1$ sont premiers entre eux. C'est donc ce qu'il reste à établir.

          $11$ est premier, donc $\mathrm{PGCD}\!\left(11,\,2^{2n+1}-1\right)$ vaut $1$ ou $11$. Supposons par l'absurde qu'il vaille $11$, c'est-à-dire $11 \mid \left(2^{2n+1}-1\right)$. La question précédente, appliquée avec $p=11$ (bien un premier impair), donnerait alors $2^{\frac{11-1}{2}} \equiv 1 \pmod{11}$, c'est-à-dire $2^5 \equiv 1 \pmod{11}$.

          Or $2^5 = 32 = 2 \times 11 + 10$, donc $2^5 \equiv 10 \pmod{11}$, et $10 \not\equiv 1 \pmod{11}$. Contradiction : $11$ ne divise pas $2^{2n+1}-1$. Donc $\mathrm{PGCD}\!\left(11,\,2^{2n+1}-1\right) = 1$, et le théorème de Bézout (chapitre 5) fournit directement des entiers $x,y$ tels que $11x + \left(2^{2n+1}-1\right)y = 1$.
        steps:
          - math: '11\ \text{premier} \implies \mathrm{PGCD}\!\left(11,\,2^{2n+1}-1\right) \in \{1,11\}'
            note: "Les seuls diviseurs positifs de 11 sont 1 et 11."
          - math: '11 \mid \left(2^{2n+1}-1\right) \implies 2^{\frac{11-1}{2}} \equiv 1 \pmod{11}\ \text{(question précédente, p=11)}'
            note: "Hypothèse absurde : la question 3-a, appliquee avec p = 11, donne 2 puissance 5 congru a 1."
          - math: '2^5 = 32 \equiv 10 \pmod{11} \ \text{et}\ 10 \not\equiv 1 \pmod{11}'
            note: "Calcul direct : 32 égale 2 fois 11 plus 10. Contradiction avec la congruence attendue."
          - math: '\mathrm{PGCD}\!\left(11,\,2^{2n+1}-1\right) = 1 \implies (\exists\ x,y \in \mathbb{Z})\ 11x + \left(2^{2n+1}-1\right)y = 1'
            note: "11 ne divise pas 2 puissance 2n+1 moins 1 : le PGCD vaut donc 1, et Bezout (chapitre 5) fournit x et y."
      - id: q6
        part: "Partie D — L'équation (F) : $x^2+5x+2$ modulo $11$"
        stem: |-
          **(0,25 pt)** On considère dans $\mathbb{Z}$ l'équation $(F) : x^2 + 5x + 2 \equiv 0\ [11]$. Montrer que : $(F) \iff 2(2x+5)^2 \equiv 1\ [11]$
        reasoning: |-
          On veut faire apparaître un carré parfait : c'est la technique de **complétion du carré**, appliquée modulo $11$. On multiplie d'abord $(F)$ par $4$ — un entier premier avec $11$, donc cette multiplication est réversible modulo $11$ (on peut revenir en arrière en multipliant par l'inverse de $4$) :

          $$x^2+5x+2 \equiv 0 \pmod{11} \iff 4x^2+20x+8 \equiv 0 \pmod{11}$$

          Le membre de gauche est un carré parfait décalé : $4x^2+20x+8 = (2x+5)^2 - 25 + 8 = (2x+5)^2 - 17$. Donc :

          $$4x^2+20x+8 \equiv 0 \pmod{11} \iff (2x+5)^2 \equiv 17 \equiv 6 \pmod{11}$$

          On multiplie enfin par $2$ — de nouveau réversible modulo $11$, puisque $\mathrm{PGCD}(2,11)=1$ :

          $$(2x+5)^2 \equiv 6 \pmod{11} \iff 2(2x+5)^2 \equiv 12 \equiv 1 \pmod{11}$$

          En enchaînant les trois équivalences : $(F) \iff 2(2x+5)^2 \equiv 1 \pmod{11}$.
        steps:
          - math: 'x^2+5x+2 \equiv 0 \pmod{11} \iff 4x^2+20x+8 \equiv 0 \pmod{11}'
            note: "On multiplie par 4, premier avec 11 : équivalence réversible modulo 11."
          - math: '4x^2+20x+8 = (2x+5)^2 - 17'
            note: "Completion du carré : identité algebrique directe."
          - math: '(2x+5)^2 - 17 \equiv 0 \pmod{11} \iff (2x+5)^2 \equiv 6 \pmod{11}'
            note: "17 modulo 11 vaut 6."
          - math: '(2x+5)^2 \equiv 6 \pmod{11} \iff 2(2x+5)^2 \equiv 12 \equiv 1 \pmod{11}'
            note: "On multiplie par 2, premier avec 11 : de nouveau réversible, et 12 modulo 11 vaut 1."
      - id: q7
        stem: |-
          **(0,5 pt)** En déduire que l'équation $(F)$ n'admet pas de solution dans $\mathbb{Z}$.
        reasoning: |-
          Supposons par l'absurde que $(F)$ admette une solution entière $x$. Par la question précédente, $2(2x+5)^2 \equiv 1 \pmod{11}$. Pose $y_0 = 2x+5$ (un entier) : cette relation devient $2\,y_0^2 \equiv 1 \pmod{11}$ — exactement la forme $a\,x^2 \equiv 1 \pmod p$ de la question 2, avec $a=2$, $p=11$ (premier impair, $11$ premier avec $2$) et $x_0 = y_0$.

          La question 2-b) s'applique alors, avec $a=2$ et $p=11$ : $2^{\frac{11-1}{2}} \equiv 1 \pmod{11}$, c'est-à-dire $2^5 \equiv 1 \pmod{11}$.

          Or le calcul direct (déjà fait à la question 3-b) donne $2^5 = 32 \equiv 10 \pmod{11}$, et $10 \not\equiv 1 \pmod{11}$. Contradiction : l'hypothèse d'une solution entière est fausse. $(F)$ n'admet pas de solution dans $\mathbb{Z}$.
        steps:
          - math: '2(2x+5)^2 \equiv 1 \pmod{11} \implies 2\,y_0^2 \equiv 1 \pmod{11} \qquad (y_0 = 2x+5)'
            note: "Supposons x solution entière de (F) ; on pose y zéro = 2x+5, un entier."
          - math: '2\,y_0^2 \equiv 1 \pmod{11} \implies 2^{\frac{11-1}{2}} \equiv 1 \pmod{11}\ \text{(question 2-b, a=2, p=11)}'
            note: "C'est exactement la forme a fois x carré congru a 1, avec a = 2 et p = 11 : la question 2-b s'applique."
          - math: '2^5 = 32 \equiv 10 \pmod{11} \ \text{et}\ 10 \not\equiv 1 \pmod{11}'
            note: "Même calcul direct qu'a la question 3-b : contradiction."
          - math: '(F)\ \text{n''admet pas de solution dans}\ \mathbb{Z}'
            note: "L'hypothèse d'une solution entière est donc fausse."

  # ── bk-2017-n-x3 — 2017 N, Exercice 3 : Fermat, encadrement de p, équation px+y^(p-1)=2017 ──
  - id: bk-2017-n-x3
    title: "Petit théorème de Fermat et l'équation px + yᵖ⁻¹ = 2017"
    source:
      year: 2017
      session: normale
      filiere: "SM"
      exercise_label: "Exercice 3"
    bareme_total: 3
    duration_min: 18
    sourcing:
      status: sourced
      note: >-
        2017 session normale — examen national Sciences Mathématiques (A) et
        (B), option française (BIOF), Mathématiques, 4 h, coef 9, code sujet
        NS 25, barème 3 points (Exercice 3, « Arithmétique »). Source
        AlloSchool element/57970. Transcription fidèle de l'entrée
        « vérifié » de docs/sujets/maths/arithmetique.md, section « 2017 —
        session normale — Exercice 3 » (2e passe de vérification
        indépendante, provenance de page confirmée sur deux images du scan
        — 0003-big.jpg porte l'exercice en entier —, diff caractère-par-
        caractère conforme, barème marginal 0,25/0,5/0,75/0,5/1 sommant à
        3 pts, agent-vérificateur-adversarial, 2026-08-06).
    intro: |-
      **Arithmétique (examen national Sciences Mathématiques, session normale 2017).**

      On admet que $2017$ est un nombre premier, et que $2016 = 2^5\,3^2\,7$. Soit $p$ un nombre premier supérieur ou égal à $5$.

      L'exercice mobilise le petit théorème de Fermat — hors-chapitre, rappelé au point d'usage — pour contraindre $p$ à une seule valeur possible via la factorisation de $2016$, puis termine par une résolution explicite de l'équation $px+y^{p-1}=2017$ dans $\mathbb{N}^*\times\mathbb{N}^*$.
    questions:
      - id: q1
        part: "Partie A — Encadrer $p$, puis exclure $p$ diviseur de $y$"
        stem: |-
          **(0,25 pt)** Soit le couple $(x,y)$ de $\mathbb{N}^* \times \mathbb{N}^*$ tel que : $px + y^{p-1} = 2017$. Vérifier que : $p < 2017$
        reasoning: |-
          $y \geq 1$ (car $y \in \mathbb{N}^*$), donc $y^{p-1} \geq 1$ quel que soit l'exposant. On isole $px = 2017 - y^{p-1} \leq 2016$. Comme $x \geq 1$ (car $x \in \mathbb{N}^*$), on a $p \leq px \leq 2016$, donc $p < 2017$.
        steps:
          - math: 'y \geq 1 \implies y^{p-1} \geq 1'
            note: "y appartient a N*, donc y au moins 1 ; toute puissance de y reste au moins 1."
          - math: 'px = 2017 - y^{p-1} \leq 2016'
            note: "On isole px dans l'équation, en utilisant y^{p-1} au moins 1."
          - math: 'x \geq 1 \implies p \leq px \leq 2016 \implies p < 2017'
            note: "x appartient a N*, donc p est au plus px."
      - id: q2
        stem: |-
          **(0,5 pt)** Montrer que : $p$ ne divise pas $y$
        reasoning: |-
          Raisonnement par l'absurde. Si $p \mid y$, alors $p \mid y^{p-1}$ (une puissance d'un multiple de $p$ reste un multiple de $p$). Comme $p \mid px$ trivialement, $p$ diviserait la somme $px+y^{p-1}=2017$.

          Or $2017$ est premier (admis) : ses seuls diviseurs positifs sont $1$ et $2017$. Comme $5 \leq p < 2017$ (question précédente), $p$ n'est ni $1$ ni $2017$, donc $p \nmid 2017$. Contradiction : $p$ ne divise pas $y$.
        steps:
          - math: 'p \mid y \implies p \mid y^{p-1}'
            note: "Hypothèse absurde : si p divise y, il divise aussi toute puissance de y, en particulier y^{p-1}."
          - math: 'p \mid px \ \text{et}\ p \mid y^{p-1} \implies p \mid (px+y^{p-1}) = 2017'
            note: "p diviserait alors la somme des deux termes de l'équation, soit 2017."
          - math: '2017\ \text{premier},\ 5 \leq p < 2017 \implies p \nmid 2017'
            note: "2017 est premier (admis) : ses seuls diviseurs sont 1 et 2017 ; p est strictement compris entre les deux (question précédente)."
          - math: 'p \nmid y'
            note: "Contradiction : l'hypothèse p divise y est donc fausse."
      - id: q3
        stem: |-
          **(0,75 pt)** Montrer que : $y^{p-1} \equiv 1\ [p]$ et en déduire que $p$ divise $2016$
        reasoning: |-
          C'est ici qu'intervient le **petit théorème de Fermat** — un outil du programme SM qui déborde le corps des chapitres de la leçon (aucun chapitre dédié ; chapitres 1 à 9 couvrent divisibilité, division euclidienne, congruences, PGCD/Euclide, Bézout, Gauss, nombres premiers, équations diophantiennes, mais pas Fermat) : si $p$ est premier et $p \nmid a$, alors $a^{p-1} \equiv 1 \pmod p$. On l'applique avec $a=y$ : $p$ est premier (donné, $p\geq5$) et $p \nmid y$ (question précédente), donc $y^{p-1} \equiv 1 \pmod p$.

          On réduit ensuite l'équation elle-même modulo $p$ : le terme $px$ disparaît, donc $y^{p-1} \equiv px+y^{p-1} = 2017 \pmod p$. En combinant les deux congruences pour $y^{p-1}$, il vient $1 \equiv 2017 \pmod p$, c'est-à-dire $p \mid (2017-1) = 2016$.
        steps:
          - math: 'p\ \text{premier},\ p \nmid y \implies y^{p-1} \equiv 1 \pmod p'
            note: "Petit théorème de Fermat : p premier (donne, p au moins 5) et p ne divise pas y (question précédente)."
          - math: 'px \equiv 0 \pmod p \implies y^{p-1} \equiv px + y^{p-1} = 2017 \pmod p'
            note: "On reduit l'équation modulo p : le terme px disparaît."
          - math: '1 \equiv y^{p-1} \equiv 2017 \pmod p \implies p \mid (2017-1) = 2016'
            note: "Les deux congruences pour y^{p-1} coïncident : p divise donc 2016."
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que : $p = 7$
        reasoning: |-
          $2016 = 2^5\,3^2\,7$ (donné) : ses seuls facteurs premiers sont $2$, $3$ et $7$. La question précédente donne $p \mid 2016$, donc $p \in \{2,3,7\}$. Comme $p \geq 5$ (donné dès l'énoncé), $p$ ne peut être ni $2$ ni $3$ : il reste $p=7$.
        steps:
          - math: '2016 = 2^5\,3^2\,7'
            note: "Factorisation donnée par l'énoncé."
          - math: 'p\ \text{premier et}\ p \mid 2016 \implies p \in \{2,3,7\}'
            note: "Les seuls facteurs premiers de 2016 sont 2, 3 et 7 (question précédente)."
          - math: 'p \geq 5 \implies p \neq 2,\ p \neq 3 \implies p = 7'
            note: "p est au moins 5 (donne) : seul 7 reste possible parmi les facteurs premiers de 2016."
      - id: q5
        part: "Partie B — Résoudre l'équation, suivant les valeurs de $p$"
        stem: |-
          **(1 pt)** Déterminer, suivant les valeurs de $p$, les couples $(x,y)$ de $\mathbb{N}^* \times \mathbb{N}^*$ vérifiant : $px + y^{p-1} = 2017$
        reasoning: |-
          Les questions précédentes montrent, par contraposée : si l'équation admet une solution $(x,y) \in \mathbb{N}^*\times\mathbb{N}^*$, alors nécessairement $p=7$. Donc, pour tout nombre premier $p\geq5$ avec $p\neq7$, l'équation **n'admet aucune solution** dans $\mathbb{N}^*\times\mathbb{N}^*$.

          Reste à résoudre effectivement le cas $p=7$ : $7x+y^6=2017$, avec $x,y\geq1$ entiers. Comme $x\geq1$, on a $7x\geq7$, donc $y^6\leq2010$ ; or $4^6=4096>2010$, donc $y\in\{1,2,3\}$ — trois valeurs seulement à tester. Pour chacune, $x=\dfrac{2017-y^6}{7}$ tombe juste : $y=1$ donne $x=\dfrac{2016}{7}=288$ ; $y=2$ donne $x=\dfrac{1953}{7}=279$ ; $y=3$ donne $x=\dfrac{1288}{7}=184$. (Ce n'est pas un hasard : $p=7$ est premier et $y\in\{1,2,3\}$ n'est jamais multiple de $7$, donc le petit théorème de Fermat garantit déjà $y^6\equiv1\ [7]$, donc $2017-y^6\equiv2017-1\equiv0\ [7]$ — la division tombe forcément juste.)

          Les trois couples $(288,1)$, $(279,2)$ et $(184,3)$ sont donc les seules solutions, et seulement pour $p=7$.
        steps:
          - math: 'p\neq7 \implies \text{aucune solution dans}\ \mathbb{N}^*\times\mathbb{N}^*'
            note: "Contraposee des questions précédentes : toute solution forcerait p=7."
          - math: 'p=7:\ 7x+y^6=2017,\quad x\geq1 \implies y^6\leq2010 \implies y\in\{1,2,3\}\ (4^6=4096>2010)'
            note: "x au moins 1 borne y^6 ; seules trois valeurs de y restent possibles."
          - math: 'y=1:\ x=\dfrac{2016}{7}=288; \quad y=2:\ x=\dfrac{1953}{7}=279; \quad y=3:\ x=\dfrac{1288}{7}=184'
            note: "Pour chaque valeur de y, x est determine et tombe juste (Fermat garantit la divisibilite par 7)."
          - math: 'S = \{(288,1),\ (279,2),\ (184,3)\}\ \text{pour}\ p=7;\ \text{aucune solution sinon}'
            note: "Les trois couples solutions, uniquement dans le cas p=7."
  # ── bk-2024-r-x5 — 2024 R, Exercice 5 : inverse de 10 modulo 23, critere de
