        43 égale 11 et 527 modulo 47 égale 10 avec 2021 égale 43 fois 47 —,
        agent-vérificateur-adversarial, 2026-08-06). NB : la Partie III
        (questions q6-q7) mobilise une technique de résolution de système
        de congruences par combinaison directe des deux modules via la
        relation de Bézout de la Partie I — apparentée au théorème des
        restes chinois, non nommée dans l'énoncé et sans rung dédié dans
        la leçon (R0–R8) ; bridgée au point d'usage dans reasoning, sur le
        même mode que le petit théorème de Fermat dans les autres entrées
