        « vérifié » de docs/sujets/maths/arithmetique.md, section « 2021 —
        session normale — Exercice 3 » (re-fetch AlloSchool indépendant +
        diff caractère-par-caractère conforme au scan, maths re-dérivées et
        confirmées — Bézout 47 fois 11 moins 43 fois 12 égale 1, 527 modulo
        43 égale 11 et 527 modulo 47 égale 10 avec 2021 égale 43 fois 47 —,
        agent-vérificateur-adversarial, 2026-08-06). NB : la Partie III
        (questions q6-q7) mobilise une technique de résolution de système
        de congruences par combinaison directe des deux modules via la
        relation de Bézout de la Partie I — apparentée au théorème des
        restes chinois, non nommée dans l'énoncé et sans rung dédié dans
        la leçon (R0–R8) ; bridgée au point d'usage dans reasoning, sur le
        même mode que le petit théorème de Fermat dans les autres entrées
        de cette banque.
    intro: |-
      **Arithmétique (examen national Sciences Mathématiques, session normale 2021, Exercice 3).**

      **Partie I :** on considère dans $\mathbb{Z} \times \mathbb{Z}$ l'équation $(E) : 47x - 43y = 1$.

      **Partie II :** on considère dans $\mathbb{Z}$ l'équation $(F) : x^{41} \equiv 4\ [43]$.

      **Partie III :** on considère dans $\mathbb{Z}$ le système à deux équations $(S) : \begin{cases} x^{41} \equiv 4\ [43] \\ x^{47} \equiv 10\ [47] \end{cases}$

      L'exercice enchaîne la résolution complète d'une équation diophantienne (chapitre 8, construite sur Bézout R4 et Gauss R5), le petit théorème de Fermat — hors-chapitre, déjà rencontré au sommet de leçon 2019 (rupture-gate cp-r6-fermat) — appliqué deux fois, modulo $43$ puis, sous sa forme $a^p \equiv a\ [p]$, modulo $47$, et enfin une résolution de système de congruences par combinaison directe des deux modules via la relation de Bézout de la Partie I — une technique de type « restes chinois », non nommée et sans chapitre dédié, construite ici entièrement à partir du chapitre 5.
    questions:
      - id: q1
        part: "Partie I — Bézout : $47x - 43y = 1$"
        stem: |-
          **(0,25 pt)** Vérifier que le couple $(11,12)$ est une solution particulière de l'équation $(E)$
        reasoning: |-
          Une vérification, pas une recherche : on remplace $x$ par $11$ et $y$ par $12$ dans le membre de gauche de $(E)$, et on compare au membre de droite.
        steps:
          - math: '47 \times 11 - 43 \times 12 = 517 - 516 = 1'
            note: "On substitue le couple propose dans le membre de gauche de (E) : le résultat vaut bien 1."
      - id: q2
        stem: |-
          **(0,75 pt)** Résoudre dans $\mathbb{Z} \times \mathbb{Z}$ l'équation $(E)$
        reasoning: |-
          C'est exactement la méthode du chapitre 8 : une fois une solution particulière connue, on soustrait l'équation générale de l'équation particulière, on divise par $\mathrm{PGCD}(47,43)$, puis Gauss (chapitre 6) isole l'inconnue.

          $47$ et $43$ sont deux nombres premiers **distincts**, donc $\mathrm{PGCD}(47,43)=1$. On soustrait $(E)$ de sa version au couple particulier $(x_0,y_0)=(11,12)$ (question précédente) : $47(x-11) - 43(y-12) = 0$, c'est-à-dire $47(x-11) = 43(y-12)$.

          Le membre de gauche montre que $43$ divise $47(x-11)$ ; comme $\mathrm{PGCD}(43,47)=1$, le théorème de Gauss (chapitre 6) donne $43 \mid (x-11)$. Donc $x - 11 = 43k$ pour un entier $k$, c'est-à-dire $x = 11 + 43k$. En reportant dans l'égalité : $47 \times 43k = 43(y-12)$, donc $47k = y - 12$, c'est-à-dire $y = 12 + 47k$.
        steps:
          - math: '47(x-11) = 43(y-12)'
            note: "On soustrait l'équation (E) de sa version au couple particulier (11,12)."
          - math: '\mathrm{PGCD}(43,47) = 1 \ \text{et}\ 43 \mid 47(x-11) \implies 43 \mid (x-11)'
            note: "43 et 47 sont deux premiers distincts, donc premiers entre eux (chapitre 5) ; Gauss (chapitre 6) isole x moins 11."
          - math: 'x = 11 + 43k, \qquad y = 12 + 47k \qquad (k \in \mathbb{Z})'
            note: "On reporte x moins 11 égale 43k dans l'égalité : 47k égale y moins 12."
      - id: q3
        part: "Partie II — Fermat modulo $43$, l'équation (F)"
        stem: |-
          **(0,5 pt)** Soit $x \in \mathbb{Z}$ une solution de l'équation $(F)$. Montrer que $x$ et $43$ sont premiers entre eux, en déduire que : $x^{42} \equiv 1\ [43]$
        reasoning: |-
          Si $43 \mid x$, alors $x^{41} \equiv 0 \pmod{43}$ ; or $(F)$ dit $x^{41} \equiv 4 \pmod{43}$, et $4 \not\equiv 0 \pmod{43}$ (car $0 < 4 < 43$). Contradiction : $43$ ne divise pas $x$. Comme $43$ est premier, son seul diviseur commun possible avec $x$ est alors $1$, donc $\mathrm{PGCD}(43,x)=1$ (chapitre 5).

          C'est ici qu'intervient le **petit théorème de Fermat** — hors-chapitre, déjà mobilisé au sommet de leçon 2019 (rupture-gate cp-r6-fermat) : $p$ premier et $p \nmid a$ entraîne $a^{p-1} \equiv 1 \pmod p$. Avec $p=43$ et $a=x$, cela donne directement $x^{42} \equiv 1 \pmod{43}$.
        steps:
          - math: '43 \mid x \implies x^{41} \equiv 0 \pmod{43}'
            note: "Hypothèse absurde : si 43 divise x, sa puissance 41-ieme aussi est congrue a 0."
          - math: '4 \not\equiv 0 \pmod{43} \implies 43 \nmid x \implies \mathrm{PGCD}(43,x) = 1'
            note: "Or (F) donne x puissance 41 congru a 4, et 4 n'est pas congru a 0 modulo 43. Contradiction, donc 43 premier avec x (chapitre 5)."
          - math: 'x^{42} \equiv 1 \pmod{43}'
            note: "Petit théorème de Fermat : p = 43, 43 ne divise pas x, donc x puissance 42 congru a 1."
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que : $4x \equiv 1\ [43]$, en déduire que : $x \equiv 11\ [43]$
        reasoning: |-
          On écrit $x^{42} = x \times x^{41}$. Comme $x^{41} \equiv 4 \pmod{43}$ (l'équation $(F)$ elle-même) et $x^{42} \equiv 1 \pmod{43}$ (question précédente), la compatibilité des congruences avec le produit (chapitre 3) donne $x \times 4 \equiv 1 \pmod{43}$, c'est-à-dire $4x \equiv 1 \pmod{43}$.

          Il reste à isoler $x$ : c'est-à-dire trouver un inverse de $4$ modulo $43$. Or la Partie I l'a déjà fourni sans qu'on ait besoin de le chercher par tâtonnement : $47 \equiv 4 \pmod{43}$ (car $47 - 43 = 4$) et $-43 \equiv 0 \pmod{43}$, donc l'identité de Bézout $47 \times 11 - 43 \times 12 = 1$ de la question 1, lue modulo $43$, devient exactement $4 \times 11 \equiv 1 \pmod{43}$.

          On a donc deux congruences pour le même produit : $4x \equiv 1$ et $4 \times 11 \equiv 1 \pmod{43}$. En soustrayant, $4(x-11) \equiv 0 \pmod{43}$, donc $43 \mid 4(x-11)$. Comme $\mathrm{PGCD}(43,4)=1$ ($43$ est premier et ne divise pas $4$), le théorème de Gauss (chapitre 6) donne $43 \mid (x-11)$, c'est-à-dire $x \equiv 11 \pmod{43}$.
        steps:
          - math: 'x^{42} = x \times x^{41} \equiv 4x \pmod{43}'
            note: "On decompose x puissance 42 en x fois x puissance 41, congru a 4 par (F)."
          - math: '4x \equiv x^{42} \equiv 1 \pmod{43}'
            note: "Égalité avec la question précédente : 4x congru a 1."
          - math: '47 \times 11 - 43 \times 12 = 1 \implies 4 \times 11 \equiv 1 \pmod{43}'
            note: "L'identité de Bezout de la question 1, lue modulo 43 (47 congru a 4, moins 43 fois 12 congru a 0), donne directement un inverse de 4."
          - math: '4(x-11) \equiv 0 \pmod{43} \implies 43 \mid (x-11) \implies x \equiv 11 \pmod{43}'
            note: "43 premier avec 4 (chapitre 5) : Gauss (chapitre 6) simplifie le facteur 4, laissant x congru a 11."
      - id: q5
        stem: |-
          **(0,5 pt)** Donner l'ensemble des solutions dans $\mathbb{Z}$ de l'équation $(F)$
        reasoning: |-
          On a montré que toute solution de $(F)$ vérifie $x \equiv 11 \pmod{43}$. Reste la réciproque : est-ce que $x \equiv 11 \pmod{43}$ suffit pour retrouver $x^{41} \equiv 4 \pmod{43}$ ?

          Comme $43$ est premier et $x \equiv 11 \not\equiv 0 \pmod{43}$, le petit théorème de Fermat donne $x^{42} \equiv 1 \pmod{43}$. Et $4x \equiv 4 \times 11 = 44 \equiv 1 \pmod{43}$ (question précédente). Donc $x^{42} \equiv 4x \pmod{43}$, c'est-à-dire $x(x^{41} - 4) \equiv 0 \pmod{43}$. Comme $43$ est premier et ne divise pas $x$, le lemme d'Euclide (chapitre 7) force $43 \mid (x^{41}-4)$, c'est-à-dire $x^{41} \equiv 4 \pmod{43}$.

          L'équivalence est donc complète : $(F) \iff x \equiv 11 \pmod{43}$. L'ensemble des solutions est $S = \{\, 11 + 43k \ : \ k \in \mathbb{Z} \,\}$.
        steps:
          - math: 'x \equiv 11 \pmod{43} \implies x^{42} \equiv 1 \pmod{43} \ \text{et}\ 4x \equiv 44 \equiv 1 \pmod{43}'
            note: "Réciproque : Fermat redonne x puissance 42 congru a 1, et 4 fois 11 égale 44 congru a 1."
          - math: 'x^{42} \equiv 4x \pmod{43} \implies x(x^{41}-4) \equiv 0 \pmod{43} \implies x^{41} \equiv 4 \pmod{43}'
            note: "43 premier et ne divise pas x (lemme d'Euclide, chapitre 7) : force x puissance 41 congru a 4."
          - math: 'S = \{\, 11 + 43k \ : \ k \in \mathbb{Z} \,\}'
            note: "Ensemble des solutions de (F) dans Z."
      - id: q6
        part: "Partie III — Système $(S)$ modulo $43$ et $47$, via la Partie I"
        stem: |-
          **(0,5 pt)** Soit $x$ une solution du système $(S)$. Montrer que $x$ est solution du système $(S')$ : $\begin{cases} x \equiv 11\ [43] \\ x \equiv 10\ [47] \end{cases}$
        reasoning: |-
          La première équation de $(S)$ est exactement $(F)$ : la question 5 donne directement $x \equiv 11 \pmod{43}$.

          Pour la seconde, $x^{47} \equiv 10 \pmod{47}$, on prend un raccourci que fournit le petit théorème de Fermat sous sa forme la plus générale : pour $p$ premier, $a^p \equiv a \pmod p$ pour **tout** entier $a$ (si $p \mid a$, les deux membres sont $\equiv 0$ ; sinon, $a^{p-1}\equiv1$ donne $a^p = a\times a^{p-1}\equiv a$). Avec $p=47$ et $a=x$ : $x^{47} \equiv x \pmod{47}$, quel que soit $x$ — pas besoin de vérifier une coprimalité au préalable.

          En combinant avec l'hypothèse $x^{47} \equiv 10 \pmod{47}$, il vient directement $x \equiv 10 \pmod{47}$.
        steps:
          - math: 'x^{41} \equiv 4 \pmod{43} \implies x \equiv 11 \pmod{43}'
            note: "Première équation de (S), c'est exactement (F) : question 5."
          - math: 'p\ \text{premier} \implies a^p \equiv a \pmod p \ \text{pour tout entier}\ a'
            note: "Forme générale du petit théorème de Fermat, valable même si p divise a (les deux membres sont alors congrus a 0)."
          - math: 'x^{47} \equiv x \pmod{47} \ \text{et}\ x^{47} \equiv 10 \pmod{47} \implies x \equiv 10 \pmod{47}'
            note: "Avec p = 47 : x puissance 47 congru a x, combine a l'hypothèse x puissance 47 congru a 10."
      - id: q7
        stem: |-
          **(0,5 pt)** En déduire que : $x \equiv 527\ [2021]$ *(On pourra utiliser la partie I)*
        reasoning: |-
          On a $x \equiv 11 \pmod{43}$, donc $x = 11 + 43k$ pour un entier $k$. On reporte dans la seconde congruence $x \equiv 10 \pmod{47}$ : $11 + 43k \equiv 10 \pmod{47}$, c'est-à-dire $43k \equiv -1 \pmod{47}$.

          C'est là que la Partie I sert directement, sans nouveau calcul : l'identité de Bézout $47 \times 11 - 43 \times 12 = 1$, lue modulo $47$ (où $47 \times 11 \equiv 0$), donne $-43 \times 12 \equiv 1 \pmod{47}$, c'est-à-dire $43 \times 12 \equiv -1 \pmod{47}$ — exactement la congruence en $k$ qu'on cherche à résoudre. Donc $k \equiv 12 \pmod{47}$, soit $k = 12 + 47t$ pour un entier $t$.

          En reportant dans $x = 11 + 43k$ : $x = 11 + 43(12+47t) = 11 + 516 + 43 \times 47\,t = 527 + 2021t$ (car $43 \times 47 = 2021$). D'où $x \equiv 527 \pmod{2021}$.
        steps:
          - math: 'x \equiv 11 \pmod{43} \implies x = 11 + 43k \ (k \in \mathbb{Z})'
            note: "On écrit x à partir de la première congruence de (S prime)."
          - math: '11 + 43k \equiv 10 \pmod{47} \implies 43k \equiv -1 \pmod{47}'
            note: "On reporte dans la seconde congruence x congru a 10 modulo 47."
          - math: '47 \times 11 - 43 \times 12 = 1 \implies 43 \times 12 \equiv -1 \pmod{47}'
            note: "L'identité de Bezout de la Partie I, lue modulo 47 (47 fois 11 congru a 0) : c'est exactement la congruence en k a résoudre."
          - math: 'k \equiv 12 \pmod{47} \implies k = 12 + 47t \ (t \in \mathbb{Z})'
            note: "43k congru a moins un et 43 fois 12 congru a moins un modulo 47 : k congru a 12."
          - math: 'x = 11 + 43(12+47t) = 527 + 2021t \qquad (43 \times 47 = 2021)'
            note: "On reporte k dans x = 11 + 43k : x congru a 527 modulo 2021."
      - id: q8
        stem: |-
          **(0,5 pt)** Donner l'ensemble des solutions dans $\mathbb{Z}$ du système $(S)$
        reasoning: |-
          On a montré que toute solution de $(S)$ vérifie $x \equiv 527 \pmod{2021}$. Pour la réciproque, on vérifie d'abord que $527$ se réduit bien aux deux restes attendus : $527 = 43 \times 12 + 11$, donc $527 \equiv 11 \pmod{43}$ ; et $527 = 47 \times 11 + 10$, donc $527 \equiv 10 \pmod{47}$.

          Comme $2021 = 43 \times 47$ est un multiple à la fois de $43$ et de $47$, tout $x \equiv 527 \pmod{2021}$ vérifie encore $x \equiv 11 \pmod{43}$ et $x \equiv 10 \pmod{47}$ — donc, par les équivalences déjà établies (question 5 pour le premier module, le même raisonnement de Fermat pour le second), $x^{41} \equiv 4 \pmod{43}$ et $x^{47} \equiv 10 \pmod{47}$ : $x$ est bien solution de $(S)$.

          L'ensemble des solutions est $S = \{\, 527 + 2021k \ : \ k \in \mathbb{Z} \,\}$.
        steps:
          - math: '527 = 43 \times 12 + 11 \implies 527 \equiv 11 \pmod{43}'
            note: "Vérification directe du premier reste."
          - math: '527 = 47 \times 11 + 10 \implies 527 \equiv 10 \pmod{47}'
            note: "Vérification directe du second reste."
          - math: '2021 = 43 \times 47 \implies x \equiv 527 \pmod{2021} \implies x \equiv 11\,[43] \ \text{et}\ x \equiv 10\,[47]'
            note: "2021 est multiple des deux modules : la congruence unique redonne les deux congruences séparées."
          - math: 'S = \{\, 527 + 2021k \ : \ k \in \mathbb{Z} \,\}'
            note: "Ensemble des solutions du système (S) dans Z."

  # ── bk-2023-n-x4 — 2023 N, Exercice 4 : x²≡2[p], Fermat, C_p^k, Moivre, non-résolubilité pour p≡5[8] ──
