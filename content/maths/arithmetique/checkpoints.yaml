  - id: cp-r7b-chiffres-predict
    rung: "R7b"
    habilete: raisonnement
    skill_code: maths_arithmetique
    tags: [checkpoint, formative, misconception_driven, maths_arithmetique, numeration, predict_commit, chiffres]
    primary_misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
    item_source: original
    lesson_placement: in_R7b

    stem: |
      Pour $\overline{xy}_{(7)} = \overline{yx}_{(5)}$, l'équation $3x = 2y$
      a fourni trois candidats : $(2,3)$, $(4,6)$ et $(6,9)$. **Prends
      position avant de lire la suite :** combien de ces couples sont des
      réponses ?

    type: mcq

    choices:
      - id: A
        text: |
          Les trois
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: |
          Modèle détecté : un chiffre traité comme un entier libre. Les trois
          couples vérifient bien $3x = 2y$, mais $x$ et $y$ doivent aussi être
          des chiffres des deux écritures. Le $9$ de $(6,9)$ n'est un chiffre
          ni de la base $7$ ni de la base $5$, et le $6$ de $(4,6)$ n'est pas
          un chiffre de la base $5$ : $\overline{64}_{(5)}$ n'existe pas. Un
          seul couple répond, $(2,3)$.
      - id: B
        text: |
          Deux : $(2,3)$ et $(4,6)$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: |
          Modèle détecté : les chiffres bornés par une seule des deux bases.
          Tu as écarté $(6,9)$, mais $(4,6)$ demande d'écrire
          $\overline{64}_{(5)}$, et $6$ n'est pas un chiffre de la base $5$ :
          cette écriture n'existe pas, même si $7\times4+6$ et $5\times6+4$
          valent tous deux $34$. Les chiffres doivent appartenir aux deux bases
          à la fois : un seul couple répond, $(2,3)$.
      - id: C
        text: |
          Un seul : $(2,3)$
        correct: true
        feedback: |
          Exact. $(6,9)$ tombe à cause du $9$, et $(4,6)$ parce que $6$ n'est
          pas un chiffre de la base $5$, bien que ce couple vérifie
          l'équation. Reste $(2,3)$ : $\overline{23}_{(7)}$ et
          $\overline{32}_{(5)}$ valent tous deux $17$.

