  - id: cp-r7b-ordre-restes
    rung: "R7b"
    habilete: raisonnement
    skill_code: maths_arithmetique
    tags: [checkpoint, formative, misconception_driven, maths_arithmetique, numeration, predict_commit]
    primary_misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
    item_source: original
    lesson_placement: in_R7b

    stem: |
      Les quatre divisions de $2025$ par $7$ ont donné les restes $2$, $2$,
      $6$, $5$, dans cet ordre. **Prends position avant de lire la suite :**
      quelle est l'écriture de $2025$ en base $7$ ?

    type: mcq

    choices:
      - id: A
        text: |
          $\overline{2265}_{(7)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: |
          Modèle détecté : les restes écrits dans l'ordre où ils sont sortis. Or
          le premier reste est celui des unités. Recalcule : $\overline{2265}_{(7)}$
          vaut $2\times343 + 2\times49 + 6\times7 + 5 = 831$, pas $2025$.
      - id: B
        text: |
          $\overline{5226}_{(7)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: |
          Modèle détecté : un renversement à moitié fait. Le dernier reste est
          bien en tête, mais les trois autres sont restés dans l'ordre de
          sortie. Recalcule : $\overline{5226}_{(7)}$ vaut
          $5\times343 + 2\times49 + 2\times7 + 6 = 1833$, pas $2025$.
      - id: C
        text: |
          $\overline{5622}_{(7)}$
        correct: true
        feedback: |
          Exact. Le premier reste donne les unités, le dernier le chiffre de
          tête : on lit de bas en haut. Contrôle :
          $5\times343 + 6\times49 + 2\times7 + 2 = 2025$.
      - id: D
        text: |
          $\overline{2025}_{(7)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: |
          Modèle détecté : l'écriture prise pour le nombre — les chiffres
          décimaux gardés, comme si seule l'étiquette de base changeait. Les
          restes, eux, ont été ignorés. En base $7$, $\overline{2025}_{(7)}$
          vaut $2\times343 + 0\times49 + 2\times7 + 5 = 705$, pas $2025$.

