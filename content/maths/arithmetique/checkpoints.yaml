  # CP-R7b-4 | id: cp-r7b-critere-predict | placé DANS R7b, après la
  #        construction du critère modulo b−1 et AVANT la rupture « la somme
  #        des chiffres, c'est LE critère » (que la prose dit, teste et casse
  #        juste après le marqueur).
  #        COMMIT gate : le reste modulo 8 = b+1 d'un nombre écrit en base 7,
  #        sur le nombre de l'exemple (5622 en base 7, soit 2025), la somme
  #        des chiffres donnée dans l'énoncé comme simple donnée.
  #        Sonde critere-divisibilite-mal-applique (somme employée là où c'est
  #        la somme alternée ; chiffre des unités pris pour le reste modulo
  #        autre chose que b) ; un distracteur porte
  #        numeration-ecriture-prise-pour-le-nombre (5622 lu en base dix).
  #        Valeurs recalculées, chemin par chemin :
  #          7 = 15 − 8 (somme des chiffres réduite modulo 8) ;
  #          2 = chiffre des unités = reste modulo 7 (2025 = 7×289 + 2) ;
  #          6 = reste de cinq mille six cent vingt-deux (5622 = 8×702 + 6) ;
  #          1 = la clé (2025 = 8×253 + 1 ; somme alternée 2−2+6−5).
  #        Contamination de la clé examinée : seul « 15 réduit modulo 7 »
  #        tombe sur 1, ce qui suppose de réduire modulo 7 une question posée
  #        modulo 8 — ce n'est pas un modèle déclaré. La somme alternée lue
  #        depuis la tête (5−6+2−2 = −1, soit 7) n'est pas encore enseignée au
  #        moment de l'engagement. Quatre réponses à un chiffre, toutes des
  #        restes possibles modulo 8 : rien ne se barre à vue, aucune longueur
  #        ne parle. item_source original : AR-52 (base 9, modulo 8 = b−1) et
  #        AR-51 (base 9, modulo 10 = b+1, re-habillé le 2026-10-20) n'en sont
  #        pas des clones, et marquer l'un d'eux comme tel le retirerait de la
  #        liste d'items du chapitre.
  # ════════════════════════════════════════════════════════════════

  - id: cp-r7b-critere-predict
    rung: "R7b"
    habilete: raisonnement
    skill_code: maths_arithmetique
    tags: [checkpoint, formative, misconception_driven, maths_arithmetique, numeration, predict_commit, critere]
    primary_misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
    item_source: original
    lesson_placement: in_R7b

    stem: |
      En base $7$, la somme des chiffres de $\overline{5622}_{(7)}$ vaut $15$.
      **Prends position avant de lire la suite :** quel est le reste de la
      division euclidienne de ce nombre par $8$ ?

    type: mcq

    choices:
      - id: A
        text: |
          $7$
        correct: false
        misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
        feedback: |
          Modèle détecté : la somme des chiffres prise pour LE critère, quel
          que soit le module. $15 = 8+7$ donne bien $7$, mais en base $7$ la
          somme des chiffres ne renseigne que modulo $b-1 = 6$, parce que
          $7 \equiv 1 \pmod 6$. Modulo $8$, ce n'est plus vrai. Le nombre vaut
          $2025$, et $2025 = 8\times253+1$ : le reste est $1$.
      - id: B
        text: |
          $2$
        correct: false
        misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
        feedback: |
          Modèle détecté : le chiffre des unités pris pour le reste. Il donne
          le reste modulo la base : $2025 = 7\times289+2$. Modulo $8$, c'est
          une autre division : $2025 = 8\times253+1$, et le reste est $1$.
      - id: C
        text: |
          $1$
        correct: true
        feedback: |
          Exact. $\overline{5622}_{(7)}$ vaut $2025$, et $2025 = 8\times253+1$.
          La somme des chiffres, elle, aurait annoncé $15 = 8+7$, donc $7$ :
          modulo $8$, ce n'est pas elle qui parle. La suite dit pourquoi.
      - id: D
        text: |
          $6$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: |
          Modèle détecté : l'écriture prise pour le nombre. Tu as divisé cinq
          mille six cent vingt-deux par $8$, comme si les chiffres se lisaient
          en base dix : $5622 = 8\times702+6$. Mais $\overline{5622}_{(7)}$
          vaut $2025$, et $2025 = 8\times253+1$ : le reste est $1$.

