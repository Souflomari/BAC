  # CP-R7b-3 | id: cp-r7b-retenue | placé DANS R7b, juste après la
  #        multiplication posée en base 7 et sa rupture (le seuil 10).
  #        Rupture gate : le report de colonne en base b. Une MULTIPLICATION
  #        exprès : l'erreur de seuil y produit une écriture bien formée, donc
  #        non barrable à vue. Sonde numeration-retenue-a-dix (seuil resté à
  #        10, retenue non reportée) ; un distracteur porte
  #        numeration-restes-ordre-inverse (conversion par la base 10, restes
  #        lus dans l'ordre de sortie). Même forme que l'item AR-48, nombres
  #        frais ; le clone le retire de la liste d'items du chapitre. Spec §6.3.
  # ════════════════════════════════════════════════════════════════

  - id: cp-r7b-retenue
    rung: "R7b"
    habilete: utilisation
    skill_code: maths_arithmetique
    tags: [checkpoint, formative, misconception_driven, maths_arithmetique, numeration, retenue]
    primary_misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
    item_source: clone_of_AR-48      # même forme, nombres frais
    lesson_placement: in_R7b

    stem: |
      Pose et effectue $\overline{25}_{(6)} \times \overline{4}_{(6)}$. Le
      résultat est attendu en base $6$.

    type: mcq

    choices:
      - id: A
        text: |
          $\overline{100}_{(6)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: |
          Modèle détecté : le seuil de la base $10$ gardé. $5\times4 = 20$ :
          tu as écrit $0$ et retenu $2$ ; puis $2\times4+2 = 10$ : tu as écrit
          $0$ et retenu $1$. L'écriture obtenue est parfaitement légale en
          base $6$ — c'est pour cela que l'erreur ne se voit pas — mais elle
          vaut $36$, alors que $\overline{25}_{(6)} \times 4 = 17\times4 = 68$.
      - id: B
        text: |
          $\overline{251}_{(6)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: |
          Modèle détecté : les restes lus dans l'ordre de sortie. Le passage
          par la base $10$ est juste ($17\times4 = 68$), et les divisions aussi :
          $68 = 6\times11+2$, $11 = 6\times1+5$, $1 = 6\times0+1$. Mais le
          premier reste est le chiffre des unités : il fallait lire $1,5,2$, pas
          $2,5,1$. Ton écriture vaut $72+30+1 = 103$.
      - id: C
        text: |
          $\overline{22}_{(6)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: |
          Modèle détecté : la retenue calculée puis oubliée. Tu as bien ramené
          chaque colonne dans $\{0,\dots,5\}$ — $20$ donne $2$, $8$ donne $2$ —
          mais sans rien reporter sur la colonne de gauche. Ton écriture vaut
          $14$ ; le produit vaut $68$.
      - id: D
        text: |
          $\overline{152}_{(6)}$
        correct: true
        feedback: |
          Exact. $5\times4 = 20 = 3\times6+2$ : on écrit $2$, on retient $3$.
          Puis $2\times4+3 = 11 = 1\times6+5$ : on écrit $5$, on retient $1$.
          Contrôle : $\overline{152}_{(6)}$ vaut $36+30+2 = 68$, et
          $\overline{25}_{(6)} \times 4 = 17\times4 = 68$.

