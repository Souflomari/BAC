  # TAILLE : 12 à la livraison, pas 15 — défaut du propriétaire
  # (DECISIONS-EN-ATTENTE.md §37, « un lot au plancher ») : 0 des 10 sujets SM
  # vérifiés de bank.yaml ne porte sur une écriture en base. L'effort libéré est
  # allé à la capacité « utiliser les écritures en base », sous la forme que le
  # cadre décrit : trois QCM (AR-50, AR-51, AR-52) et l'exercice attempt-first
  # r-numeration (exercises.yaml), quatre questions dont une conceptuelle
  # terminale. La vague 1 ajoute deux items, chacun pour une raison nommée :
  #   - AR-53 (pédagogie 13) : AR-48 est RETIRÉ de l'affichage par la règle du
  #     clone (voir PLANCHER), si bien que `numeration-retenue-a-dix` n'avait
  #     que deux items RENDUS. AR-53 est une ADDITION en base 8 dont l'erreur de
  #     seuil donne une écriture légale, 601 en base 8 — le cas que la leçon
  #     affirme sans le montrer (« l'erreur devient invisible »).
