  #     deux bases, résultat demandé dans une troisième, par la base 10 —, la
  #     forme que la source D de
  #     verification-numeration-2026-09-28.md (supprimé le 2026-10-22) atteste
  #     littéralement. Leurre principal : l'addition chiffre à chiffre
  #     par-dessus deux bases (`numeration-ecriture-prise-pour-le-nombre`).
  #
  # VAGUE 1, LES AUTRES RETOUCHES (2026-10-20) :
  #   - AR-51 RE-HABILLÉ (pédagogie 8). Aucune CLÉ du banc n'exigeait le
  #     critère par b+1 : il n'apparaissait qu'en leurre. La clé d'AR-51
  #     l'exige désormais — reste modulo 10 = b+1 de 581 en base 9 (= 478). La
  #     base 9 est gardée, ce qui punit encore le transport de la table de la
  #     base 7 de la leçon ; la somme simple reste un leurre. Trois chiffres
  #     exprès : la somme alternée y vaut la même chose qu'on parte des unités
