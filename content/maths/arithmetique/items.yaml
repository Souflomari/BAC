      atteint $8$.**

      Unités : $7+4 = 11 = 8+3$ — on écrit $3$, on retient $1$.

      Paquets de $8$ : $3+6+1 = 10 = 8+2$ — on écrit $2$, on retient $1$.

      Paquets de $64$ : $2+3+1 = 6$ — on écrit $6$.

      Donc $\overline{237}_{(8)} + \overline{364}_{(8)} = \overline{623}_{(8)}$.

      **Contrôle en base $10$ :** $\overline{237}_{(8)} = 159$,
      $\overline{364}_{(8)} = 244$, et
