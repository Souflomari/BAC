          Tu as gardé le seuil de la base $10$ : $5\times3 = 15$, tu as écrit $5$
          et retenu $1$ ; puis $4\times3+1 = 13$, écrit $3$, retenu $1$. Tous ces
          chiffres existent en base $6$ : l'erreur ne se voit pas, il faut
          recalculer. $\overline{135}_{(6)}$ vaut $59$, alors que le produit vaut
          $29\times3 = 87$.
      - id: B
        text: >-
          $\overline{322}_{(6)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Le passage par la base $10$ est juste : $29\times3 = 87$. Mais en
          reconvertissant, tu as lu les restes dans l'ordre de sortie :
          $87 = 6\times14+3$, $14 = 6\times2+2$, $2 = 6\times0+2$ donnent $3$,
          $2$, $2$. Le premier reste est le chiffre des unités : il fallait lire
          $2, 2, 3$, pas $3, 2, 2$. Ton écriture vaut $122$.
      - id: C
        text: >-
          $\overline{1215}_{(6)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: >
          Tu as écrit chaque produit de colonne tel quel, en entier —
          $4\times3 = 12$ et $5\times3 = 15$, mis côte à côte — sans rien
          reporter. Un produit de colonne qui atteint $6$ doit être rangé en
          paquets de $6$. Ton écriture vaut $299$.
      - id: D
        text: >-
          $\overline{223}_{(6)}$
        correct: true
    correct_feedback: >
      Exact. $5\times3 = 15 = 2\times6+3$ : on écrit $3$, on retient $2$. Puis
      $4\times3+2 = 14 = 2\times6+2$ : on écrit $2$, on retient $2$, qui devient
      le chiffre de tête. Contrôle : $\overline{223}_{(6)}$ vaut
      $72+12+3 = 87 = 29\times3$.
    solution: |
      **En colonnes, en partant des unités ; chaque produit se range en paquets
      de $6$.**

      Unités : $5\times3 = 15 = 2\times6+3$ — on écrit $3$, on retient $2$.

      Paquets de $6$ : $4\times3+2 = 14 = 2\times6+2$ — on écrit $2$, on
      retient $2$, qui devient le chiffre de tête.

      Donc $\overline{45}_{(6)} \times \overline{3}_{(6)} = \overline{223}_{(6)}$.

      **Contrôle en base $10$ :** $\overline{45}_{(6)} = 29$, et
      $$29 \times 3 = 87$$
      $$\overline{223}_{(6)} = 2\times36 + 2\times6 + 3 = 87$$

  - id: AR-53
