        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Le passage par la base $10$ est juste : $159+244 = 403$. Mais tu as
          gardé les chiffres de l'écriture décimale en changeant seulement
          l'étiquette de base. $\overline{403}_{(8)}$ vaut $4\times64+3 = 259$,
          pas $403$ : il restait à écrire $403$ en base $8$.
    correct_feedback: >
      Exact. Unités : $7+4 = 11 = 8+3$, on écrit $3$, on retient $1$. Puis
      $3+6+1 = 10 = 8+2$, on écrit $2$, on retient $1$. Puis $2+3+1 = 6$.
