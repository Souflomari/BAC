  # construit (numeration-build-pedagogie.md (supprimé le 2026-10-22) et
  # numeration-build-fidelite.md, même jour) : AR-53 et AR-54. Tous en R7b.
  # Aucun item hors R7b n'est re-tagué, renuméroté ni déplacé. AR-53 et AR-54
  # sont simplement les deux ids libres suivants — PAS les étiquettes de
  # brouillon homonymes du tableau de traçabilité de la spec (où « AR-53 » est
  # l'ancien nom d'AR-51, et « AR-54 » un item coupé).
