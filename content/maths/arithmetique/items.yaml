  - id: AR-44
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: [numeration, base, comparaison]
    primary_misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
    stem: >
      Range dans l'ordre croissant ces trois écritures de la base $5$ :
      $\overline{344}_{(5)}$, $\overline{412}_{(5)}$, $\overline{1203}_{(5)}$.
    type: mcq
    choices:
      - id: A
        text: >-
          $\overline{1203}_{(5)} < \overline{344}_{(5)} < \overline{412}_{(5)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as comparé les chiffres de tête — $1 < 3 < 4$ — sans d'abord compter
          les chiffres. Or $\overline{1203}_{(5)}$ a quatre chiffres : il vaut au
          moins $5^3 = 125$, alors qu'une écriture à trois chiffres vaut au plus
          $5^3-1 = 124$. Les valeurs sont $99$, $107$ et $178$.
      - id: B
        text: >-
          $\overline{1203}_{(5)} < \overline{412}_{(5)} < \overline{344}_{(5)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as comparé les sommes des chiffres — $6 < 7 < 11$. Mais une somme de
          chiffres ignore les poids : elle ne dit rien de l'ordre. Les valeurs
          sont $\overline{344}_{(5)} = 99$, $\overline{412}_{(5)} = 107$ et
          $\overline{1203}_{(5)} = 178$.
      - id: C
        text: >-
          $\overline{344}_{(5)} < \overline{412}_{(5)} < \overline{1203}_{(5)}$
        correct: true
      - id: D
        text: >-
          $\overline{412}_{(5)} < \overline{344}_{(5)} < \overline{1203}_{(5)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as comparé en partant des unités, comme si le chiffre de droite
          pesait le plus : lues ainsi, les trois écritures vaudraient $123$, $59$
          et $386$. Mais c'est le chiffre de GAUCHE qui pèse le plus, et les
          vraies valeurs, $99$, $107$ et $178$, donnent un autre ordre.
    correct_feedback: >
      Exact. D'abord le nombre de chiffres : $\overline{1203}_{(5)}$, seul à
      quatre chiffres, est le plus grand. Puis, à trois chiffres, on compare de
      gauche à droite : $3 < 4$, donc $\overline{344}_{(5)} <
      \overline{412}_{(5)}$. Contrôle : $99 < 107 < 178$.
    solution: |
      **Le nombre de chiffres décide d'abord.** Une écriture à quatre chiffres
      en base $5$ vaut au moins $5^3 = 125$ ; une écriture à trois chiffres vaut
      au plus $5^3 - 1 = 124$. Donc $\overline{1203}_{(5)}$ est le plus grand.

      **À nombre de chiffres égal, de gauche à droite.** Entre
      $\overline{344}_{(5)}$ et $\overline{412}_{(5)}$, les chiffres de tête
      diffèrent déjà : $3 < 4$, donc $\overline{344}_{(5)} < \overline{412}_{(5)}$.

      **Contrôle par les valeurs :**
      $$\overline{344}_{(5)} = 3\times25 + 4\times5 + 4 = 99$$
      $$\overline{412}_{(5)} = 4\times25 + 1\times5 + 2 = 107$$
      $$\overline{1203}_{(5)} = 125 + 2\times25 + 0\times5 + 3 = 178$$

  - id: AR-49
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: [numeration, base, retenue, mecanisme]
    primary_misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
    stem: >
      Dans une addition posée en base $b$, une colonne donne la somme $c$, avec
      $c \ge b$. Quelle règle faut-il appliquer à cette colonne ?
    type: mcq
    choices:
      - id: A
        text: >-
          On écrit le reste de $c$ dans la division par $10$, et on reporte le
          quotient sur la colonne de gauche.
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: >
          Tu as gardé le seuil de la base $10$ par automatisme. Le report vient
          de ce que la colonne de gauche pèse exactement $b$ fois plus : c'est
          par $b$ qu'on divise, et $10$ n'a aucun rôle en base $b$.
      - id: B
        text: >-
          On écrit $c - b$ dès que $c > b$, avec une retenue de $1$ ; pour
          $c = b$, on écrit $b$.
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: >
          Le seuil est décalé d'un cran : à $c = b$ exactement, la colonne
          déborde déjà — on écrit $0$ et on retient $1$. Écrire $b$ ferait de $b$
          un chiffre, alors que les chiffres de la base $b$ s'arrêtent à $b-1$.
      - id: C
        text: >-
          On écrit le reste de $c$ dans la division par $b$, et on reporte le
          quotient sur la colonne de gauche.
        correct: true
      - id: D
        text: >-
          On écrit $c$ si $c < 10$, et sinon $c - 10$ avec une retenue de $1$.
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: >
          C'est la règle apprise à l'école primaire, valable en base $10$
          seulement. En base $b$, une colonne déborde dès qu'elle atteint $b$, et
          c'est $b$ qu'on retranche, pas $10$.
    correct_feedback: >
      Exact. La colonne de gauche pèse exactement $b$ fois plus : on écrit
      $c = qb + r$ avec $0 \le r < b$, on note $r$ et on reporte $q$. C'est la
      division euclidienne par la base, quelle que soit la base.
    solution: |
      **Pourquoi le seuil est $b$.** Dans une écriture en base $b$, chaque
      colonne pèse exactement $b$ fois plus que sa voisine de droite : $b$
      unités d'une colonne valent exactement une unité de la suivante.

      **La règle.** Si une colonne donne $c$, on fait la division euclidienne
      par $b$ :
      $$c = qb + r \qquad \text{avec} \qquad 0 \le r < b$$
      On écrit $r$ dans la colonne, et on reporte $q$ sur la colonne de gauche.
      À $c = b$ exactement, cela donne $r = 0$ et $q = 1$ : la colonne déborde
      déjà. Le nombre $10$ n'intervient nulle part.

  - id: AR-54
    rung: "R7b"
    habilete: application_non_explicite
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: [numeration, base, addition, conversion]
    primary_misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
    stem: >
      Calcule $\overline{204}_{(6)} + \overline{73}_{(9)}$ et donne le
      résultat en base $8$.
    type: mcq
    choices:
      - id: A
        text: >-
          $\overline{277}_{(8)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as additionné les chiffres colonne par colonne — $4+3 = 7$,
          $0+7 = 7$, puis $2$ — comme si les deux écritures étaient dans la même
          base. Or la deuxième colonne compte des paquets de $6$ dans
          $\overline{204}_{(6)}$, et des paquets de $9$ dans
          $\overline{73}_{(9)}$ : leurs chiffres ne s'ajoutent pas. Entre deux
          bases, on calcule d'abord les valeurs, $76+66 = 142$. Ton écriture
          vaut $191$.
      - id: B
        text: >-
          $\overline{612}_{(8)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Le passage par la base $10$ est juste : $76+66 = 142$. Mais en
          écrivant $142$ en base $8$, tu as lu les restes dans l'ordre de
          sortie : $142 = 8\times17+6$, $17 = 8\times2+1$, $2 = 8\times0+2$
          donnent $6$, $1$, $2$. Le premier reste est le chiffre des unités :
          il fallait lire $2, 1, 6$, pas $6, 1, 2$. Ton écriture vaut $394$.
      - id: C
        text: >-
          $\overline{216}_{(8)}$
        correct: true
      - id: D
        text: >-
          $\overline{142}_{(8)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Les deux conversions sont justes, $\overline{204}_{(6)} = 76$ et
          $\overline{73}_{(9)} = 66$, et la somme vaut bien $142$. Mais tu t'es
          arrêté là, en gardant les chiffres de l'écriture décimale sous
          l'étiquette de la base $8$. $\overline{142}_{(8)}$ vaut
          $64+4\times8+2 = 98$ : il restait à écrire $142$ en base $8$.
    correct_feedback: >
      Exact. Entre deux bases, on passe par les valeurs :
      $\overline{204}_{(6)} = 72+0+4 = 76$ et $\overline{73}_{(9)} = 63+3 = 66$,
      donc la somme vaut $142$. On écrit ensuite $142$ en base $8$ par
      divisions successives, restes lus de bas en haut. Contrôle :
      $2\times64+1\times8+6 = 142$.
    solution: |
      **Deux bases différentes : on ne pose pas l'addition en colonnes.** Une
      même colonne ne compte pas les mêmes paquets dans les deux écritures —
      des paquets de $6$ d'un côté, de $9$ de l'autre. On passe par les
      valeurs.

      **Chaque écriture avec sa propre base :**
      $$\overline{204}_{(6)} = 2\times6^2 + 0\times6 + 4 = 76$$
      $$\overline{73}_{(9)} = 7\times9 + 3 = 66$$
      $$76 + 66 = 142$$

      **Écrire $142$ en base $8$**, par divisions successives :
      $$142 = 8\times17 + 6$$
      $$17 = 8\times2 + 1$$
      $$2 = 8\times0 + 2$$
      Lus de bas en haut, les restes donnent $\overline{216}_{(8)}$.

      **Contrôle :** $\overline{216}_{(8)} = 2\times64 + 1\times8 + 6 = 142$.

  - id: AR-45
    rung: "R7b"
    habilete: application_non_explicite
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: [numeration, base, comparaison]
