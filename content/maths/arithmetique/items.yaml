  #     alternée commencée par un signe moins aux unités (−1+8−5) ; il n'est
  #     pas tagué, aucune famille déclarée ne le décrit. Les chemins « bon
  #     critère, module de la base 9 »
  #     (somme 14, soit 6 modulo 8 ; alternée −2, soit 6 modulo 8 ou 7 modulo
  #     9) ne tombent sur aucune option. Familles visées inchangées (critère,
