        feedback: >
          Tu as lu les trois chaînes comme des nombres décimaux, $23 < 34 <
          11011$ — c'est aussi l'ordre que donne « plus de chiffres gagne »,
          une règle qui ne vaut que dans UNE MÊME base. Chaque écriture doit
          d'abord être convertie avec sa propre base : $A = 27$, $B = 19$,
          $C = 21$.
      - id: B
        text: "$A < B < C$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as rangé les nombres selon leur base, comme si une base plus grande
          donnait un nombre plus grand. La base fixe la longueur de l'écriture,
          pas la taille du nombre : $A = 27$, $B = 19$, $C = 21$.
      - id: C
        text: "$A < C < B$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as comparé les sommes des chiffres : $4$ pour $A$, $5$ pour $C$,
          $7$ pour $B$. Une somme de chiffres ignore les poids comme les bases.
          Les valeurs sont $A = 27$, $B = 19$, $C = 21$.
      - id: D
        text: "$B < C < A$"
        correct: true
    correct_feedback: >
      Exact. Entre bases différentes, on convertit d'abord :
      $A = 16+8+0+2+1 = 27$, $B = 3\times5+4 = 19$, $C = 2\times9+3 = 21$.
      Donc $B < C < A$.
    solution: |
      **Entre deux bases, rien ne se compare avant d'avoir calculé les
      valeurs.** Chaque écriture se convertit avec sa propre base :
      $$A = \overline{11011}_{(2)} = 16 + 8 + 0 + 2 + 1 = 27$$
      $$B = \overline{34}_{(5)} = 3\times5 + 4 = 19$$
      $$C = \overline{23}_{(9)} = 2\times9 + 3 = 21$$
      Comme $19 < 21 < 27$, l'ordre croissant est $B < C < A$.

  - id: AR-46
    rung: "R7b"
    habilete: synthese
    difficulty_level: 5
    skill_code: maths_arithmetique
    tags: [numeration, base, encadrement]
    primary_misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
    stem: >
      On cherche les entiers naturels $N$ qui s'écrivent avec exactement $4$
      chiffres en base $5$ et avec exactement $3$ chiffres en base $8$. Que
      peut-on dire de ces entiers ?
    type: mcq
    choices:
      - id: A
        text: "$64 \\le N \\le 624$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: >
          Tu as réuni les deux encadrements au lieu de les croiser, en gardant le
          plus large de chaque côté. Or $N$ doit vérifier les DEUX conditions :
          $125 \le N \le 624$ et $64 \le N \le 511$, donc $125 \le N \le 511$.
      - id: B
        text: "$125 \\le N \\le 511$"
        correct: true
      - id: C
        text: "Il n'en existe pas."
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as traité le nombre de chiffres comme une propriété du nombre. C'en
          est une du couple (nombre, base) : un même entier a d'autant plus de
          chiffres que la base est petite. Ici, les deux encadrements
          $125 \le N \le 624$ et $64 \le N \le 511$ se recouvrent.
      - id: D
        text: "$N \\ge 1000$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as lu $\overline{1000}_{(5)}$, la plus petite écriture à quatre
          chiffres en base $5$, comme « mille ». Elle vaut $5^3 = 125$. Et un
          entier à trois chiffres en base $8$ ne dépasse pas $8^3-1 = 511$.
    correct_feedback: >
      Exact. Quatre chiffres en base $5$ : $5^3 \le N \le 5^4-1$, soit
      $125 \le N \le 624$. Trois chiffres en base $8$ : $8^2 \le N \le 8^3-1$,
      soit $64 \le N \le 511$. Les deux à la fois : l'intersection,
      $125 \le N \le 511$.
    solution: |
      **Une écriture à $p+1$ chiffres encadre le nombre** : le chiffre de tête
      n'est pas nul, et le plus grand nombre à $p+1$ chiffres est $b^{p+1}-1$.

      **Quatre chiffres en base $5$** ($p = 3$) :
      $$125 \le N \le 624$$

      **Trois chiffres en base $8$** ($p = 2$) :
      $$64 \le N \le 511$$

      **Les deux conditions à la fois** : on garde le plus contraignant de
      chaque côté — le plus grand des minimums, le plus petit des maximums.
      $$125 \le N \le 511$$
      Le nombre de chiffres n'est pas une propriété de l'entier seul : $125$,
      par exemple, s'écrit $\overline{1000}_{(5)}$ et $\overline{175}_{(8)}$.

  # ── Capacité 2.1.6 — utiliser une écriture en base (divisibilité, chiffres) ──
  - id: AR-51
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: [numeration, base, divisibilite, congruences]
    primary_misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
    stem: >
      Soit $N = \overline{581}_{(9)}$. Quel est le reste de la division
      euclidienne de $N$ par $10$ ?
    type: mcq
    choices:
      - id: A
        text: "$4$"
        correct: false
        misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
        feedback: >
          Tu as pris la somme des chiffres, $5+8+1 = 14$, qui laisse $4$ modulo
          $10$. Mais la somme des chiffres vient de $9 \equiv 1 \pmod 8$ : en
          base $9$, elle donne le reste modulo $b-1 = 8$. Modulo $b+1 = 10$, la
          base vérifie $9 \equiv -1 \pmod{10}$, et c'est la somme ALTERNÉE des
          chiffres qui compte.
      - id: B
        text: "$8$"
        correct: true
      - id: C
        text: "$2$"
        correct: false
        misconception: mc.math.maths_arithmetique.reste-non-normalise
        feedback: >
          Le critère est le bon : la somme alternée, $1-8+5 = -2$. Mais tu as
          rendu $2$, comme si le reste d'un nombre négatif était l'opposé de
          celui du positif. Un reste modulo $10$ est compris entre $0$ et $9$ :
          il faut ajouter $10$, car $-2 = 10\times(-1)+8$.
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
        feedback: >
          Tu as lu le chiffre des unités, comme en base $10$. En base $9$, il
          donne le reste modulo la base, $9$ — et en effet
          $N = 478 = 9\times53+1$ —, pas le reste modulo $10$.
    correct_feedback: >
      Exact. En base $9$, $9 \equiv -1 \pmod{10}$ : modulo $10$, $N$ est congru
      à la somme alternée de ses chiffres, en partant des unités :
      $1-8+5 = -2$, et $-2 \equiv 8 \pmod{10}$. Contrôle direct :
      $N = 478 = 10\times47+8$.
    solution: |
      **À quoi la base est-elle congrue ?** Ici $b = 9$ et le module est
      $10 = b+1$ :
      $$9 \equiv -1 \pmod{10}$$
      Les puissances de $9$ valent donc alternativement $1$ et $-1$ modulo
      $10$, en partant des unités, et $N$ est congru à la somme alternée de ses
      chiffres :
      $$N \equiv 1 - 8 + 5 \pmod{10}$$
      $$N \equiv -2 \pmod{10}$$
      $$N \equiv 8 \pmod{10}$$
      Le dernier pas ramène le résultat entre $0$ et $9$ :
      $-2 = 10\times(-1) + 8$.

      **Contrôle direct :** $N = 5\times81 + 8\times9 + 1 = 478$, et
      $478 = 10\times47 + 8$.

  - id: AR-52
    rung: "R7b"
    habilete: application_non_explicite
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: [numeration, base, divisibilite, chiffres]
    primary_misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
    stem: >
      Déterminer tous les chiffres $x$ de la base $9$ tels que
      $N = \overline{3x4}_{(9)}$ soit divisible par $8$.
    type: mcq
    choices:
      - id: A
        text: "$x = 1$"
        correct: true
      - id: B
        text: "$x = 2$"
        correct: false
        misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
        feedback: >
          Tu as pris le bon critère, la somme des chiffres, mais au mauvais
          module : $x + 7 \equiv 0 \pmod 9$ au lieu de $\pmod 8$. En base $9$, la
          somme des chiffres donne le reste modulo $b-1 = 8$, pas modulo $9$.
          Contrôle : $\overline{324}_{(9)}$ vaut $265 = 8\times33+1$.
      - id: C
        text: "$x = 1$ ou $x = 9$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: >
          Tu as gardé la seconde solution de $x \equiv 1 \pmod 8$, $x = 9$. Mais
          $9$ n'est pas un chiffre de la base $9$, dont les chiffres vont de $0$
          à $8$ : la borne $0 \le x \le 8$ fait partie de l'énoncé.
      - id: D
        text: "$x = 7$"
        correct: false
        misconception: mc.math.maths_arithmetique.critere-divisibilite-mal-applique
        feedback: >
          Tu as utilisé la somme alternée, $4 - x + 3 = 7 - x$ : c'est le
          critère du module $b+1 = 10$, pas de $8$. Contrôle :
          $\overline{374}_{(9)}$ vaut $310 = 8\times38+6$, qui n'est pas
          divisible par $8$.
    correct_feedback: >
      Exact. Modulo $b-1 = 8$, $N$ est congru à la somme de ses chiffres :
      $3 + x + 4 = x + 7 \equiv 0 \pmod 8$, donc $x \equiv 1 \pmod 8$. Avec
      $0 \le x \le 8$, seul $x = 1$ convient. Contrôle : $\overline{314}_{(9)}$
      vaut $243+9+4 = 256 = 8\times32$.
    solution: |
      **Le bon critère.** En base $9$, $9 \equiv 1 \pmod 8$ : modulo $8$, $N$
      est congru à la somme de ses chiffres.
      $$N \equiv 3 + x + 4 \pmod 8$$
      $$N \equiv x + 7 \pmod 8$$

      **La condition.** $8 \mid N$ équivaut à $x + 7 \equiv 0 \pmod 8$,
      c'est-à-dire :
      $$x \equiv 1 \pmod 8$$

      **Les bornes.** $x$ est un chiffre de la base $9$, donc
      $0 \le x \le 8$ : seul $x = 1$ convient ($9$ n'est pas un chiffre de la
      base $9$).

      **Contrôle :** $\overline{314}_{(9)} = 3\times81 + 1\times9 + 4 = 256$,
      et $256 = 8\times32$.

  - id: AR-50
    rung: "R7b"
    habilete: application_non_explicite
    difficulty_level: 5
    skill_code: maths_arithmetique
    tags: [numeration, base, gauss, chiffres]
    primary_misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
    stem: >
      Déterminer tous les couples de chiffres $(x,y)$ tels que
      $\overline{xy}_{(9)} = \overline{yx}_{(7)}$.
    type: mcq
    choices:
      - id: A
        text: >-
          $(x,y) = (3,4)$ et $(x,y) = (6,8)$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: >
          Tu as gardé la racine $x = 6$, $y = 8$ : elle vérifie bien $4x = 3y$,
          mais $8$ n'est pas un chiffre de la base $7$, et $\overline{86}_{(7)}$
          n'existe pas. $x$ et $y$ sont chiffres des DEUX écritures : il fallait
          les borner par $\{0,\dots,6\}$ avant de résoudre.
      - id: B
        text: >-
          $(x,y) = (3,4)$ seulement
        correct: true
      - id: C
        text: >-
          $(x,y) = (4,3)$ seulement
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as interverti les poids en mettant en équation : $\overline{xy}_{(9)}$
          lu $9y + x$ au lieu de $9x + y$. On obtient alors $4y = 3x$, d'où
          $(4,3)$. Contrôle : $\overline{43}_{(9)} = 39$ et
          $\overline{34}_{(7)} = 25$ ne sont pas égaux.
      - id: D
        text: >-
          $(x,y) = (0,0)$ et $(x,y) = (3,4)$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: >
          $(0,0)$ vérifie bien $4x = 3y$, mais $x$ et $y$ sont chacun en tête
          d'une écriture, $\overline{xy}_{(9)}$ pour l'un et
          $\overline{yx}_{(7)}$ pour l'autre : ni l'un ni l'autre ne peut être
          nul. C'est la condition « chiffre de tête non nul » qui l'écarte, et
          elle n'a pas été posée.
    correct_feedback: >
      Exact. $9x + y = 7y + x$ donne $8x = 6y$, soit $4x = 3y$. Comme
      $3 \mid 4x$ et $\mathrm{PGCD}(3,4) = 1$, le théorème de Gauss donne
      $3 \mid x$. Les bornes — chiffres des deux bases, en tête d'une
      écriture, donc entre $1$ et $6$ — ne laissent que $x = 3$, $y = 4$, et
      le nombre vaut $\overline{34}_{(9)} = 31 = \overline{43}_{(7)}$.
    solution: |
      **Les bornes d'abord.** $x$ et $y$ sont des chiffres des deux écritures,
      donc dans $\{0,\dots,8\} \cap \{0,\dots,6\} = \{0,\dots,6\}$ ; chacun est
      en tête d'une écriture, donc aucun n'est nul.

      **L'équation.**
      $$9x + y = 7y + x$$
      $$8x = 6y$$
      $$4x = 3y$$

      **Gauss, pas une division « pour voir ».** $3$ divise $4x$ et
      $\mathrm{PGCD}(3,4) = 1$, donc $3 \mid x$ : avec $1 \le x \le 6$,
      $x \in \{3, 6\}$.

      **Le tri par les bornes.** $x = 3$ donne $y = 4$, un chiffre valable.
      $x = 6$ donne $y = 8$, qui n'est pas un chiffre de la base $7$ : rejeté.

      **Contrôle :** $\overline{34}_{(9)} = 27 + 4 = 31$ et
      $\overline{43}_{(7)} = 28 + 3 = 31$.

