  # ── Capacité 2.1.4 — écrire un entier dans une base, revenir à la base 10 ──
  - id: AR-41
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: [numeration, base, division_euclidienne]
    primary_misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
    stem: >
      On écrit $N = 234$ en base $8$ par divisions successives :
      $234 = 8\times29+2$, puis $29 = 8\times3+5$, puis $3 = 8\times0+3$.
      Quelle est l'écriture de $234$ en base $8$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\overline{253}_{(8)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as écrit les restes dans l'ordre où ils sont sortis. Mais le premier
          reste, $2$, est le chiffre des unités : il se lit en dernier.
          Recalcule : $\overline{253}_{(8)}$ vaut $2\times64+5\times8+3 = 171$,
          pas $234$.
      - id: B
        text: >-
          $\overline{352}_{(8)}$
        correct: true
      - id: C
        text: >-
          $\overline{234}_{(8)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as gardé les chiffres de l'écriture décimale en changeant seulement
          l'étiquette de base. Une même suite de chiffres ne désigne pas le même
          nombre dans deux bases : $\overline{234}_{(8)}$ vaut
          $2\times64+3\times8+4 = 156$, pas $234$.
      - id: D
        text: >-
          $\overline{0352}_{(8)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-contraintes-sur-les-chiffres
        feedback: >
          La valeur est juste, mais ce n'est pas une écriture : le quotient final
          $0$ a été gardé comme un chiffre. Le chiffre de tête d'une écriture
          n'est jamais nul — avec quatre chiffres en base $8$, un nombre vaudrait
          au moins $8^3 = 512$.
    correct_feedback: >
      Exact. Les restes sortent des unités vers la tête : $2$, puis $5$, puis
      $3$, qu'on lit de bas en haut. Contrôle : $3\times64+5\times8+2 = 234$.
    solution: |
      Le premier reste est le chiffre des unités, le dernier le chiffre de tête :
      on lit les restes de bas en haut, ce qui donne $\overline{352}_{(8)}$.

      **Contrôle, en recalculant la valeur :**
      $$\overline{352}_{(8)} = 3\times8^2 + 5\times8 + 2$$
      $$\overline{352}_{(8)} = 192 + 40 + 2$$
      $$\overline{352}_{(8)} = 234$$

  - id: AR-42
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: [numeration, base, division_euclidienne]
    primary_misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
    stem: >
      Dans l'écriture de $N = 500$ en base $9$, quel est le **chiffre des
      unités** ?
    type: mcq
    choices:
      - id: A
        text: "$6$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as pris le dernier reste pour le chiffre des unités, comme si le
          premier reste était le chiffre de tête. Les divisions donnent
          $500 = 9\times55+5$, $55 = 9\times6+1$, $6 = 9\times0+6$ : le dernier
          reste, $6$, est le chiffre de TÊTE de $\overline{615}_{(9)}$.
      - id: B
        text: "$0$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as transporté l'écriture décimale : $500$ finit par $0$, mais cela
          dit seulement que $10$ divise $500$. Un chiffre des unités nul en base
          $9$ voudrait dire que $9$ divise $500$ — or $500 = 9\times55+5$.
      - id: C
        text: "$5$"
        correct: true
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as bien mis le dernier reste, $6$, en tête, mais laissé les deux
          autres dans l'ordre de sortie : $6$, $5$, $1$, ce qui met $1$ aux
          unités. Or le premier reste, $5$, est celui des unités : l'écriture est
          $\overline{615}_{(9)}$.
    correct_feedback: >
      Exact. Le chiffre des unités est le reste de la PREMIÈRE division par
      $9$ : $500 = 9\times55+5$. Pas besoin des autres divisions pour le
      connaître.
    solution: |
      **Le chiffre des unités, c'est le premier reste** : dans
      $N = 9q + r$, $r$ est le seul terme qui n'est pas multiplié par $9$.
      $$500 = 9\times55 + 5$$
      Le chiffre des unités est donc $5$.

      **Pour aller jusqu'au bout**, les deux divisions suivantes :
      $$55 = 9\times6 + 1$$
      $$6 = 9\times0 + 6$$
      Lus de bas en haut, les restes donnent $500 = \overline{615}_{(9)}$, et
      en effet $6\times81 + 1\times9 + 5 = 500$.

  - id: AR-43
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: [numeration, base, poids]
    primary_misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
    stem: >
      Que vaut $\overline{203}_{(5)}$ en base $10$ ?
    type: mcq
    choices:
      - id: A
        text: "$203$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-ecriture-prise-pour-le-nombre
        feedback: >
          Tu as lu l'écriture comme si elle était en base $10$. En base $5$, les
          positions pèsent $25$, $5$ et $1$ : $\overline{203}_{(5)}$ vaut
          $2\times25+0\times5+3 = 53$.
      - id: B
        text: "$77$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as lu les poids à l'envers, en donnant le poids $1$ au chiffre de
          gauche : $2\times1+0\times5+3\times25 = 77$. C'est le chiffre de DROITE
          qui porte le poids $1$.
      - id: C
        text: "$265$"
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Tu as décalé les exposants d'un cran, en commençant à $5^1$ pour les
          unités : $2\times125+0\times25+3\times5 = 265$. Le chiffre des unités
          porte $5^0 = 1$.
      - id: D
        text: "$53$"
        correct: true
    correct_feedback: >
      Exact : $2\times25+0\times5+3 = 53$. Le $0$ compte — il occupe la
      position des cinq, et le sauter ferait glisser le $2$ d'un cran.
    solution: |
      Chaque chiffre est multiplié par le poids de sa position, de gauche à
      droite $5^2$, $5$ et $1$ :
      $$\overline{203}_{(5)} = 2\times5^2 + 0\times5 + 3$$
      $$\overline{203}_{(5)} = 50 + 0 + 3$$
      $$\overline{203}_{(5)} = 53$$

  # ── Capacité 2.1.5 — opérer et comparer dans une base ──
  - id: AR-47
    rung: "R7b"
    habilete: application_directe
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: [numeration, base, addition, retenue]
    primary_misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
    stem: >
      Effectue $\overline{342}_{(5)} + \overline{134}_{(5)}$, résultat en
      base $5$.
    type: mcq
    choices:
      - id: A
        text: >-
          $\overline{476}_{(5)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: >
          Tu as gardé le seuil de la base $10$ : $2+4 = 6$ et $4+3 = 7$ restent
          sous $10$, donc tu n'as rien reporté. Mais en base $5$, une colonne
          déborde dès qu'elle atteint $5$ — et $6$, $7$ ne sont même pas des
          chiffres de la base $5$ : ton écriture n'en est pas une.
      - id: B
        text: >-
          $\overline{1301}_{(5)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-restes-ordre-inverse
        feedback: >
          Le passage par la base $10$ est juste : $97+44 = 141$. Mais en
          reconvertissant, tu as lu les restes dans l'ordre de sortie :
          $141 = 5\times28+1$, $28 = 5\times5+3$, $5 = 5\times1+0$,
          $1 = 5\times0+1$ donnent $1$, $3$, $0$, $1$. Le premier reste est le
          chiffre des unités : il fallait lire $1, 0, 3, 1$, pas $1, 3, 0, 1$.
          Ton écriture vaut $201$.
      - id: C
        text: >-
          $\overline{1031}_{(5)}$
        correct: true
      - id: D
        text: >-
          $\overline{421}_{(5)}$
        correct: false
        misconception: mc.math.maths_arithmetique.numeration-retenue-a-dix
        feedback: >
          Tu as bien ramené chaque colonne dans $\{0,\dots,4\}$ — $6$ donne $1$,
          $7$ donne $2$ — mais sans reporter la retenue sur la colonne de gauche.
          Ton écriture vaut $111$ ; la somme vaut $141$.
    correct_feedback: >
      Exact. Unités : $2+4 = 6 = 5+1$, on écrit $1$, on retient $1$. Puis
      $4+3+1 = 8 = 5+3$, on écrit $3$, on retient $1$. Puis $3+1+1 = 5$, on
      écrit $0$, on retient $1$, qui devient le chiffre de tête.
    solution: |
      **En colonnes, de droite à gauche ; une colonne déborde dès qu'elle
      atteint $5$.**

      Unités : $2+4 = 6 = 5+1$ — on écrit $1$, on retient $1$.

      Paquets de $5$ : $4+3+1 = 8 = 5+3$ — on écrit $3$, on retient $1$.

      Paquets de $25$ : $3+1+1 = 5 = 5+0$ — on écrit $0$, on retient $1$.

      La dernière retenue devient le chiffre de tête :
      $\overline{342}_{(5)} + \overline{134}_{(5)} = \overline{1031}_{(5)}$.

      **Contrôle en base $10$ :** $\overline{342}_{(5)} = 97$,
      $\overline{134}_{(5)} = 44$, et
      $$97 + 44 = 141$$
      $$\overline{1031}_{(5)} = 125 + 0 + 3\times5 + 1 = 141$$

  - id: AR-48
    rung: "R7b"
    habilete: application_directe
