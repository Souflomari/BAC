notion: arithmetique
skill_code: maths_arithmetique
misconceptions: []
items:
  - id: AR-1
    rung: "R1"
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Dans la division euclidienne de $250$ par $7$, quel est le reste ?
    type: mcq
    choices:
      - id: A
        text: "$5$"
        correct: true
      - id: B
        text: "$35$"
        correct: false
        feedback: >
          $35$ est le quotient, pas le reste. Tu as trouve le bon nombre de
          fois que $7$ tient dans $250$, mais la question demande ce qui
          reste apres : $250 = 7 \times 35 + 5$.
      - id: C
        text: "$6$"
        correct: false
        feedback: >
          Presque : recompte. $7 \times 35 = 245$, et $250 - 245 = 5$, pas $6$.
      - id: D
        text: "$0$"
        correct: false
        feedback: >
          Le reste ne serait $0$ que si $7$ divisait exactement $250$. Or
          $250 = 7 \times 35 + 5$ : il reste $5$, donc $7 \nmid 250$.
    correct_feedback: >
      Exact : $250 = 7 \times 35 + 5$ avec $0 \le 5 < 7$. Le reste est bien
      l'unique entier de $\{0,\dots,6\}$ qui rend l'egalite vraie.
    solution: |
      On cherche le plus grand multiple de $7$ inferieur ou egal a $250$.
      $$7 \times 35 = 245$$
      $$250 - 245 = 5$$
      Comme $0 \le 5 < 7$, la division euclidienne s'ecrit $250 = 7 \times 35 + 5$ :
      quotient $35$, reste $5$.

  - id: AR-2
    rung: "R2"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Quel est le reste de la division de $2^{2023}$ par $3$ ?
    type: mcq
    choices:
      - id: A
        text: "$2$"
        correct: true
      - id: B
        text: "$1$"
        correct: false
        feedback: >
          Tu as sans doute pris $(-1)^{2023} = 1$. Mais $2023$ est impair,
          donc $(-1)^{2023} = -1 \equiv 2 \pmod 3$, pas $1$.
      - id: C
        text: "$0$"
        correct: false
        feedback: >
          $3$ ne divise jamais une puissance de $2$ (ils n'ont aucun facteur
          premier commun), donc le reste ne peut pas etre $0$.
      - id: D
        text: "$3$"
        correct: false
        feedback: >
          Un reste modulo $3$ est toujours dans $\{0,1,2\}$ : il ne peut pas
          valoir $3$.
    correct_feedback: >
      Bien vu : $2 \equiv -1 \pmod 3$, donc $2^{2023} \equiv (-1)^{2023} = -1
      \equiv 2 \pmod 3$. La congruence transforme une grosse puissance en un
      calcul immediat.
    solution: |
      On remplace $2$ par un representant plus commode modulo $3$ :
      $$2 \equiv -1 \pmod 3$$
      $$2^{2023} \equiv (-1)^{2023} \pmod 3$$
      $$(-1)^{2023} = -1 \equiv 2 \pmod 3$$
      Le reste est donc $2$.

  - id: AR-3
    rung: "R3"
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Quel est $\mathrm{PGCD}(48, 36)$ ?
    type: mcq
    choices:
      - id: A
        text: "$12$"
        correct: true
      - id: B
        text: "$144$"
        correct: false
        feedback: >
          $144$ est le PPCM (plus petit multiple commun), pas le PGCD. Le PGCD
          est un DIVISEUR commun : il ne peut pas etre plus grand que $36$.
      - id: C
        text: "$6$"
        correct: false
        feedback: >
          $6$ divise bien $48$ et $36$, mais ce n'est pas le PLUS GRAND :
          $12$ les divise aussi ($48 = 12 \times 4$, $36 = 12 \times 3$).
      - id: D
        text: "$4$"
        correct: false
        feedback: >
          $4$ divise $48$ et $36$, mais pas le plus grand : $12$ marche encore.
    correct_feedback: >
      Exact. Par l'algorithme d'Euclide : $48 = 36 \times 1 + 12$, puis
      $36 = 12 \times 3 + 0$. Le dernier reste non nul, $12$, est le PGCD.
    solution: |
      Algorithme d'Euclide :
      $$48 = 36 \times 1 + 12$$
      $$36 = 12 \times 3 + 0$$
      Le dernier reste non nul est $12$, donc $\mathrm{PGCD}(48,36) = 12$.

  - id: AR-4
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Les entiers $8$ et $15$ sont-ils premiers, premiers entre eux, les deux,
      ou aucun des deux ?
    type: mcq
    choices:
      - id: A
        text: "Premiers entre eux, mais aucun des deux n'est un nombre premier"
        correct: true
      - id: B
        text: "Tous les deux sont des nombres premiers"
        correct: false
        feedback: >
          Ni $8$ ni $15$ n'est premier : $8 = 2^3$ et $15 = 3 \times 5$. Etre
          premier (un seul entier, deux diviseurs) n'a rien a voir avec etre
          premiers ENTRE EUX (une paire, PGCD $= 1$).
      - id: C
        text: "Ni premiers, ni premiers entre eux"
        correct: false
        feedback: >
          Ils ne sont pas premiers, d'accord. Mais $\mathrm{PGCD}(8,15) = 1$
          (aucun facteur commun : $2^3$ contre $3 \times 5$), donc ils SONT
          premiers entre eux.
      - id: D
        text: "Premiers entre eux, et tous les deux premiers"
        correct: false
        feedback: >
          Ils sont premiers entre eux, mais $8 = 2^3$ n'est pas un nombre
          premier (il a plus de deux diviseurs).
    correct_feedback: >
      Exactement le piege a eviter : "premier" qualifie UN entier (deux
      diviseurs), "premiers entre eux" qualifie une PAIRE (PGCD $= 1$). Ici
      $8 = 2^3$ et $15 = 3\times5$ n'ont aucun facteur commun.
    solution: |
      Deux notions distinctes :
      - $8 = 2^3$ n'est pas premier ; $15 = 3 \times 5$ non plus.
      - Leurs decompositions n'ont aucun facteur premier commun, donc
      $$\mathrm{PGCD}(8, 15) = 1$$
      ce qui signifie qu'ils sont premiers ENTRE EUX. Les deux proprietes
      sont independantes.

  - id: AR-5
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      On sait que $7 \mid 5n$ (l'entier $7$ divise $5n$). Quel theoreme permet
      de conclure directement que $7 \mid n$ ?
    type: mcq
    choices:
      - id: A
        text: "Le theoreme de Gauss, car $\\mathrm{PGCD}(7, 5) = 1$"
        correct: true
      - id: B
        text: "Rien : on ne peut pas conclure"
        correct: false
        feedback: >
          On peut conclure. Comme $7 \mid 5n$ et que $7$ est premier avec $5$,
          le theoreme de Gauss donne exactement $7 \mid n$.
      - id: C
        text: "Le theoreme de Bezout, car il existe $u, v$ tels que $7u + 5v = 1$"
        correct: false
        feedback: >
          Bezout garantit l'existence de $u, v$ avec $7u + 5v = 1$ (c'est
          l'ingredient), mais c'est le theoreme de GAUSS qui enonce la
          conclusion "$a \mid bc$ et $a \wedge b = 1 \Rightarrow a \mid c$".
      - id: D
        text: "Parce que $5$ est un nombre premier"
        correct: false
        feedback: >
          Ce qui compte n'est pas que $5$ soit premier, mais que $7$ et $5$
          soient premiers ENTRE EUX. Gauss s'applique des que
          $\mathrm{PGCD}(7,5) = 1$, meme si les nombres n'etaient pas premiers.
    correct_feedback: >
      C'est precisement le theoreme de Gauss : si $a \mid bc$ et
      $\mathrm{PGCD}(a,b) = 1$, alors $a \mid c$. Ici $a = 7$, $b = 5$,
      $c = n$, et $7 \wedge 5 = 1$.
    solution: |
      Theoreme de Gauss : si $a \mid bc$ et $\mathrm{PGCD}(a, b) = 1$, alors
      $a \mid c$. Ici $a = 7$, $b = 5$, $c = n$. Comme $\mathrm{PGCD}(7, 5) = 1$,
      de $7 \mid 5n$ on deduit $7 \mid n$.

  - id: AR-6
    rung: "R7"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      L'equation $6x + 4y = 5$ admet-elle des solutions dans $\mathbb{Z}^2$ ?
    type: mcq
    choices:
      - id: A
        text: "Non, car $\\mathrm{PGCD}(6, 4) = 2$ ne divise pas $5$"
        correct: true
      - id: B
        text: "Oui, car $6$ et $4$ sont tous les deux pairs"
        correct: false
        feedback: >
          Justement : $6x + 4y$ est toujours PAIR (multiple de $2$), alors que
          $5$ est impair. L'egalite est donc impossible dans $\mathbb{Z}$.
      - id: C
        text: "Oui, il suffit de prendre $x$ et $y$ assez grands"
        correct: false
        feedback: >
          La taille de $x, y$ n'y change rien : le membre de gauche reste un
          multiple de $\mathrm{PGCD}(6,4) = 2$, donc toujours pair, jamais
          egal a $5$.
      - id: D
        text: "Non, car $6$ et $4$ ne sont pas premiers entre eux"
        correct: false
        feedback: >
          Le fait qu'ils ne soient pas premiers entre eux n'interdit pas a lui
          seul les solutions. Le critere exact est : il y a des solutions
          si et seulement si $\mathrm{PGCD}(6,4) = 2$ DIVISE le second membre
          $5$. Ici $2 \nmid 5$, d'ou l'impossibilite.
    correct_feedback: >
      Exact. L'equation $ax + by = c$ a des solutions entieres si et seulement
      si $\mathrm{PGCD}(a,b) \mid c$. Ici $\mathrm{PGCD}(6,4) = 2$ et
      $2 \nmid 5$, donc aucune solution.
    solution: |
      Critere d'existence : $ax + by = c$ a des solutions dans $\mathbb{Z}^2$
      si et seulement si $\mathrm{PGCD}(a, b) \mid c$.
      $$\mathrm{PGCD}(6, 4) = 2$$
      Or $2$ ne divise pas $5$ (qui est impair). Donc l'equation n'a aucune
      solution entiere : tout $6x + 4y$ est pair, jamais egal a $5$.

  - id: AR-7
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Avec un bidon de $4$ L et un bidon de $6$ L (memes regles que dans
      l'histoire), peux-tu mesurer exactement $1$ L ?
    type: mcq
    choices:
      - id: A
        text: "Non : toute quantite obtenue est un multiple de $2$, jamais $1$ L"
        correct: true
      - id: B
        text: "Oui, il suffit de trouver la bonne suite d'operations"
        correct: false
        feedback: >
          Il ne suffit pas d'essayer plus fort : toute quantite mesurable
          avec ces deux bidons est de la forme $4u + 6v$ (avec $u, v$
          entiers relatifs), donc un multiple du PGCD de $4$ et $6$, qui
          vaut $2$. Comme $1$ n'est pas un multiple de $2$, aucune suite
          d'operations ne donnera $1$ L.
      - id: C
        text: "Non, parce que les bidons sont trop grands pour $1$ L"
        correct: false
        feedback: >
          La taille des bidons n'est pas en cause : avec des bidons de
          $400$ L et $600$ L, le probleme serait identique. Ce qui bloque,
          c'est que $4$ et $6$ partagent le facteur $2$ : toute quantite
          obtenue est un multiple de $2$.
      - id: D
        text: "Non, parce que $4$ et $6$ ne sont pas des nombres premiers"
        correct: false
        feedback: >
          $4$ et $6$ ne sont en effet pas premiers, mais ce n'est pas la
          vraie raison : deux nombres non premiers peuvent tres bien etre
          premiers ENTRE EUX (par exemple $4$ et $9$). Le blocage reel ici,
          c'est que $\mathrm{PGCD}(4,6) = 2 \neq 1$.
    correct_feedback: >
      Exact. Toute quantite atteignable avec des bidons de $4$ L et $6$ L
      est un multiple de $\mathrm{PGCD}(4,6) = 2$. Comme $1$ n'est pas un
      multiple de $2$, mesurer $1$ L est impossible, quelle que soit la
      strategie suivie.
    solution: |
      Les quantites atteignables avec deux bidons de capacites $4$ et $6$
      sont exactement les entiers de la forme $4u + 6v$, avec $u, v \in
      \mathbb{Z}$. Par l'algorithme d'Euclide :
      $$6 = 4 \times 1 + 2$$
      $$4 = 2 \times 2 + 0$$
      donc $\mathrm{PGCD}(4,6) = 2$. Tout $4u + 6v$ est donc un multiple de
      $2$ : on ne peut jamais obtenir $1$ L, qui n'est pas un multiple de
      $2$.

  - id: AR-8
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Avec quelle paire de bidons peux-tu mesurer exactement $1$ L ?
    type: mcq
    choices:
      - id: A
        text: "$(2, 4)$"
        correct: false
        feedback: >
          $2$ et $4$ sont tous les deux pairs : $\mathrm{PGCD}(2,4) = 2$.
          Toute quantite obtenue avec cette paire est donc un multiple de
          $2$, jamais $1$ L.
      - id: B
        text: "$(4, 9)$, car $\\mathrm{PGCD}(4,9) = 1$"
        correct: true
      - id: C
        text: "$(3, 9)$"
        correct: false
        feedback: >
          $9$ est un multiple de $3$ : $\mathrm{PGCD}(3,9) = 3$. Avec cette
          paire "emboitee", on ne mesure jamais que des multiples de $3$.
      - id: D
        text: "$(6, 8)$"
        correct: false
        feedback: >
          $6$ et $8$ sont tous les deux pairs : $\mathrm{PGCD}(6,8) = 2$.
          Deux capacites paires ne donneront jamais une quantite impaire
          comme $1$ L.
    correct_feedback: >
      Exact. $4$ et $9$ n'ont aucun facteur premier commun :
      $\mathrm{PGCD}(4,9) = 1$. C'est la condition exacte pour pouvoir
      mesurer $1$ L (et, par Bezout, toute quantite entiere).
    solution: |
      On mesure exactement $1$ L avec deux bidons de capacites $a$ et $b$
      si et seulement si $\mathrm{PGCD}(a,b) = 1$ (Bezout garantit alors
      l'existence d'entiers $u,v$ avec $au+bv=1$).
      - $\mathrm{PGCD}(2,4) = 2$, $\mathrm{PGCD}(3,9) = 3$,
      $\mathrm{PGCD}(6,8) = 2$ : aucune de ces paires ne convient.
      - $\mathrm{PGCD}(4,9) = 1$ (aucun facteur premier commun : $4 = 2^2$,
      $9 = 3^2$) : cette paire convient.

  - id: AR-9
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Avec un bidon de $6$ L et un bidon de $8$ L, quelle est la plus
      petite quantite (en litres entiers strictement positifs) que tu
      peux mesurer ?
    type: mcq
    choices:
      - id: A
        text: "$1$ L"
        correct: false
        feedback: >
          $1$ L n'est pas atteignable ici : $6$ et $8$ ne sont pas premiers
          entre eux, $\mathrm{PGCD}(6,8) = 2$. Toute quantite mesurable est
          un multiple de $2$, jamais $1$.
      - id: B
        text: "$6$ L"
        correct: false
        feedback: >
          $6$ L est bien mesurable (le bidon plein), mais ce n'est pas la
          plus petite quantite possible : en versant $6$ L dans le bidon de
          $8$ L puis en le remplissant, on isole $8 - 6 = 2$ L, plus petit
          que $6$.
      - id: C
        text: "$2$ L, car c'est $\\mathrm{PGCD}(6,8)$, obtenu par $8-6$"
        correct: true
      - id: D
        text: "$14$ L"
        correct: false
        feedback: >
          $14 = 6 + 8$ est bien une quantite atteignable (les deux bidons
          pleins reunis), mais la question demande la plus PETITE
          quantite, pas la plus grande.
    correct_feedback: >
      Exact. La plus petite quantite entiere strictement positive qu'on
      peut isoler avec deux bidons de capacites $a$ et $b$ est
      $\mathrm{PGCD}(a,b)$. Ici $\mathrm{PGCD}(6,8) = 2$, obtenu directement
      par $8 - 6$.
    solution: |
      Par l'algorithme d'Euclide :
      $$8 = 6 \times 1 + 2$$
      $$6 = 2 \times 3 + 0$$
      donc $\mathrm{PGCD}(6,8) = 2$. La plus petite quantite strictement
      positive qu'on peut isoler avec des bidons de $6$ L et $8$ L est
      exactement ce PGCD, soit $2$ L (obtenu en versant le contenu du
      bidon de $6$ L dans celui de $8$ L, puis en completant : il reste
      $8 - 6 = 2$ L).

  - id: AR-10
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Quel est le reste de la division euclidienne de $-50$ par $7$ ?
    type: mcq
    choices:
      - id: A
        text: "$-1$"
        correct: false
        feedback: >
          Le reste d'une division euclidienne doit etre POSITIF ou nul
          (entre $0$ et $6$ ici). Tu as garde le quotient $-7$ (car
          $-50 = 7\times(-7) - 1$), mais $-1$ n'est pas un reste valide.
      - id: B
        text: "$1$"
        correct: false
        feedback: >
          Tu as sans doute divise $50$ par $7$ (reste $1$) en ignorant le
          signe. Mais la division euclidienne de $-50$ n'est pas
          simplement l'oppose de celle de $50$ : il faut $-50 = 7q + r$
          avec $0 \le r < 7$, ce qui donne $q = -8$ et $r = 6$, pas $1$.
      - id: C
        text: "$-8$"
        correct: false
        feedback: >
          $-8$ est le QUOTIENT de la division ($-50 = 7\times(-8)+6$), pas
          le reste. Le reste est ce qui reste apres avoir retire
          $7\times(-8)$, soit $6$.
      - id: D
        text: "$6$, car $-50 = 7\\times(-8) + 6$ avec $0 \\le 6 < 7$"
        correct: true
    correct_feedback: >
      Exact. On cherche l'entier $q$ tel que $0 \le -50 - 7q < 7$. C'est
      $q = -8$, et alors $-50 - 7\times(-8) = -50+56 = 6$. Le reste est
      bien $6$, un entier de $\{0,\dots,6\}$.
    solution: |
      On cherche $q, r$ entiers avec $-50 = 7q + r$ et $0 \le r < 7$. Le
      multiple de $7$ juste en dessous ou egal a $-50$ est $7 \times (-8)
      = -56$ :
      $$-50 = 7 \times (-8) + 6$$
      Comme $0 \le 6 < 7$, le quotient est $-8$ et le reste est $6$.
      Attention : ce n'est ni l'oppose du reste de $50$ par $7$ (qui vaut
      $1$), ni un nombre negatif.

  - id: AR-11
    rung: "R1"
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Que signifie exactement la notation $b \mid a$ ($b$ divise $a$) ?
    type: mcq
    choices:
      - id: A
        text: "Il existe un entier $k$ tel que $a = bk$"
        correct: true
      - id: B
        text: "Il existe un entier $k$ tel que $b = ak$"
        correct: false
        feedback: >
          C'est la relation inversee : cette egalite dit "$a$ divise $b$",
          pas "$b$ divise $a$". Dans $b \mid a$, c'est $a$ qui s'ecrit
          comme un multiple de $b$, pas l'inverse.
      - id: C
        text: "$b < a$"
        correct: false
        feedback: >
          La divisibilite n'est pas une comparaison de taille. Par exemple
          $5 \mid 5$ (avec $b=a$), et le fait que $-3 \mid 6$ n'a rien a
          voir avec une inegalite entre $-3$ et $6$.
      - id: D
        text: "$a$ et $b$ ont le meme reste dans une division"
        correct: false
        feedback: >
          Tu confonds "diviser" et "etre congrus". $a \equiv c \pmod{n}$
          signifie que $a$ et $c$ ont le meme reste modulo $n$ ; "$b$
          divise $a$" est une tout autre relation, ou $a$ est un multiple
          exact de $b$ (reste $0$ dans la division de $a$ par $b$).
    correct_feedback: >
      Exact. $b \mid a$ signifie qu'il existe $k \in \mathbb{Z}$ tel que
      $a = bk$ : $a$ est un multiple de $b$, ou encore la division de $a$
      par $b$ a un reste nul.
    solution: |
      Par definition, $b$ divise $a$ (note $b \mid a$) lorsqu'il existe un
      entier $k$ tel que
      $$a = bk$$
      Autrement dit, $a$ est un multiple de $b$ ; de facon equivalente, le
      reste de la division euclidienne de $a$ par $b$ (si $b \neq 0$) est
      $0$.

  - id: AR-12
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Quel est le reste de la division de $2^{100}$ par $7$ ?
    type: mcq
    choices:
      - id: A
        text: "$1$"
        correct: false
        feedback: >
          Tu as sans doute reduit $100$ modulo $3$ correctement
          ($100 = 3\times33+1$) mais oublie le "+1" a la fin :
          $2^{100} \equiv 2^{3\times33} \times 2^1$, et il reste ce
          facteur $2^1 = 2$, pas $1$.
      - id: B
        text: "$2$, car $2^3 \\equiv 1 \\pmod 7$, $100 = 3\\times33+1$, donc $2^{100} \\equiv 2^1 \\equiv 2$"
        correct: true
      - id: C
        text: "$4$"
        correct: false
        feedback: >
          Tu as du te tromper dans le reste de $100$ par $3$ :
          $100 = 3\times33+1$, donc le reste est $1$ (pas $2$). Avec un
          reste de $2$ on trouverait $2^2=4$, mais ici c'est bien $2^1=2$.
      - id: D
        text: "$0$"
        correct: false
        feedback: >
          $7$ est premier et ne divise aucune puissance de $2$ (ils n'ont
          pas de facteur premier commun) : le reste ne peut jamais etre
          $0$.
    correct_feedback: >
      Exact. Comme $2^3 = 8 \equiv 1 \pmod 7$, les puissances de $2$
      modulo $7$ sont periodiques de periode $3$. Puisque
      $100 = 3\times 33 + 1$, $2^{100} \equiv (2^3)^{33} \times 2^1 \equiv
      1^{33}\times 2 \equiv 2 \pmod 7$.
    solution: |
      On cherche une periodicite : $2^3 = 8 = 7\times1+1$, donc
      $$2^3 \equiv 1 \pmod 7$$
      On ecrit $100$ sous la forme $3q+r$ :
      $$100 = 3 \times 33 + 1$$
      Alors $2^{100} = (2^3)^{33} \times 2^1 \equiv 1^{33} \times 2 \equiv
      2 \pmod 7$. Le reste est $2$.

  - id: AR-13
    rung: "R2"
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Quel est le reste de la division de $3725$ par $9$ ?
    type: mcq
    choices:
      - id: A
        text: "$17$"
        correct: false
        feedback: >
          $17$ est la somme des chiffres ($3+7+2+5$), une etape
          intermediaire. Comme $17 \ge 9$, il faut encore reduire :
          $17 = 9\times1+8$, donc le reste final est $8$, pas $17$.
      - id: B
        text: "$0$"
        correct: false
        feedback: >
          Le critere "somme des chiffres" sert a tester la DIVISIBILITE
          par $9$ (reste $0$ si la somme des chiffres est un multiple de
          $9$), mais ici $17$ n'est pas un multiple de $9$ : $3725$ n'est
          pas divisible par $9$.
      - id: C
        text: "$8$, car la somme des chiffres $3+7+2+5 = 17$, et $17 \\equiv 8 \\pmod 9$"
        correct: true
      - id: D
        text: "$5$"
        correct: false
        feedback: >
          $5$ est le chiffre des unites de $3725$, ce qui donnerait le
          reste modulo $10$, pas modulo $9$. Les deux tests (chiffre des
          unites, somme des chiffres) ne servent pas au meme modulo.
    correct_feedback: >
      Exact. Comme $10 \equiv 1 \pmod 9$, tout nombre est congru a la
      somme de ses chiffres modulo $9$. Ici $3+7+2+5=17$, et
      $17 = 9\times1+8$, donc $3725 \equiv 8 \pmod 9$.
    solution: |
      Propriete : un entier est congru, modulo $9$, a la somme de ses
      chiffres (car $10 \equiv 1 \pmod 9$). Ici :
      $$3+7+2+5 = 17$$
      Comme $17 \ge 9$, on reduit encore :
      $$17 = 9 \times 1 + 8$$
      Le reste de $3725$ par $9$ est donc $8$.

  - id: AR-14
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Quel est $\mathrm{PGCD}(210, 45)$ ?
    type: mcq
    choices:
      - id: A
        text: "$5$"
        correct: false
        feedback: >
          $5$ divise bien $210$ et $45$, mais ce n'est pas le PLUS GRAND
          diviseur commun : $15$ divise aussi les deux nombres
          ($210 = 15\times14$, $45 = 15\times3$).
      - id: B
        text: "$45$"
        correct: false
        feedback: >
          $45$ ne serait le PGCD que si $45$ divisait $210$. Or
          $210 = 45\times4 + 30$ : $45$ ne divise pas exactement $210$,
          donc $45$ n'est pas un diviseur commun.
      - id: C
        text: "$630$"
        correct: false
        feedback: >
          $630$ est le PPCM (plus petit multiple commun) de $210$ et
          $45$, pas leur PGCD. Le PGCD est un DIVISEUR commun, donc il ne
          peut pas depasser $45$, le plus petit des deux nombres.
      - id: D
        text: "$15$, obtenu par $210 = 45\\times4+30$, $45 = 30\\times1+15$, $30 = 15\\times2+0$"
        correct: true
    correct_feedback: >
      Exact. L'algorithme d'Euclide donne bien $15$ comme dernier reste
      non nul : $210=45\times4+30$, $45=30\times1+15$, $30=15\times2+0$.
    solution: |
      Algorithme d'Euclide :
      $$210 = 45 \times 4 + 30$$
      $$45 = 30 \times 1 + 15$$
      $$30 = 15 \times 2 + 0$$
      Le dernier reste non nul est $15$, donc $\mathrm{PGCD}(210,45) =
      15$.

  - id: AR-15
    rung: "R3"
    difficulty_level: 2
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Dans le calcul de $\mathrm{PGCD}(a,b)$ par l'algorithme d'Euclide,
      le resultat final est :
    type: mcq
    choices:
      - id: A
        text: "le dernier reste non nul de la suite des divisions"
        correct: true
      - id: B
        text: "le dernier reste obtenu (c'est-a-dire $0$)"
        correct: false
        feedback: >
          $0$ est le signal d'ARRET de l'algorithme (on s'arrete quand le
          reste devient nul), mais ce n'est pas le resultat. Le PGCD est
          le reste non nul juste AVANT, a l'etape precedente.
      - id: C
        text: "le dernier quotient obtenu"
        correct: false
        feedback: >
          Tu regardes la mauvaise colonne : l'algorithme d'Euclide
          produit une suite de quotients ET de restes a chaque division,
          mais c'est le dernier RESTE non nul qui est le PGCD, pas le
          quotient.
      - id: D
        text: "le premier reste non nul"
        correct: false
        feedback: >
          S'arreter des la premiere division est premature : il faut
          repeter la division (diviseur precedent par reste precedent)
          jusqu'a obtenir un reste nul. C'est le DERNIER reste non nul,
          pas le premier, qui est le PGCD.
    correct_feedback: >
      Exact. On divise, on remplace le couple (dividende, diviseur) par
      (diviseur, reste), et on repete jusqu'a un reste nul : le PGCD est
      le dernier reste non nul rencontre.
    solution: |
      L'algorithme d'Euclide repose sur la propriete $\mathrm{PGCD}(a,b)
      = \mathrm{PGCD}(b, r)$ ou $r$ est le reste de $a$ par $b$. On
      repete : diviser, garder (diviseur, reste), jusqu'a tomber sur un
      reste nul. Le PGCD cherche est alors le dernier reste NON NUL
      obtenu, pas $0$ lui-meme et pas un quotient.

  - id: AR-16
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      On constate que $8\times(-1) + 9\times 1 = 1$. Que peut-on en
      deduire ?
    type: mcq
    choices:
      - id: A
        text: "$8$ et $9$ sont des nombres premiers"
        correct: false
        feedback: >
          $8 = 2^3$ n'est pas premier (il a plus de deux diviseurs).
          L'identite $8u+9v=1$ ne dit rien sur le fait que $8$ ou $9$
          soient premiers : elle parle de la paire $(8,9)$, pas de chaque
          nombre separement.
      - id: B
        text: "$8$ et $9$ sont premiers entre eux ($\\mathrm{PGCD}(8,9)=1$)"
        correct: true
      - id: C
        text: "$8$ divise $9$, ou $9$ divise $8$"
        correct: false
        feedback: >
          L'egalite $8\times(-1)+9\times1=1$ est une combinaison lineaire,
          pas une relation de divisibilite directe. Ni $8$ ne divise $9$
          (car $9=8\times1+1$), ni $9$ ne divise $8$.
      - id: D
        text: "On ne peut rien conclure sans calculer $\\mathrm{PGCD}(8,9)$"
        correct: false
        feedback: >
          C'est justement la reciproque de Bezout qui permet de conclure
          directement : des qu'on exhibe des entiers $u,v$ avec
          $au+bv=1$, on sait que $\mathrm{PGCD}(a,b)=1$, sans avoir
          besoin de refaire l'algorithme d'Euclide.
    correct_feedback: >
      Exact. Des qu'on trouve des entiers $u,v$ avec $au+bv=1$, le
      theoreme de Bezout (sa reciproque) garantit que
      $\mathrm{PGCD}(a,b)=1$ : ici $8$ et $9$ sont premiers entre eux.
    solution: |
      L'egalite donnee, $8\times(-1)+9\times1=1$, est une relation de
      Bezout pour $(8,9)$ : elle exhibe des entiers $u=-1$, $v=1$ tels
      que $8u+9v=1$. Or tout diviseur commun de $8$ et $9$ divise aussi
      $8u+9v=1$, donc ce diviseur commun vaut $1$. Ainsi
      $\mathrm{PGCD}(8,9)=1$ : $8$ et $9$ sont premiers entre eux (bien
      qu'aucun des deux, $8=2^3$, ne soit premier).

  - id: AR-17
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Existe-t-il des entiers $u, v$ tels que $6u + 4v = 1$ ?
    type: mcq
    choices:
      - id: A
        text: "Oui, de tels $u,v$ existent toujours"
        correct: false
        feedback: >
          Le theoreme de Bezout garantit l'existence de $u,v$ avec
          $au+bv=\mathrm{PGCD}(a,b)$, pas avec $au+bv=1$ en general. Ici
          $\mathrm{PGCD}(6,4)=2 \neq 1$, donc $6u+4v=1$ n'a pas de
          solution.
      - id: B
        text: "Oui, en prenant $u$ et $v$ assez grands"
        correct: false
        feedback: >
          La taille de $u$ et $v$ ne change rien : quelle que soit leur
          valeur, $6u+4v$ reste un multiple de $\mathrm{PGCD}(6,4)=2$,
          donc toujours pair. $1$ est impair : impossible d'y arriver.
      - id: C
        text: "Non : toute valeur de $6u+4v$ est un multiple de $2$, or $1$ n'en est pas un"
        correct: true
      - id: D
        text: "Non, car $6$ et $4$ ne sont pas des nombres premiers"
        correct: false
        feedback: >
          Ce n'est pas parce que $6$ et $4$ ne sont pas premiers que
          $6u+4v=1$ est impossible : c'est parce qu'ils ne sont pas
          premiers ENTRE EUX ($\mathrm{PGCD}(6,4)=2$). Deux nombres non
          premiers peuvent tres bien verifier $au+bv=1$ (par exemple $4$
          et $9$).
    correct_feedback: >
      Exact. Toute combinaison $6u+4v$ (avec $u,v \in \mathbb{Z}$) est un
      multiple de $\mathrm{PGCD}(6,4)=2$. Comme $1$ n'est pas un multiple
      de $2$, l'equation $6u+4v=1$ n'a aucune solution entiere.
    solution: |
      Toute combinaison $6u+4v$ est un multiple de $\mathrm{PGCD}(6,4)$.
      Par l'algorithme d'Euclide :
      $$6 = 4 \times 1 + 2$$
      $$4 = 2 \times 2 + 0$$
      donc $\mathrm{PGCD}(6,4)=2$. Ainsi $6u+4v$ est toujours pair, et ne
      peut jamais valoir $1$, qui est impair.

  - id: AR-18
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      On a $6 \mid 4 \times 9$ (car $4\times9 = 36 = 6\times6$). Peut-on
      en conclure que $6 \mid 4$ ou $6 \mid 9$ ?
    type: mcq
    choices:
      - id: A
        text: "Oui, $6 \\mid 4$ ou $6 \\mid 9$ necessairement"
        correct: false
        feedback: >
          Le theoreme de Gauss ("$a\mid bc$ et $\mathrm{PGCD}(a,b)=1$
          entrainent $a\mid c$") a une HYPOTHESE : $a$ premier avec $b$.
          Ici $\mathrm{PGCD}(6,4)=2$ et $\mathrm{PGCD}(6,9)=3$, aucune des
          deux hypotheses n'est verifiee : Gauss ne s'applique pas, et de
          fait ni $6\mid4$ ni $6\mid9$.
      - id: B
        text: "Oui, car $6 = 2\\times3$, et $2\\mid 4$, $3\\mid 9$"
        correct: false
        feedback: >
          Repartir les facteurs de $6$ entre $4$ et $9$ ne prouve pas que
          $6$ divise l'un des deux. $2\mid4$ et $3\mid9$ sont vrais, mais
          il faudrait TOUT le facteur $6$ dans un seul des deux nombres
          pour que $6\mid4$ ou $6\mid9$ ; ce n'est le cas ni pour $4$
          ($6\nmid4$) ni pour $9$ ($6\nmid9$).
      - id: C
        text: "On ne peut pas savoir sans calculer $4\\times9$"
        correct: false
        feedback: >
          Le produit $4\times9=36$ est deja donne dans l'enonce, et on
          sait meme que $6\mid36$. La question n'est pas de calculer le
          produit mais de savoir si un diviseur du produit doit diviser
          l'un des facteurs : la reponse depend des PGCD, pas d'un calcul
          supplementaire.
      - id: D
        text: "Non : la condition $\\mathrm{PGCD}=1$ n'est verifiee ni pour $(6,4)$ ni pour $(6,9)$, donc le theoreme de Gauss ne s'applique pas (et de fait $6 \\nmid 4$, $6 \\nmid 9$)"
        correct: true
    correct_feedback: >
      Exact. Le theoreme de Gauss exige $\mathrm{PGCD}(a,b)=1$. Ici
      $\mathrm{PGCD}(6,4)=2$ et $\mathrm{PGCD}(6,9)=3$ : aucune des deux
      hypotheses n'est satisfaite, donc on ne peut rien deduire par Gauss
      - et en effet $6$ ne divise ni $4$ ni $9$.
    solution: |
      Le theoreme de Gauss dit : si $a\mid bc$ ET $\mathrm{PGCD}(a,b)=1$,
      alors $a\mid c$. Ici $a=6$, et on veut tester $b=4$ ou $b=9$ :
      $$\mathrm{PGCD}(6,4) = 2 \neq 1 \qquad \mathrm{PGCD}(6,9) = 3 \neq 1$$
      L'hypothese de Gauss echoue dans les deux cas : le theoreme ne
      s'applique pas. Et de fait, $6\nmid4$ (car $4<6$) et $6\nmid9$ (car
      $9=6\times1+3$) : le produit $4\times9=36$ est divisible par $6$
      sans qu'aucun des facteurs ne le soit.

  - id: AR-19
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Un entier $c$ est divisible par $4$ et par $6$. Est-il
      necessairement divisible par $24$ ?
    type: mcq
    choices:
      - id: A
        text: "Non : $\\mathrm{PGCD}(4,6)=2 \\neq 1$, donc on ne peut pas conclure (contre-exemple : $12$, divisible par $4$ et $6$ mais pas par $24$)"
        correct: true
      - id: B
        text: "Oui, car $4\\times 6 = 24$"
        correct: false
        feedback: >
          Multiplier les deux diviseurs ne fonctionne que s'ils sont
          premiers entre eux. Ici $\mathrm{PGCD}(4,6)=2\neq1$ : le produit
          $4\times6=24$ compte le facteur $2$ deux fois de trop. Le vrai
          plus petit multiple commun est $\mathrm{PPCM}(4,6)=12$, pas
          $24$.
      - id: C
        text: "Oui : divisible par deux nombres, alors divisible par leur produit"
        correct: false
        feedback: >
          Cette regle est fausse en general : elle n'est valable que si
          les deux nombres sont premiers entre eux. Contre-exemple : $12$
          est divisible par $4$ et par $6$, mais pas par $4\times6=24$.
      - id: D
        text: "Non, car $4$ et $6$ ne sont pas des nombres premiers"
        correct: false
        feedback: >
          La conclusion (Non) est correcte, mais la raison invoquee ne
          l'est pas : ce n'est pas parce que $4$ et $6$ ne sont pas
          premiers, mais parce qu'ils ne sont pas premiers ENTRE EUX
          ($\mathrm{PGCD}(4,6)=2$). Deux nombres non premiers mais
          premiers entre eux (comme $4$ et $9$) donneraient, eux, une
          conclusion valide.
    correct_feedback: >
      Exact. La regle "divisible par $a$ et par $b$ implique divisible
      par $ab$" exige $\mathrm{PGCD}(a,b)=1$. Ici $\mathrm{PGCD}(4,6)=2$,
      donc on ne peut rien conclure : $12$ est un contre-exemple
      (divisible par $4$ et $6$, pas par $24$).
    solution: |
      Si $\mathrm{PGCD}(a,b)=1$, alors "divisible par $a$ et par $b$"
      entraine "divisible par $ab$" (consequence de Gauss). Mais ici :
      $$\mathrm{PGCD}(4,6) = 2 \neq 1$$
      l'hypothese manque, et la conclusion peut etre fausse.
      Contre-exemple : $c=12$ est divisible par $4$ ($12=4\times3$) et
      par $6$ ($12=6\times2$), mais pas par $24$. En realite, "divisible
      par $4$ et $6$" entraine seulement "divisible par
      $\mathrm{PPCM}(4,6)=12$", pas par $24$.

  - id: AR-20
    rung: "R6"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Le nombre $143$ est-il premier ?
    type: mcq
    choices:
      - id: A
        text: "Oui, $143$ est premier"
        correct: false
        feedback: >
          Il ne suffit pas de tester $2, 3, 5, 7$ : $143$ n'est divisible
          par aucun d'eux, mais il faut continuer jusqu'a
          $\sqrt{143}\approx12$. Or $143 = 11\times13$, et $11 \le 12$ :
          le test s'est arrete trop tot.
      - id: B
        text: "Non : $143 = 11 \\times 13$"
        correct: true
      - id: C
        text: "Non, car tout nombre impair superieur a $100$ est compose"
        correct: false
        feedback: >
          Cette regle est fausse : il existe des nombres premiers
          impairs superieurs a $100$ (par exemple $101$, $103$...). La
          bonne conclusion "$143$ n'est pas premier" vient de la
          factorisation $143=11\times13$, pas d'une regle generale sur
          la taille.
      - id: D
        text: "On ne peut pas savoir sans tester tous les entiers jusqu'a $142$"
        correct: false
        feedback: >
          Il suffit de tester les diviseurs jusqu'a
          $\sqrt{143}\approx12$ : si aucun entier de $2$ a $12$ ne divise
          $143$, alors $143$ est premier. Ici $11$ divise $143$, donc il
          n'est pas necessaire (ni utile) d'aller jusqu'a $142$.
    correct_feedback: >
      Exact. $143 = 11\times13$ : $143$ admet un diviseur autre que $1$
      et lui-meme, il n'est donc pas premier.
    solution: |
      Pour tester si $143$ est premier, il suffit d'essayer les
      diviseurs premiers jusqu'a $\sqrt{143} \approx 11{,}96$, donc
      jusqu'a $11$ inclus : $2, 3, 5, 7, 11$. On trouve
      $$143 = 11 \times 13$$
      $143$ admet un diviseur autre que $1$ et $143$ : il n'est pas
      premier.

  - id: AR-21
    rung: "R6"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Sachant que $360 = 2^3\times3^2\times5$ et $84 = 2^2\times3\times7$,
      quel est $\mathrm{PGCD}(360, 84)$ ?
    type: mcq
    choices:
      - id: A
        text: "$2520 = 2^3\\times3^2\\times5\\times7$"
        correct: false
        feedback: >
          C'est le PPCM, pas le PGCD : tu as pris pour chaque facteur
          premier l'exposant le plus GRAND (et garde tous les facteurs,
          meme ceux qui n'apparaissent que dans un seul nombre). Le PGCD,
          lui, ne garde que les facteurs COMMUNS, avec l'exposant le plus
          PETIT.
      - id: B
        text: "$6 = 2\\times3$"
        correct: false
        feedback: >
          Tu as garde chaque facteur premier commun une seule fois
          (exposant $1$), sans prendre le plus PETIT exposant present
          dans les deux decompositions. Pour $2$, le plus petit exposant
          est $\min(3,2)=2$, pas $1$ : il faut $2^2$, pas $2^1$.
      - id: C
        text: "$12 = 2^2 \\times 3$"
        correct: true
      - id: D
        text: "$420 = 2^2\\times3\\times5\\times7$"
        correct: false
        feedback: >
          Tu as garde les bons exposants pour $2$ et $3$, mais aussi $5$
          et $7$, qui n'apparaissent chacun que dans UN SEUL des deux
          nombres. Le PGCD ne retient que les facteurs premiers communs
          aux deux decompositions.
    correct_feedback: >
      Exact. Le PGCD se lit en gardant chaque facteur premier COMMUN,
      avec le plus PETIT exposant : $2^{\min(3,2)} \times 3^{\min(2,1)}
      = 2^2\times3 = 12$. Le facteur $5$ (absent de $84$) et $7$ (absent
      de $360$) ne sont pas retenus.
    solution: |
      A partir des decompositions
      $$360 = 2^3\times3^2\times5 \qquad 84 = 2^2\times3\times7$$
      le PGCD garde les facteurs premiers COMMUNS avec le plus PETIT
      exposant :
      - facteur $2$ : $\min(3,2) = 2$
      - facteur $3$ : $\min(2,1) = 1$
      - facteur $5$ : absent de $84$, non retenu
      - facteur $7$ : absent de $360$, non retenu
      Donc $\mathrm{PGCD}(360,84) = 2^2\times3 = 12$.

  - id: AR-22
    rung: "R6"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Le nombre premier $7$ divise le produit $a\times b$. Que peut-on
      affirmer avec certitude ?
    type: mcq
    choices:
      - id: A
        text: "$7 \\mid a$ et $7 \\mid b$"
        correct: false
        feedback: >
          C'est plus fort que ce que garantit le theoreme : il assure que
          $7$ divise AU MOINS UN des deux facteurs (un "ou"), pas
          forcement les deux. Par exemple $7 \mid 7\times2$ mais
          $7\nmid2$.
      - id: B
        text: "On ne peut rien conclure"
        correct: false
        feedback: >
          C'est justement le cas particulier ou $a$ est PREMIER qui
          permet de conclure sans hypothese supplementaire : si $7$ est
          premier et $7\mid ab$, alors necessairement $7\mid a$ ou
          $7\mid b$ (consequence du theoreme de Gauss, car un nombre
          premier est automatiquement premier avec tout nombre qu'il ne
          divise pas).
      - id: C
        text: "$7 = a$ ou $7 = b$"
        correct: false
        feedback: >
          "Diviser" n'est pas "etre egal a". Par exemple $7 \mid
          14\times3$ (car $14\times3=42=7\times6$) et $7\mid14$, sans que
          $7$ soit egal a $14$ ni a $3$.
      - id: D
        text: "$7 \\mid a$ ou $7 \\mid b$"
        correct: true
    correct_feedback: >
      Exact. C'est le lemme d'Euclide (cas particulier du theoreme de
      Gauss quand $a$ est premier) : si un nombre premier $p$ divise un
      produit $ab$, alors $p$ divise $a$ ou $p$ divise $b$.
    solution: |
      Supposons $7 \nmid a$. Comme $7$ est premier, ses seuls diviseurs
      sont $1$ et $7$ ; si $7\nmid a$, alors $\mathrm{PGCD}(7,a)=1$. Le
      theoreme de Gauss s'applique alors a $7 \mid ab$ avec
      $\mathrm{PGCD}(7,a)=1$, donc $7 \mid b$. On a donc toujours $7\mid
      a$ ou $7 \mid b$ (au moins l'un des deux, pas forcement les deux).

  - id: AR-23
    rung: "R7"
    difficulty_level: 3
    skill_code: maths_arithmetique
    tags: []
    stem: >
      L'equation $15x + 6y = 9$ admet-elle des solutions dans
      $\mathbb{Z}^2$ ?
    type: mcq
    choices:
      - id: A
        text: "Oui : $\\mathrm{PGCD}(15,6)=3$ et $3 \\mid 9$"
        correct: true
      - id: B
        text: "Non, car $15$ et $6$ ne sont pas premiers entre eux"
        correct: false
        feedback: >
          $15$ et $6$ ne sont en effet pas premiers entre eux
          ($\mathrm{PGCD}(15,6)=3$), mais cela n'empeche pas les
          solutions d'exister. Le critere exact est : $ax+by=c$ a des
          solutions si et seulement si $\mathrm{PGCD}(a,b)$ DIVISE $c$.
          Ici $3\mid9$, donc il y a bien des solutions.
      - id: C
        text: "Non, car $9$ n'est un multiple ni de $15$ ni de $6$"
        correct: false
        feedback: >
          Ce n'est pas le bon test : il ne faut pas que $9$ soit un
          multiple de $15$ ou de $6$ individuellement, mais que $9$ soit
          un multiple de leur PGCD. Ici $\mathrm{PGCD}(15,6)=3$, et
          $9=3\times3$ est bien un multiple de $3$ : l'equation a des
          solutions.
      - id: D
        text: "Oui, car $9 > 0$"
        correct: false
        feedback: >
          Le signe ou la positivite de $9$ n'a rien a voir avec
          l'existence de solutions entieres. Le critere est
          arithmetique : $\mathrm{PGCD}(15,6)=3$ doit diviser $9$, ce qui
          est vrai ici, mais pas parce que $9$ est positif.
    correct_feedback: >
      Exact. $ax+by=c$ a des solutions entieres si et seulement si
      $\mathrm{PGCD}(a,b) \mid c$. Ici $\mathrm{PGCD}(15,6)=3$ et
      $3\mid9$ (puisque $9=3\times3$), donc l'equation a une infinite de
      solutions.
    solution: |
      Critere d'existence : $ax+by=c$ a des solutions dans
      $\mathbb{Z}^2$ si et seulement si $\mathrm{PGCD}(a,b) \mid c$.
      $$\mathrm{PGCD}(15,6) = 3$$
      Or $3 \mid 9$ (car $9 = 3\times3$), donc l'equation $15x+6y=9$
      admet bien des solutions entieres (une infinite, obtenues a partir
      d'une solution particuliere).

  - id: AR-24
    rung: "R7"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      L'equation $5x + 3y = 1$ a pour solution particuliere $(2, -3)$.
      Quelle est la forme generale de ses solutions dans $\mathbb{Z}^2$ ?
    type: mcq
    choices:
      - id: A
        text: "$x = 2 + 5t,\\quad y = -3 - 3t$"
        correct: false
        feedback: >
          Tu as interverti les coefficients : dans la formule generale
          $x=x_0+bt$, $y=y_0-at$, c'est le coefficient de $y$ (soit $3$)
          qui accompagne $x$, et celui de $x$ (soit $5$) qui accompagne
          $y$. Ici $x=2+3t$, $y=-3-5t$.
      - id: B
        text: "$x = 2 + 3t,\\quad y = -3 - 5t,\\quad t\\in\\mathbb{Z}$"
        correct: true
      - id: C
        text: "$x = 2 + 3t,\\quad y = -3 + 5t$"
        correct: false
        feedback: >
          Le coefficient de $x$ est correct, mais il y a une erreur de
          signe sur $y$ : pour que $5x+3y$ reste constant quand $x$
          augmente de $3t$, $y$ doit DIMINUER de $5t$ (pas augmenter),
          car $5\times3t = 3\times5t$ doit etre compense par un signe
          oppose.
      - id: D
        text: "$x = 2,\\quad y = -3$ (solution unique)"
        correct: false
        feedback: >
          Une equation $ax+by=c$ avec $\mathrm{PGCD}(a,b)=1$ (ici $=1$) a
          une INFINITE de solutions entieres, pas une seule : $(2,-3)$
          n'est qu'UNE solution particuliere parmi toute une famille
          parametree par $t\in\mathbb{Z}$.
    correct_feedback: >
      Exact. Si $(x_0,y_0)=(2,-3)$ est une solution de $5x+3y=1$, la
      solution generale s'obtient en ajoutant a $x_0$ un multiple de $3$
      (le coefficient de $y$) et en retranchant a $y_0$ le meme multiple
      de $5$ (le coefficient de $x$) : $x=2+3t$, $y=-3-5t$.
    solution: |
      On soustrait la solution particuliere a l'equation generale :
      $$5x+3y = 1 = 5\times2+3\times(-3)$$
      $$5(x-2) + 3(y+3) = 0 \quad\Longrightarrow\quad 5(x-2) = -3(y+3)$$
      Comme $\mathrm{PGCD}(5,3)=1$, le theoreme de Gauss donne
      $5 \mid (y+3)$, donc $y+3 = -5t$ pour un entier $t$, d'ou
      $y=-3-5t$, puis $x-2 = 3t$, soit $x=2+3t$. La solution generale
      est
      $$x = 2+3t, \quad y = -3-5t, \quad t \in \mathbb{Z}$$

  - id: AR-25
    rung: "R8"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      On a etabli $\mathrm{PGCD}(112, 76) = 4$. Que peut-on dire des
      solutions de $112x + 76y = 8$ dans $\mathbb{Z}^2$ ?
    type: mcq
    choices:
      - id: A
        text: "Il y en a exactement une"
        correct: false
        feedback: >
          Des qu'une equation $ax+by=c$ a UNE solution (avec
          $\mathrm{PGCD}(a,b) \mid c$), elle en a une INFINITE : a partir
          d'une solution particuliere $(x_0,y_0)$, on obtient toutes les
          autres par $x=x_0+\frac{b}{d}t$, $y=y_0-\frac{a}{d}t$,
          $t\in\mathbb{Z}$.
      - id: B
        text: "Il n'y en a aucune"
        correct: false
        feedback: >
          Le critere d'existence est $\mathrm{PGCD}(a,b)\mid c$. Ici
          $\mathrm{PGCD}(112,76)=4$ et $4\mid8$ (car $8=4\times2$) :
          l'equation a bien des solutions.
      - id: C
        text: "Il y en a une infinite, car $4 \\mid 8$"
        correct: true
      - id: D
        text: "Il y en a exactement $8$"
        correct: false
        feedback: >
          Le nombre $8$ qui apparait ici est le second membre de
          l'equation, pas un compte de solutions. Des que
          $\mathrm{PGCD}(a,b)$ divise $c$, l'ensemble des solutions
          entieres est infini, pas un nombre fini egal a $c$.
    correct_feedback: >
      Exact. Comme $\mathrm{PGCD}(112,76)=4$ et $4\mid8$, l'equation
      $112x+76y=8$ admet des solutions, et comme pour toute equation de
      ce type, elle en admet une infinite (parametrees par $t\in
      \mathbb{Z}$).
    solution: |
      Critere d'existence : $ax+by=c$ a des solutions dans
      $\mathbb{Z}^2$ si et seulement si $\mathrm{PGCD}(a,b)\mid c$. Ici
      $$\mathrm{PGCD}(112,76) = 4$$
      et $4 \mid 8$ (car $8 = 4\times2$), donc l'equation admet des
      solutions. Comme pour toute equation lineaire diophantienne
      resoluble, l'ensemble des solutions n'est jamais reduit a un
      point : il y en a une infinite, parametrees par $t \in \mathbb{Z}$.

  - id: AR-26
    rung: "R8"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Sachant que $112\times(-2) + 76\times 3 = 4$, quelle est une
      solution particuliere de $112x + 76y = 8$ ?
    type: mcq
    choices:
      - id: A
        text: "$(-2, 3)$"
        correct: false
        feedback: >
          $(-2,3)$ verifie $112x+76y=4$, pas $8$ : c'est la relation de
          depart, non mise a l'echelle. Il faut multiplier toute
          l'identite par $8/4=2$ pour atteindre le second membre voulu.
      - id: B
        text: "$(-2, 6)$"
        correct: false
        feedback: >
          Tu as multiplie seulement $y$ par $2$, en oubliant $x$. Pour
          passer de $112x+76y=4$ a $112x+76y=8$, il faut multiplier LES
          DEUX coordonnees par le meme facteur $2$.
      - id: C
        text: "$(-8, 12)$"
        correct: false
        feedback: >
          Tu as multiplie par $c=8$ au lieu de $c/d = 8/4 = 2$.
          L'identite de depart vaut deja $4$ ; il suffit de la
          multiplier par $2$ (pas par $8$) pour obtenir $8$.
      - id: D
        text: "$(-4, 6)$, obtenue en multipliant l'identite par $k = 8/4 = 2$"
        correct: true
    correct_feedback: >
      Exact. L'identite $112\times(-2)+76\times3=4$ multipliee par
      $k=8/4=2$ donne $112\times(-4)+76\times6=8$ : la solution
      particuliere est $(-4,6)$.
    solution: |
      On part de l'identite connue :
      $$112\times(-2) + 76\times3 = 4$$
      Comme le second membre voulu est $8 = 4\times2$, on multiplie
      toute l'identite par $2$ :
      $$112\times(-4) + 76\times6 = 8$$
      La solution particuliere est donc $(x_0,y_0) = (-4,6)$.

  - id: AR-27
    rung: "R8"
    difficulty_level: 4
    skill_code: maths_arithmetique
    tags: []
    stem: >
      Que peut-on dire des entiers $35$ et $18$ ?
    type: mcq
    choices:
      - id: A
        text: "Aucun des deux n'est un nombre premier, mais ils sont premiers entre eux ($\\mathrm{PGCD}(35,18)=1$)"
        correct: true
      - id: B
        text: "Ils ne sont pas premiers entre eux, puisqu'aucun des deux n'est premier"
        correct: false
        feedback: >
          "Etre premier" (une propriete d'UN nombre) et "etre premiers
          entre eux" (une propriete d'une PAIRE, $\mathrm{PGCD}=1$) sont
          deux notions independantes. Ici $35=5\times7$ et $18=2\times3^2$
          n'ont aucun facteur premier commun : $\mathrm{PGCD}(35,18)=1$,
          ils SONT premiers entre eux, bien que ni $35$ ni $18$ ne soit
          premier.
      - id: C
        text: "$35$ est premier, $18$ ne l'est pas"
        correct: false
        feedback: >
          $35$ n'est pas premier : $35 = 5\times7$, il admet des
          diviseurs autres que $1$ et $35$.
      - id: D
        text: "Ils sont premiers entre eux car ils sont tous les deux impairs"
        correct: false
        feedback: >
          D'abord, $18$ est PAIR, pas impair. Ensuite, meme deux nombres
          impairs ne sont pas automatiquement premiers entre eux (par
          exemple $9$ et $15$, tous deux impairs, ont
          $\mathrm{PGCD}=3$). La parite n'est pas le bon critere.
    correct_feedback: >
      Exact. $35=5\times7$ et $18=2\times3^2$ : ni l'un ni l'autre n'est
      premier, mais ils n'ont aucun facteur premier commun, donc
      $\mathrm{PGCD}(35,18)=1$ : ils sont premiers entre eux.
    solution: |
      Decomposons en facteurs premiers :
      $$35 = 5 \times 7 \qquad 18 = 2 \times 3^2$$
      Ni $35$ (deux facteurs premiers distincts) ni $18$ (facteurs $2$
      et $3$) n'est premier. Mais ces deux decompositions n'ont aucun
      facteur premier commun, donc
      $$\mathrm{PGCD}(35, 18) = 1$$
      $35$ et $18$ sont premiers entre eux, bien qu'aucun des deux ne
      soit premier : les deux notions sont independantes.
