            note: "Continuité de l'exponentielle en 0 : t tend vers 1, et l'expression simplifiée n'a plus de problème."
          - math: '\lim_{x\to 0} \dfrac{e^{2x}-4e^x+3}{e^{2x}-1} = -1'
