            note: "Valeur approchée à la calculatrice : nettement négative."
          - math: '\varphi(0) = e^0+e^0+0 = 1+1 = 2 > 0'
            note: "Évaluation directe : e puissance 0 vaut 1."
          - math: '\varphi(-1) < 0 < \varphi(0)'
            note: "Les images des deux bornes sont de signes contraires."
          - math: '\varphi \ \text{continue sur}\ [-1,0]\ \text{et}\ \varphi(-1)\times\varphi(0)<0 \implies \exists\, c\in\,]-1,0[,\ \varphi(c)=0'
