          $\varphi$ est continue sur $\mathbb{R}$ comme somme de la fonction exponentielle (continue sur $\mathbb{R}$, résultat de référence du chapitre fonction-exponentielle, mobilisé ici comme brique au même titre que les fonctions usuelles listées au chapitre 5) et de la fonction polynôme $x\mapsto 4x$ (continue sur $\mathbb{R}$, boîte à outils du chapitre 5) — une somme de fonctions continues est continue, chapitre 5. On calcule ensuite $\varphi(-1)$ et $\varphi(0)$ : les signes sont opposés, donc le corollaire d'existence du chapitre 6 s'applique directement.
        steps:
