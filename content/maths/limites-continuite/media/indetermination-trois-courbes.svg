<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img"
     aria-label="Trois fonctions, toutes de la forme infini moins infini quand x tend vers plus l’infini : x carré moins x qui monte vers plus l’infini, x moins x carré qui descend vers moins l’infini, et (x+5) moins x qui reste plate à 5 — même forme indéterminée, trois limites différentes.">
  <title>Une seule forme indéterminée, trois limites différentes</title>
  <!--
    indetermination-trois-courbes.svg — STAGED (graphe : axes -> données ->
    lecture, LESSON-EXPERIENCE-SPEC §2.5), R2 : reprend EXACTEMENT les trois
    exemples déjà donnés dans la prose ("Pourquoi ces quatre cas sont vraiment
    indéterminés", lesson.md lignes 151-159) — aucun nombre inventé.

      f1(x) = x² − x   (le terme x² écrase x)        -> +∞
      f2(x) = x − x²   (cette fois c'est −x² qui écrase) -> −∞
      f3(x) = (x+5) − x = 5 EXACTEMENT (identité, pas une limite : la
              fonction est constante à 5 pour tout x)  -> 5

    Repère écran (calculé, pas deviné) :
      px_x(x) = 90 + 90x        [x=0 -> 90 ; x=6 -> 630]
      px_y(y) = 240 − 5,625y    [y=0 -> 240 ; y=+32 -> 60 ; y=−32 -> 420]

    Courbes échantillonnées pas=0,5 de x=0 à x=6 (13 points chacune),
    f1(x)=x²−x et f2(x)=x−x²=−f1(x) exact à chaque point (donc f2 est le
    symétrique de f1 par rapport à la droite y=0, px_y_f2 = 480 − px_y_f1 —
    vérifiable point par point). f3 est une droite horizontale exacte à
    px_y=211,875 (y=5).

    Rôle des couleurs :
      les trois courbes (step-2, données)         : --figure-ink
      les trois lectures "→ +∞ / → −∞ / y=5" (step-3) : --figure-accent
      axes / graduations                           : --figure-ink-soft
  -->

  <!-- Titre -->
  <text x="380" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Une seule forme indéterminée, trois limites différentes
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="32" width="720" height="420" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — axes : le repère et ses graduations, rien de plus
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="80" y1="240" x2="650" y2="240"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="650,240 638,235.5 638,244.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="428" x2="90" y2="45"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,45 85.5,56 94.5,56" fill="var(--figure-ink-soft)"/>
    <text x="656" y="244" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">x</text>
    <text x="96" y="52" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">y</text>
    <text x="78" y="254" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <!-- Graduations x : 1..6 -->
    <g stroke="var(--figure-ink-soft)" stroke-width="1.2">
      <line x1="180" y1="236" x2="180" y2="244"/>
      <line x1="270" y1="236" x2="270" y2="244"/>
      <line x1="360" y1="236" x2="360" y2="244"/>
      <line x1="450" y1="236" x2="450" y2="244"/>
      <line x1="540" y1="236" x2="540" y2="244"/>
      <line x1="630" y1="236" x2="630" y2="244"/>
    </g>
    <g font-size="9.5" text-anchor="middle" fill="var(--figure-ink-soft)">
      <text x="180" y="258">1</text>
      <text x="270" y="258">2</text>
      <text x="360" y="258">3</text>
      <text x="450" y="258">4</text>
      <text x="540" y="258">5</text>
      <text x="630" y="258">6</text>
    </g>

    <!-- Graduations y : −30 / −20 / −10 / 10 / 20 / 30 -->
    <g stroke="var(--figure-ink-soft)" stroke-width="1.2">
      <line x1="86" y1="408.75" x2="94" y2="408.75"/>
      <line x1="86" y1="352.5" x2="94" y2="352.5"/>
      <line x1="86" y1="296.25" x2="94" y2="296.25"/>
      <line x1="86" y1="183.75" x2="94" y2="183.75"/>
      <line x1="86" y1="127.5" x2="94" y2="127.5"/>
      <line x1="86" y1="71.25" x2="94" y2="71.25"/>
    </g>
    <g font-size="9.5" text-anchor="end" fill="var(--figure-ink-soft)">
      <text x="78" y="412.75">−30</text>
      <text x="78" y="356.5">−20</text>
      <text x="78" y="300.25">−10</text>
      <text x="78" y="187.75">10</text>
      <text x="78" y="131.5">20</text>
      <text x="78" y="75.25">30</text>
    </g>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — données : les trois fonctions, chacune étiquetée
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- f1(x) = x² − x — monte -->
    <path d="M90,240 L135,241.41 L180,240 L225,235.78 L270,228.75 L315,218.91 L360,206.25 L405,190.78 L450,172.5 L495,151.41 L540,127.5 L585,100.78 L630,71.25"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="636" y="75" font-size="11" fill="var(--figure-ink)"><tspan
          font-style="italic">x</tspan><tspan dy="-5" font-size="8">2</tspan><tspan
          dy="5"> − </tspan><tspan font-style="italic">x</tspan></text>

    <!-- f2(x) = x − x² — descend -->
    <path d="M90,240 L135,238.59 L180,240 L225,244.22 L270,251.25 L315,261.09 L360,273.75 L405,289.22 L450,307.5 L495,328.59 L540,352.5 L585,379.22 L630,408.75"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="636" y="412" font-size="11" fill="var(--figure-ink)"><tspan
          font-style="italic">x</tspan><tspan> − </tspan><tspan
          font-style="italic">x</tspan><tspan dy="-5" font-size="8">2</tspan><tspan dy="5"></tspan></text>

    <!-- f3(x) = (x+5) − x = 5 — plate -->
    <line x1="90" y1="211.875" x2="630" y2="211.875"
          stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="636" y="208" font-size="11" fill="var(--figure-ink)"><tspan>(</tspan><tspan
          font-style="italic">x</tspan><tspan>+5) − </tspan><tspan font-style="italic">x</tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — lecture : trois limites différentes pour la même forme
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- f1 : → +∞ -->
    <text x="636" y="50" font-size="11.5" font-weight="600" fill="var(--figure-accent)">→ +∞</text>

    <!-- f2 : → −∞ -->
    <text x="636" y="440" font-size="11.5" font-weight="600" fill="var(--figure-accent)">→ −∞</text>

    <!-- f3 : la droite y=5 devient LA lecture -->
    <line x1="80" y1="211.875" x2="650" y2="211.875"
          stroke="var(--figure-accent)" stroke-width="1.8" stroke-dasharray="6,4"/>
    <text x="78" y="208" text-anchor="end" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">y = 5</text>
  </g><!-- /step-3 -->

</svg>
