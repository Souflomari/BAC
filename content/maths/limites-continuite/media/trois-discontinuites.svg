<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img"
     aria-label="Quatre panneaux empilés autour d'un même point a : 1) le cas normal, une courbe continue sans accident ; 2) f(a) n'est pas défini, un trou dans le domaine ; 3) les limites à gauche et à droite de a=1 diffèrent (2 contre 1), un saut, avec un point plein en (1;1) et un cercle vide en (1;2) ; 4) les deux limites latérales valent la même chose L, marquée d'un cercle vide, mais f(a) est un point plein isolé ailleurs — une discontinuité évitable.">
  <title>Trois façons de perdre la continuité en a</title>
  <!--
    trois-discontinuites.svg — STAGED, un panneau par étape (LESSON-EXPERIENCE-
    SPEC §2.5 : "autres figures : staged si ≥3 couches sémantiques ET l'ordre
    est un geste d'enseignement" — ici l'ordre EST le geste : la définition à
    trois conditions du R4 se lit dans son propre ordre, une condition qui
    casse à la fois). R4 de la leçon.

    Empilement VERTICAL (spec autorise "stacked or 2×2" ; stacked choisi ICI
    parce que ce lot ne peut pas toucher web/src — VERTICALLY_STACKED_PANELS
    dans MediaDiagram.tsx est une allowlist d'app-code hors périmètre content-
    only de cette tâche ; un empilement de haut en bas signifie que l'espace
    non révélé reste simplement VIDE en dessous du panneau courant tant qu'on
    n'avance pas, plutôt que d'être rogné par un viewBox cropping — comportement
    par défaut de StagedFigure, pas une régression).

    QUATRE panneaux, MÊME point a aligné verticalement (px_x=337,5 dans les
    quatre), pour que l'œil compare directement "le même endroit, quatre
    comportements" :
      Panneau 1 — référence, GÉNÉRIQUE (aucune formule donnée dans le texte
        pour ce cas — illustration structurelle pure) : courbe lisse
        y(t) = t + 0,3t³ pour t∈[-1,1] (juste une courbe monotone
        illustrative, pas une fonction du programme), point plein (a,f(a)).
      Panneau 2 — MÊME courbe générique, mais coupée juste avant t=0 des
        deux côtés (troncature à t=±0,05) : cercle vide, pas de point plein
        -> Condition 1 du R4 échoue ("f(a) existe").
      Panneau 3 — CONCRET, reprend EXACTEMENT l'exemple du R1/R4
        (f(x)=x+1 si x<1, x² si x≥1, a=1) :
          lim(x→1⁻) f(x) = 1+1 = 2   (cercle vide, jamais atteint)
          f(1) = 1² = 1               (point plein — Condition 2 échoue :
                                        les limites latérales, 2 et 1,
                                        diffèrent)
      Panneau 4 — MÊME courbe générique que 1/2, mais avec un point plein
        ISOLÉ à l'écart du cercle vide -> Condition 3 échoue (les deux
        limites latérales valent L, mais f(a) ≠ L).

    Repère écran, PARTAGÉ par les quatre panneaux (calculé, pas deviné) :
      px_x(t) = 337,5 + 267,5·t     [t=-1 -> 70 ; t=0 (=a) -> 337,5 ; t=1 -> 605]
      troncature du "trou" : t=±0,05 -> px 324,125 / 350,875

      Panneaux 1/2/4 (génériques, courbe y(t) = t + 0,3t³, t∈[-1,1]) :
        échelle verticale : ±36 px pour ±1,3 (l'amplitude de y(t)) autour de
        py_mid du panneau, soit un facteur 36/1,3 = 27,6923 px/unité.
        py_mid(panneau) = plotTop(panneau) + 83, où plotTop = panelTop + 40.

      Panneau 3 (concret, x+1 / x², domaine x∈[0,2], a=1 au centre px=337,5) :
        py(y) = 488 - 19,111·y   [y=0 -> 488 ; y=4,5 -> 402]  (échelle propre
        à ce panneau : y_max=4 atteint par x²(2)=4, marge jusqu'à 4,5)

    Structure verticale (identique aux quatre panneaux) :
      panelTop -> +16 titre (gras) -> +30 sous-titre -> plotTop=+40 ->
      plotBottom=+126 (=ligne de base, "a" marqué) -> +138(label) -> +150 bas
      P1=34  P2=198  P3=362  P4=526   (hauteur 150, écart 14)

    Rôle des couleurs :
      courbes génériques, points "normaux" (panneau 1)     : --figure-ink
      cercles vides, points isolés, les 4 accidents eux-mêmes,
        le repère "a" DANS les panneaux 2/3/4 (LE sujet)   : --figure-accent
      le repère "a" du panneau 1 (rien d'anormal ici),
        lignes de base, chrome                              : --figure-ink-soft
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Trois façons de perdre la continuité en a
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Panneau 1 : le cas normal, continue en a
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <rect x="20" y="34" width="600" height="150" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="32" y="50" font-size="11.5" font-weight="600" fill="var(--figure-ink)">1 — Le cas normal</text>
    <text x="32" y="64" font-size="9.5" fill="var(--figure-ink-soft)">une courbe sans accident en a</text>

    <!-- Ligne de base + repère de a (neutre : rien d'anormal ici) -->
    <line x1="70" y1="160" x2="605" y2="160" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="337.5" y1="155" x2="337.5" y2="165" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="337.5" y="172" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)"><tspan font-style="italic">a</tspan></text>

    <!-- Courbe générique lisse -->
    <path d="M70,153 L136.88,141.28 L203.75,131.89 L270.63,124.05 L337.5,117 L404.38,109.95 L471.25,102.12 L538.13,92.72 L605,81"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="337.5" cy="117" r="3.2" fill="var(--figure-ink)"/>
    <text x="346" y="110" font-size="9.5" fill="var(--figure-ink)">(<tspan font-style="italic">a</tspan> ; <tspan
          font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>))</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — Panneau 2 : condition 1 échoue — un trou
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <rect x="20" y="198" width="600" height="150" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="32" y="214" font-size="11.5" font-weight="600" fill="var(--figure-ink)">2 — Condition 1 échoue</text>
    <text x="32" y="228" font-size="9.5" fill="var(--figure-ink-soft)">f(a) n'est pas défini : un trou dans le domaine</text>

    <!-- Ligne de base + repère de a (accent : a EST le sujet ici) -->
    <line x1="70" y1="324" x2="605" y2="324" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="337.5" y1="319" x2="337.5" y2="329" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="337.5" y="336" text-anchor="middle" font-size="10" fill="var(--figure-accent)"><tspan font-style="italic">a</tspan></text>

    <!-- Même courbe générique, coupée juste avant a des deux côtés -->
    <path d="M70,317 L136.88,305.28 L203.75,295.89 L270.63,288.05 L324.125,282.39"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350.875,279.61 L404.38,273.95 L471.25,266.12 L538.13,256.72 L605,245"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Repère en pointillés vers la ligne de base -->
    <line x1="337.5" y1="285" x2="337.5" y2="324" stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- Le trou : cercle vide, aucun point plein -->
    <circle cx="337.5" cy="281" r="4" fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="346" y="273" font-size="9.5" font-weight="600" fill="var(--figure-accent)">f(a) n'existe pas</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — Panneau 3 : condition 2 échoue — un saut, en a = 1
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <rect x="20" y="362" width="600" height="150" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="32" y="378" font-size="11.5" font-weight="600" fill="var(--figure-ink)">3 — Condition 2 échoue</text>
    <text x="32" y="392" font-size="9.5" fill="var(--figure-ink-soft)">les limites latérales diffèrent : un saut, en a = 1</text>

    <!-- Ligne de base + repère de a (accent) -->
    <line x1="70" y1="488" x2="605" y2="488" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="337.5" y1="483" x2="337.5" y2="493" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="337.5" y="500" text-anchor="middle" font-size="10" fill="var(--figure-accent)"><tspan
          font-style="italic">a</tspan><tspan> = 1</tspan></text>

    <!-- Branche gauche : f(x) = x+1 pour x<1 -->
    <path d="M70,468.89 L123.5,465.07 L177,461.24 L230.5,457.42 L284,453.6 L324.125,450.73"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="482" font-size="9.5" fill="var(--figure-ink)"><tspan
          font-style="italic">x</tspan><tspan> + 1</tspan></text>

    <!-- Branche droite : f(x) = x² pour x≥1 -->
    <path d="M337.5,468.89 L391,460.48 L444.5,450.54 L498,439.08 L551.5,426.08 L605,411.56"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="404" text-anchor="end" font-size="9.5" fill="var(--figure-ink)"><tspan
          font-style="italic">x</tspan><tspan dy="-5" font-size="7">2</tspan><tspan dy="5"></tspan></text>

    <!-- Cercle vide : la limite à gauche, jamais atteinte -->
    <circle cx="337.5" cy="449.78" r="4" fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="345" y="443" font-size="9" fill="var(--figure-accent)"><tspan>lim</tspan><tspan dy="4"
          font-size="6.5">x→1⁻</tspan><tspan dy="-4"> f = 2</tspan></text>

    <!-- Point plein : la valeur réellement atteinte -->
    <circle cx="337.5" cy="468.89" r="3.5" fill="var(--figure-accent)"/>
    <!-- PASSÉE À GAUCHE DU POINT (2026-09-04) : à droite du point plein, la
         branche x² repart en montant depuis ce point exact et rayait
         l'étiquette sur 49 % de sa largeur — la valeur atteinte barrée par la
         courbe qui l'atteint. À gauche, entre la branche x+1 (au-dessus) et
         l'axe (en dessous), la bande est libre. -->
    <text x="330" y="472" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--figure-accent)">f(1) = 1</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — Panneau 4 : condition 3 échoue — discontinuité évitable
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <rect x="20" y="526" width="600" height="150" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="32" y="542" font-size="11.5" font-weight="600" fill="var(--figure-ink)">4 — Condition 3 échoue</text>
    <text x="32" y="556" font-size="9.5" fill="var(--figure-ink-soft)">les limites latérales sont égales, mais ≠ f(a)</text>

    <!-- Ligne de base + repère de a (accent) -->
    <line x1="70" y1="652" x2="605" y2="652" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="337.5" y1="647" x2="337.5" y2="657" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="337.5" y="664" text-anchor="middle" font-size="10" fill="var(--figure-accent)"><tspan font-style="italic">a</tspan></text>

    <!-- Même courbe générique, coupée juste avant a des deux côtés -->
    <path d="M70,645 L136.88,633.28 L203.75,623.89 L270.63,616.05 L324.125,610.39"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350.875,607.61 L404.38,601.95 L471.25,594.12 L538.13,584.72 L605,573"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Les deux limites latérales : le même L, cercle vide -->
    <circle cx="337.5" cy="609" r="4" fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="346" y="605" font-size="10" font-weight="600" fill="var(--figure-accent)"><tspan font-style="italic">L</tspan></text>

    <!-- f(a) : un point plein isolé, à l'écart -->
    <line x1="337.5" y1="613" x2="337.5" y2="630" stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="337.5" cy="634" r="3.5" fill="var(--figure-accent)"/>
    <text x="346" y="638" font-size="9.5" font-weight="600" fill="var(--figure-accent)"><tspan
          font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)</text>
  </g><!-- /step-4 -->

</svg>
