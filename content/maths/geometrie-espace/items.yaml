  # ── R1 · du couple de points au vecteur ─────────────────────────────────────
  - id: GE-34
    rung: "R1"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [vecteur, coordonnees, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
    stem: >
      Dans un repère orthonormé de l'espace, $A(2,-1,3)$ et $B(5,1,-2)$.
      Quelles sont les coordonnées de $\overrightarrow{AB}$ ?
    type: mcq
    choices:
      - id: A
        text: "$(3,\\,2,\\,-5)$"
        correct: true
      - id: B
        text: "$(-3,\\,-2,\\,5)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
        feedback: >
          C'est $\overrightarrow{BA}$, pas $\overrightarrow{AB}$ : le calcul a
          été mené en « départ moins arrivée ». La règle est l'inverse et elle
          se retient par le sens de la flèche : $\overrightarrow{AB}$ va de $A$
          vers $B$, donc chaque coordonnée est celle de l'ARRIVÉE moins celle
          du DÉPART, $x_B-x_A$.
      - id: C
        text: "$(3,\\,2,\\,5)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Les deux premières coordonnées sont justes, la troisième a perdu son
          signe : $z_B-z_A = -2-3 = -5$, et non $-2+3$. Quand les deux
          coordonnées sont de signes contraires, la soustraction les ÉLOIGNE au
          lieu de les rapprocher.
      - id: D
        text: "$(7,\\,0,\\,1)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Ce sont les coordonnées de $A$ et $B$ additionnées. Additionner deux
          POINTS n'a aucun sens géométrique ; ce qu'on cherche est le
          déplacement de l'un à l'autre, donc une différence.
    correct_feedback: >
      $\overrightarrow{AB}\,(x_B-x_A,\; y_B-y_A,\; z_B-z_A) = (5-2,\; 1-(-1),\;
      -2-3) = (3,\,2,\,-5)$.
    solution: |
      **Règle (chapitre 2) :** les coordonnées d'un vecteur défini par deux
      points sont celles de l'arrivée moins celles du départ.
      $$\overrightarrow{AB}\,\big(x_B-x_A,\; y_B-y_A,\; z_B-z_A\big)$$
      $$\overrightarrow{AB}\,\big(5-2,\; 1-(-1),\; -2-3\big) = (3,\,2,\,-5)$$

  # ── R1 · la distance ne se lit pas dans un plan ─────────────────────────────
  - id: GE-35
    rung: "R1"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [distance, coordonnees, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.distance-plane-en-espace
    stem: >
      Dans un repère orthonormé de l'espace, $A(1,2,-1)$ et $B(4,6,3)$.
      Que vaut la distance $AB$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\sqrt{41}$"
        correct: true
      - id: B
        text: "$5$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-plane-en-espace
        feedback: >
          C'est la distance calculée avec deux coordonnées seulement,
          $\sqrt{3^2+4^2}=5$ : la troisième dimension a été oubliée. Dans
          l'espace, la formule comporte TROIS carrés — $5$ serait la longueur
          de l'ombre de $[AB]$ projetée sur le plan $(xOy)$, pas celle du
          segment lui-même.
      - id: C
        text: "$41$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          C'est $AB^2$, pas $AB$. La somme des carrés donne le carré de la
          distance ; il reste à en prendre la racine. Un contrôle rapide : une
          distance dont les écarts valent $3$, $4$ et $4$ ne peut pas valoir
          $41$, elle est nécessairement plus proche de $7$.
      - id: D
        text: "$11$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Ici les écarts ont été additionnés, $3+4+4=11$, au lieu d'être élevés
          au carré. Additionner des écarts revient à mesurer le chemin en
          escalier le long des axes, pas la ligne droite — et la ligne droite
          est toujours plus courte.
    correct_feedback: >
      $AB=\sqrt{(4-1)^2+(6-2)^2+(3-(-1))^2}=\sqrt{9+16+16}=\sqrt{41}$.
    solution: |
      **Formule de la distance dans l'espace (chapitre 2) :**
      $$AB=\sqrt{(x_B-x_A)^2+(y_B-y_A)^2+(z_B-z_A)^2}$$
      $$AB=\sqrt{3^2+4^2+4^2}=\sqrt{9+16+16}=\sqrt{41}$$
      La valeur est irrationnelle, entre $6$ et $7$ — on la laisse sous forme
      exacte.

  # ── R2 · orthogonalité : trois produits, pas un ─────────────────────────────
  - id: GE-36
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_scalaire, orthogonalite, parametre, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
    stem: >
      On donne $\vec{u}(1,-2,3)$ et $\vec{v}(4,2,k)$. Pour quelle valeur de $k$
      les vecteurs $\vec{u}$ et $\vec{v}$ sont-ils orthogonaux ?
    type: mcq
    choices:
      - id: A
        text: "$k=0$"
        correct: true
      - id: B
        text: "$k=-\\dfrac{4}{3}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
        feedback: >
          Cette valeur annule $4+3k$ : le terme $yy'=(-2)\times 2=-4$ a été
          laissé de côté. Le produit scalaire est la somme des TROIS produits
          coordonnée par coordonnée ; en oublier un revient à résoudre une
          autre équation que celle du problème.
      - id: C
        text: "$k=-\\dfrac{8}{3}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Cette valeur annule $4+4+3k$ : le produit $(-2)\times 2$ a été compté
          positif. Un facteur négatif rend le produit négatif — ici $-4$, et la
          somme devient $4-4+3k=3k$.
      - id: D
        text: "Aucune valeur de $k$ ne convient : deux vecteurs de l'espace ne sont orthogonaux que si leur produit vectoriel est nul."
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
        feedback: >
          Les deux produits sont intervertis. Un produit VECTORIEL nul
          caractérise deux vecteurs colinéaires, c'est-à-dire de même
          direction — l'exact contraire de l'orthogonalité. C'est le produit
          SCALAIRE nul qui traduit l'orthogonalité.
    correct_feedback: >
      $\vec{u}\cdot\vec{v}=1\times 4+(-2)\times 2+3\times k=4-4+3k=3k$, et
      $3k=0$ donne $k=0$.
    solution: |
      **Critère (chapitre 3) :** $\vec{u}\perp\vec{v}\iff\vec{u}\cdot\vec{v}=0$.
      $$\vec{u}\cdot\vec{v}=1\times 4+(-2)\times 2+3\times k=4-4+3k=3k$$
      $$3k=0\iff k=0$$
      **Vérification :** avec $k=0$, $\vec{v}(4,2,0)$ et
      $\vec{u}\cdot\vec{v}=4-4+0=0$.

  # ── R3 · les composantes du produit vectoriel, dans l'ordre ─────────────────
  - id: GE-37
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_vectoriel, coordonnees, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.produit-vectoriel-ordre-composantes
    stem: >
      On donne $\vec{u}(1,2,3)$ et $\vec{v}(4,5,6)$. Quelles sont les
      coordonnées de $\vec{u}\wedge\vec{v}$ ?
    type: mcq
    choices:
      - id: A
        text: "$(-3,\\,6,\\,-3)$"
        correct: true
      - id: B
        text: "$(6,\\,-3,\\,-3)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-vectoriel-ordre-composantes
        feedback: >
          Les trois nombres sont les bons, mais deux d'entre eux ont échangé
          leur place. Chaque composante se calcule à partir des DEUX AUTRES
          axes : la première n'utilise que $y$ et $z$, la deuxième que $z$ et
          $x$, la troisième que $x$ et $y$. Vérifie l'ordre avant de conclure.
      - id: C
        text: "$(-3,\\,-6,\\,-3)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          La composante du milieu est calculée dans le mauvais sens :
          $z_ux_v-x_uz_v=3\times 4-1\times 6=6$, et non $1\times 6-3\times 4$.
          C'est la seule des trois où l'ordre s'inverse, et c'est exactement là
          que le signe se perd.
      - id: D
        text: "$32$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
        feedback: >
          C'est le produit scalaire, $4+10+18=32$ — un NOMBRE. Le produit
          vectoriel, lui, est un VECTEUR : sa réponse a trois coordonnées. La
          forme de la réponse suffit ici à repérer que ce n'est pas le bon
          produit.
    correct_feedback: >
      $\vec{u}\wedge\vec{v}=(2\times 6-3\times 5,\; 3\times 4-1\times 6,\;
      1\times 5-2\times 4)=(-3,\,6,\,-3)$.
    solution: |
      **Les trois composantes (chapitre 4)**, chacune bâtie sur les deux axes
      qu'elle ne nomme pas :
      $$\vec{u}\wedge\vec{v}=\big(y_uz_v-z_uy_v,\;\; z_ux_v-x_uz_v,\;\;
      x_uy_v-y_ux_v\big)$$
      $$=\big(2\times 6-3\times 5,\;\; 3\times 4-1\times 6,\;\;
      1\times 5-2\times 4\big)=(-3,\,6,\,-3)$$
      **Vérification :** le résultat doit être orthogonal aux deux vecteurs.
      $\vec{u}\cdot(\vec{u}\wedge\vec{v})=-3+12-9=0$ et
      $\vec{v}\cdot(\vec{u}\wedge\vec{v})=-12+30-18=0$.

  # ── R3 · l'aire d'un triangle est une demi-norme ────────────────────────────
  - id: GE-38
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_vectoriel, aire, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.aire-oubli-demi
    stem: >
      Soit $A$, $B$, $C$ trois points tels que
      $\overrightarrow{AB}\,(1,2,2)$ et $\overrightarrow{AC}\,(2,0,1)$.
      Quelle est l'aire du triangle $ABC$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{\\sqrt{29}}{2}$"
        correct: true
      - id: B
        text: "$\\sqrt{29}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.aire-oubli-demi
        feedback: >
          C'est la norme du produit vectoriel, donc l'aire du PARALLÉLOGRAMME
          construit sur les deux vecteurs. Le triangle en est la moitié : une
          diagonale coupe le parallélogramme en deux triangles superposables.
          Il manque le facteur $\frac{1}{2}$.
      - id: C
        text: "$\\dfrac{29}{2}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          La somme $4+9+16=29$ est le CARRÉ de la norme. La norme d'un vecteur
          est la racine de la somme des carrés de ses coordonnées ; ici on a
          divisé par deux sans avoir pris la racine.
      - id: D
        text: "$2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
        feedback: >
          C'est le produit scalaire
          $\overrightarrow{AB}\cdot\overrightarrow{AC}=2+0+2=4$, divisé par
          deux. Le produit scalaire ne mesure aucune aire : il mesure une
          projection. L'aire passe par le produit VECTORIEL, dont la norme est
          justement une aire.
    correct_feedback: >
      $\overrightarrow{AB}\wedge\overrightarrow{AC}=(2,3,-4)$, de norme
      $\sqrt{4+9+16}=\sqrt{29}$ ; l'aire du triangle en est la moitié,
      $\frac{\sqrt{29}}{2}$.
    solution: |
      **Étape 1 — le produit vectoriel.**
      $$\overrightarrow{AB}\wedge\overrightarrow{AC}=\big(2\times 1-2\times 0,\;
      2\times 2-1\times 1,\; 1\times 0-2\times 2\big)=(2,\,3,\,-4)$$

      **Étape 2 — sa norme, qui est l'aire du parallélogramme.**
      $$\|\overrightarrow{AB}\wedge\overrightarrow{AC}\|=\sqrt{2^2+3^2+(-4)^2}
      =\sqrt{29}$$

      **Étape 3 — le triangle est la moitié du parallélogramme.**
      $$\mathcal{A}(ABC)=\frac{1}{2}\sqrt{29}$$

  # ── R3 · même règle, autre configuration ────────────────────────────────────
  - id: GE-39
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_vectoriel, aire, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.aire-oubli-demi
    stem: >
      Dans un repère orthonormé, $A(1,0,2)$, $B(3,1,2)$ et $C(1,2,5)$.
      Quelle est l'aire du triangle $ABC$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{\\sqrt{61}}{2}$"
        correct: true
      - id: B
        text: "$\\sqrt{61}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.aire-oubli-demi
        feedback: >
          La norme $\sqrt{61}$ est l'aire du parallélogramme bâti sur
          $\overrightarrow{AB}$ et $\overrightarrow{AC}$, pas celle du
          triangle. Le triangle en occupe exactement la moitié — c'est la même
          relation qu'entre un rectangle et le triangle rectangle qu'une
          diagonale y découpe.
      - id: C
        text: "$\\dfrac{61}{2}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          $61$ est la somme des carrés $9+36+16$, donc le carré de la norme. La
          racine a été sautée : on a divisé $\|\vec{w}\|^2$ par deux au lieu de
          $\|\vec{w}\|$.
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
        feedback: >
          C'est la moitié du produit scalaire
          $\overrightarrow{AB}\cdot\overrightarrow{AC}=0+2+0=2$. Le produit
          scalaire est un nombre lié à l'angle et aux longueurs, pas une aire :
          il s'annulerait même si les deux vecteurs étaient perpendiculaires
          et le triangle bien réel.
    correct_feedback: >
      $\overrightarrow{AB}\,(2,1,0)$ et $\overrightarrow{AC}\,(0,2,3)$ donnent
      $\overrightarrow{AB}\wedge\overrightarrow{AC}=(3,-6,4)$, de norme
      $\sqrt{61}$ ; l'aire du triangle vaut $\frac{\sqrt{61}}{2}$.
    solution: |
      **Étape 1 — les deux vecteurs du triangle.**
      $$\overrightarrow{AB}\,(2,\,1,\,0)\qquad
      \overrightarrow{AC}\,(0,\,2,\,3)$$

      **Étape 2 — leur produit vectoriel.**
      $$\overrightarrow{AB}\wedge\overrightarrow{AC}=\big(1\times 3-0\times 2,\;
      0\times 0-2\times 3,\; 2\times 2-1\times 0\big)=(3,\,-6,\,4)$$

      **Étape 3 — norme, puis moitié.**
      $$\sqrt{9+36+16}=\sqrt{61}\qquad
      \mathcal{A}(ABC)=\frac{\sqrt{61}}{2}$$


  # ── R4 · ce qu'un produit mixte nul dit, et ne dit pas ──────────────────────
  - id: GE-40
    rung: "R4"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [produit_mixte, coplanarite, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
    stem: >
      Trois vecteurs non nuls $\vec{u}$, $\vec{v}$, $\vec{w}$ de l'espace ont un
      produit mixte nul : $(\vec{u}\wedge\vec{v})\cdot\vec{w}=0$. Que peut-on en
      conclure ?
    type: mcq
    choices:
      - id: A
        text: "Ils sont coplanaires : représentés à partir d'un même point, ils tiennent tous les trois dans un seul plan."
        correct: true
      - id: B
        text: "Ils sont deux à deux orthogonaux, puisqu'un produit qui s'annule traduit l'orthogonalité."
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
        feedback: >
          C'est le produit SCALAIRE de deux vecteurs qui, en s'annulant,
          traduit leur orthogonalité. Le produit mixte, lui, mesure le volume
          du parallélépipède construit sur les trois vecteurs : ce volume est
          nul quand la « boîte » est aplatie, c'est-à-dire quand les trois
          vecteurs tiennent dans un même plan. Trois vecteurs deux à deux
          orthogonaux donneraient au contraire le volume MAXIMAL.
      - id: C
        text: "Ils sont colinéaires : tous les trois sont portés par une même droite de l'espace."
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          La colinéarité est une condition plus forte que la coplanarité, et
          elle se teste autrement : par $\vec{u}\wedge\vec{v}=\vec{0}$. Trois
          vecteurs colinéaires sont bien coplanaires, mais l'inverse est faux —
          les trois arêtes d'une feuille de papier sont coplanaires sans être
          portées par une même droite.
      - id: D
        text: "Ils ont la même norme : le volume ne s'annule que dans ce cas très particulier."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          Cette propriété est inventée : la norme des vecteurs n'intervient
          nulle part dans l'annulation du produit mixte. Trois vecteurs de
          normes très différentes peuvent parfaitement être coplanaires, et
          trois vecteurs de même norme forment en général un volume non nul.
          Ce qui compte est la DIRECTION, pas la longueur.
    correct_feedback: >
      Le produit mixte donne le volume du parallélépipède bâti sur les trois
      vecteurs. Un volume nul signifie que la boîte est aplatie : les trois
      vecteurs tiennent dans un même plan. C'est le critère de coplanarité.
    solution: |
      **Ce que mesure le produit mixte (chapitre 5) :**
      $$\big|(\vec{u}\wedge\vec{v})\cdot\vec{w}\big| = \mathcal{V}
      \quad\text{(volume du parallélépipède)}$$

      **Lecture du cas nul.** Un parallélépipède de volume nul est écrasé :
      sa troisième dimension a disparu. Les trois vecteurs sont alors dans un
      même plan.
      $$(\vec{u}\wedge\vec{v})\cdot\vec{w}=0 \iff \vec{u},\vec{v},\vec{w}
      \text{ coplanaires}$$

  # ── R4 · le calcul, puis la conclusion ──────────────────────────────────────
  - id: GE-41
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_mixte, coplanarite, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
    stem: >
      Soit $A(1,0,0)$, $B(0,1,0)$, $C(0,0,1)$ et $D(1,1,1)$. Ces quatre points
      sont-ils coplanaires ?
    type: mcq
    choices:
      - id: A
        text: "Non : le produit mixte des trois vecteurs issus de $A$ vaut $2$, donc il n'est pas nul."
        correct: true
      - id: B
        text: "Oui : le produit mixte vaut $2$, et une valeur non nulle signifie que les trois vecteurs engendrent un même plan."
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
        feedback: >
          Le calcul est juste, la lecture est inversée. Un produit mixte non nul
          mesure un volume non nul : la « boîte » n'est pas aplatie, donc les
          vecteurs sortent de tout plan commun. C'est la valeur NULLE qui
          signerait la coplanarité.
      - id: C
        text: "Non : le produit mixte vaut $1$, donc il n'est pas nul."
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
        feedback: >
          La conclusion est bonne mais la valeur est fausse : le produit
          scalaire final n'a été mené qu'en partie. Avec
          $\overrightarrow{AB}\wedge\overrightarrow{AC}=(1,1,1)$ et
          $\overrightarrow{AD}(0,1,1)$, il faut sommer les TROIS produits,
          $0+1+1=2$, et non s'arrêter au premier terme non nul.
      - id: D
        text: "Oui : le produit mixte vaut $0$, donc les quatre points sont dans un même plan."
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Cette valeur vient d'un signe perdu dans le produit vectoriel. La
          deuxième composante de
          $\overrightarrow{AB}\wedge\overrightarrow{AC}$ vaut
          $z_1x_2-x_1z_2 = 0\times(-1)-(-1)\times 1 = +1$ ; comptée $-1$, elle
          fait tomber le produit mixte à zéro et retourne la conclusion.
    correct_feedback: >
      $\overrightarrow{AB}(-1,1,0)$, $\overrightarrow{AC}(-1,0,1)$,
      $\overrightarrow{AD}(0,1,1)$ ;
      $\overrightarrow{AB}\wedge\overrightarrow{AC}=(1,1,1)$ et le produit mixte
      vaut $0+1+1=2\neq 0$ : les quatre points ne sont pas coplanaires.
    solution: |
      **Étape 1 — trois vecteurs issus du même point.**
      $$\overrightarrow{AB}(-1,\,1,\,0)\qquad\overrightarrow{AC}(-1,\,0,\,1)
      \qquad\overrightarrow{AD}(0,\,1,\,1)$$

      **Étape 2 — le produit vectoriel des deux premiers.**
      $$\overrightarrow{AB}\wedge\overrightarrow{AC}=\big(1\times 1-0\times 0,\;
      0\times(-1)-(-1)\times 1,\; (-1)\times 0-1\times(-1)\big)=(1,\,1,\,1)$$

      **Étape 3 — le produit mixte, puis la conclusion.**
      $$(1,1,1)\cdot(0,1,1)=0+1+1=2\neq 0$$
      Le volume n'est pas nul : les quatre points ne sont pas coplanaires.

  # ── R5 · un point est sur la droite pour UN SEUL paramètre ──────────────────
  - id: GE-42
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [droite, representation_parametrique, appartenance, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
    stem: >
      La droite $(D)$ admet la représentation paramétrique
      $x=1+2t$, $y=-1+t$, $z=3-t$ (avec $t\in\mathbb{R}$).
      Le point $P(5,1,2)$ appartient-il à $(D)$ ?
    type: mcq
    choices:
      - id: A
        text: "Non : les deux premières équations imposent $t=2$, la troisième impose $t=1$."
        correct: true
      - id: B
        text: "Oui : chaque coordonnée de $P$ est atteinte pour une certaine valeur de $t$, donc le point est bien sur la droite."
        correct: false
        misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
        feedback: >
          Il faut UNE SEULE valeur de $t$ qui convienne aux trois équations en
          même temps : $t$ est l'instant du déplacement le long de la droite,
          et un point ne peut pas être atteint à trois instants différents.
          Ici $t=2$ donne $z=1$, pas $2$ : le point est à côté de la droite.
      - id: C
        text: "Oui : les coordonnées de $P$ sont proportionnelles au vecteur directeur $(2,1,-1)$."
        correct: false
        misconception: mc.math.maths_geometrie_espace.directeur-vs-point
        feedback: >
          Le vecteur directeur donne la DIRECTION de la droite, pas la position
          de ses points. Un point de $(D)$ s'obtient en partant du point
          $(1,-1,3)$ et en ajoutant un multiple du directeur — la
          proportionnalité au directeur seul ne caractérise que les points
          d'une droite passant par l'origine.
      - id: D
        text: "Non : la première équation donne $t=3$, incompatible avec les deux autres."
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          La conclusion est bonne, la valeur ne l'est pas : $1+2t=5$ donne
          $2t=4$ puis $t=2$, et non $t=3$. Un raisonnement juste appuyé sur un
          calcul faux reste fragile — ici, la vraie incompatibilité est entre
          $t=2$ et $t=1$.
    correct_feedback: >
      $1+2t=5$ donne $t=2$ ; $-1+t=1$ donne $t=2$ ; mais $3-t=2$ donne $t=1$.
      Aucune valeur unique de $t$ ne satisfait les trois équations : $P$
      n'appartient pas à $(D)$.
    solution: |
      **Méthode (chapitre 6) :** on résout chaque équation en $t$, puis on
      vérifie que la MÊME valeur convient aux trois.
      $$1+2t=5\;\Rightarrow\;t=2\qquad -1+t=1\;\Rightarrow\;t=2\qquad
      3-t=2\;\Rightarrow\;t=1$$
      Les deux premières s'accordent, la troisième non : $P\notin(D)$.

      **Contrôle direct :** pour $t=2$, la droite passe par $(5,\,1,\,1)$ — le
      point $P$ en diffère par sa cote.

  # ── R5 · même exigence, l'autre sens ────────────────────────────────────────
  - id: GE-43
    rung: "R5"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [droite, representation_parametrique, appartenance, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
    stem: >
      La droite $(\Delta)$ a pour représentation paramétrique
      $x=2-t$, $y=3+2t$, $z=t$. Parmi ces points, lequel appartient à
      $(\Delta)$ ?
    type: mcq
    choices:
      - id: A
        text: "$M(0,\\,7,\\,2)$"
        correct: true
      - id: B
        text: "$N(0,\\,5,\\,2)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
        feedback: >
          Chacune des coordonnées de $N$ est bien atteinte, mais pas au même
          instant : $x=0$ demande $t=2$, $y=5$ demande $t=1$, $z=2$ demande
          $t=2$. Il faut une valeur de $t$ commune aux TROIS équations. Avec
          $t=2$, la droite passe par $(0,7,2)$.
      - id: C
        text: "$Q(-1,\\,2,\\,1)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          Ces coordonnées sont celles du vecteur directeur $(-1,2,1)$ lui-même.
          Un vecteur directeur indique la direction : ses coordonnées ne
          désignent un point de la droite que si celle-ci passe par l'origine,
          ce qui n'est pas le cas ici ($(\Delta)$ passe par $(2,3,0)$).
      - id: D
        text: "$R(4,\\,1,\\,-2)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Ce point s'obtient avec $t=-2$ sur $x$ et $z$, mais $y=3+2\times(-2)
          =-1$, et non $1$. Le coefficient $2$ du paramètre dans $y$ double
          aussi le signe négatif : c'est là que le calcul a dérapé.
    correct_feedback: >
      Pour $t=2$ : $x=2-2=0$, $y=3+4=7$, $z=2$. La même valeur de $t$ satisfait
      les trois équations, donc $M(0,7,2)\in(\Delta)$.
    solution: |
      **Méthode.** On isole $t$ dans l'équation la plus simple, puis on vérifie
      les deux autres avec cette valeur.
      $$z=t \;\Rightarrow\; t=2 \quad\text{(pour un point de cote 2)}$$
      $$x=2-2=0 \qquad y=3+2\times 2=7$$
      Le point $(0,\,7,\,2)$ est donc bien sur $(\Delta)$, atteint à
      l'instant $t=2$.

  # ── R5 · la droite passant par deux points ──────────────────────────────────
  - id: GE-44
    rung: "R5"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [droite, representation_parametrique, vecteur_directeur, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
    stem: >
      Quelle représentation paramétrique décrit la droite $(AB)$, avec
      $A(2,1,0)$ et $B(5,3,-2)$ ?
    type: mcq
    choices:
      - id: A
        text: "$x=2+3t,\\; y=1+2t,\\; z=-2t$"
        correct: true
      - id: B
        text: "$x=2-3t,\\; y=1-2t,\\; z=2t$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
        feedback: >
          Le vecteur directeur retenu est $\overrightarrow{BA}$ et non
          $\overrightarrow{AB}$ : il a été calculé en « départ moins arrivée ».
          La droite obtenue est en fait la même — un directeur opposé décrit la
          même direction — mais le calcul qui y mène est faux, et il donnera un
          résultat erroné dès qu'un sens ou un point précis sera demandé.
      - id: C
        text: "$x=3+2t,\\; y=2+t,\\; z=-2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.directeur-vs-point
        feedback: >
          Le point de départ et le vecteur directeur ont échangé leurs rôles :
          $(3,2,-2)$ est le vecteur $\overrightarrow{AB}$, pas un point de la
          droite. Une représentation paramétrique s'écrit « un point $+$ $t\,
          \times$ un directeur » ; intervertir les deux donne une droite qui ne
          passe ni par $A$ ni par $B$.
      - id: D
        text: "$x=2+3t,\\; y=1+2t,\\; z=2t$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          La troisième coordonnée du directeur a perdu son signe :
          $z_B-z_A=-2-0=-2$, donc $z=0+(-2)t=-2t$. Le contrôle est immédiat —
          pour $t=1$ cette réponse donne $z=2$, alors que $B$ a pour cote $-2$.
    correct_feedback: >
      $\overrightarrow{AB}(3,2,-2)$ sert de vecteur directeur et $A(2,1,0)$ de
      point de départ : $x=2+3t$, $y=1+2t$, $z=0-2t$.
    solution: |
      **Étape 1 — le vecteur directeur, arrivée moins départ.**
      $$\overrightarrow{AB}\,(5-2,\; 3-1,\; -2-0)=(3,\,2,\,-2)$$

      **Étape 2 — la représentation, un point plus $t$ fois le directeur.**
      $$x=2+3t\qquad y=1+2t\qquad z=0-2t$$

      **Vérification :** $t=0$ redonne $A(2,1,0)$ et $t=1$ redonne
      $B(5,3,-2)$.

  # ── R6 · le vecteur normal n'emporte pas la constante ───────────────────────
  - id: GE-45
    rung: "R6"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [plan, vecteur_normal, equation_cartesienne, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.normal-inclut-constante
    stem: >
      Le plan $(P)$ a pour équation cartésienne $2x-3y+z-5=0$. Quel vecteur
      est normal à $(P)$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{n}(2,\\,-3,\\,1)$"
        correct: true
      - id: B
        text: "$\\vec{n}(2,\\,-3,\\,1,\\,-5)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-inclut-constante
        feedback: >
          La constante a été emportée avec les coefficients. Un vecteur de
          l'espace a TROIS coordonnées, jamais quatre : la constante $-5$ ne
          fait pas partie de la direction normale, elle fixe la POSITION du
          plan. Changer $-5$ déplace le plan parallèlement à lui-même, sans
          toucher à son vecteur normal.
      - id: C
        text: "$\\vec{n}(2,\\,3,\\,1)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Le coefficient de $y$ vaut $-3$ dans l'équation, pas $+3$. Le signe
          fait partie du coefficient : il oriente la normale, et l'oublier
          donne une direction différente.
      - id: D
        text: "$\\vec{n}(2,\\,-3,\\,-5)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.plan-constante-mal-determinee
        feedback: >
          La constante $-5$ a pris la place du coefficient de $z$, qui vaut $1$
          (le $z$ écrit sans coefficient visible). Repère toujours les quatre
          nombres d'une équation de plan dans l'ordre $ax+by+cz+d=0$ : les
          trois premiers font la normale, le quatrième reste à part.
    correct_feedback: >
      Dans $ax+by+cz+d=0$, le vecteur $\vec{n}(a,b,c)$ est normal au plan. Ici
      $a=2$, $b=-3$, $c=1$ : $\vec{n}(2,-3,1)$.
    solution: |
      **Lecture directe (chapitre 7).** L'équation cartésienne d'un plan
      s'écrit
      $$ax+by+cz+d=0,$$
      et le triplet des coefficients des variables donne un vecteur normal :
      $$\vec{n}\,(a,\,b,\,c)=\vec{n}\,(2,\,-3,\,1).$$
      La constante $d=-5$ n'entre pas dans $\vec{n}$ : elle situe le plan
      parmi tous ceux qui ont cette même normale.

  # ── R6 · normale et point : ne pas les intervertir ─────────────────────────
  - id: GE-46
    rung: "R6"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [plan, vecteur_normal, equation_cartesienne, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.plan-constante-mal-determinee
    stem: >
      Le plan $(Q)$ a pour équation $4x+y-2z+8=0$. Quel couple
      « vecteur normal, point de $(Q)$ » est correct ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{n}(4,\\,1,\\,-2)$ et $B(0,\\,0,\\,4)$"
        correct: true
      - id: B
        text: "$\\vec{n}(4,\\,1,\\,-2,\\,8)$ et $B(0,\\,0,\\,4)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-inclut-constante
        feedback: >
          Le point est bon, la normale non : elle a récupéré la constante $8$.
          Un vecteur normal n'a que trois coordonnées, celles des coefficients
          de $x$, $y$ et $z$. La constante, elle, ne sert qu'à savoir LEQUEL
          des plans de cette direction on considère.
      - id: C
        text: "$\\vec{n}(4,\\,1,\\,-2)$ et $B(0,\\,0,\\,-4)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.plan-constante-mal-determinee
        feedback: >
          La normale est bonne, le point ne l'est pas : la constante a été
          reportée sans changer de côté. En $x=y=0$, l'équation devient
          $-2z+8=0$, donc $z=4$. Le test est immédiat — avec $z=-4$ on
          obtiendrait $8+8=16\neq 0$.
      - id: D
        text: "$\\vec{n}(0,\\,0,\\,4)$ et $B(4,\\,1,\\,-2)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.directeur-vs-point
        feedback: >
          Les deux rôles sont intervertis. $(4,1,-2)$ est la DIRECTION normale,
          lue sur les coefficients ; $(0,0,4)$ est un POINT du plan, obtenu en
          résolvant l'équation. Le contrôle : $(4,1,-2)$ vérifie-t-il
          l'équation ? $16+1+4+8=29\neq 0$ — ce n'est donc pas un point de
          $(Q)$.
    correct_feedback: >
      Les coefficients donnent $\vec{n}(4,1,-2)$ ; en posant $x=y=0$,
      $-2z+8=0$ donne $z=4$, donc $B(0,0,4)$ appartient à $(Q)$.
    solution: |
      **La normale se lit, le point se calcule.**
      $$4x+y-2z+8=0 \;\Longrightarrow\; \vec{n}\,(4,\,1,\,-2)$$

      **Un point du plan** s'obtient en fixant deux coordonnées et en résolvant
      pour la troisième. Avec $x=y=0$ :
      $$-2z+8=0 \iff z=4 \;\Longrightarrow\; B(0,\,0,\,4)$$

      **Vérification :** $4\times 0+0-2\times 4+8=0$. ✔

  # ── R6 · la normale d'un plan défini par trois points ──────────────────────
  - id: GE-47
    rung: "R6"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [plan, vecteur_normal, produit_vectoriel, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.produit-vectoriel-ordre-composantes
    stem: >
      Soit $A(1,0,0)$, $B(0,2,0)$ et $C(0,0,3)$. Quel vecteur est normal au
      plan $(ABC)$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{n}(6,\\,3,\\,2)$"
        correct: true
      - id: B
        text: "$\\vec{n}(3,\\,6,\\,2)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-vectoriel-ordre-composantes
        feedback: >
          Les trois nombres sont exacts mais les deux premiers ont échangé leur
          place. La première composante se calcule sur les axes $y$ et $z$, la
          deuxième sur $z$ et $x$, la troisième sur $x$ et $y$ : chaque
          composante ignore l'axe qu'elle occupe.
      - id: C
        text: "$\\vec{n}(6,\\,-3,\\,2)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          La composante du milieu est celle où l'ordre des facteurs s'inverse :
          $z_1x_2-x_1z_2=0\times(-1)-(-1)\times 3=3$, donc $+3$. C'est la seule
          des trois à changer de sens, et c'est là que le signe se perd le plus
          souvent.
      - id: D
        text: "$1$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
        feedback: >
          C'est $\overrightarrow{AB}\cdot\overrightarrow{AC}=1+0+0=1$, un
          nombre. Une normale est un VECTEUR : la réponse attendue a trois
          coordonnées. Le produit scalaire mesure une projection, il ne fournit
          jamais de direction.
    correct_feedback: >
      $\overrightarrow{AB}(-1,2,0)$ et $\overrightarrow{AC}(-1,0,3)$ donnent
      $\overrightarrow{AB}\wedge\overrightarrow{AC}=(6,3,2)$, orthogonal aux
      deux, donc normal au plan $(ABC)$.
    solution: |
      **Étape 1 — deux vecteurs du plan.**
      $$\overrightarrow{AB}\,(-1,\,2,\,0)\qquad\overrightarrow{AC}\,(-1,\,0,\,3)$$

      **Étape 2 — leur produit vectoriel est normal au plan.**
      $$\overrightarrow{AB}\wedge\overrightarrow{AC}=\big(2\times 3-0\times 0,\;
      0\times(-1)-(-1)\times 3,\; (-1)\times 0-2\times(-1)\big)=(6,\,3,\,2)$$

      **Vérification :** $(6,3,2)\cdot(-1,2,0)=-6+6+0=0$ et
      $(6,3,2)\cdot(-1,0,3)=-6+0+6=0$. Le vecteur est bien orthogonal aux deux
      directions du plan.


  # ── R7 · non parallèles n'oblige pas à se couper ───────────────────────────
  - id: GE-48
    rung: "R7"
    difficulty_level: 4
    skill_code: maths_geometrie_espace
    tags: [positions_relatives, droites_gauches, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
    stem: >
      $(D_1)$ passe par $A(1,0,2)$ et a pour directeur $\vec{u}(1,2,-1)$ ;
      $(D_2)$ passe par $B(0,1,1)$ et a pour directeur $\vec{v}(2,-1,3)$.
      Quelle est leur position relative ?
    type: mcq
    choices:
      - id: A
        text: "Elles ne sont ni parallèles ni sécantes : ce sont deux droites non coplanaires."
        correct: true
      - id: B
        text: "Elles sont sécantes, puisque leurs directions ne sont pas colinéaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
        feedback: >
          C'est le réflexe du plan, transposé à l'espace. Dans un plan, deux
          droites non parallèles se coupent ; dans l'espace, elles peuvent
          passer l'une au-dessus de l'autre sans jamais se rencontrer. Il faut
          RÉSOUDRE le système : ici les deux premières équations donnent
          $t=\frac{1}{5}$ et $s=\frac{3}{5}$, valeurs qui ne vérifient pas la
          troisième.
      - id: C
        text: "Elles sont parallèles, car leurs vecteurs directeurs ne sont pas colinéaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.position-critere-inverse
        feedback: >
          Le critère est retourné : deux droites sont parallèles quand leurs
          directeurs SONT colinéaires. Ici $\vec{u}$ et $\vec{v}$ ne le sont
          pas ($1\times(-1)\neq 2\times 2$), ce qui exclut justement le
          parallélisme.
      - id: D
        text: "Elles sont parallèles : elles n'ont aucun point commun, et c'est la définition du parallélisme."
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          « Sans point commun » caractérise le parallélisme dans le PLAN, pas
          dans l'espace. Deux droites gauches n'ont, elles non plus, aucun
          point commun — et pourtant leurs directions diffèrent. Le
          parallélisme se teste sur les directeurs, jamais sur l'absence
          d'intersection.
    correct_feedback: >
      Les directeurs ne sont pas colinéaires, donc pas de parallélisme ; et le
      système d'intersection est incompatible ($t=\frac15$, $s=\frac35$ ne
      vérifient pas la troisième équation). Restent les droites non
      coplanaires.
    solution: |
      **Étape 1 — parallèles ?** $\vec{u}(1,2,-1)$ et $\vec{v}(2,-1,3)$ :
      $$1\times(-1)-2\times 2=-5\neq 0$$
      Les directeurs ne sont pas colinéaires : les droites ne sont pas
      parallèles.

      **Étape 2 — sécantes ?** On cherche $t$ et $s$ avec
      $$1+t=2s\qquad 2t=1-s\qquad 2-t=1+3s$$
      Les deux premières donnent $s=\frac{3}{5}$ et $t=\frac{1}{5}$. Report
      dans la troisième : $2-\frac15=\frac95$ d'un côté, $1+\frac95=\frac{14}{5}$
      de l'autre. Le système est incompatible.

      **Conclusion.** Ni parallèles, ni sécantes : les droites sont non
      coplanaires.

  # ── R7 · normales colinéaires : parallèles OU confondus ────────────────────
  - id: GE-49
    rung: "R7"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [positions_relatives, plans_paralleles, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.paralleles-vs-confondus
    stem: >
      Soit $(P)\colon 2x-y+3z-4=0$ et $(Q)\colon -4x+2y-6z+8=0$. Quelle est la
      position relative de ces deux plans ?
    type: mcq
    choices:
      - id: A
        text: "Ils sont confondus : la seconde équation est la première multipliée par $-2$."
        correct: true
      - id: B
        text: "Ils sont strictement parallèles : leurs normales sont colinéaires, donc ils ne se rencontrent pas."
        correct: false
        misconception: mc.math.maths_geometrie_espace.paralleles-vs-confondus
        feedback: >
          Des normales colinéaires laissent DEUX cas ouverts, et il faut les
          départager : plans strictement parallèles, ou plans confondus. Le test
          porte sur la constante. Ici tous les coefficients ET la constante sont
          dans le même rapport $-2$ : c'est le même plan, écrit deux fois.
      - id: C
        text: "Ils sont sécants suivant une droite, car deux plans distincts de l'espace se coupent."
        correct: false
        misconception: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
        feedback: >
          Deux plans distincts peuvent parfaitement ne jamais se rencontrer :
          ce sont les plans strictement parallèles, comme le sol et le plafond
          d'une pièce. L'intuition « tout finit par se couper » vient du plan,
          où deux droites non parallèles se coupent toujours ; elle ne se
          transpose pas.
      - id: D
        text: "Ils sont sécants : des normales colinéaires signifient que les plans se coupent à angle droit."
        correct: false
        misconception: mc.math.maths_geometrie_espace.position-critere-inverse
        feedback: >
          Le critère est inversé sur les deux points. Des normales COLINÉAIRES
          donnent des plans parallèles ou confondus ; ce sont des normales
          ORTHOGONALES qui donnent deux plans perpendiculaires. Retiens le
          parallèle : la normale porte la direction du plan comme un mât porte
          celle du sol.
    correct_feedback: >
      $-2\times(2x-y+3z-4) = -4x+2y-6z+8$ : les deux équations sont
      proportionnelles, constante comprise. Les plans sont donc confondus.
    solution: |
      **Étape 1 — les normales.** $\vec{n}_P(2,-1,3)$ et $\vec{n}_Q(-4,2,-6)$
      avec $\vec{n}_Q=-2\,\vec{n}_P$ : elles sont colinéaires, donc les plans
      sont parallèles ou confondus.

      **Étape 2 — départager par la constante.** Le rapport des coefficients
      vaut $-2$ ; celui des constantes vaut $\frac{8}{-4}=-2$ également.
      $$-2\times(2x-y+3z-4)=-4x+2y-6z+8$$
      Les deux équations décrivent le même ensemble de points : les plans sont
      **confondus**.

  # ── R7 · orthogonales sans être perpendiculaires ───────────────────────────
  - id: GE-50
    rung: "R7"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [orthogonalite, vocabulaire, positions_relatives, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
    stem: >
      Deux droites de l'espace ont des vecteurs directeurs dont le produit
      scalaire est nul, mais elles n'ont aucun point commun. Comment les
      qualifie-t-on exactement ?
    type: mcq
    choices:
      - id: A
        text: "Orthogonales, mais pas perpendiculaires : la perpendicularité exige en plus qu'elles se coupent."
        correct: true
      - id: B
        text: "Perpendiculaires : des directions à angle droit suffisent à employer ce mot."
        correct: false
        misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
        feedback: >
          Dans l'espace, les deux mots ne sont pas synonymes. ORTHOGONALES ne
          parle que des directions ; PERPENDICULAIRES ajoute une condition de
          position — les droites doivent en plus être sécantes. Deux arêtes
          opposées d'une salle de classe illustrent le premier cas sans jamais
          se rencontrer.
      - id: C
        text: "On ne peut pas trancher sans un dessin en perspective montrant si l'angle est droit."
        correct: false
        misconception: mc.math.maths_geometrie_espace.perspective-fiable
        feedback: >
          Un dessin en perspective déforme précisément les angles : deux droites
          qui s'y croisent à angle droit peuvent ne pas être orthogonales, et
          l'inverse arrive tout autant. Le produit scalaire nul, lui, est un
          fait de calcul — il tranche sans figure.
      - id: D
        text: "Sécantes à l'infini, où l'angle droit se retrouve, donc perpendiculaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          Cette « intersection à l'infini » n'existe pas dans la géométrie du
          programme : deux droites de l'espace ont un point commun, ou n'en ont
          pas. Ici l'énoncé dit qu'elles n'en ont aucun, et cela suffit à
          exclure la perpendicularité.
    correct_feedback: >
      Produit scalaire nul $\Rightarrow$ directions orthogonales. Sans point
      commun, on s'arrête là : les droites sont orthogonales, non
      perpendiculaires.
    solution: |
      **Deux mots, deux exigences (chapitre 3) :**

      - **Orthogonales** — condition sur les DIRECTIONS seules :
        $\vec{u}\cdot\vec{v}=0$.
      - **Perpendiculaires** — la même condition, PLUS l'existence d'un point
        commun.

      L'énoncé fournit la première et nie la seconde : les droites sont
      orthogonales sans être perpendiculaires. Toute paire de droites
      perpendiculaires est orthogonale ; la réciproque est fausse.

  # ── R7 · le même vocabulaire, sur des coordonnées ──────────────────────────
  - id: GE-51
    rung: "R7"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [orthogonalite, positions_relatives, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
    stem: >
      $(D)$ passe par l'origine et a pour directeur $\vec{u}(1,0,0)$ ;
      $(D')$ passe par $C(0,0,5)$ et a pour directeur $\vec{v}(0,1,0)$.
      Que peut-on dire de ces deux droites ?
    type: mcq
    choices:
      - id: A
        text: "Elles sont orthogonales et non coplanaires : aucun point ne leur est commun."
        correct: true
      - id: B
        text: "Elles sont perpendiculaires, car leurs directions font entre elles un angle droit."
        correct: false
        misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
        feedback: >
          L'angle droit entre les directions donne l'orthogonalité, pas la
          perpendicularité. Pour cette dernière il faut aussi un point commun :
          or $(D)$ est dans le plan de cote $0$ et $(D')$ dans celui de cote
          $5$. Elles ne se rencontrent nulle part.
      - id: C
        text: "Elles sont parallèles, faute de point commun."
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          L'absence de point commun ne suffit pas dans l'espace : les droites
          non coplanaires en sont dépourvues elles aussi. Le parallélisme se
          teste sur les directeurs, et ici $\vec{u}(1,0,0)$ et $\vec{v}(0,1,0)$
          ne sont pas colinéaires — ils sont même orthogonaux.
      - id: D
        text: "Elles se coupent au point de cote $5$, puisque deux directions différentes finissent toujours par se croiser."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          L'affirmation « deux directions différentes finissent par se croiser »
          est vraie dans un plan, fausse dans l'espace, et elle est ici
          contredite par les coordonnées : tout point de $(D)$ a une cote nulle,
          tout point de $(D')$ une cote égale à $5$.
    correct_feedback: >
      $\vec{u}\cdot\vec{v}=0$ : les directions sont orthogonales. Mais les
      points de $(D)$ ont pour cote $0$ et ceux de $(D')$ pour cote $5$ : aucun
      point commun, donc deux droites orthogonales et non coplanaires.
    solution: |
      **Étape 1 — les directions.**
      $$\vec{u}\cdot\vec{v}=1\times 0+0\times 1+0\times 0=0$$
      Les droites sont orthogonales.

      **Étape 2 — un point commun ?** Un point de $(D)$ s'écrit $(t,0,0)$, un
      point de $(D')$ s'écrit $(0,s,5)$. L'égalité des cotes exigerait $0=5$ :
      impossible.

      **Conclusion.** Orthogonales, sans point commun : elles ne sont pas
      perpendiculaires, et elles ne sont pas coplanaires.

  # ── R7 · parallèles STRICTEMENT, cette fois ────────────────────────────────
  - id: GE-52
    rung: "R7"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [positions_relatives, plans_paralleles, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.paralleles-vs-confondus
    stem: >
      Soit $(P)\colon x+2y-z+1=0$ et $(R)\colon 2x+4y-2z+7=0$. Quelle est leur
      position relative ?
    type: mcq
    choices:
      - id: A
        text: "Strictement parallèles : les normales sont colinéaires, mais les constantes ne suivent pas le même rapport."
        correct: true
      - id: B
        text: "Confondus : leurs normales sont colinéaires, donc les deux équations décrivent le même plan."
        correct: false
        misconception: mc.math.maths_geometrie_espace.paralleles-vs-confondus
        feedback: >
          Des normales colinéaires ne suffisent pas à conclure : elles disent
          seulement que les plans ont la même direction. Il faut vérifier la
          constante. En doublant $(P)$ on obtient $2x+4y-2z+2=0$, et $2\neq 7$ :
          les plans sont décalés l'un par rapport à l'autre.
      - id: C
        text: "Sécants suivant une droite : deux équations différentes décrivent forcément deux plans qui se coupent."
        correct: false
        misconception: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
        feedback: >
          Deux équations différentes peuvent décrire deux plans qui ne se
          rencontrent jamais — c'est exactement le cas ici. L'idée que « ce qui
          diffère finit par se couper » vient de la géométrie plane ; dans
          l'espace, le parallélisme strict est une position à part entière.
      - id: D
        text: "Sécants : des coefficients proportionnels indiquent que les plans se coupent à angle droit."
        correct: false
        misconception: mc.math.maths_geometrie_espace.position-critere-inverse
        feedback: >
          Le critère est retourné. Des coefficients proportionnels signifient
          des normales colinéaires, donc des plans PARALLÈLES. Ce sont des
          normales orthogonales — produit scalaire nul — qui donneraient deux
          plans perpendiculaires.
    correct_feedback: >
      $\vec{n}_R=2\,\vec{n}_P$, donc même direction ; mais $2\times 1=2\neq 7$ :
      la constante ne suit pas. Les plans sont strictement parallèles.
    solution: |
      **Étape 1 — les normales.** $\vec{n}_P(1,2,-1)$ et $\vec{n}_R(2,4,-2)=
      2\,\vec{n}_P$ : colinéaires. Deux cas restent possibles.

      **Étape 2 — la constante départage.** On multiplie $(P)$ par $2$ :
      $$2x+4y-2z+2=0$$
      à comparer à $2x+4y-2z+7=0$. Les deux ne diffèrent que par la constante :
      aucun point ne peut vérifier les deux à la fois.

      **Conclusion.** Plans **strictement parallèles**.

  # ── R8 · la distance d'un point à un plan, en entier ───────────────────────
  - id: GE-53
    rung: "R8"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [distance, plan, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.distance-oubli-division
    stem: >
      Quelle est la distance du point $A(1,2,3)$ au plan
      $(P)\colon 2x-y+2z-3=0$ ?
    type: mcq
    choices:
      - id: A
        text: "$1$"
        correct: true
      - id: B
        text: "$3$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-oubli-division
        feedback: >
          C'est le numérateur $|2-2+6-3|=3$, gardé tel quel. La formule est une
          FRACTION : il reste à diviser par la norme du vecteur normal,
          $\sqrt{4+1+4}=3$. Sans cette division, le résultat dépendrait de
          l'échelle de l'équation — multiplier le plan par $10$ multiplierait la
          « distance » par $10$, ce qui n'a aucun sens.
      - id: C
        text: "$2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-numerateur-mal-forme
        feedback: >
          Le numérateur a été formé sans la constante : $|2-2+6|=6$, puis
          $6/3=2$. Or c'est l'équation ENTIÈRE qu'on évalue au point, constante
          comprise — c'est elle qui mesure de combien le point rate le plan.
          Ici $2\times 1-2+2\times 3-3=3$.
      - id: D
        text: "$\\dfrac{3\\sqrt{5}}{5}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-plane-en-espace
        feedback: >
          C'est la formule de la distance d'un point à une DROITE du plan,
          appliquée avec deux coordonnées : $|2-2-3|/\sqrt{4+1}$. Dans l'espace,
          la troisième coordonnée entre au numérateur comme au dénominateur —
          ici $2z$ et le $2^2$ de la norme.
    correct_feedback: >
      $d(A,P)=\dfrac{|2\times 1-2+2\times 3-3|}{\sqrt{2^2+(-1)^2+2^2}}
      =\dfrac{|3|}{3}=1$.
    solution: |
      **Formule (chapitre 9).** Pour $(P)\colon ax+by+cz+d=0$ et
      $A(x_A,y_A,z_A)$ :
      $$d(A,P)=\frac{|ax_A+by_A+cz_A+d|}{\sqrt{a^2+b^2+c^2}}$$

      **Numérateur :** $|2\times 1+(-1)\times 2+2\times 3-3|=|2-2+6-3|=3$.

      **Dénominateur :** $\sqrt{2^2+(-1)^2+2^2}=\sqrt{9}=3$.

      $$d(A,P)=\frac{3}{3}=1$$

  # ── R9 · lire centre et rayon sur une forme développée ─────────────────────
  - id: GE-54
    rung: "R9"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [sphere, equation_cartesienne, forme_canonique, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.sphere-centre-rayon-mal-lu
    stem: >
      L'ensemble $(S)$ a pour équation
      $x^2+y^2+z^2-4x+6y-2z+5=0$. Quels sont son centre et son rayon ?
    type: mcq
    choices:
      - id: A
        text: "Centre $\\Omega(2,\\,-3,\\,1)$, rayon $3$"
        correct: true
      - id: B
        text: "Centre $\\Omega(-2,\\,3,\\,-1)$, rayon $3$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.sphere-centre-rayon-mal-lu
        feedback: >
          Les coefficients ont été recopiés tels quels au lieu d'être divisés
          par deux ET changés de signe. Le carré $(x-2)^2$ développé donne
          $x^2-4x+4$ : un coefficient $-4$ correspond à un centre d'abscisse
          $+2$. Le signe du centre est TOUJOURS l'opposé de celui du
          coefficient.
      - id: C
        text: "Centre $\\Omega(2,\\,-3,\\,1)$, rayon $\\sqrt{14}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.sphere-rayon-constante-oubliee
        feedback: >
          Le centre est juste. Le rayon, lui, a été calculé en oubliant la
          constante $+5$ de l'équation : $4+9+1=14$ n'est que la somme des
          termes engendrés par les trois carrés. Il faut ensuite retrancher la
          constante — $R^2=4+9+1-5=9$.
      - id: D
        text: "Centre $\\Omega(2,\\,-3,\\,1)$, rayon $\\sqrt{19}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          La constante a été AJOUTÉE au lieu d'être retranchée : $4+9+1+5=19$.
          En complétant les carrés, les termes $-4$, $-9$, $-1$ passent à
          droite en s'ajoutant, tandis que le $+5$ passe à droite en se
          retranchant.
    correct_feedback: >
      $(x-2)^2+(y+3)^2+(z-1)^2 = 4+9+1-5 = 9$ : centre $\Omega(2,-3,1)$ et
      rayon $R=3$.
    solution: |
      **Compléter les trois carrés.**
      $$x^2-4x=(x-2)^2-4\qquad y^2+6y=(y+3)^2-9\qquad z^2-2z=(z-1)^2-1$$

      **Réécrire l'équation.**
      $$(x-2)^2+(y+3)^2+(z-1)^2-4-9-1+5=0$$
      $$(x-2)^2+(y+3)^2+(z-1)^2=9$$

      **Lecture.** Centre $\Omega(2,\,-3,\,1)$ et $R^2=9$, donc $R=3$.

  # ── R9 · même lecture, une constante de plus ───────────────────────────────
  - id: GE-55
    rung: "R9"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [sphere, equation_cartesienne, forme_canonique, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.sphere-rayon-constante-oubliee
    stem: >
      L'ensemble $(S')$ a pour équation
      $x^2+y^2+z^2+2x-4y-6z+10=0$. Quels sont son centre et son rayon ?
    type: mcq
    choices:
      - id: A
        text: "Centre $\\Omega(-1,\\,2,\\,3)$, rayon $2$"
        correct: true
      - id: B
        text: "Centre $\\Omega(-1,\\,2,\\,3)$, rayon $\\sqrt{14}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.sphere-rayon-constante-oubliee
        feedback: >
          Le centre est bon, mais la constante $+10$ a été laissée de côté :
          $1+4+9=14$ ne compte que ce que produisent les trois carrés. Le
          rayon vérifie $R^2=1+4+9-10=4$, donc $R=2$.
      - id: C
        text: "Centre $\\Omega(1,\\,-2,\\,-3)$, rayon $2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.sphere-centre-rayon-mal-lu
        feedback: >
          Les coordonnées du centre ont gardé le signe des coefficients. Or
          $(x+1)^2$ développé donne $x^2+2x+1$ : un coefficient $+2$ correspond
          à une abscisse $-1$. Divise par deux, puis change le signe.
      - id: D
        text: "Centre $\\Omega(-1,\\,2,\\,3)$, rayon $4$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          $4$ est la valeur de $R^2$, pas celle de $R$. La forme canonique
          s'écrit $(x-a)^2+(y-b)^2+(z-c)^2=R^2$ : le membre de droite est le
          CARRÉ du rayon, il reste à en prendre la racine.
    correct_feedback: >
      $(x+1)^2+(y-2)^2+(z-3)^2 = 1+4+9-10 = 4$ : centre $\Omega(-1,2,3)$ et
      rayon $R=2$.
    solution: |
      **Compléter les trois carrés.**
      $$x^2+2x=(x+1)^2-1\qquad y^2-4y=(y-2)^2-4\qquad z^2-6z=(z-3)^2-9$$

      **Réécrire.**
      $$(x+1)^2+(y-2)^2+(z-3)^2-1-4-9+10=0$$
      $$(x+1)^2+(y-2)^2+(z-3)^2=4$$

      **Lecture.** Centre $\Omega(-1,\,2,\,3)$, $R^2=4$ donc $R=2$.

  # ── R9 · plan et sphère : comparer d et R ──────────────────────────────────
  - id: GE-56
    rung: "R9"
    difficulty_level: 4
    skill_code: maths_geometrie_espace
    tags: [sphere, plan, intersection, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.intersection-sphere-plan-erreur
    stem: >
      $(S)$ est la sphère de centre $\Omega(1,-1,2)$ et de rayon $3$ ;
      $(P)$ a pour équation $2x-2y+z-9=0$. Quelle est l'intersection de $(S)$
      et de $(P)$ ?
    type: mcq
    choices:
      - id: A
        text: "Un cercle de rayon $2\\sqrt{2}$"
        correct: true
      - id: B
        text: "L'ensemble vide : la distance du centre au plan est inférieure au rayon, donc le plan passe à côté."
        correct: false
        misconception: mc.math.maths_geometrie_espace.intersection-sphere-plan-erreur
        feedback: >
          Le critère est retourné. Quand la distance du centre au plan est
          INFÉRIEURE au rayon, le plan entre dans la sphère et la coupe suivant
          un cercle. C'est la distance SUPÉRIEURE au rayon qui donne un
          ensemble vide. Une image utile : plus le plan est proche du centre,
          plus il tranche largement.
      - id: C
        text: "Un point unique, le plan étant tangent à la sphère"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-oubli-division
        feedback: >
          Cette conclusion vient d'une distance égale à $3$, obtenue en gardant
          le numérateur $|2+2+2-9|=3$ sans le diviser par
          $\sqrt{4+4+1}=3$. La vraie distance vaut $1$ : le plan traverse la
          sphère, il ne l'effleure pas.
      - id: D
        text: "Un cercle de rayon $\\sqrt{5}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-numerateur-mal-forme
        feedback: >
          La nature de l'intersection est bonne, son rayon non : le numérateur a
          été formé sans la constante, $|2+2+2|/3=2$, d'où
          $\sqrt{9-4}=\sqrt5$. Avec la constante, $d=1$ et le rayon du cercle
          vaut $\sqrt{9-1}=2\sqrt2$.
    correct_feedback: >
      $d(\Omega,P)=\dfrac{|2+2+2-9|}{\sqrt{4+4+1}}=\dfrac{3}{3}=1<3$ : le plan
      coupe la sphère suivant un cercle, de rayon
      $\sqrt{R^2-d^2}=\sqrt{9-1}=2\sqrt2$.
    solution: |
      **Étape 1 — la distance du centre au plan.**
      $$d(\Omega,P)=\frac{|2\times 1-2\times(-1)+2-9|}{\sqrt{2^2+(-2)^2+1^2}}
      =\frac{|2+2+2-9|}{3}=\frac{3}{3}=1$$

      **Étape 2 — comparer à $R$.** $d=1<3=R$ : le plan pénètre la sphère,
      l'intersection est un cercle.

      **Étape 3 — le rayon du cercle, par Pythagore.**
      $$r=\sqrt{R^2-d^2}=\sqrt{9-1}=\sqrt{8}=2\sqrt{2}$$

  # ── R9 · le cas limite, et deux façons de le rater ─────────────────────────
  - id: GE-57
    rung: "R9"
    difficulty_level: 4
    skill_code: maths_geometrie_espace
    tags: [sphere, plan, intersection, plancher]
    primary_misconception: mc.math.maths_geometrie_espace.intersection-sphere-plan-erreur
    stem: >
      $(S)$ est la sphère de centre l'origine et de rayon $1$ ; $(P)$ a pour
      équation $3x+4y+12z-13=0$. Quelle est l'intersection de $(S)$ et
      de $(P)$ ?
    type: mcq
    choices:
      - id: A
        text: "Un point unique : la distance du centre au plan égale exactement le rayon, donc le plan est tangent."
        correct: true
      - id: B
        text: "Un cercle : une distance égale au rayon signifie que le plan traverse la sphère par son centre."
        correct: false
        misconception: mc.math.maths_geometrie_espace.intersection-sphere-plan-erreur
        feedback: >
          Un plan qui passe par le CENTRE est à distance nulle, et il découpe
          alors le plus grand cercle possible. Une distance égale au rayon est
          au contraire le cas limite opposé : le plan effleure la sphère en un
          seul point, et le cercle d'intersection est réduit à ce point.
      - id: C
        text: "L'ensemble vide : la distance du centre au plan vaut $\\dfrac{13}{5}$, supérieure au rayon."
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-plane-en-espace
        feedback: >
          Cette distance n'utilise que deux coefficients : $|{-13}|/\sqrt{9+16}
          =13/5$. Dans l'espace, le terme en $z$ compte lui aussi, et il pèse
          lourd ici : $\sqrt{9+16+144}=13$, ce qui ramène la distance à $1$.
      - id: D
        text: "Un cercle : la distance du centre au plan vaut $\\dfrac{1}{13}$, bien inférieure au rayon."
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          Le dénominateur retenu est $9+16+144=169$, c'est-à-dire le CARRÉ de
          la norme. La formule demande la norme elle-même, $\sqrt{169}=13$, ce
          qui donne $d=1$ et non $\frac{1}{13}$.
    correct_feedback: >
      $d(\Omega,P)=\dfrac{|-13|}{\sqrt{9+16+144}}=\dfrac{13}{13}=1=R$ : le plan
      est tangent, l'intersection se réduit à un point.
    solution: |
      **Étape 1 — la distance du centre $O(0,0,0)$ au plan.**
      $$d(O,P)=\frac{|3\times 0+4\times 0+12\times 0-13|}{\sqrt{3^2+4^2+12^2}}
      =\frac{13}{\sqrt{169}}=\frac{13}{13}=1$$

      **Étape 2 — comparer à $R=1$.**
      $$d=R \;\Longrightarrow\; \text{le plan est tangent à la sphère}$$

      **Conclusion.** L'intersection est réduite à un seul point, le point de
      contact — projeté orthogonal du centre sur le plan.


