notion: geometrie-espace
skill_code: maths_geometrie_espace   # proposed; supabase-architect reconciles at integration
misconceptions:
  # Rétro-inventaire (summit-conversion / floor backfill). La banque a été
  # rédigée AVANT le tag par distracteur (misconceptions: [] à l'origine) ;
  # chaque distracteur a été relu et rattaché au modèle d'erreur qu'il teste.
  # Namespace : mc.math.maths_geometrie_espace.<slug>. Compléments dans coverage_summary (bas de fichier).

  - id: mc.math.maths_geometrie_espace.signe-arithmetique
    label: "Erreur de signe ou de coefficient dans un calcul coordonnée par coordonnée"
    description: >-
      L'élève mène le bon calcul (produit scalaire, produit vectoriel,
      différence de coordonnées, équation d'un plan) mais perd un signe ou un
      coefficient en route — typiquement (−1)×4 compté +4, ou m×(−2) traité
      comme −m.
    contradicts_principle: >-
      Chaque coordonnée porte son signe jusqu'au bout : le produit de deux
      nombres de signes opposés est négatif, et le coefficient d'une inconnue
      est exactement celui de la donnée. Réinjecter le résultat rattrape la
      plupart de ces glissements.

  - id: mc.math.maths_geometrie_espace.oubli-racine
    label: "Oublier la racine carrée finale (norme² prise pour la norme, R² pour R)"
    description: >-
      L'élève s'arrête à la somme des carrés : il rend ‖u‖² à la place de ‖u‖,
      R² à la place de R, ou divise par ‖u‖² au lieu de ‖u‖.
    contradicts_principle: >-
      ‖u‖ = √(x²+y²+z²) : la racine carrée est la dernière étape, pas une
      décoration. 36 est un carré de norme, pas une norme ; 16 est R², pas un
      rayon.

  - id: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
    label: "Réduire une opération vectorielle à une addition des coordonnées"
    description: >-
      L'élève calcule un produit scalaire, une norme ou un vecteur en
      additionnant naïvement les coordonnées, au lieu d'appliquer la bonne
      opération (produits puis somme, ou carrés puis racine, ou différence).
    contradicts_principle: >-
      Le produit scalaire est xx′+yy′+zz′ (trois produits, une somme), la norme
      √(x²+y²+z²), un vecteur AB une différence coordonnée par coordonnée.
      Aucune de ces opérations n'est « additionner les coordonnées ».

  - id: mc.math.maths_geometrie_espace.oubli-valeur-absolue
    label: "Rendre négative une grandeur toujours positive (distance, volume, norme)"
    description: >-
      L'élève laisse un signe négatif dans un résultat qui mesure une distance,
      un volume ou une norme, faute d'avoir pris la valeur absolue.
    contradicts_principle: >-
      Distances, volumes et normes sont ≥ 0 par définition. La valeur absolue au
      numérateur d'une distance, ou autour d'un produit mixte pour un volume,
      n'est pas optionnelle : un résultat négatif signale une étape oubliée.

  - id: mc.math.maths_geometrie_espace.volume-facteur-oubli
    label: "Oublier tout ou partie du facteur 1/6 reliant produit mixte et volume du tétraèdre"
    description: >-
      L'élève rend la valeur absolue du produit mixte (volume du
      parallélépipède) comme volume du tétraèdre, ou n'applique qu'un des deux
      facteurs (1/2 pour la base triangulaire, 1/3 pour la pyramide).
    contradicts_principle: >-
      V(tétraèdre) = (1/6)|[u,v,w]|. Le facteur 1/6 = 1/2 × 1/3 combine « base
      triangle = moitié du parallélogramme » et « pyramide = un tiers de
      base×hauteur ». Ni 1, ni 1/2, ni 1/3 seuls.

  - id: mc.math.maths_geometrie_espace.normal-vs-directeur
    label: "Confondre vecteur normal à un plan et vecteur du plan / objet droite vs plan"
    description: >-
      L'élève prend un vecteur qui vit DANS le plan (un AB, un vecteur
      directeur) pour le vecteur normal, ou confond les objets droite et plan
      (cherche une « normale » à une droite, utilise la normale d'un autre plan).
    contradicts_principle: >-
      Le vecteur normal est ⟂ au plan, donc orthogonal à tout vecteur du plan :
      l'opposé géométrique d'un vecteur du plan. Une droite a un vecteur
      directeur ; un plan a un vecteur normal.

  - id: mc.math.maths_geometrie_espace.distance-denominateur-somme
    label: "Diviser par a+b+c au lieu de √(a²+b²+c²) dans la distance à un plan"
    description: >-
      Au dénominateur de d(M,P), l'élève met la somme des coefficients a+b+c au
      lieu de la norme du vecteur normal √(a²+b²+c²).
    contradicts_principle: >-
      d(M,P) = |ax₀+by₀+cz₀+d| / ‖n‖, et ‖n‖ = √(a²+b²+c²) — jamais a+b+c. Le
      dénominateur est une longueur (la norme de la normale), pas une somme de
      coefficients.

  - id: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
    label: "Utiliser le produit scalaire là où il faut le produit vectoriel (ou l'inverse)"
    description: >-
      Pour une aire ou une direction perpendiculaire, l'élève emploie le produit
      scalaire (un nombre lié à l'angle) au lieu du produit vectoriel (un vecteur
      dont la norme est une aire), ou confond leurs résultats.
    contradicts_principle: >-
      Le produit scalaire renvoie un nombre (orthogonalité, angle) ; le produit
      vectoriel un vecteur ⟂ aux deux, dont la norme est l'aire du
      parallélogramme. Une aire se lit sur ‖u∧v‖, jamais sur u·v.

  - id: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
    label: "Produit scalaire calculé incomplètement ou pas du tout"
    description: >-
      L'élève ne calcule qu'un terme du produit scalaire (le premier produit),
      ou donne à sa place ‖u‖‖v‖ / une valeur supposée, sans effectuer réellement
      xx′+yy′+zz′.
    contradicts_principle: >-
      Le produit scalaire est la somme des TROIS produits coordonnée par
      coordonnée. Un seul terme, ou la valeur ‖u‖‖v‖ (qui suppose la
      colinéarité), ne le remplace pas.

  - id: mc.math.maths_geometrie_espace.aire-oubli-demi
    label: "Rendre ‖u∧v‖ (parallélogramme) comme aire du triangle"
    description: >-
      L'élève calcule correctement ‖u∧v‖ mais oublie que le triangle n'occupe
      que la moitié du parallélogramme.
    contradicts_principle: >-
      ‖u∧v‖ est l'aire du parallélogramme ; aire(triangle) = ‖u∧v‖ / 2. Le
      facteur 1/2 n'est pas optionnel.

  - id: mc.math.maths_geometrie_espace.normal-inclut-constante
    label: "Prendre la constante d de l'équation comme composante du vecteur normal"
    description: >-
      Dans ax+by+cz+d=0, l'élève inclut d comme composante de la normale (par
      ex. n(a,b,d)).
    contradicts_principle: >-
      Le vecteur normal est (a,b,c), les coefficients de x,y,z. La constante d ne
      code que la position du plan le long de n, pas sa direction perpendiculaire.

  - id: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
    label: "Deux droites non parallèles seraient forcément sécantes (réflexe du plan)"
    description: >-
      L'élève transpose la règle plane « deux droites non parallèles se coupent »
      à l'espace, sans envisager les droites non coplanaires.
    contradicts_principle: >-
      Dans l'espace, la troisième dimension permet à deux droites non parallèles
      de se « rater » : ce sont les droites non coplanaires (gauches). Directions
      non colinéaires n'implique pas point commun ; il faut résoudre le système.

  - id: mc.math.maths_geometrie_espace.colinearite-mal-testee
    label: "Colinéarité de deux directions mal testée (parallèle / confondu / « pas de point commun ⇒ parallèle »)"
    description: >-
      L'élève conclut au parallélisme ou à la confusion, ou déduit un
      parallélisme de la seule absence de point commun, sans tester correctement
      la colinéarité des vecteurs directeurs.
    contradicts_principle: >-
      Deux droites sont parallèles ssi leurs vecteurs directeurs sont colinéaires
      (u₂ = k u₁). L'absence de point commun sans colinéarité, c'est le cas non
      coplanaire, pas le parallélisme.

  - id: mc.math.maths_geometrie_espace.perspective-fiable
    label: "Se fier à un dessin en perspective pour juger angles / orthogonalité"
    description: >-
      L'élève tranche une question d'angle ou d'orthogonalité en regardant le
      dessin (ou en y posant une équerre), comme si la perspective conservait les
      angles.
    contradicts_principle: >-
      Une perspective déforme angles et longueurs : un angle qui paraît droit ne
      l'est pas forcément. Seul un calcul de coordonnées (produit scalaire des
      directions) tranche.

  - id: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
    label: "Trancher par un « fait » spatial inventé"
    description: >-
      L'élève invoque une règle inexistante (diagonales de faces toujours ⟂,
      droites d'une même face toujours ⟂, longueurs égales ⇒ ⟂) au lieu de
      calculer.
    contradicts_principle: >-
      L'orthogonalité de deux directions se décide par u·v = 0, pas par des
      slogans sur les cubes ou les longueurs. Aucune de ces « règles » n'est
      vraie en général.

  - id: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
    label: "Confondre orthogonalité (directions) et perpendicularité (directions + intersection)"
    description: >-
      L'élève emploie « perpendiculaires » pour des droites non sécantes, ou
      refuse de parler d'orthogonalité tant qu'elles ne se coupent pas.
    contradicts_principle: >-
      Deux droites sont orthogonales si leurs directions le sont (u·v=0), qu'elles
      se coupent ou non. « Perpendiculaires » exige EN PLUS qu'elles soient
      sécantes.

  - id: mc.math.maths_geometrie_espace.distance-plane-en-espace
    label: "Appliquer la distance du plan (deux coordonnées) dans l'espace"
    description: >-
      L'élève calcule AB comme dans le plan, √((Δx)²+(Δy)²), en oubliant l'écart
      en z (le second Pythagore, à la verticale).
    contradicts_principle: >-
      AB = √((Δx)²+(Δy)²+(Δz)²) : la troisième coordonnée entre dans la formule.
      Oublier z revient à projeter les points au sol.

  - id: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
    label: "Calculer AB comme « départ moins arrivée » (A−B)"
    description: >-
      L'élève inverse la soustraction et calcule A−B au lieu de B−A.
    contradicts_principle: >-
      AB = (x_B−x_A, y_B−y_A, z_B−z_A) : arrivée moins départ. L'ordre inverse
      donne le vecteur opposé BA.

  - id: mc.math.maths_geometrie_espace.produit-vectoriel-ordre-composantes
    label: "Composantes du produit vectoriel correctes mais mal ordonnées"
    description: >-
      L'élève calcule les trois bonnes valeurs mais les place dans le mauvais
      ordre (décalage circulaire des couples de coordonnées).
    contradicts_principle: >-
      u∧v = (yz′−zy′, zx′−xz′, xy′−yx′) : la 1ʳᵉ composante croise (y,z), la 2ᵉ
      (z,x), la 3ᵉ (x,y). L'ordre des couples est fixe.

  - id: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
    label: "D'un produit mixte nul, conclure autre chose que la coplanarité"
    description: >-
      De [u,v,w]=0, l'élève déduit l'orthogonalité deux à deux, la colinéarité
      deux à deux, ou la nullité d'un vecteur.
    contradicts_principle: >-
      [u,v,w]=0 signifie volume nul, donc parallélépipède aplati : les trois
      vecteurs sont coplanaires. Ni orthogonaux, ni colinéaires deux à deux, ni
      forcément nuls.

  - id: mc.math.maths_geometrie_espace.directeur-vs-point
    label: "Confondre point et vecteur directeur dans une représentation de droite"
    description: >-
      L'élève prend les termes constants (le point pour t=0) comme vecteur
      directeur, ou intervertit rôle/place du point et du vecteur directeur dans
      la forme paramétrique ou symétrique.
    contradicts_principle: >-
      Dans x = x_A + t·a (…), le vecteur directeur est fait des coefficients de
      t, le point des termes constants. Dans la forme symétrique, les coordonnées
      de A sont aux numérateurs, celles de u aux dénominateurs.

  - id: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
    label: "Accepter un point sur une droite avec un t différent par équation"
    description: >-
      L'élève vérifie chaque équation paramétrique séparément et se contente d'un
      t possible pour chacune, sans exiger le même t partout.
    contradicts_principle: >-
      Un point appartient à la droite ssi UNE SEULE valeur de t satisfait les
      trois équations simultanément. Une valeur différente par équation ne prouve
      rien.

  - id: mc.math.maths_geometrie_espace.plan-constante-mal-determinee
    label: "Constante d de l'équation d'un plan mal déterminée"
    description: >-
      L'élève prend d comme la somme brute des coordonnées du point, ou laisse
      d=0 en supposant l'origine dans le plan, au lieu de fixer d avec un point
      connu.
    contradicts_principle: >-
      d = −(a·x_A + b·y_A + c·z_A), obtenu en imposant qu'un point du plan vérifie
      l'équation. Ni x_A+y_A+z_A, ni 0 (l'origine n'est en général pas dans le
      plan).

  - id: mc.math.maths_geometrie_espace.position-critere-inverse
    label: "Critère de position relative inversé ou mal appliqué (droite/plan, plan/plan)"
    description: >-
      L'élève inverse le critère : prend u·n≠0 pour un parallélisme au lieu d'une
      sécance, ou juge la sécance de deux plans à l'identité de leurs équations
      plutôt qu'à la colinéarité des normales.
    contradicts_principle: >-
      Droite/plan : u·n=0 ⇒ parallèle, u·n≠0 ⇒ sécante en un point. Plan/plan :
      normales colinéaires ⇒ parallèles, sinon sécants. Le test porte sur les
      directions, pas sur l'aspect des équations.

  - id: mc.math.maths_geometrie_espace.paralleles-vs-confondus
    label: "Normales colinéaires prises pour des plans confondus"
    description: >-
      L'élève conclut que deux plans à normales colinéaires sont confondus, sans
      vérifier la constante qui distingue « strictement parallèles » de
      « confondus ».
    contradicts_principle: >-
      Normales colinéaires ⇒ plans parallèles. Confondus seulement si les
      équations sont proportionnelles TERME À TERME, constante comprise
      (par ex. 5 ≠ 2×1).

  - id: mc.math.maths_geometrie_espace.distance-oubli-division
    label: "Garder le numérateur sans diviser par la norme"
    description: >-
      L'élève rend |n·AM| ou ‖AM∧u‖ tel quel comme distance, en oubliant de
      diviser par la norme (‖n‖ ou ‖u‖).
    contradicts_principle: >-
      d(M,P)=|n·AM|/‖n‖ et d(M,D)=‖AM∧u‖/‖u‖ : le numérateur seul est une aire ou
      un produit, pas une longueur. La division par la norme est indispensable.

  - id: mc.math.maths_geometrie_espace.distance-numerateur-mal-forme
    label: "Numérateur de la distance mal formé (constante oubliée ou mauvais point)"
    description: >-
      L'élève oublie la constante d dans le numérateur, ou y injecte les
      coordonnées d'un autre point (l'origine) que celui demandé.
    contradicts_principle: >-
      Le numérateur est |a·x₀+b·y₀+c·z₀+d|, évalué au point demandé, constante
      comprise. Oublier d ou changer de point casse le résultat.

  - id: mc.math.maths_geometrie_espace.sphere-centre-rayon-mal-lu
    label: "Centre ou rayon d'une sphère mal lus"
    description: >-
      L'élève lit les coordonnées du centre avec le mauvais signe (depuis (x+1)²
      il prend +1), les intervertit, ou lit directement les coefficients de
      l'équation développée comme centre.
    contradicts_principle: >-
      Sous forme (x−x_Ω)²+…=R², (x+1)²=(x−(−1))² donne x_Ω=−1. Depuis la forme
      développée, il faut compléter le carré et négativer, pas lire les
      coefficients bruts ; et R=√(second membre), pas le second membre.

  - id: mc.math.maths_geometrie_espace.sphere-rayon-constante-oubliee
    label: "Constante oubliée en complétant le carré pour le rayon"
    description: >-
      En passant de la forme développée à la forme canonique, l'élève oublie de
      reporter la constante de l'équation avant de conclure sur R².
    contradicts_principle: >-
      R² = (somme des carrés des demi-coefficients) − (constante de l'équation).
      Oublier de soustraire la constante fausse le rayon (par ex. 4+1+9 au lieu
      de 4+1+9−5).

  - id: mc.math.maths_geometrie_espace.intersection-sphere-plan-erreur
    label: "Intersection plan/sphère : critère inversé ou Pythagore mal signé"
    description: >-
      L'élève prend d<R pour la tangence (au lieu de d=R), ou calcule le rayon du
      cercle avec R²+d² au lieu de R²−d².
    contradicts_principle: >-
      On compare d et R : d>R rien, d=R tangent, d<R cercle. Le rayon du cercle
      vient du triangle rectangle ΩHM (hypoténuse R) : r=√(R²−d²), un moins,
      jamais un plus.

items:

  # ── R2 · produit scalaire dans l'espace ─────────────────────────────────────
  - id: GE-1
    rung: "R2"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [produit_scalaire, coordonnees]
    primary_misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
    stem: >
      On donne $\vec{u}(3,1,-2)$ et $\vec{v}(2,-3,1)$. Que vaut
      $\vec{u}\cdot\vec{v}$ ?
    type: mcq
    choices:
      - id: A
        text: "$1$"
        correct: true
      - id: B
        text: "$2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Ce résultat vient d'une addition terme à terme des coordonnées,
          $(3+2)+(1-3)+(-2+1)=2$, au lieu d'une multiplication coordonnée par
          coordonnée suivie d'une somme des produits. Le produit scalaire
          n'est jamais une addition de coordonnées : on calcule
          $x x' + y y' + z z'$, trois produits qu'on additionne ensuite —
          pas trois sommes.
      - id: C
        text: "$6$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
        feedback: >
          Ce choix ne calcule que le premier terme, $3\times2=6$, et oublie
          d'ajouter les deux autres produits $yy'=1\times(-3)$ et
          $zz'=(-2)\times1$. Le produit scalaire est la somme des TROIS
          produits coordonnée par coordonnée, jamais un seul.
      - id: D
        text: "$5$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          On retrouve ce nombre en oubliant le signe du dernier terme :
          $(-2)\times1=-2$, pas $+2$. Ici $6-3+2=5$ au lieu de $6-3-2=1$ —
          il faut respecter le signe de chaque coordonnée, y compris quand
          les deux facteurs du produit ont des signes différents.
    correct_feedback: >
      $\vec{u}\cdot\vec{v} = 3\times2 + 1\times(-3) + (-2)\times1 = 6-3-2 = 1$.
      On multiplie coordonnée par coordonnée, puis on additionne les trois
      produits — jamais les coordonnées elles-mêmes.
    solution: |
      **Application directe de l'expression analytique (chapitre 3) :**
      $$\vec{u}\cdot\vec{v} = xx'+yy'+zz' = 3\times2 + 1\times(-3) + (-2)\times1$$
      $$\vec{u}\cdot\vec{v} = 6 - 3 - 2 = 1$$

  # ── R3 · produit vectoriel : norme = aire ───────────────────────────────────
  - id: GE-2
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_vectoriel, aire]
    primary_misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
    stem: >
      Soit $O$, $A$, $B$ trois points avec $\overrightarrow{OA}=\vec{u}(2,0,0)$
      et $\overrightarrow{OB}=\vec{v}(1,2,0)$. Quelle est l'aire du triangle
      $OAB$ ?
    type: mcq
    choices:
      - id: A
        text: "$2$"
        correct: true
      - id: B
        text: "$4$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.aire-oubli-demi
        feedback: >
          $\|\vec{u}\wedge\vec{v}\|=4$ est bien calculé, mais c'est l'aire du
          PARALLÉLOGRAMME construit sur $\vec{u}$ et $\vec{v}$, pas celle du
          triangle. Le triangle $OAB$ n'en occupe que la moitié : il manque
          la division par $2$.
      - id: C
        text: "$1$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-vectoriel-confondus
        feedback: >
          Ce résultat vient du produit SCALAIRE $\vec{u}\cdot\vec{v}=2$,
          divisé par $2$ — c'est-à-dire confondre le produit scalaire (un
          nombre lié à l'angle entre les vecteurs) avec le produit vectoriel
          (dont la norme mesure une aire). Une aire se lit sur
          $\|\vec{u}\wedge\vec{v}\|$, jamais sur $\vec{u}\cdot\vec{v}$.
      - id: D
        text: "$8$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          Ce choix correspond à $\|\vec{u}\wedge\vec{v}\|^2/2 = 16/2=8$ : la
          norme au carré a été utilisée à la place de la norme elle-même — la
          racine carrée a été oubliée dans le calcul de
          $\|\vec{u}\wedge\vec{v}\|=\sqrt{0^2+0^2+4^2}=4$.
    correct_feedback: >
      $\vec{u}\wedge\vec{v}=(0,0,4)$, donc $\|\vec{u}\wedge\vec{v}\|=4$ :
      c'est l'aire du parallélogramme. Le triangle $OAB$ en occupe la
      moitié : aire $=2$.
    solution: |
      **Produit vectoriel :**
      $$\vec{u}\wedge\vec{v} = (0\times0-0\times2,\ 0\times1-2\times0,\ 2\times2-0\times1) = (0,0,4)$$

      **Norme = aire du parallélogramme :**
      $$\|\vec{u}\wedge\vec{v}\| = \sqrt{0^2+0^2+4^2} = 4$$

      **Aire du triangle = moitié du parallélogramme :**
      $$\text{aire}(OAB) = \frac{4}{2} = 2$$

  # ── R4 · produit mixte et volume du tétraèdre ───────────────────────────────
  - id: GE-3
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_mixte, volume, tetraedre]
    primary_misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
    stem: >
      Un tétraèdre $OABC$ trirectangle en $O$ a pour arêtes
      $\overrightarrow{OA}(2,0,0)$, $\overrightarrow{OB}(0,2,0)$,
      $\overrightarrow{OC}(0,0,3)$. Sachant que le produit mixte
      $[\overrightarrow{OA},\overrightarrow{OB},\overrightarrow{OC}]$ vaut
      $12$, quel est le volume du tétraèdre $OABC$ ?
    type: mcq
    choices:
      - id: A
        text: "$2$"
        correct: true
      - id: B
        text: "$12$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
        feedback: >
          $12$ est le volume du PARALLÉLÉPIPÈDE construit sur les trois
          arêtes (la valeur absolue du produit mixte), pas celui du
          tétraèdre. Le tétraèdre n'en occupe que le sixième : il manque le
          facteur $\frac16$.
      - id: C
        text: "$6$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
        feedback: >
          Ce résultat applique seulement un facteur $\frac12$ (comme si on
          ne prenait que l'aire du triangle de base) mais oublie le facteur
          $\frac13$ propre au volume d'une pyramide. Les deux facteurs se
          combinent : $\frac12\times\frac13=\frac16$, pas $\frac12$ seul.
      - id: D
        text: "$4$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
        feedback: >
          Ce résultat applique seulement un facteur $\frac13$ (le facteur
          pyramide) mais oublie que la base est un TRIANGLE, la moitié du
          parallélogramme — d'où le facteur global $\frac16$
          ($\frac12\times\frac13$), pas $\frac13$ seul.
    correct_feedback: >
      Le volume du tétraèdre vaut $\frac16$ de la valeur absolue du produit
      mixte : $\frac16\times12=2$.
    solution: |
      **Formule du volume à partir du produit mixte (chapitre 5) :**
      $$V_{OABC} = \frac{1}{6}\left|[\overrightarrow{OA},\overrightarrow{OB},\overrightarrow{OC}]\right| = \frac{1}{6}\times12 = 2$$

  # ── R6 · vecteur normal à un plan ───────────────────────────────────────────
  - id: GE-4
    rung: "R6"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [plan, vecteur_normal, equation_cartesienne]
    primary_misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
    stem: >
      Un plan $\mathcal P$ a pour équation cartésienne
      $3x+2y-z+4=0$. Quel est un vecteur normal à $\mathcal P$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{n}(3,2,-1)$"
        correct: true
      - id: B
        text: "$\\vec{n}(3,2,4)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-inclut-constante
        feedback: >
          Ce choix prend la constante $d=4$ de l'équation comme troisième
          composante du vecteur normal, à la place du coefficient de $z$
          (qui est $-1$, puisque l'équation s'écrit
          $3x+2y+(-1)z+4=0$). $d$ ne fait pas partie du vecteur normal : il
          ne code que la position du plan, pas sa direction perpendiculaire.
      - id: C
        text: "$\\vec{n}(0,-2,-4)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
        feedback: >
          Ce vecteur est bien lié au plan, mais autrement : c'est un vecteur
          directeur d'une droite CONTENUE dans le plan (obtenu à partir de
          deux points du plan), pas le vecteur normal. Un vecteur qui vit
          DANS le plan est orthogonal à la normale, pas égal à elle — ce
          sont deux objets géométriques opposés.
      - id: D
        text: "$\\vec{n}(3,2,1)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur la composante de $z$ : l'équation est
          $3x+2y-z+4=0$, donc le coefficient de $z$ est $-1$, pas $+1$. Le
          vecteur normal doit conserver ce signe négatif :
          $\vec{n}(3,2,-1)$.
    correct_feedback: >
      Dans une équation $ax+by+cz+d=0$, le vecteur normal a pour coordonnées
      les coefficients $(a,b,c)$ — jamais la constante $d$. Ici :
      $\vec{n}(3,2,-1)$.
    solution: |
      **Lecture directe de l'équation $ax+by+cz+d=0$ (chapitre 7) :**
      $$3x+2y+(-1)z+4=0 \implies \vec{n}(3,2,-1)$$

  # ── R7 · positions relatives droite/droite ──────────────────────────────────
  - id: GE-5
    rung: "R7"
    difficulty_level: 4
    skill_code: maths_geometrie_espace
    tags: [positions_relatives, droites_gauches]
    primary_misconception: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
    stem: >
      La droite $d_1$ passe par $A(0,0,0)$ avec pour vecteur directeur
      $\vec{u_1}(1,1,0)$ ; la droite $d_2$ passe par $B(1,0,1)$ avec pour
      vecteur directeur $\vec{u_2}(0,1,1)$. On vérifie que
      $\vec{u_1}$ et $\vec{u_2}$ ne sont pas colinéaires, et que le système
      obtenu en cherchant un point commun n'a pas de solution. Quelle est la
      position relative de $d_1$ et $d_2$ ?
    type: mcq
    choices:
      - id: A
        text: "$d_1$ et $d_2$ sont non coplanaires (gauches) : directions non colinéaires, et aucun point commun."
        correct: true
      - id: B
        text: "$d_1$ et $d_2$ sont sécantes, puisque leurs directions ne sont pas colinéaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.secantes-comme-dans-le-plan
        feedback: >
          C'est vrai dans le plan : deux droites non parallèles s'y coupent
          toujours. Mais dans l'espace, ce n'est plus automatique — il existe
          une troisième dimension dans laquelle deux droites peuvent se
          croiser sans jamais se toucher. Ici, la résolution du système ne
          donne AUCUNE solution commune : les droites ne sont pas sécantes,
          elles sont non coplanaires.
      - id: C
        text: "$d_1$ et $d_2$ sont parallèles, puisque leurs vecteurs directeurs sont proportionnels."
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          $\vec{u_1}(1,1,0)$ et $\vec{u_2}(0,1,1)$ ne sont pas proportionnels
          (aucun réel $k$ ne vérifie $1=0\times k$) : les deux droites n'ont
          pas la même direction, donc elles ne peuvent pas être parallèles.
      - id: D
        text: "$d_1$ et $d_2$ sont confondues."
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          Deux droites confondues doivent au minimum avoir des vecteurs
          directeurs colinéaires — condition qui échoue déjà ici
          ($\vec{u_1}$ et $\vec{u_2}$ ne sont pas proportionnels). Des
          droites non parallèles ne peuvent jamais être confondues.
    correct_feedback: >
      Directions non colinéaires (pas parallèles) et système sans solution
      (pas de point commun) : c'est exactement la signature des droites non
      coplanaires — la troisième dimension leur permet de se croiser « en
      apparence » sans jamais se toucher réellement.
    solution: |
      **Test de parallélisme :** $\vec{u_1}(1,1,0)$ et $\vec{u_2}(0,1,1)$ ne
      sont pas colinéaires → $d_1$ et $d_2$ ne sont pas parallèles.

      **Recherche d'un point commun**, en paramétrant $d_1:(t,t,0)$ et
      $d_2:(1,s,1+s)$ :
      $$t=1,\qquad t=s,\qquad 0=1+s$$

      La première équation donne $s=1$ (via $t=1=s$), la troisième donne
      $s=-1$ : contradiction, aucune solution commune.

      **Conclusion :** ni parallèles, ni sécantes → $d_1$ et $d_2$ sont
      **non coplanaires**.

  # ── R8 · distance d'un point à un plan ──────────────────────────────────────
  - id: GE-6
    rung: "R8"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [distance, plan]
    primary_misconception: mc.math.maths_geometrie_espace.distance-denominateur-somme
    stem: >
      Le plan $\mathcal P$ a pour équation $x+2y+2z-3=0$. Quelle est la
      distance du point $M(1,1,1)$ au plan $\mathcal P$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{2}{3}$"
        correct: true
      - id: B
        text: "$2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-oubli-division
        feedback: >
          Ce choix garde le numérateur $|1+2+2-3|=2$ mais oublie de diviser
          par $\|\vec{n}\|=\sqrt{1^2+2^2+2^2}=3$. Le numérateur seul n'est
          pas une distance : il faut le rapporter à la norme du vecteur
          normal.
      - id: C
        text: "$\\dfrac{2}{5}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-denominateur-somme
        feedback: >
          Ce choix divise par la SOMME des coefficients, $1+2+2=5$, au lieu
          de la norme $\sqrt{1^2+2^2+2^2}=3$. La formule utilise
          $\sqrt{a^2+b^2+c^2}$ (la norme du vecteur normal), jamais
          $a+b+c$.
      - id: D
        text: "$-\\dfrac{2}{3}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-valeur-absolue
        feedback: >
          Une distance est toujours positive ou nulle. Le signe de
          $ax_0+by_0+cz_0+d$ dépend du côté du plan où se trouve le point —
          c'est pour ça que la formule impose une valeur absolue au
          numérateur.
    correct_feedback: >
      $d(M,\mathcal P) = \dfrac{|1\times1+2\times1+2\times1-3|}{\sqrt{1^2+2^2+2^2}}
      = \dfrac{|2|}{3} = \dfrac{2}{3}$.
    solution: |
      **Application de la formule (chapitre 9) :**
      $$d(M,\mathcal P) = \frac{|x_0+2y_0+2z_0-3|}{\sqrt{1^2+2^2+2^2}} = \frac{|1+2+2-3|}{\sqrt9} = \frac{2}{3}$$

  # ── R0 · accroche : perspective, orthogonalité, besoin de coordonnées ──────
  - id: GE-7
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [accroche, perspective, perpendicularite_espace]
    primary_misconception: mc.math.maths_geometrie_espace.perspective-fiable
    stem: >
      Sur le dessin en perspective du cube $ABCDEFGH$, les diagonales $(AG)$
      et $(BD)$ semblent former un angle droit. Peut-on conclure, à partir
      seulement de ce dessin, qu'elles sont perpendiculaires dans l'espace ?
    type: mcq
    choices:
      - id: A
        text: "Non : une perspective déforme les angles réels, un angle droit sur le dessin ne garantit rien sur l'angle réel dans l'espace."
        correct: true
      - id: B
        text: "Oui, un dessin en perspective conserve fidèlement les angles, donc un angle droit dessiné est un angle droit réel."
        correct: false
        misconception: mc.math.maths_geometrie_espace.perspective-fiable
        feedback: >
          Une perspective déforme précisément les angles et les distances :
          c'est pour ça qu'on ne peut jamais s'y fier pour trancher une
          question d'orthogonalité.
      - id: C
        text: "Oui, car les deux diagonales appartiennent à des faces du cube, et deux diagonales de faces sont toujours perpendiculaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          $(AG)$ n'appartient à aucune face du cube (c'est la grande
          diagonale, qui traverse le solide) ; et même entre diagonales de
          faces, rien ne garantit une perpendicularité systématique.
      - id: D
        text: "Non, mais seulement parce que $(AG)$ et $(BD)$ n'ont pas la même longueur — deux droites perpendiculaires doivent être de même longueur."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          La perpendicularité de deux droites ne dépend jamais de leurs
          longueurs, seulement de leurs directions : ce critère de longueur
          égale n'existe pas.
    correct_feedback: >
      Une perspective déforme les angles réels : un angle droit visible sur
      le dessin ne prouve rien. Seul un calcul de coordonnées peut trancher.
    solution: |
      **Le problème posé par l'accroche (chapitre 1) :** un dessin en perspective ne
      conserve pas fidèlement les angles ni les distances. La seule méthode
      fiable est de munir l'espace d'un repère et de calculer.

  - id: GE-8
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [accroche, orthogonalite, vocabulaire]
    primary_misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
    stem: >
      Les droites $(AG)$ et $(BD)$ du cube ne passent par aucun point commun
      (leurs représentations paramétriques n'ont pas de solution commune).
      Sachant cela, quel terme décrit correctement une éventuelle relation
      d'angle droit entre leurs directions ?
    type: mcq
    choices:
      - id: A
        text: "On ne peut employer aucun des deux mots, « orthogonales » et « perpendiculaires », tant que les droites ne se coupent pas."
        correct: false
        misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
        feedback: >
          L'orthogonalité, elle, ne demande aucune intersection : elle
          compare uniquement les directions, via le produit scalaire des
          vecteurs directeurs.
      - id: B
        text: "On peut dire qu'elles sont orthogonales (leurs directions sont perpendiculaires), mais pas qu'elles sont perpendiculaires, terme réservé aux droites sécantes."
        correct: true
      - id: C
        text: "On peut dire qu'elles sont perpendiculaires, puisque leurs vecteurs directeurs vérifient le test du produit scalaire nul — peu importe qu'elles se coupent ou non."
        correct: false
        misconception: mc.math.maths_geometrie_espace.orthogonal-vs-perpendiculaire
        feedback: >
          « Perpendiculaires » exige en plus que les droites se coupent
          réellement ; un produit scalaire nul entre directions ne suffit
          qu'à établir l'orthogonalité.
      - id: D
        text: "On peut dire qu'elles sont parallèles, puisqu'elles n'ont pas de point commun."
        correct: false
        misconception: mc.math.maths_geometrie_espace.colinearite-mal-testee
        feedback: >
          L'absence de point commun ne suffit pas à conclure au parallélisme
          : il faudrait en plus que les vecteurs directeurs soient
          colinéaires, ce qui n'est pas le cas ici.
    correct_feedback: >
      Sans intersection, on parle d'orthogonalité (directions perpendiculaires)
      et non de perpendicularité, réservée aux droites sécantes.
    solution: |
      **Nuance de vocabulaire (chapitre 3, reprise au chapitre 8) :** deux droites de
      l'espace peuvent avoir des directions orthogonales sans jamais se
      croiser. On dit alors « orthogonales », jamais « perpendiculaires ».

  - id: GE-9
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [accroche, methode, produit_scalaire]
    primary_misconception: mc.math.maths_geometrie_espace.perspective-fiable
    stem: >
      Pour trancher avec certitude si deux droites de l'espace comme $(AG)$
      et $(BD)$ ont des directions perpendiculaires, quelle est la méthode
      fiable ?
    type: mcq
    choices:
      - id: A
        text: "Mesurer l'angle apparent sur un dessin fait à main levée, en s'aidant d'une équerre posée sur la feuille."
        correct: false
        misconception: mc.math.maths_geometrie_espace.perspective-fiable
        feedback: >
          Une équerre posée sur un dessin en perspective mesure l'angle
          dessiné, pas l'angle réel dans l'espace — la perspective l'a déjà
          déformé.
      - id: B
        text: "Comparer les longueurs des deux diagonales : des diagonales de longueurs différentes sont automatiquement perpendiculaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          La longueur des segments n'a aucun lien avec l'orthogonalité de
          leurs directions.
      - id: C
        text: "Placer les points dans un repère, déterminer les coordonnées des vecteurs directeurs, puis calculer leur produit scalaire : il est nul si et seulement si les directions sont orthogonales."
        correct: true
      - id: D
        text: "Vérifier si les deux droites appartiennent à une même face du cube : deux droites d'une même face sont toujours perpendiculaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.raisonnement-spatial-naif
        feedback: >
          $(AG)$ n'est même pas dans une face du cube ; et l'appartenance à
          une même face ne garantit de toute façon aucune perpendicularité.
    correct_feedback: >
      Coordonnées, vecteurs directeurs, produit scalaire : c'est la seule
      méthode qui tranche sans dépendre d'un dessin.
    solution: |
      **Le programme de la leçon (chapitre 1) :** décrire les points par des
      coordonnées, puis calculer — produit scalaire compris — pour répondre
      sans ambiguïté à des questions que l'oeil ne peut pas trancher.

  # ── R1 · repère de l'espace : coordonnées, vecteurs, distances ─────────────
  - id: GE-10
    rung: "R1"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [distance, coordonnees]
    primary_misconception: mc.math.maths_geometrie_espace.distance-plane-en-espace
    stem: >
      On donne $A(1,-2,3)$ et $B(4,2,0)$. Que vaut $AB$ ?
    type: mcq
    choices:
      - id: A
        text: "$5$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.distance-plane-en-espace
        feedback: >
          Ce résultat oublie l'écart en $z$ ($0-3=-3$) et ne calcule que
          $\sqrt{3^2+4^2}$, comme dans le plan — il manque le second
          Pythagore, à la verticale.
      - id: B
        text: "$34$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          $34$ est $AB^2$, pas $AB$ : la racine carrée finale a été oubliée.
      - id: C
        text: "$10$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Ce résultat additionne $\sqrt{3^2}+\sqrt{4^2}+\sqrt{(-3)^2}=3+4+3$,
          en prenant la racine de chaque terme séparément, au lieu de
          sommer les carrés puis de prendre une seule racine à la fin.
      - id: D
        text: "$\\sqrt{34}$"
        correct: true
    correct_feedback: >
      $AB=\sqrt{(4-1)^2+(2+2)^2+(0-3)^2}=\sqrt{9+16+9}=\sqrt{34}$.
    solution: |
      **Formule de distance (chapitre 2) :**
      $$AB=\sqrt{(x_B-x_A)^2+(y_B-y_A)^2+(z_B-z_A)^2}=\sqrt{3^2+4^2+(-3)^2}=\sqrt{34}$$

  - id: GE-11
    rung: "R1"
    difficulty_level: 1
    skill_code: maths_geometrie_espace
    tags: [vecteur, coordonnees]
    primary_misconception: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
    stem: >
      On donne $A(2,-1,3)$ et $B(-1,4,0)$. Quelles sont les coordonnées du
      vecteur $\overrightarrow{AB}$ ?
    type: mcq
    choices:
      - id: A
        text: "$(-3,5,-3)$"
        correct: true
      - id: B
        text: "$(3,-5,3)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.vecteur-depart-moins-arrivee
        feedback: >
          Ce triplet calcule « départ moins arrivée » ($A-B$) au lieu de
          « arrivée moins départ » ($B-A$) : $\overrightarrow{AB}$ se
          calcule toujours coordonnée d'arrivée moins coordonnée de départ.
      - id: C
        text: "$(1,3,3)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Ce triplet additionne les coordonnées de $A$ et $B$ terme à terme
          au lieu de les soustraire — un vecteur $\overrightarrow{AB}$ se
          calcule toujours par une différence, jamais une somme.
      - id: D
        text: "$(-3,5,3)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Les deux premières coordonnées sont correctes, mais la troisième
          garde le signe de $z_A$ au lieu de faire $z_B-z_A=0-3=-3$.
    correct_feedback: >
      $\overrightarrow{AB}(x_B-x_A,\,y_B-y_A,\,z_B-z_A)=(-1-2,\,4+1,\,0-3)=(-3,5,-3)$.
    solution: |
      **Règle « arrivée moins départ » (chapitre 2) :**
      $$\overrightarrow{AB}=(x_B-x_A,\,y_B-y_A,\,z_B-z_A)=(-3,5,-3)$$

  - id: GE-12
    rung: "R1"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [norme, vecteur]
    primary_misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
    stem: >
      Soit $\vec{u}(2,-4,-4)$ un vecteur de l'espace. Que vaut $\|\vec{u}\|$ ?
    type: mcq
    choices:
      - id: A
        text: "$36$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-racine
        feedback: >
          $36$ est $\|\vec{u}\|^2$, pas $\|\vec{u}\|$ : la racine carrée
          finale a été oubliée.
      - id: B
        text: "$6$"
        correct: true
      - id: C
        text: "$-6$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Une norme n'est jamais négative ; ce résultat confond la norme
          avec une simple somme signée des coordonnées, $2-4-4=-6$.
      - id: D
        text: "$10$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.operation-vectorielle-comme-somme
        feedback: >
          Ce résultat additionne les valeurs absolues des coordonnées
          ($2+4+4=10$) au lieu d'appliquer $\sqrt{x^2+y^2+z^2}$.
    correct_feedback: >
      $\|\vec{u}\|=\sqrt{2^2+(-4)^2+(-4)^2}=\sqrt{4+16+16}=\sqrt{36}=6$.
    solution: |
      **Formule de la norme (chapitre 2) :**
      $$\|\vec{u}\|=\sqrt{x^2+y^2+z^2}=\sqrt{4+16+16}=\sqrt{36}=6$$

  # ── R2 · produit scalaire dans l'espace (suite) ─────────────────────────────
  - id: GE-13
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_scalaire, orthogonalite, parametre]
    primary_misconception: mc.math.maths_geometrie_espace.signe-arithmetique
    stem: >
      On donne $\vec{u}(2,m,-1)$ et $\vec{v}(3,-2,4)$. Pour quelle valeur de
      $m$ les vecteurs $\vec{u}$ et $\vec{v}$ sont-ils orthogonaux ?
    type: mcq
    choices:
      - id: A
        text: "$m=-1$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe en résolvant $2-2m=0$ : traitée comme
          $2+2m=0$, donnant $m=-1$ au lieu de $m=1$.
      - id: B
        text: "$m=2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Le coefficient de $m$ dans le produit scalaire est $-2$ (venant
          de $m\times(-2)$), pas $-1$ : l'équation a été résolue comme
          $2-m=0$ au lieu de $2-2m=0$.
      - id: C
        text: "$m=1$"
        correct: true
      - id: D
        text: "$m=5$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur le dernier terme : $(-1)\times4$ a été compté
          $+4$ au lieu de $-4$, donnant $10-2m=0$ (donc $m=5$) au lieu de
          $2-2m=0$ (donc $m=1$).
    correct_feedback: >
      $\vec{u}\cdot\vec{v}=2\times3+m\times(-2)+(-1)\times4=6-2m-4=2-2m$.
      Nul pour $m=1$.
    solution: |
      **Test d'orthogonalité (chapitre 3) :** $\vec{u}\cdot\vec{v}=0$
      $$6-2m-4=0 \implies 2-2m=0 \implies m=1$$

  - id: GE-14
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_scalaire, angle, norme]
    primary_misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
    stem: >
      On donne $\vec{u}(1,2,2)$ et $\vec{v}(2,-2,1)$, avec $\|\vec{u}\|=3$ et
      $\|\vec{v}\|=3$. Que vaut $\cos(\vec{u},\vec{v})$ ?
    type: mcq
    choices:
      - id: A
        text: "$9$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
        feedback: >
          $9=\|\vec{u}\|\times\|\vec{v}\|$ est le dénominateur de la
          formule, pas le cosinus : le produit scalaire (qui vaut $0$)
          n'a pas été calculé.
      - id: B
        text: "$1$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.scalaire-produit-incomplet
        feedback: >
          Ce résultat suppose $\vec{u}\cdot\vec{v}=\|\vec{u}\|\|\vec{v}\|=9$,
          comme si les vecteurs étaient colinéaires de même sens, au lieu de
          calculer réellement $\vec{u}\cdot\vec{v}=2-4+2=0$.
      - id: C
        text: "$\\dfrac{8}{9}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe : le terme $2\times(-2)$ a été compté $+4$ au
          lieu de $-4$, donnant $2+4+2=8$ au lieu de $2-4+2=0$.
      - id: D
        text: "$0$"
        correct: true
    correct_feedback: >
      $\vec{u}\cdot\vec{v}=1\times2+2\times(-2)+2\times1=2-4+2=0$, donc
      $\cos(\vec{u},\vec{v})=0/9=0$.
    solution: |
      **Produit scalaire puis formule du cosinus (chapitre 3) :**
      $$\vec{u}\cdot\vec{v}=2-4+2=0 \implies \cos(\vec{u},\vec{v})=\frac{0}{3\times3}=0$$

  # ── R3 · produit vectoriel (suite) ──────────────────────────────────────────
  - id: GE-15
    rung: "R3"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_vectoriel, coordonnees]
    primary_misconception: mc.math.maths_geometrie_espace.signe-arithmetique
    stem: >
      On donne $\vec{u}(1,3,-2)$ et $\vec{v}(2,0,4)$. Que vaut
      $\vec{u}\wedge\vec{v}$ ?
    type: mcq
    choices:
      - id: A
        text: "$(12,-8,-6)$"
        correct: true
      - id: B
        text: "$(12,8,-6)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur la deuxième composante : elle vaut
          $zx'-xz'=(-2)\times2-1\times4=-8$, pas $+8$.
      - id: C
        text: "$(12,-8,6)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur la troisième composante : elle vaut
          $xy'-yx'=1\times0-3\times2=-6$, pas $+6$.
      - id: D
        text: "$(-6,12,-8)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-vectoriel-ordre-composantes
        feedback: >
          Les trois composantes correctes ont été calculées mais placées
          dans le mauvais ordre (décalage circulaire) : la première
          composante correspond à $(y,z)$, la deuxième à $(z,x)$, la
          troisième à $(x,y)$.
    correct_feedback: >
      $\vec{u}\wedge\vec{v}=(3\times4-(-2)\times0,\ (-2)\times2-1\times4,\
      1\times0-3\times2)=(12,-8,-6)$.
    solution: |
      **Application directe de la formule (chapitre 4) :**
      $$\vec{u}\wedge\vec{v}=(yz'-zy',\ zx'-xz',\ xy'-yx')=(12,-8,-6)$$

  - id: GE-16
    rung: "R3"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [produit_vectoriel, orthogonalite]
    primary_misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
    stem: >
      Soit $\vec{u}$ et $\vec{v}$ deux vecteurs non colinéaires de l'espace,
      et $\vec{w}=\vec{u}\wedge\vec{v}$. Quelle affirmation est vraie ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{w}$ est colinéaire à $\\vec{u}$ et à $\\vec{v}$, puisqu'il est construit à partir d'eux."
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
        feedback: >
          Être « construit à partir de » deux vecteurs ne signifie pas être
          parallèle à eux : $\vec{w}$ est au contraire perpendiculaire aux
          deux.
      - id: B
        text: "$\\vec{w}$ est orthogonal à la fois à $\\vec{u}$ et à $\\vec{v}$."
        correct: true
      - id: C
        text: "$\\vec{w}$ est orthogonal à $\\vec{u}$ seulement, pas nécessairement à $\\vec{v}$."
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
        feedback: >
          La propriété (établie au chapitre 4 via $\vec{u}\cdot(\vec{u}\wedge\vec{v})=0$)
          vaut symétriquement pour $\vec{u}$ et pour $\vec{v}$, pas pour un
          seul des deux.
      - id: D
        text: "$\\vec{w}$ appartient toujours au plan formé par $\\vec{u}$ et $\\vec{v}$."
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
        feedback: >
          C'est l'inverse : $\vec{w}$ est normal à ce plan (perpendiculaire
          à lui), il n'y « vit » donc jamais.
    correct_feedback: >
      Par construction (chapitre 4), le produit vectoriel est orthogonal aux deux
      vecteurs de départ — c'est précisément ce qui le rend utile pour
      fabriquer une normale.
    solution: |
      **Propriété fondamentale du produit vectoriel (chapitre 4) :** on vérifie
      $\vec{u}\cdot(\vec{u}\wedge\vec{v})=0$ et $\vec{v}\cdot(\vec{u}\wedge\vec{v})=0$
      en développant les coordonnées : $\vec w$ est orthogonal à $\vec u$ et à $\vec v$.

  # ── R4 · produit mixte et volume (suite) ────────────────────────────────────
  - id: GE-17
    rung: "R4"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [produit_mixte, coplanarite]
    primary_misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
    stem: >
      Trois vecteurs $\vec{u}$, $\vec{v}$, $\vec{w}$ vérifient
      $[\vec{u},\vec{v},\vec{w}]=0$. Que peut-on en conclure ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{u}$, $\\vec{v}$, $\\vec{w}$ sont deux à deux orthogonaux."
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
        feedback: >
          L'orthogonalité se teste avec le produit SCALAIRE de deux
          vecteurs, pas avec le produit mixte de trois vecteurs.
      - id: B
        text: "$\\vec{u}$, $\\vec{v}$, $\\vec{w}$ sont deux à deux colinéaires."
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
        feedback: >
          La colinéarité deux à deux est une condition bien plus forte que
          la coplanarité : trois vecteurs peuvent être coplanaires sans
          qu'aucune paire ne soit colinéaire.
      - id: C
        text: "$\\vec{u}$, $\\vec{v}$, $\\vec{w}$ sont coplanaires."
        correct: true
      - id: D
        text: "Au moins un des trois vecteurs est nul."
        correct: false
        misconception: mc.math.maths_geometrie_espace.produit-mixte-conclusion-erronee
        feedback: >
          Contrairement à une multiplication de nombres, un produit mixte
          nul n'oblige aucun des trois vecteurs à être nul — trois vecteurs
          non nuls et coplanaires suffisent.
    correct_feedback: >
      $[\vec{u},\vec{v},\vec{w}]=0$ signifie que le « parallélépipède »
      construit sur les trois vecteurs est aplati (volume nul) : ils sont
      coplanaires.
    solution: |
      **Conséquence directe du chapitre 5 :** un produit mixte nul donne un volume
      nul, donc un parallélépipède aplati — les trois vecteurs sont
      coplanaires.

  - id: GE-18
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [produit_mixte, volume, tetraedre]
    primary_misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
    stem: >
      Un tétraèdre $ABCD$ a pour arêtes $\overrightarrow{AB}(1,0,0)$,
      $\overrightarrow{AC}(0,3,0)$, $\overrightarrow{AD}(0,0,-4)$. Sachant
      que $\overrightarrow{AB}\wedge\overrightarrow{AC}=(0,0,3)$, quel est
      le volume du tétraèdre $ABCD$ ?
    type: mcq
    choices:
      - id: A
        text: "$-2$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.oubli-valeur-absolue
        feedback: >
          Le volume est $\frac16$ de la VALEUR ABSOLUE du produit mixte ;
          la valeur absolue autour de $[\vec u,\vec v,\vec w]=-12$ a été
          oubliée.
      - id: B
        text: "$12$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
        feedback: >
          $12$ est le volume du PARALLÉLÉPIPÈDE (la valeur absolue du
          produit mixte), pas celui du tétraèdre — il manque le facteur
          $\frac16$.
      - id: C
        text: "$4$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.volume-facteur-oubli
        feedback: >
          Seul le facteur $\frac13$ (pyramide) a été appliqué, en oubliant
          le facteur $\frac12$ (base triangulaire) : $\frac13\times12=4$
          au lieu de $\frac16\times12=2$.
      - id: D
        text: "$2$"
        correct: true
    correct_feedback: >
      $[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}]=(0,0,3)\cdot(0,0,-4)=-12$,
      donc $V=\frac16\times|-12|=2$.
    solution: |
      **Produit mixte puis volume (chapitre 5) :**
      $$[\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}]=(0,0,3)\cdot(0,0,-4)=-12$$
      $$V_{ABCD}=\frac16\times|-12|=2$$

  # ── R5 · représentations paramétrique et cartésienne d'une droite ──────────
  - id: GE-19
    rung: "R5"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [droite, representation_parametrique, vecteur_directeur]
    primary_misconception: mc.math.maths_geometrie_espace.directeur-vs-point
    stem: >
      Une droite $\mathcal D$ a pour représentation paramétrique
      $\begin{cases} x=1-2t \\ y=3+t \\ z=-4t \end{cases}$, $t\in\mathbb R$.
      Quel est un vecteur directeur de $\mathcal D$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\vec{u}(-2,1,-4)$"
        correct: true
      - id: B
        text: "$\\vec{u}(1,3,0)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.directeur-vs-point
        feedback: >
          Ce triplet est le POINT de $\mathcal D$ obtenu pour $t=0$, pas le
          vecteur directeur : celui-ci est donné par les coefficients de
          $t$, pas par les termes constants.
      - id: C
        text: "$\\vec{u}(2,1,4)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur les coefficients de $x$ et de $z$ : ils
          valent $-2$ et $-4$ dans les équations données, pas $+2$ et $+4$.
      - id: D
        text: "$\\vec{u}(-2,1,4)$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur la seule composante $z$ : le coefficient de
          $t$ dans $z=-4t$ est $-4$, pas $+4$.
    correct_feedback: >
      Le vecteur directeur est formé par les coefficients de $t$ dans
      chaque équation : $\vec{u}(-2,1,-4)$.
    solution: |
      **Lecture directe de la représentation paramétrique (chapitre 6) :** les
      coefficients de $t$ donnent le vecteur directeur $\vec u(-2,1,-4)$.

  - id: GE-20
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_geometrie_espace
    tags: [droite, equation_cartesienne, vecteur_directeur]
    primary_misconception: mc.math.maths_geometrie_espace.directeur-vs-point
    stem: >
      La droite $\mathcal D$ passe par $A(2,4,-1)$ avec pour vecteur
      directeur $\vec{u}(3,-1,5)$ (aucune coordonnée nulle). Quelle est la
      forme cartésienne (symétrique) de $\mathcal D$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{x+2}{3}=\\dfrac{y-4}{-1}=\\dfrac{z-1}{5}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe aux numérateurs en $x$ et en $z$ : il faut
          $x-x_A=x-2$ (pas $x+2$) et $z-z_A=z+1$ (pas $z-1$).
      - id: B
        text: "$\\dfrac{x-2}{3}=\\dfrac{y-4}{-1}=\\dfrac{z+1}{5}$"
        correct: true
      - id: C
        text: "$\\dfrac{x-3}{2}=\\dfrac{y+1}{4}=\\dfrac{z-5}{-1}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.directeur-vs-point
        feedback: >
          Les rôles de $A$ et de $\vec u$ ont été échangés : les
          numérateurs doivent contenir les coordonnées de $A$, les
          dénominateurs celles de $\vec u$ — pas l'inverse.
      - id: D
        text: "$\\dfrac{x-2}{-1}=\\dfrac{y-4}{3}=\\dfrac{z+1}{5}$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.directeur-vs-point
        feedback: >
          Les deux premières coordonnées du vecteur directeur ont été
          échangées : le dénominateur en $x$ doit être $3$ (première
          coordonnée de $\vec u$), celui en $y$ doit être $-1$.
    correct_feedback: >
      Numérateurs = coordonnées de $A$ soustraites ; dénominateurs =
      coordonnées de $\vec u$ : $\dfrac{x-2}{3}=\dfrac{y-4}{-1}=\dfrac{z+1}{5}$.
    solution: |
      **Isoler $t$ dans les trois équations paramétriques (chapitre 6) :**
      $$\frac{x-2}{3}=\frac{y-4}{-1}=\frac{z+1}{5}$$

  - id: GE-21
    rung: "R5"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [droite, representation_parametrique, appartenance]
    primary_misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
    stem: >
      La droite $\mathcal D$ a pour représentation paramétrique
      $\begin{cases}x=1+2t\\y=-1+t\\z=3-t\end{cases}$. Le point $M(5,1,1)$
      appartient-il à $\mathcal D$ ?
    type: mcq
    choices:
      - id: A
        text: "Non, car aucune valeur de $t$ ne convient."
        correct: false
        misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
        feedback: >
          C'est faux : $t=2$ vérifie bien les trois équations à la fois
          ($1+4=5$, $-1+2=1$, $3-2=1$).
      - id: B
        text: "Oui, car il existe une valeur de $t$ qui convient pour chaque équation séparément — peu importe si c'est la même valeur à chaque fois."
        correct: false
        misconception: mc.math.maths_geometrie_espace.appartenance-t-non-simultane
        feedback: >
          C'est l'erreur classique : il faut UNE SEULE valeur de $t$ qui
          vérifie les trois équations SIMULTANÉMENT, pas une valeur
          différente pour chacune.
      - id: C
        text: "Oui : $t=2$ vérifie à la fois $x=1+2t=5$, $y=-1+t=1$ et $z=3-t=1$ — la même valeur de $t$ dans les trois équations."
        correct: true
      - id: D
        text: "On ne peut pas savoir sans connaître un vecteur normal à la droite."
        correct: false
        misconception: mc.math.maths_geometrie_espace.normal-vs-directeur
        feedback: >
          Une droite n'a pas de « vecteur normal » (notion réservée aux
          plans, chapitre 7) : pour une droite, on utilise le vecteur directeur et
          une valeur commune du paramètre $t$.
    correct_feedback: >
      $t=2$ satisfait simultanément les trois équations : $M$ appartient
      bien à $\mathcal D$.
    solution: |
      **Test d'appartenance (chapitre 6) :** on cherche une seule valeur de $t$
      commune aux trois équations. $t=2$ convient partout : $M\in\mathcal D$.

  # ── R6 · plan : équation à partir de point+normal, et à partir de 3 points ─
  - id: GE-22
    rung: "R6"
    difficulty_level: 2
    skill_code: maths_geometrie_espace
    tags: [plan, vecteur_normal, equation_cartesienne]
    primary_misconception: mc.math.maths_geometrie_espace.plan-constante-mal-determinee
    stem: >
      Le plan $\mathcal P$ passe par $A(1,-2,3)$ et admet pour vecteur normal
      $\vec{n}(2,-1,4)$. Quelle est une équation cartésienne de $\mathcal P$ ?
    type: mcq
    choices:
      - id: A
        text: "$2x-y+4z-16=0$"
        correct: true
      - id: B
        text: "$2x-y+4z+16=0$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Signe oublié devant la constante $d=-(ax_0+by_0+cz_0)$ : ça donne
          $+16$ au lieu de $-16$.
      - id: C
        text: "$2x-y+4z-2=0$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.plan-constante-mal-determinee
        feedback: >
          La constante a été calculée comme la somme brute des coordonnées
          de $A$ ($1-2+3=2$), au lieu de $ax_0+by_0+cz_0=16$.
      - id: D
        text: "$2x+y+4z-12=0$"
        correct: false
        misconception: mc.math.maths_geometrie_espace.signe-arithmetique
        feedback: >
          Erreur de signe sur la composante $y$ du vecteur normal ($+1$ au
          lieu de $-1$), ce qui change aussi la constante.
    correct_feedback: >
      $2(x-1)-1(y+2)+4(z-3)=0$ développe en $2x-y+4z-16=0$ : coefficients
      = coordonnées de $\vec n$, constante déterminée ensuite avec $A$.
    solution: |
      $2(x-1)-(y+2)+4(z-3)=0 \implies 2x-y+4z-16=0$.

  - id: GE-23
