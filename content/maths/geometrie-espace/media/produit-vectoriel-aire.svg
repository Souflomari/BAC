<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Deux vecteurs u et v depuis une origine commune O ; le parallélogramme qu’ils engendrent, avec la hauteur perpendiculaire abaissée de l’extrémité de v sur la droite portant u, et l’angle thêta marqué en O ; puis le produit vectoriel u vecteur v dressé perpendiculairement au plan, avec des angles droits vers u et vers v, illustrant que sa norme est l’aire du parallélogramme.">
  <title>Le produit vectoriel : un vecteur perpendiculaire, et une aire</title>
  <!--
    produit-vectoriel-aire.svg — figure du R3.
    Convention de projection : le plan engendré par u⃗ et v⃗ est représenté
    en perspective cavalière EXACTEMENT comme le plan de plan-normal.svg :
    u⃗ le long de l'axe horizontal (vraie grandeur, 0°), v⃗ le long de
    l'axe de profondeur (incliné 45°, réduction 0,5). L'angle θ dessiné
    entre u⃗ et v⃗ (45°) n'est donc pas fidèle à l'angle réel θ dans le
    plan — même imprécision acceptée, divulguée, que dans plan-normal.svg
    entre n⃗ et l'arête de profondeur ; c'est pourquoi θ est marqué par un
    arc et une étiquette plutôt que présenté comme un angle mesurable au
    rapporteur sur ce dessin.
    Le vecteur u⃗∧v⃗ (étape 3) est dressé verticalement depuis O, vraie
    grandeur — comme le vecteur normal n⃗ de plan-normal.svg. L'angle
    droit avec u⃗ (horizontal, vraie grandeur) est donc réel et carré à
    l'écran ; l'angle droit avec v⃗ (profondeur, réduite à 45°) est réel
    dans l'espace mais pas carré à l'écran — même convention.
    Focus accent : la hauteur ‖v⃗‖sinθ (étape 2) puis le vecteur u⃗∧v⃗
    lui-même (étape 3) — l'idée que sa norme mesure une aire.

    Mise en étapes (StagedFigure) — 3 couches, le geste exact du R3 :
    les deux vecteurs, puis le parallélogramme qu'ils engendrent (avec sa
    base et sa hauteur), puis le vecteur perpendiculaire dont la norme
    est cette aire.
    step-1 : u⃗, v⃗, depuis O.
    step-2 : + le parallélogramme, la hauteur ‖v⃗‖sinθ, l'angle θ.
    step-3 : + u⃗∧v⃗, dressé perpendiculairement, angles droits marqués.
  -->
  <rect width="640" height="460" fill="var(--figure-surface)"/>

  <g id="step-1">
    <circle cx="220" cy="360" r="3.5" fill="var(--figure-ink)"/>
    <text x="200" y="380" font-size="15" font-style="italic" fill="var(--figure-ink)">O</text>

    <!-- ── u⃗, vraie grandeur, horizontal ─────────────────────────────────  -->
    <line x1="220" y1="360" x2="378" y2="360" stroke="var(--figure-ink)" stroke-width="2.2"/>
    <polygon points="390,360 378,355 378,365" fill="var(--figure-ink)"/>
    <line x1="300" y1="336" x2="312" y2="336" stroke="var(--figure-ink)" stroke-width="1.3"/>
    <polyline points="308,333 312,336 308,339" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>
    <text x="298" y="356" font-size="16" font-style="italic" fill="var(--figure-ink)">u</text>

    <!-- ── v⃗, profondeur, 45° réduit ─────────────────────────────────────  -->
    <line x1="220" y1="360" x2="317" y2="263" stroke="var(--figure-ink)" stroke-width="2.2"/>
    <polygon points="325,255 320,267 313,260" fill="var(--figure-ink)"/>
    <line x1="255" y1="290" x2="267" y2="290" stroke="var(--figure-ink)" stroke-width="1.3"/>
    <polyline points="263,287 267,290 263,293" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>
    <text x="240" y="285" font-size="16" font-style="italic" fill="var(--figure-ink)">v</text>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!-- ── Le parallélogramme engendré par u⃗, v⃗ ──────────────────────────  -->
    <!-- fill="none", et surtout PAS --figure-surface : les étapes sont
         CUMULATIVES (StagedFigure : `wanted = fullyRevealed || n <= stage`),
         donc ce remplissage blanc était peint PAR-DESSUS le step-1 et
         effaçait l'étiquette « u » du vecteur, à l'instant précis où la
         leçon dit « le parallélogramme engendré par u et v ». Blanc sur
         blanc : invisible à la relecture, décisif pour l'élève. Mesuré le
         2026-09-04 par le retrait du texte (l'image ne changeait pas). -->
    <path d="M 220 360 L 390 360 L 495 255 L 325 255 Z"
          fill="none" stroke="var(--figure-grid)" stroke-width="1.5"/>

    <!-- ── Hauteur, accent : ‖v⃗‖ sin θ ────────────────────────────────────  -->
    <line x1="325" y1="255" x2="325" y2="360" stroke="var(--figure-accent)" stroke-width="2.2" stroke-dasharray="5 4"/>
    <path d="M 313 360 L 313 348 L 325 348" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>
    <text x="332" y="315" font-size="13" font-style="italic" fill="var(--figure-accent)">||v|| sin&#952;</text>

    <!-- ── Angle θ en O ───────────────────────────────────────────────────  -->
    <path d="M 260 360 A 40 40 0 0 0 248.3 331.7" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="264" y="345" font-size="14" font-style="italic" fill="var(--figure-ink-soft)">&#952;</text>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- ── u⃗∧v⃗, dressé perpendiculairement au plan, accent ───────────────  -->
    <line x1="220" y1="360" x2="220" y2="222" stroke="var(--figure-accent)" stroke-width="2.6"/>
    <polygon points="220,210 214,222 226,222" fill="var(--figure-accent)"/>
    <line x1="240" y1="240" x2="252" y2="240" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <polyline points="248,237 252,240 248,243" fill="none" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <text x="234" y="260" font-size="15" font-style="italic" fill="var(--figure-accent)">u&#8743;v</text>

    <!-- ── Angle droit avec u⃗ (réel et carré à l'écran) ──────────────────  -->
    <path d="M 240 360 L 240 340 L 220 340" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>

    <!-- ── Angle droit avec v⃗ (réel dans l'espace, non carré à l'écran) ── -->
    <path d="M 230 350 L 230 336 L 220 346" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>

    <text x="234" y="205" font-size="12" fill="var(--figure-ink-soft)">||u&#8743;v|| = aire</text>
  </g><!-- /step-3 -->
</svg>
