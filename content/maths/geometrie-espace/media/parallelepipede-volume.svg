<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Le parallélogramme de base engendré par u et v, avec u vecteur v dressé perpendiculairement ; un troisième vecteur w depuis O, dont la projection sur la direction de u vecteur v donne une hauteur h (segment en pointillé, angle droit marqué) ; puis le parallélépipède complet construit sur u, v, w, arêtes cachées en pointillé, illustrant que son volume est l'aire de la base multipliée par h.">
  <title>Produit mixte et volume : aire de base fois hauteur</title>
  <!--
    parallelepipede-volume.svg — figure du R4.
    Reprend exactement la géométrie de produit-vectoriel-aire.svg (u⃗
    horizontal vraie grandeur, v⃗ à 45° réduit, u⃗∧v⃗ vertical vraie
    grandeur depuis O) — même convention, même imprécision acceptée pour
    les angles impliquant v⃗ ou la direction de w⃗ (divulguée dans ce
    fichier et dans produit-vectoriel-aire.svg).

    w⃗ est un troisième vecteur depuis O, hors du plan de u⃗,v⃗. Sa
    projection sur la direction de u⃗∧v⃗ (verticale) est simplement sa
    composante verticale — le pied de cette projection est donc le point
    à la même hauteur que w⃗, sur la droite verticale passant par O. Le
    segment « h », en accent, est tracé en ligne de cote (décalé à
    gauche, avec de petites attaches horizontales) pour ne pas se
    confondre avec le vecteur u⃗∧v⃗ lui-même, bien qu'ils soient
    géométriquement colinéaires.

    Visibilité du parallélépipède complet (étape 3) : par le même calcul
    de convexité que pour le cube (cube-diagonales.svg), le sommet
    « sommet+u+v+w » (coin opposé à O) est le seul appartenant aux 3
    faces cachées — ses 3 arêtes sont en pointillé ; les 9 autres,
    dont toutes celles de O, sont visibles.
    Simplification délibérée : le tétraèdre intérieur (mentionné comme
    optionnel dans la consigne) n'est pas ombré ici, pour ne pas alourdir
    une figure déjà dense en arêtes (principe de cohérence, DESIGN-BIBLE
    §6) — la leçon décrit le lien de volume en mots, ce schéma montre le
    parallélépipède lui-même.

    Mise en étapes (StagedFigure) — 3 couches, le geste exact du R4 :
    la base et sa normale (rappel du R3), puis le troisième vecteur et la
    hauteur qu'il projette, puis le solide complet.
    step-1 : base (u⃗,v⃗) + u⃗∧v⃗ dressé (rappel).
    step-2 : + w⃗, sa projection (pointillé, angle droit), et h (accent).
    step-3 : + le parallélépipède complet (arêtes visibles/cachées).
  -->
  <rect width="640" height="460" fill="var(--figure-surface)"/>

  <g id="step-1">
    <circle cx="180" cy="380" r="3.5" fill="var(--figure-ink)"/>
    <text x="160" y="400" font-size="14" font-style="italic" fill="var(--figure-ink)">O</text>

    <!-- ── Base : parallélogramme engendré par u⃗, v⃗ ──────────────────────  -->
    <path d="M 180 380 L 350 380 L 455 275 L 285 275 Z"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.5"/>

    <line x1="180" y1="380" x2="340" y2="380" stroke="var(--figure-ink)" stroke-width="2"/>
    <polygon points="350,380 340,375 340,385" fill="var(--figure-ink)"/>
    <text x="255" y="398" font-size="15" font-style="italic" fill="var(--figure-ink)">u</text>

    <line x1="180" y1="380" x2="278" y2="282" stroke="var(--figure-ink)" stroke-width="2"/>
    <polygon points="285,275 280,287 273,280" fill="var(--figure-ink)"/>
    <text x="212" y="310" font-size="15" font-style="italic" fill="var(--figure-ink)">v</text>

    <!-- ── u⃗∧v⃗, rappel du R3, vertical vraie grandeur ────────────────────  -->
    <line x1="180" y1="380" x2="180" y2="240" stroke="var(--figure-ink)" stroke-width="2"/>
    <polygon points="180,230 175,240 185,240" fill="var(--figure-ink)"/>
    <text x="150" y="235" font-size="13" font-style="italic" fill="var(--figure-ink)">u&#8743;v</text>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!-- ── w⃗, troisième vecteur, depuis O ─────────────────────────────────  -->
    <line x1="180" y1="380" x2="245" y2="218" stroke="var(--figure-ink)" stroke-width="2.2"/>
    <polygon points="250,210 238,215 244,224" fill="var(--figure-ink)"/>
    <text x="256" y="212" font-size="15" font-style="italic" fill="var(--figure-ink)">w</text>

    <!-- ── Projection de w⃗ sur la direction de u⃗∧v⃗ (pointillé) ──────────── -->
    <line x1="250" y1="210" x2="180" y2="210" stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="M 190 210 L 190 220 L 180 220" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>

    <!-- ── h, ligne de cote décalée, accent ────────────────────────────── -->
    <line x1="150" y1="380" x2="180" y2="380" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <line x1="150" y1="210" x2="180" y2="210" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <line x1="150" y1="380" x2="150" y2="210" stroke="var(--figure-accent)" stroke-width="2.4"/>
    <text x="122" y="300" font-size="16" font-style="italic" fill="var(--figure-accent)">h</text>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- ── Sommets du haut ────────────────────────────────────────────────  -->
    <!-- O' = W(250,210) déjà marqué comme extrémité de w⃗. -->
    <circle cx="420" cy="210" r="3" fill="var(--figure-ink)"/>
    <circle cx="355" cy="105" r="3" fill="var(--figure-ink)"/>
    <circle cx="525" cy="105" r="3" fill="var(--figure-ink-soft)"/>

    <!-- ── Arêtes visibles complétant le solide ──────────────────────────  -->
    <line x1="350" y1="380" x2="420" y2="210" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="285" y1="275" x2="355" y2="105" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="250" y1="210" x2="420" y2="210" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="250" y1="210" x2="355" y2="105" stroke="var(--figure-ink)" stroke-width="2"/>

    <!-- ── Arêtes cachées (touchant le sommet opposé à O) ────────────────── -->
    <line x1="455" y1="275" x2="525" y2="105" stroke="var(--figure-ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="420" y1="210" x2="525" y2="105" stroke="var(--figure-ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="355" y1="105" x2="525" y2="105" stroke="var(--figure-ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>

    <text x="380" y="440" font-size="14" fill="var(--figure-ink)">V = (aire base) &#215; h</text>
  </g><!-- /step-3 -->
</svg>
