<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Un plan P dessiné en perspective cavalière (parallélogramme), un point A zéro du plan, le vecteur normal n élevé perpendiculairement depuis A zéro (angle droit marqué), et un point M quelconque du plan relié à A zéro par le vecteur A zéro M, illustrant l'équation n scalaire A zéro M égale zéro.">
  <title>Le plan : point, vecteur normal et point courant M</title>
  <!--
    plan-normal.svg — figure du R6 (« Un plan, défini par un point et une
    perpendiculaire »).
    Convention de projection, DIVULGUÉE ici (perspective cavalière) :
    - axe horizontal (direction e1 du plan) : vraie grandeur, angle 0°.
    - axe de profondeur (direction e2 du plan) : incliné à 45°, coefficient
      de réduction 0,5 — seulement décoratif ici (il sert à donner au
      parallélogramme son effet de profondeur ; aucune longueur n'est lue
      dessus).
    - la normale n⃗ est tracée verticale, à la vraie grandeur (l'axe
      vertical, comme l'axe horizontal e1, n'est PAS réduit en perspective
      cavalière). L'angle droit marqué entre n⃗ et l'arête horizontale du
      plan (parallèle à e1) est donc un angle droit exact sur le dessin —
      pas une approximation — puisque les deux directions comparées sont
      toutes deux à la vraie grandeur. Seul l'angle entre n⃗ et l'arête de
      profondeur (e2, réduite et inclinée) n'est pas fidèle à l'oeil ; c'est
      l'imprécision standard, acceptée, de toute perspective cavalière (la
      même que pour les arêtes verticales d'un cube en perspective).
    Focus accent : le vecteur normal n⃗ et l'angle droit qu'il forme avec le
    plan — une seule idée, répétée dans le vecteur, la marque d'angle droit
    et l'étiquette.
  -->
  <rect width="720" height="440" fill="var(--figure-surface)"/>

  <!-- ── Le plan P, en perspective cavalière ─────────────────────────── -->
  <path d="M 130 340 L 510 340 L 582 268 L 202 268 Z"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.5"/>
  <text x="505" y="300" font-size="16" fill="var(--figure-ink-soft)">(<tspan font-style="italic">P</tspan>)</text>

  <!-- ── Le vecteur normal n⃗, vertical, vraie grandeur (ACCENT) ──────── -->
  <line x1="284" y1="300" x2="284" y2="182" stroke="var(--figure-accent)" stroke-width="2.5"/>
  <polygon points="284,170 279,182 289,182" fill="var(--figure-accent)"/>
  <!-- glyphe vectoriel (petite flèche) au-dessus de la lettre n -->
  <line x1="300" y1="190" x2="312" y2="190" stroke="var(--figure-accent)" stroke-width="1.3"/>
  <polyline points="308,187 312,190 308,193" fill="none" stroke="var(--figure-accent)" stroke-width="1.3"/>
  <text x="302" y="210" font-size="16" font-style="italic" fill="var(--figure-accent)">n</text>

  <!-- ── Angle droit entre n⃗ et l'arête horizontale du plan (ACCENT) ──── -->
  <path d="M 298 300 L 298 286 L 284 286" fill="none" stroke="var(--figure-accent)" stroke-width="1.3"/>

  <!-- ── Le vecteur A₀M, dans le plan (ink, pas le focus) ─────────────── -->
  <line x1="284" y1="300" x2="404" y2="323" stroke="var(--figure-ink)" stroke-width="2.2"/>
  <polygon points="418,326 403,329 406,317" fill="var(--figure-ink)"/>
  <!-- glyphe vectoriel au-dessus de l'étiquette A₀M -->
  <line x1="322" y1="272" x2="354" y2="272" stroke="var(--figure-ink)" stroke-width="1.3"/>
  <polyline points="350,269 354,272 350,275" fill="none" stroke="var(--figure-ink)" stroke-width="1.3"/>
  <text x="322" y="292" font-size="15" font-style="italic" fill="var(--figure-ink)">A<tspan dy="3" font-size="70%">0</tspan><tspan dy="-3">M</tspan></text>

  <!-- ── Points A₀ et M ────────────────────────────────────────────────  -->
  <circle cx="284" cy="300" r="4" fill="var(--figure-ink)"/>
  <text x="246" y="298" font-size="16" font-style="italic" fill="var(--figure-ink)">A<tspan dy="4" font-size="70%">0</tspan></text>

  <circle cx="418" cy="326" r="4" fill="var(--figure-ink)"/>
  <text x="428" y="334" font-size="16" font-style="italic" fill="var(--figure-ink)">M</text>
  <text x="428" y="350" font-size="11" fill="var(--figure-ink-soft)">point quelconque de (<tspan font-style="italic">P</tspan>)</text>

  <!-- ── Lecture de la figure ──────────────────────────────────────────  -->
  <text x="360" y="422" text-anchor="middle" font-size="13" fill="var(--figure-ink-soft)">
    <tspan font-style="italic">M</tspan><tspan> &#8712; (</tspan><tspan font-style="italic">P</tspan><tspan>)   &#8660;   </tspan><tspan font-style="italic">n</tspan><tspan> &#183; </tspan><tspan font-style="italic">A</tspan><tspan font-style="italic" dy="3" font-size="70%">0</tspan><tspan font-style="italic" dy="-3">M</tspan><tspan> = 0</tspan>
  </text>
</svg>
