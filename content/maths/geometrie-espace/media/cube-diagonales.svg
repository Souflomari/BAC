<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Un cube ABCDEFGH en perspective cavalière, ABCD la face du bas, EFGH la face du haut, E au-dessus de A, F au-dessus de B, G au-dessus de C, H au-dessus de D, arêtes visibles en trait plein et arêtes cachées en pointillé ; la grande diagonale AG tracée d'un coin à son coin opposé, puis la diagonale de la face du bas BD, avec une marque « perpendiculaire, question » près de leur croisement apparent sur le dessin.">
  <title>Le cube ABCDEFGH : la diagonale (AG) et la diagonale (BD) semblent-elles perpendiculaires ?</title>
  <!--
    cube-diagonales.svg — figure du R0 (accroche : la diagonale du cube).
    Convention de projection, DIVULGUÉE ici (perspective cavalière, comme
    plan-normal.svg / sphere-plan.svg) :
    - axe horizontal (arête AB) : vraie grandeur, angle 0°.
    - axe de profondeur (arête AD) : incliné à 45°, coefficient de
      réduction 0,5.
    - axe vertical (arête AE) : vraie grandeur, tracé strictement vertical
      (E au-dessus de A, F au-dessus de B, etc.).
    Sommets (unités abstraites x=AB, y=AD, z=AE, échelle 150px/unité pour
    x,z et vecteur profondeur (53,-53) pour y) :
      A(0,0,0) B(1,0,0) C(1,1,0) D(0,1,0) E(0,0,1) F(1,0,1) G(1,1,1) H(0,1,1)
    Visibilité (calcul de convexité, pas une convention arbitraire) : le
    sommet D(0,1,0) est le seul sommet appartenant aux 3 faces cachées
    (bas z=0, arrière y=1, gauche x=0) — c'est donc le sommet caché, et
    ses 3 arêtes (AD, DC, DH) sont en pointillé ; les 9 autres arêtes,
    dont toutes celles de A, sont visibles.
    Fait structurel à noter (pas une erreur) : avec vraie-grandeur égale
    sur les axes x et z, la diagonale (AG) — segment (t,t,t) — a pour
    projection une droite de pente -1 ; tout point de coordonnées (x,y,z)
    avec x=z se projette EXACTEMENT sur cette droite. C'est le cas de D
    (x=0,z=0) et de F (x=1,z=1) : sur ce dessin précis, (AG) passe
    exactement par le pixel de D. C'est un artefact structurel de la
    perspective cavalière à échelle égale (pas un bug de ce fichier) —
    et c'est exactement l'illustration recherchée par le R0 : « à l'oeil,
    la perspective ment ».
    Focus accent : les deux diagonales (AG) et (BD), seuls éléments en
    couleur d'accent — une seule idée, répétée dans les deux segments et
    la marque « ⊥ ? ».

    Mise en étapes (StagedFigure) — schéma à 3 couches, l'ordre exact de
    l'accroche R0 : le cube d'abord (le décor), puis la grande diagonale,
    puis la diagonale de la face qu'on lui compare.
    step-1 : le cube ABCDEFGH, arêtes visibles/cachées, sommets étiquetés.
    step-2 : + la diagonale (AG).
    step-3 : + la diagonale (BD) et la marque « ⊥ ? » près de leur
             croisement apparent.
  -->
  <rect width="640" height="460" fill="var(--figure-surface)"/>

  <g id="step-1">
    <!-- ── Arêtes cachées (pointillé), touchant D ───────────────────────── -->
    <line x1="230" y1="400" x2="283" y2="347" stroke="var(--figure-ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="283" y1="347" x2="433" y2="347" stroke="var(--figure-ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="283" y1="347" x2="283" y2="197" stroke="var(--figure-ink-soft)" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- ── Arêtes visibles (trait plein) ─────────────────────────────────  -->
    <line x1="230" y1="400" x2="380" y2="400" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="380" y1="400" x2="433" y2="347" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="230" y1="250" x2="380" y2="250" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="380" y1="250" x2="433" y2="197" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="433" y1="197" x2="283" y2="197" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="283" y1="197" x2="230" y2="250" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="230" y1="400" x2="230" y2="250" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="380" y1="400" x2="380" y2="250" stroke="var(--figure-ink)" stroke-width="2"/>
    <line x1="433" y1="347" x2="433" y2="197" stroke="var(--figure-ink)" stroke-width="2"/>

    <!-- ── Sommets ────────────────────────────────────────────────────────  -->
    <circle cx="230" cy="400" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="380" cy="400" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="433" cy="347" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="283" cy="347" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="230" cy="250" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="380" cy="250" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="433" cy="197" r="3.5" fill="var(--figure-ink)"/>
    <circle cx="283" cy="197" r="3.5" fill="var(--figure-ink)"/>

    <text x="206" y="420" font-size="16" font-style="italic" fill="var(--figure-ink)">A</text>
    <text x="388" y="420" font-size="16" font-style="italic" fill="var(--figure-ink)">B</text>
    <text x="446" y="354" font-size="16" font-style="italic" fill="var(--figure-ink)">C</text>
    <text x="252" y="336" font-size="16" font-style="italic" fill="var(--figure-ink)">D</text>
    <text x="204" y="246" font-size="16" font-style="italic" fill="var(--figure-ink)">E</text>
    <text x="390" y="246" font-size="16" font-style="italic" fill="var(--figure-ink)">F</text>
    <text x="446" y="200" font-size="16" font-style="italic" fill="var(--figure-ink)">G</text>
    <text x="266" y="182" font-size="16" font-style="italic" fill="var(--figure-ink)">H</text>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!-- ── La grande diagonale (AG), accent ─────────────────────────────── -->
    <line x1="230" y1="400" x2="433" y2="197" stroke="var(--figure-accent)" stroke-width="2.5"/>
    <text x="308" y="286" font-size="14" fill="var(--figure-accent)">(<tspan font-style="italic">AG</tspan>)</text>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- ── La diagonale de la face du bas (BD), accent ──────────────────── -->
    <line x1="380" y1="400" x2="283" y2="347" stroke="var(--figure-accent)" stroke-width="2.5"/>
    <text x="352" y="388" font-size="14" fill="var(--figure-accent)">(<tspan font-style="italic">BD</tspan>)</text>

    <!-- ── Marque « ⊥ ? » près du croisement apparent des deux diagonales
         (sur ce dessin précis, elles se frôlent tout près de D — voir la
         note structurelle en tête de fichier) ──────────────────────────── -->
    <circle cx="301" cy="329" r="15" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="322" y="315" font-size="16" fill="var(--figure-ink)">&#8869; ?</text>
    <!-- La glose descend dans la marge gauche, reliée par une amorce. Posée
         à droite du cercle, « (mais aucun point commun) » courait jusqu'à
         x≈472 et traversait le sommet C (recouvrement mesuré 58 %) : le seul
         cas du relevé du 2026-09-03 qui avait été ouvert, et il était réel.
         « ⊥ ? » reste au contact du cercle, là où la question se pose. -->
    <line x1="206" y1="378" x2="288" y2="338" stroke="var(--figure-ink-soft)"
          stroke-width="0.8" stroke-dasharray="3 2"/>
    <text x="200" y="384" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">croisement apparent</text>
    <text x="200" y="398" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">(mais aucun point commun)</text>
  </g><!-- /step-3 -->
</svg>
