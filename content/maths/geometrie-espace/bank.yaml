    intro: |-
      **Géométrie dans l'espace (examen national, session normale 2023, Sciences Expérimentales).**

      Dans l'espace rapporté à un repère orthonormé direct $(O,\vec{i},\vec{j},\vec{k})$, on considère les points $A(0,1,4)$, $B(2,1,2)$, $C(2,5,0)$ et $\Omega(3,4,4)$.

      Le point $\Omega$ est donné dès le départ, avant même qu'on sache que c'est le centre d'une sphère : l'exercice construit la distance de $\Omega$ au plan $(ABC)$ par la géométrie du produit vectoriel, avant de révéler, plus loin, que $\Omega$ est justement le centre de $(S)$.
    questions:
      - id: q1
        part: "Partie A — Produit vectoriel, aire et distance"
        stem: |-
          **(0,25 pt)** Montrer que $\overrightarrow{AB} \wedge \overrightarrow{AC} = 4\left(2\vec{i} + \vec{j} + 2\vec{k}\right)$
        reasoning: |-
          Même geste que d'habitude : coordonnées de $\overrightarrow{AB}$ et $\overrightarrow{AC}$ par « arrivée moins départ » (R1), puis produit vectoriel composante par composante (R3). Ici le résultat n'est pas déjà réduit — on le factorise par $4$ pour retrouver exactement la forme annoncée par l'énoncé, $4(2\vec i+\vec j+2\vec k)$.
        steps:
          - math: '\overrightarrow{AB} = B-A = (2,\,0,\,-2), \qquad \overrightarrow{AC} = C-A = (2,\,4,\,-4)'
            note: "Coordonnées arrivée moins départ (R1)."
          - math: '\overrightarrow{AB}\wedge\overrightarrow{AC} = \big((0)(-4)-(-2)(4),\ \ (-2)(2)-(2)(-4),\ \ (2)(4)-(0)(2)\big)'
            note: "Formule du produit vectoriel (R3)."
          - math: '\overrightarrow{AB}\wedge\overrightarrow{AC} = (8,\,4,\,8) = 4\,(2,\,1,\,2) = 4\left(2\vec i+\vec j+2\vec k\right)'
            note: "On factorise par 4 pour retrouver exactement la forme demandée."
      - id: q2
        stem: |-
          **(0,5 pt)** En déduire l'aire du triangle $ABC$ et la distance $d(B,(AC))$
        reasoning: |-
          La norme du produit vectoriel est l'aire du parallélogramme construit sur $\overrightarrow{AB}$ et $\overrightarrow{AC}$ (R3) ; l'aire du triangle $ABC$ en est la moitié.

          Pour la distance $d(B,(AC))$, on réutilise cette même aire autrement : un triangle, c'est aussi un demi produit base $\times$ hauteur, avec $AC$ comme base et $d(B,(AC))$ comme hauteur cherchée. On égale les deux expressions de l'aire et on isole la hauteur — c'est la même idée que la formule de distance point-droite du R8, écrite sans repasser par un second produit vectoriel.
        steps:
          - math: '\left\|\overrightarrow{AB}\wedge\overrightarrow{AC}\right\| = \|(8,4,8)\| = \sqrt{8^2+4^2+8^2} = \sqrt{144} = 12'
            note: "Norme du produit vectoriel = aire du parallélogramme construit sur AB et AC (R3)."
          - math: '\text{aire}(ABC) = \dfrac{12}{2} = 6'
            note: "Le triangle occupe la moitié du parallélogramme."
          - math: 'AC = \left\|\overrightarrow{AC}\right\| = \sqrt{2^2+4^2+(-4)^2} = \sqrt{36} = 6'
            note: "Longueur du côté AC, qui sert de base."
          - math: '\text{aire}(ABC) = \dfrac12\times AC\times d(B,(AC)) \implies 6 = \dfrac12\times6\times d(B,(AC))'
            note: "Aire = un demi fois base fois hauteur ; la hauteur issue de B est justement d(B,(AC))."
          - math: 'd(B,(AC)) = 2'
            note: "On isole la hauteur."
      - id: q3
        part: "Partie B — Le milieu $D$ et la distance du centre au plan"
        stem: |-
          Soit $D$ le milieu du segment $[AC]$.

          **(0,25 pt)** Vérifier que $\overrightarrow{D\Omega} = \dfrac{1}{4}\left(\overrightarrow{AB} \wedge \overrightarrow{AC}\right)$
        reasoning: |-
          Vérification directe : on calcule $D$, le milieu de $[AC]$ (moyenne des coordonnées), puis $\overrightarrow{D\Omega}$ par « arrivée moins départ » (R1), et on compare au quart du résultat de la question 1. Pas d'astuce ici — on calcule les deux membres séparément et on constate qu'ils coïncident.
        steps:
          - math: 'D = \left(\dfrac{0+2}{2},\,\dfrac{1+5}{2},\,\dfrac{4+0}{2}\right) = (1,\,3,\,2)'
            note: "D est le milieu de [AC] : on moyenne les coordonnées de A et C."
          - math: '\overrightarrow{D\Omega} = \Omega-D = (3-1,\,4-3,\,4-2) = (2,\,1,\,2)'
            note: "Coordonnées arrivée moins départ (R1)."
          - math: '\dfrac14\left(\overrightarrow{AB}\wedge\overrightarrow{AC}\right) = \dfrac14\,(8,\,4,\,8) = (2,\,1,\,2)'
            note: "On reprend le résultat de la question 1."
          - math: '\overrightarrow{D\Omega} = \dfrac14\left(\overrightarrow{AB}\wedge\overrightarrow{AC}\right)'
            note: "Les deux expressions coïncident."
      - id: q4
        stem: |-
          **(0,5 pt)** En déduire que $d(\Omega,(ABC)) = 3$.
        reasoning: |-
          $\overrightarrow{AB}\wedge\overrightarrow{AC}$ est un vecteur normal au plan $(ABC)$ (R6). La question précédente dit que $\overrightarrow{D\Omega}$ en est le quart — donc $\overrightarrow{D\Omega}$ est colinéaire à cette normale, c'est-à-dire perpendiculaire au plan.

          Or $D$, milieu du segment $[AC]$, appartient au plan $(ABC)$ : $A$ et $C$ y sont, et un segment entre deux points d'un plan reste entièrement dans ce plan. $D$ est donc un point du plan tel que $\overrightarrow{D\Omega}$ est perpendiculaire à ce plan — c'est exactement la définition du pied de la perpendiculaire abaissée de $\Omega$. La distance cherchée est donc simplement la norme de ce vecteur (R1), sans repasser par la formule du R8.
        steps:
          - math: 'D\in(ABC)\ (\text{milieu de}\ [AC]) \ \text{et}\ \overrightarrow{D\Omega}\ \text{colinéaire à la normale}\ \overrightarrow{AB}\wedge\overrightarrow{AC}'
            note: "D appartient au plan, et D vers Ω suit exactement la direction normale (R6) : D est le pied de la perpendiculaire depuis Ω."
          - math: 'd(\Omega,(ABC)) = \left\|\overrightarrow{D\Omega}\right\| = \sqrt{2^2+1^2+2^2} = \sqrt{9} = 3'
            note: "Distance = norme du vecteur qui réalise la perpendiculaire (R1)."
      - id: q5
        part: "Partie C — La sphère $(S)$ et la tangence du plan"
        stem: |-
          Soit $(S)$ la sphère d'équation $x^2 + y^2 + z^2 - 6x - 8y - 8z + 32 = 0$.

          **(0,5 pt)** Déterminer le centre et le rayon de la sphère $(S)$
        reasoning: |-
          L'équation de $(S)$ est donnée sous forme développée : on complète le carré dans chaque variable (R9), la même technique que pour la sphère du sujet précédent, pour revenir à la forme centre-rayon.
        steps:
          - math: '(x^2-6x)+(y^2-8y)+(z^2-8z)+32=0'
            note: "On regroupe par variable avant de compléter chaque carré (R9)."
          - math: '(x-3)^2-9 \;+\; (y-4)^2-16 \;+\; (z-4)^2-16 \;+\;32 = 0'
            note: "Chaque groupe devient un carré parfait ; on garde trace du terme constant soustrait."
          - math: '(x-3)^2+(y-4)^2+(z-4)^2 = 9+16+16-32 = 9'
            note: "On isole les carrés à gauche : le second membre vaut 9."
          - math: '\Omega(3,\,4,\,4), \qquad R = \sqrt{9} = 3'
            note: "Centre et rayon ; on retrouve exactement le point Ω donné dans l'énoncé."
      - id: q6
        stem: |-
          **(0,5 pt)** Montrer que le plan $(ABC)$ est tangent à la sphère $(S)$ en un point que l'on déterminera.
        reasoning: |-
          La question précédente (Partie B) a déjà établi $d(\Omega,(ABC))=3$, exactement le rayon trouvé à l'instant : $d=R$, donc le plan est tangent à la sphère (R9).

          Reste à identifier le point de contact. On l'a en réalité déjà sous la main : $D$, le pied de la perpendiculaire depuis $\Omega$ (question 4), est à distance $3=R$ de $\Omega$ et appartient au plan — c'est donc exactement le point où le plan touche la sphère. On peut le confirmer en vérifiant directement que $D$ satisfait l'équation centre-rayon de $(S)$.
        steps:
          - math: 'd(\Omega,(ABC)) = 3 = R \implies (ABC)\ \text{tangent à}\ (S)'
            note: "Distance égale au rayon (R9, question 4) : un seul point commun."
          - math: '\left\|\overrightarrow{D\Omega}\right\| = 3 = R\ \text{et}\ D\in(ABC)\ \text{et}\ \overrightarrow{D\Omega}\ \text{colinéaire à la normale}'
            note: "D, déjà connu comme pied de la perpendiculaire (question 4), est à distance R de Ω : c'est le point de contact."
          - math: '(1-3)^2+(3-4)^2+(2-4)^2 = 4+1+4 = 9 = R^2'
            note: "Vérification directe : D appartient bien à la sphère (S)."
          - math: 'D(1,\,3,\,2)\ \text{est le point de tangence}'
            note: "Coordonnées du point de contact."
      - id: q7
        part: "Partie D — Deux plans parallèles, un cercle de rayon donné"
        stem: |-
          **(0,5 pt)** Soient $(Q_1)$ et $(Q_2)$ les deux plans parallèles à $(ABC)$ tels que chacun d'eux coupe $(S)$ suivant un cercle de rayon $\sqrt{5}$. Déterminer une équation cartésienne pour chacun des deux plans $(Q_1)$ et $(Q_2)$.
        reasoning: |-
          On n'a pas encore eu besoin de l'équation cartésienne complète de $(ABC)$ — tout s'est fait jusqu'ici par la géométrie du vecteur $\overrightarrow{D\Omega}$. Pour caractériser des plans parallèles, il en faut une forme explicite : on la construit avec la méthode habituelle (R6), normale $(2,1,2)$ (le quart du vecteur de la question 1) et un point connu, $A$.

          Ensuite, le même Pythagore qu'au R9 relie rayon de la sphère, distance centre-plan et rayon du cercle d'intersection : $R^2=d^2+r^2$. On le retourne pour trouver la distance $d$ qui donne un cercle de rayon $\sqrt5$, imposé par l'énoncé.

          Tout plan parallèle à $(ABC)$ partage sa normale (R7) ; il s'écrit donc $2x+y+2z+k=0$ pour un $k$ à déterminer. On calcule sa distance à $\Omega$ en fonction de $k$ (R8) et on l'égale à la valeur trouvée — l'équation en valeur absolue donne deux solutions, une de chaque côté du plan tangent $(ABC)$.
        steps:
          - math: '2x+y+2z+d=0,\quad A(0,1,4)\in(ABC): \ 0+1+8+d=0 \implies d=-9'
            note: "Normale (2,1,2) (R6, le quart de AB∧AC de la question 1) ; d fixé par A."
          - math: '(ABC):\ \ 2x+y+2z-9=0'
            note: "Vérification : B(2,1,2) donne 4+1+4-9=0 ; C(2,5,0) donne 4+5+0-9=0."
          - math: 'R^2 = d^2+r^2 \implies 9 = d^2+5 \implies d^2=4 \implies d=2'
            note: "Même relation qu'au R9 : un cercle de rayon r=√5 sur une sphère de rayon R=3 impose une distance centre-plan d=2."
          - math: '(Q):\ \ 2x+y+2z+k=0'
            note: "Même normale (2,1,2) : tout plan parallèle à (ABC) partage cette direction (R7)."
          - math: 'd(\Omega,(Q)) = \dfrac{|2(3)+4+2(4)+k|}{\sqrt{2^2+1^2+2^2}} = \dfrac{|18+k|}{3}'
            note: "Formule R8 appliquée au plan générique (Q)."
          - math: '\dfrac{|18+k|}{3}=2 \iff |18+k|=6 \iff k=-12\ \text{ou}\ k=-24'
            note: "Deux valeurs, une de chaque côté du plan tangent (ABC) qui correspond à k=-9."
          - math: '(Q_1):\ \ 2x+y+2z-12=0, \qquad (Q_2):\ \ 2x+y+2z-24=0'
            note: "Les deux plans cherchés, parallèles à (ABC), chacun à distance 2 du centre Ω."

  # ── bk-2024-n-x2 — 2024 N, Exercice 2 : plan, sphère, section circulaire, droite et médiatrice ──
  # Voir SCOPE NOTE 2 en tête de fichier (question 4.c, médiatrice non couverte par R1–R9).
