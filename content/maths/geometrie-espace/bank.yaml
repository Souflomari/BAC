entries:
  # ── bk-2019-n-x1 — 2019 N, Exercice 1 : produit vectoriel, plan, sphère et section plane ──
  # Même sujet que le sommet de leçon r-bac (exercises.yaml). Voir note éditoriale en tête.
  - id: bk-2019-n-x1
    title: "Produit vectoriel, équation d'un plan et intersection avec une sphère"
    source:
      year: 2019
      session: normale
      filiere: "SExp"
      exercise_label: "Exercice 1"
    bareme_total: 3
    duration_min: 20
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national SExp BIOF (SVT et Sciences
        Physiques), Mathématiques, code NS 22F, AlloSchool element/68527
        (Exercice 1, « Géométrie dans l'espace » ; barème 3 points).
        Transcription fidèle de l'entrée « vérifié » de
        docs/sujets/maths/geometrie-espace.md, section « 2019 — session
        normale — Exercice 1 » (re-fetch AlloSchool indépendant + diff
        caractère-par-caractère conforme au scan, agent-vérificateur-
        adversarial, 2026-07-12). NB : ce même sujet sous-tend aussi le
        sommet de leçon r-bac (exercises.yaml, marqueur [[exercise:r-bac]]
        à R10) — recoupement assumé, voir note éditoriale en tête de
        fichier.
    intro: |-
      **Géométrie dans l'espace (examen national, session normale 2019, Sciences Expérimentales).**

      Dans l'espace rapporté à un repère orthonormé direct $(O,\vec{i},\vec{j},\vec{k})$, on considère les points $A(1,-1,-1)$, $B(0,-2,1)$ et $C(1,-2,0)$.

      L'exercice enchaîne les outils du chapitre dans leur ordre naturel : produit vectoriel pour fabriquer une normale, équation cartésienne du plan, puis une sphère $(S)$ et la façon dont ce plan la coupe.
    questions:
      - id: q1
        part: "Partie A — Du produit vectoriel à l'équation du plan $(ABC)$"
        stem: |-
          **(0,75 pt)** Montrer que $\overrightarrow{AB} \wedge \overrightarrow{AC} = \vec{i} + \vec{j} + \vec{k}$
        reasoning: |-
          Le produit vectoriel de $\overrightarrow{AB}$ et $\overrightarrow{AC}$ fabrique un troisième vecteur, orthogonal aux deux à la fois (R3) — exactement ce qu'il faut pour obtenir, à la question suivante, une direction normale au plan $(ABC)$.

          On commence par les coordonnées des deux vecteurs, par la règle « arrivée moins départ » (R1), puis on applique la formule du produit vectoriel : chaque composante s'obtient en cachant la coordonnée de même nom et en croisant les deux autres en diagonale, avec un signe (R3). C'est dans la gestion de ce signe, coordonnée par coordonnée, que se nichent la plupart des erreurs — on vérifie chaque terme séparément plutôt que d'aller vite.
        steps:
          - math: '\overrightarrow{AB} = B-A = (-1,\,-1,\,2), \qquad \overrightarrow{AC} = C-A = (0,\,-1,\,1)'
            note: "Coordonnées arrivée moins départ (R1)."
          - math: '\overrightarrow{AB}\wedge\overrightarrow{AC} = \big((-1)(1)-(2)(-1),\ \ (2)(0)-(-1)(1),\ \ (-1)(-1)-(-1)(0)\big)'
            note: "Formule du produit vectoriel (R3) : chaque composante croise les deux autres coordonnées en diagonale, avec un signe."
          - math: '\overrightarrow{AB}\wedge\overrightarrow{AC} = (1,\,1,\,1) = \vec{i}+\vec{j}+\vec{k}'
            note: "Ce vecteur, orthogonal à AB et à AC, servira de normale au plan (ABC)."
      - id: q2
        stem: |-
          **(0,5 pt)** En déduire que $x + y + z + 1 = 0$ est une équation cartésienne du plan $(ABC)$
        reasoning: |-
          $\overrightarrow{AB}\wedge\overrightarrow{AC}$ est orthogonal à deux vecteurs du plan $(ABC)$ : c'est donc un vecteur normal à ce plan (R6). Pour un plan de vecteur normal $\vec n(a,b,c)$, l'équation cartésienne s'écrit $ax+by+cz+d=0$ — les coefficients de $x,y,z$ sont exactement les coordonnées de $\vec n$, jamais la constante $d$, qui ne fait que fixer la position du plan.

          Ici $\vec n(1,1,1)$ (question précédente), donc l'équation a la forme $x+y+z+d=0$. On détermine $d$ en imposant qu'un point connu du plan — $A$, par exemple — la vérifie.
        steps:
          - math: 'x+y+z+d=0'
            note: "Coefficients = coordonnées du vecteur normal (1,1,1) (R6) ; d reste à déterminer."
          - math: 'A(1,-1,-1)\in(ABC):\quad 1+(-1)+(-1)+d=0 \implies d=1'
            note: "d est fixé en imposant que A appartienne au plan."
          - math: '(ABC):\ \ x+y+z+1=0'
            note: "Vérification : B(0,-2,1) donne 0-2+1+1=0 ; C(1,-2,0) donne 1-2+0+1=0."
      - id: q3
        part: "Partie B — La sphère $(S)$ : centre et rayon"
        stem: |-
          **(0,75 pt)** Soit $(S)$ la sphère d'équation $x^2 + y^2 + z^2 - 4x + 2y - 2z + 1 = 0$. Montrer que le centre de la sphère $(S)$ est $\Omega(2,-1,1)$ et que son rayon est $R = \sqrt{5}$
        reasoning: |-
          L'équation de $(S)$ est donnée sous forme développée : le centre et le rayon ne s'y lisent pas directement. On revient à la forme centre-rayon en complétant le carré dans chaque variable séparément (R9) — la même technique que pour un cercle en 2D, appliquée trois fois, une variable à la fois.

          Pour chaque groupe $x^2+px$, on écrit $\left(x+\tfrac p2\right)^2-\left(\tfrac p2\right)^2$ : le carré parfait fait apparaître directement la coordonnée du centre, et le terme soustrait qu'on traîne vient corriger le second membre à la fin.
        steps:
          - math: '(x^2-4x)+(y^2+2y)+(z^2-2z)+1=0'
            note: "On regroupe par variable avant de compléter chaque carré (R9)."
          - math: '(x-2)^2-4 \;+\; (y+1)^2-1 \;+\; (z-1)^2-1 \;+\;1 = 0'
            note: "Chaque groupe devient un carré parfait ; on garde trace du terme constant soustrait."
          - math: '(x-2)^2+(y+1)^2+(z-1)^2 = 4+1+1-1 = 5'
            note: "On isole les carrés à gauche : le second membre vaut 5."
          - math: '\Omega(2,\,-1,\,1), \qquad R=\sqrt{5}'
            note: "Centre = valeurs qui annulent chaque carré ; rayon = racine du second membre, pas 5 lui-même."
      - id: q4
        part: "Partie C — Distance au centre et intersection avec la sphère"
        stem: |-
          **(0,5 pt)** Calculer $d(\Omega,(ABC))$ la distance du point $\Omega$ au plan $(ABC)$
        reasoning: |-
          On applique la formule de la distance d'un point à un plan (R8) : au numérateur, l'équation du plan évaluée au point $\Omega$, en valeur absolue ; au dénominateur, la norme du vecteur normal — la racine de la somme des carrés des coefficients, jamais leur simple somme.
        steps:
          - math: 'd(\Omega,(ABC)) = \dfrac{\big|\,2+(-1)+1+1\,\big|}{\sqrt{1^2+1^2+1^2}}'
            note: "Formule R8 : |ax0+by0+cz0+d| au numérateur, norme du vecteur normal au dénominateur."
          - math: 'd(\Omega,(ABC)) = \dfrac{3}{\sqrt{3}} = \sqrt{3}'
            note: "3 sur racine de 3 se simplifie en racine de 3."
      - id: q5
        stem: |-
          **(0,5 pt)** En déduire que le plan $(ABC)$ coupe la sphère $(S)$ selon un cercle $(\Gamma)$ *(la détermination du centre et du rayon de $(\Gamma)$ n'est pas demandée)*
        reasoning: |-
          Le critère de position d'un plan par rapport à une sphère (R9) compare la distance $d(\Omega,(ABC))$ au rayon $R$ : trois cas selon que $d>R$ (aucun point commun), $d=R$ (tangence, un seul point) ou $d<R$ (un cercle). Le réflexe attendu par un correcteur : on calcule $d$, on la compare à $R$, et c'est cette comparaison — jamais l'inverse — qui décide de la conclusion.

          Ici $d=\sqrt3$ et $R=\sqrt5$ : comme $3<5$, on a $\sqrt3<\sqrt5$, donc $d<R$.
        steps:
          - math: 'd(\Omega,(ABC)) = \sqrt{3}\approx 1{,}73, \qquad R=\sqrt{5}\approx 2{,}24'
            note: "On compare la distance calculée au rayon de la sphère (R9)."
          - math: '\sqrt{3} < \sqrt{5} \iff d<R'
            note: "d est strictement inférieure à R."
          - math: '(ABC)\cap(S) = (\Gamma)\ \ \text{est un cercle}'
            note: "Cas d < R du critère R9 : intersection = cercle (centre et rayon non demandés ici)."

  # ── bk-2022-n-x1 — 2022 N, Exercice 1 : plan tangent à une sphère, droite perpendiculaire tangente ──
  - id: bk-2022-n-x1
    title: "Plan tangent à une sphère, droite perpendiculaire et distance à une droite"
    source:
      year: 2022
      session: normale
      filiere: "SExp"
      exercise_label: "Exercice 1"
    bareme_total: 3
    duration_min: 20
    sourcing:
      status: sourced
      note: >-
        2022 session normale — examen national SExp BIOF (SVT et Sciences
        Physiques), Mathématiques, code NS 22F, AlloSchool element/136586
        (Exercice 1, « Géométrie dans l'espace » ; barème 3 points).
        Transcription fidèle de l'entrée « vérifié » de
        docs/sujets/maths/geometrie-espace.md, section « 2022 — session
        normale — Exercice 1 » (re-fetch AlloSchool indépendant + diff
        caractère-par-caractère conforme au scan, agent-vérificateur-
        adversarial, 2026-07-12).
    intro: |-
      **Géométrie dans l'espace (examen national, session normale 2022, Sciences Expérimentales).**

      Dans l'espace rapporté à un repère orthonormé direct $(O;\vec{i},\vec{j},\vec{k})$, on considère les points $A(0,1,1)$, $B(1,2,0)$ et $C(-1,1,2)$.

      Cette fois le plan touche la sphère plutôt que de la traverser : chaque question construit un morceau de la figure de tangence, jusqu'à une droite perpendiculaire elle-même tangente à la même sphère, en un autre point.
    questions:
      - id: q1
        part: "Partie A — Du produit vectoriel à l'équation du plan $(ABC)$"
        stem: |-
          **(0,5 pt)** Montrer que $\overrightarrow{AB} \wedge \overrightarrow{AC} = \vec{i} + \vec{k}$
        reasoning: |-
          Même geste qu'à chaque fois qu'on cherche une normale à un plan : on fabrique un vecteur orthogonal à deux vecteurs du plan avec le produit vectoriel (R3). On calcule d'abord $\overrightarrow{AB}$ et $\overrightarrow{AC}$ par « arrivée moins départ » (R1), puis on applique la formule composante par composante, en surveillant les signes.
        steps:
          - math: '\overrightarrow{AB} = B-A = (1,\,1,\,-1), \qquad \overrightarrow{AC} = C-A = (-1,\,0,\,1)'
            note: "Coordonnées arrivée moins départ (R1)."
          - math: '\overrightarrow{AB}\wedge\overrightarrow{AC} = \big((1)(1)-(-1)(0),\ \ (-1)(-1)-(1)(1),\ \ (1)(0)-(1)(-1)\big)'
            note: "Formule du produit vectoriel (R3)."
          - math: '\overrightarrow{AB}\wedge\overrightarrow{AC} = (1,\,0,\,1) = \vec{i}+\vec{k}'
            note: "La composante selon j est nulle : ce vecteur normal n'a pas de composante j."
      - id: q2
        stem: |-
          **(0,25 pt)** En déduire que $x + z - 1 = 0$ est une équation cartésienne du plan $(ABC)$
        reasoning: |-
          $\overrightarrow{AB}\wedge\overrightarrow{AC}=(1,0,1)$ est un vecteur normal au plan $(ABC)$ (R6) : ses coordonnées sont exactement les coefficients de $x,y,z$ dans l'équation cartésienne — avec un coefficient nul devant $y$, puisque la composante correspondante du vecteur normal est nulle. On fixe la constante $d$ avec un point connu du plan.
        steps:
          - math: 'x+0y+z+d=0'
            note: "Coefficients = coordonnées du vecteur normal (1,0,1) (R6) ; le coefficient de y est nul."
          - math: 'A(0,1,1)\in(ABC):\quad 0+0+1+d=0 \implies d=-1'
            note: "d est fixé en imposant que A appartienne au plan."
          - math: '(ABC):\ \ x+z-1=0'
            note: "Vérification : B(1,2,0) donne 1+0-1=0 ; C(-1,1,2) donne -1+2-1=0."
      - id: q3
        part: "Partie B — La sphère $(S)$ et la tangence du plan"
        stem: |-
          **(0,5 pt)** Soit $(S)$ la sphère de centre $\Omega(1,1,2)$ et de rayon $R = \sqrt{2}$. Déterminer une équation de la sphère $(S)$
        reasoning: |-
          Cette fois l'énoncé donne directement le centre et le rayon — c'est l'opération inverse de la question B du sujet 2019 : au lieu de compléter le carré pour retrouver centre et rayon depuis une forme développée, on part de la forme centre-rayon $(x-x_\Omega)^2+(y-y_\Omega)^2+(z-z_\Omega)^2=R^2$ (R9) et on y substitue directement les valeurs connues.
        steps:
          - math: '(x-1)^2+(y-1)^2+(z-2)^2 = \left(\sqrt2\right)^2'
            note: "Forme centre-rayon (R9), avec le centre et le rayon donnés directement dans l'énoncé."
          - math: '(S):\ \ (x-1)^2+(y-1)^2+(z-2)^2 = 2'
            note: "Le rayon au carré vaut 2."
          - math: '(S):\ \ x^2+y^2+z^2-2x-2y-4z+4=0'
            note: "Forme développée équivalente, obtenue en développant les trois carrés (les deux formes sont acceptées)."
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que le plan $(ABC)$ est tangent à la sphère $(S)$ au point $A$
        reasoning: |-
          Deux choses à établir : que le plan est bien tangent (la distance du centre au plan égale le rayon, R9), et que le point de contact est précisément $A$.

          On calcule $d(\Omega,(ABC))$ avec la formule R8 ; elle tombe sur $\sqrt2$, exactement $R$ — le plan est tangent. Reste à identifier le point de contact, qui est par définition le pied de la perpendiculaire abaissée de $\Omega$ sur le plan. On le trouve en remarquant que le vecteur $\overrightarrow{\Omega A}$ est colinéaire au vecteur normal $(1,0,1)$ : $A$ appartient au plan et $\overrightarrow{\Omega A}$ est porté par la normale, donc $A$ *est* ce pied — le point de tangence.
        steps:
          - math: 'd(\Omega,(ABC)) = \dfrac{|1\times1+0\times1+1\times2-1|}{\sqrt{1^2+0^2+1^2}} = \dfrac{|1+0+2-1|}{\sqrt2} = \dfrac{2}{\sqrt2} = \sqrt2'
            note: "Formule R8, avec Ω(1,1,2) et le plan x+z-1=0."
          - math: '\sqrt2 = R \implies (ABC)\ \text{tangent à}\ (S)'
            note: "Distance égale au rayon (R9) : le plan touche la sphère en un seul point."
          - math: '\overrightarrow{\Omega A} = A-\Omega = (-1,\,0,\,-1) = -1\times(1,0,1)'
            note: "Le vecteur qui va de Ω à A est colinéaire au vecteur normal (1,0,1) : ce segment est perpendiculaire au plan."
          - math: 'A\in(ABC)\ \text{et}\ \overrightarrow{\Omega A}\parallel \vec{n} \implies A\ \text{est le pied de la perpendiculaire depuis}\ \Omega'
            note: "A appartient au plan et ΩA est porté par la normale : A est exactement le point de tangence."
      - id: q5
        part: "Partie C — La droite $(\\Delta)$, perpendiculaire au plan, tangente à la sphère"
        stem: |-
          On considère la droite $(\Delta)$ passant par le point $C$ et perpendiculaire au plan $(ABC)$.

          **(0,25 pt)** Déterminer une représentation paramétrique de la droite $(\Delta)$
        reasoning: |-
          La droite $(\Delta)$ est perpendiculaire au plan $(ABC)$ : sa direction est donc exactement la normale du plan, déjà trouvée à la question 1 — $\vec n=(1,0,1)$, sans qu'il y ait besoin de la recalculer. On écrit la représentation paramétrique habituelle (R5) à partir du point $C$ et de cette direction. Remarque : la composante $y$ du vecteur directeur est nulle, exactement le cas particulier signalé au R5 — $y$ reste constant tout le long de la droite.
        steps:
          - math: '\vec{u}_\Delta = \vec{n} = (1,\,0,\,1)'
            note: "Δ est perpendiculaire au plan (ABC) : son vecteur directeur est la normale, déjà trouvée à la question 1."
          - math: '\begin{cases} x = -1+t \\ y = 1 \\ z = 2+t \end{cases}\quad t\in\mathbb{R}'
            note: "On part du point C(-1,1,2) et on avance selon (1,0,1) (R5)."
      - id: q6
        stem: |-
          **(0,5 pt)** Montrer que la droite $(\Delta)$ est tangente à la sphère $(S)$ en un point $D$ dont on déterminera les coordonnées
        reasoning: |-
          Ici on sort légèrement du terrain balisé par la leçon : le R9 traite la tangence **plan**-sphère (comparer la distance du centre au plan avec le rayon). Le même raisonnement de Pythagore se transpose tel quel à une **droite** : si $H$ est le pied de la perpendiculaire abaissée de $\Omega$ sur $(\Delta)$ et $M$ un point commun à $(\Delta)$ et $(S)$, le triangle $\Omega HM$ est rectangle en $H$, donc $R^2=d(\Omega,(\Delta))^2+HM^2$ — même relation, même conclusion : $d(\Omega,(\Delta))=R$ signale une droite tangente.

          On calcule donc $d(\Omega,(\Delta))$ avec la formule du R8 (distance point-droite, via le produit vectoriel), on la compare à $R$, puis, la tangence confirmée, on trouve $D$ en imposant que $\overrightarrow{\Omega D}$ soit orthogonal à la direction de $(\Delta)$ — c'est la caractérisation même du pied de la perpendiculaire, via le produit scalaire (R2).
        steps:
          - math: '\overrightarrow{\Omega C} = C - \Omega = (-2,\,0,\,0)'
            note: "Vecteur d'un point de la droite (C) vers le centre Ω."
          - math: '\overrightarrow{\Omega C}\wedge \vec{u}_\Delta = \big((0)(1)-(0)(0),\ (0)(1)-(-2)(1),\ (-2)(0)-(0)(1)\big) = (0,\,2,\,0)'
            note: "Produit vectoriel (R3) entre Ω vers C et le vecteur directeur de Δ, (1,0,1)."
          - math: 'd(\Omega,(\Delta)) = \dfrac{\|(0,2,0)\|}{\|\vec{u}_\Delta\|} = \dfrac{2}{\sqrt2} = \sqrt2'
            note: "Formule R8 (distance point-droite)."
          - math: '\sqrt2 = R \implies (\Delta)\ \text{tangente à}\ (S)'
            note: "Même critère que pour un plan (R9), transposé à une droite : distance au centre = rayon signale la tangence."
          - math: 'D=C+t\,\vec{u}_\Delta, \quad \overrightarrow{\Omega D} = \overrightarrow{\Omega C}+t\,\vec{u}_\Delta = (-2+t,\,0,\,t)'
            note: "Point générique de Δ ; vecteur de Ω vers ce point, en fonction de t."
          - math: '\overrightarrow{\Omega D}\cdot \vec{u}_\Delta = 0 \iff (-2+t)+t = 0 \iff t=1'
            note: "Le pied de la perpendiculaire depuis Ω annule ce produit scalaire (R2)."
          - math: 'D = (-1+1,\,1,\,2+1) = (0,\,1,\,3)'
            note: "On reporte t=1 dans la représentation paramétrique de Δ."
      - id: q7
        stem: |-
          **(0,5 pt)** Calculer le produit scalaire $\overrightarrow{AC} \cdot (\vec{i} + \vec{k})$, puis en déduire la distance $d(A,(\Delta))$
        reasoning: |-
          On calcule le produit scalaire coordonnée par coordonnée (R2) entre $\overrightarrow{AC}$ et $\vec i+\vec k$ — qui est précisément le vecteur directeur de $(\Delta)$ (question 5). Le résultat nul signale que $\overrightarrow{AC}$ est orthogonal à cette direction.

          Or $C$ est un point de $(\Delta)$, et $\overrightarrow{AC}$ va justement de ce point vers $A$. Un vecteur qui part d'un point de la droite et qui est déjà perpendiculaire à sa direction, c'est exactement le segment qui réalise la distance : pas besoin de repasser par la formule du produit vectoriel du R8, la longueur de $\overrightarrow{AC}$ *est* la distance cherchée.
        steps:
          - math: '\overrightarrow{AC} = C-A = (-1,\,0,\,1)'
            note: "Rappel de la question 1 (R1)."
          - math: '\overrightarrow{AC}\cdot(\vec i+\vec k) = \overrightarrow{AC}\cdot(1,0,1) = (-1)(1)+0\times0+1\times1 = 0'
            note: "Produit scalaire coordonnée par coordonnée (R2)."
          - math: '\overrightarrow{AC}\cdot \vec{u}_\Delta = 0 \implies \overrightarrow{AC}\perp \vec{u}_\Delta'
            note: "AC est orthogonal à la direction de Δ (question 5)."
          - math: 'C\in(\Delta)\ \text{et}\ \overrightarrow{AC}\perp \vec{u}_\Delta \implies d(A,(\Delta)) = AC'
            note: "AC part d'un point de la droite et est déjà perpendiculaire à sa direction : c'est le segment qui réalise la distance."
          - math: 'AC = \sqrt{(-1)^2+0^2+1^2} = \sqrt2'
            note: "Norme du vecteur AC (R1) : c'est la distance cherchée."

  # ── bk-2023-n-x1 — 2023 N, Exercice 1 : aire, tangence à une sphère, plans parallèles sécants ──
  - id: bk-2023-n-x1
    title: "Aire d'un triangle, tangence à une sphère et plans parallèles coupant un cercle"
    source:
      year: 2023
      session: normale
