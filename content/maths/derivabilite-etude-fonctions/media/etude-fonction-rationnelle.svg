<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="La courbe de f(x) = (x carré moins x plus un) sur (x moins un), qui s’écrit aussi x plus un sur (x moins un) : deux branches séparées par l’asymptote verticale x = 1, encadrées par l’asymptote oblique y = x. La branche de gauche monte jusqu’au maximum local en (0 ; −1) en restant sous l’asymptote oblique, puis plonge vers moins l’infini en longeant x = 1. La branche de droite descend depuis plus l’infini jusqu’au minimum local en (2 ; 3) en restant au-dessus de l’asymptote oblique, puis remonte en la suivant.">
  <title>Étude complète de f(x) = (x² − x + 1)/(x − 1) — la courbe, étape par étape</title>
  <!--
    etude-fonction-rationnelle.svg — graphe STAGÉ (5 étapes, LESSON-
    EXPERIENCE-SPEC §2.5 : "graphes toujours stagés", ordre canonique
    axes → données → lecture) de f(x) = (x²-x+1)/(x-1) = x + 1/(x-1),
    l'exemple travaillé de l'étude complète du R5.

    step-1 : chrome — axes du repère, avec une échelle minimale (quelques
             graduations), rien de la fonction encore.
    step-2 : les deux asymptotes — verticale x=1, oblique y=x.
    step-3 : données — la branche de gauche (x<1), + l'étiquette f(x).
    step-4 : données — la branche de droite (x>1).
    step-5 : lecture — les deux extremums A(0;-1)/B(2;3) avec leur
             tangente horizontale, et la position de chaque branche par
             rapport à l'asymptote oblique.

    Les captions sont portées par etude-fonction-rationnelle.stages.json
    (figcaption hors-SVG) — aucun texte de légende baké ici, seules les
    étiquettes mathématiques sont dans le SVG (convention alignée sur
    tableau-variations-courbe.svg / tangente-derivee.svg).

    Fonction : posons X = x-1, Y = y-1. Alors f(x) = x + 1/(x-1) donne
    Y = X + 1/X — une fonction IMPAIRE de X (symétrie de la courbe par
    rapport au point (1,1), un point-centre). Vérifiable point par point :
    au maximum local X=-1 -> Y=-1-1=-2 (soit x=0,y=-1) et au minimum local
    X=1 -> Y=1+1=2 (soit x=2,y=3) — exactement les deux valeurs du texte,
    et Y(-X) = -Y(X) confirmé.

    Mapping pixel (calculé, pas deviné), centré sur le point-centre (1,1) :
      x_px = 320 + 55·(x-1) ,  y_px = 252 - 28·(y-1)
      donc (x=1, y=1) est en pixel (320, 252) ; l'origine réelle (0,0) est
      en (X=-1,Y=-1) -> pixel (265, 280).

    Branche de gauche (x<1, X<0) — échantillonnée en X (pas resserré près
    de l'asymptote, où Y=X+1/X varie vite), de X=-4,6 à X=-0,18 :
      X      Y=X+1/X    x_px    y_px
      -4,6   -4,81739   67,00   386,89
      -3,6   -3,87778   122,00  360,58
      -2,8   -3,15714   166,00  340,40
      -2,2   -2,65455   199,00  326,33
      -1,7   -2,28824   226,50  316,07
      -1,3   -2,06923   248,50  309,94
      -1,0   -2,00000   265,00  308,00   <- extremum A (x=0, y=-1)
      -0,8   -2,05000   276,00  309,40
      -0,62  -2,23290   285,90  314,52
      -0,48  -2,56333   293,60  323,77
      -0,36  -3,13778   300,20  339,86
      -0,26  -4,10615   305,70  366,97
      -0,18  -5,73556   310,10  412,60

    Branche de droite (x>1, X>0) — symétrique par rapport au point-centre
    (Y(-X)=-Y(X)), de X=0,18 à X=4,6 :
      X      Y=X+1/X    x_px    y_px
       0,18   5,73556   329,90   91,40
       0,26   4,10615   334,30  137,03
       0,36   3,13778   339,80  164,14
       0,48   2,56333   346,40  180,23
       0,62   2,23290   354,10  189,48
       0,8    2,05000   364,00  194,60
       1,0    2,00000   375,00  196,00   <- extremum B (x=2, y=3)
       1,3    2,06923   391,50  194,06
       1,7    2,28824   413,50  187,93
       2,2    2,65455   441,00  177,67
       2,8    3,15714   474,00  163,60
       3,6    3,87778   518,00  143,42
       4,6    4,81739   573,00  117,11

    Asymptote verticale x=1 : x_px=320, tracée y_px 45 à 425.
    Asymptote oblique y=x (soit Y=X) : de (x_px=55,y_px=386,90) à
      (x_px=585,y_px=117,10) — droite passant par le centre (320,252).
      Vérification de position : pour X<0, Y=X+1/X < X (1/X<0) donc la
      branche de gauche est TOUJOURS sous l'asymptote ; pour X>0,
      Y=X+1/X > X donc la branche de droite est TOUJOURS au-dessus —
      cohérent avec le texte du R5.

    Rôle des couleurs :
      extremums A/B, leur tangente horizontale, identité finale de
        lecture : --figure-accent (LE sujet de l'étape de lecture)
      les deux branches de la courbe, les asymptotes : --figure-ink
        (contenu pédagogique central, mais pas le foyer accent — même
        convention que la courbe de tableau-variations-courbe.svg)
      axes, graduations, repères : --figure-ink-soft (chrome neutre)
  -->

  <g id="step-1">
    <!-- Titre -->
    <text x="320" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Étude complète de f(x) = (x² − x + 1)/(x − 1) — la courbe
    </text>

    <!-- Fond du panneau -->
    <rect x="40" y="32" width="560" height="400" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="55" y1="280" x2="595" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="595,280 583,275.5 583,284.5" fill="var(--figure-ink-soft)"/>
    <line x1="265" y1="425" x2="265" y2="45" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="265,45 260.5,56 269.5,56" fill="var(--figure-ink-soft)"/>

    <text x="604" y="284" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">x</text>
    <text x="253" y="50" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">y</text>
    <text x="253" y="294" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <!-- Graduations d'échelle (valeurs rondes, sans chevaucher x=1 ni x=2/y=3 qui seront lus plus tard) -->
    <line x1="155" y1="275" x2="155" y2="285" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="155" y="298" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">−2</text>
    <line x1="375" y1="275" x2="375" y2="285" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="375" y="298" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">2</text>
    <line x1="485" y1="275" x2="485" y2="285" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="485" y="298" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">4</text>

    <line x1="260" y1="336" x2="270" y2="336" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="254" y="339" text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">−2</text>
    <line x1="260" y1="224" x2="270" y2="224" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="254" y="227" text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">2</text>
    <line x1="260" y1="168" x2="270" y2="168" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="254" y="171" text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">4</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les deux asymptotes
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="320" y1="45" x2="320" y2="425"
          stroke="var(--figure-ink)" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="328" y="58" font-size="11" fill="var(--figure-ink)"
      ><tspan font-style="italic">x</tspan><tspan> = 1</tspan></text>

    <line x1="55" y1="386.9" x2="585" y2="117.1"
          stroke="var(--figure-ink)" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="575" y="100" text-anchor="end" font-size="11" fill="var(--figure-ink)"
      ><tspan font-style="italic">y</tspan><tspan> = </tspan><tspan font-style="italic">x</tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — données : la branche de gauche (x<1)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <text x="100" y="70" font-size="12" fill="var(--figure-ink)"
      ><tspan font-style="italic">f</tspan><tspan>(</tspan><tspan font-style="italic">x</tspan
      ><tspan>) = (</tspan><tspan font-style="italic">x</tspan><tspan dy="-5" font-size="8.5">2</tspan
      ><tspan dy="5"> − </tspan><tspan font-style="italic">x</tspan><tspan> + 1) / (</tspan
      ><tspan font-style="italic">x</tspan><tspan> − 1)</tspan></text>

    <path d="
      M67,386.89 L122,360.58 L166,340.4 L199,326.33 L226.5,316.07 L248.5,309.94
      L265,308 L276,309.4 L285.9,314.52 L293.6,323.77 L300.2,339.86 L305.7,366.97
      L310.1,412.6
    " fill="none"
      stroke="var(--figure-ink)"
      stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — données : la branche de droite (x>1)
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <path d="
      M329.9,91.4 L334.3,137.03 L339.8,164.14 L346.4,180.23 L354.1,189.48 L364,194.6
      L375,196 L391.5,194.06 L413.5,187.93 L441,177.67 L474,163.6 L518,143.42 L573,117.11
    " fill="none"
      stroke="var(--figure-ink)"
      stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-4 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 5 — lecture : extremums A/B, tangentes horizontales,
       position par rapport à l'asymptote oblique — LE sujet
       ══════════════════════════════════════════════════════ -->
  <g id="step-5">
    <!-- Extremum A (maximum local, x=0) -->
    <line x1="240" y1="308" x2="290" y2="308"
          stroke="var(--figure-accent)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="265" cy="308" r="3.2" fill="var(--figure-accent)"/>
    <!-- L'étiquette de A remonte de 13 px : à y=290 elle était posée SUR
         l'axe des abscisses et recouvrait la graduation « 0 » de l'origine
         (recouvrement mesuré 64 %) — on lisait « A(0̶ ; −1) ». Elle reste
         alignée à la verticale de A, la tangente horizontale accent faisant
         le lien. -->
    <text x="258" y="277" text-anchor="end" font-size="10.5" font-weight="600"
          fill="var(--figure-ink)">A(0 ; −1)</text>

    <!-- Extremum B (minimum local, x=2) -->
    <line x1="350" y1="196" x2="400" y2="196"
          stroke="var(--figure-accent)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="375" cy="196" r="3.2" fill="var(--figure-accent)"/>
    <text x="375" y="214" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-ink)">B(2 ; 3)</text>

    <!-- Position des branches par rapport à l'asymptote oblique -->
    <text x="105" y="418" font-size="10" fill="var(--figure-accent)">courbe en dessous de y = x</text>
    <text x="430" y="86" font-size="10" fill="var(--figure-accent)">courbe au-dessus de y = x</text>
  </g><!-- /step-5 -->

</svg>
