        steps:
          - math: '\bigl[(x^{2}-x)e^{-x}\bigr]^{\prime} = (2x-1)e^{-x} + (x^{2}-x)(-e^{-x}) = \bigl[(2x-1)-(x^{2}-x)\bigr]e^{-x}'
            note: "Regle du produit : derivee de x carre moins x, fois e puissance moins x, plus x carre moins x fois la derivee de e puissance moins x."
          - math: '(2x-1)-(x^{2}-x) = -x^{2}+3x-1 \ \Longrightarrow\ f''(x) = \left(-x^{2}+3x-1\right)e^{-x} + 1'
            note: "On simplifie l'expression entre crochets, puis on ajoute la derivee du terme plus x, qui vaut 1."
          - math: 'g(x)e^{-x} = \left(e^{x}-x^{2}+3x-1\right)e^{-x} = e^{x}e^{-x} + \left(-x^{2}+3x-1\right)e^{-x} = 1 + \left(-x^{2}+3x-1\right)e^{-x}'
            note: "On developpe g(x) fois e puissance moins x : le terme e puissance x fois e puissance moins x vaut exactement 1."
          - math: 'f''(x) = 1 + \left(-x^{2}+3x-1\right)e^{-x} = g(x)e^{-x}'
            note: "Les deux expressions coincident terme a terme : l'egalite demandee est verifiee."
