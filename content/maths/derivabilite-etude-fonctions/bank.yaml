        reasoning: |-
          Deux tâches, à ne pas confondre. « Montrer qu'une fonction proposée est une primitive » ne demande jamais d'intégrer — ça demande de **dériver** la fonction proposée et de retomber sur $h$. $H$ est un produit, règle du produit habituelle.

          Une fois $H'=h$ confirmé, la déduction se fait via la définition du chapitre 2 de « Calcul intégral » ($\int_a^b = F(b)-F(a)$) — mais applique-la à $h$, pas directement à ce qu'on te demande : $x^2e^{-x}=-h(x)$ (l'opposé de $h$), donc l'intégrale cherchée est l'OPPOSÉE de $\int_0^1 h(x)\,dx$, que $H$ calcule.
        steps:
          - math: 'H''(x) = (2x+2)e^{-x} + (x^{2}+2x+2)(-e^{-x}) = \bigl[(2x+2)-(x^{2}+2x+2)\bigr]e^{-x} = -x^{2}e^{-x} = h(x)'
            note: "Regle du produit sur H, puis simplification : on retrouve exactement h(x)."
          - math: '\int_{0}^{1} x^{2}e^{-x}\,dx = -\int_{0}^{1} h(x)\,dx = -\bigl[H(1)-H(0)\bigr] = H(0)-H(1)'
            note: "x carre e puissance moins x est l'oppose de h(x) : on change le signe de l'integrale de h, definie par H (chapitre 2)."
          - math: 'H(0) = (0+0+2)e^{0} = 2 \qquad H(1) = (1+2+2)e^{-1} = \dfrac{5}{e}'
            note: "Valeurs de H aux deux bornes."
          - math: '\int_{0}^{1} x^{2}e^{-x}\,dx = 2 - \dfrac{5}{e} = \dfrac{2e-5}{e}'
            note: "Difference des deux valeurs, mise au meme denominateur e."
      - id: qII6b
