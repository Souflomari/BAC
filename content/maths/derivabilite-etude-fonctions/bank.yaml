    intro: |-
      **Problème (examen national, session normale 2018, Sciences Expérimentales — SVT et Sciences Physiques, option française) — 11 points.**

      On considère la fonction $g$ définie sur $\mathbb{R}$ par :

      $$g(x) = e^{x} - x^{2} + 3x - 1$$

      **Le tableau de variations de $g$ est fourni par le sujet** (Partie I), tel qu'imprimé — reproduis-le mentalement tel quel, sans y ajouter de valeur : une seule ligne de signe pour $g'(x)$, un unique $+$ sur toute la largeur, et une seule flèche montante pour $g(x)$, de $-\infty$ à $+\infty$. **Aucune valeur intermédiaire n'y figure** — en particulier, $g(0)=0$ n'y est **pas** marqué : c'est précisément ce que la première question te demande d'établir. Un tableau qui porterait déjà ce zéro viderait la question de son sens.

      On considère ensuite la fonction $f$ définie sur $\mathbb{R}$ par :

      $$f(x) = \left(x^{2} - x\right)e^{-x} + x$$

      et $(C)$ sa courbe représentative dans un repère orthonormé $(O, \vec{i}, \vec{j})$ *(unité : 1 cm)*.

      **Le fil du problème.** Trois parties, qui s'enchaînent — rien n'est indépendant, et chaque question **prélève** un résultat déjà établi plus haut plutôt que de repartir de zéro. La Partie I fournit le signe de $g$ ; la Partie II s'en sert pour le sens de variation de $f$, via l'identité $f'=g\cdot e^{-x}$, puis construit toute l'étude de $f$ (limites, asymptote oblique, position relative à cette asymptote, tableau de variations, deux points d'inflexion, tracé, deux intégrales et une aire). La Partie III étudie une suite $u_{n+1}=f(u_n)$, et son tout premier énoncé le dit lui-même, en toutes lettres : « ( on pourra utiliser le résultat de la question II)3)b) ) » — c'est exactement ce renvoi imprimé qui interdit de séparer cette partie du reste du problème.
    questions:
      - id: qI1
        part: "Partie I — Le tableau de g, sans la valeur en 0"
        stem: |-
          **(0,25 pt)** Vérifier que $g(0) = 0$.
        reasoning: |-
          « Vérifier » ne demande aucune recherche : substitue directement $x=0$ dans l'expression de $g$, terme à terme, dans l'ordre où le sujet l'écrit ($e^x$, $-x^2$, $+3x$, $-1$), et regarde si le résultat annoncé tombe. C'est une lecture de calcul, pas une résolution — et c'est cette valeur, une fois établie, qui va servir de pivot à la question suivante : le tableau donné par l'énoncé montre que $g$ est strictement croissante, mais ne dit RIEN sur où elle s'annule. C'est ce zéro-ci qui comble le tableau.
        steps:
          - math: 'g(0) = e^{0} - 0^{2} + 3\times0 - 1'
            note: "On remplace x par 0 dans chacun des quatre termes de g."
          - math: 'g(0) = 1 - 0 + 0 - 1 = 0'
            note: "e puissance 0 vaut 1 ; les deux termes en x s'annulent ; il reste 1 moins 1."
      - id: qI2
        part: "Partie I — Signe de g sur les deux intervalles"
        stem: |-
          **(0,5 pt)** Déterminer le signe de $g(x)$ sur chacun des intervalles $\left]-\infty, 0\right]$ et $\left[0, +\infty\right[$.
        reasoning: |-
          Le tableau donné par le sujet dit que $g$ est **strictement croissante sur $\mathbb{R}$** — rien de plus, aucune valeur n'y est marquée. Combine cette monotonie avec l'unique valeur concrète que tu possèdes, $g(0)=0$ (question précédente) : une fonction strictement croissante range ses valeurs dans le **même ordre** que les $x$ qu'elle range. Donc comparer $x$ à $0$ revient à comparer $g(x)$ à $g(0)=0$ — dans le même sens.
        steps:
          - math: 'g \text{ strictement croissante sur } \mathbb{R} \quad (\text{tableau donné par l''énoncé})'
            note: "Donnee du tableau imprime : un seul signe plus pour g prime, sur toute la droite reelle."
          - math: 'x \le 0 \ \Longrightarrow\ g(x) \le g(0) = 0 \qquad\text{et}\qquad x \ge 0 \ \Longrightarrow\ g(x) \ge g(0) = 0'
            note: "Une fonction strictement croissante conserve l'ordre : on compare chaque x a 0, et g(x) suit."
      - id: qII1a
        part: "Partie II, 1) — Limites de f et asymptote oblique en +∞"
        stem: |-
          **(0,5 pt)** Vérifier que $f(x) = \dfrac{x^{2}}{e^{x}} - \dfrac{x}{e^{x}} + x$ pour tout $x$ de $\mathbb{R}$ puis montrer que $\displaystyle\lim_{x \to +\infty} f(x) = +\infty$.
        reasoning: |-
          Deux tâches emboîtées. La première est une pure réécriture algébrique : distribue $e^{-x}=\dfrac1{e^x}$ sur les deux termes de $x^2-x$. Rien à limiter encore — mais c'est CETTE forme précise, « polynôme divisé par $e^x$ », que la seconde tâche exige.

          Pour la limite, ne te contente jamais d'invoquer « croissances comparées » en l'air : ramène chaque fraction à la forme EXACTE du chapitre 5 de la leçon « Fonction exponentielle » ($e^t/t\to+\infty$ quand $t\to+\infty$). $\dfrac{x}{e^x}$ en est l'inverse direct. $\dfrac{x^2}{e^x}$ demande un pas de plus : pose $t=\dfrac x2$ — exactement le changement de variable que le cours utilise lui-même pour établir $e^x/x\to+\infty$ — pour l'écrire comme un carré de cette même forme.

          Les deux fractions s'effacent ; il ne reste que le $+x$, qui part vers $+\infty$. Une somme d'un terme qui s'annule et d'un terme qui diverge : pas d'indétermination, la limite suit le terme qui explose.
        steps:
          - math: 'f(x) = (x^{2}-x)e^{-x}+x = x^{2}e^{-x} - x\,e^{-x} + x = \dfrac{x^{2}}{e^{x}} - \dfrac{x}{e^{x}} + x'
            note: "On distribue e a la puissance moins x sur les deux termes de x carre moins x, puis on ecrit e a la puissance moins x comme 1 sur e a la puissance x."
          - math: '\dfrac{x}{e^{x}} = \dfrac{1}{e^{x}/x} \longrightarrow 0 \quad \left(\text{inverse de } \dfrac{e^{x}}{x}\to+\infty,\ R4\right)'
            note: "x sur e puissance x est l'inverse direct de la croissance comparee de reference du chapitre 5 de fonction-exponentielle."
          - math: 't=\dfrac{x}{2}\ (\to+\infty \text{ quand } x\to+\infty), \qquad \dfrac{x^{2}}{e^{x}} = \dfrac{(2t)^{2}}{e^{2t}} = 4\left(\dfrac{t}{e^{t}}\right)^{2} \longrightarrow 0'
            note: "Meme changement de variable que celui du cours pour etablir e^x/x -> plus l'infini : on ramene x carre sur e puissance x a la forme exacte du chapitre 5, elevee au carre."
          - math: '\lim_{x\to+\infty} f(x) = 0 - 0 + \lim_{x\to+\infty} x = +\infty'
            note: "Les deux fractions s'effacent ; il ne reste que le terme plus x, qui part vers plus l'infini : pas d'indetermination."
      - id: qII1b
        part: "Partie II, 1) — Limites de f et asymptote oblique en +∞"
        stem: |-
          **(0,75 pt)** Calculer $\displaystyle\lim_{x \to +\infty}\left(f(x) - x\right)$ puis en déduire que $(C)$ admet une asymptote $(D)$ au voisinage de $+\infty$ d'équation $y = x$.
        reasoning: |-
          $f(x)-x$ n'est rien de nouveau à calculer : dans l'expression de départ, le $+x$ de $f$ s'annule exactement avec le $-x$ qu'on soustrait, et il reste $(x^2-x)e^{-x}$ — c'est-à-dire les DEUX MÊMES fractions $\dfrac{x^2}{e^x}-\dfrac{x}{e^x}$ que la question précédente vient de montrer tendre vers $0$ chacune. Même limite, même raison, sans rien recalculer.

          La déduction, elle, n'est pas un théorème séparé à invoquer : un écart qui tend vers $0$ à l'infini, c'est LA définition même d'une asymptote oblique — la distance verticale entre $(C)$ et $(D)$ devient négligeable.
        steps:
          - math: 'f(x) - x = (x^{2}-x)e^{-x} = \dfrac{x^{2}}{e^{x}} - \dfrac{x}{e^{x}}'
            note: "Le plus x de f s'annule avec le moins x qu'on soustrait ; il reste la meme forme qu'a la question precedente."
          - math: '\lim_{x\to+\infty}\left(f(x)-x\right) = 0 - 0 = 0 \quad (\text{memes deux limites qu''en question 1a})'
            note: "Les deux fractions s'effacent, exactement comme dans la question precedente : rien a recalculer."
