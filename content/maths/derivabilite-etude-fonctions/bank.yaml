          **(0,75 pt)** Calculer en $cm^{2}$ l'aire du domaine plan limité par $(C)$ et $(D)$ et les droites d'équations $x = 0$ et $x = 1$.
        reasoning: |-
          Une aire entre deux courbes s'obtient en intégrant la différence DU DESSUS MOINS LE DESSOUS (chapitre 9 de « Calcul intégral »), jamais dans un ordre arbitraire. Il faut donc savoir qui est où sur $[0,1]$ : la question 2b l'a établi, $(C)$ est **en dessous** de $(D)$ sur cet intervalle. C'est donc $x-f(x)$ — et non $f(x)-x$, qui donnerait un nombre négatif — qu'il faut intégrer.

          Le repère est orthonormé, unité $1$ cm, donc $1$ unité d'aire vaut exactement $1\,\text{cm}^2$ : le résultat de l'intégrale se lit directement en $\text{cm}^2$, sans conversion. Et $x-f(x)$, une fois développé, n'est rien d'autre que la différence des deux intégrales déjà calculées aux questions 6a et 6b — aucun nouveau calcul d'intégrale à faire.
        steps:
          - math: '\text{sur } [0,1],\ (C) \text{ est en dessous de } (D) \quad (\text{question } 2b) \ \Longrightarrow\ \text{Aire} = \int_{0}^{1} \bigl(x-f(x)\bigr)\,dx \times 1\,\text{cm}^{2}'
            note: "On integre le dessus (D) moins le dessous (C), positif sur [0,1] ; unite d'aire = 1 cm carre car le repere est orthonorme d'unite 1 cm."
          - math: 'x - f(x) = -\bigl(f(x)-x\bigr) = -(x^{2}-x)e^{-x} = x\,e^{-x} - x^{2}e^{-x}'
            note: "On reprend l'expression de f(x) moins x deja etablie en 2a, et on en change le signe."
          - math: '\int_{0}^{1}\bigl(x-f(x)\bigr)\,dx = \int_{0}^{1} x\,e^{-x}\,dx - \int_{0}^{1} x^{2}e^{-x}\,dx = \dfrac{e-2}{e} - \dfrac{2e-5}{e}'
            note: "La difference se scinde en exactement les deux integrales des questions 6b et 6a, deja calculees : rien a recalculer."
          - math: '\dfrac{e-2}{e} - \dfrac{2e-5}{e} = \dfrac{(e-2)-(2e-5)}{e} = \dfrac{3-e}{e} = \dfrac{3}{e}-1'
            note: "On regroupe au meme denominateur e."
          - math: '\text{Aire} = \left(\dfrac{3}{e}-1\right)\text{cm}^{2} \approx 0{,}10\ \text{cm}^{2} \quad (\text{positif car } e<3)'
            note: "Resultat positif : e vaut environ 2,72, donc 3 sur e depasse 1."
      - id: qIII1
        part: "Partie III — Encadrer la suite entre 0 et 1"
        stem: |-
          **(0,75 pt)** Montrer que $0 \le u_{n} \le 1$ pour tout $n$ de $\mathbb{N}$ *( on pourra utiliser le résultat de la question II)3)b) )*.
        reasoning: |-
          La suite est définie par récurrence ($u_{n+1}=f(u_n)$) : la propriété à démontrer se prouve donc par récurrence (chapitre chapitre 2 de « Suites numériques », le mécanisme des dominos), pas par un calcul direct.

          Initialisation immédiate : $u_0=\frac12\in[0,1]$.

          Hérédité : c'est ICI que le renvoi imprimé par le sujet intervient — « le résultat de la question II)3)b) », c'est-à-dire la monotonie de $f$. $f$ est croissante sur $[0,+\infty[$, qui contient $[0,1]$ tout entier ; une fonction croissante **transporte l'ordre** : encadrer $u_n$ entre $0$ et $1$ encadre donc $f(u_n)$ entre $f(0)$ et $f(1)$, dans le même sens. Il ne reste qu'à calculer ces deux bords — $f(0)=0$ (déjà vu en 3c) et $f(1)=(1-1)e^{-1}+1=1$ — pour conclure $0\le u_{n+1}\le1$, et boucler la récurrence.
        steps:
          - math: 'u_{0} = \dfrac12 \ \Longrightarrow\ 0 \le u_{0} \le 1'
            note: "Initialisation : le premier terme est bien dans l'intervalle."
          - math: '\text{Heredite : on suppose } 0 \le u_{n} \le 1. \ f \text{ croissante sur } [0,+\infty[ \supseteq [0,1] \quad (\text{question II-3b})'
            note: "On reutilise la monotonie de f, deja etablie, sur l'intervalle qui contient u_n : c'est le renvoi imprime par le sujet."
          - math: 'f \text{ croissante} \ \Longrightarrow\ f(0) \le f(u_{n}) \le f(1)'
            note: "Une fonction croissante conserve l'ordre : encadrer u_n encadre f(u_n) de la meme facon."
          - math: 'f(0) = 0 \quad (\text{deja calcule en 3c}) \qquad f(1) = (1-1)e^{-1}+1 = 1'
            note: "Valeurs de f aux deux bords 0 et 1 de l'intervalle."
          - math: '0 \le f(u_{n}) \le 1 \Longleftrightarrow 0 \le u_{n+1} \le 1 \ \Longrightarrow\ \text{la propriete est vraie pour tout } n \in \mathbb{N}'
            note: "u_n+1 est par definition f(u_n) : l'heredite est etablie, la recurrence conclut pour tout n."
      - id: qIII2
        part: "Partie III — Décroissance de la suite"
        stem: |-
          **(0,5 pt)** Montrer que la suite $(u_{n})$ est décroissante.
        reasoning: |-
          Le signe de $u_{n+1}-u_n=f(u_n)-u_n$ décide de la monotonie. Ici, ce n'est PAS le résultat de II-3b qui sert (utilisé à la question précédente), mais celui de la question **II-2a** : « $f(x)-x$ a le même signe que $x^2-x$ », vrai pour tout réel $x$, donc en particulier pour $x=u_n$.

          Or la question précédente vient d'enfermer $u_n$ dans $[0,1]$ pour tout $n$. Sur cet intervalle, $u_n(u_n-1)\le0$ : $u_n$ y est positif ou nul, $u_n-1$ y est négatif ou nul, leur produit est donc négatif ou nul. D'où $f(u_n)-u_n\le0$, c'est-à-dire $u_{n+1}\le u_n$, pour tout $n$.
        steps:
          - math: 'u_{n+1}-u_{n} = f(u_{n})-u_{n}'
            note: "Par definition de la suite, u_n+1 vaut f(u_n)."
          - math: 'f(u_{n})-u_{n} \text{ a le meme signe que } u_{n}^{2}-u_{n} = u_{n}(u_{n}-1) \quad (\text{question II-2a, appliquee en } x=u_n)'
            note: "Resultat general de la question 2a, reutilise ici en remplacant x par u_n."
          - math: '0 \le u_{n} \le 1 \quad (\text{question III-1}) \ \Longrightarrow\ u_{n} \ge 0 \text{ et } u_{n}-1 \le 0 \ \Longrightarrow\ u_{n}(u_{n}-1) \le 0'
            note: "Sur [0,1], un facteur positif ou nul fois un facteur negatif ou nul donne un produit negatif ou nul."
          - math: 'u_{n+1}-u_{n} \le 0 \ \Longrightarrow\ (u_{n}) \text{ est decroissante}'
            note: "Le signe du terme suivant moins le terme courant est negatif ou nul, pour tout n : la suite decroit."
      - id: qIII3
        part: "Partie III — Convergence et limite"
        stem: |-
          **(0,75 pt)** En déduire que $(u_{n})$ est convergente et déterminer sa limite.
        reasoning: |-
          Deux étapes distinctes. D'abord la convergence, garantie SANS connaître la valeur : $(u_n)$ est décroissante (III-2) et minorée par $0$ (III-1) — c'est exactement l'hypothèse du théorème de la limite monotone (chapitre chapitre 8 de « Suites numériques »).

          Ensuite, trouver la valeur : c'est la méthode du chapitre R8 pour les suites $u_{n+1}=f(u_n)$. $f$ est continue sur $\mathbb{R}$ (somme et produit de fonctions continues), donc si $u_n\to L$, passer à la limite dans $u_{n+1}=f(u_n)$ donne $L=f(L)$ — $L$ est un **point fixe** de $f$. Résous cette équation : $(L^2-L)e^{-L}+L=L$ se simplifie en $(L^2-L)e^{-L}=0$, et comme $e^{-L}$ n'est jamais nul, il reste $L(L-1)=0$, donc $L=0$ ou $L=1$.

          Pour trancher entre les deux, réutilise la monotonie : la suite décroît à partir de $u_0=\frac12$, donc **tous** ses termes — et leur limite — restent $\le\frac12$. Comme $\frac12<1$, la valeur $L=1$ est impossible : il reste $L=0$.
        steps:
          - math: '(u_{n}) \text{ decroissante (III-2), minoree par } 0 \text{ (III-1)} \ \Longrightarrow\ (u_{n}) \text{ converge vers une limite } L\in[0,1] \quad (\text{theoreme de la limite monotone, R7})'
            note: "Decroissante et minoree : la convergence est garantie sans connaitre encore la valeur de la limite."
          - math: 'f \text{ continue sur } \mathbb{R} \ (\text{somme et produit de fonctions continues}),\ u_{n+1}=f(u_{n}) \ \Longrightarrow\ L = f(L) \quad (R8)'
            note: "On passe a la limite dans la relation de recurrence : la continuite de f permet d'echanger limite et f."
          - math: 'f(L)=L \iff (L^{2}-L)e^{-L}=0 \iff L^{2}-L=0 \iff L(L-1)=0 \iff L=0 \text{ ou } L=1'
            note: "e puissance moins L n'est jamais nul : seul le facteur L(L moins 1) peut s'annuler."
          - math: '(u_{n}) \text{ decroissante et } u_{0}=\dfrac12 \ \Longrightarrow\ L \le \dfrac12 < 1 \ \Longrightarrow\ L \ne 1 \ \Longrightarrow\ L = 0'
            note: "La suite decroit a partir d'un demi : la limite ne peut pas etre 1, donc elle vaut 0."
