# notion, plutôt qu'un concept neuf non couvert. LA MÊME SITUATION RECURRE
# À CINQ REPRISES sur les entrées ajoutées ensuite, et reçoit le MÊME
# traitement (checklist à quatre axiomes restreinte, jamais de « critère »
