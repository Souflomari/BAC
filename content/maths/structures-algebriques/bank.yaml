    intro: |-
      **Structures algébriques (examen national, session normale 2020, Sciences Mathématiques — exercice au choix).**

      On note par $M_2(\mathbb{R})$ l'ensemble des matrices carrées d'ordre deux. On rappelle que $(M_2(\mathbb{R}),+,\times)$ est un anneau non commutatif unitaire d'unité $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$ et que $(\mathbb{R}^*,\times)$ est un groupe commutatif.

      On considère le sous-ensemble $E$ de $M_2(\mathbb{R})$ défini par :

      $$E = \left\{ \begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix} \ /\ x \in \mathbb{R}\ \text{ et }\ y \in \mathbb{R}^* \right\}$$

      L'exercice enchaîne stabilité (chapitre 2), groupe non commutatif (chapitre 4, avec le contraste du chapitre 6), puis un homomorphisme (chapitre 10) qui transporte cette fois la structure d'un groupe **déjà connu**, $(\mathbb{R}^*,\times)$, vers un sous-ensemble plus restreint $F$ — le sens inverse de l'isomorphisme du sujet 2019, mais le même geste.
    questions:
      - id: q1
        part: "L'ensemble $E$ : stabilité, non-commutativité, un calcul de vérification"
        stem: |-
          **(0,5 pt)** Montrer que $E$ est une partie stable de $(M_2(\mathbb{R}),\times)$
        reasoning: |-
          La stabilité de $E$ (chapitre 2, ici restreinte à ce sous-ensemble de $M_2(\mathbb{R})$) demande que le produit de deux éléments de $E$ reste dans $E$. Appartenir à $E$ signifie une forme précise : un $1$ fixe en haut à gauche, un $0$ fixe en bas à gauche, un réel quelconque en haut à droite, et un réel **non nul** en bas à droite. On calcule le produit matriciel de deux éléments génériques de $E$ et on vérifie que le résultat garde cette forme.

          Le seul point qui demande un peu d'attention est le coefficient en bas à droite du résultat : c'est un produit de deux réels non nuls, donc lui-même non nul — c'est précisément ce qui maintient le résultat dans $E$, et non dans un ensemble plus large où ce coefficient pourrait s'annuler.
        steps:
          - math: '\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix}\begin{pmatrix} 1 & a \\ 0 & b \end{pmatrix} = \begin{pmatrix} 1 & a+xb \\ 0 & yb \end{pmatrix}'
            note: "Produit matriciel usuel, avec x,a réels quelconques et y,b réels non nuls."
          - math: 'y \neq 0, \ b \neq 0 \ \Longrightarrow\ yb \neq 0'
            note: "Produit de deux réels non nuls : le coefficient bas-droit du résultat reste non nul."
          - math: '\begin{pmatrix} 1 & a+xb \\ 0 & yb \end{pmatrix} \in E'
            note: "Le résultat a exactement la forme de E : E est stable pour × dans M2(R)."
      - id: q2
        stem: |-
          **(0,5 pt)** Montrer que la multiplication n'est pas commutative dans $E$
        reasoning: |-
          Pour réfuter la commutativité (chapitre 3), un seul contre-exemple numérique suffit — pas besoin de traiter le cas général en entier, contrairement à ce qui serait nécessaire pour la **prouver**. On compare d'abord les deux formules générales, obtenues en échangeant les rôles des deux facteurs dans le calcul de la question précédente : les coefficients bas-droit coïncident toujours ($yb=by$, car $\times$ est commutative dans $\mathbb{R}$), mais rien ne garantit que les coefficients haut-droit coïncident.

          Il suffit alors de choisir des valeurs numériques simples où ces deux coefficients haut-droit diffèrent effectivement, pour obtenir deux matrices produits distinctes selon l'ordre.
        steps:
          - math: '\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix}\begin{pmatrix} 1 & a \\ 0 & b \end{pmatrix} = \begin{pmatrix} 1 & a+xb \\ 0 & yb \end{pmatrix}, \qquad \begin{pmatrix} 1 & a \\ 0 & b \end{pmatrix}\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix} = \begin{pmatrix} 1 & x+ay \\ 0 & by \end{pmatrix}'
            note: "Les deux produits, dans les deux ordres : coefficients bas-droit égaux, mais coefficients haut-droit a priori différents."
          - math: 'x=0,\ y=2,\ a=1,\ b=1: \qquad \begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix} = \begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}'
            note: "Un exemple numérique concret, produit dans le premier ordre."
          - math: '\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}\begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix} = \begin{pmatrix} 1 & 2 \\ 0 & 2 \end{pmatrix}'
            note: "Le produit des deux mêmes matrices, dans l'autre ordre : le coefficient haut-droit passe de 1 à 2."
          - math: '\begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix} \neq \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}\begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}'
            note: "Un seul contre-exemple suffit : la multiplication n'est pas commutative dans E."
      - id: q3
        stem: |-
          **(0,5 pt)** Vérifier que : $(\forall x \in \mathbb{R})(\forall y \in \mathbb{R}^*)$ ;

          $$\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix}\begin{pmatrix} 1 & -\dfrac{x}{y} \\ 0 & \dfrac{1}{y} \end{pmatrix} = \begin{pmatrix} 1 & -\dfrac{x}{y} \\ 0 & \dfrac{1}{y} \end{pmatrix}\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$$
        reasoning: |-
          Ce calcul prépare directement le symétrique du chapitre 3, mais dans un ensemble déjà su non commutatif (question précédente) : il faut donc vérifier les **deux** produits, dans les deux ordres, sans supposer que l'un entraîne l'autre. Rien à deviner — le candidat est donné par l'énoncé, il suffit d'appliquer deux fois la règle de multiplication établie à la question 1, et de constater que les deux produits valent l'unité $I$.

          Le quotient par $y$ est licite à chaque étape : $y \in \mathbb{R}^*$, donc jamais nul.
        steps:
          - math: '\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix}\begin{pmatrix} 1 & -\dfrac{x}{y} \\ 0 & \dfrac{1}{y} \end{pmatrix} = \begin{pmatrix} 1 & -\dfrac{x}{y}+x\cdot\dfrac{1}{y} \\ 0 & y\cdot\dfrac{1}{y} \end{pmatrix}'
            note: "Produit dans le premier ordre, règle de la question 1."
          - math: '= \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}'
            note: "Les deux termes en x/y s'annulent, et y fois 1/y vaut 1 : le résultat est I."
          - math: '\begin{pmatrix} 1 & -\dfrac{x}{y} \\ 0 & \dfrac{1}{y} \end{pmatrix}\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix} = \begin{pmatrix} 1 & x-\dfrac{x}{y}\cdot y \\ 0 & \dfrac{1}{y}\cdot y \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}'
            note: "Produit dans l'ordre inverse : mêmes annulations, même résultat I."
      - id: q4
        part: "$(E,\\times)$ : un groupe non commutatif"
        stem: |-
          **(0,5 pt)** Montrer que $(E,\times)$ est un groupe non commutatif.
        reasoning: |-
          On reprend la liste de contrôle du groupe (chapitre 4), restreinte à $E$, en réutilisant sans les refaire les résultats déjà établis : loi interne, c'est la stabilité de la question 1 ; associativité, un fait général admis — la multiplication des matrices est **toujours** associative dans $M_2(\mathbb{R})$, exactement comme la composition des applications l'était pour le groupe des symétries du rectangle au chapitre 4.

          Restent le neutre et le symétrique. Le neutre $I = \begin{pmatrix}1&0\\0&1\end{pmatrix}$ appartient à $E$ (avec $x=0$ réel et $y=1$ non nul) — c'est le rappel de tête d'énoncé. Le symétrique de chaque élément est exactement le candidat vérifié à la question 3 : il reste dans $E$ car $y \neq 0$ entraîne $\dfrac{1}{y} \neq 0$. Les quatre axiomes tiennent dans $E$ : $(E,\times)$ est un groupe, non commutatif par la question 2 (chapitre 6, mais en négatif — c'est le contre-exemple qui compte ici, pas la définition positive).
        steps:
          - math: '\times \ \text{interne sur } E \ (\text{q1}); \qquad \times \ \text{associative} \ (\text{produit matriciel, toujours associatif})'
            note: "Deux axiomes : le premier vient de la question 1, le second est un fait général admis."
          - math: 'I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix} \in E \quad (x=0,\ y=1\neq 0)'
            note: "Le neutre I appartient à E."
          - math: '\text{sym}\begin{pmatrix} 1 & x \\ 0 & y \end{pmatrix} = \begin{pmatrix} 1 & -\dfrac{x}{y} \\ 0 & \dfrac{1}{y} \end{pmatrix} \in E \quad (\text{q3})'
            note: "Le symétrique vérifié à la question 3 reste dans E, car y non nul donne 1/y non nul."
          - math: '(E,\times) \ \text{est un groupe, non commutatif} \ (\text{q2})'
            note: "Les quatre axiomes sont vérifiés dans E ; la non-commutativité vient de la question 2."
      - id: q5
        part: "Le sous-ensemble $F$ : un homomorphisme depuis $(\\mathbb{R}^*,\\times)$"
        stem: |-
          On considère le sous-ensemble $F$ de $E$ défini par : $F = \left\{ M(x) = \begin{pmatrix} 1 & x-1 \\ 0 & x \end{pmatrix} \ /\ x \in \mathbb{R}^* \right\}$. **(0,5 pt)** Montrer que l'application $\varphi$ définie par : $(\forall x \in \mathbb{R}^*)$ ; $\varphi(x) = M(x)$ est un homomorphisme de $(\mathbb{R}^*,\times)$ vers $(E,\times)$.
        reasoning: |-
          Un homomorphisme (le geste-pont du chapitre 10, sans exiger la bijectivité pour l'instant) demande que $\varphi$ transforme la loi $\times$ de $\mathbb{R}^*$ en la loi $\times$ de $E$ : $\varphi(x \times t)$ doit égaler $\varphi(x) \times \varphi(t)$, pour tous $x,t \in \mathbb{R}^*$. On développe le produit matriciel $\varphi(x) \times \varphi(t)$ avec la règle de la question 1 (adaptée : ici le coefficient haut-droit vaut $x-1$, pas un réel libre), et on doit retrouver exactement $\varphi(xt) = M(xt)$.

          Le calcul se ramène à une simplification algébrique sur $\mathbb{R}$ : le $-1$ et le $t$ introduits par la formule de la question 1 s'annulent pour laisser $xt-1$, exactement le coefficient haut-droit attendu de $M(xt)$.
        steps:
          - math: '\varphi(x) = M(x) = \begin{pmatrix} 1 & x-1 \\ 0 & x \end{pmatrix}, \qquad \varphi(t) = M(t) = \begin{pmatrix} 1 & t-1 \\ 0 & t \end{pmatrix}'
            note: "Les images de x et t par φ, deux réels non nuls quelconques."
          - math: '\varphi(x)\times\varphi(t) = \begin{pmatrix} 1 & (t-1)+(x-1)t \\ 0 & xt \end{pmatrix}'
            note: "Produit matriciel, règle de la question 1."
          - math: '(t-1)+(x-1)t = t-1+xt-t = xt-1'
            note: "Développement du coefficient haut-droit : les termes en t s'annulent."
          - math: '\varphi(x)\times\varphi(t) = \begin{pmatrix} 1 & xt-1 \\ 0 & xt \end{pmatrix} = M(xt) = \varphi(x\times t)'
            note: "Le résultat vaut exactement M(xt) : φ transforme × de ℝ* en × de E, c'est un homomorphisme."
      - id: q6
        stem: |-
          **(1 pt)** En déduire que $(F,\times)$ est un groupe commutatif dont on précisera l'élément neutre.
        reasoning: |-
          On mobilise le pont du chapitre 10 une seconde fois, mais dans l'autre sens que le sujet 2019 : ici $\varphi$ part d'un groupe **déjà connu**, $(\mathbb{R}^*,\times)$, commutatif par le rappel de tête d'énoncé, et son homomorphisme (question précédente) a pour image exactement $F$ — $F$ est **défini** comme l'ensemble des $M(x)$ pour $x \in \mathbb{R}^*$, c'est-à-dire $\varphi(\mathbb{R}^*)$ lui-même. $\varphi$ est de plus trivialement bijective de $\mathbb{R}^*$ vers $F$ : deux réels distincts $x$ et $t$ donnent deux matrices distinctes, puisque leur coefficient bas-droit ($x$ ou $t$) les distingue déjà — $\varphi$ est injective, et surjective sur $F$ par construction même de $F$.

          $\varphi$ est donc un isomorphisme de $(\mathbb{R}^*,\times)$ vers $(F,\times)$ : toute la structure de $(\mathbb{R}^*,\times)$ se transporte, sans re-vérifier aucun axiome sur $F$. $(F,\times)$ est un groupe commutatif, de neutre $\varphi(1) = M(1) = I$.
        steps:
          - math: 'F = \{M(x) : x \in \mathbb{R}^*\} = \varphi(\mathbb{R}^*)'
            note: "F est par définition l'image de φ : φ est surjective de ℝ* sur F."
          - math: '\varphi(x) = \varphi(t) \ \Longrightarrow\ x = t'
            note: "Deux réels distincts donnent deux matrices distinctes (coefficient bas-droit x ou t) : φ est injective."
          - math: '\varphi \ \text{est un isomorphisme de} \ (\mathbb{R}^*,\times) \ \text{vers} \ (F,\times)'
            note: "Bijective et morphisme (question précédente) : φ est un isomorphisme."
          - math: '(\mathbb{R}^*,\times) \ \text{groupe commutatif} \ \Longrightarrow\ (F,\times) \ \text{groupe commutatif}'
            note: "La structure se transporte par φ, sans re-vérifier les axiomes sur F."
          - math: '\varphi(1) = M(1) = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix} = I'
            note: "Le neutre de F est l'image du neutre 1 de ℝ* : c'est l'unité I."

  # ── bk-2022-n-x4 — 2022 N, Exercice 4 : anneau de matrices E≅Z[√3], homomorphisme, inversibilité, intégrité, corps ──
