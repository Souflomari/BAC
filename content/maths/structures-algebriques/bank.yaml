        bridgé directement via la définition du corps du rung R6
        (multiplication par l'inverse supposé), sans introduire de
        vocabulaire non enseigné. q1 et q8 relèvent en outre du trou
        « sous-groupe » déjà documenté (SCOPE NOTE 1).
    intro: |-
      **Structures algébriques (examen national, session normale 2023, Sciences Mathématiques).**

      On rappelle que $(M_2(\mathbb{R}), +, \times)$ est un anneau non commutatif de zéro la matrice $O = \begin{pmatrix} 0 & 0 \\ 0 & 0 \end{pmatrix}$ et d'unité la matrice $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$, et que $(M_2(\mathbb{R}), +, \cdot)$ est un espace vectoriel réel.

      On considère l'ensemble $E = \left\{ M(x,y) = \begin{pmatrix} x+y & y \\ 2y & x-y \end{pmatrix} \ /\ (x,y) \in \mathbb{R}^2 \right\}$

      L'exercice construit d'abord, sur $\mathbb{R}$, un anneau commutatif et unitaire de matrices (chapitre 7, avec les deux extensions déjà rencontrées au sujet 2022) — puis montre, par un contre-exemple, qu'il **n'est pas un corps** (chapitre 9). La seconde partie restreint les mêmes coefficients à $\mathbb{Q}$ : sur ce sous-ensemble plus étroit, la même famille de matrices devient, cette fois, un véritable corps — identifié par un isomorphisme (chapitre 10) à $F = \mathbb{Q}[\sqrt3]$.
    questions:
      - id: q1
        part: "Partie I — $E$ : sous-groupe additif et sous-espace vectoriel"
        stem: |-
          **(0,5 pt)** Montrer que $E$ est un sous-groupe de $(M_2(\mathbb{R}), +)$.
        reasoning: |-
          Montrer que $E$ est un sous-groupe de $(M_2(\mathbb{R}),+)$, c'est montrer que $(E,+)$ est **lui-même** un groupe — la même démarche qu'au chapitre 4, mais restreinte à $E$ : on recoche les quatre axiomes, un par un, à l'intérieur de $E$. C'est exactement le geste déjà mené pour l'ensemble $E$ du sujet 2022 (matrices à coefficients entiers), ici avec des coefficients réels.

          La stabilité se lit directement sur l'addition matricielle, coefficient par coefficient : le résultat reste de la forme $M(\cdot,\cdot)$. L'associativité est héritée de $M_2(\mathbb{R})$ tout entier. Le neutre $O=M(0,0)$ et l'opposé $-M(x,y)=M(-x,-y)$ restent eux aussi de cette forme — les quatre axiomes tiennent dans $E$.
        steps:
          - math: 'M(x,y)+M(a,b) = \begin{pmatrix} x+y & y \\ 2y & x-y \end{pmatrix} + \begin{pmatrix} a+b & b \\ 2b & a-b \end{pmatrix} = \begin{pmatrix} (x+a)+(y+b) & y+b \\ 2(y+b) & (x+a)-(y+b) \end{pmatrix}'
            note: "Addition matricielle coefficient par coefficient, avec (a,b) pour le second couple."
          - math: 'M(x,y)+M(a,b) = M(x+a,\ y+b) \in E'
            note: "E est stable pour + : le résultat est encore de la forme M(·,·)."
          - math: '+ \ \text{associative sur } M_2(\mathbb{R}) \ (\text{fait général}) \ \Longrightarrow\ \text{associative sur } E'
            note: "Héritée de M2(R) tout entier, comme pour l'ensemble E du sujet 2022."
          - math: 'O = \begin{pmatrix} 0 & 0 \\ 0 & 0 \end{pmatrix} = M(0,0) \in E, \qquad -M(x,y) = M(-x,\ -y) \in E'
            note: "Le neutre O et l'opposé de chaque élément restent de la forme M(·,·) : ils sont dans E."
          - math: 'E \ \text{est un sous-groupe de} \ (M_2(\mathbb{R}),+)'
            note: "Les quatre axiomes sont vérifiés dans E."
      - id: q2
        stem: |-
          **(0,25 pt)** Montrer que $E$ est un sous-espace vectoriel de $(M_2(\mathbb{R}), +, \cdot)$.
        reasoning: |-
          Montrer que $E$ est un sous-espace vectoriel de $(M_2(\mathbb{R}),+,\cdot)$ mobilise une notion d'un chapitre antérieur du cursus (les espaces vectoriels), rappelée en tête d'énoncé — pas un outil neuf de ce chapitre sur les structures algébriques. Le geste reste néanmoins très proche de la stabilité du chapitre 2 : $E$ est non vide (il contient $O$, question précédente), stable pour $+$ (déjà établi), et il reste seulement à vérifier la stabilité pour la multiplication par un réel $\lambda$.

          Le calcul est direct : multiplier chaque coefficient de $M(x,y)$ par $\lambda$ revient à multiplier $x$ et $y$ par $\lambda$ dans la même formule, donc le résultat reste de la forme $M(\cdot,\cdot)$.
        steps:
          - math: 'E \neq \varnothing \quad (O = M(0,0) \in E,\ \text{q1}), \qquad E \ \text{stable pour} \ + \quad (\text{q1})'
            note: "Deux des trois conditions d'un sous-espace vectoriel, déjà établies."
          - math: '\lambda \cdot M(x,y) = \lambda\begin{pmatrix} x+y & y \\ 2y & x-y \end{pmatrix} = \begin{pmatrix} \lambda(x+y) & \lambda y \\ 2\lambda y & \lambda(x-y) \end{pmatrix}'
            note: "Multiplication de chaque coefficient de M(x,y) par le réel λ."
          - math: '= \begin{pmatrix} \lambda x+\lambda y & \lambda y \\ 2\lambda y & \lambda x-\lambda y \end{pmatrix} = M(\lambda x,\ \lambda y) \in E'
            note: "Le résultat garde exactement la forme M(·,·) : E est stable pour la multiplication par un scalaire."
          - math: 'E \ \text{est un sous-espace vectoriel de} \ (M_2(\mathbb{R}),+,\cdot)'
            note: "Non vide, stable pour + et pour · : les trois conditions sont réunies."
      - id: q3
        part: "La multiplication sur $E$ : un anneau commutatif et unitaire"
        stem: |-
          **(0,25 pt)** Vérifier que : $\forall(x, y, x', y') \in \mathbb{R}^4$ ; $M(x,y) \times M(x',y') = M(xx' + 3yy',\ xy' + yx')$
        reasoning: |-
          Un calcul de vérification, pas de recherche : on développe le produit matriciel usuel, ligne par colonne, et on regroupe pour retrouver la forme $M(\cdot,\cdot)$. Dans les calculs qui suivent, on note $(a,b)$ le second couple de l'énoncé $(x',y')$ — pour éviter la confusion typographique du prime — sans rien changer au fond : c'est exactement le même second facteur.

          Ce résultat sera réutilisé tel quel dans presque toutes les questions qui suivent, dans les deux parties : c'est lui qui donne, à chaque fois, la forme du produit de deux éléments de $E$ (ou de $F$, une fois identifié à $E$ par $\varphi$).
        steps:
          - math: 'M(x,y)\times M(a,b) = \begin{pmatrix} x+y & y \\ 2y & x-y \end{pmatrix}\begin{pmatrix} a+b & b \\ 2b & a-b \end{pmatrix}'
            note: "Produit matriciel, avec (a,b) pour le second couple (x',y') de l'énoncé."
          - math: '= \begin{pmatrix} (x+y)(a+b)+2yb & (x+y)b+y(a-b) \\ 2y(a+b)+2b(x-y) & 2yb+(x-y)(a-b) \end{pmatrix}'
            note: "Développement ligne par colonne."
          - math: '= \begin{pmatrix} xa+3yb+xb+ya & xb+ya \\ 2(xb+ya) & xa+3yb-xb-ya \end{pmatrix} = M(xa+3yb,\ xb+ya)'
            note: "Après simplification, le résultat a exactement la forme M(·,·) annoncée."
      - id: q4
        stem: |-
          **(0,5 pt)** En déduire que $(E, +, \times)$ est un anneau commutatif et unitaire.
        reasoning: |-
          On va un cran plus loin que la définition de base de l'anneau (chapitre 7) : après avoir établi que $(E,+)$ est un groupe commutatif (q1, commutativité héritée de $+$ sur $M_2(\mathbb{R})$, où elle tient toujours) et que $\times$ est associative et distributive sur $E$ (héritées de $M_2(\mathbb{R})$ tout entier, déjà un anneau), reste ce qui ne s'hérite **pas** automatiquement : $M_2(\mathbb{R})$ n'est **pas** commutatif pour $\times$ (rappel de tête d'énoncé), donc la commutativité de $\times$ sur $E$ se vérifie directement, avec la formule de la question précédente.

          L'unité s'hérite sans difficulté : $I=M(1,0)$ est déjà l'unité de tout $M_2(\mathbb{R})$, et $I\in E$.
        steps:
          - math: '(E,+) \ \text{groupe commutatif} \ (\text{q1, hérité de } +\text{ sur } M_2(\mathbb{R}))'
            note: "Premier ingrédient de l'anneau."
          - math: '\times \ \text{associative et distributive par rapport à} \ + \ \text{sur } E \ (\text{héritées de } M_2(\mathbb{R}))'
            note: "Deuxième et troisième ingrédients, hérités du grand anneau."
          - math: 'M(x,y)\times M(a,b) = M(xa+3yb,\ xb+ya) = M(ax+3by,\ ay+bx) = M(a,b)\times M(x,y)'
            note: "Commutativité de × sur E : les deux coordonnées du résultat sont symétriques en (x,y) et (a,b)."
          - math: 'I = M(1,0) \in E \quad (x+y=1,\ y=0,\ 2y=0,\ x-y=1)'
            note: "I, déjà unité de tout M2(R), appartient à E."
          - math: '(E,+,\times) \ \text{est un anneau commutatif et unitaire}'
            note: "Toutes les conditions sont réunies."
      - id: q5
        part: "$(E,+,\\times)$ n'est pas un corps"
        stem: |-
          **(0,25 pt)** Vérifier que : $M(\sqrt{3}, 1) \times M(-\sqrt{3}, 1) = O$
        reasoning: |-
          Un calcul de vérification direct, avec la formule de la question 3 ($x=\sqrt3, y=1$ pour le premier facteur ; $a=-\sqrt3, b=1$ pour le second, en reprenant la notation $(a,b)$ introduite pour ce second couple).
        steps:
          - math: 'M(\sqrt3,1)\times M(-\sqrt3,1) = M\big(\sqrt3\cdot(-\sqrt3)+3\cdot1\cdot1,\ \ \sqrt3\cdot1+1\cdot(-\sqrt3)\big)'
            note: "Formule de la question 3, avec x=√3, y=1, a=−√3, b=1."
          - math: '\sqrt3\cdot(-\sqrt3)+3 = -3+3 = 0, \qquad \sqrt3-\sqrt3 = 0'
            note: "Les deux coordonnées s'annulent."
          - math: 'M(\sqrt3,1)\times M(-\sqrt3,1) = M(0,0) = O'
            note: "Une matrice M(0,0) est exactement la matrice nulle."
      - id: q6
        stem: |-
          **(0,25 pt)** En déduire que $(E, +, \times)$ n'est pas un corps.
        reasoning: |-
          Un corps exige (chapitre 9) que **tout** élément non nul possède un symétrique pour $\times$. On vient d'exhiber deux matrices non nulles — $M(\sqrt3,1)$ et $M(-\sqrt3,1)$ ont chacune un coefficient $y=1\neq0$ en haut à droite, donc aucune des deux n'est la matrice nulle $O$ — dont le produit vaut pourtant $O$ (question précédente).

          Or dans un corps, ceci est impossible : si $M(\sqrt3,1)$ admettait un inverse pour $\times$, multiplier les deux membres de $M(\sqrt3,1)\times M(-\sqrt3,1)=O$ par cet inverse donnerait $M(-\sqrt3,1) = M(\sqrt3,1)^{-1}\times O = O$ — contradiction, puisque $M(-\sqrt3,1)$ est non nulle. $M(\sqrt3,1)$ est donc un élément non nul de $E$ sans symétrique pour $\times$ : l'exigence du chapitre 9 échoue, $(E,+,\times)$ n'est pas un corps.
        steps:
          - math: 'M(\sqrt3,1) \neq O \quad \text{et} \quad M(-\sqrt3,1) \neq O \qquad (\text{coefficient } y=1\neq0 \text{ dans les deux})'
            note: "Les deux facteurs du produit de la question précédente sont non nuls."
          - math: '\text{Si } M(\sqrt3,1) \ \text{était inversible dans} \ (E,\times): \quad M(\sqrt3,1)^{-1}\times\Big[M(\sqrt3,1)\times M(-\sqrt3,1)\Big] = M(\sqrt3,1)^{-1}\times O = O'
            note: "On multiplierait les deux membres de l'égalité précédente par l'inverse supposé."
          - math: 'M(\sqrt3,1)^{-1}\times\Big[M(\sqrt3,1)\times M(-\sqrt3,1)\Big] = \Big[M(\sqrt3,1)^{-1}\times M(\sqrt3,1)\Big]\times M(-\sqrt3,1) = M(-\sqrt3,1)'
            note: "Associativité, puis inverse fois M(√3,1) donne I : il reste M(−√3,1)."
          - math: 'M(-\sqrt3,1) = O \quad \text{contredit} \quad M(-\sqrt3,1) \neq O'
            note: "Contradiction : M(√3,1) ne peut donc pas être inversible dans (E,×)."
          - math: '(E,+,\times) \ \text{ne constitue pas un corps}'
            note: "Un seul élément non nul sans symétrique suffit à réfuter l'exigence du chapitre 9."
      - id: q7
        part: "Partie II — $F$ et $G$ : un sous-groupe multiplicatif"
        stem: |-
          Soient $F = \left\{ x + y\sqrt{3} \ /\ (x,y) \in \mathbb{Q}^2 \right\}$ *(glyphe à confirmer : $\mathbb{Q}$)* et $G = \left\{ M(x,y) = \begin{pmatrix} x+y & y \\ 2y & x-y \end{pmatrix} \ /\ (x,y) \in \mathbb{Q}^2 \right\}$ *(glyphe à confirmer : $\mathbb{Q}$)*.

          **(0,25 pt)** Montrer que : $\forall(x,y) \in \mathbb{Q}^2$ *(glyphe à confirmer : $\mathbb{Q}$)* ; $x + y\sqrt{3} = 0$ si et seulement si $(x = 0$ et $y = 0)$.
        reasoning: |-
          Le sens facile d'abord : si $x=y=0$, alors $x+y\sqrt3=0$, trivialement. Le sens qui demande un peu plus : si $x+y\sqrt3=0$, montrer que $x$ et $y$ sont **forcément** nuls tous les deux — pas juste l'un des deux.

          On raisonne par l'absurde sur $y$ : si $y\neq0$, l'égalité $x+y\sqrt3=0$ donnerait $\sqrt3=-\dfrac{x}{y}$, un rationnel — or $\sqrt3$ est irrationnel, un fait classique du cursus (preuve par l'absurde, comme pour $\sqrt2$), pas un nouvel outil de ce chapitre — exactement le même argument que celui déjà mobilisé au sujet 2022 pour $\sqrt3$. Contradiction : $y=0$, puis $x=0$.
        steps:
          - math: 'x=y=0 \ \Longrightarrow\ x+y\sqrt3 = 0'
            note: "Sens direct, immédiat."
          - math: '\text{Si } y\neq 0: \quad x+y\sqrt3=0 \ \Longrightarrow\ \sqrt3 = -\dfrac{x}{y} \in \mathbb{Q}'
            note: "Supposer y non nul forcerait √3 à être rationnel."
          - math: '\sqrt3 \notin \mathbb{Q} \ (\text{fait classique}) \ \Longrightarrow\ y=0 \ \Longrightarrow\ x=0'
            note: "Contradiction : y doit être nul, puis x aussi."
      - id: q8
        stem: |-
          **(0,25 pt)** Montrer que $F - \{0\}$ est un sous-groupe de $(\mathbb{R}^*, \times)$ *(glyphe à confirmer : $\mathbb{R}$)*.
        reasoning: |-
          Montrer que $F-\{0\}$ est un sous-groupe de $(\mathbb{R}^*,\times)$, c'est montrer que $(F-\{0\},\times)$ est **lui-même** un groupe — même démarche que pour $E$ à la question 1, un cran plus loin dans le chapitre. La question précédente donne le point-clé : $x+y\sqrt3=0$ seulement si $x=y=0$, donc tout élément de $F-\{0\}$ a $(x,y)\neq(0,0)$ et un carré $x^2-3y^2$ **non nul** (même argument par l'absurde qu'à la question précédente, appliqué à $x^2-3y^2=0 \Leftrightarrow x^2=3y^2$).

          Stabilité : le produit de deux éléments de $F$ reste dans $F$ (coefficients rationnels), et le produit de deux réels non nuls est non nul, donc reste dans $F-\{0\}$. Neutre : $1=1+0\sqrt3\in F-\{0\}$. Symétrique : l'inverse réel $\dfrac{1}{x+y\sqrt3}$ se réécrit, en multipliant par le quotient conjugué $x-y\sqrt3$ (même technique de rationalisation que pour les nombres complexes), avec des coefficients rationnels — donc reste dans $F-\{0\}$. Associativité : héritée de $\mathbb{R}^*$.
        steps:
          - math: '(x+y\sqrt3)(a+b\sqrt3) = (xa+3yb) + (xb+ya)\sqrt3 \in F'
            note: "Produit de deux éléments de F : coefficients rationnels, encore de la forme p+q√3."
          - math: '(x+y\sqrt3)\neq0,\ (a+b\sqrt3)\neq0 \ \Longrightarrow\ (x+y\sqrt3)(a+b\sqrt3)\neq0'
            note: "Produit de deux réels non nuls : reste dans F−{0}."
          - math: '1 = 1+0\sqrt3 \in F-\{0\}'
            note: "Le neutre 1 appartient à F−{0}."
          - math: '\dfrac{1}{x+y\sqrt3} = \dfrac{x-y\sqrt3}{(x+y\sqrt3)(x-y\sqrt3)} = \dfrac{x}{x^2-3y^2} - \dfrac{y}{x^2-3y^2}\sqrt3'
            note: "Quotient conjugué : x²−3y² est non nul (même argument qu'à la question précédente), le résultat a des coefficients rationnels."
          - math: 'F-\{0\} \ \text{est un sous-groupe de} \ (\mathbb{R}^*,\times)'
            note: "Stabilité, neutre et symétriques restent dans F−{0} ; associativité héritée de R*."
      - id: q9
        part: "Un isomorphisme $\\varphi$ vers $G$"
        stem: |-
          Soit $\varphi$ l'application définie de $F - \{0\}$ vers $E$ par : $\forall(x,y) \in \mathbb{Q}^2 - \{(0,0)\}$ *(glyphe à confirmer : $\mathbb{Q}$)* ; $\varphi(x + y\sqrt{3}) = M(x,y)$.

          **(0,25 pt)** Vérifier que : $\varphi(F - \{0\}) = G - \{O\}$
        reasoning: |-
          $\varphi$ envoie chaque élément $x+y\sqrt3$ de $F-\{0\}$ (donc $(x,y)\in\mathbb{Q}^2-\{(0,0)\}$, par la question 1) sur $M(x,y)$ — une matrice dont les deux coefficients $(x,y)$ sont eux aussi rationnels et non tous deux nuls. C'est très exactement la définition de $G-\{O\}$ : $G$ est l'ensemble des $M(x,y)$ pour $(x,y)\in\mathbb{Q}^2$, et $M(x,y)=O$ équivaut à $x=y=0$ (même critère que pour $E$, restreint ici à $\mathbb{Q}$).

          Deux inclusions à vérifier : tout élément de $\varphi(F-\{0\})$ est bien dans $G-\{O\}$ (par construction), et réciproquement toute matrice de $G-\{O\}$ a un antécédent dans $F-\{0\}$ (celui qu'on lit directement sur ses coefficients).
        steps:
          - math: 'z=x+y\sqrt3 \in F-\{0\} \ \Longrightarrow\ (x,y)\in\mathbb{Q}^2-\{(0,0)\} \ \Longrightarrow\ \varphi(z)=M(x,y)\in G,\ M(x,y)\neq O'
            note: "L'image d'un élément de F−{0} est une matrice de G non nulle."
          - math: 'M(x,y)\in G-\{O\} \ \Longrightarrow\ (x,y)\in\mathbb{Q}^2-\{(0,0)\} \ \Longrightarrow\ x+y\sqrt3 \in F-\{0\},\quad \varphi(x+y\sqrt3)=M(x,y)'
            note: "Réciproquement, toute matrice de G−{O} a un antécédent explicite dans F−{0}."
          - math: '\varphi(F-\{0\}) = G-\{O\}'
            note: "Les deux inclusions réunies donnent l'égalité des ensembles."
      - id: q10
        stem: |-
          **(0,25 pt)** Montrer que $\varphi$ est un homomorphisme de $(F - \{0\}, \times)$ vers $(E, \times)$.
        reasoning: |-
          Le geste-pont du chapitre 10 : il faut montrer $\varphi(z\times w) = \varphi(z)\times\varphi(w)$ pour tous $z,w\in F-\{0\}$ — en notant $z=x+y\sqrt3$ et $w=a+b\sqrt3$ les deux éléments, pour éviter la confusion des primes. Le produit $z\times w$ a déjà été développé à la question précédente (question 2) : $(xa+3yb)+(xb+ya)\sqrt3$. Son image par $\varphi$ est donc $M(xa+3yb,\ xb+ya)$.

          De l'autre côté, $\varphi(z)\times\varphi(w) = M(x,y)\times M(a,b)$, qui vaut exactement $M(xa+3yb,\ xb+ya)$ par la formule de la question 3 (Partie I) — le même calcul matriciel, appliqué cette fois à des coefficients rationnels. Les deux membres coïncident : $\varphi$ transforme $\times$ en $\times$, c'est un homomorphisme.
        steps:
          - math: 'z=x+y\sqrt3,\quad w=a+b\sqrt3 \ \in F-\{0\}'
            note: "Deux éléments quelconques de F−{0}, notés z et w pour éviter le prime."
          - math: 'z\times w = (xa+3yb)+(xb+ya)\sqrt3 \quad (\text{q8})'
            note: "Produit déjà développé à la question précédente."
          - math: '\varphi(z\times w) = M(xa+3yb,\ xb+ya)'
            note: "Image par φ, application directe de sa définition."
          - math: '\varphi(z)\times\varphi(w) = M(x,y)\times M(a,b) = M(xa+3yb,\ xb+ya) \quad (\text{Partie I, q3})'
            note: "Produit des images, via la formule de la Partie I."
          - math: '\varphi(z\times w) = \varphi(z)\times\varphi(w)'
            note: "Les deux membres coïncident : φ est un homomorphisme de (F−{0},×) vers (E,×)."
      - id: q11
        stem: |-
          **(0,25 pt)** En déduire que $(G - \{O\}, \times)$ est un groupe commutatif.
        reasoning: |-
          On mobilise le pont du chapitre 10 : $(F-\{0\},\times)$ est un groupe commutatif (question 2 — sous-groupe de $(\mathbb{R}^*,\times)$, qui est lui-même commutatif, donc $F-\{0\}$ l'hérite), et $\varphi$ en est un homomorphisme (question précédente) dont l'image est exactement $G-\{O\}$ (question 3-a) : $\varphi$ est donc **surjective** de $F-\{0\}$ sur $G-\{O\}$.

          $\varphi$ est de plus injective : deux couples rationnels distincts $(x,y)\neq(a,b)$ donnent deux matrices $M(x,y)\neq M(a,b)$ (leurs coefficients diffèrent déjà), donc deux images distinctes. $\varphi$ est un isomorphisme de $(F-\{0\},\times)$ vers $(G-\{O\},\times)$ : toute la structure de groupe commutatif se transporte, sans re-vérifier aucun axiome sur $G-\{O\}$.
        steps:
          - math: '(F-\{0\},\times) \ \text{groupe commutatif} \quad (\text{q8, sous-groupe de } (\mathbb{R}^*,\times) \text{ commutatif})'
            note: "Premier ingrédient du transport de structure."
          - math: '\varphi(F-\{0\}) = G-\{O\} \quad (\text{q9}) \ \Longrightarrow\ \varphi \ \text{surjective sur} \ G-\{O\}'
            note: "L'image de φ est exactement G−{O} : surjectivité."
          - math: '(x,y)\neq(a,b) \ \Longrightarrow\ M(x,y)\neq M(a,b) \ \Longrightarrow\ \varphi \ \text{injective}'
            note: "Deux couples distincts donnent deux matrices distinctes : φ est injective."
          - math: '\varphi \ \text{est un isomorphisme de} \ (F-\{0\},\times) \ \text{vers} \ (G-\{O\},\times)'
            note: "Bijective et morphisme (q10) : φ est un isomorphisme."
          - math: '(G-\{O\},\times) \ \text{est un groupe commutatif}'
            note: "La structure de F−{0} se transporte à G−{O} par φ, sans re-vérifier les axiomes."
      - id: q12
        part: "$(G,+,\\times)$ est un corps commutatif"
        stem: |-
          **(0,25 pt)** Montrer que $(G, +, \times)$ est un corps commutatif.
        reasoning: |-
          Synthèse finale, en réutilisant tout ce qui précède plutôt qu'en repartant de zéro. $(G,+)$ est un sous-groupe de $(E,+)$ : même démarche qu'à la question 1 pour $E$, avec $\mathbb{Q}$ à la place de $\mathbb{R}$ — $\mathbb{Q}$ est stable pour $+$ et le passage à l'opposé, donc $G$ l'est aussi. Associativité, distributivité et commutativité de $\times$ sur $G$ s'héritent directement de $E$ (Partie I, question 3-b) : ce qui est vrai pour **tous** les éléments de $E$ reste vrai en particulier pour ceux de $G\subset E$. L'unité $I=M(1,0)$ appartient à $G$, puisque $(1,0)\in\mathbb{Q}^2$.

          Reste l'exigence propre au corps (chapitre 9) : **tout** élément non nul de $G$ a-t-il un symétrique pour $\times$ ? C'est exactement ce que dit la question précédente — $(G-\{O\},\times)$ est un groupe, donc chaque élément non nul de $G$ possède un symétrique, qui reste dans $G$. Les conditions du chapitre 9 sont réunies : $(G,+,\times)$ est un corps commutatif.
        steps:
          - math: '(G,+) \ \text{sous-groupe de} \ (E,+) \quad (\mathbb{Q} \ \text{stable pour} \ + \ \text{et le passage à l opposé, même geste que pour} \ E \ \text{en q1})'
            note: "Premier ingrédient de l'anneau, restreint à Q."
          - math: '\times \ \text{associative, distributive, commutative sur} \ G \quad (\text{héritées de } E, \ \text{Partie I q3-b})'
            note: "Ce qui est vrai pour tout élément de E reste vrai pour ceux de G."
          - math: 'I = M(1,0) \in G \quad ((1,0)\in\mathbb{Q}^2)'
            note: "L'unité appartient à G."
          - math: '(G-\{O\},\times) \ \text{groupe} \quad (\text{q11}) \ \Longrightarrow\ \text{tout élément non nul de } G \text{ a un symétrique pour} \ \times'
            note: "C'est exactement l'exigence supplémentaire du chapitre 9, déjà établie."
          - math: '(G,+,\times) \ \text{est un corps commutatif}'
            note: "Anneau commutatif unitaire, et tout élément non nul inversible pour × : les conditions du chapitre 9 sont réunies."

