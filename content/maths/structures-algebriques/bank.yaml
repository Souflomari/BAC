    intro: |-
      **Structures algébriques (examen national, session normale 2022, Sciences Mathématiques).**

      On rappelle que $(M_2(\mathbb{R}),+,\times)$ est un anneau unitaire non commutatif d'unité $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$ et que $(\mathbb{Z},+,\times)$ est un anneau commutatif unitaire et intègre.

      Soit $E = \left\{ M(a,b) = \begin{pmatrix} a & 3b \\ b & a \end{pmatrix} \ /\ (a,b) \in \mathbb{Z}^2 \right\}$

      L'exercice construit un anneau de matrices à coefficients entiers (chapitre 7, avec deux propriétés supplémentaires — commutativité et unité, un cran plus loin que la définition de base), puis un homomorphisme multiplicatif (chapitre 10) vers $(\mathbb{Z},\times)$ qui sert d'outil de mesure : c'est lui qui décide, plus loin, quels éléments de $E$ sont inversibles.
    questions:
      - id: q1
        part: "L'ensemble $E$ : sous-groupe additif, produit, anneau commutatif et unitaire"
        stem: |-
          **(0,25 pt)** Montrer que $E$ est un sous-groupe de $(M_2(\mathbb{R}),+)$
        reasoning: |-
          Montrer que $E$ est un sous-groupe de $(M_2(\mathbb{R}),+)$, c'est montrer que $(E,+)$ est **lui-même** un groupe — la même démarche qu'au chapitre 4, mais restreinte à $E$ : on recoche les quatre axiomes, un par un, à l'intérieur de $E$.

          La stabilité se lit sur l'addition matricielle coefficient par coefficient : les coefficients de $M(a,b)+M(c,d)$ restent des entiers, puisque $\mathbb{Z}$ est stable pour $+$. L'associativité est héritée de $M_2(\mathbb{R})$ tout entier, où elle est déjà acquise. Le neutre $O$ et l'opposé de chaque $M(a,b)$ ont eux aussi des coefficients entiers, puisque $\mathbb{Z}$ est stable par passage à l'opposé — les quatre axiomes tiennent dans $E$.
        steps:
          - math: 'M(a,b)+M(c,d) = \begin{pmatrix} a & 3b \\ b & a \end{pmatrix} + \begin{pmatrix} c & 3d \\ d & c \end{pmatrix} = \begin{pmatrix} a+c & 3(b+d) \\ b+d & a+c \end{pmatrix} = M(a+c,\ b+d)'
            note: "Addition coefficient par coefficient : a+c et b+d sont des entiers, E est stable pour +."
          - math: '+ \ \text{associative sur } M_2(\mathbb{R}) \ (\text{fait général}) \ \Longrightarrow\ \text{associative sur } E'
            note: "Héritée de M2(R) tout entier."
          - math: 'O = \begin{pmatrix} 0 & 0 \\ 0 & 0 \end{pmatrix} = M(0,0) \in E, \qquad -M(a,b) = M(-a,\ -b) \in E'
            note: "Le neutre O et l'opposé de chaque élément ont des coefficients entiers : ils restent dans E."
          - math: 'E \ \text{est un sous-groupe de} \ (M_2(\mathbb{R}),+)'
            note: "Les quatre axiomes sont vérifiés dans E."
      - id: q2
        stem: |-
          **(0,25 pt)** Vérifier que pour tout $a,b,c$ et $d$ de $\mathbb{Z}$, on a : $M(a,b)\times M(c,d) = M(ac+3bd,\ ad+bc)$
        reasoning: |-
          Un calcul de vérification, pas de recherche : on développe le produit matriciel usuel, coefficient par coefficient, et on regroupe pour retrouver la forme $M(\cdot,\cdot)$. Ce calcul sera réutilisé tel quel dans presque toutes les questions qui suivent — il vaut la peine de le mener sans erreur une bonne fois pour toutes.
        steps:
          - math: 'M(a,b)\times M(c,d) = \begin{pmatrix} a & 3b \\ b & a \end{pmatrix}\begin{pmatrix} c & 3d \\ d & c \end{pmatrix} = \begin{pmatrix} ac+3bd & 3ad+3bc \\ bc+ad & 3bd+ac \end{pmatrix}'
            note: "Produit matriciel usuel, ligne par colonne."
          - math: '= \begin{pmatrix} ac+3bd & 3(ad+bc) \\ ad+bc & ac+3bd \end{pmatrix} = M(ac+3bd,\ ad+bc)'
            note: "Regroupement : le résultat a exactement la forme M(·,·) annoncée."
      - id: q3
        stem: |-
          **(0,5 pt)** Montrer que $(E,+,\times)$ est un anneau commutatif et unitaire.
        reasoning: |-
          La définition de base d'un anneau (chapitre 7) demande $(E,+)$ groupe commutatif, $\times$ associative, et $\times$ distributive par rapport à $+$. Ici, on nous demande d'aller un cran plus loin — exactement comme le chapitre 9 ajoute deux exigences à la définition de l'anneau pour obtenir un corps, sauf qu'ici on s'arrête à « commutatif et unitaire », sans exiger l'inversibilité de tous les éléments non nuls.

          $(E,+)$ est un groupe (question 1) ; sa commutativité est héritée de $+$ sur $M_2(\mathbb{R})$, où elle tient toujours (même quand $\times$ ne l'est pas). Associativité et distributivité de $\times$ sont héritées de $M_2(\mathbb{R})$ tout entier, qui est déjà un anneau (rappel de tête d'énoncé). Reste ce qui ne s'hérite **pas** automatiquement : $M_2(\mathbb{R})$ lui-même n'est **pas** commutatif pour $\times$ (rappel), donc la commutativité de $\times$ sur $E$ doit être vérifiée directement, avec la formule de la question 2. L'unité $I=M(1,0)$, elle, s'hérite sans difficulté : $I$ est déjà l'unité de tout $M_2(\mathbb{R})$, et $I \in E$.
        steps:
          - math: '(E,+) \ \text{groupe commutatif} \ (\text{q1, hérité de } +\text{ sur } M_2(\mathbb{R}))'
            note: "Premier ingrédient de l'anneau."
          - math: '\times \ \text{associative et distributive par rapport à} \ + \ \text{sur } E \ (\text{héritées de } M_2(\mathbb{R}))'
            note: "Deuxième et troisième ingrédients, hérités du grand anneau."
          - math: 'M(a,b)\times M(c,d) = M(ac+3bd,\ ad+bc) = M(ca+3db,\ cb+da) = M(c,d)\times M(a,b)'
            note: "Commutativité de × sur E : ne s'hérite pas de M2(R) (qui n'est pas commutatif), se vérifie directement via la formule de la question 2, et repose sur la commutativité de + et × dans Z."
          - math: 'I = M(1,0) \in E \quad (1,0 \in \mathbb{Z})'
            note: "I, déjà unité de tout M2(R), appartient à E : (E,+,×) est unitaire d'unité I."
          - math: '(E,+,\times) \ \text{est un anneau commutatif et unitaire}'
            note: "Toutes les conditions sont réunies."
      - id: q4
        part: "Un homomorphisme multiplicatif $\\varphi$ vers $(\\mathbb{Z},\\times)$"
        stem: |-
          Soit $\varphi$ l'application définie de $E$ vers $\mathbb{Z}$ par : $\forall(a,b) \in \mathbb{Z}^2$ ; $\varphi(M(a,b)) = |a^2 - 3b^2|$. **(0,5 pt)** Montrer que $\varphi$ est un homomorphisme de $(E,\times)$ vers $(\mathbb{Z},\times)$.
        reasoning: |-
          Le geste-pont du chapitre 10, appliqué à une application qui ne sera **pas** bijective (deux matrices peuvent avoir la même valeur $\varphi$) — mais un homomorphisme n'a besoin que de transformer la loi, pas d'être bijectif. Il faut montrer $\varphi(M(a,b)\times M(c,d)) = \varphi(M(a,b)) \times \varphi(M(c,d))$, c'est-à-dire $|(ac+3bd)^2 - 3(ad+bc)^2| = |a^2-3b^2| \cdot |c^2-3d^2|$, en utilisant la formule du produit établie à la question 2.

          Le calcul algébrique clé — développer $(ac+3bd)^2 - 3(ad+bc)^2$ et le factoriser en $(a^2-3b^2)(c^2-3d^2)$ — est un peu long, mais chaque terme se simplifie proprement ; la valeur absolue neutralise ensuite tout problème de signe.
        steps:
          - math: '\varphi\big(M(a,b)\times M(c,d)\big) = \varphi\big(M(ac+3bd,\ ad+bc)\big) = |(ac+3bd)^2 - 3(ad+bc)^2|'
            note: "Image par φ du produit, via la formule de la question 2."
          - math: '(ac+3bd)^2 - 3(ad+bc)^2 = a^2c^2+6abcd+9b^2d^2 - 3a^2d^2-6abcd-3b^2c^2'
            note: "Développement des deux carrés."
          - math: '= a^2c^2 - 3b^2c^2 - 3a^2d^2 + 9b^2d^2 = c^2(a^2-3b^2) - 3d^2(a^2-3b^2) = (a^2-3b^2)(c^2-3d^2)'
            note: "Regroupement : le facteur commun (a²−3b²) apparaît dans les deux moitiés."
          - math: '\varphi\big(M(a,b)\times M(c,d)\big) = |a^2-3b^2|\cdot|c^2-3d^2| = \varphi\big(M(a,b)\big)\times\varphi\big(M(c,d)\big)'
            note: "Valeur absolue d'un produit = produit des valeurs absolues : φ est un homomorphisme."
      - id: q5
        part: "Inversibilité dans $(E,\\times)$"
        stem: |-
          Soit $M(a,b) \in E$. **(0,25 pt)** Montrer que $M(a,b)\times M(a,-b) = (a^2 - 3b^2)\cdot I$
        reasoning: |-
          Un calcul de vérification direct, avec la formule de la question 2 : on remplace $c$ par $a$ et $d$ par $-b$, et on doit retrouver un multiple scalaire de l'unité $I$. Ce résultat sert de charnière pour les deux questions suivantes : il relie $\varphi(M(a,b))$ (le nombre $a^2-3b^2$, au signe près) à la question, très concrète, de l'inversibilité de $M(a,b)$.
        steps:
          - math: 'M(a,b)\times M(a,-b) = M\big(a\cdot a + 3b\cdot(-b),\ a\cdot(-b)+b\cdot a\big)'
            note: "Formule de la question 2, avec c = a et d = −b."
          - math: '= M(a^2-3b^2,\ 0)'
            note: "Le second terme s'annule : −ab+ab = 0."
          - math: 'M(a^2-3b^2,\ 0) = \begin{pmatrix} a^2-3b^2 & 0 \\ 0 & a^2-3b^2 \end{pmatrix} = (a^2-3b^2)\cdot I'
            note: "Une matrice M(k,0) est exactement k fois l'unité I."
      - id: q6
        stem: |-
          **(0,5 pt)** Montrer que si $M(a,b)$ est inversible dans $(E,\times)$ alors $\varphi(M(a,b)) = 1$
        reasoning: |-
          On suppose $M(a,b)$ inversible dans $E$ : il existe $N \in E$ avec $M(a,b)\times N = I$ (l'unité de $E$, question 3). On applique $\varphi$ aux deux membres, en utilisant qu'il s'agit d'un homomorphisme (question 4) : $\varphi(M(a,b))\times \varphi(N) = \varphi(I)$.

          Reste à calculer $\varphi(I)$ et à conclure : $\varphi(I) = \varphi(M(1,0)) = |1-0| = 1$. Or $\varphi(M(a,b))$ et $\varphi(N)$ sont, par définition, des valeurs absolues d'entiers — donc des entiers **positifs ou nuls**. Un produit de deux entiers positifs ou nuls qui vaut $1$ ne laisse qu'une possibilité : les deux valent $1$.
        steps:
          - math: 'M(a,b) \ \text{inversible dans} \ E: \quad \exists N \in E,\ M(a,b)\times N = I'
            note: "Définition de l'inversibilité dans (E,×)."
          - math: '\varphi\big(M(a,b)\times N\big) = \varphi(M(a,b))\times\varphi(N) = \varphi(I) \quad (\varphi\ \text{homomorphisme, q4})'
            note: "On applique φ aux deux membres."
          - math: '\varphi(I) = \varphi(M(1,0)) = |1^2-3\cdot0^2| = 1'
            note: "Calcul direct de φ sur l'unité I = M(1,0)."
          - math: '\varphi(M(a,b))\times\varphi(N) = 1, \quad \varphi(M(a,b)),\varphi(N) \in \mathbb{N} \ \Longrightarrow\ \varphi(M(a,b)) = 1'
            note: "Produit de deux entiers positifs ou nuls égal à 1 : les deux facteurs valent 1."
      - id: q7
        stem: |-
          On suppose que $\varphi(M(a,b)) = 1$. **(0,5 pt)** Montrer que $M(a,b)$ est inversible dans $(E,\times)$ et préciser son inverse.
        reasoning: |-
          $\varphi(M(a,b))=1$ signifie $|a^2-3b^2|=1$, donc $a^2-3b^2 = 1$ ou $a^2-3b^2=-1$ — deux cas, selon le signe. Dans les deux cas, on repart de l'identité de la question 5 : $M(a,b)\times M(a,-b) = (a^2-3b^2)\cdot I$, et il suffit de multiplier chaque membre par le scalaire $(a^2-3b^2)$ lui-même (qui vaut $\pm1$, donc son carré vaut $1$) pour faire apparaître $I$ tout seul.

          Le résultat se formule d'un coup, sans distinguer les deux cas dans la réponse finale : l'inverse de $M(a,b)$ est $(a^2-3b^2)\cdot M(a,-b)$ — une matrice à coefficients entiers (donc bien dans $E$), puisque $a^2-3b^2=\pm1 \in \mathbb{Z}$.
        steps:
          - math: 'M(a,b)\times M(a,-b) = (a^2-3b^2)\cdot I \quad (\text{q5}), \qquad a^2-3b^2 = \pm 1'
            note: "On repart de l'identité de la question 5 ; le facteur vaut ±1 puisque φ(M(a,b))=1."
          - math: '(a^2-3b^2)\cdot\Big[M(a,b)\times M(a,-b)\Big] = (a^2-3b^2)^2\cdot I = I'
            note: "On multiplie les deux membres par (a²−3b²) ; son carré vaut 1."
          - math: 'M(a,b)\times\Big[(a^2-3b^2)\cdot M(a,-b)\Big] = I'
            note: "Le scalaire (a²−3b²) se déplace librement dans le produit matriciel."
          - math: '(a^2-3b^2)\cdot M(a,-b) \in E \quad (\text{coefficients entiers, car } a^2-3b^2=\pm1)'
            note: "L'inverse proposé reste bien dans E."
          - math: 'M(a,b) \ \text{est inversible dans} \ (E,\times), \quad M(a,b)^{-1} = (a^2-3b^2)\cdot M(a,-b)'
            note: "Grâce à la commutativité de × sur E (q3), l'identité tient aussi dans l'autre ordre : c'est bien l'inverse."
      - id: q8
        part: "Intégrité de l'anneau, et $(E,+,\\times)$ est-il un corps ?"
        stem: |-
          **(0,25 pt)** Montrer que : $\forall(a,b) \in \mathbb{Z}^2$ ; $\varphi(M(a,b)) = 0 \Longleftrightarrow a = b = 0$
        reasoning: |-
          Le sens facile d'abord : si $a=b=0$, alors $a^2-3b^2=0$, donc $\varphi(M(0,0))=0$. Le sens qui demande un peu plus : si $\varphi(M(a,b))=0$, c'est-à-dire $a^2=3b^2$, montrer que $a$ et $b$ sont **forcément** nuls tous les deux.

          On raisonne par l'absurde sur $b$ : si $b \neq 0$, l'égalité $a^2=3b^2$ donnerait $\left(\dfrac{a}{b}\right)^2 = 3$, c'est-à-dire $\sqrt{3} = \left|\dfrac{a}{b}\right|$, un rationnel — or $\sqrt{3}$ est irrationnel, un fait classique du cursus (preuve par l'absurde, comme pour $\sqrt{2}$), pas un nouvel outil de ce chapitre. Contradiction : $b=0$, puis $a^2=0$ donne $a=0$.
        steps:
          - math: 'a=b=0 \ \Longrightarrow\ a^2-3b^2 = 0 \ \Longrightarrow\ \varphi(M(0,0)) = 0'
            note: "Sens direct, immédiat."
          - math: '\varphi(M(a,b))=0 \ \Longleftrightarrow\ a^2 = 3b^2'
            note: "Reformulation de l'hypothèse : |a²−3b²|=0 équivaut à a²=3b²."
          - math: '\text{Si } b\neq 0: \quad \left(\dfrac{a}{b}\right)^2 = 3 \ \Longrightarrow\ \sqrt{3} = \left|\dfrac{a}{b}\right| \in \mathbb{Q}'
            note: "Supposer b non nul forcerait √3 à être rationnel."
          - math: '\sqrt{3} \notin \mathbb{Q} \ (\text{fait classique}) \ \Longrightarrow\ b = 0 \ \Longrightarrow\ a^2 = 0 \ \Longrightarrow\ a = 0'
            note: "Contradiction : b doit être nul, puis a aussi."
      - id: q9
        stem: |-
          **(0,25 pt)** En déduire que l'anneau $(E,+,\times)$ est intègre.
        reasoning: |-
          Un anneau est **intègre** quand il n'a pas de « diviseurs de zéro » : aucun produit de deux éléments non nuls ne peut donner l'élément nul, autrement dit $M\times N = O \Rightarrow M=O$ ou $N=O$ — exactement la propriété que le rappel de tête d'énoncé attribue déjà à $(\mathbb{Z},+,\times)$.

          Avec cette définition, la démonstration tient en une ligne grâce à ce qui précède : si $M(a,b)\times M(c,d) = O = M(0,0)$, on applique $\varphi$ (homomorphisme, question 4) pour obtenir $\varphi(M(a,b))\times\varphi(M(c,d)) = \varphi(O) = 0$ dans $\mathbb{Z}$ — un produit d'entiers nul force l'un des deux facteurs à être nul, et la question précédente (8) traduit chaque facteur nul en $M(a,b)=O$ ou $M(c,d)=O$.
        steps:
          - math: 'M(a,b)\times M(c,d) = O = M(0,0)'
            note: "Hypothèse de départ : un produit qui donne la matrice nulle."
          - math: '\varphi\big(M(a,b)\times M(c,d)\big) = \varphi(M(a,b))\times\varphi(M(c,d)) = \varphi(O) = 0'
            note: "On applique φ (homomorphisme, q4) ; φ(O) = |0²−3·0²| = 0."
          - math: '\varphi(M(a,b))\times\varphi(M(c,d)) = 0 \ \text{dans} \ \mathbb{Z} \ \Longrightarrow\ \varphi(M(a,b))=0 \ \text{ou} \ \varphi(M(c,d))=0'
            note: "Un produit d'entiers nul force l'un des deux facteurs à être nul."
          - math: '\varphi(M(a,b))=0 \ \Longrightarrow\ M(a,b)=O \quad (\text{q8}); \qquad \text{de même pour} \ M(c,d)'
            note: "La question 8 traduit φ nul en matrice nulle."
          - math: '(E,+,\times) \ \text{est intègre}'
            note: "Aucun produit de deux éléments non nuls ne peut donner O."
      - id: q10
        stem: |-
          **(0,25 pt)** Est-ce que $(E,+,\times)$ est un corps ? justifier votre réponse.
        reasoning: |-
          Un corps (chapitre 9) demande, en plus de l'anneau commutatif et unitaire déjà établi (question 3), que **tout** élément non nul possède un symétrique pour $\times$ — pas seulement certains d'entre eux. La question 6 donne exactement le test : un élément inversible doit forcément avoir $\varphi = 1$. Il suffit donc d'exhiber un seul élément non nul de $E$ dont $\varphi$ diffère de $1$ pour conclure que ce n'est **pas** un corps — même logique de contre-exemple qu'au chapitre 9 pour $(\mathbb{Z},+,\times)$.

          $M(2,0)$ convient : il est non nul ($a=2\neq0$), mais $\varphi(M(2,0)) = |4-0| = 4 \neq 1$. Par la contraposée de la question 6, $M(2,0)$ n'est pas inversible dans $(E,\times)$.
        steps:
          - math: 'M(2,0) = \begin{pmatrix} 2 & 0 \\ 0 & 2 \end{pmatrix} \in E, \qquad M(2,0) \neq O'
            note: "Un élément non nul de E, choisi pour le test."
          - math: '\varphi(M(2,0)) = |2^2 - 3\cdot0^2| = 4 \neq 1'
            note: "Sa valeur par φ n'est pas 1."
          - math: '\text{Si } M(2,0) \ \text{était inversible}, \ \text{alors} \ \varphi(M(2,0))=1 \quad (\text{q6, contraposée})'
            note: "Or ce n'est pas le cas : contradiction."
          - math: 'M(2,0) \ \text{est non nul et non inversible dans} \ (E,\times) \ \Longrightarrow\ (E,+,\times) \ \text{ne constitue pas un corps}'
            note: "Un seul contre-exemple suffit."

  # ── bk-2024-n-x4 — 2024 N, Exercice 4 : loi interne T sur C×C*, groupe non commutatif, sous-groupe R×R* ──
  - id: bk-2024-n-x4
    title: "Loi interne sur ℂ×ℂ*, groupe non commutatif et sous-groupe ℝ×ℝ*"
    source:
      year: 2024
      session: normale
      filiere: "SM"
      exercise_label: "Exercice 4"
    bareme_total: 3.5
    duration_min: 21
    sourcing:
      status: sourced
      note: >-
        2024 session normale — examen national Sciences Mathématiques (A et
        B), option française (BIOF), Mathématiques, 4 h, coef 9, code sujet
        NS 24F, AlloSchool element/145739 (Exercice 4 sur le corps de
        l'épreuve, « Structures algébriques », barème 3,5 points — la page
        de consignes annonce par erreur ces deux exercices sous des
        libellés inversés, Exercice 5 pour les structures et Exercice 4
        pour l'arithmétique ; cette entrée suit l'intitulé confirmé sur le
        corps de l'épreuve, Exercice 4). Transcription fidèle de l'entrée
        « vérifié » de docs/sujets/maths/structures-algebriques.md, section
        « 2024 — session normale — Exercice 4 » (re-fetch AlloSchool
        indépendant + diff caractère-par-caractère conforme au scan,
        numérotation confirmée sur le corps de l'épreuve, loi T et formule
        de l'inverse avec barre de conjugaison sur b confirmées au zoom,
        agent-vérificateur-adversarial, 2026-08-05). Sujet transcrit en
        Unicode propre (aucun mojibake sur ce scan).
    intro: |-
      **Structures algébriques (examen national, session normale 2024, Sciences Mathématiques).**

      On considère dans $\mathbb{C}\times\mathbb{C}^*$ la loi de composition interne $T$ définie par :

      $$\forall\big((a,b),(c,d)\big) \in \big(\mathbb{C}\times\mathbb{C}^*\big)^2 \ ; \ (a,b)\,T\,(c,d) = \big(a\bar{d}+c,\ bd\big)$$

      ($\bar{d}$ étant le conjugué du nombre complexe $d$)

      L'exercice reprend l'enchaînement complet du chapitre — commutativité, associativité, neutre et symétrique (chapitre 3), puis les quatre axiomes du groupe (chapitre 4) et le contraste avec un groupe non commutatif (chapitre 6), pour finir sur un sous-groupe (même technique que pour $G$ au sujet 2019). La loi $T$ vit sur un ensemble de **couples**, pas sur $\mathbb{C}$ seul : chaque calcul mobilise en plus les propriétés du conjugué déjà connues du chapitre sur les nombres complexes.
    questions:
      - id: q1
        part: "La loi $T$ : un exemple qui casse la commutativité"
        stem: |-
          **(0,5 pt)** Vérifier que $(i,2)\,T\,(1,i) = (2,2i)$, puis calculer $(1,i)\,T\,(i,2)$
        reasoning: |-
          Un calcul de vérification, deux fois : on applique la définition de $T$ à chaque couple, en faisant attention à ne conjuguer que la **seconde** composante du second couple — c'est elle, $\bar{d}$, qui porte la barre dans la formule, jamais $b$ ni $c$.

          Le second calcul, $(1,i)\,T\,(i,2)$, utilise exactement les mêmes deux couples que le premier, mais dans l'ordre inverse : c'est ce contraste, voulu, qui va servir à la question suivante.
        steps:
          - math: '(i,2)\,T\,(1,i) = \big(i\cdot\bar{i}+1,\ 2\cdot i\big)'
            note: "Définition de T, avec a=i, b=2, c=1, d=i : on conjugue d, pas b ni c."
          - math: '\bar{i} = -i, \quad i\cdot(-i) = -i^2 = 1 \ \Longrightarrow\ (i,2)\,T\,(1,i) = (1+1,\ 2i) = (2,\ 2i)'
            note: "Le conjugué de i est −i ; i fois −i vaut 1 (car i² = −1)."
          - math: '(1,i)\,T\,(i,2) = \big(1\cdot\bar{2}+i,\ i\cdot2\big) = (2+i,\ 2i)'
            note: "Même formule, couples échangés : 2 est réel, son conjugué vaut 2 lui-même."
      - id: q2
        stem: |-
          **(0,25 pt)** En déduire que la loi $T$ n'est pas commutative dans $\mathbb{C}\times\mathbb{C}^*$
        reasoning: |-
          La question précédente a calculé, pour les deux mêmes couples $(i,2)$ et $(1,i)$, le résultat de $T$ dans les deux ordres possibles : $(2,2i)$ d'un côté, $(2+i,2i)$ de l'autre. Il suffit de comparer : les premières composantes diffèrent ($2 \neq 2+i$), donc les deux couples résultats sont distincts. Un seul contre-exemple suffit pour réfuter la commutativité, exactement comme au chapitre 3.
        steps:
          - math: '(i,2)\,T\,(1,i) = (2,\ 2i), \qquad (1,i)\,T\,(i,2) = (2+i,\ 2i) \quad (\text{q1})'
            note: "Les deux résultats déjà calculés."
          - math: '2 \neq 2+i \ \Longrightarrow\ (i,2)\,T\,(1,i) \neq (1,i)\,T\,(i,2)'
            note: "Les premières composantes diffèrent : les deux couples résultats sont distincts."
          - math: 'T \ \text{est non commutative dans} \ \mathbb{C}\times\mathbb{C}^*'
            note: "Un contre-exemple suffit pour réfuter la commutativité."
      - id: q3
        part: "Associativité de $T$"
        stem: |-
          **(0,5 pt)** Montrer que la loi $T$ est associative dans $\mathbb{C}\times\mathbb{C}^*$
        reasoning: |-
          Comme au chapitre 3, l'associativité met en jeu **trois** éléments à la fois et ne se lit sur aucune table : on la teste par le calcul, en développant les deux parenthésages jusqu'au bout. Ici, chaque application de $T$ fait apparaître un conjugué — le point de vigilance est de bien conjuguer le **produit** $df$ dans le second parenthésage, en utilisant la propriété déjà connue du chapitre sur les complexes : le conjugué d'un produit est le produit des conjugués.

          Les deux parenthésages, une fois développés, donnent exactement la même paire — la clé étant que $\overline{df} = \bar{d}\,\bar{f}$.
        steps:
          - math: '\big((a,b)\,T\,(c,d)\big)\,T\,(e,f) = \big(a\bar{d}+c,\ bd\big)\,T\,(e,f) = \big((a\bar{d}+c)\bar{f}+e,\ bdf\big)'
            note: "On combine d'abord (a,b) et (c,d), puis le résultat avec (e,f)."
          - math: '(c,d)\,T\,(e,f) = (c\bar{f}+e,\ df)'
            note: "On combine d'abord (c,d) et (e,f)."
          - math: '(a,b)\,T\big((c,d)\,T\,(e,f)\big) = (a,b)\,T\,(c\bar{f}+e,\ df) = \big(a\,\overline{df}+(c\bar{f}+e),\ bdf\big)'
            note: "On combine (a,b) avec le résultat précédent."
          - math: '\overline{df} = \bar{d}\,\bar{f} \ \Longrightarrow\ a\,\overline{df} = a\bar{d}\bar{f}'
            note: "Propriété connue du conjugué : le conjugué d'un produit est le produit des conjugués."
          - math: '\big((a,b)\,T\,(c,d)\big)\,T\,(e,f) = \big(a\bar{d}\bar{f}+c\bar{f}+e,\ bdf\big) = (a,b)\,T\big((c,d)\,T\,(e,f)\big)'
            note: "Les deux parenthésages coïncident : T est associative."
      - id: q4
        part: "L'élément neutre de $T$"
        stem: |-
          **(0,25 pt)** Vérifier que $(0,1)$ est l'élément neutre pour $T$ dans $\mathbb{C}\times\mathbb{C}^*$
        reasoning: |-
          Un neutre (chapitre 3) doit vérifier l'égalité **dans les deux ordres** — $(a,b)\,T\,(0,1) = (a,b)$ **et** $(0,1)\,T\,(a,b) = (a,b)$ — puisque $T$ vient de se révéler non commutative (question 2) : l'une des deux égalités ne garantit jamais l'autre ici. On applique simplement la définition de $T$ dans les deux sens, en se rappelant que le conjugué d'un réel est lui-même.
        steps:
          - math: '(a,b)\,T\,(0,1) = \big(a\bar{1}+0,\ b\cdot1\big) = (a,\ b)'
            note: "Le conjugué de 1 (réel) est 1 lui-même."
          - math: '(0,1)\,T\,(a,b) = \big(0\cdot\bar{b}+a,\ 1\cdot b\big) = (a,\ b)'
            note: "Cette fois c'est 0 fois le conjugué de b, quel qu'il soit, qui vaut 0."
          - math: '(a,b)\,T\,(0,1) = (0,1)\,T\,(a,b) = (a,b)'
            note: "Les deux ordres redonnent (a,b) : (0,1) est bien le neutre."
      - id: q5
        part: "Le symétrique pour $T$, et la structure de groupe"
        stem: |-
          **(0,5 pt)** Vérifier que $\forall(a,b) \in \mathbb{C}\times\mathbb{C}^*$ ; $(a,b)\,T\left(-\dfrac{a}{\bar{b}},\ \dfrac{1}{b}\right) = (0,1)$
        reasoning: |-
          Rien à deviner : le candidat symétrique est donné par l'énoncé, il suffit de l'injecter dans la définition de $T$ et de retrouver le neutre $(0,1)$ de la question précédente. Le calcul mobilise une propriété du conjugué déjà connue : le conjugué d'un quotient est le quotient des conjugués, donc $\overline{1/b} = 1/\bar{b}$ — c'est précisément ce qui fait s'annuler la première composante.
        steps:
          - math: '(a,b)\,T\left(-\dfrac{a}{\bar{b}},\ \dfrac{1}{b}\right) = \left(a\cdot\overline{\left(\dfrac1b\right)} + \left(-\dfrac{a}{\bar b}\right),\ \ b\cdot\dfrac1b\right)'
            note: "Application directe de la définition de T."
          - math: '\overline{\left(\dfrac1b\right)} = \dfrac{1}{\bar b} \ \Longrightarrow\ a\cdot\dfrac{1}{\bar b} - \dfrac{a}{\bar b} = 0'
            note: "Conjugué d'un quotient : les deux termes de la première composante s'annulent."
          - math: '(a,b)\,T\left(-\dfrac{a}{\bar{b}},\ \dfrac{1}{b}\right) = (0,\ 1)'
            note: "Première composante nulle, seconde égale à 1 : c'est bien le neutre."
      - id: q6
        stem: |-
          **(0,5 pt)** Montrer que $(\mathbb{C}\times\mathbb{C}^*,\ T)$ est un groupe non commutatif.
        reasoning: |-
          On coche les quatre axiomes du chapitre 4, sur $\mathbb{C}\times\mathbb{C}^*$ tout entier cette fois, en réutilisant ce qui précède. Loi interne : pour $(a,b),(c,d)$ avec $b,d$ non nuls, $bd$ reste non nul (produit de deux complexes non nuls) et $a\bar{d}+c$ reste un complexe — le résultat reste dans $\mathbb{C}\times\mathbb{C}^*$. Associativité : question 3. Neutre : $(0,1)$, question 4. Symétrique de chaque $(a,b)$ : le candidat vérifié à la question 5, dont la seconde composante $\dfrac{1}{b}$ reste non nulle puisque $b\neq0$.

          Les quatre axiomes tiennent : $(\mathbb{C}\times\mathbb{C}^*,T)$ est un groupe. Non commutatif, par la question 2.
        steps:
          - math: 'b,d \neq 0 \ \Longrightarrow\ bd \neq 0 \ \Longrightarrow\ (a,b)\,T\,(c,d) = (a\bar d + c,\ bd) \in \mathbb{C}\times\mathbb{C}^*'
            note: "Loi interne : le produit de deux complexes non nuls reste non nul."
          - math: '\text{Associative (q3), neutre } (0,1) \ (\text{q4})'
            note: "Deux axiomes déjà établis aux questions précédentes."
          - math: '\text{sym}(a,b) = \left(-\dfrac{a}{\bar b},\ \dfrac1b\right) \in \mathbb{C}\times\mathbb{C}^* \quad (\text{q5}, \ b\neq0 \Rightarrow \tfrac1b\neq0)'
            note: "Le symétrique vérifié à la question 5 reste dans l'ensemble."
          - math: '(\mathbb{C}\times\mathbb{C}^*,\ T) \ \text{est un groupe, non commutatif} \ (\text{q2})'
            note: "Les quatre axiomes sont vérifiés ; la non-commutativité vient de la question 2."
      - id: q7
        part: "Le sous-ensemble $\\mathbb{R}\\times\\mathbb{R}^*$ : stabilité et sous-groupe"
        stem: |-
          **(0,5 pt)** Montrer que $\mathbb{R}\times\mathbb{R}^*$ est stable par la loi de composition interne $T$
        reasoning: |-
          Comme au chapitre 2, la stabilité demande que le résultat de $T$ reste dans $\mathbb{R}\times\mathbb{R}^*$ dès que les deux couples de départ y sont. Ici, la différence avec $\mathbb{C}\times\mathbb{C}^*$ tout entier tient à un seul détail : quand $d$ est réel, son conjugué $\bar{d}$ vaut $d$ lui-même — la barre de conjugaison disparaît purement et simplement.
        steps:
          - math: '(a,b),(c,d) \in \mathbb{R}\times\mathbb{R}^* \ \Longrightarrow\ a,c \in \mathbb{R},\ b,d \in \mathbb{R}^*, \quad \bar{d} = d'
            note: "d est réel, donc égal à son propre conjugué."
          - math: '(a,b)\,T\,(c,d) = (ad+c,\ bd)'
            note: "La barre de conjugaison disparaît : la définition de T se réduit à des opérations réelles."
          - math: 'ad+c \in \mathbb{R}, \qquad bd \neq 0 \ (\text{produit de deux réels non nuls})'
            note: "Les deux composantes du résultat restent dans ℝ, et bd reste non nul."
          - math: '(a,b)\,T\,(c,d) \in \mathbb{R}\times\mathbb{R}^*'
            note: "ℝ×ℝ* est stable pour T."
      - id: q8
        stem: |-
          **(0,5 pt)** Montrer que $\mathbb{R}\times\mathbb{R}^*$ est un sous-groupe du groupe $(\mathbb{C}\times\mathbb{C}^*,\ T)$
        reasoning: |-
          Montrer qu'un sous-ensemble est un sous-groupe, c'est montrer qu'il est **lui-même** un groupe pour la même loi — la démarche déjà suivie pour $G$ au sujet 2019 : on recoche les quatre axiomes du chapitre 4, restreints cette fois à $\mathbb{R}\times\mathbb{R}^*$.

          Stabilité : question précédente. Associativité : héritée de $\mathbb{C}\times\mathbb{C}^*$ tout entier (question 3), où elle tient pour tous les éléments, donc en particulier pour ceux de $\mathbb{R}\times\mathbb{R}^*$. Neutre : $(0,1)$ a bien $0 \in \mathbb{R}$ et $1 \in \mathbb{R}^*$, donc $(0,1) \in \mathbb{R}\times\mathbb{R}^*$. Symétrique : pour $(a,b)$ réel, la barre de conjugaison sur $b$ disparaît, donc le symétrique $\left(-\dfrac{a}{b},\dfrac1b\right)$ (question 5, avec $\bar b = b$) a ses deux composantes réelles, la seconde non nulle — il reste dans $\mathbb{R}\times\mathbb{R}^*$.
        steps:
          - math: '\text{stable} \ (\text{q7}); \qquad \text{associative, héritée de } \mathbb{C}\times\mathbb{C}^* \ (\text{q3})'
            note: "Deux axiomes : le premier vient de la question précédente, le second est hérité de l'ensemble tout entier."
          - math: '(0,1) \in \mathbb{R}\times\mathbb{R}^* \quad (0 \in \mathbb{R},\ 1 \in \mathbb{R}^*)'
            note: "Le neutre appartient bien à ℝ×ℝ*."
          - math: '(a,b) \in \mathbb{R}\times\mathbb{R}^* \ \Longrightarrow\ \bar b = b \ \Longrightarrow\ \text{sym}(a,b) = \left(-\dfrac{a}{b},\ \dfrac1b\right) \in \mathbb{R}\times\mathbb{R}^*'
            note: "Le symétrique de la question 5, avec b réel : les deux composantes restent réelles, la seconde non nulle."
          - math: '\mathbb{R}\times\mathbb{R}^* \ \text{est un sous-groupe de} \ (\mathbb{C}\times\mathbb{C}^*,\ T)'
            note: "Les quatre axiomes sont vérifiés dans ℝ×ℝ*."

  # ── bk-2024-r-x4 — 2024 R, Exercice 4 : loi ∗ sur ℂ, (ℂ,∗) n'est pas un groupe, (E,∗) groupe non commutatif, sous-groupe F, homomorphisme φ et groupe commutatif (G,∗) ──
  - id: bk-2024-r-x4
    title: "Loi de composition, groupe non commutatif et homomorphisme"
    source:
      year: 2024
      session: rattrapage
      filiere: "SM"
      exercise_label: "Exercice 4"
    bareme_total: 3.5
    duration_min: 21
    sourcing:
      status: sourced
      note: >-
        2024 session de rattrapage — examen national Sciences Mathématiques
        (A et B), option française (BIOF), Mathématiques, 4 h, coef 9, code
        sujet RS 25, AlloSchool element/145741 (Exercice 4, « structures
        algébriques », barème 3,5 points ; page 4 du scan sur 5, image
        upload-87449/0004-big.jpg, consignes page 1). Transcription fidèle de
        l'entrée « vérifié » de docs/sujets/_incoming/maths-sm-2024-r.md,
        section « 2024 — session rattrapage — Exercice 4 » (re-fetch
        AlloSchool indépendant + re-dérivation intégrale,
        agent-vérificateur-adversarial, 2026-08-23). DEUXIÈME entrée de
        session de rattrapage de ce fichier, après bk-2023-r-x3 ajoutée le
        même soir — toutes les autres entrées, ici comme dans les autres
        banques maths du corpus, sont en session normale.
        POINT DE VIGILANCE PRINCIPAL, LEVÉ PAR RE-DÉRIVATION :
        l'exposant 5 de la formule (x+iy)*(x2+iy2) = (x y2 + y^5 x2) + i y y2
        est inhabituel au point de faire soupçonner une coquille de scan. Il
        est PORTANT et il a été confirmé par trois recoupements internes.
        (1) Avec l'exposant 1 — la lecture « naturelle » (x y2 + y x2) + i y y2
        — la loi serait SYMÉTRIQUE en (x,y) et (x2,y2), donc COMMUTATIVE, et
        la question 1-b (« montrer que * n'est pas commutative ») serait sans
        objet ; l'exposant 5 est donc exigé par l'énoncé lui-même.
        (2) L'associativité (question 2) tient pour tout exposant entier
        n >= 1 : les deux membres valent x y2 y3 + y^n x2 y3 + (y y2)^n x3 +
        i y y2 y3. Elle ne contredit donc pas l'exposant 5, et ne permet pas
        non plus de le déterminer — c'est bien la non-commutativité qui le
        force. (3) Les deux vérifications numériques de l'énoncé exigent
        seulement n >= 1 (elles reposent sur 0^n = 0) : 1 * 2i = 1x2 + 0^5x0 = 2
        et 1 * (1+2i) = 1x2 + 0^5x1 = 2, toutes deux retrouvées.
        RE-DÉMONSTRATION INDÉPENDANTE de tous les résultats (2026-08-23),
        aucun arrondi, aucun résultat repris de la source sans recalcul :
        2i * 1 = (0x0 + 2^5x1) + i(2x0) = 32, d'où 1 * 2i = 2 différent de
        32 = 2i * 1 (Q1-b) ; le neutre de * est i, et il l'est des DEUX côtés
        (z * i = (x·1 + y^5·0) + i(y·1) = z et i * z = (0·y + 1^5·x) + i(1·y) = z),
        ce qui vaut sur C tout entier ; le symétrique de z = x+iy dans E est
        -x/y^6 + (1/y) i, vérifié des deux côtés ; (C,*) n'est pas un groupe
        parce que 1 = 1+0i n'a AUCUN symétrique (1 * (x2+iy2) = y2 est
        toujours réel, jamais égal à i), ce que la chaîne « en déduire »
        des questions 1-a et 3-a établit par simplification ; contre-exemple
        de non-commutativité INTERNE À E (les deux facteurs de la question
        1-b, 1 et 2i, ne sont pas tous deux dans E) : (1+i) * 2i = 2+2i tandis
        que 2i * (1+i) = 32+2i ; symétrique dans F de yi : (1/y) i ; sur G,
        (x+i) * (x2+i) = (x+x2) + i, expression symétrique en x et x2, donc *
        EST commutative sur G bien qu'elle ne le soit pas sur E.
        Barème recompté sur le scan : 0,25 + 0,25 + 0,5 + 0,25 + 0,25 + 0,25
        + 0,5 + 0,5 + 0,25 + 0,25 + 0,25 = 3,5. Points hors du périmètre
        strict des rungs, signalés en tête de fichier : SCOPE NOTE 6
        (simplification dans un groupe ; ensemble d'arrivée qui n'est pas un
        groupe ; commutativité qui tient sur une partie d'un groupe non
        commutatif).
    intro: |-
      **Structures algébriques (examen national, session de rattrapage 2024, Sciences Mathématiques — Exercice 4, 3,5 points).**

      On munit l'ensemble $\mathbb{C}$ des nombres complexes de la loi de composition interne $\ast$ définie par :

      $$\forall (x, x', y, y') \in \mathbb{R}^4\ ;\quad (x+iy) \ast (x'+iy') = (xy' + y^5 x') + iyy'$$

      *Le fil de l'exercice.* Tout le sujet tient dans une dissymétrie : dans la partie réelle du résultat, le facteur de gauche fournit $x$ **et** $y^5$, celui de droite fournit $y'$ **et** $x'$. Échange les deux facteurs et l'expression change — c'est cet exposant $5$, et lui seul, qui rend la loi non commutative. La Partie I fait le tour de $\ast$ sur $\mathbb{C}$ (associative, mais $(\mathbb{C},\ast)$ n'est pas un groupe), puis se replie sur la partie $E$ des complexes de partie imaginaire non nulle, où tout redevient sain — un groupe, non commutatif. La Partie II descend deux crans plus bas : un sous-groupe $F$, puis un ensemble $G$ que l'on atteint par transport depuis $(\mathbb{R},+)$, et sur lequel la commutativité, perdue sur $E$, revient.
    questions:
      - id: q1-a
        part: "Partie I — La loi $\\ast$ : deux calculs, et la commutativité qui tombe"
        stem: |-
          **(0,25 pt)** Vérifier que : $1 \ast 2i = 2$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une vérification numérique à $0{,}25$ point, dont l'unique difficulté est de **lire** la loi sans se tromper de lettre. Le vrai service qu'elle rend arrive à la question suivante : le nombre obtenu ici est la moitié d'un contre-exemple.

          **L'identification, ligne par ligne.** La formule est écrite pour deux complexes donnés sous forme algébrique. Il faut donc d'abord écrire les deux facteurs sous cette forme, même — surtout — quand ils n'y sont pas.

          $1 = 1 + 0i$ : le facteur de gauche donne $x = 1$ et $y = 0$.

          $2i = 0 + 2i$ : le facteur de droite donne $x' = 0$ et $y' = 2$.

          Le réflexe à installer : $1$ n'est pas « un réel qu'on met de côté ». La loi est définie sur $\mathbb{C}$ tout entier (chapitre 2 : une loi interne combine deux éléments de l'ensemble et rend un élément de l'ensemble), et $1$ est le complexe de partie réelle $1$ et de partie imaginaire $0$, ni plus ni moins.

          **L'application.** Partie réelle du résultat : $xy' + y^5x' = 1 \times 2 + 0^5 \times 0 = 2 + 0 = 2$. Partie imaginaire : $yy' = 0 \times 2 = 0$.

          Donc $1 \ast 2i = 2 + 0i = 2$.

          **Le piège à éviter.** Croiser les lettres : écrire $y'^5x$ au lieu de $y^5x'$. La loi n'est **pas** symétrique, et c'est tout le sujet — le $y$ élevé à la puissance $5$ est celui du facteur de **gauche**, le $x$ qui l'accompagne celui du facteur de **droite**. La discipline qui protège : décider une fois pour toutes que les lettres sans prime viennent du facteur de gauche, les lettres avec prime du facteur de droite, et ne plus jamais y revenir. Ici, l'erreur ne se verrait même pas (les deux lectures donnent $2$, puisque $0^5 = 0$ des deux côtés) — elle éclatera à la question 1-b.
        steps:
          - math: '1 = 1 + 0i \ \Longrightarrow\ x = 1,\ y = 0 \qquad ; \qquad 2i = 0 + 2i \ \Longrightarrow\ x'' = 0,\ y'' = 2'
            note: "Écrire les deux facteurs sous forme algébrique avant d'appliquer la loi."
          - math: 'xy'' + y^5x'' = 1 \times 2 + 0^5 \times 0 = 2'
            note: "Partie réelle du résultat."
          - math: 'yy'' = 0 \times 2 = 0'
            note: "Partie imaginaire du résultat."
          - math: '1 \ast 2i = 2 + 0i = 2'
            note: "Le résultat demandé."
      - id: q1-b
        stem: |-
          **(0,25 pt)** Montrer que la loi de composition interne $\ast$ n'est pas commutative.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On demande de montrer qu'une propriété **universelle** est fausse. le chapitre 3 fixe la règle une fois pour toutes : « pour tous $z, z'$ » se réfute par **un seul** couple qui la met en défaut. Un contre-exemple, pas un raisonnement général — et la question 1-a vient d'en fournir la moitié gratuitement.

          **La seconde moitié.** On reprend les mêmes nombres, dans l'autre ordre. $2i = 0 + 2i$ est maintenant le facteur de gauche : $x = 0$, $y = 2$. Et $1 = 1 + 0i$ le facteur de droite : $x' = 1$, $y' = 0$.

          Partie réelle : $xy' + y^5x' = 0 \times 0 + 2^5 \times 1 = 0 + 32 = 32$. Partie imaginaire : $yy' = 2 \times 0 = 0$.

          Donc $2i \ast 1 = 32$.

          **La conclusion.** $1 \ast 2i = 2$ (question 1-a) et $2i \ast 1 = 32$. Comme $2 \neq 32$, il existe deux complexes qui ne commutent pas : la loi $\ast$ n'est pas commutative.

          On voit du même coup **d'où** vient la non-commutativité : en échangeant les deux facteurs, le $2$ qui était une partie imaginaire non élevée est devenu un $2^5 = 32$. C'est l'exposant $5$, et lui seul, qui casse la symétrie — sans lui, la partie réelle serait $xy' + yx'$, expression parfaitement symétrique en $(x,y)$ et $(x',y')$, et la loi serait commutative.

          **Le piège à éviter.** Développer $z \ast z'$ et $z' \ast z$ avec des lettres, constater que les expressions « n'ont pas l'air pareilles » et conclure. Ce n'est pas une démonstration : deux expressions littérales différentes peuvent parfaitement coïncider pour toutes les valeurs, et ici le calcul général serait même **trompeur** — la question II.2.c établira que $\ast$ EST commutative sur une partie de $\mathbb{C}$ (les complexes $x+i$, pour lesquels $y = y' = 1$ et donc $y^5 = y'^5 = 1$). Contre une propriété universelle, on produit des nombres, jamais des lettres.
        steps:
          - math: '2i = 0 + 2i \ \Longrightarrow\ x = 0,\ y = 2 \qquad ; \qquad 1 = 1 + 0i \ \Longrightarrow\ x'' = 1,\ y'' = 0'
            note: "Les mêmes nombres, dans l'ordre inverse."
          - math: '2i \ast 1 = \left(0 \times 0 + 2^5 \times 1\right) + i\left(2 \times 0\right) = 32'
            note: "Le 2 de la partie imaginaire de gauche est maintenant élevé à la puissance 5."
          - math: '1 \ast 2i = 2 \neq 32 = 2i \ast 1'
            note: "Un seul contre-exemple suffit à réfuter une propriété universelle (chapitre 3)."
          - math: '\ast \ \text{n''est pas commutative}'
            note: "Conclusion."
      - id: q2
        part: "Partie I — Associativité de $\\ast$"
        stem: |-
          **(0,5 pt)** Montrer que la loi $\ast$ est associative.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Cette fois la propriété doit être établie **pour tous** les triplets, donc il faut des lettres et un calcul complet. le chapitre 3 le dit explicitement : l'associativité ne se lit pas, elle se teste — on calcule $(z \ast z') \ast z''$ d'un côté, $z \ast (z' \ast z'')$ de l'autre, et on compare les deux expressions finales. Aucune astuce ne remplace ce double calcul.

          La seule vraie difficulté est comptable : à chaque étape, le résultat intermédiaire est lui-même un complexe, dont il faut identifier proprement la partie réelle et la partie imaginaire avant de le réinjecter dans la loi. On pose donc $z = x+iy$, $z' = x'+iy'$, $z'' = x''+iy''$, avec les six lettres réelles.

          **Premier membre.** D'abord $z \ast z' = (xy' + y^5x') + i(yy')$. Sa partie réelle est $X = xy' + y^5x'$, sa partie imaginaire $Y = yy'$. On applique alors la loi à $X + iY$ et $x'' + iy''$ : la partie réelle du résultat est $Xy'' + Y^5x''$, la partie imaginaire $Yy''$. En remplaçant :

          $$(z \ast z') \ast z'' = \left[(xy' + y^5x')y'' + (yy')^5x''\right] + i\,(yy')y'' = \left[xy'y'' + y^5x'y'' + y^5y'^5x''\right] + i\,yy'y''$$

          **Second membre.** D'abord $z' \ast z'' = (x'y'' + y'^5x'') + i(y'y'')$, de partie réelle $X' = x'y'' + y'^5x''$ et de partie imaginaire $Y' = y'y''$. On applique la loi à $x + iy$ et $X' + iY'$ : partie réelle $xY' + y^5X'$, partie imaginaire $yY'$. En remplaçant :

          $$z \ast (z' \ast z'') = \left[x(y'y'') + y^5(x'y'' + y'^5x'')\right] + i\,y(y'y'') = \left[xy'y'' + y^5x'y'' + y^5y'^5x''\right] + i\,yy'y''$$

          **La comparaison.** Terme à terme, les deux crochets sont identiques — trois monômes, les mêmes, dans le même ordre — et les deux parties imaginaires valent $yy'y''$. Donc $(z \ast z') \ast z'' = z \ast (z' \ast z'')$ pour tous complexes $z, z', z''$ : la loi $\ast$ est associative.

          Remarque à garder pour la Partie I question 4-b : cette associativité est prouvée sur $\mathbb{C}$ **tout entier**. Elle sera donc acquise, sans une ligne de plus, sur n'importe quelle partie de $\mathbb{C}$ — c'est exactement l'héritage décrit au chapitre « Sous-groupe ».

          **Le piège à éviter.** Tester l'associativité sur un triplet de nombres et conclure. Le chapitre 3 nomme cette erreur : un exemple ne prouve jamais une propriété universelle, il ne peut que la réfuter. Second piège, plus insidieux : croire que la non-commutativité établie en 1-b compromet l'associativité. Les deux propriétés sont indépendantes — la composition des fonctions, citée au chapitre 6, est le contre-exemple classique d'une loi associative et non commutative, et c'est très exactement le régime dans lequel on est ici.
        steps:
          - math: 'z \ast z'' = \underbrace{\left(xy'' + y^5x''\right)}_{X} + i\,\underbrace{\left(yy''\right)}_{Y}'
            note: "Premier calcul intermédiaire : identifier partie réelle X et partie imaginaire Y avant de réinjecter."
          - math: '(z \ast z'') \ast z'''' = \left(Xy'''' + Y^5x''''\right) + i\,Yy'''' = \left(xy''y'''' + y^5x''y'''' + y^5y''^5x''''\right) + i\,yy''y'''''
            note: "Premier membre développé."
          - math: 'z'' \ast z'''' = \underbrace{\left(x''y'''' + y''^5x''''\right)}_{X''} + i\,\underbrace{\left(y''y''''\right)}_{Y''}'
            note: "Second calcul intermédiaire, mené de la même façon."
          - math: 'z \ast (z'' \ast z'''') = \left(xY'' + y^5X''\right) + i\,yY'' = \left(xy''y'''' + y^5x''y'''' + y^5y''^5x''''\right) + i\,yy''y'''''
            note: "Second membre développé."
          - math: '(z \ast z'') \ast z'''' = z \ast (z'' \ast z''''), \qquad \forall (z,z'',z'''') \in \mathbb{C}^3'
            note: "Les deux membres coïncident terme à terme : ∗ est associative sur C tout entier."
      - id: q3-a
        part: "Partie I — Un second calcul, et $(\\mathbb{C},\\ast)$ n'est pas un groupe"
        stem: |-
          **(0,25 pt)** Vérifier que : $1 \ast (1+2i) = 2$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Encore une vérification à $0{,}25$ point, encore une identification de lettres — mais ici l'énoncé prépare visiblement quelque chose : on vient d'obtenir $1 \ast 2i = 2$ à la question 1-a, et on obtient maintenant la **même valeur** avec un second facteur différent. Ce n'est pas une coïncidence, c'est le matériau de la question 3-b.

          **L'identification.** Facteur de gauche $1 = 1 + 0i$ : $x = 1$, $y = 0$. Facteur de droite $1 + 2i$ : $x' = 1$, $y' = 2$.

          **L'application.** Partie réelle : $xy' + y^5x' = 1 \times 2 + 0^5 \times 1 = 2 + 0 = 2$. Partie imaginaire : $yy' = 0 \times 2 = 0$.

          Donc $1 \ast (1+2i) = 2 + 0i = 2$.

          Le mécanisme est transparent une fois écrit : dès que le facteur de gauche a une partie imaginaire **nulle**, le terme $y^5x'$ s'annule et la partie imaginaire $yy'$ aussi. Il ne reste que $xy'$ — c'est-à-dire que $1 \ast (x'+iy')$ vaut $y'$, quel que soit $x'$. Le $x'$ du facteur de droite disparaît purement et simplement. C'est cette disparition qui fait toute la question suivante, et c'est elle aussi qui expliquera pourquoi l'énoncé ira chercher, à la question 4, l'ensemble $E$ des complexes de partie imaginaire **non nulle**.

          **Le piège à éviter.** Traiter cette question comme un doublon de la 1-a et l'expédier sans regarder le résultat. Les deux questions ont la même réponse, et c'est précisément l'information : $1 \ast 2i = 1 \ast (1+2i)$ avec $2i \neq 1+2i$. Un sujet de bac ne fait jamais calculer deux fois la même valeur par hasard — quand ça arrive, le rapprochement EST la question suivante.
        steps:
          - math: '1 = 1 + 0i \ \Longrightarrow\ x = 1,\ y = 0 \qquad ; \qquad 1+2i \ \Longrightarrow\ x'' = 1,\ y'' = 2'
            note: "Identification des quatre réels."
          - math: '1 \ast (1+2i) = \left(1 \times 2 + 0^5 \times 1\right) + i\left(0 \times 2\right) = 2'
            note: "Le terme en x2 est effacé par le facteur 0^5."
          - math: '1 \ast (x'' + iy'') = xy'' + y^5 x'' + i\,yy'' = y'' \quad \text{lorsque} \ y = 0'
            note: "Le mécanisme général : un facteur de gauche de partie imaginaire nulle efface le x2 de droite."
          - math: '1 \ast 2i = 1 \ast (1+2i) = 2 \quad \text{alors que} \quad 2i \neq 1+2i'
            note: "Le rapprochement des questions 1-a et 3-a : c'est le matériau de la question 3-b."
      - id: q3-b
        stem: |-
          **(0,25 pt)** En déduire que $(\mathbb{C}, \ast)$ n'est pas un groupe.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « En déduire » interdit de repartir de zéro : il faut fabriquer la contradiction avec les deux égalités déjà obtenues, et rien d'autre. le chapitre 4 rappelle qu'un groupe exige **quatre** axiomes ; il suffit d'en mettre un seul en défaut. On procède par l'absurde.

          **La chaîne.** Supposons que $(\mathbb{C},\ast)$ soit un groupe, de neutre $e$. Alors le complexe $1$ possède un symétrique $s$, c'est-à-dire un complexe tel que $s \ast 1 = e$. Partons de l'égalité établie aux questions 1-a et 3-a :

          $$1 \ast 2i = 1 \ast (1+2i)$$

          Composons les deux membres **à gauche** par $s$, puis servons-nous de l'associativité — démontrée à la question 2, et c'est là qu'elle sert :

          $$s \ast (1 \ast 2i) = (s \ast 1) \ast 2i = e \ast 2i = 2i$$
          $$s \ast \left(1 \ast (1+2i)\right) = (s \ast 1) \ast (1+2i) = e \ast (1+2i) = 1+2i$$

          Les deux membres de départ étant égaux, leurs images le sont aussi : $2i = 1+2i$, donc $0 = 1$. Absurde. Par conséquent $(\mathbb{C},\ast)$ n'est pas un groupe.

          **Ce qui échoue exactement, et pourquoi ça éclaire la suite.** La contradiction ci-dessus suffit pour la copie, mais il vaut la peine de voir quel axiome tombe. Le neutre existe pourtant : $z \ast i = (x \times 1 + y^5 \times 0) + i(y \times 1) = x + iy = z$ et $i \ast z = (0 \times y + 1^5 \times x) + i(1 \times y) = x+iy = z$, donc $i$ est bien neutre pour $\ast$ sur $\mathbb{C}$ tout entier. C'est le **quatrième** axiome du chapitre 4 qui tombe : le complexe $1$ n'a aucun symétrique, puisque la question 3-a a montré que $1 \ast (x'+iy') = y'$ est toujours **réel**, donc jamais égal à $i$. Et l'on comprend du même coup le choix de la question 4 : les fautifs sont exactement les complexes de partie imaginaire nulle, que $E$ va écarter.

          **Le piège à éviter.** Répondre « $(\mathbb{C},\ast)$ n'est pas un groupe car $\ast$ n'est pas commutative » (question 1-b). La commutativité **n'est pas** un axiome de groupe : le chapitre 4 en compte quatre, et elle n'y figure pas — elle définit le groupe \astcommutatif\ast au chapitre 6, un cas particulier. La question 4-b construira d'ailleurs un groupe qui n'est pas commutatif, ce qui règle définitivement la confusion.
        steps:
          - math: '\text{Supposons} \ (\mathbb{C},\ast) \ \text{groupe de neutre} \ e \ \Longrightarrow\ \exists s \in \mathbb{C},\ s \ast 1 = e'
            note: "Raisonnement par l'absurde : on suppose l'axiome 4 du chapitre 4 satisfait pour l'élément 1."
          - math: 's \ast (1 \ast 2i) = (s \ast 1) \ast 2i = e \ast 2i = 2i'
            note: "L'associativité de la question 2 est ce qui autorise le regroupement."
          - math: 's \ast \big(1 \ast (1+2i)\big) = (s \ast 1) \ast (1+2i) = e \ast (1+2i) = 1+2i'
            note: "Le même calcul sur l'autre facteur."
          - math: '1 \ast 2i = 1 \ast (1+2i) \ \Longrightarrow\ 2i = 1+2i \ \Longrightarrow\ 0 = 1'
            note: "Contradiction : (C,∗) n'est pas un groupe."
          - math: 'z \ast i = z \ \text{et} \ i \ast z = z \quad \text{mais} \quad 1 \ast (x''+iy'') = y'' \in \mathbb{R}, \ \text{jamais égal à} \ i'
            note: "Diagnostic : le neutre i existe ; c'est le symétrique de 1 qui n'existe pas (axiome 4 du chapitre 4)."
      - id: q4-a
        part: "Partie I — L'ensemble $E$ : stabilité, puis groupe non commutatif"
        stem: |-
          Soit $E$ le sous-ensemble de $\mathbb{C}$ défini par $E = \left\{ x + yi\ /\ x \in \mathbb{R} \text{ et } y \in \mathbb{R}^* \right\}$

          **(0,25 pt)** Montrer que $E$ est stable dans $(\mathbb{C}, \ast)$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « Stable » est le mot du chapitre 2 : une partie $E$ de $\mathbb{C}$ est stable pour $\ast$ lorsque combiner deux éléments de $E$ ne fait jamais sortir de $E$. C'est la première des trois conditions du critère du sous-groupe, et c'est ici la condition sans laquelle la question 4-b n'aurait même pas de sens — on ne parle pas de la structure de $(E,\ast)$ si $\ast$ n'est pas une loi **interne** sur $E$.

          Ce qui caractérise $E$ tient en une ligne : $E$ est l'ensemble des complexes de partie imaginaire **non nulle**. La forme $x+yi$ n'impose rien à $x$ ($x$ parcourt $\mathbb{R}$), tout à $y$ ($y$ parcourt $\mathbb{R}^*$). La vérification portera donc entièrement sur la partie imaginaire du résultat.

          **La vérification.** Soient $z = x+iy$ et $z' = x'+iy'$ deux éléments quelconques de $E$ — deux, écrits avec des lettres différentes. Par définition de $E$ : $x, x' \in \mathbb{R}$ et $y, y' \in \mathbb{R}^*$, c'est-à-dire $y \neq 0$ et $y' \neq 0$.

          $$z \ast z' = \left(xy' + y^5x'\right) + i\left(yy'\right)$$

          Sa partie réelle $xy' + y^5x'$ est un réel : c'est une somme de produits de réels, et $\mathbb{R}$ est stable pour $\times$ et $+$. Aucune condition n'est exigée sur elle, donc rien à vérifier de plus.

          Sa partie imaginaire est $yy'$. Or un produit de deux réels non nuls est non nul : $y \neq 0$ et $y' \neq 0$ donnent $yy' \neq 0$, donc $yy' \in \mathbb{R}^*$.

          Le résultat est donc de la forme (réel) $+ i \times$ (réel non nul) : $z \ast z' \in E$. $E$ est stable dans $(\mathbb{C},\ast)$.

          **Le piège à éviter.** Chercher à contrôler la partie réelle. Elle n'a aucune contrainte à respecter — $x$ parcourt $\mathbb{R}$ tout entier — et le temps passé à la surveiller est du temps perdu. À l'inverse, l'argument « $yy' \neq 0$ » doit être **écrit** : c'est la propriété « $\mathbb{R}$ est intègre » (un produit de réels est nul si et seulement si l'un des facteurs l'est) et c'est très exactement le point où l'exercice bascule. Le sujet a choisi $E$ pour écarter les complexes de partie imaginaire nulle, ceux-là mêmes qui ont fait échouer la question 3-b ; si le produit $yy'$ pouvait s'annuler, ils reviendraient par la fenêtre.
        steps:
          - math: 'z = x+iy \in E,\ z'' = x''+iy'' \in E \ \Longrightarrow\ x, x'' \in \mathbb{R} \ \text{et} \ y, y'' \in \mathbb{R}^*'
            note: "Traduction de l'appartenance à E : seule la partie imaginaire est contrainte."
          - math: 'z \ast z'' = \left(xy'' + y^5x''\right) + i\left(yy''\right)'
            note: "La loi appliquée à deux éléments quelconques de E."
          - math: 'xy'' + y^5x'' \in \mathbb{R}'
            note: "Partie réelle : somme de produits de réels, aucune contrainte à satisfaire."
          - math: 'y \neq 0 \ \text{et} \ y'' \neq 0 \ \Longrightarrow\ yy'' \neq 0, \quad \text{donc} \ yy'' \in \mathbb{R}^*'
            note: "Le point décisif : un produit de deux réels non nuls est non nul."
          - math: 'z \ast z'' \in E \quad : \quad E \ \text{est stable dans} \ (\mathbb{C},\ast)'
            note: "∗ est donc une loi de composition interne sur E (chapitre 2)."
      - id: q4-b
        stem: |-
          **(0,5 pt)** Montrer que $(E, \ast)$ est un groupe non commutatif.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux affirmations, et la question vaut $0{,}5$ point parce qu'elle en attend bien deux : la structure de groupe (les quatre axiomes du chapitre 4), puis le refus de la commutativité (un contre-exemple, chapitre 3). Et il faut résister à une tentation : $E$ est une partie de $\mathbb{C}$, mais $(\mathbb{C},\ast)$ **n'est pas un groupe** (question 3-b) — le critère du sous-groupe est donc inapplicable ici, faute de groupe ambiant. On reprend la liste de contrôle du chapitre 4, en récoltant au passage tout ce qui a déjà été prouvé.

          **1. Loi interne.** C'est exactement la question 4-a. ✓

          **2. Associativité.** Prouvée à la question 2 sur $\mathbb{C}$ tout entier, donc vraie en particulier pour les éléments de $E$, qui sont des complexes comme les autres. Pas une ligne de calcul à réécrire — c'est l'héritage décrit au chapitre « Sous-groupe », et le seul des quatre axiomes qui se transmette gratuitement. ✓

          **3. Élément neutre.** Le candidat a été identifié à la question 3-b : $e = i$. Deux choses à vérifier, et les deux comptent.

          D'abord son **appartenance** à $E$ : $i = 0 + 1 \times i$, avec $0 \in \mathbb{R}$ et $1 \in \mathbb{R}^*$, donc $i \in E$. C'est ce qui aurait pu échouer et qui n'échoue pas.

          Ensuite l'égalité, des **deux** côtés, la loi n'étant pas commutative. Pour $z = x+iy \in E$, en prenant $i$ à droite ($x' = 0$, $y' = 1$) : $z \ast i = \left(x \times 1 + y^5 \times 0\right) + i\left(y \times 1\right) = x + iy = z$. Et en prenant $i$ à gauche ($x = 0$, $y = 1$) : $i \ast z = \left(0 \times y + 1^5 \times x\right) + i\left(1 \times y\right) = x+iy = z$. ✓

          **4. Symétrique de chaque élément.** C'est le seul vrai calcul. Soit $z = x+iy \in E$ (donc $y \neq 0$) ; on cherche $z' = x'+iy' \in E$ tel que $z \ast z' = i$. En identifiant parties réelle et imaginaire :

          $$yy' = 1 \quad \text{et} \quad xy' + y^5x' = 0$$

          La première équation a une solution — et une seule — parce que $y \neq 0$ : $y' = \dfrac{1}{y}$, qui est bien un réel **non nul**. Report dans la seconde : $\dfrac{x}{y} + y^5x' = 0$, d'où $y^5 x' = -\dfrac{x}{y}$ puis, en divisant par $y^5 \neq 0$, $x' = -\dfrac{x}{y^6}$, un réel.

          Le candidat est donc $z' = -\dfrac{x}{y^6} + \dfrac{1}{y}\,i$, et il appartient à $E$ puisque sa partie imaginaire $\dfrac{1}{y}$ est non nulle. Il reste à vérifier l'autre côté, ce que la non-commutativité rend obligatoire :

          $$z' \ast z = \left(x'y + y'^5x\right) + i\left(y'y\right) = \left(-\dfrac{x}{y^6} \times y + \dfrac{1}{y^5} \times x\right) + i\left(\dfrac{1}{y} \times y\right) = \left(-\dfrac{x}{y^5} + \dfrac{x}{y^5}\right) + i = i$$

          Les deux compositions valent $i$ : tout élément de $E$ possède un symétrique dans $E$. ✓

          Les quatre axiomes sont cochés : $(E,\ast)$ est un groupe.

          **La non-commutativité, sur $E$ cette fois.** Le contre-exemple de la question 1-b ne sert **pas** ici : $1 = 1+0i$ a une partie imaginaire nulle, il n'appartient pas à $E$. Il en faut un dont les deux facteurs vivent dans $E$. Prenons $z = 1+i$ ($x=1$, $y=1$) et $z' = 2i$ ($x'=0$, $y'=2$), tous deux dans $E$ :

          $$(1+i) \ast 2i = \left(1 \times 2 + 1^5 \times 0\right) + i\left(1 \times 2\right) = 2 + 2i$$
          $$2i \ast (1+i) = \left(0 \times 1 + 2^5 \times 1\right) + i\left(2 \times 1\right) = 32 + 2i$$

          $2+2i \neq 32+2i$ : $(E,\ast)$ est un groupe **non commutatif**.

          **Le piège à éviter.** Recycler le contre-exemple de la question 1-b sans vérifier que ses deux facteurs sont dans $E$. C'est l'erreur la plus coûteuse de la question, parce qu'elle est invisible : le calcul est juste, mais il porte sur des nombres dont l'un n'appartient pas à l'ensemble étudié, et il ne prouve donc rien sur $(E,\ast)$. Le réflexe : avant d'écrire un contre-exemple, relire la définition de l'ensemble et cocher l'appartenance de **chaque** nombre qu'on y met.
        steps:
          - math: '\text{1. } \ast \ \text{interne sur} \ E \quad (\text{q4-a})'
            note: "Premier axiome du chapitre 4, déjà acquis."
          - math: '\text{2. } \ast \ \text{associative sur} \ \mathbb{C} \ (\text{q2}) \ \Longrightarrow\ \text{associative sur} \ E'
            note: "Héritage : une propriété universelle vraie sur C vaut sur toute partie de C."
          - math: '\text{3. } \ i = 0 + 1\cdot i \in E, \qquad z \ast i = z \ \text{et} \ i \ast z = z'
            note: "Le neutre : appartenance à E, puis l'égalité des deux côtés (la loi n'est pas commutative)."
          - math: '\text{4. } \ z \ast z'' = i \iff yy'' = 1 \ \text{et} \ xy'' + y^5x'' = 0'
            note: "Identification des parties réelle et imaginaire : le système qui donne le symétrique."
          - math: 'y'' = \frac{1}{y} \in \mathbb{R}^*, \qquad \frac{x}{y} + y^5x'' = 0 \ \Longrightarrow\ x'' = -\frac{x}{y^6} \in \mathbb{R}'
            note: "Résolution, licite parce que y est non nul — c'est toute la raison d'être de E."
          - math: 'z'' = -\frac{x}{y^6} + \frac{1}{y}\,i \in E, \qquad z'' \ast z = \left(-\frac{x}{y^5} + \frac{x}{y^5}\right) + i = i'
            note: "Le symétrique reste dans E, et il l'est des deux côtés."
          - math: '(1+i) \ast 2i = 2+2i \neq 32+2i = 2i \ast (1+i), \qquad 1+i \in E,\ 2i \in E'
            note: "Contre-exemple INTERNE à E : celui de la question 1-b utilisait 1, qui n'est pas dans E."
          - math: '(E,\ast) \ \text{est un groupe non commutatif}'
            note: "Quatre axiomes cochés (chapitre 4), commutativité réfutée (chapitres 3 et 6)."
      - id: q5
        part: "Partie II — $F$, un sous-groupe de $(E,\\ast)$"
        stem: |-
          On considère les sous-ensembles de $E$ définies par : $F = \left\{ yi\ /\ y \in \mathbb{R}^* \right\}$ et $G = \left\{ x + i\ /\ x \in \mathbb{R} \right\}$

          **(0,5 pt)** Montrer que $F$ est un sous-groupe de $(E, \ast)$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le décor a changé : la question 4-b vient d'établir que $(E,\ast)$ est un **groupe**, et c'est ce qui autorise enfin le critère du chapitre « Sous-groupe : un groupe caché dans un autre ». Trois conditions, pas quatre — l'associativité de $\ast$ est vraie sur $\mathbb{C}$ tout entier (question 2), donc sur $F$ sans une ligne. C'est mot pour mot l'exemple travaillé du chapitre, avec une loi exotique à la place de l'addition matricielle.

          **L'inclusion préalable.** $F \subset E$ : un élément de $F$ s'écrit $yi = 0 + yi$ avec $0 \in \mathbb{R}$ et $y \in \mathbb{R}^*$, ce qui est précisément la forme des éléments de $E$. Cette ligne, souvent omise, est ce qui donne un sens à la phrase « sous-groupe de $(E,\ast)$ » — le chapitre insiste : on ne peut pas être un groupe \astà l'intérieur\ast d'un ensemble auquel on n'appartient pas.

          **Condition 1 — le neutre appartient à $F$.** Le neutre de $(E,\ast)$ est $i$ (question 4-b). Or $i = 1 \times i$, avec $1 \in \mathbb{R}^*$ : donc $i \in F$, et $F$ n'est pas vide. ✓

          **Condition 2 — la stabilité.** Deux éléments quelconques de $F$, écrits avec des lettres différentes : $yi$ (donc $x = 0$) et $y'i$ (donc $x' = 0$), avec $y, y' \in \mathbb{R}^*$.

          $$yi \ast y'i = \left(0 \times y' + y^5 \times 0\right) + i\left(yy'\right) = (yy')\,i$$

          Les deux termes de la partie réelle s'annulent, chacun pour sa propre raison : le premier parce que $x = 0$, le second parce que $x' = 0$. Et $yy' \in \mathbb{R}^*$, comme à la question 4-a. Le résultat a bien la forme $(\text{réel non nul}) \times i$ : il est dans $F$. ✓

          **Condition 3 — les symétriques.** Le symétrique dans $(E,\ast)$ d'un élément $x+iy$ a été calculé à la question 4-b : $-\dfrac{x}{y^6} + \dfrac{1}{y}i$. Pour $yi$, on a $x = 0$, donc ce symétrique vaut $0 + \dfrac{1}{y}i = \dfrac{1}{y}\,i$, avec $\dfrac{1}{y} \in \mathbb{R}^*$ : il est dans $F$. ✓

          Les trois conditions tiennent : $F$ est un sous-groupe de $(E,\ast)$, donc $(F,\ast)$ est un groupe.

          **Le piège à éviter.** Repasser les quatre axiomes du chapitre 4 sur $F$ — en particulier rédiger à nouveau l'associativité. C'est du temps perdu pour zéro point, et le chapitre le dit : l'associativité s'hérite, le reste se vérifie. L'erreur symétrique, plus coûteuse, est de s'arrêter à deux conditions sur trois en oubliant les symétriques : le chapitre le montre sur $\mathbb{N}$ dans $(\mathbb{Z},+)$, où neutre et stabilité passent mais où un seul symétrique qui s'échappe suffit à tout faire tomber. Ici la troisième condition est même la plus rapide des trois — à condition d'avoir gardé la formule du symétrique établie en 4-b plutôt que de la recalculer.
        steps:
          - math: 'yi = 0 + yi, \quad 0 \in \mathbb{R},\ y \in \mathbb{R}^* \ \Longrightarrow\ F \subset E'
            note: "L'inclusion préalable, sans laquelle « sous-groupe de (E,∗) » n'a pas de sens."
          - math: 'i = 1 \times i \in F \qquad (\text{neutre de} \ (E,\ast) \ \text{établi en q4-b})'
            note: "Condition 1 du critère du sous-groupe : le neutre est dans F."
          - math: 'yi \ast y''i = \left(0 \times y'' + y^5 \times 0\right) + i\left(yy''\right) = (yy'')\,i \in F \qquad (yy'' \in \mathbb{R}^*)'
            note: "Condition 2 : la partie réelle s'annule des deux côtés, la partie imaginaire reste non nulle."
          - math: '\text{symétrique de} \ yi \ = -\frac{0}{y^6} + \frac{1}{y}i = \frac{1}{y}\,i \in F \qquad \left(\frac{1}{y} \in \mathbb{R}^*\right)'
            note: "Condition 3 : la formule de q4-b, appliquée avec x = 0."
          - math: 'F \ \text{est un sous-groupe de} \ (E,\ast)'
            note: "Trois conditions sur trois ; l'associativité s'hérite et ne se rédige pas."
      - id: q6-a
        part: "Partie II — L'application $\\varphi$ et le groupe commutatif $(G,\\ast)$"
        stem: |-
          On considère l'application $\varphi$ définie de $\mathbb{R}$ vers $\mathbb{C}$ par : $(\forall x \in \mathbb{R})$ ; $\varphi(x) = x + i$

          **(0,25 pt)** Montrer que : $\varphi(\mathbb{R}) = G$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $\varphi(\mathbb{R})$ désigne l'**image** de $\mathbb{R}$ par $\varphi$, c'est-à-dire l'ensemble des valeurs effectivement atteintes : $\varphi(\mathbb{R}) = \left\{\varphi(x) \ /\ x \in \mathbb{R}\right\}$. On demande de montrer que cet ensemble est exactement $G$. Deux ensembles sont égaux quand chacun est inclus dans l'autre : on rédige donc une double inclusion. La question vaut $0{,}25$ point et tient en quatre lignes, mais elle est le pivot de la question 6-c — sans elle, le transport de structure ne donnerait rien sur $G$.

          **$\varphi(\mathbb{R}) \subset G$.** Soit $w \in \varphi(\mathbb{R})$. Par définition, il existe $x \in \mathbb{R}$ tel que $w = \varphi(x) = x+i$. C'est exactement la forme des éléments de $G = \left\{x+i \ /\ x \in \mathbb{R}\right\}$, donc $w \in G$.

          **$G \subset \varphi(\mathbb{R})$.** Soit $w \in G$. Alors $w$ s'écrit $w = x+i$ pour un certain réel $x$. Ce réel est un antécédent : $\varphi(x) = x+i = w$, donc $w \in \varphi(\mathbb{R})$.

          Les deux inclusions donnent $\varphi(\mathbb{R}) = G$.

          Relevons au passage, pour la question 6-c, un fait que le calcul ci-dessus rend évident et qui ne sera pas redemandé : $\varphi$ est **injective**. Si $\varphi(x) = \varphi(x')$, alors $x+i = x'+i$, et deux complexes égaux ont même partie réelle, donc $x = x'$. Jointe à l'égalité $\varphi(\mathbb{R}) = G$, cela fait de $\varphi$ une **bijection de $\mathbb{R}$ sur $G$**.

          Notons enfin — c'est ce qui rendra la question 6-c possible — que $G \subset E$ : tout élément $x+i$ de $G$ a pour partie imaginaire $1$, qui est bien un réel non nul.

          **Le piège à éviter.** Confondre l'ensemble d'**arrivée** et l'**image**. L'énoncé définit $\varphi$ « de $\mathbb{R}$ vers $\mathbb{C}$ » : l'ensemble d'arrivée est $\mathbb{C}$, qui est immense, et $\varphi(\mathbb{R})$ n'en est qu'une petite partie — une droite. Écrire « $\varphi(\mathbb{R}) = \mathbb{C}$ parce que $\varphi$ arrive dans $\mathbb{C}$ » est l'erreur type ; la question ne serait d'ailleurs pas posée si les deux notions coïncidaient.
        steps:
          - math: '\varphi(\mathbb{R}) = \left\{\varphi(x) \ /\ x \in \mathbb{R}\right\} = \left\{x+i \ /\ x \in \mathbb{R}\right\}'
            note: "L'image, par définition : l'ensemble des valeurs effectivement atteintes."
          - math: 'w \in \varphi(\mathbb{R}) \ \Longrightarrow\ \exists x \in \mathbb{R},\ w = x+i \ \Longrightarrow\ w \in G'
            note: "Première inclusion."
          - math: 'w \in G \ \Longrightarrow\ w = x+i \ \text{avec} \ x \in \mathbb{R} \ \Longrightarrow\ w = \varphi(x) \in \varphi(\mathbb{R})'
            note: "Seconde inclusion : l'antécédent est le réel x lui-même."
          - math: '\varphi(\mathbb{R}) = G'
            note: "Double inclusion."
          - math: '\varphi(x) = \varphi(x'') \Rightarrow x = x'' \quad ; \quad G \subset E \ \ (\operatorname{Im}(x+i) = 1 \neq 0)'
            note: "Deux remarques gratuites, indispensables en q6-c : phi est injective, et G est inclus dans E."
      - id: q6-b
        stem: |-
          **(0,25 pt)** Montrer que $\varphi$ est un homomorphisme de $(\mathbb{R}, +)$ vers $(\mathbb{C}, \ast)$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Un homomorphisme — ce que la leçon appelle un **morphisme** au chapitre 10 — est une application qui respecte les lois : l'image d'une composition est la composition des images. Ici, la loi de départ est $+$ sur $\mathbb{R}$, la loi d'arrivée est $\ast$ sur $\mathbb{C}$, et l'égalité à établir est donc

          $$\forall (x,x') \in \mathbb{R}^2, \qquad \varphi(x+x') = \varphi(x) \ast \varphi(x')$$

          Le geste est invariable : on calcule les deux membres **séparément**, sans jamais les faire converger de force, et on constate à la fin qu'ils coïncident.

          **Membre de gauche.** $x+x'$ est un réel, donc $\varphi(x+x') = (x+x') + i$. Rien de plus.

          **Membre de droite.** On applique $\ast$ à $\varphi(x) = x+i$ et $\varphi(x') = x'+i$. Les quatre réels de la formule sont ici : $x$ et $y = 1$ pour le facteur de gauche, $x'$ et $y' = 1$ pour celui de droite.

          $$\varphi(x) \ast \varphi(x') = (x+i)\ast(x'+i) = \left(x \times 1 + 1^5 \times x'\right) + i\left(1 \times 1\right) = (x+x') + i$$

          Les deux membres sont identiques : $\varphi$ est un homomorphisme de $(\mathbb{R},+)$ vers $(\mathbb{C},\ast)$.

          Le calcul montre du même coup **pourquoi** ça marche : sur $G$, les parties imaginaires valent toutes $1$, et $1^5 = 1$. L'exposant $5$ — celui qui casse la commutativité partout ailleurs — devient inoffensif, et la loi $\ast$ se réduit à l'addition des parties réelles. C'est cette dégénérescence qui fait de $G$ une copie déguisée de $(\mathbb{R},+)$, et c'est tout le sujet de la question 6-c.

          **Le piège à éviter.** Écrire $\varphi(x+x') = \varphi(x) + \varphi(x')$, par réflexe additif. Un morphisme ne « conserve pas l'addition » : il envoie la loi de **départ** sur la loi d'**arrivée**, qui ne portent presque jamais le même nom. Ici $\varphi(x) + \varphi(x') = (x+x') + 2i$, qui n'est même pas dans $G$ — la formule fausse donne un résultat visiblement faux, ce qui est une chance.
        steps:
          - math: '\varphi(x+x'') = (x+x'') + i'
            note: "Membre de gauche : on compose d'abord dans R, on applique phi ensuite."
          - math: '\varphi(x) \ast \varphi(x'') = (x+i)\ast(x''+i), \qquad y = y'' = 1'
            note: "Membre de droite : on applique phi d'abord, on compose ensuite avec ∗."
          - math: '(x+i)\ast(x''+i) = \left(x \times 1 + 1^5 \times x''\right) + i\left(1 \times 1\right) = (x+x'') + i'
            note: "L'exposant 5 est neutralisé par y = 1 : c'est pourquoi ∗ dégénère en addition sur G."
          - math: '\varphi(x+x'') = \varphi(x) \ast \varphi(x''), \qquad \forall (x,x'') \in \mathbb{R}^2'
            note: "Les deux membres coïncident : phi est un homomorphisme (le morphisme du chapitre 10)."
      - id: q6-c
        stem: |-
          **(0,25 pt)** En déduire que $(G, \ast)$ est un groupe commutatif.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « En déduire » interdit de repartir des axiomes : tout le travail a été fait, il s'agit de le **transporter**. C'est le chapitre 10 dans sa forme la plus économique — un isomorphisme fait passer une structure d'un ensemble à l'autre sans re-vérification.

          **Le montage, et le détour obligé.** Attention à l'ensemble d'arrivée annoncé par la question 6-b : $(\mathbb{C},\ast)$ **n'est pas un groupe** (question 3-b). On ne peut donc pas invoquer « l'image d'un groupe par un morphisme est un sous-groupe de l'arrivée » — il n'y a pas de groupe à l'arrivée. Le passage se fait par $E$ : la question 6-a a relevé $G \subset E$ (tout élément $x+i$ a pour partie imaginaire $1 \neq 0$), et $(E,\ast)$ **est** un groupe (question 4-b). Le calcul de la question 6-b, qui ne dépend d'aucune propriété de $\mathbb{C}$ hors de la formule de $\ast$, vaut donc tel quel comme morphisme de $(\mathbb{R},+)$ vers $(E,\ast)$.

          Les trois ingrédients du chapitre 10 sont alors en place :

          - $(\mathbb{R},+)$ est un groupe **commutatif** — le groupe de référence, connu depuis toujours ;
          - $\varphi$ est un morphisme de $(\mathbb{R},+)$ vers $(E,\ast)$ : question 6-b ;
          - $\varphi$ est **bijective de $\mathbb{R}$ sur $G$** : surjective par $\varphi(\mathbb{R}) = G$ (question 6-a), injective parce que $x+i = x'+i$ impose $x = x'$ (relevé en 6-a).

          $\varphi$ est donc un **isomorphisme** de $(\mathbb{R},+)$ sur $(G,\ast)$, et toute la structure passe telle quelle : $(G,\ast)$ est un groupe commutatif. La loi $\ast$ y est bien interne, ce que le morphisme fournit gratuitement — $\varphi(x)\ast\varphi(x') = \varphi(x+x') \in G$.

          Le transport livre aussi les deux repères, sans calcul : le neutre de $(G,\ast)$ est $\varphi(0) = i$ (cohérent avec le neutre de $(E,\ast)$ trouvé en 4-b), et le symétrique de $x+i$ est $\varphi(-x) = -x+i$ (cohérent avec la formule générale $-\dfrac{x}{y^6} + \dfrac{1}{y}i$ prise en $y = 1$).

          **Le piège à éviter.** Croire que la commutativité de $(G,\ast)$ s'hérite de $(E,\ast)$ comme l'associativité. Elle ne peut pas : $(E,\ast)$ n'est **pas** commutatif (question 4-b). Le chapitre « Sous-groupe » énonce l'héritage dans le seul sens où il est vrai — un sous-groupe d'un groupe commutatif est commutatif — et il ne dit rien du cas présent, où une partie est commutative dans un ambiant qui ne l'est pas. Rien de contradictoire : la non-commutativité de $\ast$ vient de l'exposant $5$ appliqué à des parties imaginaires **différentes**, et sur $G$ elles valent toutes $1$. Le contre-exemple de 4-b, $(1+i)$ et $2i$, ne vit d'ailleurs pas dans $G$ — $2i$ a une partie réelle nulle mais surtout une partie imaginaire $2 \neq 1$. La commutativité de $(G,\ast)$ vient donc de $(\mathbb{R},+)$ par transport, jamais de $(E,\ast)$ par héritage ; à défaut, elle se vérifie en une ligne sur la formule de 6-b, $(x+i)\ast(x'+i) = (x+x')+i$, expression symétrique en $x$ et $x'$.
        steps:
          - math: '(\mathbb{C},\ast) \ \text{n''est pas un groupe (q3-b)} \ \Longrightarrow\ \text{le transport passe par} \ E'
            note: "Le détour obligé : on ne transporte pas une structure vers un ensemble sans structure."
          - math: 'G \subset E \ (\operatorname{Im}(x+i) = 1 \neq 0) \quad \text{et} \quad (E,\ast) \ \text{groupe} \ (\text{q4-b})'
            note: "L'ambiant qui convient est E, pas C."
          - math: '\varphi \ \text{morphisme} \ (\text{q6-b}), \quad \varphi \ \text{bijective de} \ \mathbb{R} \ \text{sur} \ G \ (\text{q6-a})'
            note: "Morphisme + bijectivité sur G : phi est un isomorphisme (chapitre 10)."
          - math: '(\mathbb{R},+) \ \text{groupe commutatif} \ \xrightarrow{\ \varphi\ } \ (G,\ast) \ \text{groupe commutatif}'
            note: "La structure se transporte intégralement, sans revérifier un seul axiome."
          - math: '\text{neutre} = \varphi(0) = i, \qquad \text{symétrique de} \ x+i \ \text{est} \ \varphi(-x) = -x+i'
            note: "Deux repères fournis gratuitement par le transport, cohérents avec q4-b."
          - math: '(x+i)\ast(x''+i) = (x+x'') + i = (x''+x) + i = (x''+i)\ast(x+i)'
            note: "Vérification directe de la commutativité sur G : elle ne vient PAS de E, qui n'est pas commutatif."
