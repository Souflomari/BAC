# ces deux-là ajoutées 2026-08-06) ; bk-2024-n-x4 q8 (« ℝ×ℝ* est un
# sous-groupe de (ℂ×ℂ*,T) », 2026-08-05). Le trou pédagogique sous-jacent
# (aucun rung « sous-groupe ») reste réel — quatre sujets sur six le
# mobilisent désormais, pour cinq occurrences au total — et mérite
# l'attention du pédagogy-architect si ce chapitre est repris.
#
# >>> MISE À JOUR 2026-08-23 — SCOPE NOTE 1 EST RÉSOLUE. lesson.md porte
# désormais un chapitre plein « Sous-groupe : un groupe caché dans un
# autre » (entre R3 et R4), qui définit le mot, énonce le CRITÈRE À TROIS
# CONDITIONS (neutre dans H, stabilité, symétriques dans H), explique ce
# qui s'hérite (associativité, commutativité) et ce qui ne s'hérite pas,
# traite un exemple travaillé « dans l'habillage de l'examen » — très
# exactement F = {M(a,b) = [[a,-b],[b,a]] / (a,b) dans Z²} sous-groupe de
# (M2(R),+) — rappelle la vérification oubliée H inclus dans E, et nomme
# l'erreur fréquente (deux conditions sur trois, N dans (Z,+)). Le trou
# décrit ci-dessus n'existe donc plus. bk-2023-r-x3 (ajouté le même soir)
# est la PREMIÈRE entrée de ce fichier à s'appuyer sur ce chapitre au lieu
# de le contourner : ses questions q1 (E sous-groupe de (M3(R),+)) et q4-a
# (G sous-groupe de (R×C,∗)) invoquent nommément le critère à trois
# conditions et l'exemple travaillé du chapitre, sans re-décliner la
# checklist à quatre axiomes du R3. bk-2024-r-x4 (ajoutée le même soir)
# fait de même en q5 (F sous-groupe de (E,∗)) — et son reasoning nomme, en
# plus, la condition préalable que le chapitre appelle « la vérification
# qu'on oublie » : F inclus dans E. Les CINQ occurrences antérieures
# recensées ci-dessus (bk-2019-n-x1 q7, bk-2022-n-x4 q1, bk-2023-n-x5 q1 et
# q8, bk-2024-n-x4 q8) gardent leur rédaction de contournement : elle
# reste juste et « dans le cadre », mais elle est désormais plus longue que
# nécessaire. Un passage de rattachement de ces cinq reasoning au nouveau
# chapitre est une amélioration éditoriale identifiée, non faite ici pour
# ne pas mêler une réécriture de fond à l'ajout d'une entrée — à
# l'arbitrage de l'owner.
#
# SCOPE NOTE 2 (divulgation honnête, authoring-side — INTÈGRE, nouveau
# 2026-08-05) : bk-2022-n-x4 (questions 4-a à 4-c) demande de montrer que
# l'anneau E est INTÈGRE, puis d'en déduire qu'il n'est pas un corps ; le
# rappel de tête d'énoncé du sujet lui-même qualifie déjà (ℤ,+,×)
# d'« anneau commutatif unitaire et intègre ». Ce mot n'est défini NULLE
# PART dans lesson.md (grep vérifié : zéro occurrence de « intègre » ou
# « intégrité ») — R5 (anneau) et R6 (corps) ne l'introduisent pas, alors
# que c'est un troisième pilier classique du même trio anneau/intègre/corps.
# Le champ `reasoning` de la question q9 ci-dessous introduit la définition
# directement (absence de diviseurs de zéro), à l'aide du rappel de tête
# d'énoncé sur ℤ plutôt que d'un rung — même logique de contournement
# honnête que pour le sous-groupe. Trou pédagogique réel, distinct de celui
# du sous-groupe : mérite lui aussi l'attention du pédagogy-architect.
#
# SCOPE NOTE 3 (divulgation honnête, authoring-side — CORPS PAR CONTRE-
# EXEMPLE SANS « INTÈGRE » NOMMÉ, et ESPACE VECTORIEL, nouveau 2026-08-06) :
# bk-2023-n-x5 q6 (Partie I, « En déduire que (E,+,×) n'est pas un corps »)
# repose sur le MÊME critère de fond que SCOPE NOTE 2 (un produit de deux
# éléments non nuls qui vaut la matrice nulle contredit l'inversibilité
# pour ×), mais cette fois le rappel de tête d'énoncé ne qualifie PAS
# (M2(ℝ),+,×) d'« intègre » — rien à emprunter à l'énoncé cette fois. Le
# champ `reasoning` de q6 reste donc strictement DANS LE CADRE du rung R6 :
# au lieu de nommer « diviseurs de zéro » ou « anneau intègre » (concepts
# toujours absents de lesson.md), il prouve directement par l'absurde, en
# multipliant les deux membres de M(√3,1)×M(-√3,1)=O par l'inverse supposé
# de M(√3,1) — une manipulation qui ne mobilise que la définition du corps
# du R6 (tout élément non nul inversible pour ×) et l'associativité, deux
# faits déjà couverts. Aucun vocabulaire non enseigné n'est introduit ; le
# critère sous-jacent (absence de diviseurs de zéro dans un corps) reste
# néanmoins un fait qu'un élève n'a jamais vu nommé — signalé ici par
# transparence, mais traité « dans le cadre » par cette rédaction.
#
# Par ailleurs, bk-2023-n-x5 q2 (Partie I, « Montrer que E est un sous-
# espace vectoriel de (M2(ℝ),+,·) ») mobilise la notion d'ESPACE VECTORIEL,
# qui n'appartient PAS à ce chapitre (lesson.md ne traite que lois, groupes,
# anneaux et corps — jamais d'algèbre linéaire). C'est le rappel de tête
# d'énoncé du sujet lui-même qui introduit « (M2(ℝ),+,·) est un espace
# vectoriel réel », signe que la notion est supposée acquise d'un chapitre
# antérieur du cursus, pas de celui-ci. Le `reasoning` de q2 traite donc ce
# point comme un ACQUIS DE PARCOURS ANTÉRIEUR (stabilité pour + et pour ·,
# exactement le même geste de vérification que R1, transposé à une
# structure hors chapitre), sans prétendre le rattacher à un rung de cette
# notion — à l'attention du pédagogy-architect si un pont explicite avec le
# chapitre « espaces vectoriels » est jugé utile.
#
# SCOPE NOTE 4 (divulgation honnête, authoring-side — TRANSPORT DE
# STRUCTURE SUR DEUX LOIS À LA FOIS, nouveau 2026-08-06) : bk-2025-n-x4 q9
# (« Montrer que (E,T,×) est un corps commutatif ») étend la technique du
# rung R7 au-delà de ce qu'il illustre explicitement : dans la leçon, R7 ne
# transporte structure et propriétés QUE pour une seule loi à la fois
# (l'isomorphisme φ du sujet 2019 ne transporte que ∗ vers ×). Ici,
# l'application φ(x) = M((1-x)/2) se trouve compatible à la fois avec +
# (rung R7, déjà établi aux q7-q8) ET avec × (fait nouveau, vérifié
# directement dans le `reasoning` de q9 : φ(x)×φ(y) = φ(xy)) — ce qui
# permet de transporter d'un coup toute la structure de corps de (ℝ,+,×)
# (un corps archi-connu, au même titre que (ℚ,+,×) au R6) vers (E,T,×). La
# généralisation (« un isomorphisme qui respecte deux lois à la fois
# transporte une structure d'anneau/de corps entière ») n'est nulle part
# énoncée comme telle dans lesson.md — c'est un prolongement naturel, mais
# un prolongement, du geste du R7. Signalé ici pour le pédagogy-architect ;
# le `reasoning` de q9 le présente comme la suite directe de ce qui précède,
# pas comme un rung caché.
#
# SCOPE NOTE 5 (divulgation honnête, authoring-side — UNE LOI NON
# ASSOCIATIVE GLOBALEMENT, ASSOCIATIVE SUR UNE PARTIE, nouveau 2026-08-23) :
# bk-2023-r-x3 est le premier sujet de ce fichier où une loi de composition
# interne échoue à être associative (q3-c : T n'est pas associative sur
# R×C), puis se révèle associative sur une PARTIE de cet ensemble (q4-c :
# (G−{(0,0)},T) est un groupe, donc T y est associative). Les deux faits
# sont parfaitement compatibles, mais lesson.md n'énonce nulle part la
# dissymétrie qui les réconcilie : le chapitre « Sous-groupe » explique
# bien qu'une propriété universelle vraie sur E DESCEND sur toute partie
# de E (c'est l'héritage de l'associativité et de la commutativité), il ne
# dit pas — parce qu'il n'en a pas l'occasion — que la RÉCIPROQUE est
# fausse, une propriété pouvant échouer globalement et tenir sur une
# partie où les contre-exemples n'existent tout simplement pas. Un élève
# qui a bien retenu « l'associativité s'hérite » lira donc q4-c comme une
# contradiction avec q3-c. Le champ `reasoning` de q4-c traite ce point de
# front, sans introduire de vocabulaire neuf : il énonce la dissymétrie en
# une phrase et la rend concrète en montrant que le contre-exemple de
# q3-c, u = (0,−i), n'appartient pas à G (car Im(−i) = −1 ≠ 0) — il vit
# hors de G, il n'y a donc rien à sauver. Signalé pour le
# pedagogy-architect : une ligne dans le chapitre « Sous-groupe », sur ce
# que l'héritage ne dit PAS, fermerait ce trou.
#
# Par ailleurs, la question q5 de la même entrée (« (G,∗,T) est un corps
# commutatif ») relève EXACTEMENT de la situation décrite en SCOPE NOTE 4 —
# transport de structure sur DEUX lois à la fois, prolongement du rung R7
# qui n'illustre le geste que pour une loi. Rien de neuf à signaler : le
# `reasoning` de q5 présente le prolongement Ψ(z) = (Im(z), z) de ψ à C
# tout entier, vérifie les deux compatibilités (Ψ(z)∗Ψ(z') = Ψ(z+z') vient
# du calcul de stabilité de q4-a ; Ψ(z)TΨ(z') = Ψ(zz') vient du calcul de
# q4-b, dont il est explicitement noté qu'il n'utilise jamais z ≠ 0), et
# nomme le piège correspondant : c'est la compatibilité SIMULTANÉE qui
# livre la distributivité, l'axiome qu'aucune question antérieure de
# l'exercice n'établit.
#
# SCOPE NOTE 6 (divulgation honnête, authoring-side — TROIS POINTS DE
# bk-2024-r-x4, nouveau 2026-08-23) :
#
# (a) SIMPLIFICATION DANS UN GROUPE. La question 3-b (« En déduire que
# (C,∗) n'est pas un groupe ») attend qu'on tire une contradiction de
# 1 ∗ 2i = 1 ∗ (1+2i) avec 2i différent de 1+2i — c'est-à-dire qu'on
# utilise le fait que, dans un groupe, tout élément est SIMPLIFIABLE
# (régulier). lesson.md ne l'énonce nulle part comme propriété d'un
# groupe : le seul passage sur la simplification est au chapitre « Anneau
# intègre » (« on ne peut pas simplifier par 2 dans Z/4Z »), où elle est
# liée à l'intégrité d'un anneau, pas à l'inversibilité dans un groupe.
# Le reasoning de q3-b ne l'invoque donc PAS comme un acquis : il
# re-démontre la simplification à la main, en composant les deux membres
# par un symétrique supposé de 1 et en regroupant par l'associativité
# (question 2) — deux gestes strictement couverts par les rungs R2 et R3.
# Il ajoute ensuite le diagnostic direct (l'axiome 4 du R3 tombe : 1 n'a
# aucun symétrique, car 1 ∗ (x2+iy2) = y2 est toujours réel), qui, lui,
# ne mobilise que la définition du R3.
#
# (b) TRANSPORT DE STRUCTURE VERS UN ENSEMBLE D'ARRIVÉE QUI N'EST PAS UN
# GROUPE. La question 6-c (« En déduire que (G,∗) est un groupe
# commutatif ») fait suite à une question 6-b qui présente phi comme un
# homomorphisme de (R,+) vers (C,∗) — or (C,∗) n'est PAS un groupe, c'est
# la question 3-b qui vient de l'établir. Le geste du R7 (« si (E,*) est
# déjà connu comme groupe commutatif, phi transporte toute cette
# structure sur (F,x) ») est énoncé dans la leçon entre DEUX groupes ; il
# ne dit rien du cas où l'arrivée annoncée n'en est pas un. Le reasoning
# de q6-c traite ce point de front, sans vocabulaire neuf : il re-route
# le transport par E — G inclus dans E (relevé en q6-a), (E,∗) groupe
# (q4-b) —, note que le calcul de morphisme de q6-b ne dépend que de la
# formule de ∗ et vaut donc tel quel vers (E,∗), et conclut par
# l'isomorphisme phi de (R,+) sur (G,∗). C'est le même point de fond que
# celui déjà nommé dans bk-2023-r-x3 q2-b (« ce qui transporte la
# structure, c'est morphisme + surjectivité sur l'ensemble visé »), avec
# une difficulté de plus : ici l'ensemble d'arrivée nommé par l'énoncé
# est démontré non-groupe.
#
# (c) COMMUTATIVITÉ QUI TIENT SUR UNE PARTIE D'UN GROUPE NON COMMUTATIF.
# (E,∗) n'est pas commutatif (q4-b) et pourtant (G,∗) l'est (q6-c), alors
# que G est une partie de E. C'est la dissymétrie déjà signalée en SCOPE
# NOTE 5 pour l'associativité, transposée à la commutativité — et cette
# fois le chapitre « Sous-groupe » est directement en cause, puisqu'il
# énonce que « un sous-groupe d'un groupe commutatif est automatiquement
# commutatif » sans dire ce qui se passe quand l'ambiant ne l'est pas.
# Un élève qui a retenu la phrase dans le mauvais sens lira q6-c comme
# une contradiction avec q4-b. Le reasoning de q6-c nomme le piège,
# explique le mécanisme (la non-commutativité vient de l'exposant 5
# appliqué à des parties imaginaires DIFFÉRENTES ; sur G elles valent
# toutes 1), montre que le contre-exemple de q4-b ne vit pas dans G, et
# donne la vérification directe en une ligne. Même recommandation qu'en
# SCOPE NOTE 5, et elle est désormais appuyée par deux entrées : une
# ligne dans le chapitre « Sous-groupe » sur ce que l'héritage ne dit PAS
# fermerait les deux trous d'un coup.
