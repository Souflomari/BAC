    intro: |-
      **Structures algébriques (examen national, session normale 2025, Sciences Mathématiques).**

      On rappelle que $(M_3(\mathbb{R}),+,\times)$ est un anneau unitaire et non commutatif de zéro la matrice $O = \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{pmatrix}$ et d'unité la matrice $I = \begin{pmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{pmatrix}$, et que $(M_3(\mathbb{R}),+,\cdot)$ est un espace vectoriel réel.

      Soient la matrice $A = \begin{pmatrix} -1 & -1 & 0 \\ -1 & -1 & 0 \\ -1 & 1 & -2 \end{pmatrix}$ et l'ensemble $E = \left\{ M(x) = I + xA\ /\ x \in \mathbb{R} \right\}$.

      L'exercice enchaîne d'abord un groupe multiplicatif obtenu en retirant un seul élément de $E$ (rung R3, avec une stabilité conditionnelle que les sujets 2019 et 2022 n'avaient pas), puis une seconde loi $T$ sur $E$ tout entier avec un isomorphisme depuis $(\mathbb{R},+)$ (rung R7), pour terminer sur un corps commutatif (rung R6) où $T$ joue le rôle de $+$.
    questions:
      - id: q1
        part: "Le carré de $A$, et le produit $M(x)\\times M(y)$"
        stem: |-
          **(0,25 pt)** Vérifier que : $A^2 = -2A$
        reasoning: |-
          Un calcul de vérification direct : on développe $A^2 = A\times A$ coefficient par coefficient (produit de deux matrices $3\times3$), et on compare au résultat annoncé, $-2A$. Rien à deviner — la matrice $A$ et le résultat sont tous deux donnés, il suffit de mener le calcul sans erreur.

          Ce résultat sert de pivot pour toute la suite de l'exercice : dès que $A^2$ se ramène à un multiple de $A$ lui-même, n'importe quel produit qui fait apparaître $A^2$ se simplifie de la même façon — c'est exactement ce que la question suivante exploite.
        steps:
          - math: 'A = \begin{pmatrix} -1 & -1 & 0 \\ -1 & -1 & 0 \\ -1 & 1 & -2 \end{pmatrix}'
            note: "La matrice A donnée par l'énoncé."
          - math: 'A^2 = \begin{pmatrix} -1 & -1 & 0 \\ -1 & -1 & 0 \\ -1 & 1 & -2 \end{pmatrix}\begin{pmatrix} -1 & -1 & 0 \\ -1 & -1 & 0 \\ -1 & 1 & -2 \end{pmatrix} = \begin{pmatrix} 2 & 2 & 0 \\ 2 & 2 & 0 \\ 2 & -2 & 4 \end{pmatrix}'
            note: "Produit matriciel usuel, ligne par colonne (calcul mené entièrement, coefficient par coefficient)."
          - math: '-2A = -2\begin{pmatrix} -1 & -1 & 0 \\ -1 & -1 & 0 \\ -1 & 1 & -2 \end{pmatrix} = \begin{pmatrix} 2 & 2 & 0 \\ 2 & 2 & 0 \\ 2 & -2 & 4 \end{pmatrix}'
            note: "Chaque coefficient de A multiplié par −2 : résultat identique à A²."
          - math: 'A^2 = -2A'
            note: "Les deux matrices coïncident coefficient par coefficient."
      - id: q2
        stem: |-
          **(0,25 pt)** En déduire que : $\forall(x,y) \in \mathbb{R}^2$ ; $M(x) \times M(y) = M(x + y - 2xy)$
        reasoning: |-
          $M(x)\times M(y) = (I+xA)(I+yA)$ se développe comme un produit de deux binômes matriciels — $I$ commute avec tout, donc le développement se fait exactement comme pour des réels. Le seul terme qui ne se réduit pas trivialement est $xyA^2$ : c'est précisément là que sert le résultat de la question précédente, $A^2=-2A$, pour ramener ce terme à un multiple de $A$ et regrouper le tout sous la forme $M(\cdot)$.
        steps:
          - math: 'M(x)\times M(y) = (I+xA)(I+yA) = I + yA + xA + xyA^2'
            note: "Développement du produit, I commutant avec tout."
          - math: 'xyA^2 = xy\cdot(-2A) = -2xyA \quad (\text{q1})'
            note: "On remplace A² par −2A."
          - math: 'M(x)\times M(y) = I + (x+y)A - 2xyA = I + (x+y-2xy)A'
            note: "Regroupement des termes en A."
          - math: 'M(x)\times M(y) = M(x+y-2xy)'
            note: "Le résultat a exactement la forme M(·) annoncée."
      - id: q3
        part: "Un élément de $E$ qui n'est pas inversible"
        stem: |-
          **(0,25 pt)** Calculer $M\!\left(\dfrac{1}{2}\right) \times \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 1 \end{pmatrix}$
        reasoning: |-
          Un calcul matriciel direct. $M\!\left(\dfrac12\right) = I+\dfrac12 A$ se calcule d'abord explicitement, coefficient par coefficient, puis on multiplie par la matrice donnée — qui n'a qu'un seul coefficient non nul, en bas à droite. Multiplier par une matrice aussi creuse ne fait ressortir qu'une seule colonne de $M\!\left(\dfrac12\right)$ : la troisième.
        steps:
          - math: 'M\!\left(\dfrac12\right) = I + \dfrac12 A = \begin{pmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{pmatrix} + \dfrac12\begin{pmatrix} -1 & -1 & 0 \\ -1 & -1 & 0 \\ -1 & 1 & -2 \end{pmatrix} = \begin{pmatrix} \frac12 & -\frac12 & 0 \\ -\frac12 & \frac12 & 0 \\ -\frac12 & \frac12 & 0 \end{pmatrix}'
            note: "Calcul explicite de M(1/2), coefficient par coefficient."
          - math: 'M\!\left(\dfrac12\right) \times \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 1 \end{pmatrix}'
            note: "La matrice de droite n'a qu'un coefficient non nul, en position (3,3)."
          - math: '= \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{pmatrix} = O'
            note: "Seule la troisième colonne de M(1/2) intervient — or elle est entièrement nulle : le produit vaut O."
      - id: q4
        stem: |-
          **(0,25 pt)** En déduire que la matrice $M\!\left(\dfrac{1}{2}\right)$ n'est pas inversible dans $(M_3(\mathbb{R}),\times)$.
        reasoning: |-
          Même geste qu'à la Partie I, question 6 du sujet 2023 : si $M\!\left(\dfrac12\right)$ était inversible dans $(M_3(\mathbb{R}),\times)$, on pourrait multiplier les deux membres de l'égalité de la question précédente par son inverse. Notons $N$ la matrice non nulle du membre de droite (celle qui n'a qu'un $1$ en position $(3,3)$) : $M\!\left(\dfrac12\right)\times N = O$ forcerait alors $N=O$ — contradiction, puisque $N$ est manifestement non nulle.
        steps:
          - math: 'N = \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 1 \end{pmatrix} \neq O, \qquad M\!\left(\dfrac12\right)\times N = O \quad (\text{q3})'
            note: "N est non nulle, mais son produit par M(1/2) vaut O."
          - math: '\text{Si } M\!\left(\dfrac12\right) \ \text{était inversible}: \quad M\!\left(\dfrac12\right)^{-1}\times\Big[M\!\left(\dfrac12\right)\times N\Big] = N'
            note: "On multiplierait les deux membres par l'inverse supposé."
          - math: 'M\!\left(\dfrac12\right)^{-1}\times O = O \ \Longrightarrow\ N = O \quad \text{contredit} \quad N\neq O'
            note: "Contradiction : l'inverse ne peut pas exister."
          - math: 'M\!\left(\dfrac12\right) \ \text{ne constitue pas un élément inversible de} \ (M_3(\mathbb{R}),\times)'
            note: "Il existe une matrice non nulle N annulée par multiplication : M(1/2) n'est pas inversible."
      - id: q5
        part: "$E-\\{M(1/2)\\}$ : un groupe commutatif pour $\\times$"
        stem: |-
          **(0,25 pt)** Montrer que : $E - \left\{ M\!\left(\dfrac{1}{2}\right) \right\}$ est stable pour la multiplication dans $M_3(\mathbb{R})$

          *(on pourra utiliser l'identité : $\left(x - \dfrac{1}{2}\right)\left(y - \dfrac{1}{2}\right) = -\dfrac{1}{2}\left(x + y - 2xy - \dfrac{1}{2}\right)$)*
        reasoning: |-
          On réutilise la formule de la question 1-b : $M(x)\times M(y) = M(x+y-2xy)$, valable pour **tous** $x,y\in\mathbb{R}$ — y compris $x=\dfrac12$ ou $y=\dfrac12$. La question est donc : si $x\neq\dfrac12$ et $y\neq\dfrac12$, est-ce que $x+y-2xy$ peut, lui, valoir $\dfrac12$ ? L'identité donnée dans l'énoncé répond directement : elle relie l'écart à $\dfrac12$ du nouveau paramètre à un **produit** de deux écarts non nuls.

          En réarrangeant l'identité fournie, $x+y-2xy-\dfrac12 = -2\left(x-\dfrac12\right)\left(y-\dfrac12\right)$. Si $x\neq\dfrac12$ et $y\neq\dfrac12$, les deux facteurs sont non nuls, donc leur produit l'est aussi (produit de deux réels non nuls) : le membre de gauche est non nul, donc $x+y-2xy\neq\dfrac12$. Le résultat $M(x+y-2xy)$ reste ainsi dans $E-\left\{M\!\left(\dfrac12\right)\right\}$.
        steps:
          - math: '\left(x-\dfrac12\right)\left(y-\dfrac12\right) = -\dfrac12\left(x+y-2xy-\dfrac12\right) \quad (\text{identité fournie})'
            note: "L'identité donnée par l'énoncé, à réarranger."
          - math: 'x+y-2xy-\dfrac12 = -2\left(x-\dfrac12\right)\left(y-\dfrac12\right)'
            note: "On multiplie les deux membres par −2."
          - math: 'x\neq\dfrac12,\ y\neq\dfrac12 \ \Longrightarrow\ \left(x-\dfrac12\right)\left(y-\dfrac12\right)\neq0 \ \Longrightarrow\ x+y-2xy\neq\dfrac12'
            note: "Produit de deux réels non nuls : non nul, donc le nouveau paramètre évite 1/2."
          - math: 'M(x)\times M(y) = M(x+y-2xy) \ \in \ E-\left\{M\!\left(\dfrac12\right)\right\}'
            note: "Le résultat reste dans l'ensemble privé de M(1/2)."
      - id: q6
        stem: |-
          **(1 pt)** Montrer que : $\left( E - \left\{ M\!\left(\dfrac{1}{2}\right) \right\}, \times \right)$ est un groupe commutatif.
        reasoning: |-
          On coche les quatre axiomes du rung R3, sur $E-\left\{M\!\left(\dfrac12\right)\right\}$, en réutilisant ce qui précède. Loi interne : question précédente. Associativité : héritée de $M_3(\mathbb{R})$ tout entier, comme dans tous les exemples de ce chapitre. Commutativité : immédiate sur la formule de la question 1-b, $x+y-2xy$ est symétrique en $x$ et $y$.

          Restent le neutre et le symétrique, à trouver en résolvant sur le paramètre réel $x$ — exactement comme au R2, mais ici l'inconnue est un réel, pas un complexe. Neutre $e$ : $x+e-2xe=x$ pour tout $x$ donne $e(1-2x)=0$ pour tout $x$, donc $e=0$ — soit $M(0)=I$, qui est bien dans l'ensemble car $0\neq\dfrac12$. Symétrique de $x\neq\dfrac12$ : on résout $x+y-2xy=0$ en $y$, ce qui donne $y=\dfrac{x}{2x-1}$ (licite car $x\neq\dfrac12$) — et l'équation $y=\dfrac12$ donnerait $2x=2x-1$, soit $0=-1$, impossible : $y$ n'est jamais égal à $\dfrac12$, quel que soit $x$. Le symétrique reste donc toujours dans l'ensemble.
        steps:
          - math: '\times \ \text{interne} \ (\text{q5}); \qquad \times \ \text{associative} \ (\text{produit matriciel, toujours associatif})'
            note: "Deux axiomes : le premier vient de la question précédente, le second est un fait général."
          - math: 'M(x)\times M(y) = M(x+y-2xy) = M(y+x-2yx) = M(y)\times M(x)'
            note: "Commutativité : x+y−2xy est symétrique en x et y."
          - math: 'e(1-2x)=0 \ \text{pour tout} \ x \ \Longrightarrow\ e=0, \qquad M(0)=I \ \in\ E-\left\{M\!\left(\dfrac12\right)\right\} \quad (0\neq\dfrac12)'
            note: "Le neutre pour × est M(0) = I."
          - math: 'y=\dfrac{x}{2x-1} \ \Longrightarrow\ x+y-2xy=0, \qquad y=\dfrac12 \ \text{donnerait} \ 0=-1 \ (\text{impossible})'
            note: "Le symétrique de M(x) est M(y) avec y = x/(2x−1) ; il n'est jamais égal à M(1/2)."
          - math: '\left(E-\left\{M\!\left(\dfrac12\right)\right\},\times\right) \ \text{est un groupe commutatif}'
            note: "Les quatre axiomes sont vérifiés."
      - id: q7
        part: "La loi $T$ et un isomorphisme depuis $(\\mathbb{R},+)$"
        stem: |-
          On munit $E$ de la loi de composition interne $T$ définie par :

          $$\forall(x,y) \in \mathbb{R}^2\ ;\ M(x)\,T\,M(y) = M\!\left(x + y - \dfrac{1}{2}\right)$$

          et on considère l'application $\varphi$ définie de $\mathbb{R}$ vers $E$ par : $\forall x \in \mathbb{R}$ ; $\varphi(x) = M\!\left(\dfrac{1-x}{2}\right)$.

          **(0,5 pt)** Montrer que $\varphi$ est un homomorphisme de $(\mathbb{R},+)$ vers $(E,T)$ et que $\varphi(\mathbb{R}) = E$.
        reasoning: |-
          Le geste-pont du rung R7 : il faut montrer $\varphi(x+y) = \varphi(x)\,T\,\varphi(y)$ pour tous $x,y$ réels, puis que $\varphi$ atteint tout $E$. On applique la définition de $T$ aux deux images $\varphi(x)=M\!\left(\dfrac{1-x}{2}\right)$ et $\varphi(y)=M\!\left(\dfrac{1-y}{2}\right)$, et on doit retrouver exactement $\varphi(x+y)=M\!\left(\dfrac{1-(x+y)}{2}\right)$.

          Pour $\varphi(\mathbb{R})=E$ : tout élément de $E$ s'écrit $M(z)$ pour un certain réel $z$, et $z=\dfrac{1-x}{2}$ se résout en $x=1-2z$ — donc $M(z)=\varphi(1-2z)$, tout élément de $E$ a un antécédent par $\varphi$.
        steps:
          - math: '\varphi(x)\,T\,\varphi(y) = M\!\left(\dfrac{1-x}{2}\right)\,T\,M\!\left(\dfrac{1-y}{2}\right) = M\!\left(\dfrac{1-x}{2}+\dfrac{1-y}{2}-\dfrac12\right)'
            note: "Application de la définition de T aux deux images."
          - math: '\dfrac{1-x}{2}+\dfrac{1-y}{2}-\dfrac12 = \dfrac{2-x-y}{2}-\dfrac12 = \dfrac{1-x-y}{2} = \dfrac{1-(x+y)}{2}'
            note: "Simplification algébrique de l'argument."
          - math: '\varphi(x)\,T\,\varphi(y) = M\!\left(\dfrac{1-(x+y)}{2}\right) = \varphi(x+y)'
            note: "Le résultat coïncide exactement avec φ(x+y) : φ est un homomorphisme."
          - math: 'M(z)\in E \ \Longrightarrow\ z=\dfrac{1-x}{2} \ \text{pour} \ x=1-2z \ \Longrightarrow\ M(z)=\varphi(1-2z)'
            note: "Tout élément de E a un antécédent explicite par φ."
          - math: '\varphi(\mathbb{R}) = E'
            note: "φ est surjective de R sur E."
      - id: q8
        stem: |-
          **(0,25 pt)** En déduire que $(E,T)$ est un groupe commutatif.
        reasoning: |-
          On mobilise le pont du rung R7 : $(\mathbb{R},+)$ est un groupe commutatif archi-connu, $\varphi$ est un homomorphisme surjectif de $\mathbb{R}$ sur $E$ (question précédente), et $\varphi$ est de plus injective — deux réels distincts $x\neq y$ donnent $\dfrac{1-x}{2}\neq\dfrac{1-y}{2}$, donc $\varphi(x)\neq\varphi(y)$. $\varphi$ est donc un isomorphisme de $(\mathbb{R},+)$ vers $(E,T)$ : toute la structure de groupe commutatif se transporte, sans re-vérifier aucun axiome sur $E$.

          Comme repère concret, le neutre de $(E,T)$ est l'image du neutre $0$ de $(\mathbb{R},+)$ : $\varphi(0)=M\!\left(\dfrac12\right)$ — précisément l'élément qui avait dû être **retiré** pour obtenir un groupe multiplicatif aux questions 3 et 4. Ce n'est pas une coïncidence : c'est le même élément qui joue tour à tour le rôle du neutre pour $T$ et de l'obstacle à l'inversibilité pour $\times$, comme $0$ dans un anneau usuel.
        steps:
          - math: '(\mathbb{R},+) \ \text{groupe commutatif}, \qquad \varphi \ \text{surjective sur} \ E \quad (\text{q7})'
            note: "Deux ingrédients déjà établis."
          - math: 'x\neq y \ \Longrightarrow\ \dfrac{1-x}{2}\neq\dfrac{1-y}{2} \ \Longrightarrow\ \varphi(x)\neq\varphi(y)'
            note: "φ est injective : deux réels distincts donnent deux images distinctes."
          - math: '\varphi \ \text{est un isomorphisme de} \ (\mathbb{R},+) \ \text{vers} \ (E,T)'
            note: "Bijective et morphisme (q7) : φ est un isomorphisme."
          - math: '(E,T) \ \text{est un groupe commutatif}, \qquad \text{neutre} \ \varphi(0) = M\!\left(\dfrac12\right)'
            note: "La structure se transporte ; le neutre de T est exactement M(1/2)."
      - id: q9
        part: "$(E,T,\\times)$ est un corps commutatif"
        stem: |-
          **(0,5 pt)** Montrer que $(E,T,\times)$ est un corps commutatif.
        reasoning: |-
          On pourrait recocher un à un tous les axiomes du corps (rung R6) directement sur $E$, mais un raccourci, dans l'esprit du rung R7, va beaucoup plus vite : on sait déjà que $\varphi(x)\,T\,\varphi(y) = \varphi(x+y)$ (question 5-a) — $\varphi$ transporte $+$ en $T$. Reste à vérifier si $\varphi$ transporte **aussi** $\times$ sur $\mathbb{R}$ en $\times$ sur $E$ : c'est un fait nouveau, pas donné par l'énoncé sous forme de sous-question, mais qui se calcule directement avec la formule de la question 1-b.

          Si les deux vérifications tiennent, $\varphi$ transporte **d'un coup** toute la structure de corps de $(\mathbb{R},+,\times)$ — un corps archi-connu, comme $\mathbb{Q}$ au rung R6 — vers $(E,T,\times)$ : commutativité des deux lois, distributivité, neutres, et inversibilité de tout élément non nul pour $\times$ compris. Ce dernier point recoupe exactement le résultat déjà établi aux questions 3 et 4 : le seul élément sans symétrique pour $\times$, $M\!\left(\dfrac12\right)$, est précisément le neutre de $T$ (question 5-b) — jamais concerné par l'exigence du R6, qui ne porte que sur les éléments non nuls.
        steps:
