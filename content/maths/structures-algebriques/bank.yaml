    intro: |-
      **Structures algébriques (examen national Sciences Mathématiques, session normale 2017).**

      On rappelle que $(M_3(\mathbb{R}),+,\times)$ est un anneau unitaire de zéro la matrice nulle $O = \begin{pmatrix}0&0&0\\0&0&0\\0&0&0\end{pmatrix}$ et d'unité la matrice $I = \begin{pmatrix}1&0&0\\0&1&0\\0&0&1\end{pmatrix}$, et que $(\mathbb{C},+,\times)$ est un corps commutatif.

      On pose $A = \begin{pmatrix}1&0&0\\1&1&0\\1&1&1\end{pmatrix}$ et, pour tout $(a,b)$ de $\mathbb{R}^2$, $M(a,b) = \begin{pmatrix}a&b&-b\\0&0&0\\b&-a&a\end{pmatrix}$. On considère $E = \{M(a,b)\ /\ (a,b) \in \mathbb{R}^2\}$.

      L'exercice construit une loi $T$ sur $M_3(\mathbb{R})$ via la matrice pivot $A$ ($M_1\,T\,M_2 = M_1\times A\times M_2$), montre qu'elle imite exactement le produit complexe sur $E$, puis transporte, via un homomorphisme (chapitre 10) depuis $(\mathbb{C}^*,\times)$, toute la structure de corps commutatif de $\mathbb{C}$ vers $(E,+,T)$.
    questions:
      - id: q1
        part: "L'ensemble $E$ : sous-groupe additif, puis stabilité de la loi $T$"
        stem: |-
          **(0,5 pt)** Montrer que $E$ est un sous-groupe du groupe $(M_3(\mathbb{R}),+)$
        reasoning: |-
          Montrer que $E$ est un sous-groupe de $(M_3(\mathbb{R}),+)$, c'est montrer que $(E,+)$ est **lui-même** un groupe — même démarche qu'au chapitre 4, restreinte à $E$ : on recoche les quatre axiomes un par un.

          La stabilité se lit directement sur les coefficients : $M(a,b)+M(c,d)$ garde exactement la forme $M(\cdot,\cdot)$. L'associativité et la commutativité de $+$ sont héritées de $M_3(\mathbb{R})$ tout entier. Le neutre $O = M(0,0)$ appartient à $E$, et l'opposé $-M(a,b)$ vaut $M(-a,-b)$ — encore de la forme $M(\cdot,\cdot)$, donc dans $E$. Les quatre axiomes tiennent : $E$ est un sous-groupe de $(M_3(\mathbb{R}),+)$.
        steps:
          - math: 'M(a,b)+M(c,d) = \begin{pmatrix}a&b&-b\\0&0&0\\b&-a&a\end{pmatrix} + \begin{pmatrix}c&d&-d\\0&0&0\\d&-c&c\end{pmatrix} = \begin{pmatrix}a+c&b+d&-(b+d)\\0&0&0\\b+d&-(a+c)&a+c\end{pmatrix} = M(a+c,\ b+d)'
            note: "Addition coefficient par coefficient : le résultat garde la forme M(.,.), E est stable pour +."
          - math: '+ \ \text{associative et commutative sur}\ M_3(\mathbb{R})\ (\text{fait général}) \implies \text{heritee sur}\ E'
            note: "Deux axiomes herites de M3(R) tout entier."
          - math: 'O = \begin{pmatrix}0&0&0\\0&0&0\\0&0&0\end{pmatrix} = M(0,0) \in E, \qquad -M(a,b) = M(-a,\ -b) \in E'
            note: "Le neutre O et l'oppose de chaque élément restent de la forme M(.,.), donc dans E."
          - math: 'E\ \text{est un sous-groupe de}\ (M_3(\mathbb{R}),+)'
            note: "Les quatre axiomes sont vérifiés dans E."
      - id: q2
        stem: |-
          On définit dans $M_3(\mathbb{R})$ la loi de composition interne $T$ par : $\forall(a,b,c,d)\in\mathbb{R}^4$ ; $M(a,b)\,T\,M(c,d) = M(a,b)\times A\times M(c,d)$. **(0,5 pt)** Vérifier que $E$ est stable dans $(M_3(\mathbb{R}),T)$
        reasoning: |-
          La stabilité se vérifie par un calcul matriciel direct, en deux temps : d'abord $M(a,b)\times A$, puis ce résultat multiplié par $M(c,d)$. Le pivot $A$ n'est pas choisi au hasard — il est construit précisément pour que ce produit retombe, au bout du calcul, exactement sur la forme $M(\cdot,\cdot)$, et avec les coefficients du produit complexe $(a+ib)(c+id) = (ac-bd) + i(ad+bc)$ : ce n'est pas une coïncidence, c'est tout le sens de l'exercice, qui se révèle à la question 3.
        steps:
          - math: 'M(a,b)\times A = \begin{pmatrix}a&b&-b\\0&0&0\\b&-a&a\end{pmatrix}\begin{pmatrix}1&0&0\\1&1&0\\1&1&1\end{pmatrix} = \begin{pmatrix}a&0&-b\\0&0&0\\b&0&a\end{pmatrix}'
            note: "Premier produit matriciel, ligne par colonne."
          - math: '\big(M(a,b)\times A\big)\times M(c,d) = \begin{pmatrix}a&0&-b\\0&0&0\\b&0&a\end{pmatrix}\begin{pmatrix}c&d&-d\\0&0&0\\d&-c&c\end{pmatrix} = \begin{pmatrix}ac-bd&ad+bc&-(ad+bc)\\0&0&0\\ad+bc&-(ac-bd)&ac-bd\end{pmatrix}'
            note: "Second produit ; le résultat prend exactement la forme M(.,.)."
          - math: 'M(a,b)\,T\,M(c,d) = M(ac-bd,\ ad+bc) \in E'
            note: "Les coefficients sont ceux du produit complexe (a+ib)(c+id) : E est stable pour T."
      - id: q3
        part: "Un homomorphisme $\\varphi$ depuis $(\\mathbb{C}^*,\\times)$"
        stem: |-
          Soit $\varphi$ l'application de $\mathbb{C}^*$ dans $E$ qui à tout nombre complexe non nul $a+ib$ (où $(a,b)\in\mathbb{R}^2$) fait correspondre la matrice $M(a,b)$ de $E$. **(0,75 pt)** Vérifier que $\varphi$ est un homomorphisme de $(\mathbb{C}^*,\times)$ vers $(E,T)$ et que $\varphi(\mathbb{C}^*) = E^*$ où $E^* = E\setminus\{M(0,0)\}$
        reasoning: |-
          Le geste-pont du chapitre 10 : deux choses à établir. D'abord, que $\varphi$ transforme $\times$ en $T$ — c'est immédiat maintenant, la question 2 vient exactement de le calculer : pour $z_1=a+ib$ et $z_2=c+id$, $z_1z_2=(ac-bd)+i(ad+bc)$, donc $\varphi(z_1z_2)=M(ac-bd,ad+bc)$, qui est très exactement le résultat trouvé pour $\varphi(z_1)\,T\,\varphi(z_2)=M(a,b)\,T\,M(c,d)$ à la question 2. C'est le pivot $A$ qui fait coïncider les deux calculs.

          Ensuite, $\varphi(\mathbb{C}^*)=E^*$. L'application $(a,b)\mapsto M(a,b)$ est injective — les coefficients de $M(a,b)$ redonnent $a$ et $b$ directement — donc $\varphi$ l'est aussi sur $\mathbb{C}^*$. Un complexe $a+ib$ est non nul exactement quand $(a,b)\neq(0,0)$, c'est-à-dire quand $M(a,b)\neq M(0,0)$ : l'image de $\varphi$ tombe donc exactement dans $E\setminus\{M(0,0)\}=E^*$, et réciproquement tout $M(a,b)\in E^*$ a pour antécédent le complexe non nul $a+ib$.
        steps:
          - math: 'z_1=a+ib,\ z_2=c+id \implies z_1z_2 = (ac-bd)+i(ad+bc)'
            note: "Produit complexe usuel."
          - math: '\varphi(z_1z_2) = M(ac-bd,\ ad+bc) = M(a,b)\,T\,M(c,d) = \varphi(z_1)\,T\,\varphi(z_2)'
            note: "Exactement le résultat de la question 2 : phi est un homomorphisme de (C*,x) vers (E,T)."
          - math: '(a,b)\mapsto M(a,b)\ \text{injective} \implies \varphi\ \text{injective sur}\ \mathbb{C}^*'
            note: "Les coefficients de M(a,b) redonnent a et b : deux complexes distincts ont des images distinctes."
          - math: 'a+ib\neq0 \iff (a,b)\neq(0,0) \iff M(a,b)\neq M(0,0) \implies \varphi(\mathbb{C}^*) = E\setminus\{M(0,0)\} = E^*'
            note: "L'image de phi tombe exactement dans E prive de M(0,0), et tout élément de E* a un antecedent."
      - id: q4
        stem: |-
          **(0,75 pt)** En déduire que $(E^*,T)$ est un groupe commutatif dont on déterminera l'élément neutre $J$
        reasoning: |-
          $(\mathbb{C}^*,\times)$ est un groupe commutatif (rappel de tête d'énoncé). La question précédente donne un homomorphisme $\varphi$, bijectif de $\mathbb{C}^*$ vers $E^*$ (injectif et d'image exactement $E^*$) : c'est un isomorphisme. Toute la structure se transporte (chapitre 10) : $(E^*,T)$ est un groupe, commutatif car $\times$ l'est ($\varphi(z_1)\,T\,\varphi(z_2)=\varphi(z_1z_2)=\varphi(z_2z_1)=\varphi(z_2)\,T\,\varphi(z_1)$, et $\varphi$ atteint tout $E^*$).

          L'élément neutre $J$ de $(E^*,T)$ est l'image du neutre $1$ de $(\mathbb{C}^*,\times)$ : $J=\varphi(1)=\varphi(1+i\cdot0)=M(1,0)$.
        steps:
          - math: '(\mathbb{C}^*,\times)\ \text{groupe commutatif (rappel)}, \qquad \varphi\ \text{isomorphisme de}\ (\mathbb{C}^*,\times)\ \text{vers}\ (E^*,T)\ (\text{q3})'
            note: "Les deux ingredients du transport de structure."
          - math: '\varphi(z_1)\,T\,\varphi(z_2) = \varphi(z_1z_2) = \varphi(z_2z_1) = \varphi(z_2)\,T\,\varphi(z_1)'
            note: "Commutativité de T sur E*, heritee de la commutativité du produit complexe."
          - math: '(E^*,T)\ \text{est un groupe commutatif}, \qquad J = \varphi(1) = M(1,0)'
            note: "Le neutre J est l'image du neutre 1 de C* par phi."
      - id: q5
        part: "Distributivité de $T$, et $(E,+,T)$ corps commutatif"
        stem: |-
          **(0,5 pt)** Montrer que la loi de composition interne « $T$ » est distributive par rapport à la loi de composition interne « $+$ » dans $E$
        reasoning: |-
          On réutilise la formule générale de la question 2 — valable pour tous réels $a,b,c,d$, pas seulement pour des complexes non nuls : $M(a,b)\,T\,M(c,d)=M(ac-bd,\ ad+bc)$. On développe les deux membres de l'égalité à établir, $M(a,b)\,T\big(M(c,d)+M(e,f)\big)$ et $\big(M(a,b)\,T\,M(c,d)\big)+\big(M(a,b)\,T\,M(e,f)\big)$, et on compare terme à terme : chacun se ramène à la distributivité de $\times$ sur $+$ dans $\mathbb{R}$, déjà acquise.
        steps:
          - math: 'M(c,d)+M(e,f) = M(c+e,\ d+f)'
            note: "Stabilité de + dans E (question 1)."
          - math: 'M(a,b)\,T\big(M(c,d)+M(e,f)\big) = M(a,b)\,T\,M(c+e,\ d+f) = M\big(a(c+e)-b(d+f),\ \ a(d+f)+b(c+e)\big)'
            note: "Formule générale de T (question 2), appliquee au couple (c+e, d+f)."
          - math: '\big(M(a,b)\,T\,M(c,d)\big) + \big(M(a,b)\,T\,M(e,f)\big) = M(ac-bd,\ ad+bc) + M(ae-bf,\ af+be) = M\big((ac-bd)+(ae-bf),\ \ (ad+bc)+(af+be)\big)'
            note: "Même formule appliquee séparément a (c,d) et (e,f), puis somme dans E (question 1)."
          - math: 'a(c+e)-b(d+f) = (ac-bd)+(ae-bf), \qquad a(d+f)+b(c+e) = (ad+bc)+(af+be)'
            note: "Les deux membres coïncident, coefficient par coefficient : simple distributivite de x sur + dans R."
          - math: 'M(a,b)\,T\big(M(c,d)+M(e,f)\big) = \big(M(a,b)\,T\,M(c,d)\big) + \big(M(a,b)\,T\,M(e,f)\big)'
            note: "T est distributive par rapport a + dans E (et, T étant commutative, la distributivite de l'autre cote suit automatiquement)."
      - id: q6
        stem: |-
          **(0,5 pt)** En déduire que $(E,+,T)$ est un corps commutatif.
        reasoning: |-
          Il ne reste qu'à assembler ce qui précède, exactement les conditions du chapitre 9. $(E,+)$ est un groupe commutatif (question 1, commutativité héritée de $M_3(\mathbb{R})$). $T$ est interne (question 2), associative — un fait général : $T$ n'est jamais qu'un produit matriciel ordinaire encadré par le pivot fixe $A$, donc $\big(M_1\,T\,M_2\big)\,T\,M_3 = M_1\times A\times M_2\times A\times M_3 = M_1\,T\big(M_2\,T\,M_3\big)$, sans autre argument que l'associativité du produit matriciel, déjà acquise —, commutative (formule générale de la question 2, symétrique en $(a,b)\leftrightarrow(c,d)$) et distributive par rapport à $+$ (question précédente) : c'est un anneau commutatif, unitaire d'élément unité $J=M(1,0)$ (question 4).

          Reste l'exigence propre au corps : tout élément non nul de $E$ doit posséder un symétrique pour $T$. C'est exactement le contenu de la question 4 : $(E^*,T)$, c'est-à-dire $(E\setminus\{M(0,0)\},T)$, est un groupe — donc chaque élément non nul de $E$ a un symétrique pour $T$, qui reste dans $E$. Toutes les conditions du chapitre 9 sont réunies : $(E,+,T)$ est un corps commutatif.
        steps:
          - math: '(E,+)\ \text{groupe commutatif}\ (\text{q1}), \qquad T\ \text{interne}\ (\text{q2})'
            note: "Deux premiers ingredients."
          - math: '\big(M_1\,T\,M_2\big)\,T\,M_3 = M_1\times A\times M_2\times A\times M_3 = M_1\,T\big(M_2\,T\,M_3\big)'
            note: "Associativite de T : simple conséquence de l'associativite du produit matriciel ordinaire (fait général)."
          - math: 'M(a,b)\,T\,M(c,d) = M(ac-bd,ad+bc) = M(ca-db,cb+da) = M(c,d)\,T\,M(a,b)'
            note: "Commutativité de T sur tout E, directement sur la formule générale (question 2)."
          - math: 'T\ \text{distributive par rapport a}\ +\ (\text{q5}), \qquad J=M(1,0)\ \text{unité}\ (\text{q4})'
            note: "Anneau commutatif et unitaire."
          - math: '(E^*,T) = (E\setminus\{M(0,0)\},T)\ \text{groupe}\ (\text{q4}) \implies \text{tout élément non nul de}\ E\ \text{a un symétrique pour}\ T'
            note: "Exigence propre au corps (chapitre 9), déjà etablie."
          - math: '(E,+,T)\ \text{est un corps commutatif}'
            note: "Toutes les conditions du chapitre 9 sont reunies."
