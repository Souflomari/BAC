          - math: '\varphi(x)\times\varphi(y) = M\!\left(\dfrac{1-xy}{2}\right) = \varphi(xy)'
            note: "φ transporte aussi × sur R en × sur E : φ(xy) = φ(x)×φ(y)."
          - math: '\varphi \ \text{isomorphisme pour} \ + \ \text{et pour} \ \times \ \Longrightarrow\ (E,T,\times) \ \text{hérite de toute la structure de} \ (\mathbb{R},+,\times)'
            note: "Les deux lois se transportent à la fois : corps, commutatif, distributif."
          - math: '(E,T,\times) \ \text{est un corps commutatif}'
            note: "Seul M(1/2) = φ(0), le neutre de T, n'a pas de symétrique pour × — cohérent, puisque l'exigence du R6 ne porte que sur les éléments non nuls."
