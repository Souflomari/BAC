            note: "Produit des images, via la formule × de la question 1-b."
          - math: '\dfrac{1-x}{2}+\dfrac{1-y}{2}-\dfrac{(1-x)(1-y)}{2} = 1-\dfrac{x+y}{2} - \dfrac{(1-x)(1-y)}{2} = \dfrac{1-xy}{2}'
            note: "Simplification algébrique (développement de (1−x)(1−y) puis regroupement)."
          - math: '\varphi(x)\times\varphi(y) = M\!\left(\dfrac{1-xy}{2}\right) = \varphi(xy)'
            note: "φ transporte aussi × sur R en × sur E : φ(xy) = φ(x)×φ(y)."
          - math: '\varphi \ \text{isomorphisme pour} \ + \ \text{et pour} \ \times \ \Longrightarrow\ (E,T,\times) \ \text{hérite de toute la structure de} \ (\mathbb{R},+,\times)'
