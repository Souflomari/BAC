# permet de transporter d'un coup toute la structure de corps de (ℝ,+,×)
# (un corps archi-connu, au même titre que (ℚ,+,×) au R6) vers (E,T,×). La
# généralisation (« un isomorphisme qui respecte deux lois à la fois
# transporte une structure d'anneau/de corps entière ») n'est nulle part
# énoncée comme telle dans lesson.md — c'est un prolongement naturel, mais
# un prolongement, du geste du R7. Signalé ici pour le pédagogy-architect ;
