<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 388" role="img"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Trois parties du plan, chacune passée au critère du sous-espace, condition par condition. À gauche, la droite d’équation y égale 2x : l’origine est dessus, la somme de deux de ses points u et v y reste, et le multiple moins 2u aussi ; les trois conditions tiennent. Au milieu, la même droite décalée, d’équation y égale 2x plus 1 : l’origine n’y est pas, le critère tombe à la première condition. À droite, la réunion des deux axes, d’équation xy égale 0 : l’origine y est, les multiples restent sur leur axe, mais la somme de (1, 0) et de (0, 1) est le point (1, 1), hors des deux axes ; c’est la stabilité pour l’addition qui tombe.">
  <title>Le critère du sous-espace, condition par condition : laquelle tombe ?</title>
  <!--
    sous-espaces-plan.svg — chapitre 11 (R8) de structures-algebriques, placé
    APRÈS cp-r8-pari-stabilite, à la réponse sur X = {xy = 0} (spec
    docs/pipeline/propositions/maths-structures-espaces-vectoriels.md §9 :
    l'étape 3 est littéralement (1,0) + (0,1) qui sort des axes — la poser
    avant le pari en donnerait la clé). type: structural-diagram ·
    tool: svg+katex (coded, never generated : ADR 0017).

    Les légendes ne récapitulent pas trois objets : elles montrent LES TROIS
    CONDITIONS du critère, et laquelle tombe (correctif I11 de la spec).

    Positions CALCULÉES depuis les équations, pas dessinées à l'œil :
      panneaux 1 et 2 — origine écran (px+105, 175), 30 px par unité ;
        D : y = 2x, de x = -1,5 à x = 1,85 ; points u = (0,5 ; 1),
        v = (1 ; 2), u + v = (1,5 ; 3), -2u = (-1 ; -2) — tous sur D ;
        D' : y = 2x + 1, de x = -2 à x = 1,35, intercept (0 ; 1) ; la droite
        D en pointillé, pour lire le décalage (0,5 unité, soit 15 px).
      panneau 3 — origine écran (px+70, 225), 70 px par unité ; X = les deux
        axes (trait épais) ; (1,0), (0,1) et leur somme (1,1).
    Accent : UNE idée, répétée — le témoin qui fait tomber le critère
    (l'origine absente de D' ; le point (1,1) hors des axes). Le panneau 1
    n'a pas d'accent : rien n'y tombe.

    step-1 : la droite D, trois conditions ✓.
    step-2 : la droite décalée D', la première condition ✗, on s'arrête.
    step-3 : la réunion des axes X, conditions 1 et 3 ✓, condition 2 ✗.
    Couleurs : uniquement les jetons figure-surface, ink, ink-soft, grid et accent.
  -->
  <rect x="0" y="0" width="780" height="388" fill="var(--figure-surface)"/>
  <text x="390" y="28" font-size="15" text-anchor="middle" fill="var(--figure-ink)" font-weight="600">Le critère, condition par condition : laquelle tombe ?</text>
  <!-- ══ step-1 — la droite D : y = 2x, trois conditions ✓ ══ -->
  <g id="step-1">
    <rect x="10" y="42" width="250" height="336" rx="10" fill="none" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="32" y1="175" x2="238" y2="175" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <polygon points="238,175 230,178.6 230,171.4" fill="var(--figure-ink-soft)"/>
    <line x1="115" y1="266" x2="115" y2="64" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <polygon points="115,64 118.6,72 111.4,72" fill="var(--figure-ink-soft)"/>
    <text x="232" y="191" font-size="12" fill="var(--figure-ink-soft)"><tspan font-style="italic">x</tspan></text>
    <text x="123" y="72" font-size="12" fill="var(--figure-ink-soft)"><tspan font-style="italic">y</tspan></text>
    <line x1="70" y1="265" x2="170.5" y2="64" stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="176.5" y="76" font-size="14" fill="var(--figure-ink)"><tspan font-style="italic">D</tspan></text>
    <circle cx="115" cy="175" r="3.6" fill="var(--figure-ink)"/>
    <circle cx="130" cy="145" r="3.6" fill="var(--figure-ink)"/>
    <text x="139" y="149" font-size="12.5" fill="var(--figure-ink)"><tspan font-style="italic">u</tspan></text>
    <circle cx="145" cy="115" r="3.6" fill="var(--figure-ink)"/>
    <text x="154" y="119" font-size="12.5" fill="var(--figure-ink)"><tspan font-style="italic">v</tspan></text>
    <circle cx="160" cy="85" r="3.6" fill="var(--figure-ink)"/>
    <text x="169" y="89" font-size="12.5" fill="var(--figure-ink)"><tspan font-style="italic">u</tspan> + <tspan font-style="italic">v</tspan></text>
    <circle cx="85" cy="235" r="3.6" fill="var(--figure-ink)"/>
    <text x="94" y="240" font-size="12.5" fill="var(--figure-ink)">−2<tspan font-style="italic">u</tspan></text>
    <text x="107" y="190" font-size="12" text-anchor="end" fill="var(--figure-ink)"><tspan font-style="italic">O</tspan></text>
    <text x="26" y="300" font-size="13.5" fill="var(--figure-ink)" font-weight="600"><tspan font-style="italic">D</tspan> : <tspan font-style="italic">y</tspan> = 2<tspan font-style="italic">x</tspan></text>
    <text x="26" y="320" font-size="12.5" fill="var(--figure-ink-soft)">1.  <tspan font-style="italic">O</tspan> ∈ <tspan font-style="italic">D</tspan>   ✓</text>
    <text x="26" y="340" font-size="12.5" fill="var(--figure-ink-soft)">2.  <tspan font-style="italic">u</tspan> + <tspan font-style="italic">v</tspan> ∈ <tspan font-style="italic">D</tspan>   ✓</text>
    <text x="26" y="360" font-size="12.5" fill="var(--figure-ink-soft)">3.  −2<tspan font-style="italic">u</tspan> ∈ <tspan font-style="italic">D</tspan>   ✓</text>
  </g>
  <!-- ══ step-2 — la droite décalée D′ : y = 2x + 1, condition 1 ✗ ══ -->
  <g id="step-2">
    <rect x="265" y="42" width="250" height="336" rx="10" fill="none" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="287" y1="175" x2="493" y2="175" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <polygon points="493,175 485,178.6 485,171.4" fill="var(--figure-ink-soft)"/>
    <line x1="370" y1="266" x2="370" y2="64" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <polygon points="370,64 373.6,72 366.4,72" fill="var(--figure-ink-soft)"/>
    <text x="487" y="191" font-size="12" fill="var(--figure-ink-soft)"><tspan font-style="italic">x</tspan></text>
    <text x="378" y="72" font-size="12" fill="var(--figure-ink-soft)"><tspan font-style="italic">y</tspan></text>
    <line x1="325" y1="265" x2="425.5" y2="64" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="310" y1="265" x2="410.5" y2="64" stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="292.5" y="244" font-size="14" fill="var(--figure-ink)"><tspan font-style="italic">D</tspan>′</text>
    <text x="345.5" y="244" font-size="11.5" fill="var(--figure-ink-soft)"><tspan font-style="italic">D</tspan></text>
    <circle cx="370" cy="145" r="3.6" fill="var(--figure-ink)"/>
    <text x="379" y="149" font-size="12" fill="var(--figure-ink)">(0, 1)</text>
    <circle cx="370" cy="175" r="7" fill="none" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <text x="381" y="192" font-size="12" fill="var(--figure-accent)"><tspan font-style="italic">O</tspan></text>
    <text x="281" y="300" font-size="13.5" fill="var(--figure-ink)" font-weight="600"><tspan font-style="italic">D</tspan>′ : <tspan font-style="italic">y</tspan> = 2<tspan font-style="italic">x</tspan> + 1</text>
    <text x="281" y="320" font-size="12.5" fill="var(--figure-accent)" font-weight="600">1.  <tspan font-style="italic">O</tspan> ∉ <tspan font-style="italic">D</tspan>′   ✗</text>
    <text x="281" y="340" font-size="12" fill="var(--figure-ink-soft)" font-style="italic">on s’arrête là : la première</text>
    <text x="281" y="360" font-size="12" fill="var(--figure-ink-soft)" font-style="italic">condition suffit à conclure</text>
  </g>
  <!-- ══ step-3 — la réunion des axes X : xy = 0, condition 2 ✗ ══ -->
  <g id="step-3">
    <rect x="520" y="42" width="250" height="336" rx="10" fill="none" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="544" y1="225" x2="742" y2="225" stroke="var(--figure-ink)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="752,225 743,229.2 743,220.8" fill="var(--figure-ink)"/>
    <line x1="590" y1="262" x2="590" y2="70" stroke="var(--figure-ink)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="590,60 594.2,69 585.8,69" fill="var(--figure-ink)"/>
    <text x="744" y="243" font-size="12" fill="var(--figure-ink-soft)"><tspan font-style="italic">x</tspan></text>
    <text x="599" y="68" font-size="12" fill="var(--figure-ink-soft)"><tspan font-style="italic">y</tspan></text>
    <text x="582" y="241" font-size="12" text-anchor="end" fill="var(--figure-ink)"><tspan font-style="italic">O</tspan></text>
    <line x1="660" y1="225" x2="660" y2="155" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="4 4"/>
    <line x1="590" y1="155" x2="660" y2="155" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="4 4"/>
    <circle cx="660" cy="225" r="4.2" fill="var(--figure-ink)"/>
    <text x="660" y="244" font-size="12.5" text-anchor="middle" fill="var(--figure-ink)">(1, 0)</text>
    <circle cx="590" cy="155" r="4.2" fill="var(--figure-ink)"/>
    <text x="580" y="159" font-size="12.5" text-anchor="end" fill="var(--figure-ink)">(0, 1)</text>
    <line x1="590" y1="225" x2="649.4" y2="165.6" stroke="var(--figure-accent)" stroke-width="2.4"/>
    <polygon points="654.3,160.7 650.5,171 644,164.5" fill="var(--figure-accent)"/>
    <circle cx="660" cy="155" r="6" fill="none" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <text x="670" y="147" font-size="12.5" fill="var(--figure-accent)" font-weight="600">(1, 1)</text>
    <text x="632" y="100" font-size="14" fill="var(--figure-ink)" font-weight="600"><tspan font-style="italic">X</tspan><tspan font-size="11.5" fill="var(--figure-ink-soft)" font-weight="400"> : les deux axes</tspan></text>
    <text x="536" y="300" font-size="13.5" fill="var(--figure-ink)" font-weight="600"><tspan font-style="italic">X</tspan> : <tspan font-style="italic">xy</tspan> = 0</text>
    <text x="536" y="320" font-size="12.5" fill="var(--figure-ink-soft)">1.  <tspan font-style="italic">O</tspan> ∈ <tspan font-style="italic">X</tspan>   ✓</text>
    <text x="536" y="340" font-size="12.5" fill="var(--figure-accent)" font-weight="600">2.  (1, 0) + (0, 1) ∉ <tspan font-style="italic">X</tspan>   ✗</text>
    <text x="536" y="360" font-size="12.5" fill="var(--figure-ink-soft)">3.  λ(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>) ∈ <tspan font-style="italic">X</tspan>   ✓</text>
  </g>
</svg>
