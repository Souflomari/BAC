<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Table de la loi + sur Z/4Z = {0,1,2,3} : grille 5x5 avec la ligne et la colonne du neutre 0 teintées en accent (elles recopient exactement l’en-tête), et la case où la ligne 1 croise la colonne 3 encadrée en accent (valeur 0) pour montrer que 3 est le symétrique de 1.">
  <title>Table de (Z/4Z, +) — neutre et symétrique</title>

  <!--
    table-groupe.svg — table de Cayley de (Z/4Z, +), l'exemple travaillé
    tout au long du chapitre (R1–R3). Reprend exactement les valeurs de
    la table du R1 (lesson.md lignes 52–57).

    But pédagogique (pas une redite de la table markdown déjà présente
    dans le texte) : rendre VISIBLE, par la couleur, les deux mécanismes
    de lecture décrits en prose au R2 —
      (1) le neutre : sa ligne ET sa colonne recopient l'en-tête ;
      (2) le symétrique de x : dans la ligne de x, la colonne où
          apparaît le neutre.
    Une table markdown ne peut pas porter cette teinte ; c'est la seule
    raison d'être de cette figure (sinon, doublon pur du texte).

    STAGÉE (LESSON-EXPERIENCE-SPEC §2.5) — le geste d'enseignement
    reproduit exactement l'ordre du R2 : la table nue d'abord (déjà
    connue du R1), puis le mécanisme du neutre, puis celui du
    symétrique. Voir media/table-groupe.stages.json (3 étapes).
      step-1 : la table complète, sans surlignage (structure).
      step-2 : mécanisme du neutre — ligne/colonne du 0 teintées,
               annotation « e = 0 ».
      step-3 : mécanisme du symétrique — case (1,3)=0 encadrée,
               annotation « 3 : symétrique de 1 ».

    Layout (grille 5×5, cellules 70×70, origine x=140,y=70) :
      colonne 0 = en-tête de ligne ; ligne 0 = en-tête de colonne ;
      cellules (r,c) pour r,c=1..4 : valeur = ((r-1)+(c-1)) mod 4.

    Convention de couleur (5 tokens seulement) :
      cellules d'en-tête (ligne 0, colonne 0)      : --figure-ink-soft, teinte faible
      ligne et colonne du neutre 0 (corps)         : --figure-accent, teinte faible
      les deux cellules d'en-tête "0" (le neutre lui-même) : --figure-accent, teinte forte + texte accent
      case (1,3)=0, l'exemple de symétrique annoté : --figure-accent, teinte + contour
      grille / cadre                                : --figure-grid / --figure-ink-soft
      texte des valeurs                              : --figure-ink
  -->

  <!-- Fond du panneau -->
  <rect x="20" y="10" width="640" height="536" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Titre -->
  <text x="340" y="34" text-anchor="middle" font-size="15" font-weight="600"
        letter-spacing="0.01em" fill="var(--figure-ink)">Table de (ℤ/4ℤ, +) : lire le neutre et le symétrique</text>

  <g id="step-1">
    <!-- ══════════════ Teintes d'en-tête (ligne 0 et colonne 0 du tableau) ══════════════ -->
    <rect x="140" y="70"  width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="210" y="70"  width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="280" y="70"  width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="350" y="70"  width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="420" y="70"  width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="140" y="140" width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="140" y="210" width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="140" y="280" width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>
    <rect x="140" y="350" width="70" height="70" fill="var(--figure-ink-soft)" fill-opacity="0.09"/>

    <!-- ══════════════ Cadre et grille ══════════════ -->
    <rect x="140" y="70" width="350" height="350" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.8"/>
    <line x1="280" y1="70" x2="280" y2="420" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="350" y1="70" x2="350" y2="420" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="420" y1="70" x2="420" y2="420" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="210" y1="70" x2="210" y2="420" stroke="var(--figure-ink-soft)" stroke-width="1.8"/>
    <line x1="140" y1="210" x2="490" y2="210" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="140" y1="280" x2="490" y2="280" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="140" y1="350" x2="490" y2="350" stroke="var(--figure-grid)" stroke-width="1"/>
    <line x1="140" y1="140" x2="490" y2="140" stroke="var(--figure-ink-soft)" stroke-width="1.8"/>

    <!-- ══════════════ Valeurs des cellules ══════════════ -->
    <!-- ligne d'en-tête (r0) -->
    <text x="175" y="111" text-anchor="middle" font-size="16" font-weight="600" fill="var(--figure-ink-soft)">+</text>
    <text x="245" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="var(--figure-accent)">0</text>
    <text x="315" y="112" text-anchor="middle" font-size="20" font-weight="600" fill="var(--figure-ink)">1</text>
    <text x="385" y="112" text-anchor="middle" font-size="20" font-weight="600" fill="var(--figure-ink)">2</text>
    <text x="455" y="112" text-anchor="middle" font-size="20" font-weight="600" fill="var(--figure-ink)">3</text>

    <!-- ligne x=0 (r1) -->
    <text x="175" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="var(--figure-accent)">0</text>
    <text x="245" y="182" text-anchor="middle" font-size="20" fill="var(--figure-ink)">0</text>
    <text x="315" y="182" text-anchor="middle" font-size="20" fill="var(--figure-ink)">1</text>
    <text x="385" y="182" text-anchor="middle" font-size="20" fill="var(--figure-ink)">2</text>
    <text x="455" y="182" text-anchor="middle" font-size="20" fill="var(--figure-ink)">3</text>

    <!-- ligne x=1 (r2) -->
    <text x="175" y="252" text-anchor="middle" font-size="20" font-weight="600" fill="var(--figure-ink)">1</text>
    <text x="245" y="252" text-anchor="middle" font-size="20" fill="var(--figure-ink)">1</text>
    <text x="315" y="252" text-anchor="middle" font-size="20" fill="var(--figure-ink)">2</text>
    <text x="385" y="252" text-anchor="middle" font-size="20" fill="var(--figure-ink)">3</text>
    <text x="455" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="var(--figure-accent)">0</text>

    <!-- ligne x=2 (r3) -->
    <text x="175" y="322" text-anchor="middle" font-size="20" font-weight="600" fill="var(--figure-ink)">2</text>
    <text x="245" y="322" text-anchor="middle" font-size="20" fill="var(--figure-ink)">2</text>
    <text x="315" y="322" text-anchor="middle" font-size="20" fill="var(--figure-ink)">3</text>
    <text x="385" y="322" text-anchor="middle" font-size="20" fill="var(--figure-ink)">0</text>
    <text x="455" y="322" text-anchor="middle" font-size="20" fill="var(--figure-ink)">1</text>

    <!-- ligne x=3 (r4) -->
    <text x="175" y="392" text-anchor="middle" font-size="20" font-weight="600" fill="var(--figure-ink)">3</text>
    <text x="245" y="392" text-anchor="middle" font-size="20" fill="var(--figure-ink)">3</text>
    <text x="315" y="392" text-anchor="middle" font-size="20" fill="var(--figure-ink)">0</text>
    <text x="385" y="392" text-anchor="middle" font-size="20" fill="var(--figure-ink)">1</text>
    <text x="455" y="392" text-anchor="middle" font-size="20" fill="var(--figure-ink)">2</text>
  </g>

  <g id="step-2">
    <!-- ══════════════ Teinte accent : ligne et colonne du neutre 0 (corps) ══════════════ -->
    <rect x="210" y="140" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>
    <rect x="280" y="140" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>
    <rect x="350" y="140" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>
    <rect x="420" y="140" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>
    <rect x="210" y="210" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>
    <rect x="210" y="280" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>
    <rect x="210" y="350" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.13"/>

    <!-- Teinte forte : les deux cellules d'en-tête "0" — le neutre lui-même -->
    <rect x="210" y="70"  width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.32"/>
    <rect x="140" y="140" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.32"/>

    <!-- ══════════════ Annotation : le neutre (à gauche) ══════════════ -->
    <path d="M133,140 L126,140 L126,210 L133,210" fill="none" stroke="var(--figure-accent)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="122" y="172" text-anchor="end" font-size="13" font-weight="600" fill="var(--figure-accent)"
          ><tspan font-style="italic">e</tspan><tspan> = 0</tspan></text>
    <text x="122" y="187" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">(neutre)</text>
  </g>

  <g id="step-3">
    <!-- Case annotée : ligne "1", colonne "3" → 0 (exemple de lecture du symétrique) -->
    <rect x="420" y="210" width="70" height="70" fill="var(--figure-accent)" fill-opacity="0.22"
          stroke="var(--figure-accent)" stroke-width="2.5"/>

    <!-- ══════════════ Annotation : le symétrique (à droite, case (1,3)=0) ══════════════ -->
    <line x1="490" y1="245" x2="516" y2="245" stroke="var(--figure-accent)" stroke-width="1.5"/>
    <circle cx="490" cy="245" r="3" fill="var(--figure-accent)"/>
    <text x="522" y="234" text-anchor="start" font-size="12" fill="var(--figure-ink-soft)">1 + 3 = 0</text>
    <text x="522" y="249" text-anchor="start" font-size="10" fill="var(--figure-ink-soft)">(le neutre)</text>
    <text x="522" y="266" text-anchor="start" font-size="11.5" font-weight="600" fill="var(--figure-accent)">3 : symétrique de 1</text>
  </g>

</svg>
