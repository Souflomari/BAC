# ──────────────────────────────────────────────────────────────────────────────
# IN-LESSON CHECKPOINT ITEMS (summit-conversion campaign — maths structures alg.)
#
# Sondes FORMATIVES, calmes, placées DANS la leçon — PAS la banque de fin
# (items.yaml). Même schéma d'item, mais NI score, NI streak, NI comptage. Le
# feedback d'une mauvaise réponse nomme le MODÈLE algébrique erroné, pas
# seulement le fait de s'être trompé. Le plancher ≥3-par-misconception de la
# banque de fin vit dans items.yaml et n'est PAS modifié par ces checkpoints
# (les clones sont surfacés en ligne, jamais recomptés).
#
# Placement (les ids correspondent aux marqueurs [[checkpoint:…]] de lesson.md) :
#   cp-r0-predict           (dans R0)       — GATE d'engagement : transforme le
#                                             « prends position » de l'horloge en
#                                             un vrai QCM avant la révélation.
#                                             Sonde generalisation-hative.
#   cp-r1-stabilite         (après R1)      — rupture-gate : loi interne &
#                                             stabilité — UN seul couple qui
#                                             s'échappe hors de E casse la
#                                             propriété. Sonde cloture-non-verifiee.
#   cp-r2-neutre-symetrique (après R2)      — rupture-gate : neutre vs symétrique
#                                             — le neutre est un élément fixe,
#                                             le symétrique dépend de l'élément.
#                                             Sonde neutre-vs-symetrique. Clone SA-2.
#   cp-r6-structures        (après R6)      — rupture-gate : groupe / anneau /
#                                             corps — on coche TOUS les axiomes,
#                                             sans en sauter aucun. Sonde
#                                             axiome-oublie.
#   cp-r7-morphisme         (avant r-bac)   — rupture-gate : isomorphisme —
#                                             bijectif ET morphisme, il transporte
#                                             la structure sans re-vérifier les
