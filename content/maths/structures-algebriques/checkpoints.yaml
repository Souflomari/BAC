  #        équation lue comme si elle fixait une lettre). D →
  #        dimension-compte-parametres (M4 : compter au lieu de résoudre,
  #        x = y = z lu comme UNE équation). Verdicts équilibrés (I-5) : deux
  #        options « réduit au vecteur nul », deux « pas réduit » ; D partage
  #        le verdict de la clé avec un compte faux.
  # ════════════════════════════════════════════════════════════════

  - id: cp-r8-pari-noyau
    rung: "R8"
    habilete: raisonnement
    skill_code: maths_structures_alg
    tags: [checkpoint, formative, misconception_driven, maths_structures_alg, application-lineaire]
    primary_misconception: mc.math.structures_algebriques.noyau-toujours-nul
    item_source: original
    lesson_placement: in_R8

    stem: |
      On vient de vérifier que $f(x,y,z) = (x - y,\ y - z)$ est une
      application linéaire de $\mathbb{R}^3$ dans $\mathbb{R}^2$ ; en
      particulier, $f(0,0,0) = (0,0)$. **Que contient $\ker f$ ?** Prends
      position avant de lire la suite.

    type: mcq

    choices:
      - id: A
        text: |
          Le vecteur nul et lui seul : $f$ est linéaire, elle envoie
          $(0,0,0)$ sur $(0,0)$, et c'est le seul vecteur envoyé là.
        correct: false
        misconception: mc.math.structures_algebriques.noyau-toujours-nul
        feedback: |
          Modèle détecté : « le noyau se réduit au vecteur nul, puisque
          $f(0) = 0$ ». La linéarité dit que $(0,0,0)$ est **dans** le
          noyau, pas qu'il y est seul — cela, c'est le calcul qui le dit.
          Ici $f(1,1,1) = (1 - 1,\ 1 - 1) = (0,0)$ : le noyau contient aussi
          $(1,1,1)$, et tous les $(t,t,t)$ avec lui. C'est une droite.

      - id: B
        text: |
          Une droite, celle des $(t,t,t)$ : $x - y = 0$ et $y - z = 0$
          imposent $x = y = z$ sans fixer leur valeur commune.
        correct: true
        feedback: |
          Exact. Deux équations pour trois inconnues laissent une lettre
          libre : $x = y = z = t$, avec $t$ réel quelconque. Le noyau est
          $\{(t,t,t)\ /\ t \in \mathbb{R}\} = \mathrm{Vect}\big((1,1,1)\big)$,
          une droite — et $f$ n'est pas injective, puisque $f(1,1,1)$ et
          $f(0,0,0)$ valent tous deux $(0,0)$.

      - id: C
        text: |
          Le vecteur nul et lui seul : la première équation donne $x = y$,
          la seconde $y = z$, et ces deux égalités forcent $x = y = z = 0$.
        correct: false
        misconception: mc.math.structures_algebriques.noyau-toujours-nul
        feedback: |
          Modèle détecté : chaque équation lue comme si elle fixait une
          lettre. $x = y$ et $y = z$ disent que les trois coordonnées sont
          égales, pas qu'elles sont nulles : $(1,1,1)$ les vérifie, et
          $(2,2,2)$ aussi. Deux équations, trois inconnues — une lettre reste
          libre, et le noyau est la droite des $(t,t,t)$.

      - id: D
        text: |
          Un plan : $x = y = z$ est une seule équation pour trois lettres,
          et il reste donc deux paramètres libres.
        correct: false
        misconception: mc.math.structures_algebriques.dimension-compte-parametres
        feedback: |
          Modèle détecté : la dimension comptée au lieu d'être lue sur la
          solution. Le verdict « pas réduit au vecteur nul » est juste, mais
          le compte ne l'est pas : $x = y = z$ abrège **deux** équations,
          $x = y$ et $y = z$. Résous-les : $x = y = z = t$, un seul
          paramètre. Le noyau est la droite $\mathrm{Vect}\big((1,1,1)\big)$,
          de dimension $1$.
