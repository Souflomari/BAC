    intro: |-
      **Structures algébriques (examen national, session normale 2023, Sciences Mathématiques) — les deux questions qui ouvrent l'exercice.**

      On rappelle que $(M_2(\mathbb{R}), +, \times)$ est un anneau non commutatif de zéro la matrice $O = \begin{pmatrix} 0 & 0 \\ 0 & 0 \end{pmatrix}$ et d'unité la matrice $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$, et que $(M_2(\mathbb{R}), +, \cdot)$ est un espace vectoriel réel.

      On considère l'ensemble $E = \left\{ M(x,y) = \begin{pmatrix} x+y & y \\ 2y & x-y \end{pmatrix} \ /\ (x,y) \in \mathbb{R}^2 \right\}$

      Attention aux lettres : dans la leçon, $E$ était l'espace ambiant et $H$ la partie à tester ; ici, l'ambiant est $M_2(\mathbb{R})$ et la partie s'appelle $E$. Les sujets ne suivent pas nos conventions — relire quelle lettre désigne quoi est un geste d'examen à part entière.

      La suite du sujet étudie la multiplication des matrices de $E$ (chapitres 7 à 10) ; seules ses deux premières questions sont reprises ici.
    questions:
      - id: q1
        part: "Partie I — $E$ : sous-groupe additif et sous-espace vectoriel"
        stem: |-
          **(0,5 pt)** Montrer que $E$ est un sous-groupe de $(M_2(\mathbb{R}), +)$.
        reasoning: |-
          C'est le critère du sous-groupe du chapitre 5 : trois conditions — la matrice nulle $O$, neutre de $+$, est dans $E$ ; $E$ est stable pour $+$ ; l'opposé de chaque élément de $E$ reste dans $E$. Pas une de plus : l'associativité de $+$ est héritée de $M_2(\mathbb{R})$, donc on ne l'écrit pas. C'est une décision d'expert, pas un oubli — la redémontrer sur $E$ ne prouverait rien de plus, et ce serait refaire le chapitre 4 sur un ensemble qui l'a déjà reçue de $M_2(\mathbb{R})$.

          Pour chaque condition, on calcule, puis on **reconnaît la forme** $M(\cdot,\cdot)$ : la case en haut à droite donne le second paramètre, seul ; la case en haut à gauche, qui vaut leur somme, donne alors le premier ; il reste à vérifier que les deux cases du bas valent bien le double du second et la différence des deux.
        steps:
          - math: 'O = M(0,0) \in E'
            note: "Première condition, la plus courte : avec x = 0 et y = 0, les quatre coefficients de M(x,y) sont nuls. La matrice nulle, neutre de +, est dans E."
          - math: 'M(x,y)+M(a,b) = \begin{pmatrix} (x+y)+(a+b) & y+b \\ 2y+2b & (x-y)+(a-b) \end{pmatrix}'
            note: "Deuxième condition, stable pour + : deux éléments quelconques, avec (a,b) pour le second couple, additionnés coefficient par coefficient. On ne simplifie rien encore."
          - math: '\begin{pmatrix} (x+y)+(a+b) & y+b \\ 2y+2b & (x-y)+(a-b) \end{pmatrix} = \begin{pmatrix} (x+a)+(y+b) & y+b \\ 2(y+b) & (x+a)-(y+b) \end{pmatrix}'
            note: "Le second paramètre se lit en haut à droite : y + b ; la case en haut à gauche donne alors x + a. On regroupe les trois autres cases autour de ces deux sommes."
          - math: 'M(x,y)+M(a,b) = M(x+a,\ y+b) \in E'
            note: "La somme a la forme M(·,·) : E est stable pour +."
          - math: '-M(x,y) = \begin{pmatrix} -x-y & -y \\ -2y & -x+y \end{pmatrix}'
            note: "Troisième condition, l'opposé : chaque coefficient change de signe."
          - math: '-M(x,y) = M(-x,\ -y) \in E'
            note: "Second paramètre lu en haut à droite : −y ; en haut à gauche, −x − y donne alors −x. En bas, 2(−y) = −2y et (−x) − (−y) = −x + y : l'opposé est dans E."
          - math: 'E \ \text{est un sous-groupe de} \ (M_2(\mathbb{R}),+)'
            note: "Les trois conditions du critère du chapitre 5 tiennent. Remarque ce qui n'a pas été écrit : pas une ligne sur l'associativité, héritée de M₂(ℝ). La rédiger sur E serait l'erreur inverse — du temps passé à prouver ce qu'on a déjà."
      - id: q2
        stem: |-
          **(0,25 pt)** Montrer que $E$ est un sous-espace vectoriel de $(M_2(\mathbb{R}), +, \cdot)$.
        reasoning: |-
          Montrer que $E$ est un sous-espace vectoriel de $(M_2(\mathbb{R}),+,\cdot)$, c'est appliquer le critère du sous-espace du chapitre 11, à trois conditions — l'espace ambiant étant donné par le rappel en tête d'énoncé. Le geste reste très proche de la stabilité du chapitre 2 : $E$ est non vide (il contient $O$, question précédente), stable pour $+$ (déjà établi), et il reste seulement à vérifier la stabilité pour la multiplication par un réel $\lambda$.

          Le calcul est direct : multiplier chaque coefficient de $M(x,y)$ par $\lambda$ revient à multiplier $x$ et $y$ par $\lambda$ dans la même formule, donc le résultat reste de la forme $M(\cdot,\cdot)$.
        steps:
          - math: 'E \neq \varnothing \quad (O = M(0,0) \in E,\ \text{q1}), \qquad E \ \text{stable pour} \ + \quad (\text{q1})'
            note: "Deux des trois conditions d'un sous-espace vectoriel (critère du chapitre 11), déjà établies."
          - math: '\lambda \cdot M(x,y) = \begin{pmatrix} \lambda(x+y) & \lambda y \\ 2\lambda y & \lambda(x-y) \end{pmatrix}'
            note: "Multiplication de chaque coefficient de M(x,y) par le réel λ."
          - math: '\begin{pmatrix} \lambda(x+y) & \lambda y \\ 2\lambda y & \lambda(x-y) \end{pmatrix} = \begin{pmatrix} \lambda x+\lambda y & \lambda y \\ 2\lambda y & \lambda x-\lambda y \end{pmatrix}'
            note: "Second paramètre lu en haut à droite : λy. On développe les deux cases qui mélangent les paramètres, pour faire apparaître λx."
          - math: '\lambda \cdot M(x,y) = M(\lambda x,\ \lambda y) \in E'
            note: "Le résultat garde exactement la forme M(·,·) : E est stable pour la multiplication par un scalaire."
          - math: 'E \ \text{est un sous-espace vectoriel de} \ (M_2(\mathbb{R}),+,\cdot)'
            note: "Non vide, stable pour + et pour · : les trois conditions du critère du chapitre 11 sont réunies."

