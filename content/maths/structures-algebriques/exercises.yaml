    intro: |-
      Même chaîne que le sujet de 2023, sur un autre ensemble de matrices — et deux questions de plus : la base, puis l'application qui fabrique les éléments de l'ensemble. On rappelle que $(M_2(\mathbb{R}),+,\cdot)$ est un espace vectoriel réel, de vecteur nul la matrice $O$, et l'on considère

      $$E = \left\{ M(x,y) = \begin{pmatrix} x & y \\ -y & x-y \end{pmatrix} \ /\ (x,y) \in \mathbb{R}^2 \right\} \subset M_2(\mathbb{R})$$

      Comme dans le sujet, la partie s'appelle $E$ et l'espace ambiant est $M_2(\mathbb{R})$ : relis bien quelle lettre désigne quoi avant de rédiger.
    questions:
      - id: q1
        part: "Partie A — $E$ : sous-groupe, puis sous-espace vectoriel"
        stem: |-
          Montrer que $E$ est un sous-groupe de $(M_2(\mathbb{R}),+)$.
        reasoning: |-
          C'est le critère du sous-groupe (chapitre 5) : trois conditions — la matrice nulle, la stabilité pour $+$, l'opposé. Pour chacune, on calcule, puis on **reconnaît la forme** $M(\cdot,\cdot)$ : la case en haut à gauche donne le premier paramètre, la case en haut à droite le second, et il reste à vérifier que les deux cases du bas valent bien $-y$ et $x-y$ pour ces paramètres-là.

          Le point de vigilance est la case en bas à droite : c'est la seule qui mélange les deux paramètres, donc la seule où un regroupement est nécessaire.
        steps:
          - math: 'O = M(0,0) \in E'
            note: "Avec x = 0 et y = 0, les quatre coefficients sont nuls : la matrice nulle, neutre de +, est dans E."
          - math: 'M(x,y) + M(x'',y'') = \begin{pmatrix} x+x'' & y+y'' \\ -(y+y'') & (x-y)+(x''-y'') \end{pmatrix}'
            note: "Deux éléments quelconques, additionnés coefficient par coefficient ; en bas à gauche, $-y - y'$ s'écrit $-(y+y')$."
          - math: '(x-y)+(x''-y'') = (x+x'')-(y+y'')'
            note: "La case en bas à droite, regroupée autour des paramètres lus en haut : $x+x'$ et $y+y'$."
          - math: 'M(x,y) + M(x'',y'') = M(x+x'',\ y+y'') \in E'
            note: "La somme a la forme M(·,·) : E est stable pour +."
          - math: '-M(x,y) = \begin{pmatrix} -x & -y \\ y & -x+y \end{pmatrix}'
            note: "L'opposé, coefficient par coefficient."
          - math: '-M(x,y) = M(-x,\ -y) \in E'
            note: "Paramètres lus en haut : $-x$ et $-y$. En bas, $-(-y) = y$ et $(-x)-(-y) = -x+y$ : l'opposé est dans E. E est un sous-groupe de (M₂(ℝ), +)."
      - id: q2
        stem: |-
          Montrer que $E$ est un sous-espace vectoriel de $(M_2(\mathbb{R}),+,\cdot)$.
        reasoning: |-
          Le critère du sous-espace (chapitre 11) a trois conditions — non vide, stable pour $+$, stable pour la loi externe — et la question précédente vient d'en établir deux : $O \in E$, et la stabilité pour $+$. Relire ce qu'on vient de démontrer avant de rédiger, c'est le geste d'examen : il ne reste que la multiplication par un réel.

          Pour elle, même méthode qu'en q1 : on multiplie chaque coefficient par $\lambda$, on lit les paramètres en haut, et on vérifie les deux cases du bas.
        steps:
          - math: 'O \in E, \qquad E \ \text{stable pour} \ + \quad (\text{q1})'
            note: "Deux des trois conditions d'un sous-espace vectoriel, acquises à la question précédente."
          - math: '\lambda \cdot M(x,y) = \begin{pmatrix} \lambda x & \lambda y \\ -\lambda y & \lambda(x-y) \end{pmatrix}'
            note: "Chaque coefficient est multiplié par le réel λ."
          - math: '\lambda(x-y) = \lambda x - \lambda y'
            note: "Paramètres lus en haut : λx et λy. La case en bas à droite se développe pour les faire apparaître."
          - math: '\lambda \cdot M(x,y) = M(\lambda x,\ \lambda y) \in E'
            note: "Le multiple a la forme M(·,·) : E est stable pour la loi externe. Les trois conditions sont réunies, E est un sous-espace vectoriel."
      - id: q3
        part: "Partie B — Une base de $E$"
        stem: |-
          On pose $J = M(0,1)$. Montrer que $(I,J)$ est une base de l'espace vectoriel réel $(E,+,\cdot)$, puis donner $\dim E$.
        reasoning: |-
          Une base, c'est une famille **libre** et **génératrice** : deux vérifications séparées, et aucune ne donne l'autre. Il faut d'abord s'assurer que $I$ et $J$ sont bien dans $E$ — une base de $E$ est faite d'éléments de $E$.

          Génératrice : on part d'un élément **quelconque** $M(x,y)$, et on l'écrit avec $I$ et $J$ ; la décomposition se lit en séparant ce qui multiplie $x$ de ce qui multiplie $y$. Libre : on pose une combinaison nulle, et on lit les coefficients là où ils sont seuls. La dimension est alors le nombre de vecteurs de la base.
        steps:
          - math: 'I = M(1,0)'
            note: "Avec x = 1 et y = 0, la case en bas à droite vaut x − y = 1 : I est dans E."
          - math: 'J = \begin{pmatrix} 0 & 1 \\ -1 & -1 \end{pmatrix}'
            note: "J = M(0, 1) : avec x = 0 et y = 1, les cases du bas valent −y = −1 et x − y = −1."
          - math: 'xI + yJ = \begin{pmatrix} x & 0 \\ 0 & x \end{pmatrix} + \begin{pmatrix} 0 & y \\ -y & -y \end{pmatrix}'
            note: "Génératrice : pour un élément quelconque, on sépare ce qui multiplie x de ce qui multiplie y."
          - math: '\begin{pmatrix} x & 0 \\ 0 & x \end{pmatrix} + \begin{pmatrix} 0 & y \\ -y & -y \end{pmatrix} = M(x,y)'
            note: "La somme vaut (x, y ; −y, x − y) : tout élément de E s'écrit xI + yJ."
          - math: '\alpha I + \beta J = \begin{pmatrix} \alpha & \beta \\ -\beta & \alpha - \beta \end{pmatrix}'
            note: "Libre : on calcule la combinaison générale."
          - math: '\begin{pmatrix} \alpha & \beta \\ -\beta & \alpha - \beta \end{pmatrix} = O \implies \alpha = 0 \ \text{et} \ \beta = 0'
            note: "Si elle est nulle, la case en haut à gauche donne α = 0, et celle en haut à droite β = 0 : (I, J) est libre."
          - math: '\dim E = 2'
            note: "(I, J) est libre et génératrice : c'est une base de E, de deux matrices."
      - id: q4
        part: "Partie C — L'application qui fabrique $E$"
        stem: |-
          On considère l'application $\varphi : \mathbb{R}^2 \to M_2(\mathbb{R})$ définie par $\varphi(x,y) = M(x,y)$. Montrer que $\varphi$ est linéaire, déterminer $\ker \varphi$ et $\mathrm{Im}\,\varphi$, puis en déduire que tout élément de $E$ a un antécédent et un seul par $\varphi$.
        reasoning: |-
          Trois choses à établir, dans l'ordre où elles se servent l'une l'autre. **La linéarité d'abord**, et elle ne demande aucun calcul neuf : la question 1 a établi $M(x,y) + M(x',y') = M(x+x',\ y+y')$, et la question 2 $\lambda \cdot M(x,y) = M(\lambda x,\ \lambda y)$. Avant d'écrire, relis-les : ce sont exactement les deux formules dont $\varphi$ a besoin.

          **Le noyau ensuite** : les couples $(x,y)$ tels que $M(x,y) = O$, et les paramètres se lisent en haut, là où ils sont seuls. Le réflexe à éviter : écrire « $\ker \varphi = \{(0,0)\}$ puisque $\varphi$ est linéaire ». La linéarité dit seulement que $(0,0)$ est **dans** le noyau ; qu'il y soit seul, c'est le calcul qui le dit. **L'image enfin** : les valeurs de $\varphi$ sont les $M(x,y)$, c'est-à-dire, par définition, les éléments de $E$ — ici, aucun antécédent à construire, l'énoncé l'a donné en définissant $E$.

          La conclusion se lit sur ces deux résultats : un noyau réduit à $(0,0)$ donne l'injectivité, donc au plus un antécédent ; une image égale à $E$ donne au moins un antécédent. Et puisque $\varphi(x,y) = xI + yJ$ (question 3), c'est la base $(I,J)$ lue une seconde fois : « libre » se lit sur le noyau, « génératrice » sur l'image.
        steps:
          - math: '\varphi\big(\lambda (x,y) + \mu (x'',y'')\big) = M(\lambda x + \mu x'',\ \lambda y + \mu y'')'
            note: "Linéarité : on calcule φ sur une combinaison quelconque. Le couple λ(x, y) + μ(x′, y′) a pour coordonnées λx + μx′ et λy + μy′."
          - math: 'M(\lambda x + \mu x'',\ \lambda y + \mu y'') = M(\lambda x,\ \lambda y) + M(\mu x'',\ \mu y'')'
            note: "La formule de la somme, établie à la question 1, lue de droite à gauche. Aucun coefficient à recalculer : c'est l'ordre des questions qui travaille."
          - math: 'M(\lambda x,\ \lambda y) + M(\mu x'',\ \mu y'') = \lambda \cdot M(x,y) + \mu \cdot M(x'',y'')'
            note: "La formule de la loi externe, établie à la question 2, appliquée deux fois. On obtient λφ(x, y) + μφ(x′, y′) : φ est linéaire."
          - math: '\varphi(x,y) = O \iff \begin{pmatrix} x & y \\ -y & x-y \end{pmatrix} = O'
            note: "Le noyau : les couples envoyés sur la matrice nulle. Ne t'arrête pas à φ(0, 0) = O — cela dit que (0, 0) est dans le noyau, pas qu'il y est seul."
          - math: '\begin{pmatrix} x & y \\ -y & x-y \end{pmatrix} = O \implies x = 0 \ \text{et} \ y = 0'
            note: "On lit les paramètres là où ils sont seuls : la case en haut à gauche donne x = 0, celle en haut à droite y = 0."
          - math: '\ker \varphi = \{(0,0)\}'
            note: "Et réciproquement, φ(0, 0) = M(0, 0) = O : le noyau est réduit à (0, 0). Par l'équivalence démontrée dans le chapitre, φ est injective."
          - math: '\mathrm{Im}\,\varphi = \{M(x,y) \ /\ (x,y) \in \mathbb{R}^2\}'
            note: "L'image : l'ensemble des valeurs prises par φ quand (x, y) parcourt ℝ²."
          - math: '\{M(x,y) \ /\ (x,y) \in \mathbb{R}^2\} = E'
            note: "C'est mot pour mot la définition de E : tout élément de E est atteint, et φ ne prend aucune valeur hors de E."
          - math: '\varphi \ \text{est une bijection de} \ \mathbb{R}^2 \ \text{sur} \ E'
            note: "Injective : au plus un antécédent ; image égale à E : au moins un. Tout élément de E a donc un antécédent et un seul — la même information que « (I, J) est une base de E », puisque φ(x, y) = xI + yJ."
