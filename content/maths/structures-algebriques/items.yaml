  # ── loi-modulaire-mal-calculee ─────────────────────────────────────────
  # Ajoutés le 2026-09-05 : cette famille siégeait à UN seul item du banc,
  # donc très en dessous du plancher de 3. Deux énoncés distincts — calculer
  # dans la loi (SA-25), puis chercher un symétrique qui oblige à y revenir
  # (SA-26) — plutôt que deux clones du même geste.
  - id: SA-25
    rung: "R1"
    difficulty_level: 2
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, loi_modulaire]
    stem: >
      Sur le cadran d'une horloge, on note $E=\{0,1,\dots,11\}$ l'ensemble des
      heures affichées et l'on définit la loi $\oplus$ par : « ajouter les deux
      durées, puis lire l'heure que l'aiguille indique ». Que vaut
      $9 \oplus 7$ ?
    type: mcq
    choices:
      - id: A
        text: "$16$ : la somme se calcule comme d'habitude, et l'horloge affiche $16$"
        correct: false
        misconception: mc.math.structures_algebriques.loi-modulaire-mal-calculee
        feedback: >
          $16$ n'est pas dans $E$ : aucune horloge à douze heures n'affiche
          $16$. La loi $\oplus$ n'est pas l'addition usuelle — elle est
          l'addition SUIVIE du retour dans l'ensemble. Sans cette seconde
          étape, le résultat sort de $E$ et la loi cesse d'être interne.
      - id: B
        text: "$4$ : on calcule $9+7=16$, puis $16 = 12 + 4$, donc l'aiguille indique $4$"
        correct: true
      - id: C
        text: "$-4$ : on retranche la somme au tour complet, $12 - 16 = -4$"
        correct: false
        misconception: mc.math.structures_algebriques.loi-modulaire-mal-calculee
        feedback: >
          Le retour dans $E$ se fait en retranchant des tours complets AU
          résultat, pas l'inverse : $16 - 12 = 4$, et non $12 - 16$. Un
          nombre négatif n'est pas davantage une heure affichable que $16$ :
          les deux erreurs sont la même, au signe près.
      - id: D
        text: >-
          Aucune valeur : la loi n'est pas interne sur $E$, puisque $9+7=16$
          n'appartient pas à $E$
        correct: false
        misconception: mc.math.structures_algebriques.loi-modulaire-mal-calculee
        feedback: >
          C'est confondre une ÉTAPE du calcul avec son résultat. La loi
          $\oplus$ comprend le retour dans $E$ ; son résultat est $4$, qui
          appartient bien à $E$. La loi est donc parfaitement interne — c'est
          même exactement ce que le passage au reste garantit.
    correct_feedback: >
      $9 \oplus 7 = 4$. La loi de l'horloge, c'est l'addition PUIS le retour
      dans $E$ : $9+7 = 16$, et $16 - 12 = 4$. Cette seconde étape n'est pas
      un détail de présentation — c'est elle qui fait de $\oplus$ une loi
      interne sur $E$.
    solution: |
      $$9 + 7 = 16 = 1\times 12 + 4$$
      Le reste de la division euclidienne de $16$ par $12$ vaut $4$, donc
      $$9 \oplus 7 = 4$$
      Autrement dit $16 \equiv 4 \pmod{12}$. Le contrôle est immédiat : le
      résultat d'une loi interne sur $E$ appartient à $E$. Tout résultat hors
      de $\{0,1,\dots,11\}$ signale qu'on a oublié de revenir dans l'ensemble.

  - id: SA-26
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, symetrique, loi_modulaire]
    stem: >
      Dans le groupe $(\mathbb{Z}/7\mathbb{Z}, +)$, dont les éléments sont les
      classes $\{0,1,2,3,4,5,6\}$ et dont le neutre est $0$, quel est le
      symétrique de $5$ ?
    type: mcq
    choices:
      - id: A
        text: "$-5$, l'opposé de $5$"
        correct: false
        misconception: mc.math.structures_algebriques.loi-modulaire-mal-calculee
        feedback: >
          $-5$ n'est pas un élément de $\mathbb{Z}/7\mathbb{Z}$ : les seuls
          éléments sont $0$ à $6$. L'opposé usuel n'est qu'une étape — il faut
          le ramener dans l'ensemble : $-5 + 7 = 2$. C'est la même exigence que
          pour l'addition : tout calcul se termine par un retour dans $E$.
      - id: B
        text: "$0$, puisque $0$ est le neutre du groupe"
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: >
          Le neutre et le symétrique sont deux rôles distincts. Le neutre $0$
          est unique et ne change rien à personne ; le symétrique de $5$ est
          l'élément qui, AJOUTÉ à $5$, redonne le neutre. Or $5 + 0 = 5 \neq 0$.
      - id: C
        text: "$2$, car $5 + 2 = 7 \\equiv 0 \\pmod 7$"
        correct: true
      - id: D
        text: "$1$, car $5 + 1 = 6$ et $6$ a pour reste $0$ dans la division par $6$"
        correct: false
        misconception: mc.math.structures_algebriques.loi-modulaire-mal-calculee
        feedback: >
          Le module est $7$, pas $6$ : c'est $\mathbb{Z}/7\mathbb{Z}$. Réduire
          modulo un autre entier donne un résultat qui n'a plus rien à voir avec
          la loi étudiée. Ici $6 = 0\times 7 + 6$, donc $6 \equiv 6$, pas $0$.
    correct_feedback: >
      Le symétrique de $5$ est $2$ : $5 + 2 = 7 \equiv 0 \pmod 7$, et le neutre
      est bien $0$. Le réflexe qui l'obtient sans tâtonner : le symétrique de
      $x$ dans $(\mathbb{Z}/n\mathbb{Z},+)$ est $n - x$, ramené dans
      l'ensemble.
    solution: |
      On cherche $x'$ tel que $5 + x' \equiv 0 \pmod 7$, avec
      $x' \in \{0,\dots,6\}$ :
      $$5 + x' = 7 \quad\Longrightarrow\quad x' = 2$$
      Vérification dans les deux sens : $5 + 2 = 7 \equiv 0$ et
      $2 + 5 = 7 \equiv 0$. Le symétrique de $5$ est donc $2$.
      Règle générale : dans $(\mathbb{Z}/n\mathbb{Z},+)$, le symétrique de $x$
      non nul est $n - x$. Pour $x = 0$, le symétrique est $0$ lui-même.

