  - id: SA-27
    rung: "R7"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, morphisme, transport]
    stem: |
      On pose $F=\left\{M(t)=\begin{pmatrix}1&0\\t&1\end{pmatrix} \mid t\in\mathbb{R}\right\}$,
      muni du produit matriciel usuel $\times$, et $\varphi:\mathbb{R}\to F$,
      $\varphi(t)=M(t)$. On veut montrer que $\varphi$ est un morphisme de
      $(\mathbb{R},+)$ vers $(F,\times)$. Quel raisonnement établit
      correctement cette propriété ?
    type: mcq
    choices:
      - id: A
        text: |
          On mène le calcul avec deux réels $t,s$ non précisés à l'avance,
          et l'on retombe sur $M(t+s)$ dans chaque cas ; rien n'a été choisi
          pour l'obtenir.
        correct: true
      - id: B
        text: |
          On mène le calcul avec $t=1$ et $s=2$ seulement, et l'on retombe
          sur $M(3)$ comme attendu ; ce couple choisi représente la
          situation dans son ensemble.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Modèle détecté : un couple pour toute une loi. Que l'égalité tienne
          pour $t=1,s=2$ ne dit rien des autres couples ; il faut reprendre le
          calcul avec $t,s$ **quelconques**, sans leur donner de valeur.
      - id: C
        text: |
          On mène le calcul avec $t=0$ seulement, et l'on retombe sur
          $M(s)$ comme attendu ; ce cas particulier représente la situation
          dans son ensemble.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Modèle détecté : le cas neutre pris pour le cas général. Que $t=0$
          fonctionne (c'est même automatique, $M(0)$ est l'élément neutre de
          $F$) ne prouve rien pour deux réels $t,s$ ni l'un ni l'autre nuls —
          il faut refaire le calcul sans fixer aucun des deux.
      - id: D
        text: |
          On admet d'abord que $\varphi$ sera bijective, et l'on en déduit
          qu'elle respecte aussi la loi, sans passer par ce calcul.
        correct: false
        misconception: mc.math.structures_algebriques.axiome-oublie
        feedback: |
          Modèle détecté : une condition oubliée. Bijectivité et morphisme
          sont deux propriétés indépendantes d'une application ; l'une ne
          découle jamais de l'autre. Les deux doivent être établies
          séparément avant de parler d'isomorphisme.
    correct_feedback: |
      $M(t)\times M(s) = \begin{pmatrix}1&0\\t&1\end{pmatrix}
      \begin{pmatrix}1&0\\s&1\end{pmatrix} = \begin{pmatrix}1&0\\t+s&1\end{pmatrix}
      = M(t+s)$, pour $t,s$ quelconques : $\varphi(t+s)=\varphi(t)\times\varphi(s)$,
      $\varphi$ est un morphisme.
    solution: |
      $$M(t)\times M(s) = \begin{pmatrix}1&0\\t&1\end{pmatrix}\begin{pmatrix}1&0\\s&1\end{pmatrix}
      = \begin{pmatrix}1\times1+0\times s & 1\times0+0\times1\\ t\times1+1\times s & t\times0+1\times1\end{pmatrix}
      = \begin{pmatrix}1&0\\t+s&1\end{pmatrix} = M(t+s)$$
      Cette égalité tient pour $t,s$ quelconques dans $\mathbb{R}$ : donc
      $\varphi(t+s)=\varphi(t)\times\varphi(s)$ pour tous $t,s$. $\varphi$ est
      un morphisme de $(\mathbb{R},+)$ vers $(F,\times)$.

  - id: SA-28
    rung: "R7"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, morphisme, bijectivite]
    stem: |
      On a déjà établi que $\varphi:\mathbb{R}\to\mathbb{R}$, $\varphi(t)=t+7$,
      vérifie $\varphi(t+s)=\varphi(t)\star\varphi(s)$ pour tous
      $t,s\in\mathbb{R}$, où $\star$ est définie par $x\star y=x+y-7$ —
      $\varphi$ est donc un morphisme de $(\mathbb{R},+)$ vers $(\mathbb{R},\star)$.
      **Peut-on déjà conclure que $(\mathbb{R},\star)$ est un groupe
      commutatif ?**
    type: mcq
    choices:
      - id: A
        text: |
          Pas encore : il manque encore la bijectivité de $\varphi$, sans
          laquelle rien ne garantit que la structure de $(\mathbb{R},+)$
          passe intégralement de l'autre côté.
        correct: true
      - id: B
        text: |
          Oui : cette seule propriété suffit à elle seule ; la bijectivité
          ne serait qu'un ingrédient superflu, ajoutable après coup si
          besoin.
        correct: false
        misconception: mc.math.structures_algebriques.axiome-oublie
        feedback: |
          Modèle détecté : une condition oubliée. Sans bijectivité, $\varphi$
          pourrait écraser deux réels distincts sur la même image, ou ne
          jamais atteindre certains éléments de $(\mathbb{R},\star)$ — la
          structure ne se transporterait qu'à moitié. Bijectif et morphisme
          sont deux conditions non négociables, jamais l'une sans l'autre.
      - id: C
        text: |
          Oui : $\varphi(0)=7$ tombe exactement sur l'élément attendu de
          l'autre côté, ce qui confirme au passage que $\varphi$ est
          bijective.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Modèle détecté : un cas particulier généralisé. Que $\varphi(0)=7$
          tombe juste sur le neutre attendu ne dit rien de **tous** les
          autres réels : la bijectivité se prouve pour l'application
          entière, elle ne se confirme pas sur un seul point remarquable.
      - id: D
        text: |
          Oui : dès que deux structures sont mises en correspondance de
          cette façon, tout ce qui en résulte suit automatiquement, que
          $\varphi$ soit bijective ou non.
        correct: false
        misconception: mc.math.structures_algebriques.groupe-implique-commutatif
        feedback: |
          Modèle détecté : « tout groupe est commutatif ». Faux, et de toute
          façon prématuré ici : sans bijectivité établie, on ne sait même pas
          encore que $(\mathbb{R},\star)$ **est** un groupe — la question de
          sa commutativité ne se pose donc pas avant.
    correct_feedback: |
      Exact. Un isomorphisme est bijectif **et** morphisme — les deux
      ensemble, jamais l'un sans l'autre. On vient d'établir le second ; il
      reste à établir le premier avant de pouvoir transporter quoi que ce
      soit ($\varphi(t)=t+7$ est en réalité bijective, mais cela s'établit
      séparément, pas par le calcul du morphisme).
    solution: |
      Isomorphisme = bijectif ET morphisme, les deux conditions réunies.
      Ici seul le morphisme est acquis. Il reste à montrer que $\varphi$ est
      bijective : elle l'est (c'en est une translation, de bijection
      réciproque $\varphi^{-1}(x)=x-7$), mais ce fait ne découle pas du
      calcul de morphisme et doit être justifié à part.

  - id: SA-29
    rung: "R7"
    habilete: synthese
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, transport, synthese]
    stem: |
      Toujours avec $F=\left\{M(t)=\begin{pmatrix}1&0\\t&1\end{pmatrix}
      \mid t\in\mathbb{R}\right\}$ et $\varphi(t)=M(t)$ : on a maintenant
      établi que $\varphi$ est un morphisme de $(\mathbb{R},+)$ vers
      $(F,\times)$ **et** que $\varphi$ est bijective. Que peut-on conclure
      sur $(F,\times)$ ?
    type: mcq
    choices:
      - id: A
        text: |
          Ces deux conditions réunies suffisent : $(\mathbb{R},+)$ est un
          groupe commutatif connu, donc $(F,\times)$ hérite de tout, neutre
          et symétriques compris.
        correct: true
      - id: B
        text: |
          La mise en correspondance des éléments suffit à elle seule ; le
          respect des lois n'ajoute rien de plus une fois cette
          correspondance acquise.
        correct: false
        misconception: mc.math.structures_algebriques.axiome-oublie
        feedback: |
          Modèle détecté : une condition oubliée. Une bijection quelconque
          entre deux ensembles ne transporte rien du tout si elle ne respecte
          pas les lois : c'est précisément le morphisme, établi à part, qui
          fait le lien entre $+$ et $\times$. Bijectif et morphisme sont deux
          conditions non négociables, jamais l'une sans l'autre.
      - id: C
        text: |
          On l'a seulement vérifié sur deux matrices précises, $M(1)$ et
          $M(2)$ ; ce couple représente bien la situation dans son
          ensemble.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Modèle détecté : quelques cas pour toute une structure. Le
          morphisme et la bijectivité ont été établis pour des éléments
          **quelconques**, pas seulement $M(1)$ et $M(2)$ : c'est cette
          généralité, pas un sondage sur deux exemples, qui autorise la
          conclusion.
      - id: D
        text: |
          Ce qui en résulte est commutatif de façon automatique, dès qu'une
          loi admet un neutre et des symétriques, sans lien avec
          $(\mathbb{R},+)$.
        correct: false
        misconception: mc.math.structures_algebriques.groupe-implique-commutatif
        feedback: |
          Modèle détecté : « tout groupe est commutatif ». Faux : il existe
          des groupes non commutatifs (chapitre 6). Ici, c'est bien la
          commutativité de $(\mathbb{R},+)$, transportée par l'isomorphisme,
          qui donne celle de $(F,\times)$ — pas une propriété automatique des
          quatre axiomes du groupe.
    correct_feedback: |
      $\varphi$ bijective et morphisme : c'est un isomorphisme. $(\mathbb{R},+)$
      étant un groupe commutatif déjà connu, toute sa structure se transporte
      sans re-vérifier aucun axiome sur $F$ : commutativité, neutre
      ($\varphi(0)=M(0)=I$) et symétriques ($\varphi(-t)=M(-t)$) compris.
    solution: |
      Les deux ingrédients du transport (chapitre 10) sont réunis :
      $\varphi$ est un morphisme (établi précédemment) et bijective (admise
      ici). $(\mathbb{R},+)$ est un groupe commutatif archi-connu. Par
      transport : $(F,\times)$ est un groupe commutatif, de neutre
      $\varphi(0)=M(0)=I$ (la matrice identité), et le symétrique de $M(t)$
      est $\varphi(-t)=M(-t)$ — sans qu'il y ait eu à re-développer
      l'associativité ou la commutativité directement sur des matrices.

  - id: SA-30
    rung: "R7"
    habilete: application_directe
    difficulty_level: 2
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, transport, neutre]
    stem: |
      On reprend $F=\left\{M(t)=\begin{pmatrix}1&0\\t&1\end{pmatrix}
      \mid t\in\mathbb{R}\right\}$ (chapitre 10) : on admet que $(F,\times)$
      est un groupe commutatif et que $\varphi:\mathbb{R}\to F$,
      $\varphi(t)=M(t)$, est un isomorphisme de $(\mathbb{R},+)$ vers
      $(F,\times)$. Quel est l'élément neutre de $(F,\times)$, obtenu par
      transport ?
    type: mcq
    choices:
      - id: A
        text: "$M(0)$, image par $\\varphi$ du neutre $0$ de $(\\mathbb{R},+)$."
        correct: true
      - id: B
        text: "$0$, le même neutre que celui de $(\\mathbb{R},+)$."
        correct: false
        misconception: mc.math.structures_algebriques.neutre-non-transporte
        feedback: |
          Modèle détecté : le neutre gardé tel quel d'une structure à
          l'autre. $0$ n'est même pas un élément de $F$ (ce n'est pas une
          matrice) : le neutre de $F$ n'est pas $0$, c'est $\varphi(0)=M(0)$.
          Vérifie-le directement : $M(t)\times M(0) = M(t)$ pour tout $t$,
          alors que $0$ n'a pas de sens comme élément de $F$.
      - id: C
        text: "Il n'existe pas d'élément neutre pour $\\times$ sur $F$."
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: |
          Il existe bien un neutre :
          $M(0)=\begin{pmatrix}1&0\\0&1\end{pmatrix}$, puisque
          $M(t)\times M(0) = M(t)$ pour tout $t$. Ne pas le trouver
          directement ne signifie pas qu'il n'existe pas — ici, le transport
          par $\varphi$ le donne sans qu'il y ait à le chercher à tâtons.
      - id: D
        text: "$M(-1)$, l'inverse de $M(1)$."
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: |
          $M(-1)$ ressemble à un symétrique, pas à un neutre : deux rôles
          distincts (chapitre 3). Le neutre est unique et ne dépend d'aucun
          élément particulier ; ici, c'est $\varphi(0)=M(0)$.
    correct_feedback: |
      Le neutre de $(F,\times)$ est l'image par $\varphi$ du neutre $0$ de
      $(\mathbb{R},+)$ : $\varphi(0)=M(0)$. Pas $0$ lui-même, qui reste un
      réel, jamais un élément de $F$.
    solution: |
      Par transport (chapitre 10), le neutre de la structure d'arrivée est
      l'**image par $\varphi$** du neutre de la structure de départ, jamais
      le même objet laissé tel quel :
      $$e_F = \varphi(e_E) = \varphi(0) = M(0) = \begin{pmatrix}1&0\\0&1\end{pmatrix}$$
      Vérification directe :
      $$M(t)\times M(0) = \begin{pmatrix}1&0\\t&1\end{pmatrix}
      \begin{pmatrix}1&0\\0&1\end{pmatrix} = \begin{pmatrix}1&0\\t&1\end{pmatrix} = M(t)$$
      pour tout $t$.

  - id: SA-31
    rung: "R7"
    habilete: application_directe
    difficulty_level: 2
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, transport, symetrique]
    stem: |
      Toujours avec $(\mathbb{R},\star)$ où $x\star y=x+y-7$, isomorphe à
      $(\mathbb{R},+)$ via $\varphi(t)=t+7$ (chapitre 10) : quel est le
      symétrique de $\varphi(8)$ pour $\star$, obtenu par transport ?
    type: mcq
    choices:
      - id: A
        text: "$\\varphi(-8)$, image par $\\varphi$ du symétrique de l'antécédent $8$ dans $(\\mathbb{R},+)$, qui est $-8$."
        correct: true
      - id: B
        text: "$-8$, le symétrique de l'antécédent $8$ dans $(\\mathbb{R},+)$."
        correct: false
        misconception: mc.math.structures_algebriques.neutre-non-transporte
        feedback: |
          Modèle détecté : le symétrique laissé dans la structure de départ.
          $-8$ est bien le symétrique de $8$ dans $(\mathbb{R},+)$, mais
          c'est un résultat intermédiaire, pas la réponse : il reste à lui
          appliquer $\varphi$. Le symétrique de $\varphi(8)$ dans
          $(\mathbb{R},\star)$ est $\varphi(-8)$, pas $-8$.
      - id: C
        text: "$7$, l'élément neutre de $(\\mathbb{R},\\star)$."
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: |
          $7$ est le neutre de $(\mathbb{R},\star)$ — pas le symétrique de
          $\varphi(8)$. Un symétrique dépend de l'élément qu'il accompagne ;
          le neutre, lui, est unique et fixe pour tout le groupe : vérifie
          $\varphi(8)\star7 = 15\star7 = 15+7-7=15\neq7$.
      - id: D
        text: "$\\varphi(8)$ lui-même : dans $(\\mathbb{R},\\star)$, tout élément est son propre symétrique."
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Faux en général : vérifie sur $\varphi(8)=15$ :
          $15\star15=15+15-7=23\neq7$. Seul le neutre $7$ est son propre
          symétrique dans $(\mathbb{R},\star)$ ; ce n'est pas vrai pour les
          autres éléments, et ça ne se suppose pas, ça se vérifie élément par
          élément — ou, ici, ça se lit par transport.
    correct_feedback: |
      Le symétrique de $\varphi(8)$ est l'image par $\varphi$ du symétrique,
      dans $(\mathbb{R},+)$, de l'antécédent $8$ — c'est-à-dire de $-8$ :
      $\varphi(-8)=-8+7=-1$. Vérification : $\varphi(8)\star\varphi(-8) =
      15\star(-1) = 15-1-7=7$, le neutre.
    solution: |
      Par transport, le symétrique de $\varphi(x)$ est $\varphi(x'_E)$, où
      $x'_E$ est le symétrique de $x$ dans la structure de départ — jamais
      $x'_E$ laissé tel quel dans $\mathbb{R}$ :
      $$\big(\varphi(8)\big)' = \varphi(-8) = -8+7 = -1$$
      Vérification : $\varphi(8)\star\varphi(-8) = 15\star(-1) = 15-1-7=7 =
      \varphi(0)$, le neutre de $(\mathbb{R},\star)$.

  - id: SA-32
    rung: "R7"
    habilete: application_non_explicite
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, transport, symetrique]
    stem: |
      Toujours avec $(\mathbb{R},\star)$ où $x\star y=x+y-7$, isomorphe à
      $(\mathbb{R},+)$ via $\varphi(t)=t+7$ (de neutre $\varphi(0)=7$) : quel
      est le symétrique de $10$ pour $\star$, obtenu par transport ?
    type: mcq
    choices:
      - id: A
        text: |
          $4$ : image par $\varphi$ du symétrique de l'antécédent $3$ (à
          savoir $-3$) dans $(\mathbb{R},+)$.
        correct: true
      - id: B
        text: |
          $-3$ : le symétrique de l'antécédent $3$ dans $(\mathbb{R},+)$,
          laissé sans image par $\varphi$.
        correct: false
        misconception: mc.math.structures_algebriques.neutre-non-transporte
        feedback: |
          Modèle détecté : le symétrique laissé dans la structure de départ.
          $-3$ est bien le symétrique de $3$ dans $(\mathbb{R},+)$, mais
          c'est un résultat intermédiaire, pas la réponse : il reste à lui
          appliquer $\varphi$. Le symétrique de $10$ dans $(\mathbb{R},\star)$
          est $\varphi(-3)=4$, pas $-3$.
      - id: C
        text: |
          $7$ : l'élément neutre de $(\mathbb{R},\star)$, pris ici à la
          place du symétrique demandé.
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: |
          $7$ est le neutre de $(\mathbb{R},\star)$ — pas le symétrique de
          $10$. Vérifie : $10\star7=10+7-7=10\neq7$ ; combiner $10$ avec le
          neutre redonne $10$, ça ne ramène pas au neutre.
      - id: D
        text: |
          $10$ : cet élément supposé se symétriser lui-même, comme le
          ferait le neutre de la loi.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Vérifie : $10\star10=10+10-7=13\neq7$ : $10$ n'est pas son propre
          symétrique ici. Seul l'antécédent $3{,}5$ (dont l'image par
          $\varphi$ est le neutre $7$… non, seul le neutre $7$ lui-même est
          son propre symétrique) — ça se vérifie élément par élément, jamais
          par supposition.
    correct_feedback: |
      On repasse par l'antécédent : $\varphi^{-1}(10)=10-7=3$. Son symétrique
      dans $(\mathbb{R},+)$ est $-3$. Son image par $\varphi$ est
      $\varphi(-3)=-3+7=4$ : c'est le symétrique de $10$ dans
      $(\mathbb{R},\star)$. Vérification : $10\star4=10+4-7=7$, le neutre.
    solution: |
      Trois étapes, jamais raccourcies :
      1. Antécédent de $10$ par $\varphi$ : $\varphi(t)=10 \iff t+7=10 \iff
         t=3$.
      2. Symétrique de cet antécédent dans $(\mathbb{R},+)$ : $-3$.
      3. Image de ce symétrique par $\varphi$ : $\varphi(-3)=-3+7=4$.

      Vérification directe : $10\star4=10+4-7=7=\varphi(0)$, le neutre de
      $(\mathbb{R},\star)$. Le symétrique de $10$ est $4$.

  - id: SA-33
    rung: "R7"
    habilete: synthese
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, transport, anneau, corps]
    stem: |
      On pose, pour tous $x,y\in\mathbb{R}$ : $x\oplus y = x+y-7$ et
      $x\otimes y = xy-7x-7y+56$, et $\varphi:\mathbb{R}\to\mathbb{R}$,
      $\varphi(x)=x+7$. On admet que $\varphi(x+y)=\varphi(x)\oplus\varphi(y)$
      et $\varphi(xy)=\varphi(x)\otimes\varphi(y)$ pour tous $x,y$, et que
      $\varphi$ est bijective. Que peut-on conclure sur
      $(\mathbb{R},\oplus,\otimes)$ ?
    type: mcq
    choices:
      - id: A
        text: |
          $\varphi$ est un isomorphisme qui respecte à la fois $+$ et
          $\times$ : comme $(\mathbb{R},+,\times)$ est un corps commutatif,
          toute sa structure se transporte d'un coup — $(\mathbb{R},\oplus,\otimes)$
          est un corps commutatif, de neutre $\varphi(1)=8$ pour $\otimes$.
        correct: true
      - id: B
        text: |
          $(\mathbb{R},\oplus,\otimes)$ est un anneau, mais rien ne garantit
          que ce soit un corps : il faudrait vérifier séparément, élément
          par élément, que chaque réel différent du neutre de $\oplus$
          possède bien un symétrique pour $\otimes$, ce que l'isomorphisme
          à lui seul ne suffit pas à établir.
        correct: false
        misconception: mc.math.structures_algebriques.groupe-anneau
        feedback: |
          Modèle détecté : la structure de corps mise en doute alors qu'elle
          se transporte. $(\mathbb{R},+,\times)$ est un corps : **tout**
          élément non nul y est inversible pour $\times$. L'isomorphisme
          transporte cette propriété d'un coup à $(\mathbb{R},\oplus,\otimes)$,
          exactement comme il transporte le neutre ou la commutativité —
          rien de plus à vérifier élément par élément.
      - id: C
        text: |
          Il suffit que $\varphi$ respecte $\oplus$ : la compatibilité avec
          $\otimes$, elle, n'est qu'un détail technique en plus, non
          nécessaire pour transporter la structure de corps.
        correct: false
        misconception: mc.math.structures_algebriques.axiome-oublie
        feedback: |
          Modèle détecté : une condition oubliée. Pour transporter les DEUX
          lois à la fois (et donc la structure de corps, qui porte sur les
          deux), $\varphi$ doit être compatible avec $+$ **et** avec
          $\times$ : la compatibilité avec $\otimes$ n'est pas un détail, dès
          que le corps — et non le simple groupe additif — est en jeu.
      - id: D
        text: |
          $(\mathbb{R},\oplus,\otimes)$ est un corps commutatif, de neutre
          pour $\otimes$ égal à $1$, comme dans $(\mathbb{R},\times)$, sans
          qu'il soit besoin de le recalculer.
        correct: false
        misconception: mc.math.structures_algebriques.neutre-non-transporte
        feedback: |
          Modèle détecté : le neutre gardé tel quel d'une structure à
          l'autre. Le neutre de $\otimes$ n'est pas $1$ : c'est l'image par
          $\varphi$ du neutre $1$ de $(\mathbb{R},\times)$, soit
          $\varphi(1)=8$. Vérifie-le : $x\otimes1=x-7x-7+56=-6x+49\neq x$ en
          général, alors que $x\otimes8=8x-7x-56+56=x$ pour tout $x$.
    correct_feedback: |
      $\varphi$ transporte les deux lois à la fois : $(\mathbb{R},+,\times)$
      est un corps commutatif, donc $(\mathbb{R},\oplus,\otimes)$ l'est aussi
      — commutativité, distributivité et inversibilité de tout élément non
      nul comprises. Le neutre de $\otimes$ est $\varphi(1)=8$, pas $1$.
    solution: |
      $\varphi$ respecte les deux lois ($\varphi(x+y)=\varphi(x)\oplus\varphi(y)$
      et $\varphi(xy)=\varphi(x)\otimes\varphi(y)$) et est bijective : c'est
      un isomorphisme qui transporte les deux lois à la fois. Comme
      $(\mathbb{R},+,\times)$ est un corps commutatif, tout se transporte en
      un seul geste (chapitre 10, cas à deux lois) : $(\mathbb{R},\oplus,\otimes)$
      est un corps commutatif. Le neutre pour $\otimes$ est
      $\varphi(1)=1+7=8$ — vérification : $x\otimes8=8x-7x-56+56=x$, pour
      tout $x\in\mathbb{R}$.

  - id: SA-34
    rung: "R7"
    habilete: synthese
    difficulty_level: 4
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, isomorphisme, transport, anneau, corps, matrices]
    stem: |
      On pose $E=\mathbb{Q}(\sqrt5)=\{x+y\sqrt5 \mid (x,y)\in\mathbb{Q}^2\}$,
      muni de $+$ et $\times$ usuels, et
      $F=\left\{N(x,y)=\begin{pmatrix}x&5y\\y&x\end{pmatrix} \middle|
      (x,y)\in\mathbb{Q}^2\right\}$, muni de $+$ et $\times$ usuels des
      matrices. On admet que $(E,+,\times)$ est un corps commutatif, et que
      $\psi:E\to F$, $\psi(x+y\sqrt5)=N(x,y)$, vérifie
      $\psi(z+z')=\psi(z)+\psi(z')$ et $\psi(z\times z')=\psi(z)\times\psi(z')$
      pour tous $z,z'\in E$, et que $\psi$ est bijective. Quels sont, dans
      $(F,+,\times)$, l'élément neutre pour $\times$ et le symétrique de
      $N(2,1)$ pour $\times$ — et que peut-on en conclure sur $(F,+,\times)$ ?
    type: mcq
    choices:
      - id: A
        text: |
          $N(1,0)$ pour le neutre, $N(-2,1)$ pour le symétrique de
          $N(2,1)$ : $\psi$ transporte d'un coup, depuis le corps commutatif
          $(E,+,\times)$, toute la structure de $(F,+,\times)$, qui est donc
          lui aussi un corps commutatif.
        correct: true
      - id: B
        text: |
          $1$ pour le neutre, laissé tel quel comme celui de $E$ sans lui
          appliquer $\psi$ ; $N(-2,1)$ pour le symétrique de $N(2,1)$ ;
          $(F,+,\times)$ est un corps commutatif.
        correct: false
        misconception: mc.math.structures_algebriques.neutre-non-transporte
        feedback: |
          Modèle détecté : le neutre gardé tel quel d'une structure à
          l'autre. $1$ n'est même pas un élément de $F$ (ce n'est pas une
          matrice) : le neutre de $F$ est l'image par $\psi$ du neutre $1$
          de $E$, soit $\psi(1)=N(1,0)$.
      - id: C
        text: |
          $N(1,0)$ pour le neutre, $N(-2,1)$ pour le symétrique de
          $N(2,1)$ ; mais cela ne suffit qu'à un anneau, faute d'avoir
          vérifié que chaque $N(x,y)$ non nul de $F$ soit inversible pour
          $\times$.
        correct: false
        misconception: mc.math.structures_algebriques.groupe-anneau
        feedback: |
          Modèle détecté : la structure de corps mise en doute alors qu'elle
          se transporte. $(E,+,\times)$ est un corps : chaque élément non
          nul y est inversible pour $\times$. L'isomorphisme $\psi$
          transporte cette propriété d'un coup à $(F,+,\times)$, exactement
          comme il transporte le neutre ou le symétrique — rien de plus à
          vérifier au cas par cas.
      - id: D
        text: |
          $N(1,0)$ pour le neutre, et ce même $N(1,0)$ pour le symétrique de
          $N(2,1)$, ce rôle lui revenant déjà ; $(F,+,\times)$ est un corps
          commutatif.
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: |
          Modèle détecté : le symétrique confondu avec le neutre. Le neutre
          $N(1,0)$ est unique et ne change rien à personne
          ($N(2,1)\times N(1,0) = N(2,1)$) ; le symétrique de $N(2,1)$, lui,
          dépend de $N(2,1)$ et doit redonner ce neutre par produit — c'est
          $N(-2,1)$, pas $N(1,0)$.
    correct_feedback: |
      $\psi$ respecte les deux lois et est bijective : c'est un isomorphisme
      qui transporte d'un coup la structure de corps commutatif de $E$ vers
      $F$. Neutre : $\psi(1)=N(1,0)$. Symétrique de $N(2,1)$ : l'antécédent
      est $2+\sqrt5$, dont l'inverse dans $E$ est $-2+\sqrt5$ (rationalisé :
      $\frac{1}{2+\sqrt5}=\frac{2-\sqrt5}{4-5}=-2+\sqrt5$), d'image
      $N(-2,1)$.
    solution: |
      Neutre de $\times$ dans $E$ : $1=1+0\sqrt5$. Son image :
      $$e_F=\psi(1)=N(1,0)=\begin{pmatrix}1&0\\0&1\end{pmatrix}$$
      Symétrique de $N(2,1)$ : on cherche d'abord l'inverse, dans $E$, de
      l'antécédent $z=2+\sqrt5$ :
      $$\frac{1}{2+\sqrt5} = \frac{2-\sqrt5}{(2+\sqrt5)(2-\sqrt5)} =
      \frac{2-\sqrt5}{4-5} = -2+\sqrt5$$
      Son image par $\psi$ :
      $$\psi(-2+\sqrt5) = N(-2,1) = \begin{pmatrix}-2&5\\1&-2\end{pmatrix}$$
      Vérification directe (produit matriciel) :
      $$N(2,1)\times N(-2,1) = \begin{pmatrix}2&5\\1&2\end{pmatrix}
      \begin{pmatrix}-2&5\\1&-2\end{pmatrix} =
      \begin{pmatrix}-4+5&10-10\\-2+2&5-4\end{pmatrix} =
      \begin{pmatrix}1&0\\0&1\end{pmatrix} = N(1,0)$$
      $\psi$ respecte $+$ et $\times$, et est bijective : c'est un
      isomorphisme à deux lois. $(E,+,\times)$ étant un corps commutatif,
      $(F,+,\times)$ l'est aussi — neutre, symétriques et inversibilité de
      tout élément non nul compris, sans qu'il y ait eu à re-développer ces
      propriétés directement sur les matrices.

  # ── loi définie par une formule, second passage (dette d'examen, vague
  # B1, 2026-09-27 — docs/audits/dette-examen/maths.md, § structures-
  # algebriques, GAP-B « A law defined by a formula : symbolic
  # associativity, neutral by identification, symmetric by solving ») ──
  # Le geste est déjà servi par SA-13 (associativité, x⋆y=x+y+1), SA-23/-24
  # (neutre puis symétrique, x⋆y=x+y-xy) ; la prose de R2 (lesson.md:164-201)
  # travaille une TROISIÈME loi, x∗y=x+y+xy sur R\{-1}. SA-35 utilise une
  # QUATRIÈME loi : x∗y=x+y+3xy sur R\{-1/3} (WAVE F, 2026-09-28 — §35/§36
  # de DECISIONS-EN-ATTENTE.md : la loi précédente, x∗y=x+y-2xy sur R\{1/2},
  # ÉTAIT le sujet 2025 SM lui-même — bank.yaml, bk-2025-n-x4 q2/q5/q6 —
  # malgré le commentaire d'origine qui l'annonçait « jamais réutilisée » ;
  # ni cette loi ni le coefficient $3$ ne recoupent aucun autre bank.yaml de
  # maths, grep vérifié). Stabilité vérifiée à la main par le même procédé
  # que la leçon (poser $\varphi(x)=1+3x$ :
  # $\varphi(x\ast y)=\varphi(x)\varphi(y)$, donc $\varphi(x\ast y)\neq0$
  # dès que $\varphi(x)\neq0$ et $\varphi(y)\neq0$). Neutre $0$, symétrique
  # de $x$ égal à $-x/(1+3x)$.
  # Aucune misconception neuve : le piège « une seule valeur de x » nommé
  # par la leçon (lesson.md:194) n'était encore porté par AUCUN item — ici
  # distracteur B, `generalisation-hative`. Le second distracteur demandé
  # par la tâche (neutre habituel 0/1 supposé sans vérifier) est une
  # variante zéro-exemple de la même famille (distracteur C, même id) ; le
  # troisième (symétrique confondu avec le neutre) reprend
  # `neutre-vs-symetrique` tel quel, cette fois pour une question sur le
  # NEUTRE plutôt que sur le symétrique (distracteur D).
  # WAVE F, même relecture : les quatre options s'annonçaient elles-mêmes
  # (« on teste seulement… », « on suppose, par ressemblance…, sans
  # vérifier », et la clé seule ajoutait « valable pour tout x, pas pour un
  # cas isolé ») — un élève pouvait repérer la bonne réponse au REGISTRE de
  # la phrase, sans faire le calcul. Les quatre sont réécrites dans un même
  # registre neutre (« on résout l'équation … : elle s'écrit … , d'où … ») ;
  # seule la clé utilise un $x$ générique, les distracteurs un $x$ concret
  # ou une affirmation non vérifiée — la différence est dans les
  # MATHÉMATIQUES, plus dans le vocabulaire. La référence « chapitre 2 »
  # de l'ancien distracteur B pour l'associativité était fausse dans cette
  # notion (R2 = chapitre 3, deux `## ` avant lui) ; corrigée.
  - id: SA-35
    rung: "R2"
    habilete: application_directe
    difficulty_level: 3
    skill_code: maths_structures_alg
    tags: [misconception_driven, maths_structures_alg, neutre, formule]
    stem: >
      On munit $E=\mathbb{R}\setminus\left\{-\dfrac13\right\}$ de la loi
      $\ast$ définie, pour tous $x,y\in E$, par $x\ast y = x+y+3xy$. Quel
      raisonnement établit correctement l'élément neutre de $(E,\ast)$ ?
    type: mcq
    choices:
      - id: A
        text: |
          On résout l'équation $x\ast e=x$ pour $x$ quelconque de $E$ :
          elle s'écrit $e(1+3x)=0$, donc $e=0$ car $1+3x$ ne s'annule pas
          sur $E$.
        correct: true
      - id: B
        text: |
          On résout l'équation $2\ast e=2$ : elle s'écrit
          $e(1+3\times2)=0$, d'où $e=0$, qui est l'élément neutre de
          $(E,\ast)$.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Modèle détecté : un cas particulier généralisé. L'équation
          $e(1+3\times2)=0$ ne concerne que $x=2$ ; qu'elle donne $e=0$ ne
          prouve rien pour les autres éléments de $E$ — il faut reprendre
          la résolution avec $x$ quelconque, sans lui donner de valeur,
          exactement comme pour l'associativité testée sur un seul triplet
          (chapitre 3).
      - id: C
        text: |
          La loi $\ast$ contient un terme en $xy$, comme la multiplication
          usuelle : l'élément neutre de $(E,\ast)$ est donc $1$.
        correct: false
        misconception: mc.math.structures_algebriques.generalisation-hative
        feedback: |
          Modèle détecté : une propriété supposée par ressemblance, sans
          aucun cas vérifié — un degré de moins que se tromper sur un seul
          exemple. $1$ échoue dès le premier essai : $2\ast1=2+1+6=9\neq2$.
          Une propriété universelle ne se déduit pas d'une ressemblance
          avec une loi usuelle : elle se démontre pour $x$ quelconque ou se
          vérifie exhaustivement.
      - id: D
        text: |
          On résout l'équation $2\ast x'=0$ : elle s'écrit
          $x'(1+3\times2)=-2$, d'où $x'=-\dfrac27$, qui est l'élément
          neutre de $(E,\ast)$.
        correct: false
        misconception: mc.math.structures_algebriques.neutre-vs-symetrique
        feedback: |
          Modèle détecté : le symétrique confondu avec le neutre.
          $-\frac27$ est le SYMÉTRIQUE de $2$ (il dépend de $2$), pas le
          neutre, qui est unique et ne dépend d'aucun élément particulier :
          $-\frac27$ ne redonne pas $x$ dans $x\ast\left(-\frac27\right)$
          pour un autre $x$ quelconque, contrairement au vrai neutre $0$.
    correct_feedback: |
      Exact : l'équation $x\ast e=x$ se résout pour $x$ générique —
      $e(1+3x)=0$ pour tout $x$ de $E$ impose $e=0$, puisque $1+3x$ est
      non nul sur $E=\mathbb{R}\setminus\{-\frac13\}$. Vérification :
      $x\ast0=x+0+0=x$.
    solution: |
      On résout, pour tout $x\in E$ :
      $$x\ast e=x \iff x+e+3xe=x \iff e(1+3x)=0$$
      Comme cette égalité doit tenir pour tout $x$ de $E$ (et $1+3x$ est
      non nul, puisque $x\neq-\frac13$), il faut $e=0$. Vérification :
      $x\ast0=x+0+3x\times0=x$, pour tout $x$. L'élément neutre est $0$.

      **Pourquoi les distracteurs échouent.** Tester un seul $x$ (ici
      $x=2$) redonne $e=0$ par coïncidence, mais ne prouve rien pour les
      autres éléments — c'est la méthode, pas le nombre, qui est en cause.
      Supposer $e=1$ par analogie avec la multiplication usuelle échoue dès
      le premier test : $2\ast1=9\neq2$. Et $-\frac27$, trouvé en résolvant
      $2\ast x'=0$, est le symétrique de $2$, pas le neutre de la loi.

