notion: nombres-complexes-1
skill_code: maths_complexes_algebrique
misconceptions: []
items:
  - id: NBCOMPLEX-1
    rung: "R1"
    difficulty_level: 1
    skill_code: maths_complexes_algebrique
    tags: ["forme-algebrique", "partie-imaginaire"]
    stem: >
      Quelle est la partie imaginaire de $z = 3 - 5i$ ?
    type: mcq
    choices:
      - id: A
        text: "$-5$"
        correct: true
      - id: B
        text: "$-5i$"
        correct: false
        feedback: >
          La partie imaginaire $\text{Im}(z)$ est un nombre RÉEL — c'est le
          coefficient de $i$, pas le terme "$bi$" tout entier. Ici ce
          coefficient est $-5$, pas $-5i$.
      - id: C
        text: "$5$"
        correct: false
        feedback: >
          Erreur de signe : tu as oublié le signe négatif devant le $5i$.
          Dans $z=a+bi$, la partie imaginaire garde le signe de $b$ ; ici
          $b=-5$, pas $5$.
      - id: D
        text: "$3$"
        correct: false
        feedback: >
          Tu as donné la partie RÉELLE ($a=3$), pas la partie imaginaire.
          La partie imaginaire est le coefficient de $i$, c'est-à-dire $-5$.
    correct_feedback: >
      Exact — la partie imaginaire est le nombre réel qui multiplie $i$, ici
      $-5$ (et non $-5i$).
    solution: |
      Pour $z=a+bi$ avec $z=3-5i$, on a $a=3$ et $b=-5$. Par définition,
      $\text{Re}(z)=a=3$ et $\text{Im}(z)=b=-5$ (un nombre réel, sans le
      $i$).

  - id: NBCOMPLEX-2
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_algebrique
    tags: ["produit", "i-carre"]
    stem: >
      Calculer le produit $(3+2i)(1-4i)$ sous forme algébrique.
    type: mcq
    choices:
      - id: A
        text: "$11 - 10i$"
        correct: true
      - id: B
        text: "$-5 - 10i$"
        correct: false
        feedback: >
          Tu as utilisé $i^2=+1$ au lieu de $i^2=-1$ — c'est l'erreur
          inverse de la bonne règle. Le terme $-8i^2$ devient $+8$ (puisque
          $i^2=-1$), pas $-8$ : c'est ce qui change le signe de la partie
          réelle.
      - id: C
        text: "$4 - 2i$"
        correct: false
        feedback: >
          Tu as additionné les deux nombres au lieu de les multiplier. La
          question demande un PRODUIT : il faut développer
          $(3+2i)(1-4i)$ comme un produit de deux binômes, pas simplement
          additionner terme à terme.
      - id: D
        text: "$11 + 10i$"
        correct: false
        feedback: >
          Erreur de signe dans le regroupement des termes en $i$ :
          $12i - 2i = 10i$, avec un signe MOINS devant le $2i$ (le second
          facteur est $1-4i$, donc $3\times(-4i)=-12i$ et
          $2i\times 1=+2i$, ce qui donne $-12i+2i=-10i$), pas $+10i$.
    correct_feedback: >
      Bien vu : en développant, $(3+2i)(1-4i) = 3-12i+2i-8i^2$, puis en
      remplaçant $i^2$ par $-1$, on obtient $3-10i+8 = 11-10i$.
    solution: |
      $$(3+2i)(1-4i) = 3\times 1 + 3\times(-4i) + 2i\times 1 + 2i\times(-4i)$$
      $$= 3 - 12i + 2i - 8i^2$$
      En remplaçant $i^2$ par $-1$ :
      $$= 3 - 10i + 8 = 11 - 10i$$

  - id: NBCOMPLEX-3
    rung: "R3"
    difficulty_level: 2
    skill_code: maths_complexes_algebrique
    tags: ["conjugue", "propriete"]
    stem: >
      Pour un nombre complexe $z=a+bi$ (avec $a,b$ réels), que vaut
      $z + \overline{z}$ ?
    type: mcq
    choices:
      - id: A
        text: "$2a$"
        correct: true
      - id: B
        text: "$2bi$"
        correct: false
        feedback: >
          C'est $z - \overline{z}$ que tu calcules là (qui vaut
          effectivement $2bi$), pas $z + \overline{z}$. Dans la SOMME, ce
          sont les parties imaginaires qui s'annulent ($bi$ et $-bi$), pas
          les parties réelles.
      - id: C
        text: "$0$"
        correct: false
        feedback: >
          $z$ et son conjugué ne s'annulent pas en général. Seule la
          PARTIE IMAGINAIRE s'annule dans la somme ($bi+(-bi)=0$) ; la
          partie réelle, elle, s'additionne deux fois : $a+a=2a$, qui n'est
          nul que si $a=0$.
      - id: D
        text: "$2a + 2bi$"
        correct: false
        feedback: >
          Tu as additionné $a+bi$ et $a-bi$ comme si les deux termes en
          $i$ s'ajoutaient, au lieu de s'annuler. Or $bi + (-bi) = 0$ : le
          résultat ne contient donc plus aucun $i$.
    correct_feedback: >
      Exact : $z+\overline{z} = (a+bi)+(a-bi) = 2a$, un nombre réel — c'est
      toujours le double de la partie réelle.
    solution: |
      $$z + \overline{z} = (a+bi) + (a-bi) = 2a = 2\,\text{Re}(z)$$
      Les termes en $i$ s'annulent ($bi-bi=0$), il ne reste que le double
      de la partie réelle.

  - id: NBCOMPLEX-4
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_algebrique
    tags: ["quotient", "conjugue"]
    stem: >
      Calculer $\dfrac{1+i}{2-i}$ sous forme algébrique.
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{1}{5} + \\dfrac{3}{5}i$"
        correct: true
      - id: B
        text: "$\\dfrac{1}{5} + \\dfrac{1}{5}i$"
        correct: false
        feedback: >
          Tu as multiplié le dénominateur par son conjugué, mais oublié de
          multiplier aussi le NUMÉRATEUR par la même quantité. Le conjugué
          doit multiplier haut ET bas, sinon la valeur de l'expression
          change.
      - id: C
        text: "$\\dfrac{3}{5} + \\dfrac{3}{5}i$"
        correct: false
        feedback: >
          Erreur de signe dans le développement du numérateur : tu as
          traité $i^2$ comme $+1$ au lieu de $-1$. En reprenant
          $(1+i)(2+i)=2+i+2i+i^2$ avec $i^2=-1$, on obtient $1+3i$, pas
          $3+3i$.
      - id: D
        text: "$\\dfrac{1}{2} - \\dfrac{3}{2}i$"
        correct: false
        feedback: >
          Tu as calculé l'inverse de la fraction demandée (c'est-à-dire
          $\frac{2-i}{1+i}$) au lieu de $\frac{1+i}{2-i}$. Relis bien lequel
          est au numérateur et lequel est au dénominateur avant de choisir
          le conjugué à utiliser.
    correct_feedback: >
      Exact : en multipliant haut et bas par $\overline{2-i}=2+i$, le
      dénominateur devient $2^2+1^2=5$ et le numérateur devient
      $(1+i)(2+i)=1+3i$, d'où $\frac{1}{5}+\frac{3}{5}i$.
    solution: |
      $$\frac{1+i}{2-i} = \frac{(1+i)(2+i)}{(2-i)(2+i)}$$
      Le dénominateur : $(2-i)(2+i) = 2^2+1^2 = 5$.
      Le numérateur : $(1+i)(2+i) = 2+i+2i+i^2 = 2+3i-1 = 1+3i$.
      $$\frac{1+i}{2-i} = \frac{1+3i}{5} = \frac{1}{5}+\frac{3}{5}i$$

  - id: NBCOMPLEX-5
    rung: "R4"
    difficulty_level: 2
    skill_code: maths_complexes_algebrique
    tags: ["module"]
    stem: >
      Calculer le module de $z = -3+4i$.
    type: mcq
    choices:
      - id: A
        text: "$5$"
        correct: true
      - id: B
        text: "$1$"
        correct: false
        feedback: >
          Tu as additionné directement la partie réelle et la partie
          imaginaire ($-3+4=1$) au lieu d'appliquer la formule
          $|z|=\sqrt{a^2+b^2}$. Le module n'est pas une simple somme des
          coordonnées.
      - id: C
        text: "$7$"
        correct: false
        feedback: >
          Tu as additionné les valeurs absolues de $a$ et $b$
          ($3+4=7$). Mais le module combine les deux coordonnées par une
          somme de CARRÉS sous une racine, pas par simple addition — les
          deux ne coïncident que dans des cas particuliers.
      - id: D
        text: "$25$"
        correct: false
        feedback: >
          Tu as calculé $a^2+b^2=9+16=25$ mais oublié de prendre la racine
          carrée. Le module est $\sqrt{a^2+b^2}$, donc $\sqrt{25}=5$, pas
          $25$.
    correct_feedback: >
      Exact : $|z| = \sqrt{(-3)^2+4^2} = \sqrt{9+16} = \sqrt{25} = 5$.
    solution: |
      $$|z| = \sqrt{a^2+b^2} = \sqrt{(-3)^2+4^2} = \sqrt{9+16} = \sqrt{25} = 5$$

  - id: NBCOMPLEX-6
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_complexes_algebrique
    tags: ["affixe", "distance", "geometrie"]
    stem: >
      Soient $A$ et $B$ les points d'affixes respectives $z_A = 2+5i$ et
      $z_B = 6+2i$. Calculer la distance $AB$.
    type: mcq
    choices:
      - id: A
        text: "$5$"
        correct: true
      - id: B
        text: "$2\\sqrt{10}$"
        correct: false
        feedback: >
          Tu as calculé $|z_B|$ (la distance de $B$ à l'origine), pas
          $|z_B-z_A|$ (la distance entre $A$ et $B$). Il faut d'abord
          soustraire les deux affixes avant de prendre le module.
      - id: C
        text: "$7$"
        correct: false
        feedback: >
          Tu as additionné les valeurs absolues des différences de
          coordonnées ($4+3=7$) au lieu d'appliquer Pythagore. La distance
          entre deux points combine les deux différences par une somme de
          carrés sous une racine : $\sqrt{4^2+3^2}=5$, pas $4+3=7$.
      - id: D
        text: "$25$"
        correct: false
        feedback: >
          Tu as calculé $(x_B-x_A)^2+(y_B-y_A)^2 = 16+9=25$ mais oublié la
          racine carrée finale. La distance est $\sqrt{25}=5$, pas $25$.
    correct_feedback: >
      Exact : $AB = |z_B-z_A| = |4-3i| = \sqrt{4^2+3^2} = \sqrt{25} = 5$.
    solution: |
      $$z_B - z_A = (6+2i)-(2+5i) = 4-3i$$
      $$AB = |z_B-z_A| = \sqrt{4^2+(-3)^2} = \sqrt{16+9} = \sqrt{25} = 5$$
