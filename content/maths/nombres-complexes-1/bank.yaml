    intro: |-
      **Nombres complexes (examen national, session normale 2024, Sciences Expérimentales).**

      Dans le plan complexe rapporté à un repère orthonormé direct $(O,\vec{u},\vec{v})$, on considère les points $A$ et $B$ d'affixes respectives

      $$a = \sqrt{3}(1-i), \qquad b = 2 + \sqrt{3} + i.$$
    questions:
      - id: q1
        part: "Module et argument de a"
        stem: |-
          **(0,5 pt)** Vérifier que $|a| = \sqrt{6}$ et que $\arg(a) \equiv \dfrac{-\pi}{4}\ [2\pi]$
        reasoning: |-
          On calcule le module et l'argument de $a=\sqrt3(1-i)$ directement depuis la forme algébrique. Une astuce : $a$ est le produit d'un réel positif $\sqrt3$ et de $1-i$, un nombre d'angle remarquable — le module se factorise ($|a|=\sqrt3\times|1-i|$, chapitre 5, car le module d'un produit est le produit des modules) et un facteur réel positif ne change pas l'argument (propriété au-delà du socle des chapitres 2 à 8, déjà utilisée ailleurs dans cette banque).
        steps:
          - math: '|1-i| = \sqrt{1^2+(-1)^2} = \sqrt2'
            note: "Module de 1 moins i, chapitre 5."
          - math: '|a| = |\sqrt3(1-i)| = \sqrt3\times\sqrt2 = \sqrt6'
            note: "Module d'un produit = produit des modules ; racine de 3 fois racine de 2 = racine de 6."
          - math: '\arg(1-i) = -\dfrac{\pi}{4}'
            note: "Argument de 1 moins i, angle remarquable."
          - math: '\sqrt3>0 \implies \arg(a) = \arg(1-i) = -\dfrac{\pi}{4}\ [2\pi]'
            note: "Un facteur réel positif ne change pas l'argument."
      - id: q2
        part: "Le quotient b/a, sous deux formes"
        stem: |-
          **(0,75 pt)** Montrer que $\dfrac{b}{a} = \dfrac{3 + \sqrt{3}}{6} + \left(\dfrac{1 + \sqrt{3}}{2}\right)i$ puis vérifier que $\dfrac{b}{a} = \dfrac{3 + \sqrt{3}}{3}e^{i\frac{\pi}{3}}$
        reasoning: |-
          Pour le quotient $\dfrac{b}{a}$, on multiplie haut et bas par $\overline{a}$ (chapitre 4, l'outil pour diviser), puisque $a\overline{a}=|a|^2$ est réel. On développe soigneusement, en gardant les fractions exactes plutôt que de passer au décimal, jusqu'à retrouver la forme algébrique annoncée.

          Pour la seconde forme, on reconnaît que $\dfrac{3+\sqrt3}{3}$ est un module (réel positif) et $e^{i\pi/3}$ une forme exponentielle d'angle remarquable — on développe cette dernière en algébrique et on vérifie qu'elle coïncide avec le résultat déjà trouvé.
        steps:
          - math: '\dfrac{b}{a} = \dfrac{b\,\overline{a}}{a\,\overline{a}} = \dfrac{b\,\overline{a}}{|a|^2} = \dfrac{b\,\overline{a}}{6}'
            note: "On multiplie haut et bas par a barre ; le module de a au carré vaut 6 (question 1)."
          - math: '\overline{a} = \sqrt3(1+i), \qquad b\,\overline{a} = (2+\sqrt3+i)\sqrt3(1+i)'
            note: "Conjugué de a ; on développe le produit avec b."
          - math: '(2+\sqrt3+i)(1+i) = (2+\sqrt3) + i(2+\sqrt3) + i + i^2 = (1+\sqrt3) + i(3+\sqrt3)'
            note: "On développe et on remplace i carré par -1."
          - math: 'b\,\overline{a} = \sqrt3\left[(1+\sqrt3)+i(3+\sqrt3)\right] = (\sqrt3+3) + i(3\sqrt3+3)'
            note: "On distribue racine de 3."
          - math: '\dfrac{b}{a} = \dfrac{(\sqrt3+3)+i(3\sqrt3+3)}{6} = \dfrac{3+\sqrt3}{6} + i\,\dfrac{3\sqrt3+3}{6} = \dfrac{3+\sqrt3}{6} + i\,\dfrac{1+\sqrt3}{2}'
            note: "On divise par 6 et on simplifie chaque partie."
          - math: '\dfrac{3+\sqrt3}{3}e^{i\pi/3} = \dfrac{3+\sqrt3}{3}\left(\dfrac12+i\dfrac{\sqrt3}{2}\right) = \dfrac{3+\sqrt3}{6} + i\,\dfrac{(3+\sqrt3)\sqrt3}{6} = \dfrac{3+\sqrt3}{6}+i\,\dfrac{1+\sqrt3}{2}'
            note: "On développe l'autre écriture : mêmes parties réelle et imaginaire."
      - id: q3
        stem: |-
          **(0,75 pt)** En déduire une forme trigonométrique du complexe $b$ puis vérifier que $b^{24}$ est un nombre réel.
        reasoning: |-
          On repart du résultat précédent, $\dfrac{b}{a}=\dfrac{3+\sqrt3}{3}e^{i\pi/3}$, donc $b = a\times\dfrac{3+\sqrt3}{3}e^{i\pi/3}$ — un produit dont on connaît module et argument de chaque facteur (chapitre 5, au-delà du socle formel : module d'un produit = produit des modules, argument d'un produit = somme des arguments). On calcule $|b|$ et $\arg(b)$ à partir de $|a|=\sqrt6$, $\arg(a)=-\dfrac{\pi}{4}$ (question 1).

          Une fois $b$ écrit en forme trigonométrique (module $r$, argument $\theta$), $b^{24}$ a pour module $r^{24}$ et pour argument $24\theta$ (élever à une puissance multiplie l'argument par cette puissance). Si $24\theta$ tombe sur un multiple de $2\pi$, l'argument de $b^{24}$ est nul modulo $2\pi$ : $b^{24}$ est un réel — et même positif, puisque son module est positif.
        steps:
          - math: '|b| = |a|\times\dfrac{3+\sqrt3}{3} = \sqrt6\times\dfrac{3+\sqrt3}{3} = \dfrac{3\sqrt6+\sqrt{18}}{3} = \dfrac{3\sqrt6+3\sqrt2}{3} = \sqrt6+\sqrt2'
            note: "Module d'un produit ; racine de 18 se simplifie en 3 racine de 2."
          - math: '\arg(b) = \arg(a) + \dfrac{\pi}{3} = -\dfrac{\pi}{4}+\dfrac{\pi}{3} = \dfrac{-3\pi+4\pi}{12} = \dfrac{\pi}{12}'
            note: "Argument d'un produit = somme des arguments."
          - math: 'b = (\sqrt6+\sqrt2)\left(\cos\dfrac{\pi}{12}+i\sin\dfrac{\pi}{12}\right)'
            note: "Forme trigonométrique de b."
          - math: '|b^{24}| = (\sqrt6+\sqrt2)^{24}, \qquad \arg(b^{24}) = 24\times\dfrac{\pi}{12} = 2\pi \equiv 0\ [2\pi]'
            note: "Puissance 24 : module à la puissance 24, argument multiplié par 24."
          - math: '\arg(b^{24}) \equiv 0\ [2\pi] \implies b^{24} \in \mathbb{R}'
            note: "Argument nul modulo deux pi : b puissance 24 est réel, et positif."
      - id: q4
        part: "Trois rotations en chaîne : R(A), R(A′), R(B)"
        stem: |-
          Soit $R$ la rotation de centre $O$ et d'angle $\dfrac{\pi}{6}$, qui transforme chaque point $M$ du plan d'affixe $z$ en un point $M'$ d'affixe $z'$. On pose $R(B) = B'$, $R(A) = A'$ et $R(A') = A''$

          **(0,5 pt)** Vérifier que $z' = \dfrac{1}{2}(\sqrt{3} + i)z$ et que $\arg(a') \equiv \dfrac{-\pi}{12}\ [2\pi]$ où $a'$ est l'affixe du point $A'$
        reasoning: |-
          Une rotation de centre $O$ et d'angle $\theta$ s'écrit $z'=e^{i\theta}z$ (au-delà du socle des chapitres 2 à 8, mobilisé partout dans cette banque). On identifie $e^{i\pi/6}$ à sa forme algébrique, un angle remarquable, pour reconnaître $\dfrac12(\sqrt3+i)$.

          Pour $\arg(a')$ : $A'=R(A)$, donc $a'=e^{i\pi/6}a$, un produit dont l'argument est la somme des arguments (au-delà du socle des chapitres 2 à 8) : $\arg(a)+\dfrac{\pi}{6}$, avec $\arg(a)=-\dfrac{\pi}{4}$ (question 1).
        steps:
          - math: 'z'' = e^{i\pi/6}\,z'
            note: "Rotation de centre O et d'angle pi sur 6 : z prime = e puissance i pi sur 6 fois z."
          - math: 'e^{i\pi/6} = \cos\dfrac{\pi}{6}+i\sin\dfrac{\pi}{6} = \dfrac{\sqrt3}{2}+\dfrac12 i'
            note: "Forme algébrique de l'exponentielle, angle remarquable pi sur 6."
          - math: '\dfrac12(\sqrt3+i) = \dfrac{\sqrt3}{2}+\dfrac12 i = e^{i\pi/6} \implies z'' = \dfrac12(\sqrt3+i)z'
            note: "Un demi fois (racine de 3 + i) a la même forme algébrique que e puissance i pi sur 6 : la rotation s'écrit bien ainsi."
          - math: 'a'' = e^{i\pi/6}a \implies \arg(a'') = \arg(a) + \dfrac{\pi}{6}'
            note: "A prime est l'image de A par R, donc a prime = e puissance i pi sur 6 fois a ; argument d'un produit = somme des arguments."
          - math: '\arg(a'') = -\dfrac{\pi}{4}+\dfrac{\pi}{6} = \dfrac{-3\pi+2\pi}{12} = -\dfrac{\pi}{12}'
            note: "On reporte l'argument de a, moins pi sur 4 (question 1)."
      - id: q5
        stem: |-
          **(0,5 pt)** Montrer que l'affixe du point $A''$ est $a'' = \sqrt{6}\,e^{i\frac{\pi}{12}}$ et en déduire que les points $O$, $A''$ et $B$ sont alignés.
        reasoning: |-
          $A''$ est l'image de $A'$ par $R$ : son affixe est $e^{i\pi/6}a'$. Le module d'une rotation ne change pas : $|A''|=|A'|=|A|=\sqrt6$ (deux rotations successives, même centre $O$, conservent chacune la distance à $O$). L'argument s'obtient en ajoutant $\dfrac{\pi}{6}$ à celui de $A'$ trouvé à la question précédente, $-\dfrac{\pi}{12}$, ce qui donne $\dfrac{\pi}{12}$.

          Pour l'alignement : deux points vus depuis $O$ sont alignés avec $O$ si les vecteurs qui les rejoignent depuis $O$ sont colinéaires, c'est-à-dire si leurs affixes ont le même argument (l'argument n'est pas enseigné dans cette leçon : voir « Nombres complexes — forme trigonométrique et applications »). Or $\arg(b)=\dfrac{\pi}{12}$ (question 3) est exactement l'argument trouvé pour $A''$ : les deux vecteurs pointent dans la même direction depuis $O$.
        steps:
          - math: '\left|e^{i\pi/6}\,a''\right| = |a''| = |a| = \sqrt6'
            note: "Deux rotations successives conservent le module : celui du point deux fois tourné vaut le module de a, racine de 6."
          - math: '\arg\!\left(e^{i\pi/6}a''\right) = \arg(a'') + \dfrac{\pi}{6} = -\dfrac{\pi}{12}+\dfrac{\pi}{6} = \dfrac{\pi}{12}'
            note: "On ajoute pi sur 6 à l'argument de a prime, moins pi sur 12 (question précédente)."
          - math: '\sqrt6\,e^{i\pi/12} = \sqrt6\left(\cos\dfrac{\pi}{12}+i\sin\dfrac{\pi}{12}\right)'
            note: "Module racine de 6, argument pi sur 12 : c'est exactement l'affixe annoncée pour le point deux fois tourné."
          - math: '\arg(b) = \dfrac{\pi}{12} = \arg\!\left(\sqrt6\,e^{i\pi/12}\right)'
            note: "L'argument de b (question 3) est le même que celui de l'affixe trouvée : les deux vecteurs depuis O pointent dans la même direction."
          - math: '\dfrac{\sqrt6\,e^{i\pi/12}}{b} \in \mathbb{R}_{+}^{*}'
            note: "Rapport réel strictement positif entre les deux affixes : les vecteurs sont colinéaires, donc les trois points sont alignés."
      - id: q6
        stem: |-
          **(0,5 pt)** Montrer que $b'$, l'affixe du point $B'$, vérifie $b' = \left(\dfrac{3 + \sqrt{3}}{3}\right)\overline{a}$
        reasoning: |-
          On calcule le module et l'argument de $b'=R(B)$ séparément, puis on les compare à ceux de $\dfrac{3+\sqrt3}{3}\overline{a}$, pour montrer que les deux nombres coïncident — plutôt que de manipuler l'expression algébriquement, ce qui serait un calcul assez lourd.

          Le module : une rotation conserve le module, donc $|b'|=|b|=\sqrt6+\sqrt2$ (question 3). Côté droit, $|\overline a|=|a|=\sqrt6$ (chapitre 5 : conjuguer ne change pas le module), donc $\left|\dfrac{3+\sqrt3}{3}\overline a\right| = \dfrac{3+\sqrt3}{3}\sqrt6$ — un calcul qui, développé, redonne $\sqrt6+\sqrt2$.

          L'argument : $\arg(b')=\arg(b)+\dfrac{\pi}{6}$ (rotation d'angle $\pi/6$), avec $\arg(b)=\dfrac{\pi}{12}$ (question 3), donc $\arg(b')=\dfrac{\pi}{4}$. Côté droit, $\arg(\overline a) = -\arg(a) = \dfrac{\pi}{4}$ (conjuguer change le signe de l'argument — le chapitre 8 n'en donne que la symétrie axiale ; l'argument est dans « Nombres complexes — forme trigonométrique et applications »), et le facteur $\dfrac{3+\sqrt3}{3}$ étant réel positif, ne change pas l'argument. Les deux membres ont même module et même argument : ils sont égaux.
        steps:
          - math: '|b''| = |b| = \sqrt6+\sqrt2'
            note: "Une rotation conserve le module ; le module de b vaut racine de 6 plus racine de 2 (question 3)."
          - math: '\left|\dfrac{3+\sqrt3}{3}\,\overline{a}\right| = \dfrac{3+\sqrt3}{3}\,|a| = \dfrac{3+\sqrt3}{3}\sqrt6 = \sqrt6+\sqrt2'
            note: "Le module de a barre vaut celui de a, racine de 6 (chapitre 5) ; on redéveloppe comme à la question 3 pour retrouver racine de 6 plus racine de 2."
          - math: '\arg(b'') = \arg(b) + \dfrac{\pi}{6} = \dfrac{\pi}{12}+\dfrac{\pi}{6} = \dfrac{\pi}{4}'
            note: "Rotation d'angle pi sur 6 appliquée à B ; l'argument de b vaut pi sur 12 (question 3)."
          - math: '\arg(\overline{a}) = -\arg(a) = \dfrac{\pi}{4}, \quad \dfrac{3+\sqrt3}{3}>0'
            note: "Conjuguer change le signe de l'argument (forme trigonométrique) ; le coefficient réel positif ne le change pas."
          - math: '|b''| = \left|\dfrac{3+\sqrt3}{3}\overline{a}\right| \ \text{et} \ \arg(b'') = \arg\!\left(\dfrac{3+\sqrt3}{3}\overline{a}\right) \implies b'' = \dfrac{3+\sqrt3}{3}\overline{a}'
            note: "Même module et même argument : les deux nombres sont égaux."
      - id: q7
        stem: |-
          **(0,5 pt)** En déduire que le triangle $OAB'$ est rectangle en $O$
        reasoning: |-
          L'angle en $O$ du triangle $OAB'$ est l'argument du quotient $\dfrac{b'}{a}$ (au-delà du socle des chapitres 2 à 8, déjà mobilisé pour les angles orientés dans cette banque) : $\arg\!\left(\dfrac{b'}{a}\right) = \arg(b')-\arg(a)$. On a $\arg(b')=\dfrac{\pi}{4}$ (question précédente) et $\arg(a)=-\dfrac{\pi}{4}$ (question 1) : la différence tombe exactement sur $\dfrac{\pi}{2}$, un angle droit.
        steps:
          - math: '\left(\overrightarrow{OA},\ \overrightarrow{OB''}\right) \equiv \arg\!\left(\dfrac{b''}{a}\right) = \arg(b'')-\arg(a)\ [2\pi]'
            note: "L'angle en O est l'argument du quotient des affixes des deux vecteurs issus de O."
          - math: '\arg(b'') - \arg(a) = \dfrac{\pi}{4} - \left(-\dfrac{\pi}{4}\right) = \dfrac{\pi}{2}'
            note: "On reporte l'argument de b prime, pi sur 4 (question précédente), et celui de a, moins pi sur 4 (question 1)."
          - math: '\left(\overrightarrow{OA},\ \overrightarrow{OB''}\right) \equiv \dfrac{\pi}{2}\ [2\pi] \implies OAB'' \ \text{rectangle en}\ O'
            note: "Angle droit en O : le triangle est rectangle en O."

