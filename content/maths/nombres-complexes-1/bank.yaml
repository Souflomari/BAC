        mobilise en plus une homothétie de rapport réel, au-delà du socle
        R1–R5 formel.
    intro: |-
      **Nombres complexes (examen national, session normale 2021, Sciences Expérimentales).**
    questions:
      - id: q1
        part: "Une équation du second degré dans ℂ"
        stem: |-
          **(0,75 pt)** Résoudre dans l'ensemble $\mathbb{C}$ des nombres complexes, l'équation : $z^2 - \sqrt{3}z + 1 = 0$
        reasoning: |-
          Coefficients réels, discriminant à calculer (même réflexe qu'à chaque équation du second degré dans $\mathbb{C}$) : ici $\Delta$ est strictement négatif, donc on écrit $\sqrt\Delta$ avec $i$, et les deux solutions sont conjuguées. Garde en tête l'une d'elles : elle réapparaît juste après comme le nombre $a$ de la question suivante, sous une autre écriture.
        steps:
          - math: '\Delta = (-\sqrt3)^2 - 4\times1\times1 = 3-4 = -1'
            note: "Discriminant de z carré moins racine de 3 z plus 1."
          - math: '\Delta<0 \implies \sqrt\Delta = i'
            note: "Delta négatif : sa racine s'écrit avec i (racine de moins 1 = i)."
          - math: 'z = \dfrac{\sqrt3 \pm i}{2} = \dfrac{\sqrt3}{2} \pm \dfrac{1}{2}i'
            note: "Formule (-b plus ou moins racine de Delta) sur 2a, avec a = 1, b = moins racine de 3."
          - math: 'S = \left\{\, \dfrac{\sqrt3}{2}-\dfrac12 i\ ;\ \dfrac{\sqrt3}{2}+\dfrac12 i \,\right\}'
            note: "Deux solutions conjuguées."
      - id: q2
        part: "Deux nombres complexes, une identité réelle"
        stem: |-
          Soient les nombres complexes $a = e^{i\frac{\pi}{6}}$ et $b = \dfrac{3}{2} + i\dfrac{\sqrt{3}}{2}$

          **(0,25 pt)** Écrire $a$ sous forme algébrique.
        reasoning: |-
          $a$ est donné en forme exponentielle — au-delà du socle des chapitres 2 à 8, déjà signalé pour les autres sujets de cette banque. Passer à la forme algébrique, c'est lire $\cos\dfrac{\pi}{6}$ et $\sin\dfrac{\pi}{6}$, deux valeurs remarquables. (Remarque : c'est exactement l'une des solutions de la question 1, $\dfrac{\sqrt3}{2}+\dfrac12 i$ — le même nombre, sous deux écritures différentes.)
        steps:
          - math: 'a = e^{i\pi/6} = \cos\dfrac{\pi}{6}+i\sin\dfrac{\pi}{6}'
            note: "Passage de la forme exponentielle à la forme trigonométrique."
          - math: 'a = \dfrac{\sqrt3}{2} + \dfrac12 i'
            note: "Valeurs remarquables : cosinus de pi sur 6 = racine de 3 sur 2, sinus de pi sur 6 = un demi."
      - id: q3
        stem: |-
          **(0,5 pt)** Vérifier que $\overline{a}b = \sqrt{3}$
        reasoning: |-
          On calcule $\bar a$ à partir de la forme algébrique de la question précédente (chapitre 4 : on change le signe de la partie imaginaire), puis on développe le produit $\bar a\,b$ et on réduit avec $i^2=-1$ (chapitre 3) — le résultat doit être un réel pur, sans partie en $i$.
        steps:
          - math: '\bar a = \dfrac{\sqrt3}{2} - \dfrac12 i'
            note: "Conjugué de a."
          - math: '\bar a\,b = \left(\dfrac{\sqrt3}{2}-\dfrac12 i\right)\left(\dfrac32+i\dfrac{\sqrt3}{2}\right) = \dfrac{3\sqrt3}{4} + i\dfrac34 - i\dfrac34 - i^2\dfrac{\sqrt3}{4}'
            note: "On développe le produit."
          - math: '\bar a\,b = \dfrac{3\sqrt3}{4} + \dfrac{\sqrt3}{4} = \dfrac{4\sqrt3}{4} = \sqrt3'
            note: "Les parties en i s'annulent ; on remplace i carré par -1 dans le dernier terme et on additionne."
      - id: q4
        part: "Une homothétie de centre O"
        stem: |-
          Dans le plan complexe rapporté à un repère orthonormé direct $(O,\vec{u},\vec{v})$, on considère les points $A$, $B$ et $C$ d'affixes respectives $a$, $b$ et $\overline{a}$.

          **(0,5 pt)** Montrer que le point $B$ est l'image du point $A$ par une homothétie $h$ de centre $O$ dont on déterminera le rapport.
        reasoning: |-
          Une homothétie de centre $O$ et de rapport $k$ (réel) transforme un point d'affixe $z$ en un point d'affixe $kz$ — l'extension directe de l'idée de coefficient réel qui rend deux vecteurs colinéaires (le chapitre 8 donne l'affixe d'un vecteur ; le critère de colinéarité lui-même relève de « Nombres complexes — forme trigonométrique et applications »), maintenant appliquée depuis le centre lui-même, et au-delà du socle des chapitres 2 à 8 formel. Montrer que $B$ est l'image de $A$ revient donc à écrire $b=ka$ avec $k$ réel, c'est-à-dire $k=\dfrac{b}{a}$, et à vérifier que ce quotient est bien un réel.

          Le résultat de la question 3, $\bar a\,b=\sqrt3$, donne directement ce quotient : puisque $a\bar a = |a|^2$ et $|a|=1$ (le module de $e^{i\pi/6}$), $\dfrac{b}{a} = \dfrac{b\,\bar a}{a\,\bar a} = \dfrac{\sqrt3}{1} = \sqrt3$ — un réel positif.
        steps:
          - math: '\dfrac{b}{a} = \dfrac{b\,\bar a}{a\,\bar a} = \dfrac{\bar a\,b}{|a|^2}'
            note: "On multiplie haut et bas par a barre (chapitre 4, l'outil pour diviser)."
          - math: '|a| = \left|e^{i\pi/6}\right| = 1 \implies |a|^2 = 1'
            note: "Module de a, forme exponentielle : module 1."
          - math: '\dfrac{b}{a} = \dfrac{\sqrt3}{1} = \sqrt3'
            note: "On réutilise a barre fois b = racine de 3, établi à la question 3."
          - math: 'b = \sqrt3\,a,\ \sqrt3 \in \mathbb{R} \implies B = h(A),\ h \ \text{homothétie de centre}\ O \ \text{et de rapport}\ \sqrt3'
            note: "Coefficient réel positif entre b et a : B est l'image de A par l'homothétie de centre O et de rapport racine de 3."
      - id: q5
        part: "La rotation de centre A et d'angle π/2"
        stem: |-
          Soient $z$ l'affixe d'un point $M$ du plan et $z'$ l'affixe du point $M'$ image de $M$ par la rotation $R$ de centre $A$ et d'angle $\dfrac{\pi}{2}$

          **(0,5 pt)** Écrire $z'$ en fonction de $z$ et $a$.
        reasoning: |-
          Une rotation de centre $\Omega$ (affixe $\omega$) et d'angle $\theta$ s'écrit $z'-\omega = e^{i\theta}(z-\omega)$ — la version décentrée de $z'=e^{i\theta}z$, déjà mobilisée pour les rotations de centre $O$ dans les autres sujets de cette banque. Ici le centre est $A$ (affixe $a$) et $\theta=\dfrac{\pi}{2}$, donc $z'-a = e^{i\pi/2}(z-a) = i(z-a)$ puisque $e^{i\pi/2}=i$ (angle remarquable).
        steps:
          - math: 'z'' - a = e^{i\pi/2}(z-a)'
            note: "Rotation de centre A et d'angle pi sur 2 : version décentrée de z prime = e puissance i theta fois z."
          - math: 'e^{i\pi/2} = \cos\dfrac{\pi}{2}+i\sin\dfrac{\pi}{2} = i'
            note: "Angle remarquable pi sur 2 : e puissance i pi sur 2 vaut i."
          - math: 'z'' = a + i(z-a)'
            note: "On isole z prime."
      - id: q6
        stem: |-
          **(0,25 pt)** Soit $d$ l'affixe du point $D$ image de $C$ par la rotation $R$, montrer que $d = a + 1$.
        reasoning: |-
          On applique la formule de la question précédente à $C$, d'affixe $\bar a$ : $d = a+i(\bar a - a)$. Le terme $\bar a - a$ est un imaginaire pur (chapitre 4 : $z-\bar z$ l'est, donc $\bar z - z$ aussi, au signe près) ; le calculer avec $a=\dfrac{\sqrt3}{2}+\dfrac12 i$ donne un résultat qui, multiplié par $i$, redevient réel — c'est ce qui fait tomber l'expression sur $a+1$.
        steps:
          - math: 'd = a + i(\bar a - a)'
            note: "On applique la formule de la question 5 au point C, d'affixe a barre."
          - math: '\bar a - a = \left(\dfrac{\sqrt3}{2}-\dfrac12 i\right)-\left(\dfrac{\sqrt3}{2}+\dfrac12 i\right) = -i'
            note: "Différence entre a barre et a : les parties réelles s'annulent, il reste l'opposé de la partie imaginaire doublée."
          - math: 'i(\bar a-a) = i\times(-i) = -i^2 = 1'
            note: "i fois moins i : on remplace i carré par -1."
          - math: 'd = a+1'
            note: "On reporte : d = a plus 1."
      - id: q7
        stem: |-
          **(0,5 pt)** Soit $I$ le point d'affixe le nombre $1$, montrer que $ADIO$ est un losange.
        reasoning: |-
          Deux choses à établir : d'abord que $ADIO$ est un parallélogramme, ensuite que deux côtés adjacents ont la même longueur (ce qui, pour un parallélogramme, suffit à en faire un losange).

          Pour le parallélogramme, on compare deux côtés opposés comme vecteurs (chapitre 8 : une différence d'affixes est l'affixe du vecteur correspondant) : $\overrightarrow{AD}$ d'affixe $d-a$, et $\overrightarrow{OI}$ d'affixe $1-0=1$. S'ils coïncident, $ADIO$ est un parallélogramme.

          Pour l'égalité des côtés, on compare les longueurs $AD$ et $DI$ via leurs modules (chapitre 8 : le module d'une différence d'affixes est une distance).
        steps:
          - math: 'z_{\overrightarrow{AD}} = d-a = (a+1)-a = 1, \qquad z_{\overrightarrow{OI}} = 1-0 = 1'
            note: "Les deux vecteurs ont la même affixe : ils sont égaux."
          - math: '\overrightarrow{AD} = \overrightarrow{OI} \implies ADIO \ \text{est un parallélogramme}'
            note: "Un côté égal à son opposé, en vecteurs : parallélogramme."
          - math: 'AD = |d-a| = |1| = 1, \qquad DI = |1-d| = |1-(a+1)| = |{-a}| = |a| = 1'
            note: "Deux côtés adjacents : AD vaut 1, DI vaut le module de a, qui vaut 1 (a = e puissance i pi sur 6, module 1)."
          - math: 'AD = DI \implies ADIO \ \text{est un losange}'
            note: "Parallélogramme avec deux côtés adjacents égaux : c'est un losange."
      - id: q8
        part: "Argument de d − b, puis un angle orienté"
        stem: |-
          **(0,75 pt)** Vérifier que $d - b = \dfrac{\sqrt{3} - 1}{2}(1 - i)$ ; en déduire un argument du nombre $d - b$
        reasoning: |-
          Vérification directe : on calcule $d-b$ à partir de $d=a+1$ (question 6) et $b=\dfrac32+i\dfrac{\sqrt3}{2}$, puis on factorise pour retrouver la forme annoncée.

          Pour l'argument, pas besoin de repasser par module et angle séparément : $\dfrac{\sqrt3-1}{2}$ est un réel positif (car $\sqrt3>1$), et multiplier par un réel positif ne change pas l'argument (propriété au-delà du socle des chapitres 2 à 8, déjà utilisée pour les quotients dans d'autres sujets de cette banque). Il suffit donc de connaître l'argument de $1-i$, un angle remarquable.
        steps:
          - math: 'd-b = (a+1) - \left(\dfrac32+i\dfrac{\sqrt3}{2}\right) = \left(\dfrac{\sqrt3}{2}+\dfrac12 i+1\right) - \dfrac32 - i\dfrac{\sqrt3}{2}'
            note: "On remplace a par sa forme algébrique et on soustrait b."
          - math: 'd-b = \left(\dfrac{\sqrt3}{2}-\dfrac12\right) + i\left(\dfrac12-\dfrac{\sqrt3}{2}\right) = \dfrac{\sqrt3-1}{2} - i\,\dfrac{\sqrt3-1}{2}'
            note: "On regroupe parties réelle et imaginaire ; la partie imaginaire est l'opposée de la partie réelle."
          - math: 'd-b = \dfrac{\sqrt3-1}{2}\,(1-i)'
            note: "On factorise par racine de 3 moins 1, sur 2 : l'égalité annoncée."
          - math: '\arg(1-i) = -\dfrac{\pi}{4}, \quad \dfrac{\sqrt3-1}{2}>0 \implies \arg(d-b) = -\dfrac{\pi}{4}\ [2\pi]'
            note: "1 moins i a pour argument moins pi sur 4 (angle remarquable) ; un coefficient réel positif ne le change pas."
      - id: q9
        stem: |-
          **(0,5 pt)** Écrire le nombre $1 - b$ sous forme trigonométrique.
        reasoning: |-
          Même méthode que partout ailleurs dans ce sujet : module par $|z|=\sqrt{\text{Re}(z)^2+\text{Im}(z)^2}$ (chapitre 5), argument en lisant $\cos\theta$ et $\sin\theta$. Ici les deux parties sont négatives : l'angle est au-delà de $\pi$ — ou, de façon équivalente, négatif.
        steps:
          - math: '1-b = 1-\left(\dfrac32+i\dfrac{\sqrt3}{2}\right) = -\dfrac12 - i\dfrac{\sqrt3}{2}'
            note: "On soustrait b."
          - math: '|1-b| = \sqrt{\left(-\dfrac12\right)^2+\left(-\dfrac{\sqrt3}{2}\right)^2} = \sqrt{\dfrac14+\dfrac34} = 1'
            note: "Module de 1 moins b, chapitre 5."
          - math: '\cos\theta = -\dfrac12,\ \sin\theta=-\dfrac{\sqrt3}{2} \implies \theta = -\dfrac{2\pi}{3}'
            note: "Parties réelle et imaginaire toutes deux négatives : angle moins deux pi sur trois."
          - math: '1-b = \cos\!\left(-\dfrac{2\pi}{3}\right)+i\sin\!\left(-\dfrac{2\pi}{3}\right)'
            note: "Forme trigonométrique de 1 moins b (module 1)."
      - id: q10
        stem: |-
          **(0,5 pt)** Déduire une mesure de l'angle $\left(\overrightarrow{BI}, \overrightarrow{BD}\right)$
        reasoning: |-
          $\overrightarrow{BI}$ a pour affixe $1-b$ (chapitre 8), et $\overrightarrow{BD}$ a pour affixe $d-b$. L'argument du quotient de ces deux affixes est une mesure de l'angle entre les deux vecteurs — propriété au-delà du socle des chapitres 2 à 8, déjà mobilisée pour les angles orientés dans d'autres sujets de cette banque. Les deux questions précédentes donnent chacune un argument : il ne reste qu'à soustraire.
        steps:
          - math: '\left(\overrightarrow{BI},\ \overrightarrow{BD}\right) \equiv \arg\!\left(\dfrac{d-b}{1-b}\right) = \arg(d-b) - \arg(1-b)\ [2\pi]'
            note: "L'angle entre deux vecteurs est l'argument du quotient de leurs affixes."
          - math: '\arg(d-b)-\arg(1-b) = -\dfrac{\pi}{4} - \left(-\dfrac{2\pi}{3}\right) = -\dfrac{\pi}{4}+\dfrac{2\pi}{3}'
            note: "On reporte les deux arguments trouvés aux questions 8 et 9."
          - math: '-\dfrac{\pi}{4}+\dfrac{2\pi}{3} = \dfrac{-3\pi+8\pi}{12} = \dfrac{5\pi}{12}'
            note: "Même dénominateur douze : moins trois douzièmes de pi plus huit douzièmes de pi."
          - math: '\left(\overrightarrow{BI},\ \overrightarrow{BD}\right) \equiv \dfrac{5\pi}{12}\ [2\pi]'
            note: "Mesure de l'angle."

