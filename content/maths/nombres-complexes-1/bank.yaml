    intro: |-
      **Nombres complexes (examen national, session normale 2018, Sciences Expérimentales).**

      Le fil de l'exercice : une équation du second degré dont l'une des racines devient l'affixe d'un point $A$, une rotation $R$ de centre $O$ et d'angle $\dfrac{2\pi}{3}$, puis une translation, jusqu'à un triangle équilatéral.
    questions:
      - id: q1
        part: "Une équation du second degré dans ℂ"
        stem: |-
          **(0,75 pt)** Résoudre dans l'ensemble $\mathbb{C}$ des nombres complexes l'équation : $2z^2 + 2z + 5 = 0$
        reasoning: |-
          Coefficients réels, discriminant à calculer (même réflexe qu'à chaque équation du second degré dans $\mathbb{C}$) : ici $\Delta$ est strictement négatif, donc on écrit $\sqrt\Delta$ avec $i$, et les deux solutions sont conjuguées.

          Garde en tête la solution à partie imaginaire **positive** : c'est exactement l'affixe $a$ du point $A$ qui porte toute la suite de l'exercice, à la question 2)b).
        steps:
          - math: '\Delta = 2^2 - 4\times2\times5 = 4-40 = -36'
            note: "Discriminant de 2z carré plus 2z plus 5."
          - math: '\Delta<0 \implies \sqrt\Delta = i\sqrt{36} = 6i'
            note: "Delta négatif : sa racine s'écrit avec i (racine de 36 = 6)."
          - math: 'z = \dfrac{-2 \pm 6i}{2\times2} = \dfrac{-2\pm6i}{4} = -\dfrac12 \pm \dfrac32 i'
            note: "Formule (-b plus ou moins racine de Delta) sur 2a, avec a=2, b=2."
          - math: 'S = \left\{\, -\dfrac12-\dfrac32 i\ ;\ -\dfrac12+\dfrac32 i \,\right\}'
            note: "Deux solutions conjuguées. On garde -1/2 + 3/2 i, celle qui sert dans la suite."
      - id: q2
        part: "La rotation d'angle 2π/3 : forme trigonométrique, puis image d'un point"
        stem: |-
          Dans le plan complexe rapporté à un repère orthonormé direct $(O, \vec{u}, \vec{v})$, on considère la rotation $R$ de centre $O$ et d'angle $\dfrac{2\pi}{3}$

          **(0,25 pt)** Écrire sous forme trigonométrique le nombre complexe $d = -\dfrac{1}{2} + \dfrac{\sqrt{3}}{2}i$
        reasoning: |-
          On calcule module et argument à partir de la forme algébrique de $d$ (chapitre 5 pour le module ; l'argument se lit en comparant $\cos\theta=\text{Re}(d)/|d|$ et $\sin\theta=\text{Im}(d)/|d|$ à des valeurs remarquables). Ici les parties réelle et imaginaire correspondent exactement à l'angle $\dfrac{2\pi}{3}$ — pas un hasard : c'est l'angle même de la rotation $R$.
        steps:
          - math: '|d| = \sqrt{\left(-\dfrac12\right)^2+\left(\dfrac{\sqrt3}{2}\right)^2} = \sqrt{\dfrac14+\dfrac34} = 1'
            note: "Module de d, chapitre 5."
          - math: '\cos\theta=-\dfrac12,\ \sin\theta=\dfrac{\sqrt3}{2} \implies \theta=\dfrac{2\pi}{3}'
            note: "Angle remarquable : deux pi sur trois."
          - math: 'd = \cos\dfrac{2\pi}{3}+i\sin\dfrac{2\pi}{3}'
            note: "Forme trigonométrique de d (module 1)."
      - id: q3
        stem: |-
          **(0,5 pt)** On considère le point $A$ d'affixe $a = -\dfrac{1}{2} + \dfrac{3}{2}i$ et le point $B$ image du point $A$ par la rotation $R$. Soit $b$ l'affixe du point $B$, montrer que $b = d \cdot a$
        reasoning: |-
          Une rotation de centre $O$ et d'angle $\theta$ se traduit sur les affixes par $z'=e^{i\theta}z$ — au-delà du socle des chapitres 2 à 8, déjà signalé en tête de banque. Ici $\theta=\dfrac{2\pi}{3}$, et la question précédente vient justement d'écrire $d$ sous la forme trigonométrique de cet angle, c'est-à-dire $d=e^{i2\pi/3}$. La formule de la rotation appliquée à $A$ donne donc directement $b=e^{i2\pi/3}a=d\cdot a$ — une lecture, pas un nouveau calcul.
        steps:
          - math: '(R,\ \text{centre } O,\ \text{angle } \dfrac{2\pi}{3}) \implies b = e^{i2\pi/3}\,a'
            note: "Formule de la rotation, centre O, appliquée au point A pour obtenir son image B."
          - math: 'd = \cos\dfrac{2\pi}{3}+i\sin\dfrac{2\pi}{3} = e^{i2\pi/3}'
            note: "Rappel de la question précédente : d est exactement e puissance i deux pi sur trois."
          - math: 'b = e^{i2\pi/3}\,a = d\cdot a'
            note: "On remplace : b = d fois a."
      - id: q4
        part: "La translation de vecteur OA"
        stem: |-
          Soit $t$ la translation de vecteur $\overrightarrow{OA}$ et $C$ l'image de $B$ par la translation $t$ et $c$ l'affixe de $C$

          **(0,75 pt)** Vérifier que $c = b + a$ et en déduire que $c = a\left(\dfrac{1}{2} + \dfrac{\sqrt{3}}{2}i\right)$ *(on pourra utiliser la question 2)b))*
        reasoning: |-
          Une translation de vecteur $\vec w$ transforme un point d'affixe $z$ en un point d'affixe $z'=z+z_{\vec w}$ (chapitre 8 : additionner l'affixe du vecteur, c'est additionner les deux vecteurs correspondants). Ici $\vec w=\overrightarrow{OA}$, et l'affixe d'un vecteur $\overrightarrow{OM}$ est celle de $M$ lui-même, donc $z_{\overrightarrow{OA}}=a$. Appliquée à $B$, la translation donne directement $c=b+a$.

          Pour la seconde égalité, on remplace $b$ par $d\cdot a$ (question précédente) : $c=d\cdot a+a=a(d+1)$. Il ne reste qu'à substituer la forme algébrique de $d$ trouvée en 2)a).
        steps:
          - math: 'c = b + z_{\overrightarrow{OA}} = b+a'
            note: "Translation de vecteur OA (chapitre 8) : on ajoute l'affixe a à celle de B."
          - math: 'c = d\,a + a = a\,(d+1)'
            note: "On remplace b par d fois a (question précédente) et on factorise par a."
          - math: 'd+1 = \left(-\dfrac12+\dfrac{\sqrt3}{2}i\right)+1 = \dfrac12+\dfrac{\sqrt3}{2}i'
            note: "On reporte la forme algébrique de d, question 2)a)."
          - math: 'c = a\left(\dfrac12+\dfrac{\sqrt3}{2}i\right)'
            note: "L'égalité annoncée."
      - id: q5
        stem: |-
          **(0,75 pt)** Déterminer $\arg\left(\dfrac{c}{a}\right)$ puis en déduire que le triangle $OAC$ est équilatéral.
        reasoning: |-
          La question précédente donne $c=a\left(\dfrac12+\dfrac{\sqrt3}{2}i\right)$, donc $\dfrac{c}{a}=\dfrac12+\dfrac{\sqrt3}{2}i$ (dès que $a\neq0$, ce qui est le cas). C'est exactement le nombre $e^{i\pi/3}$ : module $1$, argument $\dfrac{\pi}{3}$ — un angle remarquable au-delà du socle des chapitres 2 à 8, comme pour $d$ à la question 2)a).

          Deux informations en découlent (le quotient de deux affixes-vecteurs porte le rapport des longueurs et l'angle entre elles — « Nombres complexes — forme trigonométrique et applications »). Le module $1$ donne $|c|=|a|$, donc $OA=OC$ : le triangle est isocèle en $O$. L'argument $\dfrac{\pi}{3}$ est une mesure de l'angle $\left(\overrightarrow{OA},\overrightarrow{OC}\right)$. Un triangle isocèle dont l'angle au sommet vaut $\dfrac{\pi}{3}$ a nécessairement ses deux autres angles égaux à $\dfrac{\pi-\pi/3}{2}=\dfrac{\pi}{3}$ aussi : les trois angles valent $\dfrac{\pi}{3}$, le triangle est donc équilatéral.
        steps:
          - math: '\dfrac{c}{a} = \dfrac12+\dfrac{\sqrt3}{2}i'
            note: "On divise l'égalité de la question précédente par a (non nul)."
          - math: '\left|\dfrac{c}{a}\right| = \sqrt{\left(\dfrac12\right)^2+\left(\dfrac{\sqrt3}{2}\right)^2} = 1, \qquad \arg\left(\dfrac{c}{a}\right) = \dfrac{\pi}{3}'
            note: "Module et argument de un demi plus racine de trois sur deux i : angle remarquable pi sur trois."
          - math: '\left|\dfrac{c}{a}\right|=1 \implies |c|=|a| \implies OA=OC'
            note: "Module du quotient égal à 1 : les deux longueurs OA et OC sont égales, triangle isocèle en O."
          - math: '\left(\overrightarrow{OA},\ \overrightarrow{OC}\right) \equiv \dfrac{\pi}{3}\ [2\pi]'
            note: "Argument du quotient des affixes-vecteurs : mesure de l'angle en O."
          - math: 'OA=OC\ \text{et angle en}\ O = \dfrac{\pi}{3} \implies OAC\ \text{équilatéral}'
            note: "Isocèle avec un angle au sommet de pi sur trois : les deux autres angles valent aussi pi sur trois (somme des angles = pi) — triangle équilatéral."
