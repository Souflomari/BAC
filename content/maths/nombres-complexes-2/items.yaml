notion: nombres-complexes-2
skill_code: maths_complexes_trigo
misconceptions: []
items:
  - id: NBCOMPLEX2-1
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["argument", "quadrant"]
    stem: >
      Quel est un argument de $z = -\sqrt3 + i$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{5\\pi}{6}$"
        correct: true
      - id: B
        text: "$\\dfrac{\\pi}{6}$"
        correct: false
        feedback: >
          Tu as trouvé le bon angle de référence ($\tan$ vaut $1/\sqrt3$
          en valeur absolue) mais tu as oublié de vérifier le signe de
          $\cos\theta$ ET $\sin\theta$ séparément. Ici $a=-\sqrt3<0$ et
          $b=1>0$ : le point est dans le demi-plan gauche, donc l'argument
          n'est pas l'angle de référence $\pi/6$ lui-même, mais $\pi$
          moins cet angle.
      - id: C
        text: "$-\\dfrac{\\pi}{6}$"
        correct: false
        feedback: >
          Ce choix placerait le point dans le quadrant où $a>0$ et $b<0$.
          Mais ici $a=-\sqrt3<0$ (partie réelle négative) et $b=1>0$
          (partie imaginaire positive) : les deux signes sont à l'opposé
          de ce que suppose cette réponse.
      - id: D
        text: "$\\dfrac{7\\pi}{6}$"
        correct: false
        feedback: >
          Cet angle correspond à $\cos\theta<0$ ET $\sin\theta<0$ — c'est
          le quadrant où les DEUX coordonnées sont négatives. Ici
          $b=1>0$ : la partie imaginaire est positive, pas négative.
          Vérifie les deux signes séparément, pas seulement celui de $a$.
    correct_feedback: >
      $r=|z|=\sqrt{3+1}=2$, donc $\cos\theta=-\dfrac{\sqrt3}{2}$ et
      $\sin\theta=\dfrac12$. Ces deux valeurs correspondent à
      $\theta=\dfrac{5\pi}{6}$ : l'angle de référence est $\pi/6$, mais
      comme $\cos\theta<0$ et $\sin\theta>0$, le point est dans le
      deuxième quadrant, donc $\theta = \pi - \pi/6 = 5\pi/6$.
    solution: |
      **Étape 1 — module :**
      $$r = |z| = \sqrt{(-\sqrt3)^2+1^2} = \sqrt{3+1} = 2$$

      **Étape 2 — cosinus et sinus :**
      $$\cos\theta = \frac{-\sqrt3}{2}, \qquad \sin\theta = \frac{1}{2}$$

      **Étape 3 — identifier le quadrant puis l'angle :** $\cos\theta<0$
      et $\sin\theta>0$ place $M$ dans le deuxième quadrant. L'angle de
      référence, dont le cosinus et le sinus valent $\sqrt3/2$ et $1/2$
      en valeur absolue, est $\pi/6$. Dans le deuxième quadrant, l'angle
      vaut $\pi$ moins cet angle de référence :
      $$\theta = \pi - \frac{\pi}{6} = \frac{5\pi}{6}$$

  - id: NBCOMPLEX2-2
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["produit", "module", "argument"]
    stem: >
      On donne $z = 2e^{i\pi/3}$ et $z' = 3e^{i\pi/6}$. Quelle est la
      forme exponentielle de $zz'$ ?
    type: mcq
    choices:
      - id: A
        text: "$6e^{i\\pi/2}$"
        correct: true
      - id: B
        text: "$5e^{i\\pi/2}$"
        correct: false
        feedback: >
          L'argument est correct, mais le module est faux : tu as
          additionné les modules ($2+3=5$) au lieu de les multiplier. Pour
          un produit, les modules se MULTIPLIENT ($2\times3=6$) — c'est
          la même règle que pour les arguments qui, eux, s'additionnent ;
          les deux opérations ne sont pas interchangeables.
      - id: C
        text: "$6e^{i\\pi/6}$"
        correct: false
        feedback: >
          Le module est correct, mais l'argument est faux : tu as
          soustrait les arguments ($\pi/3-\pi/6$) au lieu de les
          additionner. La soustraction des arguments correspond à un
          QUOTIENT, pas à un produit. Pour $zz'$, les arguments
          s'additionnent : $\pi/3+\pi/6$.
      - id: D
        text: "$6e^{i\\pi/3}$"
        correct: false
        feedback: >
          Tu as multiplié correctement les modules, mais oublié
          d'ajouter l'argument de $z'$ : ce choix ne garde que
          l'argument de $z$ seul ($\pi/3$), comme si $z'$ n'apportait
          rien à la direction du produit. Il faut ajouter les DEUX
          arguments : $\pi/3+\pi/6$.
    correct_feedback: >
      Les modules se multiplient : $2\times3=6$. Les arguments
      s'additionnent : $\pi/3+\pi/6 = 2\pi/6+\pi/6 = \pi/2$. Donc
      $zz' = 6e^{i\pi/2}$.
    solution: |
      **Règle du produit (R2) :**
      $$|zz'| = |z|\times|z'| = 2\times3 = 6$$
      $$\arg(zz') = \arg(z)+\arg(z') = \frac{\pi}{3}+\frac{\pi}{6} = \frac{2\pi}{6}+\frac{\pi}{6} = \frac{\pi}{2}$$
      $$zz' = 6e^{i\pi/2}$$

  - id: NBCOMPLEX2-3
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["moivre", "puissance"]
    stem: >
      Soit $z = 2e^{i\pi/6}$. Quelle est la forme exponentielle de $z^3$ ?
    type: mcq
    choices:
      - id: A
        text: "$8e^{i\\pi/2}$"
        correct: true
      - id: B
        text: "$6e^{i\\pi/2}$"
        correct: false
        feedback: >
          L'argument est correct, mais le module est faux : tu as
          multiplié le module par $3$ ($2\times3=6$) au lieu de
          l'ÉLEVER à la puissance $3$ ($2^3=8$). La formule de Moivre
          élève le module à la puissance $n$ ; multiplier par $n$ est la
          règle du produit répété, pas celle de la puissance.
      - id: C
        text: "$8e^{i\\pi/18}$"
        correct: false
        feedback: >
          Le module est correct, mais l'argument est faux : tu as
          DIVISÉ l'argument par $3$ ($\pi/6\div3=\pi/18$) au lieu de le
          MULTIPLIER par $3$. Diviser l'argument correspondrait à
          chercher une racine, pas à calculer une puissance. La formule
          de Moivre dit $\arg(z^n)=n\arg(z)$.
      - id: D
        text: "$8e^{i\\pi/6}$"
        correct: false
        feedback: >
          Tu as bien élevé le module à la puissance $3$, mais tu as
          laissé l'argument inchangé, comme si élever à la puissance ne
          touchait que le module. La formule de Moivre multiplie AUSSI
          l'argument par $3$ : $\arg(z^3)=3\times\pi/6=\pi/2$.
    correct_feedback: >
      Formule de Moivre : le module s'élève à la puissance $3$
      ($2^3=8$), et l'argument se multiplie par $3$
      ($3\times\pi/6=\pi/2$). Donc $z^3 = 8e^{i\pi/2}$.
    solution: |
      **Formule de Moivre (R3) :**
      $$|z^3| = |z|^3 = 2^3 = 8$$
      $$\arg(z^3) = 3\arg(z) = 3\times\frac{\pi}{6} = \frac{\pi}{2}$$
      $$z^3 = 8e^{i\pi/2}$$

  - id: NBCOMPLEX2-4
    rung: "R4"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "unite"]
    stem: >
      Quelles sont les solutions, dans $\mathbb{C}$, de l'équation
      $z^4 = 1$ ?
    type: mcq
    choices:
      - id: A
        text: "$1,\\ i,\\ -1,\\ -i$"
        correct: true
      - id: B
        text: "$1$ et $-1$ seulement"
        correct: false
        feedback: >
          Cette réponse ne cherche des solutions que parmi les nombres
          RÉELS, comme si l'équation vivait dans $\mathbb{R}$. Mais on
          résout dans $\mathbb{C}$ : une équation $z^n=1$ a exactement
          $n$ solutions complexes distinctes (les racines n-ièmes de
          l'unité), pas seulement les solutions réelles évidentes.
      - id: C
        text: "$1$ et $i$ seulement"
        correct: false
        feedback: >
          L'équation $z^4=1$ a exactement $4$ solutions distinctes
          (une pour chaque $k=0,1,2,3$ dans $z_k=e^{i2k\pi/4}$), pas
          $2$. Tu t'es arrêté trop tôt : il manque les racines
          correspondant à $k=2$ et $k=3$, soit $-1$ et $-i$.
      - id: D
        text: "$1,\\ e^{i\\pi/4},\\ e^{i\\pi/2},\\ e^{i3\\pi/4}$"
        correct: false
        feedback: >
          L'écart entre deux racines consécutives doit être
          $\dfrac{2\pi}{n}=\dfrac{2\pi}{4}=\dfrac{\pi}{2}$, pas $\pi/4$.
          Ces valeurs correspondraient à un pas deux fois trop petit
          (comme pour les racines 8-ièmes de l'unité). Vérifie d'ailleurs
          que $(e^{i\pi/4})^4=e^{i\pi}=-1\neq1$ : ce n'est pas une
          solution de $z^4=1$.
    correct_feedback: >
      Les racines 4-ièmes de l'unité sont $z_k=e^{i2k\pi/4}$ pour
      $k=0,1,2,3$, soit $e^{i0}=1$, $e^{i\pi/2}=i$, $e^{i\pi}=-1$,
      $e^{i3\pi/2}=-i$.
    solution: |
      **Écriture $z=\rho e^{i\alpha}$ et Moivre :** $z^4=1$ équivaut à
      $\rho^4=1$ (donc $\rho=1$, car $\rho\geq0$ réel) et
      $4\alpha\equiv0\ [2\pi]$, donc $\alpha=\dfrac{2k\pi}{4}$.

      **Les 4 solutions, pour $k=0,1,2,3$ :**
      $$z_0=e^{i0}=1 \qquad z_1=e^{i\pi/2}=i \qquad z_2=e^{i\pi}=-1 \qquad z_3=e^{i3\pi/2}=-i$$

  - id: NBCOMPLEX2-5
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["rotation", "homothetie", "geometrie"]
    stem: >
      La transformation qui à $M$ d'affixe $z$ associe $M'$ d'affixe
      $z' = 2i\,z$ est la composée, centrée en $O$, de quelle rotation et
      quelle homothétie ?
    type: mcq
    choices:
      - id: A
        text: "Rotation d'angle $\\pi/2$ et homothétie de rapport $2$"
        correct: true
      - id: B
        text: "Rotation d'angle $\\pi/2$ et homothétie de rapport $2i$"
        correct: false
        feedback: >
          Le rapport d'une homothétie est toujours un nombre RÉEL — ici
          $|2i|=2$. Le nombre complexe $2i$ tout entier code à la fois
          la rotation ET l'homothétie ; ce n'est pas lui-même le
          "rapport". Le rapport, c'est le module, $2$ ; l'angle, c'est
          l'argument, $\pi/2$.
      - id: C
        text: "Rotation d'angle $2$ (en radians) et homothétie de rapport $\\pi/2$"
        correct: false
        feedback: >
          Les rôles sont inversés : c'est l'ARGUMENT de $2i$ qui donne
          l'angle de rotation ($\pi/2$, pas $2$), et le MODULE de $2i$
          qui donne le rapport d'homothétie ($2$, pas $\pi/2$). Le module
          est un réel positif qui mesure une distance, pas un angle.
      - id: D
        text: "Rotation d'angle $\\pi$ et homothétie de rapport $2$"
        correct: false
        feedback: >
          Multiplier $i$ par le réel positif $2$ ne change pas son
          argument : $\arg(2i) = \arg(2)+\arg(i) = 0+\pi/2 = \pi/2$, pas
          $\pi$. Multiplier par un réel positif change seulement le
          module (l'agrandissement), jamais l'argument (la direction).
    correct_feedback: >
      $2i = 2e^{i\pi/2}$ : le module est $2$ (rapport de l'homothétie),
      l'argument est $\pi/2$ (angle de la rotation). Les deux
      transformations sont centrées en $O$.
    solution: |
      **Forme exponentielle de $c=2i$ :**
      $$|2i| = 2, \qquad \arg(2i) = \frac{\pi}{2}$$

      D'après le R5, la transformation $z'=cz$ est la composée d'une
      rotation de centre $O$ et d'angle $\arg(c)=\pi/2$, et d'une
      homothétie de centre $O$ et de rapport $|c|=2$.

  - id: NBCOMPLEX2-6
    rung: "R6"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["triangle", "configuration", "rapport-complexe"]
    stem: >
      $A$, $B$, $C$ ont pour affixes respectives $z_A=0$, $z_B=2$,
      $z_C=1+i\sqrt3$. On calcule
      $\dfrac{z_C-z_A}{z_B-z_A} = \dfrac12+i\dfrac{\sqrt3}{2} = e^{i\pi/3}$.
      Qu'en déduit-on sur la nature du triangle $ABC$ ?
    type: mcq
    choices:
      - id: A
        text: "Le triangle $ABC$ est équilatéral"
        correct: true
      - id: B
        text: "Le triangle $ABC$ est rectangle en $A$"
        correct: false
        feedback: >
          Un triangle est rectangle en $A$ quand le rapport est
          imaginaire PUR (argument $\pm\pi/2$), pas pour n'importe quel
          argument non nul. Ici l'argument vaut $\pi/3$, pas $\pi/2$ :
          l'angle en $A$ est de $60°$, pas de $90°$.
      - id: C
        text: "Les points $A$, $B$, $C$ sont alignés"
        correct: false
        feedback: >
          L'alignement correspond à un rapport RÉEL (argument $0$ ou
          $\pi$). Ici le rapport $\frac12+i\frac{\sqrt3}{2}$ a une partie
          imaginaire non nulle : ce n'est pas un réel, donc les trois
          points ne sont pas alignés.
      - id: D
        text: "Le triangle est isocèle en $A$, mais on ne peut rien dire de plus"
        correct: false
        feedback: >
          Le module donne bien $AB=AC$ (isocèle en $A$), mais cette
          réponse ignore l'information de l'argument. Un triangle isocèle
          en $A$ dont l'angle au sommet $A$ vaut $\pi/3$ (soit $60°$) a
          forcément ses deux autres angles égaux à $(\pi-\pi/3)/2=\pi/3$
          aussi : les trois angles valent $60°$, donc il est équilatéral.
          Il faut combiner module ET argument, pas s'arrêter au module
          seul.
    correct_feedback: >
      Le module vaut $1$ ($AB=AC$, isocèle en $A$), et l'argument vaut
      $\pi/3$ (angle en $A$ égal à $60°$). Un triangle isocèle dont
      l'angle au sommet vaut $60°$ a ses trois angles égaux à $60°$ :
      il est équilatéral.
    solution: |
      **Lecture du rapport $w=\dfrac{z_C-z_A}{z_B-z_A}=e^{i\pi/3}$ :**
      $$|w| = 1 \implies AB = AC \ (\text{isocèle en } A)$$
      $$\arg(w) = \frac{\pi}{3} \implies \text{angle en } A = 60°$$

      **Conclusion :** un triangle isocèle en $A$ avec un angle de $60°$
      au sommet $A$ a ses deux autres angles égaux à
      $(180°-60°)/2=60°$ chacun. Les trois angles valent $60°$ : le
      triangle est équilatéral.

  - id: NBCOMPLEX2-7
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_complexes_trigo
    tags: ["multiplication-par-i", "rotation", "intuition-geometrique"]
    stem: >
      D'après l'accroche du chapitre, que produit géométriquement la
      multiplication d'un point du plan par $i$ ?
    type: mcq
    choices:
      - id: A
        text: "Une rotation de centre $O$ et d'angle $\\pi/2$ (un quart de tour direct), sans changement de taille."
        correct: true
      - id: B
        text: "Un agrandissement (une homothétie), sans rotation."
        correct: false
        feedback: >
          $|i|=1$ : multiplier par $i$ ne change jamais la distance à
          $O$, donc il n'y a aucun agrandissement. Tu as traité $i$
          comme un simple facteur d'échelle, en oubliant de vérifier son
          module — c'est justement parce que $|i|=1$ que la
          multiplication par $i$ n'agrandit rien, elle fait seulement
          tourner.
      - id: C
        text: "Une translation."
        correct: false
        feedback: >
          Une translation vient d'une ADDITION d'affixes (comme vu au
          chapitre précédent), pas d'une multiplication. Ici on
          multiplie $z$ par $i$, on ne lui ajoute rien : il ne peut donc
          pas s'agir d'une translation.
      - id: D
        text: "Une symétrie par rapport à l'axe réel."
        correct: false
        feedback: >
          C'est l'effet de la CONJUGAISON ($z\mapsto\overline z$), pas
          de la multiplication par $i$. Vérifie sur un exemple : le
          conjugué de $1+i$ est $1-i$, alors que $i(1+i)=-1+i$ — ce
          n'est pas du tout le symétrique de $1+i$ par rapport à l'axe
          réel.
    correct_feedback: >
      Sur les trois exemples de l'accroche ($z=2$, $z=3i$, $z=1+i$), la
      distance à $O$ reste inchangée à chaque fois, et le point tourne
      exactement d'un quart de tour dans le sens direct : multiplier
      par $i$ est une rotation de centre $O$ et d'angle $\pi/2$.
    solution: |
      **Les trois exemples de l'accroche :**
      $$2 \mapsto 2i \qquad 3i \mapsto -3 \qquad 1+i \mapsto -1+i$$

      **Vérification des distances :** $|2|=2=|2i|$ ;
      $|3i|=3=|-3|$ ; $|1+i|=\sqrt2=|-1+i|$. Dans les trois cas, la
      distance à $O$ ne change pas : pas d'agrandissement.

      **Vérification de l'angle :** dans les trois cas, le point tourné
      d'un quart de tour direct ($90°$) autour de $O$ tombe exactement
      sur le point d'arrivée (vérifie-le sur $(1,1)\mapsto(-1,1)$).

      **Conclusion :** multiplier par $i$ est une rotation de centre
      $O$ et d'angle $\pi/2$, sans agrandissement.

  - id: NBCOMPLEX2-8
    rung: "R0"
    difficulty_level: 2
    skill_code: maths_complexes_trigo
    tags: ["multiplication-par-i", "rotation", "sens-direct"]
    stem: >
      Le point $M$ a pour affixe $z = 3$. Quelle est l'affixe du point
      $M'$ obtenu en multipliant $z$ par $i$ ?
    type: mcq
    choices:
      - id: A
        text: "$-3i$"
        correct: false
        feedback: >
          Ce point correspond à un quart de tour dans le sens INDIRECT
          (horaire), pas direct. Or l'accroche montre que multiplier
          par $i$ fait tourner dans le sens direct (trigonométrique,
          anti-horaire) : $(3,0)$ tourné d'un quart de tour direct
          donne $(0,3)$, pas $(0,-3)$.
      - id: B
        text: "$3i$"
        correct: true
      - id: C
        text: "$-3$"
        correct: false
        feedback: >
          $-3$ correspond à une multiplication par $-1=i^2$, c'est-à-dire
          un DEMI-tour, pas un quart de tour. Tu as confondu $i$ avec
          $i^2$ : $i\times3=3i$, alors que $i^2\times3=-3$.
      - id: D
        text: "$3$"
        correct: false
        feedback: >
          Cette réponse revient à dire que multiplier par $i$ ne change
          rien, comme si $i$ jouait le rôle de $1$. Or $i\neq1$ :
          $i\times3=3i$, un nombre différent de $3$, dont l'image a
          tourné d'un quart de tour.
    correct_feedback: >
      $i\times3=3i$ : le point $(3,0)$ devient $(0,3)$, exactement un
      quart de tour direct autour de $O$, sans changement de distance.
    solution: |
      **Calcul direct :**
      $$z' = i\times z = i\times3 = 3i$$

      **Vérification géométrique :** $M(3,0)$ est à distance $3$ de
      $O$ ; $M'(0,3)$ aussi est à distance $3$ de $O$. La direction a
      tourné d'un quart de tour dans le sens direct, cohérent avec
      l'effet de la multiplication par $i$ vu dans l'accroche.

  - id: NBCOMPLEX2-9
    rung: "R0"
    difficulty_level: 2
    skill_code: maths_complexes_trigo
    tags: ["multiplication-par-i", "composition-rotations"]
    stem: >
      On part du point d'affixe $z$, on le multiplie par $i$, puis on
      multiplie le résultat par $i$ une seconde fois (on calcule donc
      $i\times(iz)=i^2z$). Quel est l'effet géométrique total de ces
      deux multiplications successives ?
    type: mcq
    choices:
      - id: A
        text: "Une rotation de centre $O$ et d'angle $\\pi/2$ (un quart de tour), comme une seule multiplication par $i$."
        correct: false
        feedback: >
          Faire deux fois la même rotation ne redonne pas le même
          angle : les deux quarts de tour s'ADDITIONNENT
          ($\pi/2+\pi/2=\pi$), ils ne se répètent pas à l'identique. Tu
          n'as compté l'effet que d'une seule des deux multiplications.
      - id: B
        text: "Un agrandissement de rapport $2$, sans rotation."
        correct: false
        feedback: >
          Tu as pensé qu'appliquer deux fois la même multiplication
          double la distance à $O$, comme si $|i|$ n'était pas $1$
          mais s'ajoutait à chaque fois. Or $|i|=1$ : composer deux
          rotations ne change jamais la taille, seulement l'angle (qui,
          lui, s'additionne bel et bien).
      - id: C
        text: "Une rotation de centre $O$ et d'angle $\\pi$ (un demi-tour)."
        correct: true
      - id: D
        text: "Le point revient à sa position de départ (transformation identique)."
        correct: false
        feedback: >
          Tu as peut-être pensé « faire une chose deux fois annule son
          effet », comme pour une symétrie. Mais une ROTATION répétée
          deux fois ne redonne pas le point de départ : elle compose
          les deux angles. Deux quarts de tour direct font un demi-tour
          ($\pi$), pas un tour complet nul.
    correct_feedback: >
      $i^2=-1$, et $-1=e^{i\pi}$ : multiplier deux fois de suite par
      $i$ revient à multiplier par $-1$, c'est-à-dire à faire tourner
      le point d'un demi-tour ($\pi$) autour de $O$, sans changer sa
      distance à $O$.
    solution: |
      **Calcul algébrique :**
      $$i\times(iz) = i^2 z = -z$$

      **Effet géométrique de $z\mapsto-z$ :** vu au chapitre précédent,
      c'est la symétrie par rapport à $O$, c'est-à-dire une rotation de
      centre $O$ et d'angle $\pi$ (un demi-tour).

      **Cohérence avec l'angle :** chaque multiplication par $i$ fait
      tourner d'un quart de tour ($\pi/2$) ; en faire deux additionne
      les angles : $\pi/2+\pi/2=\pi$. Les deux points de vue
      (algébrique et géométrique) coïncident.

  - id: NBCOMPLEX2-10
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["forme-trigonometrique", "argument", "quadrant"]
    stem: >
      Quelle est la forme trigonométrique de $z = 1 - i$ ?
    type: mcq
    choices:
      - id: A
        text: "$2\\left(\\cos\\left(-\\dfrac{\\pi}{4}\\right)+i\\sin\\left(-\\dfrac{\\pi}{4}\\right)\\right)$"
        correct: false
        feedback: >
          L'angle est correct, mais le module est faux : tu as calculé
          $r=1^2+(-1)^2=2$ en oubliant de prendre la racine carrée.
          Le module est $r=|z|=\sqrt{1^2+(-1)^2}=\sqrt2$, pas $2$.
      - id: B
        text: "$\\sqrt2\\left(\\cos\\dfrac{\\pi}{4}+i\\sin\\dfrac{\\pi}{4}\\right)$"
        correct: false
        feedback: >
          Le module est correct, mais tu as oublié de vérifier le
          signe du sinus : ici $b=-1<0$, donc $\sin\theta<0$. Or
          $\sin(\pi/4)>0$. L'angle de référence $\pi/4$ est le bon,
          mais comme $\cos\theta>0$ ET $\sin\theta<0$, l'argument est
          $-\pi/4$, pas $\pi/4$.
      - id: C
        text: "$\\sqrt2\\left(\\cos\\dfrac{3\\pi}{4}+i\\sin\\dfrac{3\\pi}{4}\\right)$"
        correct: false
        feedback: >
          Cet angle correspond à $\cos\theta<0$ et $\sin\theta>0$, donc
          au point $(-1,1)$. Mais ici $z=1-i$ correspond au point
          $(1,-1)$ : les signes des deux coordonnées sont inversés par
          rapport à ce que suppose cette réponse.
      - id: D
        text: "$\\sqrt2\\left(\\cos\\left(-\\dfrac{\\pi}{4}\\right)+i\\sin\\left(-\\dfrac{\\pi}{4}\\right)\\right)$"
        correct: true
    correct_feedback: >
      $r=|z|=\sqrt{1^2+(-1)^2}=\sqrt2$, donc $\cos\theta=\dfrac{1}{\sqrt2}=\dfrac{\sqrt2}{2}$
      et $\sin\theta=\dfrac{-1}{\sqrt2}=-\dfrac{\sqrt2}{2}$. Ces deux
      valeurs correspondent à $\theta=-\pi/4$.
    solution: |
      **Étape 1 — module :**
      $$r = |z| = \sqrt{1^2+(-1)^2} = \sqrt2$$

      **Étape 2 — cosinus et sinus :**
      $$\cos\theta = \frac{1}{\sqrt2} = \frac{\sqrt2}{2}, \qquad \sin\theta = \frac{-1}{\sqrt2} = -\frac{\sqrt2}{2}$$

      **Étape 3 — quadrant et angle :** $\cos\theta>0$ et
      $\sin\theta<0$ place $M$ dans le quatrième quadrant. L'angle de
      référence est $\pi/4$ ; dans ce quadrant, $\theta=-\pi/4$.

      $$z = \sqrt2\left(\cos\left(-\frac{\pi}{4}\right)+i\sin\left(-\frac{\pi}{4}\right)\right)$$

  - id: NBCOMPLEX2-11
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["argument", "conjugue", "oppose"]
    stem: >
      On sait qu'un complexe $z$ non nul a pour argument
      $\theta=\dfrac{\pi}{5}$. Quel est un argument de $-\overline z$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{4\\pi}{5}$"
        correct: true
      - id: B
        text: "$\\dfrac{6\\pi}{5}$"
        correct: false
        feedback: >
          Tu as appliqué la règle de l'opposé ($\arg(-w)=\arg(w)+\pi$)
          directement à $\theta$, sans tenir compte du conjugué. Mais
          ici $w=\overline z$, pas $z$ : il faut d'abord changer le
          signe de l'argument à cause du conjugué ($\arg(\overline
          z)=-\theta$), PUIS ajouter $\pi$ pour l'opposé.
      - id: C
        text: "$-\\dfrac{\\pi}{5}$"
        correct: false
        feedback: >
          Tu as appliqué seulement la règle du conjugué
          ($\arg(\overline z)=-\theta$), mais oublié le signe « $-$ »
          devant $\overline z$, qui correspond à un demi-tour
          supplémentaire ($+\pi$). $-\overline z$ n'est pas
          $\overline z$ : il manque l'étape de l'opposé.
      - id: D
        text: "$\\dfrac{\\pi}{5}$"
        correct: false
        feedback: >
          Tu as sans doute pensé que les deux transformations (le
          conjugué et l'opposé) s'annulent l'une l'autre et redonnent
          l'argument de départ. Ce n'est pas le cas : elles se
          COMBINENT (changement de signe de $\theta$, PUIS ajout de
          $\pi$), elles ne s'annulent pas.
    correct_feedback: >
      $\arg(\overline z) = -\theta = -\pi/5$ (règle du conjugué), puis
      $\arg(-\overline z) = \arg(\overline z)+\pi = -\pi/5+\pi =
      4\pi/5$ (règle de l'opposé, appliquée ensuite).
    solution: |
      **Étape 1 — conjugué :** $\arg(\overline z) = -\arg(z) = -\dfrac{\pi}{5}\ [2\pi]$

      **Étape 2 — opposé du conjugué :**
      $$\arg(-\overline z) = \arg(\overline z) + \pi = -\frac{\pi}{5}+\pi = \frac{4\pi}{5}\ [2\pi]$$

      **Vérification sur un exemple concret :** prends $z=e^{i\pi/5}$.
      Alors $\overline z = e^{-i\pi/5}$ et $-\overline z =
      -e^{-i\pi/5} = e^{i\pi}e^{-i\pi/5} = e^{i(\pi-\pi/5)} =
      e^{i4\pi/5}$. Cohérent avec le résultat ci-dessus.

  - id: NBCOMPLEX2-12
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["produit", "module", "argument"]
    stem: >
      On donne $z = 3e^{i2\pi/3}$ et $z' = 5e^{-i\pi/6}$. Quelle est la
      forme exponentielle de $zz'$ ?
    type: mcq
    choices:
      - id: A
        text: "$8e^{i\\pi/2}$"
        correct: false
        feedback: >
          L'argument est correct, mais le module est faux : tu as
          ADDITIONNÉ les modules ($3+5=8$) au lieu de les multiplier.
          Pour un produit, les modules se MULTIPLIENT ($3\times5=15$) ;
          seuls les arguments s'additionnent.
      - id: B
        text: "$15e^{i\\pi/2}$"
        correct: true
      - id: C
        text: "$15e^{i5\\pi/6}$"
        correct: false
        feedback: >
          Le module est correct, mais tu as oublié le signe « $-$ »
          devant l'argument de $z'$ : tu as additionné $2\pi/3+\pi/6$
          comme si $z'$ avait pour argument $\pi/6$, alors qu'il vaut
          $-\pi/6$. Il fallait calculer $2\pi/3+(-\pi/6)$.
      - id: D
        text: "$15e^{i2\\pi/3}$"
        correct: false
        feedback: >
          Tu as multiplié correctement les modules, mais oublié
          d'ajouter l'argument de $z'$ : ce choix ne garde que
          l'argument de $z$ seul ($2\pi/3$), comme si $z'$ n'apportait
          rien à la direction. Il faut ajouter les DEUX arguments :
          $2\pi/3+(-\pi/6)$.
    correct_feedback: >
      Les modules se multiplient : $3\times5=15$. Les arguments
      s'additionnent : $2\pi/3+(-\pi/6) = 4\pi/6-\pi/6 = 3\pi/6 =
      \pi/2$. Donc $zz' = 15e^{i\pi/2}$.
    solution: |
      **Règle du produit (R2) :**
      $$|zz'| = |z|\times|z'| = 3\times5 = 15$$
      $$\arg(zz') = \arg(z)+\arg(z') = \frac{2\pi}{3}+\left(-\frac{\pi}{6}\right) = \frac{4\pi}{6}-\frac{\pi}{6} = \frac{3\pi}{6} = \frac{\pi}{2}$$
      $$zz' = 15e^{i\pi/2}$$

  - id: NBCOMPLEX2-13
    rung: "R2"
    difficulty_level: 2
    skill_code: maths_complexes_trigo
    tags: ["forme-exponentielle", "definition"]
    stem: >
      Quelle égalité correspond à la définition de la notation
      $e^{i\theta}$ posée dans ce chapitre ?
    type: mcq
    choices:
      - id: A
        text: "$\\cos\\theta - i\\sin\\theta$"
        correct: false
        feedback: >
          C'est l'expression de $e^{-i\theta}$ (ou de
          $\overline{e^{i\theta}}$), pas de $e^{i\theta}$ : tu as
          inversé le signe devant $\sin\theta$. Par définition,
          $e^{i\theta}=\cos\theta+i\sin\theta$, avec un « $+$ ».
      - id: B
        text: "$\\sin\\theta + i\\cos\\theta$"
        correct: false
        feedback: >
          Tu as inversé les rôles : c'est $\cos\theta$ qui donne la
          partie RÉELLE (en facteur de $1$) et $\sin\theta$ qui donne
          la partie IMAGINAIRE (en facteur de $i$), pas l'inverse. La
          définition est $e^{i\theta}=\cos\theta+i\sin\theta$.
      - id: C
        text: "$\\cos\\theta + i\\sin\\theta$"
        correct: true
      - id: D
        text: "$1 + i\\theta$"
        correct: false
        feedback: >
          Ce n'est pas la définition posée dans ce chapitre : ici,
          $e^{i\theta}$ est un NOM donné à $\cos\theta+i\sin\theta$,
          une égalité exacte pour tout $\theta$, pas une approximation
          linéaire valable seulement pour $\theta$ petit.
    correct_feedback: >
      Par définition, $e^{i\theta}=\cos\theta+i\sin\theta$ : le cosinus
      donne la partie réelle, le sinus (multiplié par $i$) donne la
      partie imaginaire.
    solution: |
      **Définition posée dans ce chapitre (R2) :**
      $$e^{i\theta} = \cos\theta + i\sin\theta$$

      Ce choix de notation est justifié parce qu'il vérifie
      $e^{i\theta}\times e^{i\theta'}=e^{i(\theta+\theta')}$, exactement
      comme une vraie exponentielle — c'est le calcul du R2, utilisant
      les formules d'addition trigonométrique, qui le garantit.

  - id: NBCOMPLEX2-14
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["quotient", "module", "argument"]
    stem: >
      On donne $z = 6e^{i\pi/2}$ et $z' = 2e^{i\pi/3}$. Quelle est la
      forme exponentielle de $\dfrac{z}{z'}$ ?
    type: mcq
    choices:
      - id: A
        text: "$3e^{i5\\pi/6}$"
        correct: false
        feedback: >
          Le module est correct, mais tu as ADDITIONNÉ les arguments
          ($\pi/2+\pi/3$) au lieu de les soustraire. L'addition des
          arguments correspond à un PRODUIT, pas à un quotient. Pour
          $z/z'$, il faut soustraire : $\pi/2-\pi/3$.
      - id: B
        text: "$4e^{i\\pi/6}$"
        correct: false
        feedback: >
          L'argument est correct, mais tu as SOUSTRAIT les modules
          ($6-2=4$) au lieu de les diviser. Pour un quotient, les
          modules se DIVISENT ($6\div2=3$) ; c'est seulement les
          arguments qui se soustraient.
      - id: C
        text: "$3e^{-i\\pi/6}$"
        correct: false
        feedback: >
          Le module est correct, mais tu as inversé l'ordre de la
          soustraction : tu as calculé $\arg(z')-\arg(z)$ au lieu de
          $\arg(z)-\arg(z')$. La règle du quotient donne
          $\arg(z/z')=\arg(z)-\arg(z')=\pi/2-\pi/3$, pas
          $\pi/3-\pi/2$.
      - id: D
        text: "$3e^{i\\pi/6}$"
        correct: true
    correct_feedback: >
      Les modules se divisent : $6\div2=3$. Les arguments se
      soustraient : $\pi/2-\pi/3 = 3\pi/6-2\pi/6 = \pi/6$. Donc
      $z/z' = 3e^{i\pi/6}$.
    solution: |
      **Règle du quotient (R3) :**
      $$\left|\frac{z}{z'}\right| = \frac{|z|}{|z'|} = \frac{6}{2} = 3$$
      $$\arg\!\left(\frac{z}{z'}\right) = \arg(z)-\arg(z') = \frac{\pi}{2}-\frac{\pi}{3} = \frac{3\pi}{6}-\frac{2\pi}{6} = \frac{\pi}{6}$$
      $$\frac{z}{z'} = 3e^{i\pi/6}$$

  - id: NBCOMPLEX2-15
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["moivre", "puissance", "periodicite"]
    stem: >
      Soit $z = e^{i\pi/3}$. Quelle est la forme la plus simple de
      $z^6$ ?
    type: mcq
    choices:
      - id: A
        text: "$1$"
        correct: true
      - id: B
        text: "$-1$"
        correct: false
        feedback: >
          Tu sembles avoir supposé qu'un argument se reproduit tous les
          $\pi$ (comme la tangente), alors que l'argument est
          $2\pi$-PÉRIODIQUE, pas $\pi$-périodique. Ici
          $\arg(z^6)=6\times\pi/3=2\pi\equiv0\ [2\pi]$, ce qui donne
          $1$, pas $-1$ (qui correspondrait à un argument de $\pi$).
      - id: C
        text: "$e^{i2\\pi/3}$"
        correct: false
        feedback: >
          Cet argument correspond à $2\times\pi/3$ : tu as multiplié
          l'argument par $2$ au lieu de $6$, comme si tu calculais
          $z^2$ plutôt que $z^6$. La formule de Moivre demande de
          multiplier l'argument par l'exposant TOUT ENTIER : $6\times
          \pi/3$.
      - id: D
        text: "$6$"
        correct: false
        feedback: >
          Tu as multiplié le module par $6$ ($1\times6=6$) au lieu de
          l'ÉLEVER à la puissance $6$ ($1^6=1$). La formule de Moivre
          élève le module à la puissance $n$ ; multiplier par $n$ est
          la règle d'un produit répété d'arguments, pas celle du
          module.
    correct_feedback: >
      Formule de Moivre : $|z^6|=|z|^6=1^6=1$ et
      $\arg(z^6)=6\times\pi/3=2\pi\equiv0\ [2\pi]$. Donc $z^6=e^{i0}=1$.
    solution: |
      **Formule de Moivre (R3) :**
      $$|z^6| = |z|^6 = 1^6 = 1$$
      $$\arg(z^6) = 6\times\frac{\pi}{3} = 2\pi \equiv 0\ [2\pi]$$

      **Réduction :** un argument se lit modulo $2\pi$ : $2\pi$ et $0$
      décrivent le même point. Donc
      $$z^6 = 1\times e^{i0} = 1$$

  - id: NBCOMPLEX2-16
    rung: "R4"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "complexe-quelconque"]
    stem: >
      Quelles sont les trois solutions, dans $\mathbb{C}$, de
      l'équation $z^3 = -8$, sous forme exponentielle ?
    type: mcq
    choices:
      - id: A
        text: "$-2$ seulement"
        correct: false
        feedback: >
          Tu n'as cherché de solution que parmi les RÉELS. Mais dans
          $\mathbb{C}$, une équation $z^n=Z$ (avec $Z\neq0$) a
          exactement $n$ solutions complexes distinctes. Ici $n=3$ :
          il y a trois racines, dont une seule est réelle ($-2$), les
          deux autres étant non réelles.
      - id: B
        text: "$2e^{i\\pi/3},\\ 2e^{i\\pi},\\ 2e^{i5\\pi/3}$"
        correct: true
      - id: C
        text: "$2e^{i\\pi/3},\\ 2e^{i\\pi},\\ 2e^{i7\\pi/3}$"
        correct: false
        feedback: >
          Tu as calculé $k=0$ et $k=1$ correctement, mais pour la
          troisième racine tu as pris $k=3$ au lieu de $k=2$. Il n'y a
          que $n=3$ racines distinctes, obtenues pour $k=0,1,2$ ;
          au-delà ($k=3$), on retombe sur une racine déjà trouvée :
          $2e^{i7\pi/3}=2e^{i\pi/3}$ (même angle, à $2\pi$ près). Ce
          choix ne donne donc que deux racines distinctes, pas trois.
      - id: D
        text: "$8e^{i\\pi/3},\\ 8e^{i\\pi},\\ 8e^{i5\\pi/3}$"
        correct: false
        feedback: >
          Les arguments sont corrects, mais le module est faux : tu as
          gardé $R=|{-8}|=8$ tel quel, au lieu de prendre sa racine
          CUBIQUE $\rho=R^{1/3}=8^{1/3}=2$. Le module de chaque racine
          est $\rho=2$, pas $R=8$.
    correct_feedback: >
      $-8=8e^{i\pi}$, donc $R=8$, $\Phi=\pi$. On calcule
      $\rho=8^{1/3}=2$ et $\alpha_k=\dfrac{\pi+2k\pi}{3}$ pour
      $k=0,1,2$ : $\pi/3$, $\pi$, $5\pi/3$.
    solution: |
      **Forme exponentielle de $Z=-8$ :** $R=|{-8}|=8$,
      $\Phi=\arg(-8)=\pi$.

      **Module des racines :** $\rho = R^{1/3} = 8^{1/3} = 2$

      **Arguments, pour $k=0,1,2$ :**
      $$\alpha_k = \frac{\pi+2k\pi}{3}$$
      $$k=0:\ \frac{\pi}{3} \qquad k=1:\ \frac{3\pi}{3}=\pi \qquad k=2:\ \frac{5\pi}{3}$$

      **Vérification sur $k=1$ :** $2e^{i\pi}=-2$, et
      $(-2)^3=-8=Z$. ✓

  - id: NBCOMPLEX2-17
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "unite", "placement"]
    stem: >
      Les six solutions de $z^6=1$ sont placées régulièrement sur le
      cercle trigonométrique. Quel est l'angle, en radians, entre deux
      racines consécutives ?
    type: mcq
    choices:
      - id: A
        text: "$2\\pi$"
        correct: false
        feedback: >
          $2\pi$ est l'angle d'un TOUR COMPLET, pas l'écart entre deux
          racines consécutives. Les $n=6$ racines se partagent le tour
          complet en $6$ parts égales : il faut diviser $2\pi$ par $6$,
          pas répondre par $2\pi$ lui-même.
      - id: B
        text: "$\\dfrac{\\pi}{6}$"
        correct: false
        feedback: >
          Tu as calculé $\pi/n$ au lieu de $2\pi/n$ : il manque le
          facteur $2$, qui vient du fait qu'un tour complet mesure
          $2\pi$ (pas $\pi$). L'écart correct est
          $2\pi/6=\pi/3$, pas $\pi/6$.
      - id: C
        text: "$\\dfrac{\\pi}{3}$"
        correct: true
      - id: D
        text: "$6$"
        correct: false
        feedback: >
          Tu as répondu avec le nombre de racines lui-même, pas avec
          un angle. L'écart entre deux racines consécutives est une
          mesure d'ANGLE, en radians : il faut diviser le tour complet
          $2\pi$ par le nombre de racines $n=6$, ce qui donne
          $\pi/3$, pas $6$.
    correct_feedback: >
      Les $n=6$ racines $n$-ièmes de l'unité sont régulièrement
      espacées sur le cercle trigonométrique, à
      $\dfrac{2\pi}{n}=\dfrac{2\pi}{6}=\dfrac{\pi}{3}$ l'une de
      l'autre.
    solution: |
      **Position des racines :** $z_k=e^{i2k\pi/6}$ pour
      $k=0,1,\ldots,5$.

      **Écart entre deux racines consécutives :**
      $$\alpha_{k+1}-\alpha_k = \frac{2(k+1)\pi}{6}-\frac{2k\pi}{6} = \frac{2\pi}{6} = \frac{\pi}{3}$$

      Les six racines partagent le tour complet ($2\pi$) en $6$ parts
      égales de $\pi/3$ chacune.

  - id: NBCOMPLEX2-18
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["rotation", "homothetie", "centre-quelconque"]
    stem: >
      On considère la transformation qui à $M$ d'affixe $z$ associe
      $M'$ d'affixe $z'$ telle que $z'-(1+i) = 2\big(z-(1+i)\big)$.
      Quelle est cette transformation ?
    type: mcq
    choices:
      - id: A
        text: "La composée d'une rotation de centre le point d'affixe $1+i$ et d'angle $\\pi/2$, et d'une homothétie de rapport $2$."
        correct: false
        feedback: >
          Il ne faut pas supposer par défaut qu'il y a une rotation :
          ici $c=2$ est un réel STRICTEMENT POSITIF, donc
          $\arg(c)=0$ — il n'y a AUCUNE rotation, seulement une
          homothétie. Le cas particulier du R5 le dit explicitement :
          si $c$ est réel positif, $\theta=0$.
      - id: B
        text: "La composée d'une rotation de centre $O$ et d'angle $0$, et d'une homothétie de centre $O$ et de rapport $2$."
        correct: false
        feedback: >
          L'angle et le rapport sont corrects, mais le CENTRE est
          faux : la transformation est écrite avec $z-(1+i)$ des deux
          côtés, donc elle est centrée au point d'affixe $1+i$, pas en
          $O$. Tu as appliqué les formules du cas centré en $O$ sans
          tenir compte du centrage en $A$.
      - id: C
        text: "Une rotation de centre le point d'affixe $1+i$ et d'angle $\\pi$."
        correct: false
        feedback: >
          Multiplier par un réel STRICTEMENT POSITIF ne produit jamais
          un demi-tour : $\arg(2)=0$, pas $\pi$. Tu as peut-être
          confondu avec la règle $\arg(-z)=\arg(z)+\pi$, qui concerne
          les réels NÉGATIFS, pas les réels positifs comme $c=2$ ici.
      - id: D
        text: "Une homothétie de centre le point d'affixe $1+i$ et de rapport $2$ (pas de rotation)."
        correct: true
    correct_feedback: >
      $c=2$ est un réel strictement positif : $|c|=2$ et
      $\arg(c)=0$. La transformation est donc une simple homothétie de
      centre $A$ (affixe $1+i$) et de rapport $2$, sans rotation.
    solution: |
      **Identification de $c$ :** l'écriture $z'-z_A=c(z-z_A)$ avec
      $z_A=1+i$ donne ici $c=2$.

      **Module et argument de $c=2$ :** $|c|=2$, $\arg(c)=0$ (réel
      strictement positif).

      **Conclusion (cas particulier du R5) :** quand $c$ est réel
      strictement positif, $\theta=0$ : il n'y a aucune rotation. La
      transformation est une homothétie de centre $A$ et de rapport
      $2$.

  - id: NBCOMPLEX2-19
