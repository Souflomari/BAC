          en $A$. Comme le centre n'est pas $O$ mais le point d'affixe
          $z_A=1-i$, il faut écrire la relation avec $z-z_A$ des deux
          côtés : $z'-z_A=e^{i\pi/3}(z-z_A)$.
      - id: C
        text: "$z' - (1-i) = e^{-i\\pi/3}\\,(z-(1-i))$"
        correct: false
        feedback: >
          Tu as utilisé $e^{-i\pi/3}$ (rotation dans le sens indirect,
          horaire) au lieu de $e^{i\pi/3}$ (sens direct). L'énoncé
          demande une rotation d'angle $+\pi/3$, donc le coefficient
          doit être $e^{i\pi/3}$, pas son opposé.
      - id: D
        text: "$z' - (1-i) = \\dfrac{\\pi}{3}\\,(z-(1-i))$"
        correct: false
        feedback: >
          Tu as utilisé l'angle $\pi/3$ lui-même comme coefficient
          multiplicateur, au lieu du nombre complexe $e^{i\pi/3}$ qui
          CODE cette rotation. Une rotation d'angle $\theta$
          correspond à une multiplication par $e^{i\theta}$, pas par
          $\theta$ (qui n'est même pas de module $1$).
    correct_feedback: >
      Une rotation de centre $A$ (affixe $z_A$) et d'angle $\theta$
      s'écrit $z'-z_A = e^{i\theta}(z-z_A)$. Ici $z_A=1-i$ et
      $\theta=\pi/3$, d'où $z'-(1-i) = e^{i\pi/3}(z-(1-i))$.
    solution: |
      **Formule générale (R5) :** une rotation de centre $A$ et
      d'angle $\theta$ s'écrit
      $$z' - z_A = e^{i\theta}(z-z_A)$$
      car $c=e^{i\theta}$ a pour module $1$ (pas d'homothétie) et pour
      argument $\theta$ (juste la rotation voulue).

      **Application :** avec $z_A=1-i$ et $\theta=\pi/3$ :
      $$z' - (1-i) = e^{i\pi/3}\,(z-(1-i))$$

  - id: NBCOMPLEX2-20
    rung: "R6"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["triangle", "alignement", "rapport-complexe"]
    stem: >
      $A$, $B$, $C$ ont pour affixes respectives $z_A=0$, $z_B=1$,
      $z_C=-2$. Que peut-on dire du triangle $ABC$, à partir de
      $w=\dfrac{z_C-z_A}{z_B-z_A}$ ?
    type: mcq
    choices:
      - id: A
        text: "Les points ne sont pas alignés, car $w=-2$ est négatif : un rapport négatif ne correspond pas à un alignement."
        correct: false
        feedback: >
          Le critère d'alignement est « $w$ RÉEL non nul », qu'il soit
          positif OU négatif — pas seulement positif. Un $w$ négatif
          signifie simplement que $C$ est du côté opposé à $B$ par
          rapport à $A$ sur la même droite : les points restent
          alignés.
      - id: B
        text: "$A$, $B$, $C$ sont alignés (avec $C$ du côté opposé à $B$ par rapport à $A$)."
        correct: true
      - id: C
        text: "Le triangle est rectangle en $A$, car $\\arg(w)=\\pi$ est un multiple de $\\pi/2$."
        correct: false
        feedback: >
          Le critère de « rectangle en $A$ » est « $w$ IMAGINAIRE PUR »
          (argument $\pm\pi/2$ exactement), pas « argument multiple de
          $\pi/2$ » au sens large. $\pi$ est bien un multiple de
          $\pi/2$ ($2\times\pi/2$), mais un argument de $\pi$
          correspond à un $w$ RÉEL (négatif), pas imaginaire pur.
      - id: D
        text: "Le triangle est isocèle en $A$ ($AB=AC$), car $|w|=2$."
        correct: false
        feedback: >
          Le critère d'isocèle en $A$ est précisément « $|w|=1$ », pas
          « $|w|$ est un nombre ». Ici $|w|=2\neq1$, donc
          $AC=2\times AB$ : les côtés ne sont PAS égaux, le triangle
          n'est pas isocèle en $A$.
    correct_feedback: >
      $w=\dfrac{-2-0}{1-0}=-2$, un réel non nul (négatif). D'après la
      table de lecture du R6, cela signifie que $A$, $B$, $C$ sont
      alignés — l'angle en $A$ vaut $\pi$ puisque $C$ est du côté
      opposé à $B$.
    solution: |
      **Calcul de $w$ :**
      $$w = \frac{z_C-z_A}{z_B-z_A} = \frac{-2-0}{1-0} = -2$$

      **Lecture :** $w=-2\in\mathbb{R}^*$ (réel non nul), donc $A,B,C$
      sont alignés (angle en $A$ égal à $0$ ou $\pi$ ; ici $\pi$
      puisque $w<0$).

      **Vérification directe :** $A(0,0)$, $B(1,0)$, $C(-2,0)$ sont
      bien tous les trois sur l'axe des réels.

  - id: NBCOMPLEX2-21
    rung: "R6"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["triangle", "rectangle", "rapport-complexe"]
    stem: >
      $A$, $B$, $C$ ont pour affixes respectives $z_A=0$, $z_B=2$,
      $z_C=3i$. On calcule
      $w=\dfrac{z_C-z_A}{z_B-z_A}=\dfrac{3}{2}i$. Que peut-on en
      déduire sur la nature du triangle $ABC$ ?
    type: mcq
    choices:
      - id: A
        text: "Rectangle ET isocèle en $A$, car $w$ est imaginaire pur."
        correct: false
        feedback: >
          « $w$ imaginaire pur » garantit seulement le caractère
          RECTANGLE en $A$ ; ce n'est pas le critère d'isocèle. Le
          critère d'isocèle en $A$ est SÉPARÉ : $|w|=1$. Ici
          $|w|=3/2\neq1$, donc le triangle n'est pas isocèle en $A$ —
          il faut vérifier les deux conditions indépendamment, pas
          déduire l'une de l'autre.
      - id: B
        text: "Isocèle en $A$ (car l'argument de $w$ vaut $\\pi/2$), mais pas rectangle (car $|w|\\neq1$)."
        correct: false
        feedback: >
          Les deux critères sont inversés : c'est l'ARGUMENT de $w$
          (imaginaire pur, $\pm\pi/2$) qui donne le caractère
          RECTANGLE, et c'est le MODULE de $w$ ($|w|=1$) qui donne le
          caractère ISOCÈLE — pas l'inverse. Ici l'argument $\pi/2$
          signale un angle droit en $A$, pas une égalité de longueurs.
      - id: C
        text: "Rectangle en $A$, mais pas isocèle en $A$ (car $|w|=3/2\\neq1$)."
        correct: true
      - id: D
        text: "Ni rectangle ni isocèle en $A$, car $w$ n'est ni réel ni de module $1$."
        correct: false
        feedback: >
          Tu as bien vu que $w$ n'est pas réel (donc pas d'alignement)
          et que $|w|\neq1$ (donc pas isocèle), mais tu en conclus à
          tort qu'il n'y a pas non plus de rectangle. Or « $w$
          imaginaire pur » EST précisément le critère du rectangle en
          $A$ — ce n'est pas la même chose que « $w$ n'est pas réel »,
          c'est une condition positive à part entière, qui est ici
          vérifiée.
    correct_feedback: >
      $\arg(w)=\pi/2$ (imaginaire pur) $\implies$ rectangle en $A$. Mais
      $|w|=3/2\neq1$ $\implies$ pas isocèle en $A$ : les deux critères
      sont indépendants, et ici seul le premier est vérifié.
    solution: |
      **Lecture du rapport $w=\dfrac{3}{2}i$ :**
      $$\arg(w) = \frac{\pi}{2} \implies \text{rectangle en } A$$
      $$|w| = \frac{3}{2} \neq 1 \implies \text{pas isocèle en } A$$

      **Vérification directe :** $A(0,0)$, $B(2,0)$, $C(0,3)$. Le
      vecteur $\vec{AB}=(2,0)$ et $\vec{AC}=(0,3)$ sont orthogonaux
      (produit scalaire nul) : angle droit en $A$ confirmé. Mais
      $AB=2\neq3=AC$ : pas isocèle en $A$, confirmé aussi.

  - id: NBCOMPLEX2-22
    rung: "R7"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["rotation", "ecriture-complexe", "application"]
    stem: >
      On considère le point $A$ d'affixe $z_A=1+i$ et la rotation $r$
      de centre $A$ et d'angle $\dfrac{\pi}{2}$, qui à tout point $M$
      d'affixe $z$ associe $M'$ d'affixe $z'$. Quelle est l'expression
      de $z'$ en fonction de $z$ ?
    type: mcq
    choices:
      - id: A
        text: "$z' = iz$"
        correct: false
        feedback: >
          Cette écriture correspond à une rotation centrée en $O$, pas
          en $A$. Il faut partir de $z'-z_A=i(z-z_A)$ (car
          $e^{i\pi/2}=i$) et isoler $z'$ en tenant compte de $z_A$, pas
          l'oublier.
      - id: B
        text: "$z' = iz+1-i$"
        correct: false
        feedback: >
          Tu as bien posé $z'-z_A=i(z-z_A)$, mais en isolant $z'$ tu
          as oublié de RAJOUTER $z_A$ à la fin : tu t'es arrêté à
          $z'=iz-iz_A$ au lieu de $z'=iz-iz_A+z_A$. Il manque le
          dernier « $+z_A$ ».
      - id: C
        text: "$z' = -iz+2i$"
        correct: false
        feedback: >
          Tu as utilisé $e^{-i\pi/2}=-i$ (rotation dans le sens
          indirect, horaire) au lieu de $e^{i\pi/2}=i$ (sens direct).
          L'énoncé demande une rotation d'angle $+\pi/2$, donc le
          coefficient multiplicateur doit être $i$, pas $-i$.
      - id: D
        text: "$z' = iz+2$"
        correct: true
    correct_feedback: >
      $z'-z_A=e^{i\pi/2}(z-z_A)=i(z-z_A)$, avec $z_A=1+i$. En
      développant : $z'=iz-i(1+i)+(1+i)=iz-i+1+1+i=iz+2$.
    solution: |
      **Écriture de la rotation (R5) :**
      $$z' - z_A = e^{i\pi/2}(z-z_A) = i(z-z_A)$$

      **Isolement de $z'$, avec $z_A=1+i$ :**
      $$z' = iz - i\,z_A + z_A = iz - i(1+i) + (1+i)$$
      $$-i(1+i) = -i - i^2 = -i+1 = 1-i$$
      $$z' = iz + (1-i) + (1+i) = iz + 2$$

      **Vérification :** $A$ doit être fixe : $z=1+i \Rightarrow
      z'=i(1+i)+2 = i-1+2 = 1+i = z_A$. ✓

  - id: NBCOMPLEX2-23
    rung: "R7"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "application"]
    stem: >
      Quelles sont, sous forme exponentielle, les trois solutions dans
      $\mathbb{C}$ de l'équation $z^3 = -8i$ ?
    type: mcq
    choices:
      - id: A
        text: "$2e^{-i\\pi/6},\\ 2e^{i\\pi/2},\\ 2e^{i7\\pi/6}$"
        correct: true
      - id: B
        text: "$8e^{-i\\pi/6},\\ 8e^{i\\pi/2},\\ 8e^{i7\\pi/6}$"
        correct: false
        feedback: >
          Les arguments sont corrects, mais le module est faux : tu as
          gardé $R=|{-8i}|=8$ tel quel au lieu de prendre sa racine
          CUBIQUE $\rho=8^{1/3}=2$. Le module de chaque racine est
          $2$, pas $8$.
      - id: C
        text: "$2e^{i\\pi/6},\\ 2e^{i5\\pi/6},\\ 2e^{i3\\pi/2}$"
        correct: false
        feedback: >
          Tu as pris $\Phi=\pi/2$, l'argument de $8i$ (l'exemple du
          cours), au lieu de calculer l'argument de $-8i$. Le signe
          change tout : $-8i$ est sur la partie NÉGATIVE de l'axe
          imaginaire, donc $\Phi=-\pi/2$, pas $+\pi/2$. Il faut
          recalculer l'argument à chaque nouvel exercice, pas réutiliser
          celui d'un exemple déjà rencontré.
      - id: D
        text: "$2e^{-i\\pi/6}$ seulement"
        correct: false
        feedback: >
          Tu t'es arrêté à $k=0$. Une équation $z^3=Z$ (avec
          $Z\neq0$) a exactement $3$ solutions distinctes, pour
          $k=0,1,2$ : il manque les deux autres racines.
    correct_feedback: >
      $-8i = 8e^{-i\pi/2}$, donc $R=8$, $\Phi=-\pi/2$. On calcule
      $\rho=8^{1/3}=2$ et $\alpha_k=\dfrac{-\pi/2+2k\pi}{3}$ pour
      $k=0,1,2$ : $-\pi/6$, $\pi/2$, $7\pi/6$.
    solution: |
      **Forme exponentielle de $Z=-8i$ :** $R=|{-8i}|=8$,
      $\Phi=\arg(-8i)=-\pi/2$ (point sur la partie négative de l'axe
      imaginaire).

      **Module des racines :** $\rho = R^{1/3} = 8^{1/3} = 2$

      **Arguments, pour $k=0,1,2$ :**
      $$\alpha_k = \frac{-\pi/2+2k\pi}{3}$$
      $$k=0:\ -\frac{\pi}{6} \qquad k=1:\ \frac{3\pi/2}{3}=\frac{\pi}{2} \qquad k=2:\ \frac{7\pi/2}{3}=\frac{7\pi}{6}$$

      **Vérification sur $k=1$ :** $\left(2e^{i\pi/2}\right)^3 =
      8e^{i3\pi/2} = 8\left(\cos\frac{3\pi}{2}+i\sin\frac{3\pi}{2}\right)
      = 8(0-i) = -8i = Z$. ✓

  - id: NBCOMPLEX2-24
    rung: "R7"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["ensemble-de-points", "cercle", "argument"]
    stem: >
      Soient $A$ et $B$ d'affixes respectives $z_A=-1$ et $z_B=3$. On
      note $\Gamma$ l'ensemble des points $M$ d'affixe $z\neq z_B$
      tels que $\dfrac{z-z_A}{z-z_B}$ soit un imaginaire pur non nul.
      Que peut-on dire de $\Gamma$ ?
    type: mcq
    choices:
      - id: A
        text: "La médiatrice du segment $[AB]$."
        correct: false
        feedback: >
          La médiatrice de $[AB]$ correspond à la condition
          $|z-z_A|=|z-z_B|$ (équidistance), pas à « imaginaire pur ».
          Ici la condition porte sur l'ARGUMENT du rapport (un angle
          droit), pas sur l'égalité de deux distances : ce n'est pas
          le même type de lieu.
      - id: B
        text: "Le cercle de diamètre $[AB]$ (centre le point d'affixe $1$, rayon $2$), privé des points $A$ et $B$."
        correct: true
      - id: C
        text: "Le cercle de centre $A$ et de rayon $AB=4$."
        correct: false
        feedback: >
          Tu as traité cette condition comme si elle donnait « $M$ à
          distance constante de $A$ » (un cercle centré en $A$, comme
          au chapitre 1 avec $|z-z_A|=r$). Mais « imaginaire pur »
          porte sur un ANGLE (le rapport $(z-z_A)/(z-z_B)$ code
          l'angle en $M$ entre $MA$ et $MB$), pas sur une distance
          fixe à $A$ : le cercle obtenu est centré au MILIEU de
          $[AB]$, pas en $A$.
      - id: D
        text: "La droite $(AB)$ privée du point $B$."
        correct: false
        feedback: >
          Tu as inversé les deux lignes de la table de lecture du R6 :
          c'est « $w$ RÉEL » qui donne un alignement (une droite), et
          « $w$ IMAGINAIRE PUR » qui donne un angle droit (un cercle,
          par le théorème de Thalès), pas l'inverse.
    correct_feedback: >
      $\dfrac{z-z_A}{z-z_B}$ imaginaire pur non nul signifie que
      l'angle $(\overrightarrow{MB},\overrightarrow{MA})$ vaut
      $\pm\pi/2$ : le triangle $MAB$ est rectangle en $M$. Par le
      théorème de Thalès, $M$ décrit le cercle de diamètre $[AB]$
      (centre le milieu de $[AB]$, affixe $1$, rayon $AB/2=2$), privé
      de $A$ et $B$.
    solution: |
      **Interprétation du rapport :** pour $M$ d'affixe $z\neq z_A,z_B$,
      $\dfrac{z-z_A}{z-z_B}$ a pour argument l'angle
      $(\overrightarrow{MB},\overrightarrow{MA})$ (même principe qu'au
      R6, avec $M$ au rôle du sommet).

      **Condition « imaginaire pur non nul » :** cet argument vaut
      $\pm\pi/2\ [2\pi]$, donc le triangle $MAB$ est rectangle en $M$.

      **Théorème de Thalès (réciproque) :** l'ensemble des points $M$
      tels que le triangle $MAB$ soit rectangle en $M$ est le cercle
      de diamètre $[AB]$, privé de $A$ et de $B$ (où l'angle n'est pas
      défini).

      **Centre et rayon :** centre $=\dfrac{z_A+z_B}{2}=\dfrac{-1+3}{2}=1$,
      rayon $=\dfrac{AB}{2}=\dfrac{|z_B-z_A|}{2}=\dfrac{4}{2}=2$.
