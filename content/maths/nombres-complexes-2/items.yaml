notion: nombres-complexes-2
skill_code: maths_complexes_trigo
# Misconception inventory (backfilled in the summit-conversion pass). This end
# bank was authored BEFORE the inventory existed (`misconceptions: []`), so each
# item now carries an item-level `primary_misconception` AND every distractor
# carries a per-distractor `misconception:` field (the gold standard shown in
# checkpoints.yaml). See coverage_summary at the end for honest counts and the
# under-covered models flagged for a follow-up item pass — NO counts padded.
# Namespace: mc.math.maths_complexes_trigo.<slug> (le chapitre 1 utilise
# maths_complexes_algebrique ; ce chapitre 2 est la forme trigo/exponentielle).
misconceptions:
  - id: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
    label: >-
      « Multiplier par i vu comme un agrandissement, une translation ou une symétrie, pas une rotation »
    description: >-
      L'élève interprète z ↦ iz (ou plus généralement la multiplication par un
      complexe) comme un changement de taille, un déplacement, ou une symétrie
      axiale, au lieu d'une rotation d'un quart de tour.
    contradicts_principle: >-
      i = e^{iπ/2} a pour module 1 (aucun agrandissement) et pour argument π/2 :
      multiplier par i est une rotation de centre O et d'angle π/2, ni
      translation (qui vient d'une addition) ni symétrie (qui vient du conjugué).
  - id: mc.math.maths_complexes_trigo.argument-un-seul-signe
    label: >-
      « Argument lu sur le seul angle de référence, sans fixer le quadrant par cos ET sin »
    description: >-
      L'élève donne l'angle de référence (ou son opposé) sans vérifier
      séparément les signes de cos θ et de sin θ, et se trompe donc de quadrant.
    contradicts_principle: >-
      L'argument est déterminé par cos θ = a/r ET sin θ = b/r simultanément : ce
      sont les DEUX signes qui fixent le quadrant, pas la seule valeur absolue de
      l'angle de référence.
  - id: mc.math.maths_complexes_trigo.module-oubli-racine
    label: >-
      « Module sans la racine carrée finale (on rend a²+b² au lieu de √(a²+b²)) »
    description: >-
      L'élève calcule a²+b² et s'arrête là, oubliant de prendre la racine carrée
      pour obtenir le module.
    contradicts_principle: >-
      Le module est |z| = √(a²+b²) : la racine carrée est la dernière étape
      obligatoire, a²+b² n'est que le carré du module.
  - id: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
    label: >-
      « Composition erronée de arg(conjugué de z) = −arg(z) et arg(−z) = arg(z)+π »
    description: >-
      Devant l'opposé d'un conjugué, l'élève n'applique qu'une des deux règles,
      les enchaîne dans le mauvais ordre, ou croit qu'elles s'annulent.
    contradicts_principle: >-
      arg(conjugué de z) = −arg(z) et arg(−z) = arg(z)+π se COMPOSENT : pour
      l'opposé du conjugué on change d'abord le signe puis on ajoute π, les deux
      transformations ne s'annulent pas.
  - id: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
    label: >-
      « Mauvaise définition de e^{iθ} (signe du sinus, cos/sin intervertis, 1+iθ) »
    description: >-
      L'élève écrit e^{iθ} = cos θ − i sin θ, ou sin θ + i cos θ, ou l'approxime
      par 1 + iθ.
    contradicts_principle: >-
      Par définition, e^{iθ} = cos θ + i sin θ (cosinus en partie réelle, sinus
      en partie imaginaire, signe +) : c'est une égalité exacte pour tout θ, pas
      une approximation.
  - id: mc.math.maths_complexes_trigo.produit-modules-additionnes
    label: >-
      « Modules additionnés (ou soustraits) au lieu d'être multipliés (ou divisés) »
    description: >-
      Pour un produit, l'élève additionne les modules ; pour un quotient, il les
      soustrait.
    contradicts_principle: >-
      |zz'| = |z|·|z'| et |z/z'| = |z|/|z'| : les modules se MULTIPLIENT (produit)
      ou se DIVISENT (quotient) ; seuls les arguments s'additionnent ou se
      soustraient.
  - id: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
    label: >-
      « Mauvaise opération, ordre ou oubli sur les arguments (produit vs quotient) »
    description: >-
      L'élève soustrait les arguments pour un produit, les additionne pour un
      quotient, inverse l'ordre de la soustraction, ou oublie un terme ou un
      signe.
    contradicts_principle: >-
      arg(zz') = arg(z)+arg(z') (produit) et arg(z/z') = arg(z)−arg(z')
      (quotient, dans cet ordre) : l'opération sur les arguments suit celle des
      modules, sans terme ni signe oublié.
  - id: mc.math.maths_complexes_trigo.moivre-module-multiplie
    label: >-
      « Module multiplié par n au lieu d'être élevé à la puissance n (Moivre) »
    description: >-
      Pour z^n, l'élève calcule n·|z| au lieu de |z|^n.
    contradicts_principle: >-
      Formule de Moivre : |z^n| = |z|^n, le module s'ÉLÈVE à la puissance n ;
      c'est l'argument, lui, qui se multiplie par n.
  - id: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
    label: >-
      « Argument divisé, laissé inchangé ou mal multiplié au lieu d'être multiplié par n »
    description: >-
      Pour z^n, l'élève divise l'argument par n, le laisse tel quel, ou le
      multiplie par un mauvais facteur.
    contradicts_principle: >-
      Formule de Moivre : arg(z^n) = n·arg(z), l'argument se MULTIPLIE par n (le
      diviser correspondrait à une racine, le laisser inchangé ignore la
      puissance).
  - id: mc.math.maths_complexes_trigo.argument-non-2pi-periodique
    label: >-
      « Argument traité comme π-périodique au lieu de 2π-périodique »
    description: >-
      L'élève réduit un argument modulo π (comme la tangente), confondant par
      exemple 2π avec π.
    contradicts_principle: >-
      L'argument est défini à 2π près : 2π ≡ 0 (retour au point de départ), pas
      ≡ π. La période est 2π, pas π.
  - id: mc.math.maths_complexes_trigo.equation-complexe-cherche-reels
    label: >-
      « On ne cherche que les solutions réelles de z^n = Z »
    description: >-
      L'élève ne donne que les racines réelles évidentes, comme si l'équation
      vivait dans R.
    contradicts_principle: >-
      Dans C, z^n = Z (Z ≠ 0) a exactement n racines distinctes ; se limiter aux
      réelles en oublie la plupart (ex. z^4 = 1 a aussi i et −i).
  - id: mc.math.maths_complexes_trigo.racines-nombre-incomplet
    label: >-
      « Mauvais nombre de racines : on s'arrête trop tôt, on dupliqué, pas exactement n »
    description: >-
      L'élève donne moins de n racines (arrêt prématuré) ou en répète (mauvais
      domaine de k), au lieu d'exactement n distinctes.
    contradicts_principle: >-
      z^n = Z (Z ≠ 0) a EXACTEMENT n racines distinctes, obtenues pour
      k = 0,1,…,n−1 ; au-delà on retombe sur une racine déjà trouvée (période n).
  - id: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
    label: >-
      « Mauvais écart angulaire entre racines consécutives (≠ 2π/n) »
    description: >-
      L'élève espace les racines de π/n, de 2π, ou d'un autre pas au lieu de
      2π/n.
    contradicts_principle: >-
      Les n racines n-ièmes se répartissent régulièrement sur le cercle, à un
      écart de 2π/n l'une de l'autre (le tour complet 2π partagé en n parts).
  - id: mc.math.maths_complexes_trigo.racines-module-non-racine
    label: >-
      « Module des racines gardé à R au lieu de R^{1/n} »
    description: >-
      Pour z^n = Z avec |Z| = R, l'élève donne des racines de module R au lieu de
      R^{1/n}.
    contradicts_principle: >-
      Le module d'une racine n-ième de Z est R^{1/n} (la racine n-ième réelle de
      R = |Z|), pas R lui-même : chaque racine élevée à la puissance n doit
      redonner le module R.
  - id: mc.math.maths_complexes_trigo.similitude-module-argument-roles
    label: >-
      « Rôles du module et de l'argument de c intervertis dans z ↦ cz »
    description: >-
      L'élève prend l'argument de c comme rapport d'homothétie et son module
      comme angle de rotation, ou confond les deux lectures.
    contradicts_principle: >-
      Dans z ↦ cz, |c| est le rapport de l'homothétie (une longueur) et arg(c)
      est l'angle de la rotation : le module ne peut pas être un angle, ni
      l'argument une longueur.
  - id: mc.math.maths_complexes_trigo.homothetie-rapport-complexe
    label: >-
      « Le complexe c pris tel quel comme rapport d'homothétie »
    description: >-
      L'élève annonce un rapport d'homothétie complexe (ex. « rapport 2i ») au
      lieu du réel |c|.
    contradicts_principle: >-
      Le rapport d'une homothétie est toujours un RÉEL : dans z ↦ cz c'est |c|,
      pas c ; le nombre complexe c code À LA FOIS la rotation et l'homothétie.
  - id: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
    label: >-
      « On suppose une rotation alors que c est un réel strictement positif »
    description: >-
      Devant c réel strictement positif, l'élève invente une rotation (souvent
      d'angle π), au lieu de conclure qu'il n'y en a aucune.
    contradicts_principle: >-
      Si c est réel strictement positif, arg(c) = 0 : aucune rotation, seulement
      une homothétie. Un demi-tour (π) correspondrait à c réel NÉGATIF.
  - id: mc.math.maths_complexes_trigo.transformation-centre-oublie
    label: >-
      « Transformation écrite centrée en O alors que le centre est A »
    description: >-
      L'élève écrit z' = c·z (centrée en O) pour une transformation de centre A,
      oubliant les termes z − z_A.
    contradicts_principle: >-
      Une rotation/similitude de centre A s'écrit z' − z_A = c(z − z_A) : le
      z − z_A des deux côtés est ce qui fixe A comme centre ; z' = cz ne fixe
      que O.
  - id: mc.math.maths_complexes_trigo.rotation-sens-inverse
    label: >-
      « e^{−iθ} utilisé au lieu de e^{iθ} (mauvais sens de rotation) »
    description: >-
      L'élève prend le coefficient e^{−iθ} (sens indirect) pour une rotation
      d'angle +θ.
    contradicts_principle: >-
      Une rotation d'angle +θ (sens direct) a pour coefficient e^{iθ} ; e^{−iθ}
      code la rotation d'angle −θ (sens indirect, horaire).
  - id: mc.math.maths_complexes_trigo.rotation-angle-comme-coefficient
    label: >-
      « θ utilisé comme coefficient au lieu de e^{iθ} »
    description: >-
      L'élève multiplie par l'angle θ lui-même (ex. par π/2) au lieu de e^{iθ}.
    contradicts_principle: >-
      Une rotation d'angle θ multiplie par e^{iθ}, de module 1 ; θ n'est qu'un
      angle (même pas de module 1) et ne peut pas servir de coefficient.
  - id: mc.math.maths_complexes_trigo.ecriture-complexe-oubli-constante
    label: >-
      « En isolant z', on oublie de rajouter z_A »
    description: >-
      Partant de z' − z_A = c(z − z_A), l'élève s'arrête à z' = cz − c·z_A et
      oublie le + z_A final.
    contradicts_principle: >-
      En développant z' − z_A = c(z − z_A), on obtient z' = cz − c·z_A + z_A :
      le + z_A terminal est indispensable (sinon A n'est plus fixe).
  - id: mc.math.maths_complexes_trigo.lecture-w-module-argument
    label: >-
      « Lecture partielle ou intervertie de |w| (isocèle) et arg(w) (rectangle/aligné) »
    description: >-
      Pour w = (z_C−z_A)/(z_B−z_A), l'élève échange les rôles du module et de
      l'argument, ou n'en lit qu'un des deux, pour la nature du triangle.
    contradicts_principle: >-
      |w| donne le rapport AC/AB (isocèle en A si |w| = 1) et arg(w) donne
      l'angle en A (rectangle si ±π/2, aligné si réel) : deux critères SÉPARÉS,
      chacun sur sa grandeur.
  - id: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
    label: >-
      « Lieux confondus (médiatrice / cercle centré / droite) pour une condition sur un rapport »
    description: >-
      L'élève identifie l'ensemble défini par une condition sur le module ou
      l'argument d'un rapport de complexes au mauvais lieu (médiatrice, cercle
      centré en A, droite (AB)).
    contradicts_principle: >-
      « Rapport réel » donne un alignement (droite) ; « module constant » donne
      un cercle ou une médiatrice selon la forme ; « rapport imaginaire pur »
      donne un angle droit, donc le cercle de diamètre [AB] : chaque condition a
      son lieu propre.
  # Deux modèles neufs (scène `plan-complexe-transformation`, R5 / chapitre 6 —
  # docs/pipeline/propositions/maths-nombres-complexes-2-scene-plan.md §8.2,
  # vague 1, 2026-09-25). Servis par NBCOMPLEX2-35 à -41 (§8.3).
  - id: mc.math.maths_complexes_trigo.multiplication-rotation-par-defaut
    label: >-
      « Toute multiplication fait tourner — et d'un quart de tour : l'angle est
      celui de i, jamais celui qu'on lit sur le coefficient »
    description: >-
      Ayant vu que z ↦ iz est une rotation d'un quart de tour, l'élève
      généralise : toute multiplication par un complexe ferait tourner, et
      d'un quart de tour par défaut. Il applique une rotation là où le
      coefficient n'en porte aucune (c réel positif), ou un quart de tour là
      où l'argument du coefficient vaut tout autre chose (π/6, π/4). Le
      symptôme mécanique est constant : arg(c) n'est jamais calculé.
    contradicts_principle: >-
      L'angle d'une multiplication par c est arg(c), et rien d'autre : il se
      LIT sur le coefficient, il ne se suppose pas. i = e^{iπ/2} fait tourner
      d'un quart de tour parce que SON argument vaut π/2 ; un c d'argument 0
      (réel positif) ne fait tourner de rien, un c d'argument π/6 fait tourner
      de π/6. Le quart de tour est une propriété de i, pas de la
      multiplication.
  - id: mc.math.maths_complexes_trigo.angle-lu-depuis-l-axe
    label: >-
      « Angle d'une transformation lu comme une DIRECTION (depuis l'axe réel)
      au lieu de l'ÉCART entre deux directions »
    description: >-
      Devant M et son image M′, l'élève donne arg(z′) — la direction de
      l'image mesurée depuis l'axe réel — comme angle de la rotation ; ou
      donne arg(z′ − z), la direction du déplacement. Forme jumelle sur les
      longueurs : il donne OM′ pour le rapport de l'homothétie, au lieu du
      quotient OM′/OM. Dans les deux cas la grandeur et l'opération sont les
      bonnes ; c'est le point de départ de la mesure qui est faux.
    contradicts_principle: >-
      L'angle d'une rotation (ou d'une rotation-homothétie) de centre Ω est
      l'ÉCART arg(z′ − z_Ω) − arg(z − z_Ω) = arg((z′ − z_Ω)/(z − z_Ω)) =
      arg(c), et son rapport est le QUOTIENT ΩM′/ΩM = |c|. arg(z′) ne donne
      l'angle que si arg(z − z_Ω) = 0, et OM′ ne donne le rapport que si
      ΩM = 1 : deux cas particuliers, pas la règle.
items:
  - id: NBCOMPLEX2-1
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["argument", "quadrant"]
    primary_misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
    stem: >
      Quel est un argument de $z = -\sqrt3 + i$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{5\\pi}{6}$"
        correct: true
      - id: B
        text: "$\\dfrac{\\pi}{6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
        feedback: >
          Tu as trouvé le bon angle de référence ($\tan$ vaut $1/\sqrt3$
          en valeur absolue) mais tu as oublié de vérifier le signe de
          $\cos\theta$ ET $\sin\theta$ séparément. Ici $a=-\sqrt3<0$ et
          $b=1>0$ : le point est dans le demi-plan gauche, donc l'argument
          n'est pas l'angle de référence $\pi/6$ lui-même, mais $\pi$
          moins cet angle.
      - id: C
        text: "$-\\dfrac{\\pi}{6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
        feedback: >
          Ce choix placerait le point dans le quadrant où $a>0$ et $b<0$.
          Mais ici $a=-\sqrt3<0$ (partie réelle négative) et $b=1>0$
          (partie imaginaire positive) : les deux signes sont à l'opposé
          de ce que suppose cette réponse.
      - id: D
        text: "$\\dfrac{7\\pi}{6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
        feedback: >
          Cet angle correspond à $\cos\theta<0$ ET $\sin\theta<0$ — c'est
          le quadrant où les DEUX coordonnées sont négatives. Ici
          $b=1>0$ : la partie imaginaire est positive, pas négative.
          Vérifie les deux signes séparément, pas seulement celui de $a$.
    correct_feedback: >
      $r=|z|=\sqrt{3+1}=2$, donc $\cos\theta=-\dfrac{\sqrt3}{2}$ et
      $\sin\theta=\dfrac12$. Ces deux valeurs correspondent à
      $\theta=\dfrac{5\pi}{6}$ : l'angle de référence est $\pi/6$, mais
      comme $\cos\theta<0$ et $\sin\theta>0$, le point est dans le
      deuxième quadrant, donc $\theta = \pi - \pi/6 = 5\pi/6$.
    solution: |
      **Étape 1 — module :**
      $$r = |z| = \sqrt{(-\sqrt3)^2+1^2} = \sqrt{3+1} = 2$$

      **Étape 2 — cosinus et sinus :**
      $$\cos\theta = \frac{-\sqrt3}{2}, \qquad \sin\theta = \frac{1}{2}$$

      **Étape 3 — identifier le quadrant puis l'angle :** $\cos\theta<0$
      et $\sin\theta>0$ place $M$ dans le deuxième quadrant. L'angle de
      référence, dont le cosinus et le sinus valent $\sqrt3/2$ et $1/2$
      en valeur absolue, est $\pi/6$. Dans le deuxième quadrant, l'angle
      vaut $\pi$ moins cet angle de référence :
      $$\theta = \pi - \frac{\pi}{6} = \frac{5\pi}{6}$$

  - id: NBCOMPLEX2-2
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["produit", "module", "argument"]
    primary_misconception: mc.math.maths_complexes_trigo.produit-modules-additionnes
    stem: >
      On donne $z = 2e^{i\pi/3}$ et $z' = 3e^{i\pi/6}$. Quelle est la
      forme exponentielle de $zz'$ ?
    type: mcq
    choices:
      - id: A
        text: "$6e^{i\\pi/2}$"
        correct: true
      - id: B
        text: "$5e^{i\\pi/2}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-modules-additionnes
        feedback: >
          L'argument est correct, mais le module est faux : tu as
          additionné les modules ($2+3=5$) au lieu de les multiplier. Pour
          un produit, les modules se MULTIPLIENT ($2\times3=6$) — c'est
          la même règle que pour les arguments qui, eux, s'additionnent ;
          les deux opérations ne sont pas interchangeables.
      - id: C
        text: "$6e^{i\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
        feedback: >
          Le module est correct, mais l'argument est faux : tu as
          soustrait les arguments ($\pi/3-\pi/6$) au lieu de les
          additionner. La soustraction des arguments correspond à un
          QUOTIENT, pas à un produit. Pour $zz'$, les arguments
          s'additionnent : $\pi/3+\pi/6$.
      - id: D
        text: "$6e^{i\\pi/3}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
        feedback: >
          Tu as multiplié correctement les modules, mais oublié
          d'ajouter l'argument de $z'$ : ce choix ne garde que
          l'argument de $z$ seul ($\pi/3$), comme si $z'$ n'apportait
          rien à la direction du produit. Il faut ajouter les DEUX
          arguments : $\pi/3+\pi/6$.
    correct_feedback: >
      Les modules se multiplient : $2\times3=6$. Les arguments
      s'additionnent : $\pi/3+\pi/6 = 2\pi/6+\pi/6 = \pi/2$. Donc
      $zz' = 6e^{i\pi/2}$.
    solution: |
      **Règle du produit (chapitre 3) :**
      $$|zz'| = |z|\times|z'| = 2\times3 = 6$$
      $$\arg(zz') = \arg(z)+\arg(z') = \frac{\pi}{3}+\frac{\pi}{6} = \frac{2\pi}{6}+\frac{\pi}{6} = \frac{\pi}{2}$$
      $$zz' = 6e^{i\pi/2}$$

  - id: NBCOMPLEX2-3
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["moivre", "puissance"]
    primary_misconception: mc.math.maths_complexes_trigo.moivre-module-multiplie
    stem: >
      Soit $z = 2e^{i\pi/6}$. Quelle est la forme exponentielle de $z^3$ ?
    type: mcq
    choices:
      - id: A
        text: "$8e^{i\\pi/2}$"
        correct: true
      - id: B
        text: "$6e^{i\\pi/2}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-module-multiplie
        feedback: >
          L'argument est correct, mais le module est faux : tu as
          multiplié le module par $3$ ($2\times3=6$) au lieu de
          l'ÉLEVER à la puissance $3$ ($2^3=8$). La formule de Moivre
          élève le module à la puissance $n$ ; multiplier par $n$ est la
          règle du produit répété, pas celle de la puissance.
      - id: C
        text: "$8e^{i\\pi/18}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
        feedback: >
          Le module est correct, mais l'argument est faux : tu as
          DIVISÉ l'argument par $3$ ($\pi/6\div3=\pi/18$) au lieu de le
          MULTIPLIER par $3$. Diviser l'argument correspondrait à
          chercher une racine, pas à calculer une puissance. La formule
          de Moivre dit $\arg(z^n)=n\arg(z)$.
      - id: D
        text: "$8e^{i\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
        feedback: >
          Tu as bien élevé le module à la puissance $3$, mais tu as
          laissé l'argument inchangé, comme si élever à la puissance ne
          touchait que le module. La formule de Moivre multiplie AUSSI
          l'argument par $3$ : $\arg(z^3)=3\times\pi/6=\pi/2$.
    correct_feedback: >
      Formule de Moivre : le module s'élève à la puissance $3$
      ($2^3=8$), et l'argument se multiplie par $3$
      ($3\times\pi/6=\pi/2$). Donc $z^3 = 8e^{i\pi/2}$.
    solution: |
      **Formule de Moivre (chapitre 4) :**
      $$|z^3| = |z|^3 = 2^3 = 8$$
      $$\arg(z^3) = 3\arg(z) = 3\times\frac{\pi}{6} = \frac{\pi}{2}$$
      $$z^3 = 8e^{i\pi/2}$$

  - id: NBCOMPLEX2-4
    rung: "R4"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "unite"]
    primary_misconception: mc.math.maths_complexes_trigo.racines-nombre-incomplet
    stem: >
      Quelles sont les solutions, dans $\mathbb{C}$, de l'équation
      $z^4 = 1$ ?
    type: mcq
    choices:
      - id: A
        text: "$1,\\ i,\\ -1,\\ -i$"
        correct: true
      - id: B
        text: "$1$ et $-1$ seulement"
        correct: false
        misconception: mc.math.maths_complexes_trigo.equation-complexe-cherche-reels
        feedback: >
          Cette réponse ne cherche des solutions que parmi les nombres
          RÉELS, comme si l'équation vivait dans $\mathbb{R}$. Mais on
          résout dans $\mathbb{C}$ : une équation $z^n=1$ a exactement
          $n$ solutions complexes distinctes (les racines n-ièmes de
          l'unité), pas seulement les solutions réelles évidentes.
      - id: C
        text: "$1$ et $i$ seulement"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-nombre-incomplet
        feedback: >
          L'équation $z^4=1$ a exactement $4$ solutions distinctes
          (une pour chaque $k=0,1,2,3$ dans $z_k=e^{i2k\pi/4}$), pas
          $2$. Tu t'es arrêté trop tôt : il manque les racines
          correspondant à $k=2$ et $k=3$, soit $-1$ et $-i$.
      - id: D
        text: "$1,\\ e^{i\\pi/4},\\ e^{i\\pi/2},\\ e^{i3\\pi/4}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
        feedback: >
          L'écart entre deux racines consécutives doit être
          $\dfrac{2\pi}{n}=\dfrac{2\pi}{4}=\dfrac{\pi}{2}$, pas $\pi/4$.
          Ces valeurs correspondraient à un pas deux fois trop petit
          (comme pour les racines 8-ièmes de l'unité). Vérifie d'ailleurs
          que $(e^{i\pi/4})^4=e^{i\pi}=-1\neq1$ : ce n'est pas une
          solution de $z^4=1$.
    correct_feedback: >
      Les racines 4-ièmes de l'unité sont $z_k=e^{i2k\pi/4}$ pour
      $k=0,1,2,3$, soit $e^{i0}=1$, $e^{i\pi/2}=i$, $e^{i\pi}=-1$,
      $e^{i3\pi/2}=-i$.
    solution: |
      **Écriture $z=\rho e^{i\alpha}$ et Moivre :** $z^4=1$ équivaut à
      $\rho^4=1$ (donc $\rho=1$, car $\rho\geq0$ réel) et
      $4\alpha\equiv0\ [2\pi]$, donc $\alpha=\dfrac{2k\pi}{4}$.

      **Les 4 solutions, pour $k=0,1,2,3$ :**
      $$z_0=e^{i0}=1 \qquad z_1=e^{i\pi/2}=i \qquad z_2=e^{i\pi}=-1 \qquad z_3=e^{i3\pi/2}=-i$$

  - id: NBCOMPLEX2-5
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["rotation", "homothetie", "geometrie"]
    primary_misconception: mc.math.maths_complexes_trigo.similitude-module-argument-roles
    stem: >
      La transformation qui à $M$ d'affixe $z$ associe $M'$ d'affixe
      $z' = 2i\,z$ est la composée, centrée en $O$, de quelle rotation et
      quelle homothétie ?
    type: mcq
    choices:
      - id: A
        text: "Rotation d'angle $\\pi/2$ et homothétie de rapport $2$"
        correct: true
      - id: B
        text: "Rotation d'angle $\\pi/2$ et homothétie de rapport $2i$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.homothetie-rapport-complexe
        feedback: >
          Le rapport d'une homothétie est toujours un nombre RÉEL — ici
          $|2i|=2$. Le nombre complexe $2i$ tout entier code à la fois
          la rotation ET l'homothétie ; ce n'est pas lui-même le
          "rapport". Le rapport, c'est le module, $2$ ; l'angle, c'est
          l'argument, $\pi/2$.
      - id: C
        text: "Rotation d'angle $2$ (en radians) et homothétie de rapport $\\pi/2$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.similitude-module-argument-roles
        feedback: >
          Les rôles sont inversés : c'est l'ARGUMENT de $2i$ qui donne
          l'angle de rotation ($\pi/2$, pas $2$), et le MODULE de $2i$
          qui donne le rapport d'homothétie ($2$, pas $\pi/2$). Le module
          est un réel positif qui mesure une distance, pas un angle.
      - id: D
        text: "Rotation d'angle $\\pi$ et homothétie de rapport $2$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.similitude-module-argument-roles
        feedback: >
          Multiplier $i$ par le réel positif $2$ ne change pas son
          argument : $\arg(2i) = \arg(2)+\arg(i) = 0+\pi/2 = \pi/2$, pas
          $\pi$. Multiplier par un réel positif change seulement le
          module (l'agrandissement), jamais l'argument (la direction).
    correct_feedback: >
      $2i = 2e^{i\pi/2}$ : le module est $2$ (rapport de l'homothétie),
      l'argument est $\pi/2$ (angle de la rotation). Les deux
      transformations sont centrées en $O$.
    solution: |
      **Forme exponentielle de $c=2i$ :**
      $$|2i| = 2, \qquad \arg(2i) = \frac{\pi}{2}$$

      D'après le chapitre 6, la transformation $z'=cz$ est la composée d'une
      rotation de centre $O$ et d'angle $\arg(c)=\pi/2$, et d'une
      homothétie de centre $O$ et de rapport $|c|=2$.

  - id: NBCOMPLEX2-6
    rung: "R6"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["triangle", "configuration", "rapport-complexe"]
    primary_misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
    stem: >
      $A$, $B$, $C$ ont pour affixes respectives $z_A=0$, $z_B=2$,
      $z_C=1+i\sqrt3$. On calcule
      $\dfrac{z_C-z_A}{z_B-z_A} = \dfrac12+i\dfrac{\sqrt3}{2} = e^{i\pi/3}$.
      Qu'en déduit-on sur la nature du triangle $ABC$ ?
    type: mcq
    choices:
      - id: A
        text: "Le triangle $ABC$ est équilatéral"
        correct: true
      - id: B
        text: "Le triangle $ABC$ est rectangle en $A$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Un triangle est rectangle en $A$ quand le rapport est
          imaginaire PUR (argument $\pm\pi/2$), pas pour n'importe quel
          argument non nul. Ici l'argument vaut $\pi/3$, pas $\pi/2$ :
          l'angle en $A$ est de $60°$, pas de $90°$.
      - id: C
        text: "Les points $A$, $B$, $C$ sont alignés"
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          L'alignement correspond à un rapport RÉEL (argument $0$ ou
          $\pi$). Ici le rapport $\frac12+i\frac{\sqrt3}{2}$ a une partie
          imaginaire non nulle : ce n'est pas un réel, donc les trois
          points ne sont pas alignés.
      - id: D
        text: "Le triangle est isocèle en $A$, mais on ne peut rien dire de plus"
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Le module donne bien $AB=AC$ (isocèle en $A$), mais cette
          réponse ignore l'information de l'argument. Un triangle isocèle
          en $A$ dont l'angle au sommet $A$ vaut $\pi/3$ (soit $60°$) a
          forcément ses deux autres angles égaux à $(\pi-\pi/3)/2=\pi/3$
          aussi : les trois angles valent $60°$, donc il est équilatéral.
          Il faut combiner module ET argument, pas s'arrêter au module
          seul.
    correct_feedback: >
      Le module vaut $1$ ($AB=AC$, isocèle en $A$), et l'argument vaut
      $\pi/3$ (angle en $A$ égal à $60°$). Un triangle isocèle dont
      l'angle au sommet vaut $60°$ a ses trois angles égaux à $60°$ :
      il est équilatéral.
    solution: |
      **Lecture du rapport $w=\dfrac{z_C-z_A}{z_B-z_A}=e^{i\pi/3}$ :**
      $$|w| = 1 \implies AB = AC \ (\text{isocèle en } A)$$
      $$\arg(w) = \frac{\pi}{3} \implies \text{angle en } A = 60°$$

      **Conclusion :** un triangle isocèle en $A$ avec un angle de $60°$
      au sommet $A$ a ses deux autres angles égaux à
      $(180°-60°)/2=60°$ chacun. Les trois angles valent $60°$ : le
      triangle est équilatéral.

  - id: NBCOMPLEX2-7
    rung: "R0"
    difficulty_level: 1
    skill_code: maths_complexes_trigo
    tags: ["multiplication-par-i", "rotation", "intuition-geometrique"]
    primary_misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
    stem: >
      D'après l'accroche du chapitre, que produit géométriquement la
      multiplication d'un point du plan par $i$ ?
    type: mcq
    choices:
      - id: A
        text: "Une rotation de centre $O$ et d'angle $\\pi/2$ (un quart de tour direct), sans changement de taille."
        correct: true
      - id: B
        text: "Un agrandissement, c'est-à-dire une homothétie de centre $O$, sans la moindre rotation."
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          $|i|=1$ : multiplier par $i$ ne change jamais la distance à
          $O$, donc il n'y a aucun agrandissement. Tu as traité $i$
          comme un simple facteur d'échelle, en oubliant de vérifier son
          module — c'est justement parce que $|i|=1$ que la
          multiplication par $i$ n'agrandit rien, elle fait seulement
          tourner.
      - id: C
        text: "Une translation du plan, de vecteur d'affixe $i$, sans rotation ni changement de taille."
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          Une translation vient d'une ADDITION d'affixes (comme vu au
          chapitre précédent), pas d'une multiplication. Ici on
          multiplie $z$ par $i$, on ne lui ajoute rien : il ne peut donc
          pas s'agir d'une translation.
      - id: D
        text: "Une symétrie par rapport à l'axe réel, qui laisse les points de cet axe inchangés."
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          C'est l'effet de la CONJUGAISON ($z\mapsto\overline z$), pas
          de la multiplication par $i$. Vérifie sur un exemple : le
          conjugué de $1+i$ est $1-i$, alors que $i(1+i)=-1+i$ — ce
          n'est pas du tout le symétrique de $1+i$ par rapport à l'axe
          réel.
    correct_feedback: >
      Sur les trois exemples de l'accroche ($z=2$, $z=3i$, $z=1+i$), la
      distance à $O$ reste inchangée à chaque fois, et le point tourne
      exactement d'un quart de tour dans le sens direct : multiplier
      par $i$ est une rotation de centre $O$ et d'angle $\pi/2$.
    solution: |
      **Les trois exemples de l'accroche :**
      $$2 \mapsto 2i \qquad 3i \mapsto -3 \qquad 1+i \mapsto -1+i$$

      **Vérification des distances :** $|2|=2=|2i|$ ;
      $|3i|=3=|-3|$ ; $|1+i|=\sqrt2=|-1+i|$. Dans les trois cas, la
      distance à $O$ ne change pas : pas d'agrandissement.

      **Vérification de l'angle :** dans les trois cas, le point tourné
      d'un quart de tour direct ($90°$) autour de $O$ tombe exactement
      sur le point d'arrivée (vérifie-le sur $(1,1)\mapsto(-1,1)$).

      **Conclusion :** multiplier par $i$ est une rotation de centre
      $O$ et d'angle $\pi/2$, sans agrandissement.

  - id: NBCOMPLEX2-8
    rung: "R0"
    difficulty_level: 2
    skill_code: maths_complexes_trigo
    tags: ["multiplication-par-i", "rotation", "sens-direct"]
    primary_misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
    stem: >
      Le point $M$ a pour affixe $z = 3$. Quelle est l'affixe du point
      $M'$ obtenu en multipliant $z$ par $i$ ?
    type: mcq
    choices:
      - id: A
        text: "$-3i$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          Ce point correspond à un quart de tour dans le sens INDIRECT
          (horaire), pas direct. Or l'accroche montre que multiplier
          par $i$ fait tourner dans le sens direct (trigonométrique,
          anti-horaire) : $(3,0)$ tourné d'un quart de tour direct
          donne $(0,3)$, pas $(0,-3)$.
      - id: B
        text: "$3i$"
        correct: true
      - id: C
        text: "$-3$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          $-3$ correspond à une multiplication par $-1=i^2$, c'est-à-dire
          un DEMI-tour, pas un quart de tour. Tu as confondu $i$ avec
          $i^2$ : $i\times3=3i$, alors que $i^2\times3=-3$.
      - id: D
        text: "$3$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          Cette réponse revient à dire que multiplier par $i$ ne change
          rien, comme si $i$ jouait le rôle de $1$. Or $i\neq1$ :
          $i\times3=3i$, un nombre différent de $3$, dont l'image a
          tourné d'un quart de tour.
    correct_feedback: >
      $i\times3=3i$ : le point $(3,0)$ devient $(0,3)$, exactement un
      quart de tour direct autour de $O$, sans changement de distance.
    solution: |
      **Calcul direct :**
      $$z' = i\times z = i\times3 = 3i$$

      **Vérification géométrique :** $M(3,0)$ est à distance $3$ de
      $O$ ; $M'(0,3)$ aussi est à distance $3$ de $O$. La direction a
      tourné d'un quart de tour dans le sens direct, cohérent avec
      l'effet de la multiplication par $i$ vu dans l'accroche.

  - id: NBCOMPLEX2-9
    rung: "R0"
    difficulty_level: 2
    skill_code: maths_complexes_trigo
    tags: ["multiplication-par-i", "composition-rotations"]
    primary_misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
    stem: >
      On part du point d'affixe $z$, on le multiplie par $i$, puis on
      multiplie le résultat par $i$ une seconde fois (on calcule donc
      $i\times(iz)=i^2z$). Quel est l'effet géométrique total de ces
      deux multiplications successives ?
    type: mcq
    choices:
      - id: A
        text: "Une rotation de centre $O$ et d'angle $\\pi/2$ (un quart de tour), comme une seule multiplication par $i$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          Faire deux fois la même rotation ne redonne pas le même
          angle : les deux quarts de tour s'ADDITIONNENT
          ($\pi/2+\pi/2=\pi$), ils ne se répètent pas à l'identique. Tu
          n'as compté l'effet que d'une seule des deux multiplications.
      - id: B
        text: "Un agrandissement de rapport $2$, sans rotation."
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          Tu as pensé qu'appliquer deux fois la même multiplication
          double la distance à $O$, comme si $|i|$ n'était pas $1$
          mais s'ajoutait à chaque fois. Or $|i|=1$ : composer deux
          rotations ne change jamais la taille, seulement l'angle (qui,
          lui, s'additionne bel et bien).
      - id: C
        text: "Une rotation de centre $O$ et d'angle $\\pi$ (un demi-tour)."
        correct: true
      - id: D
        text: "Le point revient à sa position de départ (transformation identique)."
        correct: false
        misconception: mc.math.maths_complexes_trigo.mult-par-i-non-rotation
        feedback: >
          Tu as peut-être pensé « faire une chose deux fois annule son
          effet », comme pour une symétrie. Mais une ROTATION répétée
          deux fois ne redonne pas le point de départ : elle compose
          les deux angles. Deux quarts de tour direct font un demi-tour
          ($\pi$), pas un tour complet nul.
    correct_feedback: >
      $i^2=-1$, et $-1=e^{i\pi}$ : multiplier deux fois de suite par
      $i$ revient à multiplier par $-1$, c'est-à-dire à faire tourner
      le point d'un demi-tour ($\pi$) autour de $O$, sans changer sa
      distance à $O$.
    solution: |
      **Calcul algébrique :**
      $$i\times(iz) = i^2 z = -z$$

      **Effet géométrique de $z\mapsto-z$ :** vu au chapitre précédent,
      c'est la symétrie par rapport à $O$, c'est-à-dire une rotation de
      centre $O$ et d'angle $\pi$ (un demi-tour).

      **Cohérence avec l'angle :** chaque multiplication par $i$ fait
      tourner d'un quart de tour ($\pi/2$) ; en faire deux additionne
      les angles : $\pi/2+\pi/2=\pi$. Les deux points de vue
      (algébrique et géométrique) coïncident.

  - id: NBCOMPLEX2-10
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["forme-trigonometrique", "argument", "quadrant"]
    primary_misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
    stem: >
      Quelle est la forme trigonométrique de $z = 1 - i$ ?
    type: mcq
    choices:
      - id: A
        text: "$2\\left(\\cos\\left(-\\dfrac{\\pi}{4}\\right)+i\\sin\\left(-\\dfrac{\\pi}{4}\\right)\\right)$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.module-oubli-racine
        feedback: >
          L'angle est correct, mais le module est faux : tu as calculé
          $r=1^2+(-1)^2=2$ en oubliant de prendre la racine carrée.
          Le module est $r=|z|=\sqrt{1^2+(-1)^2}=\sqrt2$, pas $2$.
      - id: B
        text: "$\\sqrt2\\left(\\cos\\dfrac{\\pi}{4}+i\\sin\\dfrac{\\pi}{4}\\right)$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
        feedback: >
          Le module est correct, mais tu as oublié de vérifier le
          signe du sinus : ici $b=-1<0$, donc $\sin\theta<0$. Or
          $\sin(\pi/4)>0$. L'angle de référence $\pi/4$ est le bon,
          mais comme $\cos\theta>0$ ET $\sin\theta<0$, l'argument est
          $-\pi/4$, pas $\pi/4$.
      - id: C
        text: "$\\sqrt2\\left(\\cos\\dfrac{3\\pi}{4}+i\\sin\\dfrac{3\\pi}{4}\\right)$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
        feedback: >
          Cet angle correspond à $\cos\theta<0$ et $\sin\theta>0$, donc
          au point $(-1,1)$. Mais ici $z=1-i$ correspond au point
          $(1,-1)$ : les signes des deux coordonnées sont inversés par
          rapport à ce que suppose cette réponse.
      - id: D
        text: "$\\sqrt2\\left(\\cos\\left(-\\dfrac{\\pi}{4}\\right)+i\\sin\\left(-\\dfrac{\\pi}{4}\\right)\\right)$"
        correct: true
    correct_feedback: >
      $r=|z|=\sqrt{1^2+(-1)^2}=\sqrt2$, donc $\cos\theta=\dfrac{1}{\sqrt2}=\dfrac{\sqrt2}{2}$
      et $\sin\theta=\dfrac{-1}{\sqrt2}=-\dfrac{\sqrt2}{2}$. Ces deux
      valeurs correspondent à $\theta=-\pi/4$.
    solution: |
      **Étape 1 — module :**
      $$r = |z| = \sqrt{1^2+(-1)^2} = \sqrt2$$

      **Étape 2 — cosinus et sinus :**
      $$\cos\theta = \frac{1}{\sqrt2} = \frac{\sqrt2}{2}, \qquad \sin\theta = \frac{-1}{\sqrt2} = -\frac{\sqrt2}{2}$$

      **Étape 3 — quadrant et angle :** $\cos\theta>0$ et
      $\sin\theta<0$ place $M$ dans le quatrième quadrant. L'angle de
      référence est $\pi/4$ ; dans ce quadrant, $\theta=-\pi/4$.

      $$z = \sqrt2\left(\cos\left(-\frac{\pi}{4}\right)+i\sin\left(-\frac{\pi}{4}\right)\right)$$

  - id: NBCOMPLEX2-11
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["argument", "conjugue", "oppose"]
    primary_misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
    stem: >
      On sait qu'un complexe $z$ non nul a pour argument
      $\theta=\dfrac{\pi}{5}$. Quel est un argument de $-\overline z$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{4\\pi}{5}$"
        correct: true
      - id: B
        text: "$\\dfrac{6\\pi}{5}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
        feedback: >
          Tu as appliqué la règle de l'opposé ($\arg(-w)=\arg(w)+\pi$)
          directement à $\theta$, sans tenir compte du conjugué. Mais
          ici $w=\overline z$, pas $z$ : il faut d'abord changer le
          signe de l'argument à cause du conjugué ($\arg(\overline
          z)=-\theta$), PUIS ajouter $\pi$ pour l'opposé.
      - id: C
        text: "$-\\dfrac{\\pi}{5}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
        feedback: >
          Tu as appliqué seulement la règle du conjugué
          ($\arg(\overline z)=-\theta$), mais oublié le signe « $-$ »
          devant $\overline z$, qui correspond à un demi-tour
          supplémentaire ($+\pi$). $-\overline z$ n'est pas
          $\overline z$ : il manque l'étape de l'opposé.
      - id: D
        text: "$\\dfrac{\\pi}{5}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
        feedback: >
          Tu as sans doute pensé que les deux transformations (le
          conjugué et l'opposé) s'annulent l'une l'autre et redonnent
          l'argument de départ. Ce n'est pas le cas : elles se
          COMBINENT (changement de signe de $\theta$, PUIS ajout de
          $\pi$), elles ne s'annulent pas.
    correct_feedback: >
      $\arg(\overline z) = -\theta = -\pi/5$ (règle du conjugué), puis
      $\arg(-\overline z) = \arg(\overline z)+\pi = -\pi/5+\pi =
      4\pi/5$ (règle de l'opposé, appliquée ensuite).
    solution: |
      **Étape 1 — conjugué :** $\arg(\overline z) = -\arg(z) = -\dfrac{\pi}{5}\ [2\pi]$

      **Étape 2 — opposé du conjugué :**
      $$\arg(-\overline z) = \arg(\overline z) + \pi = -\frac{\pi}{5}+\pi = \frac{4\pi}{5}\ [2\pi]$$

      **Vérification sur un exemple concret :** prends $z=e^{i\pi/5}$.
      Alors $\overline z = e^{-i\pi/5}$ et $-\overline z =
      -e^{-i\pi/5} = e^{i\pi}e^{-i\pi/5} = e^{i(\pi-\pi/5)} =
      e^{i4\pi/5}$. Cohérent avec le résultat ci-dessus.

  - id: NBCOMPLEX2-12
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["produit", "module", "argument"]
    primary_misconception: mc.math.maths_complexes_trigo.produit-modules-additionnes
    stem: >
      On donne $z = 3e^{i2\pi/3}$ et $z' = 5e^{-i\pi/6}$. Quelle est la
      forme exponentielle de $zz'$ ?
    type: mcq
    choices:
      - id: A
        text: "$8e^{i\\pi/2}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-modules-additionnes
        feedback: >
          L'argument est correct, mais le module est faux : tu as
          ADDITIONNÉ les modules ($3+5=8$) au lieu de les multiplier.
          Pour un produit, les modules se MULTIPLIENT ($3\times5=15$) ;
          seuls les arguments s'additionnent.
      - id: B
        text: "$15e^{i\\pi/2}$"
        correct: true
      - id: C
        text: "$15e^{i5\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
        feedback: >
          Le module est correct, mais tu as oublié le signe « $-$ »
          devant l'argument de $z'$ : tu as additionné $2\pi/3+\pi/6$
          comme si $z'$ avait pour argument $\pi/6$, alors qu'il vaut
          $-\pi/6$. Il fallait calculer $2\pi/3+(-\pi/6)$.
      - id: D
        text: "$15e^{i2\\pi/3}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
        feedback: >
          Tu as multiplié correctement les modules, mais oublié
          d'ajouter l'argument de $z'$ : ce choix ne garde que
          l'argument de $z$ seul ($2\pi/3$), comme si $z'$ n'apportait
          rien à la direction. Il faut ajouter les DEUX arguments :
          $2\pi/3+(-\pi/6)$.
    correct_feedback: >
      Les modules se multiplient : $3\times5=15$. Les arguments
      s'additionnent : $2\pi/3+(-\pi/6) = 4\pi/6-\pi/6 = 3\pi/6 =
      \pi/2$. Donc $zz' = 15e^{i\pi/2}$.
    solution: |
      **Règle du produit (chapitre 3) :**
      $$|zz'| = |z|\times|z'| = 3\times5 = 15$$
      $$\arg(zz') = \arg(z)+\arg(z') = \frac{2\pi}{3}+\left(-\frac{\pi}{6}\right) = \frac{4\pi}{6}-\frac{\pi}{6} = \frac{3\pi}{6} = \frac{\pi}{2}$$
      $$zz' = 15e^{i\pi/2}$$

  - id: NBCOMPLEX2-13
    rung: "R2"
    difficulty_level: 2
    skill_code: maths_complexes_trigo
    tags: ["forme-exponentielle", "definition"]
    primary_misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
    stem: >
      Quelle égalité correspond à la définition de la notation
      $e^{i\theta}$ posée dans ce chapitre ?
    type: mcq
    choices:
      - id: A
        text: "$\\cos\\theta - i\\sin\\theta$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
        feedback: >
          C'est l'expression de $e^{-i\theta}$ (ou de
          $\overline{e^{i\theta}}$), pas de $e^{i\theta}$ : tu as
          inversé le signe devant $\sin\theta$. Par définition,
          $e^{i\theta}=\cos\theta+i\sin\theta$, avec un « $+$ ».
      - id: B
        text: "$\\sin\\theta + i\\cos\\theta$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
        feedback: >
          Tu as inversé les rôles : c'est $\cos\theta$ qui donne la
          partie RÉELLE (en facteur de $1$) et $\sin\theta$ qui donne
          la partie IMAGINAIRE (en facteur de $i$), pas l'inverse. La
          définition est $e^{i\theta}=\cos\theta+i\sin\theta$.
      - id: C
        text: "$\\cos\\theta + i\\sin\\theta$"
        correct: true
      - id: D
        text: "$1 + i\\theta$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
        feedback: >
          Ce n'est pas la définition posée dans ce chapitre : ici,
          $e^{i\theta}$ est un NOM donné à $\cos\theta+i\sin\theta$,
          une égalité exacte pour tout $\theta$, pas une approximation
          linéaire valable seulement pour $\theta$ petit.
    correct_feedback: >
      Par définition, $e^{i\theta}=\cos\theta+i\sin\theta$ : le cosinus
      donne la partie réelle, le sinus (multiplié par $i$) donne la
      partie imaginaire.
    solution: |
      **Définition posée dans ce chapitre (chapitre 3) :**
      $$e^{i\theta} = \cos\theta + i\sin\theta$$

      Ce choix de notation est justifié parce qu'il vérifie
      $e^{i\theta}\times e^{i\theta'}=e^{i(\theta+\theta')}$, exactement
      comme une vraie exponentielle — c'est le calcul du chapitre 3, utilisant
      les formules d'addition trigonométrique, qui le garantit.

  - id: NBCOMPLEX2-14
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["quotient", "module", "argument"]
    primary_misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
    stem: >
      On donne $z = 6e^{i\pi/2}$ et $z' = 2e^{i\pi/3}$. Quelle est la
      forme exponentielle de $\dfrac{z}{z'}$ ?
    type: mcq
    choices:
      - id: A
        text: "$3e^{i5\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
        feedback: >
          Le module est correct, mais tu as ADDITIONNÉ les arguments
          ($\pi/2+\pi/3$) au lieu de les soustraire. L'addition des
          arguments correspond à un PRODUIT, pas à un quotient. Pour
          $z/z'$, il faut soustraire : $\pi/2-\pi/3$.
      - id: B
        text: "$4e^{i\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-modules-additionnes
        feedback: >
          L'argument est correct, mais tu as SOUSTRAIT les modules
          ($6-2=4$) au lieu de les diviser. Pour un quotient, les
          modules se DIVISENT ($6\div2=3$) ; c'est seulement les
          arguments qui se soustraient.
      - id: C
        text: "$3e^{-i\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.produit-quotient-argument-operation
        feedback: >
          Le module est correct, mais tu as inversé l'ordre de la
          soustraction : tu as calculé $\arg(z')-\arg(z)$ au lieu de
          $\arg(z)-\arg(z')$. La règle du quotient donne
          $\arg(z/z')=\arg(z)-\arg(z')=\pi/2-\pi/3$, pas
          $\pi/3-\pi/2$.
      - id: D
        text: "$3e^{i\\pi/6}$"
        correct: true
    correct_feedback: >
      Les modules se divisent : $6\div2=3$. Les arguments se
      soustraient : $\pi/2-\pi/3 = 3\pi/6-2\pi/6 = \pi/6$. Donc
      $z/z' = 3e^{i\pi/6}$.
    solution: |
      **Règle du quotient (chapitre 4) :**
      $$\left|\frac{z}{z'}\right| = \frac{|z|}{|z'|} = \frac{6}{2} = 3$$
      $$\arg\!\left(\frac{z}{z'}\right) = \arg(z)-\arg(z') = \frac{\pi}{2}-\frac{\pi}{3} = \frac{3\pi}{6}-\frac{2\pi}{6} = \frac{\pi}{6}$$
      $$\frac{z}{z'} = 3e^{i\pi/6}$$

  - id: NBCOMPLEX2-15
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["moivre", "puissance", "periodicite"]
    primary_misconception: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
    stem: >
      Soit $z = e^{i\pi/3}$. Quelle est la forme la plus simple de
      $z^6$ ?
    type: mcq
    choices:
      - id: A
        text: "$1$"
        correct: true
      - id: B
        text: "$-1$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-non-2pi-periodique
        feedback: >
          Tu sembles avoir supposé qu'un argument se reproduit tous les
          $\pi$ (comme la tangente), alors que l'argument est
          $2\pi$-PÉRIODIQUE, pas $\pi$-périodique. Ici
          $\arg(z^6)=6\times\pi/3=2\pi\equiv0\ [2\pi]$, ce qui donne
          $1$, pas $-1$ (qui correspondrait à un argument de $\pi$).
      - id: C
        text: "$e^{i2\\pi/3}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
        feedback: >
          Cet argument correspond à $2\times\pi/3$ : tu as multiplié
          l'argument par $2$ au lieu de $6$, comme si tu calculais
          $z^2$ plutôt que $z^6$. La formule de Moivre demande de
          multiplier l'argument par l'exposant TOUT ENTIER : $6\times
          \pi/3$.
      - id: D
        text: "$6$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-module-multiplie
        feedback: >
          Tu as multiplié le module par $6$ ($1\times6=6$) au lieu de
          l'ÉLEVER à la puissance $6$ ($1^6=1$). La formule de Moivre
          élève le module à la puissance $n$ ; multiplier par $n$ est
          la règle d'un produit répété d'arguments, pas celle du
          module.
    correct_feedback: >
      Formule de Moivre : $|z^6|=|z|^6=1^6=1$ et
      $\arg(z^6)=6\times\pi/3=2\pi\equiv0\ [2\pi]$. Donc $z^6=e^{i0}=1$.
    solution: |
      **Formule de Moivre (chapitre 4) :**
      $$|z^6| = |z|^6 = 1^6 = 1$$
      $$\arg(z^6) = 6\times\frac{\pi}{3} = 2\pi \equiv 0\ [2\pi]$$

      **Réduction :** un argument se lit modulo $2\pi$ : $2\pi$ et $0$
      décrivent le même point. Donc
      $$z^6 = 1\times e^{i0} = 1$$

  - id: NBCOMPLEX2-16
    rung: "R4"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "complexe-quelconque"]
    primary_misconception: mc.math.maths_complexes_trigo.racines-module-non-racine
    stem: >
      Quelles sont les trois solutions, dans $\mathbb{C}$, de
      l'équation $z^3 = -8$, sous forme exponentielle ?
    type: mcq
    choices:
      - id: A
        text: "$-2$ seulement"
        correct: false
        misconception: mc.math.maths_complexes_trigo.equation-complexe-cherche-reels
        feedback: >
          Tu n'as cherché de solution que parmi les RÉELS. Mais dans
          $\mathbb{C}$, une équation $z^n=Z$ (avec $Z\neq0$) a
          exactement $n$ solutions complexes distinctes. Ici $n=3$ :
          il y a trois racines, dont une seule est réelle ($-2$), les
          deux autres étant non réelles.
      - id: B
        text: "$2e^{i\\pi/3},\\ 2e^{i\\pi},\\ 2e^{i5\\pi/3}$"
        correct: true
      - id: C
        text: "$2e^{i\\pi/3},\\ 2e^{i\\pi},\\ 2e^{i7\\pi/3}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-nombre-incomplet
        feedback: >
          Tu as calculé $k=0$ et $k=1$ correctement, mais pour la
          troisième racine tu as pris $k=3$ au lieu de $k=2$. Il n'y a
          que $n=3$ racines distinctes, obtenues pour $k=0,1,2$ ;
          au-delà ($k=3$), on retombe sur une racine déjà trouvée :
          $2e^{i7\pi/3}=2e^{i\pi/3}$ (même angle, à $2\pi$ près). Ce
          choix ne donne donc que deux racines distinctes, pas trois.
      - id: D
        text: "$8e^{i\\pi/3},\\ 8e^{i\\pi},\\ 8e^{i5\\pi/3}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-module-non-racine
        feedback: >
          Les arguments sont corrects, mais le module est faux : tu as
          gardé $R=|{-8}|=8$ tel quel, au lieu de prendre sa racine
          CUBIQUE $\rho=R^{1/3}=8^{1/3}=2$. Le module de chaque racine
          est $\rho=2$, pas $R=8$.
    correct_feedback: >
      $-8=8e^{i\pi}$, donc $R=8$, $\Phi=\pi$. On calcule
      $\rho=8^{1/3}=2$ et $\alpha_k=\dfrac{\pi+2k\pi}{3}$ pour
      $k=0,1,2$ : $\pi/3$, $\pi$, $5\pi/3$.
    solution: |
      **Forme exponentielle de $Z=-8$ :** $R=|{-8}|=8$,
      $\Phi=\arg(-8)=\pi$.

      **Module des racines :** $\rho = R^{1/3} = 8^{1/3} = 2$

      **Arguments, pour $k=0,1,2$ :**
      $$\alpha_k = \frac{\pi+2k\pi}{3}$$
      $$k=0:\ \frac{\pi}{3} \qquad k=1:\ \frac{3\pi}{3}=\pi \qquad k=2:\ \frac{5\pi}{3}$$

      **Vérification sur $k=1$ :** $2e^{i\pi}=-2$, et
      $(-2)^3=-8=Z$. ✓

  - id: NBCOMPLEX2-17
    rung: "R4"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "unite", "placement"]
    primary_misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
    stem: >
      Les six solutions de $z^6=1$ sont placées régulièrement sur le
      cercle trigonométrique. Quel est l'angle, en radians, entre deux
      racines consécutives ?
    type: mcq
    choices:
      - id: A
        text: "$2\\pi$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
        feedback: >
          $2\pi$ est l'angle d'un TOUR COMPLET, pas l'écart entre deux
          racines consécutives. Les $n=6$ racines se partagent le tour
          complet en $6$ parts égales : il faut diviser $2\pi$ par $6$,
          pas répondre par $2\pi$ lui-même.
      - id: B
        text: "$\\dfrac{\\pi}{6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
        feedback: >
          Tu as calculé $\pi/n$ au lieu de $2\pi/n$ : il manque le
          facteur $2$, qui vient du fait qu'un tour complet mesure
          $2\pi$ (pas $\pi$). L'écart correct est
          $2\pi/6=\pi/3$, pas $\pi/6$.
      - id: C
        text: "$\\dfrac{\\pi}{3}$"
        correct: true
      - id: D
        text: "$6$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
        feedback: >
          Tu as répondu avec le nombre de racines lui-même, pas avec
          un angle. L'écart entre deux racines consécutives est une
          mesure d'ANGLE, en radians : il faut diviser le tour complet
          $2\pi$ par le nombre de racines $n=6$, ce qui donne
          $\pi/3$, pas $6$.
    correct_feedback: >
      Les $n=6$ racines $n$-ièmes de l'unité sont régulièrement
      espacées sur le cercle trigonométrique, à
      $\dfrac{2\pi}{n}=\dfrac{2\pi}{6}=\dfrac{\pi}{3}$ l'une de
      l'autre.
    solution: |
      **Position des racines :** $z_k=e^{i2k\pi/6}$ pour
      $k=0,1,\ldots,5$.

      **Écart entre deux racines consécutives :**
      $$\alpha_{k+1}-\alpha_k = \frac{2(k+1)\pi}{6}-\frac{2k\pi}{6} = \frac{2\pi}{6} = \frac{\pi}{3}$$

      Les six racines partagent le tour complet ($2\pi$) en $6$ parts
      égales de $\pi/3$ chacune.

  - id: NBCOMPLEX2-18
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["rotation", "homothetie", "centre-quelconque"]
    primary_misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
    stem: >
      On considère la transformation qui à $M$ d'affixe $z$ associe
      $M'$ d'affixe $z'$ telle que $z'-(1+i) = 2\big(z-(1+i)\big)$.
      Quelle est cette transformation ?
    type: mcq
    choices:
      - id: A
        text: "La composée d'une rotation de centre le point d'affixe $1+i$ et d'angle $\\pi/2$, et d'une homothétie de rapport $2$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
        feedback: >
          Il ne faut pas supposer par défaut qu'il y a une rotation :
          ici $c=2$ est un réel STRICTEMENT POSITIF, donc
          $\arg(c)=0$ — il n'y a AUCUNE rotation, seulement une
          homothétie. Le cas particulier du chapitre 6 le dit explicitement :
          si $c$ est réel positif, $\theta=0$.
      - id: B
        text: "La composée d'une rotation de centre $O$ et d'angle $0$, et d'une homothétie de centre $O$ et de rapport $2$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.transformation-centre-oublie
        feedback: >
          L'angle et le rapport sont corrects, mais le CENTRE est
          faux : la transformation est écrite avec $z-(1+i)$ des deux
          côtés, donc elle est centrée au point d'affixe $1+i$, pas en
          $O$. Tu as appliqué les formules du cas centré en $O$ sans
          tenir compte du centrage en $A$.
      - id: C
        text: "Une rotation de centre le point d'affixe $1+i$ et d'angle $\\pi$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
        feedback: >
          Multiplier par un réel STRICTEMENT POSITIF ne produit jamais
          un demi-tour : $\arg(2)=0$, pas $\pi$. Tu as peut-être
          confondu avec la règle $\arg(-z)=\arg(z)+\pi$, qui concerne
          les réels NÉGATIFS, pas les réels positifs comme $c=2$ ici.
      - id: D
        text: "Une homothétie de centre le point d'affixe $1+i$ et de rapport $2$ (pas de rotation)."
        correct: true
    correct_feedback: >
      $c=2$ est un réel strictement positif : $|c|=2$ et
      $\arg(c)=0$. La transformation est donc une simple homothétie de
      centre $A$ (affixe $1+i$) et de rapport $2$, sans rotation.
    solution: |
      **Identification de $c$ :** l'écriture $z'-z_A=c(z-z_A)$ avec
      $z_A=1+i$ donne ici $c=2$.

      **Module et argument de $c=2$ :** $|c|=2$, $\arg(c)=0$ (réel
      strictement positif).

      **Conclusion (cas particulier du chapitre 6) :** quand $c$ est réel
      strictement positif, $\theta=0$ : il n'y a aucune rotation. La
      transformation est une homothétie de centre $A$ et de rapport
      $2$.

  - id: NBCOMPLEX2-19
    rung: "R5"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["rotation", "ecriture-complexe", "centre-quelconque"]
    primary_misconception: mc.math.maths_complexes_trigo.transformation-centre-oublie
    stem: >
      Quelle est l'écriture complexe de la rotation de centre $A$
      d'affixe $z_A=1-i$ et d'angle $\dfrac{\pi}{3}$ ?
    type: mcq
    choices:
      - id: A
        text: "$z' - (1-i) = e^{i\\pi/3}\\,(z-(1-i))$"
        correct: true
      - id: B
        text: "$z' = e^{i\\pi/3}\\,z$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.transformation-centre-oublie
        feedback: >
          Cette écriture correspond à une rotation centrée en $O$, pas
          en $A$. Comme le centre n'est pas $O$ mais le point d'affixe
          $z_A=1-i$, il faut écrire la relation avec $z-z_A$ des deux
          côtés : $z'-z_A=e^{i\pi/3}(z-z_A)$.
      - id: C
        text: "$z' - (1-i) = e^{-i\\pi/3}\\,(z-(1-i))$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-sens-inverse
        feedback: >
          Tu as utilisé $e^{-i\pi/3}$ (rotation dans le sens indirect,
          horaire) au lieu de $e^{i\pi/3}$ (sens direct). L'énoncé
          demande une rotation d'angle $+\pi/3$, donc le coefficient
          doit être $e^{i\pi/3}$, pas son opposé.
      - id: D
        text: "$z' - (1-i) = \\dfrac{\\pi}{3}\\,(z-(1-i))$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-angle-comme-coefficient
        feedback: >
          Tu as utilisé l'angle $\pi/3$ lui-même comme coefficient
          multiplicateur, au lieu du nombre complexe $e^{i\pi/3}$ qui
          CODE cette rotation. Une rotation d'angle $\theta$
          correspond à une multiplication par $e^{i\theta}$, pas par
          $\theta$ (qui n'est même pas de module $1$).
    correct_feedback: >
      Une rotation de centre $A$ (affixe $z_A$) et d'angle $\theta$
      s'écrit $z'-z_A = e^{i\theta}(z-z_A)$. Ici $z_A=1-i$ et
      $\theta=\pi/3$, d'où $z'-(1-i) = e^{i\pi/3}(z-(1-i))$.
    solution: |
      **Formule générale (chapitre 6) :** une rotation de centre $A$ et
      d'angle $\theta$ s'écrit
      $$z' - z_A = e^{i\theta}(z-z_A)$$
      car $c=e^{i\theta}$ a pour module $1$ (pas d'homothétie) et pour
      argument $\theta$ (juste la rotation voulue).

      **Application :** avec $z_A=1-i$ et $\theta=\pi/3$ :
      $$z' - (1-i) = e^{i\pi/3}\,(z-(1-i))$$

  - id: NBCOMPLEX2-20
    rung: "R6"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: ["triangle", "alignement", "rapport-complexe"]
    primary_misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
    stem: >
      $A$, $B$, $C$ ont pour affixes respectives $z_A=0$, $z_B=1$,
      $z_C=-2$. Que peut-on dire du triangle $ABC$, à partir de
      $w=\dfrac{z_C-z_A}{z_B-z_A}$ ?
    type: mcq
    choices:
      - id: A
        text: "Les points ne sont pas alignés, car $w=-2$ est négatif : un rapport négatif ne correspond pas à un alignement."
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Le critère d'alignement est « $w$ RÉEL non nul », qu'il soit
          positif OU négatif — pas seulement positif. Un $w$ négatif
          signifie simplement que $C$ est du côté opposé à $B$ par
          rapport à $A$ sur la même droite : les points restent
          alignés.
      - id: B
        text: "$A$, $B$, $C$ sont alignés (avec $C$ du côté opposé à $B$ par rapport à $A$)."
        correct: true
      - id: C
        text: "Le triangle est rectangle en $A$, car $\\arg(w)=\\pi$ est un multiple de $\\pi/2$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Le critère de « rectangle en $A$ » est « $w$ IMAGINAIRE PUR »
          (argument $\pm\pi/2$ exactement), pas « argument multiple de
          $\pi/2$ » au sens large. $\pi$ est bien un multiple de
          $\pi/2$ ($2\times\pi/2$), mais un argument de $\pi$
          correspond à un $w$ RÉEL (négatif), pas imaginaire pur.
      - id: D
        text: "Le triangle est isocèle en $A$ ($AB=AC$), car $|w|=2$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Le critère d'isocèle en $A$ est précisément « $|w|=1$ », pas
          « $|w|$ est un nombre ». Ici $|w|=2\neq1$, donc
          $AC=2\times AB$ : les côtés ne sont PAS égaux, le triangle
          n'est pas isocèle en $A$.
    correct_feedback: >
      $w=\dfrac{-2-0}{1-0}=-2$, un réel non nul (négatif). D'après la
      table de lecture du chapitre 7, cela signifie que $A$, $B$, $C$ sont
      alignés — l'angle en $A$ vaut $\pi$ puisque $C$ est du côté
      opposé à $B$.
    solution: |
      **Calcul de $w$ :**
      $$w = \frac{z_C-z_A}{z_B-z_A} = \frac{-2-0}{1-0} = -2$$

      **Lecture :** $w=-2\in\mathbb{R}^*$ (réel non nul), donc $A,B,C$
      sont alignés (angle en $A$ égal à $0$ ou $\pi$ ; ici $\pi$
      puisque $w<0$).

      **Vérification directe :** $A(0,0)$, $B(1,0)$, $C(-2,0)$ sont
      bien tous les trois sur l'axe des réels.

  - id: NBCOMPLEX2-21
    rung: "R6"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["triangle", "rectangle", "rapport-complexe"]
    primary_misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
    stem: >
      $A$, $B$, $C$ ont pour affixes respectives $z_A=0$, $z_B=2$,
      $z_C=3i$. On calcule
      $w=\dfrac{z_C-z_A}{z_B-z_A}=\dfrac{3}{2}i$. Que peut-on en
      déduire sur la nature du triangle $ABC$ ?
    type: mcq
    choices:
      - id: A
        text: "Rectangle ET isocèle en $A$, car $w$ est imaginaire pur."
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          « $w$ imaginaire pur » garantit seulement le caractère
          RECTANGLE en $A$ ; ce n'est pas le critère d'isocèle. Le
          critère d'isocèle en $A$ est SÉPARÉ : $|w|=1$. Ici
          $|w|=3/2\neq1$, donc le triangle n'est pas isocèle en $A$ —
          il faut vérifier les deux conditions indépendamment, pas
          déduire l'une de l'autre.
      - id: B
        text: "Isocèle en $A$ (car l'argument de $w$ vaut $\\pi/2$), mais pas rectangle (car $|w|\\neq1$)."
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Les deux critères sont inversés : c'est l'ARGUMENT de $w$
          (imaginaire pur, $\pm\pi/2$) qui donne le caractère
          RECTANGLE, et c'est le MODULE de $w$ ($|w|=1$) qui donne le
          caractère ISOCÈLE — pas l'inverse. Ici l'argument $\pi/2$
          signale un angle droit en $A$, pas une égalité de longueurs.
      - id: C
        text: "Rectangle en $A$, mais pas isocèle en $A$ (car $|w|=3/2\\neq1$)."
        correct: true
      - id: D
        text: "Ni rectangle ni isocèle en $A$, car $w$ n'est ni réel ni de module $1$."
        correct: false
        misconception: mc.math.maths_complexes_trigo.lecture-w-module-argument
        feedback: >
          Tu as bien vu que $w$ n'est pas réel (donc pas d'alignement)
          et que $|w|\neq1$ (donc pas isocèle), mais tu en conclus à
          tort qu'il n'y a pas non plus de rectangle. Or « $w$
          imaginaire pur » EST précisément le critère du rectangle en
          $A$ — ce n'est pas la même chose que « $w$ n'est pas réel »,
          c'est une condition positive à part entière, qui est ici
          vérifiée.
    correct_feedback: >
      $\arg(w)=\pi/2$ (imaginaire pur) $\implies$ rectangle en $A$. Mais
      $|w|=3/2\neq1$ $\implies$ pas isocèle en $A$ : les deux critères
      sont indépendants, et ici seul le premier est vérifié.
    solution: |
      **Lecture du rapport $w=\dfrac{3}{2}i$ :**
      $$\arg(w) = \frac{\pi}{2} \implies \text{rectangle en } A$$
      $$|w| = \frac{3}{2} \neq 1 \implies \text{pas isocèle en } A$$

      **Vérification directe :** $A(0,0)$, $B(2,0)$, $C(0,3)$. Le
      vecteur $\vec{AB}=(2,0)$ et $\vec{AC}=(0,3)$ sont orthogonaux
      (produit scalaire nul) : angle droit en $A$ confirmé. Mais
      $AB=2\neq3=AC$ : pas isocèle en $A$, confirmé aussi.

  - id: NBCOMPLEX2-22
    rung: "R7"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["rotation", "ecriture-complexe", "application"]
    primary_misconception: mc.math.maths_complexes_trigo.transformation-centre-oublie
    stem: >
      On considère le point $A$ d'affixe $z_A=1+i$ et la rotation $r$
      de centre $A$ et d'angle $\dfrac{\pi}{2}$, qui à tout point $M$
      d'affixe $z$ associe $M'$ d'affixe $z'$. Quelle est l'expression
      de $z'$ en fonction de $z$ ?
    type: mcq
    choices:
      - id: A
        text: "$z' = iz$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.transformation-centre-oublie
        feedback: >
          Cette écriture correspond à une rotation centrée en $O$, pas
          en $A$. Il faut partir de $z'-z_A=i(z-z_A)$ (car
          $e^{i\pi/2}=i$) et isoler $z'$ en tenant compte de $z_A$, pas
          l'oublier.
      - id: B
        text: "$z' = iz+1-i$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.ecriture-complexe-oubli-constante
        feedback: >
          Tu as bien posé $z'-z_A=i(z-z_A)$, mais en isolant $z'$ tu
          as oublié de RAJOUTER $z_A$ à la fin : tu t'es arrêté à
          $z'=iz-iz_A$ au lieu de $z'=iz-iz_A+z_A$. Il manque le
          dernier « $+z_A$ ».
      - id: C
        text: "$z' = -iz+2i$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-sens-inverse
        feedback: >
          Tu as utilisé $e^{-i\pi/2}=-i$ (rotation dans le sens
          indirect, horaire) au lieu de $e^{i\pi/2}=i$ (sens direct).
          L'énoncé demande une rotation d'angle $+\pi/2$, donc le
          coefficient multiplicateur doit être $i$, pas $-i$.
      - id: D
        text: "$z' = iz+2$"
        correct: true
    correct_feedback: >
      $z'-z_A=e^{i\pi/2}(z-z_A)=i(z-z_A)$, avec $z_A=1+i$. En
      développant : $z'=iz-i(1+i)+(1+i)=iz-i+1+1+i=iz+2$.
    solution: |
      **Écriture de la rotation (chapitre 6) :**
      $$z' - z_A = e^{i\pi/2}(z-z_A) = i(z-z_A)$$

      **Isolement de $z'$, avec $z_A=1+i$ :**
      $$z' = iz - i\,z_A + z_A = iz - i(1+i) + (1+i)$$
      $$-i(1+i) = -i - i^2 = -i+1 = 1-i$$
      $$z' = iz + (1-i) + (1+i) = iz + 2$$

      **Vérification :** $A$ doit être fixe : $z=1+i \Rightarrow
      z'=i(1+i)+2 = i-1+2 = 1+i = z_A$. ✓

  - id: NBCOMPLEX2-23
    rung: "R7"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["racines-n-iemes", "application"]
    primary_misconception: mc.math.maths_complexes_trigo.racines-module-non-racine
    stem: >
      Quelles sont, sous forme exponentielle, les trois solutions dans
      $\mathbb{C}$ de l'équation $z^3 = -8i$ ?
    type: mcq
    choices:
      - id: A
        text: "$2e^{-i\\pi/6},\\ 2e^{i\\pi/2},\\ 2e^{i7\\pi/6}$"
        correct: true
      - id: B
        text: "$8e^{-i\\pi/6},\\ 8e^{i\\pi/2},\\ 8e^{i7\\pi/6}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-module-non-racine
        feedback: >
          Les arguments sont corrects, mais le module est faux : tu as
          gardé $R=|{-8i}|=8$ tel quel au lieu de prendre sa racine
          CUBIQUE $\rho=8^{1/3}=2$. Le module de chaque racine est
          $2$, pas $8$.
      - id: C
        text: "$2e^{i\\pi/6},\\ 2e^{i5\\pi/6},\\ 2e^{i3\\pi/2}$"
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-un-seul-signe
        feedback: >
          Tu as pris $\Phi=\pi/2$, l'argument de $8i$ (l'exemple du
          cours), au lieu de calculer l'argument de $-8i$. Le signe
          change tout : $-8i$ est sur la partie NÉGATIVE de l'axe
          imaginaire, donc $\Phi=-\pi/2$, pas $+\pi/2$. Il faut
          recalculer l'argument à chaque nouvel exercice, pas réutiliser
          celui d'un exemple déjà rencontré.
      - id: D
        text: "$2e^{-i\\pi/6}$ seulement"
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-nombre-incomplet
        feedback: >
          Tu t'es arrêté à $k=0$. Une équation $z^3=Z$ (avec
          $Z\neq0$) a exactement $3$ solutions distinctes, pour
          $k=0,1,2$ : il manque les deux autres racines.
    correct_feedback: >
      $-8i = 8e^{-i\pi/2}$, donc $R=8$, $\Phi=-\pi/2$. On calcule
      $\rho=8^{1/3}=2$ et $\alpha_k=\dfrac{-\pi/2+2k\pi}{3}$ pour
      $k=0,1,2$ : $-\pi/6$, $\pi/2$, $7\pi/6$.
    solution: |
      **Forme exponentielle de $Z=-8i$ :** $R=|{-8i}|=8$,
      $\Phi=\arg(-8i)=-\pi/2$ (point sur la partie négative de l'axe
      imaginaire).

      **Module des racines :** $\rho = R^{1/3} = 8^{1/3} = 2$

      **Arguments, pour $k=0,1,2$ :**
      $$\alpha_k = \frac{-\pi/2+2k\pi}{3}$$
      $$k=0:\ -\frac{\pi}{6} \qquad k=1:\ \frac{3\pi/2}{3}=\frac{\pi}{2} \qquad k=2:\ \frac{7\pi/2}{3}=\frac{7\pi}{6}$$

      **Vérification sur $k=1$ :** $\left(2e^{i\pi/2}\right)^3 =
      8e^{i3\pi/2} = 8\left(\cos\frac{3\pi}{2}+i\sin\frac{3\pi}{2}\right)
      = 8(0-i) = -8i = Z$. ✓

  - id: NBCOMPLEX2-24
    rung: "R7"
    difficulty_level: 5
    skill_code: maths_complexes_trigo
    tags: ["ensemble-de-points", "cercle", "argument"]
    primary_misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
    stem: >
      Soient $A$ et $B$ d'affixes respectives $z_A=-1$ et $z_B=3$. On
      note $\Gamma$ l'ensemble des points $M$ d'affixe $z\neq z_B$
      tels que $\dfrac{z-z_A}{z-z_B}$ soit un imaginaire pur non nul.
      Que peut-on dire de $\Gamma$ ?
    type: mcq
    choices:
      - id: A
        text: "La médiatrice du segment $[AB]$, c'est-à-dire la droite d'équation $x = 1$ dans le plan."
        correct: false
        misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
        feedback: >
          La médiatrice de $[AB]$ correspond à la condition
          $|z-z_A|=|z-z_B|$ (équidistance), pas à « imaginaire pur ».
          Ici la condition porte sur l'ARGUMENT du rapport (un angle
          droit), pas sur l'égalité de deux distances : ce n'est pas
          le même type de lieu.
      - id: B
        text: "Le cercle de diamètre $[AB]$ (centre le point d'affixe $1$, rayon $2$), privé des points $A$ et $B$."
        correct: true
      - id: C
        text: "Le cercle de centre le point $A$ et de rayon la distance $AB=4$, tout entier."
        correct: false
        misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
        feedback: >
          Tu as traité cette condition comme si elle donnait « $M$ à
          distance constante de $A$ » (un cercle centré en $A$, comme
          au chapitre 1 avec $|z-z_A|=r$). Mais « imaginaire pur »
          porte sur un ANGLE (le rapport $(z-z_A)/(z-z_B)$ code
          l'angle en $M$ entre $MA$ et $MB$), pas sur une distance
          fixe à $A$ : le cercle obtenu est centré au MILIEU de
          $[AB]$, pas en $A$.
      - id: D
        text: "La droite $(AB)$ tout entière, privée du seul point $B$ où le quotient n'est pas défini."
        correct: false
        misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
        feedback: >
          Tu as inversé les deux lignes de la table de lecture du chapitre 7 :
          c'est « $w$ RÉEL » qui donne un alignement (une droite), et
          « $w$ IMAGINAIRE PUR » qui donne un angle droit (un cercle,
          par le théorème de Thalès), pas l'inverse.
    correct_feedback: >
      $\dfrac{z-z_A}{z-z_B}$ imaginaire pur non nul signifie que
      l'angle $(\overrightarrow{MB},\overrightarrow{MA})$ vaut
      $\pm\pi/2$ : le triangle $MAB$ est rectangle en $M$. Par le
      théorème de Thalès, $M$ décrit le cercle de diamètre $[AB]$
      (centre le milieu de $[AB]$, affixe $1$, rayon $AB/2=2$), privé
      de $A$ et $B$.
    solution: |
      **Interprétation du rapport :** pour $M$ d'affixe $z\neq z_A,z_B$,
      $\dfrac{z-z_A}{z-z_B}$ a pour argument l'angle
      $(\overrightarrow{MB},\overrightarrow{MA})$ (même principe qu'au
      chapitre 7, avec $M$ au rôle du sommet).

      **Condition « imaginaire pur non nul » :** cet argument vaut
      $\pm\pi/2\ [2\pi]$, donc le triangle $MAB$ est rectangle en $M$.

      **Théorème de Thalès (réciproque) :** l'ensemble des points $M$
      tels que le triangle $MAB$ soit rectangle en $M$ est le cercle
      de diamètre $[AB]$, privé de $A$ et de $B$ (où l'angle n'est pas
      défini).

      **Centre et rayon :** centre $=\dfrac{z_A+z_B}{2}=\dfrac{-1+3}{2}=1$,
      rayon $=\dfrac{AB}{2}=\dfrac{|z_B-z_A|}{2}=\dfrac{4}{2}=2$.

  # Ajoutés le 2026-09-05 : seize familles sous le plancher de 3 items du banc.
  # Neuf items, vingt-six places — la dernière notion du corpus à combler.
  - id: NBCOMPLEX2-25
    rung: "R1"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: [module, argument, conjugue]
    primary_misconception: mc.math.maths_complexes_trigo.module-oubli-racine
    stem: >
      Soit $z = -1 + i$. Que valent $|z|$ et $\arg(\bar{z})$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $|z| = \sqrt{2}$ et $\arg(\bar z) = -\dfrac{3\pi}{4}\ [2\pi]$
        correct: true
      - id: B
        text: >-
          $|z| = 2$ et $\arg(\bar z) = -\dfrac{3\pi}{4}$ : le module vaut
          $a^{2}+b^{2}$
        correct: false
        misconception: mc.math.maths_complexes_trigo.module-oubli-racine
        feedback: >
          La racine finale n'est pas optionnelle : $|z| = \sqrt{a^{2}+b^{2}}$.
          Sans elle on obtient le CARRÉ du module — ici $2$ au lieu de
          $\sqrt2 \approx 1{,}41$. Le contrôle géométrique tranche : le point
          $(-1\,;1)$ est à un peu plus d'une unité de l'origine, pas deux.
      - id: C
        text: >-
          $|z| = \sqrt{2}$ et $\arg(\bar z) = \dfrac{3\pi}{4} + \pi$ : on compose
          l'opposé et le conjugué
        correct: false
        misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
        feedback: >
          Deux règles distinctes se mélangent :
          $\arg(\bar z) = -\arg(z)$ et $\arg(-z) = \arg(z) + \pi$. Ici on ne
          demande que le conjugué : $-\frac{3\pi}{4}$, sans ajout de $\pi$.
      - id: D
        text: >-
          $|z| = \sqrt{2}$ et $\arg(\bar z) = \dfrac{\pi}{4}$, l'argument étant
          défini modulo $\pi$
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-non-2pi-periodique
        feedback: >
          L'argument est défini modulo $2\pi$, pas $\pi$ : ajouter $\pi$ envoie
          le point sur son symétrique par rapport à l'origine, qui est un AUTRE
          complexe. Modulo $\pi$, on confondrait $z$ et $-z$.
    correct_feedback: >
      $|z| = \sqrt{(-1)^{2}+1^{2}} = \sqrt2$, et $\arg(z) = \frac{3\pi}{4}$ (le
      point est dans le deuxième quadrant), donc $\arg(\bar z) = -\arg(z) =
      -\frac{3\pi}{4}\ [2\pi]$.
    solution: |
      **Le module.**
      $$|z| = \sqrt{a^{2}+b^{2}} = \sqrt{1+1} = \sqrt2$$

      **L'argument de $z$.** $\cos\theta = -\frac{1}{\sqrt2}$ et
      $\sin\theta = \frac{1}{\sqrt2}$ : deuxième quadrant, donc
      $\theta = \frac{3\pi}{4}$.

      **Le conjugué.** $\arg(\bar z) = -\arg(z) = -\frac{3\pi}{4}\ [2\pi]$.

      **Les trois règles à garder distinctes.**
      $$
      \arg(\bar z) = -\arg z \qquad \arg(-z) = \arg z + \pi \qquad
      \text{tout modulo } 2\pi
      $$

  - id: NBCOMPLEX2-26
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: [forme_exponentielle, moivre]
    primary_misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
    stem: >
      Que vaut $\left(2\,e^{i\pi/6}\right)^{3}$, et que signifie exactement
      $e^{i\theta}$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $8\,e^{i\pi/2}$, avec $e^{i\theta} = \cos\theta + i\sin\theta$
        correct: true
      - id: B
        text: >-
          $6\,e^{i\pi/2}$ : le module se multiplie par l'exposant
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-module-multiplie
        feedback: >
          Le module s'ÉLÈVE à la puissance : $|z^{n}| = |z|^{n}$, donc
          $2^{3} = 8$ et non $2\times 3 = 6$. C'est l'ARGUMENT qui se multiplie
          par $n$. Les deux opérations sont différentes, et les confondre fausse
          tous les calculs de racines.
      - id: C
        text: >-
          $8\,e^{i\pi/2}$, avec $e^{i\theta} = \cos\theta - i\sin\theta$
        correct: false
        misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
        feedback: >
          Le signe du sinus est POSITIF : $e^{i\theta} = \cos\theta +
          i\sin\theta$. Avec un moins, on obtiendrait $e^{-i\theta}$ — donc le
          conjugué, et une rotation en sens inverse. Le contrôle :
          $e^{i\pi/2}$ doit valoir $i$, et non $-i$.
      - id: D
        text: >-
          $8\,e^{i\pi/6}$ : seul le module change, l'argument reste inchangé
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
        feedback: >
          L'argument se MULTIPLIE par $n$ : $\arg(z^{n}) = n\arg(z)$, ici
          $3\times\frac{\pi}{6} = \frac{\pi}{2}$. Le laisser inchangé
          reviendrait à dire qu'élever au cube ne fait pas tourner — alors que
          c'est précisément ce qu'une multiplication complexe fait.
    correct_feedback: >
      $\left(re^{i\theta}\right)^{n} = r^{n}e^{in\theta}$ : le module s'élève à
      la puissance, l'argument se multiplie. Ici $2^{3} = 8$ et
      $3\times\frac{\pi}{6} = \frac{\pi}{2}$, d'où $8e^{i\pi/2} = 8i$.
    solution: |
      **La définition.**
      $$e^{i\theta} = \cos\theta + i\sin\theta$$
      Signe PLUS devant le sinus, cosinus en partie réelle.

      **La formule de Moivre, forme exponentielle.**
      $$\left(r\,e^{i\theta}\right)^{n} = r^{n}\,e^{in\theta}$$

      **L'application.** $r^{n} = 2^{3} = 8$ et
      $n\theta = 3\times\frac{\pi}{6} = \frac{\pi}{2}$, donc le résultat vaut
      $8e^{i\pi/2} = 8i$.

  - id: NBCOMPLEX2-27
    rung: "R2"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: [forme_exponentielle, conjugue, moivre]
    primary_misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
    stem: >
      Soit $z = r\,e^{i\theta}$ avec $r > 0$. Que valent $\bar{z}$ et $-z$ sous
      forme exponentielle ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\bar z = r\,e^{-i\theta}$ et $-z = r\,e^{i(\theta+\pi)}$ : le module
          est conservé dans les deux cas
        correct: true
      - id: B
        text: >-
          $\bar z = r\,e^{i(\theta+\pi)}$ et $-z = r\,e^{-i\theta}$ : les deux
          transformations sont échangées
        correct: false
        misconception: mc.math.maths_complexes_trigo.arg-conjugue-oppose-compose
        feedback: >
          Conjuguer, c'est une symétrie par rapport à l'axe des réels : elle
          OPPOSE l'argument. Prendre l'opposé, c'est une symétrie par rapport à
          l'origine : elle AJOUTE $\pi$. Le contrôle sur $z = i$ :
          $\bar z = -i$ et $-z = -i$ coïncident ici, mais essayez avec
          $z = 1 + i$.
      - id: C
        text: >-
          $\bar z = r\,e^{-i\theta}$ et $-z = -r\,e^{i\theta}$, le module pouvant
          être négatif
        correct: false
        misconception: mc.math.maths_complexes_trigo.definition-exponentielle-erronee
        feedback: >
          Un module est une distance : toujours positif. La forme exponentielle
          exige $r > 0$ ; $-re^{i\theta}$ n'est pas une forme exponentielle, il
          faut la réécrire en $re^{i(\theta+\pi)}$ pour respecter la convention.
      - id: D
        text: >-
          $\bar z = r\,e^{-i\theta}$ et $-z = r\,e^{i\theta/n}$ : l'argument se
          divise
        correct: false
        misconception: mc.math.maths_complexes_trigo.moivre-argument-mal-transforme
        feedback: >
          Aucune division n'intervient ici — et la formule de Moivre MULTIPLIE
          l'argument par $n$, elle ne le divise pas. La division par $n$
          n'apparaît que pour les racines $n$-ièmes, où l'on inverse
          l'opération.
    correct_feedback: >
      $\bar z = r\,e^{-i\theta}$ — symétrie par rapport à l'axe des réels, donc
      argument opposé — et $-z = r\,e^{i(\theta+\pi)}$ — symétrie par rapport à
      l'origine, donc demi-tour. Le module ne change dans aucun des deux cas.
    solution: |
      **Le conjugué.** Symétrie d'axe les réels : le module est conservé,
      l'argument opposé.
      $$\bar z = r\,e^{-i\theta}$$

      **L'opposé.** Symétrie par rapport à l'origine, c'est-à-dire rotation d'un
      demi-tour :
      $$-z = r\,e^{i(\theta+\pi)}$$

      **Le composé, si l'on veut $-\bar z$.**
      $$-\bar z = r\,e^{i(\pi - \theta)}$$
      qui est la symétrie par rapport à l'axe des imaginaires.

  - id: NBCOMPLEX2-28
    rung: "R3"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: [equation, racines_niemes]
    primary_misconception: mc.math.maths_complexes_trigo.equation-complexe-cherche-reels
    stem: >
      Combien l'équation $z^{4} = 16$ admet-elle de solutions dans
      $\mathbb{C}$, et comment sont-elles disposées ?
    type: mcq
    choices:
      - id: A
        text: >-
          Quatre, de module $2$, régulièrement espacées de $\dfrac{2\pi}{4}$ sur
          le cercle de rayon $2$
        correct: true
      - id: B
        text: >-
          Deux, $2$ et $-2$ : ce sont les seules solutions, puisqu'on cherche des
          nombres dont la puissance quatrième vaut $16$
        correct: false
        misconception: mc.math.maths_complexes_trigo.equation-complexe-cherche-reels
        feedback: >
          $2$ et $-2$ sont les solutions RÉELLES. Dans $\mathbb{C}$, une équation
          $z^{n} = Z$ admet exactement $n$ solutions : il en manque deux, $2i$ et
          $-2i$, dont la puissance quatrième vaut bien $16$.
      - id: C
        text: >-
          Quatre, de module $2$, espacées de $\dfrac{\pi}{4}$
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
        feedback: >
          L'écart entre racines consécutives est $\dfrac{2\pi}{n}$, soit
          $\dfrac{\pi}{2}$ ici. Avec $\dfrac{\pi}{4}$, les quatre racines ne
          couvriraient qu'un demi-tour et ne se refermeraient pas — alors qu'elles
          partagent le cercle en parts égales.
      - id: D
        text: >-
          Quatre, de module $16$, l'argument étant défini modulo $\pi$
        correct: false
        misconception: mc.math.maths_complexes_trigo.argument-non-2pi-periodique
        feedback: >
          Deux erreurs. Le module des racines est $16^{1/4} = 2$, pas $16$. Et
          l'argument est défini modulo $2\pi$ : c'est en balayant un tour
          complet, et non un demi-tour, qu'on obtient les quatre racines
          distinctes.
    correct_feedback: >
      Quatre solutions : $2$, $2i$, $-2$, $-2i$. Toutes de module
      $16^{1/4} = 2$, régulièrement espacées de $\frac{2\pi}{4} = \frac{\pi}{2}$
      — elles forment un carré inscrit dans le cercle de rayon $2$.
    solution: |
      **La méthode.** On écrit $16 = 16\,e^{i\cdot 0}$ et l'on cherche
      $z = \rho e^{i\varphi}$ :
      $$
      \rho^{4} = 16 \Rightarrow \rho = 2 \qquad
      4\varphi = 0 + 2k\pi \Rightarrow \varphi = \frac{k\pi}{2},
      \ k \in \{0,1,2,3\}
      $$

      **Les quatre racines.**
      $$2, \quad 2i, \quad -2, \quad -2i$$

      **La disposition.** Toutes sur le cercle de rayon $2$, séparées par
      $\frac{2\pi}{4}$ : elles forment un polygone régulier à $4$ côtés.

  - id: NBCOMPLEX2-29
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: [similitude, rotation, homothetie]
    primary_misconception: mc.math.maths_complexes_trigo.similitude-module-argument-roles
    stem: >
      La transformation $z \mapsto 3\,e^{i\pi/4}\,z$ agit sur le plan complexe.
      De quoi est-elle la composée ?
    type: mcq
    choices:
      - id: A
        text: >-
          D'une homothétie de rapport $3$ et d'une rotation d'angle
          $\dfrac{\pi}{4}$, toutes deux de centre l'origine
        correct: true
      - id: B
        text: >-
          D'une homothétie de rapport $\dfrac{\pi}{4}$ et d'une rotation d'angle
          $3$ : les deux rôles sont donnés par le complexe $c$
        correct: false
        misconception: mc.math.maths_complexes_trigo.similitude-module-argument-roles
        feedback: >
          Les rôles sont échangés. Dans $z \mapsto cz$, le MODULE de $c$ donne le
          rapport de l'homothétie, et son ARGUMENT l'angle de la rotation. Un
          rapport $\pi/4 \approx 0{,}79$ rétrécirait la figure, et un angle de
          $3$ radians la ferait presque faire demi-tour.
      - id: C
        text: >-
          D'une homothétie de rapport $3\,e^{i\pi/4}$, le complexe $c$ servant
          directement de rapport
        correct: false
        misconception: mc.math.maths_complexes_trigo.homothetie-rapport-complexe
        feedback: >
          Le rapport d'une homothétie est un nombre RÉEL : c'est un facteur
          d'agrandissement, pas une rotation. Quand $c$ n'est pas réel, la
          transformation n'est pas une simple homothétie — elle en compose une
          avec une rotation, ce que la forme $re^{i\theta}$ met en évidence.
      - id: D
        text: >-
          D'une rotation seule, d'angle $\dfrac{\pi}{4}$ : le facteur $3$ est un
          coefficient sans effet géométrique
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-angle-comme-coefficient
        feedback: >
          Le facteur $3$ multiplie toutes les distances à l'origine par trois :
          c'est une homothétie, et son effet est très visible. Ce qui n'aurait
          aucun effet serait $c = 1$ — module $1$, argument $0$.
    correct_feedback: >
      $z \mapsto cz$ avec $c = re^{i\theta}$ compose une homothétie de rapport
      $r$ et une rotation d'angle $\theta$, toutes deux centrées à l'origine.
      Ici : rapport $3$, angle $\frac{\pi}{4}$.
    solution: |
      **La décomposition.** Écrire $c$ sous forme exponentielle :
      $$
      c = r\,e^{i\theta} \quad\Longrightarrow\quad
      z \mapsto cz = \underbrace{r}_{\text{homothétie}} \times
      \underbrace{e^{i\theta}z}_{\text{rotation}}
      $$

      **Ici.** $r = 3$ (agrandissement d'un facteur trois),
      $\theta = \frac{\pi}{4}$ (rotation d'un huitième de tour).

      **Les cas particuliers.** $c$ réel positif : homothétie seule.
      $|c| = 1$ : rotation seule. $c = 1$ : identité.

  - id: NBCOMPLEX2-30
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: [homothetie, rotation]
    primary_misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
    stem: >
      La transformation $z \mapsto 4z$ est-elle une rotation ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : $4$ a un argument nul — c'est une homothétie de rapport $4$
        correct: true
      - id: B
        text: >-
          Oui, d'angle $4$ radians : le coefficient donne directement l'angle
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-angle-comme-coefficient
        feedback: >
          Une rotation d'angle $\theta$ s'écrit $z \mapsto e^{i\theta}z$, jamais
          $z \mapsto \theta z$. La différence se voit sur les distances : une
          rotation les conserve, alors que multiplier par $4$ les quadruple.
      - id: C
        text: >-
          Oui, d'angle $\dfrac{\pi}{4}$ : tout complexe non nul induit une
          rotation
        correct: false
        misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
        feedback: >
          Un réel strictement positif a un argument NUL : il n'induit aucune
          rotation. La rotation vient de l'argument de $c$, et $4 = 4e^{i\cdot0}$
          n'en a pas. Le point $1$ est envoyé sur $4$, sur le même axe — rien n'a
          tourné.
      - id: D
        text: >-
          Non, c'est une homothétie de rapport $4i$, le rapport pouvant être
          complexe
        correct: false
        misconception: mc.math.maths_complexes_trigo.homothetie-rapport-complexe
        feedback: >
          Le rapport d'une homothétie est réel — ici $4$, et non $4i$.
          Multiplier par $4i$ serait une tout autre transformation :
          $4i = 4e^{i\pi/2}$, donc une homothétie de rapport $4$ COMPOSÉE avec un
          quart de tour.
    correct_feedback: >
      Non. $4 = 4\,e^{i\cdot 0}$ : module $4$, argument nul. C'est une homothétie
      de centre l'origine et de rapport $4$ — les distances quadruplent, les
      directions ne changent pas.
    solution: |
      **La lecture.** Écrire le coefficient sous forme exponentielle :
      $$4 = 4\,e^{i\cdot 0}$$
      Module $4$ : homothétie de rapport $4$. Argument $0$ : pas de rotation.

      **Le test visuel.** Le point d'affixe $1$ est envoyé sur $4$ — il reste sur
      le demi-axe réel positif. Une rotation l'aurait déplacé angulairement.

      **Le tableau des cas.**

      | $c$ | transformation |
      |---|---|
      | réel $> 0$ | homothétie |
      | module $1$ | rotation |
      | réel $< 0$ | homothétie + demi-tour |
      | quelconque | les deux composées |

  - id: NBCOMPLEX2-31
    rung: "R5"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: [ecriture_complexe, rotation, centre]
    primary_misconception: mc.math.maths_complexes_trigo.ecriture-complexe-oubli-constante
    stem: >
      La rotation de centre $A$ d'affixe $a$ et d'angle $\theta$ a pour écriture
      complexe $z' - a = e^{i\theta}(z - a)$. Quelle est l'expression de $z'$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $z' = e^{i\theta}(z - a) + a$, le terme $+a$ replaçant le centre
        correct: true
      - id: B
        text: >-
          $z' = e^{i\theta}(z - a)$ : il suffit d'isoler $z'$
        correct: false
        misconception: mc.math.maths_complexes_trigo.ecriture-complexe-oubli-constante
        feedback: >
          Le terme $a$ passe de l'autre côté : $z' = e^{i\theta}(z-a) + a$.
          L'oublier revient à ramener le centre à l'origine — la transformation
          obtenue serait une rotation de centre $O$, pas de centre $A$. Le
          contrôle : $z = a$ doit donner $z' = a$, le centre étant fixe.
      - id: C
        text: >-
          $z' = \theta(z - a) + a$ : l'angle intervient comme coefficient
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-angle-comme-coefficient
        feedback: >
          L'angle intervient par $e^{i\theta}$, jamais comme facteur. Multiplier
          par $\theta$ changerait les distances au centre — ce qu'une rotation ne
          fait jamais, puisque $|e^{i\theta}| = 1$.
      - id: D
        text: >-
          $z' = 4e^{i\theta}(z-a) + a$ si l'on veut aussi une homothétie de
          rapport $4e^{i\theta}$
        correct: false
        misconception: mc.math.maths_complexes_trigo.homothetie-rapport-complexe
        feedback: >
          Le rapport d'une homothétie est réel. L'écriture proposée compose bien
          une homothétie de rapport $4$ et une rotation d'angle $\theta$, mais le
          rapport est $4$ — pas $4e^{i\theta}$, qui est le coefficient de la
          similitude entière.
    correct_feedback: >
      $z' = e^{i\theta}(z-a) + a$. Le $+a$ n'est pas un détail : il replace le
      centre. Le contrôle immédiat — $z = a$ doit donner $z' = a$ — ne fonctionne
      que si le terme est présent.
    solution: |
      **L'isolement.**
      $$
      z' - a = e^{i\theta}(z-a) \quad\Longrightarrow\quad
      z' = e^{i\theta}(z-a) + a
      $$

      **Ce que le $+a$ fait.** Il compense la translation qu'on avait effectuée
      pour ramener le centre à l'origine. Trois étapes : translater de $-a$,
      tourner, retranslater de $+a$.

      **Le contrôle du point fixe.** Un centre de rotation est invariant :
      $z = a$ doit donner $z' = a$. Avec le $+a$ : $e^{i\theta}\times 0 + a = a$
      ✓. Sans lui : $0 \neq a$.

  - id: NBCOMPLEX2-32
    rung: "R6"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: [lieu_de_points, rotation]
    primary_misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
    stem: >
      Quel est l'ensemble des points $M$ d'affixe $z$ tels que
      $|z - 1| = |z + 2i|$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          La MÉDIATRICE du segment joignant les points d'affixes $1$ et $-2i$
        correct: true
      - id: B
        text: >-
          Le CERCLE de centre $1$ et de rayon $|{-2i}| = 2$
        correct: false
        misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
        feedback: >
          Un cercle correspond à $|z - a| = R$ — une distance CONSTANTE à un
          point fixe. Ici l'égalité porte sur deux distances à deux points
          différents : $MA = MB$, ce qui caractérise la médiatrice de $[AB]$.
      - id: C
        text: >-
          Une rotation d'angle $\dfrac{\pi}{2}$, le facteur $i$ indiquant un
          quart de tour
        correct: false
        misconception: mc.math.maths_complexes_trigo.rotation-sens-inverse
        feedback: >
          La question porte sur un ENSEMBLE de points, pas sur une
          transformation. Le $i$ apparaît ici dans l'affixe $-2i$ d'un point du
          plan, sans aucun rôle de rotation — il désigne le point de coordonnées
          $(0\,;-2)$.
      - id: D
        text: >-
          L'ensemble vide : il faudrait d'abord isoler $z$ en ajoutant la
          constante manquante des deux côtés
        correct: false
        misconception: mc.math.maths_complexes_trigo.ecriture-complexe-oubli-constante
        feedback: >
          Il n'y a rien à isoler : l'égalité de deux modules se LIT
          géométriquement comme une égalité de distances. Et l'ensemble n'est pas
          vide — il contient par exemple le milieu de $[AB]$, qui est à égale
          distance des deux points par construction.
    correct_feedback: >
      $|z - 1|$ est la distance de $M$ au point $A$ d'affixe $1$, et
      $|z + 2i| = |z - (-2i)|$ sa distance au point $B$ d'affixe $-2i$. L'égalité
      $MA = MB$ caractérise la médiatrice de $[AB]$.
    solution: |
      **La traduction géométrique.**
      $$|z - z_A| = MA$$
      donc $|z-1| = |z-(-2i)|$ s'écrit $MA = MB$ avec $z_A = 1$ et
      $z_B = -2i$.

      **Le lieu.** L'ensemble des points équidistants de deux points fixes est
      la MÉDIATRICE du segment qui les joint.

      **Les trois lieux à ne pas confondre.**

      | condition | lieu |
      |---|---|
      | $\lvert z - a\rvert = R$ | cercle de centre $A$, rayon $R$ |
      | $\lvert z - a\rvert = \lvert z - b\rvert$ | médiatrice de $[AB]$ |
      | $\arg(z-a) = \theta$ | demi-droite issue de $A$ |

  - id: NBCOMPLEX2-33
    rung: "R4"
    difficulty_level: 4
    skill_code: maths_complexes_trigo
    tags: [racines_niemes, lieu_de_points]
    primary_misconception: mc.math.maths_complexes_trigo.racines-module-non-racine
    stem: >
      Les solutions de $z^{3} = 27\,e^{i\pi}$ ont quel module, et sur quelle
      figure se placent-elles ?
    type: mcq
    choices:
      - id: A
        text: >-
          Module $3$, sur le cercle de rayon $3$ centré à l'origine, aux sommets
          d'un triangle équilatéral
        correct: true
      - id: B
        text: >-
          Module $27$, le module du second membre étant conservé par la racine
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-module-non-racine
        feedback: >
          $|z^{3}| = |z|^{3}$, donc $|z|^{3} = 27$ et $|z| = 27^{1/3} = 3$. Le
          module des racines est la racine $n$-ième du module — pas le module
          lui-même, sans quoi le cube d'une racine vaudrait $27^{3}$.
      - id: C
        text: >-
          Module $3$, mais sur une médiatrice, puisque les trois racines sont
          équidistantes deux à deux
        correct: false
        misconception: mc.math.maths_complexes_trigo.ensemble-points-locus-confondu
        feedback: >
          Elles sont équidistantes de l'ORIGINE — toutes de module $3$ — ce qui
          les place sur un CERCLE. Une médiatrice est le lieu des points
          équidistants de deux points fixes, ce qui n'est pas la condition ici.
      - id: D
        text: >-
          Module $3$, avec un écart angulaire de $\dfrac{\pi}{3}$ entre racines
          consécutives
        correct: false
        misconception: mc.math.maths_complexes_trigo.racines-pas-2pi-sur-n
        feedback: >
          L'écart vaut $\dfrac{2\pi}{n} = \dfrac{2\pi}{3}$. Avec
          $\dfrac{\pi}{3}$, les trois racines ne couvriraient qu'un tiers du
          tour ; or elles partagent le cercle ENTIER en parts égales.
    correct_feedback: >
      $|z|^{3} = 27$ donne $|z| = 3$ : le module des racines est la racine
      cubique du module. Les trois solutions sont sur le cercle de rayon $3$,
      espacées de $\frac{2\pi}{3}$ — les sommets d'un triangle équilatéral.
    solution: |
      **Le module.**
      $$|z|^{3} = 27 \quad\Longrightarrow\quad |z| = 27^{1/3} = 3$$

      **Les arguments.**
      $$
      3\varphi = \pi + 2k\pi \quad\Longrightarrow\quad
      \varphi = \frac{\pi}{3} + \frac{2k\pi}{3}, \quad k \in \{0,1,2\}
      $$

      **La figure.** Trois points sur le cercle de rayon $3$, séparés par
      $\frac{2\pi}{3}$ : un triangle équilatéral centré à l'origine.

      **La règle générale.** Les $n$ racines $n$-ièmes d'un complexe de module
      $R$ ont pour module $R^{1/n}$ et forment un polygone régulier à $n$ côtés.

  - id: NBCOMPLEX2-34
    rung: "R5"
    difficulty_level: 3
    skill_code: maths_complexes_trigo
    tags: [similitude, module, homothetie]
    primary_misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
    stem: >
      Soit la transformation $z \mapsto c\,z$ avec $c = 5$. Que vaut $|c|$, et
      quel est l'effet géométrique de cette transformation ?
    type: mcq
    choices:
      - id: A
        text: >-
          $|c| = 5$, et la transformation est une homothétie de rapport $5$
          centrée à l'origine, sans aucune rotation
        correct: true
      - id: B
        text: >-
          $|c| = 25$, le module valant $a^{2}+b^{2}$, et la transformation
          multiplie donc les distances par $25$
        correct: false
        misconception: mc.math.maths_complexes_trigo.module-oubli-racine
        feedback: >
          La racine finale manque : $|c| = \sqrt{a^{2}+b^{2}} = \sqrt{25} = 5$.
          Pour un réel, le module est simplement sa valeur absolue — et $|5| = 5$,
          non $25$. Sans la racine, on obtient systématiquement le CARRÉ du
          module.
      - id: C
        text: >-
          $|c| = 5$, et la transformation compose une homothétie de rapport $5$
          avec une rotation : n'importe quel coefficient non nul en induit une
        correct: false
        misconception: mc.math.maths_complexes_trigo.reel-positif-donne-rotation
        feedback: >
          Un réel strictement positif a un argument NUL : il n'induit aucune
          rotation. La rotation vient de l'argument de $c$, et $5 = 5e^{i\cdot0}$
          n'en a pas. Le point d'affixe $1$ est envoyé sur $5$, sur le même
          demi-axe : rien n'a tourné.
      - id: D
        text: >-
          $|c| = 5$, mais c'est l'ARGUMENT de $c$ qui donne le rapport de
          l'homothétie et son MODULE qui donne l'angle de rotation
        correct: false
        misconception: mc.math.maths_complexes_trigo.similitude-module-argument-roles
        feedback: >
          Les deux rôles sont inversés. Dans $z \mapsto cz$ avec
          $c = re^{i\theta}$ : le module $r$ donne le RAPPORT de l'homothétie,
          l'argument $\theta$ l'ANGLE de la rotation. Un argument comme rapport
          d'agrandissement donnerait ici $0$, donc l'écrasement de tout le plan
          sur un point.
    correct_feedback: >
      $|5| = 5$, et $5 = 5\,e^{i\cdot 0}$ : module $5$, argument nul. C'est donc
      une homothétie pure, de centre l'origine et de rapport $5$ — les distances
      quintuplent, aucune direction ne change.
    solution: |
      **Le module.**
      $$|c| = \sqrt{a^{2}+b^{2}} = \sqrt{5^{2}+0^{2}} = 5$$
      Pour un réel, le module est la valeur absolue.

      **La lecture géométrique.** $c = r\,e^{i\theta}$ avec $r = 5$ et
      $\theta = 0$ :
      - le MODULE donne le rapport de l'homothétie ;
      - l'ARGUMENT donne l'angle de la rotation.

      Argument nul, donc pas de rotation.

      **Le contrôle visuel.** $1 \mapsto 5$ : le point reste sur le demi-axe réel
      positif, cinq fois plus loin.

