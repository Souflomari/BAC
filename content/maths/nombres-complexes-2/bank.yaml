        stem: |-
          **(0,25 pt)** Montrer que : $\left(\forall z \in \mathbb{C}\right)$ ; $|z| = 1 \iff \overline{z} = \dfrac{1}{z}$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une équivalence se démontre dans les deux sens, et les deux tiennent ici sur la même identité du chapitre 1 : $z\overline{z} = |z|^2$. Cette identité est le pont entre une information **métrique** (le module, une longueur) et une information **algébrique** (le conjugué, un nombre avec lequel on calcule). Toute la Partie II consiste à traverser ce pont : « le point est sur le cercle unité » deviendra « son conjugué est son inverse », et une hypothèse géométrique se transformera en identité qu'on manipule.

          **Sens direct.** Si $|z| = 1$, alors $|z| \neq 0$, donc $z \neq 0$ et $\dfrac1z$ existe. Et

          $$z\overline{z} = |z|^2 = 1^2 = 1 \implies \overline{z} = \frac{1}{z}$$

          (on a divisé par $z \neq 0$).

          **Sens réciproque.** Si $\overline{z} = \dfrac1z$ — écriture qui suppose déjà $z \neq 0$ —, on multiplie par $z$ :

          $$z\overline{z} = 1 \implies |z|^2 = 1 \implies |z| = 1$$

