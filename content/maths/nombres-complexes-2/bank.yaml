        steps:
          - math: 'u = 1+(2-\sqrt3)i = 1+i\tan\dfrac{\pi}{12} = \dfrac{\cos(\pi/12)+i\sin(\pi/12)}{\cos(\pi/12)} = \dfrac{e^{i\pi/12}}{\cos(\pi/12)}'
            note: "1+i tanθ=(cosθ+isinθ)/cosθ, car cos(π/12)≠0."
          - math: '\cos\dfrac{\pi}{12}=\dfrac{1+\sqrt3}{2\sqrt2}\ (\text{question 1c}) \implies \dfrac{1}{\cos(\pi/12)} = \dfrac{2\sqrt2}{1+\sqrt3}'
            note: "On réutilise la valeur de cos(π/12) déjà identifiée."
          - math: '\dfrac{2\sqrt2}{1+\sqrt3} = \dfrac{2\sqrt2(\sqrt3-1)}{(\sqrt3+1)(\sqrt3-1)} = \dfrac{2\sqrt2(\sqrt3-1)}{2} = \sqrt2(\sqrt3-1) = \sqrt6-\sqrt2'
            note: "Méthode du conjugué ; √2×√3=√6."
          - math: 'u = (\sqrt6-\sqrt2)\,e^{i\pi/12}, \qquad \text{et de façon équivalente\,: } u = \dfrac{e^{i\pi/12}}{\cos(\pi/12)}'
            note: "Les deux écritures de u seront réutilisées : la première ici, la seconde à la question 2b."
      - id: q2a
        part: "Deux suites $(x_n)_{n\\in\\mathbb{N}}$ et $(y_n)_{n\\in\\mathbb{N}}$ : $x_0=1$, $y_0=0$, et pour tout $n\\in\\mathbb{N}$, $x_{n+1}=x_n-(2-\\sqrt3)y_n$ et $y_{n+1}=(2-\\sqrt3)x_n+y_n$"
