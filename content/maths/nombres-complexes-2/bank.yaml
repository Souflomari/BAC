        reasoning: |-
          $D$ est le milieu de $[BC]$, donc $d=\dfrac{b+c}{2}$. On soustrait cette valeur des expressions de $p$ et $q$ trouvées à la question précédente ; le résultat se réécrit en fonction des deux différences $a-b$ et $c-a$, et l'une des deux expressions apparaît comme « $i$ fois » l'autre — c'est ce qui fait apparaître un rapport constant, indépendant de $a,b,c$.
        steps:
