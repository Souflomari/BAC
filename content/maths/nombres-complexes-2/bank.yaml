          **(0,5 pt)** En déduire que le triangle $PQR$ est équilatéral.
        reasoning: |-
          On réécrit la relation $p+qj+rj^2=0$ pour faire apparaître un rapport de complexes : en remplaçant $j^2$ par $-1-j$ (identité de la question 1), on isole $\dfrac{p-r}{q-r}$, qui vaut exactement $-j$. Or $-j$ a pour module $1$ et pour argument $-\dfrac{\pi}{3}$ — exactement la condition du rung R6 pour un triangle équilatéral, lue au sommet $R$.
        steps:
          - math: 'j^2=-1-j \implies p+qj+r(-1-j)=0 \implies (p-r)+j(q-r)=0'
            note: "On substitue j² (identité 1+j+j²=0)."
          - math: '\dfrac{p-r}{q-r} = -j'
            note: "On isole le rapport (Q ≠ R, sinon deux des trois milieux coïncident, ce que la question précédente exclut par construction)."
          - math: '-j = -\left(-\tfrac12+\tfrac{\sqrt3}{2}i\right) = \tfrac12-\tfrac{\sqrt3}{2}i = e^{-i\pi/3}'
            note: "Forme exponentielle de −j : module 1, argument −π/3."
          - math: '\left|\dfrac{p-r}{q-r}\right|=1 \ \text{et}\ \arg\!\left(\dfrac{p-r}{q-r}\right) = -\dfrac{\pi}{3}\ [2\pi] \implies PQR\ \text{équilatéral}'
            note: "Rung R6, sommet R : module 1 et argument ±π/3 caractérisent un triangle équilatéral."

