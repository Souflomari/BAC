            note: "Même geste pour q."
          - math: 'i(q-d) = i\dfrac{(a-b)+i(c-a)}{2} = \dfrac{i(a-b)-(c-a)}{2} = \dfrac{(a-c)+i(a-b)}{2} = p-d'
            note: "On vérifie que p−d = i(q−d) : le numérateur et i fois le dénominateur coïncident terme à terme."
          - math: '\dfrac{p-d}{q-d} = i \qquad (q\neq d,\ \text{sans quoi}\ D=Q)'
