    intro: |-
      **Nombres complexes (examen national, session normale 2021, Sciences Mathématiques).**

      Soient $a$, $b$, $c$ trois nombres complexes **non nuls** tels que $a+b \neq c$.

      L'exercice se déroule en trois temps. La **première question** résout une équation du second degré déjà écrite sous la forme somme/produit de ses racines — pas besoin de discriminant, la factorisation se lit directement (relations coefficients-racines, Viète). La **deuxième** plante deux centres de rotation d'angle $\pm\dfrac{\pi}{2}$ ($P$, $Q$) autour du triangle $ABC$ et en tire la nature du triangle $PDQ$, $D$ étant le milieu de $[BC]$ — via le rapport de complexes du rung R6. La **troisième** construit deux symétriques et leur milieu $K$, pour aboutir à une cocyclicité de quatre points, obtenue ici par un argument de géométrie élémentaire (parallélogramme puis carré) plutôt qu'un nouvel outil.
    questions:
      - id: q1a
        stem: |-
          **(0,5 pt)** Résoudre dans $\mathbb{C}$ l'équation d'inconnue $z$ :
          $$(E)\ :\ z^2 - (a+b+c)z + c(a+b) = 0$$
        reasoning: |-
          Pas besoin de discriminant ici : l'équation est déjà écrite sous la forme somme/produit des deux racines qu'elle a. Si $z^2-(a+b+c)z+c(a+b)=0$ a pour racines $z'$ et $z''$, les relations coefficients-racines (Viète) donnent $z'+z''=a+b+c$ et $z'z''=c(a+b)$ — et deux nombres vérifient déjà l'un et l'autre : $c$ et $a+b$, dont la somme vaut $a+b+c$ et le produit $c(a+b)$. Il suffit donc de vérifier que $(z-c)\big(z-(a+b)\big)$ redéveloppe bien $(E)$, sans jamais calculer de discriminant. L'hypothèse $a+b\neq c$, donnée dès l'énoncé, garantit que ces deux racines sont bien distinctes.
        steps:
          - math: '(z-c)\big(z-(a+b)\big) = z^2 - \big(c+(a+b)\big)z + c(a+b) = z^2-(a+b+c)z+c(a+b)'
            note: "On développe le produit (z−c)(z−(a+b)) ; c+(a+b)=a+b+c."
          - math: '(z-c)\big(z-(a+b)\big) = 0 \iff z=c\ \text{ou}\ z=a+b'
            note: "Le développement redonne exactement (E) : c et a+b en sont les deux racines."
          - math: 'S = \{\,c,\ a+b\,\} \qquad (c\neq a+b,\ \text{racines distinctes, hypothèse donnée})'
            note: "Ensemble des solutions de (E)."
      - id: q1b
        part: "On suppose dans cette question que $a = i$, $b = e^{i\\frac{\\pi}{3}}$ et $c = a-b$"
        stem: |-
          **(0,5 pt)** Écrire les deux solutions de l'équation $(E)$ sous forme exponentielle.
        reasoning: |-
