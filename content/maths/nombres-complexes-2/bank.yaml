        stem: |-
          **(0,5 pt)** En déduire la nature du triangle $PDQ$.
        reasoning: |-
          Le rapport qu'on vient de calculer est exactement, au sommet $D$, le rapport du chapitre 7 : $\dfrac{p-d}{q-d} = \dfrac{z_P-z_D}{z_Q-z_D}$. Il vaut $i$, qui est imaginaire pur et de module $1$ : d'après la table du chapitre 7, imaginaire pur signale un angle droit en $D$, et module $1$ signale deux côtés égaux issus de $D$.
        steps:
