    intro: |-
      **Nombres complexes (examen national, session normale 2024, Sciences Mathématiques).**

      Le plan complexe est rapporté à un repère orthonormé direct $(O,\vec u,\vec v)$. On considère dans $\mathbb{C}$ l'équation d'inconnue $z$ :

      $$(E_\alpha)\ :\ z^2 - 2iz + \alpha = 0 \qquad \text{où } \alpha \in \mathbb{C}$$

      La **partie I** étudie $(E_\alpha)$ en général : discriminant, condition de deux solutions distinctes, somme et produit des racines. La **partie II** place $\Omega(\alpha)$, $M_1(z_1)$ et $M_2(z_2)$ dans le plan et cherche, pour finir, l'ensemble des $\alpha$ qui rendent le triangle $OM_1M_2$ rectangle en $O$ — une synthèse qui réutilise chaque résultat de la partie précédente.
    questions:
      - id: q1a
        part: "Partie I — L'équation $(E_\\alpha)\\ :\\ z^2 - 2iz + \\alpha = 0$"
        stem: |-
          **(0,25 pt)** Montrer que le discriminant de l'équation $(E_\alpha)$ est $\Delta = -4(1 + \alpha)$.
        reasoning: |-
          Application directe de $\Delta=b^2-4ac$, avec $b=-2i$ (donc $b^2=-4$) — aucun geste caché ici, juste factoriser par $-4$ à la fin pour retrouver la forme demandée.
        steps:
          - math: '\Delta = (-2i)^2-4\times1\times\alpha = -4-4\alpha'
            note: "Δ=b²−4ac, avec a=1, b=−2i, c=α."
          - math: '\Delta = -4(1+\alpha)'
            note: "On factorise par −4."
      - id: q1b
        stem: |-
          **(0,25 pt)** Déterminer l'ensemble des valeurs $\alpha$ pour lesquelles l'équation $(E_\alpha)$ admette dans l'ensemble $\mathbb{C}$ deux solutions distinctes.
        reasoning: |-
          Dans $\mathbb{C}$, à la différence de $\mathbb{R}$, tout nombre non nul a exactement deux racines carrées distinctes (rung R4, $n=2$) : une équation du second degré a donc deux solutions distinctes **dès que** $\Delta\neq0$ — pas besoin de discuter le signe de $\Delta$ comme dans $\mathbb{R}$. Si $\Delta=0$, en revanche, la racine est double.
        steps:
          - math: '(E_\alpha)\ \text{a deux solutions distinctes} \iff \Delta\neq0'
            note: "Dans ℂ, tout nombre non nul a exactement deux racines carrées distinctes (rung R4, n=2) ; Δ=0 donnerait une racine double."
          - math: '\Delta\neq0 \iff -4(1+\alpha)\neq0 \iff \alpha\neq -1'
            note: "On résout l'inéquation."
          - math: '\alpha \in \mathbb{C}-\{-1\}'
            note: "Ensemble cherché : tout le plan complexe, sauf le point −1."
      - id: q2
        stem: |-
          **(0,5 pt)** On note $z_1$ et $z_2$ les deux solutions de l'équation $(E_\alpha)$. Déterminer $z_1 + z_2$ et $z_1 z_2$.
        reasoning: |-
          Les relations coefficients-racines (Viète) lisent directement la somme et le produit sur les coefficients de $(E_\alpha)$, sans avoir besoin de calculer $z_1$ et $z_2$ individuellement.
        steps:
          - math: 'z_1+z_2 = -\dfrac{b}{a} = 2i'
            note: "Relations coefficients-racines (Viète), somme."
          - math: 'z_1z_2 = \dfrac{c}{a} = \alpha'
            note: "Viète, produit."
      - id: q3a
        part: "Partie II — $\\Omega(\\alpha)$, $M_1(z_1)$, $M_2(z_2)$ ; on suppose $\\alpha = m^2-2m$ avec $m\\in\\mathbb{R}$"
        stem: |-
          **(0,5 pt)** Déterminer $z_1$ et $z_2$ en fonction de $m$.
        reasoning: |-
          On remplace $\alpha$ par $m^2-2m$ dans $\Delta=-4(1+\alpha)$ : l'expression $1+m^2-2m$ est l'identité remarquable $(m-1)^2$, donc $\Delta$ se réduit à un carré parfait — encore le même geste qu'aux questions précédentes de cette notion, avec $2i(m-1)$ comme racine carrée.
        steps:
          - math: '\Delta = -4(1+\alpha) = -4\big(1+m^2-2m\big) = -4(m-1)^2 = \big[2i(m-1)\big]^2'
            note: "On remplace α ; 1+m²−2m=(m−1)² (identité remarquable) ; −4 fois un carré réel est le carré de 2i fois ce réel."
          - math: 'z = \dfrac{2i \pm 2i(m-1)}{2} = i\big[1\pm(m-1)\big]'
            note: "Formule (−b±δ)/(2a), avec −b=2i, δ=2i(m−1)."
          - math: 'z_1 = i\big[1+(m-1)\big] = im, \qquad z_2 = i\big[1-(m-1)\big] = i(2-m)'
            note: "On développe les deux crochets."
      - id: q3b
