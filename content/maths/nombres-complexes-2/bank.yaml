        steps:
          - math: 'z_1=im,\ z_2=i(2-m),\quad m,\ 2-m \in \mathbb{R}'
            note: "Les deux affixes sont des multiples réels de i."
          - math: 'M_1,\ M_2 \in (O; \vec{v}) \ \text{(axe des imaginaires purs, passant par O)}'
            note: "Un multiple réel de i place le point sur l'axe imaginaire."
          - math: 'O,\ M_1,\ M_2\ \text{alignés}'
            note: "Trois points portés par la même droite (l'axe imaginaire) sont alignés."
      - id: q4a
