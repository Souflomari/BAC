            note: "e^{−iα}−e^{iα} = −2i sin α (R1, propriétés du conjugué en forme exponentielle)."
          - math: '\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right) = \dfrac{1+\sqrt3}{2} = \dfrac{q}{m} \implies r-p = -i\,q'
            note: "On réutilise l'identité et la valeur de q établies à la question précédente."
          - math: '\dfrac{r-p}{q} = -i'
            note: "Rapport des affixes de PR et OQ (rung R6)."
          - math: '\left|\dfrac{r-p}{q}\right| = 1 \implies PR = OQ, \qquad \arg\!\left(\dfrac{r-p}{q}\right) = -\dfrac{\pi}{2} \implies (PR)\perp(OQ)'
            note: "Un seul rapport encode les deux faits : module 1 (longueurs égales), argument ±π/2 (perpendicularité)."

