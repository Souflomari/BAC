          Montrer que les deux droites $(PR)$ et $(OB)$ sont perpendiculaires.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux mouvements, et aucun n'est nouveau. D'abord obtenir $r$ : la construction de $R$ est **mot pour mot** celle de $P$, à un renommage près. La question 2-a) dit « la parallèle à $(BC)$ menée par $A$ recoupe $(U)$ en $p = \dfrac{bc}{a}$ » ; ici c'est la parallèle à $(AB)$ menée par $C$. On applique donc le même résultat avec les rôles $A \to C$, $B \to A$, $C \to B$, ce qui donne

          $$r = \frac{a\,b}{c}$$

          Ensuite, la perpendicularité : $(PR) \perp (OB)$ se lit sur le rapport des affixes de $\vec{RP}$ (soit $p-r$) et de $\vec{OB}$ (soit $b-0=b$). Il faut donc montrer que $\dfrac{p-r}{b}$ est un imaginaire pur non nul (chapitre 7).

          **Le calcul, et il est court.** On factorise $b$ :

          $$p - r = \frac{bc}{a}-\frac{ab}{c} = b\left(\frac{c}{a}-\frac{a}{c}\right) \implies \frac{p-r}{b} = \frac{c}{a}-\frac{a}{c}$$

          Pose $w = \dfrac{c}{a}$. Alors $|w| = \dfrac{|c|}{|a|} = 1$, donc — c'est la question 1, une troisième fois — $\dfrac1w = \overline{w}$, c'est-à-dire $\dfrac{a}{c} = \overline{w}$. D'où

          $$\frac{p-r}{b} = w - \overline{w} = 2i\,\operatorname{Im}(w)$$

          qui est un imaginaire pur. Il reste à s'assurer qu'il n'est pas **nul**, sans quoi on ne conclut rien : $w-\overline{w}=0$ signifie $w$ réel, donc $w = \pm1$ (puisque $|w|=1$), donc $c = a$ (exclu : les points sont deux à deux distincts) ou $c = -a$. Hors ce dernier cas, $\dfrac{p-r}{b}$ est un imaginaire pur non nul et les deux droites sont perpendiculaires.

          **Le piège à éviter, et une imprécision du sujet officiel.** Le cas $a = -c$ n'est pas une coquetterie de rédaction : si $A$ et $C$ sont diamétralement opposés, alors

          $$p = \frac{bc}{a} = \frac{bc}{-c} = -b \qquad\text{et}\qquad r = \frac{ab}{c} = \frac{-cb}{c} = -b$$

          donc $P = R$ — et la droite $(PR)$ **n'existe pas**. L'énoncé n'exclut que le fait que $A$, $B$, $C$ soient deux à deux distincts, ce qui n'écarte pas $a = -c$ : c'est une imprécision du sujet officiel, à signaler explicitement dans ta copie plutôt qu'à ignorer. Le second piège est plus banal : conclure « imaginaire pur, donc perpendiculaire » sans avoir écarté la valeur $0$. Zéro est à la fois réel et imaginaire pur ; il ne code aucune direction.
        steps:
          - math: 'r = \dfrac{ab}{c}'
            note: "Question 2-a réappliquée avec les rôles A → C, B → A, C → B (la parallèle à (AB) menée par C)."
          - math: 'p-r = \dfrac{bc}{a}-\dfrac{ab}{c} = b\left(\dfrac{c}{a}-\dfrac{a}{c}\right) \implies \dfrac{p-r}{b} = \dfrac{c}{a}-\dfrac{a}{c}'
            note: "On factorise par b : l'affixe de OB disparaît du problème."
          - math: 'w = \dfrac{c}{a},\ |w| = 1 \implies \dfrac{a}{c} = \dfrac{1}{w} = \overline{w} \implies \dfrac{p-r}{b} = w-\overline{w} = 2i\operatorname{Im}(w)'
            note: "Question 1 une troisième fois ; z − z̄ est toujours un imaginaire pur (chapitre 1, chapitre 4)."
          - math: 'w-\overline{w} = 0 \iff w \in \mathbb{R} \iff w = \pm1 \iff c = a\ (\text{exclu})\ \text{ou}\ c = -a'
            note: "Le cas nul doit être écarté : zéro ne code aucune direction."
          - math: 'a \neq -c \implies \dfrac{p-r}{b} = \dfrac{\text{aff}\left(\vec{RP}\right)}{\text{aff}\left(\vec{OB}\right)}\ \text{imaginaire pur non nul} \implies (PR) \perp (OB)'
            note: "Chapitre R6 : rapport imaginaire pur non nul ⟹ directions perpendiculaires. Si a = −c alors p = r = −b et la droite (PR) n'existe pas."

  # ── bk-2025-n-x2 — 2025 N, Exercice 2 : équation à paramètre α, perpendicularités, cocyclicité ──
  - id: bk-2025-n-x2
    title: "Équation à paramètre α, perpendicularités et cocyclicité"
    source:
      year: 2025
      session: normale
      filiere: "SM"
      exercise_label: "Exercice 2"
    bareme_total: 3.5
    duration_min: 21
    sourcing:
      status: sourced
      note: >-
        2025 session normale — examen national filière SCIENCES
        MATHÉMATIQUES (A) et (B), خيار فرنسية (BIOF), Mathématiques (4 h,
        coef 9), code sujet NS 24F, barème 3,5 points (Exercice 2, nombres
        complexes). Source AlloSchool element/145783. Transcription vérifiée :
        docs/sujets/maths/nombres-complexes-2.md, section « 2025 — session
        normale — Exercice 2 » (statut « vérifié », agent-vérificateur-
        adversarial, 2026-08-06, source re-fetchée indépendamment, diff
        caractère-par-caractère conforme au scan ; discriminant Δ_α, racines
        a et b avec b/a=2i, re-dérivés et confirmés). Écart de périmètre
        (voir SCOPE NOTE en tête de fichier) : la question I.1 résout (E_α)
        via un discriminant reconnu comme carré parfait puis la formule
        (−b±δ)/(2a) — exactement l'outil hors du corps de rungs actuel
        (équation du second degré dans ℂ). La cocyclicité de K, I, H, J
        (question II.2c) n'est volontairement PAS démontrée ici par
        birapport (outil également hors rungs, voir SCOPE NOTE 2) : la
        présente entrée passe par le théorème de Thalès (angle droit inscrit
        ⟹ point sur le cercle de diamètre [IJ]), appliqué successivement à H
        puis à K — un fait de géométrie élémentaire, non spécifique aux
        complexes, pour rester dans le corps d'outils enseignés ; signalé
        pour transparence.
    intro: |-
      **Nombres complexes (examen national, session normale 2025, Sciences Mathématiques).**

      Soit $\alpha \in [0\,;\,2\pi[$. Le plan complexe est rapporté à un repère orthonormé direct $(O;\vec{u},\vec{v})$. On considère dans $\mathbb{C}$ l'équation d'inconnue $z$ :

      $$(E_\alpha)\ :\ z^2 - 2^\alpha e^{i\alpha}(1+2i)z + i\,2^{2\alpha+1}e^{i2\alpha} = 0$$

      La **partie I** en calcule le discriminant (déjà un carré parfait) puis les deux solutions $a$ et $b$, et vérifie que leur rapport est un imaginaire pur — indépendant de $\alpha$. La **partie II** construit, à partir de $H$ tel que $\dfrac{1}{h}=\dfrac{1}{a}+\dfrac{1}{b}$, puis des milieux $I$ et $J$, une suite de perpendicularités et d'alignements — jusqu'à la cocyclicité de quatre points, obtenue ici par le théorème de Thalès plutôt qu'un nouvel outil. Le fil conducteur reste, comme presque partout dans ce chapitre, le rapport de deux affixes (chapitre 7).
    questions:
      - id: q1a
        stem: |-
          **(0,25 pt)** Vérifier que le discriminant de l'équation $(E_\alpha)$ est : $\Delta_\alpha = \left(2^\alpha e^{i\alpha}(1-2i)\right)^2$
        reasoning: |-
          On calcule $\Delta_\alpha = b^2-4ac$ directement à partir des coefficients de $(E_\alpha)$, avec $b=-2^\alpha e^{i\alpha}(1+2i)$, $a=1$, $c=i\,2^{2\alpha+1}e^{i2\alpha}$. Le geste qui débloque tout est de reconnaître, dans le résultat, le carré $(1-2i)^2$ — même geste qu'aux autres sujets de cette notion, une fois de plus.
        steps:
          - math: '\Delta_\alpha = \big[2^\alpha e^{i\alpha}(1+2i)\big]^2 - 4\times1\times i\,2^{2\alpha+1}e^{i2\alpha} = 2^{2\alpha}e^{i2\alpha}(1+2i)^2 - 4i\,2^{2\alpha+1}e^{i2\alpha}'
            note: "Δ_α = b² − 4ac, avec a=1, b=−2^α e^{iα}(1+2i), c=i·2^{2α+1}e^{i2α}."
          - math: '\Delta_\alpha = 2^{2\alpha}e^{i2\alpha}\Big[(1+2i)^2 - 4i\times2\Big] = 2^{2\alpha}e^{i2\alpha}\big[(1+2i)^2-8i\big]'
            note: "On met 2^{2α}e^{i2α} en facteur commun ; 2^{2α+1}=2×2^{2α}."
          - math: '(1+2i)^2 = 1+4i-4=-3+4i \implies (1+2i)^2-8i = -3-4i'
            note: "Développement de (1+2i)²."
          - math: '(1-2i)^2 = 1-4i-4=-3-4i'
            note: "On vérifie que (1−2i)² donne exactement le même résultat : c'est le carré parfait cherché."
          - math: '\Delta_\alpha = 2^{2\alpha}e^{i2\alpha}(1-2i)^2 = \big[2^\alpha e^{i\alpha}(1-2i)\big]^2'
            note: "Les deux expressions coïncident : Δ_α est bien ce carré."
      - id: q1b
        stem: |-
          **(0,5 pt)** En déduire les deux solutions $a$ et $b$ de l'équation $(E_\alpha)$ avec $|a| < |b|$.
        reasoning: |-
          $\Delta_\alpha$ est déjà un carré parfait (question précédente) : $\delta = 2^\alpha e^{i\alpha}(1-2i)$ en est une racine. La formule $\dfrac{-b\pm\delta}{2a}$, avec $-b=2^\alpha e^{i\alpha}(1+2i)$, donne les deux racines une fois qu'on factorise chaque numérateur par $2^\alpha e^{i\alpha}$. Il reste à comparer les deux modules pour savoir laquelle est $a$ (la plus petite) et laquelle est $b$.
        steps:
          - math: 'z = \dfrac{2^\alpha e^{i\alpha}(1+2i) \pm 2^\alpha e^{i\alpha}(1-2i)}{2} = 2^\alpha e^{i\alpha}\,\dfrac{(1+2i)\pm(1-2i)}{2}'
            note: "Formule (−b±δ)/(2a) ; on factorise par 2^α e^{iα}."
          - math: '\text{signe}+:\ (1+2i)+(1-2i)=2 \implies z=2^\alpha e^{i\alpha}; \qquad \text{signe}-:\ (1+2i)-(1-2i)=4i \implies z = 2^{\alpha+1}\,i\,e^{i\alpha}'
            note: "Les deux racines, avant tri par module."
          - math: '2^{\alpha+1}\,i\,e^{i\alpha} = 2^{\alpha+1}\,e^{i\left(\alpha+\frac{\pi}{2}\right)}'
            note: "On absorbe i=e^{iπ/2} dans l'argument (règle du produit, chapitre 3)."
          - math: '\left|2^\alpha e^{i\alpha}\right| = 2^\alpha < 2^{\alpha+1} = \left|2^{\alpha+1}e^{i(\alpha+\pi/2)}\right| \implies a = 2^\alpha e^{i\alpha}, \quad b = 2^{\alpha+1}\,e^{i\left(\alpha+\frac{\pi}{2}\right)}'
            note: "2^α < 2^{α+1} pour tout α réel : la plus petite en module est a."
      - id: q2
        stem: |-
          **(0,25 pt)** Vérifier que $\dfrac{b}{a}$ est un imaginaire pur.
        reasoning: |-
          Le rapport $b/a$ est direct : les deux formes exponentielles de la question précédente se divisent par la règle du quotient (chapitre 4), et le module $2^\alpha$ se simplifie exactement.
        steps:
          - math: '\dfrac{b}{a} = \dfrac{2^{\alpha+1}\,e^{i(\alpha+\pi/2)}}{2^\alpha\,e^{i\alpha}} = 2\,e^{i\pi/2}'
            note: "Règle du quotient (chapitre 4) : modules divisés, arguments soustraits."
          - math: '2\,e^{i\pi/2} = 2i'
            note: "e^{iπ/2}=i."
          - math: '\dfrac{b}{a} = 2i\ \text{est un imaginaire pur (non nul), et ne dépend même pas de}\ \alpha'
            note: "Résultat constant."
      - id: q3a
        part: "Partie II. $M(z)$ point d'affixe $z$. On pose $\\dfrac{b}{a}=\\lambda i$ avec $\\lambda=\\mathrm{Im}\\!\\left(\\dfrac{b}{a}\\right)$. $A(a)$, $B(b)$, $H(h)$ avec $\\dfrac{1}{h}=\\dfrac{1}{a}+\\dfrac{1}{b}$"
        stem: |-
          **(0,5 pt)** Montrer que : $\dfrac{h}{b-a} = -\left(\dfrac{\lambda}{\lambda^2+1}\right)i$ puis en déduire que les droites $(OH)$ et $(AB)$ sont perpendiculaires.
        reasoning: |-
          On calcule d'abord $h$ : $\dfrac1h=\dfrac1a+\dfrac1b=\dfrac{a+b}{ab}$, donc $h=\dfrac{ab}{a+b}$. Le rapport $\dfrac{h}{b-a}$ se réécrit alors en fonction du seul quotient $\dfrac{b}{a}=\lambda i$, en factorisant $a$ au numérateur et au dénominateur (méthode déjà vue : tout ramener au rapport connu). Une fois ce rapport identifié comme imaginaire pur, la perpendicularité de $(OH)$ et $(AB)$ suit du même principe que le chapitre 7 : le rapport de deux affixes de vecteurs — ici $\vec{OH}$ (affixe $h-0=h$) et $\vec{AB}$ (affixe $b-a$) — encode l'angle entre elles par son argument.
        steps:
          - math: '\dfrac1h=\dfrac1a+\dfrac1b=\dfrac{a+b}{ab} \implies h=\dfrac{ab}{a+b}'
            note: "On inverse la relation donnée."
          - math: '\dfrac{h}{b-a} = \dfrac{ab}{(a+b)(b-a)} = \dfrac{ab}{b^2-a^2}'
            note: "On remplace h et on développe (a+b)(b−a)=b²−a² au dénominateur."
          - math: 'b=\lambda i\,a \implies ab=\lambda i\,a^2, \qquad b^2-a^2 = -\lambda^2a^2-a^2 = -a^2(\lambda^2+1)'
            note: "On remplace b par λia (donné) ; (λi)²=−λ²."
          - math: '\dfrac{h}{b-a} = \dfrac{\lambda i\,a^2}{-a^2(\lambda^2+1)} = -\left(\dfrac{\lambda}{\lambda^2+1}\right)i'
            note: "Le facteur a² se simplifie (a≠0, racine de (E_α))."
          - math: '\dfrac{h}{b-a} = \dfrac{\text{aff}(\vec{OH})}{\text{aff}(\vec{AB})}\ \text{imaginaire pur (}\lambda\neq0\text{)} \implies (OH)\perp(AB)'
            note: "Comme au chapitre 7 : un rapport de deux affixes de vecteurs imaginaire pur signale des directions perpendiculaires."
      - id: q3b
        stem: |-
          **(0,5 pt)** Montrer que : $\dfrac{h-a}{b-a} = \dfrac{1}{\lambda^2+1}$ puis en déduire que les points $H$, $A$ et $B$ sont alignés.
        reasoning: |-
          Même stratégie : on exprime $h-a$ en fonction de $a$ et $b$, puis on divise par $b-a$ en réutilisant $b=\lambda i\,a$ et $b^2-a^2=-a^2(\lambda^2+1)$ déjà calculés à la question précédente. Le résultat est réel : par le chapitre 7, cela signale l'alignement de $H$, $A$, $B$.
        steps:
          - math: 'h-a = \dfrac{ab}{a+b}-a = \dfrac{ab-a(a+b)}{a+b} = \dfrac{-a^2}{a+b}'
            note: "On réutilise h=ab/(a+b) (question précédente)."
          - math: '\dfrac{h-a}{b-a} = \dfrac{-a^2}{(a+b)(b-a)} = \dfrac{-a^2}{b^2-a^2}'
            note: "Même dénominateur qu'à la question précédente."
          - math: '\dfrac{h-a}{b-a} = \dfrac{-a^2}{-a^2(\lambda^2+1)} = \dfrac{1}{\lambda^2+1}'
            note: "On réutilise b²−a²=−a²(λ²+1) (question précédente) ; le facteur a² se simplifie."
          - math: '\dfrac{1}{\lambda^2+1}\in\mathbb{R} \implies \dfrac{h-a}{b-a}\in\mathbb{R} \implies H,\,A,\,B\ \text{alignés}'
            note: "Chapitre R6 : rapport (des affixes de AH et AB) réel ⟺ alignement."
      - id: q4a
        part: "Soient $I(m)$ le milieu du segment $[OH]$ et $J(n)$ le milieu du segment $[HB]$"
        stem: |-
          **(0,5 pt)** Montrer que : $\dfrac{n}{m-a} = -\lambda i$
        reasoning: |-
          $I$ et $J$ sont deux milieux, donc $m=\dfrac{h}{2}$ et $n=\dfrac{h+b}{2}$. On exprime $n$ et $m-a$ en fonction de $a$ et $b$ en réutilisant $h=\dfrac{ab}{a+b}$ (question 3a), puis on simplifie : un facteur commun $(2a+b)$ apparaît au numérateur et au dénominateur et se simplifie, laissant $-\dfrac{b}{a}$ — exactement $-\lambda i$.
        steps:
          - math: 'm=\dfrac{h}{2}, \qquad n=\dfrac{h+b}{2}'
            note: "I milieu de [OH] (O est l'origine) ; J milieu de [HB]."
          - math: 'n = \dfrac{h+b}{2} = \dfrac{\frac{ab}{a+b}+b}{2} = \dfrac{b(2a+b)}{2(a+b)}, \qquad m-a = \dfrac{h-2a}{2} = \dfrac{\frac{ab}{a+b}-2a}{2} = \dfrac{-a(2a+b)}{2(a+b)}'
            note: "On réutilise h=ab/(a+b) (question 3a) et on met (2a+b) en facteur dans chaque numérateur."
          - math: '\dfrac{n}{m-a} = \dfrac{b(2a+b)}{-a(2a+b)} = -\dfrac{b}{a}'
            note: "Le facteur commun (2a+b)/[2(a+b)] se simplifie exactement."
          - math: '\dfrac{n}{m-a} = -\dfrac{b}{a} = -\lambda i'
            note: "b/a=λi (notation posée en tête de la partie II)."
      - id: q4b
        stem: |-
          **(0,5 pt)** En déduire que les droites $(OJ)$ et $(AI)$ sont perpendiculaires et que $OJ = |\lambda|\,AI$.
        reasoning: |-
          Même lecture qu'à la question 3a, cette fois sur le rapport $\dfrac{n}{m-a} = \dfrac{\text{aff}(\vec{OJ})}{\text{aff}(\vec{AI})}$ : imaginaire pur, donc les directions $(OJ)$ et $(AI)$ sont perpendiculaires (chapitre 7), et son module $|\lambda|$ donne le rapport des longueurs.
        steps:
          - math: '\dfrac{n}{m-a} = \dfrac{\text{aff}(\vec{OJ})}{\text{aff}(\vec{AI})} = -\lambda i\ \text{imaginaire pur} \implies (OJ)\perp(AI)'
            note: "Chapitre R6 : rapport imaginaire pur ⟹ directions perpendiculaires."
          - math: '\left|\dfrac{n}{m-a}\right| = |-\lambda i| = |\lambda| = \dfrac{OJ}{AI} \implies OJ = |\lambda|\,AI'
            note: "Chapitre R6 : le module donne le rapport des longueurs."
      - id: q4c
        stem: |-
          **(0,25 pt)** Soit $K$ le point d'intersection des droites $(OJ)$ et $(AI)$. Montrer que les points $K$, $I$, $H$ et $J$ sont cocycliques.
        reasoning: |-
          $K$ est, par construction, le point d'intersection des droites $(AI)$ et $(OJ)$ : donc $K$, $A$, $I$ sont alignés (même droite $(AI)$) et $K$, $O$, $J$ sont alignés (même droite $(OJ)$). Comme ces deux droites sont perpendiculaires (question précédente), l'angle $\widehat{IKJ}$ est droit — $K$ voit donc le segment $[IJ]$ sous un angle droit, ce qui, par le théorème de Thalès (le cercle de diamètre $[IJ]$ est exactement l'ensemble des points d'où l'on voit $[IJ]$ sous un angle droit), place $K$ sur le cercle de diamètre $[IJ]$.

          Il reste à montrer que $H$ y est aussi. Le rapport $\dfrac{m-h}{n-h}$ (chapitre 7, au sommet $H$) se calcule en réutilisant $m=\dfrac{h}{2}$, $n=\dfrac{h+b}{2}$ et $h=\dfrac{ab}{a+b}$ : tout se simplifie en $\dfrac{i}{\lambda}$, un imaginaire pur. L'angle $\widehat{IHJ}$ est donc, lui aussi, droit — $H$ est, par le même théorème de Thalès, sur le même cercle de diamètre $[IJ]$.

          $H$ et $K$ sont donc tous deux sur le cercle de diamètre $[IJ]$ : les quatre points $K$, $I$, $H$, $J$ sont cocycliques (sur ce cercle).
        steps:
          - math: 'K\in(AI) \implies K,\,A,\,I\ \text{alignés}; \qquad K\in(OJ) \implies K,\,O,\,J\ \text{alignés}'
            note: "K est le point d'intersection donné des deux droites."
          - math: '(AI)\perp(OJ)\ (\text{question 4b}) \implies \widehat{IKJ} = \dfrac{\pi}{2}'
            note: "Les côtés [KI) et [KJ) portent respectivement (AI) et (OJ)."
          - math: '\widehat{IKJ}=\dfrac{\pi}{2} \implies K\ \text{est sur le cercle de diamètre}\ [IJ]\quad(\text{théorème de Thalès})'
            note: "Réciproque de Thalès : angle droit inscrit ⟹ point sur le cercle de diamètre [IJ]."
          - math: 'm-h = \dfrac{h}{2}-h=-\dfrac{h}{2}, \qquad n-h = \dfrac{h+b}{2}-h = \dfrac{b-h}{2} = \dfrac{b^2}{2(a+b)}'
            note: "On réutilise m=h/2, n=(h+b)/2, et b−h=b²/(a+b) (même simplification qu'aux questions 3a-3b)."
          - math: '\dfrac{m-h}{n-h} = \dfrac{-h/2}{b^2/(2(a+b))} = \dfrac{-h(a+b)}{b^2} = \dfrac{-\frac{ab}{a+b}(a+b)}{b^2} = -\dfrac{a}{b}'
            note: "h=ab/(a+b) se simplifie avec (a+b)."
          - math: '-\dfrac{a}{b} = -\dfrac{1}{\lambda i} = \dfrac{i}{\lambda}\ \text{imaginaire pur (non nul)} \implies \widehat{IHJ}=\dfrac{\pi}{2}'
            note: "1/i=−i ; a/b=1/(λi) (b/a=λi)."
          - math: 'H\ \text{est aussi sur le cercle de diamètre}\ [IJ] \implies K,\,I,\,H,\,J\ \text{cocycliques}'
            note: "H et K sur le même cercle de diamètre [IJ] : les quatre points y sont tous."
      - id: q4d
        stem: |-
          **(0,25 pt)** Montrer que les droites $(IJ)$ et $(OA)$ sont perpendiculaires.
        reasoning: |-
          On compare directement les affixes des vecteurs $\vec{IJ}$ (affixe $n-m$) et $\vec{OA}$ (affixe $a$), par le même principe que partout dans cette partie (chapitre 7, rapport de deux affixes de vecteurs). Le calcul de $n-m$ est immédiat à partir des expressions déjà connues de $m$ et $n$.
        steps:
          - math: 'n-m = \dfrac{h+b}{2}-\dfrac{h}{2} = \dfrac{b}{2}'
            note: "Différence des deux milieux ; h se simplifie entièrement."
          - math: '\dfrac{n-m}{a} = \dfrac{b/2}{a} = \dfrac12\times\dfrac{b}{a} = \dfrac{\lambda}{2}\,i'
            note: "b/a=λi (notation de la partie II)."
          - math: '\dfrac{n-m}{a} = \dfrac{\text{aff}(\vec{IJ})}{\text{aff}(\vec{OA})}\ \text{imaginaire pur (}\lambda\neq0\text{)} \implies (IJ)\perp(OA)'
            note: "Chapitre R6 : rapport imaginaire pur ⟹ perpendicularité des directions."

