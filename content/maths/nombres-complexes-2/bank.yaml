            note: "Somme des racines (Viète, question 2b) ; on réutilise directement −mj² plutôt que m(1+j)."
          - math: 'm=1+i=\sqrt2\,e^{i\pi/4}, \qquad -j^2 = e^{i\pi}e^{i4\pi/3}=e^{i\frac{7\pi}{3}}=e^{i\pi/3}'
            note: "Formes exponentielles de m et de −j² (chapitres 2 à 3) ; 7π/3 − 2π = π/3."
