    intro: |-
      **Nombres complexes (examen national Sciences Mathématiques, session de rattrapage 2023, Exercice 2 — 3,5 points).**

      **Les parties I et II peuvent être traitées indépendamment.**

      **Partie I.** On considère dans $\left(\mathbb{R}_+\right)^2$ le système suivant :

      $$(S)\ :\ \begin{cases} \sqrt{x}\left(1 + \dfrac{1}{x+y}\right) = \dfrac{12}{5} \\[2mm] \sqrt{y}\left(1 - \dfrac{1}{x+y}\right) = \dfrac{4}{5} \end{cases}$$

      **Partie II.** Le plan complexe est rapporté à un repère orthonormé direct $\left(O;\vec{u},\vec{v}\right)$. Soit $(U)$ le cercle de centre $O$ et de rayon $1$, et $A(a)$, $B(b)$, $C(c)$ trois points du cercle $(U)$ deux à deux distincts.

      **Ce que fait cet exercice.** La partie I est un détour spectaculaire : un système de deux équations **réelles**, non linéaires, qu'on ne résout pas dans $\mathbb{R}$ — on pose $z = \sqrt{x} + i\sqrt{y}$, et les deux lignes deviennent la partie réelle et la partie imaginaire d'une **seule** égalité complexe, qui se ramène à une équation du second degré (chapitre 1, « Résoudre une équation du second degré dans $\mathbb{C}$ »). La partie II travaille sur le cercle unité, où une seule identité — $|z| = 1 \iff \overline{z} = \dfrac{1}{z}$, démontrée à la première question — transforme toute condition géométrique (parallélisme, perpendicularité) en identité algébrique sur $a$, $b$, $c$. Le fil conducteur reste celui du chapitre : un rapport de deux affixes de vecteurs encode une direction — réel pour des directions parallèles, imaginaire pur pour des directions perpendiculaires (chapitre 7).
    questions:
      - id: q1a
        part: 'Partie I — Le système $(S)$, remonté dans $\mathbb{C}$ par $z=\sqrt{x}+i\sqrt{y}$'
        stem: |-
          **(0,25 pt)** Soit $(x, y) \in \left(\mathbb{R}_+\right)^2$ une solution du système $(S)$. On pose : $z = \sqrt{x} + i\sqrt{y}$

          Montrer que : $z + \dfrac{1}{z} = \dfrac{12}{5} + \dfrac{4}{5}i$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Regarde les deux lignes de $(S)$ côte à côte avant de calculer quoi que ce soit : même structure, $\sqrt{\ \cdot\ }\left(1 \pm \dfrac{1}{x+y}\right)$, l'une avec un $+$, l'autre avec un $-$. Ce couple « $+$ / $-$ » est la signature d'un complexe et de son conjugué. Le geste consiste donc à fabriquer le nombre dont la partie réelle est la première ligne et la partie imaginaire la seconde — et l'énoncé nous dit lequel : $z + \dfrac{1}{z}$.

          Tout repose sur une ligne du chapitre 1 : $z\overline{z} = |z|^2$. Ici

          $$z\overline{z} = \left(\sqrt{x}\right)^2 + \left(\sqrt{y}\right)^2 = x+y$$

          — autrement dit, le dénominateur $x+y$ qui traîne dans les deux lignes du système **est** $|z|^2$. C'est ce qui rend l'idée du sujet possible.

          On calcule alors $\dfrac1z$ par la méthode du conjugué (chapitre 4 du chapitre 1) :

          $$\frac{1}{z} = \frac{\overline{z}}{z\overline{z}} = \frac{\sqrt{x} - i\sqrt{y}}{x+y}$$

