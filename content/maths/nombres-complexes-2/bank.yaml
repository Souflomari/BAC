          - math: 'p = \dfrac{(a-ib)(1+i)}{(1-i)(1+i)} = \dfrac{a+ai-ib+b}{2} = \dfrac{(a+b)+i(a-b)}{2}'
            note: "Méthode du conjugué (chapitre 1) : on multiplie par (1+i)/(1+i), avec (1−i)(1+i)=2."
          - math: '2p = (a+b)+i(a-b) = b+a+(a-b)i'
            note: "Résultat demandé pour p."
          - math: 'q = \dfrac{a-(-i)c}{1-(-i)} = \dfrac{a+ic}{1+i}'
            note: "Centre de la rotation d'angle −π/2 (e^{−iπ/2}=−i) envoyant C(c) sur A(a) : même formule, rung R5."
          - math: 'q = \dfrac{(a+ic)(1-i)}{(1+i)(1-i)} = \dfrac{a-ai+ic+c}{2} = \dfrac{(a+c)+i(c-a)}{2}'
