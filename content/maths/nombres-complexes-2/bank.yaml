        reasoning: |-
          Sous l'hypothèse de non-alignement, $z_1$ et $z_2$ sont tous deux non nuls (sinon un des deux points serait $O$ lui-même). On multiplie donc $\dfrac{z_1}{z_2}$ par $\dfrac{\overline{z_2}}{\overline{z_2}}$ (méthode du conjugué, chapitre 1) : le dénominateur devient le réel positif $|z_2|^2$, qui ne change ni le signe ni la nullité de la partie réelle du numérateur.
        steps:
