    intro: |-
      **Nombres complexes (examen national, session normale 2021, Sciences Mathématiques).**

      Soient $a$, $b$, $c$ trois nombres complexes **non nuls** tels que $a+b \neq c$.

      L'exercice se déroule en trois temps. La **première question** résout une équation du second degré déjà écrite sous la forme somme/produit de ses racines — pas besoin de discriminant, la factorisation se lit directement (relations coefficients-racines, Viète). La **deuxième** plante deux centres de rotation d'angle $\pm\dfrac{\pi}{2}$ ($P$, $Q$) autour du triangle $ABC$ et en tire la nature du triangle $PDQ$, $D$ étant le milieu de $[BC]$ — via le rapport de complexes du chapitre 7. La **troisième** construit deux symétriques et leur milieu $K$, pour aboutir à une cocyclicité de quatre points, obtenue ici par un argument de géométrie élémentaire (parallélogramme puis carré) plutôt qu'un nouvel outil.
    questions:
      - id: q1a
        stem: |-
          **(0,5 pt)** Résoudre dans $\mathbb{C}$ l'équation d'inconnue $z$ :
          $$(E)\ :\ z^2 - (a+b+c)z + c(a+b) = 0$$
        reasoning: |-
          Pas besoin de discriminant ici : l'équation est déjà écrite sous la forme somme/produit des deux racines qu'elle a. Si $z^2-(a+b+c)z+c(a+b)=0$ a pour racines $z'$ et $z''$, les relations coefficients-racines (Viète) donnent $z'+z''=a+b+c$ et $z'z''=c(a+b)$ — et deux nombres vérifient déjà l'un et l'autre : $c$ et $a+b$, dont la somme vaut $a+b+c$ et le produit $c(a+b)$. Il suffit donc de vérifier que $(z-c)\big(z-(a+b)\big)$ redéveloppe bien $(E)$, sans jamais calculer de discriminant. L'hypothèse $a+b\neq c$, donnée dès l'énoncé, garantit que ces deux racines sont bien distinctes.
        steps:
          - math: '(z-c)\big(z-(a+b)\big) = z^2 - \big(c+(a+b)\big)z + c(a+b) = z^2-(a+b+c)z+c(a+b)'
            note: "On développe le produit (z−c)(z−(a+b)) ; c+(a+b)=a+b+c."
          - math: '(z-c)\big(z-(a+b)\big) = 0 \iff z=c\ \text{ou}\ z=a+b'
            note: "Le développement redonne exactement (E) : c et a+b en sont les deux racines."
          - math: 'S = \{\,c,\ a+b\,\} \qquad (c\neq a+b,\ \text{racines distinctes, hypothèse donnée})'
            note: "Ensemble des solutions de (E)."
      - id: q1b
        part: "On suppose dans cette question que $a = i$, $b = e^{i\\frac{\\pi}{3}}$ et $c = a-b$"
        stem: |-
          **(0,5 pt)** Écrire les deux solutions de l'équation $(E)$ sous forme exponentielle.
        reasoning: |-
          Les deux solutions sont $c$ et $a+b$ (question précédente) : $a=i=e^{i\pi/2}$ et $b=e^{i\pi/3}$ sont déjà de module $1$, donc $a+b$ et $c=a-b$ sont une somme et une différence de deux exponentielles de même forme — on factorise chacune par l'angle moyen $\dfrac{\pi/2+\pi/3}{2}=\dfrac{5\pi}{12}$, exactement le même geste que $e^{i\theta}+1=2\cos(\theta/2)e^{i\theta/2}$ (déjà rencontré sur ce chapitre), mais entre deux exponentielles quelconques plutôt qu'avec $1$.
        steps:
          - math: 'a+b = e^{i\pi/2}+e^{i\pi/3} = e^{i\frac{5\pi}{12}}\left(e^{i\frac{\pi}{12}}+e^{-i\frac{\pi}{12}}\right) = 2\cos\tfrac{\pi}{12}\,e^{i\frac{5\pi}{12}}'
            note: "Angle moyen 5π/12=(π/2+π/3)/2, demi-écart π/12=(π/2−π/3)/2 ; e^{ix}+e^{−ix}=2cos x (chapitre 2)."
          - math: 'a-b = e^{i\pi/2}-e^{i\pi/3} = e^{i\frac{5\pi}{12}}\left(e^{i\frac{\pi}{12}}-e^{-i\frac{\pi}{12}}\right) = 2i\sin\tfrac{\pi}{12}\,e^{i\frac{5\pi}{12}} = 2\sin\tfrac{\pi}{12}\,e^{i\left(\frac{5\pi}{12}+\frac{\pi}{2}\right)}'
            note: "e^{ix}−e^{−ix}=2i sin x ; on absorbe le facteur i=e^{iπ/2} dans l'argument."
          - math: '\cos\tfrac{\pi}{12}=\tfrac{\sqrt6+\sqrt2}{4}>0, \qquad \sin\tfrac{\pi}{12}=\tfrac{\sqrt6-\sqrt2}{4}>0'
            note: "Valeurs usuelles (formules d'addition, acquis de 1ère) ; toutes deux positives, donc les modules ci-dessus le sont bien."
          - math: 'a+b = \dfrac{\sqrt6+\sqrt2}{2}\,e^{i\frac{5\pi}{12}}, \qquad c=a-b=\dfrac{\sqrt6-\sqrt2}{2}\,e^{i\left(\frac{5\pi}{12}+\frac{\pi}{2}\right)}=\dfrac{\sqrt6-\sqrt2}{2}\,e^{i\frac{11\pi}{12}}'
            note: "5π/12+π/2=5π/12+6π/12=11π/12."
          - math: 'S = \left\{\, \dfrac{\sqrt6-\sqrt2}{2}\,e^{i\frac{11\pi}{12}},\ \ \dfrac{\sqrt6+\sqrt2}{2}\,e^{i\frac{5\pi}{12}} \,\right\}'
            note: "Les deux solutions de (E), c puis a+b, sous forme exponentielle."
      - id: q2a
        part: "Le plan complexe $(O,\\vec{u},\\vec{v})$ : $A(a)$, $B(b)$, $C(c)$ non alignés ; $P(p)$ centre de la rotation d'angle $\\dfrac{\\pi}{2}$ qui transforme $B$ en $A$, $Q(q)$ centre de la rotation d'angle $\\left(-\\dfrac{\\pi}{2}\\right)$ qui transforme $C$ en $A$, $D(d)$ milieu de $[BC]$"
        stem: |-
          **(1 pt)** Montrer que : $2p = b+a+(a-b)i$ et $2q = c+a+(c-a)i$.
        reasoning: |-
          Chaque centre se retrouve avec la formule décentrée du chapitre 6, résolue en l'inconnue « centre » : si $M'(z')$ est l'image de $M(z)$ par la rotation de centre $\Omega(\omega)$ et d'angle $\theta$, alors $z'-\omega=e^{i\theta}(z-\omega)$, ce qui se résout en $\omega=\dfrac{z'-e^{i\theta}z}{1-e^{i\theta}}$ — déjà utilisé au sujet 2020 de cette notion pour construire trois centres de rotation d'angle $\dfrac{\pi}{2}$ de la même façon.

          Pour $P$ : la rotation d'angle $\dfrac{\pi}{2}$ ($e^{i\pi/2}=i$) transforme $B$ en $A$, donc $z=b$, $z'=a$. Pour $Q$ : la rotation d'angle $-\dfrac{\pi}{2}$ ($e^{-i\pi/2}=-i$) transforme $C$ en $A$, donc $z=c$, $z'=a$. Il reste à simplifier chaque quotient par la méthode du conjugué (chapitre 1).
        steps:
