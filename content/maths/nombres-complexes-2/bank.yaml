        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** « $(AP)$ parallèle à $(BC)$ » est une information sur des **directions**, et une direction se lit sur un rapport d'affixes de vecteurs : $\dfrac{p-a}{c-b}$ est le rapport de l'affixe de $\vec{AP}$ à celle de $\vec{BC}$. Deux directions parallèles $\iff$ ce rapport est **réel** — c'est la lecture du chapitre 7, ici entre deux vecteurs qui ne partent pas du même point.

          Reste à rendre ce « réel » calculable. Le chapitre 1 le fait en une ligne : un nombre est réel si et seulement s'il est **égal à son propre conjugué**. Et c'est là que la question 1 sert : $a$, $b$, $c$, $p$ sont tous sur le cercle unité, donc conjuguer, pour eux, c'est **prendre l'inverse**. Conjuguer le rapport revient donc à remplacer chaque lettre par son inverse — un calcul purement algébrique.

          $$\overline{\left(\frac{p-a}{c-b}\right)} = \frac{\dfrac1p-\dfrac1a}{\dfrac1c-\dfrac1b} = \frac{\dfrac{a-p}{ap}}{\dfrac{b-c}{bc}} = \frac{(a-p)\,bc}{ap\,(b-c)} = \frac{(p-a)\,bc}{ap\,(c-b)}$$

          (au dernier passage, on a changé le signe **du numérateur et du dénominateur** : le rapport ne bouge pas.)

          L'égalité « rapport $=$ son conjugué » s'écrit donc

          $$\frac{p-a}{c-b} = \frac{p-a}{c-b}\cdot\frac{bc}{ap}$$

          Le facteur $\dfrac{p-a}{c-b}$ est non nul, car $P \neq A$ : la droite considérée coupe le cercle en **deux** points, $A$ et $P$. On simplifie donc par lui :

          $$\frac{bc}{ap} = 1 \implies ap = bc \implies p = \frac{bc}{a}$$

          la dernière division étant licite puisque $|a|=1$, donc $a \neq 0$.

          **Le piège à éviter.** Simplifier par $\dfrac{p-a}{c-b}$ sans un mot. C'est une division par une quantité dont il faut dire pourquoi elle n'est pas nulle — et la raison n'est pas dans les hypothèses « $A$, $B$, $C$ deux à deux distincts », elle est dans le mot « **coupe** » de l'énoncé, qui donne $P \neq A$. *(À la marge, pour la curiosité : si $a^2 = bc$, la parallèle à $(BC)$ menée par $A$ est tangente au cercle en $A$ et ne le « coupe » plus qu'en un point — la formule $p = \frac{bc}{a}$ donne alors $p = a$, ce qui reste cohérent, mais on sort du cadre décrit par l'énoncé.)*
