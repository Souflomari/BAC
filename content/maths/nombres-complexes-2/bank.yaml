          **(0,25 pt)** En déduire que $\dfrac{z_1}{z_2}$ est un imaginaire pur si et seulement si $|z_1 - z_2| = 2$.
        reasoning: |-
          La partie I (question 2) donne déjà $z_1+z_2=2i$, donc $|z_1+z_2|=2$ : une valeur numérique fixe, indépendante d'$\alpha$. En reportant dans l'identité de la question précédente puis en enchaînant avec l'équivalence de la question (a), la chaîne se referme directement sur $|z_1-z_2|=2$.
        steps:
