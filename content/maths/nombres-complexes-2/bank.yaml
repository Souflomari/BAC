    intro: |-
      **Nombres complexes (examen national, session normale 2022, Sciences Mathématiques).**

      Soit $m$ un nombre complexe non nul donné et $j = -\dfrac12 + \dfrac{\sqrt3}{2}\,i = e^{i\frac{2\pi}{3}}$.

      La **partie I** résout une équation du second degré dont les coefficients utilisent $j$, puis étudie une puissance élevée de la somme des racines. La **partie II** construit, à partir d'une transformation $\varphi$ du plan et de trois milieux $P$, $Q$, $R$, une relation caractéristique qui, relue à travers le rung R6, prouve que le triangle $PQR$ est équilatéral.
    questions:
      - id: q1
        part: "Partie I — L'équation $(E_m)\\ :\\ z^2 + mj^2 z + m^2 j = 0$"
        stem: |-
          **(0,5 pt)** Vérifier que : $j^3 = 1$ et $1 + j + j^2 = 0$.
        reasoning: |-
          $j=e^{i2\pi/3}$ est exactement l'une des racines cubiques de l'unité construites au rung R4 ($n=3$, $k=1$) : $j^3$ s'obtient directement par la formule de Moivre (R3). Pour la somme $1+j+j^2$, le plus direct est de repasser $j$ et $j^2$ en forme algébrique et d'additionner : les parties imaginaires s'annulent deux à deux.
        steps:
          - math: 'j^3 = \left(e^{i2\pi/3}\right)^3 = e^{i2\pi} = 1'
            note: "Formule de Moivre (R3) : (e^{iθ})^n=e^{inθ}."
          - math: 'j^2 = e^{i4\pi/3} = -\tfrac12-\tfrac{\sqrt3}{2}i'
            note: "Carré de j, en forme algébrique."
          - math: '1+j+j^2 = 1+\left(-\tfrac12+\tfrac{\sqrt3}{2}i\right)+\left(-\tfrac12-\tfrac{\sqrt3}{2}i\right) = 0'
            note: "Les parties imaginaires s'annulent deux à deux ; il reste 1−½−½=0."
      - id: q2a
        stem: |-
          **(0,25 pt)** Montrer que le discriminant de l'équation $(E_m)$ est : $\Delta = \big(m(1-j)\big)^2$.
        reasoning: |-
          Même geste qu'au sujet 2019 (r-bac) de cette notion : calculer $\Delta = b^2-4ac$, puis reconnaître un carré parfait dans le résultat. Ici $j^4$ se ramène à $j$ via $j^3=1$ (question 1), et $(1-j)^2$ se simplifie via $1+j+j^2=0$ (même question).
        steps:
          - math: '\Delta = (mj^2)^2-4\times1\times m^2j = m^2j^4-4m^2j'
            note: "Δ=b²−4ac, avec a=1, b=mj², c=m²j."
          - math: 'j^4=j^3\times j=j \implies \Delta = m^2(j-4j) = -3m^2j'
            note: "j³=1 (question 1) donne j⁴=j."
          - math: '(1-j)^2 = 1-2j+j^2 = (1+j^2)-2j = -j-2j=-3j'
            note: "1+j+j²=0 (question 1) donne 1+j²=−j."
          - math: '\big(m(1-j)\big)^2 = m^2(1-j)^2 = m^2(-3j) = -3m^2j = \Delta'
            note: "Les deux expressions coïncident."
      - id: q2b
        stem: |-
          **(0,5 pt)** Déterminer $z_1$ et $z_2$ les deux solutions de l'équation $(E_m)$.
        reasoning: |-
          $\Delta$ est déjà un carré (question précédente) : $\delta = m(1-j)$ en est une racine, et la formule $\dfrac{-b\pm\delta}{2a}$ donne les deux racines. Il faut ensuite simplifier chaque numérateur — encore une fois avec l'identité $1+j+j^2=0$, réécrite sous deux formes utiles ($j+j^2=-1$, puis $j^2=-1-j$).
        steps:
          - math: 'z = \dfrac{-mj^2 \pm m(1-j)}{2}'
            note: "Formule (−b±δ)/(2a), avec −b=−mj², δ=m(1−j) (question 2a)."
          - math: 'z_1 = \dfrac{m(1-j-j^2)}{2}; \quad j+j^2=-1 \implies 1-j-j^2 = 1-(-1) = 2 \implies z_1=m'
            note: "On réutilise 1+j+j²=0, donc j+j²=−1."
          - math: 'z_2 = \dfrac{m(j-1-j^2)}{2}; \quad j^2=-1-j \implies j-1-j^2 = j-1-(-1-j)=2j \implies z_2=mj'
            note: "Même identité, réinjectée pour isoler j²."
          - math: 'z_1=m, \qquad z_2=mj \qquad (\text{contrôle : } z_1+z_2=m(1+j)=-mj^2\ \checkmark,\ z_1z_2=m^2j\ \checkmark)'
            note: "Vérification par les relations coefficients-racines (Viète) sur (E_m)."
      - id: q3
        stem: |-
          **(0,5 pt)** Dans cette question, on suppose que $m = 1 + i$. Montrer que $(z_1 + z_2)^{2022}$ est un imaginaire pur.
        reasoning: |-
          On repart de $z_1+z_2=-mj^2$ (Viète, question précédente) et on met chaque facteur sous forme exponentielle pour appliquer la règle du produit (R2), puis Moivre (R3) pour la puissance $2022$-ième. Le seul point délicat est de réduire un angle multiplié par $2022$ : on travaille en unités de $\dfrac{\pi}{12}$ et on réduit l'entier modulo $24$ (un tour complet), plutôt que de manipuler un angle énorme.
        steps:
          - math: 'z_1+z_2 = m(1+j) = -mj^2'
            note: "Somme des racines (Viète, question 2b) ; on réutilise directement −mj² plutôt que m(1+j)."
          - math: 'm=1+i=\sqrt2\,e^{i\pi/4}, \qquad -j^2 = e^{i\pi}e^{i4\pi/3}=e^{i\frac{7\pi}{3}}=e^{i\pi/3}'
            note: "Formes exponentielles de m et de −j² (R1–R2) ; 7π/3 − 2π = π/3."
          - math: 'z_1+z_2 = \sqrt2\,e^{i\pi/4}\times e^{i\pi/3} = \sqrt2\,e^{i\frac{7\pi}{12}}'
            note: "Produit : modules × modules, arguments + arguments (R2). π/4+π/3=7π/12."
          - math: '(z_1+z_2)^{2022} = \big(\sqrt2\big)^{2022}\,e^{i\times2022\times\frac{7\pi}{12}}'
            note: "Moivre (R3) : module puissance 2022, argument multiplié par 2022."
          - math: '2022\times7 = 14154 \equiv 18\ [24] \implies 2022\times\dfrac{7\pi}{12} \equiv \dfrac{18\pi}{12} = \dfrac{3\pi}{2}\ [2\pi]'
            note: "24 unités de π/12 = un tour complet ; on réduit 14154 modulo 24 plutôt que de garder l'angle brut."
          - math: '(z_1+z_2)^{2022} = \big(\sqrt2\big)^{2022}e^{i\,3\pi/2}, \qquad e^{i3\pi/2}=-i'
            note: "Argument 3π/2 : c'est un imaginaire pur (axe imaginaire, direction −i)."
      - id: q4
        part: "Partie II — La transformation $\\varphi$ : $M(z)\\mapsto M'(z')$ avec $z' = (1+j)z$"
        stem: |-
          **(0,25 pt)** Déterminer la nature et les éléments caractéristiques de l'application $\varphi$.
        reasoning: |-
          $\varphi$ a la forme $z\mapsto cz$ étudiée au rung R5, avec $c=1+j$. On calcule $c$ en forme exponentielle : sa partie réelle et sa partie imaginaire sont exactement $\cos\dfrac{\pi}{3}$ et $\sin\dfrac{\pi}{3}$, donc $c=e^{i\pi/3}$, de module $1$. Un module $1$ signifie qu'il n'y a aucune homothétie (R5) : $\varphi$ est une rotation pure.
        steps:
          - math: '1+j = 1+\left(-\tfrac12+\tfrac{\sqrt3}{2}i\right) = \tfrac12+\tfrac{\sqrt3}{2}i = e^{i\pi/3}'
            note: "Forme exponentielle de 1+j : module 1, argument π/3."
          - math: '|1+j|=1, \quad \arg(1+j)=\dfrac{\pi}{3}'
            note: "Module 1 : pas d'homothétie (rung R5)."
          - math: '\varphi\ \text{est la rotation de centre}\ O\ \text{et pour angle}\ \dfrac{\pi}{3}'
            note: "z′=cz avec |c|=1 : rotation pure, de centre O (z=0 fixe) et d'angle arg(c)=π/3 (R5)."
      - id: q5
        stem: |-
          **(0,75 pt)** On considère les points $A$, $B$ et $C$ d'affixes respectives $m$, $mj$ et $mj^2$, et $A'(a')$, $B'(b')$, $C'(c')$ leurs images par $\varphi$. Montrer que : $a' = -mj^2$, $b' = -m$ et $c' = -mj$.
        reasoning: |-
          Il suffit d'appliquer $\varphi$ (question précédente) à chacun des trois points, en remplaçant systématiquement $1+j$ par $-j^2$ (l'identité $1+j+j^2=0$, question 1, réécrite) : cela fait apparaître des puissances de $j$ supérieures à $2$, qu'on ramène ensuite avec $j^3=1$.
        steps:
          - math: '1+j=-j^2'
            note: "Réécriture de 1+j+j²=0 (question 1)."
          - math: 'a''=(1+j)m=-mj^2'
            note: "φ(A) : on remplace 1+j par −j²."
          - math: 'b''=(1+j)(mj)=-mj^3=-m'
            note: "φ(B) ; j³=1 (question 1)."
          - math: 'c''=(1+j)(mj^2)=-mj^4=-mj'
            note: "φ(C) ; j⁴=j³×j=j."
      - id: q6
        stem: |-
          **(0,25 pt)** Soient $P(p)$, $Q(q)$ et $R(r)$ les milieux respectifs de $[BA']$, $[CB']$ et $[AC']$. Montrer que : $p + qj + rj^2 = 0$.
        reasoning: |-
          Chaque milieu s'écrit comme la moyenne des deux affixes qui le définissent, en réutilisant $a'$, $b'$, $c'$ de la question précédente. En multipliant $q$ par $j$ et $r$ par $j^2$ (et en simplifiant avec $j^3=1$), les six termes de la somme $p+qj+rj^2$ s'annulent exactement deux à deux — un télescopage complet.
        steps:
          - math: 'p=\dfrac{b+a''}{2}=\dfrac{m(j-j^2)}{2}, \quad q=\dfrac{c+b''}{2}=\dfrac{m(j^2-1)}{2}, \quad r=\dfrac{a+c''}{2}=\dfrac{m(1-j)}{2}'
            note: "Milieux = moyennes des affixes ; on réutilise a′, b′, c′ (question 2a de la partie II)."
          - math: 'qj = \dfrac{m(j^3-j)}{2} = \dfrac{m(1-j)}{2}, \qquad rj^2 = \dfrac{m(j^2-j^3)}{2} = \dfrac{m(j^2-1)}{2}'
            note: "On multiplie q par j et r par j², en utilisant j³=1."
          - math: 'p+qj+rj^2 = \dfrac{m}{2}\Big[(j-j^2)+(1-j)+(j^2-1)\Big] = \dfrac{m}{2}\times 0 = 0'
            note: "Les six termes s'annulent deux à deux (télescopage)."
      - id: q7
