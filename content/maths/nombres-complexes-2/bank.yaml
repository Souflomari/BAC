          Le nombre obtenu, $\dfrac{1+\sqrt3}{2}$, ne ressemble pas de prime abord à $\sqrt2\sin\!\left(\dfrac{7\pi}{12}\right)$ : c'est le signal qu'il faut vérifier l'identité via la formule d'addition du sinus plutôt que de la considérer comme acquise.
        steps:
          - math: 'q = \dfrac{b-ia}{1-i}'
            note: "Même formule que pour P, R (rung R5), appliquée à Q : A → B, donc (z,z′)=(a,b)."
          - math: 'a = m\left(\tfrac12+i\tfrac{\sqrt3}{2}\right),\ b = m\left(\tfrac12-i\tfrac{\sqrt3}{2}\right) \implies b-ia = m\,\dfrac{1+\sqrt3}{2}\,(1-i)'
            note: "On repasse en forme algébrique (e^{±iπ/3}=½±i√3/2) pour développer b−ia ; le résultat se factorise par (1−i)."
          - math: 'q = \dfrac{m\,\frac{1+\sqrt3}{2}(1-i)}{1-i} = m\,\dfrac{1+\sqrt3}{2}'
            note: "Le facteur (1−i) se simplifie : q est un multiple réel de m."
          - math: '\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right) = \sqrt2\,\sin\!\left(\dfrac{\pi}{3}+\dfrac{\pi}{4}\right) = \sqrt2\left(\sin\tfrac{\pi}{3}\cos\tfrac{\pi}{4}+\cos\tfrac{\pi}{3}\sin\tfrac{\pi}{4}\right) = \dfrac{1+\sqrt3}{2}'
            note: "Formule d'addition du sinus : on vérifie que ce nombre est bien celui annoncé."
          - math: 'q = m\,\dfrac{1+\sqrt3}{2} = m\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right)'
            note: "Les deux écritures coïncident."
      - id: q5
        stem: |-
          **(0,5 pt)** Montrer que $OQ = PR$ et que les deux droites $(OQ)$ et $(PR)$ sont perpendiculaires.
        reasoning: |-
          On calcule $r-p$, l'affixe du vecteur $\vec{PR}$, en factorisant par $m\dfrac{\sqrt2}{2}$ : la différence de deux exponentielles opposées se réduit à un sinus (comme $e^{i\alpha}-e^{-i\alpha}=2i\sin\alpha$, au signe près). Le nombre $\sqrt2\sin\!\left(\dfrac{7\pi}{12}\right)$ vient d'être calculé à la question précédente — pas besoin de le refaire.

          Le rapport $\dfrac{r-p}{q}$ (rung R6) encode alors, en un seul calcul, les deux faits demandés : son module donne l'égalité des longueurs, son argument donne la perpendicularité.
        steps:
