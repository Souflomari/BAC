          - math: '|z_1-z_2|^2 = 4-4\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)'
            note: "On reporte dans l'identité de la question précédente."
          - math: '\dfrac{z_1}{z_2}\ \text{imaginaire pur} \iff \mathrm{Re}\!\left(z_1\overline{z_2}\right)=0 \iff |z_1-z_2|^2=4 \iff |z_1-z_2|=2'
            note: "On enchaîne avec l'équivalence de la question (a) ; le module est positif, donc |z1−z2|²=4 équivaut à |z1−z2|=2."
      - id: q5a
        part: "Partie II (fin) — retour au cas général de $(E_\\alpha)$"
        stem: |-
          **(0,25 pt)** Montrer que : $(z_1 - z_2)^2 = \Delta$.
        reasoning: |-
          Identité algébrique valable pour n'importe quels complexes $z_1,z_2$ : $(z_1-z_2)^2=(z_1+z_2)^2-4z_1z_2$. Il suffit d'y injecter la somme et le produit trouvés en partie I, question 2.
        steps:
          - math: '(z_1-z_2)^2 = (z_1+z_2)^2-4z_1z_2'
            note: "Identité algébrique (z1−z2)²=(z1+z2)²−4z1z2, valable pour tous complexes."
          - math: '(z_1-z_2)^2 = (2i)^2-4\alpha = -4-4\alpha'
            note: "On remplace par les valeurs de la Partie I, question 2."
