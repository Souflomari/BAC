          Chaque centre se retrouve avec la formule décentrée du rung R5, résolue en l'inconnue « centre » : si $M'(z')$ est l'image de $M(z)$ par la rotation de centre $\Omega(\omega)$ et d'angle $\theta$, alors $z'-\omega=e^{i\theta}(z-\omega)$, ce qui se résout en $\omega=\dfrac{z'-e^{i\theta}z}{1-e^{i\theta}}$ — déjà utilisé au sujet 2020 de cette notion pour construire trois centres de rotation d'angle $\dfrac{\pi}{2}$ de la même façon.

          Pour $P$ : la rotation d'angle $\dfrac{\pi}{2}$ ($e^{i\pi/2}=i$) transforme $B$ en $A$, donc $z=b$, $z'=a$. Pour $Q$ : la rotation d'angle $-\dfrac{\pi}{2}$ ($e^{-i\pi/2}=-i$) transforme $C$ en $A$, donc $z=c$, $z'=a$. Il reste à simplifier chaque quotient par la méthode du conjugué (chapitre 1).
        steps:
          - math: 'p = \dfrac{a-ib}{1-i}'
