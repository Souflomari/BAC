    intro: |-
      **Nombres complexes (examen national, session normale 2024, Sciences Mathématiques).**

      Le plan complexe est rapporté à un repère orthonormé direct $(O,\vec u,\vec v)$. On considère dans $\mathbb{C}$ l'équation d'inconnue $z$ :

      $$(E_\alpha)\ :\ z^2 - 2iz + \alpha = 0 \qquad \text{où } \alpha \in \mathbb{C}$$

      La **partie I** étudie $(E_\alpha)$ en général : discriminant, condition de deux solutions distinctes, somme et produit des racines. La **partie II** place $\Omega(\alpha)$, $M_1(z_1)$ et $M_2(z_2)$ dans le plan et cherche, pour finir, l'ensemble des $\alpha$ qui rendent le triangle $OM_1M_2$ rectangle en $O$ — une synthèse qui réutilise chaque résultat de la partie précédente.
    questions:
      - id: q1a
        part: "Partie I — L'équation $(E_\\alpha)\\ :\\ z^2 - 2iz + \\alpha = 0$"
        stem: |-
          **(0,25 pt)** Montrer que le discriminant de l'équation $(E_\alpha)$ est $\Delta = -4(1 + \alpha)$.
        reasoning: |-
          Application directe de $\Delta=b^2-4ac$, avec $b=-2i$ (donc $b^2=-4$) — aucun geste caché ici, juste factoriser par $-4$ à la fin pour retrouver la forme demandée.
        steps:
          - math: '\Delta = (-2i)^2-4\times1\times\alpha = -4-4\alpha'
            note: "Δ=b²−4ac, avec a=1, b=−2i, c=α."
          - math: '\Delta = -4(1+\alpha)'
            note: "On factorise par −4."
      - id: q1b
        stem: |-
          **(0,25 pt)** Déterminer l'ensemble des valeurs $\alpha$ pour lesquelles l'équation $(E_\alpha)$ admette dans l'ensemble $\mathbb{C}$ deux solutions distinctes.
        reasoning: |-
          Dans $\mathbb{C}$, à la différence de $\mathbb{R}$, tout nombre non nul a exactement deux racines carrées distinctes (rung R4, $n=2$) : une équation du second degré a donc deux solutions distinctes **dès que** $\Delta\neq0$ — pas besoin de discuter le signe de $\Delta$ comme dans $\mathbb{R}$. Si $\Delta=0$, en revanche, la racine est double.
        steps:
          - math: '(E_\alpha)\ \text{a deux solutions distinctes} \iff \Delta\neq0'
            note: "Dans ℂ, tout nombre non nul a exactement deux racines carrées distinctes (rung R4, n=2) ; Δ=0 donnerait une racine double."
          - math: '\Delta\neq0 \iff -4(1+\alpha)\neq0 \iff \alpha\neq -1'
            note: "On résout l'inéquation."
          - math: '\alpha \in \mathbb{C}-\{-1\}'
            note: "Ensemble cherché : tout le plan complexe, sauf le point −1."
      - id: q2
        stem: |-
          **(0,5 pt)** On note $z_1$ et $z_2$ les deux solutions de l'équation $(E_\alpha)$. Déterminer $z_1 + z_2$ et $z_1 z_2$.
        reasoning: |-
          Les relations coefficients-racines (Viète) lisent directement la somme et le produit sur les coefficients de $(E_\alpha)$, sans avoir besoin de calculer $z_1$ et $z_2$ individuellement.
        steps:
          - math: 'z_1+z_2 = -\dfrac{b}{a} = 2i'
            note: "Relations coefficients-racines (Viète), somme."
          - math: 'z_1z_2 = \dfrac{c}{a} = \alpha'
            note: "Viète, produit."
      - id: q3a
        part: "Partie II — $\\Omega(\\alpha)$, $M_1(z_1)$, $M_2(z_2)$ ; on suppose $\\alpha = m^2-2m$ avec $m\\in\\mathbb{R}$"
        stem: |-
          **(0,5 pt)** Déterminer $z_1$ et $z_2$ en fonction de $m$.
        reasoning: |-
          On remplace $\alpha$ par $m^2-2m$ dans $\Delta=-4(1+\alpha)$ : l'expression $1+m^2-2m$ est l'identité remarquable $(m-1)^2$, donc $\Delta$ se réduit à un carré parfait — encore le même geste qu'aux questions précédentes de cette notion, avec $2i(m-1)$ comme racine carrée.
        steps:
          - math: '\Delta = -4(1+\alpha) = -4\big(1+m^2-2m\big) = -4(m-1)^2 = \big[2i(m-1)\big]^2'
            note: "On remplace α ; 1+m²−2m=(m−1)² (identité remarquable) ; −4 fois un carré réel est le carré de 2i fois ce réel."
          - math: 'z = \dfrac{2i \pm 2i(m-1)}{2} = i\big[1\pm(m-1)\big]'
            note: "Formule (−b±δ)/(2a), avec −b=2i, δ=2i(m−1)."
          - math: 'z_1 = i\big[1+(m-1)\big] = im, \qquad z_2 = i\big[1-(m-1)\big] = i(2-m)'
            note: "On développe les deux crochets."
      - id: q3b
        stem: |-
          **(0,25 pt)** En déduire que les points $O$, $M_1$ et $M_2$ sont alignés.
        reasoning: |-
          $z_1=im$ et $z_2=i(2-m)$ sont tous deux des multiples réels de $i$ (puisque $m$ et $2-m$ sont réels) : les deux points $M_1$ et $M_2$ sont donc sur l'axe imaginaire — la droite qui passe justement par $O$. Trois points sur une même droite : alignés.
        steps:
          - math: 'z_1=im,\ z_2=i(2-m),\quad m,\ 2-m \in \mathbb{R}'
            note: "Les deux affixes sont des multiples réels de i."
          - math: 'M_1,\ M_2 \in (O; \vec{v}) \ \text{(axe des imaginaires purs, passant par O)}'
            note: "Un multiple réel de i place le point sur l'axe imaginaire."
          - math: 'O,\ M_1,\ M_2\ \text{alignés}'
            note: "Trois points portés par la même droite (l'axe imaginaire) sont alignés."
      - id: q4a
        part: "Partie II (suite) — on suppose désormais que $O$, $M_1$, $M_2$ ne sont pas alignés"
        stem: |-
          **(0,25 pt)** Montrer que $\dfrac{z_1}{z_2}$ est un imaginaire pur si et seulement si $\mathrm{Re}\!\left(z_1\overline{z_2}\right) = 0$.
        reasoning: |-
          Sous l'hypothèse de non-alignement, $z_1$ et $z_2$ sont tous deux non nuls (sinon un des deux points serait $O$ lui-même). On multiplie donc $\dfrac{z_1}{z_2}$ par $\dfrac{\overline{z_2}}{\overline{z_2}}$ (méthode du conjugué, chapitre 1) : le dénominateur devient le réel positif $|z_2|^2$, qui ne change ni le signe ni la nullité de la partie réelle du numérateur.
        steps:
          - math: '\dfrac{z_1}{z_2} = \dfrac{z_1\overline{z_2}}{z_2\overline{z_2}} = \dfrac{z_1\overline{z_2}}{|z_2|^2}'
            note: "On multiplie par le conjugué (méthode du chapitre 1) ; z2 ≠ 0 car sinon M2=O, contredisant l'hypothèse."
          - math: '\mathrm{Re}\!\left(\dfrac{z_1}{z_2}\right) = \dfrac{\mathrm{Re}\!\left(z_1\overline{z_2}\right)}{|z_2|^2}'
            note: "Diviser par le réel strictement positif |z2|² ne change pas le signe ni la nullité de la partie réelle."
          - math: '\dfrac{z_1}{z_2}\ \text{imaginaire pur} \iff \mathrm{Re}\!\left(\dfrac{z_1}{z_2}\right)=0 \iff \mathrm{Re}\!\left(z_1\overline{z_2}\right)=0'
            note: "|z2|² > 0 : le quotient est nul exactement quand le numérateur l'est."
      - id: q4b
        stem: |-
          **(0,5 pt)** Montrer que : $|z_1 - z_2|^2 = |z_1 + z_2|^2 - 4\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)$.
        reasoning: |-
          On développe $|z_1-z_2|^2$ et $|z_1+z_2|^2$ avec l'outil $|Z|^2=Z\overline Z$ (chapitre 1) : les deux développements ne diffèrent que par le signe du double produit croisé, qui vaut $\pm2\,\mathrm{Re}(z_1\overline{z_2})$. En combinant les deux identités, on élimine $|z_1|^2+|z_2|^2$ pour arriver directement à la relation demandée.
        steps:
          - math: '|z_1-z_2|^2 = (z_1-z_2)\overline{(z_1-z_2)} = |z_1|^2+|z_2|^2-2\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)'
            note: "On développe avec |Z|²=Z z̄ (chapitre 1) ; le double produit croisé se regroupe en 2Re(z1 z2 barre)."
          - math: '|z_1+z_2|^2 = (z_1+z_2)\overline{(z_1+z_2)} = |z_1|^2+|z_2|^2+2\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)'
            note: "Même développement, avec le signe + cette fois."
          - math: '|z_1|^2+|z_2|^2 = |z_1+z_2|^2-2\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)'
            note: "On isole |z1|²+|z2|² dans la deuxième identité."
          - math: '|z_1-z_2|^2 = \Big[|z_1+z_2|^2-2\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)\Big]-2\,\mathrm{Re}\!\left(z_1\overline{z_2}\right) = |z_1+z_2|^2-4\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)'
            note: "On reporte dans la première identité."
      - id: q4c
        stem: |-
          **(0,25 pt)** En déduire que $\dfrac{z_1}{z_2}$ est un imaginaire pur si et seulement si $|z_1 - z_2| = 2$.
        reasoning: |-
          La partie I (question 2) donne déjà $z_1+z_2=2i$, donc $|z_1+z_2|=2$ : une valeur numérique fixe, indépendante d'$\alpha$. En reportant dans l'identité de la question précédente puis en enchaînant avec l'équivalence de la question (a), la chaîne se referme directement sur $|z_1-z_2|=2$.
        steps:
          - math: 'z_1+z_2=2i \ (\text{Partie I}) \implies |z_1+z_2| = 2 \implies |z_1+z_2|^2=4'
            note: "Valeur déjà connue (Partie I, question 2)."
          - math: '|z_1-z_2|^2 = 4-4\,\mathrm{Re}\!\left(z_1\overline{z_2}\right)'
            note: "On reporte dans l'identité de la question précédente."
          - math: '\dfrac{z_1}{z_2}\ \text{imaginaire pur} \iff \mathrm{Re}\!\left(z_1\overline{z_2}\right)=0 \iff |z_1-z_2|^2=4 \iff |z_1-z_2|=2'
            note: "On enchaîne avec l'équivalence de la question (a) ; le module est positif, donc |z1−z2|²=4 équivaut à |z1−z2|=2."
      - id: q5a
        part: "Partie II (fin) — retour au cas général de $(E_\\alpha)$"
        stem: |-
          **(0,25 pt)** Montrer que : $(z_1 - z_2)^2 = \Delta$.
        reasoning: |-
          Identité algébrique valable pour n'importe quels complexes $z_1,z_2$ : $(z_1-z_2)^2=(z_1+z_2)^2-4z_1z_2$. Il suffit d'y injecter la somme et le produit trouvés en partie I, question 2.
        steps:
          - math: '(z_1-z_2)^2 = (z_1+z_2)^2-4z_1z_2'
            note: "Identité algébrique (z1−z2)²=(z1+z2)²−4z1z2, valable pour tous complexes."
          - math: '(z_1-z_2)^2 = (2i)^2-4\alpha = -4-4\alpha'
            note: "On remplace par les valeurs de la Partie I, question 2."
          - math: '(z_1-z_2)^2 = -4(1+\alpha) = \Delta'
            note: "C'est exactement Δ (Partie I, question 1a)."
      - id: q5b
        stem: |-
          **(0,5 pt)** Déterminer l'ensemble $\Gamma$ des points $\Omega$ pour que le triangle $OM_1 M_2$ soit rectangle en $O$.
        reasoning: |-
          C'est la synthèse de tout l'exercice. « Rectangle en $O$ » signifie $\vec{OM_1}\perp\vec{OM_2}$, c'est-à-dire $\dfrac{z_1}{z_2}$ imaginaire pur (rung R6) — condition déjà traduite, question après question, en $|z_1-z_2|=2$ (2c), puis en $|\Delta|=4$ (via la question 3a), puis en $|\alpha+1|=1$ : l'équation d'un cercle.

          Reste un dernier geste, propre à cette question : un « triangle » suppose trois points distincts. Le produit $z_1z_2=\alpha$ (Partie I) s'annule exactement quand $\alpha=0$ — c'est-à-dire quand l'un des deux points $M_1,M_2$ coïncide avec $O$. Ce point $\alpha=0$ est justement situé sur le cercle trouvé : il faut donc l'exclure explicitement, sans quoi $\Gamma$ contiendrait un cas dégénéré.
        steps:
          - math: '\text{rectangle en } O \iff \overrightarrow{OM_1}\perp\overrightarrow{OM_2} \iff \dfrac{z_1}{z_2}\ \text{imaginaire pur} \iff |z_1-z_2|=2'
            note: "Perpendicularité via le rapport des affixes (rung R6), puis l'équivalence de la question 2c."
          - math: '|z_1-z_2|=2 \iff |z_1-z_2|^2=4 \iff |\Delta| = 4'
            note: "Question 3a : (z1−z2)²=Δ, donc |z1−z2|²=|Δ|."
          - math: '|\Delta|=4 \iff |{-4(1+\alpha)}|=4 \iff 4\,|1+\alpha|=4 \iff |\alpha+1|=1'
            note: "Δ=−4(1+α) (Partie I) ; module d'un produit."
          - math: '|\alpha+1|=1\ \text{définit le cercle de centre}\ -1\ \text{et de rayon}\ 1'
            note: "Lecture géométrique du module d'une différence : ensemble des points à distance 1 du point d'affixe −1."
          - math: 'z_1z_2=\alpha=0 \implies z_1=0\ \text{ou}\ z_2=0 \implies M_1=O\ \text{ou}\ M_2=O\ (\text{triangle dégénéré})'
            note: "α=0 est sur ce cercle (|0+1|=1) mais y est exclu : sans trois points distincts, il n'y a pas de triangle."
          - math: '\Gamma = \big\{\,\Omega(\alpha)\ :\ |\alpha+1|=1\,\big\}\setminus\big\{\Omega(0)\big\}'
            note: "Cercle de centre le point d'affixe −1, rayon 1, privé du point d'affixe 0."
