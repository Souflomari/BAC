        steps:
          - math: 'e = 2p-b, \qquad f = 2q-c'
            note: "P milieu de [BE], Q milieu de [CF] (symétrie centrale : le symétrique de M par rapport à Ω a pour affixe 2ω−z_M)."
          - math: 'k = \dfrac{e+f}{2} = p+q-\dfrac{b+c}{2} = p+q-d'
            note: "K milieu de [EF] ; d=(b+c)/2 (question 2b)."
          - math: '2p+2q = \big[(a+b)+i(a-b)\big]+\big[(a+c)+i(c-a)\big] = 2a+(b+c)+i(c-b)'
            note: "On additionne les deux expressions de la question 2a ; (a−b)+(c−a)=c−b."
          - math: 'k = \dfrac{2a+(b+c)+i(c-b)}{2} - \dfrac{b+c}{2} = \dfrac{2a+i(c-b)}{2} = a+\dfrac{i}{2}(c-b)'
            note: "Le terme (b+c)/2 se simplifie exactement avec d."
      - id: q3b
        stem: |-
          **(0,5 pt)** Montrer que les points $K$, $P$, $Q$ et $D$ sont cocycliques.
        reasoning: |-
          On repart de $k=p+q-d$ (question précédente) : cette égalité se lit $d+k=p+q$, c'est-à-dire que $[DK]$ et $[PQ]$ ont le **même milieu** — exactement le critère du parallélogramme via les affixes (moyenne des affixes, chapitre 1, lu à l'envers). Le quadrilatère $DPKQ$ (dans cet ordre) est donc un parallélogramme, de côtés issus de $D$ égaux aux vecteurs $\vec{DP}$ et $\vec{DQ}$.

          Or la question 2c vient de montrer que ces deux côtés sont **perpendiculaires et de même longueur** ($DP=DQ$, angle droit en $D$). Un parallélogramme dont deux côtés adjacents sont perpendiculaires et égaux est un **carré**. Et les quatre sommets d'un carré sont toujours cocycliques, sur le cercle centré au point commun des deux diagonales — précisément le milieu de $[DK]$ (ou, ce qui revient au même, de $[PQ]$).
        steps:
          - math: 'k=p+q-d \iff d+k = p+q'
            note: "[DK] et [PQ] ont le même milieu (moyenne des affixes, chapitre 1)."
          - math: 'DPKQ\ \text{est un parallélogramme}\quad(\text{diagonales}\ [DK]\ \text{et}\ [PQ]\ \text{de même milieu})'
            note: "Critère du parallélogramme via les affixes."
          - math: 'DP=DQ\ \text{et}\ (DP)\perp(DQ)\quad(\text{question 2c})'
            note: "Deux côtés adjacents égaux et perpendiculaires."
          - math: 'DPKQ\ \text{est un carré} \implies K,\,P,\,Q,\,D\ \text{cocycliques}'
            note: "Un parallélogramme à côtés adjacents égaux et perpendiculaires est un carré ; les 4 sommets d'un carré sont sur son cercle circonscrit (centre = milieu commun des diagonales)."

