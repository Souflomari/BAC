        reasoning: |-
          $P$ est le centre d'une rotation d'angle $\dfrac{\pi}{2}$ qui envoie $O$ sur $A$ : la formule décentrée du R5, $z'-p = e^{i\pi/2}(z-p)$, se résout en $p$ une fois pour toutes — utile ici et pour $R$. Avec $z=0$, $z'=a$ pour $P$, et $z=b$, $z'=0$ pour $R$.

          Le facteur commun $\dfrac{1}{1-i} = \dfrac{\sqrt2}{2}\,e^{i\pi/4}$ (R3, inverse d'un complexe) fait le reste : il ne reste qu'à additionner les arguments.
        steps:
          - math: 'z'' - p = e^{i\pi/2}(z-p) \implies p = \dfrac{z'' - e^{i\pi/2}z}{1-e^{i\pi/2}} = \dfrac{z''-iz}{1-i}'
            note: "Centre d'une rotation d'angle π/2 envoyant M(z) sur M′(z′) (rung R5, résolu en p)."
          - math: '\dfrac{1}{1-i} = \dfrac{\sqrt2}{2}\,e^{i\pi/4}'
