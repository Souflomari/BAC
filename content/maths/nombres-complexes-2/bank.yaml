    intro: |-
      **Nombres complexes (examen national, session normale 2023, Sciences Mathématiques).**

      On considère le nombre complexe $u = 1+(2-\sqrt3)i$.

      L'exercice construit d'abord la forme exponentielle de $u$ à partir de deux nombres plus simples ($1-i$ et $1+\sqrt3\,i$), et en tire au passage la valeur de $\tan\dfrac{\pi}{12}$. Il utilise ensuite cette forme pour deux applications bien distinctes : une récurrence sur deux suites couplées $(x_n)$, $(y_n)$ définies terme à terme par $u^{n+1}=u^n\times u$, puis une lecture géométrique — alignement, angle droit — sur les points $A_n$ d'affixe $u^n$, via le rapport de complexes du chapitre 7.
    questions:
      - id: q1a
        stem: |-
          **(0,5 pt)** Écrire sous forme exponentielle les nombres complexes : $1 - i$ et $1 + \sqrt{3}\,i$.
        reasoning: |-
          Méthode du chapitre 2 : calculer le module, puis identifier l'argument à partir de $\cos\theta=a/r$ et $\sin\theta=b/r$, en vérifiant les deux signes à la fois (le piège classique du chapitre).
        steps:
          - math: '|1-i| = \sqrt{1^2+(-1)^2} = \sqrt2, \qquad \cos\theta=\dfrac{1}{\sqrt2},\ \sin\theta=-\dfrac{1}{\sqrt2} \implies \theta=-\dfrac{\pi}{4}'
            note: "Chapitre R1 : module puis argument, en vérifiant les deux signes (cos et sin)."
          - math: '1-i = \sqrt2\,e^{-i\pi/4}'
            note: "Forme exponentielle du premier nombre."
          - math: '|1+\sqrt3\,i| = \sqrt{1^2+(\sqrt3)^2} = 2, \qquad \cos\theta=\dfrac12,\ \sin\theta=\dfrac{\sqrt3}{2} \implies \theta=\dfrac{\pi}{3}'
            note: "Même méthode ; valeurs usuelles du tableau (chapitre 2)."
          - math: '1+\sqrt3\,i = 2\,e^{i\pi/3}'
            note: "Forme exponentielle du second nombre."
      - id: q1b
        stem: |-
          **(0,25 pt)** Montrer que : $\dfrac{(1-i)(1+\sqrt3\,i)}{2\sqrt2} = e^{i\frac{\pi}{12}}$
        reasoning: |-
          On multiplie les deux formes exponentielles de la question précédente par la règle du produit (chapitre 3) : les modules se multiplient, les arguments s'additionnent. Il ne reste plus qu'à diviser par $2\sqrt2$, qui est exactement le produit des deux modules — le facteur module disparaît, ne laissant que l'exponentielle pure.
        steps:
          - math: '(1-i)(1+\sqrt3\,i) = \sqrt2\,e^{-i\pi/4}\times 2\,e^{i\pi/3} = 2\sqrt2\,e^{i\left(\frac{\pi}{3}-\frac{\pi}{4}\right)}'
            note: "Règle du produit (chapitre 3) : modules × modules, arguments + arguments."
          - math: '\dfrac{\pi}{3}-\dfrac{\pi}{4} = \dfrac{4\pi}{12}-\dfrac{3\pi}{12} = \dfrac{\pi}{12} \implies (1-i)(1+\sqrt3\,i) = 2\sqrt2\,e^{i\pi/12}'
            note: "On réduit au même dénominateur pour soustraire les angles."
          - math: '\dfrac{(1-i)(1+\sqrt3\,i)}{2\sqrt2} = \dfrac{2\sqrt2\,e^{i\pi/12}}{2\sqrt2} = e^{i\pi/12}'
            note: "Le facteur module 2√2 se simplifie exactement."
      - id: q1c
        stem: |-
          **(0,25 pt)** En déduire que : $\tan\!\left(\dfrac{\pi}{12}\right) = 2 - \sqrt{3}$
        reasoning: |-
          L'égalité précédente donne aussi une deuxième expression de $e^{i\pi/12}$ : en développant le produit $(1-i)(1+\sqrt3\,i)$ en forme algébrique, puis en divisant par $2\sqrt2$, on obtient $\cos\dfrac{\pi}{12}$ et $\sin\dfrac{\pi}{12}$ par identification (partie réelle, partie imaginaire). Le quotient des deux donne la tangente ; il reste à rationaliser le dénominateur (méthode du conjugué, chapitre 1) pour retrouver la forme demandée.
        steps:
          - math: '(1-i)(1+\sqrt3\,i) = 1+\sqrt3\,i-i-\sqrt3\,i^2 = (1+\sqrt3)+i(\sqrt3-1)'
            note: "Développement algébrique direct."
          - math: 'e^{i\pi/12} = \dfrac{(1+\sqrt3)+i(\sqrt3-1)}{2\sqrt2} \implies \cos\dfrac{\pi}{12}=\dfrac{1+\sqrt3}{2\sqrt2},\ \ \sin\dfrac{\pi}{12}=\dfrac{\sqrt3-1}{2\sqrt2}'
            note: "Identification : partie réelle = cos(π/12), partie imaginaire = sin(π/12)."
          - math: '\tan\dfrac{\pi}{12} = \dfrac{\sin(\pi/12)}{\cos(\pi/12)} = \dfrac{\sqrt3-1}{1+\sqrt3}'
            note: "Le facteur commun 2√2 se simplifie."
          - math: '\dfrac{\sqrt3-1}{\sqrt3+1} = \dfrac{(\sqrt3-1)^2}{(\sqrt3+1)(\sqrt3-1)} = \dfrac{4-2\sqrt3}{2} = 2-\sqrt3'
            note: "Méthode du conjugué (chapitre 1) : on multiplie par (√3−1)/(√3−1)."
