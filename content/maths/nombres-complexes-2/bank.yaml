      - id: q2a
        part: "Le plan complexe $(O,\\vec{u},\\vec{v})$ : $A(a)$, $B(b)$, $C(c)$ non alignés ; $P(p)$ centre de la rotation d'angle $\\dfrac{\\pi}{2}$ qui transforme $B$ en $A$, $Q(q)$ centre de la rotation d'angle $\\left(-\\dfrac{\\pi}{2}\\right)$ qui transforme $C$ en $A$, $D(d)$ milieu de $[BC]$"
