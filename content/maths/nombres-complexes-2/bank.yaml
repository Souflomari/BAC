      - id: q5b
        stem: |-
          **(0,5 pt)** Déterminer l'ensemble $\Gamma$ des points $\Omega$ pour que le triangle $OM_1 M_2$ soit rectangle en $O$.
        reasoning: |-
          C'est la synthèse de tout l'exercice. « Rectangle en $O$ » signifie $\vec{OM_1}\perp\vec{OM_2}$, c'est-à-dire $\dfrac{z_1}{z_2}$ imaginaire pur (rung R6) — condition déjà traduite, question après question, en $|z_1-z_2|=2$ (2c), puis en $|\Delta|=4$ (via la question 3a), puis en $|\alpha+1|=1$ : l'équation d'un cercle.

