    intro: |-
      **Nombres complexes (examen national, session normale 2017, Sciences Mathématiques).**

      Soit $m$ un nombre complexe **non nul**.

      La **partie 1** résout une équation du second degré dont un coefficient dépend de $m$ : le discriminant se révèle être un carré parfait, $(2im)^2$, ce qui donne directement les deux racines. La **partie 2** place ces mêmes racines dans le plan complexe et enchaîne une rotation (chapitre 6), un rapport de deux affixes qui code à la fois alignement et angle droit (chapitre 7, l'outil central du chapitre), puis une cocyclicité de quatre points construite à partir de deux cercles de Thalès imbriqués.
    questions:
      - id: q1
        part: "Partie 1 — L'équation $(E)\\ :\\ 2z^2 - 2(m+1+i)z + m^2 + (1+i)m + i = 0$"
        stem: |-
          **(0,5 pt)** Vérifier que le discriminant de l'équation $(E)$ est : $\Delta = (2im)^2$
        reasoning: |-
          Le discriminant d'une équation du second degré $az^2+bz+c=0$ est $\Delta=b^2-4ac$ ; le calcul se mène comme dans $\mathbb{R}$, mais avec des nombres complexes, en utilisant $a=2$, $b=-2(m+1+i)$, $c=m^2+(1+i)m+i$. Le geste qui débloque tout est de reconnaître $(1+i)^2=2i$ (déjà vu au chapitre précédent) dans le développement de $(m+1+i)^2$, ce qui fait s'effondrer les deux termes en $m^2$.
        steps:
          - math: '\Delta = \big[2(m+1+i)\big]^2 - 4\times2\times\big(m^2+(1+i)m+i\big) = 4(m+1+i)^2 - 8\big(m^2+(1+i)m+i\big)'
            note: "Δ = b² − 4ac, avec b = −2(m+1+i), a = 2, c = m²+(1+i)m+i."
          - math: '(m+1+i)^2 = m^2 + 2(1+i)m + (1+i)^2 = m^2+2(1+i)m+2i'
            note: "Developpement ; (1+i)² = 2i, deja vu au chapitre precedent."
          - math: '4(m+1+i)^2 = 4m^2+8(1+i)m+8i, \qquad 8\big(m^2+(1+i)m+i\big) = 8m^2+8(1+i)m+8i'
            note: "Les deux termes en (1+i)m et en i coincident exactement entre les deux developpements."
          - math: '\Delta = \big[4m^2+8(1+i)m+8i\big] - \big[8m^2+8(1+i)m+8i\big] = -4m^2 = (2im)^2'
            note: "Tout s'annule sauf les termes en m² : il reste −4m², soit (2im)² puisque (2im)² = 4i²m² = −4m²."
      - id: q2
        stem: |-
          **(0,5 pt)** Résoudre dans $\mathbb{C}$ l'équation $(E)$
        reasoning: |-
          $\Delta$ est déjà un carré parfait (question précédente) : $\delta=2im$ en est directement une racine, sans rien à factoriser. La formule des racines $z=\dfrac{-b\pm\delta}{2a}$, avec $-b=2(m+1+i)$ et $2a=4$, donne les deux solutions ; il reste à regrouper chaque numérateur en un produit reconnaissable.
        steps:
          - math: 'z = \dfrac{2(m+1+i)\pm2im}{4} = \dfrac{(m+1+i)\pm im}{2}'
            note: "Formule (−b±δ)/(2a), avec δ = 2im (racine carree de Δ)."
          - math: 'z_1 = \dfrac{(m+1+i)+im}{2} = \dfrac{m(1+i)+(1+i)}{2} = \dfrac{(1+i)(m+1)}{2}'
            note: "Signe + : on regroupe m+im = m(1+i), puis on factorise par (1+i)."
          - math: 'z_2 = \dfrac{(m+1+i)-im}{2} = \dfrac{m(1-i)+(1+i)}{2} = \dfrac{(1-i)(m+i)}{2}'
            note: "Signe − : m−im = m(1−i) ; on verifie que (1−i)(m+i) redonne bien (1−i)m + (1+i) — meme numerateur."
      - id: q1a2
        part: "Partie 2 — Plan complexe $(O,\\vec{e_1},\\vec{e_2})$ : $m\\in\\mathbb{C}\\setminus\\{0,1,i\\}$, $z_1=\\frac{1+i}{2}(m+1)$, $z_2=\\frac{1-i}{2}(m+i)$ ; $A(1)$, $B(i)$, $M(m)$, $M_1(z_1)$, $M_2(z_2)$"
        stem: |-
          **(0,25 pt)** Vérifier que : $z_1 = iz_2 + 1$
        reasoning: |-
          Un calcul de vérification direct : on développe $iz_2+1$ avec la valeur de $z_2$ trouvée à la question 2, et on doit retomber exactement sur $z_1$.
        steps:
          - math: 'iz_2 = i\cdot\dfrac{1-i}{2}(m+i) = \dfrac{i-i^2}{2}(m+i) = \dfrac{1+i}{2}(m+i)'
            note: "i(1−i) = i−i² = 1+i."
          - math: 'iz_2+1 = \dfrac{1+i}{2}m + \dfrac{1+i}{2}i + 1 = \dfrac{1+i}{2}m + \dfrac{i-1}{2} + 1 = \dfrac{1+i}{2}m+\dfrac{i+1}{2}'
            note: "(1+i)i/2 = (i+i²)/2 = (i−1)/2 ; puis (i−1)/2 + 1 = (i+1)/2."
          - math: 'iz_2+1 = \dfrac{1+i}{2}(m+1) = z_1'
            note: "On factorise par (1+i)/2 : c'est exactement z1."
      - id: q1b2
        stem: |-
          **(0,5 pt)** Montrer que $M_1$ est l'image de $M_2$ par la rotation de centre le point $\Omega$ d'affixe $\omega = \dfrac{1+i}{2}$ et d'angle de mesure $\dfrac{\pi}{2}$
        reasoning: |-
          La relation $z_1=iz_2+1$ (question précédente) est une application affine $z\mapsto iz+1$ envoyant $M_2$ sur $M_1$. Le multiplicateur $i$ a pour module $1$ et pour argument $\dfrac{\pi}{2}$ (chapitre 6) : c'est le signe d'une rotation d'angle $\dfrac{\pi}{2}$, de centre le point fixe de cette application, solution de $\omega=i\omega+1$.
        steps:
          - math: '\omega = i\omega+1 \implies \omega(1-i)=1 \implies \omega = \dfrac{1}{1-i} = \dfrac{1+i}{(1-i)(1+i)} = \dfrac{1+i}{2}'
            note: "Point fixe de z ↦ iz+1 : on resout omega = i.omega + 1 (methode du conjugue)."
          - math: 'z_1-\omega = i(z_2-\omega)'
            note: "Forme decentree de la rotation (chapitre 6) : z1 − omega = i (z2 − omega), equivalente a z1 = i z2 + (1 − i).omega = i z2 + 1."
          - math: 'M_1\ \text{est l''image de}\ M_2\ \text{par la rotation de centre}\ \Omega\left(\dfrac{1+i}{2}\right)\ \text{et d''angle}\ \dfrac{\pi}{2}'
            note: "Multiplicateur i : module 1, argument π/2 (chapitre 6)."
      - id: q2a2
        part: "Un rapport de deux affixes, l'outil du chapitre (chapitre 7)"
        stem: |-
          **(0,5 pt)** Vérifier que : $\dfrac{z_2-m}{z_1-m} = i\,\dfrac{m-1}{m-i}$
        reasoning: |-
          On calcule séparément $z_1-m$ et $z_2-m$, en cherchant à chaque fois un facteur commun qui simplifiera dans le rapport. Le point de vigilance : les deux différences se factorisent chacune par un binôme du type $(m-1)$ ou $(m-i)$, pas par $m$ lui-même — c'est ce facteur qu'il faut repérer.
        steps:
          - math: 'z_1-m = \dfrac{(1+i)(m+1)}{2}-m = \dfrac{m(i-1)+(1+i)}{2} = \dfrac{(i-1)(m-i)}{2}'
            note: "On regroupe les termes en m, puis on factorise ; (1+i) = (i−1)(−i), verifie par developpement."
          - math: 'z_2-m = \dfrac{(1-i)(m+i)}{2}-m = \dfrac{m(-1-i)+(1+i)}{2} = -\dfrac{(1+i)(m-1)}{2}'
            note: "Meme demarche ; le facteur (1+i) se met en evidence des deux cotes."
          - math: '\dfrac{z_2-m}{z_1-m} = \dfrac{-(1+i)(m-1)}{(i-1)(m-i)} = \dfrac{(1+i)(m-1)}{(1-i)(m-i)} = \dfrac{1+i}{1-i}\cdot\dfrac{m-1}{m-i}'
            note: "i−1 = −(1−i) : les deux signes moins se simplifient."
          - math: '\dfrac{1+i}{1-i} = \dfrac{(1+i)^2}{(1-i)(1+i)} = \dfrac{2i}{2} = i \implies \dfrac{z_2-m}{z_1-m} = i\,\dfrac{m-1}{m-i}'
            note: "Methode du conjugue (chapitre 1) : (1+i)/(1−i) = i."
      - id: q2b2
        stem: |-
          **(0,5 pt)** Montrer que si les points $M$, $M_1$ et $M_2$ sont alignés alors $M$ appartient au cercle $(\Gamma)$ de diamètre $[AB]$
        reasoning: |-
          $M,M_1,M_2$ alignés signifie (chapitre 7) que $\dfrac{z_2-m}{z_1-m}$ est **réel**. D'après la question précédente, cela équivaut à $i\,\dfrac{m-1}{m-i}\in\mathbb{R}$, c'est-à-dire $\dfrac{m-1}{m-i}\in i\mathbb{R}$ (diviser un réel par $i$ donne un imaginaire pur). En passant à l'inverse — l'inverse d'un imaginaire pur non nul reste un imaginaire pur —, $\dfrac{m-i}{m-1}\in i\mathbb{R}$, soit encore $\dfrac{i-m}{1-m}\in i\mathbb{R}$ (même rapport, numérateur et dénominateur changés de signe ensemble).

          Or $\dfrac{i-m}{1-m}=\dfrac{b-m}{a-m}$ est, par le chapitre 7, le rapport qui code l'angle $\big(\vec{MA},\vec{MB}\big)$ : imaginaire pur signifie que cet angle est droit, c'est-à-dire que $M$ voit le segment $[AB]$ sous un angle droit — exactement la caractérisation (Thalès) du cercle $(\Gamma)$ de diamètre $[AB]$.
        steps:
          - math: 'M,M_1,M_2\ \text{alignes} \iff \dfrac{z_2-m}{z_1-m}\in\mathbb{R} \iff i\,\dfrac{m-1}{m-i}\in\mathbb{R}\ (\text{q2-a})'
            note: "Chapitre R6 : rapport reel = alignement."
          - math: 'i\,\dfrac{m-1}{m-i}\in\mathbb{R} \iff \dfrac{m-1}{m-i}\in i\mathbb{R} \iff \dfrac{m-i}{m-1}\in i\mathbb{R}'
            note: "Diviser un reel par i donne un imaginaire pur ; l'inverse d'un imaginaire pur non nul reste imaginaire pur."
          - math: '\dfrac{m-i}{m-1} = \dfrac{i-m}{1-m} = \dfrac{b-m}{a-m}\ (\text{affixes de}\ B(i)\ \text{et}\ A(1))'
            note: "Meme rapport, numerateur et denominateur changes de signe ensemble."
          - math: '\dfrac{b-m}{a-m}\in i\mathbb{R} \implies \widehat{\big(\vec{MA},\vec{MB}\big)} = \dfrac{\pi}{2} \implies M\in(\Gamma)\ \text{cercle de diametre}\ [AB]'
            note: "Chapitre R6 : rapport imaginaire pur = angle droit ; Thales : M voit [AB] sous un angle droit ⟹ M sur le cercle de diametre [AB]."
      - id: q2c2
        stem: |-
          **(0,75 pt)** Déterminer l'ensemble des points $M$ pour que les points $\Omega$, $M$, $M_1$ et $M_2$ soient cocycliques (remarquer que : $\dfrac{z_1-\omega}{z_2-\omega} = i$)
        reasoning: |-
          L'indication donnée, $\dfrac{z_1-\omega}{z_2-\omega}=i$, n'est autre que la relation de rotation de la question 1-b) recopiée sous forme de rapport (chapitre 7) : $\Omega$ voit toujours le segment $[M_1M_2]$ sous un angle droit ($\arg=\dfrac{\pi}{2}$), avec $\Omega M_1=\Omega M_2$ (module $1$) — et ceci **pour tout $m$** du domaine, sans aucune condition supplémentaire. Par la réciproque du théorème de Thalès, $\Omega$ est donc toujours sur le cercle de diamètre $[M_1M_2]$.

          Comme trois points non alignés déterminent un unique cercle, ce cercle de diamètre $[M_1M_2]$ **est** le cercle passant par $M_1$, $M_2$, $\Omega$. Les quatre points $\Omega,M,M_1,M_2$ sont donc cocycliques exactement quand $M$ appartient, lui aussi, à ce même cercle — c'est-à-dire, toujours par Thalès, quand $M$ voit $[M_1M_2]$ sous un angle droit : $\dfrac{z_1-m}{z_2-m}\in i\mathbb{R}$.

          On calcule ce rapport à partir de l'inverse de celui de la question 2-a) : $\dfrac{z_1-m}{z_2-m} = \dfrac{1}{i}\cdot\dfrac{m-i}{m-1} = -i\,\dfrac{m-i}{m-1}$. Ce produit est imaginaire pur exactement quand $\dfrac{m-i}{m-1}$ est **réel** — et $\dfrac{m-i}{m-1}=\dfrac{i-m}{1-m}$ est, par le chapitre 7, le rapport qui code l'alignement de $M$, $B$ et $A$. Donc : $\Omega,M,M_1,M_2$ cocycliques $\iff$ $M,A,B$ alignés $\iff$ $M\in(AB)$.

          Reste un cas dégénéré à exclure : si $M=\Omega$, il n'y a plus que trois points distincts, pas quatre points cocycliques. Or $\Omega=\dfrac{1+i}{2}$ est justement le milieu de $[AB]$, donc un point de la droite $(AB)$ : il faut l'exclure. L'ensemble cherché est donc la droite $(AB)$ privée du point $\Omega$ (et, comme partout dans cette partie, du domaine déjà restreint $m\notin\{0,1,i\}$, deux points déjà situés sur cette droite).
        steps:
          - math: '\dfrac{z_1-\omega}{z_2-\omega} = i\quad(\text{rotation de la question 1-b, rung R6}) \implies \Omega M_1=\Omega M_2\ \text{et}\ \widehat{M_1\Omega M_2}=\dfrac{\pi}{2}\ \text{pour tout}\ m'
            note: "Ceci vaut pour tout m du domaine : Omega est toujours sur le cercle de diametre [M1M2] (Thales)."
          - math: '\dfrac{z_1-m}{z_2-m} = \dfrac{1}{i}\cdot\dfrac{m-i}{m-1} = -i\,\dfrac{m-i}{m-1}'
            note: "Inverse du rapport de la question 2-a."
          - math: '\dfrac{z_1-m}{z_2-m}\in i\mathbb{R} \iff \dfrac{m-i}{m-1}\in\mathbb{R} \iff M,\,A,\,B\ \text{alignes (rung R6)}'
            note: "M voit [M1M2] sous un angle droit exactement quand M, A, B sont alignes."
          - math: 'M=\Omega \implies m=\dfrac{1+i}{2}\ (\text{milieu de}\ [AB],\ \text{sur}\ (AB)) \implies \text{a exclure (seulement 3 points distincts)}'
            note: "Cas degenere a retirer de la droite."
          - math: '\text{Ensemble cherche\,: la droite}\ (AB)\ \text{privee du point}\ \Omega'
            note: "Omega, M, M1, M2 cocycliques exactement quand M est sur la droite (AB), prive du point Omega."
