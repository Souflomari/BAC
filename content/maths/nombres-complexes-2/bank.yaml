    intro: |-
      **Nombres complexes (examen national, session normale 2020, Sciences Mathématiques).**

      Soit $m$ un nombre complexe **non nul**.

      La **première partie** résout une équation du troisième degré dont $m$ est, par construction, une solution donnée — il reste à factoriser et résoudre le facteur restant. La **deuxième partie** place les deux autres racines comme affixes des points $A$ et $B$, puis construit trois centres de rotation d'angle $\dfrac{\pi}{2}$ ($P$, $Q$, $R$) et compare deux longueurs et deux directions — encore une fois via un unique rapport de complexes (rung R6).
    questions:
      - id: q1
        part: "Première partie — L'équation $(E)\\ :\\ z^3 - 2mz^2 + 2m^2 z - m^3 = 0$"
        stem: |-
          **(0,5 pt)** Résoudre dans $\mathbb{C}$ l'équation $(E)$ (On remarque que $m$ est une solution de l'équation $(E)$).
        reasoning: |-
          L'énoncé donne la clé : $m$ est racine. On factorise donc $(E)$ par $(z-m)$ ; le quotient est un polynôme du second degré, qu'on retrouve par identification des coefficients (ou par division), puis qu'on vérifie en redéveloppant.

          Il reste à résoudre ce facteur quadratique comme au sujet 2019 de cette notion : discriminant, puis reconnaissance d'un carré parfait — ici $-3m^2$, dont $im\sqrt3$ est une racine carrée immédiate.
        steps:
          - math: '(E)\ :\ z^3-2mz^2+2m^2z-m^3=(z-m)(z^2-mz+m^2)'
