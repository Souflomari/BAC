        transcrites).
    intro: |-
      **Nombres complexes (examen national, session normale 2020, Sciences Mathématiques).**

      Soit $m$ un nombre complexe **non nul**.

      La **première partie** résout une équation du troisième degré dont $m$ est, par construction, une solution donnée — il reste à factoriser et résoudre le facteur restant. La **deuxième partie** place les deux autres racines comme affixes des points $A$ et $B$, puis construit trois centres de rotation d'angle $\dfrac{\pi}{2}$ ($P$, $Q$, $R$) et compare deux longueurs et deux directions — encore une fois via un unique rapport de complexes (chapitre 7).
    questions:
      - id: q1
        part: "Première partie — L'équation $(E)\\ :\\ z^3 - 2mz^2 + 2m^2 z - m^3 = 0$"
        stem: |-
          **(0,5 pt)** Résoudre dans $\mathbb{C}$ l'équation $(E)$ (On remarque que $m$ est une solution de l'équation $(E)$).
        reasoning: |-
          L'énoncé donne la clé : $m$ est racine. On factorise donc $(E)$ par $(z-m)$ ; le quotient est un polynôme du second degré, qu'on retrouve par identification des coefficients (ou par division), puis qu'on vérifie en redéveloppant.

          Il reste à résoudre ce facteur quadratique comme au sujet 2019 de cette notion : discriminant, puis reconnaissance d'un carré parfait — ici $-3m^2$, dont $im\sqrt3$ est une racine carrée immédiate.
        steps:
          - math: '(E)\ :\ z^3-2mz^2+2m^2z-m^3=(z-m)(z^2-mz+m^2)'
            note: "m est racine (donné) : on factorise par (z−m). On vérifie en développant : ça redonne bien (E)."
          - math: 'z^2-mz+m^2=0 \implies \Delta = m^2-4m^2=-3m^2 = \big(im\sqrt3\big)^2'
            note: "Discriminant du facteur restant. Comme au sujet 2019 (r-bac) de cette notion : −3m² est déjà un carré, ici celui de im√3."
          - math: 'z = \dfrac{m \pm im\sqrt3}{2} = \dfrac{m(1\pm i\sqrt3)}{2}'
            note: "Formule (−b±δ)/(2a), avec −b=m ici, δ=im√3."
          - math: 'S = \left\{\, m,\ \ \dfrac{m(1+i\sqrt3)}{2},\ \ \dfrac{m(1-i\sqrt3)}{2} \,\right\}'
            note: "Les trois solutions de (E) : m (donnée) et les deux racines du facteur quadratique."
      - id: q2a
        part: "Première partie (suite) — $z_1$ et $z_2$, les deux autres solutions de $(E)$, autres que $m$"
        stem: |-
          **(0,25 pt)** Vérifier que : $\dfrac{1}{z_1} + \dfrac{1}{z_2} = \dfrac{1}{m}$.
        reasoning: |-
          Pas besoin de reprendre les valeurs explicites : les relations coefficients-racines (Viète) sur $z^2-mz+m^2=0$ donnent directement la somme et le produit de $z_1$ et $z_2$. En regroupant $\dfrac1{z_1}+\dfrac1{z_2}$ au même dénominateur, on retombe exactement sur ces deux quantités.
        steps:
          - math: 'z_1+z_2=m, \qquad z_1z_2=m^2'
            note: "Relations coefficients-racines (Viète) sur z²−mz+m²=0 : somme = m, produit = m²."
          - math: '\dfrac{1}{z_1}+\dfrac{1}{z_2} = \dfrac{z_1+z_2}{z_1z_2} = \dfrac{m}{m^2} = \dfrac{1}{m}'
            note: "On regroupe au même dénominateur puis on simplifie par m (m non nul, donné)."
      - id: q2b
        stem: |-
          **(0,5 pt)** Dans le cas où $m = 1 + e^{i\frac{\pi}{3}}$, écrire sous la forme algébrique $z_1$ et $z_2$.
        reasoning: |-
          On relit d'abord la question 1 en forme exponentielle : $1+i\sqrt3 = 2e^{i\pi/3}$ et $1-i\sqrt3=2e^{-i\pi/3}$, donc $z_1=me^{i\pi/3}$ et $z_2=me^{-i\pi/3}$ (ce sont d'ailleurs exactement les affixes $a$ et $b$ de la partie II — pas un hasard).

          Reste à mettre $m$ lui-même sous forme exponentielle. Même geste qu'au sujet 2019 (r-bac) de cette notion, question 2a : on factorise $1+e^{i\pi/3}$ par l'angle moitié $e^{i\pi/6}$, ce qui fait apparaître $2\cos\dfrac{\pi}{6}$.
        steps:
          - math: 'z_1 = \dfrac{m(1+i\sqrt3)}{2} = m\,e^{i\pi/3}, \qquad z_2 = \dfrac{m(1-i\sqrt3)}{2} = m\,e^{-i\pi/3}'
            note: "Relecture de la question 1 en forme exponentielle : 1+i√3 = 2e^{iπ/3} et 1−i√3 = 2e^{−iπ/3}."
          - math: 'm = 1+e^{i\pi/3} = 2\cos\!\left(\dfrac{\pi}{6}\right)e^{i\pi/6} = \sqrt3\,e^{i\pi/6}'
            note: "Factorisation par l'angle moitié (même geste qu'au sujet 2019, question 2a) : cos(π/6)=√3/2."
          - math: 'z_1 = \sqrt3\,e^{i\pi/6}\times e^{i\pi/3} = \sqrt3\,e^{i\pi/2} = i\sqrt3'
            note: "Produit : arguments additionnés (chapitre 3). π/6+π/3=π/2."
          - math: 'z_2 = \sqrt3\,e^{i\pi/6}\times e^{-i\pi/3} = \sqrt3\,e^{-i\pi/6} = \dfrac{3}{2} - i\dfrac{\sqrt3}{2}'
            note: "π/6−π/3=−π/6 ; cos(π/6)=√3/2, sin(π/6)=1/2."
      - id: q3
        part: "Deuxième partie — $A(a=m\\,e^{i\\pi/3})$, $B(b=m\\,e^{-i\\pi/3})$ ; $P$, $Q$, $R$ centres des rotations d'angle $\\pi/2$ ($O\\to A$, $A\\to B$, $B\\to O$)"
        stem: |-
          **(0,25 pt)** Montrer que les points $O$, $A$ et $B$ ne sont pas alignés.
        reasoning: |-
          Chapitre R6 : $O$, $A$, $B$ sont alignés si et seulement si le rapport $\dfrac{b}{a}$ (rapport des affixes de $\vec{OB}$ et $\vec{OA}$) est réel. Ici $a$ et $b$ ont même module ($|m|$) mais des arguments opposés : le rapport se simplifie en une exponentielle pure, d'argument non nul et non égal à $\pi$ — donc pas réel.
        steps:
          - math: '\dfrac{b}{a} = \dfrac{m\,e^{-i\pi/3}}{m\,e^{i\pi/3}} = e^{-i2\pi/3}'
            note: "Rapport des affixes de B et A (chapitre 7) ; m non nul se simplifie (donné)."
          - math: '\arg\!\left(\dfrac{b}{a}\right) = -\dfrac{2\pi}{3} \not\equiv 0\ [\pi] \implies \dfrac{b}{a}\notin\mathbb{R}'
            note: "L'argument n'est ni 0 ni π (mod 2π) : le rapport n'est pas réel."
          - math: 'O,\ A,\ B \ \text{non alignés}'
            note: "R6 : rapport non réel ⟹ pas d'alignement."
      - id: q4a
        stem: |-
          **(1 pt)** Montrer que l'affixe de $P$ est $p = m\,\dfrac{\sqrt{2}}{2}\,e^{i\frac{7\pi}{12}}$ et que l'affixe de $R$ est $r = m\,\dfrac{\sqrt{2}}{2}\,e^{-i\frac{7\pi}{12}}$.
        reasoning: |-
          $P$ est le centre d'une rotation d'angle $\dfrac{\pi}{2}$ qui envoie $O$ sur $A$ : la formule décentrée du chapitre 6, $z'-p = e^{i\pi/2}(z-p)$, se résout en $p$ une fois pour toutes — utile ici et pour $R$. Avec $z=0$, $z'=a$ pour $P$, et $z=b$, $z'=0$ pour $R$.

          Le facteur commun $\dfrac{1}{1-i} = \dfrac{\sqrt2}{2}\,e^{i\pi/4}$ (chapitre 4, inverse d'un complexe) fait le reste : il ne reste qu'à additionner les arguments.
        steps:
          - math: 'z'' - p = e^{i\pi/2}(z-p) \implies p = \dfrac{z'' - e^{i\pi/2}z}{1-e^{i\pi/2}} = \dfrac{z''-iz}{1-i}'
            note: "Centre d'une rotation d'angle π/2 envoyant M(z) sur M′(z′) (chapitre 6, résolu en p)."
          - math: '\dfrac{1}{1-i} = \dfrac{\sqrt2}{2}\,e^{i\pi/4}'
            note: "1−i = √2 e^{−iπ/4} (chapitre 2) ; son inverse a pour module √2/2 et pour argument π/4 (chapitre 4)."
          - math: 'P:\ (z,z'')=(0,a) \implies p = a\times\dfrac{\sqrt2}{2}e^{i\pi/4} = m\,e^{i\pi/3}\times\dfrac{\sqrt2}{2}e^{i\pi/4} = m\,\dfrac{\sqrt2}{2}\,e^{i\frac{7\pi}{12}}'
            note: "P envoie O sur A : z=0, z′=a. π/3+π/4=7π/12."
          - math: 'R:\ (z,z'')=(b,0) \implies r = \dfrac{0-ib}{1-i} = -ib\times\dfrac{\sqrt2}{2}e^{i\pi/4} = m\,e^{-i\pi/3}\times\dfrac{\sqrt2}{2}e^{-i\pi/4} = m\,\dfrac{\sqrt2}{2}\,e^{-i\frac{7\pi}{12}}'
            note: "R envoie B sur O : z=b, z′=0. −i=e^{−iπ/2}, donc −π/2+π/4=−π/4, puis −π/3−π/4=−7π/12."
      - id: q4b
        stem: |-
          **(0,5 pt)** Montrer que l'affixe de $Q$ est $q = m\sqrt{2}\,\sin\!\left(\dfrac{7\pi}{12}\right)$.
        reasoning: |-
          Même formule que pour $P$ et $R$ (chapitre 6), appliquée à $Q$ qui envoie $A$ sur $B$ : $q = \dfrac{b-ia}{1-i}$. Cette fois, la voie exponentielle directe ne se simplifie pas aussi proprement — on repasse en forme algébrique pour développer le numérateur, et le facteur $(1-i)$ **se simplifie exactement**, laissant $q$ comme un pur multiple réel de $m$.

          Le nombre obtenu, $\dfrac{1+\sqrt3}{2}$, ne ressemble pas de prime abord à $\sqrt2\sin\!\left(\dfrac{7\pi}{12}\right)$ : c'est le signal qu'il faut vérifier l'identité via la formule d'addition du sinus plutôt que de la considérer comme acquise.
        steps:
          - math: 'q = \dfrac{b-ia}{1-i}'
            note: "Même formule que pour P, R (chapitre 6), appliquée à Q : A → B, donc (z,z′)=(a,b)."
          - math: 'a = m\left(\tfrac12+i\tfrac{\sqrt3}{2}\right),\ b = m\left(\tfrac12-i\tfrac{\sqrt3}{2}\right) \implies b-ia = m\,\dfrac{1+\sqrt3}{2}\,(1-i)'
            note: "On repasse en forme algébrique (e^{±iπ/3}=½±i√3/2) pour développer b−ia ; le résultat se factorise par (1−i)."
          - math: 'q = \dfrac{m\,\frac{1+\sqrt3}{2}(1-i)}{1-i} = m\,\dfrac{1+\sqrt3}{2}'
            note: "Le facteur (1−i) se simplifie : q est un multiple réel de m."
          - math: '\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right) = \sqrt2\,\sin\!\left(\dfrac{\pi}{3}+\dfrac{\pi}{4}\right) = \sqrt2\left(\sin\tfrac{\pi}{3}\cos\tfrac{\pi}{4}+\cos\tfrac{\pi}{3}\sin\tfrac{\pi}{4}\right) = \dfrac{1+\sqrt3}{2}'
            note: "Formule d'addition du sinus : on vérifie que ce nombre est bien celui annoncé."
          - math: 'q = m\,\dfrac{1+\sqrt3}{2} = m\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right)'
            note: "Les deux écritures coïncident."
      - id: q5
        stem: |-
          **(0,5 pt)** Montrer que $OQ = PR$ et que les deux droites $(OQ)$ et $(PR)$ sont perpendiculaires.
        reasoning: |-
          On calcule $r-p$, l'affixe du vecteur $\vec{PR}$, en factorisant par $m\dfrac{\sqrt2}{2}$ : la différence de deux exponentielles opposées se réduit à un sinus (comme $e^{i\alpha}-e^{-i\alpha}=2i\sin\alpha$, au signe près). Le nombre $\sqrt2\sin\!\left(\dfrac{7\pi}{12}\right)$ vient d'être calculé à la question précédente — pas besoin de le refaire.

          Le rapport $\dfrac{r-p}{q}$ (chapitre 7) encode alors, en un seul calcul, les deux faits demandés : son module donne l'égalité des longueurs, son argument donne la perpendicularité.
        steps:
          - math: 'r-p = m\dfrac{\sqrt2}{2}\left(e^{-i\frac{7\pi}{12}}-e^{i\frac{7\pi}{12}}\right) = -i\,m\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right)'
            note: "e^{−iα}−e^{iα} = −2i sin α (chapitre 2, propriétés du conjugué en forme exponentielle)."
          - math: '\sqrt2\,\sin\!\left(\dfrac{7\pi}{12}\right) = \dfrac{1+\sqrt3}{2} = \dfrac{q}{m} \implies r-p = -i\,q'
            note: "On réutilise l'identité et la valeur de q établies à la question précédente."
          - math: '\dfrac{r-p}{q} = -i'
            note: "Rapport des affixes de PR et OQ (chapitre 7)."
          - math: '\left|\dfrac{r-p}{q}\right| = 1 \implies PR = OQ, \qquad \arg\!\left(\dfrac{r-p}{q}\right) = -\dfrac{\pi}{2} \implies (PR)\perp(OQ)'
            note: "Un seul rapport encode les deux faits : module 1 (longueurs égales), argument ±π/2 (perpendicularité)."

