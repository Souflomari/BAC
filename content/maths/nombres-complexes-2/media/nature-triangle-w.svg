<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="Dans le plan complexe, le triangle ABC avec A d'affixe 1, B d'affixe 1+i, C d'affixe 2. Les vecteurs AB (affixe i, le dénominateur de w) et AC (affixe 1, le numérateur de w) sont perpendiculaires et de même longueur : un angle droit est marqué en A, avec des repères de longueur égale sur AB et AC, illustrant w = −i, |w| = 1 et arg(w) = −π/2.">
  <title>La nature du triangle ABC, lue sur w = (z_C−z_A)/(z_B−z_A)</title>
  <!--
    nature-triangle-w.svg — figure STAGED (LESSON-EXPERIENCE-SPEC.md §2.5 :
    schéma, ≥3 couches, l'ordre est un geste d'enseignement) pour le R6,
    l'exemple travaillé du texte : A(z=1), B(z=1+i), C(z=2), w=1/i=-i.

    Repère écran : O = (140,380), échelle 150 px/unité.
      A (z=1)    -> (290,380)
      B (z=1+i)  -> (290,230)
      C (z=2)    -> (440,380)
    AB (vertical, affixe i) et AC (horizontal, affixe 1) sont bien
    perpendiculaires à l'écran (90° exact, coordonnées entières) et de même
    longueur (150 px = 1 unité chacun) — cohérent avec |w|=1, arg(w)=-π/2.

    Mise en étapes (le geste : le triangle entier d'abord, puis les deux
    vecteurs depuis A qui définissent w, puis la lecture — angle droit et
    longueurs égales, la conclusion) :
      step-1 : axes, A, B, C, le triangle ABC.
      step-2 : les vecteurs AB (dénominateur de w) et AC (numérateur de w).
      step-3 : angle droit en A, repères de longueur égale sur AB/AC,
               annotation w = −i, isocèle et rectangle en A.

    Rôle des couleurs :
      axes, O, triangle (contour et remplissage léger), A/B/C           : --figure-ink / --figure-ink-soft
      vecteurs AB, AC et leurs affixes (numérateur/dénominateur de w)    : --figure-accent
      angle droit + ticks de longueur égale (structure, indépendante
      de la couleur du segment)                                        : --figure-ink-soft
      boîte d'annotation finale                                        : --figure-accent
  -->

  <rect x="20" y="34" width="600" height="460" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <text x="320" y="14" text-anchor="middle" font-size="12.5" font-weight="600"
        fill="var(--figure-ink)">La nature du triangle ABC, lue sur w</text>
  <text x="320" y="28" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">A(1), B(1+i), C(2) — w = (z_C−z_A)/(z_B−z_A)</text>

  <!-- Axe Re -->
  <line x1="90" y1="380" x2="560" y2="380" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="560,380 548,375.5 548,384.5" fill="var(--figure-ink-soft)"/>
  <text x="545" y="396" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">Re</text>

  <!-- Axe Im -->
  <line x1="140" y1="460" x2="140" y2="120" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="140,120 135.5,131 144.5,131" fill="var(--figure-ink-soft)"/>
  <text x="150" y="130" text-anchor="start" font-size="11" fill="var(--figure-ink-soft)">Im</text>

  <!-- Origine -->
  <circle cx="140" cy="380" r="2.5" fill="var(--figure-ink-soft)"/>
  <text x="126" y="397" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">O</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — A, B, C et le triangle ABC
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <path d="M290,380 L290,230 L440,380 Z" fill="var(--figure-grid)" fill-opacity="0.35"
          stroke="var(--figure-ink)" stroke-width="1.8"/>

    <circle cx="290" cy="380" r="4" fill="var(--figure-ink)"/>
    <text x="270" y="404" text-anchor="end" font-size="12" fill="var(--figure-ink)">A : <tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">A</tspan><tspan dy="-4"> = 1</tspan></text>

    <circle cx="290" cy="230" r="4" fill="var(--figure-ink)"/>
    <text x="290" y="212" text-anchor="middle" font-size="12" fill="var(--figure-ink)">B : <tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">B</tspan><tspan dy="-4"> = 1 + </tspan><tspan font-style="italic">i</tspan></text>

    <circle cx="440" cy="380" r="4" fill="var(--figure-ink)"/>
    <text x="450" y="404" text-anchor="start" font-size="12" fill="var(--figure-ink)">C : <tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">C</tspan><tspan dy="-4"> = 2</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les vecteurs AB (dénominateur) et AC (numérateur)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="290" y1="380" x2="290" y2="238" stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="290,230 286,238 294,238" fill="var(--figure-accent)"/>
    <text x="278" y="300" text-anchor="end" font-size="12" fill="var(--figure-accent)"><tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">B</tspan><tspan dy="-4">−</tspan><tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">A</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">i</tspan></text>
    <text x="278" y="316" text-anchor="end" font-size="10" fill="var(--figure-accent)">(dénominateur de w)</text>

    <line x1="290" y1="380" x2="432" y2="380" stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="440,380 432,376 432,384" fill="var(--figure-accent)"/>
    <text x="365" y="368" text-anchor="middle" font-size="12" fill="var(--figure-accent)"><tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">C</tspan><tspan dy="-4">−</tspan><tspan
          font-style="italic">z</tspan><tspan dy="4" font-size="70%">A</tspan><tspan dy="-4"> = 1</tspan></text>
    <text x="365" y="354" text-anchor="middle" font-size="10" fill="var(--figure-accent)">(numérateur de w)</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — angle droit en A, longueurs égales, la lecture
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path d="M290,368 L302,368 L302,380" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>

    <line x1="284" y1="305" x2="296" y2="305" stroke="var(--figure-ink)" stroke-width="1.8"/>
    <line x1="365" y1="374" x2="365" y2="386" stroke="var(--figure-ink)" stroke-width="1.8"/>

    <rect x="200" y="430" width="350" height="56" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="375" y="452" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">w = −i ⟹ |w| = 1 (isocèle en A)</text>
    <text x="375" y="472" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">arg(w) = −π/2 (rectangle en A)</text>
  </g><!-- /step-3 -->

</svg>
