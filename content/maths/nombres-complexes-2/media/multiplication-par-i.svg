<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="Dans le plan complexe, trois points de départ A (affixe 2), B (affixe 3i), C (affixe 1+i) et leurs images par la multiplication par i : A′ (affixe 2i), B′ (affixe −3), C′ (affixe −1+i). Un arc en quart de tour direct relie chaque point à son image autour de l'origine O, et trois cercles pointillés de rayons 2, 3 et racine de 2 montrent que la distance à O est inchangée.">
  <title>Multiplier par i : une rotation d'un quart de tour, aucun agrandissement</title>
  <!--
    multiplication-par-i.svg — figure STAGED (LESSON-EXPERIENCE-SPEC.md §2.5 :
    schéma, ordre = geste d'enseignement) pour R0, l'accroche du chapitre :
    la multiplication par i vue géométriquement comme une rotation.

    Reprend EXACTEMENT les trois couples du texte (R0) :
      z=2      (2,0)  ->  i·2  = 2i    (0,2)
      z=3i     (0,3)  ->  i·3i = -3    (-3,0)
      z=1+i    (1,1)  ->  i(1+i)=-1+i  (-1,1)

    Repère écran : centre O = (320,300), échelle 60 px/unité (mêmes
    conventions que racines-unite.svg : cadre encarté, titre+sous-titre
    au-dessus, boîte d'annotation en bas).
      A  = O + (2,0)·60   = (440,300)
      B  = O + (0,3)·60   = (320,120)
      C  = O + (1,1)·60   = (380,240)
      A' = O + (0,2)·60   = (320,180)
      B' = O + (-3,0)·60  = (140,300)
      C' = O + (-1,1)·60  = (260,240)

    Les trois arcs (quart de tour direct, sens trigonométrique) sont des
    Bézier quadratiques dont le point de contrôle est sur la bissectrice à
    distance r·√2 du centre (même technique que moment-force.svg /
    rotation-complexe.svg) :
      A->A'  (rayon 2·60=120)   contrôle (440,180)
      B->B'  (rayon 3·60=180)   contrôle (140,120)
      C->C'  (rayon √2·60≈85)  contrôle (320,180)
    Les trois cercles pointillés (rayons 120, 180, 85 px = 2, 3, √2 unités)
    passent exactement par chaque couple départ/image : la preuve visuelle
    que |z|=|iz| pour les trois cas.

    Mise en étapes (le geste : d'abord ce qu'on a, puis ce qu'on obtient,
    puis pourquoi — la distance ne change pas, seule la direction tourne) :
      step-1 : les trois points de départ, sur les axes.
      step-2 : les trois images par ×i.
      step-3 : les arcs de rotation + les cercles de rayon constant +
               l'annotation "rotation de 90°, aucun agrandissement".

    Rôle des couleurs :
      points de départ (A,B,C), axes, cercles pointillés : --figure-ink /
      --figure-ink-soft (le connu, la structure)
      images (A',B',C') et les arcs de rotation, la boîte d'annotation :
      --figure-accent (ce que la multiplication par i PRODUIT — l'idée
      de cette figure)
  -->

  <rect x="20" y="34" width="600" height="520" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <text x="320" y="14" text-anchor="middle" font-size="12.5" font-weight="600"
        fill="var(--figure-ink)">Multiplier par i : une rotation d'un quart de tour</text>
  <text x="320" y="28" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">trois points, leurs images par ×i, la distance à O inchangée</text>

  <!-- Axe Re -->
  <line x1="90" y1="300" x2="580" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="580,300 568,295.5 568,304.5" fill="var(--figure-ink-soft)"/>
  <text x="565" y="316" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">Re</text>

  <!-- Axe Im -->
  <line x1="320" y1="470" x2="320" y2="70" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="320,70 315.5,81 324.5,81" fill="var(--figure-ink-soft)"/>
  <text x="333" y="80" text-anchor="start" font-size="11" fill="var(--figure-ink-soft)">Im</text>

  <!-- Origine -->
  <circle cx="320" cy="300" r="2.5" fill="var(--figure-ink-soft)"/>
  <text x="306" y="317" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">O</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les trois points de départ
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <circle cx="440" cy="300" r="4" fill="var(--figure-ink)"/>
    <text x="450" y="290" font-size="12" fill="var(--figure-ink)">A : <tspan font-style="italic">z</tspan> = 2</text>

    <circle cx="320" cy="120" r="4" fill="var(--figure-ink)"/>
    <text x="330" y="116" font-size="12" fill="var(--figure-ink)">B : <tspan font-style="italic">z</tspan> = 3<tspan font-style="italic">i</tspan></text>

    <circle cx="380" cy="240" r="4" fill="var(--figure-ink)"/>
    <text x="390" y="236" font-size="12" fill="var(--figure-ink)">C : <tspan font-style="italic">z</tspan> = 1 + <tspan font-style="italic">i</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les trois images par ×i
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <circle cx="320" cy="180" r="4" fill="var(--figure-accent)"/>
    <text x="310" y="164" text-anchor="end" font-size="12" fill="var(--figure-accent)">A′ : 2<tspan font-style="italic">i</tspan></text>

    <circle cx="140" cy="300" r="4" fill="var(--figure-accent)"/>
    <text x="128" y="320" text-anchor="end" font-size="12" fill="var(--figure-accent)">B′ : −3</text>

    <circle cx="260" cy="240" r="4" fill="var(--figure-accent)"/>
    <text x="245" y="265" text-anchor="end" font-size="12" fill="var(--figure-accent)">C′ : −1 + <tspan font-style="italic">i</tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — les arcs de rotation + les cercles de rayon
       constant + l'annotation
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Cercles pointillés : la distance à O est inchangée -->
    <circle cx="320" cy="300" r="120" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="320" cy="300" r="180" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="320" cy="300" r="84.9" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Arc A -> A' (rayon 2) -->
    <path d="M440,300 Q440,180 320,180" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="320,180 330,175 330,185" fill="var(--figure-accent)"/>

    <!-- Arc B -> B' (rayon 3) -->
    <path d="M320,120 Q140,120 140,300" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="140,300 145,290 135,290" fill="var(--figure-accent)"/>

    <!-- Arc C -> C' (rayon √2) -->
    <path d="M380,240 Q320,180 260,240" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="260,240 270.6,236.5 263.5,229.4" fill="var(--figure-accent)"/>

    <!-- Boîte d'annotation -->
    <rect x="130" y="495" width="380" height="48" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="320" y="524" text-anchor="middle" font-size="13" fill="var(--figure-accent)">rotation de 90° (sens direct), aucun agrandissement</text>
  </g><!-- /step-3 -->

</svg>
