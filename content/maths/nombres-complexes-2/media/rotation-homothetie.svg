<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="Dans le plan complexe, le point M d'affixe z = 3, transformé par z' = c·z avec c = 1+i (module racine de 2, argument π/4) : une rotation de centre O et d'angle π/4 amène M au point intermédiaire d'affixe 3 fois e puissance i pi sur 4, puis une homothétie de centre O et de rapport racine de 2 l'éloigne jusqu'à l'image finale M' d'affixe 3+3i.">
  <title>z ↦ cz : la composée d'une rotation et d'une homothétie</title>
  <!--
    rotation-homothetie.svg — figure STAGED (LESSON-EXPERIENCE-SPEC.md §2.5 :
    graphe, toujours stagé) pour le R5, l'exemple travaillé du texte :
    c=1+i (r=√2, θ=π/4), z=3, z'=cz=3+3i.

    Repère écran : O = (180,400), échelle 65 px/unité.
      M  (z=3)              -> (375,400)
      M₁ (3e^{iπ/4})         -> (317.9,262.1)   [intermédiaire, après rotation seule]
      M' (z'=3+3i)           -> (375,205)        [après l'homothétie]
    M, M₁, M' et O sont vérifiés : |OM₁|=195px=3 unités (rayon inchangé,
    la rotation seule) ; |OM'|=275.8px=3√2 unités ; O, M₁, M' colinéaires
    (même direction 45°, seule la distance change entre M₁ et M' — la
    signature géométrique d'une homothétie).

    Arc de rotation (Bézier quadratique, contrôle sur la bissectrice à
    distance r·√2, même technique que moment-force.svg) :
      départ M(375,400) -> contrôle (375,319.2) -> arrivée M₁(317.9,262.1)
    Flèche d'homothétie : droite radiale de M₁ à M' (même direction que OM₁,
    seule la longueur change).

    Mise en étapes (le geste : la donnée de départ, puis la rotation SEULE,
    puis l'homothétie qui complète la transformation) :
      step-1 : M (z=3), la légende de c (module, argument).
      step-2 : la rotation — arc de centre O, angle θ=π/4, jusqu'à M₁.
      step-3 : l'homothétie — extension radiale de rapport √2, jusqu'à M',
               + la formule de composition.

    Rôle des couleurs :
      axes, O                                     : --figure-ink-soft
      M, M₁, M', leurs affixes                     : --figure-ink
      vecteur OM, l'arc de rotation, la flèche
      d'homothétie, les boîtes (légende + formule)  : --figure-accent
  -->

  <rect x="20" y="34" width="600" height="460" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <text x="320" y="14" text-anchor="middle" font-size="12.5" font-weight="600"
        fill="var(--figure-ink)">z ↦ cz : rotation puis homothétie</text>
  <text x="320" y="28" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">R5 : c = 1 + i, z = 3 — la composée qui envoie M sur M′</text>

  <!-- Axe Re -->
  <line x1="110" y1="400" x2="560" y2="400" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="560,400 548,395.5 548,404.5" fill="var(--figure-ink-soft)"/>
  <text x="545" y="416" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">Re</text>

  <!-- Axe Im -->
  <line x1="180" y1="410" x2="180" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="180,60 175.5,71 184.5,71" fill="var(--figure-ink-soft)"/>
  <text x="190" y="70" text-anchor="start" font-size="11" fill="var(--figure-ink-soft)">Im</text>

  <!-- Origine -->
  <circle cx="180" cy="400" r="2.5" fill="var(--figure-ink-soft)"/>
  <text x="166" y="417" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">O</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — M (z=3), légende de c
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="180" y1="400" x2="365" y2="400" stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="375,400 365,404 365,396" fill="var(--figure-accent)"/>
    <circle cx="375" cy="400" r="4" fill="var(--figure-ink)"/>
    <text x="385" y="392" font-size="13" fill="var(--figure-ink)">M : <tspan font-style="italic">z</tspan> = 3</text>

    <rect x="420" y="60" width="170" height="80" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="505" y="84" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">c = 1 + i</text>
    <text x="505" y="104" text-anchor="middle" font-size="12" fill="var(--figure-accent)">|c| = √2</text>
    <text x="505" y="124" text-anchor="middle" font-size="12" fill="var(--figure-accent)">arg(c) = π/4</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la rotation : arc de centre O, angle π/4
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="M375,400 Q375,319.2 317.9,262.1" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="317.9,262.1 327.8,266.3 322.1,272.0" fill="var(--figure-accent)"/>

    <circle cx="317.9" cy="262.1" r="4" fill="var(--figure-ink)"/>
    <text x="300" y="245" text-anchor="end" font-size="12" fill="var(--figure-ink)">M<tspan
          dy="4" font-size="9" font-style="normal">1</tspan><tspan dy="-4"> : 3</tspan><tspan
          font-style="italic">e</tspan><tspan dy="-6" font-size="9">iπ/4</tspan><tspan dy="6"></tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — l'homothétie : extension radiale ×√2, formule
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="317.9" y1="262.1" x2="367.9" y2="212.1" stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="375,205 370.8,214.9 365.1,209.2" fill="var(--figure-accent)"/>

    <circle cx="375" cy="205" r="4" fill="var(--figure-ink)"/>
    <text x="385" y="200" font-size="13" fill="var(--figure-ink)">M′ : <tspan
          font-style="italic">z</tspan><tspan>′ = 3 + 3</tspan><tspan font-style="italic">i</tspan></text>

    <rect x="180" y="420" width="300" height="48" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="330" y="440" text-anchor="middle" font-size="12.5" font-style="italic" fill="var(--figure-accent)">z′ = c · z</text>
    <text x="330" y="458" text-anchor="middle" font-size="11.5" fill="var(--figure-accent)">rotation d'angle π/4, puis homothétie de rapport √2</text>
  </g><!-- /step-3 -->

</svg>
