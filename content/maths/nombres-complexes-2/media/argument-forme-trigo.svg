<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     role="img"
     aria-label="Dans le plan complexe, un point M d'affixe z = a + bi, à distance r = |z| de l'origine O, dans la direction repérée par l'angle θ = arg(z) mesuré depuis l'axe des réels. Les projections de M sur les axes donnent a = r cos θ et b = r sin θ, formant un triangle rectangle.">
  <title>Argument et forme trigonométrique de z = a + bi</title>
  <!--
    argument-forme-trigo.svg — figure STAGED (LESSON-EXPERIENCE-SPEC.md §2.5 :
    graphe, toujours stagé, ordre canonique axes -> données -> lecture) pour
    le R1. Point GÉNÉRIQUE (a,b) — aucune valeur numérique n'est fixée, tout
    reste symbolique (r, θ, a, b), à l'inclinaison représentative ~55°
    demandée par le brief.

    Repère écran : O = (140,420), M = (335,141) — vecteur OM de longueur
    340 px selon la direction (cos55°,sin55°)=(0.5736,0.8192), donc
    Δx=195, Δy=-279 (55.05° au-dessus de l'axe réel, proche du ~55° demandé).
      pied sur Re (= a)  : (335,420)
      pied sur Im (= b)  : (140,141)

    Arc θ (rayon 80 px, entre l'axe Re et OM) : Bézier quadratique, point de
    contrôle sur la bissectrice à distance 80/cos(27.52°)≈90.2 du centre
    (même technique que moment-force.svg / rotation-complexe.svg) :
      départ (220,420) -> contrôle (220,378.3) -> arrivée (185.9,354.5)

    Mise en étapes (le geste : d'abord r=OM, déjà connu du ch.1 ; puis
    l'angle θ, la nouveauté du R1 ; puis la lecture a,b et cos/sin) :
      step-1 : le repère, M, le vecteur OM, r = |z| = OM.
      step-2 : l'arc θ = arg(z).
      step-3 : les projections a = r cos θ, b = r sin θ, la formule.

    Rôle des couleurs :
      axes, O, projections en pointillé, pied des projections : --figure-ink-soft
      M, son affixe, le vecteur OM, r                          : --figure-ink
      l'arc θ, les labels a/b, la formule cos/sin encadrée      : --figure-accent
      (l'angle et sa lecture trigonométrique — l'idée neuve de ce rung)
  -->

  <rect x="20" y="34" width="600" height="460" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <text x="320" y="14" text-anchor="middle" font-size="12.5" font-weight="600"
        fill="var(--figure-ink)">Argument et forme trigonométrique de z = a + bi</text>
  <text x="320" y="28" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">la direction de M se lit par l'angle θ = arg(z)</text>

  <!-- Axe Re -->
  <line x1="90" y1="420" x2="580" y2="420" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="580,420 568,415.5 568,424.5" fill="var(--figure-ink-soft)"/>
  <text x="565" y="436" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">Re</text>

  <!-- Axe Im -->
  <line x1="140" y1="460" x2="140" y2="70" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="140,70 135.5,81 144.5,81" fill="var(--figure-ink-soft)"/>
  <text x="150" y="80" text-anchor="start" font-size="11" fill="var(--figure-ink-soft)">Im</text>

  <!-- Origine -->
  <circle cx="140" cy="420" r="2.5" fill="var(--figure-ink-soft)"/>
  <text x="126" y="437" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">O</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le repère, M, le vecteur OM, r = |z| = OM
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="140" y1="420" x2="326.5" y2="149.6" stroke="var(--figure-ink)" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="335,141 322.4,148 328.7,158.2" fill="var(--figure-ink)"/>
    <circle cx="335" cy="141" r="4" fill="var(--figure-ink)"/>

    <text x="345" y="132" font-size="14" font-style="italic" fill="var(--figure-ink)">M</text>
    <text x="345" y="150" font-size="12" fill="var(--figure-ink)"><tspan
          font-style="italic">z</tspan><tspan> = </tspan><tspan font-style="italic">a</tspan><tspan> + </tspan><tspan font-style="italic">bi</tspan></text>

    <text x="233" y="323" font-size="13" fill="var(--figure-ink)"><tspan
          font-style="italic">r</tspan><tspan> = |</tspan><tspan font-style="italic">z</tspan><tspan>| = OM</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — l'arc θ = arg(z)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="M220,420 Q220,378.3 185.9,354.5" fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="203" y="388" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">θ</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — les projections a, b et la lecture cos/sin
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="335" y1="147" x2="335" y2="420" stroke="var(--figure-ink-soft)" stroke-width="1.4" stroke-dasharray="5,4" stroke-linecap="round"/>
    <line x1="140" y1="141" x2="329" y2="141" stroke="var(--figure-ink-soft)" stroke-width="1.4" stroke-dasharray="5,4" stroke-linecap="round"/>

    <!-- Angle droit au pied de la projection sur Re -->
    <path d="M335,408 L323,408 L323,420" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>

    <text x="335" y="438" text-anchor="middle" font-size="12" fill="var(--figure-accent)"><tspan
          font-style="italic">a</tspan><tspan> = </tspan><tspan font-style="italic">r</tspan><tspan> cos θ</tspan></text>
    <text x="128" y="145" text-anchor="end" font-size="12" fill="var(--figure-accent)"><tspan
          font-style="italic">b</tspan><tspan> = </tspan><tspan font-style="italic">r</tspan><tspan> sin θ</tspan></text>

    <rect x="400" y="330" width="200" height="64" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="500" y="354" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">cos θ = a / r</text>
    <text x="500" y="376" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">sin θ = b / r</text>
  </g><!-- /step-3 -->

</svg>
