  - id: r-bac
    title: "Exercice de type bac — les sens, critère de la vérité ? (نص, 2025 N)"
    sourcing:
      status: sourced
      note: >-
        2025 session normale — Sujet 3 (نص, troisième des trois sujets
        proposés) ; filière كل مسالك الشعب العلمية والتقنية والمهنية
        والأصيلة — الفلسفة, 2 h, coef 2 ; source profsalmi
        (https://www.profsalmi.com/2025/05/exam-nat2025-philo-3olom.html) ;
        texte transcrit intégralement dans docs/sujets/philo/la-verite.md
        (entrée « 2025 — session normale — Sujet 3 (نص) »), statut
        « vérifié » (re-fetch indépendant + diff conforme, agent-vérificateur,
        2026-07-15). Auteur non indiqué dans la source consultée (à confirmer
        sur le scan officiel). Ce même texte sert aussi de matériau
        d'accroche (R0, en extrait) et de summit à la méthode de l'analyse
        de texte (content/philo/analyse-de-texte/, en entier, comme
        r-variation) — trois usages différents du même texte réel, pas une
        coïncidence : c'est le seul texte vérifié de la banque pour cette
        notion.
    intro: |-
      **Sujet réel, examen national de philosophie, 2025 (session normale) —
      troisième sujet (un texte à analyser et discuter) :**

      > المطلوب : حلّل(ي) النص وناقشه(يه).
      >
      > *(« Analyse le texte et discute-le. »)*

      **Texte arabe (original) :**

      > إن الحواس هي معيار الحقيقة. ولكن المعيار هو الحواس كلها، فقد تخدعنا حاسة واحدة،
      > كما يخدعنا الضوء بالنسبة للألوان، أو المسافة بالنسبة للحجم. ولا تستطيع أن تصحّح ما
      > تُحدثه حاسة من خطأ إلا حاسة أخرى. والحقيقة هي الإحساس الثابت، غير أن الإحساس يجب
      > أن يشمل كل ما نتعلّمه من الآلات التي نوسّع بها دائرة الحواس ونجعلها دقيقة.
      > فالتلسكوب والميكروسكوب وغيرهما هي وسائل لمضاعفة ما تبصره عيوننا، والهاتف وسمّاعة
      > الطبيب هما امتداد لآذاننا العجيبة. وليس ثمة أمور مطلقة بل أمور نسبية فقط، وعلينا
      > أن نتعلّم كيف نساير الأمور النسبية، وهناك غيرنا من الناس في هذا العالم، ولن تتفق
      > حواسهم دائما مع حواسنا وبالتالي حقائقهم مع حقائقنا. فالحقيقة عبارة عن قبة من
      > البلور متعدد الألوان حيث يرى كل واحد من زاويته تأليفا خاصا من الألوان.
      >
      > أين، إذن، موضع العقل؟ إن وظيفته هنا كما في كل مكان هي التنسيق؛ إنه ينسّق
      > الإحساسات إلى معانٍ، والمعاني إلى معرفة، والمعرفة إلى حكمة. إن عمل العقل في الظفر
      > بالحقيقة ثانوي لكنه حيوي؛ إذ يجب أن ينسج فوضى الحواس المختلفة وما بينها من تناقض
      > في نتائج موحّدة ومنسّقة تكون عرضة للتحقيق والتأييد أو الحذف بواسطة الإحساس
      > المتكرر، وكل خطوة استدلالية تبعد عن الإحساس المباشر تقلّل من احتمال الحقيقة.
      > إننا نقف على أقدامنا ثابتين على الأرض بواسطة الإحساس.

      **Traduction de travail française :**

      > Les sens sont le critère de la vérité. Mais le critère, ce sont tous les sens
      > ensemble, car un seul sens peut nous tromper — comme la lumière nous trompe
      > quant aux couleurs, ou la distance quant à la taille. Et seul un autre sens peut
      > corriger l'erreur produite par un sens. La vérité est la sensation constante ;
      > toutefois, la sensation doit englober tout ce que nous apprenons des instruments
      > par lesquels nous élargissons le domaine des sens et les rendons précis. Le
      > télescope, le microscope et d'autres sont des moyens de démultiplier ce que nos
      > yeux perçoivent, et le téléphone comme le stéthoscope du médecin sont un
      > prolongement de nos oreilles admirables. Il n'existe pas de choses absolues,
      > mais seulement des choses relatives, et nous devons apprendre à composer avec le
      > relatif ; il y a, dans ce monde, d'autres que nous, dont les sens ne
      > s'accorderont pas toujours avec les nôtres, et par suite leurs vérités avec les
      > nôtres. La vérité est comme une coupole de cristal aux multiples couleurs, où
      > chacun voit, depuis son angle, une composition particulière de couleurs.
      >
      > Où se situe alors la raison ? Sa fonction, ici comme partout, est la
      > coordination : elle coordonne les sensations en significations, les
      > significations en connaissance, et la connaissance en sagesse. Le travail de la
      > raison dans la conquête de la vérité est secondaire, mais vital ; car elle doit
      > tisser le chaos des différents sens, et les contradictions entre eux, en
      > résultats unifiés et coordonnés, exposés à la vérification et à la confirmation
      > — ou à l'élimination — par la sensation répétée ; et chaque pas inférentiel qui
      > s'éloigne de la sensation immédiate diminue la probabilité de la vérité. Nous
      > nous tenons debout, fermes sur la terre, par le moyen de la sensation.

      Ce texte défend une thèse empiriste (les sens comme critère de la
      vérité) tout en y logeant deux nuances sur lesquelles la leçon t'a déjà
      donné de quoi discuter : un parfum de relativisme (« leurs vérités
      avec les nôtres », la coupole de cristal) et un rôle de la raison
      annoncé comme « secondaire, mais vital ». Rien ici n'est un axe
      nouveau — c'est exactement le terrain des chapitres 3, 5, 6, 8 et 9.
    questions:
      - id: q1
        part: "Partie 1 — Dégager la thèse"
        stem: |-
          Le texte affirme plus qu'« il faut faire confiance à ses sens ».
          Formule sa thèse en une phrase précise : quel est le critère exact
          de la vérité qu'il défend, et quel rôle attribue-t-il à la raison ?
        reasoning: |-
          Le texte pose d'abord un critère, puis le corrige aussitôt : « les
          sens sont le critère de la vérité » n'est PAS la thèse complète —
          la phrase suivante la corrige immédiatement : « mais le critère,
          ce sont tous les sens ensemble, car un seul sens peut nous
          tromper ». La thèse exacte, c'est cette version corrigée : le
          critère de la vérité est l'ENSEMBLE des sens, qui se contrôlent
          mutuellement (« seul un autre sens peut corriger l'erreur produite
          par un sens »), étendu par les instruments qui les prolongent
          (télescope, microscope, téléphone, stéthoscope) et coordonné par
          la raison.

          Le rôle de la raison est explicitement qualifié, pas laissé dans
          le vague : « secondaire, mais vital ». Ne rate pas ces deux mots à
          la fois — le texte ne fait pas de la raison l'auteure de la
          connaissance (ce serait un rationalisme), ni un simple ornement
          sans fonction réelle : elle « tisse le chaos des différents sens »
          en « résultats unifiés et coordonnés, exposés à la vérification et
          à la confirmation... par la sensation répétée ». Demande-toi
          toujours, comme pour un texte de méthode, « tout ça, c'est pour
          dire quoi ? » : la thèse n'est ni « les sens seuls suffisent » ni
          « la raison seule décide », c'est une position à deux étages —
          sens (source), raison (coordination) — que le texte tient
          ensemble du début à la fin, jusqu'à sa dernière phrase : « nous
          nous tenons debout... par le moyen de la sensation. »

      - id: q2
        part: "Partie 2 — Confronter au relativisme apparent (chapitre 9)"
        stem: |-
          Le texte affirme : « il n'existe pas de choses absolues, mais
          seulement des choses relatives », et compare la vérité à une
          « coupole de cristal » où chacun voit sa propre composition de
          couleurs. Ce langage ressemble-t-il au relativisme que le chapitre 9 met en
          garde ? Justifie en distinguant precisement ce que le texte
          affirme réellement de ce qu'il ne dit pas.
        reasoning: |-
          Le langage est trompeur si on l'isole de son contexte — et c'est
          exactement le piège que le chapitre 9 nomme : « chacun sa vérité ». Pris tout
          seul, « leurs vérités avec les nôtres » pourrait sembler dire que
          chaque sujet a sa vérité propre, aussi légitime qu'une autre —
          exactement le relativisme que le chapitre 9 réfute.

          Mais le texte, lu en entier, ne s'arrête pas là : il maintient,
          juste après cette image relativiste, l'exigence d'une
          coordination rationnelle vers « des résultats unifiés et
          coordonnés, exposés à la vérification et à la confirmation... par
          la sensation répétée ». Un vrai relativiste n'aurait aucune raison
          de chercher une coordination COMMUNE, ni de soumettre un résultat
          à une vérification qui pourrait le contredire — les deux gestes
          n'ont de sens que si une différence entre correct et incorrect
          existe encore à départager. C'est très exactement la distinction
          que le chapitre 9 pose entre fallibilisme (aucune certitude n'est jamais
          absolument garantie, mais un critère de vérité réel subsiste,
          révisable) et relativisme (aucune version ne vaut mieux qu'une
          autre) : la coupole de cristal, image frappante mais isolée,
          flirte avec le second ; la phrase sur la « vérification » et la
          « confirmation... par la sensation répétée » relève, elle, du
          premier — la démarche même que Popper (chapitre 8) attribue à la science
          corroborée, jamais prouvée absolument mais toujours soumise à
          l'épreuve. Une bonne copie doit nommer cette tension dans le texte
          lui-même, pas se contenter de citer l'une des deux phrases en
          ignorant l'autre.

      - id: q3
        part: "Partie 3 — Relier à un chapitre déjà connu (chapitre 5, Bachelard)"
        stem: |-
          Le texte se conclut ainsi : « nous nous tenons debout, fermes sur
          la terre, par le moyen de la sensation. » Que répondrait Bachelard
          (chapitre 5) à cette dernière phrase — la rejoint-il, ou la met-il en
          question ?
        reasoning: |-
          Il faut résister à la tentation de faire de Bachelard un allié
          immédiat de ce texte simplement parce que les deux parlent des
          sens et de la raison. Le texte prend bien la précaution de ne pas
          faire confiance à UN sens isolé — « un seul sens peut nous tromper
          » — ce qui ressemble, de loin, à une prudence bachelardienne
          contre l'évidence immédiate. Mais l'accord s'arrête là.

          Le texte finit par ancrer toute la connaissance dans la sensation
          ELLE-MÊME, prise dans son ensemble — « nous nous tenons debout...
          par le moyen de la sensation » est la toute dernière phrase, la
          conclusion, pas une réserve provisoire. Bachelard (chapitre 5) va
          beaucoup plus loin dans la méfiance : pour lui, l'évidence
          sensible en tant que TELLE — même coordonnée, même répétée — peut
          être un obstacle épistémologique, une résistance interne à
          l'esprit qu'il faut ROMPRE, pas seulement corriger sens par sens.
          « L'opinion pense mal ; elle ne pense pas » vaut aussi contre une
          confiance ultime dans le sentir, fût-il collectif et coordonné.

          La différence précise à formuler : ce texte corrige les sens PAR
          les sens (et par une raison qui les coordonne sans jamais les
          dépasser), alors que Bachelard exige une rupture active AVEC
          l'évidence sensible elle-même comme point de départ fiable — deux
          gestes qui se ressemblent en surface (tous deux se méfient d'UNE
          évidence isolée) mais divergent sur le fond (le texte reste
          fondé, en dernière instance, sur la sensation ; Bachelard ne l'est
          jamais). Confondre les deux, c'est manquer précisément ce qui fait
          l'originalité du geste bachelardien.

      - id: q4
        part: "Partie 4 — Objecter et discuter (chapitre 6, Descartes)"
        stem: |-
          Formule l'objection cartésienne (chapitre 6) à ce texte : pourquoi
          Descartes refuserait-il de fonder la vérité sur les sens, même
          coordonnés ? Cette objection réfute-t-elle le texte, ou seulement
          l'un de ses points faibles ?
        reasoning: |-
          L'objection : Descartes (chapitre 6) commence précisément par récuser les
          sens comme point de départ — « les sens m'ont déjà trompé par le
          passé... donc je ne peux plus leur accorder une confiance
          absolue » — et pousse le doute jusqu'à des vérités mathématiques
          elles-mêmes, bien au-delà de la simple prudence sensorielle que ce
          texte pratique. Du point de vue cartésien, corriger un sens par un
          autre sens ne résout rien : c'est rester à l'intérieur du même
          registre douteux (la sensation), sans jamais atteindre un point
          qui résiste absolument au doute, comme le fait le cogito.

          Pourquoi cette objection ne suffit pas à annuler le texte : elle
          suppose une exigence de certitude absolue que le texte ne
          revendique jamais pour lui-même — il parle explicitement de «
          probabilité de la vérité » qui diminue à mesure qu'on s'éloigne de
          la sensation immédiate, pas de certitude indubitable. Le texte
          n'essaie pas de rivaliser avec le cogito sur SON terrain (une
          certitude qui résiste à tout doute) ; il propose un critère
          praticable pour la connaissance ordinaire et scientifique, plus
          proche de la corroboration popperienne (chapitre 8) — toujours révisable,
          jamais absolument prouvée — que du projet cartésien d'une
          fondation indubitable. L'objection de Descartes est donc sérieuse
          contre toute PRÉTENTION à la certitude absolue que ce texte
          n'énonce d'ailleurs pas explicitement pour lui-même ; elle ne
          l'est pas contre un critère qui s'assume, dès le départ, comme
          probable et révisable plutôt qu'indubitable. Une bonne discussion
          nomme cette différence d'ambition plutôt que de déclarer l'un des
          deux textes simplement « faux ».

  # ── r-variation — FABRIQUÉE (aucun second texte vérifié disponible) ──────
