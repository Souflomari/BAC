  # fabricated twin rather than borrowing a second real sujet. To respect
  # the addendum's caution against manufacturing bad philosophy, the
  # fabricated stimulus below is a deliberately NAIVE claim to be examined
  # and refuted (not a subtle real philosophical position that could be
  # subtly misstated) — the same "sujet d'entraînement construit pour cette
  # leçon, pas un sujet d'examen authentique" disclaimer R9 already uses for
  # its own constructed dissertation sujet. French only (no fabricated
  # Arabic phrasing is invented, to avoid it reading as if it were an
  # authentic bac citation).
  - id: r-variation
    title: "Une variation pour ne pas mémoriser — la vérité et le nombre (sujet construit)"
    sourcing:
      status: not-applicable
    intro: |-
      **Sujet construit pour cette leçon — anti-mémorisation, pas un sujet
      d'examen national authentique** (contrairement à r-bac, un vrai sujet
      d'annales) :

      > « Ce que la majorité des gens croit avec le plus de force finit
      > toujours par devenir la vérité. »
      >
      > Consigne : explique et discute cette affirmation.

      Habillage différent, mêmes gestes que r-bac : dégager ce que la
      phrase affirme vraiment, la confronter à une théorie déjà enseignée,
      la relier à un chapitre déjà connu, puis discuter. Rien de nouveau à
      apprendre ici — seulement à reconnaître, sous un nouvel angle, ce que
      tu sais déjà de la vérité, de l'opinion et de la certitude.
    questions:
      - id: q1
        part: "Partie 1 — Dégager l'erreur"
        stem: |-
          Reformule précisément ce que cette affirmation confond, en
          t'appuyant sur les trois notions distinguées au chapitre 2.
        reasoning: |-
          L'affirmation fait deux mouvements en une seule phrase, qu'il faut
          séparer pour la comprendre. D'abord, elle décrit un phénomène
          social réel : une opinion largement et fermement partagée finit
          souvent par s'imposer dans les esprits, par habitude ou par
          pression du nombre. Ensuite, et c'est là l'erreur, elle en tire
          une conclusion qui ne suit pas : que cette généralisation de
          l'opinion FERAIT la vérité de l'énoncé — comme si la vérité était
          une conséquence causale de la force et de l'étendue d'une
          croyance.

          R1 distingue précisément ces deux plans : l'opinion (ce qu'un
          sujet, ou ici une majorité de sujets, tient pour vrai, à un degré
          de conviction qui lui est propre) et la vérité (une propriété de
          l'énoncé lui-même, indépendante de cette conviction — fût-elle
          partagée par tous). La phrase confond le fait qu'une opinion
          DEVIENNE majoritaire avec le fait qu'elle DEVIENNE vraie — deux
          choses qui n'ont, à ce stade, aucun rapport nécessaire entre
          elles.

      - id: q2
        part: "Partie 2 — Confronter à la correspondance (chapitre 3)"
        stem: |-
          Utilise le critère de correspondance d'Aristote (chapitre 3) pour montrer
          précisément pourquoi la majorité qui croit un énoncé n'est jamais
          ce qui LE REND vrai.
        reasoning: |-
          Le critère de correspondance (chapitre 3) est sans ambiguïté sur ce point :
          un énoncé est vrai s'il y a adéquation entre ce qu'il affirme et
          ce qui est réellement le cas — c'est le réel, et lui seul, qui
          rend un énoncé vrai ou faux, pas l'opinion de celui qui l'énonce,
          ni celle du plus grand nombre. Le texte du chapitre 3 le nomme
          explicitement comme une confusion à éviter : l'accord du plus
          grand nombre n'est ni la correspondance avec le réel, ni même la
          cohérence logique d'un système — un consensus, même large, peut
          parfaitement se tromper collectivement.

          Applique ce critère à la phrase : que la Terre tourne autour du
          Soleil est resté vrai pendant les siècles où la majorité croyait
          fermement le contraire (le modèle géocentrique de Ptolémée, chapitre 4) —
          la force et l'étendue de la croyance majoritaire n'ont, à aucun
          moment, changé ce qui était réellement le cas. La majorité peut
          se tromper ENSEMBLE, avec la même conviction sincère qu'une
          minorité qui aurait raison.

      - id: q3
        part: "Partie 3 — Relier à un chapitre déjà connu (chapitre 8, Popper)"
        stem: |-
          En quoi le raisonnement de Popper sur la confirmation (chapitre 8)
          s'applique-t-il, presque mot pour mot, à cette affirmation sur la
          majorité ?
        reasoning: |-
          Le parallèle est direct, presque une transposition. Popper (chapitre 8)
          montre qu'aucun nombre, même immense, d'observations confirmantes
          ne peut prouver définitivement qu'une loi générale est vraie : il
          suffirait d'un seul contre-exemple, découvert demain, pour réfuter
          d'un coup ce que des millions d'observations semblaient confirmer.

          Remplace « observations qui confirment » par « personnes qui
          croient » : le raisonnement ne change pas de nature. Qu'un très
          grand nombre de personnes tiennent un énoncé pour vrai ressemble à
          une accumulation de confirmations — et comme pour les
          observations de Popper, cette accumulation ne prouve jamais rien
          définitivement : il suffirait qu'un seul fait vienne contredire
          la croyance majoritaire pour la réfuter, quel qu'ait été le nombre
          de ceux qui la partageaient. La CONFIRMATION SOCIALE d'un énoncé
          (le nombre de gens qui y croient) et sa CORROBORATION (le fait
          d'avoir résisté à des tentatives sérieuses de le mettre en
          défaut) sont deux choses très différentes — seule la seconde a un
          rapport, même partiel et révisable, avec la vérité.

      - id: q4
        part: "Partie 4 — Objecter et discuter"
        stem: |-
          Y a-t-il malgré tout un grain de vérité dans cette affirmation ?
          Formule l'objection la plus forte qu'on pourrait lui opposer en sa
          faveur, puis explique pourquoi elle ne suffit pas à la sauver.
        reasoning: |-
          Le grain de vérité, à ne pas balayer trop vite : un consensus
          scientifique large n'est pas TOUJOURS sans rapport avec la vérité
          — quand il résulte d'une corroboration rigoureuse, répétée par
          des méthodes indépendantes (chapitre 8), l'accord d'un grand nombre de
          chercheurs a effectivement plus de chances de tracker le réel
          qu'une opinion isolée et non testée. On pourrait objecter que
          l'affirmation n'est donc pas absurde, seulement mal formulée :
          peut-être visait-elle ce genre de consensus scientifique
          construit, pas n'importe quelle opinion majoritaire.

          Pourquoi cette défense ne suffit pas à sauver la phrase telle
          qu'elle est formulée : elle confond encore deux choses que le chapitre 8 et
          R8 distinguent avec soin. Ce qui donne sa valeur au consensus
          scientifique n'est jamais LE NOMBRE de ceux qui y adhèrent, c'est
          la PROCÉDURE qui l'a produit — la mise à l'épreuve, l'exposition
          à la réfutation, la corroboration par des tests sévères et
          indépendants. Une croyance massive obtenue sans cette procédure
          (par répétition, par pression sociale, par habitude) — exactement
          ce que le chapitre 9 identifie comme le mécanisme de la propagande : «
          fabriquer de la certitude et un consensus apparent comme un
          succédané de vérité » — n'a, elle, aucun rapport avec le vrai,
          quel que soit le nombre de gens qu'elle rallie. La phrase, prise
          telle quelle, mélange ces deux mécanismes très différents sous un
          seul mot, « croit » : c'est précisément cette confusion, pas le
          fait de mentionner le nombre en général, qui la rend fausse.
