          n'aurait rendu la généralisation logiquement certaine.
      - id: C
        text: "Que les cygnes noirs prouvent que la nature n'est pas régulière, contrairement à ce que suppose tout raisonnement inductif."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          Surinterprète un contre-exemple isolé en une thèse générale sur
          l'irrégularité de la nature, alors que l'exemple illustre
          seulement la faille logique de l'induction.
      - id: D
        text: "Que l'observation de nombreux cygnes blancs ne constituait déjà, en elle-même, absolument aucune connaissance authentique, y compris avant même la découverte des cygnes noirs, puisque toute généralisation reposant sur l'expérience serait par nature dépourvue de valeur."
        correct: false
        misconception: mc.philo.theorie_experience.absence-preuve-egale-preuve-contraire
        feedback: >
          Confond « ne prouve pas définitivement » et « n'a aucune valeur »
          -- exactement l'erreur inverse déjà signalée dans l'encadré du chapitre 3.
    correct_feedback: >
      Voir mille cygnes blancs ne rend pas logiquement impossible qu'il en
      existe un d'une autre couleur -- aucune accumulation d'observations
      passées ne garantit une conclusion universelle.
    solution: |
      **Le point de Hume :** aucune quantité d'observations ne garantit
      logiquement une loi valable pour les cas non observés.

      **Ce que l'exemple ne montre pas :** ni un défaut de méthode, ni
      l'irrégularité de la nature -- seulement la limite logique de
      l'induction elle-même.

  - id: THEXP-13
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [hume, causalite, conjonction_constante]
    stem: >
      Quand une boule de billard heurte une seconde qui se met alors en
      mouvement, que perçoivent réellement les sens, selon Hume -- et
      qu'est-ce qu'ils ne perçoivent jamais ?
    type: mcq
    choices:
      - id: A
        text: "Les sens perçoivent directement la nécessité causale elle-même, exactement comme ils perçoivent une couleur ou un son, ce qui garantit avec certitude que la seconde boule devra toujours se mettre en mouvement dans des circonstances rigoureusement identiques."
        correct: false
        misconception: mc.philo.theorie_experience.necessite-causale-percue
        feedback: >
          Exact inverse de la thèse de Hume -- la nécessité causale n'est
          jamais perçue par les sens, seulement une conjonction constante
          entre deux événements.
      - id: B
        text: "Les sens ne perçoivent rien du tout dans cette situation, ni succession ni conjonction, seule la raison peut appréhender un tel événement."
        correct: false
        misconception: mc.philo.theorie_experience.necessite-causale-percue
        feedback: >
          Contredit Hume, qui affirme au contraire que les sens perçoivent
          bien la succession et sa répétition -- ce qu'ils ne perçoivent
          jamais, c'est le lien de nécessité.
      - id: C
        text: "Les sens perçoivent une succession répétée -- le contact puis le mouvement -- soit une conjonction constante ; ils ne perçoivent jamais le lien de nécessité lui-même, qui ferait que la seconde boule devait nécessairement se mettre en mouvement."
        correct: true
      - id: D
        text: "Les sens perçoivent la cause et l'effet séparément, mais aussi le raisonnement logique qui les relie nécessairement l'un à l'autre."
        correct: false
        misconception: mc.philo.theorie_experience.necessite-causale-percue
        feedback: >
          Attribue aux sens une opération de raisonnement logique que Hume
          leur refuse explicitement -- percevoir n'est pas raisonner sur un
          lien de nécessité.
    correct_feedback: >
      Les sens ne perçoivent jamais qu'une conjonction constante entre deux
      événements -- jamais le lien de nécessité lui-même.
    solution: |
      **Ce que les sens perçoivent :** une succession répétée entre deux
      événements (conjonction constante).

      **Ce qu'ils ne perçoivent jamais :** le lien de nécessité qui ferait
      de l'un la cause de l'autre.

  - id: THEXP-14
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [claude_bernard, hypothese, methode_experimentale]
    stem: >
      Bernard résume sa thèse centrale par la formule « Celui qui ne sait
      pas ce qu'il cherche ne comprend pas ce qu'il trouve. » Que
      signifie-t-elle exactement ?
    type: mcq
    choices:
      - id: A
        text: "Sans hypothèse préalable qui oriente ce qu'il faut observer, un chercheur peut accumuler des observations pendant des années sans jamais rien découvrir, parce qu'il ne sait pas ce que ces observations signifient."
        correct: true
      - id: B
        text: "Il vaut mieux ignorer complètement ce qu'on cherche, et même s'interdire de formuler la moindre hypothèse à l'avance, pour ne jamais influencer, par ses préjugés personnels, ce qu'on va ensuite observer sur le terrain."
        correct: false
        misconception: mc.philo.theorie_experience.observation-passive-suffit
        feedback: >
          Exact inverse de la thèse de Bernard, déjà signalé comme l'erreur
          à éviter du chapitre 4 -- sans idée directrice, l'observation la plus
          attentive ne mène nulle part.
      - id: C
        text: "Cette formule signifie que seuls les chercheurs déjà expérimentés et reconnus par leurs pairs peuvent véritablement comprendre leurs résultats, contrairement aux débutants qui, quelle que soit leur hypothèse, ne sauraient rien en tirer d'utile."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Transforme une exigence méthodologique (avoir une hypothèse
          précise) en une question d'ancienneté professionnelle, ce que la
          formule ne dit pas.
      - id: D
        text: "Cette formule signifie qu'il faut connaître à l'avance le résultat exact de l'expérience, dans le moindre détail, pour qu'elle ait la moindre valeur scientifique, sans quoi toute la démarche expérimentale perdrait entièrement son sens."
        correct: false
        misconception: mc.philo.theorie_experience.corroboration-egale-preuve-definitive
        feedback: >
          Confond avoir une hypothèse précise à tester avec connaître déjà
          la réponse -- ce qui viderait l'expérience de tout son sens,
          puisqu'il n'y aurait alors plus rien à découvrir.
    correct_feedback: >
      Sans idée directrice, un chercheur peut observer pendant des années
      sans rien découvrir, faute de savoir ce que ces observations
      signifient.
    solution: |
      **Le geste central :** une hypothèse précède toujours l'expérience et
      décide ce qui compte comme un résultat pertinent.

      **Ce que la formule ne dit pas :** ni qu'il faut observer sans idée
      préconçue, ni qu'il faut déjà connaître la réponse.

  - id: THEXP-15
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [claude_bernard, bachelard, obstacle_epistemologique]
    stem: >
      En quoi la thèse de Bernard sur l'idée préconçue rejoint-elle, sous
      une autre forme, le geste que Bachelard défend à propos de la
      connaissance scientifique en général (chapitre 5 de « La vérité ») ?
    type: mcq
    choices:
      - id: A
        text: "Les deux soutiennent que l'observation scientifique doit toujours se faire sans aucune hypothèse préalable, pour rester la plus neutre, la plus pure et la plus rigoureusement objective possible, en toute circonstance et sans exception."
        correct: false
        misconception: mc.philo.theorie_experience.observation-passive-suffit
        feedback: >
          Contredit à la fois Bernard et Bachelard, qui rejettent tous deux
          l'idée d'une observation neutre et sans théorie directrice.
      - id: B
        text: "Bachelard et Bernard s'opposent en réalité sur ce point précis : Bachelard défend l'observation neutre, tandis que Bernard exige une hypothèse préalable."
        correct: false
        misconception: mc.philo.theorie_experience.observation-passive-suffit
        feedback: >
          Oppose faussement deux auteurs qui convergent exactement sur ce
          point, selon le parallèle explicite établi par la leçon.
      - id: C
        text: "Les deux affirment que seule l'expérimentation en laboratoire, et jamais l'observation de terrain, peut produire une connaissance scientifique valable."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Introduit une opposition méthodologique (laboratoire contre
          terrain) qu'aucun des deux auteurs ne défend dans la leçon.
      - id: D
        text: "Les deux refusent l'idée d'une lecture immédiate et neutre du réel : la connaissance ne reçoit jamais passivement des faits donnés, elle est orientée par une théorie, ou en rupture avec l'évidence première."
        correct: true
    correct_feedback: >
      Bernard (l'idée préconçue) et Bachelard (la rupture avec l'évidence
      première) refusent tous deux une lecture immédiate et neutre du réel.
    solution: |
      **Le point commun :** aucune connaissance ne part d'une observation
      brute et neutre.

      **Chez Bernard :** une hypothèse oriente l'observation. **Chez
      Bachelard :** la connaissance rompt avec l'évidence spontanée.

  - id: THEXP-16
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [popper, falsifiabilite, grand_mere]
    stem: >
      Selon le chapitre 5, en quoi la formulation « ça marche, je l'ai vu » de
      grand-mère diffère-t-elle d'une hypothèse falsifiable comme « la
      tisane raccourcit la durée du rhume, comparée à l'absence de
      traitement » ?
    type: mcq
    choices:
      - id: A
        text: "La formulation de grand-mère n'interdit aucun résultat observable possible -- elle est compatible avec n'importe quelle issue, y compris un rhume plus long (« ça a quand même sûrement aidé ») -- alors que l'hypothèse falsifiable interdit précisément un résultat (l'absence de différence entre les deux groupes)."
        correct: true
      - id: B
        text: "La formulation de grand-mère est plus scientifique, car elle repose sur une observation directe et répétée, contrairement à l'hypothèse abstraite du chercheur."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          Inverse le critère de Popper, qui juge scientifique une théorie
          falsifiable, non une théorie simplement confirmée par la
          répétition.
      - id: C
        text: "Les deux formulations sont en réalité équivalentes, puisqu'elles portent toutes deux sur l'efficacité de la même tisane."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          Confond identité du sujet traité et identité de structure logique
          -- c'est justement la falsifiabilité, pas le sujet, qui distingue
          les deux formulations.
      - id: D
        text: "La formulation de grand-mère est fausse par définition et ne mérite donc aucune considération, alors que l'hypothèse du chercheur est vraie par définition et digne d'une confiance absolue, du simple fait d'avoir été formulée par un scientifique reconnu, diplômé, et travaillant dans un laboratoire équipé des instruments les plus modernes."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Confond falsifiabilité (une propriété logique de la formulation)
          et vérité déterminée par l'autorité de celui qui parle.
    correct_feedback: >
      Seule l'hypothèse falsifiable interdit un résultat précis ; la
      formulation de grand-mère absorbe n'importe quel résultat sans jamais
      courir de risque.
    solution: |
      **La formulation testable :** interdit un résultat précis (aucune
      différence entre les groupes).

      **La formulation de grand-mère :** compatible avec n'importe quelle
      issue -- jamais mise sérieusement à l'épreuve.

  - id: THEXP-17
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [popper, corroboration, erreur_a_eviter]
    stem: >
      D'après l'« Erreur à éviter » du chapitre 5, que faut-il penser d'une
      hypothèse falsifiable qui a résisté à un test sérieusement construit
      pour la mettre en défaut ?
    type: mcq
    choices:
      - id: A
        text: "Elle est désormais prouvée définitivement vraie, une fois pour toutes et sans plus aucun doute possible, puisqu'elle a survécu avec succès à un test rigoureux spécialement conçu pour tenter de la réfuter."
        correct: false
        misconception: mc.philo.theorie_experience.corroboration-egale-preuve-definitive
        feedback: >
          Confond corroboration et preuve définitive -- une erreur déjà
          écartée aux chapitres 3 et 5, aucune hypothèse n'atteint jamais une
          certitude absolue de cette façon.
      - id: B
        text: "Elle sort renforcée, corroborée -- ce qui est très différent d'une conviction qu'aucune observation possible n'aurait jamais pu mettre en défaut faute d'avoir été formulée de façon testable."
        correct: true
      - id: C
        text: "Elle n'a en réalité aucune valeur scientifique particulière, puisque avoir résisté à un test sérieusement construit pour la réfuter n'est jamais, au fond, qu'une pure question de chance, comparable à un simple coup de dés répété plusieurs fois."
        correct: false
        misconception: mc.philo.theorie_experience.corroboration-egale-preuve-definitive
        feedback: >
          Dévalue à tort la corroboration -- résister à un test sérieusement
          construit pour réfuter l'hypothèse constitue au contraire un
          renforcement réel, non un simple hasard.
      - id: D
        text: "Elle doit être aussitôt abandonnée et considérée comme fausse, puisque le simple fait d'avoir été mise à l'épreuve d'un test de réfutation, quel qu'en soit le résultat, suffit à lui seul à la disqualifier définitivement aux yeux de la science."
        correct: false
        misconception: mc.philo.theorie_experience.corroboration-egale-preuve-definitive
        feedback: >
          Confond avoir été exposée au risque de réfutation et avoir été
          effectivement réfutée -- ce sont deux issues bien distinctes.
    correct_feedback: >
      Une hypothèse qui résiste à un test sérieux sort corroborée --
      renforcée sans jamais devenir une preuve définitive.
    solution: |
      **Corroborée, pas prouvée :** résister à un test rigoureux renforce
      l'hypothèse sans jamais la rendre définitivement certaine.

      **Ce qui la distingue de la conviction de grand-mère :** avoir été
      réellement exposée au risque d'être mise en défaut.

  - id: THEXP-18
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [kant, a_priori, causalite]
    stem: >
      Selon Kant, pourquoi grand-mère relie-t-elle spontanément, sans même y
      penser, la tisane bue et la guérison sous l'idée d'une cause -- alors
      que Hume (chapitre 3) a montré qu'aucun sens ne perçoit jamais la nécessité
      causale elle-même ?
    type: mcq
    choices:
      - id: A
        text: "Parce que la causalité est un concept a priori de son entendement, une forme que son esprit applique spontanément à ce qu'il perçoit pour organiser une succession d'événements en un lien causal pensable -- ce concept ne vient donc ni de la seule expérience, ni de la seule raison coupée de toute expérience."
        correct: true
      - id: B
        text: "Parce que la causalité est une impression sensible parmi d'autres, que grand-mère a fini par percevoir directement après quarante ans de répétition."
        correct: false
        misconception: mc.philo.theorie_experience.necessite-causale-percue
        feedback: >
          Exactement ce que Hume et Kant excluent tous deux -- la nécessité
          causale n'est jamais une impression sensible perçue directement.
      - id: C
        text: "Parce que la causalité est une idée innée, présente toute faite dans son esprit avant même toute expérience et portant déjà un contenu déterminé sur le monde."
        correct: false
        misconception: mc.philo.theorie_experience.a-priori-confondu-avec-inne
        feedback: >
          Confond l'a priori kantien, une forme vide de contenu propre, avec
          une idée innée porteuse d'un contenu -- exactement l'erreur
          signalée par l'encadré du chapitre 6.
      - id: D
        text: "Parce que grand-mère raisonne, sans le savoir ni s'en douter le moins du monde, exactement comme un rationaliste cartésien pur et dur qui n'aurait strictement besoin d'aucune donnée sensible, ni tisane bue ni guérison observée, pour connaître quoi que ce soit du monde qui l'entoure, à aucun moment de sa vie."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          Ignore la moitié empiriste de la synthèse kantienne -- il faut
          bien que la sensibilité fournisse une matière, la tisane bue, la
          guérison observée.
    correct_feedback: >
      La causalité est une forme a priori de l'entendement, appliquée à une
      matière donnée par la sensibilité -- ni pure impression, ni pure idée
      innée.
    solution: |
      **Le concept en jeu :** la causalité, forme a priori de l'entendement,
      pas une impression sensible.

      **Ce qu'il faut malgré tout :** une matière donnée par la sensibilité
      (la tisane bue, la guérison observée).

  - id: THEXP-19
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [kant, erreur_a_eviter, synthese]
    stem: >
      D'après l'« Erreur à éviter » du chapitre 6, pourquoi est-il inexact de
      présenter la position de Kant comme un simple compromis mou entre
      empirisme et rationalisme ?
    type: mcq
    choices:
      - id: A
        text: "Parce que Kant est en réalité un pur empiriste, qui ne fait que reformuler la thèse de Hume avec un vocabulaire différent."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          Réduit Kant à l'un des deux camps que sa synthèse dépasse
          précisément.
      - id: B
        text: "Parce que Kant est en réalité un pur rationaliste, qui ne fait que reformuler la thèse de Descartes avec un vocabulaire différent."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          Même erreur inversée -- réduit Kant à l'autre camp, ce que sa
          synthèse dépasse tout autant.
      - id: C
        text: "Parce que Kant montre pourquoi aucune des deux thèses, prise séparément, ne peut rendre compte de la connaissance -- la sensibilité et l'entendement doivent nécessairement collaborer."
        correct: true
      - id: D
        text: "Parce qu'il n'existe, en réalité, aucune différence substantielle entre un compromis mou et une position philosophique construite et originale à part entière -- toute cette distinction n'aurait, au fond, aucun sens philosophique véritable."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          Évacue la question plutôt que d'y répondre, en ignorant ce que la
          leçon établit précisément sur la nécessité de la collaboration des
          deux facultés.
    correct_feedback: >
      Kant ne mélange pas les deux thèses : il montre pourquoi ni l'une ni
      l'autre, séparément, ne suffit à rendre compte de la connaissance.
    solution: |
      **Ce que Kant refuse :** réduire sa position à un simple mélange des
      deux camps.

      **Ce qu'il établit :** la sensibilité et l'entendement collaborent
      nécessairement, chacune apportant ce que l'autre ne peut fournir
      seule.

  - id: THEXP-20
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [kant, synthese, temps_causalite]
    stem: >
      Selon le chapitre 7, que rappellerait Kant à propos de la simple perception de
      grand-mère -- « j'ai bu, puis j'ai guéri » ?
    type: mcq
    choices:
      - id: A
        text: "Que même cette perception la plus simple suppose déjà, silencieusement, des formes qui ne viennent jamais de la seule expérience -- le temps qui ordonne le « puis », la causalité qui relie les deux événements -- si bien que sa conviction n'est ni une pure lecture de l'expérience brute, ni une pure construction de la raison seule."
        correct: true
      - id: B
        text: "Que cette perception est une pure donnée des sens, sans aucune intervention de l'entendement, exactement comme le soutient l'empirisme le plus strict."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          Contredit directement la thèse kantienne du chapitre 6, qui exige la
          collaboration nécessaire de la sensibilité et de l'entendement.
      - id: C
        text: "Que cette perception est entièrement construite par la raison toute seule, indépendamment de toute donnée sensible quelle qu'elle soit, sans que les sens mêmes de grand-mère -- la tisane bue, la guérison observée -- n'y jouent jamais le moindre rôle réel, la raison suffisant à elle seule à produire la totalité du contenu de cette conviction."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          Erreur inverse -- ignore la matière sensible que la sensibilité
          doit nécessairement fournir, selon Kant lui-même.
      - id: D
        text: "Que cette perception est totalement indépendante de toute question de causalité, puisque grand-mère ne fait que constater deux événements séparés et sans lien logique entre eux, sans jamais chercher, même inconsciemment, à les relier l'un à l'autre sous quelque forme que ce soit."
        correct: false
        misconception: mc.philo.theorie_experience.a-priori-confondu-avec-inne
        feedback: >
          Contredit le texte, qui affirme précisément que grand-mère relie
          les deux événements sous l'idée d'une cause, spontanément et sans
          y penser.
    correct_feedback: >
      Même la perception la plus simple de grand-mère suppose déjà des
      formes a priori (le temps, la causalité) qui ne viennent pas de la
      seule expérience.
    solution: |
      **Ce que Kant ajoute au chapitre 3 :** la simple succession perçue par
      grand-mère est déjà organisée par des formes a priori.

      **Ce que cela règle :** ni pure expérience brute, ni pure construction
      rationnelle -- une synthèse nécessaire des deux.

