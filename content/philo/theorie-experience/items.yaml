      - id: B
        text: "La science peut-elle un jour être complètement achevée, au point qu'il ne resterait plus rien à découvrir ni à corriger ? Et existe-t-il, quelque part, des vérités éternelles que rien ne pourrait jamais remettre en cause ?"
        correct: false
        misconception: mc.philo.theorie_experience.probleme-philosophique-reduit
        feedback: >
