      - id: D
        text: "Parce que Bachelard pense que quarante ans d'observation constituent, en réalité, une expérimentation rigoureuse au sens de Claude Bernard."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Confond l'obstacle épistémologique bachelardien avec la méthode
          expérimentale de Bernard (chapitre 4), deux points distincts de la leçon.
    correct_feedback: >
      Pour Bachelard, la certitude la plus immédiate est le genre d'évidence
      spontanée qu'il faut rompre, et non un point de départ fiable.
    solution: |
      **L'obstacle épistémologique (rappel chapitre 5 de « La vérité ») :** une évidence
      spontanée à rompre, pas à confirmer.

      **Application à grand-mère :** sa certitude répétée est justement le
      type d'évidence que la connaissance doit mettre à l'épreuve.

  - id: THEXP-22
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [dissertation, analyse_des_termes, popper]
    stem: >
      Dans l'analyse des termes du sujet « Une théorie scientifique
      peut-elle être prouvée par l'expérience ? », pourquoi le mot
      « prouvée » doit-il attirer une attention particulière ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'il suggère une démonstration définitive, close, qui ne pourrait plus jamais être remise en cause -- exactement ce que le problème de l'induction (chapitre 3) et le critère de Popper (chapitre 5) refusent d'accorder à quelque théorie scientifique que ce soit."
        correct: true
      - id: B
        text: "Parce qu'il s'agit d'un terme purement juridique et technique, totalement étranger au vocabulaire philosophique habituel des classes de terminale, qu'il faudrait par conséquent éviter soigneusement d'employer dans une copie de dissertation digne de ce nom."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Mécomprend l'exercice d'analyse des termes, qui porte sur le sens
          philosophique du mot dans le sujet, pas sur son origine lexicale.
      - id: C
        text: "Parce qu'il faudrait comprendre « prouvée » comme un synonyme exact et interchangeable de « observée », ce qui rendrait aussitôt le sujet trivial, purement descriptif, et totalement dépourvu du moindre intérêt philosophique réel."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          Aplatit la distinction entre observer et prouver, alors que c'est
          précisément cet écart que le sujet met en question.
      - id: D
        text: "Parce que ce mot n'a, en réalité, strictement aucune importance particulière pour traiter ce sujet correctement : seule l'expression « théorie scientifique » mériterait, selon cette lecture, d'être véritablement analysée en détail dans la copie."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Ignore que l'analyse des termes porte sur chaque mot-clé du sujet,
          dont « prouvée » est ici l'un des plus décisifs.
    correct_feedback: >
      « Prouvée » suggère une démonstration définitive -- exactement ce que les chapitres 3 et 5 refusent d'accorder à toute théorie scientifique.
    solution: |
      **Le piège du mot :** il suggère une clôture définitive, jamais
      accordée par l'induction ni par le critère de Popper.

      **Ce que l'analyse des termes exige :** interroger chaque mot-clé, pas
      seulement l'expression centrale du sujet.

  - id: THEXP-23
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [dissertation, problematique]
    stem: >
      Pourquoi la problématique proposée pour ce sujet ne se contente-t-elle
      pas de reformuler la question de départ, mais fait apparaître une
      tension véritable ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'elle oppose la position de grand-mère, avec ses quarante années d'observations répétées, à celle d'un scientifique professionnel équipé d'un laboratoire, ce qui suffirait à lui seul, selon cette lecture, à constituer une tension philosophique digne d'une dissertation entière."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Confond l'exemple concret, utile pour illustrer, avec la tension
          conceptuelle elle-même, qui porte sur des thèses, pas sur des
          personnes.
      - id: B
        text: "Parce qu'une bonne problématique doit toujours reformuler le sujet avec des mots plus compliqués, pour donner une impression de profondeur."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Méconnaît ce qu'est une problématique -- une reformulation
          stylistique n'en est pas une, à la différence d'une mise en
          tension de deux thèses.
      - id: C
        text: "Parce qu'elle affirme d'emblée que l'expérience ne peut jamais rien prouver, réglant ainsi la question avant même le développement."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Une problématique ne tranche pas le sujet à l'avance, elle ouvre
          une tension à examiner -- trancher d'emblée manquerait précisément
          la problématisation.
      - id: D
        text: "Parce qu'elle met face à face deux points également fondés par la leçon : l'expérience semble être le juge ultime d'une théorie (chapitres 4 et 5), et pourtant aucune accumulation d'observations confirmantes ne peut jamais, logiquement, prouver une théorie de façon définitive (chapitres 3 et 5)."
        correct: true
    correct_feedback: >
      Une problématique met en tension deux points également fondés, sans
      trancher à l'avance -- ici, l'expérience comme juge, et son
      incapacité logique à prouver définitivement.
    solution: |
      **Ce qu'une problématique n'est pas :** ni une reformulation
      stylistique, ni une réponse donnée d'avance.

      **Ce qu'elle fait ici :** confronte deux points fondés (l'expérience
      comme juge / l'impossibilité logique de prouver) sans trancher.

  - id: THEXP-24
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [dissertation, plan_dialectique, depassement]
    stem: >
      Dans le plan dialectique proposé (thèse / antithèse / dépassement),
      quel est le rôle précis de la partie III, le « dépassement » ?
    type: mcq
    choices:
      - id: A
        text: "Répéter, avec d'autres exemples, exactement les arguments déjà développés dans l'antithèse, pour les renforcer par accumulation."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Confond dépassement et répétition -- un dépassement doit apporter
          un élément nouveau qui résout la tension, pas la reformuler avec
          d'autres exemples.
      - id: B
        text: "Montrer que renoncer à la preuve absolue n'oblige pas à renoncer à toute exigence de rigueur : une théorie exposée au risque de la réfutation mérite confiance, sans devenir équivalente à une conviction non testée."
        correct: true
      - id: C
        text: "Revenir purement et simplement à la thèse de la partie I, en admettant que l'antithèse s'était trompée depuis le début."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Méconnaît la logique du plan dialectique -- le dépassement
          n'annule pas l'antithèse, il élabore une position qui intègre ce
          que thèse et antithèse ont chacune établi de valable.
      - id: D
        text: "Introduire un exemple totalement nouveau, sans aucun lien véritable ou pertinent avec les parties précédentes, uniquement pour montrer l'étendue impressionnante de sa propre culture philosophique personnelle au correcteur."
        correct: false
        misconception: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Un dépassement doit répondre à la tension construite par les deux
          parties précédentes, pas constituer une digression déconnectée.
    correct_feedback: >
      Le dépassement montre que renoncer à la preuve absolue n'oblige pas à
      renoncer à toute exigence de rigueur -- sans confondre théorie testée
      et conviction non testée.
    solution: |
      **Ce que le dépassement n'est pas :** ni une répétition de
      l'antithèse, ni un retour pur à la thèse, ni une digression.

      **Ce qu'il fait :** intègre ce que thèse et antithèse ont chacune
      établi, sans effacer leur tension par un relativisme facile.

