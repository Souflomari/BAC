          resterait une pure spéculation.
      - id: B
        text: "Une théorie qui ne serait jamais confrontée à aucune expérience, aussi rigoureuse soit-elle sur le papier, resterait une pure spéculation, sans aucun moyen de savoir si elle décrit quoi que ce soit du monde réel."
        correct: true
      - id: C
        text: "Le problème est que le laboratoire coûte cher et prend du temps, ce qui rend cette exigence peu réaliste en pratique."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Déplace la question vers un obstacle matériel et pratique, alors
          que le chapitre 1 pose un problème épistémologique -- l'absence de toute
          confrontation au réel, pas le coût d'un dispositif.
      - id: D
        text: "Le problème est que grand-mère aurait alors raison, puisque aucune preuve rigoureuse n'existerait pour la contredire."
        correct: false
        misconception: mc.philo.theorie_experience.absence-preuve-egale-preuve-contraire
        feedback: >
          Non-séquitur -- l'absence de preuve rigoureuse contre la tisane ne
          donne pas non plus raison à grand-mère ; le chapitre 1 ne tranche jamais en
