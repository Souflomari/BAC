        correct: true
      - id: C
        text: "Parce que Bachelard, contrairement à ce qu'affirme explicitement « La vérité » (chapitre 5) à ce sujet, considère au contraire que les évidences spontanées et immédiatement ressenties sont, en toutes circonstances, le meilleur point de départ possible pour construire une connaissance rigoureuse et durable."
        correct: false
        misconception: mc.philo.theorie_experience.evidence-spontanee-fiable
        feedback: >
          Inverse exactement la thèse bachelardienne de l'obstacle
