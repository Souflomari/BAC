notion: theorie-experience
skill_code: philo_theorie_experience
misconceptions: []

items:
  - id: THEXP-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_theorie_experience
    tags: [empirisme, rationalisme, hume, descartes]
    stem: >
      Selon la distinction entre empirisme et rationalisme construite en R1,
      qu'est-ce qui oppose fondamentalement la position de Hume à celle de
      Descartes ?
    type: mcq
    choices:
      - id: A
        text: "Hume pense que la raison seule peut établir des vérités certaines, indépendamment de toute expérience, tandis que Descartes réduit toute connaissance à l'expérience sensible et fait de l'observation la seule source du savoir."
        correct: false
        feedback: >
          C'est exactement l'inverse des deux positions : c'est Hume
          l'empiriste (toute connaissance vient des impressions sensibles) et
          Descartes le rationaliste (certaines vérités sont accessibles à la
          raison seule, indépendamment des sens).
      - id: B
        text: "Les deux soutiennent en réalité la même position sur la source de la connaissance, sous un vocabulaire différent."
        correct: false
        feedback: >
          Empirisme et rationalisme sont deux réponses rivales, et non
          équivalentes, à la question de savoir d'où vient la connaissance --
          l'expérience seule pour l'un, la raison seule (au moins pour
          certaines vérités) pour l'autre.
      - id: C
        text: "Hume et Descartes s'opposent seulement sur l'existence de Dieu, pas sur la source de la connaissance."
        correct: false
        feedback: >
          Ce n'est pas l'axe de désaccord construit dans cette leçon : R1
          oppose les deux philosophes précisément sur la source de la
          connaissance (expérience sensible contre raison seule), pas sur une
          autre question.
      - id: D
        text: "Hume ramène toute connaissance, même la plus abstraite, à des impressions sensibles, quand Descartes admet des vérités -- le cogito, la nature de la cire -- accessibles à la raison seule, indépendamment des sens."
        correct: true
    correct_feedback: >
      Hume (empirisme) ramène toute idée à des impressions sensibles ;
      Descartes (rationalisme) soutient qu'au moins certaines vérités sont
      accessibles à la raison seule, indépendamment de toute expérience
      sensible.
    solution: |
      **L'empirisme (Hume) :** toute idée, même abstraite, se décompose en
      éléments simples qui se ramènent à des impressions sensibles -- aucune
      idée n'est innée, indépendante de toute expérience antérieure.

      **Le rationalisme (Descartes) :** certaines vérités (le cogito, la
      nature de la cire au-delà de ses qualités sensibles changeantes) sont
      établies par un jugement de l'entendement, pas par les sens.

      **Ce que R1 en tire :** deux réponses rivales à la question de la
      source de la connaissance, que R5 (Kant) viendra plus tard articuler
      l'une à l'autre plutôt que trancher en faveur de l'une seule.

  - id: THEXP-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [hume, induction, causalite]
    stem: >
      Grand-mère a bu sa tisane à chaque rhume pendant quarante ans, et a
      toujours guéri en quelques jours, sans exception. Que montre, selon la
      critique humienne de l'induction (R2), cette suite d'observations
      concordantes ?
    type: mcq
    choices:
      - id: A
        text: "Qu'elle prouve, avec une quasi-certitude, que la tisane est bien efficace et qu'elle est la cause de la guérison, puisqu'aucune exception n'a jamais été observée en quarante ans d'usage répété, sans le moindre échec ni la moindre exception."
        correct: false
        feedback: >
          C'est exactement l'erreur inductiviste que Hume dénonce : voir mille
          cygnes blancs ne prouve pas que tous les cygnes le sont -- aucune
          longueur de la série d'observations, même sans exception, ne rend
          une conclusion universelle logiquement certaine.
      - id: B
        text: "Qu'elle ne prouve rigoureusement rien, et qu'il faut donc conclure que la tisane n'a aucun effet."
        correct: false
        feedback: >
          L'absence de preuve définitive de l'efficacité de la tisane ne
          prouve pas non plus son inefficacité -- c'est l'erreur inverse,
          explicitement signalée dans l'encadré « Erreur à éviter » de R2.
      - id: C
        text: "Qu'elle établit au mieux une conjonction constante entre tisane et guérison, sans prouver que la tisane en est la cause ni qu'elle marchera encore : aucune accumulation d'observations passées ne garantit une conclusion universelle."
        correct: true
      - id: D
        text: "Qu'elle prouve seulement que grand-mère croit sincèrement en sa tisane, ce qui suffit à en garantir l'efficacité réelle."
        correct: false
        feedback: >
          C'est confondre certitude (la conviction, sincère, de grand-mère) et
          vérité ou efficacité réelle -- une conviction, même totale, ne rend
          jamais, à elle seule, un énoncé vrai.
    correct_feedback: >
      Quarante ans de confirmations établissent une conjonction constante,
      jamais une preuve logique : aucune accumulation d'observations passées
      ne garantit une conclusion universelle, ni un lien de cause à effet.
    solution: |
      **Le problème de l'induction (Hume) :** aucun nombre d'observations
      passées ne peut logiquement garantir une conclusion universelle valable
      pour tous les cas -- le principe même de régularité de la nature qui
      sous-tend l'induction ne peut être prouvé ni par la raison seule ni par
      l'expérience sans cercle vicieux.

      **La cause n'est jamais observée :** on ne perçoit qu'une succession
      répétée (conjonction constante) entre deux événements -- jamais le lien
      de nécessité lui-même.

      **Application au cas de R0 :** tisane puis guérison, répété quarante
      ans, reste une conjonction constante -- pas une preuve que la tisane est
      la cause de la guérison.

  - id: THEXP-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [claude_bernard, methode_experimentale, hypothese]
    stem: >
      Selon Claude Bernard, en quoi une expérience scientifique diffère-t-elle
      d'une simple observation, comme celle de grand-mère qui se contente de
      constater, année après année, que sa tisane est suivie d'une guérison ?
    type: mcq
    choices:
      - id: A
        text: "L'expérience part d'une hypothèse formulée à l'avance, qui fixe quoi observer et comment le tester (groupe traité contre groupe non traité) ; l'observation de grand-mère ne fait qu'enregistrer des cas favorables, sans rien isoler ni comparer."
        correct: true
      - id: B
        text: "L'expérience scientifique consiste seulement à répéter l'observation un plus grand nombre de fois, jusqu'à atteindre un nombre de cas suffisant pour conclure avec assurance, sans jamais formuler la moindre hypothèse préalable ni construire de comparaison entre des conditions différentes."
        correct: false
        feedback: >
          Cela reste une simple accumulation inductive (le problème même de
          R2), pas une expérimentation au sens de Bernard -- ce qui manque,
          ce n'est pas plus de répétitions, mais une hypothèse et une
          comparaison qui rendent le résultat capable de trancher.
      - id: C
        text: "L'expérience scientifique consiste à observer sans aucune idée préconçue, pour ne pas influencer ce qu'on va constater."
        correct: false
        feedback: >
          C'est l'inverse exact de la thèse de Bernard : sans idée
          directrice, l'observation la plus attentive ne mène nulle part --
          « celui qui ne sait pas ce qu'il cherche ne comprend pas ce qu'il
          trouve ».
      - id: D
        text: "L'expérience scientifique se distingue seulement parce qu'elle est menée par un professionnel plutôt que par une personne ordinaire."
        correct: false
        feedback: >
          Le critère de Bernard n'est pas social ou institutionnel (qui mène
          l'expérience) mais méthodologique : une hypothèse précise et un
          dispositif de comparaison qui expose cette hypothèse au risque
          d'être mise en défaut.
    correct_feedback: >
      Une expérience part toujours d'une hypothèse qui décide ce qu'il faut
      observer et comment le tester ; une simple observation, même répétée
      quarante ans, ne compare rien et ne peut jamais trancher.
    solution: |
      **Observer / expérimenter :** observer, c'est constater un phénomène
      tel qu'il se présente ; expérimenter, c'est provoquer une variation
      précise pour tester une hypothèse.

      **Le geste central de Bernard :** une idée préconçue doit précéder
      l'expérience et orienter ce qu'on va y chercher -- sans elle, aucune
      observation, même minutieuse, ne devient une découverte.

      **Le protocole appliqué à R0 :** isoler la variable (groupe traité /
      non traité), prédire ce que l'hypothèse implique, puis seulement
      observer le résultat -- une démarche que quarante ans d'observation non
      guidée ne permettent jamais.

  - id: THEXP-4
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [popper, falsifiabilite, claude_bernard]
    stem: >
      En quoi la méthode expérimentale de Claude Bernard (R3) met-elle
      concrètement en pratique le critère de falsifiabilité de Popper (R4,
      déjà rencontré en la-verite R7) ?
    type: mcq
    choices:
      - id: A
        text: "En accumulant le plus grand nombre possible d'observations favorables à l'hypothèse, jusqu'à ce qu'elle devienne certaine et qu'aucun doute ne subsiste, sans jamais construire de test qui pourrait, en principe, la mettre en défaut ou chercher à la réfuter par une observation contraire."
        correct: false
        feedback: >
          C'est reproduire exactement la confusion inductiviste que R2 et R4
          rejettent toutes les deux : la falsifiabilité ne consiste pas à
          empiler des confirmations, mais à construire un test qui pourrait,
          en principe, réfuter l'hypothèse.
      - id: B
        text: "En construisant une expérience dont le résultat prédit serait interdit si l'hypothèse était fausse (aucune différence entre groupe traité et non traité), l'expérimentateur expose l'hypothèse à la réfutation, ce qu'aucune observation sans hypothèse ne permet."
        correct: true
      - id: C
        text: "En modifiant l'hypothèse après coup pour qu'elle explique n'importe quel résultat observé, quel qu'il soit."
        correct: false
        feedback: >
          C'est exactement le geste que Popper condamne -- celui du modèle de
          Ptolémée, qui absorbait toute observation gênante en ajoutant un
          épicycle sans jamais rien risquer -- l'inverse de la falsifiabilité.
      - id: D
        text: "En s'assurant que l'expérience confirme toujours la théorie de départ, pour ne jamais avoir à la remettre en cause."
        correct: false
        feedback: >
          C'est l'inverse de la logique popperienne : une théorie qui ne
          pourrait jamais échouer à son propre test n'est pas scientifique --
          le protocole de Bernard est construit pour permettre la réfutation,
          pas pour la garantir.
    correct_feedback: >
      Le protocole de Bernard (groupe traité / non traité, résultat prédit à
      l'avance) expose réellement l'hypothèse au risque d'être réfutée --
      exactement ce que le critère de falsifiabilité de Popper exige d'une
      théorie scientifique.
    solution: |
      **Le critère de Popper (rappel de la-verite, R7) :** une théorie est
      scientifique si elle interdit certains résultats observables, de sorte
      qu'une observation future pourrait la réfuter.

      **Ce que Bernard ajoute :** il montre comment construire, concrètement,
      une expérience qui met en pratique ce critère -- une comparaison entre
      groupes conçue pour qu'un résultat précis (l'absence de différence)
      puisse réfuter l'hypothèse.

      **La logique et la pratique :** Popper donne la logique (pourquoi la
      confirmation ne prouve jamais rien) ; Bernard en donne la mise en
      œuvre dans un protocole expérimental.

  - id: THEXP-5
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [kant, a_priori, a_posteriori]
    stem: >
      Selon Kant, comment faut-il comprendre la formule « des pensées sans
      contenu sont vides, des intuitions sans concepts sont aveugles » ?
    type: mcq
    choices:
      - id: A
        text: "Kant affirme, comme l'empirisme, que toute connaissance dérive uniquement de l'expérience sensible, sans qu'aucun concept a priori de l'entendement ne soit jamais nécessaire pour l'organiser ou la mettre en forme."
        correct: false
        feedback: >
          C'est mal lire Kant comme un pur empiriste : « des intuitions sans
          concepts sont aveugles » dit précisément le contraire -- la
          sensibilité seule, sans les concepts de l'entendement, ne produit
          aucune connaissance.
      - id: B
        text: "Kant affirme, comme le rationalisme, que la raison seule, sans le secours d'aucune expérience, peut connaître le contenu du monde réel."
        correct: false
        feedback: >
          C'est mal lire Kant comme un pur rationaliste : « des pensées sans
          contenu sont vides » dit précisément que les concepts seuls, sans
          la matière fournie par l'expérience, ne donnent non plus aucune
          connaissance.
      - id: C
        text: "Les concepts a priori de l'entendement sont des idées innées qui contiennent déjà, avant toute expérience, une information précise sur le monde."
        correct: false
        feedback: >
          C'est confondre l'a priori kantien -- une forme vide de tout
          contenu propre, qui ne produit une connaissance qu'appliquée à une
          matière donnée par l'expérience -- avec une idée innée qui porterait
          déjà, en elle-même, un contenu sur le monde.
      - id: D
        text: "La sensibilité fournit la matière (a posteriori, donnée par l'expérience), l'entendement la forme (des concepts a priori comme la causalité) qui l'organise ; ni l'une ni l'autre ne suffit seule à connaître."
        correct: true
    correct_feedback: >
      La connaissance suppose toujours deux éléments : la matière donnée par
      la sensibilité (a posteriori) et la forme fournie par l'entendement (les
      concepts a priori) -- ni l'une ni l'autre ne suffit seule.
    solution: |
      **La sensibilité :** fournit la matière (a posteriori) -- ce qui est
      donné par l'expérience, à travers les formes de l'espace et du temps.

      **L'entendement :** fournit la forme (a priori) -- des concepts comme
      la causalité, universels et nécessaires, qui organisent cette matière.

      **Ce que cela règle (R1) :** l'empirisme a raison sur le point de
      départ (la matière vient de l'expérience) mais tort d'en faire toute la
      connaissance ; le rationalisme a raison sur l'existence de structures
      a priori mais tort de croire qu'elles suffisent sans matière sensible.

  - id: THEXP-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [fallibilisme, relativisme, synthese]
    stem: >
      Après tout ce parcours (R1 à R5), quelle conclusion est correcte à
      propos de la conviction de grand-mère et d'une hypothèse testée selon la
      méthode de Bernard ?
    type: mcq
    choices:
      - id: A
        text: "Puisqu'aucune théorie scientifique n'est jamais prouvée avec une certitude absolue, la conviction de grand-mère et une hypothèse rigoureusement testée se valent finalement autant l'une que l'autre."
        correct: false
        feedback: >
          C'est confondre le fallibilisme (aucune connaissance n'est
          absolument et définitivement certaine) avec le relativisme (toutes
          les convictions se valent) -- exactement l'erreur déjà signalée en
          la-verite, R8 : l'une des deux démarches a été exposée au risque de
          la réfutation, l'autre non.
      - id: B
        text: "Puisque la méthode de Bernard permet de tester une hypothèse, elle permet forcément d'arriver à une certitude absolue, contrairement à la conviction non testée de grand-mère."
        correct: false
        feedback: >
          Cela contredit R2 et R4 : même une hypothèse rigoureusement testée
          et corroborée n'est jamais prouvée avec une certitude absolue --
          elle reste seulement non-encore-réfutée.
      - id: C
        text: "Elles diffèrent : la conviction de grand-mère n'a jamais été formulée de façon à pouvoir être réfutée, alors qu'une hypothèse testée selon Bernard a été réellement exposée au risque d'être mise en défaut -- sans qu'aucune des deux n'atteigne jamais une certitude absolue."
        correct: true
      - id: D
        text: "La conviction de grand-mère est en réalité plus fiable, puisqu'elle repose sur quarante années d'expérience personnelle directe et sans faille, alors que la méthode de Bernard ne repose que sur des groupes artificiellement construits en laboratoire, loin de toute expérience réelle."
        correct: false
        feedback: >
          C'est l'inverse du point établi par la leçon : quarante ans
          d'observation non guidée (R2) ne prouvent logiquement rien, tandis
          que le dispositif comparatif de Bernard (R3) est précisément ce qui
          expose l'hypothèse à un risque réel de réfutation.
    correct_feedback: >
      Ni la conviction de grand-mère ni l'hypothèse la mieux testée
      n'atteignent une certitude absolue -- mais seule la seconde a été
      réellement exposée au risque d'être réfutée, ce qui les distingue
      nettement malgré l'absence commune de preuve définitive.
    solution: |
      **Le fallibilisme :** aucune théorie, même la mieux corroborée, n'est
      jamais prouvée avec une certitude absolue et définitive (R2, R4).

      **Ce que le fallibilisme n'implique pas :** que toute conviction se
      vaille -- confondre les deux serait tomber dans le relativisme, une
      erreur distincte déjà signalée dans la-verite (R8).

      **Le critère qui les distingue malgré tout :** avoir été, ou non,
      formulée et exposée de façon à pouvoir être réfutée par une observation
      précise -- ce que la conviction de grand-mère n'a jamais fait, et ce que
      le protocole de Bernard fait par construction.
