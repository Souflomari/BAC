      - id: D
        text: "Faut-il préférer, une bonne fois pour toutes et sans retour possible, l'empirisme au rationalisme, ou au contraire l'inverse, sans jamais chercher à articuler ensemble ces deux sources rivales de la connaissance humaine ?"
        correct: false
