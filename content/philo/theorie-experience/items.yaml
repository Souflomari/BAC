notion: theorie-experience
skill_code: philo_theorie_experience

# Misconception inventory — summit-conversion campaign (Gap-4 fix: this file
# previously carried `misconceptions: []`, no tags on any distractor).
# Id convention: mc.philo.<slug>.<name>, where <slug> is skill_code with the
# "philo_" prefix stripped (philo_theorie_experience → theorie_experience) —
# matches the precedent set in content/philo/la-liberte/items.yaml and
# content/philo/analyse-de-texte/items.yaml.
# Built by reading the lesson (R0-R7) rung by rung: the six rungs R1-R6 each
# carry an explicit "Erreur à éviter" box (recipe's mandated primary source —
# mine these first), which yields most of the inventory below; the remaining
# tags cover distractors that target a real wrong model central to a rung's
# content but not literally boxed (R0's opening dilemma; Hume's causality
# point in R2; R7's dissertation-method errors, cross-checked for shared
# vocabulary against la-liberte's own methode-dissertation-appliquee-
# mecaniquement, per the recipe's instruction — same tag name kept, own
# namespace). critere-scientifique-reduit-a-falsifiabilite is NEW: it comes
# from the r-bac conventionalist/coherentist نص (docs/sujets/philo/theorie-
# experience.md, 2024 session normale), an axis (a rival, non-falsifiability
# criterion for scientific character) this lesson's R0-R7 body does not teach
# directly — see the coverage_summary note below for the honest floor gap
# this opens.

misconceptions:
  - id: mc.philo.theorie_experience.faux-dilemme-confirmation-rejet
    label: "« Il faut choisir entre confirmation totale = preuve et expérience non scientifique = sans valeur » (le dilemme d'ouverture)"
    description: >-
      L'élève traite les deux réponses spontanées du chapitre 1 (« 40 ans sans
      exception, c'est une preuve » / « seul le laboratoire compte, le reste
      ne vaut rien ») comme un choix exhaustif entre lequel il faudrait
      trancher, sans voir qu'aucune des deux, prise seule, ne rend compte du
      problème que la leçon va construire.
    contradicts_principle: >-
      Ni l'accumulation de confirmations sans exception ni le rejet en bloc
      de toute expérience non contrôlée ne suffit : la première n'exclut pas
      une explication concurrente (la guérison naturelle du rhume), le second
      réduirait toute théorie non testée à une pure spéculation.

  - id: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
    label: "« Empirisme et rationalisme ne sont pas deux réponses vraiment rivales »"
    description: >-
      L'élève n'arrive pas à garder l'empirisme (Hume) et le rationalisme
      (Descartes) comme deux réponses distinctes et rivales à la question de
      la source de la connaissance — en inversant les auteurs, en les
      déclarant équivalents, en désignant un mauvais axe de désaccord, ou en
      transformant leur articulation possible (chapitres 2 et 6) en un choix binaire
      forcé.
    contradicts_principle: >-
      Hume ramène toute idée à des impressions sensibles (aucune idée n'est
      innée) ; Descartes soutient qu'au moins certaines vérités (le cogito,
      la cire) sont accessibles à la raison seule, indépendamment des sens —
      deux réponses rivales, pas un désaccord de vocabulaire ni un faux choix.

  - id: mc.philo.theorie_experience.rationalisme-rejette-observation
    label: "« Le rationalisme dit qu'il ne faut jamais observer »"
    description: >-
      L'élève réduit l'opposition empirisme/rationalisme à « il faut
      observer » contre « il ne faut jamais observer », alors que le
      rationalisme n'exclut pas l'observation : il soutient seulement
      qu'elle ne suffit jamais seule à établir certaines vérités.
    contradicts_principle: >-
      Le rationalisme ne rejette pas l'observation en bloc — il soutient
      qu'elle doit être encadrée, interprétée, jugée par la raison, et
      qu'elle ne suffit jamais seule pour certaines vérités (mathématiques,
      métaphysiques).

  - id: mc.philo.theorie_experience.confirmation-egale-preuve
    label: "« Accumuler des confirmations, c'est prouver »"
    description: >-
      L'élève traite un grand nombre d'observations ou de résultats
      favorables — même répétés pendant des décennies, même sans la moindre
      exception apparente — comme une preuve logique et définitive, plutôt
      que comme une corroboration qui reste, par principe, révisable.
    contradicts_principle: >-
      Aucun nombre d'observations passées ne peut logiquement garantir une
      conclusion universelle valable pour tous les cas, y compris ceux qu'on
      n'a jamais observés — voir mille cygnes blancs ne prouve pas que tous
      les cygnes le sont.

  - id: mc.philo.theorie_experience.absence-preuve-egale-preuve-contraire
    label: "« Ne pas pouvoir prouver que ça marche, c'est prouver que ça ne marche pas »"
    description: >-
      L'élève confond l'absence de preuve définitive en faveur d'une
      hypothèse avec une preuve de son inefficacité ou de sa fausseté — un
      glissement inverse et symétrique de « confirmer = prouver ».
    contradicts_principle: >-
      L'absence de preuve définitive en faveur de la tisane ne prouve pas
      davantage son inefficacité : ne pas pouvoir démontrer qu'une chose
      marche n'est pas la même chose que démontrer qu'elle ne marche pas.

  - id: mc.philo.theorie_experience.observation-passive-suffit
    label: "« Observer beaucoup, sans hypothèse ni comparaison, suffit à faire de la science »"
    description: >-
      L'élève confond l'accumulation d'observations passives — répéter,
      constater, attendre — avec l'expérimentation véritable, qui suppose
      toujours une hypothèse préalable et un dispositif de comparaison
      construit pour exposer cette hypothèse à un risque réel d'échec.
    contradicts_principle: >-
      Une expérience part toujours d'une idée préconçue qui décide à
      l'avance ce qu'il faut observer et comment le tester ; sans elle, un
      chercheur peut accumuler des observations pendant des années sans
      jamais rien découvrir — « celui qui ne sait pas ce qu'il cherche ne
      comprend pas ce qu'il trouve. »

  - id: mc.philo.theorie_experience.corroboration-egale-preuve-definitive
    label: "« Une hypothèse qui a résisté à un test est prouvée avec certitude — ou alors résister à un test ne prouve rien »"
    description: >-
      L'élève confond deux issues distinctes : soit il traite une hypothèse
      corroborée (ayant résisté à un test sérieusement construit pour la
      réfuter) comme définitivement et absolument prouvée, soit il
      dévalorise à tort cette même corroboration comme n'ayant aucune valeur
      réelle.
    contradicts_principle: >-
      Une hypothèse qui résiste à un test sérieusement construit pour la
      réfuter sort renforcée, corroborée — ce qui est très différent d'une
      preuve définitive, et très différent aussi d'une conviction qu'aucune
      observation n'aurait jamais pu mettre en défaut faute d'avoir été
      formulée de façon testable.

  - id: mc.philo.theorie_experience.a-priori-confondu-avec-inne
    label: "« L'a priori kantien est une idée innée qui porte déjà un contenu sur le monde »"
    description: >-
      L'élève confond la forme a priori de l'entendement chez Kant — vide de
      tout contenu propre, qui ne produit une connaissance qu'appliquée à
      une matière donnée par l'expérience — avec une idée innée, présente
      toute faite dans l'esprit et porteuse d'un contenu déterminé sur le
      monde avant toute expérience.
    contradicts_principle: >-
      L'a priori kantien (la causalité, l'espace, le temps) est une forme,
      une structure vide de contenu propre : elle ne produit une
      connaissance qu'appliquée à une matière donnée par la sensibilité —
      ce n'est jamais une idée innée porteuse d'un contenu déjà déterminé.

  - id: mc.philo.theorie_experience.kant-reduit-a-compromis
    label: "« Kant n'est qu'un empiriste, qu'un rationaliste, ou qu'un compromis mou entre les deux »"
    description: >-
      L'élève réduit la synthèse kantienne à l'un des deux camps qu'elle
      dépasse (pur empirisme, pur rationalisme) ou à un simple mélange sans
      nécessité logique des deux thèses, sans voir que la sensibilité et
      l'entendement doivent nécessairement collaborer, chacune apportant ce
      que l'autre ne peut pas fournir seule.
    contradicts_principle: >-
      « Sans la sensibilité, aucun objet ne nous serait donné ; sans
      l'entendement, aucun ne serait pensé » : ni l'empirisme (qui réduit
      tout à l'expérience) ni le rationalisme (qui se passerait de
      l'expérience) ne rendent compte, seuls, de la connaissance — et ce
      n'est pas un compromis, mais une collaboration nécessaire.

  - id: mc.philo.theorie_experience.fallibilisme-confondu-relativisme
    label: "« Puisqu'aucune preuve n'est absolue, toute conviction en vaut une autre »"
    description: >-
      L'élève confond le fallibilisme (aucune connaissance scientifique
      n'est jamais absolument et définitivement certaine) avec le
      relativisme (toute conviction ou théorie se vaudrait, faute de
      certitude absolue) — deux thèses distinctes que la leçon distingue
      explicitement à sa clôture.
    contradicts_principle: >-
      La conviction de grand-mère et une hypothèse rigoureusement testée
      selon la méthode de Bernard ne sont pas logées à la même enseigne :
      l'une n'a jamais été exposée au risque d'être réfutée, l'autre l'a été
      et y a, éventuellement, résisté — cette différence sépare une
      connaissance qui progresse d'une conviction qui se répète.

  - id: mc.philo.theorie_experience.critere-scientifique-reduit-a-falsifiabilite
    label: "« Le seul critère possible du caractère scientifique d'une théorie est la falsifiabilité »"
    description: >-
      L'élève suppose que tout texte portant sur ce qui rend une théorie
      scientifique doit nécessairement reconduire le critère de Popper
      (falsifiabilité, chapitre 5), sans envisager qu'un texte puisse défendre un
      critère rival — par exemple un critère de cohérence interne entre les
      composantes d'un système théorique, indépendant de l'exposition au
      risque de la réfutation expérimentale.
    contradicts_principle: >-
      Le texte de r-bac défend que le critère de vérité des lois et théories
      n'est pas l'expérience mais la cohérence entre leurs composantes, et
      qu'« il est impossible de trouver une expérience qui réfute
      totalement une hypothèse ou la confirme de façon décisive » — une
      position qui n'invoque jamais la falsifiabilité comme critère.

  - id: mc.philo.theorie_experience.methode-dissertation-appliquee-mecaniquement
    label: "« Les gestes de la méthode (problématiser, construire un plan) sont interchangeables ou décoratifs »"
    description: >-
      L'élève traite la problématisation comme une simple reformulation du
      sujet, confond un exemple illustratif avec la tension conceptuelle
      elle-même, ou méconnaît la fonction précise d'une partie du plan
      dialectique (thèse, antithèse, dépassement), en la traitant comme une
      répétition, un retour en arrière ou une digression plutôt qu'un geste
      à fonction propre.
    contradicts_principle: >-
      Une problématique met en évidence une tension entre deux positions
      également légitimes en apparence — elle ne reformule pas le sujet ; et
      chaque partie d'un plan dialectique a une fonction précise (poser la
      thèse intuitive, la fragiliser, puis dépasser la tension sans
      l'annuler), non interchangeable avec les autres.

  - id: mc.philo.theorie_experience.critere-methodologique-mal-identifie
    label: "« Ce qui rend une démarche scientifique, c'est qui la mène, son coût, ou son étiquette — pas sa méthode »"
    description: >-
      L'élève attribue le caractère scientifique ou rigoureux d'une démarche
      à un critère social, matériel ou lexical (le statut professionnel de
      qui l'exécute, son coût, son origine étymologique) plutôt qu'au
      critère méthodologique réel : une hypothèse précise exposée à un
      dispositif de comparaison ou de réfutation.
    contradicts_principle: >-
      Le critère de Bernard n'est pas social ou institutionnel (qui mène
      l'expérience) mais méthodologique : une hypothèse précise et un
      dispositif de comparaison qui expose cette hypothèse au risque d'être
      mise en défaut.

  - id: mc.philo.theorie_experience.probleme-philosophique-reduit
    label: "« Les questions générales que pose le chapitre 1 se réduisent à l'anecdote de la tisane »"
    description: >-
      L'élève réduit les deux questions philosophiques générales que le chapitre 1
      annonce (la source de la connaissance ; la neutralité possible de
      l'observation) à l'anecdote concrète elle-même, à une question sans
      rapport, ou à un choix forcé entre deux camps, plutôt que de les
      reconnaître comme les deux questions ouvertes que toute la leçon va
      construire.
    contradicts_principle: >-
      R0 annonce deux questions générales, non anecdotiques : d'où vient la
      connaissance (expérience seule, raison seule, ou leur articulation) et
      l'observation peut-elle jamais être neutre, ou est-elle toujours déjà
      orientée par une théorie.

  - id: mc.philo.theorie_experience.necessite-causale-percue
    label: "« Les sens perçoivent directement le lien de nécessité causale »"
    description: >-
      L'élève croit que la nécessité causale elle-même — ce qui ferait
      qu'un effet DOIT se produire — est directement perçue par les sens,
      plutôt que seulement une conjonction constante (succession répétée)
      entre deux événements, qui est tout ce que Hume accorde à la
      perception.
    contradicts_principle: >-
      Quand une boule de billard en heurte une seconde, les sens perçoivent
      une succession répétée — le contact, puis le mouvement — jamais le
      lien de nécessité lui-même, qui ferait que la seconde boule *devait*
      nécessairement se mettre en mouvement.

  - id: mc.philo.theorie_experience.evidence-spontanee-fiable
    label: "« La certitude la plus immédiate est le meilleur point de départ pour connaître »"
    description: >-
      L'élève traite une certitude spontanée, jamais interrogée — comme
      celle de grand-mère (« je l'ai vu, encore et encore ») — comme un
      point de départ fiable pour la connaissance, plutôt que comme un
      obstacle épistémologique (Bachelard) qu'il faudrait activement
      rompre pour progresser.
    contradicts_principle: >-
      La connaissance ne se construit jamais en confirmant simplement ce
      qu'on croyait déjà, mais en rompant avec l'évidence spontanée pour la
      mettre activement à l'épreuve — la certitude la plus immédiate est
      précisément le genre d'évidence qu'il faut interroger, pas un point de
      départ fiable.

items:
  - id: THEXP-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_theorie_experience
    tags: [empirisme, rationalisme, hume, descartes]
    stem: >
      Selon la distinction entre empirisme et rationalisme construite au chapitre 2,
      qu'est-ce qui oppose fondamentalement la position de Hume à celle de
      Descartes ?
    type: mcq
    choices:
      - id: A
        text: "Hume pense que la raison seule peut établir des vérités certaines, indépendamment de toute expérience, tandis que Descartes réduit toute connaissance à l'expérience sensible et fait de l'observation la seule source du savoir."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          C'est exactement l'inverse des deux positions : c'est Hume
          l'empiriste (toute connaissance vient des impressions sensibles) et
          Descartes le rationaliste (certaines vérités sont accessibles à la
          raison seule, indépendamment des sens).
      - id: B
        text: "Les deux soutiennent en réalité la même position sur la source de la connaissance, sous un vocabulaire différent."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          Empirisme et rationalisme sont deux réponses rivales, et non
          équivalentes, à la question de savoir d'où vient la connaissance --
          l'expérience seule pour l'un, la raison seule (au moins pour
          certaines vérités) pour l'autre.
      - id: C
        text: "Hume et Descartes s'opposent seulement sur l'existence de Dieu, pas sur la source de la connaissance."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          Ce n'est pas l'axe de désaccord construit dans cette leçon : Le chapitre 2 oppose les deux philosophes précisément sur la source de la
          connaissance (expérience sensible contre raison seule), pas sur une
          autre question.
      - id: D
        text: "Hume ramène toute connaissance, même la plus abstraite, à des impressions sensibles, quand Descartes admet des vérités -- le cogito, la nature de la cire -- accessibles à la raison seule, indépendamment des sens."
        correct: true
    correct_feedback: >
      Hume (empirisme) ramène toute idée à des impressions sensibles ;
      Descartes (rationalisme) soutient qu'au moins certaines vérités sont
      accessibles à la raison seule, indépendamment de toute expérience
      sensible.
    solution: |
      **L'empirisme (Hume) :** toute idée, même abstraite, se décompose en
      éléments simples qui se ramènent à des impressions sensibles -- aucune
      idée n'est innée, indépendante de toute expérience antérieure.

      **Le rationalisme (Descartes) :** certaines vérités (le cogito, la
      nature de la cire au-delà de ses qualités sensibles changeantes) sont
      établies par un jugement de l'entendement, pas par les sens.

      **Ce que le chapitre 2 en tire :** deux réponses rivales à la question de la
      source de la connaissance, que le chapitre 6 (Kant) viendra plus tard articuler
      l'une à l'autre plutôt que trancher en faveur de l'une seule.

  - id: THEXP-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [hume, induction, causalite]
    stem: >
      Grand-mère a bu sa tisane à chaque rhume pendant quarante ans, et a
      toujours guéri en quelques jours, sans exception. Que montre, selon la
      critique humienne de l'induction (chapitre 3), cette suite d'observations
      concordantes ?
    type: mcq
    choices:
      - id: A
        text: "Qu'elle prouve, avec une quasi-certitude, que la tisane est bien efficace et qu'elle est la cause de la guérison, puisqu'aucune exception n'a jamais été observée en quarante ans d'usage répété, sans le moindre échec ni la moindre exception."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          C'est exactement l'erreur inductiviste que Hume dénonce : voir mille
          cygnes blancs ne prouve pas que tous les cygnes le sont -- aucune
          longueur de la série d'observations, même sans exception, ne rend
          une conclusion universelle logiquement certaine.
      - id: B
        text: "Qu'elle ne prouve rigoureusement rien, et qu'il faut donc conclure que la tisane n'a aucun effet."
        correct: false
        misconception: mc.philo.theorie_experience.absence-preuve-egale-preuve-contraire
        feedback: >
          L'absence de preuve définitive de l'efficacité de la tisane ne
          prouve pas non plus son inefficacité -- c'est l'erreur inverse,
          explicitement signalée dans l'encadré « Erreur à éviter » du chapitre 3.
      - id: C
        text: "Qu'elle établit au mieux une conjonction constante entre tisane et guérison, sans prouver que la tisane en est la cause ni qu'elle marchera encore : aucune accumulation d'observations passées ne garantit une conclusion universelle."
        correct: true
      - id: D
        text: "Qu'elle prouve seulement que grand-mère croit sincèrement en sa tisane, ce qui suffit à en garantir l'efficacité réelle."
        correct: false
        misconception: mc.philo.theorie_experience.faux-dilemme-confirmation-rejet
        feedback: >
          C'est confondre certitude (la conviction, sincère, de grand-mère) et
          vérité ou efficacité réelle -- une conviction, même totale, ne rend
          jamais, à elle seule, un énoncé vrai.
    correct_feedback: >
      Quarante ans de confirmations établissent une conjonction constante,
      jamais une preuve logique : aucune accumulation d'observations passées
      ne garantit une conclusion universelle, ni un lien de cause à effet.
    solution: |
      **Le problème de l'induction (Hume) :** aucun nombre d'observations
      passées ne peut logiquement garantir une conclusion universelle valable
      pour tous les cas -- le principe même de régularité de la nature qui
      sous-tend l'induction ne peut être prouvé ni par la raison seule ni par
      l'expérience sans cercle vicieux.

      **La cause n'est jamais observée :** on ne perçoit qu'une succession
      répétée (conjonction constante) entre deux événements -- jamais le lien
      de nécessité lui-même.

      **Application au cas du chapitre 1 :** tisane puis guérison, répété quarante
      ans, reste une conjonction constante -- pas une preuve que la tisane est
      la cause de la guérison.

  - id: THEXP-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [claude_bernard, methode_experimentale, hypothese]
    stem: >
      Selon Claude Bernard, en quoi une expérience scientifique diffère-t-elle
      d'une simple observation, comme celle de grand-mère qui se contente de
      constater, année après année, que sa tisane est suivie d'une guérison ?
    type: mcq
    choices:
      - id: A
        text: "L'expérience part d'une hypothèse formulée à l'avance, qui fixe quoi observer et comment le tester (groupe traité contre groupe non traité) ; l'observation de grand-mère ne fait qu'enregistrer des cas favorables, sans rien isoler ni comparer."
        correct: true
      - id: B
        text: "L'expérience scientifique consiste seulement à répéter l'observation un plus grand nombre de fois, jusqu'à atteindre un nombre de cas suffisant pour conclure avec assurance, sans jamais formuler la moindre hypothèse préalable ni construire de comparaison entre des conditions différentes."
        correct: false
        misconception: mc.philo.theorie_experience.observation-passive-suffit
        feedback: >
          Cela reste une simple accumulation inductive (le problème même de
          chapitre 3), pas une expérimentation au sens de Bernard -- ce qui manque,
          ce n'est pas plus de répétitions, mais une hypothèse et une
          comparaison qui rendent le résultat capable de trancher.
      - id: C
        text: "L'expérience scientifique consiste à observer sans aucune idée préconçue, pour ne pas influencer ce qu'on va constater."
        correct: false
        misconception: mc.philo.theorie_experience.observation-passive-suffit
        feedback: >
          C'est l'inverse exact de la thèse de Bernard : sans idée
          directrice, l'observation la plus attentive ne mène nulle part --
          « celui qui ne sait pas ce qu'il cherche ne comprend pas ce qu'il
          trouve ».
      - id: D
        text: "L'expérience scientifique se distingue seulement parce qu'elle est menée par un professionnel plutôt que par une personne ordinaire."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Le critère de Bernard n'est pas social ou institutionnel (qui mène
          l'expérience) mais méthodologique : une hypothèse précise et un
          dispositif de comparaison qui expose cette hypothèse au risque
          d'être mise en défaut.
    correct_feedback: >
      Une expérience part toujours d'une hypothèse qui décide ce qu'il faut
      observer et comment le tester ; une simple observation, même répétée
      quarante ans, ne compare rien et ne peut jamais trancher.
    solution: |
      **Observer / expérimenter :** observer, c'est constater un phénomène
      tel qu'il se présente ; expérimenter, c'est provoquer une variation
      précise pour tester une hypothèse.

      **Le geste central de Bernard :** une idée préconçue doit précéder
      l'expérience et orienter ce qu'on va y chercher -- sans elle, aucune
      observation, même minutieuse, ne devient une découverte.

      **Le protocole appliqué au chapitre 1 :** isoler la variable (groupe traité /
      non traité), prédire ce que l'hypothèse implique, puis seulement
      observer le résultat -- une démarche que quarante ans d'observation non
      guidée ne permettent jamais.

  - id: THEXP-4
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [popper, falsifiabilite, claude_bernard]
    stem: >
      En quoi la méthode expérimentale de Claude Bernard (chapitre 4) met-elle
      concrètement en pratique le critère de falsifiabilité de Popper (chapitre 5,
      déjà rencontré au chapitre 8 de « La vérité ») ?
    type: mcq
    choices:
      - id: A
        text: "En accumulant le plus grand nombre possible d'observations favorables à l'hypothèse, jusqu'à ce qu'elle devienne certaine et qu'aucun doute ne subsiste, sans jamais construire de test qui pourrait, en principe, la mettre en défaut ou chercher à la réfuter par une observation contraire."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          C'est reproduire exactement la confusion inductiviste que les chapitres 3 et 5
          rejettent toutes les deux : la falsifiabilité ne consiste pas à
          empiler des confirmations, mais à construire un test qui pourrait,
          en principe, réfuter l'hypothèse.
      - id: B
        text: "En construisant une expérience dont le résultat prédit serait interdit si l'hypothèse était fausse (aucune différence entre groupe traité et non traité), l'expérimentateur expose l'hypothèse à la réfutation, ce qu'aucune observation sans hypothèse ne permet."
        correct: true
      - id: C
        text: "En modifiant l'hypothèse après coup pour qu'elle explique n'importe quel résultat observé, quel qu'il soit."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          C'est exactement le geste que Popper condamne -- celui du modèle de
          Ptolémée, qui absorbait toute observation gênante en ajoutant un
          épicycle sans jamais rien risquer -- l'inverse de la falsifiabilité.
      - id: D
        text: "En s'assurant que l'expérience confirme toujours la théorie de départ, pour ne jamais avoir à la remettre en cause."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          C'est l'inverse de la logique popperienne : une théorie qui ne
          pourrait jamais échouer à son propre test n'est pas scientifique --
          le protocole de Bernard est construit pour permettre la réfutation,
          pas pour la garantir.
    correct_feedback: >
      Le protocole de Bernard (groupe traité / non traité, résultat prédit à
      l'avance) expose réellement l'hypothèse au risque d'être réfutée --
      exactement ce que le critère de falsifiabilité de Popper exige d'une
      théorie scientifique.
    solution: |
      **Le critère de Popper (rappel du chapitre 8 de « La vérité ») :** une théorie est
      scientifique si elle interdit certains résultats observables, de sorte
      qu'une observation future pourrait la réfuter.

      **Ce que Bernard ajoute :** il montre comment construire, concrètement,
      une expérience qui met en pratique ce critère -- une comparaison entre
      groupes conçue pour qu'un résultat précis (l'absence de différence)
      puisse réfuter l'hypothèse.

      **La logique et la pratique :** Popper donne la logique (pourquoi la
      confirmation ne prouve jamais rien) ; Bernard en donne la mise en
      œuvre dans un protocole expérimental.

  - id: THEXP-5
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_theorie_experience
    tags: [kant, a_priori, a_posteriori]
    stem: >
      Selon Kant, comment faut-il comprendre la formule « des pensées sans
      contenu sont vides, des intuitions sans concepts sont aveugles » ?
    type: mcq
    choices:
      - id: A
        text: "Kant affirme, comme l'empirisme, que toute connaissance dérive uniquement de l'expérience sensible, sans qu'aucun concept a priori de l'entendement ne soit jamais nécessaire pour l'organiser ou la mettre en forme."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          C'est mal lire Kant comme un pur empiriste : « des intuitions sans
          concepts sont aveugles » dit précisément le contraire -- la
          sensibilité seule, sans les concepts de l'entendement, ne produit
          aucune connaissance.
      - id: B
        text: "Kant affirme, comme le rationalisme, que la raison seule, sans le secours d'aucune expérience, peut connaître le contenu du monde réel."
        correct: false
        misconception: mc.philo.theorie_experience.kant-reduit-a-compromis
        feedback: >
          C'est mal lire Kant comme un pur rationaliste : « des pensées sans
          contenu sont vides » dit précisément que les concepts seuls, sans
          la matière fournie par l'expérience, ne donnent non plus aucune
          connaissance.
      - id: C
        text: "Les concepts a priori de l'entendement sont des idées innées qui contiennent déjà, avant toute expérience, une information précise sur le monde."
        correct: false
        misconception: mc.philo.theorie_experience.a-priori-confondu-avec-inne
        feedback: >
          C'est confondre l'a priori kantien -- une forme vide de tout
          contenu propre, qui ne produit une connaissance qu'appliquée à une
          matière donnée par l'expérience -- avec une idée innée qui porterait
          déjà, en elle-même, un contenu sur le monde.
      - id: D
        text: "La sensibilité fournit la matière (a posteriori, donnée par l'expérience), l'entendement la forme (des concepts a priori comme la causalité) qui l'organise ; ni l'une ni l'autre ne suffit seule à connaître."
        correct: true
    correct_feedback: >
      La connaissance suppose toujours deux éléments : la matière donnée par
      la sensibilité (a posteriori) et la forme fournie par l'entendement (les
      concepts a priori) -- ni l'une ni l'autre ne suffit seule.
    solution: |
      **La sensibilité :** fournit la matière (a posteriori) -- ce qui est
      donné par l'expérience, à travers les formes de l'espace et du temps.

      **L'entendement :** fournit la forme (a priori) -- des concepts comme
      la causalité, universels et nécessaires, qui organisent cette matière.

      **Ce que cela règle (chapitre 2) :** l'empirisme a raison sur le point de
      départ (la matière vient de l'expérience) mais tort d'en faire toute la
      connaissance ; le rationalisme a raison sur l'existence de structures
      a priori mais tort de croire qu'elles suffisent sans matière sensible.

  - id: THEXP-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_theorie_experience
    tags: [fallibilisme, relativisme, synthese]
    stem: >
      Après tout ce parcours (chapitres 2 à 6), quelle conclusion est correcte à
      propos de la conviction de grand-mère et d'une hypothèse testée selon la
      méthode de Bernard ?
    type: mcq
    choices:
      - id: A
        text: "Puisqu'aucune théorie scientifique n'est jamais prouvée avec une certitude absolue, la conviction de grand-mère et une hypothèse rigoureusement testée se valent finalement autant l'une que l'autre."
        correct: false
        misconception: mc.philo.theorie_experience.fallibilisme-confondu-relativisme
        feedback: >
          C'est confondre le fallibilisme (aucune connaissance n'est
          absolument et définitivement certaine) avec le relativisme (toutes
          les convictions se valent) -- exactement l'erreur déjà signalée en
          chapitre 9 de « La vérité » : l'une des deux démarches a été exposée au risque de
          la réfutation, l'autre non.
      - id: B
        text: "Puisque la méthode de Bernard permet de tester une hypothèse, elle permet forcément d'arriver à une certitude absolue, contrairement à la conviction non testée de grand-mère."
        correct: false
        misconception: mc.philo.theorie_experience.corroboration-egale-preuve-definitive
        feedback: >
          Cela contredit les chapitres 3 et 5 : même une hypothèse rigoureusement testée
          et corroborée n'est jamais prouvée avec une certitude absolue --
          elle reste seulement non-encore-réfutée.
      - id: C
        text: "Elles diffèrent : la conviction de grand-mère n'a jamais été formulée de façon à pouvoir être réfutée, alors qu'une hypothèse testée selon Bernard a été réellement exposée au risque d'être mise en défaut -- sans qu'aucune des deux n'atteigne jamais une certitude absolue."
        correct: true
      - id: D
        text: "La conviction de grand-mère est en réalité plus fiable, puisqu'elle repose sur quarante années d'expérience personnelle directe et sans faille, alors que la méthode de Bernard ne repose que sur des groupes artificiellement construits en laboratoire, loin de toute expérience réelle."
        correct: false
        misconception: mc.philo.theorie_experience.observation-passive-suffit
        feedback: >
          C'est l'inverse du point établi par la leçon : quarante ans
          d'observation non guidée (chapitre 3) ne prouvent logiquement rien, tandis
          que le dispositif comparatif de Bernard (chapitre 4) est précisément ce qui
          expose l'hypothèse à un risque réel de réfutation.
    correct_feedback: >
      Ni la conviction de grand-mère ni l'hypothèse la mieux testée
      n'atteignent une certitude absolue -- mais seule la seconde a été
      réellement exposée au risque d'être réfutée, ce qui les distingue
      nettement malgré l'absence commune de preuve définitive.
    solution: |
      **Le fallibilisme :** aucune théorie, même la mieux corroborée, n'est
      jamais prouvée avec une certitude absolue et définitive (chapitres 3 et 5).

      **Ce que le fallibilisme n'implique pas :** que toute conviction se
      vaille -- confondre les deux serait tomber dans le relativisme, une
      erreur distincte déjà signalée dans « La vérité » (chapitre 9).

      **Le critère qui les distingue malgré tout :** avoir été, ou non,
      formulée et exposée de façon à pouvoir être réfutée par une observation
      précise -- ce que la conviction de grand-mère n'a jamais fait, et ce que
      le protocole de Bernard fait par construction.

  - id: THEXP-7
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_theorie_experience
    tags: [accroche, induction_naive, confirmation]
    stem: >
      Face à la certitude de grand-mère (« quarante ans sans exception, ça
      marche »), quel est exactement le problème que le chapitre 1 met en évidence dans
      cette certitude, indépendamment de toute doctrine philosophique déjà
      nommée ?
    type: mcq
    choices:
      - id: A
        text: "Qu'un rhume ordinaire guérit de lui-même en quelques jours, de sorte que les mêmes observations auraient eu lieu même si la tisane n'avait aucun effet réel -- l'accumulation de cas favorables n'exclut donc pas cette explication concurrente."
        correct: true
      - id: B
        text: "Que quarante années d'observations concordantes, sans la moindre exception, suffisent à établir une preuve rigoureuse, puisqu'aucun contre-exemple n'a jamais été rencontré."
        correct: false
        misconception: mc.philo.theorie_experience.confirmation-egale-preuve
        feedback: >
          Confond confirmation répétée et preuve rigoureuse -- exactement
          l'erreur que le chapitre 1 met en évidence en montrant qu'une autre explication
          (la guérison naturelle) reste compatible avec les mêmes
          observations.
      - id: C
        text: "Que l'expérience personnelle de grand-mère ne vaut absolument rien, et qu'il faudrait rejeter en bloc toute observation qui n'est pas menée dans un laboratoire, sous peine de ne jamais pouvoir distinguer une simple croyance populaire d'une connaissance véritablement digne de ce nom."
        correct: false
        misconception: mc.philo.theorie_experience.faux-dilemme-confirmation-rejet
        feedback: >
          Pousse la seconde réponse envisagée par le chapitre 1 à un excès que le texte
          juge lui-même intenable -- une théorie jamais confrontée à aucune
          expérience resterait une pure spéculation.
      - id: D
        text: "Que les deux réponses données par les élèves reviennent, en réalité, à dire exactement la même chose sous une formulation différente, de sorte qu'il serait inutile de chercher entre elles la moindre tension philosophique à explorer dans la suite de la leçon."
        correct: false
        misconception: mc.philo.theorie_experience.faux-dilemme-confirmation-rejet
        feedback: >
          Les deux réponses sont au contraire deux positions opposées, dont la
          tension est précisément ce que le chapitre 1 construit pour lancer la leçon.
    correct_feedback: >
      Le nombre d'observations concordantes n'exclut pas une explication
      concurrente (la guérison naturelle du rhume) qui produirait exactement
      les mêmes observations, même si la tisane n'avait aucun effet.
    solution: |
      **Le piège :** confirmer n'est pas prouver -- un rhume guérit seul,
      donc les observations de grand-mère seraient identiques même sans
      effet réel de la tisane.

      **Ce que le chapitre 1 refuse aussi :** rejeter en bloc toute expérience non
      scientifique, ce qui rendrait toute théorie une pure spéculation.

  - id: THEXP-8
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_theorie_experience
    tags: [accroche, empirisme, speculation]
    stem: >
      Le chapitre 1 montre que rejeter totalement l'expérience de grand-mère, au profit
