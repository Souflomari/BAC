    correct_feedback: >
      Une théorie jamais mise à l'épreuve d'aucune expérience resterait une
      pure spéculation -- c'est pourquoi rejeter en bloc l'expérience n'est
      pas non plus tenable.
    solution: |
      **Le risque du rejet total :** une théorie sans aucune confrontation
      au réel n'a aucun moyen de savoir si elle décrit quoi que ce soit du
      monde.

      **Ce que le chapitre 1 en tire :** ni l'expérience seule, ni la raison seule sans
      expérience, ne suffisent -- la tension que toute la leçon va
      construire.

  - id: THEXP-9
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_theorie_experience
