          qu'elle ne suffit jamais seule à établir certaines vérités.
      - id: B
        text: "Il prévient qu'il ne faut pas réduire l'opposition à « il faut observer » contre « il ne faut jamais observer » : le rationalisme ne rejette pas l'observation, il soutient qu'elle ne suffit jamais seule à établir certaines vérités."
        correct: true
      - id: C
        text: "Il prévient que Hume commet une erreur en refusant les idées innées, erreur que le chapitre 3 va corriger."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          Le chapitre 3 prolonge la ligne humienne, il ne la corrige pas -- et ce n'est
          de toute façon pas le point que cet encadré met en garde.
      - id: D
        text: "Il prévient qu'il ne faut jamais employer, dans une copie de dissertation, les mots « empirisme » et « rationalisme » dans le même paragraphe."
        correct: false
        misconception: mc.philo.theorie_experience.critere-methodologique-mal-identifie
        feedback: >
          Mécompréhension pure du contenu de l'encadré, qui porte sur une
