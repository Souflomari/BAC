    correct_feedback: >
      Le rationalisme n'interdit pas d'observer -- il soutient seulement que
      l'observation seule ne suffit jamais à établir certaines vérités.
    solution: |
      **L'erreur visée :** croire que les deux doctrines s'opposent sur la
      valeur de l'observation en général.

      **Ce qu'il faut retenir :** le rationalisme encadre l'observation par
      la raison, il ne la rejette pas.

