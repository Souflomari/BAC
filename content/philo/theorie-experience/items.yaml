    correct_feedback: >
      Le chapitre 1 annonce deux questions : la source de la connaissance (expérience,
      raison, ou leur articulation) et la neutralité possible de
      l'observation.
    solution: |
      **Première question :** expérience seule, raison seule, ou
      articulation des deux ?

      **Seconde question :** l'observation est-elle jamais neutre, ou
      toujours déjà orientée par une théorie ?

  - id: THEXP-10
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_theorie_experience
    tags: [hume, empirisme, impressions]
    stem: >
      Selon Hume, comment expliquer que je puisse former l'idée d'une
      « montagne d'or », alors que je n'ai jamais perçu une telle chose ?
    type: mcq
    choices:
      - id: A
        text: "Cette idée est innée, présente dans l'esprit indépendamment de toute expérience sensible antérieure."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          Contredit directement Hume, pour qui aucune idée n'est innée --
          toute idée se ramène, en dernière analyse, à des impressions
          sensibles.
      - id: B
        text: "Cette idée provient d'une impression sensible unique et directe, celle d'avoir déjà vu une montagne d'or quelque part."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          Méconnaît l'exemple de Hume -- il n'y a aucune impression unique de
          ce genre, seulement une combinaison de deux idées distinctes.
      - id: C
        text: "Cette idée montre que la raison seule, indépendamment de toute expérience sensible passée ou présente, peut produire des contenus véritablement nouveaux et informatifs sur le monde réel, sans jamais avoir besoin de s'appuyer sur la moindre perception."
        correct: false
        misconception: mc.philo.theorie_experience.empirisme-rationalisme-non-distingues
        feedback: >
          Attribue à Hume une thèse rationaliste qu'il rejette explicitement
          -- pour lui, rien dans l'esprit ne peut être connu indépendamment
          de l'expérience sensible.
      - id: D
        text: "Cette idée n'est qu'une combinaison de deux idées ordinaires (montagne, or), chacune tirée séparément d'impressions sensibles déjà vécues -- rien, dans cet exemple, n'échappe à l'origine empirique de toute idée."
        correct: true
    correct_feedback: >
      Même l'idée la plus étrange n'est, pour Hume, qu'un assemblage
      d'idées simples elles-mêmes tirées d'impressions déjà vécues
      séparément.
    solution: |
      **Le geste humien :** toute idée se décompose en éléments simples
      ramenés à des impressions sensibles.

      **L'exemple de la montagne d'or :** une combinaison de deux idées
      ordinaires, chacune déjà tirée de l'expérience -- aucune idée innée
      n'est requise.

  - id: THEXP-11
    rung: "R1"
