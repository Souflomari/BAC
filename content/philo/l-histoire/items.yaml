          possibilité de la connaître objectivement --, pas seulement la
          première.
      - id: C
        text: "Il s'agit uniquement de vérifier quelles dates et quels détails matériels sont exacts dans chacun des deux récits, sans qu'aucune question sur une éventuelle direction de l'Histoire ne soit ici en jeu d'une manière ou d'une autre."
        correct: false
        misconception: mc.philo.histoire.objection-du-chapitre-1-mal-lue
        feedback: >
          Cela ne retient, à l'inverse, que l'autre moitié du problème : la
          question d'une direction nécessaire fait tout autant partie du
          « double problème » que celle de la connaissance objective.
      - id: D
        text: "En réalité, les deux récits pourraient simplement s'additionner sans la moindre contradiction véritable, ce qui rendrait la question posée par le chapitre 1 purement rhétorique, sans le moindre enjeu philosophique réel."
        correct: false
        misconception: mc.philo.histoire.objection-du-chapitre-1-mal-lue
        feedback: >
          Le texte du chapitre 1 construit au contraire une tension réelle : chaque
          position se heurte à une objection sérieuse dès qu'on la prend au
          sérieux -- ce n'est pas un faux problème.
    correct_feedback: >
      Le chapitre 1 pose un double problème : l'Histoire a-t-elle un sens, une
      direction nécessaire -- et peut-on connaître objectivement ce qui
      s'est passé, quand les récits se contredisent ? La suite de la leçon
      répond à ces deux questions séparément.
    solution: |
      **Première question :** l'Histoire a-t-elle une direction que rien ni
      personne ne pourrait infléchir (chapitres 3, 4 et 5) ?

      **Seconde question :** peut-on connaître objectivement ce qui s'est
      passé, quand deux récits se contredisent (chapitre 6) ?

      Confondre l'une avec l'autre revient à perdre la moitié du problème.

