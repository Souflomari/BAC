          l'Histoire a un sens -- une signification et une direction.
      - id: D
        text: "L'Histoire universelle suivrait, pour Hegel, une pluralité de causes contingentes, dont rien ne garantirait, par avance, ni la combinaison ni l'issue."
        correct: false
