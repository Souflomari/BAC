        text: "Elle montrerait que le témoignage de la grand-mère est faux, puisque d'autres familles, exposées aux mêmes conditions, ont fait un choix différent du sien."
        correct: false
        misconception: mc.philo.histoire.objection-du-chapitre-1-mal-lue
        feedback: >
          C'est un contresens : l'objection ne vise pas la véracité du
