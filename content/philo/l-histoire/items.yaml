          engloberait le détail de chaque décision familiale.
      - id: B
        text: "Elle montrerait que si le mouvement d'ensemble était vraiment nécessaire, le détail concret de chaque décision ne devrait pas dépendre à ce point de circonstances aussi fragiles qu'un puits, une lettre ou une dispute."
        correct: true
      - id: C
        text: "Elle montrerait au contraire que le manuel a complètement raison, puisqu'elle confirme que la sécheresse a touché, de façon uniforme, toutes les familles du douar."
        correct: false
        misconception: mc.philo.histoire.objection-du-chapitre-1-mal-lue
        feedback: >
          C'est l'inverse de ce que l'objection établit : des familles
          exposées à la même sécheresse ayant réagi différemment fragilise,
          plutôt qu'elle ne confirme, l'idée d'un processus uniforme.
      - id: D
        text: "Elle montrerait qu'aucun historien ne pourra jamais rien savoir de fiable sur cet épisode, la contradiction entre familles rendant toute connaissance historique définitivement impossible."
        correct: false
        misconception: mc.philo.histoire.objection-du-chapitre-1-mal-lue
        feedback: >
          Cela déborde la portée de l'objection, qui porte sur le sens et la
          nécessité de l'Histoire (première question du chapitre 1), pas sur la
          connaissance historique elle-même (seconde question, chapitre 6).
    correct_feedback: >
      L'objection fragilise l'idée d'une nécessité totale : si le mouvement
      d'ensemble était garanti d'avance, le détail concret de chaque
      décision ne devrait pas dépendre d'aussi peu de chose.
    solution: |
      **L'objection :** des familles identiquement exposées à la sécheresse
      ont fait des choix opposés.

      **Ce qu'elle met en doute :** une nécessité qui engloberait le
      moindre détail de chaque décision.

      **Ce qu'elle ne fait pas :** elle ne rend pas le témoignage de la
      grand-mère faux, ni ne règle la question de la connaissance.

