      confond avec l'Histoire comme processus.
    solution: |
      **La grand-mère :** sa mémoire -- un vécu, partiel et subjectif.

      **Le manuel :** un fragment d'histoire comme discipline.

      **Ce qui reste en jeu :** savoir si l'exode obéissait à une direction
