notion: l-histoire
skill_code: philo_histoire
misconceptions:
  # Inventaire écrit le 2026-09-05. Les 24 items existaient, chacun avec son
  # feedback, mais aucun distracteur ne portait de tag : la notion était
  # AVEUGLE pour le modèle apprenant.
  - id: mc.philo.histoire.auteurs-echanges
    label: "« Les thèses des auteurs sont interchangeables : on prête à l'un ce que soutient l'autre »"
    description: >
      L'erreur dominante de la leçon : la ruse de la raison attribuée à Marx, le
      matérialisme historique à Hegel, la nécessité unique à Aron, la critique
      des sources à Ricœur, le devoir de mémoire à Bloch — ou l'un des auteurs
      convoqué pour répondre à une question qui n'est pas la sienne.
    contradicts_principle: >
      Chaque auteur occupe une position PROPRE. Hegel : l'Esprit parvient à la
      conscience de sa liberté, les passions individuelles servant sans le
      savoir une fin qui les dépasse. Marx : ce sont les rapports de production
      qui déterminent les idées, non l'inverse. Aron : contre l'un et l'autre,
      la pluralité des causes contingentes, et le danger d'une idéologie qui
      prétend détenir la clé du sens. Bloch : les conditions d'une objectivité
      historique malgré l'absence d'accès direct. Ricœur : la juste mémoire,
      entre l'oubli et la commémoration figée.

  - id: mc.philo.histoire.ruse-de-la-raison-durcie-en-determinisme
    label: "« La ruse de la raison fait des individus des marionnettes, ou des calculateurs conscients »"
    description: >
      L'élève supprime l'un des deux termes du mécanisme : soit la liberté
      réelle des passions individuelles (les hommes seraient programmés), soit
      l'ignorance dans laquelle ils agissent (ils poursuivraient sciemment la
      fin de l'Histoire).
    contradicts_principle: >
      Le mécanisme tient précisément aux DEUX à la fois : ce sont de VRAIES
      passions, librement poursuivies pour elles-mêmes (l'ambition d'un César),
      qui servent malgré tout une fin que leur auteur n'a jamais visée. Ni
      marionnette, ni stratège.

  - id: mc.philo.histoire.contingence-lue-comme-absurdite
    label: "« Si l'Histoire est contingente, c'est qu'elle est absurde : rien n'a de cause, tout est hasard »"
    description: >
      L'élève lit la contingence comme une absence de causalité, ou comme
      l'impossibilité d'en rien dire, ou comme un pur chaos sans lien.
    contradicts_principle: >
      La contingence ne nie pas que chaque événement ait des causes réelles et
      nombreuses : elle nie qu'une nécessité UNIQUE gouverne l'ensemble du cours
      historique. Des causes multiples, entrecroisées, dont aucune ne suffit
      seule — cela reste parfaitement analysable.

  - id: mc.philo.histoire.objectivite-tout-ou-rien
    label: "« Ou l'historien accède directement au passé, ou aucune objectivité n'est possible »"
    description: >
      Faute d'accès direct, l'élève bascule : soit il prête à l'historien une
      observation directe et reproductible comme au laboratoire, soit il conclut
      que rien ne peut jamais être établi, soit il choisit une source pour sa
      seule ancienneté, son institution, ou parce qu'elle lui donne raison.
    contradicts_principle: >
      L'historien ne dispose que de traces incomplètes et non neutres — et c'est
      justement pourquoi il les soumet à la CRITIQUE DES SOURCES : interroger
      l'origine du document, son auteur, le but dans lequel il a été produit, et
      le confronter à d'autres traces indépendantes. Une objectivité construite,
      ni donnée ni impossible.

  - id: mc.philo.histoire.memoire-histoire-passe-confondus
    label: "« Mémoire, histoire, Histoire et passé désignent la même chose »"
    description: >
      L'élève écrase les quatre notions les unes sur les autres, ou intervertit
      leurs définitions, ou fait du passé lui-même une construction du souvenir
      ou du récit.
    contradicts_principle: >
      Quatre choses distinctes. Le PASSÉ : tout ce qui a eu lieu, révolu et
      immuable — inaccessible, mais sans problème philosophique propre. La
      MÉMOIRE : une trace vécue et subjective, individuelle ou collective.
      L'HISTOIRE (discipline) : le récit critique que l'historien construit à
      partir des traces. L'HISTOIRE (processus) : le devenir collectif de
      l'humanité, dont on demande s'il a un sens.

  - id: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
    label: "« Il faut tout retenir » — ou « la mémoire ne vaut rien »"
    description: >
      Sur Ricœur, l'élève choisit un extrême : commémorer tout événement au même
      titre, ou juger qu'aucun passé ne mérite d'être retenu, ou tenir la
      mémoire collective pour incorruptible, ou ne lui trouver qu'un intérêt
      identitaire.
    contradicts_principle: >
      La « juste mémoire » tient les deux bouts : oublier purement et simplement
      un crime de grande ampleur reviendrait à effacer une seconde fois ses
      victimes ; mais une mémoire sans critique peut être manipulée pour
      légitimer une position présente ou entretenir un ressentiment. Ni tout
      retenir, ni figer le souvenir en légende.

  - id: mc.philo.histoire.objection-du-chapitre-1-mal-lue
    label: "« L'objection de l'accroche tranche entre les deux récits »"
    description: >
      L'élève transforme une objection en verdict : la variation entre familles
      prouverait que la grand-mère se trompe, ou que le manuel a raison, ou
      qu'on ne peut rien savoir ; la convergence entre pays serait une
      coïncidence, ou disqualifierait le témoignage.
    contradicts_principle: >
      Les deux objections travaillent en tenaille et ne tranchent RIEN : si le
      mouvement d'ensemble était nécessaire, le détail de chaque décision ne
      devrait pas varier autant d'une famille à l'autre ; et si tout se réduisait
      à des choix individuels, une même convergence ne se retrouverait pas dans
      des pays si différents. C'est cette tension qui pose le double problème de
      la leçon.

  - id: mc.philo.histoire.infrastructure-superstructure-inversees
    label: "« Ce sont les idées qui déterminent les rapports de production »"
    description: >
      L'élève inverse le renversement de Marx, ou intervertit les deux termes,
      ou les rend indépendants l'un de l'autre.
    contradicts_principle: >
      L'INFRASTRUCTURE (les rapports de production) détermine la SUPERSTRUCTURE
      (droit, religion, idées dominantes) — et non l'inverse. Un discours sur
      « la modernisation » n'est donc pas une cause : c'est une idée de
      superstructure, une manière d'habiller après coup un mouvement économique.


items:
  - id: HIST-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_histoire
    tags: [passe, memoire, histoire, histoire_processus]
    stem: >
      Quelle affirmation distingue correctement « la mémoire », « l'histoire »
      (comme discipline) et « l'Histoire » (comme processus), tels qu'ils sont
      définis dans cette leçon ?
    type: mcq
    choices:
      - id: A
        text: "Ce sont trois mots pour une seule et même réalité : la mémoire d'un témoin, le récit d'un historien et le devenir collectif réel de l'humanité coïncident nécessairement et se recouvrent, puisqu'ils portent tous, au fond, sur le même passé unique et parfaitement identique."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          La leçon distingue justement ces trois réalités : un témoignage
          vécu (mémoire) peut contredire un récit d'historien (histoire),
          et aucun des deux ne restitue le devenir collectif (Histoire) dans
          sa totalité -- les fondre en un seul mot efface la question même
          que le chapitre 6 va poser (l'objectivité de l'historien).
      - id: B
        text: "« L'histoire », comme discipline, désigne le devenir collectif réel de l'humanité ; « l'Histoire », avec une majuscule, désigne seulement le récit qu'on en fait dans un manuel scolaire."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          C'est l'inverse de la distinction posée dans la leçon : l'histoire
          (discipline) est le récit construit par l'historien ; l'Histoire
          (processus) est le devenir collectif réel dont ce récit essaie de
          rendre compte.
      - id: C
        text: "« La mémoire » désigne exclusivement les souvenirs personnels d'un individu, jamais ceux d'un groupe ou d'un peuple."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          La leçon définit la mémoire comme une trace vécue du passé, chez
          un individu OU chez un groupe (une famille, un peuple peuvent se
          souvenir collectivement d'un même événement) -- restreindre la
          mémoire au seul individu manque une partie de la définition.
      - id: D
        text: "« La mémoire » est une trace vécue et subjective, gardée par un individu ou un groupe ; « l'histoire » est le récit que l'historien construit selon une méthode critique ; « l'Histoire » est le devenir collectif réel dont ce récit tente de rendre compte."
        correct: true
    correct_feedback: >
      La mémoire est un vécu subjectif et partiel ; l'histoire (discipline)
      est un travail critique construit sur des traces ; l'Histoire
      (processus) est le devenir collectif réel que ce travail cherche à
      connaître -- trois réalités distinctes, pas des synonymes.
    solution: |
      **Le passé :** tout ce qui a eu lieu, dans son détail exact -- révolu,
      inaccessible désormais dans sa totalité.

      **La mémoire :** la trace vécue, subjective et partielle, qu'un
      individu ou un groupe garde de ce passé.

      **L'histoire (discipline) :** le récit que l'historien construit,
      selon une méthode critique, à partir de traces qui ont survécu.

      **L'Histoire (processus) :** le devenir collectif réel de l'humanité,
      dont le récit de l'historien essaie de rendre compte -- sans jamais
      s'y réduire.

  - id: HIST-2
    rung: "R2"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [hegel, ruse_de_la_raison, determinisme, liberte]
    stem: >
      Un élève écrit : « La ruse de la raison chez Hegel, c'est l'idée que les
      individus ne sont que des marionnettes sans liberté réelle, entièrement
      programmées pour réaliser un plan écrit d'avance. » Qu'est-ce que cette
      lecture manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que la ruse de la raison est en réalité une thèse de Marx sur les rapports de production, et non une thèse de Hegel."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une erreur d'attribution : la ruse de la raison est un
          concept hégélien (chapitre 3), qui porte sur la réalisation de l'Esprit
          et de la liberté à travers les passions humaines -- Marx (chapitre 4)
          soutient une thèse différente, fondée sur les rapports de
          production et la lutte des classes, pas sur l'Esprit.
      - id: B
        text: "Elle manque le point central de la ruse de la raison : ce sont de VRAIES passions, librement exercées (l'ambition d'un César), qui servent, sans coercition ni plan explicite, une fin rationnelle plus large -- la nécessité se réalise PAR cette liberté, non en l'annulant."
        correct: true
      - id: C
        text: "Elle manque le fait que, pour Hegel, aucun individu particulier -- ni César, ni Alexandre, ni Napoléon -- n'a jamais joué le moindre rôle réel dans la réalisation de l'Histoire, qui se passerait entièrement des actions et des passions humaines concrètes, aussi grandes fussent-elles."
        correct: false
        misconception: mc.philo.histoire.ruse-de-la-raison-durcie-en-determinisme
        feedback: >
          C'est l'inverse : Hegel prend justement ces grands individus
          historiques comme exemples -- leurs passions bien réelles et
          concrètes (ambition, soif de pouvoir) sont le moyen même par
          lequel, selon lui, la Raison réalise une fin qui les dépasse.
      - id: D
        text: "Elle manque le fait que la ruse de la raison désigne un calcul conscient et délibéré, mené par les grands hommes eux-mêmes, en vue de réaliser sciemment la marche de la liberté."
        correct: false
        misconception: mc.philo.histoire.ruse-de-la-raison-durcie-en-determinisme
        feedback: >
          C'est le contraire : le mécanisme repose précisément sur le fait
          que les individus n'ont PAS conscience de servir une fin plus
          large -- ils poursuivent leurs propres passions particulières,
          sans se donner pour but conscient de faire progresser la liberté
          humaine.
    correct_feedback: >
      La ruse de la raison n'est pas un déterminisme mécanique : elle décrit
      comment de vraies passions, librement poursuivies, servent, sans
      coercition ni plan conscient, une fin rationnelle qui dépasse
      l'intention de chaque individu.
    solution: |
      **La thèse :** l'Histoire est le processus par lequel l'Esprit parvient
      progressivement à la conscience de sa liberté, et à sa réalisation dans
      des institutions concrètes.

      **Le mécanisme :** la Raison se sert des passions particulières des
      individus (l'exemple de César) comme d'instruments, sans qu'ils en
      aient conscience -- la ruse de la raison.

      **Ce que ce n'est pas :** un déterminisme mécanique qui annulerait
      toute liberté -- ce sont de vraies passions, librement exercées, qui
      réalisent, par leur libre exercice même, une fin qui les dépasse.

  - id: HIST-3
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [marx, materialisme_historique, lutte_des_classes, hegel]
    stem: >
      Quelle affirmation résume correctement le matérialisme historique de
      Marx, et le distingue de la thèse de Hegel vue au chapitre 3 ?
    type: mcq
    choices:
      - id: A
        text: "Le matérialisme historique est une thèse hégélienne, que Marx se serait contenté de reprendre et de renommer sans rien y changer."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une mauvaise attribution, et la confusion la plus fréquente
          sur ce point du programme : c'est Hegel qui fait de l'Histoire la
          réalisation d'une Idée, d'un Esprit (chapitre 3) ; Marx reproche
          précisément à ce schéma d'avoir la démarche "sur la tête", et le
          retourne en plaçant la cause du côté des rapports matériels de
          production, pas des idées.
      - id: B
        text: "Pour Marx, l'Histoire avance par la seule évolution pacifique des idées politiques et religieuses, sans qu'aucun conflit économique n'y joue de rôle déterminant."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est l'inverse de la thèse marxiste : les contradictions entre
          rapports de production et forces productives ne se résolvent
          jamais, selon Marx, par la seule évolution des idées, mais par la
          lutte des classes -- l'affrontement entre ceux qui profitent des
          rapports existants et ceux qu'ils exploitent.
      - id: C
        text: "Pour Marx, ce ne sont pas les idées qui déterminent l'être social, mais l'inverse : les rapports de production (infrastructure) déterminent les idées, le droit, la religion (superstructure) -- l'exact renversement de Hegel, qui faisait dériver l'Histoire d'une Idée."
        correct: true
      - id: D
        text: "Le matérialisme historique soutiendrait que seules des circonstances matérielles purement contingentes -- un puits creusé là, une lettre égarée, une dispute de hasard -- expliquent tout le cours de l'Histoire, sans qu'aucun rapport de classe n'y intervienne jamais de façon déterminante."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est confondre le matérialisme historique de Marx (chapitre 4), qui
          identifie un moteur structurel -- les rapports de production et
          la lutte des classes --, avec la critique de la contingence
          d'Aron (chapitre 5), qui conteste au contraire toute nécessité d'ensemble.
          Ce sont deux positions distinctes.
    correct_feedback: >
      Marx renverse Hegel : ce n'est pas une Idée qui produit l'Histoire
      matérielle, mais les rapports de production (infrastructure) qui
      déterminent les idées et les institutions (superstructure) -- et c'est
      la lutte des classes qui fait passer d'une étape historique à l'autre.
    solution: |
      **Le renversement :** "ce n'est pas la conscience des hommes qui
      détermine leur être ; c'est au contraire leur être social qui
      détermine leur conscience."

      **Infrastructure / superstructure :** les rapports de production
      (base économique) déterminent le droit, la religion, la philosophie
      (superstructure) -- pas l'inverse.

      **Le moteur du changement :** la contradiction entre rapports de
      production et forces productives se résout par la lutte des classes,
      pas par la seule évolution des idées.

      **L'erreur à éviter :** attribuer ce renversement à Hegel, qui
      soutient exactement la thèse inverse (chapitre 3).

  - id: HIST-4
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [aron, contingence, historicisme, ideologie]
    stem: >
      Un élève objecte à Raymond Aron : « Si l'Histoire est contingente,
      c'est donc qu'elle est absurde -- aucun événement historique n'a de
      cause réelle, tout n'est que pur hasard. » Qu'est-ce que cette objection
      manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le point précis d'Aron : la contingence ne nie pas que chaque événement ait des causes réelles et nombreuses -- elle conteste seulement qu'une loi nécessaire, connaissable à l'avance, ait garanti que les choses se passent ainsi plutôt qu'autrement."
        correct: true
      - id: B
        text: "Elle manque le fait qu'Aron, comme Hegel et Marx, défend au contraire l'existence d'une nécessité unique qui gouvernerait tout le cours de l'Histoire."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est l'inverse de la thèse d'Aron : il conteste précisément la
          nécessité unique que Hegel (chapitre 3) et Marx (chapitre 4) affirment chacun à
          sa façon -- sa position n'est pas une nécessité de plus, mais une
          critique de toute nécessité de ce type.
      - id: C
        text: "Elle manque le fait que la critique de la contingence appartiendrait en réalité au seul matérialisme historique de Marx, qui aurait, le premier, insisté sur le rôle décisif du pur hasard et de l'accident imprévisible dans le cours entier de l'histoire humaine et de ses grandes révolutions."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une mauvaise attribution : Marx (chapitre 4) affirme au contraire
          une nécessité -- la lutte des classes fait nécessairement passer
          d'une étape historique à la suivante. C'est Aron (chapitre 5) qui conteste
          cette nécessité au nom de la pluralité des causes contingentes.
      - id: D
        text: "Elle manque le fait qu'Aron réserve sa critique aux seuls événements très anciens, mais admet une nécessité stricte pour tous les événements historiques récents."
        correct: false
        misconception: mc.philo.histoire.contingence-lue-comme-absurdite
        feedback: >
          Rien, dans la critique d'Aron, ne limite la contingence à une
          période historique particulière : son objection porte sur la
          méthode même qui prétend établir des lois nécessaires de
          l'Histoire, quelle que soit l'époque considérée.
    correct_feedback: >
      Dire que l'Histoire est contingente ne revient pas à dire qu'elle est
      sans cause : Aron conteste seulement l'idée d'une loi nécessaire
      unique, connaissable à l'avance -- pas la possibilité d'expliquer
      causalement un événement après coup.
    solution: |
      **La contingence :** on ne trouve jamais, dans un événement historique,
      une cause unique et nécessaire, mais une pluralité de causes dont la
      combinaison n'était garantie par rien à l'avance.

      **Ce que cela n'implique pas :** l'Histoire n'est pas pour autant
      absurde ou sans cause -- Aron ne nie jamais la possibilité d'une
      explication causale rigoureuse (chapitre 6).

      **Le danger politique :** prétendre connaître le sens nécessaire de
      l'Histoire (l'opium des intellectuels) a servi à justifier, au nom
      d'une prétendue nécessité, des politiques d'une extrême violence.

  - id: HIST-5
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [marc_bloch, objectivite, critique_des_sources, traces]
    stem: >
      Pourquoi Marc Bloch insiste-t-il sur le fait que l'historien n'a jamais
      un accès direct au passé -- et qu'en conclut-il sur l'objectivité de
      l'histoire ?
    type: mcq
    choices:
      - id: A
        text: "Puisque l'historien n'observe jamais directement le passé lui-même, Bloch en conclurait que l'objectivité en histoire n'est qu'un mot vide de sens, et que tout récit historique en vaudrait finalement bien un autre, sans critère de départage ni de vérité possible."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est l'inverse de la position de Bloch : il ne renonce jamais à
          l'exigence d'objectivité -- il la redéfinit comme une méthode
          critique rigoureuse (la critique des sources), précisément parce
          que l'accès direct au passé fait défaut.
      - id: B
        text: "Bloch soutient au contraire que l'historien, comme le physicien en laboratoire, peut observer et reproduire directement les événements du passé qu'il étudie."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est exactement le point que Bloch conteste : à la différence du
          physicien, l'historien n'a jamais accès au phénomène lui-même,
          seulement à des traces qui en subsistent -- documents, objets,
          témoignages.
      - id: C
        text: "Bloch réserve ce problème d'accès indirect aux seuls témoignages oraux, comme celui d'un grand-parent -- les documents écrits, eux, donneraient un accès direct et complet au passé."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          La leçon ne fait pas cette distinction : pour Bloch, aucune trace
          -- écrite ou orale -- ne donne un accès direct au passé lui-même ;
          toutes doivent être soumises à la même critique des sources
          (authenticité, cohérence avec d'autres sources indépendantes).
      - id: D
        text: "L'historien ne dispose que de traces incomplètes et non neutres, qu'il doit soumettre à une critique rigoureuse des sources ; cette absence d'accès direct redéfinit l'objectivité comme un travail critique exigeant, non comme une copie fidèle du passé."
        correct: true
    correct_feedback: >
      L'historien ne perçoit jamais le passé lui-même, seulement des traces
      partielles -- ce qui impose une critique rigoureuse des sources, et
      redéfinit l'objectivité comme une méthode, non comme une copie fidèle
      et totale du passé.
    solution: |
      **Le point de départ :** l'historien n'observe jamais directement son
      objet, contrairement au physicien -- il ne dispose que de traces
      survivantes, incomplètes et non neutres.

      **La critique des sources :** interroger chaque trace (origine,
      auteur, but) et la croiser avec d'autres sources indépendantes.

      **Objectif ne veut pas dire neutre :** l'absence d'accès direct
      n'ouvre pas la porte à un pur relativisme -- elle exige au contraire
      une méthode critique plus rigoureuse.

  - id: HIST-6
    rung: "R6"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [ricoeur, devoir_de_memoire, oubli, juste_memoire]
    stem: >
      Selon Ricœur, pourquoi le devoir de mémoire ne peut-il pas se
      contenter d'exiger qu'on « n'oublie jamais rien » ?
    type: mcq
    choices:
      - id: A
        text: "Parce que, pour Ricœur, aucun événement du passé, aussi grave soit-il, ne mériterait réellement d'être retenu par la mémoire collective des peuples, l'oubli étant à ses yeux toujours préférable au souvenir."
        correct: false
        misconception: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
        feedback: >
          C'est le contraire de la thèse de Ricœur : il part au contraire
          de l'idée que certains passés -- des crimes de grande ampleur --
          ne peuvent, moralement, être livrés à l'oubli, sous peine
          d'achever l'injustice commise envers leurs victimes.
      - id: B
        text: "Parce que la mémoire collective, laissée sans critique, peut être manipulée pour légitimer une position présente ou entretenir un ressentiment ; Ricœur appelle « juste mémoire » l'équilibre entre n'oublier aucune victime et ne pas figer le souvenir en légende partisane."
        correct: true
      - id: C
        text: "Parce que le devoir de mémoire, selon Ricœur, se confondrait exactement avec le travail critique de reconstitution des faits mené par l'historien et décrit au chapitre 6 -- les deux ne formeraient, au fond, qu'une seule et même exigence, sans aucune différence réelle de nature ni de méthode."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          La leçon distingue les deux : le devoir de mémoire est une
          exigence morale de ne pas oublier certains passés ; le travail de
          l'historien (chapitre 6, Bloch) est une méthode critique de reconstitution
          des faits -- les deux se corrigent mutuellement, mais ne sont pas
          identiques.
      - id: D
        text: "Parce que la mémoire collective, à la différence de la mémoire individuelle, ne pourrait jamais être ni manipulée, ni instrumentalisée par quiconque."
        correct: false
        misconception: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
        feedback: >
          C'est l'inverse du risque que Ricœur identifie : la mémoire
          collective peut au contraire être mobilisée sélectivement à des
          fins présentes -- c'est précisément ce risque qui justifie la
          recherche d'une "juste mémoire", ni oubli ni instrumentalisation.
    correct_feedback: >
      Le devoir de mémoire doit se garder de deux excès opposés : l'oubli,
      qui achève l'injustice envers les victimes, et une mémoire mal
      maîtrisée, qui peut se figer en instrument de division -- d'où
      l'exigence d'une "juste mémoire".
    solution: |
      **Le devoir de mémoire :** ne pas laisser l'oubli achever l'injustice
      commise envers des victimes d'un crime de grande ampleur.

      **Le risque inverse :** une mémoire collective non critique peut être
      manipulée ou instrumentalisée à des fins présentes.

      **La juste mémoire :** l'équilibre que Ricœur appelle de ses vœux --
      ni l'oubli, ni la mémoire figée en légende partisane -- articulé avec
      le travail critique de l'historien (chapitre 6).

  - id: HIST-7
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_histoire
    tags: [accroche, sens_de_l_histoire, connaissance_objective]
    stem: >
