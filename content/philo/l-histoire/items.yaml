        text: "Le témoignage de la grand-mère relèverait du passé lui-même, dans son détail exact et total, puisqu'elle l'a vécu directement et s'en souvient parfaitement."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
