        correct: true
      - id: C
        text: "L'Histoire universelle ne serait, pour Hegel, qu'un chaos d'événements sans lien entre eux, dont on ne pourrait dégager aucune direction ni aucune signification d'ensemble, quel que soit le point de vue adopté."
        correct: false
        misconception: mc.philo.histoire.contingence-lue-comme-absurdite
        feedback: >
          C'est l'exact inverse de la thèse de Hegel, qui affirme au
