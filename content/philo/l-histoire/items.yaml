  - id: HIST-11
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_histoire
    tags: [passe, memoire, histoire]
    stem: >
      Pourquoi la leçon affirme-t-elle que « le passé », au sens le plus nu,
      ne pose, par lui-même, aucun problème philosophique ?
    type: mcq
    choices:
      - id: A
        text: "Parce que le passé désigne simplement tout ce qui a eu lieu, dans son détail exact et sa totalité, révolu et immuable -- qu'il soit connu, ignoré ou déformé par quiconque, rien n'y change ce qu'il a été."
        correct: true
      - id: B
        text: "Parce que le passé se confondrait, selon la leçon, avec la mémoire que chaque individu en garde -- il changerait donc selon ce que chacun choisit de s'en souvenir ou d'en oublier."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          C'est confondre passé et mémoire, alors que le chapitre 2 les distingue
          explicitement : la mémoire est une trace subjective et partielle
          du passé, pas le passé lui-même.
      - id: C
        text: "Parce que le passé se confondrait, selon la leçon, avec le récit que l'historien en construit -- il n'existerait donc qu'à travers le travail des historiens."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          C'est confondre passé et histoire (discipline) : le passé EST ce
          qui a eu lieu, indépendamment de tout récit qu'on en fait après
          coup.
      - id: D
        text: "Parce que rien, selon la leçon, n'aurait en réalité jamais eu lieu de façon déterminée -- le passé lui-même serait, par nature, contingent et incertain."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          Cela déplace, prématurément, la thèse de la contingence d'Aron
          (chapitre 5, sur le cours de l'Histoire) vers la définition neutre du
          passé posée au chapitre 2 -- deux questions distinctes.
    correct_feedback: >
      Le passé, au sens le plus nu, EST simplement ce qui a eu lieu --
      révolu et immuable. C'est la mémoire, l'histoire et l'Histoire qui,
      chacune à leur façon, posent des problèmes philosophiques distincts.
    solution: |
      **Le passé :** ce qui a eu lieu -- il ne pose aucun problème par
      lui-même.

      **Mémoire, histoire, Histoire :** trois notions construites À PARTIR
      de ce passé, chacune posant sa question propre.

      **Erreur à éviter :** confondre le passé avec l'une de ces notions.

  - id: HIST-12
