        correct: true
      - id: B
        text: "Il s'agit uniquement de savoir si l'exode était nécessaire ou non -- la question de savoir lequel des deux récits est le plus fiable relèverait, elle, de la seule méthode de l'historien et non d'un vrai problème philosophique."
        correct: false
        misconception: mc.philo.histoire.objection-du-chapitre-1-mal-lue
        feedback: >
          Cela ne retient que la moitié du problème : la leçon annonce
