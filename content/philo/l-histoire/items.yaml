notion: l-histoire
skill_code: philo_histoire
misconceptions: []

items:
  - id: HIST-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_histoire
    tags: [passe, memoire, histoire, histoire_processus]
    stem: >
      Quelle affirmation distingue correctement « la mémoire », « l'histoire »
      (comme discipline) et « l'Histoire » (comme processus), tels qu'ils sont
      définis dans cette leçon ?
    type: mcq
    choices:
      - id: A
        text: "« La mémoire » est une trace vécue et subjective, gardée par un individu ou un groupe ; « l'histoire » est le récit construit par l'historien selon une méthode critique, à partir de traces ; « l'Histoire » est le devenir collectif réel de l'humanité, dont ce récit essaie de rendre compte."
        correct: true
      - id: B
        text: "Ce sont trois mots pour une même réalité : la mémoire d'un témoin, le récit d'un historien et le devenir collectif de l'humanité coïncident nécessairement, puisqu'ils portent tous sur le même passé."
        correct: false
        feedback: >
          La leçon distingue justement ces trois réalités : un témoignage
          vécu (mémoire) peut contredire un récit d'historien (histoire),
          et aucun des deux ne restitue le devenir collectif (Histoire) dans
          sa totalité -- les fondre en un seul mot efface la question même
          que R5 va poser (l'objectivité de l'historien).
      - id: C
        text: "« L'histoire », comme discipline, désigne le devenir collectif réel de l'humanité ; « l'Histoire », avec une majuscule, désigne seulement le récit qu'on en fait dans un manuel scolaire."
        correct: false
        feedback: >
          C'est l'inverse de la distinction posée dans la leçon : l'histoire
          (discipline) est le récit construit par l'historien ; l'Histoire
          (processus) est le devenir collectif réel dont ce récit essaie de
          rendre compte.
      - id: D
        text: "« La mémoire » désigne exclusivement les souvenirs personnels d'un individu, jamais ceux d'un groupe ou d'un peuple."
        correct: false
        feedback: >
          La leçon définit la mémoire comme une trace vécue du passé, chez
          un individu OU chez un groupe (une famille, un peuple peuvent se
          souvenir collectivement d'un même événement) -- restreindre la
          mémoire au seul individu manque une partie de la définition.
    correct_feedback: >
      La mémoire est un vécu subjectif et partiel ; l'histoire (discipline)
      est un travail critique construit sur des traces ; l'Histoire
      (processus) est le devenir collectif réel que ce travail cherche à
      connaître -- trois réalités distinctes, pas des synonymes.
    solution: |
      **Le passé :** tout ce qui a eu lieu, dans son détail exact -- révolu,
      inaccessible désormais dans sa totalité.

      **La mémoire :** la trace vécue, subjective et partielle, qu'un
      individu ou un groupe garde de ce passé.

      **L'histoire (discipline) :** le récit que l'historien construit,
      selon une méthode critique, à partir de traces qui ont survécu.

      **L'Histoire (processus) :** le devenir collectif réel de l'humanité,
      dont le récit de l'historien essaie de rendre compte -- sans jamais
      s'y réduire.

  - id: HIST-2
    rung: "R2"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [hegel, ruse_de_la_raison, determinisme, liberte]
    stem: >
      Un élève écrit : « La ruse de la raison chez Hegel, c'est l'idée que les
      individus ne sont que des marionnettes sans liberté réelle, entièrement
      programmées pour réaliser un plan écrit d'avance. » Qu'est-ce que cette
      lecture manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le point central de la ruse de la raison : ce sont de VRAIES passions, librement exercées (l'ambition d'un César, par exemple), qui servent, sans coercition extérieure ni plan explicite, une fin rationnelle plus large -- la nécessité se réalise PAR cette liberté des passions, non en l'annulant."
        correct: true
      - id: B
        text: "Elle manque le fait que la ruse de la raison est en réalité une thèse de Marx sur les rapports de production, et non une thèse de Hegel."
        correct: false
        feedback: >
          C'est une erreur d'attribution : la ruse de la raison est un
          concept hégélien (R2), qui porte sur la réalisation de l'Esprit
          et de la liberté à travers les passions humaines -- Marx (R3)
          soutient une thèse différente, fondée sur les rapports de
          production et la lutte des classes, pas sur l'Esprit.
      - id: C
        text: "Elle manque le fait que, pour Hegel, aucun individu particulier -- ni César, ni Alexandre, ni Napoléon -- n'a jamais joué de rôle dans la réalisation de l'Histoire, qui se passerait entièrement des actions humaines concrètes."
        correct: false
        feedback: >
          C'est l'inverse : Hegel prend justement ces grands individus
          historiques comme exemples -- leurs passions bien réelles et
          concrètes (ambition, soif de pouvoir) sont le moyen même par
          lequel, selon lui, la Raison réalise une fin qui les dépasse.
      - id: D
        text: "Elle manque le fait que la ruse de la raison désigne un calcul conscient et délibéré, mené par les grands hommes eux-mêmes, en vue de réaliser sciemment la marche de la liberté."
        correct: false
        feedback: >
          C'est le contraire : le mécanisme repose précisément sur le fait
          que les individus n'ont PAS conscience de servir une fin plus
          large -- ils poursuivent leurs propres passions particulières,
          sans se donner pour but conscient de faire progresser la liberté
          humaine.
    correct_feedback: >
      La ruse de la raison n'est pas un déterminisme mécanique : elle décrit
      comment de vraies passions, librement poursuivies, servent, sans
      coercition ni plan conscient, une fin rationnelle qui dépasse
      l'intention de chaque individu.
    solution: |
      **La thèse :** l'Histoire est le processus par lequel l'Esprit parvient
      progressivement à la conscience de sa liberté, et à sa réalisation dans
      des institutions concrètes.

      **Le mécanisme :** la Raison se sert des passions particulières des
      individus (l'exemple de César) comme d'instruments, sans qu'ils en
      aient conscience -- la ruse de la raison.

      **Ce que ce n'est pas :** un déterminisme mécanique qui annulerait
      toute liberté -- ce sont de vraies passions, librement exercées, qui
      réalisent, par leur libre exercice même, une fin qui les dépasse.

  - id: HIST-3
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [marx, materialisme_historique, lutte_des_classes, hegel]
    stem: >
      Quelle affirmation résume correctement le matérialisme historique de
      Marx, et le distingue de la thèse de Hegel vue en R2 ?
    type: mcq
    choices:
      - id: A
        text: "Pour Marx, ce ne sont pas les idées qui déterminent l'être social, mais l'inverse : les rapports de production (l'infrastructure) déterminent les idées, le droit, la religion (la superstructure) -- un renversement frontal de Hegel, qui faisait au contraire descendre l'Histoire matérielle d'une Idée."
        correct: true
      - id: B
        text: "Le matérialisme historique est une thèse hégélienne, que Marx se serait contenté de reprendre et de renommer sans rien y changer."
        correct: false
        feedback: >
          C'est une mauvaise attribution, et la confusion la plus fréquente
          sur ce point du programme : c'est Hegel qui fait de l'Histoire la
          réalisation d'une Idée, d'un Esprit (R2) ; Marx reproche
          précisément à ce schéma d'avoir la démarche "sur la tête", et le
          retourne en plaçant la cause du côté des rapports matériels de
          production, pas des idées.
      - id: C
        text: "Pour Marx, l'Histoire avance par la seule évolution pacifique des idées politiques et religieuses, sans qu'aucun conflit économique n'y joue de rôle déterminant."
        correct: false
        feedback: >
          C'est l'inverse de la thèse marxiste : les contradictions entre
          rapports de production et forces productives ne se résolvent
          jamais, selon Marx, par la seule évolution des idées, mais par la
          lutte des classes -- l'affrontement entre ceux qui profitent des
          rapports existants et ceux qu'ils exploitent.
      - id: D
        text: "Le matérialisme historique soutient que seules les circonstances matérielles contingentes -- un puits, une lettre, une dispute -- expliquent l'Histoire, sans qu'aucun rapport de classe n'y intervienne."
        correct: false
        feedback: >
          C'est confondre le matérialisme historique de Marx (R3), qui
          identifie un moteur structurel -- les rapports de production et
          la lutte des classes --, avec la critique de la contingence
          d'Aron (R4), qui conteste au contraire toute nécessité d'ensemble.
          Ce sont deux positions distinctes.
    correct_feedback: >
      Marx renverse Hegel : ce n'est pas une Idée qui produit l'Histoire
      matérielle, mais les rapports de production (infrastructure) qui
      déterminent les idées et les institutions (superstructure) -- et c'est
      la lutte des classes qui fait passer d'une étape historique à l'autre.
    solution: |
      **Le renversement :** "ce n'est pas la conscience des hommes qui
      détermine leur être ; c'est au contraire leur être social qui
      détermine leur conscience."

      **Infrastructure / superstructure :** les rapports de production
      (base économique) déterminent le droit, la religion, la philosophie
      (superstructure) -- pas l'inverse.

      **Le moteur du changement :** la contradiction entre rapports de
      production et forces productives se résout par la lutte des classes,
      pas par la seule évolution des idées.

      **L'erreur à éviter :** attribuer ce renversement à Hegel, qui
      soutient exactement la thèse inverse (R2).

  - id: HIST-4
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [aron, contingence, historicisme, ideologie]
    stem: >
      Un élève objecte à Raymond Aron : « Si l'Histoire est contingente,
      c'est donc qu'elle est absurde -- aucun événement historique n'a de
      cause réelle, tout n'est que pur hasard. » Qu'est-ce que cette objection
      manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le point précis de la critique d'Aron : la contingence de l'Histoire ne nie pas que chaque événement ait des causes réelles et nombreuses -- elle conteste seulement qu'une seule loi nécessaire, connaissable à l'avance, aurait garanti que les choses se passent ainsi plutôt qu'autrement."
        correct: true
      - id: B
        text: "Elle manque le fait qu'Aron, comme Hegel et Marx, défend au contraire l'existence d'une nécessité unique qui gouvernerait tout le cours de l'Histoire."
        correct: false
        feedback: >
          C'est l'inverse de la thèse d'Aron : il conteste précisément la
          nécessité unique que Hegel (R2) et Marx (R3) affirment chacun à
          sa façon -- sa position n'est pas une nécessité de plus, mais une
          critique de toute nécessité de ce type.
      - id: C
        text: "Elle manque le fait que la critique de la contingence appartient en réalité au matérialisme historique de Marx, qui aurait le premier insisté sur le rôle du hasard en histoire."
        correct: false
        feedback: >
          C'est une mauvaise attribution : Marx (R3) affirme au contraire
          une nécessité -- la lutte des classes fait nécessairement passer
          d'une étape historique à la suivante. C'est Aron (R4) qui conteste
          cette nécessité au nom de la pluralité des causes contingentes.
      - id: D
        text: "Elle manque le fait qu'Aron réserve sa critique aux seuls événements très anciens, mais admet une nécessité stricte pour tous les événements historiques récents."
        correct: false
        feedback: >
          Rien, dans la critique d'Aron, ne limite la contingence à une
          période historique particulière : son objection porte sur la
          méthode même qui prétend établir des lois nécessaires de
          l'Histoire, quelle que soit l'époque considérée.
    correct_feedback: >
      Dire que l'Histoire est contingente ne revient pas à dire qu'elle est
      sans cause : Aron conteste seulement l'idée d'une loi nécessaire
      unique, connaissable à l'avance -- pas la possibilité d'expliquer
      causalement un événement après coup.
    solution: |
      **La contingence :** on ne trouve jamais, dans un événement historique,
      une cause unique et nécessaire, mais une pluralité de causes dont la
      combinaison n'était garantie par rien à l'avance.

      **Ce que cela n'implique pas :** l'Histoire n'est pas pour autant
      absurde ou sans cause -- Aron ne nie jamais la possibilité d'une
      explication causale rigoureuse (R5).

      **Le danger politique :** prétendre connaître le sens nécessaire de
      l'Histoire (l'opium des intellectuels) a servi à justifier, au nom
      d'une prétendue nécessité, des politiques d'une extrême violence.

  - id: HIST-5
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [marc_bloch, objectivite, critique_des_sources, traces]
    stem: >
      Pourquoi Marc Bloch insiste-t-il sur le fait que l'historien n'a jamais
      un accès direct au passé -- et qu'en conclut-il sur l'objectivité de
      l'histoire ?
    type: mcq
    choices:
      - id: A
        text: "L'historien ne dispose que de traces incomplètes et non neutres (documents, témoignages) qu'il doit soumettre à une critique rigoureuse des sources ; cette absence d'accès direct exige donc une méthode plus exigeante, pas moins de rigueur -- l'objectivité n'est pas niée, mais redéfinie comme un travail critique, non comme une copie du passé."
        correct: true
      - id: B
        text: "Puisque l'historien n'observe jamais directement le passé, Bloch en conclut que l'objectivité en histoire est un mot vide de sens, et que tout récit historique en vaut, au fond, un autre."
        correct: false
        feedback: >
          C'est l'inverse de la position de Bloch : il ne renonce jamais à
          l'exigence d'objectivité -- il la redéfinit comme une méthode
          critique rigoureuse (la critique des sources), précisément parce
          que l'accès direct au passé fait défaut.
      - id: C
        text: "Bloch soutient au contraire que l'historien, comme le physicien en laboratoire, peut observer et reproduire directement les événements du passé qu'il étudie."
        correct: false
        feedback: >
          C'est exactement le point que Bloch conteste : à la différence du
          physicien, l'historien n'a jamais accès au phénomène lui-même,
          seulement à des traces qui en subsistent -- documents, objets,
          témoignages.
      - id: D
        text: "Bloch réserve ce problème d'accès indirect aux seuls témoignages oraux, comme celui d'un grand-parent -- les documents écrits, eux, donneraient un accès direct et complet au passé."
        correct: false
        feedback: >
          La leçon ne fait pas cette distinction : pour Bloch, aucune trace
          -- écrite ou orale -- ne donne un accès direct au passé lui-même ;
          toutes doivent être soumises à la même critique des sources
          (authenticité, cohérence avec d'autres sources indépendantes).
    correct_feedback: >
      L'historien ne perçoit jamais le passé lui-même, seulement des traces
      partielles -- ce qui impose une critique rigoureuse des sources, et
      redéfinit l'objectivité comme une méthode, non comme une copie fidèle
      et totale du passé.
    solution: |
      **Le point de départ :** l'historien n'observe jamais directement son
      objet, contrairement au physicien -- il ne dispose que de traces
      survivantes, incomplètes et non neutres.

      **La critique des sources :** interroger chaque trace (origine,
      auteur, but) et la croiser avec d'autres sources indépendantes.

      **Objectif ne veut pas dire neutre :** l'absence d'accès direct
      n'ouvre pas la porte à un pur relativisme -- elle exige au contraire
      une méthode critique plus rigoureuse.

  - id: HIST-6
    rung: "R6"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [ricoeur, devoir_de_memoire, oubli, juste_memoire]
    stem: >
      Selon Ricœur, pourquoi le devoir de mémoire ne peut-il pas se
      contenter d'exiger qu'on « n'oublie jamais rien » ?
    type: mcq
    choices:
      - id: A
        text: "Parce que la mémoire collective, laissée sans critique, peut elle-même être manipulée ou instrumentalisée -- mobilisée pour légitimer une position présente ou entretenir un ressentiment perpétuel ; Ricœur appelle « juste mémoire » l'équilibre entre ne pas oublier les victimes et ne pas laisser la mémoire se figer en légende partisane."
        correct: true
      - id: B
        text: "Parce que, pour Ricœur, aucun événement du passé ne mérite réellement d'être retenu par la mémoire collective, l'oubli étant toujours préférable au souvenir."
        correct: false
        feedback: >
          C'est le contraire de la thèse de Ricœur : il part au contraire
          de l'idée que certains passés -- des crimes de grande ampleur --
          ne peuvent, moralement, être livrés à l'oubli, sous peine
          d'achever l'injustice commise envers leurs victimes.
      - id: C
        text: "Parce que le devoir de mémoire, selon Ricœur, se confond exactement avec le travail critique de l'historien décrit en R5 -- les deux ne formeraient qu'une seule et même exigence."
        correct: false
        feedback: >
          La leçon distingue les deux : le devoir de mémoire est une
          exigence morale de ne pas oublier certains passés ; le travail de
          l'historien (R5, Bloch) est une méthode critique de reconstitution
          des faits -- les deux se corrigent mutuellement, mais ne sont pas
          identiques.
      - id: D
        text: "Parce que la mémoire collective, à la différence de la mémoire individuelle, ne pourrait jamais être ni manipulée, ni instrumentalisée par quiconque."
        correct: false
        feedback: >
          C'est l'inverse du risque que Ricœur identifie : la mémoire
          collective peut au contraire être mobilisée sélectivement à des
          fins présentes -- c'est précisément ce risque qui justifie la
          recherche d'une "juste mémoire", ni oubli ni instrumentalisation.
    correct_feedback: >
      Le devoir de mémoire doit se garder de deux excès opposés : l'oubli,
      qui achève l'injustice envers les victimes, et une mémoire mal
      maîtrisée, qui peut se figer en instrument de division -- d'où
      l'exigence d'une "juste mémoire".
    solution: |
      **Le devoir de mémoire :** ne pas laisser l'oubli achever l'injustice
      commise envers des victimes d'un crime de grande ampleur.

      **Le risque inverse :** une mémoire collective non critique peut être
      manipulée ou instrumentalisée à des fins présentes.

      **La juste mémoire :** l'équilibre que Ricœur appelle de ses vœux --
      ni l'oubli, ni la mémoire figée en légende partisane -- articulé avec
      le travail critique de l'historien (R5).
