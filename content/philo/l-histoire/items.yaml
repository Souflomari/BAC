    correct_feedback: >
      Pour Hegel, l'Histoire est le processus par lequel l'Esprit parvient
      progressivement à la conscience de sa liberté, et à sa réalisation
      dans des institutions concrètes -- un processus rationnel et orienté.
    solution: |
      **La thèse :** l'Histoire réalise progressivement la liberté de
      l'Esprit, à travers des institutions concrètes.

      **Erreurs fréquentes :** attribuer à Hegel les rapports de production
      de Marx, ou la contingence d'Aron (chapitres 4 et 5).

  - id: HIST-13
    rung: "R2"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [hegel, ruse_de_la_raison, determinisme, liberte]
    stem: >
      D'après le mécanisme de la ruse de la raison, comment Hegel
      interpréterait-il le fait que chaque famille du douar, dans la
      situation du chapitre 1, ait agi par intérêt strictement privé -- la peur de
      la faim, l'espoir d'une vie meilleure -- sans se soucier le moins du
      monde de « la modernisation du pays » ?
    type: mcq
    choices:
      - id: A
        text: "Hegel dirait que ce sont, en réalité, les rapports de production agricole devenus intenables qui expliquent seuls cet exode, indépendamment de toute idée de liberté ou d'Esprit."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est la lecture matérialiste de Marx (chapitre 4), pas celle de Hegel :
          pour Hegel, ce qui se réalise à travers l'Histoire est une fin
          rationnelle et spirituelle -- la liberté --, pas un rapport de
          production.
      - id: B
        text: "Hegel dirait que cet exode ne prouve rien de particulier, puisque rien ne garantissait à l'avance que les familles partent plutôt qu'elles ne restent -- un pur assemblage de causes contingentes, sans direction d'ensemble."
        correct: false
        misconception: mc.philo.histoire.contingence-lue-comme-absurdite
        feedback: >
          C'est la critique d'Aron (chapitre 5), qui conteste justement l'idée
          d'une direction nécessaire -- Hegel affirme au contraire qu'un
          mouvement d'ensemble rationnel se réalise malgré la diversité des
          motifs particuliers.
      - id: C
        text: "Ces passions privées, réellement et librement poursuivies pour elles-mêmes, auraient malgré tout servi, sans qu'aucune famille ne le sache ni ne le veuille, un mouvement d'ensemble qui les dépasse."
        correct: true
      - id: D
        text: "Hegel dirait que ces familles n'avaient, en réalité, aucune liberté véritable dans leur décision de partir, entièrement programmées de l'extérieur par un plan déjà écrit d'avance."
        correct: false
        misconception: mc.philo.histoire.ruse-de-la-raison-durcie-en-determinisme
        feedback: >
          C'est réduire la ruse de la raison à un déterminisme mécanique --
          exactement l'erreur que la leçon signale : ce sont de VRAIES
          passions, librement exercées, qui réalisent, par leur libre
          exercice même, une fin qui les dépasse.
    correct_feedback: >
      La ruse de la raison : des passions privées, réellement libres,
      servent, sans que personne ne le sache ni ne le veuille, un mouvement
      d'ensemble qui dépasse chaque intention particulière.
    solution: |
      **Le mécanisme appliqué :** chaque famille agit par intérêt privé,
      sans viser la « modernisation ».

      **Ce que Hegel y verrait :** ces intérêts privés serviraient malgré
      tout, sans le savoir, un mouvement d'ensemble.

      **Erreurs à éviter :** lecture matérialiste (Marx), lecture purement
      contingente (Aron), déterminisme mécanique.

