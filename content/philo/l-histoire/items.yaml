          décalque parfait du passé lui-même.
      - id: D
        text: "Le témoignage de la grand-mère relève de la mémoire, un vécu subjectif et partiel ; le résumé du manuel relève de l'histoire comme discipline, une reconstruction appuyée sur d'autres sources."
        correct: true
    correct_feedback: >
      Mémoire (vécu subjectif) et histoire-discipline (reconstruction
