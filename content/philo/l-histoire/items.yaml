          social détermine la conscience, et non l'inverse.
      - id: C
        text: "L'infrastructure désignerait, chez Marx, les idées et les institutions d'une époque, tandis que la superstructure désignerait les rapports de production qui les sous-tendent."
        correct: false
        misconception: mc.philo.histoire.infrastructure-superstructure-inversees
        feedback: >
          C'est inverser les deux définitions : l'infrastructure est la
          base économique (les rapports de production) ; la superstructure
          est ce qui s'élève sur cette base.
      - id: D
        text: "L'infrastructure détermine la superstructure : ce sont les rapports de production qui expliquent les idées et les institutions d'une époque, et non l'inverse."
        correct: true
    correct_feedback: >
      « Ce n'est pas la conscience des hommes qui détermine leur être ;
      c'est au contraire leur être social qui détermine leur conscience » --
      l'infrastructure détermine la superstructure, pas l'inverse.
    solution: |
      **Infrastructure :** les rapports de production, la base économique.

      **Superstructure :** droit, religion, philosophie -- effet, pas cause
      première.

      **Le renversement :** l'être social détermine la conscience, contre
      le schéma hégélien où une Idée mène l'Histoire matérielle.

  - id: HIST-15
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [marx, materialisme_historique, lutte_des_classes]
    stem: >
      En reprenant la situation du chapitre 1, que dirait Marx du chapitre du manuel
      qui résume l'exode en une phrase, sous le titre « la modernisation du
      pays » ?
    type: mcq
    choices:
      - id: A
        text: "Ce discours sur « la modernisation » ne serait, pour Marx, qu'une idée de superstructure -- une manière, après coup, d'habiller en progrès respectable ce qui n'est d'abord qu'un rapport de production agricole devenu intenable, subi par les familles les plus démunies."
        correct: true
      - id: B
        text: "Marx dirait que c'est bien cette idée de modernisation, présente dans les esprits, qui a matériellement causé le départ des familles vers les villes."
        correct: false
        misconception: mc.philo.histoire.infrastructure-superstructure-inversees
        feedback: >
          C'est une inversion idéaliste, exactement ce que Marx reproche à
          Hegel : pour Marx, ce ne sont jamais les idées qui causent le
          mouvement matériel, mais l'inverse.
      - id: C
        text: "Marx approuverait entièrement le résumé du manuel, puisque les deux décrivent également une transition économique nécessaire, sans qu'aucun désaccord de méthode ne vienne les séparer, ni sur le fond ni sur la forme du propos."
        correct: false
        misconception: mc.philo.histoire.infrastructure-superstructure-inversees
        feedback: >
          Cela manque la critique propre à Marx : le manuel présente la
          modernisation comme une IDÉE explicative en soi, quand Marx y
          verrait l'habillage a posteriori d'un rapport de force économique.
      - id: D
        text: "Marx expliquerait cet exode par la ruse de la raison, les familles ayant servi, sans le savoir, la réalisation progressive de la liberté de l'Esprit."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est attribuer à Marx le mécanisme de Hegel (chapitre 3) : la ruse de la
          raison, l'Esprit et la liberté n'appartiennent pas au vocabulaire
          du matérialisme historique.
    correct_feedback: >
      Pour Marx, « la modernisation » n'est qu'une idée de superstructure --
      la cause réelle est matérielle : un rapport de production devenu
      intenable, et un rapport de force économique subi.
    solution: |
      **La lecture marxiste :** la cause réelle est un rapport de production
      devenu intenable, pas une « idée » de progrès.

      **Le discours du manuel :** une idée de superstructure, habillage a
      posteriori du rapport de force économique.

      **Erreur à éviter :** cause idéelle, ou mécanisme hégélien.

  - id: HIST-16
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [aron, contingence, historicisme]
    stem: >
      Quel reproche commun Raymond Aron adresse-t-il à la fois à Hegel (chapitre 3)
      et à Marx (chapitre 4) ?
    type: mcq
    choices:
      - id: A
        text: "Il leur reprocherait d'avoir inversé leurs thèses respectives -- Aron accuserait Hegel de matérialisme, et Marx d'idéalisme."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une erreur d'attribution : Hegel affirme une nécessité
          spirituelle (l'Esprit), Marx une nécessité matérielle (les
          rapports de production) -- Aron conteste chacune de ces deux
          nécessités pour ce qu'elle est, sans les confondre.
      - id: B
        text: "Il leur reproche d'affirmer chacun une nécessité unique censée gouverner l'ensemble du cours historique, alors que l'examen attentif de n'importe quel événement concret ne révèle jamais qu'une pluralité de causes contingentes, dont rien ne garantissait la combinaison à l'avance."
        correct: true
      - id: C
        text: "Sa critique viserait seulement Marx, la thèse de Hegel sur la liberté de l'Esprit échappant, selon lui, à toute discussion possible."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          La leçon est explicite : Aron conteste ce geste commun « chez
          l'un comme chez l'autre » -- sa critique ne se limite pas à Marx.
      - id: D
        text: "Il leur reprocherait, au contraire, de sous-estimer le rôle de la lutte des classes dans le cours historique, et chercherait à le renforcer plutôt qu'à le remettre en question, quitte à durcir encore la thèse marxiste sur ce point précis."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est l'inverse de la position d'Aron : il ne cherche pas à
          renforcer une nécessité historique, il conteste l'idée même d'une
          nécessité unique.
    correct_feedback: >
      Aron reproche à Hegel et à Marx d'affirmer chacun une nécessité
      unique, quand l'examen concret d'un événement ne révèle jamais qu'une
      pluralité de causes contingentes.
    solution: |
      **Le point commun visé :** Hegel et Marx affirment chacun une
      nécessité d'ensemble.

      **L'objection d'Aron :** l'examen concret révèle une pluralité de
      causes contingentes, jamais une nécessité unique.

      **Erreur à éviter :** croire que la critique viserait un seul auteur.

  - id: HIST-17
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [aron, ideologie, opium_des_intellectuels]
    stem: >
      Qu'est-ce qu'Aron désigne exactement par l'expression « l'opium des
      intellectuels », et quel danger vise-t-elle ?
    type: mcq
    choices:
      - id: A
        text: "L'expression désignerait simplement une préférence personnelle et sans conséquence politique d'Aron pour le scepticisme plutôt que pour l'optimisme historique."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          Cela trivialise la portée de l'expression : Aron vise un danger
          POLITIQUE précis -- la justification, au nom d'une prétendue
          nécessité historique, de politiques d'une extrême violence.
      - id: B
        text: "Ce danger serait celui que Hegel lui-même dénoncerait, à travers le mécanisme de la ruse de la raison, contre toute prétention à connaître le sens de l'Histoire à l'avance et à agir publiquement au nom de ce savoir supposé définitivement acquis."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une mauvaise attribution : c'est Hegel qui affirme une
          nécessité connaissable (la marche de la liberté) -- c'est
          précisément ce type de certitude qu'Aron met en cause.
      - id: C
        text: "Une idéologie qui prétend détenir la clé du sens nécessaire de l'Histoire peut justifier, au nom de cette prétendue nécessité, des politiques d'une extrême violence -- présentées comme le prix inévitable d'un progrès que « le sens de l'Histoire » rendrait, de toute façon, certain."
        correct: true
      - id: D
        text: "Ce danger désignerait le risque, identifié par Bloch (chapitre 6), qu'un historien trop proche affectivement de son sujet perde toute objectivité méthodologique."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est confondre deux critiques distinctes : celle d'Aron (chapitre 5) est
          politique, contre les idéologies du sens nécessaire ; celle de
          Bloch (chapitre 6) est méthodologique, contre un manque de rigueur dans
          la critique des sources.
    correct_feedback: >
      L'opium des intellectuels : la certitude de détenir le sens nécessaire
      de l'Histoire peut servir à justifier, après coup, des politiques
      d'une extrême violence présentées comme inévitables.
    solution: |
      **Le danger nommé :** une idéologie du sens nécessaire peut justifier
      une violence présentée comme le prix inévitable du progrès.

      **Ce que ce n'est pas :** ni une préférence personnelle, ni une thèse
      de Hegel, ni le souci méthodologique de Bloch (chapitre 6).

  - id: HIST-18
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [marc_bloch, critique_des_sources, objectivite]
    stem: >
      Que fait précisément l'historien, selon Bloch, quand il soumet une
      trace à la « critique des sources » ?
    type: mcq
    choices:
      - id: A
        text: "Il retient systématiquement le document le plus ancien qu'il trouve comme le plus fiable, sans avoir besoin de le confronter à d'autres sources."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est une méthode naïve : Bloch exige au contraire de croiser
          chaque trace avec d'autres sources indépendantes, quelle que soit
          son ancienneté.
      - id: B
        text: "Il choisit, parmi les sources disponibles, celle qui confirme le mieux ses propres convictions personnelles, et laisse délibérément de côté toutes celles qui viendraient les contredire."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est l'inverse d'une démarche objective : la critique des
          sources sert justement à corriger les présupposés du chercheur,
          pas à les confirmer en écartant ce qui les contredit.
      - id: C
        text: "Il se limite à vérifier la grammaire et le style d'un document, sans avoir à examiner son contenu ni le contexte de sa production."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          Cela réduit la critique des sources à un contrôle purement
          formel, alors qu'elle porte sur l'origine, l'auteur et le but du
          document, confrontés à d'autres sources indépendantes.
      - id: D
        text: "Il interroge l'origine du document, son auteur, le but dans lequel il a été produit, et il le confronte à d'autres sources indépendantes qui peuvent en confirmer ou en contredire le contenu."
        correct: true
    correct_feedback: >
      La critique des sources : interroger l'origine, l'auteur, le but
      d'une trace, et la croiser systématiquement avec d'autres sources
      indépendantes.
    solution: |
      **La méthode :** interroger chaque trace, puis la croiser avec
      d'autres sources indépendantes.

      **Ce que ce n'est pas :** ni un tri partial selon ses convictions, ni
      un simple contrôle formel de style.

  - id: HIST-19
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [marc_bloch, objectivite, traces]
    stem: >
      Face à la contradiction entre le témoignage de la grand-mère et le
      résumé du manuel (chapitre 1), que ferait un historien rigoureux, au sens de
      Bloch ?
    type: mcq
    choices:
      - id: A
        text: "Il croiserait ces deux récits avec d'autres traces indépendantes -- d'autres familles du douar, des archives locales, des données climatiques -- pour construire un récit plus solide qu'aucune des deux sources prise isolément."
        correct: true
      - id: B
        text: "Il choisirait le témoignage de la grand-mère plutôt que le manuel, un vécu direct étant toujours, par nature, plus fiable qu'un document administratif."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est confondre mémoire vécue et connaissance historique fiable :
          pour Bloch, aucune trace -- vécue ou écrite -- ne donne un accès
          direct au passé ; toutes doivent être soumises à la même critique.
      - id: C
        text: "Il s'en tiendrait au seul résumé du manuel scolaire, comme source institutionnelle, sans avoir besoin de le confronter à aucune autre trace."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est l'inverse de la critique des sources, qui exige de croiser
          systématiquement chaque trace, y compris institutionnelle, avec
          d'autres sources indépendantes.
      - id: D
        text: "Il conclurait que, faute d'accès direct au passé, aucun des deux récits ne peut jamais être jugé plus solide que l'autre, et que la question doit rester définitivement sans réponse, quelles que soient les traces retrouvées."
        correct: false
        misconception: mc.philo.histoire.objectivite-tout-ou-rien
        feedback: >
          C'est un relativisme que Bloch récuse explicitement : l'absence
          d'accès direct impose une méthode plus rigoureuse, pas un
          renoncement à toute conclusion.
    correct_feedback: >
      Un historien rigoureux croise les deux récits avec d'autres traces
      indépendantes, pour construire un récit plus solide qu'aucune des deux
      sources prise isolément.
    solution: |
      **La méthode de Bloch appliquée :** croiser grand-mère, manuel et
      autres traces indépendantes.

      **Erreur à éviter :** privilégier le vécu par nature, s'en tenir à
      une seule source, ou renoncer à toute conclusion.

  - id: HIST-20
    rung: "R6"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [ricoeur, devoir_de_memoire, oubli]
    stem: >
      Pourquoi Ricœur affirme-t-il que certains passés -- un crime de grande
      ampleur, par exemple -- ne peuvent, moralement, être livrés à l'oubli ?
    type: mcq
    choices:
      - id: A
        text: "Parce que l'oubli rendrait, selon lui, toute reconstitution historique techniquement impossible pour l'historien, indépendamment de toute question morale."
        correct: false
        misconception: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
        feedback: >
          Cela réduit l'argument moral de Ricœur à une simple question de
          méthode historienne (chapitre 6, Bloch) -- ce n'est pas ce qu'il vise :
          son argument porte sur ce qu'on doit aux victimes.
      - id: B
        text: "Parce qu'oublier purement et simplement un tel événement reviendrait à effacer une seconde fois ses victimes, jusqu'au souvenir même qu'elles ont existé et souffert."
        correct: true
      - id: C
        text: "Parce que Ricœur penserait que tout événement du passé, sans exception, mérite objectivement d'être commémoré au même titre."
        correct: false
        misconception: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
        feedback: >
          C'est une généralisation abusive : Ricœur vise des crimes de
          grande ampleur, pas n'importe quel événement -- et il insiste par
          ailleurs sur l'équilibre d'une « juste mémoire », jamais sur un
          devoir de tout commémorer indistinctement.
      - id: D
        text: "Parce qu'un peuple qui oublie son passé perdrait, selon Ricœur, toute identité nationale -- seule raison qu'il invoquerait pour ne rien oublier."
        correct: false
        misconception: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
        feedback: >
          La leçon n'invoque pas un argument identitaire : la raison donnée
          par Ricœur est morale -- ne pas achever, par l'oubli, l'injustice
          commise envers des victimes.
    correct_feedback: >
      Oublier un crime de grande ampleur reviendrait à effacer une seconde
      fois ses victimes -- c'est le fondement moral du devoir de mémoire
      chez Ricœur.
    solution: |
      **L'argument de Ricœur :** l'oubli achèverait l'injustice envers les
      victimes.

      **Ce qu'il ne dit pas :** ni un argument de méthode historienne, ni un
      devoir de tout commémorer, ni un argument identitaire.

  - id: HIST-21
    rung: "R6"
    difficulty_level: 3
    skill_code: philo_histoire
    tags: [ricoeur, juste_memoire, marc_bloch]
    stem: >
      Comment le devoir de mémoire (Ricœur, chapitre 7) et le travail critique de
      l'historien (Bloch, chapitre 6) se corrigent-ils l'un l'autre, selon la leçon ?
    type: mcq
    choices:
      - id: A
        text: "Ils seraient rigoureusement identiques, la « juste mémoire » n'étant qu'un autre nom pour la critique des sources."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          La leçon distingue les deux : le devoir de mémoire est une
          exigence morale de ne pas oublier ; le travail de l'historien est
          une méthode critique de reconstitution des faits.
      - id: B
        text: "Le devoir de mémoire remplacerait entièrement le travail de l'historien, rendant la critique des sources inutile dès qu'un événement est reconnu comme un crime grave."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          C'est l'inverse de ce que soutient la leçon : sans la critique
          historienne, la mémoire risque justement de dégénérer en légende
          partisane, non vérifiée.
      - id: C
        text: "Le devoir de mémoire rappelle qu'on ne peut pas tout oublier sans conséquence morale ; le travail critique de l'historien empêche cette mémoire de dégénérer en légende partisane, non vérifiée."
        correct: true
      - id: D
        text: "Ils seraient en réalité incompatibles, le devoir moral de mémoire interdisant par principe toute remise en question critique d'un récit déjà établi."
        correct: false
        misconception: mc.philo.histoire.memoire-histoire-passe-confondus
        feedback: >
          C'est une fausse opposition : la leçon affirme au contraire
          qu'ils se corrigent mutuellement, chacun compensant ce que
          l'autre, laissé seul, risquerait de manquer.
    correct_feedback: >
      Le devoir de mémoire et le travail de l'historien se corrigent
      mutuellement : l'un rappelle l'exigence morale de ne pas oublier,
      l'autre garantit la rigueur du récit.
    solution: |
      **Le devoir de mémoire :** ne pas oublier sans conséquence morale.

      **Le travail de l'historien :** empêcher la légende partisane.

      **Erreur à éviter :** les fondre en un seul geste, ou les opposer.

  - id: HIST-22
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_histoire
    tags: [dissertation, plan, aron, methode]
    stem: >
      Pour le sujet « L'histoire a-t-elle un sens ? », quels arguments et
      quels auteurs appartiennent à la partie II (l'antithèse) du plan
      proposé par la leçon ?
    type: mcq
    choices:
      - id: A
        text: "Hegel et Marx, puisque leurs deux thèses, bien qu'opposées entre elles sur le moteur de l'Histoire, se contrediraient déjà suffisamment pour former, à elles seules, une antithèse."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          Le plan de la leçon range Hegel et Marx tous deux dans la partie
          I (la thèse d'un sens nécessaire), malgré leur désaccord sur le
          moteur -- pas dans l'antithèse.
      - id: B
        text: "Bloch (chapitre 6), puisque sa critique des sources réfuterait directement l'idée d'une direction nécessaire de l'Histoire."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une confusion de catégories : Bloch traite la question de
          la CONNAISSANCE historique, distincte de celle du SENS de
          l'Histoire (chapitre 2) -- sa critique des sources ne réfute pas une
          direction nécessaire, elle porte sur la méthode.
      - id: C
        text: "Ricœur (chapitre 7), puisque son devoir de mémoire réfuterait directement la nécessité affirmée par Hegel et par Marx."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          Le devoir de mémoire de Ricœur relève du registre moral du
          dépassement (partie III), pas d'une réfutation de la nécessité
          historique -- ce rôle revient à Aron.
      - id: D
        text: "Aron (chapitre 5) : la pluralité des causes contingentes qu'on trouve dans tout événement historique examiné de près, et le danger politique qu'il nomme l'opium des intellectuels."
        correct: true
    correct_feedback: >
      La partie II mobilise Aron : la contingence irréductible de tout
      événement concret, et le danger politique de l'opium des
      intellectuels -- pas Hegel, Marx, Bloch ou Ricœur.
    solution: |
      **Partie I (thèse) :** Hegel et Marx -- un sens nécessaire.

      **Partie II (antithèse) :** Aron -- contingence et opium des
      intellectuels.

      **Erreur à éviter :** y placer Bloch ou Ricœur, qui répondent à
      d'autres questions (connaissance, mémoire).

  - id: HIST-23
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_histoire
    tags: [dissertation, problematique, marc_bloch, methode]
    stem: >
      Pour un sujet différent -- « Peut-on connaître le passé tel qu'il a
      réellement été ? » -- quel auteur de la leçon est le plus directement
      mobilisable pour construire la problématique, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Bloch (chapitre 6), parce qu'il porte précisément sur la possibilité et les conditions d'une objectivité historique malgré l'absence d'accès direct au passé -- une question de connaissance, distincte de celle du sens de l'Histoire."
        correct: true
      - id: B
        text: "Hegel, puisque le mécanisme de la ruse de la raison répondrait directement à la question de savoir si l'on peut connaître objectivement le passé, et fournirait du même coup sa méthode à l'historien."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est une confusion de catégories : la thèse de Hegel porte sur
          le sens et la direction de l'Histoire, pas sur la méthode par
          laquelle on établit une connaissance objective du passé.
      - id: C
        text: "Marx, puisque le matérialisme historique expliquerait, selon la même logique, comment se produit la connaissance historique elle-même et ce qui la rend fiable ou non."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          Le matérialisme historique explique ce qui fait avancer
          l'Histoire (rapports de production, lutte des classes), pas la
          méthode par laquelle l'historien établit et vérifie des faits.
      - id: D
        text: "Ricœur, puisque son devoir de mémoire équivaudrait directement à une connaissance objective du passé, la fidélité au souvenir tenant lieu de méthode critique."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est confondre mémoire (vécu subjectif, chapitre 2) et connaissance
          historique rigoureuse (chapitre 6) -- l'erreur exacte que le chapitre 2 met en
          garde.
    correct_feedback: >
      Le sujet porte sur la CONNAISSANCE du passé -- c'est Bloch (chapitre 6) qui
      traite cette question précise, distincte de celle du sens de
      l'Histoire (Hegel, Marx, Aron).
    solution: |
      **Le sujet :** une question de connaissance, pas de sens.

      **L'auteur pertinent :** Bloch -- objectivité malgré l'absence
      d'accès direct au passé.

      **Erreur à éviter :** mobiliser Hegel, Marx (sens) ou confondre
      mémoire et connaissance (Ricœur).

  - id: HIST-24
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_histoire
    tags: [dissertation, plan, hegel, marx, aron]
    stem: >
      Pour un autre sujet -- « Sommes-nous acteurs ou spectateurs de
      l'Histoire ? » -- quelle structure thèse/antithèse, fondée sur les
      auteurs de la leçon, serait la plus solide ?
    type: mcq
    choices:
      - id: A
        text: "Thèse -- Aron : les individus seraient de purs spectateurs, puisque rien n'est nécessaire et que nul ne maîtrise l'enchaînement réel des causes. Antithèse -- Hegel et Marx : les individus seraient de véritables acteurs libres, puisqu'une nécessité rationnelle garantirait le sens de leurs actions."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est inverser les deux positions : c'est Aron qui, en niant
          toute nécessité garantie d'avance, laisse aux individus une
          action réellement contingente ; Hegel et Marx, eux, rapprochent
          plutôt les individus d'instruments d'une fin qui les dépasse.
      - id: B
        text: "Thèse -- Hegel et Marx : les individus, même en poursuivant librement leurs passions ou leurs intérêts les plus particuliers, seraient sans le savoir les instruments d'une nécessité qui les dépasse. Antithèse -- Aron : aucune nécessité n'étant garantie à l'avance, ils seraient de véritables acteurs, dont les choix auraient toujours pu tourner autrement."
        correct: true
      - id: C
        text: "Thèse -- Bloch : les historiens seraient les seuls véritables acteurs de l'Histoire, puisqu'eux seuls établissent objectivement ce qui s'est passé."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est appliquer hors de propos le thème de Bloch (chapitre 6, la
          connaissance du passé) à une question distincte, celle du rôle
          des individus DANS l'Histoire -- que la leçon ne traite pas par
          ce biais.
      - id: D
        text: "Il n'y aurait, en réalité, aucune tension véritable sur ce sujet, Hegel, Marx et Aron s'accordant tous à dire que les individus ne sont jamais que de purs spectateurs sans la moindre influence réelle."
        correct: false
        misconception: mc.philo.histoire.auteurs-echanges
        feedback: >
          C'est un faux consensus : Aron s'oppose justement à Hegel et
          Marx sur ce point, et même la ruse de la raison hégélienne
          suppose des passions réellement et librement exercées.
    correct_feedback: >
      Thèse -- Hegel et Marx rapprochent les individus d'instruments d'une
      nécessité qui les dépasse ; antithèse -- Aron en fait de véritables
      acteurs, faute de toute nécessité garantie d'avance.
    solution: |
      **Thèse :** Hegel, Marx -- instruments d'une nécessité (spectateurs).

      **Antithèse :** Aron -- contingence, donc acteurs véritables.

      **Erreur à éviter :** inverser les deux camps, ou nier toute tension.

  # Ajouté le 2026-09-05 : TROIS familles siégeaient à 2 items du banc, donc
  # sous le plancher de 3 — les déformations de Hegel, de Marx et de Ricœur.
  # Un item de synthèse les vise ensemble : c'est le geste du barreau 7 (choisir
  # entre quatre résumés d'auteurs), et il ne double aucun item existant, qui
  # travaillent chacun un auteur isolément.
  - id: HIST-25
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_histoire
    tags: [synthese, hegel, marx, ricoeur, aron]
    stem: >
      Quatre élèves résument chacun un auteur du chapitre. Un seul de ces
      résumés est FIDÈLE à l'auteur qu'il prétend résumer. Lequel ?
    type: mcq
    choices:
      - id: A
        text: "Aron : l'Histoire est contingente, ce qui ne veut pas dire qu'elle soit sans causes, mais qu'aucune loi connue d'avance ne garantissait qu'elle se déroule ainsi plutôt qu'autrement."
        correct: true
      - id: B
        text: "Hegel : la ruse de la raison signifie que les hommes sont les instruments passifs d'un plan qui les traverse, sans passions propres ni initiative véritable."
        correct: false
        misconception: mc.philo.histoire.ruse-de-la-raison-durcie-en-determinisme
        feedback: >
          Le mécanisme hégélien tient sur DEUX termes, et ce résumé en supprime
          un. Les individus poursuivent bel et bien leurs passions propres, avec
          une initiative réelle — c'est même leur énergie qui fait avancer
          l'Histoire. Ce qu'ils ignorent, c'est le résultat d'ensemble auquel
          leurs actions concourent. Supprimer leur liberté en fait des
          marionnettes ; supprimer leur ignorance en ferait des calculateurs
          conscients de la fin de l'Histoire. Ni l'un ni l'autre n'est Hegel.
      - id: C
        text: "Marx : ce sont les idées dominantes d'une époque — sa religion, son droit, sa philosophie — qui déterminent en dernière instance ses rapports de production."
        correct: false
        misconception: mc.philo.histoire.infrastructure-superstructure-inversees
        feedback: >
          C'est exactement le renversement que Marx opère, pris à l'envers.
          Pour lui, l'infrastructure — les rapports de production — détermine
          en dernière instance la superstructure — droit, religion,
          philosophie. Les idées d'une époque sont l'effet de son organisation
          économique avant d'en être la cause. Inverser les deux termes revient
          à revenir à ce que Marx critique.
      - id: D
        text: "Ricœur : le devoir de mémoire commande de commémorer chaque événement du passé au même titre, aucune sélection n'étant légitime."
        correct: false
        misconception: mc.philo.histoire.memoire-sacralisee-ou-disqualifiee
        feedback: >
          Ricœur ne demande pas de tout retenir — une mémoire totale ne serait
          plus une mémoire, seulement un stock. Il pense au contraire le travail
          par lequel une collectivité fait le tri, ce qui suppose que la mémoire
          soit faillible et révisable, donc justiciable du travail de
          l'historien. Sacraliser la mémoire et la disqualifier sont deux
          manières symétriques de manquer ce point.
    correct_feedback: >
      Seul le résumé d'Aron est fidèle. Contingence ne veut pas dire absence de
      causes : chaque événement en a, et de nombreuses. Elle veut dire qu'aucune
      nécessité connaissable d'avance ne commandait ce déroulement-là — c'est
      cette nécessité que les idéologies du sens de l'Histoire croient tenir.
    solution: |
      Les trois résumés faux le sont chacun par une déformation caractéristique.

      **Hegel (chapitre 3).** La ruse de la raison articule deux choses : les
      individus agissent LIBREMENT, poussés par leurs passions, et ils IGNORENT
      le résultat d'ensemble auquel ils contribuent. Retirer la liberté en fait
      des marionnettes, retirer l'ignorance en fait des exécutants conscients :
      dans les deux cas, il n'y a plus de ruse.

      **Marx (chapitre 4).** Le matérialisme historique renverse l'idéalisme :
      l'infrastructure économique détermine la superstructure idéologique, et
      non l'inverse. Le résumé C rétablit précisément ce que Marx renverse.

      **Ricœur (chapitre 7).** Le devoir de mémoire n'est ni l'obligation de
      tout conserver, ni le soupçon généralisé contre le souvenir. C'est un
      TRAVAIL — de sélection, de rectification, de confrontation aux traces —
      qui suppose la mémoire faillible, donc perfectible.

      **Aron (chapitre 5).** La contingence n'est pas le hasard : elle nie la
      nécessité connue d'avance, pas la causalité.

