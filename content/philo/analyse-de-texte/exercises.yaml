exercises:

  - id: r-bac
    title: "Exercice de type bac — le devoir (Kant, 2023 R)"
    sourcing:
      status: sourced
      note: >-
        2023 session rattrapage — alloschool element/142716 (scan RS 05) ;
        texte transcrit intégralement dans docs/sujets/philo/le-devoir.md
        (entrée 2023 R), cross-listé comme matériau de méthode dans
        docs/sujets/philo/analyse-de-texte.md.
    intro: |-
      **حلّل (ي) النص و ناقشه (يه).**

      *(« Analyse le texte et discute-le. » — consigne invariable de
      l'épreuve ; rappel : le jour de l'examen, tu composeras ta réponse en
      arabe, pas en français.)*

      **Texte arabe (original) :**

      " مما يتفق مع الواجب ألا يرفع التاجر من السعر على زبونه قليل الخبرة، و
      إن التاجر الفطن يتحاشى ذلك بالفعل حيثما راج سوق البيع و الشراء، بل إنه
      يحافظ على سعر موحّد لجميع الزبناء حتى يستطيع الطفل أن يشتري بنفس السعر
      الذي يشتري به الإنسان الراشد؛ فالتاجر يعامل زبناءه، هنا، بأمانة. غير أن
      هذه المعاملة الأمينة لا تكفي على الإطلاق للقول إن التاجر قد تصرف
      انطلاقا من الإيمان بالواجب لأن مصلحته قد اقتضت ذلك. و لا يستطيع الإنسان
      في هذا المقام أن يفترض أنه كان يحمل في نفسه ميلا مباشرا نحو زبنائه؛ حيث
      جعلته هذه العاطفة التي يحس بها نحوهم لا يفضّل واحدا منهم على الآخر في
      السعر. و إذن، فإن التاجر لم يتصرف لا عن واجب و لا عن ميل مباشر، بل كان
      الباعث على تصرفه هو المصلحة الذاتية وحدها.

      و على العكس من ذلك، فإن محافظة الإنسان على حياته واجب، و هي بالإضافة
      إلى هذا أمر يشعر كل واحد منا نحوه بميل مباشر. غير أن الحرص الشديد الذي
      يخالج معظم الناس على حياتهم لا ينطوي على قيمة ذاتية، و المسلَّمة التي
      يقوم عليها لا تحتوي على أي مضمون أخلاقي. إنهم يحافظون حقا على حياتهم
      بما يتفق مع الواجب و لكنهم لا يفعلون ذلك عن شعور بالواجب. و على خلاف
      ذلك، حين تفقد المشاكل إنسانا يائسا كل طعم للحياة، و حين تصبح حياة إنسان
      عزيز النفس شقية فيشعر بالغضب إلى درجة أنه يتمنى لنفسه الموت و لكنه
      يحافظ، مع ذلك، على الحياة دون أن يحبها؛ عندئذ تكون مسلَّمته ذات مضمون
      أخلاقي، أي أنها تصدر عن شعور بالواجب لا عن ميل أو خوف."

      **Traduction de travail française :**

      « Il est conforme au devoir que le marchand ne surfasse pas le prix au
      client inexpérimenté ; et le marchand avisé s'en garde effectivement là
      où le commerce est actif : il maintient au contraire un prix unique
      pour tous les clients, de sorte qu'un enfant puisse acheter au même
      prix qu'un adulte. Le marchand traite donc ici ses clients avec
      probité. Mais ce traitement honnête ne suffit nullement à affirmer que
      le marchand ait agi par foi dans le devoir, car son intérêt le lui
      commandait. On ne saurait davantage, en ce cas, supposer qu'il ait
      porté en lui-même une inclination immédiate envers ses clients — une
      affection qui l'aurait conduit à ne favoriser aucun d'eux sur le prix.
      Le marchand n'a donc agi ni par devoir, ni par inclination immédiate :
      le mobile de sa conduite fut le seul intérêt personnel.

      À l'inverse, conserver sa vie est un devoir, et c'est en outre une
      chose vers laquelle chacun de nous est porté par une inclination
      immédiate. Mais le soin anxieux que la plupart des hommes y mettent
      n'enveloppe aucune valeur intrinsèque, et la maxime sur laquelle il
      repose ne contient aucun contenu moral. Ils conservent bien leur vie
      conformément au devoir, mais ils ne le font pas par sentiment du
      devoir. Au contraire, lorsque les épreuves ôtent à un homme désespéré
      tout goût de la vie, et que l'existence d'un homme au cœur fier devient
      si malheureuse qu'il en vienne, de colère, à souhaiter sa propre mort —
      et que néanmoins il conserve la vie sans l'aimer, non par inclination
      ni par peur, mais par devoir — alors sa maxime a un contenu moral :
      elle procède du sentiment du devoir, et non d'une inclination ou d'une
      crainte. »
    questions:
      - id: q1
        part: "Partie 1 — Compréhension : encadrer et dégager la thèse"
        stem: |-
          Rattache ce texte à sa notion et à son module (une phrase). Dégage
          ensuite son thème, puis sa thèse — l'affirmation précise que
          l'auteur défend, pas une prémisse ni un exemple.
        reasoning: |-
          Ce texte appartient au module de la morale, autour de la notion du
          devoir — le contenu complet, tu l'as dans `le-devoir` ; ici on ne
          fait que le nommer.

          Le thème : le devoir et ses mobiles possibles (l'intérêt,
          l'inclination, le devoir lui-même). Le réflexe à appliquer, exactement
          celui qu'on a construit sur Bakounine : je cherche la phrase que
          l'auteur DÉFEND, pas un exemple ni une prémisse. « Le marchand
          traite ses clients avec probité » n'est pas la thèse — c'est une
          prémisse que le texte va ensuite examiner et écarter comme non
          probante. La thèse, c'est ce que Kant en tire : **un acte n'a de
          valeur morale que s'il procède du sentiment du devoir, et non de
          l'inclination ni de l'intérêt — même quand son résultat extérieur
          est identique à celui d'un acte moral.**

      - id: q2
        part: "Partie 1 — Problématiser"
        stem: |-
          Formule la problématique du texte : quelle tension entre deux
          réponses également défendables la thèse tranche-t-elle ?
        reasoning: |-
          On applique le principe de R2 : la problématique n'est pas « le
          texte parle du devoir, qu'est-ce que le devoir ? » (une
          reformulation du thème, sans tension) — c'est une mise en tension
          réelle. L'intuition spontanée est que le résultat extérieur d'un
          acte (son effet, sa conformité) suffit à en juger la valeur
          morale — le marchand honnête « fait ce qu'il faut ». Le texte
          affirme l'inverse : seul le mobile intérieur compte, et un acte
          identique dans ses effets peut n'avoir aucune valeur morale (le
          marchand) ou en avoir une pleinement (l'homme qui conserve sa vie
          sans l'aimer, par devoir seul).

          Une formulation possible : *Suffit-il qu'un acte soit conforme au
          devoir dans ses effets pour avoir une valeur morale, ou faut-il
          qu'il procède du sentiment même du devoir, indépendamment de ce
          qu'il produit ?*

      - id: q3
        part: "Partie 2 — Analyse : structure argumentative"
        stem: |-
          Décris le mouvement du texte : quels procédés Kant utilise-t-il, et
          comment le texte progresse-t-il du premier exemple (le marchand) au
          second (la conservation de la vie) ?
        reasoning: |-
          On applique la lecture connecteur par connecteur construite sur
          Bakounine. Le texte procède par **comparaison/opposition entre
          deux exemples parallèles**, reliés par « à l'inverse » en tête du
          second paragraphe. Premier exemple : le marchand agit « avec
          probité », mais le texte NUANCE aussitôt (« mais ce traitement
          honnête ne suffit nullement… car son intérêt le lui commandait ») —
          conclusion partielle : ni devoir, ni inclination, seul l'intérêt.
          Deuxième exemple : la conservation de la vie, un devoir ET une
          inclination immédiate chez la plupart — mais le texte opère un
          second contre-cas, introduit par « au contraire » : le cas de
          l'homme désespéré qui conserve sa vie SANS l'aimer, contre son
          inclination (il souhaiterait mourir), uniquement par devoir — c'est
          SEULEMENT alors, dit le texte, que « sa maxime a un contenu
          moral ».

          La fonction de cette construction en miroir : isoler
          expérimentalement le mobile en faisant varier, d'un exemple à
          l'autre, la présence ou l'absence d'inclination, pour montrer que
          seule la présence du sentiment du devoir — jamais l'acte en
          lui-même — produit la valeur morale.

      - id: q4
        part: "Partie 2 — Analyse : concepts et présupposés"
        stem: |-
          Définis, tels que le texte les emploie, les concepts de « devoir »,
          « inclination » et « intérêt ». Quel présupposé le texte doit-il
          tenir pour acquis pour que sa distinction ait un sens ?
        reasoning: |-
          On applique le réflexe de R4 : définir avec le texte, pas avec le
          cours. Le texte n'oppose pas abstraitement ces trois notions, il
          les distingue par leurs manifestations concrètes : l'**intérêt**
          (le mobile du marchand — ce que sa situation lui commande) ;
          l'**inclination** (un attachement immédiat et spontané, comme
          l'attachement à sa propre vie chez la plupart des hommes) ; le
          **devoir** (un mobile qui persiste précisément quand l'inclination
          s'inverse ou disparaît — l'homme désespéré agit par devoir
          justement PARCE QU'il n'a plus l'inclination à vivre).

          Le présupposé implicite, jamais énoncé comme tel : que c'est le
          MOBILE d'un acte, et non son seul résultat extérieur, qui
          détermine sa valeur morale. Sans cette supposition, les deux
          exemples — identiques dans leurs actes extérieurs (le prix payé
          est honnête ; la vie est préservée dans les deux cas) — ne
          pourraient jamais être distingués moralement comme le fait le
          texte.

      - id: q5
        part: "Partie 3 — Discussion"
        stem: |-
          Discute cette thèse : évalue d'abord sa cohérence interne, puis
          mobilise une position convergente et une position divergente,
          pertinentes pour cette thèse précise.
        reasoning: |-
          **Discussion interne.** La construction en miroir des deux exemples
          est cohérente et rigoureuse — elle isole bien le mobile comme
          variable pertinente. Une limite réelle, cependant : le texte
          suppose qu'on puisse identifier avec certitude le mobile réel d'un
          acte, y compris celui de l'homme désespéré ; or le mobile est
          intérieur, jamais observable directement — le texte l'affirme sur
          le cas extrême (le désespéré) précisément parce que c'est le seul
          cas où l'inclination et le devoir sont clairement dissociés par les
          circonstances mêmes.

          **Position convergente.** Le texte prépare directement ce que la
          leçon `le-devoir` développe comme le cœur de l'éthique kantienne :
          juger un acte à son mobile plutôt qu'à son résultat, contre toute
          éthique qui ferait dépendre la valeur morale des seules
          conséquences.

          **Position divergente.** Une éthique conséquentialiste (utilitariste,
          par exemple) objecterait que ce qui compte, c'est l'effet produit :
          le client, lui, paie un prix honnête et en bénéficie réellement,
          quel que soit le mobile invisible du marchand — juger l'acte à un
          mobile qu'on ne peut jamais vérifier de l'extérieur rendrait la
          morale inapplicable en pratique.

      - id: q6
        part: "Partie 4 — Synthèse"
        stem: |-
          Rédige la synthèse : fais le bilan de l'analyse et de la
          discussion, réponds à la problématique posée, puis propose une
          position personnelle argumentée qui rouvre une question.
        reasoning: |-
          On applique la structure construite sur Bakounine : bilan
          articulé, réponse explicite à la problématique, position qui
          rouvre plutôt qu'elle ne ferme.

          *Bilan :* l'analyse a montré que Kant isole le mobile, et non le
          résultat, comme seul critère de la valeur morale, par une
          construction en miroir de deux exemples. La discussion a confirmé
          la cohérence interne de ce geste, tout en relevant sa limite — le
          mobile réel n'est jamais directement observable — et une objection
          de poids venue du conséquentialisme, qui juge par les effets.
          *Réponse à la problématique :* non, la conformité extérieure ne
          suffit pas ; c'est le mobile qui fait la valeur morale d'un acte,
          selon Kant, y compris quand cela rend le jugement moral
          difficilement vérifiable de l'extérieur. *Position personnelle
          argumentée, qui rouvre :* si le mobile seul compte mais reste
          inaccessible à autrui, alors la morale kantienne juge peut-être
          avec justesse en théorie, tout en laissant ouverte une question
          pratique qu'elle ne résout pas elle-même — comment juger moralement
          les actes des autres, si le seul critère qui compte nous est, par
          définition, fermé ?

  - id: r-variation
    title: "Le texte sur la vérité, en entier (2025 N)"
    sourcing:
      status: sourced
      note: >-
        2025 session normale — alloschool element/146054 (scan NS 05) ;
        texte réel utilisé comme seconde application attempt-first plutôt
        qu'une variation fabriquée — voir docs/sujets/philo/analyse-de-texte.md.
    intro: |-
      **حلّل (ي) النص و ناقشه (يه).**

      *(« Analyse le texte et discute-le. » Même consigne invariable — et
      même rappel : composition en arabe le jour de l'épreuve.)*

      Ce texte reprend, en entier, l'extrait que tu as vu tout au début de
      cette leçon (R0). Sa structure est différente de celle de Bakounine et
      de Kant — une thèse relativiste qui articule les sens et la raison.
      Reconnais la procédure sur cette structure différente : c'est le
      meilleur test que tu puisses te donner que tu as vraiment appris le
      geste, pas seulement retenu un exemple.

      **Texte arabe (original) :**

      إن الحواس هي معيار الحقيقة. و لكن المعيار هو الحواس كلها، فقد تخدعنا
      حاسة واحدة، كما يخدعنا الضوء بالنسبة للألوان، أو المسافة بالنسبة
      للحجم. و لا تستطيع أن تصحّح ما تحدثه حاسة من خطأ إلا حاسة أخرى.
      والحقيقة هي الإحساس الثابت، غير أن الإحساس يجب أن يشمل كل ما نتعلّمه
      من الآلات التي نوسّع بها دائرة الحواس و نجعلها دقيقة. فالتلسكوب و
      الميكروسكوب و غيرهما هي وسائل لمضاعفة ما تبصره عيوننا، و الهاتف و
      سماعة الطبيب هما امتداد لآذاننا العجيبة. و ليس ثمة أمور مطلقة بل أمور
      نسبية فقط، و علينا أن نتعلم كيف نساير الأمور النسبية. و هناك غيرنا من
      الناس في هذا العالم، و لن تتفق حواسهم دائما مع حواسنا، و بالتالي
      حقائقهم مع حقائقنا. فالحقيقة عبارة عن قبة من البلور متعدد الألوان حيث
      يرى كل واحد من زاويته تأليفا خاصا من الألوان.

      أين، إذن، موضع العقل؟ إن وظيفته هنا كما في كل مكان هي التنسيق، إنه
      ينسّق الإحساسات إلى معان، و المعاني إلى معرفة، و المعرفة إلى حكمة. إن
      عمل العقل في الظفر بالحقيقة ثانوي لكنه حيوي، إذ يجب أن ينسج فوضى
      الحواس المختلفة و ما بينها من تناقض في نتائج موحّدة و منسّقة تكون
      عرضة للتحقيق و التأييد أو الحذف بواسطة الإحساس المتكرّر، و كل خطوة
      استدلالية تبعد عن الإحساس المباشر تقلّل من احتمال الحقيقة. إننا نقف
      على أقدامنا ثابتين على الأرض بواسطة الإحساس.

      **Traduction de travail française :**

      « Les sens sont le critère de la vérité. Mais le critère, c'est
      l'ensemble des sens : un seul sens peut nous tromper, comme la lumière
      nous trompe sur les couleurs, ou la distance sur la grandeur ; et
      l'erreur produite par un sens ne peut être corrigée que par un autre
      sens. La vérité est la sensation constante ; toutefois, la sensation
      doit englober tout ce que nous apprenons des instruments par lesquels
      nous élargissons le domaine des sens et les rendons précis. Le
      télescope, le microscope et les autres ne sont que des moyens de
      démultiplier ce que voient nos yeux ; le téléphone et le stéthoscope
      prolongent nos oreilles admirables. Il n'y a pas de choses absolues,
      mais seulement des choses relatives, et il nous faut apprendre à
      composer avec le relatif. Il existe d'autres hommes que nous en ce
      monde, dont les sens ne s'accorderont pas toujours aux nôtres — ni,
      partant, leurs vérités aux nôtres. La vérité est comme un dôme de
      cristal aux mille couleurs, où chacun, depuis son angle, aperçoit un
      agencement singulier de couleurs.

      Où est donc, alors, la place de la raison ? Sa fonction, ici comme
      partout, est la coordination : elle ordonne les sensations en
      significations, les significations en connaissance, la connaissance en
      sagesse. Le travail de la raison dans la conquête de la vérité est
      secondaire, mais vital : elle doit tisser le chaos des sens divers et
      leurs contradictions en résultats unifiés et coordonnés, soumis à la
      vérification, à la confirmation ou au rejet par la sensation répétée ;
      et tout pas de raisonnement qui s'éloigne de la sensation immédiate
      diminue la probabilité de la vérité. C'est par la sensation que nous
      nous tenons debout, les pieds fermes sur la terre. »
    questions:
      - id: q1
        part: "Partie 1 — Compréhension : encadrer et dégager la thèse"
        stem: |-
          Rattache ce texte à sa notion (une phrase). Dégage son thème, puis
          sa thèse précise.
        reasoning: |-
          Ce texte relève de la réflexion sur la connaissance, autour de la
          notion de vérité — contenu déjà possédé via `la-verite` et
          `theorie-experience` (sens/raison, relativité) ; on ne le
          réexplique pas ici.

          Le thème : le critère de la vérité. Le réflexe : je cherche la
          phrase que l'auteur DÉFEND, pas une concession ni une image. « Un
          seul sens peut nous tromper » n'est pas la thèse — c'est une
          concession que le texte fait pour affiner sa position, pas ce
          qu'il affirme au final. La thèse : **le critère de la vérité est
          l'ensemble des sens, coordonné par la raison — aucun sens isolé ne
          suffit, et aucun raisonnement qui s'éloigne trop de la sensation
          immédiate n'est fiable non plus.**

      - id: q2
        part: "Partie 1 — Problématiser"
        stem: |-
          Formule la problématique du texte.
        reasoning: |-
          On évite la reformulation plate (« le texte parle de la vérité et
          de la relativité, la vérité est-elle relative ? ») pour construire
          une vraie tension. Le texte affirme à la fois que la vérité tient à
          la sensation individuelle (donc potentiellement variable d'une
          personne à l'autre — « leurs vérités aux nôtres ») et qu'elle
          requiert la coordination rationnelle de CES sensations en un
          résultat commun, vérifiable.

          Une formulation possible : *Si la vérité repose sur des sensations
          qui diffèrent d'un individu à l'autre, la vérité elle-même est-elle
          nécessairement relative — ou la coordination rationnelle des sens
          permet-elle malgré tout d'atteindre quelque chose de commun ?*

      - id: q3
        part: "Partie 2 — Analyse : structure argumentative"
        stem: |-
          Décris le mouvement du texte : quels procédés l'auteur utilise-t-il,
          et comment le texte bascule-t-il d'un premier mouvement à un
          second ?
        reasoning: |-
          Même lecture connecteur par connecteur que sur Bakounine et Kant.
          Premier mouvement : la thèse est posée (« les sens sont le critère
          de la vérité »), puis nuancée par une **concession** (« mais… un
          seul sens peut nous tromper »), puis précisée par une
          **définition** (« la vérité est la sensation constante »), enrichie
          par une **comparaison/exemple** (télescope, microscope, téléphone,
          stéthoscope comme extensions des sens), et conclue par une image
          relativiste (le dôme de cristal). Une **question de transition**
          fait ensuite basculer le texte (« où est donc la place de la
          raison ? ») vers un second mouvement, qui **définit** la raison par
          sa fonction (coordination, en trois étapes : sensations →
          significations → connaissance → sagesse) et conclut par une
          **causalité** explicite : plus un raisonnement s'éloigne de la
          sensation immédiate, moins il est probable qu'il soit vrai.

          La question de transition n'est pas un ornement : c'est elle qui
          fait passer le texte d'une thèse empiriste avec ses limites à sa
          complétion rationaliste — repérer ce basculement, c'est voir
          comment le texte AVANCE.

      - id: q4
        part: "Partie 2 — Analyse : concepts et présupposés"
        stem: |-
          Définis, tels que le texte les emploie, les concepts de « sens »,
          de « raison » et de « vérité ». Quel présupposé le texte tient-il
          pour acquis, sans jamais l'énoncer ?
        reasoning: |-
          On définit avec le texte, pas avec le cours. Les **sens** : la
          source matérielle de la connaissance, faillibles pris isolément,
          fiables coordonnés entre eux et prolongés par des instruments. La
          **raison** : non une faculté de connaître par elle-même, mais une
          fonction de coordination — elle « ordonne » et « tisse », elle ne
          fabrique rien à partir de rien. La **vérité** : « la sensation
          constante », étendue par les instruments, vérifiée par la
          répétition.

          Le présupposé implicite : que les sens, malgré leurs erreurs
          possibles pris isolément, restent la SEULE source de matière pour
          la connaissance — la raison ne fait qu'organiser ce qu'ils
          fournissent. Sans cette supposition, on ne comprendrait pas
          pourquoi le texte conclut que « c'est par la sensation que nous
          nous tenons debout, les pieds fermes sur la terre », après avoir
          longuement défendu le rôle de la raison.

      - id: q5
        part: "Partie 3 — Discussion"
        stem: |-
          Discute cette thèse : évalue sa cohérence interne, puis mobilise
          une position convergente et une position divergente, pertinentes
          pour cette thèse précise.
        reasoning: |-
          **Discussion interne.** Le texte tient une position équilibrée et
          cohérente — ni empirisme naïf (les sens seuls suffisent), ni
          rationalisme qui se passerait des sens. Une limite réelle : le
          texte affirme que la raison « tisse » les contradictions des sens
          en résultats coordonnés, sans jamais préciser LE mécanisme concret
          de cette coordination — la structure argumentative l'énonce comme
          une fonction, pas comme une méthode démontrée.

          **Position convergente.** Kant, dans une formule bien connue
          (« sans la sensibilité, aucun objet ne serait donné ; sans
          l'entendement, aucun ne serait pensé »), défend une collaboration
          nécessaire entre matière sensible et forme rationnelle qui rejoint
          directement le geste de ce texte — contenu déjà possédé via
          `theorie-experience`, on ne le redéveloppe pas ici.

          **Position divergente.** Un relativiste conséquent objecterait que
          si « leurs vérités » diffèrent réellement des « nôtres » selon les
          sens de chacun, rien ne garantit qu'il existe UN dôme commun
          plutôt que des dômes séparés et incommensurables — poussant le
          texte plus loin qu'il ne veut aller lui-même, puisqu'il affirme
          malgré tout l'existence d'une coordination rationnelle partagée.

      - id: q6
        part: "Partie 4 — Synthèse"
        stem: |-
          Rédige la synthèse : bilan de l'analyse et de la discussion,
          réponse à la problématique, puis position personnelle argumentée
          qui rouvre une question.
        reasoning: |-
          *Bilan :* l'analyse a montré un texte en deux mouvements — un
          critère sensible avec ses limites, complété par la coordination
          rationnelle — reliés par une question de transition qui fait
          basculer tout le texte. La discussion a confirmé la cohérence de
          cet équilibre, tout en relevant une limite (le mécanisme de la
          coordination rationnelle reste affirmé, non démontré) et une
          objection relativiste qui pousse le texte plus loin qu'il ne le
          souhaite. *Réponse à la problématique :* la vérité n'est pas
          purement relative aux sensations individuelles, précisément parce
          que la raison coordonne ces sensations divergentes en une
          connaissance commune, vérifiable par la répétition — mais cette
          coordination reste, dans le texte, affirmée plus que démontrée.
          *Position personnelle argumentée, qui rouvre :* si la raison est
          ce qui rend une vérité commune possible malgré la diversité des
          sensations, la question qui reste ouverte est de savoir COMMENT,
          concrètement, trancher entre deux coordinations rationnelles
          rivales des mêmes sensations contradictoires — le texte affirme la
          fonction de la raison sans jamais montrer la méthode.
