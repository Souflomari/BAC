<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" role="img"
     aria-label="Carte de la méthode : les quatre moments Introduction, Analyse, Discussion, Synthèse, notés respectivement 4, 5, 5 et 3 points sur 20, en dessous, les aspects formels traversent les quatre moments pour 3 points supplémentaires ; le total fait 20 sur 20.">
  <title>Carte de la méthode — les 4 moments et le barème sur 20</title>
  <!--
    carte-methode.svg — STATIQUE (choix documenté, pas un oubli).

    Pourquoi statique et non staged (LESSON-EXPERIENCE-SPEC.md §2.5 : "refus
    documenté = état légitime, le critère décisif est le GESTE, pas le compte
    de couches") : cette figure est une CARTE de référence, placée deux fois
    dans la leçon SANS varier (R0 en preview, R6 en clôture d'arc — « tu as
    fait, sur un texte, les 4 moments notés sur 20 », PHILO-ANALYSE-DE-TEXTE-
    SPEC.md §6). Les deux placements montrent délibérément la MÊME image
    complète — le geste pédagogique est « voici le territoire entier, d'un
    coup d'œil, avant / puis après l'avoir parcouru », pas une révélation
    progressive de ses parties. Une figure staged casserait ce geste (un
    "coup d'œil" partiel à R0 contredirait la promesse de preview).

    Barème — SOURCE : philo.yaml.grille_evaluation (5-capacité /20),
    PHILO-ANALYSE-DE-TEXTE-SPEC.md §5. AUCUNE sous-répartition intra-capacité
    n'est dessinée ici (les sous-splits type thèse=2/concepts=2/argumentation=1
    sont taggés "derived", non attribuables au cadre officiel — spec §5) :
    seuls les 5 totaux vérifiés apparaissent (4, 5, 5, 3, 3 = 20), plus un
    rappel écrit en toutes lettres au bas de la figure. C'est la même règle
    d'honnêteté que lesson.md porte à R0 ("à titre indicatif").

    Les 4 CARTES (moments, dans l'ordre de rédaction, PAS l'ordre de lecture —
    R2 fait exactement ce point) portent chacune : un numéro, le nom français
    du moment, son terme arabe (copié verbatim de philo.yaml / du spec §1.2 —
    un seul mot par carte, aucune phrase arabe composée ici, donc aucun risque
    de bidi/ligature), le(s) rung(s) qui le construisent, et sa valeur en points.
    La bande TRANSVERSALE (aspects formels, 3 pts) est dessinée EN DESSOUS,
    avec une bordure en pointillés — distincte en FORME (pas seulement en
    couleur) des 4 cartes séquentielles — et des attaches en pointillés vers
    chacune des 4 cartes, pour montrer visuellement qu'elle les traverse
    toutes plutôt que de suivre la séquence comme un 5ᵉ moment.

    Repère de mise en page (calculé) :
      cartes : x0 = 28, largeur 185, espace inter-cartes 35
        carte 1 (Introduction)  x = 28..213   (centre 120.5)
        carte 2 (Analyse)       x = 248..433  (centre 340.5)
        carte 3 (Discussion)    x = 468..653  (centre 560.5)
        carte 4 (Synthèse)      x = 688..873  (centre 780.5)
      cartes : y = 52..212 (hauteur 160)
      bande transversale : y = 232..287
      total / note : y = 296..394

    Couleurs (var(--figure-*), accent unique — DESIGN-BIBLE §6) :
      cartes / bande : --figure-surface (fond), --figure-grid ou
        --figure-ink-soft (bordures neutres)
      valeurs en points, flèches, pastilles numérotées : --figure-accent
      texte courant / arabe / notes : --figure-ink / --figure-ink-soft
  -->

  <text x="450" y="24" text-anchor="middle" font-size="15.5" font-weight="600"
        letter-spacing="0.01em" fill="var(--figure-ink)">La carte de la méthode — les 4 moments et le barème (/20)</text>

  <!-- ══════════════════════════════ Carte 1 — Introduction ══════════════════════════════ -->
  <g>
    <rect x="28" y="52" width="185" height="132" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.4"/>
    <circle cx="51" cy="75" r="13" fill="var(--figure-accent)" fill-opacity="0.15"
            stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="51" y="80" text-anchor="middle" font-size="12.5" font-weight="700"
          fill="var(--figure-accent)">1</text>
    <text x="120.5" y="92" text-anchor="middle" font-size="15" font-weight="700"
          fill="var(--figure-ink)">Introduction</text>
    <text x="120.5" y="112" text-anchor="middle" font-size="12.5" fill="var(--figure-ink-soft)"
          direction="rtl">المقدمة</text>
    <text x="120.5" y="158" text-anchor="middle" font-size="24" font-weight="700"
          fill="var(--figure-accent)">4 pts</text>
  </g>

  <!-- Flèche 1 → 2 -->
  <line x1="213" y1="118" x2="241" y2="118" stroke="var(--figure-accent)" stroke-width="2"/>
  <polygon points="248,118 236,113.5 236,122.5" fill="var(--figure-accent)"/>

  <!-- ══════════════════════════════ Carte 2 — Analyse ══════════════════════════════ -->
  <g>
    <rect x="248" y="52" width="185" height="132" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.4"/>
    <circle cx="271" cy="75" r="13" fill="var(--figure-accent)" fill-opacity="0.15"
            stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="271" y="80" text-anchor="middle" font-size="12.5" font-weight="700"
          fill="var(--figure-accent)">2</text>
    <text x="340.5" y="92" text-anchor="middle" font-size="15" font-weight="700"
          fill="var(--figure-ink)">Analyse</text>
    <text x="340.5" y="112" text-anchor="middle" font-size="12.5" fill="var(--figure-ink-soft)"
          direction="rtl">التحليل</text>
    <text x="340.5" y="158" text-anchor="middle" font-size="24" font-weight="700"
          fill="var(--figure-accent)">5 pts</text>
  </g>

  <!-- Flèche 2 → 3 -->
  <line x1="433" y1="118" x2="461" y2="118" stroke="var(--figure-accent)" stroke-width="2"/>
  <polygon points="468,118 456,113.5 456,122.5" fill="var(--figure-accent)"/>

  <!-- ══════════════════════════════ Carte 3 — Discussion ══════════════════════════════ -->
  <g>
    <rect x="468" y="52" width="185" height="132" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.4"/>
    <circle cx="491" cy="75" r="13" fill="var(--figure-accent)" fill-opacity="0.15"
            stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="491" y="80" text-anchor="middle" font-size="12.5" font-weight="700"
          fill="var(--figure-accent)">3</text>
    <text x="560.5" y="92" text-anchor="middle" font-size="15" font-weight="700"
          fill="var(--figure-ink)">Discussion</text>
    <text x="560.5" y="112" text-anchor="middle" font-size="12.5" fill="var(--figure-ink-soft)"
          direction="rtl">المناقشة</text>
    <text x="560.5" y="158" text-anchor="middle" font-size="24" font-weight="700"
          fill="var(--figure-accent)">5 pts</text>
  </g>

  <!-- Flèche 3 → 4 -->
  <line x1="653" y1="118" x2="681" y2="118" stroke="var(--figure-accent)" stroke-width="2"/>
  <polygon points="688,118 676,113.5 676,122.5" fill="var(--figure-accent)"/>

  <!-- ══════════════════════════════ Carte 4 — Synthèse ══════════════════════════════ -->
  <g>
    <rect x="688" y="52" width="185" height="132" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.4"/>
    <circle cx="711" cy="75" r="13" fill="var(--figure-accent)" fill-opacity="0.15"
            stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="711" y="80" text-anchor="middle" font-size="12.5" font-weight="700"
          fill="var(--figure-accent)">4</text>
    <text x="780.5" y="92" text-anchor="middle" font-size="15" font-weight="700"
          fill="var(--figure-ink)">Synthèse</text>
    <text x="780.5" y="112" text-anchor="middle" font-size="12.5" fill="var(--figure-ink-soft)"
          direction="rtl">التركيب</text>
    <text x="780.5" y="158" text-anchor="middle" font-size="24" font-weight="700"
          fill="var(--figure-accent)">3 pts</text>
  </g>

  <!-- ══════════════════ Bande transversale — aspects formels ══════════════════ -->
  <line x1="120.5" y1="184" x2="120.5" y2="204" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="340.5" y1="184" x2="340.5" y2="204" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="560.5" y1="184" x2="560.5" y2="204" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="780.5" y1="184" x2="780.5" y2="204" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>

  <rect x="28" y="204" width="845" height="55" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"
        stroke-dasharray="5,4"/>
  <text x="450" y="226" text-anchor="middle" font-size="13" font-weight="600"
        fill="var(--figure-ink)">Aspects formels — transversal (+3 pts)</text>
  <text x="450" y="244" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">cohérence et lisibilité de la copie · langue = arabe le jour de l’épreuve</text>

  <!-- ══════════════════ Total ══════════════════ -->
  <text x="450" y="281" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">Barème total</text>
  <text x="450" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="var(--figure-ink)">4 + 5 + 5 + 3 + 3 = <tspan fill="var(--figure-accent)">20</tspan></text>

  <text x="450" y="336" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">Les sous-répartitions à l’intérieur de chaque capacité ne sont pas</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">attribuables au cadre officiel — indicatives seulement, jamais garanties.</text>

</svg>
