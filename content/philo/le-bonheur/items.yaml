  - id: BON-21
    rung: "R6"
    difficulty_level: 5
    skill_code: philo_bonheur
    tags: [methode_dissertation, introduction]
    stem: >
      Un élève rédige une introduction qui commence directement par : « Le
      bonheur dépend de nous. C'est ce que je vais montrer dans ce devoir. »
      Qu'est-ce que cette introduction manque, au regard de la méthode
      exposée au chapitre 7 ?
    type: mcq
    choices:
      - id: A
        text: "Rien : une bonne introduction doit annoncer sa conclusion dès la première phrase, afin d'informer immédiatement le correcteur de la direction prise par le devoir."
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          C'est défendre précisément la pratique fautive : une
          dissertation ne répond jamais « oui » d'entrée de jeu, avant
          toute problématisation.
      - id: B
        text: "Elle affirme d'emblée une thèse comme acquise, sans accroche, sans définir les termes, sans faire apparaître de tension entre positions légitimes, ni poser de problématique interrogative -- une dissertation ne répond jamais « oui » d'entrée de jeu."
        correct: true
      - id: C
        text: "Elle manque uniquement une citation d'auteur en ouverture ; pour le reste, la démarche suivie est correcte et l'introduction remplit bien son office."
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          Cela sous-estime largement le problème : ce n'est pas une
          citation qui manque, c'est l'ensemble du mouvement
          accroche/définition/tension/problématique/plan.
      - id: D
        text: "Elle manque un exemple concret comme celui de la note excellente ; la problématisation elle-même n'est pas nécessaire dès lors que l'exemple choisi est parlant, bien amené et suffisamment développé dans la suite du devoir.
        Une introduction réussie pourrait donc se passer de problématique."
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          Un exemple concret ne remplace pas la problématisation : le
          modèle d'introduction du chapitre 7 utilise l'exemple ET pose ensuite une
          question explicite.
    correct_feedback: >
      Le modèle du chapitre 7 va de l'accroche à la problématique en passant par la
      définition des termes et une tension explicite -- affirmer d'emblée
      une thèse saute toutes ces étapes.
    solution: |
      **Le mouvement attendu :** accroche, définition, tension,
      problématique, annonce du plan.

      **L'erreur de l'élève :** remplacer ce mouvement par une affirmation
      de conclusion.

  # Ajoutés le 2026-09-05 : deux familles sous le plancher de 3 items du banc —
  # `bonheur-suspendu-aux-circonstances` (2 items) et
  # `finalite-de-la-chaine-mal-comprise` (1). BON-22 travaille le retournement
  # stoïcien, BON-23 l'argument aristotélicien de la chaîne des fins : deux
  # gestes distincts, pas deux formulations du même.
  - id: BON-22
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [stoiciens, ce-qui-depend-de-nous, jugement]
    stem: >
      Un élève écrit : « Pour les stoïciens, être heureux, c'est faire en sorte
      que les choses se passent comme on veut. » Quelle correction cette phrase
      appelle-t-elle ?
    type: mcq
    choices:
      - id: A
        text: "La formule est exactement retournée : les stoïciens invitent à vouloir les choses comme elles se passent, l'effort portant sur le jugement, non sur le cours des événements."
        correct: true
      - id: B
        text: "Aucune correction n'est nécessaire : le bonheur suppose bien de maîtriser le cours des choses, ce qui explique d'ailleurs pourquoi si peu d'hommes y parviennent durablement."
        correct: false
        misconception: mc.philo.bonheur.bonheur-suspendu-aux-circonstances
        feedback: >
          C'est déplacer le problème vers l'extérieur, alors que tout l'effort
          stoïcien consiste à le ramener au-dedans. Le partage entre ce qui
          dépend de nous — nos jugements, nos désirs, nos refus — et ce qui n'en
          dépend pas — la santé, la fortune, l'opinion d'autrui — n'est pas un
          constat résigné : c'est la condition d'un bonheur qui ne soit pas
          suspendu à ce qu'on ne gouverne pas.
      - id: C
        text: "La correction porte ailleurs : ce que les stoïciens contestent, c'est qu'il existe une fin dernière de l'existence, chaque désir satisfait en appelant aussitôt un autre, sans terme possible."
        correct: false
        misconception: mc.philo.bonheur.finalite-de-la-chaine-mal-comprise
        feedback: >
          Aucun des auteurs du chapitre ne soutient cela — et surtout pas les
          stoïciens, pour qui la vie conforme à la raison EST la fin dernière.
          L'idée d'une chaîne de désirs sans terme est une objection possible à
          Aristote, pas une thèse stoïcienne ; et l'erreur de la phrase de
          départ ne porte pas sur la finalité, mais sur le lieu de l'effort.
      - id: D
        text: "La formule décrit en réalité la doctrine d'Épicure, pour qui le bonheur consiste à obtenir le plus grand nombre de plaisirs possibles au cours d'une vie, en écartant ce qui les contrarie."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Double erreur. Épicure ne dit pas cela — son plaisir se CALCULE, se
          trie, et culmine dans l'absence de trouble, pas dans l'accumulation.
          Et la phrase de départ ne décrit pas davantage Épicure que les
          stoïciens : elle décrit la croyance ordinaire que le bonheur se joue
          dehors, que les deux doctrines combattent chacune à sa manière.
    correct_feedback: >
      La formule est retournée. « Ne demande pas que les choses arrivent comme
      tu le veux, mais veuille les choses comme elles arrivent » : le partage
      entre ce qui dépend de nous et ce qui n'en dépend pas déplace l'effort du
      cours des événements vers le jugement, seul lieu où notre pouvoir est
      entier.
    solution: |
      L'erreur de la phrase est un DÉPLACEMENT : elle situe le bonheur dans la
      maîtrise du cours des choses, c'est-à-dire dans ce qui ne dépend pas de
      nous.

      Le stoïcisme opère le partage inverse. Ce qui dépend de nous — le
      jugement, le désir, l'aversion — est le seul terrain où notre pouvoir
      soit entier ; ce qui n'en dépend pas — le corps, les biens, la réputation
      — nous est étranger, non parce qu'il serait sans valeur, mais parce que
      lui suspendre notre bonheur revient à le remettre au hasard.

      D'où la formule d'Épictète, qui est la phrase de l'élève exactement
      retournée : « ne demande pas que les choses arrivent comme tu le veux,
      mais veuille les choses comme elles arrivent ».

  - id: BON-23
    rung: "R1"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [aristote, souverain-bien, chaine-des-fins]
    stem: >
      Aristote observe qu'on veut la richesse en vue de la santé, la santé en
      vue de pouvoir agir, et ainsi de suite ; il en conclut qu'il existe une
      fin dernière, voulue pour elle-même et jamais en vue d'autre chose. Un
      élève objecte : « rien n'empêche la chaîne de se poursuivre
      indéfiniment ». Que répond l'argument d'Aristote ?
    type: mcq
    choices:
      - id: A
        text: "Que si la chaîne ne s'arrêtait nulle part, aucun désir n'aurait de raison d'être : vouloir A en vue de B, B en vue de C, sans terme, c'est ne rien vouloir du tout."
        correct: true
      - id: B
        text: "Que les fins intermédiaires — la richesse, la santé — sont en réalité de faux biens, dont le sage doit apprendre à se détourner pour ne viser que la fin dernière."
        correct: false
        misconception: mc.philo.bonheur.finalite-de-la-chaine-mal-comprise
        feedback: >
          L'argument de la chaîne est un argument de STRUCTURE, pas un jugement
          de valeur sur les moyens. Aristote ne dévalorise pas la santé ou la
          richesse : il observe seulement qu'on ne les veut pas pour elles-mêmes,
          et que cette dépendance ne peut pas se poursuivre sans fin. Les fins
          intermédiaires sont de vrais biens — simplement pas le souverain bien.
      - id: C
        text: "Qu'il n'existe en effet aucune fin dernière, et que le mot « bonheur » ne désigne rien d'autre que cette poursuite indéfinie, jamais achevée, de fins toujours nouvelles."
        correct: false
        misconception: mc.philo.bonheur.finalite-de-la-chaine-mal-comprise
        feedback: >
          C'est accorder l'objection au lieu d'y répondre — et c'est le
          contraire de la thèse d'Aristote. Si aucune fin n'était voulue pour
          elle-même, la chaîne entière serait suspendue dans le vide : chaque
          désir tiendrait sa raison d'un autre, aucun n'en aurait à lui seul.
          C'est précisément l'absurdité que l'argument met en évidence.
      - id: D
        text: "Que la fin dernière est le plaisir, et que le bonheur n'est rien d'autre que la somme des plaisirs accumulés au cours d'une vie humaine, une fois retranchées les peines."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est prêter à Aristote une thèse hédoniste qui n'est pas la sienne —
          et qui n'est même pas exactement celle d'Épicure, dont le plaisir se
          calcule au lieu de s'accumuler. Pour Aristote, la fin dernière est
          l'activité de l'âme conforme à sa vertu propre ; le plaisir
          l'accompagne, il ne la définit pas.
    correct_feedback: >
      L'argument est structurel : une chaîne de fins sans terme ne peut donner
      de raison à aucun de ses maillons. Puisque nous voulons effectivement des
      choses, il existe une fin voulue pour elle-même — et Aristote la nomme
      bonheur, ce que tous poursuivent sans jamais le poursuivre en vue
      d'autre chose.
    solution: |
      **La forme de l'argument.** Chaque maillon de la chaîne tient sa raison
      d'être du maillon suivant : la richesse vaut par la santé, la santé par
      l'action. Si la série ne s'arrêtait jamais, aucun maillon ne recevrait
      jamais sa raison — le désir tout entier resterait sans fondement. Or nous
      désirons effectivement. Donc la série s'arrête.

      **Ce que l'argument ne dit pas.** Il ne dit pas que les fins
      intermédiaires soient sans valeur : elles sont de vrais biens,
      seulement subordonnés. Il ne dit pas non plus qu'aucune fin dernière
      n'existe : c'est l'objection, pas la réponse.

      **Ce que l'argument établit.** Il existe un bien voulu pour lui-même et
      jamais en vue d'autre chose — le souverain bien. Aristote en donne le nom
      d'emblée : le bonheur. Reste à en donner le contenu, ce que fait la suite
      du chapitre avec l'activité de l'âme conforme à la vertu.

# ── RÉSUMÉ DE COUVERTURE ────────────────────────────────────────────────────
# RÉÉCRIT le 2026-09-05, après BON-22 et BON-23. Le résumé précédent, généré le
# même jour, nommait les deux familles sous le plancher :
# `bonheur-suspendu-aux-circonstances` (2 items) et
# `finalite-de-la-chaine-mal-comprise` (1). Les deux nouveaux items travaillent
# deux gestes distincts — le retournement stoïcien, l'argument aristotélicien de
# la chaîne des fins — plutôt que deux formulations du même. Tableau GÉNÉRÉ,
# gardé par web/scripts/resume-couverture.mjs.
coverage_summary:
  method: >-
    Niveau ITEM : une misconception compte un item dès qu'au moins un de ses
    distracteurs la porte, une seule fois par item même si plusieurs la portent
