notion: le-bonheur
skill_code: philo_bonheur
misconceptions: []

items:
  - id: BON-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_bonheur
    tags: [distinction_auteurs, aristote, souverain_bien]
    stem: >
      Pourquoi Aristote refuse-t-il de faire de la richesse le souverain bien
      de l'existence humaine ?
    type: mcq
    choices:
      - id: A
        text: "Parce que la richesse dépend presque entièrement du hasard et des circonstances, et ne dépend donc pas de nous."
        correct: false
        feedback: >
          C'est un critère stoïcien (ce qui dépend de nous / ce qui n'en
          dépend pas), pas l'argument d'Aristote. Aristote raisonne ici sur
          la nature même de la richesse comme moyen, jamais comme fin -- pas
          sur ce qui, en elle, dépendrait ou non de notre volonté.
      - id: B
        text: "Parce que la richesse procure un plaisir, et le plaisir, selon Aristote, est un mal moral qu'il faut éviter."
        correct: false
        feedback: >
          Aristote ne juge pas le plaisir mauvais en soi : il l'écarte
          seulement comme critère ULTIME du bonheur, parce qu'il est commun
          à l'homme et aux animaux, pas parce qu'il serait un mal moral à
          fuir.
      - id: C
        text: "Parce que la richesse est un moyen recherché en vue d'autre chose, et ne satisfait donc pas au critère de finalité du souverain bien."
        correct: true
      - id: D
        text: "Parce que la richesse n'est accessible qu'à une minorité de personnes, ce qui la rend injuste et socialement inégalitaire, et donc irrecevable comme fondement du bonheur."
        correct: false
        feedback: >
          Ce n'est pas l'argument d'Aristote : il ne s'agit pas d'une
          question de justice ou d'accessibilité sociale, mais de la nature
          même de la richesse, toujours recherchée comme moyen en vue d'autre
          chose, jamais pour elle-même.
    correct_feedback: >
      Le souverain bien doit être recherché pour lui-même (critère de
      finalité) et se suffire à lui-même (critère d'auto-suffisance). La
      richesse échoue au premier critère : personne ne la veut pour
      elle-même, mais pour ce qu'elle permet d'obtenir.
    solution: |
      **Le principe :** Aristote teste chaque candidat au souverain bien à
      l'aide de deux critères -- la finalité (recherché pour lui-même) et
      l'auto-suffisance (qui, à lui seul, rend la vie désirable et complète).

      **Le cas de la richesse :** elle est un moyen parfait -- on la veut pour
      ce qu'elle achète, pas pour elle-même. Elle échoue donc au critère de
      finalité.

      **Ce que l'argument n'est PAS :** ni un jugement moral sur le plaisir,
      ni une remarque sur l'injustice sociale, ni un critère de dépendance à
      notre volonté (ce dernier est un critère stoïcien, pas aristotélicien).

  - id: BON-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [distinction_auteurs, epicure, hedonisme]
    stem: >
      Un élève affirme : « Pour Épicure, il faut rechercher un maximum de
      plaisirs intenses, sans aucune limite. » Qu'est-ce que cette lecture
      manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait qu'Épicure, en réalité, condamne tout plaisir comme moralement suspect."
        correct: false
        feedback: >
          C'est l'inverse de la position d'Épicure : le plaisir est, chez
          lui, le principe et la fin même de la vie heureuse -- il ne le
          condamne jamais. Ce qu'il redéfinit, c'est CE QUE le mot "plaisir"
          désigne, pas sa valeur.
      - id: B
        text: "Elle manque le fait que le plaisir véritable, chez Épicure, est l'ataraxie -- l'absence durable de trouble --, non l'intensité des sensations, d'où la limite qu'il met aux désirs."
        correct: true
      - id: C
        text: "Elle manque le fait qu'Épicure est en réalité un eudémoniste, pour qui seule la vertu compte, indépendamment du plaisir."
        correct: false
        feedback: >
          C'est confondre hédonisme et eudémonisme. Épicure reste hédoniste
          de bout en bout : la raison et la mesure des désirs sont chez lui
          des MOYENS en vue du plaisir (l'ataraxie), jamais une fin en soi
          indépendante de lui, comme chez les eudémonistes (Aristote, les
          stoïciens).
      - id: D
        text: "Elle manque le fait qu'Épicure recommande de satisfaire indifféremment tous les désirs, naturels ou non, du moment qu'ils procurent une sensation agréable, sans jamais opérer le moindre tri entre eux."
        correct: false
        feedback: >
          C'est ignorer précisément le tri qu'Épicure demande d'opérer entre
          désirs naturels et nécessaires, désirs naturels non nécessaires, et
          désirs vains -- un tri qui exclut justement de satisfaire tous les
          désirs sans distinction.
    correct_feedback: >
      Épicure distingue le plaisir "en mouvement" (une sensation forte et
      momentanée) du plaisir "en repos" (l'ataraxie, l'absence durable de
      trouble). C'est ce second plaisir qu'il vise, par un calcul qui limite
      les désirs aux désirs naturels et nécessaires -- pas une accumulation
      de sensations intenses.
    solution: |
      **Le plaisir en mouvement :** une sensation forte et brève (un bon
      repas, une ivresse) -- ce n'est PAS ce qu'Épicure vise comme fin.

      **Le plaisir en repos (ataraxie, aponie) :** l'absence stable de
      trouble de l'âme et de douleur du corps -- c'est la fin véritable.

      **L'outil pour l'atteindre :** trier les désirs (naturels et
      nécessaires / naturels non nécessaires / vains) et calculer les
      conséquences de chaque plaisir avant d'agir.

      **Ce que la lecture erronée manque :** elle prend "hédonisme" pour
      "quête sans limite de sensations", alors qu'Épicure prône une vie
      simple et mesurée, précisément parce que c'est elle qui produit
      l'ataraxie.

  - id: BON-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [distinction_auteurs, hedonisme, eudemonisme, vocabulaire]
    stem: >
      Quelle affirmation distingue correctement l'hédonisme (Épicure) et
      l'eudémonisme (Aristote, les stoïciens) ?
    type: mcq
    choices:
      - id: A
        text: "L'hédonisme et l'eudémonisme désignent la même doctrine, sous deux noms différents forgés par des traducteurs différents."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes : les deux répondent à la même
          question (en quoi consiste le bonheur ?) avec des critères
          incompatibles -- le plaisir pour l'un, la vertu et la raison,
          indépendamment du plaisir, pour l'autre.
      - id: B
        text: "L'hédonisme est la doctrine des stoïciens ; l'eudémonisme est celle d'Épicure."
        correct: false
        feedback: >
          C'est inverser les attributions. Les stoïciens sont eudémonistes
          (ils radicalisent même la position d'Aristote : seule la vertu
          compte) ; Épicure est l'hédoniste de cette leçon.
      - id: C
        text: "L'hédonisme juge les actions à leurs conséquences sur la société entière ; l'eudémonisme juge les actions à la pureté de l'intention individuelle."
        correct: false
        feedback: >
          Cette opposition (conséquences / intention) est celle qui sépare
          l'utilitarisme du kantisme dans une autre leçon -- pas la
          distinction hédonisme/eudémonisme, qui porte sur CE QUI CONSTITUE
          le bonheur (le plaisir, ou la raison et la vertu), pas sur le
          critère de jugement moral d'une action.
      - id: D
        text: "L'hédonisme fait du plaisir le critère du bonheur ; l'eudémonisme le fait reposer sur la raison et la vertu, sans l'identifier au plaisir."
        correct: true
    correct_feedback: >
      L'hédonisme (Épicure) identifie le bonheur au plaisir, redéfini comme
      absence de trouble. L'eudémonisme (Aristote, les stoïciens) fait
      reposer le bonheur sur l'activité rationnelle et la vertu, sans jamais
      l'identifier au plaisir -- même si aucune des deux familles ne prône
      une vie de pur excès.
    solution: |
      **Hédonisme (Épicure) :** le plaisir -- entendu comme absence de
      trouble -- est le critère et la fin du bonheur.

      **Eudémonisme (Aristote, les stoïciens) :** le bonheur repose sur la
      raison et la vertu ; le plaisir, s'il existe, n'en est qu'une
      conséquence, jamais le critère qui le définit.

      **L'erreur la plus fréquente :** traiter ces deux mots comme des
      synonymes, ou confondre cette distinction avec celle,
      différente, qui oppose jugement par les conséquences et jugement par
      l'intention (utilitarisme / kantisme).

  - id: BON-4
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [distinction_auteurs, stoiciens, ce_qui_depend_de_nous]
    stem: >
      Selon les stoïciens, en quoi consiste concrètement la voie du bonheur ?
    type: mcq
    choices:
      - id: A
        text: "Régler son désir seulement sur ce qui dépend de nous -- jugements, actions propres -- et accueillir le reste avec égalité d'âme."
        correct: true
      - id: B
        text: "Ne plus rien désirer du tout, ni agir sur rien, pour éviter toute déception possible."
        correct: false
        feedback: >
          C'est confondre la doctrine stoïcienne avec un fatalisme passif.
          Le stoïcien continue d'agir de toutes ses forces sur ce qui dépend
          de lui (réviser, travailler) -- il renonce seulement à faire
          dépendre son bonheur du résultat, qui lui échappe en partie.
      - id: C
        text: "Rechercher un plaisir stable et mesuré, en calculant les conséquences de chaque désir."
        correct: false
        feedback: >
          C'est la méthode d'Épicure (le calcul des plaisirs), pas le
          critère proprement stoïcien, qui porte sur la distinction entre ce
          qui dépend de nous et ce qui n'en dépend pas -- pas sur un calcul
          de plaisirs et de douleurs.
      - id: D
        text: "Essayer de maîtriser autant que possible les circonstances extérieures et le cours des choses, pour qu'ils produisent toujours, quoi qu'il arrive, le résultat souhaité."
        correct: false
        feedback: >
          C'est l'inverse de la doctrine : les stoïciens enseignent à cesser
          de vouloir maîtriser ce qui est extérieur (le corps, la fortune,
          les actions d'autrui), pas à mieux le contrôler.
    correct_feedback: >
      Le bonheur stoïcien consiste à régler son désir uniquement sur ce qui
      dépend de nous -- nos jugements, nos désirs, nos actions propres --
      pour obtenir, par construction, toujours ce qu'on désire, et à
      accueillir le reste avec égalité d'âme.
    solution: |
      **La distinction de départ :** ce qui dépend de nous (jugements,
      désirs, actions) / ce qui n'en dépend pas (corps, fortune, réputation,
      actions d'autrui, événements du monde).

      **Le mécanisme de la souffrance :** elle naît de désirer ou de
      redouter ce qui ne dépend pas de nous.

      **Ce que la doctrine n'est PAS :** ni un fatalisme qui renoncerait à
      agir, ni un calcul de plaisirs (Épicure), ni une tentative de mieux
      maîtriser le monde extérieur.

  - id: BON-5
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_bonheur
    tags: [distinction_auteurs, kant, bonheur_devoir]
    stem: >
      Laquelle de ces affirmations résume correctement la position de Kant
      sur le rapport entre bonheur et morale ?
    type: mcq
    choices:
      - id: A
        text: "Pour Kant, le bonheur est le but ultime de la morale, à condition de le mériter d'abord par la vertu."
        correct: false
        feedback: >
          C'est exactement l'inverse de la position de Kant, et une des
          confusions les plus fréquentes sur cet auteur. Pour Kant, la
          moralité d'une action ne dépend jamais de sa capacité à produire du
          bonheur : le bonheur mérité n'est qu'une conséquence espérée,
          jamais le fondement, de l'action morale.
      - id: B
        text: "Pour Kant, rechercher le bonheur est immoral, et le sage doit y renoncer entièrement."
        correct: false
        feedback: >
          Kant ne condamne pas le bonheur comme immoral : il nie seulement
          qu'il puisse FONDER la morale. Rien, chez lui, n'interdit de
          rechercher son propre bonheur -- ce qui est exclu, c'est de faire
          de cette recherche le critère du bien agir.
      - id: C
        text: "Trop indéterminé pour produire une loi universelle, le bonheur ne peut fonder la morale ; agir moralement rend seulement digne d'être heureux, sans garantir de l'être."
        correct: true
      - id: D
        text: "Pour Kant, comme pour les utilitaristes, une action est morale si elle produit, au final, le plus de bonheur possible pour le plus grand nombre, ses conséquences seules décidant de sa valeur."
        correct: false
        feedback: >
          C'est la position utilitariste, que Kant rejette précisément : il
          juge la moralité d'une action au seul motif (la maxime peut-elle
          être universalisée ?), jamais aux conséquences produites en termes
          de bonheur.
    correct_feedback: >
      Kant refuse de fonder la morale sur le bonheur : la notion est trop
      indéterminée et varie d'un individu à l'autre pour produire un
      commandement universel. Agir par devoir rend seulement digne d'être
      heureux -- sans que cela garantisse de l'être réellement.
    solution: |
      **Premier argument :** le bonheur est une notion trop indéterminée
      (elle varie d'une personne à l'autre) pour fonder une loi valable pour
      tous -- au mieux, elle ne produit que des conseils de prudence.

      **Second argument :** faire du bonheur le critère du bien agir ramène
      la morale à un calcul d'intérêt personnel, qui s'effondrerait dès que
      cet intérêt cesserait d'être servi.

      **Ce que Kant ne dit PAS :** que le bonheur serait sans valeur ou
      immoral, ni que la morale viserait le bonheur comme son but -- il
      introduit la notion d'être digne d'être heureux, une conséquence
      espérée de la vertu, jamais son fondement.

  - id: BON-6
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_bonheur
    tags: [distinction_auteurs, schopenhauer, freud, accessibilite_bonheur]
    stem: >
      Quelle est la thèse exacte de Schopenhauer et de Freud sur
      l'accessibilité du bonheur ?
    type: mcq
    choices:
      - id: A
        text: "Aucune forme de satisfaction n'est jamais possible, et il ne sert donc à rien de chercher à être heureux."
        correct: false
        feedback: >
          C'est faire dire à ces auteurs bien plus qu'ils n'affirment. Leur
          thèse porte sur la difficulté structurelle d'un bonheur INTÉGRAL et
          définitif, pas sur l'impossibilité de toute satisfaction, même
          partielle et momentanée.
      - id: B
        text: "Le bonheur intégral et durable est structurellement difficile à atteindre -- par la nature du désir (Schopenhauer) ou le prix de la vie sociale (Freud) --, sans exclure des satisfactions réelles et momentanées."
        correct: true
      - id: C
        text: "Le bonheur est parfaitement accessible à qui sait maîtriser ses désirs, comme le soutiennent également les stoïciens."
        correct: false
        feedback: >
          Cela efface la différence entre les stoïciens (une maîtrise du
          désir rend le bonheur accessible) et Schopenhauer/Freud (une limite
          structurelle -- la nature même du désir, ou le prix de la vie
          collective -- demeure, quel que soit le degré de maîtrise qu'on en
          a).
      - id: D
        text: "Le problème qu'ils posent ne concerne que la vie en société ; un individu parfaitement isolé du monde social atteindrait, selon eux, un bonheur complet et sans la moindre ombre, la structure du désir n'y jouant alors aucun rôle."
        correct: false
        feedback: >
          Cela ignore l'argument de Schopenhauer, qui porte sur la structure
          du désir en général, indépendamment de toute vie sociale -- même
          seul, le cycle désir/satisfaction/ennui continuerait de jouer.
    correct_feedback: >
      Schopenhauer montre que le désir, par nature, oscille entre la douleur
      du manque et l'ennui de la satisfaction. Freud montre que la vie en
      société exige un renoncement pulsionnel dont le prix psychique ne
      disparaît jamais. Les deux limitent le bonheur INTÉGRAL et durable,
      sans nier toute satisfaction possible.
    solution: |
      **Schopenhauer :** tout désir naît d'un manque (souffrance) ; sa
      satisfaction ne produit pas un plaisir stable mais, très vite, l'ennui,
      puis un nouveau désir -- un pendule sans repos durable.

      **Freud :** la vie en société exige un renoncement pulsionnel
      permanent, dont le prix (frustration, culpabilité) ne disparaît
      jamais complètement.

      **Ce que ces deux thèses ne disent PAS :** que toute satisfaction
      serait impossible, ou que la vie en société serait seule en cause
      (Schopenhauer parle de la structure du désir en général, pas
      seulement de la vie sociale).
