    correct_feedback: >
      L'accroche montre les deux réponses spontanées insuffisantes et
      formule ainsi le problème -- sans le résoudre -- que la leçon
      développera ensuite.
    solution: |
      **Le geste de l'accroche :** mettre en tension deux réponses
