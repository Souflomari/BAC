    type: mcq
    choices:
      - id: A
        text: "Aristote rejette lui aussi tout bien extérieur comme étranger au bonheur ; la différence entre les deux écoles ne serait alors qu'une question de vocabulaire, sans portée réelle."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Aristote exige au contraire un minimum de biens extérieurs pour
          un bonheur complet -- ce n'est pas une différence de vocabulaire.
      - id: B
        text: "Les stoïciens jugent la vertu seul bien véritable et tout le reste « indifférent » -- ni bien ni mal --, sans qu'aucun bien extérieur soit requis pour être heureux ; Aristote, lui, exige un minimum de biens extérieurs pour un bonheur complet."
        correct: true
      - id: C
        text: "Les stoïciens exigent, comme Aristote, un minimum de biens extérieurs pour être heureux -- leur seul apport propre serait la formule « ce qui dépend de nous », qui reformule sans rien changer au fond de la doctrine.
        La vertu ne suffirait donc au bonheur chez aucun des deux auteurs."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est sous-estimer la radicalisation stoïcienne : rien
          d'extérieur à la vertu n'est requis pour eux, alors qu'Aristote,
          lui, pose une exigence minimale.
      - id: D
        text: "Les stoïciens jugent les biens extérieurs comme des maux qu'il faudrait combattre activement, alors qu'Aristote les tiendrait pour parfaitement neutres et sans effet sur le bonheur."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est inverser les deux positions : « indifférent » chez les
          stoïciens ne signifie pas « mauvais », et c'est Aristote, pas les
          stoïciens, qui pose une exigence minimale de biens extérieurs.
    correct_feedback: >
      Les stoïciens radicalisent la position d'Aristote : pour eux, seule
      la vertu compte, tout le reste étant indifférent ; Aristote exige
      encore un minimum de biens extérieurs.
    solution: |
      **Aristote :** la vertu, part principale, plus un minimum de biens
      extérieurs requis.

      **Les stoïciens :** la vertu, seul bien véritable ; tout le reste
      est indifférent.

  - id: BON-15
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_bonheur
    tags: [distinction_auteurs, kant, bonheur_devoir]
    stem: >
      Pourquoi, selon Kant, le concept de bonheur ne peut-il fournir de loi
      morale universelle ?
    type: mcq
    choices:
      - id: A
        text: "Ce qui rend heureux varie radicalement d'une personne à l'autre, et même d'un moment à l'autre chez la même personne -- le concept est trop indéterminé pour fixer un contenu identique pour tous."
        correct: true
      - id: B
        text: "Parce que le bonheur, selon Kant, est un concept purement inventé par la raison, qui ne correspond à aucune réalité psychologique réellement vécue par qui que ce soit.
        Aucun homme ne rechercherait donc réellement le bonheur."
        correct: false
        misconception: mc.philo.bonheur.kant-mal-lu
        feedback: >
          Kant ne nie pas la réalité du bonheur ressenti : il dit seulement
          que son CONTENU varie trop d'un individu à l'autre pour fonder
          une loi universelle.
      - id: C
        text: "Parce que rechercher le bonheur est, en soi, contraire au devoir, et donc immoral par nature."
        correct: false
        misconception: mc.philo.bonheur.renoncement-radical-prete-aux-sages
        feedback: >
          Kant ne condamne pas le bonheur comme immoral : il nie seulement
          qu'il puisse FONDER la morale.
      - id: D
        text: "Parce que le bonheur dépend entièrement des circonstances extérieures, qui échappent en totalité à notre volonté."
        correct: false
        misconception: mc.philo.bonheur.bonheur-suspendu-aux-circonstances
        feedback: >
          C'est le critère stoïcien (ce qui dépend / ne dépend pas de
          nous), pas l'argument de Kant, qui porte sur l'indétermination
          du concept, pas sur sa dépendance aux circonstances.
    correct_feedback: >
      Le bonheur varie trop d'un individu à l'autre pour fonder un
      commandement valable pour tous -- au mieux, il ne produit que des
      conseils de prudence.
    solution: |
      **L'argument :** le contenu du bonheur est trop indéterminé pour
      être universalisé.

      **Ce que Kant ne dit PAS :** que le bonheur serait fictif, immoral,
      ou réductible au critère stoïcien de dépendance.

  - id: BON-16
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_bonheur
    tags: [distinction_auteurs, kant, digne_d_etre_heureux]
    stem: >
      Un élève écrit : « Pour Kant, agir moralement, c'est agir de façon à
      être heureux : la vertu produit le bonheur. » Que corrige précisément
      le texte sur cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Rien : c'est exactement la position de Kant, résumée ici sans la moindre déformation de son propos."
        correct: false
        misconception: mc.philo.bonheur.kant-mal-lu
        feedback: >
          Le texte corrige explicitement cette confusion, l'une des plus
          fréquentes sur Kant -- il ne l'endosse pas.
      - id: B
        text: "Le texte corrige seulement l'ordre des mots : c'est en réalité le bonheur qui produit la vertu, l'homme heureux devenant naturellement meilleur."
        correct: false
        misconception: mc.philo.bonheur.kant-mal-lu
        feedback: >
          Chez Kant, ni le bonheur ne produit la vertu, ni la vertu ne
          produit mécaniquement le bonheur -- les deux restent
          indépendants.
      - id: C
        text: "La vertu ne produit pas mécaniquement le bonheur -- un homme vertueux peut souffrir, un malhonnête prospérer -- elle rend seulement digne d'être heureux, sans jamais en garantir l'obtention."
        correct: true
      - id: D
        text: "Le texte corrige le fait que, pour Kant, la vertu produirait systématiquement le malheur et jamais le bonheur, la moralité se payant toujours d'une souffrance.
        La moralité et le bonheur seraient donc inversement proportionnels."
        correct: false
        misconception: mc.philo.bonheur.kant-mal-lu
        feedback: >
          C'est remplacer une erreur par une autre tout aussi fausse :
          Kant n'affirme aucun lien mécanique, ni positif ni négatif, entre
          vertu et bonheur.
    correct_feedback: >
      La vertu rend digne d'être heureux, sans garantir de l'être : la
      confondre avec une cause mécanique du bonheur ramène la morale à un
      calcul d'intérêt, ce que Kant rejette.
    solution: |
      **Ce que Kant établit :** être digne d'être heureux, pas produire le
      bonheur.

      **L'erreur de l'élève :** transformer une dignité méritée en
      garantie causale.

  - id: BON-17
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_bonheur
    tags: [distinction_auteurs, aristote, epicure, individuel_collectif]
    stem: >
      Aristote et Épicure valorisent tous deux l'amitié comme un bien
      important pour le bonheur. En quoi leurs positions divergent-elles
      néanmoins sur la vie collective ?
    type: mcq
    choices:
      - id: A
        text: "Aristote rejette l'amitié comme non nécessaire au bonheur, contrairement à Épicure qui en fait le seul bien véritable et le cœur de sa doctrine."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est l'inverse : l'amitié occupe, chez Aristote, une place
          considérable parmi les conditions du bonheur.
      - id: B
        text: "Aristote définit l'homme comme un « animal politique », dont la nature s'accomplit dans la vie de la cité ; Épicure, lui, recommande de se retirer des affaires publiques et de cultiver l'amitié dans un cercle restreint."
        correct: true
      - id: C
        text: "Les deux auteurs prônent, de façon rigoureusement identique, un engagement politique actif et permanent dans la cité comme condition nécessaire du bonheur de chacun, sans divergence sur ce point.
        Le retrait épicurien serait donc une invention des commentateurs."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Cela ignore le retrait des affaires publiques qu'Épicure
          recommande explicitement, à l'inverse de l'engagement politique
          d'Aristote.
      - id: D
        text: "Épicure exige, comme Aristote, une pleine participation à la vie de la cité -- seul le nombre d'amis recommandé diffère réellement entre les deux doctrines."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Épicure recommande au contraire de se tenir à l'écart des
          affaires publiques, sources d'agitation, ce qui l'oppose
          directement à Aristote sur ce point.
    correct_feedback: >
      Même accord sur l'importance de l'amitié, Aristote et Épicure
      divergent sur la vie publique -- engagement chez l'un, retrait chez
      l'autre.
    solution: |
      **Aristote :** l'homme, animal politique, s'accomplit dans la cité.

      **Épicure :** retrait des affaires publiques, amitié en cercle
      restreint.

  - id: BON-18
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_bonheur
    tags: [synthese, distinction_auteurs, accroche]
    stem: >
      Laquelle de ces analyses de la « note excellente » du chapitre 1 correspond
      précisément à la position des stoïciens, telle que développée dans la
      leçon ?
    type: mcq
    choices:
      - id: A
        text: "La note ne dépendait plus de l'élève une fois la copie rendue ; faire reposer son bonheur dessus expose à une souffrance évitable si l'on concentre son attention sur ce qui, seul, dépend de soi -- la préparation."
        correct: true
      - id: B
        text: "La note n'est qu'un plaisir isolé ; le bonheur se juge à une vie entière menée conformément à la vertu et à la raison, non à un épisode heureux."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est l'analyse d'Aristote (chapitre 2), pas celle des stoïciens : elle
          porte sur la vertu d'une vie entière, pas sur ce qui dépend ou
          non de nous.
      - id: C
        text: "Aucune note, aussi excellente soit-elle, ne dit rien de la valeur morale de l'élève -- seule la qualité de sa volonté compte, indépendamment des résultats obtenus et de leur reconnaissance.
        La question posée porterait donc sur la morale, non sur le bonheur."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est l'analyse de Kant (chapitre 5), centrée sur la dignité d'être
          heureux, pas la distinction stoïcienne entre ce qui dépend ou non
          de nous.
      - id: D
        text: "Ce cycle de désir et de satisfaction brève n'est pas un défaut personnel de l'élève, mais la structure même du désir humain, que rien ne peut modifier."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est l'analyse de Schopenhauer et Freud (chapitre 6), qui porte sur la
          structure du désir, pas sur la distinction stoïcienne.
    correct_feedback: >
      Les stoïciens rattachent la note à ce qui, une fois la copie rendue,
      échappe à l'élève -- et déplacent le bonheur vers ce qui dépend
      encore de lui : sa préparation.
    solution: |
      **Le réflexe stoïcien :** repérer ce qui, dans un événement, dépend
      encore de nous.

      **Le piège de l'item :** attribuer aux stoïciens une analyse qui
      appartient en réalité à Aristote, Kant ou Schopenhauer/Freud.

  - id: BON-19
    rung: "R6"
    difficulty_level: 5
    skill_code: philo_bonheur
    tags: [methode_dissertation, problematique]
    stem: >
      Laquelle de ces formulations constitue une véritable problématique
      pour le sujet « Le bonheur dépend-il de nous ? », conformément à la
      méthode exposée au chapitre 7 ?
    type: mcq
    choices:
      - id: A
        text: "Le bonheur dépend-il de nous, oui ou non ?"
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          C'est une simple répétition du sujet, pas une problématique :
          elle ne fait apparaître aucune tension entre deux positions
          légitimes.
      - id: B
        text: "Si le bonheur semble à la fois exiger une maîtrise de soi qui dépend entièrement de nous et des conditions extérieures -- santé, circonstances, vie collective -- qui nous échappent en partie, en quel sens peut-on dire qu'il dépend, ou ne dépend pas, de nous ?"
        correct: true
      - id: C
        text: "Qu'est-ce que le bonheur ?"
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          Cette question, trop large, abandonne la partie « dépend-il de
          nous » du sujet -- une problématique doit rester ancrée dans les
          termes exacts posés.
      - id: D
        text: "Aristote a-t-il raison de penser que le bonheur est une activité de l'âme conforme à la vertu, et cette définition suffit-elle, à elle seule, à décider si le bonheur dépend ou ne dépend pas de nous et de nos efforts ?
        Une problématique pourrait donc se contenter d'interroger un seul auteur."
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          C'est substituer une question de cours sur un auteur au sujet
          réellement posé, qui porte sur la dépendance du bonheur à notre
          égard.
    correct_feedback: >
      Une problématique met en tension deux positions également légitimes
      en apparence -- ici, la maîtrise de soi qui dépend de nous et les
      conditions extérieures qui nous échappent.
    solution: |
      **Ce qu'une problématique fait :** transformer le sujet en tension,
      pas le répéter ni le remplacer.

      **Les deux pièges :** la reformulation plate, et la question de
      cours déconnectée du sujet.

  - id: BON-20
    rung: "R6"
    difficulty_level: 5
    skill_code: philo_bonheur
    tags: [methode_dissertation, plan_dialectique]
    stem: >
      Dans le plan dialectique construit au chapitre 7 pour ce sujet, quels auteurs
      appuient précisément l'ANTITHÈSE (« cette maîtrise se heurte à des
      limites réelles ») ?
    type: mcq
    choices:
      - id: A
        text: "Aristote (les biens extérieurs nécessaires à un bonheur complet) et Schopenhauer/Freud (la structure du désir, le prix de la vie collective)."
        correct: true
      - id: B
        text: "Les stoïciens et Épicure, dont la maîtrise du désir garantirait, selon le plan, un bonheur total et sans aucune limite.
        L'antithèse serait donc soutenue par les auteurs de la thèse."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Ce sont les auteurs mobilisés pour la THÈSE, pas pour
          l'antithèse, qui vient au contraire objecter à leur position.
      - id: C
        text: "Kant seul, puisqu'il serait le seul auteur de la leçon à nier toute possibilité de bonheur."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Kant sert au dépassement (partie III), pas à l'antithèse -- et
          il ne nie jamais la possibilité du bonheur, seulement sa capacité
          à fonder la morale.
      - id: D
        text: "Aristote seul ; Schopenhauer et Freud appartiennent en réalité au dépassement (partie III), pas à l'antithèse."
        correct: false
        misconception: mc.philo.bonheur.methode-de-dissertation-mal-comprise
        feedback: >
          Le plan du chapitre 7 mobilise bien Schopenhauer et Freud dans
          l'antithèse, aux côtés d'Aristote -- c'est Kant, non eux, qui sert
          au dépassement.
    correct_feedback: >
      L'antithèse objecte à la thèse stoïcienne/épicurienne en mobilisant
      Aristote (les biens extérieurs) et Schopenhauer/Freud (les limites
      structurelles du désir et de la vie collective).
    solution: |
      **La thèse :** stoïciens et Épicure -- la maîtrise du désir suffit.

      **L'antithèse :** Aristote, Schopenhauer, Freud -- des limites
