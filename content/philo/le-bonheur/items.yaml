  - id: BON-10
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_bonheur
    tags: [distinction_auteurs, aristote, chaine_des_fins]
    stem: >
      Pourquoi Aristote soutient-il qu'il doit exister, au sommet de la
      chaîne des fins, un bien recherché pour lui-même ?
    type: mcq
    choices:
      - id: A
        text: "Parce que si chaque but n'était jamais qu'un moyen en vue d'un autre, la chaîne n'aurait pas de terme -- une poursuite qui ne s'arrêterait jamais sur rien serait vide et vaine."
        correct: true
      - id: B
        text: "Parce que les buts intermédiaires -- la santé, l'argent -- sont mauvais en eux-mêmes et doivent être dépassés au profit d'une fin d'une tout autre nature.
        Rechercher la santé serait donc un obstacle au bonheur."
        correct: false
        misconception: mc.philo.bonheur.finalite-de-la-chaine-mal-comprise
        feedback: >
          Aristote ne juge pas les moyens mauvais : il constate seulement
          qu'ils ne sont pas des fins ultimes, pas qu'ils seraient
          condamnables.
      - id: C
        text: "Parce que ce bien ultime est le plaisir, seule fin que tout être vivant recherche naturellement et sans exception, quelles que soient ses circonstances."
        correct: false
        misconception: mc.philo.bonheur.plaisir-reduit-a-lintensite
        feedback: >
          C'est la position d'Épicure (chapitre 3), pas celle d'Aristote, qui
          écarte au contraire le plaisir du rang de souverain bien.
      - id: D
        text: "Parce qu'aucune fin ultime ne peut jamais être atteinte, ce qui oblige à viser toujours plus loin sans jamais s'arrêter sur un bien définitif."
        correct: false
        misconception: mc.philo.bonheur.finalite-de-la-chaine-mal-comprise
        feedback: >
          C'est l'inverse de la conclusion d'Aristote : il rejette
          justement l'idée d'une poursuite sans terme, il ne l'accepte pas.
    correct_feedback: >
      Une chaîne de fins sans terme serait vide et vaine -- Aristote en
      conclut qu'il doit exister un bien recherché pour lui-même : le
      souverain bien, qu'il nomme bonheur.
    solution: |
      **L'argument :** toute action vise un but ; si chaque but n'était
      qu'un moyen, la chaîne n'aurait pas de terme.

      **Ce que cela n'est PAS :** ni un jugement moral sur les moyens, ni la
      thèse épicurienne du plaisir.

  - id: BON-11
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_bonheur
    tags: [distinction_auteurs, aristote, souverain_bien]
    stem: >
      Un élève résume ainsi Aristote : « le bonheur, c'est la vertu, et rien
      d'autre ne compte -- santé, ressources, amis n'ont aucune importance,
      et le sage vertueux ne doit ressentir aucun plaisir. » Que corrige
      précisément le texte sur ce résumé ?
    type: mcq
    choices:
      - id: A
        text: "Rien : ce résumé correspond exactement à la position d'Aristote, pour qui la vertu se suffit à elle-même et rend indifférent tout le reste des conditions de vie."
        correct: false
        misconception: mc.philo.bonheur.renoncement-radical-prete-aux-sages
        feedback: >
          Le texte corrige explicitement ce résumé -- il ne l'endosse pas.
      - id: B
        text: "Aristote méprise en effet le plaisir comme un mal moral dont le sage doit se détourner entièrement, mais accepte en revanche les biens extérieurs comme des conditions utiles au bonheur de l'homme accompli.
        Le plaisir serait donc exclu de la vie heureuse, et la richesse admise."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          Aristote ne juge pas le plaisir mauvais : l'activité vertueuse
          s'accompagne, dit le texte, du plaisir le plus véritable qui soit.
      - id: C
        text: "C'est l'inverse qu'il faut dire : pour Aristote, seul le plaisir compte réellement, la vertu n'étant qu'un moyen accessoire pour se le procurer plus sûrement."
        correct: false
        misconception: mc.philo.bonheur.doctrines-echangees
        feedback: >
          C'est transposer la structure épicurienne (chapitre 3) sur Aristote, qui
          fait au contraire de la vertu le cœur du bonheur.
      - id: D
        text: "Aristote exige un minimum de biens extérieurs pour un bonheur complet, et l'activité vertueuse s'accompagne du plaisir le plus véritable qui soit -- la vertu est la part principale, non la totalité, des conditions du bonheur."
        correct: true
    correct_feedback: >
      La vertu est la part principale et décisive du bonheur chez
      Aristote, pas sa totalité : un minimum de biens extérieurs reste
      nécessaire, et le plaisir accompagne l'activité vertueuse.
    solution: |
      **L'erreur du résumé :** confondre « part principale » et « seule
      condition ».

      **Ce que le texte rétablit :** un minimum de biens extérieurs, et un
      plaisir conséquence de la vertu, non exclu par elle.

  - id: BON-12
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [distinction_auteurs, epicure, desirs]
    stem: >
      Un élève désire une reconnaissance sociale toujours plus grande, sans
      qu'aucune quantité de succès ne suffise jamais à le satisfaire. À
      quelle catégorie de désirs ce désir appartient-il, selon Épicure, et
      pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Un désir naturel et nécessaire, car la reconnaissance sociale est indispensable au bien-être selon Épicure."
        correct: false
        misconception: mc.philo.bonheur.plaisir-reduit-a-lintensite
        feedback: >
          Épicure range dans les désirs naturels et nécessaires manger,
          se loger, se reposer -- pas la reconnaissance sociale.
      - id: B
        text: "Un désir naturel mais non nécessaire, comparable au choix d'un repas raffiné plutôt qu'un repas simple."
        correct: false
        misconception: mc.philo.bonheur.plaisir-reduit-a-lintensite
        feedback: >
          Un désir naturel non nécessaire reste limité et son absence ne
          cause aucune souffrance réelle -- la reconnaissance sociale
          insatiable n'a, elle, aucune limite naturelle.
      - id: C
        text: "Un désir vain -- il naît d'une opinion, non d'un besoin réel, et n'a par nature aucune limite, contrairement à la faim par exemple."
        correct: true
      - id: D
        text: "Peu importe la catégorie : Épicure recommande de satisfaire tout désir dès lors qu'il procure une sensation agréable."
        correct: false
        misconception: mc.philo.bonheur.plaisir-reduit-a-lintensite
        feedback: >
          C'est ignorer le tri des désirs qu'Épicure demande précisément
          d'opérer avant tout choix.
    correct_feedback: >
      Né d'une opinion et sans limite naturelle, ce désir porte la marque
      exacte du désir vain, structurellement incapable de produire
      l'ataraxie.
    solution: |
      **Le critère du désir vain :** né d'une opinion, sans limite
      naturelle, insatiable.

      **La confusion à éviter :** le classer parmi les désirs naturels
      (nécessaires ou non), qui ont, eux, une limite.

  - id: BON-13
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_bonheur
    tags: [distinction_auteurs, epicure, calcul_plaisirs]
    stem: >
      Selon la méthode du calcul des plaisirs proposée par Épicure, que
      faut-il faire face à un plaisir immédiat qui entraînerait, à terme,
      une douleur plus grande ?
    type: mcq
    choices:
      - id: A
        text: "Le rechercher quand même : l'intensité immédiate d'une sensation prime toujours sur ses conséquences à venir, quelle que soit leur ampleur."
        correct: false
        misconception: mc.philo.bonheur.plaisir-reduit-a-lintensite
        feedback: >
          C'est exactement l'hédonisme débridé qu'Épicure rejette : le
          critère n'est jamais l'intensité immédiate, mais les conséquences
          pesées sur toute une vie.
      - id: B
        text: "L'éviter -- le critère n'est jamais l'intensité immédiate d'une sensation, mais son effet, une fois les conséquences pesées, sur la tranquillité durable de toute une vie."
        correct: true
      - id: C
        text: "L'éviter, ainsi que toute douleur temporaire en général, même lorsqu'elle ouvrirait sur un plaisir plus grand, plus stable et plus durable."
        correct: false
        misconception: mc.philo.bonheur.renoncement-radical-prete-aux-sages
        feedback: >
          C'est manquer la moitié de la méthode : une douleur temporaire
          qui ouvre sur un plaisir plus grand et stable doit, elle, être
          acceptée.
      - id: D
        text: "Vérifier d'abord s'il s'agit d'un désir naturel et nécessaire : si oui, la douleur future qu'il entraîne importe peu et ne change rien au choix.
        Le calcul des plaisirs ne porterait donc que sur les désirs vains."
        correct: false
        misconception: mc.philo.bonheur.plaisir-reduit-a-lintensite
        feedback: >
          C'est confondre deux outils distincts : le tri des désirs et le
          calcul des plaisirs, qui pèse les conséquences indépendamment de
          la catégorie du désir.
    correct_feedback: >
      Épicure calcule les conséquences, non l'intensité immédiate : un
      plaisir menant à une douleur plus grande doit être évité, une
      douleur ouvrant sur un plaisir plus stable doit être acceptée.
    solution: |
      **Le critère :** l'effet sur la tranquillité durable, pas
      l'intensité immédiate.

      **Les deux erreurs symétriques :** rechercher tout plaisir intense,
      ou refuser toute douleur même profitable à terme.

  - id: BON-14
