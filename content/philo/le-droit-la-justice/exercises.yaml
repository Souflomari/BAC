    intro: |-
      **Cette citation est FABRIQUÉE pour cet exercice — elle n'est tirée
      d'aucun sujet d'examen réel.** La banque de sujets vérifiés de cette
      notion ne recense qu'UN SEUL texte réel (le سؤال de 2023 utilisé
      ci-dessus comme r-bac) ; suivant la règle de décision du chantier de
      conversion, cette variation est donc un jumeau fabriqué plutôt qu'un
      second texte réel — et elle t'est présentée comme telle, sans
      habillage trompeur.

      > « Une loi peut être parfaitement valide sans être bonne. »
      >
      > Discute cette affirmation.

      Cette citation résume, presque mot pour mot, la thèse centrale de
      Kelsen (chapitre 4) — mais elle t'oblige à construire toi-même, du début à
      la fin, l'argumentation que r-bac construisait déjà pas à pas pour
      toi. Le but n'est pas d'apprendre autre chose : c'est de reconnaître
      que le même raisonnement s'applique quand l'habillage change (une
      citation brute à discuter, plutôt qu'une question directe).
    questions:
      - id: q1
        part: "Partie 1 — Comprendre la citation"
        stem: |-
          La citation distingue deux mots précis : « valide » et
          « bonne ». Explique ce que chacun désigne ici, et pourquoi la
          citation affirme qu'ils peuvent se dissocier.
        reasoning: |-
          « Valide » désigne, au sens juridique construit par le chapitre 4, la
          conformité PROCÉDURALE d'une norme à la norme supérieure qui
          l'habilite — une question de FORME. « Bonne » désigne un
          jugement sur le CONTENU moral de cette même norme — une
          question distincte, que le chapitre 2 nommait déjà « justice » par
          opposition au « droit positif ». La citation affirme donc
          qu'une norme peut remplir parfaitement la première condition
          (la forme) sans remplir la seconde (le contenu) — exactement la
          séparation droit/morale que le chapitre 4 attribue à Kelsen.
      - id: q2
        part: "Partie 2 — Mobiliser Kelsen (chapitre 4)"
        stem: |-
          Pourquoi, selon Kelsen, cette dissociation entre validité et
          bonté n'est-elle pas un défaut du droit, mais au contraire ce
          qui protège sa fonction propre ?
        reasoning: |-
          Si la validité d'une loi dépendait de sa conformité à « la
          morale », il faudrait d'abord s'accorder sur ce qu'est la
          morale — un accord bien plus incertain, historiquement et
          culturellement, que l'accord procédural sur le fait qu'une loi a,
          ou non, été votée dans les formes prévues. Séparer validité et
          bonté, pour Kelsen, c'est donc protéger la sécurité juridique :
          savoir avec certitude ce qui est du droit, sans avoir à trancher
          au préalable un débat moral qui ne se refermera peut-être
          jamais. Une loi peut donc être parfaitement valide sans être
          bonne — et Kelsen ne prétend jamais le contraire de ce
          qu'affirme la citation.
      - id: q3
        part: "Partie 3 — Mobiliser la limite (chapitres 3 et 4-Nuremberg)"
        stem: |-
          Cette même dissociation, qui protège la sécurité juridique,
          ouvre aussi un risque que le chapitre 3 et le débat de Nuremberg (chapitre 4)
          permettent de nommer précisément. Lequel ?
        reasoning: |-
          Si « valide » et « bonne » peuvent absolument se dissocier sans
          qu'aucun critère n'intervienne jamais pour rapprocher les deux,
          alors AUCUNE loi, aussi injuste soit-elle dans son contenu, ne
          pourrait jamais être jugée invalide pour cette seule raison —
          exactement l'argument invoqué par certains accusés à Nuremberg,
          qui avaient « appliqué une loi en vigueur », parfaitement valide
          au sens procédural. La tradition jusnaturaliste (chapitre 3) répond que
          des principes de justice universels (ne pas réduire en
          esclavage, ne pas torturer) vaudraient même sans loi positive
          pour les protéger — et qu'une loi valide qui les violerait
          resterait, malgré sa validité, profondément injuste.
      - id: q4
        part: "Partie 4 — Esquisser une réponse argumentée (méthode du chapitre 8)"
        stem: |-
          En t'appuyant sur la méthode construite au chapitre 8 (analyse des
          termes, problématique, plan dialectique), esquisse en quelques
          lignes comment répondre à la consigne : discuter l'affirmation
          « une loi peut être parfaitement valide sans être bonne ».
        reasoning: |-
          Analyse des termes : « valide » renvoie à la conformité
          procédurale (chapitre 4), « bonne » à un jugement de contenu moral
          (chapitre 2) — deux propriétés que la citation affirme dissociables.
          Problématique : si cette dissociation protège la sécurité
          juridique (Kelsen), mais ouvre en même temps la possibilité
          qu'aucune loi ne soit jamais jugée invalide pour son seul
          contenu (Nuremberg), faut-il l'accepter sans réserve, ou
          existe-t-il une limite à cette dissociation ?

          Plan dialectique esquissé : **I. Thèse** — la citation est vraie
          et même nécessaire : la validité d'une loi ne peut dépendre d'un
          accord moral toujours incertain, sous peine de perdre toute
          sécurité juridique (Kelsen, chapitre 4). **II. Antithèse** — poussée à
          l'extrême, cette thèse rend recevable l'argument de défense
          invoqué à Nuremberg, et prive de tout critère la tradition
          jusnaturaliste qui protège des principes de justice universels
          (chapitre 3). **III. Dépassement** — la distinction légalité/légitimité
          (chapitre 7) permet de tenir les deux bouts sans les confondre : une loi
          peut être validement dite valide (Kelsen a raison) sans être
          reconnue comme légitime (le jusnaturalisme garde un rôle) — deux
          jugements qui ne coïncident pas nécessairement, ce qui est très
          exactement ce que la citation elle-même affirmait, sans en tirer
          toutes les conséquences. Retiens la structure, pas seulement le
          contenu : c'est le même mouvement thèse/antithèse/dépassement
          pratiqué au chapitre 8 sur un sujet différent — reconnaître cette
          structure sous un nouvel habillage est tout le but de cette
          variation.
