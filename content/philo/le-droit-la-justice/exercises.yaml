  - id: r-bac
    title: "Exercice de type bac — le droit est-il ce qu'établissent les lois positives ? (سؤال, 2023 rattrapage)"
    sourcing:
      status: sourced
      note: >-
        2023 session استدراكية (rattrapage) — code sujet RS 05, الموضوع
        الأول (سؤال) ; texte transcrit intégralement dans
        docs/sujets/philo/le-droit-la-justice.md (entrée « 2023 — session
        استدراكية (rattrapage) — الموضوع الأول (سؤال) », statut
        « vérifié » — via reproduction indépendante typée (profsalmi),
        citation/consigne/en-tête conformes, agent-vérificateur,
        2026-07-15). Épreuve nationale passée EN LANGUE ARABE (médium
        constaté sur le scan officiel, cf. la section « Médium & format »
        de la banque de sujets) : le bloc arabe ci-dessous est l'artefact
        de référence, le bloc français qui suit est une traduction de
        travail — jamais « vérifiée » au même titre que l'arabe. Cet
        exercice offre un rendu français à but pédagogique ; il ne
        prétend pas reproduire le médium réel de l'examen (composé et
        passé en arabe par l'élève marocain).
    intro: |-
      **Sujet réel, examen national de philosophie, 2023 (session
      استدراكية — rattrapage) — premier sujet (une question à traiter en
      dissertation) :**

      **Texte arabe (original) — artefact de référence :**

      > **الموضوع الأول :**
      > هل الحق هو ما تقرُّه القوانين الوضعية؟

      **Traduction de travail française — l'épreuve réelle est composée
      et passée en arabe ; ce rendu français est fourni à but
      pédagogique, il ne se substitue pas à l'artefact arabe ci-dessus :**

      > **Sujet premier :**
      > « Le droit est-il ce qu'établissent les lois positives ? »

      Cette question porte exactement sur le terrain déjà construit au chapitre 3
      (droit positif contre droit naturel) et le chapitre 4 (le positivisme juridique
      de Kelsen : la validité d'une norme tient à sa forme, non à son
      contenu) — à toi de mobiliser ce que tu sais déjà, sans qu'aucun
      contenu nouveau ne soit à apprendre pour l'affronter.
    questions:
      - id: q1
        part: "Partie 1 — Comprendre la question et la problématiser"
        stem: |-
          La question demande si LE DROIT est CE QU'ÉTABLISSENT les lois
          positives — pas si les lois positives existent, ni si elles
          doivent être respectées. Explique précisément ce qu'affirmerait
          une réponse « oui, sans réserve », et quelle difficulté cette
          réponse rencontre aussitôt.
        reasoning: |-
          Répondre « oui, sans réserve » reviendrait à dire que le droit
          se réduit ENTIÈREMENT à ce qu'une autorité a effectivement posé
          et mis en vigueur — rien de plus, rien de moins, aucun reste,
          aucun critère extérieur pour juger le contenu même de ces lois.
          C'est très exactement ce que le chapitre 4 nomme le positivisme juridique :
          la validité d'une norme se juge à sa seule conformité
          procédurale, jamais à son contenu moral.

          Mais le chapitre 1 met déjà cette réponse sous tension avec l'exemple du
          tribunal et de la rivière : « le tribunal a fait exactement ce
          qu'on attend de lui » (positivisme spontané) et « le tribunal a
          manqué à sa mission » (le sentiment qu'un tort réel échappe
          pourtant au droit positif) sont les deux réponses spontanées, et
          aucune des deux, prise seule, ne suffit. Si « oui, sans
          réserve », alors n'importe quelle loi — aussi injuste soit-elle
          dans son contenu — devrait être appliquée sans discussion
          possible du seul fait qu'elle a été adoptée dans les formes ;
          c'est très exactement l'argument invoqué à Nuremberg (chapitre 4), et il
          pose un problème sérieux : aucune loi ne pourrait alors jamais
          être jugée, de l'extérieur, injuste. La question n'appelle donc
          pas une réponse fermée, mais la construction d'une tension : le
          droit EST bien ce qu'établissent les lois positives à certains
          égards (sa validité, sa force obligatoire immédiate) — mais
          est-ce TOUT ce qu'il est ?
      - id: q2
        part: "Partie 2 — Mobiliser la thèse positiviste (chapitre 4, Kelsen)"
        stem: |-
          Construis l'argument le plus solide en faveur d'une réponse
          « oui » : pourquoi Kelsen soutiendrait-il que le droit se réduit
          à ce qu'établissent les lois positives, et en quoi ce n'est pas
          une position arbitraire ?
        reasoning: |-
          Kelsen ne dit pas cela par caprice : son critère de validité est
          purement procédural — une norme est valide si elle a été
          produite conformément à la norme supérieure qui l'habilite (la
          hiérarchie des normes), sans que son contenu moral n'entre
          jamais en ligne de compte. Vouloir juger le droit à l'aune d'un
          critère extérieur — une « justice » ou une « nature » qui
          échapperait aux lois positives — ferait perdre au droit sa
          fonction propre : fournir des règles identifiables et
          applicables, connues de tous à l'avance, indépendamment de
          convictions morales divergentes.

          Appliquée à la question, la position de Kelsen soutient bien, en
          un sens précis, que « le droit EST ce qu'établissent les lois
          positives » — au sens où c'est la SEULE chose qui rend une norme
          valide EN DROIT. Mais attention à la nuance exacte, rappelée par
          l'erreur à éviter du chapitre 4 : Kelsen ne dit jamais qu'une loi
          positive est nécessairement bonne ou juste — il dit seulement
          que sa validité JURIDIQUE ne dépend de rien d'autre que de sa
          conformité procédurale. C'est cette nuance précise qu'une bonne
          copie doit préserver, pas la caricature « Kelsen pense que toute
          loi positive est juste ».
      - id: q3
        part: "Partie 3 — Mobiliser l'antithèse jusnaturaliste (chapitre 3) et la limite du positivisme (chapitre 4, Nuremberg)"
        stem: |-
          Construis maintenant l'argument le plus solide en faveur d'une
          réponse « non, pas entièrement » — en t'appuyant sur le chapitre 3 (droit
          naturel) et sur le débat né des procès de Nuremberg (chapitre 4).
        reasoning: |-
          La tradition jusnaturaliste (chapitre 3) répond que non : des principes
          de justice universels — ne pas être réduit en esclavage, ne pas
          être torturé — vaudraient même si aucune loi positive ne les
          protégeait, et une loi positive qui les violerait resterait
          injuste, quelle que soit sa validité procédurale. Locke (leçon
          « L'État », repris au chapitre 3 ici) en donne l'exemple le plus net :
          des droits naturels existent déjà dans l'état de nature, avant
          tout contrat et toute loi positive — l'État ne les crée pas, il
          les protège.

          Le débat né de Nuremberg (chapitre 4) pousse cette objection à son point
          le plus fort : plusieurs responsables du régime nazi ont
          invoqué, pour leur défense, le fait d'avoir appliqué des lois
          « votées, promulguées, parfaitement valides au sens procédural
          du terme ». Si le droit se réduisait ENTIÈREMENT à ce
          qu'établissent les lois positives, cet argument de défense
          devrait, en toute rigueur, être recevable — ce que la plupart
          jugent pourtant inacceptable. Radbruch en tire la conclusion
          inverse de Kelsen : au-delà d'un certain seuil d'injustice
          extrême, une « loi » cesserait de mériter le nom de droit,
          quelle qu'ait été sa conformité procédurale.
      - id: q4
        part: "Partie 4 — Discuter (chapitre 4 : la réponse du positivisme, et pourquoi le débat reste ouvert)"
        stem: |-
          Le positivisme ne reste pas sans réponse face à l'objection
          jusnaturaliste. Formule cette réponse, puis explique pourquoi le
          débat, selon la leçon, reste ouvert plutôt que tranché dans un
          sens ou dans l'autre.
        reasoning: |-
          Le positivisme répond (chapitre 4) qu'accepter l'objection jusnaturaliste
          revient à réintroduire, par la porte de derrière, l'incertitude
          que la séparation droit/morale voulait justement éviter : qui
          déciderait, alors, du « seuil d'injustice extrême », sinon un
          jugement moral aussi contestable que ceux qu'on cherchait à
          éviter ? Céder sur ce point, c'est perdre exactement ce que le
          positivisme protège : la sécurité juridique, la possibilité de
          savoir avec certitude ce qui est du droit sans avoir à trancher
          d'abord un débat moral qui ne se refermera peut-être jamais.

          La distinction légalité/légitimité (chapitre 7) permet de nommer
          précisément ce point d'équilibre sans trancher artificiellement
          le débat : une loi peut être légale (conforme à la procédure —
          ce que Kelsen établit) sans être légitime (reconnue comme
          fondée, méritant l'obéissance — ce que le contenu peut mettre en
          cause). Cela ne revient PAS à dire que le droit n'est « que » ce
          qu'établissent les lois positives (le positivisme aurait raison
          sans réserve), ni que la légalité ne compte pour rien (le
          jusnaturalisme aurait raison sans réserve) : cela nomme un écart
          POSSIBLE, dont l'existence ne se laisse nier par aucun des deux
          camps pris seul — c'est pourquoi le débat reste ouvert.
      - id: q5
        part: "Partie 5 — Synthétiser"
        stem: |-
          En une phrase, formule la réponse la plus défendable à la
          question posée par ce sujet, en évitant les deux caricatures
          (« oui, sans réserve » / « non, pas du tout »).
        reasoning: |-
          Le droit EST, au sens le plus strict de sa validité juridique,
          ce qu'établissent les lois positives conformément à la procédure
          qui les habilite (Kelsen a raison sur ce point précis) — mais
          cette validité procédurale ne suffit pas à garantir que le
          contenu de ces lois soit juste, et l'écart entre légalité et
          légitimité (chapitre 7), comme la tradition jusnaturaliste (chapitre 3) et le
          débat de Nuremberg (chapitre 4), montrent qu'un critère de justice qui
          excède la seule positivité des lois reste nécessaire pour juger,
          réformer, et parfois refuser de légitimer ce que le droit
          positif, à lui seul, aurait pu laisser passer — exactement ce
          que le chapitre 1 donnait déjà à voir avec le silence de la loi sur la
          rivière empoisonnée.

