# already-taught rungs:
#   - The 2022 قولة maps CLEANLY onto R2 alone: it is, almost word for word,
#     the naive claim R2's prix/dignité, fin-en-soi/moyen mechanism is built
#     to refute (nothing but power/wealth commands respect → Kant's prix,
#     not dignité). No new axis; the lesson already teaches everything the
#     exercise needs. → routed to r-variation (status: sourced, per the
#     rule), the SAFER mapping.
#   - The 2015 قولة is richer: "refuser d'être traité comme une chose"
#     echoes R2's moyen/fin vocabulary almost exactly, AND "j'affirme ma
#     valeur" echoes R6's dépersonnalisation (réduire à un pur moyen, un
#     objet interchangeable) — but it adds something neither rung states
#     directly: the citation makes MY OWN ACT of refusal the thing that
#     affirms my status as person, where R2's Kantian dignity is a standing,
#     static fact (a nature one simply HAS) and R6's dépersonnalisation is
#     an act OTHERS commit or fail to commit against me. Nowhere does R0-R7
#     pose the question the 2015 citation's own المطلوب names directly —
#     مصدر قيمة الشخص, "the SOURCE of the person's value" — as possibly
#     lying, even in part, in the subject's own active self-assertion rather
#     than purely in a possessed rational nature or a reconnaissance
#     granted/refused by others. That is a genuinely novel angle relative to
#     R0-R7's otherwise static framing of both Kant's criterion and R6's
#     dépersonnalisation. → routed to r-bac (the richer, more defensible
#     choice per the addendum, since its `reasoning` below explicitly
#     bridges back to R2 and R6 rather than silently assuming the axis was
#     already taught) — and primed by a dedicated checkpoint
#     (cp-bac-affirmation) immediately before it, mirroring how la-liberte's
#     Bakounine r-bac (a comparably novel axis) got its own priming
#     checkpoint (cp-bac-autrui) rather than being dropped on the student
#     cold.
