    solution: |
      **Identité numérique/administrative :** le même nom, le même numéro --
      un simple suivi de l'individu.
      **Identité personnelle :** une question distincte, non réglée par ce
      seul fait. Ne jamais confondre les deux.

  - id: PERS-11
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_la_personne
    tags: [individu, personne, identite_personnelle]
    stem: >
      Appliqué à la scène de la boîte à chaussures, que peut-on affirmer au
      niveau de l'INDIVIDU seulement, selon le chapitre 2 ?
    type: mcq
    choices:
      - id: A
        text: "Cette continuité de l'individu suffit à elle seule à garantir que tu restes, au sens plein, engagé par les mêmes promesses qu'à dix ans -- puisqu'aucune autre condition, mentale ou morale, ne viendrait jamais s'ajouter à la simple persistance corporelle pour fonder un tel engagement."
        correct: false
        misconception: mc.philo.la_personne.individu-identite-personnelle-confondus
        feedback: >
          C'est exactement la confusion que le chapitre 2 met en garde d'éviter : la
          continuité de l'individu ne tranche pas, à elle seule, la
          question de l'identité personnelle.
      - id: B
        text: "Il existe une continuité simple, spatio-temporelle, entre le corps qui a écrit ces pages et celui d'aujourd'hui -- mais ce seul fait ne tranche rien quant à savoir si tu restes, au sens plein, la MÊME personne."
        correct: true
      - id: C
        text: "Aucune continuité, même au simple niveau de l'individu, ne peut être établie, puisque la matière du corps se renouvelle sans cesse."
        correct: false
        misconception: mc.philo.la_personne.individu-identite-personnelle-confondus
        feedback: >
          Le chapitre 2 affirme au contraire qu'une continuité spatio-temporelle
          simple existe bel et bien au niveau de l'individu -- c'est
          seulement insuffisant pour la question de la personne.
      - id: D
        text: "Le seul fait d'être un individu suffit déjà à garantir un statut de personne, puisque tout être humain vivant est automatiquement une personne au sens plein."
        correct: false
        misconception: mc.philo.la_personne.individu-personne-synonymes
        feedback: >
          Le chapitre 2 est clair : tout être humain vivant est un individu, mais lui
          reconnaître le statut de personne suppose un critère
          supplémentaire (Kant, chapitre 3), pas une déduction automatique.
    correct_feedback: >
      Au niveau de l'individu, seule une continuité spatio-temporelle du
      corps est établie -- elle ne tranche pas la question, distincte, de
      l'identité personnelle.
    solution: |
      **Niveau individu :** continuité spatio-temporelle simple d'un même
      corps. **Ce que cela ne tranche pas :** si tu restes, au sens plein,
      la même personne. Ne jamais déduire le statut de personne du seul
      fait d'être un individu.

  - id: PERS-12
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [kant, fin_en_soi, dignite]
    stem: >
      Un élève affirme : « Kant interdit absolument d'utiliser un être
      raisonnable comme moyen, par exemple en le payant pour un service. »
      Que manque cette lecture ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que Kant autorise, au contraire, de traiter n'importe quel être raisonnable comme un pur moyen, dès lors que cela sert une fin utile à la société."
        correct: false
        misconception: mc.philo.la_personne.kant-prix-dignite-mal-compris
        feedback: >
          C'est l'excès inverse : Kant interdit précisément la réduction
          entière à un instrument, quelle que soit l'utilité sociale
          invoquée.
      - id: B
        text: "Elle manque le fait que, pour Kant, seul le prix d'un service détermine s'il est moralement acceptable de payer quelqu'un -- une lecture qui ferait dépendre toute la moralité de l'échange du seul montant versé, sans jamais faire intervenir la dignité de la personne payée."
        correct: false
        misconception: mc.philo.la_personne.kant-prix-dignite-mal-compris
        feedback: >
          C'est confondre prix et dignité : le prix d'un service ne dit
          rien du respect dû, par ailleurs, à la personne qui le rend.
      - id: C
        text: "Elle manque la nuance exacte de Kant : il n'interdit pas d'utiliser autrui comme moyen dans un échange (payer un artisan utilise sa compétence), mais de le réduire ENTIÈREMENT à un instrument, sans jamais reconnaître en lui une fin en soi."
        correct: true
      - id: D
        text: "Elle manque le fait que cette interdiction ne vaut, chez Kant, que pour les personnes morales (entreprises, associations), jamais pour les individus concrets."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          C'est l'inverse : le principe kantien de la fin en soi concerne
          d'abord les êtres raisonnables concrets, pas les fictions
          juridiques que sont les personnes morales.
    correct_feedback: >
      Kant n'interdit pas tout usage d'autrui comme moyen dans un échange,
      seulement sa réduction ENTIÈRE à un pur instrument, sans
      reconnaissance de sa dignité.
    solution: |
      **Ce que Kant permet :** utiliser autrui comme moyen dans un échange
      limité (payer un artisan).
      **Ce que Kant interdit :** réduire quelqu'un ENTIÈREMENT à un
      instrument, sans jamais le reconnaître aussi comme fin en soi.

  - id: PERS-13
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [kant, dignite, prix]
    stem: >
      Pourquoi, selon Kant, ce qui a un prix ne peut-il jamais avoir aussi
      une dignité ?
    type: mcq
    choices:
      - id: A
        text: "Parce que le prix concerne seulement les objets naturels, tandis que la dignité concerne exclusivement les objets fabriqués par l'homme."
        correct: false
        misconception: mc.philo.la_personne.kant-prix-dignite-mal-compris
        feedback: >
          Le partage prix/dignité suit, chez Kant, la présence ou
          l'absence de raison et d'autonomie -- pas l'origine naturelle ou
          fabriquée de la chose.
      - id: B
        text: "Parce que la dignité, comme le prix, admet des degrés : certains êtres ont plus de dignité que d'autres selon leur utilité sociale, un peu comme deux objets du même genre peuvent avoir un prix différent selon leur qualité ou leur rareté."
        correct: false
        misconception: mc.philo.la_personne.kant-prix-dignite-mal-compris
        feedback: >
          C'est le contraire : Kant définit la dignité comme une valeur
          absolue, sans degrés ni équivalent -- l'utilité sociale relève,
          elle, du seul registre du prix.
      - id: C
        text: "Parce que seuls les objets ayant une longue histoire ou une grande ancienneté acquièrent, avec le temps, une dignité que les objets récents n'ont pas -- une dignité qui grandirait donc avec les années, exactement comme le prix d'un objet ancien sur un marché d'antiquités, plutôt que de tenir, comme chez Kant, à la seule raison."
        correct: false
        misconception: mc.philo.la_personne.dignite-fondee-sur-privilege
        feedback: >
          C'est confondre la dignité kantienne avec une valeur sentimentale
          ou patrimoniale liée à l'ancienneté -- sans rapport avec le
          critère kantien de la raison et de l'autonomie.
      - id: D
        text: "Parce que le prix suppose un équivalent qui permettrait de remplacer la chose sans rien perdre d'irremplaçable, alors que la dignité désigne une valeur absolue, sans aucun équivalent possible."
        correct: true
    correct_feedback: >
      Prix et dignité s'excluent parce que le premier admet un équivalent
      remplaçant, alors que la seconde désigne une valeur absolue, sans
      équivalent.
    solution: |
      **Prix :** valeur relative, remplaçable par un équivalent.
      **Dignité :** valeur absolue, sans équivalent possible. Le partage
      suit la raison et l'autonomie, jamais l'origine, l'âge ou l'utilité
      sociale de la chose.

  - id: PERS-14
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [locke, meme_homme_meme_personne, continuite_conscience]
    stem: >
      Selon Locke, que signifie précisément la distinction entre « même
      homme » et « même personne » ?
    type: mcq
    choices:
      - id: A
        text: "« Même homme » ne suppose qu'une continuité organique d'un même corps vivant à travers le temps ; « même personne » -- terme forensique, lié au jugement moral et juridique -- suppose la continuité de la conscience, capable de se ressaisir par la mémoire."
        correct: true
      - id: B
        text: "Les deux expressions désignent exactement la même chose chez Locke, employées comme synonymes interchangeables."
        correct: false
        misconception: mc.philo.la_personne.locke-mecanisme-details-mal-compris
        feedback: >
          Locke insiste au contraire sur la distinction : ce sont deux
          questions différentes, l'une biologique, l'autre forensique.
      - id: C
        text: "« Même homme » est le terme forensique, lié au jugement moral et juridique, tandis que « même personne » ne désigne qu'une continuité purement biologique."
        correct: false
        misconception: mc.philo.la_personne.locke-mecanisme-details-mal-compris
        feedback: >
          C'est l'inverse exact des deux définitions de Locke.
      - id: D
        text: "« Même personne » suppose seulement que le corps ait persisté sans le moindre changement notable au fil de tout ce temps qui passe inexorablement, la conscience n'intervenant jamais que comme un indice tout à fait secondaire et négligeable dans ce jugement."
        correct: false
        misconception: mc.philo.la_personne.locke-critere-mal-identifie
        feedback: >
          Chez Locke, c'est la conscience qui est le critère décisif de la
          même personne, jamais le corps ni un indice secondaire.
    correct_feedback: >
      « Même homme » (continuité organique) et « même personne » (continuité
      de conscience, terme forensique) répondent, chez Locke, à deux
      questions distinctes.
    solution: |
      **Même homme :** continuité organique d'un même corps vivant.
      **Même personne :** terme forensique -- continuité de la conscience
      par la mémoire. Ne jamais inverser ces deux critères.

  - id: PERS-15
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [locke, continuite_conscience, identite_personnelle]
    stem: >
      Un élève objecte : « Je ne me souviens plus du tout de ce que j'ai
      vécu à cinq ans -- donc, selon Locke, je ne suis plus la même
      personne que cet enfant. » Que répondrait Locke ?
    type: mcq
    choices:
      - id: A
        text: "Que cette objection est décisive : l'absence de souvenir direct d'un épisode rompt, à elle seule, l'identité personnelle avec l'enfant qu'on a été."
        correct: false
        misconception: mc.philo.la_personne.locke-mecanisme-details-mal-compris
        feedback: >
          Locke précise au contraire qu'une mémoire totale et parfaite
          n'est pas exigée -- une chaîne de maillons qui se recouvrent
          partiellement suffit.
      - id: B
        text: "Qu'une chaîne ININTERROMPUE de souvenirs qui se chevauchent suffit à maintenir l'identité personnelle -- il n'est pas nécessaire de se souvenir directement, aujourd'hui, de chaque épisode passé."
        correct: true
      - id: C
        text: "Que ce n'est pas un problème, puisque l'identité personnelle, chez lui, ne dépend de toute façon que de la continuité du corps, jamais de la mémoire."
        correct: false
        misconception: mc.philo.la_personne.locke-critere-mal-identifie
        feedback: >
          C'est l'inverse exact de la thèse de Locke : c'est la conscience,
          non le corps, qui fonde l'identité personnelle.
      - id: D
        text: "Qu'il suffit, pour rester la même personne, de porter le même nom depuis l'enfance, indépendamment de toute continuité de conscience -- un critère purement administratif que Locke, pourtant, ne mentionne à aucun moment dans sa définition forensique de la personne."
        correct: false
        misconception: mc.philo.la_personne.identite-numerique-confondue-personnelle
        feedback: >
          C'est confondre identité personnelle et simple identité numérique
          ou administrative -- exactement ce que le chapitre 2 met en garde d'éviter.
    correct_feedback: >
      Locke n'exige pas une mémoire totale : une chaîne ininterrompue de
      souvenirs qui se chevauchent partiellement suffit à maintenir
      l'identité personnelle.
    solution: |
      **Le raffinement de Locke :** pas besoin de tout se rappeler
      directement. **Ce qui suffit :** une chaîne de maillons de mémoire
      qui se recouvrent partiellement. Le critère reste la conscience,
      jamais le corps ni le nom.

  - id: PERS-16
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [hume, faisceau_de_perceptions, critique_du_moi]
    stem: >
      Un élève résume ainsi Hume : « Il nie que quoi que ce soit se passe
      réellement dans l'esprit -- pour lui, rien n'existe, pas même des
      perceptions successives. » Que manque ce résumé ?
    type: mcq
    choices:
      - id: A
        text: "Il manque le fait que Hume affirme, à l'inverse, avec certitude l'existence d'une âme substantielle qui explique la succession des perceptions."
        correct: false
        misconception: mc.philo.la_personne.hume-these-mal-comprise
        feedback: >
          C'est l'inverse exact de la conclusion de Hume, qui ne trouve
          jamais, par introspection, une telle substance.
      - id: B
        text: "Il manque le fait que cette question ne concerne, chez Hume, que les personnes morales au sens juridique, jamais l'esprit d'un individu concret -- une restriction qu'aucune ligne du chapitre 5 ne pose, puisque Hume interroge, par introspection, l'esprit d'un individu concret, pas le statut juridique d'une entreprise ou d'une association."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          La critique humienne du moi porte sur l'esprit d'un individu
          concret par introspection, sans rapport avec la notion juridique
          de personne morale.
      - id: C
        text: "La nuance précise de Hume : il ne nie pas que des perceptions se succèdent réellement -- il nie seulement qu'on puisse observer, derrière cette succession, une substance permanente, un « moi » distinct des perceptions qui les porterait toutes."
        correct: true
      - id: D
        text: "Il manque le fait que Hume, comme Locke, fonde malgré tout l'identité personnelle sur une conscience capable de se ressaisir elle-même -- comme si les deux philosophes défendaient, au fond, exactement la même thèse sur ce point précis du programme."
        correct: false
        misconception: mc.philo.la_personne.locke-hume-confondus
        feedback: >
          C'est la confusion la plus fréquente sur ce point : c'est Locke
          qui suppose une telle conscience continue -- Hume va plus loin et
          en conteste jusqu'à l'existence.
    correct_feedback: >
      Hume ne nie pas la succession réelle de perceptions -- il nie
      seulement qu'une substance permanente, un « moi », les unifie
      réellement.
    solution: |
      **Ce que Hume affirme :** des perceptions se succèdent réellement.
      **Ce que Hume nie :** qu'une substance stable, un « moi », les porte
      toutes. Ne pas confondre avec Locke, qui suppose encore une
      conscience continue.

  - id: PERS-17
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [hume, faisceau_de_perceptions, critique_du_moi]
    stem: >
      Quelle analogie Hume propose-t-il pour expliquer pourquoi nous
      croyons, à tort, qu'un « moi » stable unifie nos perceptions ?
    type: mcq
    choices:
      - id: A
        text: "Il compare le moi à un fleuve qui garde son identité malgré le changement constant de son eau -- image empruntée à Locke pour illustrer la permanence du même homme biologique."
        correct: false
        misconception: mc.philo.la_personne.locke-hume-confondus
        feedback: >
          Cette image du fleuve, chez Locke, illustre la continuité du
          « même homme » biologique -- pas la fiction du moi que dénonce
          Hume.
      - id: B
        text: "Il compare le moi à un contrat juridique, dont la validité repose sur la reconnaissance mutuelle des parties, comme la promesse imputable à une personne responsable."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est un vocabulaire du chapitre 6 (imputabilité, sujet de droit), sans
          rapport avec l'argument épistémologique de Hume sur
          l'introspection.
      - id: C
        text: "Il compare le moi à la dignité kantienne, une valeur absolue et sans équivalent qui persiste indépendamment de toute perception -- une analogie qui rattacherait, à tort, l'argument épistémologique de Hume au vocabulaire moral tout différent de Kant."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est confondre la critique humienne du moi avec le concept
          kantien de dignité, une notion d'un tout autre registre (chapitre 3).
      - id: D
        text: "Il compare cette unité imaginaire à celle qu'on prête à une mélodie ou à une rivière : des éléments distincts, reliés seulement par leur ressemblance ou leur proximité, jamais par une substance commune qu'on pourrait isoler."
        correct: true
    correct_feedback: >
      Hume compare l'unité imaginaire du moi à celle d'une mélodie ou d'une
      rivière -- des éléments distincts reliés seulement par ressemblance
      ou proximité.
    solution: |
      **L'analogie :** une mélodie ou une rivière, dont l'unité n'est
      jamais qu'apparente. **Ce qu'elle illustre :** le moi comme fiction
      fabriquée par l'imagination. Ne pas confondre avec l'image du fleuve
      chez Locke (chapitre 4).

  - id: PERS-18
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [sujet_de_droit, personne_morale, personne_physique]
    stem: >
      Le droit distingue « personne physique » et « personne morale ».
      Laquelle de ces affirmations restitue correctement cette distinction,
      telle que la leçon la présente ?
    type: mcq
    choices:
      - id: A
        text: "La personne physique désigne un individu humain concret ; la personne morale, une fiction juridique (entreprise, association, État) à qui l'on reconnaît aussi des droits et des obligations, bien qu'elle ne possède ni conscience ni mémoire."
        correct: true
      - id: B
        text: "Seule la personne morale, en tant que fiction juridique, peut être sujet de droit ; la personne physique n'est jamais, à elle seule, qu'un individu, sans statut juridique propre."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          C'est l'inverse : personne physique et personne morale peuvent
          toutes deux être sujets de droit -- ce n'est pas un privilège
          réservé à la seule fiction juridique.
      - id: C
        text: "« Personne morale » désigne un individu humain reconnu pour sa vertu et son sens moral exceptionnel, par opposition aux personnes ordinaires -- comme si le mot « morale » désignait ici un mérite individuel plutôt qu'une catégorie du droit civil."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          C'est une confusion de vocabulaire : « morale » est ici un terme
          juridique (une fiction comme une entreprise), sans rapport avec
          la vertu individuelle d'une personne physique.
      - id: D
        text: "Une personne morale, en tant que fiction juridique, jouit de droits mais n'est, par nature, jamais soumise à aucune obligation ni à aucune responsabilité -- comme si une entreprise pouvait indéfiniment engranger des droits sans jamais répondre d'une seule dette, d'un seul contrat rompu ou d'une seule obligation légale envers qui que ce soit."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          La leçon dit le contraire : la personne morale se voit reconnaître
          à la fois des droits ET des obligations -- être sujet de droit n'a
          jamais signifié n'avoir que des droits sans devoirs.
    correct_feedback: >
      Personne physique et personne morale sont, l'une comme l'autre, sujets
      de droits ET d'obligations -- ce n'est ni un privilège de la seconde,
      ni une asymétrie entre droits et devoirs.
    solution: |
      **Personne physique :** un individu humain concret.
      **Personne morale :** une fiction juridique, sans conscience ni
      mémoire propre.
      **Le point commun :** les deux sont sujets de droits ET d'obligations.

  - id: PERS-19
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_la_personne
    tags: [imputabilite, causalite, autonomie_rationnelle]
    stem: >
      Un rocher se détache d'une falaise et brise le pare-brise d'une
      voiture garée en contrebas. Peut-on dire que le rocher est
      « responsable » du dommage, au sens de l'imputabilité construite dans
      cette leçon ?
    type: mcq
    choices:
      - id: A
        text: "Non : le rocher a causé matériellement le dommage, mais il n'était capable ni de comprendre la portée de son acte ni de choisir d'agir autrement -- l'imputabilité exige un sujet capable de ces deux choses, pas seulement un lien de cause à effet."
        correct: true
      - id: B
        text: "Oui : dès qu'un événement cause matériellement un dommage, on peut, au sens plein du terme, l'imputer à sa cause -- qu'il s'agisse d'un objet ou d'un sujet raisonnable."
        correct: false
        misconception: mc.philo.la_personne.imputabilite-mal-fondee
        feedback: >
          C'est réduire l'imputabilité à la pure causalité -- exactement
          l'erreur à éviter : comprendre et pouvoir choisir autrement sont
          les conditions qui manquent au rocher.
      - id: C
        text: "Oui, mais seulement parce que le propriétaire du terrain, en tant que personne morale, devient alors automatiquement responsable pénalement de tout ce qui s'y trouve -- une responsabilité qui se transmettrait ainsi mécaniquement du seul fait de la propriété, sans aucune question de discernement."
        correct: false
        misconception: mc.philo.la_personne.imputabilite-mal-fondee
        feedback: >
          Confusion : être sujet de droit (R5) ne rend personne
          « automatiquement » responsable pénal d'un événement naturel --
          l'imputabilité exige toujours discernement et choix.
      - id: D
        text: "Non, mais uniquement parce qu'un rocher n'est pas un individu au sens biologique -- s'il s'agissait d'un animal capable de mouvement autonome, l'imputabilité s'appliquerait de la même façon qu'à un être humain."
        correct: false
        misconception: mc.philo.la_personne.imputabilite-mal-fondee
        feedback: >
          C'est confondre l'autonomie rationnelle kantienne (se donner à
          soi-même sa propre loi, chapitre 3) avec une simple autonomie de
          mouvement : se déplacer seul ne veut pas dire comprendre la
          portée de ses actes.
    correct_feedback: >
      L'imputabilité exige la capacité de comprendre la portée d'un acte et
      d'avoir pu choisir autrement -- un pur enchaînement causal, même
      spectaculaire, n'y suffit jamais.
    solution: |
      **Ce qui manque au rocher :** comprendre, avoir pu choisir autrement.
      **Ce que la causalité seule ne donne pas :** l'imputabilité.
      **L'erreur à éviter :** confondre autonomie rationnelle et simple
      mouvement autonome.

  - id: PERS-20
    rung: "R6"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [depersonnalisation, reification, respect]
    stem: >
      Un élève affirme : « Manquer de politesse envers quelqu'un, l'ignorer
      un instant dans une conversation, c'est déjà le dépersonnaliser, au
      sens de cette leçon. » Que faut-il objecter ?
    type: mcq
    choices:
      - id: A
        text: "La dépersonnalisation, au sens construit ici, est une opération plus radicale : retirer à quelqu'un le statut moral et juridique de fin en soi et de sujet responsable, en le réduisant à un pur instrument ou objet interchangeable -- pas un simple manque ponctuel de politesse."
        correct: true
      - id: B
        text: "Rien à objecter : tout manque de respect, aussi minime soit-il, équivaut, par nature, à retirer entièrement à quelqu'un son statut de personne."
        correct: false
        misconception: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
        feedback: >
          C'est confondre deux échelles très différentes : un manque de
          respect ponctuel n'annule pas la reconnaissance d'une fin en soi
          -- la dépersonnalisation retire ce statut lui-même.
      - id: C
        text: "Il faut objecter que seule une décision de justice formelle peut dépersonnaliser quelqu'un -- aucun acte social ou historique, comme l'esclavage, ne le peut réellement."
        correct: false
        misconception: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
        feedback: >
          C'est l'inverse de ce que montre l'exemple de l'esclavage : la
          dépersonnalisation est d'abord une reconnaissance SOCIALE
          refusée, pas seulement un acte de justice formel.
      - id: D
        text: "Il faut objecter que la dépersonnalisation, telle que définie très précisément et explicitement dans cette leçon, désigne uniquement un trouble psychiatrique purement individuel et intérieur, sans aucun lien réel ou direct avec la manière dont autrui nous traite au quotidien."
        correct: false
        misconception: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
        feedback: >
          La leçon écarte ce sens-là : la dépersonnalisation qu'elle
          construit est d'abord un acte commis par d'autres, pas un trouble
          intérieur.
    correct_feedback: >
      Dépersonnaliser retire un statut moral et juridique entier (fin en
      soi, sujet responsable) -- une opération radicale, bien au-delà d'un
      simple manque ponctuel de respect.
    solution: |
      **Manque de respect :** ponctuel, n'annule aucun statut.
      **Dépersonnalisation :** retire le statut de fin en soi et de sujet
      responsable.
      **L'erreur à éviter :** les confondre, ou réduire ce concept à un
      trouble psychiatrique individuel.

  - id: PERS-21
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_la_personne
    tags: [depersonnalisation, dignite, reconnaissance_sociale]
    stem: >
      Dans le cas de l'esclavage, cité par la leçon comme exemple radical de
      dépersonnalisation, qu'est-ce qui a été réellement perdu par les
      personnes réduites en esclavage, et qu'est-ce qui, selon le critère
      kantien (chapitre 3), ne pouvait pas leur être retiré ?
    type: mcq
    choices:
      - id: A
        text: "Elles ont perdu la reconnaissance sociale et juridique de leur statut de personne, traitées comme un bien ; mais, selon le critère kantien, leur dignité -- leur nature d'êtres raisonnables -- ne pouvait, elle, leur être retirée par aucune décision humaine."
        correct: true
      - id: B
        text: "Elles ont perdu, du même coup et sans aucune distinction possible, et la reconnaissance sociale de leur statut, et leur nature raisonnable elle-même, qui cesse purement et simplement d'exister dès qu'un système juridique refuse de la reconnaître comme telle."
        correct: false
        misconception: mc.philo.la_personne.dignite-confondue-avec-reconnaissance-sociale
        feedback: >
          C'est confondre reconnaissance sociale (que le droit peut
          refuser) et nature raisonnable kantienne (qui ne dépend d'aucune
          reconnaissance extérieure) : la seconde ne disparaît jamais
          parce que la première est niée.
      - id: C
        text: "Rien n'a réellement été perdu : le seul fait de posséder un corps humain garantissait, à lui seul et en toute circonstance, la pleine reconnaissance sociale du statut de personne, y compris durant l'esclavage."
        correct: false
        misconception: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
        feedback: >
          C'est l'inverse exact de ce que montre l'exemple : le statut de
          personne n'est pas une évidence biologique automatique -- il peut
          être socialement refusé.
      - id: D
        text: "Elles ont perdu leur statut de personne physique, mais ont conservé, à travers cette période, leur statut de personne morale au sens juridique du terme."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          Mélange de catégories : la personne morale (une fiction comme une
          entreprise ou un État) n'a rien à voir avec le statut, refusé
          ici, d'un individu humain concret comme sujet de droit.
    correct_feedback: >
      La reconnaissance sociale d'un statut peut être refusée par le droit ;
      la dignité kantienne, elle, tient à la seule nature raisonnable de
      l'être et ne dépend d'aucune reconnaissance extérieure.
    solution: |
      **Perdu :** la reconnaissance sociale et juridique du statut de
      personne.
      **Non perdu :** la dignité kantienne, intrinsèque à la nature
      raisonnable.
      **L'erreur à éviter :** confondre reconnaissance sociale (révocable)
      et nature raisonnable (intrinsèque).

  - id: PERS-22
    rung: "R7"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [dissertation, problematique, methode]
    stem: >
      Un élève propose comme « problématique » pour le sujet « L'identité
      personnelle est-elle une donnée, ou une construction ? » la phrase
      suivante : « Nous nous demanderons si l'identité personnelle est une
      donnée ou une construction. » Que faut-il objecter à cette
      proposition ?
    type: mcq
    choices:
      - id: A
        text: "Ce n'est pas une problématique mais une simple reformulation du sujet : une vraie problématique doit faire apparaître la TENSION entre deux positions également légitimes en apparence, à laquelle le devoir devra répondre."
        correct: true
      - id: B
        text: "Cette proposition est déjà une excellente problématique, puisqu'elle reprend fidèlement les deux termes du sujet, donnée et construction, sans en omettre aucun."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          Reprendre les termes du sujet ne suffit pas : une problématique
          doit faire naître une TENSION entre deux positions, pas
          seulement redire la question posée.
      - id: C
        text: "Le problème est seulement stylistique : il suffirait de la reformuler en une phrase plus longue et plus soutenue pour qu'elle devienne une problématique correcte, sans qu'il soit besoin de rien changer à son contenu ni d'y introduire la moindre tension véritable."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          Ce n'est pas une question de longueur ou de style, mais de
          structure : sans tension entre deux positions légitimes, aucune
          reformulation n'en fait une problématique.
      - id: D
        text: "Une problématique ne devrait, en réalité, jamais être formulée sous forme de question, mais uniquement comme une affirmation déclarative annonçant directement la thèse du devoir."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          C'est faux : le modèle donné dans la leçon est lui-même une
          question -- annoncer d'emblée « la thèse » viderait le devoir de
          toute tension à explorer.
    correct_feedback: >
      Une problématique fait apparaître une tension entre deux positions
      légitimes en apparence -- une simple reformulation du sujet n'en est
      pas une.
    solution: |
      **Ce que reformuler le sujet ne fait pas :** créer de tension.
      **Ce qu'exige une problématique :** deux positions légitimes, mises
      en tension.
      **L'erreur à éviter :** croire qu'un problème de fond se règle par un
      problème de style.

  - id: PERS-23
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_la_personne
    tags: [dissertation, plan_dialectique, locke]
    stem: >
      Un élève construit ainsi son plan pour le sujet « L'identité
      personnelle est-elle une donnée, ou une construction ? » : **I.
      Thèse** -- il mobilise Locke et la continuité de conscience ; **II.
      Antithèse** -- il mobilise l'intuition spontanée du même corps qui
      persiste. Que faut-il objecter à ce plan ?
    type: mcq
    choices:
      - id: A
        text: "L'élève a inversé thèse et antithèse : l'intuition du corps qui persiste (une donnée déjà là) est la THÈSE de départ ; Locke, en montrant que l'identité repose sur une construction active de la conscience, appartient à l'ANTITHÈSE qui vient la mettre en tension."
        correct: true
      - id: B
        text: "Aucune objection : thèse et antithèse sont, par construction, interchangeables -- l'ordre dans lequel on les présente n'a aucune incidence sur la validité du plan."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          Un plan dialectique suit un mouvement précis, de l'intuition
          spontanée vers sa remise en cause : intervertir thèse et
          antithèse casse ce mouvement.
      - id: C
        text: "Le vrai problème est que Locke n'a rien à faire dans un plan sur ce sujet : sa théorie concerne exclusivement ce qui fait qu'un être MÉRITE le statut de personne, pas l'identité personnelle."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est l'inverse : c'est Kant (chapitre 3) qui répond à ce qui fait qu'un
          être mérite le statut de personne -- Locke (chapitre 4) répond
          précisément à l'identité personnelle, au cœur de ce sujet.
      - id: D
        text: "Le vrai problème est que ce plan aurait dû comporter uniquement deux parties, thèse et antithèse, sans jamais aucune troisième partie de dépassement, laquelle n'est en réalité absolument jamais exigée dans une bonne dissertation de philosophie très sérieuse et rigoureuse."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          La leçon construit un plan en trois temps -- thèse, antithèse,
          dépassement : une dissertation dialectique sans dépassement
          reste inachevée.
    correct_feedback: >
      Le mouvement dialectique va de l'intuition spontanée (le corps qui
      dure, en thèse) vers sa remise en cause construite (Locke, puis Hume,
      en antithèse) -- jamais l'inverse.
    solution: |
      **Thèse :** l'intuition spontanée du corps qui dure.
      **Antithèse :** Locke, puis Hume -- la remise en cause.
      **L'erreur à éviter :** inverser ce mouvement, ou attribuer à Locke
      le critère kantien du mérite.

  - id: PERS-24
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_la_personne
    tags: [dissertation, depassement, kant]
    stem: >
      Pour la partie III (dépassement) de ce plan, un élève écrit :
      « Finalement, peu importe que l'identité soit donnée ou construite,
      puisque Kant montre que la dignité d'une personne dépend uniquement
      de la continuité exacte de sa mémoire d'un jour à l'autre. » Que
      faut-il objecter à cet usage de Kant ?
    type: mcq
    choices:
      - id: A
        text: "C'est un contresens sur Kant : la dignité, chez lui, ne dépend d'AUCUNE continuité de mémoire -- elle tient à la seule nature raisonnable de l'être ; c'est Locke (chapitre 4), non Kant, qui fait dépendre l'identité de la mémoire."
        correct: true
      - id: B
        text: "Il n'y a rien à objecter : c'est précisément ainsi que la leçon présente le rapport entre Kant et la mémoire, comme une seule et même exigence."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          La leçon met justement en garde contre cette confusion : Kant
          (dignité, être raisonnable) et Locke (mémoire, conscience)
          répondent à deux questions distinctes.
      - id: C
        text: "L'objection à faire est plutôt que Kant n'a aucune place dans un dépassement sur ce sujet, la notion de dignité étant réservée exclusivement aux débats sur la peine de mort."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          Rien, dans la leçon, ne réserve la dignité kantienne à un seul
          débat : Le chapitre 7 l'emploie pour penser la dépersonnalisation, bien
          au-delà de ce cas particulier.
      - id: D
        text: "L'objection à faire est que ce dépassement aurait dû mobiliser exclusivement Hume, puisque lui seul, parmi les auteurs vus, aborde la question du dépassement thèse/antithèse dans une dissertation -- une exigence qu'aucune étape de la méthode présentée au chapitre 8 ne formule pourtant nulle part."
        correct: false
        misconception: mc.philo.la_personne.methode-dissertation-mal-appliquee
        feedback: >
          Hume appartient à l'antithèse (chapitre 5), pas au dépassement : l'étape
          3 de la leçon mobilise plutôt R5 (l'imputabilité) ou les chapitres 3 et 7
          (Kant, dépersonnalisation).
    correct_feedback: >
      La dignité kantienne tient à la seule nature raisonnable de l'être,
      indépendamment de toute mémoire -- ne jamais la faire dépendre de la
      continuité psychologique, critère de Locke.
    solution: |
      **L'erreur :** faire dépendre la dignité kantienne de la mémoire.
      **Le bon partage :** Kant = nature raisonnable ; Locke = continuité
      de conscience.
      **Le dépassement attendu :** chapitres 6, 3 ou 7 -- jamais Hume, qui
      appartient à l'antithèse.

