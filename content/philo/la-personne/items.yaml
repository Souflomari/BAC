notion: la-personne
skill_code: philo_la_personne

# Misconception inventory — summit-conversion campaign. This file previously
# carried `misconceptions: []` and no `misconception:` tag on any distractor
# (the same Gap-4-shaped state la-liberte's and autrui's items.yaml were
# found in before their own retrofits). Built from scratch, per the recipe's
# philo addendum, by mining the lesson's own "Erreur à éviter" boxes FIRST
# (R1 individu/personne, R2 Kant, R3 Locke, R4 Hume — "la confusion la plus
# fréquente sur ce point du programme", R5 personne physique/morale +
# imputabilité, R6 dépersonnalisation — six boxes, most naming TWO distinct
# confusions each), then adding cross-cutting models the lesson's prose makes
# central but no box names explicitly (R0's opening triple question, the
# recurring cross-author mis-attribution pattern this four-author notion
# invites — Kant/Locke/Hume criteria answer three DIFFERENT questions and get
# swapped constantly —, and R7's method errors). A handful of narrowly-scoped
# candidate ids (e.g. a standalone "interdiction totale du moyen" tag, a
# standalone "âme substantielle" tag) were deliberately MERGED into broader
# siblings during authoring, once it was clear each would otherwise land at
# n=1 in a 24-item legacy bank — same judgment call as choosing inventory
# granularity anywhere else, made explicit here rather than silently produced
# by an unexamined 1:1 "one distractor, one brand-new id" default.
# Id convention: mc.philo.<slug>.<name>, where <slug> is skill_code with the
# "philo_" prefix stripped (philo_la_personne → la_personne) — matches
# la-liberte (mc.philo.liberte.*) and autrui (mc.philo.autrui.*). Every one
# of the 72 distractors across the 24 legacy items (PERS-1..PERS-24) now
# carries a real misconception id (no null tags) — stricter than house
# default, matching the task's instruction.
misconceptions:
  - id: mc.philo.la_personne.individu-personne-synonymes
    label: "« Individu » et « personne » sont de purs synonymes"
    description: >-
      L'élève traite « individu » et « personne » comme interchangeables,
      sans voir que « personne » désigne un statut plus exigeant, qui
      suppose un critère supplémentaire (Kant, chapitre 3) — ou, inversement,
      surcharge la seule notion d'individu de tout ce que le chapitre 3 réserve à la
      personne.
    contradicts_principle: >-
      « Individu » désigne une simple unité numérique, sans rien impliquer
      quant à la raison ou aux droits ; « personne » désigne un statut,
      reconnu à un être capable de se représenter lui-même dans le temps,
      jugé digne de droits et tenu pour responsable — un critère
      supplémentaire, précisé en R2, jamais automatique.

  - id: mc.philo.la_personne.personne-reduite-a-espece
    label: "« Personne » désigne la seule appartenance biologique à l'espèce humaine"
    description: >-
      L'élève réduit le statut de personne au seul fait biologique
      d'appartenir à l'espèce humaine, sans voir que le chapitre 3 fonde ce statut sur
      un critère précis (la nature raisonnable, l'autonomie), distinct de la
      seule appartenance à une espèce.
    contradicts_principle: >-
      Ce qui fait qu'un être mérite le statut de personne, pour Kant, tient
      à sa nature raisonnable et à sa capacité d'autonomie — pas à sa seule
      appartenance biologique à l'espèce humaine, qui relève du simple
      registre de l'individu (R1).

  - id: mc.philo.la_personne.individu-identite-personnelle-confondus
    label: "La continuité de l'individu suffit à trancher l'identité personnelle"
    description: >-
      L'élève croit que la seule continuité spatio-temporelle d'un même
      corps (le niveau de l'individu) suffit, à elle seule, à garantir ou à
      trancher la question, distincte et plus difficile, de l'identité
      personnelle — ou, à l'inverse, nie qu'il existe la moindre continuité
      même au simple niveau de l'individu.
    contradicts_principle: >-
      Il existe une continuité simple, spatio-temporelle, au niveau de
      l'individu — mais ce seul fait ne tranche rien quant à savoir si l'on
      reste, au sens plein, la MÊME personne : c'est une question distincte,
      que R3 et R4 vont attaquer.

  - id: mc.philo.la_personne.identite-numerique-confondue-personnelle
    label: "Le même nom ou numéro administratif règle déjà la question de l'identité personnelle"
    description: >-
      L'élève confond l'identité numérique ou administrative (même nom, même
      numéro de carte d'identité) avec l'identité personnelle au sens
      philosophique — comme si porter le même nom depuis l'enfance suffisait
      à garantir qu'on reste, au sens plein, le même sujet.
    contradicts_principle: >-
      Le même nom ou numéro administratif ne fait que suivre un individu
      dans le temps ; l'identité personnelle, elle, demande si l'on reste,
      au sens plein, le même sujet — une question que ce seul fait ne règle
      jamais.

  - id: mc.philo.la_personne.criteres-des-auteurs-confondus
    label: "Les critères de Kant, Locke et Hume répondent tous, au fond, à la même question"
    description: >-
      L'élève fond en une seule question ce que Kant (ce qui fait qu'un être
      MÉRITE le respect dû à une personne, ici et maintenant), Locke (ce qui
      fait que CE MÊME être reste, dans le temps, une seule et même
      personne) et Hume (si cette continuité même existe réellement)
      répondent à des questions distinctes — en attribuant le critère de
      l'un à la question de l'autre.
    contradicts_principle: >-
      Kant répond à « qu'est-ce qui fait qu'un être MÉRITE le respect dû à
      une personne ? » ; Locke répond à « qu'est-ce qui fait que CE MÊME
      être, à deux moments différents, compte comme une seule et même
      personne ? » ; Hume conteste l'existence même de l'unité que Locke
      présupposait. Ne pas fondre ces trois questions en une seule.

  - id: mc.philo.la_personne.kant-prix-dignite-mal-compris
    label: "La formule kantienne (prix/dignité, fin/moyen) est mal comprise ou mal appliquée"
    description: >-
      L'élève dénature le critère kantien — en traitant la dignité comme un
      prix élevé plutôt qu'une valeur sans équivalent, en la faisant
      dépendre de l'utilité sociale ou de l'ancienneté, ou en croyant que
      Kant interdit TOUT usage d'un être raisonnable comme moyen plutôt que
      sa seule réduction ENTIÈRE à un instrument.
    contradicts_principle: >-
      Ce qui a un prix est remplaçable par un équivalent ; la dignité est
      une valeur absolue, sans équivalent. Kant n'interdit pas d'utiliser un
      être raisonnable comme moyen dans un échange (payer un artisan) : il
      interdit de le réduire ENTIÈREMENT à un instrument, sans jamais
      reconnaître en lui une fin en soi.

  - id: mc.philo.la_personne.dignite-fondee-sur-privilege
    label: "La dignité serait un privilège hérité (naissance, groupe social), pas un critère universel"
    description: >-
      L'élève fait dépendre le statut de personne, ou la dignité, de la
      naissance, de l'appartenance à tel groupe social jugé respectable, ou
      d'un privilège hérité — plutôt que de la seule nature raisonnable de
      l'être, universelle chez Kant.
    contradicts_principle: >-
      Le critère kantien est universel : il vaut pour tout être raisonnable,
      indépendamment de sa naissance ou de son appartenance sociale — en
      faire un privilège hérité est l'inverse exact du geste kantien.

  - id: mc.philo.la_personne.locke-critere-mal-identifie
    label: "Locke ferait reposer l'identité personnelle sur le corps ou sur une âme substantielle"
    description: >-
      L'élève attribue à Locke un critère qu'il rejette explicitement — soit
      la continuité du corps (« même homme »), soit une âme substantielle
      immatérielle — au lieu de la continuité de la conscience, seul
      critère que Locke retient.
    contradicts_principle: >-
      Ce n'est ni la continuité du corps (qui change constamment de matière
      sans affecter l'identité PERSONNELLE), ni une substance spirituelle
      sous-jacente (dont l'existence reste, pour Locke, indémontrable), qui
      fonde l'identité personnelle — c'est la continuité de la conscience.

  - id: mc.philo.la_personne.locke-hume-confondus
    label: "« La confusion la plus fréquente sur ce point du programme » : Locke et Hume échangés"
    description: >-
      L'élève attribue à Locke la critique humienne du moi comme « faisceau
      de perceptions » sans unité réelle, ou attribue à Hume la conscience
      continue et capable de mémoire que Locke, lui, suppose encore — les
      deux auteurs occupent, sur ce point précis, des positions opposées.
    contradicts_principle: >-
      Locke, en R3, suppose encore une conscience continue, capable de
      s'approprier ses états passés par la mémoire. C'est Hume qui va plus
      loin et remet en question l'existence même de cette unité-là.
      Confondre les deux, c'est manquer précisément ce qui fait la
      radicalité de Hume par rapport à Locke.

  - id: mc.philo.la_personne.hume-these-mal-comprise
    label: "Hume nierait toute succession de perceptions, ou affirmerait une âme substantielle"
    description: >-
      L'élève dénature ce que Hume affirme réellement — en lui prêtant soit
      la négation de toute expérience mentale (« rien n'existe »), soit,
      à l'inverse, la confirmation par introspection d'une substance
      unificatrice — alors que Hume affirme la succession réelle des
      perceptions et nie seulement l'existence d'un « moi » distinct qui les
      porterait.
    contradicts_principle: >-
      Hume ne nie pas que des perceptions se succèdent réellement dans un
      esprit. Il nie seulement qu'on puisse observer, derrière cette
      succession, une substance permanente, un « moi » distinct de ses
      perceptions, qui les porterait toutes.

  - id: mc.philo.la_personne.locke-mecanisme-details-mal-compris
    label: "Le mécanisme précis de Locke (même homme/même personne, chaîne de souvenirs) est mal saisi"
    description: >-
      L'élève confond ou inverse la distinction lockéenne entre « même
      homme » (continuité organique) et « même personne » (terme forensique,
      continuité de conscience), ou croit que Locke exige une mémoire totale
      et parfaite plutôt qu'une chaîne ininterrompue de souvenirs qui se
      chevauchent partiellement.
    contradicts_principle: >-
      « Même homme » ne suppose qu'une continuité organique ; « même
      personne » — terme forensique — suppose la continuité de la
      conscience. Et il suffit d'une chaîne ininterrompue de souvenirs qui
      se chevauchent : Locke n'exige à aucun moment une mémoire totale et
      parfaite de chaque épisode passé.

  - id: mc.philo.la_personne.personne-physique-morale-confondues
    label: "« Personne physique » et « personne morale » sont mal distinguées"
    description: >-
      L'élève mécomprend la distinction juridique entre personne physique
      (un individu humain concret) et personne morale (une fiction
      juridique comme une entreprise ou un État) — en réservant l'un des
      deux statuts à l'un des deux seulement, en confondant « morale » avec
      la vertu individuelle, ou en niant que la personne morale ait aussi
      des obligations.
    contradicts_principle: >-
      La personne physique désigne un individu humain concret ; la personne
      morale, une fiction juridique à qui l'on reconnaît aussi des droits ET
      des obligations, bien qu'elle ne possède ni conscience ni mémoire —
      les deux catégories peuvent, l'une comme l'autre, être sujets de
      droit.

  - id: mc.philo.la_personne.imputabilite-mal-fondee
    label: "L'imputabilité serait une pure causalité, un statut administratif, ou une capacité de mouvement"
    description: >-
      L'élève réduit l'imputabilité à un pur enchaînement causal
      (indépendant de la compréhension et du choix), la fait dépendre d'un
      statut purement administratif ou d'un lien de propriété plutôt que du
      discernement du sujet lui-même, ou confond l'autonomie rationnelle
      kantienne avec la simple capacité biologique de se mouvoir seul.
    contradicts_principle: >-
      L'imputabilité suppose qu'on puisse attribuer un acte à un sujet
      capable d'en comprendre la portée et d'avoir pu agir autrement — ni un
      pur enchaînement causal, ni un statut administratif ou un lien de
      propriété, ni une simple autonomie de mouvement, ne suffisent à eux
      seuls à fonder cette responsabilité.

  - id: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
    label: "La dépersonnalisation serait un simple sentiment, un trouble individuel, ou un acte anodin"
    description: >-
      L'élève réduit la dépersonnalisation, au sens construit par la leçon,
      à un sentiment ordinaire de solitude ou d'anonymat, à un trouble
      psychiatrique purement individuel, à un simple changement
      administratif de nom, ou à un manque de respect ponctuel — plutôt
      qu'à l'opération précise que le chapitre 7 construit : retirer à quelqu'un le
      statut moral et juridique de fin en soi et de sujet responsable.
    contradicts_principle: >-
      Dépersonnaliser, c'est cesser de traiter un individu comme une fin en
      soi et un sujet de droit, pour le réduire à un pur moyen ou objet
      interchangeable — un acte le plus souvent commis par d'autres, pas un
      sentiment ordinaire, un trouble individuel, ou un simple manque
      ponctuel de politesse.

  - id: mc.philo.la_personne.dignite-confondue-avec-reconnaissance-sociale
    label: "La dignité kantienne dépendrait de la reconnaissance sociale, ou disparaîtrait avec elle"
    description: >-
      L'élève confond la reconnaissance sociale et juridique d'un statut
      (que le droit peut refuser, comme dans l'esclavage) avec la dignité
      kantienne elle-même, intrinsèque à la nature raisonnable de l'être —
      en croyant que retirer la première fait disparaître la seconde.
    contradicts_principle: >-
      La reconnaissance sociale d'un statut peut être refusée par le droit
      (l'esclavage en est l'exemple radical) ; la dignité kantienne, elle,
      tient à la seule nature raisonnable de l'être et ne dépend d'aucune
      reconnaissance extérieure — aucune décision humaine ne peut la
      retirer, même quand elle refuse de la reconnaître.

  - id: mc.philo.la_personne.r0-tension-non-tenue
    label: "La double tension du chapitre 1 est prématurément résolue, ou réduite à une seule question"
    description: >-
      L'élève tranche trop vite en faveur de l'une des deux réponses
      spontanées du chapitre 1 (le même corps suffit / l'enfant est un pur
      étranger), nie que la scène pose un problème philosophique réel, ou
      réduit les trois questions que le chapitre 1 fait émerger à une seule — avant
      qu'aucun auteur n'ait encore été mobilisé.
    contradicts_principle: >-
      Chacune des deux réponses spontanées se heurte à une difficulté
      symétrique : ni la seule continuité du corps, ni la seule étrangeté
      ressentie, ne suffit à trancher. R0 pose trois questions distinctes,
      sans nommer encore aucun auteur ni trancher en faveur d'aucune
      doctrine — Kant, Locke et Hume n'interviennent que plus loin.

  - id: mc.philo.la_personne.methode-dissertation-mal-appliquee
    label: "Les gestes de la méthode (problématiser, construire un plan, situer un auteur) sont mal appliqués"
    description: >-
      L'élève traite une simple reformulation du sujet comme une véritable
      problématique, inverse ou aplatit le mouvement thèse/antithèse/
      dépassement, restreint indûment la portée d'un auteur ou d'un concept
      à un seul débat, ou croit qu'une seule partie du plan doit
      mobiliser un auteur donné à l'exclusion de tous les autres.
    contradicts_principle: >-
      Une problématique met en évidence une tension entre deux positions
      également légitimes en apparence — elle ne se réduit ni à une
      reformulation du sujet, ni à un problème de style. Le plan
      dialectique va de l'intuition spontanée (thèse) vers sa remise en
      cause construite (antithèse) puis son dépassement — jamais l'inverse.

  - id: mc.philo.la_personne.affirmation-de-soi-non-pertinente
    label: "Le refus actif d'être traité comme une chose n'aurait aucune pertinence philosophique pour le statut de personne"
    description: >-
      L'élève traite l'acte, par le sujet lui-même, de refuser d'être réduit
      à une chose comme un fait purement psychologique ou rhétorique, sans
      voir qu'il fait écho, sous un angle actif et non plus seulement
      statique, à deux points déjà construits par la leçon — le critère
      kantien du moyen/de la fin en soi (chapitre 3) et le mécanisme de la
      dépersonnalisation comme reconnaissance qui peut être retirée, mais
      aussi revendiquée (chapitre 7).
    contradicts_principle: >-
      Refuser d'être traité comme une chose, c'est refuser d'être réduit à
      un pur moyen (l'envers du critère kantien, R2) ; et les luttes
      historiques pour faire reconnaître comme personnes à part entière des
      individus qu'on ne traitait que comme de simples individus (R6)
      montrent que cette reconnaissance peut aussi être activement
      revendiquée, pas seulement passivement constatée ou retirée.

items:
  - id: PERS-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_la_personne
    tags: [individu, personne, identite_personnelle]
    stem: >
      Quelle affirmation distingue correctement « individu » et « personne »,
      tels qu'ils sont définis dans cette leçon ?
    type: mcq
    choices:
      - id: A
        text: "Les deux mots sont de purs synonymes, interchangeables dans n'importe quel contexte : tout individu est immédiatement une personne, et toute distinction que l'on voudrait tracer entre eux relève d'une subtilité verbale sans portée philosophique réelle."
        correct: false
        misconception: mc.philo.la_personne.individu-personne-synonymes
        feedback: >
          Ce n'est pas ce que la leçon établit : « personne » désigne un
          statut supplémentaire, qui suppose un critère précis (cf. le chapitre 3), pas
          un synonyme automatique d'« individu ». Confondre les deux revient
          à effacer la question même que la leçon pose.
      - id: B
        text: "« Individu » désigne une simple unité numérique -- cet être-ci et non un autre --, sans rien impliquer quant à la raison ou aux droits ; « personne » désigne un statut plus exigeant, celui d'un sujet reconnu digne de droits et de responsabilité."
        correct: true
      - id: C
        text: "« Personne » désigne uniquement le fait, purement biologique, d'appartenir à l'espèce humaine, indépendamment de toute autre considération."
        correct: false
        misconception: mc.philo.la_personne.personne-reduite-a-espece
        feedback: >
          Réduire « personne » à la seule appartenance biologique manque le
          critère que la leçon va construire (chapitre 3) : ce qui fait qu'un être
          mérite le statut de personne, pour Kant, tient à sa nature
          raisonnable, pas à sa seule appartenance à une espèce.
      - id: D
        text: "« Individu » et « identité personnelle » désignent la même chose : être un individu, c'est déjà posséder une identité personnelle stable dans le temps -- au point qu'aucune des deux questions ne resterait jamais distincte l'une de l'autre, quel que soit le contexte philosophique envisagé."
        correct: false
        misconception: mc.philo.la_personne.individu-identite-personnelle-confondus
        feedback: >
          Ce sont deux questions distinctes : l'individu est une simple unité
          comptable ; l'identité personnelle est le problème, bien plus
          difficile, de savoir ce qui fait qu'un individu-personne reste LE
          MÊME à travers le temps -- le problème que les chapitres 4 et 5 vont attaquer.
    correct_feedback: >
      « Individu » est une simple unité numérique, sans exigence particulière ;
      « personne » est un statut, qui suppose un critère supplémentaire
      (la raison, chez Kant) et engage droits et responsabilité.
    solution: |
      **Individu :** une unité numérique -- cet être-ci, et non un autre --
      sans rien impliquer quant à la raison ou aux droits.

      **Personne :** un statut, reconnu à un être capable de se représenter
      lui-même dans le temps, jugé digne de droits et tenu pour responsable.

      **Identité personnelle :** ce qui fait qu'un individu-personne, à deux
      moments distincts, compte comme un seul et même sujet -- une troisième
      question, distincte des deux premières.

  - id: PERS-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [kant, dignite, prix, fin_en_soi]
    stem: >
      Selon Kant, qu'est-ce qui fait qu'un être doit être traité comme une
      personne -- une fin en soi -- plutôt que comme une simple chose ?
    type: mcq
    choices:
      - id: A
        text: "Posséder, comme toute chose de grande valeur sur un marché, un prix particulièrement élevé, bien supérieur à celui des objets ordinaires, qui suffirait à le distinguer de ces derniers et à fonder son statut de personne."
        correct: false
        misconception: mc.philo.la_personne.kant-prix-dignite-mal-compris
        feedback: >
          C'est confondre dignité et prix -- Kant oppose justement les deux :
          ce qui a un prix reste, par définition, remplaçable par un
          équivalent ; la dignité désigne au contraire une valeur qui
          n'admet aucun équivalent, quel que soit son montant.
      - id: B
        text: "Être capable de se souvenir de ses états passés et d'étendre sa conscience jusqu'à eux -- un critère qui, s'il valait pour Kant, rendrait la dignité d'un nourrisson ou d'un grand amnésique strictement nulle, ce que le chapitre 3 ne dit nulle part."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est le critère de Locke (continuité de conscience et de mémoire,
          chapitre 4), pas celui de Kant. Kant répond à une question différente : ce
          qui fait qu'un être MÉRITE le respect dû à une personne, pas ce
          qui fait que ce même être reste, dans le temps, un seul et même
          sujet.
      - id: C
        text: "Appartenir, par sa seule naissance, à telle famille ou tel groupe social reconnu comme respectable -- une dignité qui varierait alors d'une famille à l'autre, et qu'aucun individu né hors de ce cercle ne pourrait jamais espérer acquérir, quels que soient par ailleurs sa raison et son autonomie propres."
        correct: false
        misconception: mc.philo.la_personne.dignite-fondee-sur-privilege
        feedback: >
          Cela ferait du statut de personne un privilège hérité plutôt qu'un
          statut fondé sur la nature raisonnable de l'être -- exactement
          l'inverse du critère kantien, universel, qui vaut pour tout être
          raisonnable indépendamment de sa naissance.
      - id: D
        text: "Être un être raisonnable, capable de se donner à lui-même sa propre loi (autonomie) -- ce qui lui confère une dignité, valeur absolue sans équivalent, à la différence des choses, qui n'ont qu'un prix."
        correct: true
    correct_feedback: >
      Kant fonde le statut de personne sur la seule nature raisonnable de
      l'être -- sa capacité d'autonomie -- qui lui confère une dignité sans
      équivalent, à la différence des choses qui n'ont qu'un prix.
    solution: |
      **Prix vs dignité :** ce qui a un prix est remplaçable par un
      équivalent ; ce qui a une dignité ne l'est pas.

      **Le mécanisme :** seul un être raisonnable, capable de se donner à
      lui-même sa propre loi (autonomie), peut fixer ses propres fins plutôt
      que de servir uniquement celles d'un autre -- il est donc toujours
      aussi une fin en soi, jamais un pur moyen.

      **La formule :** traiter l'humanité, dans sa propre personne comme
      dans celle d'autrui, toujours en même temps comme une fin, et jamais
      simplement comme un moyen.

  - id: PERS-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [locke, continuite_conscience, identite_personnelle]
    stem: >
      Un élève objecte à Locke : « Mon corps n'est plus du tout le même
      qu'il y a dix ans -- donc, selon lui, je ne suis plus la même
      personne. » Qu'est-ce que cette objection manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le point central de Locke : ce n'est pas la continuité du corps qui fonde l'identité personnelle, mais la continuité de la conscience -- la mémoire qui relie mes états passés à mon présent."
        correct: true
      - id: B
        text: "Elle manque le fait que Locke fonde en réalité l'identité personnelle sur le même critère que Kant : être un être raisonnable, une fin en soi."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est confondre deux questions différentes : Kant (chapitre 3) répond à
          ce qui fait qu'un être MÉRITE le respect dû à une personne ; Locke
          répond à ce qui fait que CE MÊME être reste, dans le temps, une
          seule et même personne. Ne fonds pas ces deux critères en un seul.
      - id: C
        text: "Elle manque le fait que, pour Locke, c'est une âme substantielle et immatérielle, rigoureusement identique à elle-même à travers tout le cours du temps, qui garantit seule l'identité personnelle du sujet."
        correct: false
        misconception: mc.philo.la_personne.locke-critere-mal-identifie
        feedback: >
          C'est l'inverse : Locke évite précisément de fonder l'identité
          personnelle sur une substance (âme ou corps) dont on ne peut
          jamais être sûr qu'elle demeure identique -- son critère est la
          continuité de conscience, pas une substance sous-jacente.
      - id: D
        text: "Elle manque le fait que Locke réduit lui-même le moi à un pur « faisceau de perceptions » sans aucune continuité réelle -- une lecture qui effacerait purement et simplement la distinction entre les deux auteurs que le chapitre 5 prend justement soin de nommer comme la confusion la plus fréquente du programme."
        correct: false
        misconception: mc.philo.la_personne.locke-hume-confondus
        feedback: >
          C'est la thèse de Hume (chapitre 5), pas celle de Locke. Locke suppose
          encore une conscience capable de se ressaisir elle-même par la
          mémoire ; c'est Hume qui remet en question jusqu'à cette
          continuité-là.
    correct_feedback: >
      Pour Locke, l'identité personnelle suit la continuité de la
      conscience -- une chaîne de souvenirs qui se chevauchent -- et non
      celle du corps, qui peut changer entièrement sans l'affecter.
    solution: |
      **Même homme vs même personne :** la continuité du corps garantit
      seulement l'identité biologique ; l'identité personnelle, au sens
      forensique de Locke, suit la conscience.

      **Le mécanisme :** se ressaisir, par la mémoire, comme ayant vécu telle
      expérience passée -- l'expérience de pensée du prince et du savetier
      montre que l'identité personnelle suit la conscience, pas le corps.

      **Le raffinement :** une chaîne de souvenirs qui se chevauchent suffit
      -- pas besoin de se rappeler chaque détail directement.

  - id: PERS-4
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [hume, faisceau_de_perceptions, critique_du_moi]
    stem: >
      Quelle affirmation résume correctement la thèse de Hume sur le moi ?
    type: mcq
    choices:
      - id: A
        text: "C'est Locke, et non Hume, qui a le premier réduit le moi à un simple « faisceau de perceptions » sans unité réelle -- une attribution qui viderait alors de tout sens la mise en garde du chapitre 5 sur « la confusion la plus fréquente sur ce point du programme »."
        correct: false
        misconception: mc.philo.la_personne.locke-hume-confondus
        feedback: >
          C'est une mauvaise attribution : Locke suppose une conscience
          continue, capable de mémoire, qui s'approprie ses états passés ;
          c'est Hume qui va plus loin et conteste jusqu'à l'existence d'une
          telle unité derrière les perceptions.
      - id: B
        text: "Hume confirme, par l'introspection, l'existence d'une âme substantielle qui unifie toutes les perceptions successives -- une conclusion diamétralement opposée à celle que Hume tire réellement de sa propre méthode empiriste, fondée sur ce que l'introspection livre effectivement."
        correct: false
        misconception: mc.philo.la_personne.hume-these-mal-comprise
        feedback: >
          C'est l'inverse exact de la conclusion de Hume : il ne trouve
          jamais, par introspection, ce genre de substance unificatrice,
          seulement des perceptions distinctes qui se succèdent sans fil
          substantiel commun.
      - id: C
        text: "Par l'introspection, on ne trouve jamais un « moi » stable, seulement une succession de perceptions -- le moi n'est qu'un « faisceau de perceptions », une unité fabriquée après coup par l'imagination."
        correct: true
      - id: D
        text: "Hume soutient que le moi se définit avant tout par sa capacité à se donner à lui-même une loi morale universelle, tout à fait indépendamment des perceptions particulières que l'introspection pourrait lui livrer au fil du temps."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est le critère kantien de l'être raisonnable et autonome (chapitre 3),
          sans rapport avec la démarche empiriste de Hume, qui n'examine que
          ce que l'introspection livre réellement -- jamais une capacité
          rationnelle supposée indépendante de toute perception.
    correct_feedback: >
      Hume ne trouve, par introspection, qu'une succession de perceptions
      distinctes -- jamais un moi stable qui les unifierait. Le moi est un
      « faisceau de perceptions », une fiction de l'imagination, pas une
      substance observable.
    solution: |
      **La méthode :** ne faire confiance qu'à ce que l'introspection livre
      réellement -- jamais un « moi » nu, toujours telle perception
      particulière.

      **La conclusion :** l'esprit est un « faisceau de perceptions » en flux
      perpétuel ; leur unité n'est qu'une fiction que l'imagination
      fabrique après coup, comme pour une mélodie ou une rivière.

      **L'erreur à éviter :** attribuer cette critique à Locke, qui suppose
      encore une conscience continue capable de mémoire (chapitre 4) -- c'est Hume
      qui remet en question jusqu'à cette continuité-là.

  - id: PERS-5
    rung: "R5"
    difficulty_level: 3
    skill_code: philo_la_personne
    tags: [imputabilite, sujet_de_droit, responsabilite]
    stem: >
      Pourquoi ne peut-on juger moralement ou juridiquement responsable
      qu'un être reconnu comme une « personne » ?
    type: mcq
    choices:
      - id: A
        text: "Parce que seule une « personne morale » au sens juridique -- une entreprise, une association, une collectivité territoriale -- peut être poursuivie et condamnée devant un tribunal, jamais un simple individu, une personne physique en chair et en os."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          C'est l'inverse de la distinction juridique : personne physique et
          personne morale peuvent toutes deux être sujets de droit ; la
          responsabilité pénale, en particulier, concerne d'abord les
          personnes physiques capables de discernement.
      - id: B
        text: "Parce que la responsabilité suppose l'imputabilité : pouvoir attribuer un acte à un sujet capable d'en comprendre la portée et d'avoir pu agir autrement -- juger un être dépourvu de ce statut (un objet, un jeune enfant) n'aurait aucun sens."
        correct: true
      - id: C
        text: "Parce que le droit tient pour responsable quiconque a matériellement causé un dommage, indépendamment de sa capacité à comprendre ou à choisir autrement."
        correct: false
        misconception: mc.philo.la_personne.imputabilite-mal-fondee
        feedback: >
          C'est réduire la responsabilité à un pur enchaînement causal, en
          manquant exactement ce que l'imputabilité ajoute : la capacité de
          discernement et de choix, sans laquelle attribuer une faute n'a pas
          de sens -- c'est pourquoi le droit distingue un adulte responsable
          d'un enfant en bas âge ou d'un individu jugé irresponsable
          pénalement.
      - id: D
        text: "Parce que la nationalité d'un individu détermine, à elle seule, s'il peut être tenu pour responsable de ses actes -- comme si un citoyen et un étranger, à discernement et capacité de choix parfaitement égaux, ne pouvaient jamais être jugés selon les mêmes critères d'imputabilité."
        correct: false
        misconception: mc.philo.la_personne.imputabilite-mal-fondee
        feedback: >
          La nationalité, statut purement administratif, est sans rapport
          avec le critère philosophique de l'imputabilité, qui concerne la
          capacité rationnelle de comprendre et de choisir, pas un statut
          civil.
    correct_feedback: >
      L'imputabilité suppose qu'on puisse attribuer un acte à un sujet
      capable d'en comprendre la portée et d'avoir pu agir autrement -- c'est
      ce qui distingue juger un être humain responsable et juger un objet ou
      un très jeune enfant.
    solution: |
      **L'imputabilité :** pouvoir attribuer un acte à un sujet capable d'en
      comprendre la portée, d'avoir pu agir autrement, et d'en assumer les
      conséquences.

      **Comment les chapitres 3 et 4 s'articulent ici :** le critère kantien explique
      pourquoi seuls des êtres raisonnables peuvent être responsables ; le
      critère lockéen explique ce qui fait que celui qu'on juge aujourd'hui
      est bien le même sujet que celui qui a agi hier.

      **La tension avec Hume :** même sans substance métaphysique unique, la
      morale et le droit ont besoin, en pratique, de cette continuité pour
      fonctionner.

  - id: PERS-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_la_personne
    tags: [depersonnalisation, dignite, sujet_de_droit]
    stem: >
      Que signifie précisément « dépersonnaliser » quelqu'un, au sens
      construit dans cette leçon ?
    type: mcq
    choices:
      - id: A
        text: "Se sentir seul ou anonyme dans une grande ville, parmi des inconnus qui ne nous remarquent pas."
        correct: false
        misconception: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
        feedback: >
          C'est trop faible et trop psychologique : la dépersonnalisation,
          ici, désigne une opération précise -- retirer à quelqu'un le
          statut moral et juridique de fin en soi et de sujet responsable --
          pas un simple sentiment ordinaire de solitude.
      - id: B
        text: "Changer légalement de nom, de prénom ou de numéro d'identité administrative auprès des services de l'État civil, sans que rien d'autre ne change dans le traitement concret et quotidien qui continue de vous être réservé par les autres."
        correct: false
        misconception: mc.philo.la_personne.depersonnalisation-reduite-a-sentiment
        feedback: >
          Un simple changement administratif, sans perte de dignité ni de
          reconnaissance comme sujet responsable, n'est pas ce que la leçon
          appelle dépersonnalisation.
      - id: C
        text: "Perdre, avec l'âge, une partie de ses souvenirs d'enfance, comme le montre Hume à propos du moi -- comme si la critique épistémologique de Hume sur l'absence d'un moi-substance équivalait déjà, à elle seule, à l'opération morale et sociale que le chapitre 7 appelle dépersonnalisation."
        correct: false
        misconception: mc.philo.la_personne.criteres-des-auteurs-confondus
        feedback: >
          C'est confondre la critique métaphysique de Hume sur l'absence
          d'un moi-substance (chapitre 5) avec l'acte social et moral de
          dépersonnalisation (chapitre 7) : oublier certains souvenirs d'enfance ne
          retire, par lui-même, le statut de personne à personne.
      - id: D
        text: "Cesser de traiter quelqu'un comme un sujet raisonnable, digne de respect et responsable de ses actes, pour le réduire à un pur instrument ou objet interchangeable, privé à la fois de dignité et de reconnaissance comme sujet de droit."
        correct: true
    correct_feedback: >
      Dépersonnaliser, c'est cesser de reconnaître en quelqu'un une fin en
      soi capable de répondre de ses actes, pour le réduire à un objet ou un
      instrument interchangeable -- une reconnaissance sociale qui peut être
      étendue ou retirée, pas une évidence biologique garantie pour toujours.
    solution: |
      **Le mécanisme :** cesser de traiter un individu comme une fin en soi
      (chapitre 3) et un sujet de droit et de responsabilité (chapitre 6), pour le réduire
      à un pur moyen ou objet interchangeable.

      **L'exemple radical :** l'esclavage historique, qui prive un être
      humain à la fois de dignité et de reconnaissance comme sujet de
      droit.

      **Le mouvement inverse :** personnaliser -- reconnaître quelqu'un
      comme personne à part entière -- n'est jamais un acquis définitif ;
      c'est une reconnaissance sociale qui peut être étendue ou retirée.

  - id: PERS-7
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_la_personne
    tags: [individu, personne, identite_personnelle]
    stem: >
      D'après la fin du chapitre 1, quelles trois questions la scène de la boîte à
      chaussures fait-elle émerger, avant toute réponse philosophique ?
    type: mcq
    choices:
      - id: A
        text: "Si tenir un journal intime est une pratique psychologiquement bénéfique, recommandée pour mieux se connaître soi-même."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          C'est ignorer l'enjeu philosophique de la scène : la question
          n'est pas l'utilité du journal, mais l'identité de celui qui l'a
          écrit.
      - id: B
        text: "Ce qui fait qu'un individu est une personne ; si l'identité qui relie l'enfant de dix ans à l'adulte est un fait donné ou une construction qui pourrait se défaire ; et si l'on reste, au fond, la même personne à travers le temps."
        correct: true
      - id: C
        text: "Si les souvenirs consignés dans ce cahier sont fiables ou déformés par le temps -- une question empirique de mémoire exacte, entièrement distincte de la question philosophique de savoir qui, au juste, a vécu et signé ces souvenirs il y a dix ans."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          C'est une question de fiabilité de la mémoire, distincte de
          celle -- posée par le chapitre 1 -- de savoir si tu es encore le même sujet
          que celui qui a écrit ces pages.
      - id: D
        text: "Si la promesse notée dans le cahier est juridiquement contraignante devant un tribunal."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          C'est réduire un problème philosophique d'identité à une question
          de validité légale d'un contrat -- ce n'est pas ce que le chapitre 1
          interroge.
    correct_feedback: >
      Le chapitre 1 fait émerger trois questions distinctes : ce qui fait qu'un
      individu est une personne, si l'identité personnelle est donnée ou
      construite, et si l'on reste le même à travers le temps.
    solution: |
      **La question posée :** ce qui fait qu'un individu est une personne.
      **Deuxième volet :** l'identité qui relie l'enfant à l'adulte est-elle
      un fait donné, ou une construction qui pourrait se défaire ?
      **Troisième volet :** reste-t-on, au fond, la même personne à travers
      le temps ? Ces trois questions structurent toute la leçon.

  - id: PERS-8
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_la_personne
    tags: [identite_personnelle, continuite_corporelle, identite_numerique]
    stem: >
      Le chapitre 1 présente deux réponses spontanées à la scène du journal intime.
      Quelle description de la tension entre elles est correcte ?
    type: mcq
    choices:
      - id: A
        text: "La première réponse (même corps) est manifestement correcte, et le malaise ressenti en lisant le journal n'est qu'une réaction irrationnelle sans portée philosophique."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          Le chapitre 1 ne tranche pas en faveur de la première réponse : il montre au
          contraire que chacune des deux se heurte à une difficulté réelle.
      - id: B
        text: "La réponse « même corps » a du mal à expliquer pourquoi on reconnaît un vieil ami après dix ans, alors que la réponse « pur étranger » n'a, elle, aucune difficulté à affronter -- comme si l'une des deux réponses spontanées échappait entièrement à toute objection, quand R0 montre au contraire que chacune se heurte, à sa manière, à une difficulté symétrique."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          C'est l'inverse : c'est la réponse « même corps » qui peine à
          expliquer le malaise du journal, plus fort que face à un vieil
          ami reconnu ; et c'est la réponse « étranger » qui peine à
          expliquer le malaise face à la promesse ignorée.
      - id: C
        text: "Si la continuité du corps suffisait à garantir la même personne, le malaise en lisant ce journal serait inexplicable ; mais si l'enfant était un pur étranger, le malaise à l'idée d'ignorer sa promesse le serait tout autant."
        correct: true
      - id: D
        text: "La tension est déjà résolue par le simple fait que le même prénom figure sur la couverture du cahier -- un même nom suffirait, à lui seul, à garantir juridiquement et philosophiquement la continuité complète du sujet, sans qu'aucune autre question ne reste ouverte."
        correct: false
        misconception: mc.philo.la_personne.identite-numerique-confondue-personnelle
        feedback: >
          C'est confondre identité personnelle et simple identité numérique
          ou administrative -- exactement l'erreur que le chapitre 2 met en garde de
          commettre.
    correct_feedback: >
      Chacune des deux réponses spontanées se heurte à une difficulté
      symétrique : ni la seule continuité du corps, ni la seule étrangeté
      ressentie, ne suffit à trancher.
    solution: |
      **Réponse 1 (même corps) :** peine à expliquer un malaise plus fort
      qu'en retrouvant un vieil ami reconnu comme « le même ».
      **Réponse 2 (étranger) :** peine à expliquer le malaise ressenti à
      l'idée d'ignorer la promesse. Le même nom sur la couverture ne règle
      rien -- ce n'est qu'une identité numérique.

  - id: PERS-9
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_la_personne
    tags: [individu, personne, identite_personnelle]
    stem: >
      Un élève affirme, après avoir lu R0 : « Cette scène montre déjà que
      Locke a raison : c'est la continuité de la conscience, et non celle
      du corps, qui compte. » Que peut-on objecter à cette lecture du chapitre 1 ?
    type: mcq
    choices:
      - id: A
        text: "On ne peut rien objecter : Le chapitre 1 est bien la présentation implicite de la thèse de Locke, développée ensuite en détail -- comme si l'accroche d'une leçon philosophique devait toujours, en réalité, être lue comme l'exposé déguisé d'une doctrine déjà choisie d'avance par son auteur."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          Le chapitre 1 ne prend pas parti et ne mobilise aucun auteur -- il pose la
          tension, il ne la résout pas encore en faveur de qui que ce soit.
      - id: B
        text: "On doit objecter que c'est en réalité la thèse de Hume, et non celle de Locke, qu'illustre déjà la scène du journal intime -- une lecture qui prêterait à une simple accroche narrative la radicalité d'une thèse que le chapitre 5 ne développera, en réalité, que bien plus loin dans la leçon."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          Ni l'un ni l'autre : Le chapitre 1 ne nomme aucun philosophe et ne tranche
          pas la tension qu'il expose.
      - id: C
        text: "On doit objecter que le chapitre 1 illustre plutôt la thèse de Kant sur la dignité, non celle de Locke sur la mémoire -- puisque le malaise ressenti en lisant le journal proviendrait, selon cette lecture, d'un manquement au respect dû à sa propre personne, pas d'un problème de continuité de conscience."
        correct: false
        misconception: mc.philo.la_personne.r0-tension-non-tenue
        feedback: >
          Le chapitre 1 ne mobilise aucun critère kantien non plus : il expose une
          tension brute, avant toute doctrine.
      - id: D
        text: "Le chapitre 1 ne mobilise encore aucun auteur ni aucune doctrine : il se contente de faire émerger une tension entre deux réponses spontanées, sans les départager -- l'argument de Locke n'apparaît que plus loin, au chapitre 4."
        correct: true
    correct_feedback: >
      R0 est une accroche : elle fait naître la tension entre deux
      intuitions spontanées, sans mobiliser encore aucun auteur ni trancher
      en faveur d'aucune doctrine.
    solution: |
      **Ce que le chapitre 1 fait :** poser une tension entre deux réponses spontanées,
      sans les départager.
      **Ce que le chapitre 1 ne fait pas :** nommer un auteur ou trancher en faveur
      d'une doctrine. Locke (chapitre 4), Hume (chapitre 5), Kant (chapitre 3) n'interviennent que
      plus loin.

  - id: PERS-10
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_la_personne
    tags: [individu, personne, identite_numerique]
    stem: >
      Un élève affirme : « Puisque j'ai toujours le même nom et le même
      numéro de carte d'identité qu'il y a dix ans, la question de mon
      identité personnelle est déjà réglée. » Que manque cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond l'identité numérique ou administrative (même nom, même numéro) avec l'identité personnelle au sens philosophique -- la question, non encore réglée par ce seul fait, de savoir si l'on reste, au sens plein, LE MÊME sujet à travers les changements psychologiques."
        correct: true
      - id: B
        text: "Elle manque le fait que le nom et le numéro administratif appartiennent au concept de « personne », et non à celui d'« individu » -- une confusion qui inverserait exactement le sens des deux notions telles que le chapitre 2 les construit."
        correct: false
        misconception: mc.philo.la_personne.identite-numerique-confondue-personnelle
        feedback: >
          C'est l'inverse : nom et numéro relèvent du simple suivi
          numérique de l'individu, pas du statut de personne, qui suppose
          un critère supplémentaire (chapitre 3).
      - id: C
        text: "Elle manque le fait qu'être un individu suppose déjà, par définition, la conscience de soi et la responsabilité -- de sorte qu'aucune distinction supplémentaire avec le statut de personne ne serait, en toute rigueur, jamais nécessaire pour aucun être vivant, humain ou non."
        correct: false
        misconception: mc.philo.la_personne.individu-personne-synonymes
        feedback: >
          Le chapitre 2 dit explicitement le contraire : la seule notion d'individu
          n'exige ni raison, ni conscience de soi, ni statut moral.
      - id: D
        text: "Elle manque le fait que seule une « personne morale » (une entreprise, une association) peut poser la question de son identité personnelle, et jamais un individu humain concret comme l'élève lui-même, qui en serait, par nature, exclu."
        correct: false
        misconception: mc.philo.la_personne.personne-physique-morale-confondues
        feedback: >
          La question de l'identité personnelle concerne les personnes
          physiques comme l'élève lui-même, pas seulement les fictions
