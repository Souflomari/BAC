      - id: B
        text: "Il existe une continuité simple, spatio-temporelle, entre le corps qui a écrit ces pages et celui d'aujourd'hui -- mais ce seul fait ne tranche rien quant à savoir si tu restes, au sens plein, la MÊME personne."
        correct: true
      - id: C
        text: "Aucune continuité, même au simple niveau de l'individu, ne peut être établie, puisque la matière du corps se renouvelle sans cesse."
        correct: false
        feedback: >
          R1 affirme au contraire qu'une continuité spatio-temporelle
          simple existe bel et bien au niveau de l'individu -- c'est
          seulement insuffisant pour la question de la personne.
      - id: D
        text: "Le seul fait d'être un individu suffit déjà à garantir un statut de personne, puisque tout être humain vivant est automatiquement une personne au sens plein."
        correct: false
        feedback: >
          R1 est clair : tout être humain vivant est un individu, mais lui
