notion: la-liberte
skill_code: philo_liberte
misconceptions: []

items:
  - id: LIB-1
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [distinction_auteurs, spinoza, determinisme]
    stem: >
      Selon Spinoza, si nos actes sont déterminés par des causes nécessaires,
      qu'est-ce que cela implique pour la liberté ?
    type: mcq
    choices:
      - id: A
        text: "Nous ne sommes jamais libres : la liberté est une pure illusion, sans exception."
        correct: false
        feedback: >
          Ce choix confond le déterminisme spinoziste avec une négation totale
          de la liberté. Spinoza ne dit pas que la liberté n'existe pas : il la
          redéfinit. Être libre, pour lui, ce n'est pas échapper aux causes
          (impossible), c'est être la cause adéquate de ses actes — agir à
          partir de sa propre raison plutôt que subir des causes extérieures
          non comprises. Nier toute liberté, c'est manquer ce déplacement.
      - id: B
        text: "Être libre ne consiste pas à échapper à la nécessité, mais à la comprendre et à agir comme cause rationnelle de ses actes."
        correct: true
      - id: C
        text: "Nous sommes libres uniquement dans les instants où aucune cause n'influence notre choix."
        correct: false
        feedback: >
          C'est la définition du libre arbitre comme indétermination totale —
          exactement ce que Spinoza écarte. Pour lui, rien n'échappe jamais à
          la nécessité, pas même l'esprit humain ; chercher des instants
          « sans cause » revient à chercher ce qui, selon lui, n'existe pas.
      - id: D
        text: "Le déterminisme ne concerne que les objets physiques : nos décisions, elles, échappent par nature à toute causalité."
        correct: false
        feedback: >
          C'est l'inverse du geste de Spinoza. Il étend délibérément le
          déterminisme à l'esprit humain (nos volitions ont des causes,
          comme le mouvement d'un corps) — c'est justement ce point de départ
          qui rend nécessaire de repenser ce que « liberté » veut dire.
    correct_feedback: >
      Spinoza assume un déterminisme intégral, y compris pour l'esprit — puis
      déplace la question : elle ne porte plus sur l'existence d'une cause
      (toujours oui) mais sur sa nature (une cause comprise par la raison, ou
      une cause extérieure subie sans la voir). C'est ce déplacement, pas une
      négation de la liberté, qui définit sa position.
    solution: |
      **Le point de départ de Spinoza :** rien dans la nature n'échappe à la
      nécessité, pas même les décisions humaines — elles ont des causes,
      exactement comme un corps en mouvement.

      **L'erreur à ne pas commettre :** en conclure que la liberté n'existe
      donc pas. Ce n'est pas la thèse de Spinoza.

      **Ce qu'il fait à la place :** il redéfinit la liberté comme le fait
      d'être la cause *adéquate* de ses actes — de les comprendre par la
      raison — plutôt que d'en être le simple théâtre, ballotté par des
      causes externes ignorées (la servitude des passions). D'où la formule
      classique : la liberté n'est pas l'absence de nécessité, c'est la
      connaissance de la nécessité.

  - id: LIB-2
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [distinction_auteurs, sartre, responsabilite]
    stem: >
      Que signifie, chez Sartre, la formule « l'homme est condamné à être
      libre » ?
    type: mcq
    choices:
      - id: A
        text: "Que l'homme peut faire absolument tout ce qu'il désire, sans aucune limite extérieure."
        correct: false
        feedback: >
          Ce choix confond la liberté radicale de Sartre (l'absence de nature
          humaine préalable qui déterminerait nos actes) avec l'absence de
          toute limite ou circonstance extérieure — ce n'est pas ce qu'il
          affirme. Sartre parle de l'absence d'excuse par une nature donnée
          d'avance, pas d'un pouvoir sans limites sur le monde.
      - id: B
        text: "Que la liberté est une punition dont on peut se libérer en refusant de choisir."
        correct: false
        feedback: >
          Pour Sartre, ne pas choisir est encore une manière de choisir : on
          ne peut pas s'extraire de la responsabilité en s'abstenant. Croire
          qu'un non-choix échappe à la liberté, c'est manquer exactement ce
          que « condamné » veut dire — on ne peut pas s'en défausser.
      - id: C
        text: "N'ayant pas de nature qui le détermine à l'avance, l'homme ne peut échapper à la nécessité de choisir et porte l'entière responsabilité de ses actes."
        correct: true
      - id: D
        text: "Que l'homme est entièrement déterminé par la société, et n'a donc aucune part de responsabilité."
        correct: false
        feedback: >
          C'est l'exact opposé de la position de Sartre. Il rejette
          précisément l'idée qu'une cause extérieure (la société, le milieu,
          une « nature ») puisse déterminer d'avance ce que je deviens et me
          décharger de ma responsabilité — c'est ce refus qu'il nomme
          « mauvaise foi » quand on s'en sert comme excuse.
    correct_feedback: >
      Pour Sartre, « l'existence précède l'essence » : aucune nature humaine
      préalable ne dicte ce que je dois devenir. « Condamné » signifie que je
      n'ai pas choisi d'exister ni de devoir sans cesse choisir ; « libre »
      signifie qu'aucune cause définitive ne me dispense de la responsabilité
      entière de mes actes.
    solution: |
      **Le point de départ :** contrairement à un objet fabriqué (dont
      l'essence précède l'existence), l'être humain n'a pas de nature
      donnée d'avance qui déterminerait ce qu'il doit devenir — « l'existence
      précède l'essence ».

      **La conséquence tirée sans concession :** rien ne peut m'excuser
      (« c'est ma nature », « mon milieu m'a fait ainsi »). Se présenter
      comme déterminé pour fuir cette responsabilité, c'est la *mauvaise
      foi*.

      **D'où la formule :** condamné (on n'a pas choisi de devoir choisir),
      libre (rien ne détermine d'avance ce choix) — donc entièrement
      responsable.

  - id: LIB-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [distinction_auteurs, rousseau, montesquieu, politique]
    stem: >
      Pour Rousseau, en quel sens obéir à la loi peut-il être un acte de
      liberté plutôt qu'une simple contrainte ?
    type: mcq
    choices:
      - id: A
        text: "Parce que toute loi, quelle que soit son origine, doit être obéie sans discussion dès qu'elle est votée."
        correct: false
        feedback: >
          Ce choix oublie la condition posée par Rousseau : la loi n'est
          libératrice que si elle exprime la volonté générale, c'est-à-dire
          si le citoyen y a lui-même part. Une loi imposée par un pouvoir
          arbitraire, sans que les citoyens y participent, n'est précisément
          pas ce dont parle Rousseau — c'est l'inverse même de sa position.
      - id: B
        text: "Parce qu'en obéissant à une loi qui exprime la volonté générale, à laquelle il participe comme citoyen, l'individu obéit en un sens à sa propre volonté rationnelle plutôt qu'à un pouvoir extérieur arbitraire."
        correct: true
      - id: C
        text: "Parce que la loi supprime toute liberté individuelle au profit du collectif, ce qui est justement le but recherché."
        correct: false
        feedback: >
          C'est une caricature de la thèse de Rousseau : il ne dit pas que la
          liberté individuelle doit disparaître au profit du groupe, mais
          que la loi, quand elle exprime la volonté générale, est une forme
          d'auto-législation — le citoyen s'obéit, en un sens, à lui-même.
      - id: D
        text: "Parce qu'une société sans aucune loi serait la forme la plus achevée de la liberté."
        correct: false
        feedback: >
          C'est exactement la thèse naïve (la licence) que Rousseau et
          Montesquieu écartent : une liberté sans aucune règle commune permet
          au plus fort d'écraser les autres. « L'impulsion du seul appétit
          est esclavage » selon Rousseau — pas l'absence de loi qui rendrait
          libre.
    correct_feedback: >
      Rousseau distingue l'impulsion du seul appétit, qu'il qualifie
      d'esclavage, de « l'obéissance à la loi qu'on s'est prescrite », qu'il
      qualifie de liberté. Cela ne vaut que si la loi exprime réellement la
      volonté générale — pas n'importe quelle loi imposée sans le consentement
      des citoyens.
    solution: |
      **Le problème que pose l'intuition naïve :** si la loi est vue comme
      une pure contrainte extérieure, moins de lois semblerait signifier plus
      de liberté — jusqu'à l'absence totale de règle (la licence).

      **Pourquoi cette absence de règle échoue :** sans limite commune, la
      liberté de chacun entre en collision avec celle des autres ; le plus
      fort impose sa volonté (Montesquieu).

      **Le déplacement de Rousseau :** dans une société légitime, la loi est
      ce que la communauté des citoyens se prescrit collectivement à
      elle-même (la volonté générale). Y obéir, ce n'est donc pas obéir à un
      autre, mais à sa propre volonté rationnelle telle qu'elle s'exprime
      collectivement — à condition que la loi exprime réellement cette
      volonté générale, et non l'arbitraire d'un seul.

  - id: LIB-4
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_liberte
    tags: [distinction_auteurs, spinoza, sartre, synthese]
    stem: >
      Quelle est la différence essentielle entre la conception de la liberté
      chez Spinoza et chez Sartre ?
    type: mcq
    choices:
      - id: A
        text: "Spinoza pense qu'aucune cause ne détermine nos actes, alors que Sartre pense que tout est déterminé par la société."
        correct: false
        feedback: >
          C'est l'inverse des deux positions. Spinoza assume au contraire un
          déterminisme intégral (tout a une cause, y compris l'esprit) ; et
          Sartre refuse précisément l'idée qu'une cause sociale ou une nature
          préalable détermine d'avance ce que devient un individu — c'est ce
          refus qui fonde sa responsabilité absolue.
      - id: B
        text: "Spinoza soutient que nous sommes toujours déterminés par des causes mais pouvons devenir libres en les comprenant par la raison ; Sartre soutient qu'aucune nature humaine préalable ne nous détermine, ce qui rend la liberté totale et la responsabilité absolue."
        correct: true
      - id: C
        text: "Les deux philosophes affirment exactement la même chose : la liberté consiste à ignorer les causes de ses actes."
        correct: false
        feedback: >
          C'est un contresens partagé sur les deux positions. Pour Spinoza,
          ignorer les causes est justement la situation de la « pierre qui
          vole » qui se croit libre à tort — l'inverse de la liberté. Sartre,
          de son côté, ne parle pas d'ignorer des causes mais d'assumer
          qu'il n'y en a pas qui nous dispenseraient de choisir.
      - id: D
        text: "Spinoza et Sartre nient tous deux, chacun à sa manière, l'existence de toute liberté humaine."
        correct: false
        feedback: >
          Aucun des deux ne nie la liberté : chacun la redéfinit. Spinoza en
          fait une affaire de compréhension rationnelle des causes qui nous
          déterminent ; Sartre en fait une responsabilité absolue, faute de
          toute nature qui pourrait nous en dispenser. Conclure qu'ils
          nient « la liberté » tout court aplatit deux positions opposées
          en une seule caricature.
    correct_feedback: >
      Les deux prémisses sont incompatibles : Spinoza part d'un déterminisme
      universel (y compris pour l'esprit) et fait de la liberté une question
      de compréhension rationnelle des causes ; Sartre part au contraire de
      l'absence de toute nature humaine préalable, ce qui rend le choix
      inévitable et la responsabilité totale, sans excuse possible.
    solution: |
      **Chez Spinoza :** rien n'échappe à la nécessité ; être libre, c'est
      comprendre les causes qui nous déterminent et en devenir la cause
      rationnelle, plutôt que les subir sans les voir (la servitude des
      passions).

      **Chez Sartre :** il n'existe aucune nature humaine préalable qui
      déterminerait nos actes à l'avance (« l'existence précède
      l'essence ») ; nous sommes donc condamnés à choisir sans cesse, et
      rien ne peut excuser ce que nous devenons.

      **Le point commun malgré tout :** ni l'un ni l'autre ne réduit la
      liberté à une pure indétermination sans cause — mais les deux
      partent de prémisses opposées sur le déterminisme lui-même. Les
      confondre sous prétexte qu'ils parlent tous deux de « liberté » et de
      « causes » est l'erreur la plus fréquente sur ces deux auteurs.
