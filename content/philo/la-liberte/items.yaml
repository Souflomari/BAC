          est conçue pour exploiter des mécanismes psychologiques
          identifiés (récompense imprévisible, peur de rater quelque
          chose). Nier cela, c'est nier une prémisse du texte lui-même.
      - id: B
        text: "Parce que si l'algorithme décide vraiment à ta place, cela prouve au contraire que tu es totalement libre : un mécanisme extérieur qui choisit pour toi te délivrerait, par le fait même, de toute responsabilité dans cette affaire précise, ce soir-là comme n'importe quel autre soir."
        correct: false
        misconception: mc.philo.liberte.faux-dilemme-libre-arbitre-determinisme
        feedback: >
          C'est l'inverse de ce que le texte établit : il ne s'agit pas de
          faire basculer la conclusion vers la liberté totale, mais de
          montrer que le déterminisme intégral, pris au pied de la lettre,
          pose lui aussi un problème — celui de la responsabilité.
      - id: C
        text: "Parce qu'un algorithme propose une vidéo mais ne referme jamais ta main sur l'écran à ta place ; et si tu n'y étais vraiment pour rien, tu ne pourrais plus non plus te reprocher d'avoir raté ton réveil — le déterminisme total dissout jusqu'à l'idée de responsabilité."
        correct: true
      - id: D
        text: "Parce que cette réponse est en réalité la seule totalement exacte, et qu'elle ne pose aucun problème philosophique particulier — le sujet est réglé dès qu'on admet que l'algorithme a décidé à ta place."
        correct: false
        misconception: mc.philo.liberte.echapper-a-la-liberte
        feedback: >
          C'est nier la tension que le texte construit délibérément : les
          deux réponses spontanées posent chacune un problème, ni l'une ni
          l'autre n'est présentée comme la solution.
    correct_feedback: >
      L'algorithme propose ; il n'agit pas à ta place. Et un déterminisme
      total, pris au pied de la lettre, emporterait aussi ta
      responsabilité — pas seulement pour cette nuit-là, mais l'idée même
      que tu pourrais être responsable de quoi que ce soit.
    solution: |
      **Ce qui cloche dans « l'algorithme a décidé » :** il propose une
      vidéo suivante ; il n'appuie pas lui-même sur l'écran.

      **La conséquence embarrassante :** si rien ne dépendait vraiment de
      toi, tu ne pourrais plus non plus te reprocher d'avoir raté ton
      réveil.

      **Ce que cela révèle :** le déterminisme total, pris strictement,
      dissout la responsabilité — pas seulement la liberté.

      **D'où le problème :** aucune des deux réponses spontanées ne
      suffit, à elle seule, à rendre compte de la situation.

  - id: LIB-7
    rung: "R0"
    difficulty_level: 2
    skill_code: philo_liberte
    tags: [accroche, probleme_philosophique, determinisme, libre_arbitre]
    stem: >
      Que cherche à établir, au fond, la mise en scène du téléphone qui
      clôt l'introduction (chapitre 1) ?
    type: mcq
    choices:
      - id: A
        text: "Qu'il faut choisir immédiatement et définitivement entre le libre arbitre total et le déterminisme total, la suite de la leçon tranchant nécessairement en faveur de l'un des deux camps — la tension posée n'étant qu'une façon rhétorique d'amener le sujet."
