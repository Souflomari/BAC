          pas ce problème en piochant un camp », mais le déplacent.
      - id: B
        text: "Que la question de la liberté devant un écran n'a en réalité aucun intérêt philosophique, puisqu'il ne s'agit que d'une habitude ordinaire, sans rapport avec les grandes questions de la philosophie classique."
        correct: false
        misconception: mc.philo.liberte.faux-dilemme-libre-arbitre-determinisme
        feedback: >
          C'est nier l'enjeu que le texte pose au contraire comme un
          véritable problème philosophique — celui qui va structurer toute
          la leçon.
      - id: C
        text: "Que la seule solution est de couper complètement son téléphone, ce qui réglerait à lui seul le problème philosophique de la liberté, sans qu'il soit besoin d'aller chercher plus loin du côté des philosophes."
        correct: false
        misconception: mc.philo.liberte.echapper-a-la-liberte
        feedback: >
          C'est confondre une solution pratique (couper les notifications)
          avec la résolution du problème philosophique lui-même — le texte
          mentionne ce genre de stratégie plus loin (chapitre 3), mais jamais comme
          une réponse au problème de la liberté en tant que tel.
      - id: D
        text: "Qu'aucune des deux réponses extrêmes — « je choisis tout sans aucune cause » ou « je ne choisis rien, tout est causé » — ne suffit à rendre compte de ce qui se passe réellement : c'est ce problème que la leçon va construire pièce par pièce."
        correct: true
    correct_feedback: >
      Ni le pur libre arbitre indéterminé ni le déterminisme intégral ne
      suffisent à décrire ce qui se passe à 23h05. C'est cette tension, non
      résolue à ce stade, que les rubriques suivantes vont travailler.
    solution: |
      **Les deux tentations :** « je choisis tout, sans aucune cause » et
      « je ne choisis rien, tout est causé ».

      **Pourquoi aucune ne suffit :** chacune, prise seule, contredit un
      aspect de l'expérience réelle.

      **Ce que fait la leçon :** elle ne tranche pas en piochant un camp ;
      elle construit une troisième voie, rubrique après rubrique.

  - id: LIB-8
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_liberte
    tags: [liberte_negative, liberte_interieure, distinction_conceptuelle]
    stem: >
      Quelle différence le chapitre 2 établit-il entre la « liberté comme absence de
      contrainte extérieure » et la « liberté intérieure » ?
    type: mcq
    choices:
      - id: A
        text: "Les deux expressions désignent en réalité exactement la même chose : l'absence de toute cause, interne comme externe, qui pourrait entraver ou infléchir la moindre de mes décisions."
        correct: false
        misconception: mc.philo.liberte.negative-confondue-avec-positive
        feedback: >
          Le texte distingue au contraire nettement les deux : l'une se
          mesure aux obstacles extérieurs, l'autre concerne le fait d'être
          maître de soi, indépendamment de tout obstacle visible.
      - id: B
        text: "On peut être libre au premier sens — rien ne m'empêche extérieurement d'agir — sans l'être au second : être maître de soi suppose d'agir selon ce qu'on juge vraiment bon, plutôt que sous l'effet de la peur, de la colère ou d'une habitude non choisie."
        correct: true
      - id: C
        text: "La liberté intérieure se mesure, comme la liberté d'absence de contrainte, au nombre d'obstacles extérieurs présents : plus il y en a, moins on est libre intérieurement, selon la même logique comptable, au point qu'on pourrait calculer un seul indice de liberté commun aux deux registres."
        correct: false
        misconception: mc.philo.liberte.negative-confondue-avec-positive
        feedback: >
          C'est appliquer à la liberté intérieure le critère propre à la
          liberté négative. Le texte est explicite : on peut n'avoir aucun
          obstacle extérieur et pourtant ne pas être maître de soi — le
          critère n'est donc pas le même.
      - id: D
        text: "Si l'on est libre au sens de l'absence de contrainte extérieure, on est automatiquement libre aussi au sens intérieur, les deux libertés progressant nécessairement du même pas."
        correct: false
        misconception: mc.philo.liberte.negative-confondue-avec-positive
        feedback: >
          C'est exactement l'implication que l'exemple du téléphone
          contredit : à 23h, la liberté « absence de contrainte » est
          acquise, et pourtant la liberté intérieure semble manquer.
    correct_feedback: >
      Le texte dissocie explicitement les deux : devant l'écran à 23h, la
      liberté « absence de contrainte » est déjà acquise (rien ne t'empêche
      d'éteindre), et pourtant la liberté « intérieure » semble manquer.
    solution: |
      **Liberté-absence de contrainte :** rien, autour de moi, ne
      m'empêche d'agir — elle se mesure aux obstacles extérieurs.

      **Liberté intérieure :** être maître de soi, agir selon ce qu'on
      juge bon plutôt que sous l'effet d'une pulsion ou d'une habitude.

      **Le point clé :** ces deux libertés peuvent se dissocier — le cas
      du téléphone en est l'exemple type.

  - id: LIB-9
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_liberte
    tags: [determinisme, contrainte, erreur_a_eviter]
    stem: >
      Selon le chapitre 2, quelle est précisément l'erreur qu'on commet en confondant
      « être déterminé » et « être contraint » ?
    type: mcq
    choices:
      - id: A
        text: "On oublie qu'être contraint suppose un obstacle extérieur identifiable (porte fermée, menace), alors qu'être déterminé, au sens philosophique, c'est seulement avoir une cause — ce qui peut se produire sans aucun obstacle visible, comme devant l'écran à 23h."
        correct: true
      - id: B
        text: "Être déterminé et être contraint désignent en réalité la même réalité : il n'existe aucune différence philosophique sérieuse entre les deux termes, qui ne seraient que de simples synonymes utilisés par pure commodité de style dans ce texte précis, comme dans n'importe quel autre texte de philosophie."
        correct: false
        misconception: mc.philo.liberte.contrainte-egale-determination
        feedback: >
          C'est nier purement et simplement la distinction que le texte
          établit comme un point de vigilance explicite.
      - id: C
        text: "Le déterminisme, tel que le chapitre 2 le définit, ne porte que sur les contraintes visibles, comme les interdictions ou les obstacles physiques que l'on peut montrer du doigt et énumérer un par un."
        correct: false
        misconception: mc.philo.liberte.contrainte-egale-determination
        feedback: >
          C'est l'inverse exact de ce que dit le texte : « le problème du
          déterminisme ne porte pas sur les contraintes visibles ; il porte
          sur la question de savoir si nos décisions elles-mêmes ont
          toujours des causes. »
      - id: D
        text: "Être contraint est une notion plus large qui inclut toujours, comme cas particulier, le fait d'être déterminé par une cause, cette dernière n'étant jamais qu'une forme discrète de contrainte."
        correct: false
        misconception: mc.philo.liberte.contrainte-egale-determination
        feedback: >
          C'est inverser la relation logique entre les deux notions : le
          texte présente au contraire le fait d'être déterminé comme la
          notion la plus générale, qui peut exister avec ou sans contrainte
          identifiable.
    correct_feedback: >
      Le texte est explicite : le problème du déterminisme ne porte pas
      sur les contraintes visibles ; il porte sur la question de savoir si
      nos décisions elles-mêmes ont toujours des causes, contraintes
      visibles ou non.
    solution: |
      **Être contraint :** subir un obstacle extérieur identifiable — une
      porte fermée, une menace.

      **Être déterminé :** avoir une cause, ce qui peut se produire sans
      aucun obstacle visible.

      **L'erreur à éviter :** croire que le déterminisme ne concerne que
      les contraintes visibles — il porte sur la présence même d'une
      cause, visible ou non.

  - id: LIB-10
    rung: "R1"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [libre_arbitre, determinisme, responsabilite]
    stem: >
      Pourquoi le chapitre 2 affirme-t-il qu'un choix absolument sans cause ne serait
      pas, pour autant, un choix librement voulu ?
    type: mcq
    choices:
      - id: A
        text: "Parce que le libre arbitre, correctement compris, exige au contraire qu'une cause extérieure précise détermine chaque choix à l'avance, sans quoi ce choix ne pourrait même pas être qualifié de choix."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est l'inverse de la définition donnée par le texte : le libre
          arbitre y est défini précisément comme un pouvoir qui ne serait
          déterminé par rien d'antérieur — ni le passé, ni le tempérament,
          ni l'éducation.
      - id: B
        text: "Parce qu'un choix sans aucune cause serait au contraire la preuve la plus pure d'une liberté totale et pleinement responsable, puisque rien d'extérieur ne viendrait alors entacher la pureté de la décision."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est l'inverse de la thèse du texte : un événement sans cause y
          est comparé à un dé qui tombe « pour rien » — un pur hasard, pas
          l'expression d'une responsabilité.
      - id: C
        text: "Parce que le déterminisme intégral, en donnant une cause à chaque acte, est la seule façon de garantir que je reste responsable de mes choix, la responsabilité exigeant justement une chaîne causale complète, du début jusqu'à la fin, sans qu'aucun maillon n'y échappe."
        correct: false
        misconception: mc.philo.liberte.faux-dilemme-libre-arbitre-determinisme
        feedback: >
          C'est l'inverse du point que fait le texte : il montre au
          contraire que le déterminisme intégral, pris à la lettre,
          dissout la responsabilité plutôt qu'il ne la garantit.
      - id: D
        text: "Parce qu'un événement absolument sans cause ressemble à un pur hasard — comme un dé qui tombe sur une face « pour rien » — plutôt qu'à l'expression de qui je suis ; nier tout déterminisme pour sauver le libre arbitre revient à remplacer le choix par l'accident."
        correct: true
    correct_feedback: >
      Un événement sans aucune cause n'est pas pour autant *voulu* : c'est
      un pur hasard, comme un dé qui tombe. Si mes choix échappaient
      entièrement à toute causalité, en quel sens seraient-ils encore les
      miens plutôt qu'un accident ?
    solution: |
      **L'intuition testée :** un libre arbitre « pur », sans aucune cause
      antérieure, semblerait garantir une liberté maximale.

      **Le problème :** un événement sans cause n'est pas un choix voulu,
      c'est un pur hasard (le dé).

      **La conséquence :** nier tout déterminisme pour sauver le libre
      arbitre dissout le choix lui-même, plutôt que de le sauver.

  - id: LIB-11
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [spinoza, illusion, libre_arbitre]
    stem: >
      Que signifie, chez Spinoza, l'image de la pierre lancée à qui l'on
      prêterait une conscience ?
    type: mcq
    choices:
      - id: A
        text: "Que cet exemple, portant sur un objet physique, ne concerne en rien l'esprit humain selon Spinoza, dont la philosophie réserverait un statut à part aux phénomènes de conscience."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est l'inverse du geste de Spinoza : le texte étend
          explicitement l'image à l'esprit humain (« c'est exactement,
          selon Spinoza, ce qui nous arrive »).
      - id: B
        text: "Que la pierre est réellement libre, puisqu'elle a conscience de son propre mouvement, ce qui suffit, pour n'importe quel être conscient, à définir la liberté véritable."
        correct: false
        misconception: mc.philo.liberte.sentiment-de-liberte-suffit
        feedback: >
          C'est prendre pour un critère de liberté ce que Spinoza dénonce
          comme une illusion : avoir conscience de son mouvement, sans
          avoir conscience de ses causes, ne rend pas libre — c'est
          précisément le piège de la pierre.
      - id: C
        text: "Que le sentiment d'être libre, quand on a seulement conscience de son mouvement (ou de sa décision) sans avoir conscience des causes qui le déterminent entièrement, ne prouve rien : ce sentiment peut n'être que celui de la pierre qui vole."
        correct: true
      - id: D
        text: "Que Spinoza se sert de cet exemple pour montrer qu'aucun être, pierre ou homme, n'a jamais conscience de quoi que ce soit, la conscience elle-même n'étant qu'une illusion supplémentaire à dissiper, au même titre que le sentiment de liberté qu'elle prétend expliquer."
        correct: false
        misconception: mc.philo.liberte.sentiment-de-liberte-suffit
        feedback: >
          C'est déformer l'image : la pierre a bien conscience de son
          mouvement (elle « sent » qu'elle vole) ; ce qui lui manque, c'est
          la conscience des causes de ce mouvement — pas la conscience en
          général.
    correct_feedback: >
      Nous avons conscience de nos décisions (« je veux rester ») sans
      avoir conscience de tout ce qui les cause. Le sentiment d'être libre,
      pris seul, ne prouve donc rien — il peut être celui de la pierre qui
      vole.
    solution: |
      **L'image :** une pierre lancée, si on lui prêtait conscience, se
      sentirait voler « librement » — elle ignore la main et la force qui
      la déterminent.

      **Le parallèle :** nous avons conscience de nos décisions, pas des
      causes qui les produisent entièrement.

      **La leçon :** le sentiment de liberté, seul, ne prouve rien — il
      peut être une illusion d'ignorance.

  - id: LIB-12
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [spinoza, servitude, cause_adequate]
    stem: >
      Chez Spinoza, qu'est-ce qui distingue exactement un homme « libre »
      d'un homme en « servitude » ?
    type: mcq
    choices:
      - id: A
        text: "L'homme libre échappe totalement à toute cause, tandis que l'homme en servitude, lui, reste soumis à la nécessité, prisonnier d'un enchaînement causal dont le premier serait, par contraste, entièrement affranchi — un affranchissement total qu'aucune servitude, si légère soit-elle, ne viendrait jamais entamer."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est exactement l'erreur classique que le texte signale : chez
          Spinoza, l'homme libre n'échappe jamais, lui non plus, à la
          nécessité — c'est impossible pour quiconque.
      - id: B
        text: "Ni l'un ni l'autre n'échappe jamais à la nécessité causale ; mais l'homme libre est cause adéquate de ses actes, les comprenant par sa propre raison, tandis que l'homme en servitude subit des causes extérieures — des passions — qu'il ne comprend pas."
        correct: true
      - id: C
        text: "L'homme libre est celui qui ignore les causes de ses actes sans s'en soucier, ce qui lui laisse agir spontanément, porté par ses seules impressions du moment sans jamais avoir à les interroger."
        correct: false
        misconception: mc.philo.liberte.sentiment-de-liberte-suffit
        feedback: >
          C'est inverser la position de Spinoza : c'est l'ignorance des
          causes qui caractérise la servitude — la position de la pierre
          qui vole — pas la liberté.
      - id: D
        text: "La différence tient uniquement à la quantité de contraintes extérieures visibles que chacun subit, non à la compréhension des causes, un peu comme on compterait des obstacles sur un parcours."
        correct: false
        misconception: mc.philo.liberte.negative-confondue-avec-positive
        feedback: >
          C'est confondre la liberté négative (absence de contrainte
          visible, vue au chapitre 2) avec la redéfinition spinoziste de la
          liberté, qui porte sur la compréhension rationnelle des causes,
          non sur leur visibilité.
    correct_feedback: >
      Spinoza ne dit jamais que l'homme libre échapperait à la nécessité —
      impossible pour lui. Le degré de liberté est un degré de
      compréhension : être cause adéquate et rationnelle de ses actes,
      plutôt que le théâtre de causes extérieures subies sans les voir.
    solution: |
      **Point commun aux deux :** aucun n'échappe à la nécessité causale —
      pour Spinoza, c'est toujours vrai.

      **L'homme libre :** cause adéquate de ses actes, par sa propre
      raison.

      **L'homme en servitude :** subit des causes extérieures (passions)
      qu'il ne comprend pas.

      **L'erreur classique :** croire que l'homme libre, chez Spinoza,
      échapperait aux causes — ce n'est jamais sa thèse.

  - id: LIB-13
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [methode_dissertation, problematique]
    stem: >
      Selon la méthode présentée au chapitre 5, qu'est-ce qui distingue une
      problématique réussie d'une simple reformulation du sujet ?
    type: mcq
    choices:
      - id: A
        text: "Une problématique met en évidence une tension entre deux positions également légitimes en apparence, à laquelle le devoir devra répondre — elle ne se contente jamais de redire le sujet avec d'autres mots."
        correct: true
      - id: B
        text: "Une problématique réussie doit annoncer directement, dès l'introduction, la réponse finale du devoir, pour ne laisser aucun suspense au correcteur qui découvre la copie."
        correct: false
        misconception: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est confondre la fonction de la problématique (poser une
          tension à explorer) avec celle du dépassement final, qui vient y
          répondre au terme du devoir.
      - id: C
        text: "Une problématique consiste à reformuler le sujet sous forme de question fermée, à laquelle on répond ensuite simplement par « oui » ou par « non », sans qu'aucun développement supplémentaire ne soit véritablement requis."
        correct: false
        misconception: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est exactement l'erreur que le texte signale : « une bonne
          dissertation ne répond jamais simplement oui ou non ; elle
          montre pourquoi la réponse spontanée pose un problème. »
      - id: D
        text: "Une problématique doit obligatoirement citer au moins un auteur du programme pour être recevable, quel que soit le sujet traité, sous peine d'être jugée trop vague par le correcteur."
        correct: false
        misconception: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Rien dans la méthode présentée n'exige cela : la problématique
          est définie par la tension qu'elle formule, pas par une
          citation d'auteur obligatoire à ce stade.
    correct_feedback: >
      Une problématique n'est pas une reformulation : c'est la mise en
      évidence d'une tension entre deux positions légitimes en apparence,
      à laquelle tout le devoir va répondre progressivement.
    solution: |
      **Ce qu'une problématique n'est pas :** une reformulation du sujet,
      ni une réponse anticipée par « oui » ou « non ».

      **Ce qu'elle est :** la mise en évidence d'une tension entre deux
      positions légitimes en apparence.

      **Exemple du sujet traité :** si faire ce qu'on veut mène à la
      servitude des passions, comment parler encore de liberté véritable ?

  - id: LIB-14
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_liberte
    tags: [methode_dissertation, plan_dialectique, spinoza]
    stem: >
      Dans le plan dialectique construit au chapitre 5 pour le sujet « Être libre,
      est-ce faire tout ce que l'on veut ? », à quelle partie appartient la
      mobilisation de Spinoza et de la servitude des passions ?
    type: mcq
    choices:
      - id: A
        text: "À la thèse (partie I), pour illustrer que faire ce que l'on veut, sans aucune entrave, est la définition même de la liberté qu'il s'agira ensuite de nuancer progressivement."
        correct: false
        misconception: mc.philo.liberte.licence-est-liberte-achevee
        feedback: >
          Mauvais emplacement : la partie I mobilise la liberté négative
          et le libre arbitre (chapitre 2), pas la servitude des passions
          spinoziste, qui sert au contraire à fragiliser cette thèse.
      - id: B
        text: "Uniquement au dépassement (partie III), à travers l'idée de connaissance de la nécessité, et jamais à l'antithèse, Spinoza n'ayant, selon cette lecture, rien à apporter à la critique de la thèse spontanée."
        correct: false
        misconception: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Le plan mobilise bien Spinoza en III (connaissance de la
          nécessité), mais nie à tort qu'il apparaisse aussi en II, pour
          un usage différent : la servitude des passions.
      - id: C
        text: "À l'antithèse (partie II) : elle montre que « faire ce que je veux » peut signifier suivre aveuglément des désirs dont j'ignore les causes — la servitude des passions."
        correct: true
      - id: D
        text: "Nulle part dans le développement : Spinoza n'intervient que dans l'introduction, à titre d'accroche, avant de céder toute la place aux auteurs réellement mobilisés dans le devoir."
        correct: false
        misconception: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est méconnaître la structure du plan, où Spinoza est mobilisé
          deux fois dans le développement lui-même — en II pour la
          servitude des passions, en III pour la connaissance de la
          nécessité — jamais comme simple accroche.
    correct_feedback: >
      L'étape 3 est explicite : la partie II mobilise le déterminisme et
      la servitude des passions selon Spinoza pour fragiliser la thèse
      spontanée ; Spinoza revient ensuite en III, mais pour un usage
      différent — la connaissance de la nécessité.
    solution: |
      **Partie I (thèse) :** liberté négative, libre arbitre — pas
      Spinoza.

      **Partie II (antithèse) :** déterminisme + servitude des passions
      selon Spinoza — fragilise la thèse.

      **Partie III (dépassement) :** Spinoza revient, mais pour un usage
      différent — la connaissance de la nécessité.

  - id: LIB-15
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [methode_dissertation, analyse_des_termes, licence]
    stem: >
      Selon l'étape 1 (analyse des termes) de la méthode présentée au chapitre 5,
      que suppose l'expression « faire tout ce que l'on veut », sans qu'on
      l'interroge davantage ?
    type: mcq
    choices:
      - id: A
        text: "Elle suppose que « vouloir » et « pouvoir » désignent exactement la même chose, et qu'aucune distinction n'est nécessaire entre eux, puisque vouloir suffirait toujours, en pratique, à obtenir ce que l'on désire."
        correct: false
        misconception: mc.philo.liberte.liberte-confondue-avec-pouvoir
        feedback: >
          Ce n'est pas la distinction que pointe le texte à cette étape :
          il interroge l'origine du vouloir lui-même, pas son rapport à un
          quelconque pouvoir d'agir.
      - id: B
        text: "Elle suppose que le sujet ne porte que sur la liberté politique, à l'exclusion de toute dimension individuelle, la question du « vouloir » personnel n'ayant ici aucune place légitime."
        correct: false
        misconception: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est restreindre indûment la portée du sujet en la confondant
          avec le seul terrain politique (chapitre 4), alors que l'analyse des
          termes porte ici sur la structure même du vouloir individuel.
      - id: C
        text: "Elle suppose que « tout ce que l'on veut » désigne la liberté intérieure telle que définie au chapitre 2, et non la licence, les deux notions se recouvrant en réalité entièrement l'une l'autre."
        correct: false
        misconception: mc.philo.liberte.licence-est-liberte-achevee
        also_reveals: [mc.philo.liberte.negative-confondue-avec-positive]
        feedback: >
          C'est contredire directement le texte, qui nomme explicitement
          cette expression « la licence » — une absence de toute limite,
          pas la liberté intérieure du chapitre 2.
      - id: D
        text: "Elle suppose qu'on sache déjà ce qu'on « veut », sans interroger d'où vient ce vouloir — ce que le plan devra précisément remettre en question dans l'antithèse."
        correct: true
    correct_feedback: >
      Le texte le dit explicitement : cette expression désigne la licence,
      et suppose qu'on sache déjà ce qu'on « veut » — sans interroger d'où
      vient ce vouloir. C'est précisément ce que l'antithèse viendra
      questionner.
    solution: |
      **Ce que nomme l'expression :** la liberté comme absence de toute
      limite — la licence.

      **Ce qu'elle suppose sans le dire :** qu'on sait déjà ce qu'on veut,
      sans interroger l'origine de ce vouloir.

      **Pourquoi c'est important :** c'est exactement ce point aveugle que
      l'antithèse (Spinoza, servitude des passions) va exploiter.

  # Ajoutés le 2026-09-05 : quatre familles sous le plancher de 3 items du banc —
  # `autrui-limite-par-nature` (AUCUN item : sondée en leçon seulement, ce qui ne
  # compte pas), `loi-liberte-mal-articulees` (1),
  # `negative-confondue-avec-positive` (2) et `liberte-confondue-avec-pouvoir`
  # (2). Trois items, trois entrées : Rousseau, l'objection ordinaire du
  # « pouvoir tout faire », et Spinoza.
  - id: LIB-16
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_liberte
    tags: [rousseau, loi, autonomie, contrat-social]
    stem: >
      « Chacun s'unissant à tous n'obéit pourtant qu'à lui-même et reste aussi
      libre qu'auparavant », écrit Rousseau. Que soutient-il exactement ?
    type: mcq
    choices:
      - id: A
        text: "Qu'une loi qu'on s'est prescrite à soi-même, comme membre du corps politique, n'est pas une contrainte subie : y obéir, c'est obéir à sa propre volonté."
        correct: true
      - id: B
        text: "Que toute loi ampute nécessairement la liberté de chacun, mais que ce sacrifice est le prix à payer pour la sécurité qu'apporte la vie en société."
        correct: false
        misconception: mc.philo.liberte.loi-liberte-mal-articulees
        feedback: >
          C'est la thèse que Rousseau conteste. Sa question est précisément
          celle-ci : à quelles conditions une loi peut-elle obliger sans
          asservir ? Sa réponse tient dans l'origine de la loi — non pas
          imposée du dehors, mais issue de la volonté générale dont je suis
          partie prenante. Une loi qu'on se donne n'est pas un sacrifice
          consenti : c'est l'exercice même de l'autonomie.
      - id: C
        text: "Que la présence des autres réduit mécaniquement l'espace de ma liberté, chaque homme libre autour de moi étant un obstacle de plus sur mon chemin."
        correct: false
        misconception: mc.philo.liberte.autrui-limite-par-nature
        feedback: >
          C'est exactement le contraire du contrat social. Pour Rousseau,
          l'association ne retranche pas de la liberté : elle en fonde une
          nouvelle, civile, plus assurée que la liberté naturelle où chacun
          dépend de la force du plus fort. Autrui n'y est pas un obstacle de
          plus, il est la condition d'une liberté commune.
      - id: D
        text: "Que la liberté comme absence de contrainte extérieure et la liberté intérieure sont une seule et même chose, mesurables au même critère."
        correct: false
        misconception: mc.philo.liberte.negative-confondue-avec-positive
        feedback: >
          Ces deux libertés se dissocient — c'est même ce qui rend le problème
          intéressant. Un homme sans entrave peut agir sous l'emprise de ses
          passions ; un homme contraint peut garder l'autonomie de son jugement.
          Rousseau ne les confond pas : il montre comment la loi civile peut
          servir la seconde sans ruiner la première.
    correct_feedback: >
      Rousseau ne dit pas que la loi limite moins qu'on ne croit : il déplace la
      question vers son ORIGINE. Une loi que je me suis donnée, comme membre du
      souverain, n'est pas une volonté étrangère qui s'impose à la mienne — lui
      obéir, c'est m'obéir. C'est cela, l'autonomie, littéralement.
    solution: |
      **Le problème.** Toute société suppose des lois ; toute loi semble limiter
      la liberté. Faut-il en conclure que vivre ensemble coûte nécessairement
      une part de liberté ?

      **Le déplacement de Rousseau.** Il ne discute pas l'ÉTENDUE de la
      contrainte, mais son ORIGINE. Une loi imposée du dehors asservit ; une loi
      que le citoyen se prescrit à lui-même, en tant que membre du souverain,
      n'est pas une volonté étrangère.

      **D'où la formule.** « N'obéir qu'à soi-même » ne veut pas dire faire ce
      qu'on veut : cela veut dire que la source de la loi et celle de ma volonté
      coïncident. L'obéissance à la loi qu'on s'est prescrite est liberté —
      c'est l'autonomie, au sens propre du mot.

      **À distinguer de Montesquieu**, qui définit la liberté politique comme le
      droit de faire tout ce que les lois permettent : chez lui la loi TRACE
      l'espace de la liberté, chez Rousseau elle en est l'acte même.

  - id: LIB-17
    rung: "R1"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [liberte-et-pouvoir, definition, objection]
    stem: >
      Un élève affirme : « Être libre, c'est pouvoir faire tout ce qu'on veut. »
      Quelle réponse est la plus solide ?
    type: mcq
    choices:
      - id: A
        text: "Que la liberté ne se mesure pas à l'étendue de ce qu'on peut faire : un homme enfermé peut rester libre de son jugement, un homme tout-puissant peut agir sous l'emprise de ses passions."
        correct: true
      - id: B
        text: "Qu'il a raison sur le fond : la liberté est bien la puissance d'agir, et c'est pourquoi les hommes les plus puissants sont aussi, en toute rigueur, les plus libres."
        correct: false
        misconception: mc.philo.liberte.liberte-confondue-avec-pouvoir
        feedback: >
          Confondre liberté et puissance rend la question insoluble : personne
          n'étant tout-puissant, personne ne serait libre, et le mot ne
          désignerait plus qu'un idéal inaccessible. La liberté ne porte pas sur
          l'ÉTENDUE de ce que je peux, mais sur ce qui DÉTERMINE ce que je fais
          — mes propres raisons, ou une cause qui m'échappe.
      - id: C
        text: "Qu'il oublie la loi, laquelle est par nature l'ennemie de la liberté et en réduit toujours l'étendue, quel que soit celui qui l'édicte."
        correct: false
        misconception: mc.philo.liberte.loi-liberte-mal-articulees
        feedback: >
          « Par nature » est de trop. Une loi imposée du dehors contraint ;
          une loi qu'on s'est prescrite, chez Rousseau, est l'exercice même de
          l'autonomie. Et chez Montesquieu, la loi ne retranche pas la liberté :
          elle en trace l'espace, en garantissant que nul ne subira l'arbitraire
          d'un autre.
      - id: D
        text: "Qu'il oublie autrui, qui borne mécaniquement ce que je peux faire : moins il y a de monde autour de moi, plus je suis libre de mes mouvements."
        correct: false
        misconception: mc.philo.liberte.autrui-limite-par-nature
        feedback: >
          Cette réponse accepte la définition qu'elle prétend corriger : elle
          continue de mesurer la liberté à l'espace d'action disponible. Et elle
          traite autrui comme un obstacle par construction, sans envisager qu'il
          puisse en être la condition — la reconnaissance mutuelle des libertés
          est ce qui les rend effectives plutôt que précaires.
    correct_feedback: >
      La liberté n'est pas la puissance. Ce qui la définit n'est pas l'étendue
      de ce que je peux faire, mais ce qui détermine ce que je fais : mes
      propres raisons, ou des causes qui m'échappent. D'où deux figures qui
      ruinent l'équation — le prisonnier lucide et le tyran esclave de ses
      passions.
    solution: |
      **Pourquoi l'équation ne tient pas.** Si liberté = puissance, alors la
      liberté se mesure en capacités, et nul n'étant tout-puissant, nul n'est
      libre. Le mot perdrait tout usage.

      **Les deux contre-exemples classiques.** Le prisonnier qui garde
      l'autonomie de son jugement est libre en un sens que ses murs n'atteignent
      pas. Le tyran qui obéit à ses passions est esclave en un sens que sa
      puissance n'efface pas.

      **Ce que la liberté désigne alors.** Non pas l'étendue du possible, mais
      l'ORIGINE de l'acte : est-ce moi, avec mes raisons, ou une cause qui me
      traverse sans que je la connaisse ? C'est le terrain sur lequel Spinoza,
      Sartre et Rousseau donnent chacun leur réponse.

  - id: LIB-18
    rung: "R2"
    difficulty_level: 4
    skill_code: philo_liberte
    tags: [spinoza, necessite, connaissance-des-causes]
    stem: >
      Spinoza soutient qu'être libre, ce n'est pas échapper à la nécessité, mais
      la comprendre. Lequel de ces quatre élèves l'a compris ?
    type: mcq
    choices:
      - id: A
        text: "Celui qui dit : la pierre lancée se croirait libre si elle avait conscience de son mouvement ; l'homme devient libre en connaissant les causes qui le déterminent, non en s'y soustrayant."
        correct: true
      - id: B
        text: "Celui qui dit : Spinoza mesure la liberté à l'absence d'obstacle extérieur, exactement comme il mesure la liberté intérieure — chez lui les deux sont une seule et même chose."
        correct: false
        misconception: mc.philo.liberte.negative-confondue-avec-positive
        feedback: >
          C'est précisément ce que Spinoza sépare. L'absence d'obstacle ne fait
          pas la liberté : la pierre lancée ne rencontre aucun obstacle et
          n'est pas libre pour autant. Ce qui la distingue de l'homme libre,
          c'est la CONNAISSANCE des causes — une affaire intérieure, sans
          rapport avec l'espace laissé au mouvement.
      - id: C
        text: "Celui qui dit : pour Spinoza, être libre suppose de pouvoir agir sans subir aucune cause, donc d'être aussi puissant que possible face au monde."
        correct: false
        misconception: mc.philo.liberte.liberte-confondue-avec-pouvoir
        feedback: >
          Spinoza nie qu'un tel affranchissement soit possible : tout, dans la
          nature, est causé, l'homme compris. Sa thèse n'est pas qu'il faille
          gagner en puissance pour échapper aux causes, mais qu'il faut les
          COMPRENDRE — et que cette compréhension change le rapport que
          j'entretiens avec ce qui me détermine.
      - id: D
        text: "Celui qui dit : comprendre ne change rien tant qu'autrui continue de me contraindre — la liberté commence exactement là où les autres s'arrêtent."
        correct: false
        misconception: mc.philo.liberte.autrui-limite-par-nature
        feedback: >
          Cette réponse ramène la liberté à une question de frontière entre les
          personnes, alors que Spinoza la place ailleurs : dans le passage de
          l'idée inadéquate à l'idée adéquate. On peut être seul et servile
          — mené par des passions dont on ignore les causes — comme on peut être
          entouré et libre.
    correct_feedback: >
      L'exemple de la pierre est le cœur de l'argument : elle tombe par
      nécessité, et si elle avait conscience de son élan, elle croirait tomber
      parce qu'elle le veut. Le sentiment de liberté ne prouve donc rien. La
      liberté véritable commence avec la connaissance des causes qui nous
      déterminent.
    solution: |
      **Le point de départ.** Tout, dans la nature, est nécessairement causé —
      l'homme n'y fait pas exception. Chercher la liberté du côté d'une
      exception à la causalité, c'est la chercher là où elle ne peut pas être.

      **L'exemple de la pierre.** Une pierre lancée poursuit son mouvement par
      nécessité. Si elle avait conscience de son élan, elle se croirait libre —
      elle sentirait son mouvement sans en connaître la cause. Les hommes sont
      dans ce cas : conscients de leurs désirs, ignorants des causes qui les
      produisent.

      **Le déplacement.** La liberté n'est donc pas l'absence de cause, mais le
      passage de l'ignorance à la connaissance : comprendre pourquoi je désire
      ce que je désire, c'est cesser d'être mené par des idées inadéquates.

      **Ce que cela écarte.** Le sentiment de liberté (la pierre l'aurait), la
      puissance (elle ne change rien à la causalité), et la mesure par les
      obstacles extérieurs (la pierre n'en rencontre aucun).

