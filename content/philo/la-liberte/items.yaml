notion: la-liberte
skill_code: philo_liberte

# Misconception inventory — summit-conversion campaign, philo pilot (Gap-4
# fix: this file previously carried `misconceptions: []`, no tags on any
# distractor). Id convention: mc.philo.<slug>.<name>, where <slug> is
# skill_code with the "philo_" prefix stripped (philo_liberte → liberte) —
# matches the precedent set in content/philo/analyse-de-texte/items.yaml
# (mc.philo.analyse_texte.*, from skill_code philo_analyse_texte).
# Built from scratch by reading the lesson (R0-R4) rung by rung and asking,
# at each rung's own named "erreur à éviter" box or central move, what real
# wrong model a student would carry into an item. autrui-limite-par-nature is
# new: it comes from the r-bac Bakounine text (docs/sujets/philo/la-liberte.md,
# 2024 R), an axis (liberté et autrui) this lesson's R0-R4 body does not teach
# directly — see the coverage_summary note below for the honest floor gap
# this opens.

misconceptions:
  - id: mc.philo.liberte.faux-dilemme-libre-arbitre-determinisme
    label: "« Il faut choisir entre libre arbitre total et déterminisme total » (la méconception maîtresse)"
    description: >-
      L'élève traite la liberté et le déterminisme comme deux camps exclusifs
      entre lesquels il faudrait trancher définitivement, sans envisager
      qu'aucun des deux extrêmes, pris seul, ne rend compte de l'expérience
      réelle du choix.
    contradicts_principle: >-
      Ni le pur libre arbitre indéterminé ni le déterminisme intégral ne
      suffisent à rendre compte de ce qui se passe réellement dans un choix —
      les positions étudiées déplacent le problème plutôt que de trancher en
      piochant un camp.

  - id: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
    label: "« Être libre exige qu'aucune cause n'influence mon choix »"
    description: >-
      L'élève définit la liberté comme un pouvoir de choisir qui ne serait
      déterminé par absolument rien — ni le passé, ni le tempérament, ni
      l'éducation — confondant liberté et absence totale d'antécédent causal.
    contradicts_principle: >-
      Un événement absolument sans cause n'est pas pour autant un choix
      voulu : c'est un pur hasard, comme un dé qui tombe sur une face « pour
      rien ». Si mes choix échappaient entièrement à toute causalité, ils ne
      seraient plus les miens, mais un accident.

  - id: mc.philo.liberte.contrainte-egale-determination
    label: "« Être contraint et être déterminé, c'est la même chose »"
    description: >-
      L'élève confond l'obstacle extérieur identifiable (une porte fermée,
      une menace) avec le fait, plus général, d'avoir une cause — et en
      conclut, à tort, que l'absence de contrainte visible garantit
      l'absence de détermination.
    contradicts_principle: >-
      Être contraint suppose un obstacle extérieur identifiable ; être
      déterminé, au sens philosophique, c'est seulement avoir une cause — ce
      qui peut très bien se produire sans aucun obstacle visible, comme
      devant un écran à 23h.

  - id: mc.philo.liberte.echapper-a-la-liberte
    label: "« On peut échapper à la liberté et à la responsabilité qu'elle implique »"
    description: >-
      L'élève croit qu'on peut se soustraire à la liberté (et à la
      responsabilité qu'elle engage) — soit en niant purement qu'elle existe
      malgré une thèse qui la redéfinit plutôt que la nier (Spinoza), soit
      en refusant de choisir (Sartre), soit en se prétendant intégralement
      déterminé par une cause extérieure (société, algorithme), soit en
      croyant qu'une solution pratique règle à elle seule le problème
      philosophique.
    contradicts_principle: >-
      Ne pas choisir est encore une manière de choisir (Sartre) ; redéfinir
      la liberté n'est pas la nier (Spinoza) ; et un déterminisme total, pris
      au pied de la lettre, dissoudrait aussi bien la responsabilité que la
      liberté — ce qui est un problème pour cette position, pas une
      échappatoire.

  - id: mc.philo.liberte.sentiment-de-liberte-suffit
    label: "« Si je sens que je choisis librement, alors je suis libre »"
    description: >-
      L'élève prend le sentiment ou la conscience de vouloir/décider comme
      une preuve suffisante de liberté, sans se demander s'il a conscience
      des causes qui produisent effectivement ce vouloir.
    contradicts_principle: >-
      Nous avons conscience de nos décisions sans avoir conscience de tout
      ce qui les cause. Le sentiment d'être libre, pris seul, ne prouve
      rien : il peut être celui de la pierre qui, lancée, se sent voler
      librement.

  - id: mc.philo.liberte.negative-confondue-avec-positive
    label: "« Liberté-absence-de-contrainte et liberté intérieure, c'est pareil »"
    description: >-
      L'élève traite comme identiques, ou mesure avec le même critère, la
      liberté comme absence d'obstacle extérieur et la liberté intérieure
      comme autonomie rationnelle — alors que les deux peuvent se dissocier.
    contradicts_principle: >-
      On peut être libre au sens de l'absence de contrainte extérieure sans
      l'être au sens intérieur : être maître de soi suppose d'agir selon ce
      qu'on juge vraiment bon, plutôt que sous l'effet de la peur, de la
      colère ou d'une habitude non choisie.

  - id: mc.philo.liberte.liberte-confondue-avec-pouvoir
    label: "« Être libre, c'est pouvoir tout faire »"
    description: >-
      L'élève confond la liberté (l'absence de nature qui déterminerait mes
      actes à l'avance, ou le droit d'agir dans un cadre donné) avec le
      pouvoir ou la capacité illimitée d'agir sur le monde.
    contradicts_principle: >-
      « L'homme est condamné à être libre » ne signifie pas qu'il peut tout
      faire — cela signifie qu'aucune nature ne le dispense de choisir et
      d'en porter la responsabilité, dans les limites bien réelles de ce
      qu'il peut concrètement accomplir.

  - id: mc.philo.liberte.loi-liberte-mal-articulees
    label: "« La loi et la liberté sont, par nature, opposées — ou automatiquement compatibles »"
    description: >-
      L'élève articule mal le rapport entre loi et liberté : soit il pense
      qu'une loi limite nécessairement la liberté individuelle, sans voir la
      possibilité rousseauiste d'une loi qu'on se prescrit à soi-même ; soit
      il pense, à l'inverse, que N'IMPORTE QUELLE loi rend libre du seul
      fait qu'on lui obéit, sans la condition de la volonté générale.
    contradicts_principle: >-
      « L'obéissance à la loi qu'on s'est prescrite est liberté » (Rousseau)
      — mais cela ne vaut que si la loi exprime réellement la volonté
      générale, pas n'importe quelle loi imposée par un pouvoir arbitraire.

  - id: mc.philo.liberte.licence-est-liberte-achevee
    label: "« Une société sans aucune loi serait la liberté la plus achevée »"
    description: >-
      L'élève croit que l'absence totale de règle commune constituerait la
      forme la plus complète de liberté, sans voir qu'une telle absence
      livre la liberté de chacun à la loi du plus fort.
    contradicts_principle: >-
      Si chacun pouvait vraiment faire tout ce qu'il veut, sans aucune
      limite, la liberté de chacun entrerait immédiatement en collision avec
      celle des autres — une liberté sans borne commune ne protège personne,
      elle finit par ne protéger que les plus puissants.

  - id: mc.philo.liberte.autrui-limite-par-nature
    label: "« Autrui est, par nature, une limite à ma liberté »"
    description: >-
      L'élève traite la présence d'autrui comme mécaniquement limitante pour
      ma liberté — chaque personne libre autour de moi serait, par
      construction, un obstacle de plus — sans envisager qu'elle puisse au
      contraire en être la condition.
    contradicts_principle: >-
      Pour Bakounine, la liberté d'autrui n'est pas une limite à la mienne :
      elle en est la condition nécessaire et la pleine confirmation — je ne
      suis réellement libre que par la liberté des autres ; c'est leur
      servitude, non leur liberté, qui se dresse entre moi et la liberté.

  - id: mc.philo.liberte.methode-dissertation-appliquee-mecaniquement
    label: "« Les gestes de la méthode (problématiser, placer un auteur) sont interchangeables »"
    description: >-
      L'élève traite la problématisation comme une simple reformulation du
      sujet en question fermée, ou pense qu'un auteur ne peut être mobilisé
      qu'une seule fois dans un plan, sans voir que chaque geste
      méthodologique a une fonction précise, propre à chaque étape.
    contradicts_principle: >-
      Une problématique n'est pas une reformulation : c'est la mise en
      évidence d'une tension entre deux positions également légitimes en
      apparence. Et un même auteur (Spinoza) peut revenir à deux moments
      différents d'un plan pour un usage différent à chaque fois.

items:
  - id: LIB-1
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [distinction_auteurs, spinoza, determinisme]
    stem: >
      Selon Spinoza, si nos actes sont déterminés par des causes nécessaires,
      qu'est-ce que cela implique pour la liberté ?
    type: mcq
    choices:
      - id: A
        text: "Nous ne sommes jamais libres : la liberté est une pure illusion, puisque tout événement obéit à une cause antérieure qui ne laisse aucune place au choix."
        correct: false
        misconception: mc.philo.liberte.echapper-a-la-liberte
        feedback: >
          Ce choix confond le déterminisme spinoziste avec une négation totale
          de la liberté. Spinoza ne dit pas que la liberté n'existe pas : il la
          redéfinit. Être libre, pour lui, ce n'est pas échapper aux causes
          (impossible), c'est être la cause adéquate de ses actes — agir à
          partir de sa propre raison plutôt que subir des causes extérieures
          non comprises. Nier toute liberté, c'est manquer ce déplacement.
      - id: B
        text: "Être libre ne consiste pas à échapper à la nécessité, mais à la comprendre et à agir comme cause rationnelle de ses actes."
        correct: true
      - id: C
        text: "Nous sommes libres uniquement dans les instants rares où aucune cause n'influence notre choix, la volonté agissant alors comme à partir de rien."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est la définition du libre arbitre comme indétermination totale —
          exactement ce que Spinoza écarte. Pour lui, rien n'échappe jamais à
          la nécessité, pas même l'esprit humain ; chercher des instants
          « sans cause » revient à chercher ce qui, selon lui, n'existe pas.
      - id: D
        text: "Le déterminisme ne concerne que les objets physiques : nos décisions, elles, échappent par nature à toute causalité, comme une pensée à la matière."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est l'inverse du geste de Spinoza. Il étend délibérément le
          déterminisme à l'esprit humain (nos volitions ont des causes,
          comme le mouvement d'un corps) — c'est justement ce point de départ
          qui rend nécessaire de repenser ce que « liberté » veut dire.
    correct_feedback: >
      Spinoza assume un déterminisme intégral, y compris pour l'esprit — puis
      déplace la question : elle ne porte plus sur l'existence d'une cause
      (toujours oui) mais sur sa nature (une cause comprise par la raison, ou
      une cause extérieure subie sans la voir). C'est ce déplacement, pas une
      négation de la liberté, qui définit sa position.
    solution: |
      **Le point de départ de Spinoza :** rien dans la nature n'échappe à la
      nécessité, pas même les décisions humaines — elles ont des causes,
      exactement comme un corps en mouvement.

      **L'erreur à ne pas commettre :** en conclure que la liberté n'existe
      donc pas. Ce n'est pas la thèse de Spinoza.

      **Ce qu'il fait à la place :** il redéfinit la liberté comme le fait
      d'être la cause *adéquate* de ses actes — de les comprendre par la
      raison — plutôt que d'en être le simple théâtre, ballotté par des
      causes externes ignorées (la servitude des passions). D'où la formule
      classique : la liberté n'est pas l'absence de nécessité, c'est la
      connaissance de la nécessité.

  - id: LIB-2
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [distinction_auteurs, sartre, responsabilite]
    stem: >
      Que signifie, chez Sartre, la formule « l'homme est condamné à être
      libre » ?
    type: mcq
    choices:
      - id: A
        text: "Que l'homme peut faire absolument tout ce qu'il désire, sans limite extérieure, puisqu'aucune nature préalable ne restreint le champ de ses actions."
        correct: false
        misconception: mc.philo.liberte.liberte-confondue-avec-pouvoir
        feedback: >
          Ce choix confond la liberté radicale de Sartre (l'absence de nature
          humaine préalable qui déterminerait nos actes) avec l'absence de
          toute limite ou circonstance extérieure — ce n'est pas ce qu'il
          affirme. Sartre parle de l'absence d'excuse par une nature donnée
          d'avance, pas d'un pouvoir sans limites sur le monde.
      - id: B
        text: "Que la liberté est une punition dont on peut se libérer en refusant de choisir : en restant passif, on échapperait à la responsabilité qu'elle implique."
        correct: false
        misconception: mc.philo.liberte.echapper-a-la-liberte
        feedback: >
          Pour Sartre, ne pas choisir est encore une manière de choisir : on
          ne peut pas s'extraire de la responsabilité en s'abstenant. Croire
          qu'un non-choix échappe à la liberté, c'est manquer exactement ce
          que « condamné » veut dire — on ne peut pas s'en défausser.
      - id: C
        text: "N'ayant pas de nature qui le détermine à l'avance, l'homme ne peut échapper à la nécessité de choisir et porte l'entière responsabilité de ses actes."
        correct: true
      - id: D
        text: "Que l'homme est entièrement déterminé par la société, et n'a donc aucune part de responsabilité dans ce qu'il devient au fil de son existence."
        correct: false
        misconception: mc.philo.liberte.echapper-a-la-liberte
        feedback: >
          C'est l'exact opposé de la position de Sartre. Il rejette
          précisément l'idée qu'une cause extérieure (la société, le milieu,
          une « nature ») puisse déterminer d'avance ce que je deviens et me
          décharger de ma responsabilité — c'est ce refus qu'il nomme
          « mauvaise foi » quand on s'en sert comme excuse.
    correct_feedback: >
      Pour Sartre, « l'existence précède l'essence » : aucune nature humaine
      préalable ne dicte ce que je dois devenir. « Condamné » signifie que je
      n'ai pas choisi d'exister ni de devoir sans cesse choisir ; « libre »
      signifie qu'aucune cause définitive ne me dispense de la responsabilité
      entière de mes actes.
    solution: |
      **Le point de départ :** contrairement à un objet fabriqué (dont
      l'essence précède l'existence), l'être humain n'a pas de nature
      donnée d'avance qui déterminerait ce qu'il doit devenir — « l'existence
      précède l'essence ».

      **La conséquence tirée sans concession :** rien ne peut m'excuser
      (« c'est ma nature », « mon milieu m'a fait ainsi »). Se présenter
      comme déterminé pour fuir cette responsabilité, c'est la *mauvaise
      foi*.

      **D'où la formule :** condamné (on n'a pas choisi de devoir choisir),
      libre (rien ne détermine d'avance ce choix) — donc entièrement
      responsable.

  - id: LIB-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_liberte
    tags: [distinction_auteurs, rousseau, montesquieu, politique]
    stem: >
      Pour Rousseau, en quel sens obéir à la loi peut-il être un acte de
      liberté plutôt qu'une simple contrainte ?
    type: mcq
    choices:
      - id: A
        text: "Parce que toute loi, quelle que soit son origine, doit être obéie sans discussion dès qu'elle est votée par une autorité en place, même si son contenu ne reflète en rien les intérêts de la majorité qui doit s'y plier."
        correct: false
        misconception: mc.philo.liberte.loi-liberte-mal-articulees
        feedback: >
          Ce choix oublie la condition posée par Rousseau : la loi n'est
          libératrice que si elle exprime la volonté générale, c'est-à-dire
          si le citoyen y a lui-même part. Une loi imposée par un pouvoir
          arbitraire, sans que les citoyens y participent, n'est précisément
          pas ce dont parle Rousseau — c'est l'inverse même de sa position.
      - id: B
        text: "Parce qu'en obéissant à une loi qui exprime la volonté générale, à laquelle il participe comme citoyen, l'individu obéit en un sens à sa propre volonté rationnelle plutôt qu'à un pouvoir extérieur arbitraire."
        correct: true
      - id: C
        text: "Parce que la loi supprime toute liberté individuelle au profit du collectif, ce qui est justement le but recherché par toute organisation politique digne de ce nom."
        correct: false
        misconception: mc.philo.liberte.loi-liberte-mal-articulees
        feedback: >
          C'est une caricature de la thèse de Rousseau : il ne dit pas que la
          liberté individuelle doit disparaître au profit du groupe, mais
          que la loi, quand elle exprime la volonté générale, est une forme
          d'auto-législation — le citoyen s'obéit, en un sens, à lui-même.
      - id: D
        text: "Parce qu'une société sans aucune loi serait la forme la plus achevée de la liberté, chacun y disposant enfin d'un espace d'action totalement dégagé de toute règle commune."
        correct: false
        misconception: mc.philo.liberte.licence-est-liberte-achevee
        feedback: >
          C'est exactement la thèse naïve (la licence) que Rousseau et
          Montesquieu écartent : une liberté sans aucune règle commune permet
          au plus fort d'écraser les autres. « L'impulsion du seul appétit
          est esclavage » selon Rousseau — pas l'absence de loi qui rendrait
          libre.
    correct_feedback: >
      Rousseau distingue l'impulsion du seul appétit, qu'il qualifie
      d'esclavage, de « l'obéissance à la loi qu'on s'est prescrite », qu'il
      qualifie de liberté. Cela ne vaut que si la loi exprime réellement la
      volonté générale — pas n'importe quelle loi imposée sans le consentement
      des citoyens.
    solution: |
      **Le problème que pose l'intuition naïve :** si la loi est vue comme
      une pure contrainte extérieure, moins de lois semblerait signifier plus
      de liberté — jusqu'à l'absence totale de règle (la licence).

      **Pourquoi cette absence de règle échoue :** sans limite commune, la
      liberté de chacun entre en collision avec celle des autres ; le plus
      fort impose sa volonté (Montesquieu).

      **Le déplacement de Rousseau :** dans une société légitime, la loi est
      ce que la communauté des citoyens se prescrit collectivement à
      elle-même (la volonté générale). Y obéir, ce n'est donc pas obéir à un
      autre, mais à sa propre volonté rationnelle telle qu'elle s'exprime
      collectivement — à condition que la loi exprime réellement cette
      volonté générale, et non l'arbitraire d'un seul.

  - id: LIB-4
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_liberte
    tags: [distinction_auteurs, spinoza, sartre, synthese]
    stem: >
      Quelle est la différence essentielle entre la conception de la liberté
      chez Spinoza et chez Sartre ?
    type: mcq
    choices:
      - id: A
        text: "Spinoza pense qu'aucune cause ne détermine jamais nos actes, alors que Sartre pense au contraire que tout est déterminé d'avance par la société et l'éducation — les deux philosophes se rejoignent seulement dans le vocabulaire qu'ils emploient, pas dans leurs thèses réelles."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est l'inverse des deux positions. Spinoza assume au contraire un
          déterminisme intégral (tout a une cause, y compris l'esprit) ; et
          Sartre refuse précisément l'idée qu'une cause sociale ou une nature
          préalable détermine d'avance ce que devient un individu — c'est ce
          refus qui fonde sa responsabilité absolue.
      - id: B
        text: "Spinoza soutient que nous sommes toujours déterminés par des causes mais pouvons devenir libres en les comprenant par la raison ; Sartre soutient qu'aucune nature humaine préalable ne nous détermine, ce qui rend la liberté totale et la responsabilité absolue."
        correct: true
      - id: C
        text: "Les deux philosophes affirment exactement la même chose : la liberté consiste à ignorer les causes de ses actes, qu'elles soient intérieures comme le tempérament ou extérieures comme le milieu social."
        correct: false
        misconception: mc.philo.liberte.sentiment-de-liberte-suffit
        feedback: >
          C'est un contresens partagé sur les deux positions. Pour Spinoza,
          ignorer les causes est justement la situation de la « pierre qui
          vole » qui se croit libre à tort — l'inverse de la liberté. Sartre,
          de son côté, ne parle pas d'ignorer des causes mais d'assumer
          qu'il n'y en a pas qui nous dispenseraient de choisir.
      - id: D
        text: "Spinoza et Sartre nient tous deux, chacun à sa manière, l'existence de toute liberté humaine, l'un en dissolvant le sujet dans la nécessité universelle, l'autre en le dissolvant dans les déterminismes sociaux."
        correct: false
        misconception: mc.philo.liberte.echapper-a-la-liberte
        feedback: >
          Aucun des deux ne nie la liberté : chacun la redéfinit. Spinoza en
          fait une affaire de compréhension rationnelle des causes qui nous
          déterminent ; Sartre en fait une responsabilité absolue, faute de
          toute nature qui pourrait nous en dispenser. Conclure qu'ils
          nient « la liberté » tout court aplatit deux positions opposées
          en une seule caricature.
    correct_feedback: >
      Les deux prémisses sont incompatibles : Spinoza part d'un déterminisme
      universel (y compris pour l'esprit) et fait de la liberté une question
      de compréhension rationnelle des causes ; Sartre part au contraire de
      l'absence de toute nature humaine préalable, ce qui rend le choix
      inévitable et la responsabilité totale, sans excuse possible.
    solution: |
      **Chez Spinoza :** rien n'échappe à la nécessité ; être libre, c'est
      comprendre les causes qui nous déterminent et en devenir la cause
      rationnelle, plutôt que les subir sans les voir (la servitude des
      passions).

      **Chez Sartre :** il n'existe aucune nature humaine préalable qui
      déterminerait nos actes à l'avance (« l'existence précède
      l'essence ») ; nous sommes donc condamnés à choisir sans cesse, et
      rien ne peut excuser ce que nous devenons.

      **Le point commun malgré tout :** ni l'un ni l'autre ne réduit la
      liberté à une pure indétermination sans cause — mais les deux
      partent de prémisses opposées sur le déterminisme lui-même. Les
      confondre sous prétexte qu'ils parlent tous deux de « liberté » et de
      « causes » est l'erreur la plus fréquente sur ces deux auteurs.

  - id: LIB-5
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_liberte
    tags: [accroche, tension_introductive, determinisme, libre_arbitre]
    stem: >
      Dans la mise en scène du téléphone à 23h (chapitre 1), pourquoi la réponse
      « Je suis libre, je pourrais arrêter si je voulais » pose-t-elle un
      problème, telle que le texte la présente ?
    type: mcq
    choices:
      - id: A
        text: "Parce que rien ne t'empêche d'arrêter et que, pourtant, tu ne le fais pas pendant une heure : ta conduite réelle contredit la volonté que tu annonces."
        correct: true
      - id: B
        text: "Parce qu'une porte fermée à clé t'empêche réellement d'éteindre ton téléphone à cet instant, ce qui expliquerait pourquoi tu restes malgré la volonté que tu avais annoncée."
        correct: false
        misconception: mc.philo.liberte.contrainte-egale-determination
        feedback: >
          La scène ne comporte aucun obstacle extérieur identifiable —
          c'est précisément ce qui la rend intéressante : rien ne
          contraint, et pourtant l'action annoncée n'a pas lieu. Confondre
          « être empêché » et « ne pas agir comme on l'a annoncé », c'est
          confondre contrainte extérieure et défaillance de la volonté.
      - id: C
        text: "Parce que cela démontre, sans discussion possible, que le déterminisme est vrai et que le libre arbitre n'existe pas — la scène tranche déjà, à elle seule, la question posée par toute la leçon."
        correct: false
        misconception: mc.philo.liberte.faux-dilemme-libre-arbitre-determinisme
        feedback: >
          Le texte ne tranche pas ainsi : il expose une tension, pas une
          démonstration définitive en faveur du déterminisme. Conclure
          aussi vite revient à sauter par-dessus le problème que la leçon
          va justement construire.
      - id: D
        text: "Parce qu'en réalité, vouloir et agir sont toujours parfaitement alignés chez un individu libre, donc cette situation est sans intérêt philosophique et ne mérite pas qu'on s'y attarde davantage."
        correct: false
        misconception: mc.philo.liberte.libre-arbitre-exige-absence-de-cause
        feedback: >
          C'est nier la tension même que le texte met en scène : le
          décalage entre la volonté annoncée (« j'arrête ») et l'acte réel
          (rester) est justement ce qui pose problème, pas une anomalie
          sans intérêt.
    correct_feedback: >
      Le texte pointe une contradiction entre ce que tu dis vouloir et ce
      que tu fais réellement — sans qu'aucun obstacle extérieur ne
      l'explique. C'est cette contradiction, non résolue, qui ouvre le
      problème de la leçon.
    solution: |
      **Ce que dit la scène :** rien, à 23h, ne t'empêche d'éteindre
      l'écran — aucune porte fermée, aucune interdiction.

      **Le problème :** tu ne le fais pourtant pas, alors que tu l'avais
      annoncé. Ta conduite contredit ta volonté déclarée.

      **Ce que cela ouvre :** soit ta liberté ne pèse pas grand-chose face
      à l'habitude, soit ton « vouloir arrêter » n'était pas sincère — la
      leçon ne tranche pas encore, elle pose le problème.

  - id: LIB-6
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_liberte
    tags: [accroche, tension_introductive, determinisme, responsabilite]
    stem: >
      Toujours à propos de la scène du téléphone, pourquoi la réponse
      « Je ne suis pas libre, l'algorithme a décidé à ma place » pose-t-elle,
      elle aussi, un problème selon le texte ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'en réalité, aucune application n'est conçue pour influencer le comportement de ses utilisateurs — ce sont des outils neutres, dont l'usage ne dépend que de la volonté de la personne qui les tient."
        correct: false
        misconception: mc.philo.liberte.contrainte-egale-determination
        feedback: >
