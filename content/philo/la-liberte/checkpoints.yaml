# In-lesson checkpoint items (summit-conversion campaign — PHILO PILOT).
# Formative, calm-core probes placed inside the lesson via [[checkpoint:<id>]]
# markers — NOT the end bank (items.yaml). Same item schema, but NO
# score/streak/tally. Wrong-answer feedback names the wrong PHILOSOPHICAL
# model, not just the fact of being wrong. The end-bank ≥3-per-misconception
# floor lives in items.yaml's coverage_summary and is NOT altered by these
# checkpoints (a clone or a fresh item here is surfaced inline, never
# re-counted toward that floor — house convention, see rlc-serie/
# probabilites-conditionnelles/analyse-de-texte's checkpoints.yaml headers).
#
# EVERY distractor carries a real `misconception:` id (no null tags) — the
# task's stricter-than-house-default instruction, matched here to items.yaml.
# Placement (ids match the [[checkpoint:…]] markers in lesson.md):
#   cp-r0-predict  (in R0)      — commit-gate. Probes the master model:
#                                 faux-dilemme-libre-arbitre-determinisme.
#   cp-r1-rupture  (after R1)   — rupture gate: contrainte ≠ détermination
#                                 (primary), libre-arbitre-sans-cause (dual).
#   cp-r2-spinoza  (after R2)   — rupture gate: le sentiment de liberté ne
#                                 prouve rien (primary), echapper-a-la-liberte
#                                 (dual, the R2 "erreur classique à éviter").
#   cp-r3-pouvoir  (after R3, Sartre subsection) — rupture gate: liberté
#                                 confondue avec pouvoir — an under-floor
#                                 model in items.yaml (2/15), reinforced here.
#   cp-r3-loi      (after R3, Rousseau/Montesquieu subsection) — rupture
#                                 gate: loi-liberte-mal-articulees — the
#                                 thinnest model in items.yaml (1/15).
#   cp-bac-autrui  (before [[exercise:r-bac]]) — rupture gate: autrui n'est
#                                 pas par nature une limite — the ONE model
#                                 in the inventory with ZERO items.yaml
#                                 coverage (a genuinely new axis, see
#                                 items.yaml's coverage_summary notes);
#                                 primes the misconception right before the
#                                 Bakounine text that turns on it.
#
# Length rebalance (recipe's philo addendum, mandatory): every stem below was
