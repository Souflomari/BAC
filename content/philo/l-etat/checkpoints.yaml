#                                    hobbes (primary, R3's own box).
#   cp-r4-rousseau    (after R4)   — rupture gate: volonte-generale-
#                                    confondue-volonte-de-tous (primary, R4's
#                                    own box), rousseau-hobbes-mecanismes-
