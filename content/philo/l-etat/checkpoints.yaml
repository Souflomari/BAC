notion: l-etat
skill_code: philo_etat

checkpoints:

  # ════════════════════════════════════════════════════════════════
  # CP-0 | id: cp-r0-predict | placed IN R0 (right after the two spontaneous
  #        answers are listed, before the reveal "Les deux réponses semblent
  #        raisonnables..."). Turns "prends position... réponds en une
  #        phrase" into a real MCQ commit. Probes the master model.
  # ════════════════════════════════════════════════════════════════

  - id: cp-r0-predict
    rung: "R0"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, hook_commit]
    primary_misconception: mc.philo.etat.faux-dilemme-protection-contrainte
    item_source: original
    lesson_placement: in_R0

    stem: |-
      Avant de lire la suite : engage-toi. Laquelle de ces quatre façons de
      juger la scène de la panne de courant te semble la meilleure ?

    type: mcq
    choices:
      - id: A
        text: "Sans aucun doute : sans policiers ni sanction immédiate, la plupart des gens profiteraient de l'occasion — l'ordre habituel ne tient qu'à la peur d'être vu et puni, rien de plus."
        correct: false
        misconception: mc.philo.etat.faux-dilemme-protection-contrainte
        feedback: |-
          Modèle détecté : choisir le camp « tout tient à la peur du
          gendarme » pour clore la question. Mais alors pourquoi la plupart
          des quartiers, plongés dans la même obscurité, n'ont-ils connu
          aucun pillage ? La surveillance a disparu partout à la fois ;
          le désordre, lui, ne s'est pas généralisé.

      - id: B
        text: "Certainement pas : les individus ne sont pas fondamentalement dangereux les uns pour les autres, donc une nuit entière sans aucune autorité visible ne changerait rien au comportement de la plupart d'entre eux, quelle que soit la durée de l'absence de surveillance."
        correct: false
        misconception: mc.philo.etat.faux-dilemme-protection-contrainte
        feedback: |-
          Modèle détecté : choisir le camp inverse pour clore la question
          tout aussi vite. Mais si les individus livrés à eux-mêmes ne
          posaient vraiment aucun problème structurel, pourquoi aucune
          société, même la plus paisible, n'a-t-elle jamais renoncé à une
          force publique et à une autorité commune ?

      - id: C
        text: "Aucune des deux, prise seule, ne suffit : la première est contredite par le calme observé dans la plupart des quartiers, la seconde par le fait qu'aucune société n'a jamais renoncé à une autorité commune — c'est cette tension que la leçon va construire."
        correct: true
        feedback: |-
          Exact — et c'est le réflexe à garder pour toute la leçon : ni
          « tout tient à la peur du gendarme » ni « les individus ne posent
          jamais problème sans autorité » ne suffit à rendre compte de ce
          qui s'est passé cette nuit-là. Les positions qui suivent ne
          trancheront pas en piochant un camp — elles déplaceront le
          problème vers la question de la légitimité.

      - id: D
        text: "La question n'a en réalité aucune réponse générale possible : tout dépend uniquement du quartier précis et de la nuit précise, ce qui rend toute réflexion philosophique sur ce point strictement vaine."
        correct: false
        misconception: mc.philo.etat.probleme-legitimite-reduit
        feedback: |-
          Modèle détecté : dissoudre le problème dans le pur cas par cas
          plutôt que l'affronter. Le problème que pose la scène n'est pas
          une question de circonstances locales — il est réel, précis, et
          la leçon va le construire pièce par pièce, pas le déclarer sans
          objet général.

  # ════════════════════════════════════════════════════════════════
  # CP-1 | id: cp-r1-concepts | placed AFTER R1
  #        Probes: gouvernement-confondu-avec-etat (primary),
  #        coup-etat-detruit-appareil (dual, choice C — R1's own box)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r1-concepts
    rung: "R1"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat]
    primary_misconception: mc.philo.etat.gouvernement-confondu-avec-etat
    item_source: original
    lesson_placement: after_R1

    stem: |-
      Un présentateur télé annonce : « Après ce coup d'État, plus rien ne
      reste de l'ancien État — tout a été détruit et reconstruit à zéro par
      les nouveaux dirigeants. » Que répondre, à la lumière du chapitre 2 ?

    type: mcq
    choices:
      - id: A
        text: "C'est inexact sur deux points à la fois : un coup d'État ne capture que le gouvernement, pas l'appareil d'État permanent qui survit le plus souvent intact ; et de toute façon, ce ne serait jamais qu'un changement de gouvernement, pas un changement d'État."
        correct: true
        feedback: |-
          Exact. Le chapitre 2 distingue les deux : un coup d'État désigne,
          historiquement, la prise par la force du pouvoir exécutif — le
          gouvernement. L'appareil d'État lui-même — tribunaux,
          administration, armée — survit le plus souvent intact et se
          retrouve simplement capturé par de nouvelles mains.

      - id: B
        text: "Le présentateur a raison : les tribunaux, l'administration et l'armée sont systématiquement démantelés et intégralement remplacés lors de tout coup d'État réussi, sans la moindre exception documentée dans l'histoire politique récente, quel que soit le pays ou le siècle concerné."
        correct: false
        misconception: mc.philo.etat.coup-etat-detruit-appareil
        feedback: |-
          Modèle détecté : confondre la capture du gouvernement avec la
          destruction de l'appareil d'État. Le chapitre 2 le dit explicitement :
          l'expression « coup d'État » prête à confusion — elle vise le
          pouvoir exécutif, pas l'appareil permanent, qui continue le plus
          souvent de fonctionner sous de nouvelles mains.

      - id: C
        text: "Le présentateur a en partie raison, à ceci près qu'un gouvernement, une fois renversé, redevient automatiquement un État différent, gouvernement et État désignant en réalité une seule et même chose vue sous deux angles."
        correct: false
        misconception: mc.philo.etat.gouvernement-confondu-avec-etat
        feedback: |-
          Modèle détecté : traiter gouvernement et État comme deux noms
          pour la même réalité. Le trait décisif du gouvernement, dit R1,
          est qu'il change ; celui de l'État est qu'il subsiste
          précisément À TRAVERS ces changements — ce n'est pas un simple
          jeu de mots.

      - id: D
        text: "Le présentateur a tort, mais pour une tout autre raison : ce sont les frontières du pays qui disparaissent lors d'un coup d'État, pas l'appareil administratif ou judiciaire."
        correct: false
        misconception: mc.philo.etat.coup-etat-detruit-appareil
        feedback: |-
          Modèle détecté, sous une autre forme : imaginer qu'un coup
          d'État emporte un élément de l'État permanent — ici les
          frontières — plutôt que de saisir qu'il ne change, au fond, que
          qui exerce le pouvoir exécutif.

    correct_feedback: |-
      Un coup d'État désigne la prise par la force du pouvoir exécutif — le
      gouvernement — pas la destruction de l'appareil d'État permanent, qui
      survit le plus souvent intact et se retrouve simplement capturé par de
      nouvelles mains.

  # ════════════════════════════════════════════════════════════════
  # CP-2 | id: cp-r2-hobbes | placed AFTER R2
  #        Probes: etat-de-nature-recit-historique (primary),
  #        auteurs-contrat-social-mal-attribues (dual, choice D — R2's box)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r2-hobbes
    rung: "R2"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, hobbes]
    primary_misconception: mc.philo.etat.etat-de-nature-recit-historique
    item_source: original
    lesson_placement: after_R2

    stem: |-
      Un élève écrit : « Des archéologues ont retrouvé des preuves que les
      premiers hommes vivaient bien dans une guerre de tous contre tous,
      exactement comme le montre Rousseau dans le Léviathan. » Que répondre ?

    type: mcq
    choices:
      - id: A
        text: "Deux erreurs à la fois : le Léviathan et la guerre de tous contre tous sont de Hobbes, pas de Rousseau ; et Hobbes ne prétend de toute façon pas prouver un fait archéologique — il construit une expérience de pensée pour faire apparaître, par contraste, ce que l'État apporte."
        correct: true
        feedback: |-
          Exact. Les deux erreurs se cumulent ici. D'une part, c'est Hobbes,
          non Rousseau, qui écrit le Léviathan et pose la guerre de tous
          contre tous. D'autre part, cette guerre n'est pas présentée comme
          un fait vérifié par des preuves matérielles : c'est un outil de
          raisonnement, pas un récit historique à confirmer sur le terrain.

      - id: B
        text: "L'élève a raison sur les deux points : Hobbes a effectivement mené, dans le Léviathan, une enquête archéologique rigoureuse pour établir ce fait historique avant l'invention de l'État."
        correct: false
        misconception: mc.philo.etat.etat-de-nature-recit-historique
        feedback: |-
          Modèle détecté : traiter l'état de nature comme un fait
          archéologique vérifié plutôt qu'une expérience de pensée. Hobbes
          ne mène aucune enquête de terrain — il imagine, par la pensée, ce
          que serait la condition humaine sans autorité commune.

      - id: C
        text: "L'élève a tort sur l'attribution de l'œuvre à Rousseau, mais l'idée que des preuves archéologiques confirmeraient la guerre de tous contre tous reste, quant à elle, parfaitement exacte, sérieusement établie par le terrain et pleinement recevable dans n'importe quelle copie de baccalauréat."
        correct: false
        misconception: mc.philo.etat.etat-de-nature-recit-historique
        feedback: |-
          Modèle détecté, à moitié corrigé : reconnaître l'erreur d'auteur
          sans voir que la seconde erreur — traiter l'état de nature comme
          un fait archéologique — reste, elle aussi, un contresens sur la
          nature même de la démarche de Hobbes.

      - id: D
        text: "L'élève se trompe seulement de titre d'ouvrage : c'est bien Rousseau qui défend la thèse de la guerre de tous contre tous, mais dans Du contrat social plutôt que dans le Léviathan."
        correct: false
        misconception: mc.philo.etat.auteurs-contrat-social-mal-attribues
        feedback: |-
          Modèle détecté : corriger le titre sans corriger l'auteur. La
          thèse de la guerre de tous contre tous appartient à Hobbes ; dans
          Du contrat social, Rousseau défend au contraire une image
          nettement plus paisible de l'état de nature, précisément pour
          contester la vision hobbesienne.

    correct_feedback: |-
      Le Léviathan et la guerre de tous contre tous sont de Hobbes, pas de
      Rousseau — et cette guerre n'est de toute façon pas présentée comme un
      fait historique vérifié : c'est une expérience de pensée destinée à
      faire apparaître, par contraste, ce que l'État apporte.

  # ════════════════════════════════════════════════════════════════
  # CP-3 | id: cp-r3-locke | placed AFTER R3
  #        Probes: locke-variante-affaiblie-hobbes (primary, R3's own box)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r3-locke
    rung: "R3"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, locke]
    primary_misconception: mc.philo.etat.locke-variante-affaiblie-hobbes
    item_source: original
    lesson_placement: after_R3

    stem: |-
      Un camarade résume ainsi le chapitre 4 : « Locke, c'est juste un Hobbes en plus
      doux — les mêmes idées, avec un peu moins de fermeté. » Que répondre ?

    type: mcq
    choices:
      - id: A
        text: "C'est une erreur de degré ET de nature : chez Locke, des droits (vie, liberté, propriété) préexistent au contrat et le pouvoir reste conditionnel et révocable ; chez Hobbes, les droits naissent du contrat et le pouvoir souverain est quasi irrévocable — deux structures différentes, pas deux versions d'une même thèse."
        correct: true
        feedback: |-
          Exact — c'est précisément le point de vigilance du chapitre 4 : ne jamais
          présenter Locke comme une simple variante affaiblie de Hobbes.
          Les deux théories divergent sur un point de fond (l'origine des
          droits, la révocabilité du pouvoir), pas sur un simple degré de
          sévérité.

      - id: B
        text: "Il a raison : Locke accepte, tout comme Hobbes, un pouvoir souverain quasi absolu et irrévocable une fois le contrat conclu, avec seulement un ton légèrement moins autoritaire dans l'écriture et un vocabulaire un peu plus mesuré d'un auteur à l'autre."
        correct: false
        misconception: mc.philo.etat.locke-variante-affaiblie-hobbes
        feedback: |-
          Modèle détecté : réduire la différence à une question de ton.
          C'est précisément l'inverse — chez Locke, le pouvoir politique
          est un mandat de confiance conditionnel, révocable si le
          gouvernement trahit sa mission de protection des droits.

      - id: C
        text: "Il a raison, et pour une raison plus profonde encore : Locke penserait que l'état de nature est en réalité plus violent, plus instable et plus dangereux au quotidien que ne le décrit déjà Hobbes lui-même, ce qui justifierait à ses yeux un pouvoir souverain encore plus ferme, plus centralisé et plus difficile à contester une fois institué."
        correct: false
        misconception: mc.philo.etat.locke-variante-affaiblie-hobbes
        feedback: |-
          Modèle détecté, en sens inverse : l'état de nature de Locke est
          un état d'égalité et de liberté, gouverné en partie par la
          raison — bien moins violent que la guerre de tous contre tous de
          Hobbes, pas plus.

      - id: D
        text: "Il a tort, mais pas pour la bonne raison : Locke nierait en réalité l'existence même d'un état de nature antérieur à l'État, contrairement à Hobbes qui en fait le point de départ de toute sa théorie."
        correct: false
        misconception: mc.philo.etat.locke-variante-affaiblie-hobbes
        feedback: |-
          Modèle détecté : nier ce que Locke affirme pourtant clairement.
          Locke propose bien un état de nature — un portrait très
          différent de celui de Hobbes, où des droits naturels existent
          déjà, mais restent fragiles faute de juge et de force communs.

    correct_feedback: |-
      Locke et Hobbes divergent sur un point structurel, pas sur un degré de
      sévérité : l'origine des droits (avant le contrat chez Locke, à partir
      de lui chez Hobbes) et la révocabilité du pouvoir (conditionnelle chez
      Locke, quasi irrévocable chez Hobbes).

  # ════════════════════════════════════════════════════════════════
  # CP-4 | id: cp-r4-rousseau | placed AFTER R4
  #        Probes: volonte-generale-confondue-volonte-de-tous (primary, R4's
  #        own box), rousseau-hobbes-mecanismes-confondus (dual, choice C)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r4-rousseau
    rung: "R4"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, rousseau]
    primary_misconception: mc.philo.etat.volonte-generale-confondue-volonte-de-tous
    item_source: original
    lesson_placement: after_R4

    stem: |-
      Dans une assemblée, chacun vote uniquement selon son intérêt personnel
      immédiat (moins d'impôts pour moi, plus d'avantages pour mon groupe).
      Le résultat du vote exprime-t-il, pour Rousseau, la volonté générale ?

    type: mcq
    choices:
      - id: A
        text: "Non : ce résultat n'exprime que la volonté de tous, la simple addition d'intérêts privés qui peuvent se neutraliser sans jamais viser autre chose que ces intérêts juxtaposés — la volonté générale, elle, vise spécifiquement l'intérêt commun."
        correct: true
        feedback: |-
          Exact. Le chapitre 5 distingue soigneusement les deux : la volonté de tous
          additionne des intérêts particuliers, qui peuvent parfaitement se
          neutraliser entre eux ; la volonté générale vise ce qui est bon
          pour la communauté EN TANT QUE telle, au-delà de la simple somme
          des préférences privées.

      - id: B
        text: "Oui : la volonté générale n'est, chez Rousseau, rien d'autre que le résultat d'un vote majoritaire, quelle que soit la façon dont chaque citoyen a raisonné avant de voter."
        correct: false
        misconception: mc.philo.etat.volonte-generale-confondue-volonte-de-tous
        feedback: |-
          Modèle détecté : confondre la procédure (le vote) avec ce qu'elle
          est censée viser. Un vote majoritaire peut parfaitement n'exprimer
          que la volonté de tous — une résultante d'intérêts privés en
          concurrence — sans jamais dégager la volonté générale.

      - id: C
        text: "Oui, dans tous les cas et sans exception possible : dès qu'une assemblée vote, son résultat exprimerait nécessairement la décision d'un souverain séparé des citoyens qui la composent, exactement comme le pouvoir issu du contrat chez Hobbes."
        correct: false
        misconception: mc.philo.etat.rousseau-hobbes-mecanismes-confondus
        feedback: |-
          Modèle détecté : appliquer à Rousseau le schéma hobbesien d'un
          souverain séparé des sujets. Chez Rousseau, il n'existe pas de
          tiers séparé auquel les citoyens transféreraient leur droit — la
          volonté générale est celle du corps politique lui-même, dont
          chaque citoyen est membre à part égale.

      - id: D
        text: "Non, mais pour une autre raison : un vote ne peut jamais rien exprimer de collectif chez Rousseau, la seule volonté légitime étant, dans tous les cas, celle d'un individu isolé délibérant seul."
        correct: false
        misconception: mc.philo.etat.volonte-generale-confondue-volonte-de-tous
        feedback: |-
          Modèle détecté, en sens inverse : nier toute dimension collective
          légitime chez Rousseau. C'est l'inverse de sa thèse — la volonté
          générale EST précisément une volonté collective, celle du corps
          politique visant l'intérêt commun, pas celle d'un individu isolé.

    correct_feedback: |-
      La volonté de tous additionne des intérêts particuliers, qui peuvent se
      neutraliser sans rien viser de commun. La volonté générale vise
      spécifiquement le bien de la communauté en tant que telle — un vote
      démocratique n'y parvient que si chacun se demande ce qui est bon pour
      tous, pas ce qui l'avantage lui.

  # ════════════════════════════════════════════════════════════════
  # CP-5 | id: cp-r5-force-droit | placed AFTER R5
  #        Probes: force-egale-droit (primary — under-floor in items.yaml,
  #        and the axis the r-bac citation turns on), legitimite-weber-mal-
  #        comprise (dual, choice D — R5's "Point de vigilance" box)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r5-force-droit
    rung: "R5"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, rousseau, weber]
    primary_misconception: mc.philo.etat.force-egale-droit
    item_source: original
    lesson_placement: after_R5

    stem: |-
      Un régime accède au pouvoir par un coup de force et gouverne, depuis,
      uniquement par l'intimidation constante de la population. Un élève
      conclut : « Puisqu'il gouverne encore après dix ans, la force a suffi
      à fonder durablement son pouvoir. » Que répondrait Rousseau ?

    type: mcq
    choices:
      - id: A
        text: "Que dix années de durée ne prouvent rien : tant que ce pouvoir reste une pure contrainte non convertie en droit reconnu, il demeure structurellement instable — la moindre défaillance de l'intimidation suffirait à faire cesser l'obéissance, faute d'avoir jamais été un devoir reconnu comme tel."
        correct: true
        feedback: |-
          Exact. « Le plus fort n'est jamais assez fort pour être toujours
          le maître, s'il ne transforme sa force en droit. » Une soumission
          fondée sur la seule force dure exactement aussi longtemps que la
          force elle-même s'exerce sans faiblir — la durée observée ne
          garantit rien sur l'avenir, elle ne fait que retarder l'épreuve.

      - id: B
        text: "Que la durée du régime est, à elle seule, la meilleure preuve de sa légitimité : un pouvoir qui dure dix ans par la seule intimidation a, par ce fait même, transformé sa force en droit reconnu."
        correct: false
        misconception: mc.philo.etat.force-egale-droit
        feedback: |-
          Modèle détecté : confondre durée observée et conversion en
          droit. Rousseau dit l'inverse : la force, prise seule, ne
          produit qu'une soumission qui dure aussi longtemps qu'elle
          s'exerce — jamais un devoir reconnu comme tel par celui qui obéit.

      - id: C
        text: "Que ce cas ne relève pas vraiment de la question force/droit : dix ans de gouvernement effectif suffisent, en soi et indépendamment de tout autre critère, à faire de n'importe quel régime un État de droit à part entière."
        correct: false
        misconception: mc.philo.etat.legitimite-weber-mal-comprise
        feedback: |-
          Modèle détecté : traiter la seule durée d'exercice du pouvoir
          comme équivalente à la légitimité reconnue par Weber. Le monopole
          wébérien porte sur ce qui est reconnu comme autorisé à juger des
          usages légitimes de la force — pas sur la simple capacité à
          durer par l'intimidation.

      - id: D
        text: "Que ce régime détient, par cette seule intimidation constante et sans qu'aucune autre condition ne soit jamais requise, le monopole de la violence physique légitime au sens de Weber, puisqu'il serait bien le seul à pouvoir matériellement exercer une contrainte sur l'ensemble du territoire national."
        correct: false
        misconception: mc.philo.etat.legitimite-weber-mal-comprise
        feedback: |-
          Modèle détecté : réduire le monopole wébérien à une capacité
          matérielle à exercer la force. Il ne s'agit pas de savoir qui
          PEUT, physiquement, contraindre — un individu peut toujours se
          défendre dans certaines limites — mais qui est reconnu comme
          autorisé à juger quels usages de la force sont légitimes.

    correct_feedback: |-
      Une soumission fondée sur la seule force ne dure jamais que le temps où
      la force elle-même s'exerce sans faiblir : ce n'était jamais qu'une
      contrainte, pas un devoir reconnu. Dix ans de durée n'y changent rien
      tant que cette force n'est convertie en rien d'autre.

  # ════════════════════════════════════════════════════════════════
  # CP-6 | id: cp-r6-critiques | placed AFTER R6
  #        Probes: critiques-etat-non-distinguees (primary, R6's own box),
  #        etat-neutre-arbitre-non-conteste (dual, choice D — under-floor in
  #        items.yaml, backs r-variation's axis)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r6-critiques
    rung: "R6"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, marx, anarchisme]
    primary_misconception: mc.philo.etat.critiques-etat-non-distinguees
    item_source: original
    lesson_placement: after_R6

    stem: |-
      Un élève résume ainsi le chapitre 7 : « Marx, les anarchistes et les défenseurs de
      l'État de droit critiquent tous l'État existant, donc ils proposent
      au fond le même remède. » Que répondre ?

    type: mcq
    choices:
      - id: A
        text: "C'est effacer trois remèdes distincts : Marx veut s'emparer de l'État à titre transitoire avant sa disparition, les anarchistes veulent l'abolir d'emblée quel qu'en soit le titulaire, et l'État de droit veut seulement le limiter et le contrôler par le droit, sans l'abolir ni le transformer économiquement."
        correct: true
        feedback: |-
          Exact — c'est précisément l'erreur à éviter du chapitre 7 : ne pas
          fondre ensemble ces trois critiques, qui répondent à des
          questions différentes et proposent des remèdes différents, même
          si toutes trois critiquent, à des degrés divers, le pouvoir
          étatique.

      - id: B
        text: "Il a raison, à un détail près sans importance : seul l'ordre chronologique dans lequel ces trois positions appliqueraient leur remède commun — abolir l'État — changerait d'une tradition à l'autre."
        correct: false
        misconception: mc.philo.etat.critiques-etat-non-distinguees
        feedback: |-
          Modèle détecté : réduire une différence de fond à une simple
          différence de calendrier. L'État de droit ne vise pas du tout à
          abolir l'État — il vise à le limiter par le droit (séparation
          des pouvoirs, droits fondamentaux, contrôle des gouvernants).

      - id: C
        text: "Il a tort seulement à propos des anarchistes, qui défendraient en réalité un État plus fort et plus centralisé, seul capable selon eux de protéger durablement les travailleurs."
        correct: false
        misconception: mc.philo.etat.critiques-etat-non-distinguees
        feedback: |-
          Modèle détecté : inverser la position anarchiste. Proudhon et
          Bakounine soutiennent au contraire que toute concentration de
          pouvoir étatique, quel qu'en soit le titulaire, tend à se
          retourner en domination — d'où leur volonté de l'abolir plutôt
          que de le renforcer.

      - id: D
        text: "Il a tort, mais pour une raison bien plus profonde encore : ces trois traditions partageraient en réalité la conviction que l'État, sous sa forme actuelle et quel que soit le pays observé, est déjà un arbitre parfaitement neutre entre tous les intérêts en présence, ce qui rendrait toute critique un peu radicale de sa part incohérente."
        correct: false
        misconception: mc.philo.etat.etat-neutre-arbitre-non-conteste
        feedback: |-
          Modèle détecté : prêter aux trois traditions une confiance dans
          la neutralité de l'État qu'aucune des trois ne partage. Marx, en
          particulier, conteste précisément cette neutralité proclamée —
          elle masque, selon lui, une fonction réelle de protection des
          rapports de propriété existants.

    correct_feedback: |-
      Marx veut TRANSFORMER l'appareil d'État à des fins économiques, en vue
      de sa disparition à terme. Les anarchistes veulent l'ABOLIR d'emblée,
      sans phase transitoire. L'État de droit ne veut ni l'un ni l'autre : il
      veut LIMITER et contrôler le pouvoir de l'État par le droit, sans
      remettre en cause son existence.

  # ════════════════════════════════════════════════════════════════
  # CP-7 | id: cp-bac-violence | placed BEFORE [[exercise:r-bac]]
  #        Probes: violence-fondatrice-et-suffisante — the ONE model with
  #        ZERO items.yaml coverage (see coverage_summary notes); primes it
  #        right before the قولة that turns on this exact point.
  # ════════════════════════════════════════════════════════════════

  - id: cp-bac-violence
    rung: "R7"
    skill_code: philo_etat
    tags: [checkpoint, formative, misconception_driven, philo_etat, bac_style, violence]
    primary_misconception: mc.philo.etat.violence-fondatrice-et-suffisante
    item_source: original
    lesson_placement: before_bac

    stem: |-
      La citation que tu vas lire affirme que « tout État naît par la
      violence, et son pouvoir ne peut durer que par la violence » — sans
      aucune nuance. Avant de la lire : laquelle de ces formulations décrit
      le mieux ce que les chapitres 3, 6 et 7 t'ont déjà donné pour l'examiner ?

    type: mcq
    choices:
      - id: A
        text: "Une citation dont la première moitié (l'origine violente) trouve un vrai appui chez Marx (chapitre 7), mais dont la seconde moitié (le pouvoir ne DURE que par la violence) est directement contredite par Rousseau (chapitre 6) : la force seule ne fonde jamais une obéissance durable, il lui faut se convertir en droit reconnu."
        correct: true
        feedback: |-
          Exact — c'est très précisément la tension que tu vas devoir
          construire : la citation a un vrai appui historique et
          théorique pour l'origine, mais sa prétention à expliquer À ELLE
          SEULE la PERSISTANCE du pouvoir se heurte de plein fouet à
          l'argument central du chapitre 6.

      - id: B
        text: "Une citation à laquelle rien, dans tout ce que la leçon a construit jusqu'ici (Hobbes, Rousseau, Weber, Marx), ne pourrait jamais sérieusement s'opposer sur aucun de ses deux points, puisque l'État reposerait de toute façon, au fond et sans la moindre exception historique connue, uniquement sur la force pure et rien d'autre."
        correct: false
        misconception: mc.philo.etat.violence-fondatrice-et-suffisante
        feedback: |-
          Modèle détecté : accepter la citation sans réserve. Le chapitre 6 construit
          précisément l'outil qui la met en tension — « le plus fort n'est
          jamais assez fort pour être toujours le maître, s'il ne
          transforme sa force en droit » — une phrase écrite pour
          contester exactement cette idée.

      - id: C
        text: "Une citation entièrement fausse sur ses deux moitiés à la fois : ni l'origine ni la persistance du pouvoir d'aucun État n'auraient jamais quoi que ce soit à voir, historiquement, avec la moindre forme de violence."
        correct: false
        misconception: mc.philo.etat.violence-fondatrice-et-suffisante
        feedback: |-
          Modèle détecté, en sens inverse : rejeter la citation en bloc.
          R6 (Marx) donne au contraire un vrai appui à sa première moitié —
          l'État naît souvent d'un rapport de domination réel. Rejeter la
          citation entièrement revient à perdre ce point solide en même
          temps que le point contestable.

      - id: D
        text: "Une citation qui ne fait, en réalité, que redire sous une autre forme la définition wébérienne du monopole de la violence physique légitime (chapitre 6), sans rien y ajouter ni s'y opposer sur aucun point."
        correct: false
        misconception: mc.philo.etat.legitimite-weber-mal-comprise
        feedback: |-
          Modèle détecté : confondre la citation avec la thèse qu'elle va
          justement devoir affronter. Weber ajoute un mot que la citation
          omet entièrement — LÉGITIME — et c'est ce mot qui fait toute la
          différence entre les deux.

    correct_feedback: |-
      Retiens cette tension avant de lire le texte en entier : son origine
      par la violence trouve un vrai appui (chapitre 7, Marx), mais sa prétention à
      expliquer, à elle seule, la PERSISTANCE du pouvoir se heurte à
      l'argument central du chapitre 6 (Rousseau, Weber) — la force doit se
      convertir en droit reconnu pour durer.

