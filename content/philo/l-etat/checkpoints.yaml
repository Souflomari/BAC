# calm-core probes placed inside the lesson via [[checkpoint:<id>]] markers —
# NOT the end bank (items.yaml). Same item schema, but NO score/streak/tally.
# Wrong-answer feedback names the wrong PHILOSOPHICAL model, not just the
# fact of being wrong. The end-bank ≥3-per-misconception floor lives in
# items.yaml's coverage_summary and is NOT altered by these checkpoints (a
# clone or a fresh item here is surfaced inline, never re-counted toward that
# floor — house convention, see la-liberte/theorie-experience/analyse-de-texte's
# checkpoints.yaml headers).
