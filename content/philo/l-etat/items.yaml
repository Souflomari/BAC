notion: l-etat
skill_code: philo_etat
misconceptions: []

items:
  - id: ETA-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [distinction_concepts, etat_gouvernement]
    stem: >
      Après des élections qui portent un nouveau parti au pouvoir, un
      journaliste écrit : « Le pays a changé d'État. » Qu'est-ce que cette
      phrase confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond l'État et la société : ce sont les rapports entre individus qui ont changé, pas l'appareil politique."
        correct: false
        feedback: >
          Ce n'est pas l'erreur en jeu ici : la société (le tissu des
          rapports entre individus) n'est pas non plus ce dont parle la
          phrase. L'erreur porte précisément sur la confusion entre
          gouvernement (ce qui change) et État (ce qui subsiste).
      - id: B
        text: "Elle confond l'État et la nation : un changement de gouvernement modifierait, selon cette lecture, le sentiment d'appartenance collective du pays."
        correct: false
        feedback: >
          La nation (une identité partagée -- langue, histoire, mémoire
          commune) n'est pas non plus en cause dans cette phrase, et ne
          change évidemment pas au rythme des élections. L'erreur porte sur
          gouvernement et État, pas sur nation et État.
      - id: C
        text: "Elle confond le gouvernement, qui change avec les élections, et l'État, l'appareil permanent qui subsiste à travers ces changements."
        correct: true
      - id: D
        text: "Il n'y a aucune confusion : gouvernement et État sont, en philosophie politique, deux noms pour la même réalité."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes : le trait décisif du gouvernement est
          qu'il change (élections, alternance), alors que l'État, lui,
          demeure précisément à travers ces changements -- c'est ce critère
          de permanence qui les distingue.
    correct_feedback: >
      Le gouvernement désigne ceux qui exercent le pouvoir à un instant
      donné et qui changent avec les élections ; l'État désigne l'appareil
      permanent (lois, administration, justice, territoire) qui subsiste à
      travers ces changements. Confondre les deux, c'est confondre ce qui
      change avec ce qui demeure.
    solution: |
      **Le gouvernement :** les personnes et institutions qui exercent le
      pouvoir exécutif à un moment donné -- change avec les élections,
      l'alternance, parfois un coup de force.

      **L'État :** l'appareil impersonnel et permanent -- lois,
      administration, justice, armée, territoire, souveraineté -- qui
      continue d'exister à travers les changements de gouvernement.

      **Ce que la phrase du journaliste manque :** un changement de
      gouvernement ne signifie pas un changement d'État. Les tribunaux, les
      frontières, les traités en vigueur restent les mêmes.

  - id: ETA-2
    rung: "R2"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [hobbes, leviathan, distinction_auteurs]
    stem: >
      Un élève affirme : « C'est Rousseau qui, dans le Léviathan, décrit
      l'état de nature comme une guerre de tous contre tous. » Qu'est-ce que
      cette affirmation confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond Hobbes et Locke : c'est en réalité Locke qui est l'auteur du Léviathan."
        correct: false
        feedback: >
          Locke n'est l'auteur ni du Léviathan (Hobbes) ni de cette
          description de l'état de nature. Locke propose au contraire un
          état de nature plus mesuré, gouverné en partie par la raison, très
          différent de la guerre de tous contre tous de Hobbes.
      - id: B
        text: "Elle confond deux auteurs : le Léviathan et la guerre de tous contre tous sont de Hobbes, non de Rousseau, qui défend dans Du contrat social un état de nature bien plus paisible."
        correct: true
      - id: C
        text: "L'affirmation est globalement exacte : seul le titre de l'oeuvre serait légèrement mal orthographié, et tout le reste de l'attribution de l'oeuvre comme de la thèse resterait parfaitement correct."
        correct: false
        feedback: >
          Ce n'est pas une simple coquille de titre : c'est l'attribution
          entière de l'oeuvre ET de la thèse qui est erronée. Le Léviathan
          est un ouvrage de Hobbes, et la thèse de la guerre de tous contre
          tous lui appartient également.
      - id: D
        text: "Elle confond l'état de nature et le contrat social, deux moments différents d'une même théorie chez Hobbes."
        correct: false
        feedback: >
          L'état de nature et le contrat social sont bien deux moments
          distincts de l'argumentation de Hobbes, mais ce n'est pas la
          confusion présente dans la phrase : le problème ici est
          l'attribution de l'oeuvre et de la thèse à un mauvais auteur
          (Rousseau au lieu de Hobbes), pas une confusion interne à la
          théorie hobbesienne.
    correct_feedback: >
      Le Léviathan (1651) et la thèse de la guerre de tous contre tous
      appartiennent à Hobbes. Rousseau écrit Du contrat social (1762) et
      conteste, au contraire, l'idée que l'état de nature soit originellement
      violent.
    solution: |
      **L'oeuvre et son auteur :** le Léviathan (1651) est un ouvrage de
      Hobbes, pas de Rousseau.

      **La thèse :** l'état de nature comme guerre de tous contre tous
      (compétition, défiance, gloire) est une thèse de Hobbes.

      **Rousseau, par contraste :** dans Du contrat social (1762), il
      défend une image beaucoup plus paisible de l'état de nature,
      précisément pour contester la vision hobbesienne.

  - id: ETA-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [locke, hobbes, contrat_social, distinction_auteurs]
    stem: >
      En quoi la théorie du contrat de Locke diffère-t-elle fondamentalement
      de celle de Hobbes ?
    type: mcq
    choices:
      - id: A
        text: "Locke penserait que l'état de nature est encore plus violent et plus dangereux que ne le décrit déjà Hobbes, ce qui justifierait à ses yeux l'institution d'un pouvoir souverain encore plus fort et plus absolu."
        correct: false
        feedback: >
          C'est l'inverse : l'état de nature de Locke est un état d'égalité
          et de liberté, gouverné en partie par la raison -- bien moins
          violent que la guerre de tous contre tous de Hobbes. Ce n'est
          d'ailleurs pas la violence qui pousse à en sortir chez Locke, mais
          l'insécurité de droits déjà existants.
      - id: B
        text: "Locke, comme Hobbes, soutient que le pouvoir souverain doit être absolu et non révocable une fois le contrat conclu."
        correct: false
        feedback: >
          C'est précisément le point sur lequel les deux théories
          s'opposent : chez Locke, le pouvoir politique est un mandat de
          confiance conditionnel, révocable si le gouvernement trahit sa
          mission de protection des droits -- ce qui ouvre un droit de
          résistance que Hobbes refuse.
      - id: C
        text: "Locke nie l'existence de tout état de nature antérieur à l'État."
        correct: false
        feedback: >
          Locke affirme bien l'existence d'un état de nature -- il en
          propose seulement un portrait très différent de celui de Hobbes :
          un état d'égalité et de liberté où des droits naturels existent
          déjà, mais restent fragiles faute de juge et de force communs.
      - id: D
        text: "Chez Locke, des droits naturels préexistent au contrat et le pouvoir reste révocable s'il ne les protège pas ; chez Hobbes, les droits naissent du contrat et le pouvoir souverain est quasi irrévocable."
        correct: true
    correct_feedback: >
      Pour Locke, l'État protège des droits naturels préexistants et son
      pouvoir reste conditionnel et révocable. Pour Hobbes, les droits
      naissent du contrat et le pouvoir souverain est quasi absolu -- la
      différence porte sur l'origine des droits et la révocabilité du
      pouvoir, pas sur un simple degré de sévérité.
    solution: |
      **Hobbes :** les droits n'existent qu'à partir du contrat ; le pouvoir
      souverain, une fois institué, est quasiment irrévocable -- car un
      droit individuel de désobéir recréerait la guerre de tous contre tous.

      **Locke :** des droits naturels (vie, liberté, propriété) existent
      déjà avant le contrat ; le pouvoir politique n'est qu'un mandat de
      confiance, légitime seulement s'il protège ces droits, et révocable
      (droit de résistance) s'il les trahit.

      **L'erreur à éviter :** traiter Locke comme une version simplement
      "plus douce" de Hobbes -- la différence est structurelle, pas de
      degré.

  - id: ETA-4
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [rousseau, volonte_generale, contrat_social]
    stem: >
      Quelle affirmation distingue correctement la volonté générale et la
      volonté de tous, chez Rousseau ?
    type: mcq
    choices:
      - id: A
        text: "La volonté générale vise l'intérêt commun de la communauté ; la volonté de tous n'est que la somme des intérêts particuliers, qui peuvent se neutraliser sans jamais viser le bien commun."
        correct: true
      - id: B
        text: "Ce sont deux expressions synonymes que Rousseau emploie indifféremment pour désigner le résultat d'un vote majoritaire."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes chez Rousseau : la volonté de tous
          est la simple addition d'intérêts particuliers, tandis que la
          volonté générale vise spécifiquement l'intérêt commun -- une
          majorité peut parfaitement exprimer une volonté de tous sans
          exprimer la volonté générale.
      - id: C
        text: "La volonté générale désignerait la volonté personnelle et privée du souverain, nettement séparée de celle des simples sujets qu'il gouverne, exactement comme chez Hobbes lorsque tous transfèrent leur droit au Léviathan."
        correct: false
        feedback: >
          C'est confondre Rousseau et Hobbes. Chez Rousseau, il n'existe pas
          de souverain séparé des sujets : la volonté générale est la
          volonté du corps politique lui-même, dont chaque citoyen est
          membre à part égale -- pas celle d'un tiers auquel on aurait
          transféré son droit, comme chez Hobbes.
      - id: D
        text: "La volonté de tous est plus exigeante que la volonté générale, car elle demande l'unanimité complète de tous les citoyens."
        correct: false
        feedback: >
          La distinction ne porte pas sur le degré d'unanimité requis, mais
          sur ce qui est visé : intérêts privés juxtaposés (volonté de tous)
          contre intérêt commun de la communauté (volonté générale).
    correct_feedback: >
      La volonté de tous additionne des intérêts particuliers, qui peuvent
      se neutraliser sans rien viser de commun. La volonté générale vise
      spécifiquement le bien de la communauté en tant que telle -- c'est
      elle seule que la loi légitime doit exprimer.
    solution: |
      **La volonté de tous :** somme brute des volontés particulières --
      chacun votant selon son seul intérêt privé.

      **La volonté générale :** ce que la communauté veut en tant que
      corps politique, en vue du bien commun -- pas la simple addition des
      préférences individuelles.

      **Pourquoi la confusion est fréquente :** les deux peuvent, dans les
      faits, produire le même résultat de vote -- mais elles ne visent pas
      la même chose, et seule la volonté générale rend, pour Rousseau, la
      loi légitime.

  - id: ETA-5
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [rousseau, weber, force_droit, legitimite]
    stem: >
      Pourquoi Rousseau affirme-t-il que « le plus fort n'est jamais assez
      fort pour être toujours le maître, s'il ne transforme sa force en
      droit... » ?
    type: mcq
    choices:
      - id: A
        text: "Parce que le plus fort devrait, selon Rousseau, chercher à accroître encore sa force pour dominer plus durablement ses sujets."
        correct: false
        feedback: >
          C'est l'inverse de la thèse de Rousseau : il ne recommande pas
          d'augmenter la force, mais montre que la force seule, aussi
          grande soit-elle, ne peut jamais suffire à fonder un pouvoir
          durable -- elle doit se convertir en droit reconnu comme légitime.
      - id: B
        text: "Parce que cette formule concerne exclusivement la puissance économique d'un État, pas son autorité politique."
        correct: false
        feedback: >
          La formule porte sur la nature de l'obéissance politique en
          général -- la différence entre être forcé d'obéir et être dans
          l'obligation d'obéir -- pas spécifiquement sur des rapports de
          puissance économique.
      - id: C
        text: "Parce qu'un pouvoir fondé sur la seule force n'obtient qu'une soumission qui dure autant qu'elle : sitôt la force affaiblie, l'obéissance cesse, faute d'avoir été un devoir reconnu."
        correct: true
      - id: D
        text: "Parce qu'elle justifie qu'un souverain, une fois son monopole de la violence légitime établi au sens de Weber, puisse en abuser indéfiniment sans que cela remette en cause sa légitimité."
        correct: false
        feedback: >
          C'est un contresens : la formule de Rousseau vise justement à
          montrer qu'une autorité fondée sur la seule force reste fragile et
          non légitime -- elle ne garantit à personne un usage illimité et
          incontestable du pouvoir, quel que soit son monopole de fait sur
          la contrainte.
    correct_feedback: >
      Rousseau distingue être forcé d'obéir (une soumission qui dure tant
      que la contrainte s'exerce) et être dans l'obligation d'obéir (un
      devoir reconnu comme tel, qui persisterait même sans contrainte
      immédiate). La force seule ne produit jamais ce second type
      d'obligation -- d'où la nécessité de la convertir en droit.
    solution: |
      **Le mécanisme :** une soumission obtenue par la seule force cesse
      dès que le rapport de force s'inverse -- ce n'était jamais qu'une
      contrainte, pas un devoir reconnu.

      **Ce qu'il faut pour qu'un pouvoir dure :** convertir la force en
      droit, l'obéissance en devoir -- de sorte que l'obligation persiste
      même quand la contrainte physique immédiate vient à manquer.

      **Le lien avec Weber :** l'État revendique le monopole de la violence
      physique légitime -- mais "légitime" ne veut pas dire "moralement
      juste en toutes circonstances" ni "à l'abri de toute contestation" ;
      c'est précisément cette nuance qui permet ensuite les critiques de
      l'État (R6).

  - id: ETA-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [marx, anarchisme, etat_de_droit, critiques_etat]
    stem: >
      Un élève écrit : « Marx et les anarchistes défendent, au fond, la même
      position sur l'État : il faut le détruire. » Qu'est-ce que cette
      phrase manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que Marx défend en réalité l'État de droit, alors que les anarchistes le rejettent."
        correct: false
        feedback: >
          L'État de droit (limiter le pouvoir par la séparation des
          pouvoirs, des droits fondamentaux, le contrôle des gouvernants)
          est une troisième tradition, distincte à la fois de Marx et de
          l'anarchisme -- ni Marx ni les anarchistes ne défendent cette
          position, qui vise à encadrer l'État plutôt qu'à le transformer
          économiquement ou à l'abolir.
      - id: B
        text: "Elle efface une différence décisive : Marx veut s'emparer de l'État pour une phase transitoire, avant sa disparition une fois les classes abolies, quand les anarchistes veulent l'abolir d'emblée."
        correct: true
      - id: C
        text: "Elle manque le fait que les anarchistes veulent au contraire un État plus fort, capable de mieux protéger les travailleurs."
        correct: false
        feedback: >
          C'est l'inverse de la position anarchiste : Proudhon et Bakounine
          soutiennent que toute concentration de pouvoir étatique,
          quel qu'en soit le titulaire, tend à se retourner en domination --
          d'où leur volonté d'abolir l'État plutôt que de le renforcer.
      - id: D
        text: "Elle manque le fait que Marx considérerait l'État comme une institution éternelle et proprement indépassable, tout à l'opposé des anarchistes, qui seraient alors les seuls à en annoncer la disparition future."
        correct: false
        feedback: >
          Marx, lui aussi, anticipe la disparition de l'État -- mais par une
          voie différente et à un rythme différent (une transformation
          économique préalable, puis un dépérissement progressif), alors
          que les anarchistes visent une abolition directe et immédiate,
          sans phase de transition étatique.
    correct_feedback: >
      Marx et les anarchistes critiquent tous deux l'ordre existant, mais ne
      proposent pas le même remède : Marx envisage une conquête transitoire
      de l'État en vue de sa disparition ultérieure ; les anarchistes
      rejettent toute concentration de pouvoir étatique, y compris
      révolutionnaire, et veulent l'abolir sans détour.
    solution: |
      **Marx :** l'État est l'instrument d'une classe dominante -- il faut
      s'en emparer (phase transitoire), puis viser sa disparition une fois
      les classes abolies.

      **Les anarchistes (Proudhon, Bakounine) :** toute concentration de
      pouvoir étatique, même révolutionnaire, reproduit la domination --
      il faut l'abolir directement, sans phase de transition.

      **L'État de droit :** une troisième voie, distincte des deux
      précédentes -- ni transformation économique ni abolition, mais
      limitation du pouvoir par le droit (séparation des pouvoirs, droits
      fondamentaux, contrôle des gouvernants).

  - id: ETA-7
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_etat
    tags: [accroche, ordre_social, comprehension]
    stem: >
      Quel fait, dans le récit de la panne de courant (R0), vient mettre en
      doute l'idée que l'ordre social ne tiendrait qu'à la peur d'être vu et
      puni ?
    type: mcq
    choices:
      - id: A
        text: "Le fait que la plupart des quartiers plongés dans la même obscurité, au même moment, n'aient connu aucun pillage, alors que la surveillance policière était partout également absente."
        correct: true
      - id: B
        text: "Le fait que des vitrines aient été brisées et des commerces pillés dans certains quartiers."
        correct: false
        feedback: >
          Ce fait confirmerait plutôt l'idée que l'absence de surveillance
          relâche les comportements ; il n'explique pas pourquoi la plupart
          des quartiers, dans la même obscurité, sont au contraire restés
          calmes.
      - id: C
        text: "Le fait qu'aucune caméra de surveillance n'ait fonctionné pendant toute la coupure."
        correct: false
        feedback: >
          C'est un simple détail du récit, pas un argument : il décrit
          l'absence de surveillance, mais ne dit rien, à lui seul, de ce qui
          explique le calme observé dans la plupart des quartiers.
      - id: D
        text: "Le fait que la coupure ait duré plusieurs heures avant le retour du courant."
        correct: false
        feedback: >
          La durée de la panne n'est pas ce qui met la première réponse sous
          tension ; c'est la comparaison entre quartiers, tous également
          privés de surveillance mais pas également agités, qui fait
          difficulté.
    correct_feedback: >
      Si l'ordre ne tenait qu'à la peur du gendarme, l'absence totale et
      généralisée de surveillance, cette nuit-là, aurait dû produire un
      désordre généralisé partout -- ce qui n'est pourtant pas ce qui s'est
      produit dans la plupart des quartiers.
    solution: |
      **La première réponse :** l'ordre tiendrait surtout à la peur d'être
      vu et puni.

      **L'objection :** si c'était vrai, l'absence totale de surveillance,
      partout à la fois, aurait dû produire un désordre généralisé -- or la
      plupart des quartiers sont restés calmes.

      **Ce que cela suggère :** autre chose qu'une pure crainte de la
      sanction immédiate soutient, au moins en partie, l'ordre social
      ordinaire.

  - id: ETA-8
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_etat
    tags: [accroche, ordre_social, comprehension]
    stem: >
      La seconde réponse (« les gens ne sont pas fondamentalement violents ou
      malhonnêtes ») semble, elle aussi, raisonnable. Quelle observation,
      proposée dans la leçon, vient pourtant la mettre sous tension ?
    type: mcq
    choices:
      - id: A
        text: "Le fait que les pillages, là où ils ont eu lieu, se soient portés sur des biens plutôt que sur des personnes."
        correct: false
        feedback: >
          Cette observation est mobilisée plus loin dans la leçon (R6, à
          propos de Weber), pas comme objection à la seconde réponse dans la
          scène d'ouverture.
      - id: B
        text: "Le fait qu'aucune société humaine, même la plus paisible, n'ait jamais renoncé à se doter d'une force publique, de lois, d'une autorité chargée de trancher les conflits."
        correct: true
      - id: C
        text: "Le fait que la première réponse soit, selon la leçon, statistiquement plus fréquente chez les élèves interrogés."
        correct: false
        feedback: >
          Ce n'est pas un argument philosophique mais une remarque sur la
          fréquence d'une opinion -- cela ne met rien sous tension dans le
          contenu de la seconde réponse elle-même.
      - id: D
        text: "Le fait que les caméras de surveillance aient cessé de fonctionner pendant la panne."
        correct: false
        feedback: >
          Ce détail décrit les conditions de la panne, pas une objection à
          l'idée que les individus livrés à eux-mêmes ne poseraient
          structurellement aucun problème.
    correct_feedback: >
      Si les individus, livrés à eux-mêmes, ne posaient vraiment aucun
      problème structurel, il serait étonnant qu'aucune société, même la
      plus paisible, n'ait jamais renoncé à une force publique et à une
      autorité commune.
    solution: |
      **La seconde réponse :** les individus livrés à eux-mêmes ne
      poseraient pas de problème fondamental.

      **L'objection :** aucune société, même la plus paisible, ne s'est
      jamais passée d'une force publique et d'une autorité chargée de
      trancher les conflits.

      **Ce que cela suggère :** quelque chose, dans la vie collective, rend
      une autorité commune nécessaire -- même quand la violence n'est pas la
      norme.

  - id: ETA-9
    rung: "R0"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [accroche, probleme, legitimite]
    stem: >
      Laquelle des formulations suivantes reprend fidèlement le problème que
      la leçon va construire, à partir de la scène de la panne de courant ?
    type: mcq
    choices:
      - id: A
        text: "L'État a-t-il été historiquement fondé par un contrat signé à une date précise, et peut-on retrouver ce document dans des archives ?"
        correct: false
        feedback: >
          C'est traiter comme une question historique et documentaire ce qui
          est, dans la leçon, une expérience de pensée (cf. Hobbes, R2) -- pas
          une enquête d'archives.
      - id: B
        text: "Les lois en vigueur dans un pays sont-elles toujours respectées à la lettre par les policiers eux-mêmes ?"
        correct: false
        feedback: >
          C'est réduire un problème de légitimité du pouvoir à une simple
          question de conformité à la loi -- une confusion entre légitimité
          et légalité que la leçon prend justement soin d'éviter.
      - id: C
        text: "L'État est-il ce qui protège les individus et rend leur liberté effective, ou n'est-il, au fond, qu'un appareil de contrainte -- et, dans les deux cas, qu'est-ce qui rend son pouvoir légitime plutôt que simplement le plus fort ?"
        correct: true
      - id: D
        text: "Un gouvernement qui perd des élections doit-il être remplacé rapidement par un autre ?"
        correct: false
        feedback: >
          Cette question porte sur le gouvernement, qui change, et non sur
          l'État en tant qu'institution permanente ni sur la légitimité du
          pouvoir -- ce n'est pas le problème construit par la scène
          d'ouverture.
    correct_feedback: >
      Le problème posé par la scène d'ouverture est double : l'État
      protège-t-il notre liberté ou n'est-il qu'une contrainte -- et
      qu'est-ce qui, dans un cas comme dans l'autre, rend son pouvoir
      légitime plutôt que simplement le plus fort ?
    solution: |
      **Ce que la scène ne pose pas :** ni une question d'archives
      historiques, ni une simple question de conformité policière à la loi.

      **Ce qu'elle pose réellement :** l'alternative protection/contrainte,
      et la question de la légitimité du pouvoir.

      **Pourquoi ce cadrage compte :** toute la leçon (Hobbes à l'État de
      droit) répond, chacune à sa façon, à cette double question.

  - id: ETA-10
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [distinction_concepts, societe_etat]
    stem: >
      Un manuel affirme : « Des communautés villageoises organisées par la
      coutume et la parenté, sans aucune administration centralisée, ne
      peuvent pas être qualifiées de société, faute d'un État structuré. »
      Qu'est-ce que cette affirmation confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond la société et la nation : une communauté sans État perdrait, selon cette lecture, tout sentiment d'identité partagée."
        correct: false
        feedback: >
          Ce n'est pas cette confusion-là qui est en jeu : le problème porte
          sur la définition même de la société, pas sur le sentiment
          national.
      - id: B
        text: "Elle confond le gouvernement et la nation, deux notions qui n'interviennent pourtant pas directement dans la phrase."
        correct: false
        feedback: >
          Ni le gouvernement ni la nation ne sont ici en cause ; la phrase
          porte sur la définition de la société et de l'État.
      - id: C
        text: "Elle confond l'État et la volonté générale, un concept qui n'appartient pourtant pas à ce point du programme."
        correct: false
        feedback: >
          La volonté générale est une notion propre à Rousseau (R4), qui n'a
          aucun rapport avec l'erreur commise ici sur la définition de la
          société.
      - id: D
        text: "Elle confond la société et l'État : une société -- un ensemble d'individus liés par des rapports d'interdépendance -- peut parfaitement exister sans organisation politique centralisée, avant ou en dehors de toute structure qu'on appellerait un État."
        correct: true
    correct_feedback: >
      La société désigne le tissu des rapports entre individus (économiques,
      familiaux, culturels), et peut exister sans aucune organisation
      politique centralisée -- des communautés organisées par la coutume et
      la parenté fonctionnent en société bien avant, ou en dehors, de tout
      État au sens plein.
    solution: |
      **La société :** l'ensemble des individus liés par des rapports
      d'interdépendance -- peut exister sans État.

      **L'État :** l'appareil impersonnel et permanent (lois,
      administration, justice, territoire, souveraineté).

      **L'erreur du manuel :** exiger un État pour qu'il y ait société
      revient à confondre deux notions dont l'une (la société) est bien plus
      large et bien plus ancienne que l'autre.

  - id: ETA-11
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [distinction_concepts, coup_etat, nation_etat]
    stem: >
      Après un coup d'État, un commentateur écrit : « L'appareil d'État tout
      entier -- tribunaux, administration, armée -- a été détruit et
      remplacé par les putschistes. » Qu'est-ce que cette phrase manque le
      plus souvent, dans les faits ?
    type: mcq
    choices:
      - id: A
        text: "Un coup d'État désigne, historiquement, la prise par la force du pouvoir exécutif -- le gouvernement ; l'appareil d'État lui-même survit le plus souvent intact et se retrouve simplement capturé par de nouvelles mains."
        correct: true
      - id: B
        text: "Elle manque le fait qu'un coup d'État change nécessairement la nation du pays -- son identité, sa langue, sa mémoire collective."
        correct: false
        feedback: >
          Le sentiment national ne se dissout pas du jour au lendemain avec
          un changement de pouvoir exécutif ; nation et État sont deux
          notions distinctes, et c'est ici l'État, pas la nation, qui est mal
          identifié dans la phrase.
      - id: C
        text: "Elle manque le fait qu'un coup d'État est, par définition, toujours suivi d'élections libres organisées par les putschistes."
        correct: false
        feedback: >
          Rien, dans la définition d'un coup d'État, n'implique des
          élections libres organisées ensuite -- ce n'est pas ce que la
          phrase manque.
      - id: D
        text: "Rien : la phrase décrit exactement ce qui se produit, dans les faits, lors d'un coup d'État réussi."
        correct: false
        feedback: >
          C'est l'inverse : le trait le plus souvent observé est la capture
          du gouvernement, pas la destruction de l'appareil d'État permanent
          (tribunaux, administration, armée), qui continue le plus souvent de
          fonctionner sous les nouvelles mains.
    correct_feedback: >
      L'expression « coup d'État » prête à confusion : elle désigne la prise
      par la force du pouvoir exécutif, pas la destruction de l'appareil
      d'État, qui survit le plus souvent intact et se retrouve simplement
      capturé.
    solution: |
      **Ce qu'un coup d'État change :** qui exerce le pouvoir exécutif -- le
      gouvernement.

      **Ce qu'il ne détruit pas, le plus souvent :** l'appareil permanent --
      tribunaux, administration, armée -- qui continue de fonctionner, sous
      de nouvelles mains.

      **L'erreur à éviter :** confondre la capture du gouvernement avec la
      destruction de l'État lui-même.

  - id: ETA-12
    rung: "R2"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [hobbes, etat_de_nature, experience_de_pensee]
    stem: >
      Un élève écrit dans sa copie : « Hobbes a mené une enquête historique
      rigoureuse pour prouver que les peuples primitifs vivaient
      effectivement dans une guerre permanente, avant l'invention de
      l'État. » Qu'est-ce que cette phrase manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que ce sont, en réalité, les trois sources de conflit -- compétition, défiance, gloire -- qui constituent la preuve historique de cette guerre permanente."
        correct: false
        feedback: >
          Ces trois sources sont les ressorts d'un raisonnement, pas les
          résultats d'une enquête historique -- la phrase reste fausse même
          en ajoutant ce détail, car Hobbes ne prétend toujours pas prouver
          un fait historique.
      - id: B
        text: "Hobbes ne prétend pas décrire un moment historique réel qu'auraient traversé des populations primitives : l'état de nature est une expérience de pensée, destinée à faire apparaître, par contraste, ce que l'État nous apporte."
        correct: true
      - id: C
        text: "Elle manque le fait que Hobbes situe cette guerre non pas avant, mais après l'instauration du Léviathan."
        correct: false
        feedback: >
          C'est l'inverse chronologique de la thèse de Hobbes : la guerre de
          tous contre tous caractérise précisément l'état de nature, avant
          tout pouvoir souverain institué.
      - id: D
        text: "Rien : Hobbes fonde effectivement sa thèse sur une enquête anthropologique menée auprès de peuples encore dépourvus d'État à son époque."
        correct: false
        feedback: >
          Ce n'est pas la démarche de Hobbes : il construit un raisonnement,
          pas une enquête de terrain -- affirmer l'inverse ne corrige pas
          l'erreur, elle la répète.
    correct_feedback: >
      Hobbes ne cherche pas à prouver historiquement l'existence d'une
      guerre primitive : il imagine, par la pensée, ce que serait la
      condition humaine sans autorité commune, pour faire apparaître par
      contraste ce que l'État apporte.
    solution: |
      **Ce que Hobbes ne fait pas :** une enquête historique ou
      anthropologique vérifiable.

      **Ce qu'il fait :** une expérience de pensée -- imaginer, par
      contraste, la vie sans autorité commune.

      **L'enjeu :** comprendre la valeur de l'État sans avoir besoin de
      prouver un fait historique.

  - id: ETA-13
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [hobbes, souverain_absolu, raisonnement]
    stem: >
      Pourquoi, selon le raisonnement de Hobbes, le pouvoir souverain
      doit-il être quasi absolu et pratiquement irrévocable ?
    type: mcq
    choices:
      - id: A
        text: "Parce que Hobbes considère, par principe et indépendamment de son analyse de l'état de nature, qu'un pouvoir fort est toujours préférable à un pouvoir divisé."
        correct: false
        feedback: >
          C'est manquer l'argument précis de Hobbes : ce n'est pas un simple
          goût pour la force, mais une conséquence logique de son analyse de
          ce qui recréerait la guerre de tous contre tous.
      - id: B
        text: "Parce que seul un pouvoir absolu peut, selon lui, garantir que chaque citoyen conserve son droit de juger librement de la légitimité des lois."
        correct: false
        feedback: >
          C'est l'inverse : c'est justement en retirant à chacun ce droit de
          juger par soi-même que le pouvoir absolu, selon Hobbes, évite le
          retour de la guerre de tous contre tous.
      - id: C
        text: "Parce que si chaque individu conservait le droit de juger par lui-même quand désobéir légitimement, on recréerait autant de sources de désaccord qu'il y a d'individus -- et donc, à terme, la guerre de tous contre tous que le contrat visait à éviter."
        correct: true
      - id: D
        text: "Parce qu'un pouvoir révocable garantirait, selon Hobbes, une paix plus stable en cas de désaccord entre les citoyens."
        correct: false
        feedback: >
          C'est l'exact opposé de la thèse de Hobbes : un pouvoir révocable
          au moindre désaccord équivaut, face à qui veut rompre la paix, à
          une autorité fonctionnellement absente.
    correct_feedback: >
      Le raisonnement de Hobbes n'est pas un goût pour la tyrannie : si
      chacun pouvait juger seul quand désobéir, on recréerait autant de
      juges de la légitimité que d'individus, donc un retour à la guerre de
      tous contre tous.
    solution: |
      **Le risque identifié :** un droit individuel de désobéir légitimement
      recréerait autant de juges que d'individus.

      **La conséquence :** autant de sources de désaccord possibles -- donc,
      à terme, un retour à la guerre de tous contre tous.

      **Ce que cela n'est pas :** un simple goût de Hobbes pour la tyrannie,
      mais une conséquence logique de son analyse.

  - id: ETA-14
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [locke, etat_de_nature, contrat_social]
    stem: >
      Pourquoi, selon Locke, les individus quittent-ils l'état de nature ?
    type: mcq
    choices:
      - id: A
        text: "Pour échapper à une guerre de tous contre tous déjà installée entre individus fondamentalement égaux en force et en ruse."
        correct: false
        feedback: >
          C'est le raisonnement de Hobbes, pas celui de Locke : l'état de
          nature lockien n'est pas d'emblée une guerre généralisée, mais un
          état d'égalité et de liberté relativement paisible.
      - id: B
        text: "Parce que, dans l'état de nature lockien, aucun droit n'existe encore avant l'instauration d'un pouvoir politique commun."
        correct: false
        feedback: >
          C'est l'inverse de la thèse de Locke : les droits naturels -- vie,
          liberté, propriété -- existent déjà dans l'état de nature,
          indépendamment de tout État.
      - id: C
        text: "Parce que la raison, chez Locke, ne joue aucun rôle dans l'état de nature et ne peut donc offrir aucune protection aux individus avant le contrat."
        correct: false
        feedback: >
          Locke affirme au contraire que la raison, loi de nature, gouverne
          déjà, dans une certaine mesure, l'état de nature -- ce n'est pas un
          état dénué de toute règle.
      - id: D
        text: "Non pour échapper à une guerre déjà installée, mais pour sécuriser des droits déjà existants -- vie, liberté, propriété -- fragiles faute d'une loi commune, d'un juge impartial et d'une force pour faire exécuter les jugements."
        correct: true
    correct_feedback: >
      Pour Locke, le problème n'est pas une violence généralisée mais
      l'insécurité de droits déjà là : sans loi écrite commune, sans juge
      impartial, sans force d'exécution, chacun devient juge dans sa propre
      cause.
    solution: |
      **L'état de nature lockien :** un état d'égalité et de liberté, où des
      droits naturels existent déjà.

      **Le problème identifié :** l'absence de loi commune, de juge
      impartial, de force d'exécution -- pas la violence généralisée.

      **La différence avec Hobbes :** on sort de l'état de nature pour
      sécuriser des droits déjà là, pas pour fuir une guerre déjà installée.

  - id: ETA-15
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [locke, hobbes, droit_de_resistance, application]
    stem: >
      Un souverain confisque, sans jugement ni justification, les terres
      d'un sujet. Que répondrait Locke à ce sujet, à la différence de
      Hobbes ?
    type: mcq
    choices:
      - id: A
        text: "Locke y verrait une violation manifeste de la finalité même du contrat -- protéger la propriété -- justifiant, en droit, la résistance voire le renversement du pouvoir ; Hobbes, lui, refuserait à quiconque le droit de se faire justice lui-même."
        correct: true
      - id: B
        text: "Locke, comme Hobbes, jugerait qu'aucun individu n'a le droit de se soulever, car seul le souverain tranche en dernier ressort ce qui est juste dans la cité."
        correct: false
        feedback: >
          C'est effacer la différence entre les deux théories : c'est
          précisément sur ce point qu'elles s'opposent -- Locke, à la
          différence de Hobbes, reconnaît un droit de résistance en cas de
          trahison du contrat.
      - id: C
        text: "Locke considérerait cet acte comme parfaitement légitime, dès lors qu'il émane d'une autorité souveraine reconnue."
        correct: false
        feedback: >
          C'est contredire toute la théorie du contrat conditionnel chez
          Locke : le pouvoir politique n'est légitime qu'à condition de
          protéger les droits, pas par le seul fait d'émaner d'une autorité
          reconnue.
      - id: D
        text: "Hobbes, à la différence de Locke, autoriserait le sujet à se soulever immédiatement, car la confiscation violerait le contrat originel."
        correct: false
        feedback: >
          C'est inverser les deux positions : c'est Locke, non Hobbes, qui
          reconnaît un droit de résistance en cas de trahison du contrat.
    correct_feedback: >
      Le même fait produit deux verdicts opposés : pour Locke, la
      confiscation viole la finalité du contrat et justifie la résistance ;
      pour Hobbes, seul le souverain tranche en dernier ressort ce qui est
      juste, et nul n'a le droit de se soulever.
    solution: |
      **Chez Hobbes :** aucun droit de se faire justice soi-même -- seul le
      souverain tranche, sous peine de rouvrir la guerre de tous contre
      tous.

      **Chez Locke :** le pouvoir n'est qu'un mandat de confiance
      conditionnel -- sa trahison libère le droit de résistance.

      **Ce que l'exemple montre :** un même fait, deux verdicts opposés,
      parce que les deux théories ne fondent pas le pouvoir sur la même
      chose.

  - id: ETA-16
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [rousseau, hobbes, critique, contrat_social]
    stem: >
      Pourquoi Rousseau juge-t-il intenable le schéma de Hobbes, où chaque
      individu transfère ses droits à un souverain ?
    type: mcq
    choices:
      - id: A
        text: "Parce que Hobbes, selon Rousseau, accorderait aux individus un droit de résistance excessif, qui menacerait la stabilité du pouvoir souverain."
        correct: false
        feedback: >
          C'est l'inverse : Hobbes ne prévoit quasiment aucun droit de
          résistance -- ce n'est donc pas ce que lui reproche Rousseau.
      - id: B
        text: "Parce que ce souverain, ne faisant partie d'aucun contrat et ne rendant de compte à personne, réduit la soumission à une pure sujétion, sans réciprocité -- comparable à celle d'un esclave face à son maître, non à un engagement légitime."
        correct: true
      - id: C
        text: "Parce que Hobbes décrirait, selon Rousseau, un état de nature trop paisible, incapable de justifier l'instauration d'un pouvoir commun."
        correct: false
        feedback: >
          C'est l'inverse de leur désaccord réel sur l'état de nature :
          c'est Hobbes qui le décrit comme violent, quand Rousseau le juge,
          lui, plus paisible -- mais ce n'est pas ce point qui est en jeu
          dans l'objection visée ici.
      - id: D
        text: "Parce que le Léviathan de Hobbes ne prévoirait aucune autorité suffisamment forte pour empêcher la guerre de tous contre tous."
        correct: false
        feedback: >
          C'est l'inverse du problème que pose Hobbes : son souverain est au
          contraire conçu pour être suffisamment fort -- ce n'est pas ce que
          lui reproche Rousseau.
    correct_feedback: >
      Rousseau reproche à Hobbes de transférer les droits à un tiers
      extérieur au contrat, sans réciprocité -- une soumission qui ne se
      distingue plus vraiment de celle d'un esclave face à son maître.
    solution: |
      **Le schéma de Hobbes :** chaque individu transfère ses droits à un
      souverain qui ne fait partie d'aucun contrat.

      **Le problème selon Rousseau :** une soumission sans réciprocité à une
      volonté extérieure -- une pure sujétion, pas un engagement légitime.

      **Ce que Rousseau propose à la place :** une aliénation à la
      communauté entière, dont chacun devient lui-même membre (R4).

  - id: ETA-17
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [rousseau, alienation_totale, egalite]
    stem: >
      Pourquoi l'aliénation totale, mais strictement égale pour chacun,
      empêche-t-elle, selon Rousseau, que l'association ne dégénère en
      rapport de domination ?
    type: mcq
    choices:
      - id: A
        text: "Parce que cette aliénation totale confère au souverain un pouvoir absolu, à l'abri de toute contestation, comme chez Hobbes."
        correct: false
        feedback: >
          C'est reconstituer exactement le schéma hobbesien -- un souverain
          séparé, tiers au contrat -- que Rousseau rejette précisément pour
          cette raison.
      - id: B
        text: "Parce que chacun ne cède en réalité qu'une partie limitée de ses droits, ce qui garantit qu'aucun abus n'est possible."
        correct: false
        feedback: >
          C'est contredire le geste même que décrit Rousseau : l'aliénation
          est explicitement totale, pas partielle -- c'est cette totalité,
          combinée à l'égalité, qui produit la symétrie recherchée.
      - id: C
        text: "Parce que personne ne cède plus que les autres et personne ne reçoit un pouvoir que les autres n'auraient pas : tous faisant exactement le même geste, chacun se donnant tout entier ne se donne, au fond, à personne en particulier."
        correct: true
      - id: D
        text: "Parce que la communauté, une fois formée, transfère elle-même l'ensemble de ces droits à un petit groupe de représentants élus."
        correct: false
        feedback: >
          Ce mécanisme de représentation ne fait pas partie du schéma de
          Rousseau ici : il n'y a, dans son geste fondateur, aucun tiers
          séparé auquel les droits seraient transférés.
    correct_feedback: >
      L'aliénation étant totale et strictement identique pour chacun,
      personne ne cède plus que les autres ni ne reçoit un pouvoir que les
      autres n'auraient pas -- cette symétrie parfaite empêche l'association
      de dégénérer en domination.
    solution: |
      **Le geste :** chaque associé aliène totalement ses droits, mais à la
      communauté entière, dont il est lui-même membre.

      **Pourquoi cela évite la domination :** tous font exactement le même
      geste -- personne ne cède plus, personne ne reçoit plus.

      **Ce que cela n'est pas :** ni une aliénation partielle, ni un
      transfert à un tiers séparé (souverain ou représentants).

  - id: ETA-18
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [weber, legitimite, monopole_violence]
    stem: >
      Selon Weber, que signifie exactement l'idée que l'État détient le
      « monopole de la violence physique légitime » ?
    type: mcq
    choices:
      - id: A
        text: "Cela signifie que l'État serait le seul en mesure d'exercer matériellement une force physique, et qu'aucun individu ne pourrait jamais, dans aucune limite, se défendre lui-même."
        correct: false
        feedback: >
          Un individu peut toujours, dans certaines limites, se défendre
          lui-même. Le monopole ne porte pas sur qui PEUT exercer la force,
          mais sur qui est reconnu comme autorisé à juger de sa légitimité.
      - id: B
        text: "Cela signifie que l'État est la seule instance reconnue comme autorisée à décider quels usages de la force sont légitimes ou non -- non qu'il serait seul à pouvoir, matériellement, exercer une force physique."
        correct: true
      - id: C
        text: "Cela signifie qu'un pouvoir reconnu comme légitime, au sens de Weber, est par là même toujours moralement juste, quoi qu'il fasse."
        correct: false
        feedback: >
          C'est confondre légitimité sociologique et justice morale : un
          pouvoir peut être reconnu et obéi tout en étant, par ailleurs,
          profondément injuste -- ce qui rend possibles les critiques de R6.
      - id: D
        text: "Cela signifie que tout usage de la force par l'État est légitime dès lors qu'il vient de lui, même s'il reste arbitraire et imprévisible."
        correct: false
        feedback: >
          C'est retomber dans la confusion entre force et droit : la
          légitimité tient à ce que l'usage de la force découle d'une loi
          connue à l'avance et contestable, pas au seul fait qu'il émane de l'État.
    correct_feedback: >
      Le monopole weberien ne porte pas sur la capacité matérielle à
      exercer la force, mais sur l'autorité reconnue à juger quels usages de
      la force sont légitimes -- une distinction qui n'est ni une garantie
      morale ni un blanc-seing arbitraire.
    solution: |
      **Pas un monopole physique :** un individu peut toujours se défendre
      dans certaines limites.

      **Un monopole de jugement :** l'État seul est reconnu autorisé à
      décider quels usages de la force sont légitimes.

      **Ce que « légitime » n'est pas :** ni une garantie de justice
      morale, ni un blanc-seing pour l'arbitraire.

  - id: ETA-19
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [weber, application, force_droit]
    stem: >
      Un policier te verbalise pour un feu rouge grillé ; un individu armé
      te dépouille de ta voiture. Les deux exercent, dans l'instant, une
      forme de contrainte physique. Pourquoi, selon Weber, seul le premier
      acte est-il reconnu comme légitime ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'il découle d'une loi à l'élaboration de laquelle tu as, en principe, part comme citoyen, qu'il s'applique selon une procédure connue à l'avance, et qu'il peut être contesté devant un tribunal impartial -- trois conditions qu'aucun voleur armé ne remplit."
        correct: true
      - id: B
        text: "Parce que l'acte du policier serait, en lui-même, plus agréable à subir que celui du voleur."
        correct: false
        feedback: >
          Ce n'est pas le confort qui fonde la légitimité, mais la loi, la
          procédure connue à l'avance et la possibilité d'un recours devant
          un tribunal impartial.
      - id: C
        text: "Parce que le policier serait physiquement plus fort que le voleur, et donc mieux à même d'imposer sa contrainte."
        correct: false
        feedback: >
          C'est confondre force et droit : ce n'est pas la supériorité de
          force qui rend un acte légitime, sans quoi le plus fort aurait
          toujours raison -- exactement ce que Rousseau réfute (R5).
      - id: D
        text: "Parce que seul le policier exercerait, dans l'instant, une forme de contrainte ou de menace -- le voleur, lui, n'en exercerait aucune."
        correct: false
        feedback: >
          Les deux exercent bien une contrainte physique dans l'instant ;
          la question n'est donc pas de savoir qui exerce une force, mais
          selon quelles conditions cette force est reconnue légitime.
    correct_feedback: >
      Ce n'est ni le confort, ni la supériorité de force, qui distingue les
      deux actes, mais le fait que seul l'un découle d'une loi connue à
      l'avance et contestable devant un tribunal impartial.
    solution: |
      **Le point commun :** les deux actes exercent, dans l'instant, une
      contrainte physique.

      **Ce qui les distingue :** la loi, la procédure connue à l'avance, la
      contestabilité devant un tribunal -- pas la force ni le confort.

      **Erreur à éviter :** légitimité ne veut pas dire supériorité de
      force (force ≠ droit, R5).

  - id: ETA-20
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [marx, critiques_etat, domination_classe]
    stem: >
      Selon Marx, en quel sens l'État moderne serait-il, malgré son
      apparence de neutralité, un instrument de domination de classe ?
    type: mcq
    choices:
      - id: A
        text: "Parce que les agents de l'État seraient, individuellement, cyniques et pleinement conscients de servir sciemment les intérêts de la bourgeoisie contre l'intérêt général."
        correct: false
        feedback: >
          Marx ne suppose pas cette conscience individuelle : l'État peut
          être sincèrement vécu par ses agents comme un arbitre impartial,
          tout en remplissant, sans qu'ils en aient pleinement conscience,
          une fonction réelle de domination.
      - id: B
        text: "Parce que l'égalité formelle promise par le droit serait, selon Marx, logiquement incompatible avec toute domination économique réelle."
        correct: false
        feedback: >
          C'est l'inverse de la thèse de Marx : l'égalité formelle devant
          la loi peut parfaitement coexister, sans aucune contradiction
          logique, avec une domination économique bien réelle qu'elle habille.
      - id: C
        text: "Parce que Marx viserait, comme les anarchistes, l'abolition immédiate de l'État, sans aucune phase de transition."
        correct: false
        feedback: >
          C'est confondre Marx et l'anarchisme : Marx envisage de s'emparer
          de l'État pour une phase transitoire, avant sa disparition
          progressive -- les anarchistes veulent l'abolir d'emblée.
      - id: D
        text: "Parce que la classe dominante, propriétaire des moyens de production, a besoin d'un appareil qui protège sa position et stabilise cette domination en la faisant apparaître comme allant de soi -- l'État en est le produit et l'instrument, non la cause première."
        correct: true
    correct_feedback: >
      Pour Marx, l'État n'est pas la cause de la division en classes mais
      son produit et son instrument : il stabilise la domination de la
      classe possédante sans que cela suppose, chez ses agents, un cynisme
      conscient, ni une contradiction logique avec l'égalité formelle du droit.
    solution: |
      **La thèse de Marx :** l'État est le produit et l'instrument de la
      classe dominante, pas sa cause première.

      **Ce que cela n'exige pas :** ni cynisme conscient des agents, ni
      contradiction logique avec l'égalité formelle du droit.

      **Ce que ce n'est pas :** la position anarchiste (abolition
      immédiate, sans phase de transition).

  - id: ETA-21
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [etat_de_droit, critiques_etat, derives_totalitaires]
    stem: >
      En quoi l'État de droit constitue-t-il une réponse spécifique au
      risque de dérive totalitaire, distincte à la fois de la position
      marxiste et de la position anarchiste ?
    type: mcq
    choices:
      - id: A
        text: "Il consiste, comme la position anarchiste, à refuser toute concentration de pouvoir étatique, quel qu'en soit le titulaire."
        correct: false
        feedback: >
          L'État de droit ne rejette pas l'existence de l'État : il vise à
          le limiter et à le contrôler par le droit, pas à l'abolir comme le
          font les anarchistes.
      - id: B
        text: "Il vise, comme la position marxiste, à s'emparer de l'appareil d'État avant d'organiser sa disparition progressive une fois les classes abolies."
        correct: false
        feedback: >
          Ce n'est pas non plus la position marxiste : l'État de droit ne
          vise ni la conquête transitoire de l'État à des fins économiques,
          ni sa disparition à terme.
      - id: C
        text: "Il ne cherche ni à transformer l'État à des fins économiques, ni à l'abolir, mais à limiter et contrôler le pouvoir par le droit -- séparation des pouvoirs, droits fondamentaux, mécanismes de contrôle et de remplacement des gouvernants."
        correct: true
      - id: D
        text: "Il suppose qu'un pouvoir né d'un contrat destiné à protéger porte, en lui-même, une garantie suffisante qu'il ne se retournera jamais contre ceux qu'il devait protéger."
        correct: false
        feedback: >
          C'est exactement l'inverse : aucun pouvoir concentré, même né
          d'un contrat protecteur, ne porte en lui-même une telle garantie
          -- c'est précisément pour cela que l'État de droit organise des
          limites et des contrôles.
    correct_feedback: >
      L'État de droit n'est ni la conquête transitoire de Marx ni
      l'abolition anarchiste : c'est une troisième voie qui limite et
      contrôle le pouvoir par le droit, précisément parce qu'aucune origine
      protectrice ne garantit, à elle seule, qu'il ne dérivera pas.
    solution: |
      **Ce que l'État de droit fait :** limiter et contrôler le pouvoir par
      le droit (séparation des pouvoirs, droits fondamentaux, contrôle des
      gouvernants).

      **Ce qu'il n'est pas :** ni la conquête transitoire de Marx, ni
      l'abolition anarchiste.

      **Pourquoi il est nécessaire :** aucune origine protectrice d'un
      pouvoir ne garantit, à elle seule, qu'il ne dérivera pas.

  - id: ETA-22
    rung: "R7"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [methode_dissertation, analyse_des_termes, etat_gouvernement]
    stem: >
      Pour le sujet « Faut-il craindre l'État, ou seulement son absence ? »,
      un élève écrit dans son introduction : « Je vais montrer que le
      gouvernement actuel de tel pays doit être craint, car il commet des
      injustices. » Quelle erreur commet-il dès l'analyse des termes du sujet ?
    type: mcq
    choices:
      - id: A
        text: "Il commet l'erreur inverse : le sujet porterait en réalité sur un gouvernement précis, et non sur l'État en tant qu'institution."
        correct: false
        feedback: >
          C'est l'inverse : le sujet porte sur l'institution politique
          permanente, pas sur tel gouvernement précis qu'on pourrait juger
          bon ou mauvais.
      - id: B
        text: "Il confond le gouvernement, qui change et peut être bon ou mauvais, avec l'État en tant qu'institution politique permanente -- c'est de cette institution, et non d'un gouvernement précis, que parle le sujet."
        correct: true
      - id: C
        text: "Aucune erreur : partir d'un gouvernement précis serait la meilleure façon de traiter concrètement n'importe quel sujet sur l'État."
        correct: false
        feedback: >
          Illustrer par un exemple concret ne dispense pas de traiter le
          sujet à son bon niveau de généralité : ici, l'État comme
          institution, pas un gouvernement particulier.
      - id: D
        text: "Il confond craindre et légitimité, deux notions qui n'ont pourtant aucun rapport avec l'analyse des termes de ce sujet précis."
        correct: false
        feedback: >
          Ce n'est pas cette confusion-là qui est en jeu : l'erreur porte
          sur gouvernement et État, pas sur craindre et légitimité.
    correct_feedback: >
      Comme en R1, le gouvernement change tandis que l'État subsiste : un
      sujet sur « l'État » vise l'institution permanente, pas tel
      gouvernement qu'on pourrait juger bon ou mauvais.
    solution: |
      **Le sujet vise :** l'État comme institution permanente.

      **Ce que l'élève fait :** il glisse vers un gouvernement précis, qui
      change et peut être jugé bon ou mauvais.

      **Rappel (R1) :** ne pas confondre ce qui change (gouvernement) et ce
      qui demeure (État).

  - id: ETA-23
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [methode_dissertation, problematisation]
    stem: >
      Pour le sujet « Peut-on désobéir légitimement à l'État ? », laquelle
      des démarches suivantes correspond à une véritable problématisation,
      plutôt qu'à une reformulation du sujet ou à un choix de camp immédiat ?
    type: mcq
    choices:
      - id: A
        text: "Répondre d'emblée que non, on ne peut jamais désobéir légitimement à l'État, puisque Hobbes l'interdit absolument, et bâtir tout le devoir sur la seule défense de cette thèse."
        correct: false
        feedback: >
          Une bonne dissertation ne choisit jamais un terme en écartant
          simplement l'autre dès l'introduction -- elle construit une
          tension entre positions également légitimes en apparence.
      - id: B
        text: "Reformuler simplement le sujet : ce devoir se demande si l'on peut, ou non, désobéir légitimement à l'État."
        correct: false
        feedback: >
          Une problématique ne reformule pas simplement le sujet : elle
          doit faire apparaître une tension entre deux positions, pas
          répéter la question sous une autre forme.
      - id: C
        text: "Formuler la tension suivante : si obéir à la loi peut être un devoir légitime (Rousseau, Weber), comment expliquer que Locke reconnaisse pourtant un droit de résistance en cas de trahison du contrat -- et à quelles conditions précises la désobéissance cesse-t-elle d'être une simple révolte pour devenir légitime ?"
        correct: true
      - id: D
        text: "Décrire en détail l'histoire des révolutions du XVIIIe siècle, sans jamais mobiliser Hobbes, Locke, Rousseau ou Weber."
        correct: false
        feedback: >
          Cela ignore les auteurs precisément mobilisables sur ce point du
          programme -- une problématique doit s'appuyer sur les tensions
          construites par la leçon, pas les contourner.
    correct_feedback: >
      Une problématique met en tension deux positions également légitimes
      en apparence (obéissance comme devoir vs droit de résistance), sans
      trancher d'avance ni se contenter de reformuler le sujet.
    solution: |
      **Ce qu'une problématique n'est pas :** ni un choix de camp
      immédiat, ni une simple reformulation du sujet.

      **Ce qu'elle est :** une tension construite entre deux positions
      également légitimes en apparence (ici, devoir d'obéir vs droit de
      résistance).

      **Erreur à éviter :** ignorer les auteurs du programme mobilisables
      sur la question.

  - id: ETA-24
    rung: "R7"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [methode_dissertation, depassement, plan_dialectique]
    stem: >
      Selon la méthode illustrée en R7, quelle est la fonction d'une bonne
      partie III (le « dépassement ») dans un plan dialectique sur l'État ?
    type: mcq
    choices:
      - id: A
        text: "Elle répète, avec d'autres mots, les arguments déjà développés en partie I, pour montrer que la thèse initiale était en réalité la bonne réponse depuis le début."
        correct: false
        feedback: >
          Ce n'est pas une répétition de la thèse : un vrai dépassement
          introduit un critère nouveau, plus précis, qui n'était présent ni
          dans la thèse ni dans l'antithèse.
      - id: B
        text: "Elle introduit un tout nouveau sujet, sans lien avec la problématique de l'introduction, pour montrer l'étendue des connaissances de l'élève sur d'autres notions du programme."
        correct: false
        feedback: >
          Le dépassement doit rester articulé à la problématique posée en
          introduction, pas s'en écarter vers un autre sujet.
      - id: C
        text: "Elle choisit définitivement l'antithèse contre la thèse, en expliquant pourquoi la partie II avait raison et la partie I avait tort."
        correct: false
        feedback: >
          Ce n'est encore qu'un choix de camp, comme en partie I ou II :
          le dépassement ne tranche pas entre les deux, il les dépasse par
          un critère nouveau.
      - id: D
        text: "Elle ne tranche pas entre la thèse et l'antithèse en écartant simplement l'une des deux : elle identifie ce qui, dans chacune, était partiellement vrai, et introduit un critère plus précis -- ici, les conditions de la légitimité du pouvoir -- qui permet de dépasser la simple alternative."
        correct: true
    correct_feedback: >
      Le dépassement n'est ni une répétition de la thèse, ni un choix de
      l'antithèse, ni une digression : il introduit un critère nouveau (les
      conditions de la légitimité) qui dépasse l'alternative posée en
      introduction.
    solution: |
      **Ce que le dépassement n'est pas :** ni répétition de la thèse, ni
      victoire de l'antithèse, ni digression hors sujet.

      **Ce qu'il fait :** il reconnaît une part de vérité dans chaque
      terme, puis introduit un critère nouveau et plus précis.

      **Exemple du cours (R7) :** les conditions de la légitimité du
      pouvoir (force/droit, État de droit) dépassent l'alternative
      protection/négation de la liberté.
