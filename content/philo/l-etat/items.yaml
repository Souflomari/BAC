notion: l-etat
skill_code: philo_etat
misconceptions: []

items:
  - id: ETA-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [distinction_concepts, etat_gouvernement]
    stem: >
      Après des élections qui portent un nouveau parti au pouvoir, un
      journaliste écrit : « Le pays a changé d'État. » Qu'est-ce que cette
      phrase confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond l'État et la société : ce sont les rapports entre individus qui ont changé, pas l'appareil politique."
        correct: false
        feedback: >
          Ce n'est pas l'erreur en jeu ici : la société (le tissu des
          rapports entre individus) n'est pas non plus ce dont parle la
          phrase. L'erreur porte précisément sur la confusion entre
          gouvernement (ce qui change) et État (ce qui subsiste).
      - id: B
        text: "Elle confond l'État et la nation : un changement de gouvernement modifierait, selon cette lecture, le sentiment d'appartenance collective du pays."
        correct: false
        feedback: >
          La nation (une identité partagée -- langue, histoire, mémoire
          commune) n'est pas non plus en cause dans cette phrase, et ne
          change évidemment pas au rythme des élections. L'erreur porte sur
          gouvernement et État, pas sur nation et État.
      - id: C
        text: "Elle confond le gouvernement, qui change avec les élections, et l'État, l'appareil permanent qui subsiste à travers ces changements."
        correct: true
      - id: D
        text: "Il n'y a aucune confusion : gouvernement et État sont, en philosophie politique, deux noms pour la même réalité."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes : le trait décisif du gouvernement est
          qu'il change (élections, alternance), alors que l'État, lui,
          demeure précisément à travers ces changements -- c'est ce critère
          de permanence qui les distingue.
    correct_feedback: >
      Le gouvernement désigne ceux qui exercent le pouvoir à un instant
      donné et qui changent avec les élections ; l'État désigne l'appareil
      permanent (lois, administration, justice, territoire) qui subsiste à
      travers ces changements. Confondre les deux, c'est confondre ce qui
      change avec ce qui demeure.
    solution: |
      **Le gouvernement :** les personnes et institutions qui exercent le
      pouvoir exécutif à un moment donné -- change avec les élections,
      l'alternance, parfois un coup de force.

      **L'État :** l'appareil impersonnel et permanent -- lois,
      administration, justice, armée, territoire, souveraineté -- qui
      continue d'exister à travers les changements de gouvernement.

      **Ce que la phrase du journaliste manque :** un changement de
      gouvernement ne signifie pas un changement d'État. Les tribunaux, les
      frontières, les traités en vigueur restent les mêmes.

  - id: ETA-2
    rung: "R2"
    difficulty_level: 2
    skill_code: philo_etat
    tags: [hobbes, leviathan, distinction_auteurs]
    stem: >
      Un élève affirme : « C'est Rousseau qui, dans le Léviathan, décrit
      l'état de nature comme une guerre de tous contre tous. » Qu'est-ce que
      cette affirmation confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond Hobbes et Locke : c'est en réalité Locke qui est l'auteur du Léviathan."
        correct: false
        feedback: >
          Locke n'est l'auteur ni du Léviathan (Hobbes) ni de cette
          description de l'état de nature. Locke propose au contraire un
          état de nature plus mesuré, gouverné en partie par la raison, très
          différent de la guerre de tous contre tous de Hobbes.
      - id: B
        text: "Elle confond deux auteurs : le Léviathan et la guerre de tous contre tous sont de Hobbes, non de Rousseau, qui défend dans Du contrat social un état de nature bien plus paisible."
        correct: true
      - id: C
        text: "L'affirmation est globalement exacte : seul le titre de l'oeuvre serait légèrement mal orthographié, et tout le reste de l'attribution de l'oeuvre comme de la thèse resterait parfaitement correct."
        correct: false
        feedback: >
          Ce n'est pas une simple coquille de titre : c'est l'attribution
          entière de l'oeuvre ET de la thèse qui est erronée. Le Léviathan
          est un ouvrage de Hobbes, et la thèse de la guerre de tous contre
          tous lui appartient également.
      - id: D
        text: "Elle confond l'état de nature et le contrat social, deux moments différents d'une même théorie chez Hobbes."
        correct: false
        feedback: >
          L'état de nature et le contrat social sont bien deux moments
          distincts de l'argumentation de Hobbes, mais ce n'est pas la
          confusion présente dans la phrase : le problème ici est
          l'attribution de l'oeuvre et de la thèse à un mauvais auteur
          (Rousseau au lieu de Hobbes), pas une confusion interne à la
          théorie hobbesienne.
    correct_feedback: >
      Le Léviathan (1651) et la thèse de la guerre de tous contre tous
      appartiennent à Hobbes. Rousseau écrit Du contrat social (1762) et
      conteste, au contraire, l'idée que l'état de nature soit originellement
      violent.
    solution: |
      **L'oeuvre et son auteur :** le Léviathan (1651) est un ouvrage de
      Hobbes, pas de Rousseau.

      **La thèse :** l'état de nature comme guerre de tous contre tous
      (compétition, défiance, gloire) est une thèse de Hobbes.

      **Rousseau, par contraste :** dans Du contrat social (1762), il
      défend une image beaucoup plus paisible de l'état de nature,
      précisément pour contester la vision hobbesienne.

  - id: ETA-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [locke, hobbes, contrat_social, distinction_auteurs]
    stem: >
      En quoi la théorie du contrat de Locke diffère-t-elle fondamentalement
      de celle de Hobbes ?
    type: mcq
    choices:
      - id: A
        text: "Locke penserait que l'état de nature est encore plus violent et plus dangereux que ne le décrit déjà Hobbes, ce qui justifierait à ses yeux l'institution d'un pouvoir souverain encore plus fort et plus absolu."
        correct: false
        feedback: >
          C'est l'inverse : l'état de nature de Locke est un état d'égalité
          et de liberté, gouverné en partie par la raison -- bien moins
          violent que la guerre de tous contre tous de Hobbes. Ce n'est
          d'ailleurs pas la violence qui pousse à en sortir chez Locke, mais
          l'insécurité de droits déjà existants.
      - id: B
        text: "Locke, comme Hobbes, soutient que le pouvoir souverain doit être absolu et non révocable une fois le contrat conclu."
        correct: false
        feedback: >
          C'est précisément le point sur lequel les deux théories
          s'opposent : chez Locke, le pouvoir politique est un mandat de
          confiance conditionnel, révocable si le gouvernement trahit sa
          mission de protection des droits -- ce qui ouvre un droit de
          résistance que Hobbes refuse.
      - id: C
        text: "Locke nie l'existence de tout état de nature antérieur à l'État."
        correct: false
        feedback: >
          Locke affirme bien l'existence d'un état de nature -- il en
          propose seulement un portrait très différent de celui de Hobbes :
          un état d'égalité et de liberté où des droits naturels existent
          déjà, mais restent fragiles faute de juge et de force communs.
      - id: D
        text: "Chez Locke, des droits naturels préexistent au contrat et le pouvoir reste révocable s'il ne les protège pas ; chez Hobbes, les droits naissent du contrat et le pouvoir souverain est quasi irrévocable."
        correct: true
    correct_feedback: >
      Pour Locke, l'État protège des droits naturels préexistants et son
      pouvoir reste conditionnel et révocable. Pour Hobbes, les droits
      naissent du contrat et le pouvoir souverain est quasi absolu -- la
      différence porte sur l'origine des droits et la révocabilité du
      pouvoir, pas sur un simple degré de sévérité.
    solution: |
      **Hobbes :** les droits n'existent qu'à partir du contrat ; le pouvoir
      souverain, une fois institué, est quasiment irrévocable -- car un
      droit individuel de désobéir recréerait la guerre de tous contre tous.

      **Locke :** des droits naturels (vie, liberté, propriété) existent
      déjà avant le contrat ; le pouvoir politique n'est qu'un mandat de
      confiance, légitime seulement s'il protège ces droits, et révocable
      (droit de résistance) s'il les trahit.

      **L'erreur à éviter :** traiter Locke comme une version simplement
      "plus douce" de Hobbes -- la différence est structurelle, pas de
      degré.

  - id: ETA-4
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_etat
    tags: [rousseau, volonte_generale, contrat_social]
    stem: >
      Quelle affirmation distingue correctement la volonté générale et la
      volonté de tous, chez Rousseau ?
    type: mcq
    choices:
      - id: A
        text: "La volonté générale vise l'intérêt commun de la communauté ; la volonté de tous n'est que la somme des intérêts particuliers, qui peuvent se neutraliser sans jamais viser le bien commun."
        correct: true
      - id: B
        text: "Ce sont deux expressions synonymes que Rousseau emploie indifféremment pour désigner le résultat d'un vote majoritaire."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes chez Rousseau : la volonté de tous
          est la simple addition d'intérêts particuliers, tandis que la
          volonté générale vise spécifiquement l'intérêt commun -- une
          majorité peut parfaitement exprimer une volonté de tous sans
          exprimer la volonté générale.
      - id: C
        text: "La volonté générale désignerait la volonté personnelle et privée du souverain, nettement séparée de celle des simples sujets qu'il gouverne, exactement comme chez Hobbes lorsque tous transfèrent leur droit au Léviathan."
        correct: false
        feedback: >
          C'est confondre Rousseau et Hobbes. Chez Rousseau, il n'existe pas
          de souverain séparé des sujets : la volonté générale est la
          volonté du corps politique lui-même, dont chaque citoyen est
          membre à part égale -- pas celle d'un tiers auquel on aurait
          transféré son droit, comme chez Hobbes.
      - id: D
        text: "La volonté de tous est plus exigeante que la volonté générale, car elle demande l'unanimité complète de tous les citoyens."
        correct: false
        feedback: >
          La distinction ne porte pas sur le degré d'unanimité requis, mais
          sur ce qui est visé : intérêts privés juxtaposés (volonté de tous)
          contre intérêt commun de la communauté (volonté générale).
    correct_feedback: >
      La volonté de tous additionne des intérêts particuliers, qui peuvent
      se neutraliser sans rien viser de commun. La volonté générale vise
      spécifiquement le bien de la communauté en tant que telle -- c'est
      elle seule que la loi légitime doit exprimer.
    solution: |
      **La volonté de tous :** somme brute des volontés particulières --
      chacun votant selon son seul intérêt privé.

      **La volonté générale :** ce que la communauté veut en tant que
      corps politique, en vue du bien commun -- pas la simple addition des
      préférences individuelles.

      **Pourquoi la confusion est fréquente :** les deux peuvent, dans les
      faits, produire le même résultat de vote -- mais elles ne visent pas
      la même chose, et seule la volonté générale rend, pour Rousseau, la
      loi légitime.

  - id: ETA-5
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [rousseau, weber, force_droit, legitimite]
    stem: >
      Pourquoi Rousseau affirme-t-il que « le plus fort n'est jamais assez
      fort pour être toujours le maître, s'il ne transforme sa force en
      droit... » ?
    type: mcq
    choices:
      - id: A
        text: "Parce que le plus fort devrait, selon Rousseau, chercher à accroître encore sa force pour dominer plus durablement ses sujets."
        correct: false
        feedback: >
          C'est l'inverse de la thèse de Rousseau : il ne recommande pas
          d'augmenter la force, mais montre que la force seule, aussi
          grande soit-elle, ne peut jamais suffire à fonder un pouvoir
          durable -- elle doit se convertir en droit reconnu comme légitime.
      - id: B
        text: "Parce que cette formule concerne exclusivement la puissance économique d'un État, pas son autorité politique."
        correct: false
        feedback: >
          La formule porte sur la nature de l'obéissance politique en
          général -- la différence entre être forcé d'obéir et être dans
          l'obligation d'obéir -- pas spécifiquement sur des rapports de
          puissance économique.
      - id: C
        text: "Parce qu'un pouvoir fondé sur la seule force n'obtient qu'une soumission qui dure autant qu'elle : sitôt la force affaiblie, l'obéissance cesse, faute d'avoir été un devoir reconnu."
        correct: true
      - id: D
        text: "Parce qu'elle justifie qu'un souverain, une fois son monopole de la violence légitime établi au sens de Weber, puisse en abuser indéfiniment sans que cela remette en cause sa légitimité."
        correct: false
        feedback: >
          C'est un contresens : la formule de Rousseau vise justement à
          montrer qu'une autorité fondée sur la seule force reste fragile et
          non légitime -- elle ne garantit à personne un usage illimité et
          incontestable du pouvoir, quel que soit son monopole de fait sur
          la contrainte.
    correct_feedback: >
      Rousseau distingue être forcé d'obéir (une soumission qui dure tant
      que la contrainte s'exerce) et être dans l'obligation d'obéir (un
      devoir reconnu comme tel, qui persisterait même sans contrainte
      immédiate). La force seule ne produit jamais ce second type
      d'obligation -- d'où la nécessité de la convertir en droit.
    solution: |
      **Le mécanisme :** une soumission obtenue par la seule force cesse
      dès que le rapport de force s'inverse -- ce n'était jamais qu'une
      contrainte, pas un devoir reconnu.

      **Ce qu'il faut pour qu'un pouvoir dure :** convertir la force en
      droit, l'obéissance en devoir -- de sorte que l'obligation persiste
      même quand la contrainte physique immédiate vient à manquer.

      **Le lien avec Weber :** l'État revendique le monopole de la violence
      physique légitime -- mais "légitime" ne veut pas dire "moralement
      juste en toutes circonstances" ni "à l'abri de toute contestation" ;
      c'est précisément cette nuance qui permet ensuite les critiques de
      l'État (R6).

  - id: ETA-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_etat
    tags: [marx, anarchisme, etat_de_droit, critiques_etat]
    stem: >
      Un élève écrit : « Marx et les anarchistes défendent, au fond, la même
      position sur l'État : il faut le détruire. » Qu'est-ce que cette
      phrase manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que Marx défend en réalité l'État de droit, alors que les anarchistes le rejettent."
        correct: false
        feedback: >
          L'État de droit (limiter le pouvoir par la séparation des
          pouvoirs, des droits fondamentaux, le contrôle des gouvernants)
          est une troisième tradition, distincte à la fois de Marx et de
          l'anarchisme -- ni Marx ni les anarchistes ne défendent cette
          position, qui vise à encadrer l'État plutôt qu'à le transformer
          économiquement ou à l'abolir.
      - id: B
        text: "Elle efface une différence décisive : Marx veut s'emparer de l'État pour une phase transitoire, avant sa disparition une fois les classes abolies, quand les anarchistes veulent l'abolir d'emblée."
        correct: true
      - id: C
        text: "Elle manque le fait que les anarchistes veulent au contraire un État plus fort, capable de mieux protéger les travailleurs."
        correct: false
        feedback: >
          C'est l'inverse de la position anarchiste : Proudhon et Bakounine
          soutiennent que toute concentration de pouvoir étatique,
          quel qu'en soit le titulaire, tend à se retourner en domination --
          d'où leur volonté d'abolir l'État plutôt que de le renforcer.
      - id: D
        text: "Elle manque le fait que Marx considérerait l'État comme une institution éternelle et proprement indépassable, tout à l'opposé des anarchistes, qui seraient alors les seuls à en annoncer la disparition future."
        correct: false
        feedback: >
          Marx, lui aussi, anticipe la disparition de l'État -- mais par une
          voie différente et à un rythme différent (une transformation
          économique préalable, puis un dépérissement progressif), alors
          que les anarchistes visent une abolition directe et immédiate,
          sans phase de transition étatique.
    correct_feedback: >
      Marx et les anarchistes critiquent tous deux l'ordre existant, mais ne
      proposent pas le même remède : Marx envisage une conquête transitoire
      de l'État en vue de sa disparition ultérieure ; les anarchistes
      rejettent toute concentration de pouvoir étatique, y compris
      révolutionnaire, et veulent l'abolir sans détour.
    solution: |
      **Marx :** l'État est l'instrument d'une classe dominante -- il faut
      s'en emparer (phase transitoire), puis viser sa disparition une fois
      les classes abolies.

      **Les anarchistes (Proudhon, Bakounine) :** toute concentration de
      pouvoir étatique, même révolutionnaire, reproduit la domination --
      il faut l'abolir directement, sans phase de transition.

      **L'État de droit :** une troisième voie, distincte des deux
      précédentes -- ni transformation économique ni abolition, mais
      limitation du pouvoir par le droit (séparation des pouvoirs, droits
      fondamentaux, contrôle des gouvernants).
