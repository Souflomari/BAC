# In-lesson checkpoint items (summit-conversion campaign). Formative,
# calm-core probes placed inside the lesson via [[checkpoint:<id>]] markers —
# NOT the end bank (items.yaml). Same item schema, but NO score/streak/tally.
# Wrong-answer feedback names the wrong PHILOSOPHICAL model, not just the
# fact of being wrong. The end-bank ≥3-per-misconception floor lives in
# items.yaml's coverage_summary and is NOT altered by these checkpoints (a
# clone or a fresh item here is surfaced inline, never re-counted toward that
# floor — house convention, see la-liberte/theorie-experience/autrui's
# checkpoints.yaml headers).
#
# EVERY distractor carries a real `misconception:` id (no null tags) — the
# task's stricter-than-house-default instruction, matched here to
# items.yaml.
#
# No dedicated "cp-bac-…" priming checkpoint before [[exercise:r-bac]]: this
# notion's ONE verified text maps directly onto R1 and R7, which R0-R8
# already teach in full (per the sujets-bank's own cross-reference), so
# there is no new axis to prime — matching the house precedent set by
# content/philo/autrui/checkpoints.yaml for the identical single-verified-
# text, already-taught-axis case. Instead, every checkpoint below is placed
# to give in-lesson exposure to the item-bank's thinnest/zero-coverage
# models (see items.yaml's coverage_summary), stacking a reinforcement
# choice onto the checkpoint whose rung is philosophically closest to that
# under-floor model.
#
