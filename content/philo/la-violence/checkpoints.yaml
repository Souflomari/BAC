#                                    la-violence (primary), droit-de-nature-
#                                    confondu-avec-droit-moral (dual);
#                                    reinforces trois-ressorts-hobbes-
#                                    confondus (under-floor, 2/27).
#   cp-r4-rousseau    (after R4)  — rupture gate: hobbes-rousseau-confondus
