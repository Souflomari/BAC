# Attempt-first exercises (summit-conversion campaign). Rendered by
# AttemptFirstExercise via [[exercise:<id>]] markers in lesson.md: the
# student sees the question, commits to an attempt, and only then unlocks
# the expert reasoning. Printed solutions at the summit are a template-v2
# failure (docs/pipeline/NOTION-TEMPLATE-V2.md).
#
# `sourcing` is AUTHORING-SIDE ONLY (never rendered — see rlc-serie's header
# comment for the audit U3/C2 rule this follows): while status != sourced,
# the notion is NOT DONE.
#
# PHILO judgment call — no steps[], no math (docs/pipeline/SUMMIT-CONVERSION-
# RECIPE.md, "Philo" addendum): every question's `reasoning` carries the
# full philosophical argument in prose — thèse identification, argument
# analysis, position justification — never a stepped derivation.
#
# r-bac/r-variation sourcing decision (per the recipe addendum's decision
# rule): docs/sujets/philo/la-violence.md carries exactly ONE verified entry
# for this notion — "2021 — session normale — موضوع الأول (سؤال)", statut
# « vérifié — via reproduction indépendante typée (profsalmi), scan officiel
# non ré-OCRisé ; citation/consigne/en-tête conformes (agent-vérificateur,
# 2026-07-15) ». This notion was CONFIRMED in-scope by the cadre-challenger
# (not contested). Unlike la-liberte (which had TWO verified texts and could
# reuse the second one for r-variation), this notion has only one — so per
# the recipe's fallback rule, r-variation is a FRESH fabricated twin,
# `status: not-applicable`, rather than a second sourced text. To respect
# the addendum's caution against fabricating "bad philosophy" (a
# philosophical paraphrase can subtly misstate a thesis with nothing to
# catch it, unlike a maths/PC twin), r-variation is written as an
# HONESTLY-LABELLED constructed practice exercise — mirroring the house
# precedent set by content/philo/autrui/exercises.yaml for the identical
# single-verified-text case (French only, no invented Arabic original
# dressed up as a translated bac citation — a real Moroccan bac text IS
# bilingual by provenance; a fabricated one has no business pretending to
# be). r-bac's own axis (اللجوء إلى العنف / recours à la violence, دولة
# الحق / État de droit) maps directly onto R1 (force légitime vs violence,
# le monopole wébérien) and R7 (l'État peut-il être lui-même une forme de
# violence) — both already taught in full — so, exactly as in the autrui
# precedent, no dedicated "new axis" priming checkpoint was added before
# [[exercise:r-bac]] (see checkpoints.yaml's header for what was
# prioritized instead: the item-bank's thinnest/zero-coverage models).
# r-variation targets a DIFFERENT already-taught axis (R5/R6 — violence
# révolutionnaire and moyens/fins chez Gandhi) rather than re-walking R1/R7,
