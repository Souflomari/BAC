          Ces questions appartiennent à R2, pas à l'annonce de R0 : R0
          pose des questions plus larges (distinction force/violence,
          origine de la violence, violence et fin juste), dont R2
          approfondira seulement la seconde.
      - id: C
        text: "Ce qui distingue une force légitime d'un acte de violence ; si la violence est un donné de la nature humaine ou le produit des institutions et des rapports sociaux ; si elle peut être employée au nom d'une cause juste sans se nier elle-même."
        correct: true
      - id: D
        text: "Si l'État détient bien, selon Max Weber, le monopole de la violence légitime -- une question que la scène du quartier permettrait à elle seule de trancher définitivement."
        correct: false
        feedback: >
          R0 ne prétend trancher aucune de ces questions -- il se
          contente de les poser, pour que la leçon les construise
