notion: la-violence
skill_code: philo_violence
misconceptions: []

items:
  - id: VIO-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_violence
    tags: [force_legitime, weber, distinction_concepts]
    stem: >
      Quatre voisins surprennent un cambrioleur en flagrant délit et le
      frappent eux-mêmes, sans intervention de la police, jusqu'à ce qu'il ne
      puisse plus se relever. Pourquoi cet acte reste-t-il, au sens précis du
      terme, un acte de violence plutôt qu'une force légitime -- même si
      l'homme était bien coupable ?
    type: mcq
    choices:
      - id: A
        text: "Parce que tout contact physique entre deux personnes constitue, par définition, un acte de violence, quel que soit le contexte."
        correct: false
        feedback: >
          Ce n'est pas ce qui définit la violence : la force elle-même est
          neutre (un policier qui maîtrise un suspect exerce aussi une force
          physique). Ce qui distingue la violence de la force légitime, ce
          n'est pas le contact physique en soi, mais l'absence de loi, de
          procédure et de tiers impartial encadrant son usage.
      - id: B
        text: "Parce qu'ils étaient à la fois accusateurs, juges et exécuteurs, sans loi qui les y habilite, sans procédure connue à l'avance, et sans tiers impartial pour en contrôler la proportion."
        correct: true
      - id: C
        text: "Parce que la victime était réellement coupable, ce qui rend d'emblée illégitime toute réaction à son égard."
        correct: false
        feedback: >
          La culpabilité de la victime n'est pas ce qui est en cause ici :
          un tribunal peut légitimement sanctionner un coupable avéré. Le
          problème ne porte pas sur la culpabilité de l'homme battu, mais sur
          l'absence de procédure et de tiers impartial encadrant l'acte des
          quatre voisins.
      - id: D
        text: "Parce que seule une institution officielle comme la police pourrait, par définition et quelles que soient les circonstances, exercer une force physique sans que cela constitue jamais un acte de violence."
        correct: false
        feedback: >
          Ce n'est pas la nature de l'acteur (policier ou non) qui est le
          critère décisif en lui-même, mais le fait que l'acte découle d'une
          loi, suive une procédure connue à l'avance, et reste contestable
          devant un tiers impartial -- une police qui agirait hors de toute
          procédure pourrait, elle aussi, commettre un acte de violence.
    correct_feedback: >
      La force devient légitime quand elle découle d'une règle reconnue,
      suit une procédure connue à l'avance, et reste contestable devant un
      tiers impartial. En étant à la fois accusateurs, juges et exécuteurs,
      les quatre voisins ne remplissaient aucune de ces conditions -- leur
      acte reste donc de la violence, quelle qu'ait été la culpabilité de
      leur cible.
    solution: |
      **Le critère (Weber, approfondi) :** une contrainte est légitime si
      elle découle d'une loi, suit une procédure connue à l'avance, et peut
      être contestée devant un tiers impartial.

      **Ce qui manque dans le cas des quatre voisins :** aucune loi ne les
      habilitait à agir seuls, aucune procédure, et surtout aucun tiers --
      ils étaient juges dans leur propre cause (cf. Locke, leçon "L'État",
      R3).

      **Ce que cela n'implique pas :** la culpabilité réelle du voleur ne
      change rien à ce diagnostic -- légitimité et culpabilité sont deux
      questions distinctes.

  - id: VIO-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_violence
    tags: [kant, negation_personne, persuasion]
    stem: >
      Une piqûre médicale douloureuse et consentie n'est jamais qualifiée de
      violence, alors qu'une gifle inattendue, bien moins douloureuse, l'est
      sans discussion. Qu'est-ce que ce contraste montre sur ce qui définit
      proprement la violence ?
    type: mcq
    choices:
      - id: A
        text: "Cela montre que la violence se définit uniquement par l'intensité de la douleur physique ressentie par la victime."
        correct: false
        feedback: >
          C'est l'inverse de ce que montre l'exemple : la piqûre est plus
          douloureuse que la gifle et pourtant non violente. L'intensité de
          la douleur n'est donc pas le critère qui définit la violence.
      - id: B
        text: "Cela montre que seul un acte médical peut échapper à la qualification de violence, quel que soit le consentement de la personne concernée."
        correct: false
        feedback: >
          Ce n'est pas le cadre médical en tant que tel qui est décisif,
          mais le consentement -- un acte médical pratiqué sans le
          consentement du patient pourrait, lui, être qualifié de violence.
          Le critère est l'atteinte, ou non, à la liberté d'autrui, pas le
          simple contexte médical.
      - id: C
        text: "Cela montre que la violence serait une notion purement subjective, dépendant seulement du ressenti propre à chaque individu, sans qu'aucun critère commun et objectif ne soit jamais possible."
        correct: false
        feedback: >
          L'exemple isole au contraire un critère précis et commun (le
          contournement de la liberté d'autrui, la réduction à un pur
          moyen), pas une simple affaire de ressenti individuel sans aucune
          règle générale.
      - id: D
        text: "Ce n'est pas la douleur qui définit la violence, mais le fait qu'elle contourne la liberté d'autrui au lieu de s'y adresser, réduisant la personne à un pur moyen."
        correct: true
    correct_feedback: >
      La violence se définit par le fait qu'elle contourne la liberté
      d'autrui au lieu de s'adresser à elle -- contrairement à la
      persuasion, qui présente des motifs qu'autrui reste libre de refuser.
      C'est ce contournement, plus que la douleur elle-même, qui réduit la
      personne à un pur moyen (Kant) et à un pur objet (Sartre).
    solution: |
      **Le critère kantien :** traiter l'humanité toujours comme une fin,
      jamais simplement comme un moyen -- la violence est précisément le
      geste qui rate ce principe.

      **La distinction clé :** persuader s'adresse à la raison et à la
      liberté d'autrui (qui reste libre de refuser) ; violenter contourne
      cette liberté en imposant par la contrainte ce que la persuasion
      devrait obtenir par assentiment libre.

      **Le lien avec Sartre (leçon "Autrui", R4) :** la violence physique
      pousse le conflit des libertés à son terme le plus radical -- la
      victime ne peut plus, le temps de l'acte, reprendre la position de
      sujet.

  - id: VIO-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_violence
    tags: [hobbes, droit_de_nature, distinction_auteurs]
    stem: >
      Pourquoi, selon Hobbes, la violence est-elle un fait structurel de
      l'état de nature, et non un simple accident ou une déviation
      occasionnelle ?
    type: mcq
    choices:
      - id: A
        text: "Parce que l'égalité de fait engendre compétition, défiance et gloire, et que chacun garde, faute de loi commune, un droit de nature illimité d'user de sa force pour se préserver."
        correct: true
      - id: B
        text: "Parce que Hobbes considère que la violence est moralement souhaitable et qu'il en fait l'apologie dans le Léviathan."
        correct: false
        feedback: >
          Hobbes ne fait pas l'apologie de la violence : il la décrit comme
          un fait structurel de l'absence d'autorité commune, précisément
          pour justifier la nécessité d'un pouvoir souverain qui la
          contienne -- il la constate, il ne la recommande pas.
      - id: C
        text: "Parce que, selon Hobbes, l'homme naturel est guidé par un amour-propre qui le pousse à rechercher la propriété d'autrui."
        correct: false
        feedback: >
          L'amour-propre et la critique de la propriété appartiennent à
          Rousseau (R4), pas à Hobbes. Le mécanisme hobbesien repose sur
          l'égalité de fait, les trois ressorts du conflit (compétition,
          défiance, gloire) et le droit de nature -- pas sur la propriété.
      - id: D
        text: "Parce que l'État, en instituant des lois, introduirait lui-même la violence dans une humanité qui, autrement livrée à elle-même et à ses seuls instincts, serait demeurée naturellement paisible."
        correct: false
        feedback: >
          C'est l'inverse de la thèse de Hobbes : l'État ne produit pas la
          violence, il la contient, en retirant à chacun son droit privé de
          se faire justice lui-même pour le concentrer dans les mains d'un
          souverain unique.
    correct_feedback: >
      Chez Hobbes, la violence ne résulte d'aucune institution corrompue :
      elle surgit du seul défaut d'une autorité commune capable de contenir
      des ressorts (compétition, défiance, gloire) et un droit de nature
      illimité déjà présents dans la nature humaine la plus ordinaire.
    solution: |
      **Le mécanisme :** égalité de fait + compétition, défiance, gloire +
      droit de nature illimité (aucune loi commune ne borne l'usage de la
      force) = une disposition structurelle à la violence, en l'absence
      d'autorité commune.

      **Le rôle de l'État :** contenir cette violence en retirant à chacun
      son droit privé de se faire justice, pas l'introduire.

      **L'erreur à éviter :** attribuer à Hobbes une apologie de la violence,
      ou lui prêter des thèses (amour-propre, propriété) qui appartiennent
      en réalité à Rousseau.

  - id: VIO-4
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_violence
    tags: [rousseau, hobbes, distinction_auteurs, origine_violence]
    stem: >
      Un élève écrit dans sa copie : « Rousseau, comme Hobbes, pense que
      l'homme est naturellement violent et que l'état de nature est une
      guerre de tous contre tous. » Qu'est-ce que cette phrase confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond seulement les titres des deux ouvrages : c'est bien Du contrat social, et non le Léviathan, que Rousseau a écrit, mais tout le reste de l'analyse proposée sur l'état de nature resterait parfaitement exact."
        correct: false
        feedback: >
          Ce n'est pas seulement une confusion de titre : c'est l'attribution
          entière de la thèse sur l'origine de la violence qui est erronée.
          Rousseau ne défend nulle part l'idée d'un homme naturellement
          violent, quel que soit le titre de l'ouvrage cité.
      - id: B
        text: "Elle ne confond rien : Rousseau et Hobbes défendent effectivement la même thèse sur l'état de nature, seule leur solution politique diffère ensuite."
        correct: false
        feedback: >
          C'est une erreur : Rousseau conteste, dès la racine, le portrait
          hobbesien de l'état de nature. Il ne s'agit pas d'un désaccord
          seulement sur la solution politique, mais d'un désaccord sur la
          nature humaine elle-même à l'état de nature.
      - id: C
        text: "Elle attribue à Rousseau l'inverse de sa thèse : l'homme naturel y est guidé par l'amour de soi et la pitié, et c'est la société, avec la propriété, qui produit la violence, non la nature humaine."
        correct: true
      - id: D
        text: "Elle confond l'amour de soi et l'amour-propre, deux notions que Rousseau emploie de façon interchangeable."
        correct: false
        feedback: >
          Rousseau distingue au contraire soigneusement les deux : l'amour
          de soi est un instinct de conservation neutre, l'amour-propre est
          un désir de primer sur autrui, né avec la propriété et la
          comparaison sociale. Mais ce n'est pas cette distinction interne
          qui est en cause dans la phrase de l'élève -- c'est l'attribution,
          à Rousseau, de la thèse hobbesienne de la violence naturelle.
    correct_feedback: >
      C'est l'une des confusions les plus fréquentes sur ce point du
      programme : la thèse d'un état de nature violent et d'une guerre de
      tous contre tous appartient à Hobbes, pas à Rousseau. Rousseau
      défend, à l'inverse, un homme naturel paisible et compatissant,
      corrompu ensuite par la société et la propriété.
    solution: |
      **Hobbes (R3) :** l'homme est structurellement porté à la violence dès
      que manque une autorité commune -- guerre de tous contre tous.

      **Rousseau (R4) :** l'homme naturel est guidé par l'amour de soi et la
      pitié, un frein instinctif à la cruauté. C'est l'instauration de la
      propriété, et l'amour-propre qu'elle engendre, qui produit la
      violence sociale -- pas la nature humaine elle-même.

      **Pourquoi la confusion est fréquente :** les deux auteurs discutent
      tous deux d'un "état de nature", ce qui invite à tort à leur prêter
      la même thèse sur son contenu.

  - id: VIO-5
    rung: "R6"
    difficulty_level: 3
    skill_code: philo_violence
    tags: [gandhi, non_violence, passivite]
    stem: >
      Un élève affirme : « La non-violence de Gandhi revient, au fond, à ne
      pas résister à l'injustice -- une forme de passivité ou de
      résignation. » Pourquoi cette affirmation manque-t-elle le concept
      gandhien de satyagraha ?
    type: mcq
    choices:
      - id: A
        text: "Parce que Gandhi recommandait en réalité l'usage de la force armée dès que les moyens pacifiques échouaient."
        correct: false
        feedback: >
          C'est l'inverse de la doctrine de Gandhi : le satyagraha exclut
          par principe le recours à la violence, y compris en cas d'échec
          des moyens non-violents -- ce n'est pas une étape transitoire
          avant la force armée.
      - id: B
        text: "Parce que le satyagraha est une résistance ACTIVE et organisée -- désobéissance civile publique, refus de coopérer avec des lois injustes -- qui accepte la répression pour convaincre, non un refus de résister."
        correct: true
      - id: C
        text: "Parce que la non-violence gandhienne ne s'oppose à aucune loi en particulier, mais se contente d'exprimer un désaccord moral privé, sans action publique."
        correct: false
        feedback: >
          C'est l'inverse : le satyagraha suppose une désobéissance civile
          publique et organisée (comme la Marche du sel), pas un simple
          désaccord privé sans traduction dans l'action.
      - id: D
        text: "Parce que la non-violence, selon Gandhi, ne demanderait pas plus de courage ni de détermination que la riposte violente elle-même -- les deux voies seraient finalement équivalentes en fait d'exigence et de fermeté."
        correct: false
        feedback: >
          Gandhi soutient au contraire que refuser de rendre les coups, tout
          en continuant de résister publiquement, demande davantage de force
          intérieure que la simple riposte -- ce n'est pas une voie plus
          facile ou équivalente.
    correct_feedback: >
      Le satyagraha n'est pas un refus de résister : c'est une résistance
      active, publique et organisée, qui accepte consciemment la répression
      pour convaincre -- une troisième voie, distincte à la fois de la
      violence et de la passivité.
    solution: |
      **Le mécanisme :** désobéissance civile publique (ex. Marche du sel,
      1930) + acceptation consciente de la répression, sans riposte + visée
      de convaincre l'adversaire ou l'opinion.

      **Le lien avec R2 :** le satyagraha s'adresse à la conscience de
      l'adversaire (comme la persuasion), plutôt que de contourner sa
      liberté (comme la violence) ou de s'y résigner (comme la passivité).

      **L'erreur à éviter :** confondre non-violence et passivité -- c'est
      manquer précisément ce qui fait la radicalité active du satyagraha.

  - id: VIO-6
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_violence
    tags: [bourdieu, weber, violence_symbolique, legitimite]
    stem: >
      En quel sens le concept de « violence symbolique » chez Bourdieu
      vient-il compléter, sans l'annuler, la distinction entre force
      légitime et violence posée par Weber (R1) ?
    type: mcq
    choices:
      - id: A
        text: "Bourdieu démontrerait que la distinction établie par Weber serait entièrement fausse et illusoire, et que tout pouvoir dit légitime ne serait jamais, en réalité comme en dernière analyse, rien d'autre qu'une pure violence physique soigneusement déguisée sous les apparences respectables du droit et de la procédure."
        correct: false
        feedback: >
          C'est une lecture excessive : Bourdieu ne prétend pas que la
          distinction de Weber soit fausse ni que toute légitimité ne soit
          qu'un déguisement de la force physique -- il ajoute un mécanisme
          distinct (l'absence de contrainte physique, la méconnaissance),
          qui complète l'analyse de Weber plutôt qu'il ne l'annule.
      - id: B
        text: "Bourdieu utilise le terme de violence symbolique pour désigner une contrainte physique exercée par l'État sans passer par une procédure judiciaire connue à l'avance."
        correct: false
        feedback: >
          La violence symbolique, chez Bourdieu, se définit précisément par
          l'ABSENCE de toute contrainte physique -- c'est un mécanisme de
          domination qui n'a besoin d'aucune force physique pour opérer,
          contrairement à ce que suggère cette formulation.
      - id: C
        text: "Bourdieu confirme simplement que « légitime », chez Weber, signifie déjà « moralement juste en toutes circonstances », ce qui rend son propre concept redondant."
        correct: false
        feedback: >
          C'est l'inverse : Weber lui-même précise que "légitime" ne veut
          pas dire "moralement juste" (cf. leçon "L'État", R5) ; c'est
          précisément cette faille -- une légitimité reconnue qui peut
          masquer une domination -- que le concept de violence symbolique
          vient interroger, pas confirmer une équivalence entre les deux
          termes.
      - id: D
        text: "Bourdieu montre qu'une domination peut s'exercer sans contrainte physique, les dominés tenant pour naturelles des normes arbitraires (méconnaissance) -- la reconnaissance qui fonde la légitimité wébérienne peut alors relever d'une violence plus discrète, sans annuler la distinction de Weber."
        correct: true
    correct_feedback: >
      La violence symbolique n'efface pas le monopole légitime décrit par
      Weber : elle révèle qu'une part de la reconnaissance qui rend ce
      pouvoir obéi sans recours constant à la force peut elle-même résulter
      d'une domination plus discrète, exercée par la méconnaissance plutôt
      que par la contrainte physique.
    solution: |
      **Weber (R1) :** un pouvoir est légitime s'il découle d'une loi, suit
      une procédure connue, et reste contestable devant un tiers impartial.

      **Bourdieu :** une domination peut s'exercer sans aucune contrainte
      physique, par la méconnaissance -- les dominés perçoivent des normes
      arbitraires (scolaires, culturelles, linguistiques) comme naturelles
      et légitimes.

      **Ce que cela ajoute, sans l'annuler :** la reconnaissance qui fonde,
      chez Weber, la légitimité peut être en partie l'effet de cette
      violence symbolique -- un envers du monopole légitime, pas sa
      négation.
