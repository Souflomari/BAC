notion: autrui
skill_code: philo_autrui
misconceptions: []

items:
  - id: AUT-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [husserl, alter_ego, autres_consciences]
    stem: >
      Un élève affirme : « Grâce à l'aprésentation dont parle Husserl, je
      perçois directement ce que pense mon ami quand il me regarde. » Qu'est-ce
      que cette affirmation confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond Husserl et Sartre : c'est la honte, pas l'aprésentation, qui permettrait un accès direct à la conscience d'autrui."
        correct: false
        feedback: >
          Ce n'est pas la confusion en jeu ici, et ce n'est de toute façon
          vrai ni de Husserl ni de Sartre : la honte, chez Sartre (R3), ne
          donne pas non plus un accès direct à la conscience d'autrui -- elle
          révèle seulement que j'existe comme objet regardé, pas ce que
          l'autre pense en son for intérieur.
      - id: B
        text: "Elle manque le fait que Husserl nie toute possibilité d'attribuer une vie intérieure à autrui, qui resterait, pour lui, un pur objet parmi les objets du monde."
        correct: false
        feedback: >
          C'est l'inverse : Husserl refuse justement de traiter autrui comme
          un pur objet -- il explique, par l'analogie des corps vécus,
          comment autrui m'apparaît comme un alter ego, un semblable, et non
          comme une chose. Le problème des autres consciences n'est pas nié,
          mais il n'aboutit pas non plus à un pur objet sans vie intérieure.
      - id: C
        text: "Elle confond l'aprésentation (un accès seulement indirect à une conscience que je ne perçois jamais elle-même) avec une perception directe de la conscience d'autrui -- ce que Husserl exclut : je ne perçois directement que son corps."
        correct: true
      - id: D
        text: "Elle manque le fait que, pour Husserl, autrui n'est pas vraiment un « autre » moi-même mais purement et simplement moi-même, un moi rigoureusement identique au mien, sans la moindre différence de perspective ni de vécu qui lui appartiendrait en propre."
        correct: false
        feedback: >
          L'alter ego husserlien reste littéralement un AUTRE moi-même :
          semblable à moi par la structure de son corps vécu, mais jamais
          réductible à moi, puisque sa conscience demeure un centre
          d'expérience que je ne vis jamais moi-même à sa place.
    correct_feedback: >
      L'aprésentation ne donne jamais un accès direct à la conscience
      d'autrui : je perçois directement son corps, et j'attribue, par
      analogie avec mon propre cas, une vie intérieure comparable -- sans
      que le problème des autres consciences soit pour autant résolu.
    solution: |
      **La présentation :** ce que je perçois directement -- le corps
      d'autrui, ses gestes, ses expressions.

      **L'aprésentation :** ce que je co-perçois indirectement, par
      analogie avec mon propre corps vécu -- une vie de conscience que je
      ne perçois jamais elle-même.

      **Ce que cela n'accomplit pas :** l'analogie explique comment autrui
      m'apparaît comme un alter ego plutôt que comme un objet, mais elle ne
      supprime pas le problème des autres consciences -- je n'obtiens
      jamais de preuve absolue d'une vie intérieure chez autrui.

  - id: AUT-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [hegel, reconnaissance, maitre_esclave]
    stem: >
      Pourquoi le maître, chez Hegel, reste-t-il finalement insatisfait dans
      la reconnaissance qu'il a obtenue de l'esclave ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'une reconnaissance obtenue d'un être qu'on ne reconnaît pas soi-même comme un égal ne vaut presque rien : seule une reconnaissance mutuelle satisferait pleinement une conscience de soi."
        correct: true
      - id: B
        text: "Parce que le maître, en réalité, perd physiquement le combat contre l'esclave, ce qui rend sa position intenable."
        correct: false
        feedback: >
          C'est l'inverse dans le récit de Hegel : c'est celui qui a préféré
          la mort à la soumission qui devient le maître. L'insatisfaction du
          maître ne vient pas d'une défaite physique, mais de la structure
          asymétrique de la reconnaissance qu'il obtient ensuite.
      - id: C
        text: "Parce que l'esclave, privé de toute conscience de lui-même par son travail forcé, ne peut littéralement offrir aucune reconnaissance, quelle qu'elle soit."
        correct: false
        feedback: >
          C'est le contraire : Hegel montre que l'esclave, par son travail --
          en façonnant et en maîtrisant la matière --, développe une
          conscience de lui-même plus autonome et plus durable que celle du
          maître, précisément parce qu'il continue d'agir sur le monde.
      - id: D
        text: "Parce que la dialectique du maître et de l'esclave décrit avant tout un rapport historique et social de domination économique entre les classes, sans réelle portée sur la structure de la conscience de soi en général."
        correct: false
        feedback: >
          Réduire la dialectique à une simple leçon sur la domination
          sociale ou économique manque son enjeu véritable : c'est un
          mouvement universel de la conscience de soi -- la reconnaissance
          non réciproque ne satisfait ni celui qui domine ni celui qui est
          dominé.
    correct_feedback: >
      Le maître obtient une reconnaissance, mais d'un être qu'il ne
      reconnaît pas lui-même comme un égal -- une reconnaissance asymétrique
      qui ne procure jamais la certitude pleine de soi que seule une
      reconnaissance mutuelle pourrait fonder.
    solution: |
      **La lutte à mort :** chacune des deux consciences risque sa vie pour
      être reconnue -- mais une reconnaissance obtenue par la mort de
      l'adversaire s'annule elle-même (un mort ne reconnaît rien).

      **Le maître et l'esclave :** une dissymétrie naît de la soumission de
      l'un -- reconnu sans reconnaître (le maître), reconnaissant sans être
      reconnu (l'esclave).

      **Le renversement :** la reconnaissance du maître, venant d'un être
      qu'il ne juge pas son égal, ne le satisfait jamais pleinement ;
      l'esclave, par le travail, développe une conscience de soi plus
      autonome. Seule une reconnaissance MUTUELLE satisferait authentiquement
      une conscience de soi.

  - id: AUT-3
    rung: "R3"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [sartre, honte, regard, mediateur]
    stem: >
      Dans la scène du trou de la serrure, pourquoi Sartre insiste-t-il pour
      dire que la honte n'est pas d'abord une peur d'être puni ?
    type: mcq
    choices:
      - id: A
        text: "Parce que, dans cette scène précise, la personne qui surprend le voyeur est une autorité particulièrement sévère, ce qui rend la peur de la sanction hors de propos."
        correct: false
        feedback: >
          L'identité ou la sévérité de la personne qui surprend n'est pas le
          point de Sartre : la honte surgirait structurellement de la même
          façon même si le pas dans le couloir n'appartenait, en réalité, à
          personne -- ce qui montre que ce n'est pas la sanction qui est en
          cause.
      - id: B
        text: "Parce que Sartre nie que la honte soit un sentiment réellement vécu : ce serait, chez lui, une pure construction intellectuelle et abstraite, entièrement dépourvue de la moindre dimension affective ou émotionnelle."
        correct: false
        feedback: >
          Sartre décrit au contraire la honte comme un sentiment vécu et
          immédiat, qui envahit la conscience dès le basculement du regard --
          il ne la réduit pas à une opération purement intellectuelle, il en
          isole seulement l'origine structurelle (le fait d'être objet du
          regard), pas son caractère affectif.
      - id: C
        text: "Parce que la honte, chez Sartre, exprime avant tout le désir d'obtenir la reconnaissance et l'approbation de l'autre, comme chez Hegel."
        correct: false
        feedback: >
          C'est confondre le mécanisme de Sartre avec celui de Hegel (R2) :
          Hegel décrit une reconnaissance mutuelle recherchée activement ;
          la honte sartrienne n'est pas une recherche d'approbation, c'est
          la découverte subie, immédiate, que j'existe comme objet pour un
          regard qui me précède.
      - id: D
        text: "Parce qu'on peut ressentir cette honte même sans aucun risque réel de sanction -- elle naît de la simple reconnaissance immédiate que j'existe, à cet instant, comme l'objet du regard d'un autre."
        correct: true
    correct_feedback: >
      La honte peut surgir même en l'absence totale de risque de sanction :
      elle révèle simplement que j'existe, pour un autre, comme l'objet de
      son regard -- une dimension de mon être que je ne pourrais jamais
      atteindre par ma seule introspection.
    solution: |
      **Le basculement :** absorbé dans ce que je regarde, sans aucun
      « moi » réflexif, puis brusquement conscient d'être moi-même regardé.

      **Ce que la honte révèle :** non une peur de la punition, mais la
      simple reconnaissance que je suis, pour un autre, cet être qu'il voit
      -- indépendamment de tout risque réel de conséquence.

      **La formule de Sartre :** autrui est le médiateur indispensable entre
      moi et moi-même -- certains aspects de mon être ne me sont accessibles
      que par le regard effectif d'un autre, jamais par la seule réflexion
      solitaire.

  - id: AUT-4
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [sartre, enfer_c_est_les_autres, conflit_libertes]
    stem: >
      Un élève écrit : « Sartre, avec "l'enfer, c'est les autres", veut dire
      que la compagnie des autres est simplement pénible, et qu'il vaudrait
      mieux vivre seul. » Qu'est-ce que cette lecture manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que Sartre recommande, au contraire, de chercher systématiquement à dominer et à devancer le regard de l'autre, afin de le fixer comme objet avant même qu'il ne puisse me regarder et me figer le premier dans ce duel des consciences."
        correct: false
        feedback: >
          Sartre décrit un conflit structurel entre deux libertés qui
          alternent entre regarder et être regardé -- il n'en tire aucune
          recommandation de « dominer l'autre en premier » ; ce serait
          prendre une description ontologique pour un conseil stratégique.
      - id: B
        text: "Elle manque le sens structurel de la formule : dépendre du regard d'un autre pour savoir qui je suis, sans jamais pouvoir en reprendre le contrôle -- et non une plainte sur la fréquentation d'autrui, ni un appel à la solitude."
        correct: true
      - id: C
        text: "Elle manque le fait que cette formule appartient en réalité à Hegel, dans sa description du maître et de l'esclave."
        correct: false
        feedback: >
          C'est une mauvaise attribution : « l'enfer, c'est les autres » est
          une réplique de la pièce Huis clos (1944) de Sartre, pas un énoncé
          de Hegel -- même si les deux auteurs partagent l'idée qu'autrui est
          nécessaire à la conscience de soi, cette formule précise est
          sartrienne.
      - id: D
        text: "Elle manque le fait que Sartre parle ici littéralement d'un châtiment religieux réservé à ceux qui font du mal à autrui."
        correct: false
        feedback: >
          La formule n'a aucun sens religieux ou punitif chez Sartre : elle
          désigne une structure du rapport aux autres consciences (être figé
          par un regard qu'on ne contrôle jamais), pas une sanction morale ou
          théologique.
    correct_feedback: >
      « L'enfer, c'est les autres » ne dit pas que les autres sont
      simplement pénibles : la formule désigne la dépendance structurelle
      envers un regard qui me fige dans une image que je n'ai pas choisie et
      que je ne peux jamais reprendre en main -- pas un encouragement à la
      solitude.
    solution: |
      **Le revers du regard :** être vu me révèle à moi-même (R3), mais me
      transforme aussi en objet fixé dans le monde de l'autre.

      **Le conflit des libertés :** deux consciences ne peuvent occuper
      simultanément la position de sujet -- regarder et être regardé
      s'excluent et alternent sans repos stable.

      **Le sens exact de la formule :** dans Huis clos, des personnages
      enfermés sans miroir ne peuvent plus se connaître que par le regard
      des autres, qu'ils ne contrôlent jamais -- ce n'est pas une plainte sur
      la fréquentation d'autrui, ni un conseil de solitude.

  - id: AUT-5
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [levinas, sartre, visage, regard, responsabilite]
    stem: >
      Quelle affirmation distingue correctement le visage chez Levinas et le
      regard chez Sartre ?
    type: mcq
    choices:
      - id: A
        text: "Le visage et le regard sont, chez Levinas comme chez Sartre, deux mots pour désigner exactement le même phénomène de conflit entre consciences."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes : les deux auteurs partent bien d'une
          même intuition (autrui n'est pas un simple objet), mais en tirent
          des conséquences opposées -- conflit et menace pour la liberté chez
          Sartre, responsabilité et appel éthique chez Levinas.
      - id: B
        text: "C'est le regard, chez Sartre, qui fonde une responsabilité asymétrique envers autrui ; c'est le visage, chez Levinas, qui engendre un conflit des libertés."
        correct: false
        feedback: >
          C'est l'inverse exact des deux thèses : chez Sartre, c'est le
          regard qui objective et engendre le conflit des libertés (R4) ;
          chez Levinas, c'est le visage qui fonde une responsabilité
          asymétrique, sans conflit de pouvoir (R5).
      - id: C
        text: "Le regard sartrien objective autrui et menace ma liberté, engendrant un conflit entre deux consciences ; le visage lévinassien, lui, ne m'objective ni ne me menace : il commande une responsabilité asymétrique qui précède tout choix."
        correct: true
      - id: D
        text: "Les deux concepts désignent, chez l'un comme chez l'autre, uniquement l'apparence physique et extérieure du visage -- sa forme, ses traits, la couleur des yeux ou de la peau --, indépendamment de toute portée proprement philosophique ou éthique."
        correct: false
        feedback: >
          Ni Sartre ni Levinas ne s'arrêtent à l'apparence physique : le
          regard sartrien désigne une structure de la conscience qui
          objective l'autre ; le visage lévinassien désigne une vulnérabilité
          qui résiste précisément à toute réduction à des traits descriptibles.
    correct_feedback: >
      Le regard (Sartre) objective et menace ma liberté dans un rapport de
      force ; le visage (Levinas) ne menace rien mais commande une
      responsabilité asymétrique qui précède tout choix -- deux conséquences
      opposées tirées d'une même intuition que l'autre n'est pas un simple
      objet.
    solution: |
      **Le regard (Sartre) :** objective, fige dans une image non choisie,
      installe un conflit structurel entre deux libertés qui ne peuvent être
      simultanément sujets.

      **Le visage (Levinas) :** résiste à toute réduction, commande sans
      contraindre par la force, fonde une responsabilité ASYMÉTRIQUE -- je
      suis responsable d'autrui indépendamment de ce qu'il fait en retour.

      **L'erreur à éviter :** confondre ces deux paradigmes -- l'un pense le
      rapport à autrui comme conflit, l'autre comme responsabilité qui
      précède la connaissance et la liberté.

  - id: AUT-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [kant, personne, moyen_fin, morale]
    stem: >
      Un élève affirme : « Pour Kant, il est immoral d'utiliser quelqu'un
      comme moyen, quel qu'il soit -- par exemple, payer un artisan pour un
      service serait déjà contraire au devoir. » Qu'est-ce que cette lecture
      manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le mot exact de la formule kantienne : JAMAIS SIMPLEMENT comme un moyen -- ce qui autorise d'utiliser autrui comme moyen, à condition de le traiter EN MEME TEMPS comme une fin, jamais de le réduire à un pur instrument."
        correct: true
      - id: B
        text: "Elle manque le fait que Kant autorise, au contraire, de traiter autrui uniquement comme un moyen dès lors que cela reste légal."
        correct: false
        feedback: >
          Ce n'est pas non plus la position de Kant : la légalité d'un acte
          ne suffit jamais, chez lui, à en garantir la valeur morale. Le
          principe exige de traiter l'humanité, dans la personne d'autrui,
          toujours aussi comme une fin -- jamais comme un simple moyen, même
          légal.
      - id: C
        text: "Elle manque le fait que cette formule appartient en réalité à Levinas, et non à Kant."
        correct: false
        feedback: >
          C'est une erreur d'attribution : traiter l'humanité toujours comme
          une fin, jamais simplement comme un moyen, est une formule de Kant
          (Fondements de la métaphysique des mœurs, 1785) -- Levinas fonde sa
          propre responsabilité asymétrique sur un concept différent, le
          visage (R5), sans faire appel à cette formule.
      - id: D
        text: "Elle manque le fait que ce principe ne s'appliquerait, chez Kant, qu'aux seules relations avec des inconnus croisés une seule fois, et jamais aux personnes proches que je connais et fréquente de longue date, au quotidien et en qui j'ai toute confiance."
        correct: false
        feedback: >
          La formule kantienne vise explicitement « la personne de tout
          autre », sans distinction entre proches et inconnus -- rien, dans
          le texte de Kant, ne restreint ce principe aux seules relations
          avec des inconnus.
    correct_feedback: >
      Kant n'interdit pas d'utiliser autrui comme moyen dans un échange (payer
      un service, par exemple) : il interdit de le réduire ENTIÈREMENT à un
      instrument, sans jamais le traiter aussi comme une fin en soi, digne de
      respect.
    solution: |
      **La formule exacte :** « traiter l'humanité... toujours en même temps
      comme une fin, et jamais simplement comme un moyen. »

      **Ce que cela permet :** utiliser autrui comme moyen dans un échange
      (un professeur qui te fait travailler, un artisan payé pour un
      service) reste compatible avec le respect de sa dignité, tant qu'il est
      aussi traité comme une fin.

      **Ce que cela interdit :** réduire autrui à un pur instrument, sans
      jamais reconnaître, en lui, une fin en soi qui mérite le respect
      indépendamment de ce qu'il peut apporter.

  - id: AUT-7
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_autrui
    tags: [accroche, gene_ordinaire, probleme_autrui]
    stem: >
      Selon le texte, pourquoi la première réponse (« une gêne ordinaire liée
      à cette personne précise ») ne suffit-elle pas, à elle seule, à
      expliquer ce qui se passe ?
    type: mcq
    choices:
      - id: A
        text: "On ne peut pas ressentir cette gêne face à quelqu'un qu'on connaît bien, comme une sœur -- ce sentiment ne concernerait, par définition, que des inconnus."
        correct: false
        feedback: >
          Rien dans le texte n'exclut la gêne face à un proche -- c'est même
          la scène de départ (la sœur). Le problème posé n'est pas là.
      - id: B
        text: "Le même effondrement se produit aussi devant un inconnu croisé par hasard, dont on n'a, en toute rigueur, aucune raison particulière de redouter le jugement."
        correct: true
      - id: C
        text: "Le texte affirme que cette gêne ne serait jamais un sentiment sincère, mais toujours une comédie jouée pour impressionner autrui."
        correct: false
        feedback: >
          Le texte ne dit jamais cela -- il prend la gêne au sérieux comme un
          phénomène réel, dont il cherche justement à comprendre l'origine.
      - id: D
        text: "Le texte prouve que la personne qui entre n'avait, en réalité, aucune intention de juger, ce qui rendrait toute gêne injustifiée."
        correct: false
        feedback: >
          Le texte ne tranche jamais sur l'intention réelle de la personne
          qui entre -- son argument est que l'effet se produit même face à
          un inconnu, indépendamment de toute intention connue.
    correct_feedback: >
      Si la gêne ne dépendait que de la personne précise et de son jugement
      redouté, elle ne devrait pas se produire à l'identique devant un
      inconnu -- c'est ce qui pousse le texte à chercher une explication
      plus générale.
    solution: |
      **Ce que la première réponse explique mal :** le même effondrement
      devant un inconnu, dont on ne redoute pourtant aucun jugement précis.

      **Ce que cela suggère :** la gêne n'est pas d'abord affaire de la
      personne qui entre, mais du fait même d'être regardé.

  - id: AUT-8
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_autrui
    tags: [accroche, tension_initiale, probleme_autrui]
    stem: >
      Quelle est, très précisément, la « double question » que R0 pose et
      que la leçon va construire pièce par pièce ?
    type: mcq
    choices:
      - id: A
        text: "La seule question posée est de savoir si autrui existe réellement, indépendamment de toute question de liberté."
        correct: false
        feedback: >
          Cela réduit les deux tensions du texte à une seule -- il manque la
          seconde question, sur le rapport entre autrui et ma liberté.
      - id: B
        text: "La question est de savoir si je peux percevoir directement le corps d'autrui, ou seulement son âme."
        correct: false
        feedback: >
          Ce n'est pas la dichotomie posée par R0 -- ce vocabulaire
          appartient à la construction ultérieure de Husserl (R1), pas à la
          double question de R0.
      - id: C
        text: "Autrui est-il un autre moi-même semblable au mien, ou son intériorité m'est-elle radicalement inaccessible ; et le rapport à autrui menace-t-il ma liberté, ou est-il ce sans quoi je ne pourrais devenir pleinement moi-même ?"
        correct: true
      - id: D
        text: "La question est de savoir si autrui me juge positivement ou négativement, et comment obtenir son admiration."
        correct: false
        feedback: >
          Cela réduit la question philosophique à une préoccupation sociale
          ordinaire, alors que R0 vise le statut d'autrui et son rapport à
          ma liberté.
    correct_feedback: >
      R0 pose deux tensions distinctes : le statut d'autrui (semblable ou
      radicalement inaccessible) et son rapport à ma liberté (menace ou
      condition).
    solution: |
      **Première tension :** autrui, un autre moi-même ou une intériorité
      inaccessible.

      **Seconde tension :** autrui, une menace pour ma liberté ou la
      condition de mon humanité.

  - id: AUT-9
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_autrui
    tags: [accroche, exister_pour_autrui, probleme_autrui]
    stem: >
      Qu'est-ce qui, très précisément, a « changé », selon la seconde
      réponse d'élève que le texte prend au sérieux, dans l'instant où la
      sœur entre ?
    type: mcq
    choices:
      - id: A
        text: "Le fait d'avoir enfin obtenu un public pour son exposé, ce qui devrait être une source de fierté plutôt que de gêne."
        correct: false
        feedback: >
          Cela contredit le sentiment décrit -- l'effondrement, pas la
          fierté -- et ne correspond pas à la seconde réponse citée.
      - id: B
        text: "Le simple fait d'avoir été interrompu dans son activité, un problème de concentration plus qu'une question philosophique."
        correct: false
        feedback: >
          C'est plus proche de la première réponse, jugée insuffisante -- la
          seconde va plus loin : exister désormais POUR quelqu'un d'autre.
      - id: C
        text: "La certitude immédiate d'avoir blessé sa sœur en la dérangeant, ce qui expliquerait la honte ressentie."
        correct: false
        feedback: >
          Le texte ne parle jamais d'une culpabilité envers la sœur -- il
          porte sur la découverte d'exister comme objet regardé.
      - id: D
        text: "La prise de conscience brutale d'exister aussi POUR quelqu'un d'autre -- d'être désormais regardé, jugé, situé dans le monde de quelqu'un d'autre."
        correct: true
    correct_feedback: >
      La seconde réponse ne porte pas sur la personne précise ni sur une
      faute commise : elle porte sur la découverte brutale d'exister aussi
      pour un autre, et non plus seulement pour soi.
    solution: |
      **Avant :** absorbé dans son activité, existant seulement pour soi.

      **Après :** brusquement conscient d'exister aussi pour un autre --
      regardé, jugé, situé dans un monde qui n'est pas seulement le sien.

  - id: AUT-10
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [husserl, apresentation, projection_imaginaire]
    stem: >
      Un élève écrit : « L'aprésentation chez Husserl, c'est simplement le
      fait d'imaginer librement ce que l'autre pourrait ressentir, comme on
      invente une histoire. » Qu'est-ce que cette lecture manque exactement ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque que l'aprésentation n'est pas une libre invention : c'est un transfert par analogie, déclenché par la ressemblance structurelle du corps d'autrui avec le mien -- Husserl la distingue soigneusement d'une simple projection imaginaire."
        correct: true
      - id: B
        text: "Elle manque le fait que l'aprésentation serait en réalité une perception directe et sans intermédiaire de la conscience d'autrui, qui rendrait tout raisonnement par ressemblance inutile."
        correct: false
        feedback: >
          C'est l'erreur inverse : pour Husserl, je ne perçois jamais
          directement la conscience d'autrui, seulement son corps.
      - id: C
        text: "Elle manque le fait que, pour Husserl, la ressemblance entre corps ne jouerait aucun rôle : je pourrais tout aussi bien attribuer une conscience à une pierre qu'à un être humain."
        correct: false
        feedback: >
          C'est l'inverse : c'est la ressemblance des corps vécus qui
          déclenche l'analogie -- Husserl refuse de traiter autrui comme un
          pur objet, tel une pierre.
      - id: D
        text: "Elle manque le fait que ce transfert par analogie constituerait, chez Husserl, une preuve logique rigoureuse et démonstrative de l'existence d'une conscience chez autrui."
        correct: false
        feedback: >
          C'est l'inverse : Husserl n'obtient jamais de preuve absolue,
          seulement une attribution raisonnable.
    correct_feedback: >
      L'aprésentation n'est ni une perception directe, ni une libre
      imagination : c'est un transfert par analogie fondé sur la
      ressemblance des corps vécus, jamais une preuve absolue.
    solution: |
      **Ce que ce n'est pas :** perception directe, ni imagination libre.

      **Ce que c'est :** un transfert par analogie, fondé sur la
      ressemblance des corps vécus -- une attribution raisonnable, jamais
      une preuve absolue.

  - id: AUT-11
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [husserl, autres_consciences, probleme_autrui]
    stem: >
      Quelle est, très précisément, la question posée par le « problème des
      autres consciences », selon le texte ?
    type: mcq
    choices:
      - id: A
        text: "Comment puis-je faire en sorte qu'autrui me reconnaisse comme une conscience digne de respect ?"
        correct: false
        feedback: >
          C'est une question de reconnaissance entre consciences, pas le
          problème posé par Husserl -- il s'agit de savoir si autrui a une
          vie intérieure du tout, pas d'obtenir sa reconnaissance.
      - id: B
        text: "Comment puis-je être assuré qu'il existe, derrière le corps que je perçois d'autrui, une vie intérieure comparable à la mienne -- et non un simple mécanisme qui imite, de l'extérieur, les signes du vécu conscient ?"
        correct: true
      - id: C
        text: "Comment puis-je échapper au regard d'autrui, qui menacerait en permanence ma liberté ?"
        correct: false
        feedback: >
          C'est une question de conflit entre libertés, pas le problème que
          pose ici Husserl, qui porte sur la connaissance d'une vie
          intérieure chez autrui.
      - id: D
        text: "Comment puis-je démontrer, avec une certitude absolue, que ma propre conscience existe réellement ?"
        correct: false
        feedback: >
          Le texte prend au contraire pour acquis l'accès direct à ma propre
          conscience -- le problème concerne l'accès à celle d'autrui.
    correct_feedback: >
      Le problème des autres consciences porte sur l'assurance qu'il existe,
      derrière le corps perçu d'autrui, une vie intérieure comparable à la
      mienne.
    solution: |
      **Accès direct :** ma propre conscience.

      **Accès seulement indirect :** la conscience d'autrui -- d'où le
      problème d'être assuré qu'une vie intérieure existe bien derrière ce
      corps perçu.

  - id: AUT-12
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [hegel, lutte_a_mort, reconnaissance]
    stem: >
      Pourquoi la lutte à mort pour la reconnaissance, chez Hegel, ne
      peut-elle logiquement pas s'achever par la mort effective de l'un des
      deux combattants ?
    type: mcq
    choices:
      - id: A
        text: "Parce que Hegel considère que tuer autrui est moralement condamnable, et qu'aucune conscience ne consentirait à violer cet interdit."
        correct: false
        feedback: >
          C'est confondre l'argument logique de Hegel avec un interdit
          moral -- un ordre qui précède tout choix appartient plutôt à
          Levinas (R5, « tu ne tueras point »).
      - id: B
        text: "Parce que la loi, dans la société décrite par Hegel, interdirait formellement le duel à mort entre deux consciences."
        correct: false
        feedback: >
          Le texte n'invoque aucune loi sociale -- l'argument porte sur la
          structure logique de la reconnaissance elle-même.
      - id: C
        text: "Parce qu'un être mort ne reconnaît plus rien ni personne : la reconnaissance obtenue par la mort de l'adversaire s'annule elle-même au moment où elle serait obtenue."
        correct: true
      - id: D
        text: "Parce que les deux consciences seraient, selon Hegel, physiquement incapables de se vaincre l'une l'autre, la lutte se soldant toujours par un match nul."
        correct: false
        feedback: >
          C'est contraire au texte : la lutte se résout par la soumission de
          l'un des deux, non par une incapacité physique à vaincre.
    correct_feedback: >
      L'impasse est logique, pas morale ni juridique : un mort ne peut plus
      reconnaître personne, donc tuer l'adversaire détruit l'objet même que
      l'on cherchait à obtenir.
    solution: |
      **La lutte à mort :** chacune des deux consciences risque sa vie pour
      être reconnue.

      **L'impasse :** un être mort ne reconnaît plus rien -- la victoire par
      la mort s'annule elle-même ; la sortie passe par la soumission de l'un.

  - id: AUT-13
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [hegel, husserl, questions_distinctes]
    stem: >
      En quoi la question posée par Hegel diffère-t-elle de celle posée par
      Husserl, selon le texte ?
    type: mcq
    choices:
      - id: A
        text: "Les deux poseraient en réalité exactement la même question, seulement formulée avec un vocabulaire différent."
        correct: false
        feedback: >
          Le texte présente la question de Hegel comme « différente, et
          plus radicale encore » que celle de Husserl -- pas une simple
          reformulation.
      - id: B
        text: "Husserl s'interrogerait sur la conscience de moi-même, tandis que Hegel s'interrogerait sur la conscience d'autrui."
        correct: false
        feedback: >
          C'est l'inverse : c'est Husserl qui s'interroge sur la
          connaissance de la conscience d'autrui ; Hegel s'interroge sur ma
          propre conscience de moi-même.
      - id: C
        text: "Husserl et Hegel poseraient tous deux une question morale : comment dois-je traiter autrui pour agir de façon juste ?"
        correct: false
        feedback: >
          Aucun des deux ne pose ici une question morale -- celle-ci
          appartient à Kant (R6).
      - id: D
        text: "Husserl se demande comment je peux connaître qu'autrui existe comme conscience ; Hegel se demande si j'ai seulement besoin d'autrui pour devenir, moi, une conscience de moi-même."
        correct: true
    correct_feedback: >
      Husserl s'interroge sur la connaissance d'autrui comme conscience ;
      Hegel s'interroge sur ce dont j'ai besoin, moi, pour devenir une
      conscience de moi-même -- deux questions distinctes.
    solution: |
      **Husserl :** comment je connais qu'autrui existe comme conscience.

      **Hegel :** si j'ai besoin d'autrui pour devenir, moi, une conscience
      de moi-même -- deux niveaux de questions à ne pas fondre en un seul.

  - id: AUT-14
    rung: "R3"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [sartre, hegel, mediateur, conflit]
    stem: >
      Un élève affirme : « Sartre ne fait que reprendre l'idée de Hegel :
      autrui est nécessaire à ma conscience de moi-même, un point c'est
      tout, les deux disent exactement la même chose. » Qu'est-ce que cette
      lecture manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque que si Hegel construit un mouvement de reconnaissance mutuelle possible entre deux consciences, Sartre, prolongeant cette intuition, insiste au contraire sur un conflit presque inévitable entre ma liberté de regarder et celle d'autrui qui me regarde."
        correct: true
      - id: B
        text: "Elle manque le fait que Sartre, contrairement à Hegel, nierait complètement qu'autrui soit nécessaire à ma conscience de moi-même."
        correct: false
        feedback: >
          C'est l'inverse : par la formule du médiateur indispensable,
          Sartre affirme qu'autrui est nécessaire -- il ajoute seulement un
          revers conflictuel.
      - id: C
        text: "Elle manque le fait que Hegel et Sartre utiliseraient tous deux le terme précis d'« aprésentation » pour décrire ce mécanisme."
        correct: false
        feedback: >
          Ce terme appartient à Husserl (R1), ni à Hegel ni à Sartre.
      - id: D
        text: "Elle manque le fait que, pour Sartre, c'est le travail sur la matière, comme chez l'esclave hégélien, qui permettrait d'accéder à une conscience de soi."
        correct: false
        feedback: >
          Le travail sur la matière est le mécanisme de l'esclave chez Hegel
          (R2) -- chez Sartre, c'est la honte face au regard effectif d'un
          autre.
    correct_feedback: >
      Sartre prolonge l'intuition hégélienne mais construit son propre
      mécanisme, où ce même besoin d'autrui s'accompagne d'un conflit
      presque inévitable entre les libertés.
    solution: |
      **Partagé avec Hegel :** autrui nécessaire à ma conscience de
      moi-même.

      **Ajouté par Sartre :** un conflit presque inévitable entre les
      libertés, absent de la reconnaissance mutuelle hégélienne.

  - id: AUT-15
    rung: "R3"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [sartre, moi_pour_autrui, introspection]
    stem: >
      Selon Sartre, pourquoi la seule introspection solitaire ne
      pourrait-elle jamais me révéler la dimension de mon être qu'il appelle
      le « moi-pour-autrui » ?
    type: mcq
    choices:
      - id: A
        text: "Parce que l'introspection serait, chez Sartre, totalement impossible : je n'aurais aucun accès, même partiel, à mes propres pensées."
        correct: false
        feedback: >
          Le texte compare au contraire mon accès direct, quoique imparfait,
          à ma propre conscience à l'accès seulement indirect à celle
          d'autrui.
      - id: B
        text: "Parce que cette dimension de mon être n'existe, structurellement, que dans et par le regard effectif d'un autre : aucune réflexion sur moi-même, aussi poussée soit-elle, ne peut la faire apparaître."
        correct: true
      - id: C
        text: "Parce que Sartre penserait que je pourrais très bien atteindre cette dimension seul, à condition d'y consacrer suffisamment de temps et de concentration."
        correct: false
        feedback: >
          C'est l'inverse exact : il faut, structurellement, le regard
          effectif d'un autre -- aucune durée de réflexion solitaire n'y
          substitue.
      - id: D
        text: "Parce que cette dimension de mon être serait, selon Sartre, purement imaginaire et sans réalité, ni pour moi ni pour autrui."
        correct: false
        feedback: >
          C'est l'inverse : Sartre traite le moi-pour-autrui comme une
          dimension réelle de mon être, pas comme une fiction.
    correct_feedback: >
      Le moi-pour-autrui n'existe que dans et par le regard effectif d'un
      autre : aucune introspection solitaire ne pourrait produire cette
      découverte à elle seule.
    solution: |
      **Ce que j'atteins seul :** ma conscience de moi-même, par réflexion.

      **Ce que je n'atteins que par autrui :** mon être-pour-autrui, révélé
      par le regard effectif d'un autre, jamais par introspection seule.

  - id: AUT-16
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [sartre, conflit_libertes, sujet_objet]
    stem: >
      Pourquoi, selon Sartre, deux consciences ne peuvent-elles jamais
      occuper simultanément la position de sujet l'une pour l'autre ?
    type: mcq
    choices:
      - id: A
        text: "Parce que l'une des deux consciences serait toujours, par nature, supérieure à l'autre, et destinée à dominer."
        correct: false
        feedback: >
          Sartre ne décrit aucune hiérarchie naturelle -- l'alternance
          sujet/objet est structurelle et symétrique, pas une domination
          fixe comme dans une lecture déformée du maître et de l'esclave (R2).
      - id: B
        text: "Parce qu'une seule conscience pourrait exister physiquement dans une pièce à la fois, l'autre devant nécessairement quitter les lieux."
        correct: false
        feedback: >
          C'est une littéralisation absurde -- l'alternance sujet/objet est
          une structure du regard, pas une question de coprésence physique.
      - id: C
        text: "Parce que si je regarde autrui, c'est lui qui devient objet dans mon monde ; s'il me regarde en retour, c'est moi qui redeviens objet dans le sien -- il n'existe aucune position stable où les deux resteraient sujets en même temps."
        correct: true
      - id: D
        text: "Parce que, pour Sartre, l'une des deux consciences serait toujours dépourvue de liberté réelle, contrairement à l'autre qui la posséderait pleinement."
        correct: false
        feedback: >
          C'est contraire à Sartre : le conflit existe précisément parce que
          les deux consciences sont également libres.
    correct_feedback: >
      Regarder et être regardé s'excluent : si l'un occupe la position de
      sujet, l'autre devient nécessairement objet -- aucune position stable
      ne permet aux deux de rester sujets en même temps.
    solution: |
      **Le mécanisme :** je regarde, autrui devient objet ; autrui me
      regarde, je redeviens objet.

      **Ce qui n'existe pas chez Sartre :** une position stable où les deux
      consciences resteraient sujets ensemble.

  - id: AUT-17
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [sartre, regard, revelation_objectivation]
    stem: >
      En quel sens R4 constitue-t-il un « revers » par rapport à ce que R3 a
      montré du regard d'autrui ?
    type: mcq
    choices:
      - id: A
        text: "R4 montrerait que Sartre s'est en réalité trompé en R3 : le regard d'autrui ne révélerait jamais rien, il ne ferait qu'objectiver."
        correct: false
        feedback: >
          R4 ne contredit pas R3 -- ce sont deux effets simultanés du même
          mécanisme du regard, pas un reniement de l'un par l'autre.
      - id: B
        text: "R4 montrerait que le regard d'autrui, contrairement à ce que R3 laissait penser, ne concernerait en réalité que les inconnus, jamais les proches."
        correct: false
        feedback: >
          Rien ne restreint ainsi le mécanisme -- l'exemple de la sœur,
          repris en R4, concerne justement une proche.
      - id: C
        text: "R4 montrerait que le sentiment de honte, décrit en R3, disparaîtrait complètement dès qu'on comprend le conflit des libertés."
        correct: false
        feedback: >
          R4 ne fait pas disparaître la honte -- il en précise seulement le
          revers structurel, sans annuler le phénomène décrit en R3.
      - id: D
        text: "R3 montre que le regard d'autrui me révèle une dimension de moi-même inaccessible à la seule introspection ; R4 montre que ce même regard, dans le même mouvement, me transforme aussi en objet figé dans le monde de l'autre."
        correct: true
    correct_feedback: >
      R3 et R4 décrivent deux effets simultanés du même regard : la
      révélation d'une part de moi-même (R3) et l'objectivation qui me fige
      dans une image non choisie (R4).
    solution: |
      **R3 :** le regard révèle une part de moi inaccessible à
      l'introspection seule.

      **R4, le revers :** ce même regard me transforme aussi en objet figé
      dans le monde de l'autre.

  - id: AUT-18
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [levinas, visage, husserl, sartre]
    stem: >
      Selon Levinas, en quel sens précis faut-il comprendre le « visage »
      d'autrui ?
    type: mcq
    choices:
      - id: A
        text: "Non comme le visage physique, descriptible (forme du nez, couleur des yeux), qui resterait un objet parmi d'autres, mais comme ce par quoi autrui échappe à toute totalisation -- sa vulnérabilité nue, qui déborde toujours ce que j'en ai saisi."
        correct: true
      - id: B
        text: "Comme l'expression physique précise du visage -- un sourire, une grimace -- qui permettrait, par une lecture attentive des traits, de déduire avec certitude ce que l'autre pense."
        correct: false
        feedback: >
          Cela confond le visage lévinassien avec le corps expressif dont
          parlait Husserl (R1) -- Levinas récuse toute réduction du visage
          à des traits descriptibles.
      - id: C
        text: "Comme un synonyme du regard sartrien : ce qui m'objective et me fige dans une image que je n'ai pas choisie."
        correct: false
        feedback: >
          C'est précisément la confusion à éviter : le visage lévinassien
          n'objective rien, à l'inverse du regard sartrien.
      - id: D
        text: "Comme une catégorie ou un rôle social (un métier, un statut) que je pourrais clairement attribuer à autrui dès que je le rencontre."
        correct: false
        feedback: >
          C'est l'inverse : le visage résiste justement à toute réduction à
          une catégorie ou un rôle fixé à l'avance.
    correct_feedback: >
      Le visage n'est ni le visage physique descriptible, ni le regard
      sartrien, ni une catégorie sociale : il désigne la vulnérabilité
      d'autrui, qui échappe toujours à ce que j'en saisis.
    solution: |
      **Ce que le visage n'est pas :** traits physiques, regard qui
      objective, ou catégorie sociale.

      **Ce qu'il est :** ce par quoi autrui échappe à toute totalisation --
      une vulnérabilité qui déborde toujours ma prise.

  - id: AUT-19
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [levinas, hegel, responsabilite_asymetrique]
    stem: >
      En quoi la responsabilité décrite par Levinas diffère-t-elle de la
      reconnaissance mutuelle décrite par Hegel ?
    type: mcq
    choices:
      - id: A
        text: "Chez Hegel comme chez Levinas, la reconnaissance ou la responsabilité ne concerneraient que les rapports de pouvoir entre maître et esclave."
        correct: false
        feedback: >
          Levinas rompt précisément avec le terrain du rapport de force
          hérité de Hegel et Sartre -- sa responsabilité ne s'inscrit pas
          dans un rapport maître/esclave.
      - id: B
        text: "Chez Hegel, la reconnaissance qui fonde authentiquement la conscience de soi doit être mutuelle, construite à deux ; chez Levinas, la responsabilité est asymétrique -- je suis responsable d'autrui indépendamment de ce que lui-même fait ou ne fait pas en retour."
        correct: true
      - id: C
        text: "Les deux décriraient en réalité exactement le même mouvement réciproque, seulement avec un vocabulaire différent."
        correct: false
        feedback: >
          Le texte insiste au contraire sur l'écart entre les deux : pas une
          reconnaissance mutuelle à construire à deux, chez Levinas, mais un
          appel à sens unique.
      - id: D
        text: "Chez Levinas, contrairement à Hegel, ce serait moi qui exigerais d'autrui qu'il me reconnaisse en premier, avant de le reconnaître en retour."
        correct: false
        feedback: >
          C'est l'inverse : c'est moi qui suis obligé par le visage
          d'autrui, sans condition ni retour attendu.
    correct_feedback: >
      La reconnaissance hégélienne doit être mutuelle et construite à deux ;
      la responsabilité lévinassienne est asymétrique, un appel à sens
      unique qui m'oblige indépendamment de la réponse d'autrui.
    solution: |
      **Hegel :** reconnaissance mutuelle, construite à deux.

      **Levinas :** responsabilité asymétrique -- je suis obligé, quelle que
      soit la réponse de l'autre.

  - id: AUT-20
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [kant, point_de_vigilance, questions_distinctes]
    stem: >
      Pourquoi est-il erroné de dire que Kant « résout » le problème
      d'autrui posé par Husserl, Hegel, Sartre ou Levinas ?
    type: mcq
    choices:
      - id: A
        text: "Parce que Kant, en réalité, n'aurait jamais rien écrit à propos d'autrui ou de la personne humaine, sa philosophie portant uniquement sur la connaissance scientifique."
        correct: false
        feedback: >
          C'est faux : Kant formule précisément, dans les Fondements de la
          métaphysique des mœurs (1785), le principe de traiter l'humanité
          toujours comme une fin.
      - id: B
        text: "Parce que Kant contredirait directement les quatre autres auteurs, en niant qu'autrui existe réellement en dehors de ma propre conscience."
        correct: false
        feedback: >
          Rien dans le texte n'attribue à Kant une thèse sur l'existence
          d'autrui -- son principe est une règle pratique, pas une réponse
          concurrente aux questions des quatre autres auteurs.
      - id: C
        text: "Parce que ce sont des questions différentes : Husserl demande comment je connais qu'autrui existe comme conscience ; Hegel et Sartre décrivent la rencontre des consciences ; Levinas fonde une responsabilité qui précède tout choix ; Kant prescrit une règle d'action valable quelle que soit la réponse aux questions précédentes."
        correct: true
      - id: D
        text: "Parce que Kant reformulerait en réalité, avec d'autres mots, exactement la même thèse que Levinas sur le visage qui m'oblige avant tout choix."
        correct: false
        feedback: >
          Ce sont deux fondements distincts -- le texte les présente comme
          rejoignant la même exigence sur un terrain différent, non comme
          identiques.
    correct_feedback: >
      Husserl, Hegel/Sartre, Levinas et Kant répondent chacun à une question
      de nature différente -- connaissance, structure de la rencontre,
      responsabilité préalable, règle d'action -- à ne pas fondre en une
      seule.
    solution: |
      **Husserl :** connaître qu'autrui existe comme conscience.
      **Hegel/Sartre :** ce qui se joue dans la rencontre des consciences.

      **Levinas :** une responsabilité qui précède tout choix.
      **Kant :** une règle d'action, valable quelle que soit la réponse
      aux questions précédentes.

  - id: AUT-21
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [kant, sartre, horizon_moral]
    stem: >
      Que change concrètement le principe kantien face au conflit des
      regards décrit par Sartre (R4) ?
    type: mcq
    choices:
      - id: A
        text: "Il prouverait que le conflit décrit par Sartre est une pure invention, sans aucune réalité dans les rapports humains effectifs."
        correct: false
        feedback: >
          Le texte ne dément jamais la description sartrienne -- il ajoute
          une règle pratique, sans nier que le conflit demeure une
          tentation structurelle.
      - id: B
        text: "Il remplacerait la description sartrienne par une nouvelle description du même conflit, en des termes simplement plus optimistes."
        correct: false
        feedback: >
          Le principe kantien n'est pas une description concurrente du
          rapport à autrui -- c'est une règle d'action, d'un ordre
          différent de la description ontologique de Sartre.
      - id: C
        text: "Il n'aurait, selon le texte, strictement aucun rapport avec ce que décrit Sartre en R4."
        correct: false
        feedback: >
          Le texte relie explicitement les deux : « Face à Sartre (R4) : le
          principe kantien donne un horizon pour sortir du pur conflit des
          regards ».
      - id: D
        text: "Il donne un horizon moral pour sortir du pur conflit : traiter autrui comme une fin, c'est refuser de le réduire à un simple objet de mon regard ou de mes besoins -- même si la tentation du conflit décrit par Sartre demeure une structure contre laquelle il faut lutter."
        correct: true
    correct_feedback: >
      Le principe kantien ne nie ni ne remplace la description sartrienne du
      conflit : il fournit une règle pratique pour y résister, en traitant
      toujours autrui aussi comme une fin.
    solution: |
      **Ce que Sartre décrit :** un conflit presque inévitable entre les
      regards.

      **Ce qu'ajoute Kant :** un horizon moral -- traiter autrui comme une
      fin -- pour résister à cette tentation, sans nier qu'elle demeure
      structurelle.

  - id: AUT-22
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_autrui
    tags: [methode, problematique, dissertation]
    stem: >
      Parmi les formulations suivantes pour le sujet « Autrui est-il une
      menace pour ma liberté, ou la condition de mon humanité ? », laquelle
      constitue une véritable problématique, au sens de la méthode ?
    type: mcq
    choices:
      - id: A
        text: "« Si autrui expose bien, par son regard, ma liberté à un risque réel, comment expliquer que ce même autrui me permette d'accéder à la conscience de moi-même, voire fonde ma responsabilité la plus profonde -- faut-il s'en protéger, ou transformer ce rapport de menace en rapport de reconnaissance ? »"
        correct: true
      - id: B
        text: "« Autrui est-il une menace pour ma liberté, ou la condition de mon humanité ? »"
        correct: false
        feedback: >
          C'est une simple répétition du sujet, mot pour mot -- une
          problématique doit mettre en évidence la tension entre deux
          positions légitimes, pas seulement reformuler la question de
          départ.
      - id: C
        text: "« Qu'est-ce que la liberté ? »"
        correct: false
        feedback: >
          Cette question ignore entièrement le second terme du sujet
          (autrui, la condition de mon humanité) -- elle se réduit à la
          définition d'un seul mot.
      - id: D
        text: "« Sartre a-t-il raison de dire que l'enfer, c'est les autres ? »"
        correct: false
        feedback: >
          Cette question ne porte que sur un seul auteur et une seule
          formule, alors que le sujet mobilise plusieurs statuts d'autrui --
          ce n'est pas une problématique mais une question d'exégèse.
    correct_feedback: >
      Une problématique met en tension deux positions légitimes en
      apparence -- ici, le risque pour ma liberté et la condition de mon
      humanité -- sans se réduire à une répétition du sujet ni à la
      définition d'un seul mot.
    solution: |
      **Ce que n'est pas une problématique :** une répétition du sujet, ou
      une question qui n'en retient qu'un seul terme.

      **Ce qu'elle est :** une tension explicite entre deux positions
      légitimes, formulée comme une question à trancher.

  - id: AUT-23
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_autrui
    tags: [methode, plan_dialectique, levinas]
    stem: >
      Dans le plan dialectique construit pour ce sujet, dans quelle partie
      mobiliser Levinas (le visage qui oblige), et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Dans l'antithèse (II), aux côtés de Sartre, car Levinas décrirait lui aussi un conflit entre deux libertés qui se disputent la position de sujet."
        correct: false
        feedback: >
          C'est une erreur : Levinas rompt précisément avec le terrain du
          conflit de pouvoir -- sa responsabilité asymétrique n'est pas un
          conflit entre deux libertés rivales.
      - id: B
        text: "Dans le dépassement (III) : le visage lévinassien ne nie pas le risque de conflit exposé en II (Sartre), il indique une façon de le dépasser, en transformant le rapport à autrui en rapport de responsabilité plutôt qu'en simple rapport de force."
        correct: true
      - id: C
        text: "Dans la thèse (I), à la place de Hegel, car la responsabilité lévinassienne prouverait que la reconnaissance mutuelle hégélienne serait fausse."
        correct: false
        feedback: >
          Le plan ne présente pas Levinas comme une réfutation de Hegel --
          Hegel reste dans la thèse pour sa propre raison ; Levinas
          intervient dans le dépassement.
      - id: D
        text: "Nulle part dans ce plan, car Levinas n'aurait aucun rapport avec la question de la liberté ou de l'humanité posée par le sujet."
        correct: false
        feedback: >
          Le plan mobilise explicitement Levinas dans le dépassement, pour
          transformer la relation de conflit en relation de responsabilité.
    correct_feedback: >
      Levinas trouve sa place dans le dépassement (III) : sans nier le
      conflit sartrien exposé en antithèse, il indique comment le
      transformer en rapport de responsabilité.
    solution: |
      **I. Thèse :** Hegel, Sartre (R3), Husserl -- autrui nécessaire à ma
      conscience de moi.

      **II. Antithèse :** Sartre (R4) -- le conflit des libertés.
      **III. Dépassement :** Levinas et Kant -- transformer le conflit en
      responsabilité.

  - id: AUT-24
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_autrui
    tags: [methode, application, husserl]
    stem: >
      Pour le sujet d'entraînement suggéré « Puis-je vraiment connaître
      autrui ? », quel auteur de la leçon est le plus directement pertinent
      pour construire la thèse initiale, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Hegel (R2), parce que sa dialectique de la reconnaissance porterait, comme celle de Husserl, sur les conditions de la connaissance d'autrui."
        correct: false
        feedback: >
          Hegel pose une question différente : non pas comment je connais
          qu'autrui existe comme conscience, mais comment je deviens, moi,
          une conscience de moi-même par la reconnaissance.
      - id: B
        text: "Kant (R6), parce que le principe de traiter l'humanité comme une fin répondrait directement à la question de savoir si je peux connaître autrui."
        correct: false
        feedback: >
          Le principe kantien est une règle d'action morale, pas une thèse
          sur la connaissance d'autrui -- il répond à « comment dois-je le
          traiter ? », pas à « puis-je le connaître ? ».
      - id: C
        text: "Husserl (R1), parce que sa théorie de l'aprésentation porte précisément sur les conditions et les limites de la connaissance d'autrui -- je perçois directement son corps, j'attribue par analogie une vie intérieure, sans jamais obtenir de preuve absolue."
        correct: true
      - id: D
        text: "Sartre (R4), parce que le conflit des libertés démontrerait qu'il serait rigoureusement impossible de connaître quoi que ce soit d'autrui."
        correct: false
        feedback: >
          Le conflit sartrien porte sur un rapport de pouvoir entre
          consciences, pas sur une thèse épistémologique -- c'est le
          problème des autres consciences chez Husserl (R1) qui porte
          spécifiquement sur la connaissance.
    correct_feedback: >
      Husserl est le plus directement pertinent : sa théorie de
      l'aprésentation porte précisément sur ce que je peux et ne peux pas
      connaître d'autrui, sans jamais atteindre de preuve absolue.
    solution: |
      **Le sujet porte sur :** les limites de la connaissance d'autrui.

      **L'auteur le plus pertinent :** Husserl (R1) -- l'aprésentation, un
      accès seulement indirect, jamais une preuve absolue.
