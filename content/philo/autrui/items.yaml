          lieu d'arbitrer.
      - id: C
        text: "Il faudrait ajouter que l'aprésentation husserlienne prouve l'existence d'autrui, ce qui réglerait le sujet dès l'introduction."
        correct: false
        misconception: mc.philo.autrui.apresentation-mal-comprise
        feedback: >
          L'aprésentation ne PROUVE rien : elle décrit comment autrui se donne à
          moi, sans jamais m'en livrer la conscience. Et elle relève du volet
          épistémologique, alors que le sujet porte sur le rapport des libertés —
          un autre volet.
      - id: D
        text: "Il faudrait préciser qu'autrui est un pur objet du monde tant que je ne lui ai pas prêté une intériorité."
        correct: false
        misconception: mc.philo.autrui.alter-ego-mal-compris
        feedback: >
          C'est manquer le concept d'alter ego : autrui n'est pas d'abord un
          objet auquel j'ajouterais ensuite une conscience. Il se donne d'emblée
          comme un autre soi, inaccessible mais visé comme conscience — et cette
          nuance est ce que le chapitre 2 sert à établir.
    correct_feedback: >
      Deux gestes sont manqués. Problématiser, c'est dégager la tension du sujet,
      pas le répéter. Et annoncer un plan, ce n'est pas aligner deux réponses
      opposées : la troisième partie doit déplacer la question, non trancher
      entre les deux premières.
    solution: |
      **Ce qu'est une problématique.** La mise au jour d'une tension : autrui
      limite mon champ d'action, et il est pourtant ce sans quoi je ne me
      saurais pas moi-même. La question du sujet devient alors : à quelles
      conditions cette limitation est-elle autre chose qu'un obstacle ?

      **Ce qu'est un plan.** Trois moments qui avancent : la thèse spontanée, ce
      qui la met en défaut, puis un déplacement — chez Levinas et Kant, l'idée que
      le rapport à autrui peut être autre chose qu'un rapport de forces.

      **Le défaut le plus fréquent.** Traiter le plan comme un catalogue
      d'opinions au lieu d'une progression.

  - id: AUT-30
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [sartre, revelation, objectivation]
    stem: >
      Le regard d'autrui me révèle une part de moi-même, et il me fige dans une
      image que je n'ai pas choisie. Ces deux effets sont-ils contradictoires ?
    type: mcq
    choices:
      - id: A
        text: "Non : ce sont les deux faces d'un même acte — la révélation a pour prix l'objectivation."
        correct: true
      - id: B
        text: "Si : on ne peut pas à la fois recevoir d'autrui une vérité sur soi et être trahi par l'image qu'il en donne."
        correct: false
        misconception: mc.philo.autrui.revelation-objectivation-opposees
        feedback: >
          Ce sont deux descriptions du même événement. Le regard me livre une
          dimension réelle de moi — le moi-pour-autrui — et il me la livre sous
          une forme arrêtée, que je n'ai pas choisie. C'est cette ambivalence qui
          fait le prix de l'analyse sartrienne, non une incohérence.
      - id: C
        text: "Si, et la honte le prouve : elle n'est qu'une crainte de sanction, donc un effet, jamais une révélation."
        correct: false
        misconception: mc.philo.autrui.honte-mal-comprise
        feedback: >
          La honte n'est pas une peur de punition : elle survient devant un
          inconnu qui n'a aucun pouvoir sur moi, et même après coup. Ce qu'elle
          manifeste, c'est un ÊTRE que je découvre — pas un risque que
          j'anticipe.
      - id: D
        text: "Non, mais parce que je pourrais obtenir seul, par introspection, ce que le regard prétend m'apprendre."
        correct: false
        misconception: mc.philo.autrui.moi-pour-autrui-seul
        feedback: >
          L'introspection ne donne jamais le moi-pour-autrui : je ne peux pas me
          voir de l'extérieur. C'est précisément ce qui rend autrui INDISPENSABLE
          chez Sartre — non un supplément d'information, mais le seul accès à une
          dimension de mon être.
    correct_feedback: >
      Les deux effets sont un seul. En me révélant tel que je suis pour un autre,
      le regard me donne accès à une part de moi — et me la donne figée, dans une
      image que je n'ai pas choisie. La révélation a pour prix l'objectivation.
    solution: |
      **Ce que le regard donne.** Le moi-pour-autrui : ce que je suis comme objet
      dans le monde d'une conscience. Inaccessible seul.

      **Ce qu'il coûte.** Cette dimension m'est donnée ARRÊTÉE — « un voyeur »,
      « un maladroit » — alors que je me vis, du dedans, comme une liberté
      indéterminée.

      **Pourquoi ce n'est pas une contradiction.** Un même acte peut ouvrir et
      fermer : c'est parce que le regard me saisit du dehors qu'il m'apprend
      quelque chose, et c'est pour la même raison qu'il me fige.

  - id: AUT-31
    rung: "R4"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [sartre, conflit, enfer, levinas]
    stem: >
      « L'enfer, c'est les autres. » Comment faut-il lire cette formule de
      Sartre ?
    type: mcq
    choices:
      - id: A
        text: "Comme la description d'un rapport où chacun se voit figé par le regard de l'autre, sans que la solitude y change rien."
        correct: true
      - id: B
        text: "Comme une plainte ordinaire sur le caractère pénible de la compagnie, à laquelle la solitude offrirait un remède."
        correct: false
        misconception: mc.philo.autrui.enfer-mal-interprete
        feedback: >
          Sartre a lui-même écarté cette lecture. La formule est prononcée par un
          personnage enfermé avec deux autres pour l'éternité : ce qui fait
          l'enfer n'est pas leur désagrément, mais l'impossibilité d'échapper à
          l'image qu'ils ont de lui. La solitude n'y remédierait pas — le
          moi-pour-autrui, une fois constitué, ne s'efface plus.
      - id: C
        text: "Comme l'énoncé d'une hiérarchie naturelle : dans toute rencontre, l'un est sujet et l'autre objet, une fois pour toutes."
        correct: false
        misconception: mc.philo.autrui.conflit-libertes-mal-compris
        feedback: >
          Le conflit sartrien n'est pas une hiérarchie fixe : les positions
          s'échangent sans cesse, chacun étant tour à tour celui qui regarde et
          celui qui est vu. C'est cette instabilité même — et non une
          domination établie — qui rend le rapport conflictuel.
      - id: D
        text: "Comme la formule du visage lévinassien, qui produit exactement le même effet que le regard sartrien."
        correct: false
        misconception: mc.philo.autrui.visage-regard-confondus
        feedback: >
          Les deux notions s'opposent presque terme à terme. Le regard sartrien
          m'objective et engendre le conflit ; le visage lévinassien m'OBLIGE,
          avant tout choix, et fonde la responsabilité. L'un me fige, l'autre
          m'appelle.
    correct_feedback: >
      L'enfer n'est pas la compagnie désagréable : c'est l'impossibilité
      d'échapper à l'image qu'autrui a de moi. La solitude n'y changerait rien —
      le moi-pour-autrui, une fois constitué par un regard, ne se dissout plus.
    solution: |
      **Le contexte.** Trois personnages enfermés ensemble sans issue. Il n'y a
      ni bourreau ni flammes : chacun est l'enfer des deux autres, en les tenant
      dans une image dont ils ne peuvent pas sortir.

      **Ce que la formule dit.** Que ma liberté rencontre, en autrui, une autre
      liberté qui me saisit du dehors et me qualifie. Je ne peux ni contrôler ce
      qu'il voit, ni l'effacer.

      **Ce qu'elle ne dit pas.** Que la compagnie soit pénible, ni qu'il faille
      fuir les autres — Sartre a explicitement refusé cette lecture.

  - id: AUT-32
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [levinas, responsabilite, conflit]
    stem: >
      La responsabilité dont parle Levinas est-elle réciproque, comme la
      reconnaissance hégélienne ?
    type: mcq
    choices:
      - id: A
        text: "Non : elle est asymétrique — je réponds d'autrui sans attendre qu'il réponde de moi, et sans l'avoir choisi."
        correct: true
      - id: B
        text: "Oui : elle se construit à deux, chacun s'obligeant envers l'autre à mesure que l'autre s'oblige envers lui."
        correct: false
        misconception: mc.philo.autrui.responsabilite-symetrisee
        feedback: >
          Ce serait un contrat, et Levinas écarte précisément ce modèle. L'appel
          du visage m'oblige AVANT tout accord et sans contrepartie : ma
          responsabilité ne dépend pas de ce qu'autrui fait pour moi. Elle est
          première, non négociée — c'est ce qui la distingue de la reconnaissance
          hégélienne.
      - id: C
        text: "Oui, et c'est ce qui met fin au conflit sartrien : la réciprocité rétablit une hiérarchie stable entre les consciences."
        correct: false
        misconception: mc.philo.autrui.conflit-libertes-mal-compris
        feedback: >
          Le conflit sartrien n'est pas une hiérarchie à stabiliser : c'est
          l'alternance instable de deux libertés qui se saisissent l'une l'autre.
          Et Levinas n'y répond pas par la réciprocité, mais par un déplacement
          — l'obligation précède la rencontre des libertés.
      - id: D
        text: "Non, mais parce que « l'enfer, c'est les autres » signifie qu'aucune obligation envers eux n'est possible."
        correct: false
        misconception: mc.philo.autrui.enfer-mal-interprete
        feedback: >
          La formule de Sartre ne prononce aucune impossibilité morale : elle
          décrit ce que fait le regard, pas ce qu'il faut faire. Et la lire comme
          un rejet d'autrui est justement le contresens que Sartre a démenti.
    correct_feedback: >
      Non : elle est ASYMÉTRIQUE. Le visage m'oblige avant tout choix et sans
      contrepartie — je réponds d'autrui sans attendre qu'il réponde de moi.
      Une responsabilité négociée serait un contrat, non une éthique.
    solution: |
      **L'asymétrie.** Chez Levinas, l'obligation ne se distribue pas également :
      elle me vient du visage d'autrui, et elle est mienne indépendamment de ce
      qu'il fait.

      **Pourquoi elle ne se négocie pas.** Un devoir conditionné à la réciprocité
      cesserait dès que l'autre manque à sa part — ce qui laisserait sans
      protection exactement ceux qui ne peuvent rien rendre.

      **Le contraste avec Hegel.** La reconnaissance hégélienne est mutuelle et à
      conquérir ; la responsabilité lévinassienne est unilatérale et déjà là.

  - id: AUT-33
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [levinas, kant, visage, morale]
    stem: >
      Que faut-il entendre par le « visage » chez Levinas, et comment se
      rapporte-t-il à la formule kantienne sur l'humanité ?
    type: mcq
    choices:
      - id: A
        text: "Le visage n'est pas l'apparence physique mais un appel qui m'oblige ; Kant, lui, interdit de traiter autrui SIMPLEMENT comme un moyen."
        correct: true
      - id: B
        text: "Le visage désigne les traits, l'expression, ce que je peux décrire — et Kant interdit tout usage d'autrui comme moyen."
        correct: false
        misconception: mc.philo.autrui.visage-apparence-physique
        feedback: >
          Le visage lévinassien n'est pas descriptible : dès que je le décris —
          couleur des yeux, âge, catégorie sociale — j'en fais un objet et je
          manque ce qui l'y soustrait, l'appel qu'il m'adresse. C'est un concept
          éthique, non une donnée perceptive.
      - id: C
        text: "Le visage est un appel qui m'oblige, et Kant interdit tout usage d'autrui comme moyen, même le plus banal."
        correct: false
        misconception: mc.philo.autrui.kant-formule-mal-comprise
        feedback: >
          La formule kantienne comporte un mot décisif : « jamais SEULEMENT comme
          un moyen ». Demander l'heure à un passant, c'est l'utiliser comme moyen
          — et c'est légitime, tant qu'on le traite en même temps comme une fin,
          c'est-à-dire comme un être libre qui peut refuser.
      - id: D
        text: "Le visage est un appel qui m'oblige, et cette obligation est mutuelle : chacun répond de l'autre à parts égales."
        correct: false
        misconception: mc.philo.autrui.responsabilite-symetrisee
        feedback: >
          L'obligation lévinassienne est asymétrique : elle m'engage sans
          contrepartie et sans que je l'aie choisie. La rendre mutuelle en ferait
          un contrat — exactement le modèle que Levinas écarte, parce qu'il
          abandonnerait ceux qui ne peuvent rien rendre.
    correct_feedback: >
      Le visage n'est pas ce que je vois mais ce qui m'appelle : il m'oblige
      avant tout choix. Et la formule kantienne dit « jamais SEULEMENT comme un
      moyen » — l'usage réciproque et consenti est permis, la réduction à
      l'instrument ne l'est pas.
    solution: |
      **Le visage.** Non un ensemble de traits, mais ce par quoi autrui échappe
      à toute description et m'adresse une exigence — « tu ne tueras point » —
      antérieure à toute délibération.

      **La formule kantienne, exactement.** « Agis de telle sorte que tu traites
      l'humanité, aussi bien dans ta propre personne que dans la personne de tout
      autre, toujours en même temps
      comme une fin, et jamais SIMPLEMENT comme un moyen. »

      **Ce que le mot « simplement » change.** Toute vie sociale suppose qu'on
      s'utilise mutuellement — le boulanger, le médecin, le passant à qui l'on
      demande l'heure. Ce qui est interdit, c'est de réduire quelqu'un à cet
      usage, en effaçant qu'il est aussi une fin.

