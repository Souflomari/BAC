          conflit entre deux libertés rivales.
      - id: B
        text: "Dans le dépassement (III) : le visage lévinassien ne nie pas le risque de conflit exposé en II (Sartre), il indique une façon de le dépasser, en transformant le rapport à autrui en rapport de responsabilité plutôt qu'en simple rapport de force."
        correct: true
      - id: C
        text: "Dans la thèse (I), à la place de Hegel, car la responsabilité lévinassienne prouverait que la reconnaissance mutuelle hégélienne serait fausse."
        correct: false
        misconception: mc.philo.autrui.questions-auteurs-confondues
        feedback: >
          Le plan ne présente pas Levinas comme une réfutation de Hegel --
          Hegel reste dans la thèse pour sa propre raison ; Levinas
          intervient dans le dépassement.
      - id: D
        text: "Nulle part dans ce plan tout entier, car Levinas n'aurait, selon cette lecture, strictement aucun rapport avec la question de la liberté ou de l'humanité posée par le sujet, son œuvre portant, croit-on, sur un tout autre domaine de la philosophie."
        correct: false
        misconception: mc.philo.autrui.methode-dissertation-mal-appliquee
        feedback: >
          Le plan mobilise explicitement Levinas dans le dépassement, pour
          transformer la relation de conflit en relation de responsabilité.
    correct_feedback: >
      Levinas trouve sa place dans le dépassement (III) : sans nier le
      conflit sartrien exposé en antithèse, il indique comment le
      transformer en rapport de responsabilité.
    solution: |
      **I. Thèse :** Hegel, Sartre (chapitre 4), Husserl -- autrui nécessaire à ma
      conscience de moi.

      **II. Antithèse :** Sartre (chapitre 5) -- le conflit des libertés.
      **III. Dépassement :** Levinas et Kant -- transformer le conflit en
      responsabilité.

  - id: AUT-24
    rung: "R7"
    difficulty_level: 5
    skill_code: philo_autrui
    tags: [methode, application, husserl]
    stem: >
      Pour un sujet du type « Puis-je vraiment connaître autrui ? », quel auteur de la leçon est le plus directement pertinent
      pour construire la thèse initiale, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Hegel (chapitre 3), parce que sa dialectique de la reconnaissance porterait, exactement et sans la moindre nuance comme celle de Husserl au chapitre 2, sur les conditions précises de la connaissance d'autrui et sur la façon dont je pourrais un jour m'assurer, avec certitude, de l'existence d'une vie intérieure chez lui."
        correct: false
        misconception: mc.philo.autrui.questions-auteurs-confondues
        feedback: >
          Hegel pose une question différente : non pas comment je connais
          qu'autrui existe comme conscience, mais comment je deviens, moi,
          une conscience de moi-même par la reconnaissance.
      - id: B
        text: "Kant (chapitre 7), parce que le principe de traiter l'humanité toujours comme une fin et jamais simplement comme un moyen répondrait directement et complètement à la question de savoir si je peux vraiment connaître autrui dans sa singularité la plus propre et la plus intime."
        correct: false
        misconception: mc.philo.autrui.questions-auteurs-confondues
        feedback: >
          Le principe kantien est une règle d'action morale, pas une thèse
          sur la connaissance d'autrui -- il répond à « comment dois-je le
          traiter ? », pas à « puis-je le connaître ? ».
      - id: C
        text: "Husserl (chapitre 2), parce que sa théorie de l'aprésentation porte précisément sur les conditions et les limites de la connaissance d'autrui -- je perçois directement son corps, j'attribue par analogie une vie intérieure, sans jamais obtenir de preuve absolue."
        correct: true
      - id: D
        text: "Sartre (chapitre 5), parce que le conflit des libertés démontrerait qu'il serait rigoureusement impossible de connaître quoi que ce soit d'autrui."
        correct: false
        misconception: mc.philo.autrui.questions-auteurs-confondues
        feedback: >
          Le conflit sartrien porte sur un rapport de pouvoir entre
          consciences, pas sur une thèse épistémologique -- c'est le
          problème des autres consciences chez Husserl (chapitre 2) qui porte
          spécifiquement sur la connaissance.
    correct_feedback: >
      Husserl est le plus directement pertinent : sa théorie de
      l'aprésentation porte précisément sur ce que je peux et ne peux pas
      connaître d'autrui, sans jamais atteindre de preuve absolue.
    solution: |
      **Le sujet porte sur :** les limites de la connaissance d'autrui.

      **L'auteur le plus pertinent :** Husserl (chapitre 2) -- l'aprésentation, un
      accès seulement indirect, jamais une preuve absolue.

  # Ajoutés le 2026-09-05 : seize familles sous le plancher de 3 items du banc,
  # dont `maitre-satisfait-par-reconnaissance` sans AUCUN item AVANT cet ajout — sondée en leçon
  # seulement. Neuf items, vingt-six places. Les clés sont volontairement
  # brèves : en philosophie, énoncer la thèse ET sa justification dans le
