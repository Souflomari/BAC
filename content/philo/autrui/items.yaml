notion: autrui
skill_code: philo_autrui
misconceptions: []

items:
  - id: AUT-1
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [husserl, alter_ego, autres_consciences]
    stem: >
      Un élève affirme : « Grâce à l'aprésentation dont parle Husserl, je
      perçois directement ce que pense mon ami quand il me regarde. » Qu'est-ce
      que cette affirmation confond ?
    type: mcq
    choices:
      - id: A
        text: "Elle confond Husserl et Sartre : c'est la honte, pas l'aprésentation, qui permettrait un accès direct à la conscience d'autrui."
        correct: false
        feedback: >
          Ce n'est pas la confusion en jeu ici, et ce n'est de toute façon
          vrai ni de Husserl ni de Sartre : la honte, chez Sartre (R3), ne
          donne pas non plus un accès direct à la conscience d'autrui -- elle
          révèle seulement que j'existe comme objet regardé, pas ce que
          l'autre pense en son for intérieur.
      - id: B
        text: "Elle manque le fait que Husserl nie toute possibilité d'attribuer une vie intérieure à autrui, qui resterait, pour lui, un pur objet parmi les objets du monde."
        correct: false
        feedback: >
          C'est l'inverse : Husserl refuse justement de traiter autrui comme
          un pur objet -- il explique, par l'analogie des corps vécus,
          comment autrui m'apparaît comme un alter ego, un semblable, et non
          comme une chose. Le problème des autres consciences n'est pas nié,
          mais il n'aboutit pas non plus à un pur objet sans vie intérieure.
      - id: C
        text: "Elle confond l'aprésentation (un accès seulement indirect à une conscience que je ne perçois jamais elle-même) avec une perception directe de la conscience d'autrui -- ce que Husserl exclut : je ne perçois directement que son corps."
        correct: true
      - id: D
        text: "Elle manque le fait que, pour Husserl, autrui n'est pas vraiment un « autre » moi-même mais purement et simplement moi-même, un moi rigoureusement identique au mien, sans la moindre différence de perspective ni de vécu qui lui appartiendrait en propre."
        correct: false
        feedback: >
          L'alter ego husserlien reste littéralement un AUTRE moi-même :
          semblable à moi par la structure de son corps vécu, mais jamais
          réductible à moi, puisque sa conscience demeure un centre
          d'expérience que je ne vis jamais moi-même à sa place.
    correct_feedback: >
      L'aprésentation ne donne jamais un accès direct à la conscience
      d'autrui : je perçois directement son corps, et j'attribue, par
      analogie avec mon propre cas, une vie intérieure comparable -- sans
      que le problème des autres consciences soit pour autant résolu.
    solution: |
      **La présentation :** ce que je perçois directement -- le corps
      d'autrui, ses gestes, ses expressions.

      **L'aprésentation :** ce que je co-perçois indirectement, par
      analogie avec mon propre corps vécu -- une vie de conscience que je
      ne perçois jamais elle-même.

      **Ce que cela n'accomplit pas :** l'analogie explique comment autrui
      m'apparaît comme un alter ego plutôt que comme un objet, mais elle ne
      supprime pas le problème des autres consciences -- je n'obtiens
      jamais de preuve absolue d'une vie intérieure chez autrui.

  - id: AUT-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [hegel, reconnaissance, maitre_esclave]
    stem: >
      Pourquoi le maître, chez Hegel, reste-t-il finalement insatisfait dans
      la reconnaissance qu'il a obtenue de l'esclave ?
    type: mcq
    choices:
      - id: A
        text: "Parce qu'une reconnaissance obtenue d'un être qu'on ne reconnaît pas soi-même comme un égal ne vaut presque rien : seule une reconnaissance mutuelle satisferait pleinement une conscience de soi."
        correct: true
      - id: B
        text: "Parce que le maître, en réalité, perd physiquement le combat contre l'esclave, ce qui rend sa position intenable."
        correct: false
        feedback: >
          C'est l'inverse dans le récit de Hegel : c'est celui qui a préféré
          la mort à la soumission qui devient le maître. L'insatisfaction du
          maître ne vient pas d'une défaite physique, mais de la structure
          asymétrique de la reconnaissance qu'il obtient ensuite.
      - id: C
        text: "Parce que l'esclave, privé de toute conscience de lui-même par son travail forcé, ne peut littéralement offrir aucune reconnaissance, quelle qu'elle soit."
        correct: false
        feedback: >
          C'est le contraire : Hegel montre que l'esclave, par son travail --
          en façonnant et en maîtrisant la matière --, développe une
          conscience de lui-même plus autonome et plus durable que celle du
          maître, précisément parce qu'il continue d'agir sur le monde.
      - id: D
        text: "Parce que la dialectique du maître et de l'esclave décrit avant tout un rapport historique et social de domination économique entre les classes, sans réelle portée sur la structure de la conscience de soi en général."
        correct: false
        feedback: >
          Réduire la dialectique à une simple leçon sur la domination
          sociale ou économique manque son enjeu véritable : c'est un
          mouvement universel de la conscience de soi -- la reconnaissance
          non réciproque ne satisfait ni celui qui domine ni celui qui est
          dominé.
    correct_feedback: >
      Le maître obtient une reconnaissance, mais d'un être qu'il ne
      reconnaît pas lui-même comme un égal -- une reconnaissance asymétrique
      qui ne procure jamais la certitude pleine de soi que seule une
      reconnaissance mutuelle pourrait fonder.
    solution: |
      **La lutte à mort :** chacune des deux consciences risque sa vie pour
      être reconnue -- mais une reconnaissance obtenue par la mort de
      l'adversaire s'annule elle-même (un mort ne reconnaît rien).

      **Le maître et l'esclave :** une dissymétrie naît de la soumission de
      l'un -- reconnu sans reconnaître (le maître), reconnaissant sans être
      reconnu (l'esclave).

      **Le renversement :** la reconnaissance du maître, venant d'un être
      qu'il ne juge pas son égal, ne le satisfait jamais pleinement ;
      l'esclave, par le travail, développe une conscience de soi plus
      autonome. Seule une reconnaissance MUTUELLE satisferait authentiquement
      une conscience de soi.

  - id: AUT-3
    rung: "R3"
    difficulty_level: 2
    skill_code: philo_autrui
    tags: [sartre, honte, regard, mediateur]
    stem: >
      Dans la scène du trou de la serrure, pourquoi Sartre insiste-t-il pour
      dire que la honte n'est pas d'abord une peur d'être puni ?
    type: mcq
    choices:
      - id: A
        text: "Parce que, dans cette scène précise, la personne qui surprend le voyeur est une autorité particulièrement sévère, ce qui rend la peur de la sanction hors de propos."
        correct: false
        feedback: >
          L'identité ou la sévérité de la personne qui surprend n'est pas le
          point de Sartre : la honte surgirait structurellement de la même
          façon même si le pas dans le couloir n'appartenait, en réalité, à
          personne -- ce qui montre que ce n'est pas la sanction qui est en
          cause.
      - id: B
        text: "Parce que Sartre nie que la honte soit un sentiment réellement vécu : ce serait, chez lui, une pure construction intellectuelle et abstraite, entièrement dépourvue de la moindre dimension affective ou émotionnelle."
        correct: false
        feedback: >
          Sartre décrit au contraire la honte comme un sentiment vécu et
          immédiat, qui envahit la conscience dès le basculement du regard --
          il ne la réduit pas à une opération purement intellectuelle, il en
          isole seulement l'origine structurelle (le fait d'être objet du
          regard), pas son caractère affectif.
      - id: C
        text: "Parce que la honte, chez Sartre, exprime avant tout le désir d'obtenir la reconnaissance et l'approbation de l'autre, comme chez Hegel."
        correct: false
        feedback: >
          C'est confondre le mécanisme de Sartre avec celui de Hegel (R2) :
          Hegel décrit une reconnaissance mutuelle recherchée activement ;
          la honte sartrienne n'est pas une recherche d'approbation, c'est
          la découverte subie, immédiate, que j'existe comme objet pour un
          regard qui me précède.
      - id: D
        text: "Parce qu'on peut ressentir cette honte même sans aucun risque réel de sanction -- elle naît de la simple reconnaissance immédiate que j'existe, à cet instant, comme l'objet du regard d'un autre."
        correct: true
    correct_feedback: >
      La honte peut surgir même en l'absence totale de risque de sanction :
      elle révèle simplement que j'existe, pour un autre, comme l'objet de
      son regard -- une dimension de mon être que je ne pourrais jamais
      atteindre par ma seule introspection.
    solution: |
      **Le basculement :** absorbé dans ce que je regarde, sans aucun
      « moi » réflexif, puis brusquement conscient d'être moi-même regardé.

      **Ce que la honte révèle :** non une peur de la punition, mais la
      simple reconnaissance que je suis, pour un autre, cet être qu'il voit
      -- indépendamment de tout risque réel de conséquence.

      **La formule de Sartre :** autrui est le médiateur indispensable entre
      moi et moi-même -- certains aspects de mon être ne me sont accessibles
      que par le regard effectif d'un autre, jamais par la seule réflexion
      solitaire.

  - id: AUT-4
    rung: "R4"
    difficulty_level: 3
    skill_code: philo_autrui
    tags: [sartre, enfer_c_est_les_autres, conflit_libertes]
    stem: >
      Un élève écrit : « Sartre, avec "l'enfer, c'est les autres", veut dire
      que la compagnie des autres est simplement pénible, et qu'il vaudrait
      mieux vivre seul. » Qu'est-ce que cette lecture manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le fait que Sartre recommande, au contraire, de chercher systématiquement à dominer et à devancer le regard de l'autre, afin de le fixer comme objet avant même qu'il ne puisse me regarder et me figer le premier dans ce duel des consciences."
        correct: false
        feedback: >
          Sartre décrit un conflit structurel entre deux libertés qui
          alternent entre regarder et être regardé -- il n'en tire aucune
          recommandation de « dominer l'autre en premier » ; ce serait
          prendre une description ontologique pour un conseil stratégique.
      - id: B
        text: "Elle manque le sens structurel de la formule : dépendre du regard d'un autre pour savoir qui je suis, sans jamais pouvoir en reprendre le contrôle -- et non une plainte sur la fréquentation d'autrui, ni un appel à la solitude."
        correct: true
      - id: C
        text: "Elle manque le fait que cette formule appartient en réalité à Hegel, dans sa description du maître et de l'esclave."
        correct: false
        feedback: >
          C'est une mauvaise attribution : « l'enfer, c'est les autres » est
          une réplique de la pièce Huis clos (1944) de Sartre, pas un énoncé
          de Hegel -- même si les deux auteurs partagent l'idée qu'autrui est
          nécessaire à la conscience de soi, cette formule précise est
          sartrienne.
      - id: D
        text: "Elle manque le fait que Sartre parle ici littéralement d'un châtiment religieux réservé à ceux qui font du mal à autrui."
        correct: false
        feedback: >
          La formule n'a aucun sens religieux ou punitif chez Sartre : elle
          désigne une structure du rapport aux autres consciences (être figé
          par un regard qu'on ne contrôle jamais), pas une sanction morale ou
          théologique.
    correct_feedback: >
      « L'enfer, c'est les autres » ne dit pas que les autres sont
      simplement pénibles : la formule désigne la dépendance structurelle
      envers un regard qui me fige dans une image que je n'ai pas choisie et
      que je ne peux jamais reprendre en main -- pas un encouragement à la
      solitude.
    solution: |
      **Le revers du regard :** être vu me révèle à moi-même (R3), mais me
      transforme aussi en objet fixé dans le monde de l'autre.

      **Le conflit des libertés :** deux consciences ne peuvent occuper
      simultanément la position de sujet -- regarder et être regardé
      s'excluent et alternent sans repos stable.

      **Le sens exact de la formule :** dans Huis clos, des personnages
      enfermés sans miroir ne peuvent plus se connaître que par le regard
      des autres, qu'ils ne contrôlent jamais -- ce n'est pas une plainte sur
      la fréquentation d'autrui, ni un conseil de solitude.

  - id: AUT-5
    rung: "R5"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [levinas, sartre, visage, regard, responsabilite]
    stem: >
      Quelle affirmation distingue correctement le visage chez Levinas et le
      regard chez Sartre ?
    type: mcq
    choices:
      - id: A
        text: "Le visage et le regard sont, chez Levinas comme chez Sartre, deux mots pour désigner exactement le même phénomène de conflit entre consciences."
        correct: false
        feedback: >
          Ce ne sont pas des synonymes : les deux auteurs partent bien d'une
          même intuition (autrui n'est pas un simple objet), mais en tirent
          des conséquences opposées -- conflit et menace pour la liberté chez
          Sartre, responsabilité et appel éthique chez Levinas.
      - id: B
        text: "C'est le regard, chez Sartre, qui fonde une responsabilité asymétrique envers autrui ; c'est le visage, chez Levinas, qui engendre un conflit des libertés."
        correct: false
        feedback: >
          C'est l'inverse exact des deux thèses : chez Sartre, c'est le
          regard qui objective et engendre le conflit des libertés (R4) ;
          chez Levinas, c'est le visage qui fonde une responsabilité
          asymétrique, sans conflit de pouvoir (R5).
      - id: C
        text: "Le regard sartrien objective autrui et menace ma liberté, engendrant un conflit entre deux consciences ; le visage lévinassien, lui, ne m'objective ni ne me menace : il commande une responsabilité asymétrique qui précède tout choix."
        correct: true
      - id: D
        text: "Les deux concepts désignent, chez l'un comme chez l'autre, uniquement l'apparence physique et extérieure du visage -- sa forme, ses traits, la couleur des yeux ou de la peau --, indépendamment de toute portée proprement philosophique ou éthique."
        correct: false
        feedback: >
          Ni Sartre ni Levinas ne s'arrêtent à l'apparence physique : le
          regard sartrien désigne une structure de la conscience qui
          objective l'autre ; le visage lévinassien désigne une vulnérabilité
          qui résiste précisément à toute réduction à des traits descriptibles.
    correct_feedback: >
      Le regard (Sartre) objective et menace ma liberté dans un rapport de
      force ; le visage (Levinas) ne menace rien mais commande une
      responsabilité asymétrique qui précède tout choix -- deux conséquences
      opposées tirées d'une même intuition que l'autre n'est pas un simple
      objet.
    solution: |
      **Le regard (Sartre) :** objective, fige dans une image non choisie,
      installe un conflit structurel entre deux libertés qui ne peuvent être
      simultanément sujets.

      **Le visage (Levinas) :** résiste à toute réduction, commande sans
      contraindre par la force, fonde une responsabilité ASYMÉTRIQUE -- je
      suis responsable d'autrui indépendamment de ce qu'il fait en retour.

      **L'erreur à éviter :** confondre ces deux paradigmes -- l'un pense le
      rapport à autrui comme conflit, l'autre comme responsabilité qui
      précède la connaissance et la liberté.

  - id: AUT-6
    rung: "R6"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [kant, personne, moyen_fin, morale]
    stem: >
      Un élève affirme : « Pour Kant, il est immoral d'utiliser quelqu'un
      comme moyen, quel qu'il soit -- par exemple, payer un artisan pour un
      service serait déjà contraire au devoir. » Qu'est-ce que cette lecture
      manque ?
    type: mcq
    choices:
      - id: A
        text: "Elle manque le mot exact de la formule kantienne : JAMAIS SIMPLEMENT comme un moyen -- ce qui autorise d'utiliser autrui comme moyen, à condition de le traiter EN MEME TEMPS comme une fin, jamais de le réduire à un pur instrument."
        correct: true
      - id: B
        text: "Elle manque le fait que Kant autorise, au contraire, de traiter autrui uniquement comme un moyen dès lors que cela reste légal."
        correct: false
        feedback: >
          Ce n'est pas non plus la position de Kant : la légalité d'un acte
          ne suffit jamais, chez lui, à en garantir la valeur morale. Le
          principe exige de traiter l'humanité, dans la personne d'autrui,
          toujours aussi comme une fin -- jamais comme un simple moyen, même
          légal.
      - id: C
        text: "Elle manque le fait que cette formule appartient en réalité à Levinas, et non à Kant."
        correct: false
        feedback: >
          C'est une erreur d'attribution : traiter l'humanité toujours comme
          une fin, jamais simplement comme un moyen, est une formule de Kant
          (Fondements de la métaphysique des mœurs, 1785) -- Levinas fonde sa
          propre responsabilité asymétrique sur un concept différent, le
          visage (R5), sans faire appel à cette formule.
      - id: D
        text: "Elle manque le fait que ce principe ne s'appliquerait, chez Kant, qu'aux seules relations avec des inconnus croisés une seule fois, et jamais aux personnes proches que je connais et fréquente de longue date, au quotidien et en qui j'ai toute confiance."
        correct: false
        feedback: >
          La formule kantienne vise explicitement « la personne de tout
          autre », sans distinction entre proches et inconnus -- rien, dans
          le texte de Kant, ne restreint ce principe aux seules relations
          avec des inconnus.
    correct_feedback: >
      Kant n'interdit pas d'utiliser autrui comme moyen dans un échange (payer
      un service, par exemple) : il interdit de le réduire ENTIÈREMENT à un
      instrument, sans jamais le traiter aussi comme une fin en soi, digne de
      respect.
    solution: |
      **La formule exacte :** « traiter l'humanité... toujours en même temps
      comme une fin, et jamais simplement comme un moyen. »

      **Ce que cela permet :** utiliser autrui comme moyen dans un échange
      (un professeur qui te fait travailler, un artisan payé pour un
      service) reste compatible avec le respect de sa dignité, tant qu'il est
      aussi traité comme une fin.

      **Ce que cela interdit :** réduire autrui à un pur instrument, sans
      jamais reconnaître, en lui, une fin en soi qui mérite le respect
      indépendamment de ce qu'il peut apporter.
