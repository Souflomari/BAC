  - id: AUT-25
    rung: "R2"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [hegel, reconnaissance, maitre-esclave]
    stem: >
      Dans la dialectique hégélienne, le maître sort vainqueur de la lutte et
      se fait reconnaître par l'esclave. Cette reconnaissance le satisfait-elle ?
    type: mcq
    choices:
      - id: A
        text: "Non : elle vient d'une conscience qu'il a lui-même réduite au rang d'instrument, donc d'un être dont le jugement ne vaut plus rien à ses yeux."
        correct: true
      - id: B
        text: "Oui : il a obtenu ce qu'il cherchait — être reconnu — et sa position de maître le lui garantit durablement."
        correct: false
        misconception: mc.philo.autrui.maitre-satisfait-par-reconnaissance
        feedback: >
          C'est l'impasse que Hegel met au jour. Une reconnaissance ne vaut que
          si elle émane d'une conscience libre ; or le maître a précisément ôté
          à l'esclave cette liberté. Il obtient donc la forme de la
          reconnaissance et en perd la substance — tandis que l'esclave, par le
          travail, transforme le monde et s'y reconnaît.
      - id: C
        text: "La question ne se pose pas : cette dialectique décrit un rapport social de domination économique, non une structure de la conscience."
        correct: false
        misconception: mc.philo.autrui.dialectique-maitre-esclave-mal-comprise
        feedback: >
          Hegel décrit une structure de la CONSCIENCE de soi : comment une
          conscience en vient à avoir besoin d'une autre pour se savoir
          elle-même. Les lectures sociales et économiques viendront après lui, et
          d'autres auteurs ; les réduire l'une à l'autre fait perdre ce que le
          chapitre établit.
      - id: D
        text: "Oui, et Sartre reprendra ce point sans le modifier : le regard d'autrui produit chez lui exactement la reconnaissance hégélienne."
        correct: false
        misconception: mc.philo.autrui.sartre-reduit-hegel
        feedback: >
          Sartre déplace la question. Chez Hegel, il s'agit d'une reconnaissance
          à conquérir ; chez Sartre, le regard d'autrui me RÉVÈLE une dimension
          de moi — le moi-pour-autrui — que nulle introspection n'atteindrait.
          Autrui n'y est pas un rival à vaincre mais un médiateur indispensable.
      # Note d'auteur : les trois distracteurs visent trois familles distinctes,
      # ce qui est la contrainte de couverture ; ils restent cependant chacun
      # une erreur réelle et documentée du chapitre.
    correct_feedback: >
      La reconnaissance obtenue est vide : elle vient d'une conscience que le
      maître a lui-même réduite au rang de chose. C'est l'échec du maître — et
      c'est l'esclave qui, par le travail, se reconnaîtra dans le monde qu'il
      transforme.
    solution: |
      **Ce que la lutte cherche.** Non pas la domination pour elle-même, mais la
      RECONNAISSANCE : être tenu pour une conscience libre par une autre
      conscience libre.

      **Pourquoi la victoire échoue.** Le maître obtient la reconnaissance d'un
      être qu'il a réduit à l'instrument. Une reconnaissance qui ne vient pas
      d'une liberté ne vaut rien : elle a la forme du but sans en avoir la
      substance.

      **Le renversement.** L'esclave, lui, travaille — et dans l'objet qu'il
      façonne, il voit sa propre activité déposée. C'est par là qu'il accède à
      la conscience de soi que le maître a manquée.

  - id: AUT-26
    rung: "R2"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [hegel, accroche, revelation]
    stem: >
      Le chapitre d'ouverture pose deux questions sur autrui. Lesquelles, et
      comment se rapportent-elles à la dialectique de la reconnaissance ?
    type: mcq
    choices:
      - id: A
        text: "Son statut — semblable ou inaccessible — et son rapport à ma liberté ; Hegel travaille surtout la seconde, sans dissoudre la première."
        correct: true
      - id: B
        text: "Il n'y en a qu'une, en réalité : celle de savoir si je peux connaître autrui, dont tout le reste découle."
        correct: false
        misconception: mc.philo.autrui.double-question-reduite
        feedback: >
          Les deux volets ne se ramènent pas l'un à l'autre. Le premier est
          épistémologique — puis-je accéder à une autre conscience ? Le second
          est pratique — que devient ma liberté en présence de la sienne ? On
          peut répondre au premier (Husserl) sans avoir touché au second
          (Sartre).
      - id: C
        text: "Une seule également, et la lutte la tranche : le maître obtient la reconnaissance qu'il cherchait, et la question est close."
        correct: false
        misconception: mc.philo.autrui.maitre-satisfait-par-reconnaissance
        feedback: >
          La lutte ne clôt rien : elle échoue. La reconnaissance obtenue d'un
          être réduit à l'instrument ne satisfait pas celui qui la reçoit — c'est
          le ressort même de la suite, où l'esclave accède par le travail à ce
          que le maître a manqué.
      - id: D
        text: "Deux, mais elles se contredisent : autrui ne peut pas à la fois me révéler à moi-même et me figer dans une image que je n'ai pas choisie."
        correct: false
        misconception: mc.philo.autrui.revelation-objectivation-opposees
        feedback: >
          Les deux vont ensemble chez Sartre, et c'est ce qui fait la force de
          l'analyse : le même regard me révèle une dimension de moi (le
          moi-pour-autrui) ET me fige dans une image que je ne choisis pas. La
          révélation a pour prix l'objectivation ; il n'y a pas contradiction
          mais tension.
    correct_feedback: >
      Deux questions distinctes : le STATUT d'autrui — semblable accessible ou
      radicalement autre — et son rapport à MA LIBERTÉ. Hegel travaille surtout
      la seconde ; Husserl la première. Les confondre fait perdre la moitié du
      chapitre.
    solution: |
      **Les deux volets.**
      1. *Épistémologique* : autrui m'est-il accessible ? Comment sais-je qu'il
         y a là une conscience et non un automate ?
      2. *Pratique* : que devient ma liberté quand une autre liberté est là ?

      **Leur indépendance.** Husserl répond au premier par l'aprésentation ;
      Sartre travaille le second par le regard. Une réponse à l'un ne donne pas
      la réponse à l'autre.

      **Ce que Hegel apporte.** Sur le second volet : autrui n'est pas seulement
      un obstacle, il est la condition pour que je me sache moi-même.

  - id: AUT-27
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [sartre, honte, moi-pour-autrui]
    stem: >
      Sartre décrit l'homme surpris à regarder par le trou d'une serrure. Que
      révèle la honte qu'il éprouve ?
    type: mcq
    choices:
      - id: A
        text: "Une dimension de lui-même — le moi-pour-autrui — que l'introspection la plus rigoureuse ne lui aurait pas livrée."
        correct: true
      - id: B
        text: "Une simple crainte d'être puni par la personne qui l'a surpris, sentiment social ordinaire sans portée philosophique."
        correct: false
        misconception: mc.philo.autrui.honte-mal-comprise
        feedback: >
          La honte sartrienne n'est pas une peur de sanction : elle survient même
          si le témoin est un inconnu qui passera son chemin, et même s'il n'y a
          aucune punition possible. Ce qu'elle révèle n'est pas un risque, c'est
          un ÊTRE — je suis quelqu'un qui, vu du dehors, est cela.
      - id: C
        text: "Rien qu'il ne puisse atteindre seul : une introspection assez rigoureuse lui donnerait le même contenu, sans témoin."
        correct: false
        misconception: mc.philo.autrui.moi-pour-autrui-seul
        feedback: >
          C'est précisément ce que Sartre conteste. Je peux m'observer autant que
          je veux : je ne me verrai jamais comme un objet dans le monde de
          quelqu'un d'autre. Il y faut un regard EFFECTIF — autrui est le
          médiateur indispensable entre moi et moi-même.
      - id: D
        text: "Que le maître de Hegel avait tort de se croire insatisfait : la reconnaissance obtenue par la force suffit à révéler qui l'on est."
        correct: false
        misconception: mc.philo.autrui.maitre-satisfait-par-reconnaissance
        feedback: >
          Deux erreurs. Le maître hégélien n'obtient pas de reconnaissance
          valable, puisqu'elle émane d'une conscience qu'il a asservie. Et la
          révélation sartrienne ne passe pas par la force : le regard le plus
          anodin suffit, celui d'un passant qui ne demande rien.
    correct_feedback: >
      La honte révèle le MOI-POUR-AUTRUI : ce que je suis en tant qu'objet dans
      le monde d'une autre conscience. Nulle introspection ne l'atteint —
      j'aurais beau m'observer, je ne me verrais jamais comme autrui me voit.
    solution: |
      **La scène.** Absorbé par ce qu'il regarde, l'homme n'est que son acte. Un
      bruit dans le couloir : quelqu'un le voit.

      **Ce qui change.** Il ne se découvre pas une faute — il la connaissait —
      mais un ÊTRE : « je suis un voyeur ». Cette qualification lui vient du
      dehors, et il ne peut ni la produire ni la refuser seul.

      **La thèse.** Autrui est le médiateur indispensable entre moi et moi-même.
      Une part de ce que je suis ne m'est accessible que par un regard effectif.

  - id: AUT-28
    rung: "R1"
    difficulty_level: 4
    skill_code: philo_autrui
    tags: [husserl, aprésentation, alter-ego]
    stem: >
      Comment Husserl rend-il compte de l'accès à la conscience d'autrui ?
    type: mcq
    choices:
      - id: A
        text: "Par l'aprésentation : le corps d'autrui me donne, avec ce que je perçois, ce que je ne perçois pas — sa vie intérieure, visée sans être vue."
        correct: true
      - id: B
        text: "Par une perception directe : je vois la conscience d'autrui aussi immédiatement que je vois son visage."
        correct: false
        misconception: mc.philo.autrui.apresentation-mal-comprise
        feedback: >
          Si la conscience d'autrui m'était directement perceptible, elle serait
          mienne — et il n'y aurait plus d'autrui. L'aprésentation nomme
          exactement ce statut intermédiaire : une visée qui ACCOMPAGNE la
          perception du corps sans se réduire à elle, et sans jamais devenir une
          perception au sens propre.
      - id: C
        text: "Par une inférence probable : autrui n'étant qu'un objet parmi les objets, je lui prête une vie intérieure par simple analogie commode."
        correct: false
        misconception: mc.philo.autrui.alter-ego-mal-compris
        feedback: >
          L'alter ego n'est ni un pur objet ni un double de moi. Husserl tient
          les deux : autrui m'est donné comme un ego — une conscience — et comme
          ALTER — inaccessible en première personne. Le réduire à un objet auquel
          je prête une intériorité manque la moitié du concept.
      - id: D
        text: "La question ne se pose pas : elle se ramène à celle du rapport entre sa liberté et la mienne."
        correct: false
        misconception: mc.philo.autrui.double-question-reduite
        feedback: >
          Les deux questions du chapitre 1 sont distinctes. Celle de l'ACCÈS —
          comment sais-je qu'il y a là une conscience ? — précède celle du
          rapport des libertés, et Husserl traite la première sans préjuger de
          la seconde.
    correct_feedback: >
      L'aprésentation : le corps d'autrui me donne, en même temps que ce que je
      perçois, ce que je ne percevrai jamais — sa vie intérieure. Elle est
      VISÉE avec la perception, sans être elle-même perçue.
    solution: |
      **Le problème.** Je perçois un corps, des gestes, une voix. Rien de tout
      cela n'est une conscience. Comment y a-t-il pour moi de l'autre ?

      **La réponse husserlienne.** L'aprésentation : une visée qui accompagne la
      perception et donne, en creux, ce qui ne peut pas se donner en personne.
      Comme la face cachée d'un objet est co-visée avec sa face visible.

      **Le juste milieu du concept d'alter ego.** Autrui est un EGO — une
      conscience, non un automate — et il est ALTER — jamais accessible comme la
      mienne. Retirer l'un des deux termes fait disparaître le problème.

