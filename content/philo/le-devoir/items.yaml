misconceptions:
  - id: mc.philo.devoir.faux-dilemme-contrainte-devoir-moral
    label: "« Il faut choisir entre devoir-contrainte et devoir moral pur » (la méconception maîtresse)"
    description: >-
      L'élève traite la question du chapitre 1 comme un choix exhaustif entre deux
      camps (pure peur de la sanction / devoir moral déjà pleinement établi
      et incontestable), et échappe à la tension réelle soit en refusant
      l'hypothèse posée (inventer une contrainte cachée, prétendre que les
      élèves trichent quand même), soit en dissolvant la question
      (relativisme, « c'est purement subjectif »), soit en tranchant d'office
      pour l'un des deux camps sans l'examiner.
    contradicts_principle: >-
      Le problème philosophique du devoir n'est ni de choisir entre les deux
      réponses spontanées de R0, ni de rejeter la question comme sans objet :
      c'est de penser un devoir qui ne se réduise ni à la peur d'une
      sanction externe, ni à une habitude de conscience intériorisée jamais
      examinée.

  - id: mc.philo.devoir.devoir-reduit-a-la-contrainte
    label: "« Le devoir n'est jamais que la peur d'être vu et puni »"
    description: >-
      L'élève mesure le devoir à la seule intensité de la surveillance ou du
      risque de sanction — y compris sous la forme d'une convention sociale
      ou d'une pression de groupe — et en conclut que le devoir disparaît
      dès que ce risque tombe à zéro, sans expliquer ce qui, empiriquement,
      continue à retenir beaucoup d'élèves une fois le surveillant sorti.
    contradicts_principle: >-
      Le devoir comme obligation morale ne se mesure pas à la surveillance ;
      il vaudrait exactement autant seul, sans témoin. Réduire tout devoir à
      la contrainte extérieure ne rend pas compte de ce qui persiste quand
      le risque a disparu.

  - id: mc.philo.devoir.sentiment-suffit-a-garantir-devoir-authentique
    label: "« Si je sens intérieurement que c'est un devoir, s'en est un, sans qu'il faille l'interroger »"
    description: >-
      L'élève prend le sentiment ou la conviction intérieure d'être obligé
      comme une preuve suffisante d'un devoir moral authentique — allant
      parfois jusqu'à nier la réalité de toute contrainte extérieure pour ne
      garder que cette conscience individuelle — sans se demander si ce
      sentiment pourrait être une habitude sociale intériorisée plutôt qu'un
      devoir véritable.
    contradicts_principle: >-
      Le simple sentiment intérieur d'être obligé ne suffit pas, à lui seul,
      à garantir qu'on tient un devoir moral véritable plutôt qu'un
      conditionnement — affirmer un devoir pur sans l'interroger laisse
      ouverte la question de savoir comment le distinguer d'une habitude
      intériorisée jamais questionnée.

  - id: mc.philo.devoir.legalite-confondue-moralite
    label: "« Légal et moral, c'est la même chose — dans un sens ou dans l'autre »"
    description: >-
      L'élève confond la conformité d'une action à une règle extérieure
      (légalité) avec sa valeur morale authentique (moralité) : il pense
      qu'une action conforme au devoir est automatiquement accomplie PAR
      devoir, qu'un devoir doit être inscrit dans une loi pour exister
      moralement, ou qu'agir par peur annule jusqu'à la légalité de l'acte.
    contradicts_principle: >-
      Une action peut être légale sans être morale (payer ses impôts par
      peur du redressement), et un devoir moral n'a pas besoin d'être
      inscrit dans une loi pour obliger réellement — le problème du devoir
      ne porte pas sur ce que dit le règlement, mais sur ce qui, en soi,
      ferait qu'une action est due.

  - id: mc.philo.devoir.absence-valeur-morale-confondue-immoralite
    label: "« Une action sans valeur morale distinctive est une action immorale »"
    description: >-
      L'élève confond « ne révèle aucune vertu particulière » (agir
      conformément au devoir par intérêt) avec « est condamnable » — comme
      si toute action qui n'a pas de valeur morale au sens fort devenait,
      de ce seul fait, une faute.
    contradicts_principle: >-
      L'action elle-même (ne pas tromper le client, payer ses impôts) reste
      conforme à ce que le devoir exige ; ce que Kant conteste, c'est
      qu'elle ait une valeur morale authentique, pas qu'elle soit
      condamnable.

  - id: mc.philo.devoir.critere-consequentialiste-substitue-au-motif
    label: "« Ce qui compte, c'est le résultat produit, pas le mobile » (appliqué à tort au cadre kantien)"
    description: >-
      Face à une question qui porte sur le motif d'une action selon Kant,
      l'élève répond en jugeant l'action à ses conséquences (bonheur
      produit, bénéfice collectif, rentabilité à long terme) — un critère
      utilitariste, pas le critère kantien du devoir.
    contradicts_principle: >-
      Pour Kant, la valeur morale d'une action tient à son mobile,
      indépendamment de ce qu'elle produit comme résultat ; l'impératif
      catégorique ne demande jamais quel résultat l'action va produire.

  - id: mc.philo.devoir.imperatif-categorique-confondu-heteronomie
    label: "« La loi morale est imposée à la raison depuis l'extérieur »"
    description: >-
      L'élève pense que l'impératif catégorique renvoie à une autorité
      extérieure à la raison (Dieu, la société, l'État, la loi civile en
      vigueur) plutôt qu'à un test que la raison de chacun applique à
      elle-même.
    contradicts_principle: >-
      Kant appelle cela l'hétéronomie (obéir à une loi reçue du dehors) —
      l'inverse de sa position : la raison ne reçoit pas la loi morale, elle
      se la donne à elle-même en testant la cohérence de ses propres
      maximes (l'autonomie).

  - id: mc.philo.devoir.devoir-confondu-avec-inclination
    label: "« Le critère moral, c'est ce que je désire ou ressens le plus fortement »"
    description: >-
      L'élève réintroduit les inclinations, désirs ou affections
      personnelles comme critère du devoir, alors que l'impératif
      catégorique écarte précisément les inclinations du test moral parce
      qu'elles varient d'une personne et d'un moment à l'autre.
    contradicts_principle: >-
      L'impératif catégorique écarte les inclinations et les désirs du
      critère moral ; le test porte sur ce qui peut valoir pour tous, sans
      exception, pas sur ce que l'on désire le plus profondément à cet
      instant.

  - id: mc.philo.devoir.imperatif-categorique-juge-arbitraire
    label: "« Le test kantien n'a aucun fondement réel, c'est arbitraire »"
    description: >-
      L'élève pense que l'impératif catégorique est un test formel sans
      justification rationnelle réelle, plutôt que d'y voir la raison se
      donnant à elle-même sa propre loi en testant la cohérence de ses
      maximes.
    contradicts_principle: >-
      C'est « ma propre raison » qui se donne cette loi en testant
      elle-même la cohérence de ses maximes — le test n'est pas arbitraire,
      il a un fondement rationnel précis : la généralisation qui se détruit,
      ou non, elle-même.

  - id: mc.philo.devoir.critique-utilitariste-mal-identifiee
    label: "« En quoi consiste la critique utilitariste ? » — mal reformulée de trois façons distinctes"
    description: >-
      L'élève ne parvient pas à formuler correctement ce que l'utilitarisme
      reproche précisément à Kant : il croit que la critique nie l'existence
      même du devoir, qu'elle reproche à Kant de fonder la morale sur le
      sentiment (confusion avec Bergson), ou qu'elle lui attribue à tort la
      position inverse de la sienne (juger uniquement par les conséquences).
    contradicts_principle: >-
      L'utilitarisme reproche à Kant de juger l'action sur la seule forme de
      sa maxime, sans égard pour ses conséquences réelles — ce qui peut
      conduire à des résultats manifestement contestables ; il ne nie pas le
      devoir, ne relève pas du sentiment, et ne renverse pas la position
      réelle de Kant.

  - id: mc.philo.devoir.morale-close-ouverte-mal-comprise
    label: "« La distinction de Bergson porte sur le destinataire du devoir, ou juge la morale close sans valeur »"
    description: >-
      L'élève méprend la distinction bergsonienne entre morale close et
      morale ouverte : soit il la fait porter sur le destinataire du devoir
      (soi / autrui) plutôt que sur sa source psychologique et sociale, soit
      il traite la morale close comme fausse ou à remplacer entièrement
      plutôt que comme un socle nécessaire que la morale ouverte complète.
    contradicts_principle: >-
      La morale close vient d'une pression sociale intériorisée ; la morale
      ouverte procède d'un élan qui dépasse l'obligation reçue — cette
      distinction porte sur l'ORIGINE psychologique du devoir, pas sur son
      destinataire, et Bergson ne juge jamais la morale close fausse ou à
      rejeter : elle reste, chez lui, le socle nécessaire de la vie sociale.

  - id: mc.philo.devoir.devoir-liberte-mal-articules
    label: "« Tu dois, donc tu peux » mal compris — implication inversée, opposition, ou portée réduite"
    description: >-
      L'élève mésinterprète la formule kantienne « tu dois, donc tu peux » :
      il inverse l'implication (être capable de quelque chose en ferait un
      devoir), affirme que le devoir s'oppose à la liberté, ou restreint la
      liberté en jeu au seul choix entre devoirs concurrents plutôt qu'à la
      possibilité même d'agir autrement.
    contradicts_principle: >-
      Le devoir ne s'oppose pas à la liberté : il la présuppose absolument.
      On ne peut être tenu à un devoir que si l'on est réellement capable de
      l'accomplir ; être capable de faire quelque chose n'en fait jamais,
      pour autant, une obligation.

  - id: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
    label: "« Les gestes de la méthode (suffisance, problématique, dépassement) sont interchangeables ou décoratifs »"
    description: >-
      L'élève traite une question de suffisance comme une question
      d'existence, confond une problématique avec une simple reformulation
      ou une thèse déjà tranchée, ou fait du dépassement final soit un
      simple retour à la thèse, soit un constat de contradiction non
      résolu, soit l'ajout d'un matériau hors sujet.
    contradicts_principle: >-
      Une problématique met en tension deux positions légitimes en
      apparence, sans se contenter de reformuler le sujet ; le dépassement
      articule ce que la thèse et l'antithèse ont chacune montré de vrai —
      il ne fait gagner ni l'une ni l'autre et n'importe rien d'étranger au
      devoir déjà construit.

  - id: mc.philo.devoir.coincidence-devoir-inclination-jugee-suffisante
    label: "« Si une action coïncide avec le devoir ET avec l'inclination, cela prouve déjà sa valeur morale » (axe nouveau, ouvert par le texte de r-bac)"
    description: >-
      L'élève pense que le fait, pour la plupart des gens, de préserver leur
      vie à la fois par devoir ET par inclination immédiate suffit déjà à
      donner à cet acte une valeur morale — sans voir que Kant retire
      précisément toute valeur morale distinctive à ce cas, réservée au seul
      cas où le devoir agit contre ou sans l'inclination.
    contradicts_principle: >-
      Kant l'affirme explicitement à propos de la conservation de la vie :
      le soin que la plupart des hommes y mettent, bien que conforme au
      devoir ET porté par une inclination immédiate, « n'enveloppe aucune
      valeur intrinsèque » ; seul l'homme qui préserve sa vie sans l'aimer,
      contre son inclination, agit par un mobile qui a un contenu moral.

items:
  - id: DEV-1
    rung: "R2"
    difficulty_level: 2
    skill_code: philo_devoir
    tags: [distinction_auteurs, kant, legalite_moralite]
    stem: >
      Un commerçant ne trompe jamais ses clients sur le prix, parce qu'il sait
      qu'une réputation d'honnêteté fait revenir la clientèle. Comment Kant
      qualifierait-il cette action ?
    type: mcq
    choices:
      - id: A
        text: "Une action accomplie par devoir, donc pleinement morale."
        correct: false
        misconception: mc.philo.devoir.legalite-confondue-moralite
        feedback: >
          Le mobile réel de ce commerçant est l'intérêt (garder sa clientèle),
          pas le respect de l'exigence morale elle-même. Pour Kant, ce n'est
          pas parce qu'une action correspond à ce que le devoir exige qu'elle
          est accomplie par devoir : il faut regarder le motif, pas seulement
          l'action visible.
      - id: B
        text: "Une action conforme au devoir, mais sans valeur morale au sens kantien, car son mobile est l'intérêt et non le respect du devoir lui-même."
        correct: true
      - id: C
        text: "Une action immorale, puisque le commerçant profite de la situation pour attirer des clients."
        correct: false
        misconception: mc.philo.devoir.absence-valeur-morale-confondue-immoralite
        feedback: >
          L'action elle-même (ne pas tromper) reste conforme à ce que le
          devoir exige : rien d'immoral dans le résultat visible. Ce que Kant
          conteste, c'est qu'elle ait une valeur MORALE authentique, pas
          qu'elle soit condamnable — confondre les deux, c'est manquer la
          distinction légalité/moralité.
      - id: D
        text: "Une action légale mais dont la moralité ne dépend que de ses conséquences positives sur le long terme, en particulier le fait qu'elle contribue à entretenir, année après année, la confiance générale entre commerçants et clientèle."
        correct: false
        misconception: mc.philo.devoir.critere-consequentialiste-substitue-au-motif
        feedback: >
          Juger une action à ses conséquences (le bénéfice à long terme),
          c'est une logique utilitariste, pas kantienne. Pour Kant, la valeur
          morale d'une action tient à son mobile, indépendamment de ce
          qu'elle produit comme résultat.
    correct_feedback: >
      Kant distingue agir CONFORMÉMENT au devoir (l'action correspond à ce que
      le devoir exige, mais par intérêt) et agir PAR devoir (par pur respect
      pour l'exigence morale, indépendamment de toute conséquence pour soi).
      Seule la seconde a une valeur morale authentique : la première
      s'effondrerait le jour où l'honnêteté cesserait d'être rentable.
    solution: |
      **Le point de départ :** l'action visible (ne pas tromper le client)
      est identique dans les deux cas — ce qui change, c'est le mobile.

      **Agir conformément au devoir :** le commerçant est honnête parce que
      c'est rentable (réputation, fidélisation). Retire l'intérêt, et rien ne
      garantit que l'honnêteté tiendrait encore.

      **Agir par devoir :** le commerçant serait honnête même si cela lui
      coûtait sa clientèle, par seul respect de l'exigence morale.

      **Pourquoi la distinction compte :** pour Kant, seule l'action motivée
      par le devoir lui-même — et non par un calcul, même légitime — a une
      valeur morale au sens fort. C'est la distinction légalité (conformité
      à la règle) / moralité (motif moral authentique).

  - id: DEV-2
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_devoir
    tags: [distinction_auteurs, kant, imperatif_categorique]
    stem: >
      Que teste concrètement l'impératif catégorique, dans sa formulation par
      la loi universelle ?
    type: mcq
    choices:
      - id: A
        text: "Si l'action produira, au final, davantage de bonheur que de souffrance pour le plus grand nombre de personnes concernées par ses conséquences directes et indirectes."
        correct: false
        misconception: mc.philo.devoir.critere-consequentialiste-substitue-au-motif
        feedback: >
          C'est le critère utilitariste (juger par les conséquences produites
          en termes de bonheur), pas le critère kantien. L'impératif
          catégorique ne demande jamais quel résultat l'action va produire.
      - id: B
        text: "Si la maxime de l'action peut être voulue comme loi valable pour tous, sans se détruire elle-même une fois généralisée."
        correct: true
      - id: C
        text: "Si l'action est conforme aux lois en vigueur dans le pays où elle est accomplie, quel que soit par ailleurs le contenu précis de ces lois."
        correct: false
        misconception: mc.philo.devoir.imperatif-categorique-confondu-heteronomie
        feedback: >
          L'impératif catégorique n'est pas un renvoi à la loi positive d'un
          État : c'est un test rationnel interne, que la raison de chacun
          applique elle-même, indépendamment de ce que dit ou non le droit
          d'un pays donné.
      - id: D
        text: "Si l'action correspond à ce que l'on désire le plus profondément à cet instant."
        correct: false
        misconception: mc.philo.devoir.devoir-confondu-avec-inclination
        feedback: >
          C'est exactement l'inverse de ce que demande l'impératif
          catégorique : Kant écarte précisément les inclinations et les
          désirs du critère moral, parce qu'ils varient d'une personne et
          d'un moment à l'autre, alors que le test porte sur ce qui peut
          valoir pour tous, sans exception.
    correct_feedback: >
      L'impératif catégorique demande de formuler la règle générale (la
      maxime) que suivrait l'action, puis de vérifier qu'on pourrait vouloir
      cette règle universalisée, valable pour tout le monde, sans qu'elle se
      détruise elle-même une fois généralisée — comme une règle qui autorise
      à tricher dès qu'on n'est pas vu, qui viderait tout examen de son sens.
    solution: |
      **Le principe :** avant d'agir, formule la maxime — la règle générale
      que ton action suivrait.

      **Le test :** pourrais-tu vouloir que TOUT LE MONDE, dans une situation
      semblable, suive cette même règle ?

      **Le critère de rejet :** si la règle généralisée se détruit
      elle-même (un examen où tout le monde triche en secret n'évalue plus
      rien), l'action est interdite — pas parce qu'une loi extérieure le dit,
      mais parce que la maxime échoue le test de cohérence rationnelle.

      **Ce que le test n'est PAS :** ni un calcul de conséquences
      (utilitarisme), ni un renvoi à la loi civile, ni une question de désir
      personnel.

  - id: DEV-3
    rung: "R3"
    difficulty_level: 3
    skill_code: philo_devoir
    tags: [distinction_auteurs, kant, utilitarisme, formalisme]
    stem: >
      En quoi consiste, précisément, la critique utilitariste adressée au
      formalisme kantien ?
    type: mcq
    choices:
      - id: A
        text: "Elle reproche à Kant de croire que le devoir n'existe pas du tout."
        correct: false
        misconception: mc.philo.devoir.critique-utilitariste-mal-identifiee
        feedback: >
          L'utilitarisme ne nie pas qu'il existe des obligations morales : il
          propose un AUTRE critère pour juger si une action est bonne (ses
          conséquences), sans nier l'idée même de devoir ou d'obligation.
      - id: B
        text: "Elle reproche à Kant de juger l'action sur la seule forme de sa maxime, sans égard pour ses conséquences réelles — ce qui peut conduire à des résultats manifestement contestables."
        correct: true
      - id: C
        text: "Elle reproche à Kant de fonder la morale sur le sentiment plutôt que sur la raison."
        correct: false
        misconception: mc.philo.devoir.critique-utilitariste-mal-identifiee
        feedback: >
          C'est presque l'inverse : Kant est reproché pour son excès de
          formalisme rationnel, pas pour un excès de sentiment. Fonder la
          morale sur un élan ou un sentiment plutôt que sur l'obligation
          rationnelle est plus proche de la position de Bergson que de la
          critique utilitariste.
      - id: D
        text: "Elle reproche à Kant de considérer que seules les conséquences comptent, jamais l'intention, une lecture qui inverserait entièrement, selon cette critique mal informée, la position réellement défendue par Kant lui-même."
        correct: false
        misconception: mc.philo.devoir.critique-utilitariste-mal-identifiee
        feedback: >
          C'est le contraire de la position de Kant, et donc pas ce que
          l'utilitarisme lui reproche : Kant fait justement dépendre la
          valeur morale du seul motif (l'intention), jamais des
          conséquences — c'est précisément ce choix que l'utilitarisme
          conteste.
    correct_feedback: >
      L'utilitarisme juge une action à ses conséquences réelles (le bonheur
      ou la souffrance qu'elle produit), et non à la seule cohérence formelle
      de sa maxime. Il souligne qu'un devoir appliqué sans égard pour ses
      conséquences peut aboutir à des situations que presque personne
      n'accepterait — comme l'exemple, discuté par Kant lui-même, du refus de
      mentir même à un meurtrier cherchant sa victime.
    solution: |
      **Le principe kantien contesté :** la valeur morale d'une action ne
      dépend que de son motif (la maxime peut-elle être universalisée ?),
      jamais de ses conséquences.

      **La faille pointée par l'utilitarisme :** un devoir appliqué à la
      lettre, sans aucun égard pour ce qu'il produit, peut conduire à des
      conclusions que presque personne ne juge acceptables (ne jamais mentir,
      même pour protéger un innocent).

      **La position utilitariste :** juger l'action à son résultat réel — le
      bonheur ou la souffrance qu'elle produit pour les personnes concernées
      — évite ce genre d'impasse.

      **Ce que la critique ne dit PAS :** elle ne nie pas l'existence du
      devoir ; elle conteste le critère (la forme plutôt que le résultat) que
      Kant propose pour le reconnaître.

  - id: DEV-4
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_devoir
    tags: [distinction_auteurs, bergson, kant, morale_close_ouverte]
    stem: >
      Chez Bergson, que distingue la "morale close" de la "morale ouverte" ?
    type: mcq
    choices:
      - id: A
        text: "La morale close vient d'une pression sociale intériorisée (l'obligation, l'habitude) ; la morale ouverte procède d'un élan qui dépasse l'obligation reçue, tourné vers l'humanité tout entière."
        correct: true
      - id: B
        text: "La morale close concerne les devoirs envers autrui ; la morale ouverte concerne uniquement les devoirs envers soi-même."
        correct: false
        misconception: mc.philo.devoir.morale-close-ouverte-mal-comprise
        feedback: >
          Ce n'est pas la distinction de Bergson : elle ne sépare pas les
          devoirs par leur destinataire (soi / autrui), mais par leur SOURCE
          psychologique — une pression sociale reçue, ou un élan qui la
          dépasse.
      - id: C
        text: "La morale close est celle de Kant, jugée fausse par Bergson ; la morale ouverte est la seule morale valable, qui doit désormais remplacer entièrement l'obligation reçue dans toute réflexion morale sérieuse."
        correct: false
        misconception: mc.philo.devoir.morale-close-ouverte-mal-comprise
        feedback: >
          C'est une caricature de Bergson. Il ne juge pas la morale de
          l'obligation fausse ou à remplacer : elle reste, pour lui, le socle
          nécessaire de la vie sociale. Son geste est d'ajouter une seconde
          source à la morale, pas d'invalider la première.
      - id: D
        text: "La morale close juge les actions à leurs conséquences ; la morale ouverte les juge à la pureté de l'intention, comme chez Kant."
        correct: false
        misconception: mc.philo.devoir.critique-utilitariste-mal-identifiee
        feedback: >
          Cette opposition (conséquences / intention) est celle qui sépare
          l'utilitarisme du kantisme — pas la distinction propre à Bergson,
          qui porte sur l'ORIGINE psychologique et sociale du devoir
          (pression reçue, ou élan qui la dépasse), pas sur le critère de
          jugement de l'action.
    correct_feedback: >
      La morale close est celle de l'obligation ordinaire, issue de la
      pression du groupe social intériorisée en habitude ; elle assure la
      cohésion d'un groupe fermé sur lui-même. La morale ouverte procède d'un
      appel et d'un élan — lié par Bergson à l'élan vital — qui pousse
      certaines figures exceptionnelles à dépasser l'obligation reçue au nom
      de l'humanité tout entière, sans qu'aucune règle ne le leur impose.
    solution: |
      **Morale close :** obligation issue de la pression sociale
      intériorisée (habitude, éducation) ; assure la cohésion d'un groupe
      fermé sur lui-même.

      **Morale ouverte :** ne procède pas d'une obligation reçue mais d'un
      élan — un appel qui pousse certaines figures exceptionnelles à agir
      pour l'humanité entière, au-delà de toute règle imposée.

      **Ce que Bergson ne dit PAS :** que la morale close serait fausse ou
      à rejeter. Elle reste nécessaire à la vie sociale ; la morale ouverte
      la complète et la dépasse, elle ne l'annule pas.

      **Le lien avec le devoir kantien :** la morale close se rapproche de
      l'obligation kantienne (une exigence qu'on respecte) ; la morale
      ouverte montre que le seul vocabulaire du devoir ne suffit pas à
      décrire toute la vie morale — certains des actes moraux les plus
      admirables viennent d'un élan, pas d'un devoir accompli.

  - id: DEV-5
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_devoir
    tags: [accroche, contrainte_devoir_obligation]
    stem: >
      Dans la situation du surveillant qui sort de la salle, que révèle le
      fait que beaucoup d'élèves ne trichent pas, alors même que le risque
      d'être vu vient de disparaître ?
    type: mcq
    choices:
      - id: A
        text: "Que la contrainte extérieure n'a en réalité jamais disparu : ces élèves craignent d'être dénoncés par un camarade présent dans la salle, ce qui revient encore, au fond, à redouter une sanction extérieure bien réelle."
        correct: false
        misconception: mc.philo.devoir.faux-dilemme-contrainte-devoir-moral
        feedback: >
          Le texte isole précisément le cas où le risque objectif tombe à
          zéro. Ajouter une contrainte imaginaire pour sauver l'explication
          par la seule peur de la sanction esquive la question posée.
      - id: B
        text: "Que quelque chose continue de les retenir alors qu'aucune contrainte extérieure ne pèse plus — ce qui pose la question d'un devoir distinct de la simple peur d'être puni."
        correct: true
      - id: C
        text: "Que ces élèves trichent aussi, en réalité, mais de façon plus discrète et plus habile, précisément pour ne jamais se faire remarquer ni par le surveillant ni par leurs camarades."
        correct: false
        misconception: mc.philo.devoir.faux-dilemme-contrainte-devoir-moral
        feedback: >
          C'est l'inverse de ce que rapporte le texte : « beaucoup d'élèves
          ... ne regardent pas quand même ». Renverser ce constat esquive la
          question plutôt que d'y répondre.
      - id: D
        text: "Que la question de la triche est entièrement réglée dès que le surveillant quitte la salle : sans le moindre risque objectif d'être vu, il ne peut plus exister aucune faute véritable."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          C'est justement la conclusion que le texte met en doute : si
          l'obéissance ne tenait qu'à la surveillance, rien ne devrait plus
          retenir un élève une fois le risque nul — or c'est ce qui n'arrive
          pas pour beaucoup d'entre eux.
    correct_feedback: >
      La retenue qui persiste sans surveillant suggère qu'elle ne se réduit
      pas à la peur d'une sanction externe — sans prouver, à ce stade, qu'il
      s'agit d'un devoir moral authentique. C'est cette tension que la leçon
      va instruire.
    solution: |
      **Le constat du texte :** beaucoup d'élèves ne regardent pas la copie
      même quand le risque d'être vu est nul.
      **Ce que cela met en doute :** l'idée que l'obéissance ne tiendrait
      qu'à la surveillance.
      **Ce que cela ne prouve pas encore :** qu'il s'agisse d'un devoir moral
      authentique plutôt que d'une contrainte intériorisée plus discrète.
      **Le rôle de l'accroche :** ouvrir le problème, pas le trancher.

  - id: DEV-6
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_devoir
    tags: [accroche, contrainte_devoir_obligation]
    stem: >
      La seconde réponse envisagée dans l'accroche (« je ne regarde pas...
      même si personne ne le saurait jamais ») laisse, selon le texte, une
      question ouverte. Laquelle ?
    type: mcq
    choices:
      - id: A
        text: "Ce « non » qui persiste sans surveillant peut lui-même n'être qu'une forme discrète et intériorisée de contrainte (un jugement diffus, sa propre conscience) : rien ne garantit encore qu'il s'agisse d'un devoir moral véritable."
        correct: true
      - id: B
        text: "Cette réponse prouve définitivement qu'il existe un devoir moral, indépendant de toute contrainte, et clôt la question."
        correct: false
        misconception: mc.philo.devoir.sentiment-suffit-a-garantir-devoir-authentique
        feedback: >
          C'est l'inverse de ce que fait le texte : il précise qu'affirmer
          cela sans l'interroger « laisse une question ouverte et gênante »
          — la réponse relance le problème, elle ne le clôt pas.
      - id: C
        text: "Cette réponse est purement subjective, donc elle n'a aucune valeur philosophique et peut être écartée."
        correct: false
        misconception: mc.philo.devoir.faux-dilemme-contrainte-devoir-moral
        feedback: >
          Le texte ne rejette pas cette réponse : il la prend au sérieux et
          l'interroge, sans la disqualifier d'emblée.
      - id: D
        text: "Cette réponse revient, au fond et malgré les apparences, exactement au même que la première réponse envisagée plus haut : dans les deux cas, ce qui parle n'est jamais rien d'autre qu'une seule et même peur d'être un jour jugé par quelqu'un, fût-ce par soi-même en silence."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          Le texte distingue d'abord nettement les deux réponses (contrainte
          externe vs devoir indépendant du regard) ; ce n'est qu'ensuite
          qu'il se demande si la seconde ne cacherait pas, elle aussi, une
          contrainte — sans les déclarer identiques d'emblée.
    correct_feedback: >
      Affirmer un devoir moral pur sans l'interroger laisse ouverte une
      question gênante : comment le distinguer d'une habitude de conscience
      intériorisée, une peur diffuse qu'on ne reconnaîtrait plus comme telle ?
    solution: |
      **La réponse en jeu :** « ce serait mal même si personne ne le savait
      jamais ».
      **Ce que le texte objecte :** ce « non » pourrait être une peur
      intériorisée, donc une contrainte discrète plutôt qu'un devoir
      authentique.
      **Ce que cela n'est pas :** une réfutation — une question qui reste
      ouverte.

  - id: DEV-7
    rung: "R0"
    difficulty_level: 1
    skill_code: philo_devoir
    tags: [accroche, probleme_philosophique]
    stem: >
      Quel problème précis l'accroche annonce-t-elle que la leçon va
      « construire, pièce par pièce » ?
    type: mcq
    choices:
      - id: A
        text: "Montrer que le devoir n'est, en dernière analyse et une fois tout examiné, qu'une convention sociale parmi d'autres, sans aucun fondement rationnel qui lui soit propre."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          Le texte n'annonce aucune conclusion de ce genre : il pose une
          question à instruire, il ne préjuge pas d'une réponse relativiste.
      - id: B
        text: "Démontrer que la surveillance reste, en pratique, indispensable pour garantir un comportement moral."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          C'est le contraire de ce que suggère l'accroche : la retenue qui
          persiste sans surveillant met justement en doute l'idée que la
          surveillance serait la seule garantie du comportement moral.
      - id: C
        text: "Penser un devoir qui ne se réduise ni à la peur d'une sanction externe, ni à une habitude de conscience intériorisée jamais examinée."
        correct: true
      - id: D
        text: "Établir laquelle des deux réponses données par les élèves est la bonne, et rejeter l'autre comme une erreur."
        correct: false
        misconception: mc.philo.devoir.faux-dilemme-contrainte-devoir-moral
        feedback: >
          Le texte présente les deux réponses comme insuffisantes chacune
          prise seule, et non comme un choix entre une bonne et une mauvaise
          réponse à trancher.
    correct_feedback: >
      Le problème annoncé n'est ni de choisir entre les deux réponses
      initiales, ni de trancher pour l'une contre l'autre, mais de penser un
      devoir distinct à la fois de la contrainte externe et de l'habitude de
      conscience non examinée.
    solution: |
      **Ce que l'accroche NE fait PAS :** trancher entre les deux réponses
      données.
      **Ce qu'elle annonce :** un devoir à penser sans le réduire ni à la
      peur d'une sanction, ni à une habitude intériorisée non questionnée.
      **Pourquoi ce n'est pas un choix binaire :** chacune des deux réponses,
      seule, laisse une difficulté non résolue.

  - id: DEV-8
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_devoir
    tags: [distinction_devoir_obligation_contrainte]
    stem: >
      Selon la distinction établie au chapitre 2, qu'est-ce qui caractérise le devoir
      compris comme obligation MORALE, à la différence du devoir compris
      comme contrainte extérieure ?
    type: mcq
    choices:
      - id: A
        text: "Il ne dépend pas de la présence d'un surveillant, d'une sanction possible ou d'un regard extérieur : il vaudrait exactement autant seul, sans témoin."
        correct: true
      - id: B
        text: "Il se mesure à l'intensité de la surveillance : plus le risque d'être vu est élevé, plus il pèse."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          C'est exactement la définition du devoir comme CONTRAINTE
          extérieure, pas comme obligation morale — celle-ci ne dépend
          justement pas du niveau de surveillance.
      - id: C
        text: "Il n'existe que s'il est inscrit noir sur blanc dans une loi ou un règlement précis, faute de quoi il ne s'agirait jamais que d'une simple préférence personnelle sans portée obligatoire réelle."
        correct: false
        misconception: mc.philo.devoir.legalite-confondue-moralite
        feedback: >
          Le texte donne l'exemple inverse : rendre visite à un ami malade
          peut être un devoir moral sans qu'aucune loi ne l'exige. Confondre
          obligation morale et inscription légale efface la distinction.
      - id: D
        text: "Il disparaît dès qu'aucune autorité extérieure n'est plus en mesure de sanctionner sa violation."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          C'est de nouveau la définition de la contrainte extérieure :
          l'obligation morale, par définition, ne dépend d'aucune sanction
          possible pour valoir.
    correct_feedback: >
      Le devoir comme obligation morale ne se mesure ni à la surveillance ni
      à la sanction possible : il vaut indépendamment de tout regard
      extérieur, à la différence de la contrainte, qui s'affaiblit ou
      disparaît avec le risque d'être vu.
    solution: |
      **Contrainte extérieure :** dépend de la surveillance et de la
      sanction ; disparaît avec elles.
      **Obligation morale :** indépendante de tout regard extérieur ;
      vaudrait autant seul.
      **L'erreur à éviter :** confondre absence de loi et absence de devoir
      moral, ou présence de loi et présence de moralité.

  - id: DEV-9
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_devoir
    tags: [legalite_moralite]
    stem: >
      Payer ses impôts uniquement pour éviter un redressement fiscal :
      comment qualifier cette action au regard de la distinction légalité /
      moralité établie au chapitre 2 ?
    type: mcq
    choices:
      - id: A
        text: "Une action immorale, puisqu'elle est motivée uniquement par la peur d'une sanction fiscale plutôt que par une conviction personnelle sincère et réfléchie."
        correct: false
        misconception: mc.philo.devoir.absence-valeur-morale-confondue-immoralite
        feedback: >
          Le texte est explicite : cette action « est parfaitement légale,
          mais ne révèle, en soi, aucune vertu » — ce n'est pas la même chose
          qu'être immorale. L'absence de valeur morale n'est pas une faute.
      - id: B
        text: "Une action légale, mais qui ne révèle en soi aucune valeur morale, puisque le motif est la crainte d'une sanction et non une conviction personnelle."
        correct: true
      - id: C
        text: "Une action légale ET pleinement morale, puisqu'elle profite en définitive à la collectivité tout entière, quel qu'ait pu être le motif réel de la personne qui l'accomplit."
        correct: false
        misconception: mc.philo.devoir.critere-consequentialiste-substitue-au-motif
        feedback: >
          Juger la moralité d'une action à son bénéfice collectif final est
          un critère de conséquence : la distinction légalité/moralité porte
          sur le MOTIF de l'action, pas sur son effet social.
      - id: D
        text: "Une action qui n'est en réalité ni légale ni morale, car agir uniquement par peur ne peut, selon cette lecture, jamais être qualifié de véritablement conforme à la loi."
        correct: false
        misconception: mc.philo.devoir.legalite-confondue-moralite
        feedback: >
          La légalité ne porte que sur la conformité de l'action à la règle,
          quel qu'en soit le motif : payer par peur reste parfaitement
          légal, même sans valeur morale.
    correct_feedback: >
      L'action est légale (conforme à ce que la règle exige) sans être
      morale (le motif est la crainte, pas une conviction) — le même écart
      que Kant fera jouer avec le commerçant honnête.
    solution: |
      **Légalité :** conformité de l'action à une règle extérieure, quel
      qu'en soit le motif.
      **Moralité :** motif proprement moral, indépendant de la contrainte ou
      de l'intérêt.
      **Ici :** l'impôt payé par peur est légal, sans être moral — ce n'est
      pas pour autant immoral.

  - id: DEV-10
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_devoir
    tags: [distinction_devoir_obligation_contrainte, legalite_moralite]
    stem: >
      Pourquoi le texte du chapitre 2 refuse-t-il de réduire le devoir soit à la
