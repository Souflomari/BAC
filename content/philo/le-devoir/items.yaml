  - id: DEV-11
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_devoir
    tags: [kant, autonomie_heteronomie, imperatif_categorique]
    stem: >
      Selon Kant, la loi morale que teste l'impératif catégorique est-elle
      imposée à la raison depuis l'extérieur, ou bien la raison se la
      donne-t-elle à elle-même ?
    type: mcq
    choices:
      - id: A
        text: "Elle est imposée par une autorité extérieure à la raison — Dieu, la société, l'État — à laquelle il faut obéir sans la questionner."
        correct: false
        misconception: mc.philo.devoir.imperatif-categorique-confondu-heteronomie
        feedback: >
          C'est précisément l'erreur à éviter : Kant appelle cela
          l'hétéronomie (obéir à une loi reçue du dehors), l'inverse de sa
          position — la raison ne reçoit pas la loi morale, elle se la donne.
      - id: B
        text: "La raison se donne à elle-même sa propre loi, en testant la cohérence de ses propres maximes : Kant appelle cela l'autonomie."
        correct: true
      - id: C
        text: "Elle vient des inclinations et des désirs de chacun, que la raison se contente ensuite de mettre en forme."
        correct: false
        misconception: mc.philo.devoir.devoir-confondu-avec-inclination
        feedback: >
          C'est l'inverse de la position kantienne : l'impératif catégorique
          écarte précisément les inclinations et désirs du critère moral,
          parce qu'ils varient d'une personne à l'autre.
      - id: D
        text: "Elle n'a, chez Kant, aucun fondement réel dans la raison : ce n'est qu'un test formel arbitraire, sans autre justification."
        correct: false
        misconception: mc.philo.devoir.imperatif-categorique-juge-arbitraire
        feedback: >
          Le texte affirme au contraire que c'est « ma propre raison » qui
          se donne cette loi en testant elle-même la cohérence de ses
          maximes — le test n'est pas arbitraire.
    correct_feedback: >
      Kant appelle autonomie le fait que la raison se donne à elle-même sa
      propre loi, par opposition à l'hétéronomie (obéir à une loi reçue du
      dehors). Le devoir kantien n'est donc pas l'obéissance à une contrainte
      extérieure : il est, à ses yeux, la plus haute expression de la
      liberté.
    solution: |
      **Autonomie :** la raison se donne à elle-même sa propre loi, en
      testant ses maximes.
      **Hétéronomie :** obéir à une loi reçue du dehors (autorité, peur,
      désirs).
      **L'erreur classique :** confondre l'impératif catégorique avec une
      obéissance aveugle — c'est l'inverse pour Kant.

  - id: DEV-12
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_devoir
    tags: [kant, devoir_liberte]
    stem: >
      Que signifie, dans la fermeture de l'arc proposée en R3, la formule
      kantienne résumée par « tu dois, donc tu peux » ?
    type: mcq
    choices:
      - id: A
        text: "On ne peut être tenu à un devoir que si l'on est réellement capable de l'accomplir ; si aucun moyen d'agir autrement n'existait, la question du devoir perdrait son sens — le devoir présuppose donc la liberté."
        correct: true
      - id: B
        text: "Elle signifie que tout ce dont on est capable devient, de ce seul fait, un devoir à accomplir."
        correct: false
        misconception: mc.philo.devoir.devoir-liberte-mal-articules
        feedback: >
          C'est l'inverse de l'implication posée : « tu dois, donc tu peux »
          part du devoir pour affirmer la capacité, pas l'inverse. Être
          capable de faire quelque chose n'en fait jamais une obligation.
      - id: C
        text: "Elle signifie que le devoir s'oppose à la liberté : plus on a de devoirs à accomplir, moins on est libre."
        correct: false
        misconception: mc.philo.devoir.devoir-liberte-mal-articules
        feedback: >
          C'est exactement la thèse inverse de celle défendue par le texte :
          « le devoir ne s'oppose donc pas à la liberté : il la présuppose
          absolument ».
      - id: D
        text: "Elle signifie que la liberté ne concerne en réalité que le choix entre plusieurs devoirs éventuellement contradictoires entre eux, et jamais le choix plus fondamental entre agir par devoir ou ne pas agir par devoir du tout."
        correct: false
        misconception: mc.philo.devoir.devoir-liberte-mal-articules
        feedback: >
          Le texte porte sur la possibilité même d'agir autrement, pas
          seulement sur un choix entre devoirs concurrents.
    correct_feedback: >
      Le devoir ne s'oppose pas à la liberté : il la présuppose. On ne peut
      être tenu à ce qu'on est radicalement incapable de faire — et se
      sentir obligé sans contrainte extérieure révèle, pour Kant, qu'on est
      capable de faire autrement.
    solution: |
      **La formule :** on n'est tenu à un devoir que si l'on peut réellement
      l'accomplir.
      **Ce qu'elle implique :** le devoir présuppose la liberté, il ne la
      nie pas.
      **L'erreur à éviter :** croire que devoir et liberté s'opposent, ou
      inverser l'implication (capacité → devoir).

  - id: DEV-13
    rung: "R4"
    difficulty_level: 5
    skill_code: philo_devoir
    tags: [methode_dissertation, analyse_sujet]
    stem: >
      Le sujet « Suffit-il d'agir par devoir pour bien agir ? » pose une
      question de suffisance. Qu'est-ce que cela implique pour l'analyse des
      termes ?
    type: mcq
    choices:
      - id: A
        text: "Il ne s'agit pas de savoir si agir par devoir est une manière de bien agir — cela n'est pas mis en doute — mais si c'est la seule condition nécessaire, sans qu'il faille y ajouter autre chose."
        correct: true
      - id: B
        text: "Il s'agit de se demander si le devoir existe réellement, ou s'il n'est qu'une illusion sans fondement."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est confondre une question de suffisance avec une question
          d'existence. Le sujet ne met pas en doute que le devoir existe : il
          demande si agir par devoir suffit.
      - id: C
        text: "Il s'agit de choisir définitivement entre la morale kantienne et la morale utilitariste, comme s'il fallait nécessairement n'en retenir qu'une seule pour pouvoir répondre correctement à la question posée."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Réduire le sujet à un choix exclusif entre deux auteurs efface la
          question de suffisance : la démarche attendue articule les apports
          de chaque position dans un plan dialectique.
      - id: D
        text: "Il s'agit uniquement de définir ce que Kant entend par « bonne volonté », sans autre exigence d'analyse."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Restituer une seule définition ne répond pas à la question posée
          par « suffit-il », qui exige d'examiner si ce critère doit être
          complété.
    correct_feedback: >
      « Suffit-il » interroge la suffisance d'une condition déjà reconnue
      comme nécessaire, non son existence : le sujet ne demande pas si agir
      par devoir compte parmi les façons de bien agir, mais si cela épuise
      entièrement ce que bien agir exige.
    solution: |
      **Suffisance, pas existence :** le sujet ne doute pas qu'agir par
      devoir soit une façon de bien agir.
      **Ce qui est en jeu :** est-ce la SEULE condition nécessaire ?
      **L'erreur à éviter :** traiter le sujet comme un choix entre auteurs,
      ou comme une simple définition.

  - id: DEV-14
    rung: "R4"
    difficulty_level: 5
    skill_code: philo_devoir
    tags: [methode_dissertation, problematique]
    stem: >
      Laquelle de ces formulations constitue une véritable problématique
      pour le sujet « Suffit-il d'agir par devoir pour bien agir ? », plutôt
      qu'une reformulation ou une simple prise de position ?
    type: mcq
    choices:
      - id: A
        text: "Est-ce qu'il suffit, dans tous les cas, d'agir par devoir pour bien agir, comme le sujet le demande ?"
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est une reformulation quasi identique du sujet : elle ne fait
          apparaître aucune tension entre deux positions légitimes, elle
          répète la question posée.
      - id: B
        text: "Le devoir kantien fait de la bonne volonté le seul bien inconditionnel ; mais refuser de mentir même pour sauver un innocent semble parfois négliger ce qui compte moralement : faut-il, en plus du devoir, autre chose pour bien agir ?"
        correct: true
      - id: C
        text: "Le devoir kantien est la seule source valable de la moralité, et toute autre considération — conséquences, sentiments, circonstances, ou jugement d'autrui — doit lui être strictement subordonnée, en toutes circonstances et sans aucune exception admise."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est une thèse affirmée, pas une problématique : elle tranche
          d'emblée au lieu de faire apparaître la tension entre deux
          positions également légitimes en apparence.
      - id: D
        text: "Kant a-t-il vécu à la même époque que Bergson, et cela suffit-il à expliquer pourquoi leurs conceptions respectives du devoir en viennent à autant diverger ?"
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          C'est une question biographique, sans rapport avec la tension
          conceptuelle que la problématique doit construire à partir des
          positions elles-mêmes.
    correct_feedback: >
      Une problématique met en tension deux positions légitimes en
      apparence — ici, la force du critère kantien et les cas où il semble
      manifestement insuffisant — plutôt que de répéter le sujet ou de
      trancher d'emblée en faveur d'un camp.
    solution: |
      **Ce qu'une problématique fait :** elle met en tension deux positions
      légitimes.
      **Ce qu'elle n'est PAS :** une reformulation du sujet, ni une thèse
      déjà tranchée, ni une question hors-sujet.
      **Ici :** la force du critère kantien contre les cas où il semble
      insuffisant.

  - id: DEV-15
    rung: "R4"
    difficulty_level: 5
    skill_code: philo_devoir
    tags: [methode_dissertation, plan_dialectique]
    stem: >
      Dans un plan dialectique thèse / antithèse / dépassement sur ce sujet,
      que doit faire la partie III (le dépassement) pour éviter l'erreur la
      plus fréquente à ce stade ?
    type: mcq
    choices:
      - id: A
        text: "Articuler ce que la thèse et l'antithèse apportent chacune (l'exigence universelle du devoir, l'attention aux conséquences et à l'élan), plutôt que de juxtaposer les deux ou de trancher simplement en faveur de l'une."
        correct: true
      - id: B
        text: "Résumer une dernière fois la thèse kantienne, pour montrer qu'elle était en réalité la bonne réponse depuis le départ."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Un dépassement qui redonne simplement raison à la thèse n'en est
          pas un : il faut intégrer ce que l'antithèse a mis en évidence, pas
          l'effacer.
      - id: C
        text: "Constater que la thèse et l'antithèse se contredisent, et laisser cette contradiction ouverte sans chercher à l'articuler."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Constater une contradiction n'est pas la dépasser : le dépassement
          doit construire une position qui intègre ce que chaque partie a
          montré de vrai.
      - id: D
        text: "Introduire dans cette dernière partie un auteur entièrement nouveau, jamais mobilisé dans les parties précédentes du devoir, dans le seul but d'apporter un éclairage extérieur inédit et impressionnant, quitte à laisser sans réponse la tension pourtant construite avec soin dans les deux parties précédentes."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Le dépassement se construit à partir de ce que la thèse et
          l'antithèse ont déjà établi, pas par l'ajout d'un matériau
          totalement nouveau.
    correct_feedback: >
      Le dépassement reprend ce que chaque partie a établi — l'exigence
      universelle du devoir d'un côté, l'attention aux conséquences et à
      l'élan de l'autre — pour construire une position qui les articule, sur
      le fond de la liberté que tout le dispositif présuppose.
    solution: |
      **Erreur fréquente :** faire gagner la thèse, juxtaposer sans
      articuler, ou importer un élément hors-sujet.
      **Ce qu'il faut faire :** intégrer ce que la thèse et l'antithèse ont
      chacune montré de vrai.
      **Le fil à ne pas perdre :** s'appuyer sur ce qui a déjà été construit
      dans les parties I et II.

