        correct: true
      - id: B
        text: "Parce que la contrainte extérieure n'existerait en réalité jamais : seule la conscience morale individuelle de chacun serait, dans cette optique, véritablement réelle et digne d'être prise au sérieux par un philosophe rigoureux."
        correct: false
        misconception: mc.philo.devoir.sentiment-suffit-a-garantir-devoir-authentique
        feedback: >
          C'est justement l'une des deux réductions que le texte refuse
          d'adopter telle quelle — il ne nie pas la contrainte extérieure, il
          refuse seulement de tout y réduire.
      - id: C
        text: "Parce que le sentiment intérieur d'être obligé suffit toujours, à lui seul et en toute circonstance, à garantir qu'on tient bel et bien un devoir moral authentique, quelle que soit son origine réelle."
        correct: false
        misconception: mc.philo.devoir.sentiment-suffit-a-garantir-devoir-authentique
        feedback: >
          C'est exactement la position que le texte met en doute : « le
          simple sentiment intérieur d'être obligé ne suffit donc pas, à lui
          seul, à garantir qu'on tient un devoir moral véritable ».
      - id: D
        text: "Parce qu'aucune des deux positions ne correspond à la définition juridique exacte du mot « devoir »."
        correct: false
        misconception: mc.philo.devoir.legalite-confondue-moralite
        feedback: >
          Le texte ne tranche pas par un renvoi au droit : chaque réduction,
          prise seule, laisse une difficulté philosophique non résolue.
    correct_feedback: >
      Les deux réductions échouent chacune à sa manière : l'une n'explique
      pas ce qui résiste sans surveillance, l'autre ne peut distinguer un
      devoir authentique d'une habitude intériorisée jamais questionnée.
      C'est cette tension, non tranchée, qui constitue le problème du
      devoir.
    solution: |
      **Réduire à la contrainte :** n'explique pas ce qui persiste une fois
      le risque nul.
      **Affirmer un devoir pur sans l'interroger :** ne distingue pas devoir
      authentique et conditionnement social.
      **Conclusion du texte :** aucune des deux réponses seule ne suffit —
      la tension elle-même est le problème.

  - id: DEV-11
    rung: "R2"
    difficulty_level: 3
    skill_code: philo_devoir
    tags: [kant, autonomie_heteronomie, imperatif_categorique]
    stem: >
      Selon Kant, la loi morale que teste l'impératif catégorique est-elle
      imposée à la raison depuis l'extérieur, ou bien la raison se la
      donne-t-elle à elle-même ?
    type: mcq
    choices:
      - id: A
        text: "Elle est imposée par une autorité extérieure à la raison — Dieu, la société, l'État — à laquelle il faut obéir sans la questionner."
        correct: false
        misconception: mc.philo.devoir.imperatif-categorique-confondu-heteronomie
        feedback: >
          C'est précisément l'erreur à éviter : Kant appelle cela
          l'hétéronomie (obéir à une loi reçue du dehors), l'inverse de sa
          position — la raison ne reçoit pas la loi morale, elle se la donne.
      - id: B
        text: "La raison se donne à elle-même sa propre loi, en testant la cohérence de ses propres maximes : Kant appelle cela l'autonomie."
        correct: true
      - id: C
        text: "Elle vient des inclinations et des désirs de chacun, que la raison se contente ensuite de mettre en forme."
        correct: false
        misconception: mc.philo.devoir.devoir-confondu-avec-inclination
        feedback: >
          C'est l'inverse de la position kantienne : l'impératif catégorique
          écarte précisément les inclinations et désirs du critère moral,
          parce qu'ils varient d'une personne à l'autre.
      - id: D
        text: "Elle n'a, chez Kant, aucun fondement réel dans la raison : ce n'est qu'un test formel arbitraire, sans autre justification."
        correct: false
        misconception: mc.philo.devoir.imperatif-categorique-juge-arbitraire
        feedback: >
          Le texte affirme au contraire que c'est « ma propre raison » qui
          se donne cette loi en testant elle-même la cohérence de ses
          maximes — le test n'est pas arbitraire.
    correct_feedback: >
      Kant appelle autonomie le fait que la raison se donne à elle-même sa
      propre loi, par opposition à l'hétéronomie (obéir à une loi reçue du
      dehors). Le devoir kantien n'est donc pas l'obéissance à une contrainte
      extérieure : il est, à ses yeux, la plus haute expression de la
      liberté.
    solution: |
      **Autonomie :** la raison se donne à elle-même sa propre loi, en
      testant ses maximes.
      **Hétéronomie :** obéir à une loi reçue du dehors (autorité, peur,
      désirs).
      **L'erreur classique :** confondre l'impératif catégorique avec une
      obéissance aveugle — c'est l'inverse pour Kant.

  - id: DEV-12
    rung: "R3"
    difficulty_level: 4
    skill_code: philo_devoir
    tags: [kant, devoir_liberte]
    stem: >
      Que signifie, dans la fermeture de l'arc proposée au chapitre 4, la formule
