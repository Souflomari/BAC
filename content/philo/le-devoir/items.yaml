    type: mcq
    choices:
      - id: A
        text: "On ne peut être tenu à un devoir que si l'on est réellement capable de l'accomplir ; si aucun moyen d'agir autrement n'existait, la question du devoir perdrait son sens — le devoir présuppose donc la liberté."
        correct: true
      - id: B
        text: "Elle signifie que tout ce dont on est capable devient, de ce seul fait, un devoir à accomplir."
        correct: false
        misconception: mc.philo.devoir.devoir-liberte-mal-articules
        feedback: >
          C'est l'inverse de l'implication posée : « tu dois, donc tu peux »
          part du devoir pour affirmer la capacité, pas l'inverse. Être
          capable de faire quelque chose n'en fait jamais une obligation.
      - id: C
        text: "Elle signifie que le devoir s'oppose à la liberté : plus on a de devoirs à accomplir, moins on est libre."
        correct: false
        misconception: mc.philo.devoir.devoir-liberte-mal-articules
        feedback: >
          C'est exactement la thèse inverse de celle défendue par le texte :
          « le devoir ne s'oppose donc pas à la liberté : il la présuppose
          absolument ».
      - id: D
        text: "Elle signifie que la liberté ne concerne en réalité que le choix entre plusieurs devoirs éventuellement contradictoires entre eux, et jamais le choix plus fondamental entre agir par devoir ou ne pas agir par devoir du tout."
        correct: false
        misconception: mc.philo.devoir.devoir-liberte-mal-articules
        feedback: >
          Le texte porte sur la possibilité même d'agir autrement, pas
          seulement sur un choix entre devoirs concurrents.
    correct_feedback: >
      Le devoir ne s'oppose pas à la liberté : il la présuppose. On ne peut
      être tenu à ce qu'on est radicalement incapable de faire — et se
      sentir obligé sans contrainte extérieure révèle, pour Kant, qu'on est
      capable de faire autrement.
    solution: |
      **La formule :** on n'est tenu à un devoir que si l'on peut réellement
      l'accomplir.
      **Ce qu'elle implique :** le devoir présuppose la liberté, il ne la
      nie pas.
      **L'erreur à éviter :** croire que devoir et liberté s'opposent, ou
      inverser l'implication (capacité → devoir).

  - id: DEV-13
