          demande si agir par devoir suffit.
      - id: C
        text: "Il s'agit de choisir définitivement entre la morale kantienne et la morale utilitariste, comme s'il fallait nécessairement n'en retenir qu'une seule pour pouvoir répondre correctement à la question posée."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Réduire le sujet à un choix exclusif entre deux auteurs efface la
          question de suffisance : la démarche attendue articule les apports
          de chaque position dans un plan dialectique.
      - id: D
        text: "Il s'agit uniquement de définir ce que Kant entend par « bonne volonté », sans autre exigence d'analyse."
        correct: false
        misconception: mc.philo.devoir.methode-dissertation-appliquee-mecaniquement
        feedback: >
          Restituer une seule définition ne répond pas à la question posée
          par « suffit-il », qui exige d'examiner si ce critère doit être
          complété.
    correct_feedback: >
      « Suffit-il » interroge la suffisance d'une condition déjà reconnue
      comme nécessaire, non son existence : le sujet ne demande pas si agir
      par devoir compte parmi les façons de bien agir, mais si cela épuise
      entièrement ce que bien agir exige.
    solution: |
      **Suffisance, pas existence :** le sujet ne doute pas qu'agir par
      devoir soit une façon de bien agir.
      **Ce qui est en jeu :** est-ce la SEULE condition nécessaire ?
      **L'erreur à éviter :** traiter le sujet comme un choix entre auteurs,
      ou comme une simple définition.

