  - id: DEV-8
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_devoir
    tags: [distinction_devoir_obligation_contrainte]
    stem: >
      Selon la distinction établie en R1, qu'est-ce qui caractérise le devoir
      compris comme obligation MORALE, à la différence du devoir compris
      comme contrainte extérieure ?
    type: mcq
    choices:
      - id: A
        text: "Il ne dépend pas de la présence d'un surveillant, d'une sanction possible ou d'un regard extérieur : il vaudrait exactement autant seul, sans témoin."
        correct: true
      - id: B
        text: "Il se mesure à l'intensité de la surveillance : plus le risque d'être vu est élevé, plus il pèse."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          C'est exactement la définition du devoir comme CONTRAINTE
          extérieure, pas comme obligation morale — celle-ci ne dépend
          justement pas du niveau de surveillance.
      - id: C
        text: "Il n'existe que s'il est inscrit noir sur blanc dans une loi ou un règlement précis, faute de quoi il ne s'agirait jamais que d'une simple préférence personnelle sans portée obligatoire réelle."
        correct: false
        misconception: mc.philo.devoir.legalite-confondue-moralite
        feedback: >
          Le texte donne l'exemple inverse : rendre visite à un ami malade
          peut être un devoir moral sans qu'aucune loi ne l'exige. Confondre
          obligation morale et inscription légale efface la distinction.
      - id: D
        text: "Il disparaît dès qu'aucune autorité extérieure n'est plus en mesure de sanctionner sa violation."
        correct: false
        misconception: mc.philo.devoir.devoir-reduit-a-la-contrainte
        feedback: >
          C'est de nouveau la définition de la contrainte extérieure :
          l'obligation morale, par définition, ne dépend d'aucune sanction
          possible pour valoir.
    correct_feedback: >
      Le devoir comme obligation morale ne se mesure ni à la surveillance ni
      à la sanction possible : il vaut indépendamment de tout regard
      extérieur, à la différence de la contrainte, qui s'affaiblit ou
      disparaît avec le risque d'être vu.
    solution: |
      **Contrainte extérieure :** dépend de la surveillance et de la
      sanction ; disparaît avec elles.
      **Obligation morale :** indépendante de tout regard extérieur ;
      vaudrait autant seul.
      **L'erreur à éviter :** confondre absence de loi et absence de devoir
      moral, ou présence de loi et présence de moralité.

  - id: DEV-9
    rung: "R1"
    difficulty_level: 2
    skill_code: philo_devoir
    tags: [legalite_moralite]
    stem: >
      Payer ses impôts uniquement pour éviter un redressement fiscal :
