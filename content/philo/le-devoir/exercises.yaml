        reasoning: |-
          L'objection utilitariste : celui qui tient sa promesse par
          affection et celui qui la tient par devoir seul, malgré
          l'indifférence, produisent le MÊME résultat concret — la promesse
          est honorée dans les deux cas. Un utilitariste, jugeant à l'effet
          produit, ne verrait aucune différence entre les deux. La réponse
          kantienne reste la même que pour le texte de r-bac : ce n'est pas
          ce qui est produit qui a une valeur morale, mais ce qui l'a
          produit — et seul le second cas isole le devoir comme cause
          unique de l'acte.

          Le lien avec « tu dois, donc tu peux » (chapitre 4) : si celui qui tient
          sa promesse à un ami devenu indifférent n'était pas réellement
          LIBRE de rompre cet engagement — s'il y était contraint par une
          pression sociale à laquelle il ne pouvait objectivement pas
          échapper — alors on ne pourrait plus parler d'un acte moralement
          significatif, seulement d'une contrainte subie. C'est seulement
          parce qu'il aurait PU rompre sa promesse, sans que rien ni
          personne ne l'en empêche, que la tenir devient un acte qui engage
          sa responsabilité, exactement comme pour l'homme désespéré du
          texte de Kant.
