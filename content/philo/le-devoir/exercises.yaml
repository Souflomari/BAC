        part: "Partie 4 — Discuter : la critique utilitariste, et le devoir suppose la liberté (chapitre 4)"
        stem: |-
          Reprends l'objection utilitariste et le lien devoir/liberté (chapitre 4)
          construits sur le texte de Kant, et applique-les à celui qui tient
