    intro: |-
      **Étude de l'hydrolyse d'un ester en milieu basique — une transformation lente suivie par conductimétrie (examen national, session normale 2010, Exercice de Chimie — Première partie, 4,25 points).**

      *Cet exercice de 7 points comporte une Deuxième partie — une pile à combustible méthanol/dioxygène — qui relève d'une autre notion (« Piles ») et n'est pas traitée ici.*

      *Note de méthode : cette Première partie mobilise aussi des méthodes de la notion « Suivi temporel d'une transformation — vitesse de réaction » (tableau d'avancement, principe du substitut monotone, définition et lecture graphique de $t_{1/2}$) et de « Estérification et hydrolyse » (la réaction d'hydrolyse d'un ester) — nommées au fil du raisonnement ci-dessous, au point où elles servent.*

      L'hydrolyse basique des esters est un moyen de préparation des alcools à partir de produits naturels, en plus d'autres applications dans le domaine médical et industriel. Le but de cette partie de l'exercice est de suivre, par conductimétrie, l'évolution de la réaction du méthanoate de méthyle avec une solution d'hydroxyde de sodium.

      **Données** (toutes les mesures sont effectuées à $25\ ^\circ\text{C}$) :
      - Conductance à un instant $t$ : $G = k\,\sum \lambda_i[X_i]$, avec $\lambda_i$ conductivité molaire ionique de l'ion $X_i$ et $k$ constante de la cellule de mesure de valeur $k = 0{,}01\ \text{m}$ ;
      - Conductivités molaires ioniques : $\lambda(\text{Na}^+_{aq}) = 5{,}01\cdot10^{-3}$, $\lambda(\text{OH}^-_{aq}) = 19{,}9\cdot10^{-3}$, $\lambda(\text{HCO}_{2\,aq}^-) = 5{,}46\cdot10^{-3}$ (en $\text{S}\cdot\text{m}^2\cdot\text{mol}^{-1}$) ;
      - On néglige la concentration des ions hydronium $\text{H}_3\text{O}^+$ devant les autres concentrations des ions présents dans le mélange réactionnel.

      On verse dans un bécher un volume $V = 2\cdot10^{-4}\ \text{m}^3$ d'une solution $S_B$ d'hydroxyde de sodium de concentration molaire $C_B = 10\ \text{mol}\cdot\text{m}^{-3}$, et on y ajoute à l'instant $t_0$ considéré comme origine des temps, une quantité de matière $n_E$ du méthanoate de méthyle égale à la quantité de matière $n_B$ d'hydroxyde de sodium ($n_E = n_B$). (On considère que le volume reste constant $V = 2\cdot10^{-4}\ \text{m}^3$.) Une étude expérimentale a permis de tracer la courbe représentative des variations de la conductance $G$ du mélange en fonction du temps (Figure 1). On modélise la réaction étudiée par l'équation de réaction suivante :

      $$\text{HCO}_2\text{CH}_{3(aq)} + \text{OH}^-_{aq} \;\longrightarrow\; \text{HCO}_{2(aq)}^- + \text{CH}_3\text{OH}_{(aq)}$$

      *Figure 1 (courbe) :* axe des ordonnées $G\ (\text{mS})$ gradué $0{,}5 ;\ 1 ;\ 1{,}5 ;\ 2 ;\ 2{,}5$ ; axe des abscisses $t\ (\text{min})$ gradué de $0$ à $90$ (par pas de $10$). La courbe part d'une valeur initiale voisine de $G \approx 2{,}5\ \text{mS}$ à $t = 0$ et **décroît** de façon monotone vers un palier voisin de $G \approx 1\ \text{mS}$ *(lectures d'échelle à confirmer sur le corrigé)*.
    questions:
      - id: q1
        part: "1 — Inventaire des ions"
        stem: |-
          **1.** (0,75 pt) Faire l'inventaire des ions présents dans le mélange à un instant $t$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Avant de pouvoir suivre CETTE réaction par conductimétrie, il faut d'abord savoir QUELS ions portent le courant dans le mélange, et comment leur nombre évolue — c'est ce diagnostic qui, question après question, va justifier tout le reste de l'exercice (pourquoi $G$ varie, dans quel sens, et de combien). Cette mécanique de la conductimétrie — inventorier, puis relier une conductance à un avancement — n'est montrée pas à pas dans aucune des deux leçons ici mobilisées ; le chapitre 2 de « Suivi temporel d'une transformation » nomme la méthode sans la dérouler, et cette leçon-ci n'aborde pas les techniques de suivi elles-mêmes. On la reconstruit ici, question par question.

          **Les espèces en présence.** La solution $S_B$ apporte, dès le départ, les ions $\text{Na}^+$ et $\text{OH}^-$ de l'hydroxyde de sodium. L'équation de réaction montre qu'on consomme $\text{OH}^-$ et qu'on produit l'ion méthanoate $\text{HCO}_2^-$. Le méthanoate de méthyle $\text{HCO}_2\text{CH}_3$ et le méthanol $\text{CH}_3\text{OH}$ sont des molécules **neutres** : elles ne comptent pas dans un inventaire d'ions, même si elles occupent une place dans le tableau d'avancement de la question suivante.

          **Trois ions, trois rôles.** À l'instant $t$ :
          — $\text{Na}^+_{(aq)}$, ion **spectateur** : il ne figure dans aucun des deux membres de l'équation de réaction, sa quantité de matière ne change donc jamais ;
          — $\text{OH}^-_{(aq)}$, **réactif** : sa quantité diminue au fur et à mesure que la réaction avance ;
          — $\text{HCO}_{2(aq)}^-$, **produit** : sa quantité augmente, à partir de zéro.

          $$\boxed{\text{Na}^+_{(aq)},\ \ \text{OH}^-_{(aq)},\ \ \text{HCO}_{2(aq)}^-}$$

          Les ions $\text{H}_3\text{O}^+$ sont négligés, comme l'énoncé l'autorise explicitement.

          **Le piège nommé de cette question.** Oublier $\text{Na}^+$ parce qu'il « ne réagit pas » : un ion spectateur reste un ion, il contribue à la conductance au même titre que les autres — c'est justement parce que sa contribution est CONSTANTE (question 3) qu'il faut le garder dans l'inventaire plutôt que l'écarter.
      - id: q2
        part: "2 — Tableau d'avancement"
        stem: |-
          **2.** (1 pt) Construire le tableau descriptif de l'évolution de cette transformation. (On notera $x$ l'avancement de la réaction à l'instant $t$.)
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est la méthode du chapitre 3 de « Suivi temporel d'une transformation — vitesse de réaction » : une ligne pour chaque espèce de l'équation, chacune évoluant selon son coefficient stœchiométrique (ici tous égaux à $1$), pour ensuite en tirer l'avancement final $x_{max}$ — le réactif limitant, celui qui s'annule en premier.

          **Les quantités initiales.** La solution $S_B$ apporte $n_B = C_B \times V = 10 \times 2\cdot10^{-4} = 2\cdot10^{-3}\ \text{mol}$ d'ions hydroxyde, et l'énoncé impose $n_E = n_B$ : le méthanoate de méthyle est introduit en **quantité égale**, exactement dans les proportions stœchiométriques de l'équation (tous les coefficients valent $1$).

          $$
          \begin{array}{l|cccc}
          \text{état} & \text{HCO}_2\text{CH}_3 & \text{OH}^- & \text{HCO}_2^- & \text{CH}_3\text{OH} \\
          \hline
          \text{initial}\ (x=0) & n_E & n_B & 0 & 0 \\
          \text{en cours}\ (x) & n_E - x & n_B - x & x & x \\
          \text{final}\ (x_{max}) & n_E - x_{max} & n_B - x_{max} & x_{max} & x_{max}
          \end{array}
          $$

          **Trouver $x_{max}$ : un cas particulier.** D'ordinaire, on compare $n_E$ et $n_B$ pour repérer lequel des deux réactifs s'annule en premier. Ici, $n_E = n_B$ exactement : les deux expressions $n_E - x$ et $n_B - x$ s'annulent donc **au même instant**, pour la même valeur de $x$ — aucun des deux réactifs n'est en excès, le mélange est dit stœchiométrique.

          **Pourquoi la réaction va jusqu'au bout.** L'équation donnée est écrite avec une flèche simple, $\longrightarrow$, pas une double flèche $\rightleftharpoons$ : ce choix d'écriture signale une réaction **totale**. C'est cohérent avec la chimie de cette transformation : contrairement à l'hydrolyse neutre d'un ester (réaction limitée, réversible — chapitre 3 de « Estérification et hydrolyse »), l'ion hydroxyde $\text{OH}^-$ attaque directement l'ester et produit l'ion carboxylate $\text{HCO}_2^-$, sa base conjuguée, au lieu de l'acide méthanoïque neutre. L'acide formé est ainsi retiré du milieu au fur et à mesure sous sa forme déprotonée — même mécanisme, appliqué à un ester différent, que celui déjà établi pour la saponification de l'éthanoate d'éthyle : principe de déplacement d'équilibre par élimination d'un produit (chapitre 6 de « Estérification et hydrolyse »), qui pousse ici la réaction jusqu'à son terme.

          $$\boxed{x_{max} = n_E = n_B = 2\cdot10^{-3}\ \text{mol} = 2{,}0\ \text{mmol}}$$

          **Le piège nommé de cette question.** Ne cherche pas lequel des deux réactifs est « en excès » ici : il n'y en a pas. C'est le cas particulier le plus simple pour trouver $x_{max}$ — mais aussi celui où l'automatisme « je compare deux quantités » tourne à vide, puisque les deux quantités sont égales dès le départ.
        steps:
          - math: 'n_B = C_B \times V = 10 \times 2\cdot10^{-4} = 2\cdot10^{-3}\ \text{mol}'
            note: "Quantité initiale d'hydroxyde de sodium, à partir de la concentration et du volume donnes."
          - math: '\boxed{x_{max} = n_E = n_B = 2\cdot10^{-3}\ \text{mol}}'
            note: "Mélange stoechiométrique (n_E = n_B) et réaction totale (fleche simple) : les deux réactifs s'epuisent ensemble."
      - id: q3
        part: "3 — Établir la relation G = f(x)"
        stem: |-
          **3.** (1 pt) Montrer que la conductance $G$ dans le milieu réactionnel vérifie la relation : $G = -0{,}72\,x + 2{,}5\cdot10^{-3}$ (S).
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une question « montrer que » : le résultat est donné, les points viennent du chemin. Il s'agit de traduire l'inventaire de la question 1 et le tableau de la question 2 en une expression numérique de $G$ en fonction de $x$ seul — c'est exactement le geste qui rendra possible, à la question 5, de traduire une condition sur $x$ (la demi-réaction) en une condition sur $G$ (ce qu'on peut effectivement lire sur la Figure 1). Cette dérivation n'est montrée pas à pas dans aucune des deux leçons mobilisées ici : on la reconstruit à partir de la loi d'additivité donnée en données, $G = k\sum_i \lambda_i[X_i]$, et du tableau d'avancement établi à la question 2.

          **Les concentrations, tirées du tableau.** Les trois ions inventoriés à la question 1 ont pour concentration, à l'instant $t$ (quantité divisée par le volume $V$, qui reste constant) :

          $$[\text{Na}^+] = \frac{n_B}{V}, \qquad [\text{OH}^-] = \frac{n_B - x}{V}, \qquad [\text{HCO}_2^-] = \frac{x}{V}$$

          Remarque : $[\text{Na}^+]$ est **constante** — un ion spectateur ne contribue à $G$ que par un terme qui ne bouge jamais, aucune surprise ici.

          **On substitue dans la loi d'additivité, et on factorise.**

          $$
          G = k\left[\lambda_{\text{Na}^+}\frac{n_B}{V} + \lambda_{\text{OH}^-}\frac{n_B-x}{V} + \lambda_{\text{HCO}_2^-}\frac{x}{V}\right]
          = \frac{k}{V}\Big[n_B\big(\lambda_{\text{Na}^+}+\lambda_{\text{OH}^-}\big) + x\big(\lambda_{\text{HCO}_2^-}-\lambda_{\text{OH}^-}\big)\Big]
          $$

          Le premier groupe (indépendant de $x$) va donner le terme constant ; le second (multiplié par $x$) va donner la pente. C'est cette **différence** $\lambda_{\text{HCO}_2^-}-\lambda_{\text{OH}^-}$, entre l'ion qui apparaît et l'ion qui disparaît, qui porte tout le signe de la pente — un point qui va resservir à la question suivante.

          **Le préfacteur.**

          $$\frac{k}{V} = \frac{0{,}01}{2\cdot10^{-4}} = 50\ \text{m}^{-2}$$

          **Le terme constant.**

          $$\frac{k}{V}\,n_B\big(\lambda_{\text{Na}^+}+\lambda_{\text{OH}^-}\big) = 50 \times 2\cdot10^{-3} \times (5{,}01+19{,}9)\cdot10^{-3} = 0{,}1 \times 24{,}91\cdot10^{-3} = 2{,}491\cdot10^{-3}\ \text{S}$$

          Arrondi à deux chiffres significatifs, $2{,}5\cdot10^{-3}\ \text{S}$ — exactement la valeur de $G$ à $t=0$ ($x=0$) annoncée par la Figure 1, un contrôle gratuit qui confirme ce terme.

          **Le terme en $x$ (la pente).**

          $$\frac{k}{V}\big(\lambda_{\text{HCO}_2^-}-\lambda_{\text{OH}^-}\big) = 50 \times (5{,}46-19{,}9)\cdot10^{-3} = 50\times(-14{,}44\cdot10^{-3}) = -0{,}722\ \text{S}\cdot\text{mol}^{-1}$$

          Arrondi, $-0{,}72\ \text{S}\cdot\text{mol}^{-1}$.

          **On rassemble.**

          $$\boxed{G = -0{,}72\,x + 2{,}5\cdot10^{-3}\ \ (\text{S})}$$

          La relation demandée est établie ; le contre-calcul complet redonne $-0{,}722$ et $2{,}491\cdot10^{-3}$ avant arrondi, cohérents avec les deux chiffres annoncés par l'énoncé — aucun écart.

          **Le piège nommé de cette question.** Oublier le sodium dans la somme, en se disant qu'un ion spectateur « ne compte pas » : sa contribution constante fait pourtant partie intégrante du terme constant $2{,}5\cdot10^{-3}\ \text{S}$ — l'omettre changerait la valeur de $G$ à $t=0$ elle-même, pas seulement un détail du calcul.
        steps:
          - math: '[\text{Na}^+] = \frac{n_B}{V}, \quad [\text{OH}^-] = \frac{n_B-x}{V}, \quad [\text{HCO}_2^-] = \frac{x}{V}'
            note: "Concentrations tirees du tableau d'avancement de la question 2."
          - math: 'G = \frac{k}{V}\Big[n_B(\lambda_{\text{Na}^+}+\lambda_{\text{OH}^-}) + x(\lambda_{\text{HCO}_2^-}-\lambda_{\text{OH}^-})\Big]'
            note: "On substitue les concentrations dans la loi d'additivité donnée, puis on met k/V en facteur."
          - math: '\frac{k}{V} = \frac{0{,}01}{2\cdot10^{-4}} = 50\ \text{m}^{-2}'
            note: "Prefacteur, reutilise dans les deux termes qui suivent."
          - math: '50\times2\cdot10^{-3}\times(5{,}01+19{,}9)\cdot10^{-3} = 2{,}491\cdot10^{-3}\ \text{S} \approx 2{,}5\cdot10^{-3}\ \text{S}'
            note: "Terme constant : coincide avec G(0) lu sur la figure 1, controle gratuit."
          - math: '50\times(5{,}46-19{,}9)\cdot10^{-3} = -0{,}722\ \text{S.mol}^{-1} \approx -0{,}72\ \text{S.mol}^{-1}'
            note: "Pente : différence lambda(HCO2-) moins lambda(OH-), négative."
          - math: '\boxed{G = -0{,}72\,x + 2{,}5\cdot10^{-3}\ \ (\text{S})}'
            note: "Relation demontree ; contre-calcul complet sans arrondi : -0,722x + 2,491e-3, coherent."
      - id: q4
        part: "4 — Justifier le sens de variation"
        stem: |-
          **4.** (0,5 pt) Justifier la décroissance de la conductance $G$ au cours de la réaction.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est ici que se joue le point de méthode central de tout suivi conductimétrique : la conductance ne baisse pas parce que « les ions disparaissent » en bloc, mais parce que la NATURE des ions présents change au cours du temps — un ion cède la place à un autre, et les deux ne conduisent pas aussi bien.

          **Lecture algébrique, directe.** À la question 3, le coefficient de $x$ dans $G = -0{,}72\,x + 2{,}5\cdot10^{-3}$ est **négatif**. Or l'avancement $x$ ne fait que croître au cours du temps (il ne redescend jamais) : $G$, fonction affine décroissante de $x$, ne peut donc que décroître elle aussi.

          **Lecture physique — le cœur du raisonnement.** Regarde le tableau de la question 2 : à chaque instant, un ion $\text{OH}^-$ **disparaît** et un ion $\text{HCO}_2^-$ **apparaît**, un pour un ; l'ion $\text{Na}^+$, lui, reste inchangé. Le **nombre total d'ions dans le mélange ne varie donc quasiment pas** — ce n'est pas une histoire de « moins de porteurs de charge ». Ce qui change, c'est LEQUEL de ces porteurs est présent : l'ion hydroxyde est un excellent conducteur ($\lambda_{\text{OH}^-} = 19{,}9\cdot10^{-3}\ \text{S}\cdot\text{m}^2\cdot\text{mol}^{-1}$), l'ion méthanoate un bien moins bon ($\lambda_{\text{HCO}_2^-} = 5{,}46\cdot10^{-3}$, soit environ $3{,}6$ fois plus faible). À chaque instant, on échange un excellent porteur de charge contre un médiocre, à effectif quasi constant : la conductance du mélange diminue.

          **C'est ce lien, précisément, qui fait toute la méthode du suivi.** C'est parce que la nature chimique du mélange (quels ions, en quelle quantité) détermine directement une grandeur physique mesurable ($G$) que mesurer $G$ minute après minute revient à suivre l'avancement $x$ de la réaction — c'est le principe même de la conductimétrie comme méthode de suivi temporel, ici appliqué concrètement plutôt que simplement nommé.

          **Le piège nommé de cette question.** Répondre seulement « $x$ augmente et la pente est négative » sans jamais dire QUEL ion disparaît et QUEL ion apparaît revient à réciter l'algèbre sans expliquer le phénomène — exactement ce qu'un correcteur de bac sanctionne sur une question de justification physique. Les deux lectures, algébrique et chimique, doivent être données ensemble.
      - id: q5
        part: "5 — Le temps de demi-réaction"
        stem: |-
          **5.** (1 pt) Déterminer la valeur du temps de demi-réaction $t_{1/2}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est la définition et la méthode du chapitre 5 de « Suivi temporel d'une transformation — vitesse de réaction » : $t_{1/2}$ est l'instant où l'avancement atteint la **moitié de sa valeur finale**, $x(t_{1/2}) = x_{max}/2$ — jamais la moitié de la durée totale pendant laquelle on observe la réaction. C'est un piège classique et particulièrement tentant ici : la Figure 1 est tracée jusqu'à $t = 90\ \text{min}$, et rien ne garantit — ni ne doit faire croire — que $t_{1/2}$ tombe près de $45\ \text{min}$, la moitié de ce cadre. Seule la définition sur $x$ commande la réponse.

          **Le problème : $G$, pas $x$, est en ordonnée.** La Figure 1 donne $G(t)$, pas $x(t)$ : on ne peut donc pas lire directement l'instant où $x = x_{max}/2$. Il faut traduire cette condition sur $x$ en une condition sur $G$, grâce à la relation affine établie à la question 3 — c'est exactement le principe du **substitut monotone** (chapitre 2 de « Suivi temporel d'une transformation ») : $G$ varie de façon connue et monotone avec $x$, donc à chaque valeur de $x$ correspond une unique valeur de $G$, et réciproquement.

          **La moitié de l'avancement final.**

          $$\frac{x_{max}}{2} = \frac{2\cdot10^{-3}}{2} = 1\cdot10^{-3}\ \text{mol}$$

          **La conductance correspondante, via la relation de la question 3.**

          $$G(t_{1/2}) = -0{,}72\times1\cdot10^{-3} + 2{,}5\cdot10^{-3} = -0{,}72\cdot10^{-3} + 2{,}5\cdot10^{-3}$$

          $$\boxed{G(t_{1/2}) = 1{,}78\cdot10^{-3}\ \text{S} = 1{,}78\ \text{mS}}$$

          **Un contrôle gratuit.** $G$ est une fonction **affine** de $x$ : sa valeur à $x_{max}/2$ tombe donc, mécaniquement, exactement à mi-chemin entre $G(0)$ et $G(x_{max})$ — quelle que soit l'allure, en revanche, de $G$ en fonction du TEMPS (qui n'a rien d'affine, elle). $G(x_{max}) = -0{,}72\times2\cdot10^{-3}+2{,}5\cdot10^{-3} = 1{,}06\cdot10^{-3}\ \text{S} \approx 1{,}06\ \text{mS}$, et la moyenne de $2{,}5$ et $1{,}06$ vaut bien $1{,}78\ \text{mS}$. Cette valeur de plateau, $\approx 1{,}06\ \text{mS}$, recoupe d'ailleurs le palier « voisin de $G\approx1\ \text{mS}$ » décrit sur la Figure 1 — un second contrôle, indépendant du premier, qui confirme au passage que $x_{max}=n_B$ (question 2) est la bonne hypothèse.

          **La lecture graphique, et une limite à signaler honnêtement.** Il reste à projeter $G \approx 1{,}78\ \text{mS}$ sur la courbe de la Figure 1 pour en lire l'abscisse. La description vérifiée de cette figure, reprise plus haut au mot près, ne fixe que les deux valeurs d'extrémité de la courbe ($G\approx2{,}5\ \text{mS}$ à $t=0$, palier $\approx1\ \text{mS}$) — elle-même explicitement flaguée « lectures d'échelle à confirmer sur le corrigé » — sans aucun point intermédiaire transcrit. On retient ici, par cohérence avec le sommet de cette leçon (l'exercice « r-bac », qui porte le même sujet 2010, la même figure), $t_{1/2} \approx 20\ \text{min}$ :

          $$\boxed{t_{1/2} \approx 20\ \text{min}}$$

          mais la description de figure dont on dispose ici ne permet pas de la retrouver plus finement : c'est la méthode qui compte, pas la deuxième décimale.

          **Le piège nommé de cette question.** Lire $t_{1/2}$ à $t\approx45\ \text{min}$ « parce que c'est la moitié du cadre de $0$ à $90\ \text{min}$ » : rien dans la définition de $t_{1/2}$ ne fait intervenir la durée totale d'observation, seulement l'avancement. La courbe décroît d'abord vite puis de plus en plus lentement (elle tend vers un palier) : $t_{1/2}$ se trouve nécessairement AVANT la moitié du cadre, pas à mi-chemin de celui-ci.
        steps:
          - math: '\frac{x_{max}}{2} = \frac{2\cdot10^{-3}}{2} = 1\cdot10^{-3}\ \text{mol}'
            note: "Moitié de l'avancement final (question 2)."
          - math: 'G(t_{1/2}) = -0{,}72\times1\cdot10^{-3}+2{,}5\cdot10^{-3} = 1{,}78\cdot10^{-3}\ \text{S}'
            note: "Conductance a la demi-reaction, via la relation de la question 3 (principe du substitut monotone)."
          - math: 'G(x_{max}) = -0{,}72\times2\cdot10^{-3}+2{,}5\cdot10^{-3} = 1{,}06\cdot10^{-3}\ \text{S}'
            note: "Controle : palier prédit, cohérent avec le palier voisin de 1 mS décrit sur la figure 1."
          - math: '\boxed{t_{1/2} \approx 20\ \text{min}}'
            note: "Lecture graphique, reprise du sommet r-bac par cohérence : la figure vérifiée ne porte pas de point intermédiaire indépendant (voir sourcing)."
