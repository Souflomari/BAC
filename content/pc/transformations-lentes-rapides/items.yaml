        text: "Diminuer à la fois la température et la concentration initiale des réactifs."
        correct: true
      - id: B
        text: "Augmenter la température et diminuer la concentration initiale des réactifs."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.facteur-mauvais-sens
        feedback: >
          Augmenter la température accélère la transformation, elle ne la
          ralentit pas : ce levier est actionné dans le mauvais sens. Seule
          la baisse de concentration va dans le sens recherché.
      - id: C
        text: "Diminuer la température et augmenter la concentration initiale des réactifs."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.facteur-mauvais-sens
        feedback: >
          Augmenter la concentration des réactifs accélère la
          transformation, elle ne la ralentit pas : ce levier est actionné
          dans le mauvais sens. Seule la baisse de température va dans le
          sens recherché.
      - id: D
        text: "Augmenter à la fois la température et la concentration initiale des réactifs."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.facteur-mauvais-sens
        feedback: >
          Les deux leviers sont actionnés dans le mauvais sens : augmenter
          la température ou la concentration accélère une transformation,
          cela ne la ralentit jamais.
    correct_feedback: >
      Les deux facteurs cinétiques agissent dans le même sens : diminuer la
      température et diminuer la concentration ralentissent tous deux la
      transformation, sans changer sa nature chimique.
    solution: |
      D'après le chapitre 4, augmenter la concentration ou la température accélère une
      transformation ; les diminuer la ralentit. Pour ralentir sans changer
      la nature de la réaction, il faut donc actionner les deux facteurs
      dans le sens qui freine : température plus basse ET concentration plus
      faible.

  - id: TLR-15
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_transformations_lentes_rapides
    tags: []
    primary_misconception: mc.physics.pc_transformations_lentes_rapides.tout-choc-suffit
    stem: >
      Pourquoi l'hypothèse « n'importe quelle rencontre entre les entités
      réactives suffit à déclencher la réaction » est-elle rejetée ?
    type: mcq
    choices:
      - id: A
        text: >-
          Parce que si c'était le cas, seule la fréquence des chocs, donc la
          concentration, contrôlerait la vitesse — ce qui n'expliquerait en aucun cas
          l'effet marqué de la température vu au chapitre 4.
        correct: true
      - id: B
        text: >-
          Parce qu'un choc entre deux entités identiques, deux ions iodure par exemple,
          est tout simplement impossible sur le plan physique.
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.tout-choc-suffit
        feedback: >
          Ce n'est pas la raison invoquée : deux entités identiques peuvent
          tout à fait se croiser. Le problème de l'hypothèse « tout choc
          suffit » est ailleurs — elle ne rend pas compte de l'effet marqué
          de la température sur la vitesse.
      - id: C
        text: >-
          Parce qu'à l'échelle microscopique il n'existe aucun choc entre les entités
          réactives, mais seulement des réactions instantanées dès que deux d'entre
          elles se rencontrent.
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.tout-choc-suffit
        feedback: >
          C'est l'inverse du modèle posé au chapitre 5 : la réaction se produit
          précisément PAR des chocs entre entités en mouvement — c'est la
          condition d'efficacité de ces chocs qui est en question, pas leur
          existence.
      - id: D
        text: >-
          Parce que la concentration des réactifs n'a en réalité aucun effet sur le
          nombre de chocs entre les entités du mélange.
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.facteur-sans-effet
        feedback: >
          C'est contraire au mécanisme établi : augmenter la concentration
          augmente bien le nombre d'entités par unité de volume, donc la
          fréquence de leurs chocs. Ce n'est pas ce point qui invalide
          l'hypothèse « tout choc suffit ».
    correct_feedback: >
      Si tout choc suffisait, la vitesse ne dépendrait que de la fréquence
      des rencontres — donc de la concentration. Or la température, qui
      change peu cette fréquence, a un effet très marqué sur la vitesse :
      autre chose que la simple rencontre doit donc compter, à savoir
      l'énergie du choc.
    solution: |
      L'hypothèse « tout choc suffit » prédit que seule la fréquence des
      rencontres — donc la concentration — devrait contrôler la vitesse. Or
      Le chapitre 4 a établi expérimentalement que la température accélère elle aussi
      nettement la réaction, alors qu'elle change assez peu le nombre total
      de rencontres par seconde. Un effet aussi marqué ne peut donc pas
      s'expliquer par la seule fréquence : il faut une seconde condition,
      l'énergie du choc, ce qui mène à la notion de choc efficace.

  - id: TLR-16
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_transformations_lentes_rapides
    tags: []
    primary_misconception: mc.physics.pc_transformations_lentes_rapides.redox-combinaison-incorrecte
    stem: >
      Les couples $MnO_4^-/Mn^{2+}$ et $Fe^{3+}/Fe^{2+}$ interviennent dans
      une réaction en milieu acide, avec
      $MnO_4^- + 8H^+ + 5e^- \rightleftharpoons Mn^{2+} + 4H_2O$ et
      $Fe^{3+} + e^- \rightleftharpoons Fe^{2+}$. Quelle est l'équation
      globale correcte ?
    type: mcq
    choices:
      - id: A
        text: "$MnO_4^- + 8H^+ + 5Fe^{2+} \\rightarrow Mn^{2+} + 4H_2O + 5Fe^{3+}$"
        correct: true
      - id: B
        text: "$MnO_4^- + 8H^+ + Fe^{2+} \\rightarrow Mn^{2+} + 4H_2O + Fe^{3+}$"
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.redox-combinaison-incorrecte
        feedback: >
          Le nombre d'électrons échangés n'est pas égalé avant d'additionner
          : le couple du manganèse échange 5 électrons, celui du fer un
          seul. Il faut multiplier la demi-équation du fer par 5 avant de
          combiner, pas l'utiliser telle quelle.
      - id: C
        text: "$MnO_4^- + 8H^+ + 5Fe^{2+} + 5e^- \\rightarrow Mn^{2+} + 4H_2O + 5Fe^{3+} + 5e^-$"
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.redox-combinaison-incorrecte
        feedback: >
          Les électrons ont bien été égalés (5 dans chaque demi-équation),
          mais ils doivent s'annuler à l'addition, puisqu'aucun électron ne
          reste libre en solution : ils ne doivent apparaître ni à gauche ni
          à droite de l'équation globale.
      - id: D
        text: "$5MnO_4^- + 8H^+ + Fe^{2+} \\rightarrow Mn^{2+} + 4H_2O + Fe^{3+}$"
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.redox-combinaison-incorrecte
        feedback: >
          C'est la mauvaise demi-équation qui a été multipliée : c'est celle
          du fer (qui échange 1 électron) qu'il faut multiplier par 5 pour
          atteindre les 5 électrons du couple du manganèse, pas l'inverse.
    correct_feedback: >
      Le fer, réducteur, cède 1 électron ; il faut donc multiplier sa
      demi-équation par 5 pour égaler les 5 électrons captés par $MnO_4^-$.
      En additionnant, les $5e^-$ s'annulent exactement.
    solution: |
      Réduction : $MnO_4^- + 8H^+ + 5e^- \rightarrow Mn^{2+} + 4H_2O$.
      Oxydation, multipliée par 5 pour égaler les électrons :
      $5Fe^{2+} \rightarrow 5Fe^{3+} + 5e^-$.
      En additionnant membre à membre, les $5e^-$ s'annulent :
      $MnO_4^- + 8H^+ + 5Fe^{2+} \rightarrow Mn^{2+} + 4H_2O + 5Fe^{3+}$.

  - id: TLR-17
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_transformations_lentes_rapides
    tags: []
    primary_misconception: mc.physics.pc_transformations_lentes_rapides.froid-detruit-especes
    stem: >
      Le lait laissé à température ambiante ($20\,^\circ\text{C}$) tourne
      (transformation chimique de dégradation) en $8$ heures ; le même lait,
      au réfrigérateur ($4\,^\circ\text{C}$), met $4$ jours à tourner.
      Quelle affirmation, fondée sur le modèle des chocs efficaces, explique
      correctement cet écart ?
    type: mcq
    choices:
      - id: A
        text: >-
          À $4\,^\circ\text{C}$, l'agitation thermique est plus faible : les chocs sont
          moins fréquents, et une plus petite proportion d'entre eux atteint l'énergie
          nécessaire — la dégradation est donc beaucoup plus lente.
        correct: true
      - id: B
        text: "Le froid du réfrigérateur détruit chimiquement une partie des espèces réactives responsables du caillage du lait."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.froid-detruit-especes
        feedback: >
          Le froid ne détruit rien chimiquement : les espèces réactives
          restent présentes, en même quantité. C'est la vitesse à laquelle
          elles réagissent qui diminue, pas leur quantité.
      - id: C
        text: "Le réfrigérateur diminue la concentration des espèces réactives présentes dans le lait, ce qui en ralentit la dégradation."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.froid-baisse-concentration
        feedback: >
          La température et la concentration sont deux facteurs cinétiques
          distincts : refroidir le lait ne change pas les quantités de
          matière qu'il contient, seulement l'agitation thermique des
          espèces.
      - id: D
        text: >-
          Un écart aussi important (environ douze fois plus long) est trop
          grand pour être expliqué par un simple changement de température ;
          un autre facteur, non identifié, doit intervenir.
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.temperature-concentration-confusion
        feedback: >
          Au contraire, chapitre 5 établit que l'effet de la température est
          souvent particulièrement marqué, car elle cumule deux effets
          (fréquence ET énergie des chocs) : une élévation ou une baisse
          même modeste de température peut donc accélérer ou ralentir
          nettement une transformation, sans qu'aucun autre facteur ne soit
          nécessaire.
    correct_feedback: >
      La baisse de température cumule deux effets freinateurs : moins de
      chocs par seconde, et une proportion moindre d'entre eux assez
      énergétique — exactement le mécanisme établi au chapitre 5 pour expliquer un
      effet marqué de la température.
    solution: |
      Seule la température a changé entre les deux récipients. D'après le chapitre 5,
      la baisser diminue à la fois la fréquence des chocs entre espèces
      réactives (agitation thermique plus faible) et la proportion de chocs
      assez énergétiques pour être efficaces. Ces deux effets se cumulent,
      ce qui explique un ralentissement marqué de la dégradation — sans
      qu'aucun autre facteur n'intervienne.

  - id: TLR-18
    rung: "R5"
    difficulty_level: 5
    skill_code: pc_transformations_lentes_rapides
    tags: []
    primary_misconception: mc.physics.pc_transformations_lentes_rapides.changer-condition-change-nature
    stem: >
      Un chimiste étudie une transformation lente en laboratoire. Il
      constate qu'en refroidissant le mélange à $0\,^\circ\text{C}$ et en
      diluant fortement les réactifs, la teinte caractéristique, auparavant
      visible en $5$ minutes, n'apparaît plus qu'après plusieurs heures.
      Quelle affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Il a combiné les deux facteurs cinétiques dans le sens qui ralentit : moins de
          chocs par seconde, et une moindre proportion d'entre eux assez énergétique,
          d'où une transformation nettement plus lente.
        correct: true
      - id: B
        text: "En diluant fortement les réactifs, il a en réalité changé la nature chimique de la réaction étudiée, ce qui explique à lui seul le net ralentissement observé."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.changer-condition-change-nature
        feedback: >
          Changer une concentration ne change ni les réactifs ni les
          produits de la réaction, seulement la durée qu'elle met à se
          terminer : c'est toujours la même équation chimique, seulement
          plus lente.
      - id: C
        text: "Seule la baisse de température explique ce ralentissement ; diluer les réactifs n'a, en réalité, aucun effet sur la vitesse d'une transformation chimique, quelle qu'elle soit."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.facteur-sans-effet
        feedback: >
          La concentration des réactifs est l'un des deux facteurs
          cinétiques établis expérimentalement au chapitre 4 : la diluer ralentit
          bien la transformation, en plus de l'effet de la température.
      - id: D
        text: "La transformation, en ralentissant autant, est probablement devenue une transformation rapide dont on ne peut plus voir que l'état final."
        correct: false
        misconception: mc.physics.pc_transformations_lentes_rapides.critere-temps-inverse
        feedback: >
          « Ralentir » et « devenir rapide » sont contradictoires : rendre
          une transformation plus lente l'éloigne encore plus du critère de
          rapidité (chapitre 2). Elle reste une transformation lente, seulement
          encore plus lente qu'avant, et toujours observable pendant son
          déroulement.
    correct_feedback: >
      Refroidir ET diluer actionnent les deux facteurs cinétiques établis en
      Le chapitre 4 dans le même sens freinateur, ce qui explique, via le modèle des
      chocs efficaces (chapitre 5), un net ralentissement sans changement de nature
      chimique.
    solution: |
      Deux facteurs cinétiques ont été actionnés à la fois, tous deux dans
      le sens qui ralentit : température plus basse et concentration plus
      faible. D'après le chapitre 5, cela diminue à la fois la fréquence des chocs et
      la proportion de chocs assez énergétiques pour être efficaces. La
      transformation reste lente — simplement beaucoup plus lente qu'avant —
      et demeure, comme toute transformation lente, observable pendant son
      déroulement.

