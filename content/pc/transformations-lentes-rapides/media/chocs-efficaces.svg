<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 649 464"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Modèle microscopique des chocs efficaces : un milieu où des ions iodure et peroxodisulfate se déplacent sans cesse (agitation thermique) ; un choc zoomé entre deux entités, dont l'issue n'est pas automatique ; la distinction centrale entre un choc efficace (orientation favorable et énergie suffisante, qui forme du diiode et des ions sulfate) et un choc inefficace (mal orienté ou trop mou, les entités se séparent sans réagir) ; puis deux leviers testés séparément sur ce même milieu, à nombre d'entités identique entre les deux : plus d'entités dans le même volume, puis les mêmes entités mais plus agitées.">
  <title>Le modèle des chocs efficaces</title>
  <!--
    chocs-efficaces.svg — scène unique à zones disjointes (PAS un empilement
    de panneaux de même hauteur — pas de VERTICALLY_STACKED_PANELS ici), les
    étapes postérieures réutilisant ou complétant les zones déjà posées
    plutôt que d'empiler de nouvelles bandes.

    Contraintes dures (brief) :
      - la distinction efficace / inefficace reste l'idée centrale — c'est
        la SEULE chose marquée en --figure-accent dans toute la figure ;
      - AUCUN profil d'énergie d'activation, AUCUNE courbe de Maxwell-
        Boltzmann (hors programme de ce chapitre — celui-ci reste purement
        qualitatif : orientation + énergie suffisante, sans jamais chiffrer
        E_a) ;
      - la température n'est JAMAIS dessinée comme un changement de
        concentration : le nombre d'entités doit être IDENTIQUE entre
        l'étape 4 (levier concentration) et l'étape 5 (levier température).
        Réalisé ainsi : l'étape 4 AJOUTE de nouvelles entités (+ courtes
        flèches d'agitation, même longueur qu'à l'étape 1) dans le même
        bécher ; l'étape 5 N'AJOUTE AUCUNE ENTITÉ — elle superpose
        uniquement de NOUVELLES flèches, plus longues, aux positions déjà
        existantes (celles de l'étape 1 ET celles ajoutées à l'étape 4).
        Le compte total de disques reste donc rigoureusement le même aux
        étapes 4 et 5 ; seule la longueur des flèches change.

    Deux espèces, deux traitements calmes (pas de couleur inventée) :
      ion iodure I⁻            : petit disque plein, --figure-ink
      ion peroxodisulfate S2O8²⁻ : disque à contour seul, --figure-ink-soft,
                                    fond --figure-surface (un peu plus grand)

    Zones (coordonnées fixes, réutilisées d'étape en étape) :
      zone "milieu"   x=40..370,  y=52..242  (bécher : entités + agitation)
      zone "un choc"  x=400..600, y=52..192  (vue zoomée d'une rencontre)
      zone "efficace / inefficace" y=300..450, deux panneaux x=40..310 et
                                    x=330..600

    Mise en étapes :
      step-1 : le milieu — entités dispersées, courtes flèches d'agitation,
               légende.
      step-2 : un choc — inset zoomé relié au milieu par un connecteur en
               pointillé ; issue non jouée (« ? »), aucun accent.
      step-3 : la distinction pivot — panneau efficace (accent : liseré,
               flèches convergentes, éclat d'impact, formule des produits)
               contre panneau inefficace (ink-soft : approche désaxée,
               marque « ✕ », aucune réaction).
      step-4 : levier concentration — mêmes bécher et échelle de flèches
               qu'à l'étape 1, plus d'entités dedans (même volume).
      step-5 : levier température — aucune entité nouvelle (voir plus haut) ;
               flèches plus longues sur les entités déjà présentes,
               schématique et déclaré : la longueur des flèches n'est pas
               à l'échelle d'une vitesse réelle, seule la comparaison
               qualitative « plus long = plus rapide » compte.
  -->

  <defs>
    <marker id="ce-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--figure-ink-soft)"/>
    </marker>
    <marker id="ce-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--figure-accent)"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le milieu
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="205" y="44" text-anchor="middle" font-size="12" font-weight="600"
          fill="var(--figure-ink)">Le milieu réactionnel</text>
    <rect x="40" y="52" width="330" height="190" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- I⁻ — disques pleins -->
    <circle cx="90"  cy="90"  r="4" fill="var(--figure-ink)"/>
    <circle cx="230" cy="75"  r="4" fill="var(--figure-ink)"/>
    <circle cx="320" cy="140" r="4" fill="var(--figure-ink)"/>
    <circle cx="100" cy="210" r="4" fill="var(--figure-ink)"/>
    <circle cx="270" cy="225" r="4" fill="var(--figure-ink)"/>

    <!-- S2O8²⁻ — contour seul, un peu plus grand -->
    <circle cx="150" cy="115" r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <circle cx="210" cy="190" r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <circle cx="340" cy="90"  r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <circle cx="70"  cy="160" r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>

    <!-- Agitation thermique — courtes flèches -->
    <line x1="90"  y1="90"  x2="101" y2="82"  stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="230" y1="75"  x2="220" y2="65"  stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="320" y1="140" x2="332" y2="148" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="100" y1="210" x2="88"  y2="218" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="270" y1="225" x2="282" y2="215" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="150" y1="115" x2="159" y2="124" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="210" y1="190" x2="198" y2="182" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="340" y1="90"  x2="328" y2="98"  stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="70"  y1="160" x2="80"  y2="150" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>

    <!-- Légende -->
    <circle cx="50" cy="258" r="4" fill="var(--figure-ink)"/>
    <text x="60" y="262" font-size="11" fill="var(--figure-ink)"
          >I<tspan dy="-5" font-size="8">−</tspan></text>
    <circle cx="150" cy="258" r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="162" y="262" font-size="11" fill="var(--figure-ink)"
          >S<tspan dy="4" font-size="8">2</tspan><tspan dy="-4">O</tspan><tspan dy="4" font-size="8">8</tspan><tspan dy="-9" font-size="7">2−</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — un choc (inset zoomé)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="370" y1="110" x2="400" y2="120" stroke="var(--figure-ink-soft)" stroke-width="1.2"
          stroke-dasharray="3,3" marker-end="url(#ce-arrow)"/>
    <rect x="400" y="52" width="200" height="140" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="500" y="70" text-anchor="middle" font-size="12" font-weight="600"
          fill="var(--figure-ink)">Un choc</text>

    <circle cx="450" cy="130" r="9" fill="var(--figure-ink)"/>
    <circle cx="500" cy="135" r="11" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="475" y="137" text-anchor="middle" font-size="16" fill="var(--figure-ink-soft)">✱</text>
    <text x="475" y="166" text-anchor="middle" font-size="13" fill="var(--figure-ink-soft)">?</text>
    <text x="500" y="184" text-anchor="middle" font-size="9" fill="var(--figure-ink-soft)">issue pas automatique</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la distinction pivot : efficace / inefficace
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Panneau EFFICACE — accent -->
    <rect x="40" y="300" width="270" height="150" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <rect x="40" y="300" width="4" height="150" rx="2" fill="var(--figure-accent)"/>
    <text x="175" y="322" text-anchor="middle" font-size="12" font-weight="600"
          fill="var(--figure-accent)">Choc efficace</text>

    <circle cx="110" cy="372" r="8" fill="var(--figure-ink)"/>
    <circle cx="240" cy="372" r="10" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="110" y1="372" x2="148" y2="372" stroke="var(--figure-accent)" stroke-width="1.6" marker-end="url(#ce-arrow-accent)"/>
    <line x1="240" y1="372" x2="202" y2="372" stroke="var(--figure-accent)" stroke-width="1.6" marker-end="url(#ce-arrow-accent)"/>
    <text x="175" y="378" text-anchor="middle" font-size="16" fill="var(--figure-accent)">✱</text>

    <text x="175" y="405" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">orientation favorable + énergie suffisante</text>
    <text x="175" y="432" text-anchor="middle" font-size="11" fill="var(--figure-accent)"
          >→ I<tspan dy="4" font-size="8">2</tspan><tspan dy="-4"> + SO</tspan><tspan dy="4" font-size="8">4</tspan><tspan dy="-9" font-size="7">2−</tspan></text>

    <!-- Panneau INEFFICACE — neutre -->
    <rect x="330" y="300" width="270" height="150" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="465" y="322" text-anchor="middle" font-size="12" font-weight="600"
          fill="var(--figure-ink-soft)">Choc inefficace</text>

    <circle cx="400" cy="365" r="8" fill="var(--figure-ink)"/>
    <circle cx="530" cy="378" r="10" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="400" y1="365" x2="432" y2="349" stroke="var(--figure-ink-soft)" stroke-width="1.4" marker-end="url(#ce-arrow)"/>
    <line x1="530" y1="378" x2="498" y2="393" stroke="var(--figure-ink-soft)" stroke-width="1.4" marker-end="url(#ce-arrow)"/>
    <text x="465" y="378" text-anchor="middle" font-size="13" fill="var(--figure-ink-soft)">✕</text>

    <text x="465" y="405" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">mal orienté ou énergie insuffisante</text>
    <text x="465" y="432" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">→ pas de réaction</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — levier concentration : plus d'entités, même volume
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <circle cx="180" cy="95"  r="4" fill="var(--figure-ink)"/>
    <circle cx="60"  cy="120" r="4" fill="var(--figure-ink)"/>
    <circle cx="310" cy="200" r="4" fill="var(--figure-ink)"/>
    <circle cx="250" cy="150" r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <circle cx="120" cy="175" r="5.5" fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>

    <line x1="180" y1="95"  x2="192" y2="88"  stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="60"  y1="120" x2="48"  y2="128" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="310" y1="200" x2="322" y2="192" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="250" y1="150" x2="238" y2="158" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>
    <line x1="120" y1="175" x2="132" y2="168" stroke="var(--figure-ink-soft)" stroke-width="1.2" marker-end="url(#ce-arrow)"/>

    <text x="40" y="282" font-size="10" fill="var(--figure-ink)">même volume, plus d'entités → plus de chocs</text>
  </g><!-- /step-4 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 5 — levier température : mêmes entités, plus agitées
       (AUCUNE entité nouvelle — seulement de nouvelles flèches,
       plus longues, sur les positions déjà existantes)
       ══════════════════════════════════════════════════════ -->
  <g id="step-5">
    <line x1="90"  y1="90"  x2="114" y2="72"  stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="230" y1="75"  x2="208" y2="53"  stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="320" y1="140" x2="346" y2="158" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="100" y1="210" x2="74"  y2="228" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="270" y1="225" x2="296" y2="203" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="150" y1="115" x2="170" y2="135" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="210" y1="190" x2="184" y2="172" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="340" y1="90"  x2="314" y2="108" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="70"  y1="160" x2="92"  y2="138" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="180" y1="95"  x2="206" y2="80"  stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="60"  y1="120" x2="34"  y2="138" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="310" y1="200" x2="336" y2="182" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="250" y1="150" x2="224" y2="168" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>
    <line x1="120" y1="175" x2="146" y2="160" stroke="var(--figure-ink-soft)" stroke-width="1.3" marker-end="url(#ce-arrow)"/>

    <text x="330" y="282" font-size="10" fill="var(--figure-ink)">température ↑ : agitation plus rapide, même nombre d'entités</text>
  </g><!-- /step-5 -->

</svg>
