<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 647 424"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Deux transformations sur les mêmes axes avancement x en fonction du temps t : une transformation rapide qui atteint son état final x_f presque immédiatement puis reste sur ce palier, et une transformation lente qui atteint le même état final x_f mais progressivement, sur toute la durée représentée.">
  <title>Transformation rapide et transformation lente — même état final, échelles de temps très différentes</title>
  <!--
    lente-rapide.svg — figure SCHÉMATIQUE (pas une courbe physique mesurée).

    Point pédagogique (R1) : une transformation "rapide" et une transformation
    "lente" ne sont pas deux natures différentes de réaction — les deux
    partent du même état initial (x = 0) et rejoignent le même état final
    (x_f, marqué par la ligne pointillée horizontale). Seule la DURÉE pour
    l'atteindre diffère, parfois considérablement.

    Exagération d'échelle assumée : le rapport réel des durées entre une
    transformation quasi instantanée (précipitation, combustion) et une
    transformation lente (minutes à années) peut atteindre plusieurs ordres
    de grandeur. Aucun axe linéaire ne peut représenter un tel rapport sans
    écraser une des deux courbes contre l'axe des ordonnées : l'axe des
    temps ici est donc un schéma qualitatif, PAS à l'échelle réelle. C'est
    explicitement assumé et rappelé en note permanente sous la figure (pas
    un spoiler pédagogique, une mise en garde de lecture du graphe — reste
    visible dès l'étape 1).

    Mise en étapes (LESSON-EXPERIENCE-SPEC §2.5 — graphe, donc toujours
    stagé, ordre canonique axes → données → lecture) :
      step-1 : les axes seuls (t, x, origine partagée) — chrome neutre.
      step-2 : les données — les deux courbes (rapide et lente) et leurs
               étiquettes directes.
      step-3 : la lecture — le repère d'état final commun x_f (ligne
               pointillée, tick, label) et les deux points d'arrivée qui
               PROUVENT que les deux transformations rejoignent la même
               valeur : l'idée centrale de la figure, révélée en dernier.
      (Note : la ligne pointillée x_f coïncide exactement, en x, avec le
      palier de la courbe "rapide" (y=70 de x=130 à x=610) — le renderer
      réinjecte step-3 en dernier enfant du SVG, donc le repère accent se
      peint par-dessus ce palier une fois l'étape 3 révélée. Même situation
      déjà acceptée dans quotient-vers-K.svg (l'asymptote K sur le palier
      de Qr(t)) : effet accepté, pas un défaut à corriger ici.)

    Géométrie (calculée, pas devinée) :
      origine (t=0, x=0)         : (x0,y0) = (80, 350)
      état final commun x_f      : y = 70              (hauteur pleine 280 px)
      largeur utile de l'axe t   : 530 px (x de 80 à 610)

      Transformation rapide : montée "ease-out" quadratique
        f(t) = 1 − (1 − t/t_r)²  sur t ∈ [0, t_r], t_r = 50 px,
        puis palier horizontal exact à x_f pour t > t_r (x > 130).
        → visuellement quasi verticale, puis plate sur ~90% de la largeur.

      Transformation lente : montée "ease-out" quadratique sur TOUTE la
        largeur disponible, g(t) = 1 − (1 − t/530)², échantillonnée tous
        les 20 px (même pas que decroissance-courbe.svg) de t=0 à t=530.
        g(0) = 0 et g(530) = 1 exactement : la courbe rejoint x_f pile au
        bord droit du cadre, après avoir occupé toute la durée représentée.

      Les deux courbes convergent donc, par construction, au même point
      (x = 610, y = 70) — la preuve visuelle qu'elles rejoignent le même
      état final.

    Rôle des couleurs :
      ligne pointillée x_f, son tick, son label, et les deux points
        d'arrivée sur cette ligne (état final PARTAGÉ, l'idée centrale
        de la figure) : --figure-accent
      courbe "rapide" : --figure-ink (trait plus épais)
      courbe "lente" : --figure-ink-soft (trait plus fin) — différenciées
        par teinte et épaisseur, pas par pointillé (le pointillé est
        réservé, dans cette figure, au repère d'état final)
      axes, labels d'axes, origine, légendes : --figure-ink-soft (chrome neutre)
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Transformation rapide et transformation lente — même état final
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="350" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Note d'échelle — permanente, chrome (pas de spoiler pédagogique) -->
  <text x="335" y="404" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">Écarts de durée non à l'échelle : une transformation « lente » peut prendre des minutes, des heures, voire bien plus.</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes (chrome neutre)
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- ── Axes — ink-soft, chrome neutre ───────────────────────── -->
    <line x1="80" y1="350" x2="610" y2="350"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="610,350 598,345.5 598,354.5" fill="var(--figure-ink-soft)"/>
    <line x1="80" y1="350" x2="80" y2="50"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,50 75.5,61 84.5,61" fill="var(--figure-ink-soft)"/>
    <text x="617" y="354" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="72" y="54" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">x</text>
    <text x="72" y="354" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>

    <!-- Origine partagée (les deux transformations démarrent du même x = 0) -->
    <circle cx="80" cy="350" r="2.6" fill="var(--figure-ink-soft)"/>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : les deux courbes
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Transformation lente — ink-soft, trait plus fin, ease-out sur toute la largeur -->
    <path d="
      M80,350
      L100,329.27 L120,309.33 L140,290.19 L160,271.85 L180,254.31
      L200,237.56 L220,221.61 L240,206.46 L260,192.11 L280,178.55
      L300,165.79 L320,153.83 L340,142.67 L360,132.30 L380,122.73
      L400,113.96 L420,105.99 L440,98.81 L460,92.43 L480,86.85
      L500,82.06 L520,78.08 L540,74.89 L560,72.49 L580,70.90
      L600,70.10 L610,70.00
    " fill="none"
      stroke="var(--figure-ink-soft)"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Transformation rapide — ink, trait plus épais, quasi verticale puis palier -->
    <path d="
      M80,350
      L90,249.2 L100,170.8 L110,114.8 L120,81.2 L130,70
      L610,70
    " fill="none"
      stroke="var(--figure-ink)"
      stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Labels des courbes — posés au plus près de ce qu'ils nomment -->
    <text x="260" y="55" text-anchor="middle" font-size="11.5"
          fill="var(--figure-ink)">transformation rapide</text>

    <text x="310" y="150" text-anchor="start" font-size="11.5"
          fill="var(--figure-ink-soft)">transformation lente</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : le repère d'état final commun x_f
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="80" y1="70" x2="610" y2="70"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="76" y1="70" x2="84" y2="70"
          stroke="var(--figure-accent)" stroke-width="1.2"/>
    <text x="70" y="74" text-anchor="end" font-size="10.5" font-style="italic"
          fill="var(--figure-accent)">x<tspan dy="3" font-size="7.5">f</tspan></text>

    <!-- Points d'arrivée sur le palier x_f partagé — accent -->
    <circle cx="130" cy="70" r="3.2" fill="var(--figure-accent)"/>
    <circle cx="610" cy="70" r="3.2" fill="var(--figure-accent)"/>
  </g><!-- /step-3 -->

</svg>
