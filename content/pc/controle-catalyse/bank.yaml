        part: "2-5 — Rendement : rien à recalculer"
        stem: |-
          **2-5.** (0,5 pt) Calculer le rendement de la réaction pour le cas de l'expérience $(3)$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est la définition du rendement établie au chapitre 2 de ce chapitre : $\eta = \dfrac{n_{obtenu}}{n_{max}}$, où $n_{max}$ est la quantité qu'on obtiendrait si la réaction était **totale**.

          **$n_{max}$, le mélange étant équimolaire.** Les deux réactifs sont introduits en quantités égales, $0{,}200\ \text{mol}$ chacun (mélange équimolaire, comme dans l'exemple travaillé du chapitre 2) : si la réaction allait jusqu'au bout, les deux réactifs s'épuiseraient exactement ensemble, à $x_{max} = 200\ \text{mmol}$.

          **$n_{obtenu}$, l'avancement réellement atteint par l'expérience (3).** C'est $x_f$ — et la question 2-3 vient de démontrer que le catalyseur **ne change pas** l'état final : $x_f(3) = x_f(2) \approx 133\ \text{mmol}$ (question 2-4). Aucun nouveau calcul n'est nécessaire ici : c'est exactement la même valeur, pas une nouvelle lecture graphique.

          **Le calcul.**

          $$\eta = \frac{x_f}{x_{max}} = \frac{133}{200} = 0{,}665$$

          $$\boxed{\eta \approx 66{,}5\,\% \approx 67\,\%}$$

          **Ce que ce nombre confirme.** Compare avec l'exemple du chapitre 2 : changer l'acide pour son anhydride faisait passer le rendement de $67\,\%$ à $100\,\%$ — un vrai gain, parce que ce levier change l'état final lui-même. Ici, ajouter un catalyseur laisse le rendement **inchangé** par rapport à l'expérience (2) sans catalyseur (qui donnerait, par le même calcul, exactement le même $67\,\%$) : le catalyseur fait gagner du temps, jamais du rendement. Les deux leviers du chapitre ne se ressemblent pas, et cette question le vérifie sur des nombres, pas seulement sur une phrase apprise.

          **Le piège nommé de cette question.** Chercher à recalculer $x_f(3)$ comme s'il fallait une nouvelle lecture graphique propre à l'expérience (3) : c'est inutile, puisque la question 2-3 a établi que $x_f$ est commun aux trois expériences — on réutilise directement la valeur déjà lue en 2-4, on ne relit pas le graphe une seconde fois.
        steps:
          - math: 'x_{max} = 200\ \text{mmol}'
            note: "Mélange équimolaire (0,200 mol de chaque réactif) : réaction totale hypothétique."
          - math: 'x_f(3) = x_f(2) \approx 133\ \text{mmol}'
            note: "Le catalyseur ne change pas l'état final (question 2-3) : même valeur qu'en 2-4."
          - math: '\eta = \frac{133}{200} = 0{,}665'
