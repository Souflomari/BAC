    intro: |-
      **Suivi cinétique d'une réaction d'estérification (examen national, session normale 2025 — Exercice 1, Partie 2, 3,25 points).**

      *Cet exercice de 7 points comporte aussi une Partie 1 — un dosage acido-basique de l'hydrogénosulfite de sodium — traitée à part, sous la notion « Réactions acido-basiques ». Les deux parties sont indépendantes ; rien de ce qui suit n'en dépend.*

      On étudie la cinétique de la réaction entre l'acide éthanoïque $CH_3COOH$ et le propan-1-ol $C_2H_5CH_2OH$. On réalise cette estérification dans différentes conditions expérimentales :

      - **Expérience (1) :** On mélange $0{,}200\ \text{mol}$ d'acide éthanoïque avec $0{,}200\ \text{mol}$ du propan-1-ol à la température $\theta_1$.
      - **Expérience (2) :** On mélange $0{,}200\ \text{mol}$ d'acide éthanoïque avec $0{,}200\ \text{mol}$ du propan-1-ol à la température $\theta_2$ avec $\theta_2 > \theta_1$.
      - **Expérience (3) :** On mélange $0{,}200\ \text{mol}$ d'acide éthanoïque avec $0{,}200\ \text{mol}$ du propan-1-ol à la température $\theta_2$ avec ajout de quelques gouttes d'acide sulfurique concentré.

      Les courbes de la figure ci-contre représentent l'évolution temporelle de l'avancement $x$ de la réaction qui se produit pour chaque condition expérimentale.

      *Figure (courbes) :* axe des ordonnées $x\ (\text{mmol})$ gradué à $26{,}6$ et $53{,}2$ ; axe des abscisses $t\ (\text{min})$ gradué à $30$ et $60$. Trois courbes croissantes partant de l'origine vers un palier : **Courbe (a)** la plus rapide (atteint son palier le plus tôt), **Courbe (b)** intermédiaire, **Courbe (c)** la plus lente. Les paliers de $(a)$ et $(b)$ sont au même niveau haut ; celui de $(c)$ semble légèrement inférieur *(lecture d'échelle à confirmer sur le corrigé)*. Interprétation attendue : l'expérience $(3)$ (catalyseur, $\theta_2$) correspond à la courbe la plus rapide.
    questions:
      - id: q1
        part: "2-1 — Écrire et nommer la réaction étudiée"
        stem: |-
          **2-1.** (0,75 pt) Écrire, en utilisant les formules semi-développées, l'équation modélisant la réaction d'estérification qui se produit. Donner le nom de l'ester $(E)$ formé.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux réactifs sont donnés : un acide carboxylique, l'acide éthanoïque $CH_3COOH$, et un alcool, le propan-1-ol $C_2H_5CH_2OH$ (soit $CH_3-CH_2-CH_2-OH$ : trois carbones, groupe $-OH$ sur le premier). C'est une réaction d'**estérification**, dans sa version ordinaire — acide + alcool, sans passer par un anhydride — présentée au chapitre 1 de ce chapitre (le parfumeur) et construite en détail dans la notion **« Estérification et hydrolyse »** (chapitre 2) : l'équation générale s'écrit $R-COOH + R'-OH \rightleftharpoons R-COO-R' + H_2O$, avec une **double flèche**, parce que cette réaction est **lente et limitée** — pas totale.

          Ce détail de la flèche est le premier piège de la question, et il pèse sur tout le reste de l'exercice : si on écrivait une flèche simple, comme au chapitre 2 de CE chapitre-ci (celui de l'anhydride d'acide), on changerait silencieusement la nature de la réaction étudiée. Or les trois expériences de l'énoncé n'ont de sens QUE parce que la réaction est limitée : c'est précisément parce qu'un équilibre s'installe, à une vitesse qui dépend des conditions, que la comparaison entre température et catalyseur (questions suivantes) devient intéressante.

          **L'équation, en formules semi-développées.**

          $$CH_3-COOH + CH_3-CH_2-CH_2-OH \rightleftharpoons CH_3-CO-O-CH_2-CH_2-CH_3 + H_2O$$

          **Nommer l'ester, groupe par groupe (règle établie dans « Estérification et hydrolyse », chapitre 2).** Le nom d'un ester recopie, dans l'ordre, le radical de l'acide (terminaison « -oïque » remplacée par « -oate ») puis « de » suivi du radical de l'alcool (terminaison « -yle »). Ici : l'acide éthanoïque donne « éthanoate » ; le propan-1-ol, une chaîne carbonée linéaire à trois carbones fixée par son extrémité, donne « propyle ». L'ester $(E)$, $CH_3-CO-O-CH_2-CH_2-CH_3$, s'appelle donc :

          $$\boxed{(E) = \text{éthanoate de propyle}}$$

          **Le piège nommé de cette question.** Écrire une flèche simple au lieu d'une double flèche — en confondant cette estérification ordinaire (acide éthanoïque + alcool, limitée) avec la voie de l'anhydride du chapitre 2 de ce chapitre (rapide et totale, elle). Rien dans cet énoncé ne mentionne un anhydride : les trois expériences utilisent bien l'acide éthanoïque lui-même.
      - id: q2
        part: "2-2 — Isoler l'effet de chaque facteur cinétique sur les courbes"
        stem: |-
          **2-2.** (0,5 pt) Indiquer, en justifiant, la courbe correspondant à l'expérience $(3)$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Trois courbes, trois expériences — mais on ne compare jamais les trois d'un bloc : on isole un facteur à la fois, **toutes choses égales par ailleurs**, exactement comme au chapitre 3 de ce chapitre.

          **Premier couple isolé : expériences (1) et (2).** Elles partent des mêmes quantités ($0{,}200\ \text{mol}$ de chaque réactif), sans catalyseur dans les deux cas — la SEULE différence est la température : $\theta_2 > \theta_1$. La température est un facteur cinétique (chapitre 3, qui la cite explicitement aux côtés du catalyseur) : l'expérience (2), plus chaude, est donc **plus rapide** que l'expérience (1).

          **Second couple isolé : expériences (2) et (3).** Elles partent des mêmes quantités, à la MÊME température $\theta_2$ — la seule différence est l'ajout, en (3), de quelques gouttes d'acide sulfurique concentré, un **catalyseur** (chapitre 3 : rôle accélérateur). L'expérience (3) est donc **plus rapide** que l'expérience (2).

          **Le classement complet.** En chaînant les deux comparaisons, chacune n'isolant qu'un seul facteur : $(3)$ cumule les deux leviers accélérateurs (température $\theta_2$ ET catalyseur) — elle est la plus rapide des trois. $(2)$ ne bénéficie que de la température — vitesse intermédiaire. $(1)$ ne bénéficie d'aucun des deux — la plus lente.

          $$\text{vitesse\,: } (3) > (2) > (1)$$

          Sur la figure, la courbe la plus rapide est celle qui atteint son palier le plus tôt : c'est la **courbe (a)**.

          $$\boxed{\text{Expérience } (3) \longleftrightarrow \text{courbe (a)}}$$

          (Par la même logique, la courbe (b), intermédiaire, correspond à l'expérience (2), et la courbe (c), la plus lente, à l'expérience (1) — un classement qu'on réutilise aux questions suivantes.)

          **Le piège nommé de cette question.** Ne pas comparer les trois expériences d'un bloc, sur la seule impression que « il y a un catalyseur donc c'est forcément la courbe la plus rapide ». C'est vrai ICI, mais seulement parce que le raisonnement toutes-choses-égales-par-ailleurs, mené sur les DEUX paires d'expériences qui ne diffèrent chacune que par un seul facteur, le confirme — pas parce qu'un catalyseur serait visuellement reconnaissable sur un graphe.
      - id: q3
        part: "2-3 — Ce qu'un facteur cinétique ne change jamais"
        stem: |-
          **2-3.** (0,75 pt) Répondre, en justifiant, par vrai ou faux à l'affirmation suivante : « La valeur de l'avancement final $x_f$ de la réaction sera la même pour les trois conditions expérimentales ».
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est le résultat le plus contre-intuitif du chapitre (chapitre 3) : un facteur qui accélère une réaction ne la fait pas nécessairement finir ailleurs. Il faut le vérifier séparément pour CHACUN des deux facteurs en jeu ici — le catalyseur, et la température — parce que rien ne garantit a priori qu'ils se comportent de la même façon vis-à-vis de l'état final.

          **Le catalyseur (expériences (2) et (3), même température $\theta_2$).** le chapitre 3 le démontre : un catalyseur multiplie la vitesse directe ET la vitesse inverse par le **même facteur** $\alpha$. La condition d'équilibre $v_{directe} = v_{inverse}$ devient $\alpha\,v_{directe} = \alpha\,v_{inverse}$ — la même égalité, vérifiée pour le même rapport de concentrations, donc pour le même $K$. Le catalyseur ne fait que faire converger le système plus vite vers ce même état : $x_f(2) = x_f(3)$.

          **La température (expériences (1) et (2), même absence de catalyseur, $\theta_1 \ne \theta_2$).** Ici, l'argument du catalyseur ne suffit plus — la température change en général la constante d'équilibre $K$ d'une réaction (notion **« État d'équilibre d'un système chimique »**). Mais l'estérification a une propriété particulière, établie dans la notion **« Estérification et hydrolyse »** (chapitre 5, « Accélérer sans déplacer ») : c'est une réaction **quasi athermique**, dont l'effet thermique est presque négligeable. Une réaction quasi athermique a une constante d'équilibre $K$ qui varie à peine avec la température : chauffer accélère les deux sens à la fois (comme le ferait un catalyseur, mais par un mécanisme différent), sans quasiment déplacer où l'équilibre se situe. Donc $x_f(1) \approx x_f(2)$ également.

          **Conclusion.**

          $$\boxed{\text{VRAI}}$$

          $x_f$ est, à très bonne approximation, la même pour les trois conditions : le catalyseur ne la change jamais (argument général, chapitre 3), et la température ne la change quasiment pas ici parce que l'estérification est quasi athermique (argument propre à cette famille de réactions). C'est cohérent avec la figure : les paliers des courbes (a) et (b) coïncident, exactement ce que prédit l'argument du catalyseur. Le palier de la courbe (c) « semble légèrement inférieur » d'après la description du graphe — mais avec l'argument de l'athermicité, l'attendu est plutôt un palier quasi identique aux deux autres : cet écart visible est donc plus probablement un artefact de lecture ou de tracé qu'un véritable déplacement d'équilibre, exactement ce que suggère la mention « lecture d'échelle à confirmer » qui accompagne cette observation sur la figure.

          **Le piège nommé de cette question.** Confondre « la température et le catalyseur accélèrent la réaction » avec « ils changent forcément où elle finit ». Ce sont deux affirmations indépendantes : un facteur cinétique peut très bien accélérer sans jamais déplacer l'état final — c'est exactement le cas ici, pour les deux facteurs en jeu, et c'est ce résultat qu'il faut savoir démontrer, pas seulement réciter.
      - id: q4
        part: "2-4 — Lire un temps de demi-réaction sur la bonne courbe"
        stem: |-
