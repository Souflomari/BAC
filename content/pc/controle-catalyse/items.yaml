        feedback: >
          La différence de nature chimique ne suffit pas à rendre une
          catalyse hétérogène — TOUS les catalyseurs sont des espèces
          différentes des réactifs. Ce qui compte, c'est la phase : ici,
          $H_2SO_4$ est dissous dans le même mélange liquide que les
          réactifs.
      - id: B
        text: "Enzymatique, car l'acide sulfurique joue le rôle d'un catalyseur biologique dans cette réaction organique."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyse-classee-hors-phase
        feedback: >
          Une catalyse enzymatique exige un catalyseur BIOLOGIQUE (une
          protéine, une enzyme) — pas simplement une réaction sur des
          espèces organiques. $H_2SO_4$ est un acide minéral, pas une
          enzyme.
      - id: C
        text: "On ne peut pas classer cette catalyse sans connaître la concentration de l'acide sulfurique utilisé."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyse-classee-hors-phase
        feedback: >
          Le classement homogène/hétérogène ne dépend jamais de la
          concentration ou de la quantité de catalyseur, seulement de sa
          phase par rapport à celle des réactifs.
      - id: D
        text: "Homogène : l'acide sulfurique est dissous dans le même mélange liquide que les réactifs organiques — même phase."
        correct: true
    correct_feedback: >
      $H_2SO_4$ est dissous dans le même mélange liquide que l'acide
      éthanoïque et l'éthanol : même phase, donc catalyse homogène — la
      nature minérale de l'acide n'entre pas en jeu dans ce classement.
    solution: |
      Le critère homogène/hétérogène porte uniquement sur la phase du
      catalyseur par rapport à celle des réactifs. Ici, $H_2SO_4$ est
      dissous dans le même liquide que les espèces organiques : catalyse
      homogène — exactement comme les ions $Fe^{3+}$ dans le mélange
      peroxodisulfate/iodure.

  # ── R4 : totale ≠ rapide (vitesse et avancement, encore) ─────────────────
  - id: CTC-15
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      Un élève affirme : « La saponification est totale, donc elle doit
      forcément être rapide. » Cette affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: "Vrai : une réaction totale va nécessairement plus vite qu'une réaction limitée, puisqu'aucune réaction inverse ne vient la ralentir tout au long de son déroulement."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.vitesse-avancement-confondus
        feedback: >
          Rien n'impose ce lien. La saponification est un contre-exemple
          direct : elle est totale, mais lente (elle nécessite souvent un
          chauffage à reflux prolongé). L'absence de réaction inverse fixe
          l'avancement final, pas la vitesse.
      - id: B
        text: "Faux : la saponification est lente (chauffage à reflux prolongé) mais totale — l'avancement final ne dit jamais rien de la vitesse, ce sont deux propriétés indépendantes."
        correct: true
      - id: C
        text: "Vrai, car dans une réaction totale le catalyseur agit forcément plus efficacement que dans une réaction qui s'arrête avant son terme."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.vitesse-avancement-confondus
        feedback: >
          Il n'y a pas de catalyseur en jeu dans la saponification : la
          soude, $HO^-$, est un RÉACTIF (consommé), pas un catalyseur. La
          totalité de la réaction vient de l'absence de réaction inverse
          (le carboxylate ne se réestérifie pas), pas d'un quelconque
          catalyseur.
      - id: D
        text: "Faux : c'est en réalité l'inverse, une réaction totale est toujours plus lente qu'une réaction limitée, qui atteint son état final plus tôt."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.vitesse-avancement-confondus
        feedback: >
          C'est encore lier vitesse et avancement, mais dans l'autre sens.
          Les deux propriétés restent indépendantes : rien n'impose qu'une
          réaction totale soit plus lente (l'anhydride + alcool du chapitre 2 est
          rapide ET totale).
    correct_feedback: >
      La saponification est lente mais totale : « lente » décrit la
      vitesse, « totale » décrit l'avancement final — deux propriétés
      indépendantes, comme le rappelle le tableau récapitulatif du chapitre 6.
    solution: |
      Rien ne relie nécessairement vitesse et avancement final. La
      saponification est lente (chauffage à reflux prolongé) car elle
      requiert une activation thermique importante, mais totale car le
      carboxylate formé ne se réestérifie jamais. À l'inverse, la réaction
      anhydride + alcool du chapitre 2 est rapide ET totale : les deux propriétés
      varient bien indépendamment l'une de l'autre.

  # ── R5 : intégratif — anhydride vs acide catalysé, valeurs neuves ────────
  - id: CTC-16
    rung: "R5"
    difficulty_level: 5
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      On veut synthétiser du propanoate d'éthyle. Voie 1 : anhydride
      propanoïque $(C_2H_5CO)_2O$, en excès, avec $n_0 = 0{,}60\ \text{mol}$
      d'éthanol. Voie 2 : acide propanoïque et éthanol en quantités égales
      ($0{,}60\ \text{mol}$ chacun), avec quelques gouttes d'acide
      sulfurique comme catalyseur (on admet le même $\tau \approx 2/3$ que
      pour l'acide éthanoïque). Quelle affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: "La voie 1 donne $n(\\text{ester}) = 0{,}60\\ \\text{mol}$ ($\\eta = 100\\,\\%$) ; la voie 2 plafonne à $n(\\text{ester}) \\approx 0{,}40\\ \\text{mol}$ ($\\eta \\approx 67\\,\\%$) : le catalyseur accélère la voie 2 sans jamais combler l'écart de rendement avec la voie 1."
        correct: true
      - id: B
        text: "Les deux voies donnent finalement $0{,}60\\ \\text{mol}$ d'ester, car le catalyseur de la voie 2 finit par compenser entièrement l'absence d'anhydride."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyseur-deplace-etat-final
        feedback: >
          Un catalyseur accélère l'estérification et l'hydrolyse dans les
          mêmes proportions : il ne peut jamais faire dépasser à la voie 2
          son plafond d'équilibre $\tau \approx 2/3$, quelle que soit la
          quantité de catalyseur ajoutée.
      - id: C
        text: "La voie 1 est plus lente que la voie 2, car une réaction catalysée va toujours plus vite qu'une réaction conduite sans catalyseur."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.vitesse-avancement-confondus
        feedback: >
          C'est confondre catalyseur et réactif plus réactif. La voie 1 est
          rapide grâce à la réactivité intrinsèque de l'anhydride, sans
          aucun catalyseur — ce n'est pas une règle générale qu'une réaction
          catalysée batte toujours une réaction sans catalyseur.
      - id: D
        text: "Les deux voies plafonnent à $0{,}40\\ \\text{mol}$ d'ester, car $0{,}60\\ \\text{mol}$ d'éthanol ne peut jamais réagir en totalité, quel que soit le réactif choisi en face et quelle que soit la durée.
        Changer le réactif en excès ne modifierait donc jamais le rendement."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.anhydride-mal-compris
        feedback: >
          Le plafond $\tau \approx 2/3$ n'est pas universel : il est propre
          à l'équilibre acide + alcool. La voie de l'anhydride n'a pas cet
          équilibre (une seule flèche) et atteint $\tau = 1$.
    correct_feedback: >
      Changer de réactif (voie 1) rend la réaction totale ; ajouter un
      catalyseur (voie 2) ne fait qu'accélérer l'arrivée au même équilibre
      limité — deux leviers différents, aux effets différents.
    solution: |
      **Voie 1 :** $(C_2H_5CO)_2O + C_2H_5OH \rightarrow
      CH_3CH_2COOC_2H_5 + C_2H_5COOH$ — totale, donc $n(\text{ester}) =
      0{,}60\ \text{mol}$, $\eta = 100\,\%$.

      **Voie 2 :** équilibre acide + alcool, $\tau \approx 2/3$, donc
      $n(\text{ester}) \approx \tfrac{2}{3}\times 0{,}60 = 0{,}40\ \text{mol}$,
      $\eta \approx 67\,\%$ — le catalyseur ne change que le temps pour y
      arriver, jamais cette valeur.

  # ── R5 : intégratif — stœchiométrie de saponification + amphiphile ───────
  - id: CTC-17
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      On saponifie $n = 0{,}050\ \text{mol}$ d'un corps gras (triglycéride)
      par de la soude en excès, libérant l'ion palmitate
      $C_{15}H_{31}-COO^-$. Quelle quantité minimale d'ions $HO^-$ faut-il
      pour une saponification totale, et quelle est la partie hydrophobe de
      l'ion palmitate obtenu ?
    type: mcq
    choices:
      - id: A
        text: "$n = 0{,}050\\ \\text{mol}$ d'ions $HO^-$, car un triglycéride ne compte qu'une seule fonction ester à hydrolyser."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.stoechiometrie-du-triglyceride-ignoree
        feedback: >
          Un triglycéride est un TRIester : il porte trois fonctions ester,
          chacune hydrolysée par un ion $HO^-$. Il en faut donc $3n$, pas
          $n$.
      - id: B
        text: "$6n = 0{,}30\\ \\text{mol}$ d'ions $HO^-$, car chaque fonction ester nécessite deux ions $HO^-$ pour être hydrolysée."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.stoechiometrie-du-triglyceride-ignoree
        feedback: >
          L'hydrolyse d'une seule fonction ester ne consomme qu'UN ion
          $HO^-$ : $R-CO-O-R' + HO^- \rightarrow R-COO^- + R'-OH$. Avec
          trois fonctions ester, il en faut $3n$, pas $6n$.
      - id: C
        text: "$3n = 0{,}15\\ \\text{mol}$ d'ions $HO^-$ ; la partie hydrophobe est la longue chaîne carbonée $C_{15}H_{31}$."
        correct: true
      - id: D
        text: "$3n = 0{,}15\\ \\text{mol}$ d'ions $HO^-$, mais la partie hydrophobe est la tête $-COO^-$, car elle porte la charge la plus grande."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.hydrophile-hydrophobe-inverses
        feedback: >
          La stœchiométrie est correcte, mais le classement hydrophile /
          hydrophobe est inversé. C'est la tête CHARGÉE $-COO^-$ qui est
          attirée par l'eau (hydrophile) ; c'est la longue chaîne carbonée
          NEUTRE qui fuit l'eau (hydrophobe) — le critère est la charge, pas
          sa « grandeur ».
    correct_feedback: >
      Trois fonctions ester par triglycéride $\Rightarrow 3n = 0{,}15\
      \text{mol}$ de $HO^-$. Sur l'ion palmitate, la tête chargée $-COO^-$
      est hydrophile, la longue chaîne carbonée $C_{15}H_{31}$ est
      hydrophobe.
    solution: |
      $$
      C_3H_5(O-CO-C_{15}H_{31})_3 + 3\,HO^- \rightarrow
      3\,C_{15}H_{31}-COO^- + C_3H_5(OH)_3
      $$
      Il faut $3n = 3 \times 0{,}050 = 0{,}15\ \text{mol}$ d'ions $HO^-$
      pour hydrolyser les trois fonctions ester. Sur l'ion obtenu, la tête
      $-COO^-$, chargée, est hydrophile ; la chaîne $C_{15}H_{31}$, neutre,
      est hydrophobe.

  # ── R5 : intégratif — quel levier atteint réellement 100 % ? (capstone) ──
  - id: CTC-18
    rung: "R5"
    difficulty_level: 5
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      Un chimiste industriel part d'une synthèse d'ester lente et limitée
      (acide + alcool, $\tau \approx 2/3$). Parmi les quatre modifications
      suivantes, laquelle, seule, permet d'atteindre un rendement de
      $100\,\%$ ?
    type: mcq
    choices:
      - id: A
        text: "Ajouter davantage de catalyseur acide au mélange."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyseur-deplace-etat-final
        feedback: >
          Un catalyseur, quelle que soit sa quantité, accélère
          l'estérification et l'hydrolyse dans les mêmes proportions : il
          ne change ni $K$ ni le rendement à l'équilibre, seulement le temps
          pour l'atteindre.
      - id: B
        text: "Remplacer le catalyseur homogène ($H_2SO_4$) par un catalyseur hétérogène solide."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyse-classee-hors-phase
        feedback: >
          Changer le TYPE de catalyseur (homogène vers hétérogène) reste un
          changement de catalyseur : ça ne modifie que la vitesse à laquelle
          on rejoint l'équilibre, jamais sa position — quel que soit le type
          de catalyse employé.
      - id: C
        text: "Augmenter la sélectivité du catalyseur utilisé."
        correct: false
        misconception: mc.physics.pc_controle_catalyse.selectivite-du-catalyseur-ignoree
        feedback: >
          La sélectivité choisit LAQUELLE réaction un catalyseur accélère
          parmi plusieurs concurrentes ; ici il n'y a qu'une seule réaction
          en jeu (estérification/hydrolyse). Ce levier ne change pas
          l'avancement final d'un équilibre déjà fixé.
      - id: D
        text: "Remplacer l'acide carboxylique par son anhydride d'acide correspondant."
        correct: true
    correct_feedback: >
      Seul un changement de RÉACTIF (l'anhydride, sans équilibre à établir)
      élimine la réaction inverse et atteint $\tau = 1$. Aucun réglage sur le
      catalyseur — sa quantité, son type, sa sélectivité — ne peut déplacer
      l'état final d'un équilibre.
    solution: |
      Le chapitre distingue nettement deux familles de leviers : ceux qui
      changent l'ÉTAT FINAL (ici, seul le changement de réactif — passer à
      l'anhydride — supprime l'équilibre et ses $\tau \approx 2/3$) et ceux
      qui ne changent que la VITESSE (tout ce qui touche au catalyseur :
      quantité, type homogène/hétérogène, sélectivité). Seule la
      modification D agit sur le premier axe.

  # Ajoutés le 2026-09-05 : huit familles sous le plancher de 3 items du banc,
  # cinq à un item et trois à deux. Cinq items, treize places.
  - id: CTC-19
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    primary_misconception: mc.physics.pc_controle_catalyse.equation-de-lanhydride-erronee
    stem: >
      On estérifie l'éthanol par l'anhydride éthanoïque
      $(CH_3CO)_2O$. Quelle équation décrit correctement cette
      transformation ?
    type: mcq
    choices:
      - id: A
        text: >-
          $(CH_3CO)_2O + C_2H_5OH \rightarrow CH_3COOC_2H_5 + CH_3COOH$, avec
          une flèche simple
        correct: true
      - id: B
        text: >-
          $(CH_3CO)_2O + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + H_2O$,
          comme pour l'acide, avec formation d'eau
        correct: false
        misconception: mc.physics.pc_controle_catalyse.equation-de-lanhydride-erronee
        feedback: >
          C'est l'équation de l'estérification par l'ACIDE, recopiée. Avec un
          anhydride, le sous-produit n'est pas de l'eau mais un acide
          carboxylique : $CH_3COOH$. Et c'est justement l'absence d'eau qui
          supprime l'hydrolyse — donc la limitation.
      - id: C
        text: >-
          $(CH_3CO)_2O + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + CH_3COOH$
          : la double flèche indique qu'on pourrait, en chauffant, inverser la
          réaction
        correct: false
        misconception: mc.physics.pc_controle_catalyse.double-fleche-mal-comprise
        feedback: >
          La double flèche ne signale ni une possibilité ni une condition : elle
          dit que les deux sens ont lieu SIMULTANÉMENT dans les conditions de
          l'expérience. Ici la transformation est totale, donc flèche simple —
          l'acide formé ne reconstitue pas l'anhydride.
      - id: D
        text: >-
          $(CH_3CO)_2O + C_2H_5OH + H^{+} \rightarrow CH_3COOC_2H_5 + CH_3COOH$,
          le catalyseur figurant parmi les réactifs
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyseur-dans-bilan
        feedback: >
          Un catalyseur est régénéré à la fin : il apparaît dans le mécanisme,
          jamais dans le bilan. L'écrire côté réactifs supposerait qu'il soit
          consommé — ce qui contredit sa définition, et fausserait tout calcul de
          quantité de matière. Il se note au-dessus de la flèche.
    correct_feedback: >
      $(CH_3CO)_2O + C_2H_5OH \rightarrow CH_3COOC_2H_5 + CH_3COOH$. Le
      sous-produit est un acide carboxylique, pas de l'eau : sans eau, pas
      d'hydrolyse, donc pas de limitation — d'où la flèche simple.
    solution: |
      **Ce que change le passage à l'anhydride.** L'estérification par l'acide
      produit de l'EAU, laquelle hydrolyse l'ester en retour : la transformation
      est limitée. L'anhydride produit un ACIDE CARBOXYLIQUE à la place :
      $$(CH_3CO)_2O + C_2H_5OH \rightarrow CH_3COOC_2H_5 + CH_3COOH$$
      Sans eau formée, la réaction inverse n'a pas lieu : la transformation est
      totale, et s'écrit avec une flèche simple.

      **Le catalyseur.** $H^{+}$ accélère la réaction et se retrouve intact à la
      fin. Il se note au-dessus de la flèche, jamais dans le bilan.

  - id: CTC-20
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    primary_misconception: mc.physics.pc_controle_catalyse.reactif-limitant-ou-pertes-invoques
    stem: >
      Une estérification par l'ACIDE, menée avec des quantités égales d'acide et
      d'alcool, plafonne à un rendement de $67\,\%$. Comment l'expliquer ?
    type: mcq
    choices:
      - id: A
        text: >-
          Par l'hydrolyse : l'eau formée reconvertit une partie de l'ester, et
          l'équilibre s'établit là où les deux réactions se compensent
        correct: true
      - id: B
        text: >-
          Par un défaut de réactif ou une perte matérielle : une partie de
          l'ester s'est évaporée, ou l'un des réactifs manquait
        correct: false
        misconception: mc.physics.pc_controle_catalyse.reactif-limitant-ou-pertes-invoques
        feedback: >
          Aucune de ces causes ne tient : les quantités sont égales, donc aucun
          réactif n'est limitant, et le plafond se reproduit à l'identique quelle
          que soit la propreté du montage. Un rendement REPRODUCTIBLE à
          $67\,\%$ n'est pas un accident de manipulation, c'est une propriété
          chimique — la position de l'équilibre.
      - id: C
        text: >-
          Par la double flèche : elle signifie qu'il faudrait chauffer davantage
          pour que la réaction directe l'emporte
        correct: false
        misconception: mc.physics.pc_controle_catalyse.double-fleche-mal-comprise
        feedback: >
          La double flèche décrit ce qui a lieu, pas ce qu'il faudrait faire.
          Chauffer accélère les DEUX sens également : on atteint l'équilibre plus
          vite, au même endroit. Ce qui déplacerait l'équilibre, c'est retirer un
          produit ou changer les proportions — pas la température seule.
      - id: D
        text: >-
          Par le catalyseur, qui est consommé au cours de la réaction et finit
          par manquer, comme le montre sa présence dans le bilan
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyseur-dans-bilan
        feedback: >
          Le catalyseur n'est pas consommé : il est régénéré à chaque cycle, et
          c'est pourquoi il n'apparaît pas dans le bilan. Une trace suffit pour
          des quantités molaires de réactifs. Et même absent, l'équilibre
          s'établirait au même endroit — simplement bien plus lentement.
    correct_feedback: >
      Le plafond vient de la réaction INVERSE. L'eau formée hydrolyse l'ester ;
      quand les deux vitesses s'égalisent, les quantités cessent de varier. Ce
      $67\,\%$ est reproductible parce qu'il est thermodynamique, pas
      accidentel.
    solution: |
      **Le test qui écarte les causes matérielles.** Le rendement est le même
      d'une expérience à l'autre, avec des quantités égales et sans perte
      décelable. Une cause accidentelle donnerait des valeurs dispersées.

      **La cause réelle.** L'estérification produit de l'eau ; l'eau hydrolyse
      l'ester. Les deux réactions coexistent, et l'état final est celui où elles
      se compensent :
      $$
      \tau_{\text{final}} \approx \frac{2}{3} \ \text{pour un mélange
      équimolaire acide + alcool primaire}
      $$

      **Ce qui déplacerait le plafond.** Changer les proportions (excès d'un
      réactif), retirer l'eau au fur et à mesure, ou passer à l'anhydride — qui
      supprime l'eau à la source. Pas le catalyseur, pas la durée, pas la
      température seule.

  - id: CTC-21
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_controle_catalyse
    tags: []
    primary_misconception: mc.physics.pc_controle_catalyse.saponification-confondue-avec-lesterification
    stem: >
      On chauffe un triglycéride avec une solution concentrée d'hydroxyde de
      sodium. Que produit cette transformation, et en quelle proportion ?
    type: mcq
    choices:
      - id: A
        text: >-
          Trois ions carboxylate et une molécule de glycérol par triglycéride,
          la transformation étant totale
        correct: true
      - id: B
        text: >-
          Trois acides gras et du glycérol, la réaction s'arrêtant à un
          équilibre comme l'estérification
        correct: false
        misconception: mc.physics.pc_controle_catalyse.saponification-confondue-avec-lesterification
        feedback: >
          L'hydrolyse BASIQUE ne donne pas l'acide mais sa base conjuguée : l'ion
          carboxylate, qui ne peut pas réagir avec l'alcool. C'est justement ce
          qui rend la saponification TOTALE, alors que l'hydrolyse acide, elle,
          est limitée. Le milieu basique n'est pas un détail — il change la
          nature du produit et le caractère de la transformation.
      - id: C
        text: >-
          Un seul ion carboxylate et un glycérol, un triglycéride ne comportant
          qu'une seule fonction ester
        correct: false
        misconception: mc.physics.pc_controle_catalyse.stoechiometrie-du-triglyceride-ignoree
        feedback: >
          « Tri- » compte les trois : un triglycéride est un triester du
          glycérol, qui porte trois fonctions alcool estérifiées. Il consomme
          donc trois ions $HO^{-}$ — un par fonction — et libère trois ions
          carboxylate.
      - id: D
        text: >-
          Trois ions carboxylate, dont la longue chaîne carbonée est hydrophile
          parce qu'elle est grande, et la tête $-COO^{-}$ hydrophobe
        correct: false
        misconception: mc.physics.pc_controle_catalyse.hydrophile-hydrophobe-inverses
        feedback: >
          Les deux caractères sont inversés. C'est la CHARGE qui décide de
          l'affinité pour l'eau, pas la taille : la tête $-COO^{-}$, ionique, est
          hydrophile ; la longue chaîne carbonée, apolaire, est hydrophobe. C'est
          cette double nature qui fait du savon un agent lavant.
    correct_feedback: >
      Un triglycéride porte trois fonctions ester : la saponification consomme
      trois ions $HO^{-}$ et libère trois ions carboxylate plus un glycérol. En
      milieu basique, le produit est l'ion carboxylate — pas l'acide — et c'est
      ce qui rend la transformation totale.
    solution: |
      **L'équation.**
      $$
      \text{triglycéride} + 3\,HO^{-} \rightarrow 3\,R\!-\!COO^{-}
      + \text{glycérol}
      $$

      **Pourquoi elle est totale.** L'ion carboxylate $R\!-\!COO^{-}$ est la
      base conjuguée de l'acide gras : il ne réagit pas avec le glycérol pour
      reformer l'ester. La réaction inverse est donc supprimée, alors que
      l'hydrolyse en milieu acide, qui donne l'acide lui-même, reste limitée.

      **La stœchiométrie.** Trois fonctions ester, trois ions hydroxyde, trois
      carboxylates — un par fonction.

      **Le savon.** L'ion carboxylate a une tête ionique $-COO^{-}$, hydrophile,
      et une longue queue carbonée apolaire, hydrophobe. C'est cette double
      affinité qui lui permet d'emprisonner les graisses dans l'eau.

  - id: CTC-22
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    primary_misconception: mc.physics.pc_controle_catalyse.stoechiometrie-du-triglyceride-ignoree
    stem: >
      On veut saponifier $0{,}10\ \text{mol}$ de triglycéride. Quelle quantité
      minimale d'ions hydroxyde faut-il introduire ?
    type: mcq
    choices:
      - id: A
        text: >-
          $0{,}30\ \text{mol}$ : un triglycéride porte trois fonctions ester, et
          chacune consomme exactement un ion $HO^{-}$
        correct: true
      - id: B
        text: >-
          $0{,}60\ \text{mol}$ : il faut deux ions $HO^{-}$ par fonction ester,
          l'un pour couper la liaison et l'autre pour neutraliser l'acide formé
        correct: false
        misconception: mc.physics.pc_controle_catalyse.stoechiometrie-du-triglyceride-ignoree
        feedback: >
          Un seul ion $HO^{-}$ par fonction suffit : il n'y a pas deux étapes à
          payer séparément. La saponification donne directement le
            carboxylate : aucun acide libre n'est formé, qu'il faudrait ensuite
            neutraliser. Le compte est donc $3 \times 0{,}10 = 0{,}30\ \text{mol}$.
      - id: C
        text: >-
          $0{,}10\ \text{mol}$ : la réaction étant un équilibre, un défaut d'ions
          hydroxyde se rattrape par un excès de durée
        correct: false
        misconception: mc.physics.pc_controle_catalyse.saponification-confondue-avec-lesterification
        feedback: >
          La saponification n'est pas un équilibre : elle est TOTALE, parce que
          l'ion carboxylate formé ne peut pas reformer l'ester. Et aucune durée
          ne compense un réactif manquant : avec $0{,}10\ \text{mol}$ d'ions
          hydroxyde, seule une fonction ester sur trois serait saponifiée, quel
          que soit le temps accordé.
      - id: D
        text: >-
          $0{,}30\ \text{mol}$, mais il faut y ajouter le catalyseur, qui
          accélère nécessairement toutes les réactions du milieu
        correct: false
        misconception: mc.physics.pc_controle_catalyse.selectivite-du-catalyseur-ignoree
        feedback: >
          Deux erreurs. La saponification n'a pas besoin de catalyseur — l'ion
          hydroxyde est un réactif, pas un catalyseur. Et un catalyseur n'agit
          pas partout à la fois : il est SÉLECTIF, il accélère une voie
          particulière, ce qui est justement son intérêt quand plusieurs
          réactions sont possibles.
    correct_feedback: >
      $0{,}30\ \text{mol}$. Un triglycéride porte trois fonctions ester, et
      chacune consomme exactement un ion $HO^{-}$ pour donner un ion carboxylate.
    solution: |
      **Le bilan.**
      $$
      \text{triglycéride} + 3\,HO^{-} \rightarrow 3\,R\!-\!COO^{-}
      + \text{glycérol}
      $$
      $$
      n(HO^{-}) = 3 \times n(\text{triglycéride}) = 3 \times 0{,}10
      = 0{,}30\ \text{mol}
      $$

      **Pourquoi un seul $HO^{-}$ par fonction.** La saponification transforme
        directement chaque fonction ester en carboxylate. Aucun acide libre n'apparaît qu'il faudrait ensuite
      neutraliser.

      **En pratique** on introduit un excès d'hydroxyde, pour compenser
      l'imprécision des masses et accélérer la transformation — mais le minimum
      stœchiométrique reste $0{,}30\ \text{mol}$.

  - id: CTC-23
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    primary_misconception: mc.physics.pc_controle_catalyse.selectivite-du-catalyseur-ignoree
    stem: >
      Dans un mélange où deux transformations sont possibles, on introduit un
      catalyseur qui n'accélère que la première. Que peut-on en dire ?
    type: mcq
    choices:
      - id: A
        text: >-
          Que la sélectivité est justement l'intérêt du catalyseur : il oriente
          le mélange vers un produit en accélérant une voie, sans empêcher
          l'autre
        correct: true
      - id: B
        text: >-
          Que c'est impossible : un catalyseur accélère nécessairement toutes les
          réactions du milieu, faute de quoi il ne serait pas un catalyseur
        correct: false
        misconception: mc.physics.pc_controle_catalyse.selectivite-du-catalyseur-ignoree
        feedback: >
          Un catalyseur accélère UNE transformation précise, parce qu'il agit avec des
            réactifs déterminés. Il n'a aucune raison d'agir sur une autre transformation.
          Les enzymes poussent cette sélectivité à l'extrême : une enzyme, un
          substrat.
      - id: C
        text: >-
          Qu'il bloque la seconde voie en consommant ses réactifs, ce qui
          explique qu'un seul produit se forme
        correct: false
        misconception: mc.physics.pc_controle_catalyse.selectivite-du-catalyseur-ignoree
        feedback: >
          Un catalyseur ne consomme rien : il est régénéré. Il n'empêche donc pas
          la seconde transformation, qui continue à sa propre vitesse — plus
          lente. Ce qu'on obtient est une orientation, pas un blocage : le
          produit majoritaire est celui de la voie accélérée.
      - id: D
        text: >-
          Qu'il faut alors le faire figurer dans le bilan de la première
          réaction, puisqu'il en modifie le déroulement
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyseur-dans-bilan
        feedback: >
          Modifier le déroulement n'est pas être consommé. Le catalyseur entre
          dans le mécanisme puis en ressort intact : il ne figure jamais dans le
          bilan, où l'on n'écrit que ce qui disparaît et ce qui apparaît. Sa
          présence se note au-dessus de la flèche.
    correct_feedback: >
      La sélectivité est l'intérêt même du catalyseur : accélérer UNE voie parmi
      plusieurs, ce qui oriente le mélange vers le produit voulu. Il n'empêche
      pas l'autre transformation — il la laisse simplement loin derrière.
    solution: |
      **Comment un catalyseur agit.** Il accélère la transformation en agissant avec
        des réactifs DÉTERMINÉS. Cette spécificité est structurelle : il n'a aucune prise sur
      une transformation dont les réactifs ne l'engagent pas.

      **Ce que la sélectivité permet.** Orienter un mélange. En chimie
      industrielle comme en biologie, c'est ce qui rend une synthèse praticable :
      on n'empêche pas les autres réactions, on rend la voie utile beaucoup plus
      rapide.

      **Ce qu'un catalyseur ne fait jamais.** Il ne se consomme pas, ne figure
      pas dans le bilan, et ne déplace pas l'état d'équilibre — il ne change que
      la VITESSE à laquelle on l'atteint.

  - id: CTC-24
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    primary_misconception: mc.physics.pc_controle_catalyse.equation-de-lanhydride-erronee
    stem: >
      Pourquoi l'estérification par l'anhydride d'acide donne-t-elle un
      rendement bien supérieur à celle qui part de l'acide carboxylique ?
    type: mcq
    choices:
      - id: A
        text: >-
          Parce que son sous-produit est un acide carboxylique et non de l'eau :
          sans eau, l'hydrolyse de l'ester n'a pas lieu
        correct: true
      - id: B
        text: >-
          Parce que l'anhydride est plus réactif : l'équation reste la même —
          ester et eau — mais l'équilibre se déplace vers la droite
        correct: false
        misconception: mc.physics.pc_controle_catalyse.equation-de-lanhydride-erronee
        feedback: >
          L'équation n'est pas la même : l'anhydride ne libère pas d'eau, mais
          un acide carboxylique. C'est un changement de PRODUIT, pas un
          déplacement d'équilibre — et c'est justement pour cela que le gain est
          si net : sans eau, il n'y a plus de réaction inverse du tout.
      - id: C
        text: >-
          Parce qu'il faut chauffer moins fort : la double flèche de la voie
          acide signifie qu'un chauffage excessif inverse la réaction
        correct: false
        misconception: mc.physics.pc_controle_catalyse.double-fleche-mal-comprise
        feedback: >
          La double flèche ne dépend pas du chauffage : elle dit que les deux
          sens ont lieu ensemble dans les conditions de l'expérience. Chauffer
          accélère les deux également, ce qui rapproche de l'équilibre sans le
          déplacer. Le gain de l'anhydride ne vient pas de la température.
      - id: D
        text: >-
          Parce que l'anhydride joue le rôle de son propre catalyseur, et doit à
          ce titre figurer parmi les réactifs du bilan
        correct: false
        misconception: mc.physics.pc_controle_catalyse.catalyseur-dans-bilan
        feedback: >
          L'anhydride est un RÉACTIF : il est consommé, et c'est bien pour cela
          qu'il figure dans le bilan. Un catalyseur, lui, est régénéré et n'y
          figure jamais. Confondre les deux rôles rend tout calcul de quantité
          de matière impossible.
    correct_feedback: >
      Le sous-produit change : $CH_3COOH$ au lieu de $H_2O$. Or c'est l'eau qui
      hydrolysait l'ester et limitait la transformation. Sans eau, la réaction
      inverse disparaît et la transformation devient totale.
    solution: |
      **La voie acide.**
      $$CH_3COOH + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + H_2O$$
      L'eau formée hydrolyse l'ester : la transformation est limitée, avec
      $\tau \approx 2/3$ pour un mélange équimolaire.

      **La voie anhydride.**
      $$(CH_3CO)_2O + C_2H_5OH \rightarrow CH_3COOC_2H_5 + CH_3COOH$$
      Le sous-produit est un acide carboxylique, qui ne réagit pas avec l'ester.
      Aucune réaction inverse : transformation totale, flèche simple.

      **Ce qui est en jeu.** Un changement de RÉACTIF, donc de produits — pas un
      déplacement d'équilibre, pas un effet de température, pas une histoire de
      catalyseur.

