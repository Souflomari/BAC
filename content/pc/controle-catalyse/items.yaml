notion: controle-catalyse
skill_code: pc_controle_catalyse
misconceptions: []

items:
  - id: CTC-1
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      On veut synthétiser l'éthanoate d'éthyle par deux voies : (voie 1)
      acide éthanoïque + éthanol ; (voie 2) anhydride éthanoïque + éthanol.
      Laquelle des affirmations est correcte ?
    type: mcq
    choices:
      - id: A
        text: "La voie de l'anhydride est rapide et totale ; celle de l'acide est lente et limitée ($\\tau \\approx 2/3$)."
        correct: true
      - id: B
        text: "Les deux voies sont limitées par un même équilibre ; l'anhydride ne fait que l'atteindre plus vite."
        correct: false
        feedback: >
          C'est confondre les deux réactions. Acide + alcool est un équilibre
          (double flèche, limité à $\tau \approx 2/3$), mais anhydride + alcool
          est une réaction TOTALE (une seule flèche) : elle va jusqu'à
          épuisement du réactif limitant, il n'y a pas d'équilibre à son terme.
      - id: C
        text: "La voie de l'acide est totale ; celle de l'anhydride est limitée par un équilibre."
        correct: false
        feedback: >
          Les deux caractères sont inversés. C'est l'acide + alcool qui est
          lente et limitée (équilibre), et l'anhydride + alcool qui est rapide
          et totale — c'est justement pour ça qu'on change de réactif.
      - id: D
        text: "Les deux voies donnent la même quantité finale d'ester ; seul le sous-produit (eau ou acide) change."
        correct: false
        feedback: >
          Le sous-produit change bien (eau pour l'acide, acide carboxylique
          pour l'anhydride), mais la quantité finale d'ester n'est pas la même :
          la voie de l'acide plafonne à $\tau \approx 2/3$ (rendement $\approx
          67\,\%$), la voie de l'anhydride atteint $\tau = 1$ (rendement
          $\approx 100\,\%$).
    correct_feedback: >
      Anhydride + alcool est rapide et totale ($\tau = 1$) ; acide + alcool est
      lente et limitée par un équilibre ($\tau \approx 2/3$). C'est tout
      l'intérêt de contrôler la synthèse en changeant de réactif.
    solution: |
      **Voie de l'acide :** $CH_3COOH + C_2H_5OH \rightleftharpoons
      CH_3COOC_2H_5 + H_2O$ — double flèche, lente et limitée à
      $\tau \approx 2/3$.

      **Voie de l'anhydride :** $(CH_3CO)_2O + C_2H_5OH \rightarrow
      CH_3COOC_2H_5 + CH_3COOH$ — une seule flèche, rapide et totale.

      Changer de réactif (l'anhydride au lieu de l'acide) rend la réaction à
      la fois plus rapide et complète : c'est le contrôle par un réactif.

  - id: CTC-2
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      Quelle est l'équation correcte de la réaction de l'anhydride éthanoïque
      $(CH_3CO)_2O$ avec l'éthanol $C_2H_5OH$ ?
    type: mcq
    choices:
      - id: A
        text: "$(CH_3CO)_2O + C_2H_5OH \\rightarrow CH_3COOC_2H_5 + CH_3COOH$"
        correct: true
      - id: B
        text: "$(CH_3CO)_2O + C_2H_5OH \\rightleftharpoons CH_3COOC_2H_5 + H_2O$"
        correct: false
        feedback: >
          C'est l'équation de l'estérification par l'ACIDE (double flèche, eau
          en sous-produit), recopiée à tort pour l'anhydride. Un anhydride
          réagit par une seule flèche (totale) et libère un acide carboxylique,
          pas de l'eau.
      - id: C
        text: "$(CH_3CO)_2O + C_2H_5OH \\rightarrow CH_3COOC_2H_5 + H_2O$"
        correct: false
        feedback: >
          Le sens (flèche unique, totale) est bon, mais le sous-produit est
          faux : un anhydride ne libère pas d'eau. Son second morceau repart
          en acide carboxylique — ici l'acide éthanoïque $CH_3COOH$.
      - id: D
        text: "$(CH_3CO)_2O + C_2H_5OH \\rightarrow 2\\,CH_3COOC_2H_5$"
        correct: false
        feedback: >
          L'équation n'est pas conservée : l'anhydride ne fournit qu'un seul
          groupe ester à l'alcool ; son autre moitié devient de l'acide
          éthanoïque. On obtient une molécule d'ester et une molécule d'acide,
          pas deux esters.
    correct_feedback: >
      L'anhydride cède un groupe acyle à l'alcool (formation de l'ester) et
      son autre moitié repart en acide carboxylique : $(CH_3CO)_2O + C_2H_5OH
      \rightarrow CH_3COOC_2H_5 + CH_3COOH$, une seule flèche.
    solution: |
      Un anhydride $R-CO-O-CO-R$ réagit avec un alcool $R'-OH$ selon
      $$R-CO-O-CO-R + R'-OH \rightarrow R-CO-O-R' + R-COOH$$
      Avec $R = CH_3$ et $R' = C_2H_5$ :
      $$(CH_3CO)_2O + C_2H_5OH \rightarrow CH_3COOC_2H_5 + CH_3COOH$$
      Une seule flèche (totale), et un acide carboxylique en sous-produit —
      jamais de l'eau.

  - id: CTC-3
    rung: "R2"
    difficulty_level: 4
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      Pour l'estérification
      $CH_3COOH + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + H_2O$, catalysée
      par l'acide sulfurique $H_2SO_4$, un élève affirme : « En ajoutant plus
      d'acide sulfurique, on déplace l'équilibre vers la droite et on obtient
      plus d'ester. » Que peut-on répondre ?
    type: mcq
    choices:
      - id: A
        text: "Faux — $H_2SO_4$ est un catalyseur : il accélère l'établissement de l'équilibre dans les deux sens, sans changer ni $K$ ni la quantité d'ester à l'équilibre."
        correct: true
      - id: B
        text: "Vrai — un catalyseur accélère seulement la réaction directe (l'estérification), ce qui favorise la formation d'ester."
        correct: false
        feedback: >
          Un véritable catalyseur accélère la réaction directe ET la réaction
          inverse (l'hydrolyse) dans les mêmes proportions — c'est le même
          chemin, parcouru dans les deux sens. S'il n'accélérait qu'un seul
          sens, il déplacerait l'équilibre — mais alors ce ne serait plus un
          catalyseur.
      - id: C
        text: "Vrai — plus de catalyseur signifie plus de chocs efficaces menant au produit, donc un meilleur rendement à l'équilibre."
        correct: false
        feedback: >
          Plus de catalyseur accélère l'ARRIVÉE à l'équilibre, dans les deux
          sens, mais pas sa POSITION. Le rendement à l'équilibre dépend de $K$
          et des quantités initiales, jamais de la quantité de catalyseur.
      - id: D
        text: "Faux, mais seulement parce qu'il y a déjà assez de catalyseur — en ajouter davantage ferait reculer la réaction."
        correct: false
        feedback: >
          Il n'existe aucun effet de « surdose » qui ferait reculer une
          réaction catalysée. La vraie raison est structurelle : $K$ ne dépend
          que de la réaction et de la température, jamais de la quantité de
          catalyseur présente.
    correct_feedback: >
      $H_2SO_4$ multiplie les vitesses directe et inverse par le même facteur,
      donc l'égalité des deux vitesses (l'équilibre) se produit pour le même
      rapport de concentrations qu'avant — même $K$, même quantité d'ester.
      Seul le temps pour l'atteindre change.
    solution: |
      À l'équilibre, la vitesse directe égale la vitesse inverse. Un
      catalyseur multiplie ces deux vitesses par le même facteur $\alpha$ :
      l'égalité $\alpha\,v_{\text{directe}} = \alpha\,v_{\text{inverse}}$ est
      la même que $v_{\text{directe}} = v_{\text{inverse}}$ (on divise par
      $\alpha$). Elle est donc vérifiée pour le même rapport de concentrations,
      c'est-à-dire le même $K$. Ajouter du $H_2SO_4$ fait atteindre l'équilibre
      plus vite, jamais un équilibre différent.

  - id: CTC-4
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      Un catalyseur solide, sous forme de grains, est placé dans un réacteur
      traversé par un flux gazeux de réactifs. Comment qualifie-t-on cette
      catalyse, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Hétérogène, car le catalyseur (solide) et les réactifs (gaz) ne sont pas dans la même phase — la réaction se produit à la surface des grains."
        correct: true
      - id: B
        text: "Homogène, car le catalyseur est une espèce chimique différente des réactifs, comme dans tous les cas de catalyse."
        correct: false
        feedback: >
          Être une espèce chimique différente des réactifs est vrai de TOUS
          les catalyseurs, homogènes comme hétérogènes — ce n'est pas le
          critère de classement. Ce qui distingue homogène et hétérogène, c'est
          uniquement la phase du catalyseur par rapport à celle des réactifs.
      - id: C
        text: "Enzymatique, car un catalyseur solide agit comme une enzyme en offrant une surface spécifique aux réactifs."
        correct: false
        feedback: >
          Un catalyseur enzymatique est un catalyseur biologique (une
          protéine). Offrir une surface de réaction ne suffit pas à rendre une
          catalyse enzymatique — il faut un catalyseur biologique et une
          spécificité de type substrat-enzyme.
      - id: D
        text: "Homogène, car le catalyseur reste chimiquement inchangé tout au long de la réaction."
        correct: false
        feedback: >
          Rester chimiquement inchangé est vrai de tout catalyseur, qu'il soit
          homogène ou hétérogène — ce n'est pas non plus le critère. Ici,
          catalyseur (solide) et réactifs (gaz) sont dans des phases
          différentes : la catalyse est hétérogène.
    correct_feedback: >
      Le catalyseur solide et les réactifs gazeux occupent des phases
      différentes : la catalyse est hétérogène, et la réaction se produit à la
      surface des grains (adsorption, réaction, puis désorption).
    solution: |
      Le critère de classement homogène / hétérogène porte uniquement sur la
      phase : ici, catalyseur solide et réactifs gazeux sont dans des phases
      différentes, donc la catalyse est hétérogène. C'est exactement le
      principe du pot catalytique automobile.

  - id: CTC-5
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      On chauffe un corps gras (triglycéride) avec de la soude : c'est une
      saponification. Quelle affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: "C'est une hydrolyse basique totale, qui donne un savon (ions carboxylate à longue chaîne) et du glycérol."
        correct: true
      - id: B
        text: "C'est un équilibre, comme l'estérification : on n'hydrolyse jamais tout le corps gras."
        correct: false
        feedback: >
          C'est confondre hydrolyse acide et hydrolyse basique. L'hydrolyse
          ACIDE est un équilibre (limitée) ; l'hydrolyse BASIQUE forme l'ion
          carboxylate $R-COO^-$, qui ne se réestérifie pas — sans réaction
          inverse, elle est totale.
      - id: C
        text: "Elle produit un acide gras $R-COOH$ et du glycérol."
        correct: false
        feedback: >
          En milieu basique, le produit n'est pas l'acide $R-COOH$ mais sa
          base conjuguée, l'ion carboxylate $R-COO^-$ (le savon). C'est
          d'ailleurs parce que le carboxylate ne se réestérifie pas que la
          réaction est totale.
      - id: D
        text: "Elle produit un ester et de l'eau, comme une estérification."
        correct: false
        feedback: >
          C'est l'inverse d'une estérification : une saponification DÉFAIT les
          fonctions ester du corps gras. Elle ne forme pas d'ester ni d'eau,
          mais des ions carboxylate (le savon) et du glycérol.
    correct_feedback: >
      La saponification est l'hydrolyse basique, totale, d'un triglycéride :
      $C_3H_5(O-CO-R)_3 + 3\,HO^- \rightarrow 3\,R-COO^- + C_3H_5(OH)_3$ — savon
      (carboxylates) et glycérol.
    solution: |
      $$C_3H_5(O-CO-R)_3 + 3\,HO^- \rightarrow 3\,R-COO^- + C_3H_5(OH)_3$$
      Les trois fonctions ester du triglycéride sont hydrolysées en milieu
      basique. Le produit est l'ion carboxylate $R-COO^-$ (le savon), pas
      l'acide : comme le carboxylate ne se réestérifie pas, il n'y a pas de
      réaction inverse et la transformation est totale — contrairement à
      l'hydrolyse acide, limitée.

  - id: CTC-6
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_controle_catalyse
    tags: []
    stem: >
      Dans un ion de savon $C_{17}H_{35}-COO^-$, quelle partie est hydrophile
      et quelle partie est hydrophobe ?
    type: mcq
    choices:
      - id: A
        text: "La tête $-COO^-$ (chargée) est hydrophile ; la longue chaîne $C_{17}H_{35}$ est hydrophobe."
        correct: true
      - id: B
        text: "La longue chaîne $C_{17}H_{35}$ est hydrophile car elle est grande ; la tête $-COO^-$ est hydrophobe."
        correct: false
        feedback: >
          Le critère n'est pas la taille, mais la charge. La longue chaîne
          carbonée, neutre, fuit l'eau (hydrophobe) ; c'est la tête chargée
          $-COO^-$ qui est attirée par l'eau (hydrophile). Les deux rôles sont
          ici inversés.
      - id: C
        text: "Les deux parties sont hydrophiles, puisque le savon se dissout dans l'eau."
        correct: false
        feedback: >
          Si tout l'ion était hydrophile, le savon n'aurait aucun pouvoir
          lavant. C'est justement sa double personnalité qui compte : une tête
          hydrophile ($-COO^-$) ET une queue hydrophobe (la chaîne carbonée).
      - id: D
        text: "La tête $-COO^-$ est hydrophobe car elle provient d'un acide gras."
        correct: false
        feedback: >
          L'origine (un acide gras) ne décide pas de l'affinité pour l'eau ;
          la charge, si. Le groupe $-COO^-$ porte une charge et est donc
          hydrophile ; c'est la longue chaîne carbonée neutre qui est
          hydrophobe.
    correct_feedback: >
      On classe par la charge : la tête $-COO^-$, chargée, est hydrophile ; la
      longue chaîne carbonée $C_{17}H_{35}$, neutre, est hydrophobe. Cette
      double affinité fait le pouvoir lavant du savon.
    solution: |
      Un ion carboxylate à longue chaîne est amphiphile. Le groupe $-COO^-$
      porte une charge électrique : attiré par l'eau (solvant polaire), il est
      **hydrophile**. La longue chaîne $C_{17}H_{35}$, faite de carbone et
      d'hydrogène sans charge, n'a aucune affinité pour l'eau mais se mêle aux
      graisses : elle est **hydrophobe**. La queue plonge dans le gras, la tête
      reste dans l'eau — d'où le lavage.
