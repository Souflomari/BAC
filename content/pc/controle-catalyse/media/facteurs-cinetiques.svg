<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Avancement x(t) d’une réaction limitée, avec et sans catalyseur : les deux courbes montent vers le même palier x_eq (même K), la courbe avec catalyseur l’atteignant bien plus vite ; une ligne pointillée plus haute marque x_max, hors de portée dans les deux cas.">
  <title>Un facteur cinétique change la vitesse, pas l’état final</title>
  <!--
    facteurs-cinetiques.svg — courbes STATIQUES et SCHÉMATIQUES de x(t) pour
    une réaction LIMITÉE (ex. l'estérification acide + alcool du rung R2,
    τ ≈ 2/3), avec et sans catalyseur.

    Choix de modélisation (à déclarer, car le programme ne prescrit AUCUNE
    loi horaire explicite pour cette réaction) : chaque courbe est tracée
    avec une loi générique d'approche exponentielle
        x(t) = x_eq · (1 − e^(−t/τ_facteur))
    choisie uniquement parce qu'elle donne une forme croissante et concave
    calculable exactement, point par point — PAS parce que le programme
    l'impose. Seule la forme qualitative compte ici (croissante, concave,
    vers un palier commun), conformément à l'argument du rung R2 : « Ce
    qu'un catalyseur ne change jamais : l'état final ».

    Géométrie (calculée) :
      origine (t=0, x=0)         : (x0,y0) = (80, 270)
      palier commun x_eq         : y = 130   → amplitude commune 140 px
      repère x_max (non atteint) : y = 60    → au-dessus de x_eq (réaction
                                    limitée : x_max resterait hors de
                                    portée même avec catalyseur — seul un
                                    changement de réactif, R1, l'atteint)
      τ_avec catalyseur (px)     : 45   (approche rapide)
      τ_sans catalyseur (px)     : 160  (approche lente)

    Les deux courbes sont des polylignes calculées par pas de 20 px (puis
    30 px une fois quasi plates), jamais devinées à la main.

    Rôle des couleurs (une seule couleur distinctive, par consigne) :
      courbe « avec catalyseur »           : --figure-accent (l'élément
        distinctif — le facteur cinétique dont on montre l'effet)
      courbe « sans catalyseur »           : --figure-ink-soft (référence)
      lignes pointillées x_eq et x_max, axes, légendes : --figure-ink-soft
      texte de titre                       : --figure-ink

    Mise en étapes (ordre canonique graphe, LESSON-EXPERIENCE-SPEC.md §2.5) :
      step-1 : les axes.
      step-2 : les données — le palier x_eq, les deux courbes, leurs
               légendes.
      step-3 : la lecture — le repère x_max, ajouté en dernier pour
               marquer ce que donnerait une réaction totale, hors de
               portée ici (réaction limitée), catalysée ou non.
    Les captions sont portées par facteurs-cinetiques.stages.json — les
    deux paragraphes de légende bakés dans l'ancienne version ont été
    retirés (même convention que continuite-tvi.svg / asymptotes.svg).
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Catalyseur : la vitesse change, l’état final ne change pas
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="28" width="590" height="258" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="80" y1="270" x2="610" y2="270"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="610,270 598,265.5 598,274.5" fill="var(--figure-ink-soft)"/>
    <line x1="80" y1="270" x2="80" y2="42"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,42 75.5,53 84.5,53" fill="var(--figure-ink-soft)"/>
    <text x="617" y="274" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="72" y="46" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">x</text>
    <text x="72" y="274" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : le palier x_eq, les deux courbes,
       leurs légendes
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Repère x_eq — le palier commun aux deux courbes -->
    <line x1="80" y1="130" x2="610" y2="130"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="76" y1="130" x2="84" y2="130"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="70" y="134" text-anchor="end" font-size="10.5"
          fill="var(--figure-ink-soft)">x<tspan dy="3" font-size="7.5">eq</tspan></text>

    <!--
      Courbe « avec catalyseur » — x(t) = 130 + 140·e^(−t/45), t = x−80.
      Points calculés par pas de 20 px (30 px une fois quasi plate).
    -->
    <path d="
      M80,270
      L100,219.77 L120,187.55 L140,166.90 L160,153.66 L180,145.16
      L200,139.73 L220,136.23 L240,133.99 L260,132.56 L280,131.64
      L310,130.84 L340,130.43 L370,130.22 L400,130.11 L430,130.06
      L460,130.03 L490,130.02 L520,130.01 L550,130.00 L580,130.00
      L610,130.00
    " fill="none"
      stroke="var(--figure-accent)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!--
      Courbe « sans catalyseur » — x(t) = 130 + 140·e^(−t/160), t = x−80.
    -->
    <path d="
      M80,270
      L100,253.55 L120,239.03 L140,226.22 L160,214.91 L180,204.94
      L200,196.14 L220,188.37 L240,181.51 L260,175.46 L280,170.11
      L310,163.25 L340,157.57 L370,152.86 L400,148.94 L430,145.71
      L460,143.02 L490,140.79 L520,138.95 L550,137.42 L580,136.15
      L610,135.10
    " fill="none"
      stroke="var(--figure-ink-soft)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Légende « avec catalyseur » (accent) — au-dessus du coude de la courbe rapide -->
    <line x1="220" y1="110" x2="234" y2="110"
          stroke="var(--figure-accent)" stroke-width="2.4"/>
    <text x="238" y="113" font-size="11" fill="var(--figure-accent)">avec catalyseur</text>

    <!-- Légende « sans catalyseur » (ink-soft) — au-dessus de la descente de la courbe lente -->
    <line x1="350" y1="175" x2="364" y2="175"
          stroke="var(--figure-ink-soft)" stroke-width="2.4"/>
    <text x="368" y="178" font-size="11" fill="var(--figure-ink-soft)">sans catalyseur</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : le repère x_max, hors de portée
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Repère x_max — réaction totale, non atteint (réaction limitée) -->
    <line x1="80" y1="60" x2="610" y2="60"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="76" y1="60" x2="84" y2="60"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="70" y="64" text-anchor="end" font-size="10.5"
          fill="var(--figure-ink-soft)">x<tspan dy="3" font-size="7.5">max</tspan></text>
  </g><!-- /step-3 -->

</svg>
