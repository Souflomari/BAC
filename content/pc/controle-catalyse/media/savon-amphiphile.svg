<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="La structure amphiphile du savon : un ion R-COO- disséqué en tête -COO- chargée, hydrophile, et longue queue carbonée R, hydrophobe ; puis de nombreux ions savon orientés autour d’une goutte de graisse dans l’eau, queue plongée dans la graisse, tête tournée vers l’eau ; puis la goutte entourée emportée sous forme de micelle au rinçage.">
  <title>Le savon : une tête hydrophile, une queue hydrophobe</title>
  <!--
    savon-amphiphile.svg — STAGED (LESSON-EXPERIENCE-SPEC §2.5, geste
    d'enseignement : « on dissèque un ion, puis on le regarde agir en
    nombre, puis on regarde ce que ça produit »). Trois panneaux empilés
    verticalement (même convention de bandes que regimes-uc.svg) — le
    passage d'un ion isolé (échelle 1) à un halo de ~8 ions autour d'une
    goutte (échelle collective) rend un panneau unique par étape plus
    lisible qu'une seule scène cumulative.

    step-1 (bande 1, y=0..220)   : un ion R-COO⁻ disséqué — queue en
      zigzag (R, hydrophobe/lipophile) et tête ronde -COO⁻ (accent,
      hydrophile), avec le rappel : classée par la CHARGE, pas la taille.
    step-2 (bande 2, y=220..440) : ~8 ions disposés en couronne autour
      d'une goutte de graisse — queue plongée dans la graisse (rayon
      intérieur), tête tournée vers l'eau (rayon extérieur, accent).
    step-3 (bande 3, y=440..660) : la même couronne, devenue micelle,
      déplacée — une position d'origine fantôme (pointillé) reliée par
      une flèche à la position finale, avec traits de mouvement,
      « emporté au rinçage ».

    Rôle des couleurs (une seule couleur distinctive, --figure-accent) :
      tête -COO⁻ / têtes des ions en couronne / flèche de déplacement : accent
      queue carbonée, goutte de graisse, structure neutre             : ink / ink-soft
      fonds de panneau                                                : --figure-surface / --figure-grid
  -->

  <defs>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--figure-accent)"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — l'ion savon disséqué
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="320" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">1. L’ion savon disséqué</text>

    <rect x="40" y="40" width="560" height="150" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <text x="86" y="119" font-size="13" font-style="italic" fill="var(--figure-ink-soft)">R</text>
    <path d="M100,115 L126,101 L152,115 L178,101 L204,115 L230,101 L256,115 L282,101 L308,115 L334,101 L360,115"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="360" y1="115" x2="380" y2="115" stroke="var(--figure-ink-soft)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Opacité PLEINE, et pas 0,85 : « COO » est écrit en blanc dessus, et
         à 0,85 le disque pâlissait juste assez pour faire tomber le mot à
         4,22:1 (mesuré aux pixels le 2026-09-04). Un aplat qui porte du
         texte blanc ne se dilue pas. -->
    <circle cx="400" cy="115" r="20" fill="var(--figure-accent)"/>
    <text x="400" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-surface)">COO</text>
    <text x="424" y="98" font-size="14" font-weight="700" fill="var(--figure-accent)">−</text>

    <line x1="400" y1="140" x2="400" y2="155" stroke="var(--figure-accent)" stroke-width="0.9" stroke-dasharray="2,2"/>
    <text x="400" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-accent)">hydrophile — tête chargée</text>
    <text x="400" y="182" text-anchor="middle" font-size="8.5" font-style="italic" fill="var(--figure-ink-soft)">(classée par la charge, pas la taille)</text>

    <line x1="230" y1="101" x2="230" y2="155" stroke="var(--figure-ink-soft)" stroke-width="0.9" stroke-dasharray="2,2"/>
    <text x="230" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-ink-soft)">hydrophobe / lipophile</text>
    <text x="230" y="182" text-anchor="middle" font-size="8.5" font-style="italic" fill="var(--figure-ink-soft)">queue carbonée (R)</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — orientation autour d'une goutte de graisse
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <text x="320" y="240" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">2. Orientation autour d’une goutte de graisse</text>

    <rect x="20" y="256" width="600" height="170" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="70" y="272" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">eau</text>

    <circle cx="320" cy="340" r="55" fill="var(--figure-ink-soft)" fill-opacity="0.3" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="320" y="344" text-anchor="middle" font-size="10" fill="var(--figure-ink)">graisse</text>

    <!-- 8 ions en couronne : queue vers la graisse, tête vers l'eau -->
    <line x1="345" y1="340" x2="378" y2="340" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="390" cy="340" r="6" fill="var(--figure-accent)"/>

    <line x1="338" y1="358" x2="361" y2="381" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="370" cy="390" r="6" fill="var(--figure-accent)"/>

    <line x1="320" y1="365" x2="320" y2="398" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="320" cy="410" r="6" fill="var(--figure-accent)"/>

    <line x1="302" y1="358" x2="279" y2="381" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="270" cy="390" r="6" fill="var(--figure-accent)"/>

    <line x1="295" y1="340" x2="262" y2="340" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="250" cy="340" r="6" fill="var(--figure-accent)"/>

    <line x1="302" y1="322" x2="279" y2="299" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="270" cy="290" r="6" fill="var(--figure-accent)"/>

    <line x1="320" y1="315" x2="320" y2="282" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="320" cy="270" r="6" fill="var(--figure-accent)"/>

    <line x1="338" y1="322" x2="361" y2="299" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="370" cy="290" r="6" fill="var(--figure-accent)"/>

    <text x="320" y="418" text-anchor="middle" font-size="9" font-style="italic" fill="var(--figure-ink-soft)"
      >têtes hydrophiles vers l’eau, queues hydrophobes plongées dans la graisse</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — l'émulsion emportée au rinçage
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <text x="320" y="460" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">3. L’émulsion emportée au rinçage</text>

    <rect x="20" y="472" width="600" height="160" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="580" y="500" text-anchor="end" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">eau de rinçage</text>

    <!-- Position d'origine (fantôme) -->
    <circle cx="230" cy="565" r="28" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="230" y="600" text-anchor="middle" font-size="9" fill="var(--figure-ink-soft)">avant (sur la tache)</text>

    <!-- Flèche de déplacement -->
    <path d="M262,565 L406,565" fill="none" stroke="var(--figure-accent)" stroke-width="1.8"
          stroke-dasharray="5,3" marker-end="url(#sa-arrow)"/>
    <text x="335" y="548" text-anchor="middle" font-size="10" font-weight="600" fill="var(--figure-accent)">emporté</text>

    <!-- Traits de mouvement -->
    <line x1="385" y1="555" x2="400" y2="558" stroke="var(--figure-ink-soft)" stroke-width="1" opacity="0.55"/>
    <line x1="385" y1="565" x2="400" y2="565" stroke="var(--figure-ink-soft)" stroke-width="1" opacity="0.55"/>
    <line x1="385" y1="575" x2="400" y2="572" stroke="var(--figure-ink-soft)" stroke-width="1" opacity="0.55"/>

    <!-- Micelle finale : la même goutte, entourée, déplacée -->
    <circle cx="460" cy="565" r="38" fill="var(--figure-ink-soft)" fill-opacity="0.3" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>

    <line x1="478" y1="565" x2="500" y2="565" stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="510" cy="565" r="5" fill="var(--figure-accent)"/>

    <line x1="469" y1="581" x2="480" y2="600" stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="485" cy="608" r="5" fill="var(--figure-accent)"/>

    <line x1="451" y1="581" x2="440" y2="600" stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="435" cy="608" r="5" fill="var(--figure-accent)"/>

    <line x1="442" y1="565" x2="420" y2="565" stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="410" cy="565" r="5" fill="var(--figure-accent)"/>

    <line x1="451" y1="549" x2="440" y2="530" stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="435" cy="522" r="5" fill="var(--figure-accent)"/>

    <line x1="469" y1="549" x2="480" y2="530" stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="485" cy="522" r="5" fill="var(--figure-accent)"/>

    <text x="460" y="637" text-anchor="middle" font-size="9" font-style="italic" fill="var(--figure-ink-soft)">micelle emportée, loin du tissu</text>
  </g><!-- /step-3 -->

</svg>
