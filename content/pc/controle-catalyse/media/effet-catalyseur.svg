<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Quotient de réaction Qr(t) tendant vers la même constante d'équilibre K, avec et sans catalyseur : la courbe avec catalyseur atteint K bien plus vite, mais au même niveau K — illustrant que le catalyseur multiplie v directe et v inverse par le même facteur, sans déplacer l'égalité entre elles.">
  <title>Pourquoi un catalyseur ne déplace pas l'équilibre</title>
  <!--
    effet-catalyseur.svg — courbes STATIQUES et SCHÉMATIQUES de Q_r(t), le
    quotient de réaction, avec et sans catalyseur (variante choisie : la
    leçon traite la catalyse de façon PUREMENT MACROSCOPIQUE — v_directe,
    v_inverse, Q_r, K — sans jamais introduire d'énergie d'activation E_a
    ni de profil énergétique ; un diagramme d'énergie serait donc hors du
    contenu enseigné. Cette figure isole plutôt l'argument mathématique
    du rung R2 : α·v_directe = α·v_inverse ⟺ même Q_r à l'équilibre ⟺
    même K).

    Choix de modélisation (à déclarer) : Q_r(t) est tracé avec une loi
    générique d'approche exponentielle Q_r(t) = K·(1 − e^(−t/τ_facteur)),
    choisie uniquement pour sa forme croissante-concave calculable
    exactement point par point — le programme ne prescrit aucune loi
    horaire explicite pour Q_r(t). Seule la forme qualitative compte :
    Q_r croît vers K, plus ou moins vite selon le catalyseur.

    Géométrie (calculée, identique au panneau de référence uc-charge.svg
    — même repère, seules les deux courbes et leurs constantes de temps
    changent) :
      origine (t=0, Qr=0)  : (x0,y0) = (80, 208)
      asymptote K          : y = 78     → amplitude 130 px
      τ_avec catalyseur    : 45 px  (approche rapide)
      τ_sans catalyseur    : 160 px (approche lente)

    Les deux courbes sont des polylignes calculées par pas de 20 px (30 px
    une fois quasi plates) via Q_r/K = 1 − e^(−t/τ), jamais devinées.

    Rôle des couleurs (une seule couleur distinctive, par consigne) :
      courbe « avec catalyseur »   : --figure-accent
      courbe « sans catalyseur »   : --figure-ink-soft
      asymptote K, axes, légendes  : --figure-ink-soft
      boîte formule (le facteur α) : --figure-accent (fond teinté léger)

    Mise en étapes (ordre canonique graphe, LESSON-EXPERIENCE-SPEC.md §2.5) :
      step-1 : les axes.
      step-2 : les données — l'asymptote K, les deux courbes, leurs légendes.
      step-3 : la lecture — la boîte formule reliant le tracé à l'argument
               du rung R2 (α·v_directe = α·v_inverse ⟹ même K).
    Les captions sont portées par effet-catalyseur.stages.json — les deux
    paragraphes de légende bakés dans l'ancienne version ont été retirés
    (même convention que continuite-tvi.svg / asymptotes.svg).
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Catalyseur : Q<tspan dy="3" font-size="8.5">r</tspan><tspan dy="-3"> tend vers le même K, seulement plus vite</tspan>
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="200" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="80" y1="208" x2="610" y2="208"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="610,208 598,203.5 598,212.5" fill="var(--figure-ink-soft)"/>
    <line x1="80" y1="208" x2="80" y2="50"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,50 75.5,61 84.5,61" fill="var(--figure-ink-soft)"/>
    <text x="617" y="212" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="72" y="46" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">Q<tspan dy="3" font-size="7.5">r</tspan></text>
    <text x="72" y="212" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : l'asymptote K, les deux courbes,
       leurs légendes
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Asymptote K — même valeur pour les deux courbes -->
    <line x1="80" y1="78" x2="610" y2="78"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="76" y1="78" x2="84" y2="78"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="70" y="82" text-anchor="end" font-size="11"
          fill="var(--figure-ink-soft)">K</text>

    <!--
      Courbe « avec catalyseur » — Qr(t) = 78 + 130·e^(−t/45), t = x−80.
    -->
    <path d="
      M80,208
      L100,161.35 L120,131.44 L140,112.27 L160,99.97 L180,92.08
      L200,87.03 L220,83.78 L240,81.70 L260,80.38 L280,79.52
      L310,78.78 L340,78.40 L370,78.21 L400,78.10 L430,78.05
      L460,78.03 L490,78.02 L520,78.01 L550,78.00 L580,78.00
      L610,78.00
    " fill="none"
      stroke="var(--figure-accent)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!--
      Courbe « sans catalyseur » — Qr(t) = 78 + 130·e^(−t/160), t = x−80.
    -->
    <path d="
      M80,208
      L100,192.72 L120,179.24 L140,167.35 L160,156.84 L180,147.59
      L200,139.41 L220,132.20 L240,125.83 L260,120.21 L280,115.24
      L310,108.87 L340,103.60 L370,99.23 L400,95.59 L430,92.59
      L460,90.09 L490,88.02 L520,86.31 L550,84.89 L580,83.71
      L610,82.73
    " fill="none"
      stroke="var(--figure-ink-soft)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Légende « avec catalyseur » (accent) — dans la marge, au-dessus de l'asymptote -->
    <line x1="170" y1="65" x2="184" y2="65"
          stroke="var(--figure-accent)" stroke-width="2.4"/>
    <text x="188" y="68" font-size="11" fill="var(--figure-accent)">avec catalyseur</text>

    <!-- Légende « sans catalyseur » (ink-soft) — au-dessus de la courbe lente, bien séparée -->
    <line x1="330" y1="115" x2="344" y2="115"
          stroke="var(--figure-ink-soft)" stroke-width="2.4"/>
    <text x="348" y="118" font-size="11" fill="var(--figure-ink-soft)">sans catalyseur</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : la boîte formule (l'argument du
       rung R2)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <rect x="350" y="40" width="260" height="32" rx="5"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="480" y="61" text-anchor="middle" font-size="12" font-style="italic"
          fill="var(--figure-accent)">α·v<tspan
          dy="4" font-size="8">directe</tspan><tspan
          dy="-4"> = α·v</tspan><tspan
          dy="4" font-size="8">inverse</tspan><tspan
          dy="-4"> ⟹ même K</tspan>
    </text>
  </g><!-- /step-3 -->

</svg>
