<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Réaction d'un anhydride d'acide avec un alcool, révélée en cinq étapes : d'abord les deux réactifs, l'anhydride R-CO-O-CO-R avec son pont C-O-C central repéré et l'alcool R'-OH avec son oxygène et son hydrogène marqués ; puis, sur un zoom du cœur réactif, la rupture du pont d'un seul côté, l'oxygène du pont restant lié au carbone de gauche ; puis la formation de la nouvelle liaison entre l'oxygène de l'alcool et le carbone libéré, la liaison ester ; puis la migration de l'hydrogène de l'alcool vers l'oxygène du pont, sans qu'aucune molécule d'eau ne se forme ; enfin les produits obtenus, l'ester R-CO-O-R' qui porte l'oxygène venu de l'alcool et l'acide carboxylique R-COOH, dans une réaction totale dont le sous-produit est un acide et non de l'eau.">
  <title>Anhydride + alcool → ester + acide carboxylique</title>
  <!--
    anhydride-alcool.svg — STAGED en 5 étapes (LESSON-EXPERIENCE-SPEC §2.5).

    RESTAGE (audit stage-depth, docket majeur). L'ancienne version tenait en
    3 étapes et son étape « réorganisation » racontait QUATRE événements de
    liaison d'un seul coup (le pont casse / l'oxygène du pont reste sur le
    carbone de gauche / une liaison se forme avec l'oxygène de l'alcool /
    l'hydrogène migre). Une figure de mécanisme doit révéler ces événements
    UN PAR UN — c'est exactement ce qu'un élève ne peut pas reconstituer
    seul. Les événements sont désormais éclatés sur trois étapes ; le bilan
    « le pont se rompt d'un seul côté » et « l'oxygène du pont reste lié au
    carbone de gauche » restent solidaires (c'est le MÊME événement décrit
    par ses deux moitiés : on ne peut pas dire qu'une liaison casse sans
    dire de quel côté).

    step-1 (panneau 1, y=0..195) : LES RÉACTIFS, sites repérés.
      L'anhydride R-CO-O-CO-R (semi-développé, R condensés) avec son pont
      C-O-C central encerclé en accent ; l'alcool R'-OH avec son oxygène
      marqué d'un disque accent (l'atome à suivre) et sa liaison O-H
      flaguée en accent (l'hydrogène transférable).
      Idée unique : voici les deux réactifs et les deux endroits où ça va
      se passer.

    step-2..step-4 (panneau 2, y=236..401) : LA RÉORGANISATION, UNE LIAISON
      À LA FOIS. Un seul décor, révélé une fois puis enrichi EN PLACE —
      aucun objet ne bouge d'une étape à l'autre.
      step-2 : le décor (zoom sur le cœur réactif, sans les groupes R —
        pure redite de l'étape 1, il ne porte aucune affirmation neuve) +
        L'ÉVÉNEMENT 1 : la liaison pont-carbone de droite se rompt
        (pointillé ink-soft + ✕), et le soulignement pointillé sous la
        liaison de gauche dit que celle-là, elle, tient.
      step-3 : L'ÉVÉNEMENT 2 : l'oxygène de l'alcool se lie au carbone
        libéré — la liaison ester (flèche courbe accent). Note de pied :
        l'hydrogène n'a pas encore bougé (c'est ce qui rend l'étape 4
        nécessaire).
      step-4 : L'ÉVÉNEMENT 3 : l'hydrogène migre de l'alcool vers l'oxygène
        du pont (✕ sur la liaison O-H + flèche courbe accent) ; cet oxygène
        devient le -OH de l'acide, et aucune eau n'est formée.

    step-5 (panneau 3, y=442..607) : LES PRODUITS, annotés — l'ester
      R-CO-O-R' (même disque accent sur l'oxygène venu de l'alcool, pour
      suivre visuellement cet atome) et l'acide R-COOH ; deux bandeaux de
      lecture : « réaction totale (τ = 1) » et « sous-produit = acide,
      pas d'eau ».

    Simplification assumée (déclarée) : ce schéma trace un bilan de
    liaisons (quelle liaison casse, quelle liaison se forme, quel atome va
    où), pas un mécanisme réactionnel complet à flèches d'électrons (hors
    programme de ce chapitre — le texte ne parle jamais d'intermédiaire
    tétraédrique). L'ORDRE des trois événements est un ordre de LECTURE,
    pas une chronologie mesurée : à l'échelle réelle ils sont concertés.
    Les groupes R et R' restent génériques et condensés, cohérents avec la
    façon dont le rung R1 les écrit lui-même.

    Les carbones ne sont pas indicés (pas de C1/C2 à l'écran) : le texte de
    figure dit « le carbone de gauche / de droite », ce qui se lit sans
    convention préalable.

    Rôle des couleurs (une seule couleur distinctive, --figure-accent) :
      pont C-O-C de l'anhydride (étape 1, à repérer)      : accent
      oxygène de l'alcool, suivi jusque dans l'ester       : accent (disque)
      liaison O-H de l'alcool (le H qui part)              : accent
      liaisons qui se FORMENT / transfert (étapes 3, 4)    : accent, pointillé
      liaisons qui se ROMPENT (étapes 2, 4)                : ink-soft, pointillé
      squelette moléculaire, bandeaux de lecture           : ink / ink-soft

    Les <defs> sont hissés HORS des groupes step-N : le contrat exige que
    les <g id="step-N"> soient les DERNIERS enfants du SVG (piège
    assembleSvg).
  -->

  <defs>
    <marker id="arrow-accent-1" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--figure-accent)"/>
    </marker>
    <marker id="arrow-accent-2" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--figure-accent)"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les réactifs, sites réactifs repérés
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="320" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">Les réactifs — les deux sites qui vont réagir</text>

    <rect x="20" y="30" width="600" height="165" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Anhydride : R-C(=O)-Opont-C(=O)-R -->
    <text x="130" y="122" font-size="15" font-style="italic" fill="var(--figure-ink)">R</text>
    <line x1="145" y1="118" x2="177" y2="118" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="183" y="122" font-size="14" fill="var(--figure-ink)">C</text>
    <line x1="179" y1="106" x2="179" y2="76" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <line x1="187" y1="106" x2="187" y2="76" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="183" y="68" font-size="13" fill="var(--figure-ink)">O</text>

    <line x1="191" y1="118" x2="221" y2="118" stroke="var(--figure-accent)" stroke-width="2"/>
    <circle cx="235" cy="118" r="14" fill="var(--figure-accent)" fill-opacity="0.15"
            stroke="var(--figure-accent)" stroke-width="1.3" stroke-dasharray="3,2"/>
    <text x="235" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="var(--figure-accent)">O</text>
    <line x1="249" y1="118" x2="279" y2="118" stroke="var(--figure-accent)" stroke-width="2"/>

    <text x="289" y="122" font-size="14" fill="var(--figure-ink)">C</text>
    <line x1="285" y1="106" x2="285" y2="76" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <line x1="293" y1="106" x2="293" y2="76" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="289" y="68" font-size="13" fill="var(--figure-ink)">O</text>
    <line x1="297" y1="118" x2="329" y2="118" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="337" y="122" font-size="15" font-style="italic" fill="var(--figure-ink)">R</text>

    <!-- Repère : le pont C-O-C -->
    <line x1="235" y1="132" x2="235" y2="146" stroke="var(--figure-accent)" stroke-width="0.9" stroke-dasharray="2,2"/>
    <text x="235" y="160" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">pont C–O–C : la liaison</text>
    <text x="235" y="172" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">qui va se rompre</text>

    <text x="371" y="122" text-anchor="middle" font-size="18" fill="var(--figure-ink)">+</text>

    <!-- Alcool : R'-O-H -->
    <text x="401" y="122" font-size="15" fill="var(--figure-ink)"
          ><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="10">′</tspan></text>
    <line x1="418" y1="118" x2="446" y2="118" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <circle cx="459" cy="118" r="12" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <text x="459" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--figure-accent)">O</text>
    <line x1="471" y1="118" x2="495" y2="118" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="503" y="122" font-size="14" fill="var(--figure-ink)">H</text>

    <text x="459" y="150" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">O de l'alcool — à suivre</text>
    <text x="459" y="162" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">jusque dans l'ester</text>
    <!-- Note du H placée AU-DESSUS (le gutter bas est déjà pris par les deux
         lignes « O de l'alcool » — les poser côte à côte les faisait se
         chevaucher). Petit tiret de rappel vers le H. -->
    <line x1="508" y1="110" x2="512" y2="98" stroke="var(--figure-accent)" stroke-width="0.9" stroke-dasharray="2,2"/>
    <text x="516" y="92" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">H : transférable</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — le décor (zoom sur le cœur réactif) + ÉVÉNEMENT 1 :
       le pont se rompt d'un seul côté
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <text x="320" y="226" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">La réorganisation, une liaison à la fois</text>

    <rect x="20" y="236" width="600" height="165" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Carbone de gauche, avec sa double liaison -->
    <text x="200" y="330" font-size="14" fill="var(--figure-ink)">C</text>
    <line x1="196" y1="318" x2="196" y2="288" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <line x1="204" y1="318" x2="204" y2="288" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="200" y="280" font-size="13" fill="var(--figure-ink)">O</text>

    <!-- Liaison conservée : carbone de gauche — oxygène du pont -->
    <line x1="208" y1="326" x2="236" y2="326" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <line x1="210" y1="340" x2="234" y2="340" stroke="var(--figure-ink-soft)" stroke-width="1"
          stroke-dasharray="2,2"/>

    <!-- Oxygène du pont -->
    <circle cx="250" cy="326" r="14" fill="var(--figure-accent)" fill-opacity="0.12"
            stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="250" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="var(--figure-accent)">O</text>

    <!-- ÉVÉNEMENT 1 : la liaison de droite du pont se rompt -->
    <line x1="264" y1="326" x2="298" y2="326" stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="3,3"/>
    <text x="281" y="316" text-anchor="middle" font-size="13" fill="var(--figure-ink-soft)">✕</text>

    <!-- Carbone de droite, avec sa double liaison -->
    <text x="310" y="330" font-size="14" fill="var(--figure-ink)">C</text>
    <line x1="306" y1="318" x2="306" y2="288" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <line x1="314" y1="318" x2="314" y2="288" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="310" y="280" font-size="13" fill="var(--figure-ink)">O</text>

    <!-- Fragment alcool entrant : O(accent) porté par R', et son H -->
    <circle cx="460" cy="284" r="12" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <text x="460" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="var(--figure-accent)">O</text>
    <line x1="472" y1="280" x2="496" y2="270" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="504" y="266" font-size="14" fill="var(--figure-ink)"
          ><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="10">′</tspan></text>
    <line x1="460" y1="296" x2="460" y2="322" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="460" y="336" text-anchor="middle" font-size="13" fill="var(--figure-ink)">H</text>

    <!-- Lecture de l'événement 1 -->
    <text x="256" y="356" text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">le pont se rompt d'un seul côté</text>
    <text x="256" y="368" text-anchor="end" font-size="9.5" fill="var(--figure-ink-soft)">l'oxygène reste lié au carbone de gauche</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — ÉVÉNEMENT 2 : l'oxygène de l'alcool se lie au
       carbone libéré (la liaison ester)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path d="M448,286 Q380,250 316,318" fill="none" stroke="var(--figure-accent)"
          stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-accent-1)"/>
    <text x="394" y="250" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">l'oxygène de l'alcool se lie au carbone</text>
    <text x="394" y="262" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">c'est la nouvelle liaison ester</text>
    <text x="610" y="352" text-anchor="end" font-size="9" font-style="italic" fill="var(--figure-ink-soft)">(l'hydrogène n'a pas encore bougé)</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — ÉVÉNEMENT 3 : l'hydrogène migre vers l'oxygène
       du pont ; aucune eau n'est formée
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <text x="476" y="312" text-anchor="middle" font-size="12" fill="var(--figure-ink-soft)">✕</text>
    <path d="M450,334 Q356,376 264,336" fill="none" stroke="var(--figure-accent)"
          stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-accent-2)"/>
    <text x="290" y="376" font-size="9.5" fill="var(--figure-accent)">l'hydrogène migre vers l'oxygène du pont</text>
    <text x="290" y="390" font-size="9" font-style="italic" fill="var(--figure-ink-soft)">cet oxygène porte maintenant un –OH : aucune eau n'est formée</text>
  </g><!-- /step-4 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 5 — les produits, annotés
       ══════════════════════════════════════════════════════ -->
  <g id="step-5">
    <text x="320" y="432" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">Les produits</text>

    <rect x="20" y="442" width="600" height="165" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Ester : R-C(=O)-O(venu de l'alcool)-R' -->
    <text x="60" y="510" font-size="15" font-style="italic" fill="var(--figure-ink)">R</text>
    <line x1="75" y1="506" x2="103" y2="506" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="110" y="510" font-size="14" fill="var(--figure-ink)">C</text>
    <line x1="106" y1="494" x2="106" y2="466" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <line x1="114" y1="494" x2="114" y2="466" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="110" y="458" font-size="13" fill="var(--figure-ink)">O</text>
    <line x1="118" y1="506" x2="146" y2="506" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <circle cx="159" cy="506" r="12" fill="var(--figure-accent)" fill-opacity="0.18" stroke="var(--figure-accent)" stroke-width="1.3"/>
    <text x="159" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="var(--figure-accent)">O</text>

    <line x1="171" y1="506" x2="197" y2="506" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="205" y="510" font-size="15" fill="var(--figure-ink)"
          ><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="10">′</tspan></text>
    <text x="140" y="536" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">ester — porte l'oxygène de l'alcool</text>

    <text x="248" y="510" text-anchor="middle" font-size="18" fill="var(--figure-ink)">+</text>

    <!-- Acide : R-C(=O)-OH -->
    <text x="278" y="510" font-size="15" font-style="italic" fill="var(--figure-ink)">R</text>
    <line x1="293" y1="506" x2="321" y2="506" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="328" y="510" font-size="14" fill="var(--figure-ink)">C</text>
    <line x1="324" y1="494" x2="324" y2="466" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <line x1="332" y1="494" x2="332" y2="466" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="328" y="458" font-size="13" fill="var(--figure-ink)">O</text>
    <line x1="336" y1="506" x2="364" y2="506" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="372" y="510" font-size="14" fill="var(--figure-ink)">OH</text>
    <text x="400" y="536" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">acide carboxylique — le -OH est l'ancien pont</text>

    <!-- Bandeaux de lecture -->
    <rect x="60" y="552" width="230" height="34" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="175" y="574" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-accent)">réaction totale (τ = 1)</text>

    <rect x="330" y="552" width="230" height="34" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="445" y="574" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-accent)">sous-produit = acide, pas d'eau</text>
  </g><!-- /step-5 -->

</svg>
