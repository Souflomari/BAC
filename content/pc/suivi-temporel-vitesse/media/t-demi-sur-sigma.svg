<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Conductivité σ en fonction du temps t, pour la saponification de l’éthanoate d’éthyle suivie par conductimétrie. Les huit points mesurés décroissent de σ₀ = 0,50 S·m⁻¹ vers un palier σ_f ≈ 0,19 S·m⁻¹, sur une courbe lissée. La bonne lecture du temps de demi-réaction se fait à la demi-hauteur (σ₀ + σ_f)/2 = 0,34 S·m⁻¹, atteinte à t₁/₂ = 8 minutes : la courbe et le tableau s’accordent. Le piège consiste à lire, à tort, la demi-hauteur σ₀/2 = 0,25 S·m⁻¹, atteinte seulement vers 18 minutes — plus de deux fois trop tard.">
  <title>Lire t₁/₂ sur σ(t) : la bonne demi-hauteur, et le piège σ₀/2</title>
  <!--
    t-demi-sur-sigma.svg — figure de R4, sous-section « Exemple travaillé :
    suivre par conductimétrie — lire t½ et la vitesse sur σ(t) »
    (content/pc/suivi-temporel-vitesse/lesson.md, marqueur
    [[figure:t-demi-sur-sigma]], placé juste après le paragraphe « Le piège
    à éviter »). Sœur de temps-demi-reaction.svg (même geste de lecture,
    même rôle des couleurs), transposée sur σ(t) au lieu de x(t).

    Valeurs AUTORITAIRES, reprises telles quelles du tableau de cette
    sous-section (ne PAS re-dériver depuis σ(x) = σ0 + k·x) :
      n0(HO−) = 5,0 mmol = x_max ; V = 250 mL ; σ0 = 0,50 S·m⁻¹ ;
      k = −63 S·m⁻¹·mol⁻¹ ; σ_f = σ0 + k·x_max = 0,50 − 0,315 = 0,185 S·m⁻¹
        (valeur EXACTE ; le texte l'arrondit en « ≈ 0,19 » — repris ici tel quel)
      σ(t½) = σ0 + k·(x_max/2) = 0,50 − 0,1575 = 0,3425 S·m⁻¹
        (valeur EXACTE ; le texte arrondit CE calcul-là aussi, à « = 0,34 »,
        pour qu'il coïncide au 2ᵉ chiffre avec la valeur mesurée du tableau
        à t = 8 min — ce n'est pas un second hasard, x_max/2 = 2,5 mmol et
        σ(8 min) = 0,34 S·m⁻¹ sont bien la MÊME ligne du tableau)
      Tableau t (min) / σ (S·m⁻¹) :
        0/0,50 ; 4/0,40 ; 8/0,34 ; 12/0,29 ; 16/0,26 ; 20/0,24 ; 30/0,21 ; 45/0,19

    Courbe lissée (donnée par le brief, PAS re-choisie) :
      σ(t) = 0,185 + 0,315·e^(−t/11,02)   [0,185 = σ_f exact, 0,315 = σ0−σ_f
      exact : la formule encode donc EXACTEMENT σ0 et σ_f — cohérence
      vérifiée, pas une coïncidence]
      C'est un AJUSTEMENT lissé, pas une interpolation exacte des 8 points
      (comme avancement-tangente.svg pour x(t) dans ce même dossier) :
        t=0  min : calc 0,50000  | tableau 0,50 | écart  0,0000
        t=4  min : calc 0,40410  | tableau 0,40 | écart +0,0041
        t=8  min : calc 0,33743  | tableau 0,34 | écart −0,0026
        t=12 min : calc 0,29102  | tableau 0,29 | écart +0,0010
        t=16 min : calc 0,25875  | tableau 0,26 | écart −0,0013
        t=20 min : calc 0,23630  | tableau 0,24 | écart −0,0037
        t=30 min : calc 0,20570  | tableau 0,21 | écart −0,0043
        t=45 min : calc 0,19031  | tableau 0,19 | écart +0,0003
      Écart maximal 0,0043 S·m⁻¹ (à t=30 min) : dans la tolérance ≤0,005
      annoncée. À l'échelle de 500 px/(S·m⁻¹) ci-dessous, ceci donne un
      écart-pixel maximal de 2,15 px entre un point mesuré et la courbe —
      imperceptible (rayon des points : 2,6 px), documenté ici plutôt que
      masqué. Conséquence pour LA lecture : la courbe croise réellement
      σ = 0,34 en t ≈ 7,81 min (x_px ≈ 158,1), soit ≈1,9 px avant le point
      de construction posé en t = 8 min (x_px = 160) — le point de
      construction suit le TABLEAU (l'autorité de cette sous-section), pas
      la courbe lissée ; le petit écart est sous le rayon du point tracé.

    Repère écran (calculé) :
      origine (t=0 min, σ=0 S·m⁻¹) : (x0,y0) = (80, 350)
      échelle t : 10 px/min          → x(t) = 80 + 10·t
      échelle σ : 500 px/(S·m⁻¹)     → y(σ) = 350 − 500·σ
      Cadre (non chiffré au bord, comme courbe-activite-quadrillee.svg) :
        t = 50 min → x = 580 ; σ = 0,55 S·m⁻¹ → y = 75
      Quadrillage : mineurs tous les 5 min / 0,05 S·m⁻¹ (nus) ; majeurs
        tous les 10 min / 0,10 S·m⁻¹ (chiffrés) à 10,20,30,40 min et
        0,10 ; 0,20 ; 0,30 ; 0,40 ; 0,50 S·m⁻¹ — bord du cadre (50 min,
        0,55 S·m⁻¹) volontairement non chiffré.

    Vérification de 3 points de table contre le pixel mapping (x_px,y_px) :
      t=0  min, σ=0,50 → (80,100)   [exact : 80+10×0=80 ; 350−500×0,50=100]
      t=8  min, σ=0,34 → (160,180)  [exact : 80+10×8=160 ; 350−500×0,34=180]
      t=45 min, σ=0,19 → (530,255)  [exact : 80+10×45=530 ; 350−500×0,19=255]

    Points mesurés (8, step-2, --figure-ink — la DONNÉE, pas la lecture) :
      (0,100) (120,150) (160,180) (200,205) (240,220) (280,230) (380,245) (530,255)

    Courbe (step-2, --figure-ink), polyligne calculée pas=2,5 min (25 px) :
      t   0    2,5    5    7,5   10    12,5  15    17,5  20    22,5  25
      y 100  131,97 157,44 177,77 193,95 206,85 217,13 225,32 231,85 237,06 241,21
      t  27,5  30    32,5  35    37,5  40    42,5  45    47,5  50
      y 244,51 247,15 249,25 250,92 252,26 253,32 254,17 254,85 255,39 255,81

    LA lecture (step-3, --figure-accent — seul sujet en accent) :
      σ(t½) = (σ0+σ_f)/2 → affiché arrondi « 0,34 » (cf. note ci-dessus),
      guide horizontal (80,180)→(160,180), point (160,180), guide vertical
      (160,180)→(160,350), t½ = 8 min. Boîte formule en haut de figure,
      convention reprise verbatim d'avancement-tangente.svg / temps-demi-
      reaction.svg de ce même dossier (« la lecture, à distance du trait,
      mais seul élément en accent du panneau » — pour que les deux
      lectures de cette leçon restent sœurs).

    LE piège (step-3 aussi — la mise en scène cappe à 3 étapes dans tout
      ce dépôt, comme temps-demi-reaction.svg / avancement-tangente.svg /
      courbe-activite-quadrillee.svg ; ce brief autorisait explicitement
      cette fusion) : σ0/2 = 0,25 S·m⁻¹ (exact, aucun arrondi) coïncide
      avec le quadrillage mineur (y=225) — ce n'est pas un hasard non plus,
      c'est justement ce qui le rend « tentant ». Croisement RÉEL avec la
      courbe résolu analytiquement (pas à l'oeil) :
        0,25 = 0,185 + 0,315·e^(−t/11,02)
        e^(−t/11,02) = 0,065/0,315 = 13/63 ≈ 0,206349
        t = 11,02 × ln(63/13) = 11,02 × 1,578186 ≈ 17,392 min
        x_px = 80 + 10×17,392 ≈ 253,9 ; y_px = 350 − 500×0,25 = 225 (exact)
      Le texte de la leçon donne « vers 18 min » (lecture interpolée sur
      LE TABLEAU, entre 16 min/0,26 et 20 min/0,24). Écart avec le
      croisement réel de la courbe : 18 − 17,39 = 0,61 min < 1 min → on
      étiquette donc « ≈ 18 min » (règle du brief), pas « ≈ 17 min ».
      Jamais --figure-accent ; tracé pointillé fin (2,2) distinct du trait
      accent (5,3) de la vraie lecture ; --figure-ink-soft partout.
      Étiquette « σ0/2 : piège » posée juste après la pointe du piège
      (x≥270), avec un fond --figure-surface (elle traverserait sinon
      deux traits de quadrillage, t=20 et t=25 min).

    Rôle des couleurs :
      points mesurés + courbe                    : --figure-ink (la donnée)
      σ0 (étiquette), palier σ_f (ligne pointillée
        + étiquette), quadrillage, axes           : --figure-ink-soft (chrome)
      LA lecture (guides, point, tick « 0,34 »,
        étiquette t½, boîte formule)               : --figure-accent (le sujet)
      LE piège (guides, point, étiquette, « ≈18 min ») : --figure-ink-soft,
        JAMAIS accent, tracé visiblement différent
  -->

  <g id="step-1">
    <!-- Titre -->
    <text x="340" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Lire t<tspan dy="3" font-size="8.5">1/2</tspan><tspan dy="-3"> sur σ(t) : la bonne demi-hauteur, et le piège</tspan>
    </text>

    <!-- Fond du panneau -->
    <rect x="40" y="32" width="610" height="380" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- ── Quadrillage — mineurs (0,8 px, 30 %), encre douce ─────── -->
    <line x1="130" y1="75" x2="130" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="230" y1="75" x2="230" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="330" y1="75" x2="330" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="430" y1="75" x2="430" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="530" y1="75" x2="530" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="80" y1="325" x2="580" y2="325" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="80" y1="275" x2="580" y2="275" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="80" y1="225" x2="580" y2="225" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="80" y1="175" x2="580" y2="175" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>
    <line x1="80" y1="125" x2="580" y2="125" stroke="var(--figure-ink-soft)" stroke-opacity="0.30" stroke-width="0.8"/>

    <!-- ── Quadrillage — majeurs (1 px, 68 %), chiffrés ─────────── -->
    <line x1="180" y1="75" x2="180" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="280" y1="75" x2="280" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="380" y1="75" x2="380" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="480" y1="75" x2="480" y2="350" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="80" y1="300" x2="580" y2="300" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="80" y1="250" x2="580" y2="250" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="80" y1="200" x2="580" y2="200" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="80" y1="150" x2="580" y2="150" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>
    <line x1="80" y1="100" x2="580" y2="100" stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>

    <!-- Cadre — bords non chiffrés (t=50 min, σ=0,55 S·m⁻¹) -->
    <rect x="80" y="75" width="500" height="275" fill="none"
          stroke="var(--figure-ink-soft)" stroke-opacity="0.68" stroke-width="1"/>

    <!-- ── Axes — ink-soft, chrome neutre ───────────────────────── -->
    <line x1="80" y1="350" x2="598" y2="350"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="598,350 586,345.5 586,354.5" fill="var(--figure-ink-soft)"/>
    <line x1="80" y1="350" x2="80" y2="55"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,55 75.5,66 84.5,66" fill="var(--figure-ink-soft)"/>

    <text x="78" y="59" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">σ</tspan><tspan font-size="9"> (S·m<tspan
          dy="-4" font-size="70%">−1</tspan><tspan dy="4">)</tspan></tspan></text>
    <text x="590" y="366" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">t</tspan><tspan font-size="9"> (min)</tspan></text>
    <text x="72" y="354" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <!-- Graduations t (min) — majeures, 10/20/30/40 ; 50 reste le cadre -->
    <text x="180" y="366" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">10</text>
    <text x="280" y="366" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">20</text>
    <text x="380" y="366" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">30</text>
    <text x="480" y="366" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">40</text>

    <!-- Graduations σ (S·m⁻¹) — majeures ; 0,55 reste le cadre -->
    <text x="72" y="304" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)">0,10</text>
    <text x="72" y="254" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)">0,20</text>
    <text x="72" y="204" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)">0,30</text>
    <text x="72" y="154" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)">0,40</text>
    <text x="72" y="104" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)">0,50</text>

    <!-- σ0 : repère de départ, juste au-dessus du premier point mesuré -->
    <text x="88" y="92" font-size="9.5" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">σ</tspan><tspan dy="3" font-size="7">0</tspan></text>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!--
      Palier σ_f — ligne de référence pointillée légère, sous le dernier
      point mesuré (t=45 min), AVANT la courbe pour rester chrome discret.
    -->
    <line x1="80" y1="255" x2="580" y2="255"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-opacity="0.75"
          stroke-dasharray="1.5,3"/>

    <!-- Courbe σ(t) — polyligne calculée, pas=2,5 min ; voir calcul en tête -->
    <path d="
      M80,100 L105,131.97 L130,157.44 L155,177.77 L180,193.95 L205,206.85
      L230,217.13 L255,225.32 L280,231.85 L305,237.06 L330,241.21
      L355,244.51 L380,247.15 L405,249.25 L430,250.92 L455,252.26
      L480,253.32 L505,254.17 L530,254.85 L555,255.39 L580,255.81
    " fill="none"
      stroke="var(--figure-ink)"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Les 8 points mesurés du tableau — la donnée -->
    <circle cx="80"  cy="100" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="120" cy="150" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="160" cy="180" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="200" cy="205" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="240" cy="220" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="280" cy="230" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="380" cy="245" r="2.6" fill="var(--figure-ink)"/>
    <circle cx="530" cy="255" r="2.6" fill="var(--figure-ink)"/>

    <!-- Étiquette du palier σ_f, fond surface (couvre 2 traits de quadrillage) -->
    <rect x="289" y="271" width="114" height="16" fill="var(--figure-surface)"/>
    <text x="295" y="283" font-size="10.5" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">σ</tspan><tspan dy="3" font-size="7.5">f</tspan><tspan
          dy="-3"> ≈ 0,19 S·m<tspan dy="-4" font-size="70%">−1</tspan></tspan></text>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- ══════════════════════════════════════════════════════
         LA lecture — la bonne demi-hauteur (σ0+σ_f)/2, accent
         ══════════════════════════════════════════════════════ -->
    <line x1="76" y1="180" x2="84" y2="180" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="80" y1="180" x2="160" y2="180"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="160" y1="180" x2="160" y2="350"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="160" y1="345" x2="160" y2="355" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <circle cx="160" cy="180" r="3.4" fill="var(--figure-accent)"/>

    <text x="72" y="184" text-anchor="end" font-size="10.5" fill="var(--figure-accent)">0,34</text>
    <text x="160" y="386" text-anchor="middle" font-size="11" fill="var(--figure-accent)"
          ><tspan font-style="italic">t</tspan><tspan dy="4" font-size="8">1/2</tspan><tspan
          dy="-4"> = 8 min</tspan></text>

    <!-- Boîte formule -->
    <rect x="395" y="40" width="245" height="30" rx="5"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="517" y="59" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">σ(t<tspan dy="4" font-size="9">1/2</tspan><tspan
          dy="-4">) = (σ</tspan><tspan dy="4" font-size="8">0</tspan><tspan
          dy="-4"> + σ</tspan><tspan dy="4" font-size="8">f</tspan><tspan dy="-4">) / 2</tspan></text>

    <!-- ══════════════════════════════════════════════════════
         LE piège — σ0/2, jamais accent, tracé visiblement différent
         ══════════════════════════════════════════════════════ -->
    <line x1="80" y1="225" x2="253.9" y2="225"
          stroke="var(--figure-ink-soft)" stroke-width="1.1" stroke-dasharray="2,2"/>
    <line x1="253.9" y1="225" x2="253.9" y2="350"
          stroke="var(--figure-ink-soft)" stroke-width="1.1" stroke-dasharray="2,2"/>
    <line x1="253.9" y1="345" x2="253.9" y2="355" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <circle cx="253.9" cy="225" r="2.6" fill="var(--figure-ink-soft)"/>

    <text x="253.9" y="386" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">≈ 18 min</text>

    <!-- Étiquette « piège », fond surface (couvre 2 traits de quadrillage) -->
    <rect x="262" y="205" width="96" height="17" fill="var(--figure-surface)"/>
    <text x="270" y="217" font-size="10" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">σ</tspan><tspan dy="3" font-size="7">0</tspan><tspan
          dy="-3">/2 : piège</tspan></text>
  </g><!-- /step-3 -->

</svg>
