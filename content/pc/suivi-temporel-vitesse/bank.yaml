        refait, courbe confirmée partant de l'origine, palier confirmé à
        ≈ 0,5 mmol, ordonnée à l'origine de la tangente (T) et point de
        tangence confirmés — docs/sujets/pc/suivi-temporel-vitesse.md, statut
