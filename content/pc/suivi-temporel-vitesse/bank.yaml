        reasoning: |-
          Deux calculs indépendants, chacun une application directe d'une définition : la concentration donne la quantité d'ions oxonium apportée par le volume $V_a$ versé ; la masse molaire donne la quantité de zinc à partir de la masse pesée $m$.
        steps:
          - math: 'n_i(H_3O^+) = [H_3O^+]\times V_a = 0{,}4\times0{,}075'
            note: "Definition de la concentration molaire, avec Va converti en litres."
          - math: '\boxed{n_i(H_3O^+) = 0{,}03\ \text{mol}}'
            note: "Quantite initiale d'ions oxonium."
          - math: 'n_i(Zn) = \frac{m}{M(Zn)} = \frac{0{,}6}{65{,}4}'
            note: "Quantite de matiere a partir de la masse pesee et de la masse molaire du zinc."
          - math: '\boxed{n_i(Zn) \approx 9{,}17\times10^{-3}\ \text{mol}}'
