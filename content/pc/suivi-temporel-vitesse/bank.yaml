    intro: |-
      **Suivi de l'action de l'acide sulfurique sur le zinc, par mesure de pression (examen national, session normale 2011 — Chimie, Partie I, 4,50 points sur les 7,00 de l'exercice complet).**

      *La seconde partie de cet exercice — l'argenture d'une pièce de cuivre par électrolyse — est indépendante et traitée à part, sous la notion « Électrolyse » (entrée bk-2011-n-x1b). Rien de ce qui suit n'en dépend.*

      Le dihydrogène est considéré comme un combustible possédant une haute énergie non polluante. Il peut-être synthétisé au laboratoire par action des acides sur quelques métaux. *(« peut-être » tel qu'imprimé sur le sujet officiel — trait d'union fautif, sans incidence.)*

      Le but de cet exercice est le suivi de l'action de l'acide sulfurique sur le zinc par mesure de pression.

      **Données :**
      - Tous les gaz sont considérés comme parfaits ;
      - Toutes les mesures ont été faites à $25\,^\circ\text{C}$ ;
      - On rappelle la loi des gaz parfaits : $P.V = n.R.T$ ;
      - La masse molaire atomique du zinc : $M(Zn) = 65{,}4\ \text{g.mol}^{-1}$.

      On modélise la réaction du zinc $Zn_{(S)}$ avec une solution d'acide sulfurique $\left(2\,H_3O^+_{(aq)} + SO_4^{2-}\right)$, par l'équation chimique suivante :

      $$Zn_{(S)} + 2\,H_3O^+_{(aq)} \rightleftharpoons Zn^{2+}_{(aq)} + H_{2(g)} + 2\,H_2O_{(\ell)}$$

      Pour étudier la cinétique de cette réaction, on introduit dans un ballon de volume constant $V = 1\ \text{L}$, une quantité de masse $m = 0{,}6\ \text{g}$ de poudre de Zinc *(« de Zinc », avec majuscule, tel qu'imprimé)* $Zn_{(S)}$, et on y verse à l'instant $t_0 = 0$, un volume $V_a = 75\ \text{mL}$ de la solution aqueuse d'acide sulfurique de concentration en ions oxonium $[H_3O^+] = 0{,}4\ \text{mol.L}^{-1}$. On mesure la pression $P$ à l'intérieur du ballon, à chaque instant, à l'aide d'un capteur de presssion. *(« intérieur » et « presssion » tels qu'imprimés sur le sujet officiel.)*

      **Figure 1 — la courbe $\Delta P(t)$, telle qu'imprimée sur le sujet officiel.** Repère orthogonal. Axe vertical $\Delta P\ (\text{hPa})$, gradué $0,\ 200,\ 400,\ 600$ ; axe horizontal $t\ (\text{min})$, gradué $50,\ 100,\ 150,\ 200,\ 250$. Quadrillage fin de pas $5\ \text{min} \times 20\ \text{hPa}$. La courbe part de l'origine, croît en décélérant, et plafonne à droite, à une hauteur voisine de la ligne $600$ (soit $\approx 740\ \text{hPa}$ à lire naïvement sur cette échelle imprimée).

      ⛔ *Cette échelle imprimée est un DÉFAUT DU SUJET OFFICIEL, consigné et non réparé — le plateau imprimé (≈ 740 hPa) contredit d'un facteur ≈ 3,24 la valeur que les données de l'énoncé imposent (≈ 227 hPa) ; le mécanisme identifié est une courbe tracée avec le mauvais réactif limitant (voir `sourcing.note` pour le détail complet). **Aucune valeur absolue de ΔP n'est utilisée dans ce qui suit** — seules la FORME de la courbe (croissance, plateau) et une lecture RELATIVE à mi-hauteur du palier, insensible à ce défaut, servent à la question 6.*
    questions:
      - id: q1
        part: "1 — Le tableau d'avancement"
        stem: |-
          **(0 ,5 pt)** *(barème tel qu'imprimé — espace avant la virgule, T7.)* Soitent $n_i(H_3O^+)$ et $n_i(Zn)$ les quantités de matière initiales respectivement des ions oxonium et du Zn. Recopier, sur votre copie de rédaction, le tableau descriptif suivant et le compléter. *(« Soitent » tel qu'imprimé, pour « Soient ».)*
        reasoning: |-
          C'est exactement la construction du chapitre 3 : une ligne par état d'avancement (initial, intermédiaire, maximal), chaque espèce évoluant selon son coefficient stœchiométrique dans l'équation — $1$ pour $Zn$, $Zn^{2+}$ et $H_2$ ; $2$ pour $H_3O^+$ ; $H_2O$, le solvant, reste « en excès » et n'entre pas dans le compte. On complète chaque colonne en RETRANCHANT le coefficient fois l'avancement pour un réactif, en l'AJOUTANT pour un produit — sans introduire aucune valeur numérique à ce stade : ni le réactif limitant, ni $x_{max}$, ne sont encore connus (ce sera l'objet des questions 2 et 3).

          | État | Avancement | $n(Zn)$ | $n(H_3O^+)$ | $n(Zn^{2+})$ | $n(H_2)$ | $n(H_2O)$ |
          |---|---|---|---|---|---|---|
          | Initial | $x=0$ | $n_i(Zn)$ | $n_i(H_3O^+)$ | $0$ | $0$ | en excès |
          | Intermédiaire | $x$ | $n_i(Zn)-x$ | $n_i(H_3O^+)-2x$ | $x$ | $x$ | en excès |
          | Maximal | $x_{max}$ | $n_i(Zn)-x_{max}$ | $n_i(H_3O^+)-2x_{max}$ | $x_{max}$ | $x_{max}$ | en excès |
      - id: q2
        stem: |-
          **(1 pt)** Calculer $n_i(H_3O^+)$ et $n_i(Zn)$.
        reasoning: |-
          Deux calculs indépendants, chacun une application directe d'une définition : la concentration donne la quantité d'ions oxonium apportée par le volume $V_a$ versé ; la masse molaire donne la quantité de zinc à partir de la masse pesée $m$.
        steps:
          - math: 'n_i(H_3O^+) = [H_3O^+]\times V_a = 0{,}4\times0{,}075'
            note: "Définition de la concentration molaire, avec Va converti en litres."
          - math: '\boxed{n_i(H_3O^+) = 0{,}03\ \text{mol}}'
            note: "Quantité initiale d'ions oxonium."
          - math: 'n_i(Zn) = \frac{m}{M(Zn)} = \frac{0{,}6}{65{,}4}'
            note: "Quantité de matière a partir de la masse pesee et de la masse molaire du zinc."
          - math: '\boxed{n_i(Zn) \approx 9{,}17\times10^{-3}\ \text{mol}}'
            note: "Quantité initiale de zinc."
      - id: q3
        stem: |-
          **(0,5 pt)** Déterminer le réactif limitant et déduire l'avancement maximal $x_{max}$ de la réaction.
        reasoning: |-
          Le réactif limitant est celui dont le rapport quantité/coefficient stœchiométrique est le plus petit — c'est lui qui s'annule en premier dans le tableau du chapitre 3. On compare donc $n_i(Zn)/1$ à $n_i(H_3O^+)/2$, pas les deux quantités brutes entre elles (comparer $9{,}17\times10^{-3}$ à $0{,}03$ directement ignorerait que $H_3O^+$ est consommé DEUX FOIS plus vite que $Zn$, à cause du coefficient $2$).
        steps:
          - math: '\frac{n_i(Zn)}{1} = 9{,}17\times10^{-3}\ \text{mol} \qquad \frac{n_i(H_3O^+)}{2} = \frac{0{,}03}{2} = 0{,}015\ \text{mol}'
            note: "On compare les quantités DIVISEES par leur coefficient stoechiometrique, pas les quantités brutes."
          - math: '9{,}17\times10^{-3} < 0{,}015 \implies Zn\ \text{est le réactif limitant}'
            note: "Le plus petit rapport designe le réactif limitant : c'est Zn, pas H3O+."
          - math: '\boxed{x_{max} = n_i(Zn) \approx 9{,}17\times10^{-3}\ \text{mol}}'
            note: "Zn a un coefficient 1 : x_max vaut directement sa quantité initiale."
      - id: q4
        part: "Établir x(t) à partir d'une mesure de pression"
        stem: |-
          **(1 pt)** Par application de la loi des gaz parfaits, et à l'aide du tableau descriptif précédent, établir l'expression de l'avancement $x(t)$ de la réaction à un instant $t$ en fonction de $R$, $T$, $V$ et $\Delta P$, où $\Delta P = P - P_0$, avec $P_0$ la pression initiale mesurée à l'instant $t_0 = 0$ et $P$ la pression mesurée à l'instant $t$.
        reasoning: |-
          Exactement le principe du chapitre 2 : on ne mesure jamais $x$ directement, on mesure une grandeur SUBSTITUT qui lui est reliée par une loi connue — ici, ce n'est pas une absorbance ou une conductivité, c'est une pression. Le tableau de la question 1 dit que le seul gaz produit est $H_2$, en quantité $x(t)$ à l'instant $t$ : c'est donc l'apparition de ce gaz, seule, qui fait monter la pression au-delà de sa valeur initiale $P_0$. En appliquant la loi des gaz parfaits à ce $H_2$ formé, dans le volume constant $V$ du ballon :
        steps:
          - math: 'n(H_2) = x(t) \quad \text{(coefficient 1 dans le tableau, question 1)}'
            note: "Le seul gaz produit est H2, en quantité egale a l'avancement x(t)."
          - math: '\Delta P \cdot V = x(t)\cdot R\cdot T'
            note: "Loi des gaz parfaits P.V=n.R.T appliquee au H2 forme : DeltaP est la pression due a ce gaz, dans le volume V constant."
          - math: '\boxed{x(t) = \frac{\Delta P \cdot V}{R\cdot T}}'
            note: "Expression demandee."
      - id: q5
        stem: |-
          **(0,5 pt)** Soit $\Delta P_{max} = P_{max}-P_0$ la variation maximale de la pression et $x_{max}$ l'avancement maximal de la réaction. Montrer la relation : $x(t) = x_{max}\dfrac{\Delta P}{\Delta P_{max}}$.
        reasoning: |-
          On applique la MÊME relation qu'à la question précédente, mais cette fois à l'état final, où l'avancement vaut $x_{max}$ et la variation de pression $\Delta P_{max}$. Diviser les deux relations terme à terme fait disparaître le facteur $V/(RT)$ — commun aux deux et jamais donné numériquement dans cet énoncé — et ne laisse plus qu'un rapport entre grandeurs mesurables.
        steps:
          - math: '\Delta P_{max}\cdot V = x_{max}\cdot R\cdot T \quad \text{(même relation qu a la question 4, a l état final)}'
            note: "Loi des gaz parfaits appliquee a l'état final, ou l'avancement vaut x_max."
          - math: '\frac{x(t)}{x_{max}} = \frac{\Delta P\cdot V/(R\cdot T)}{\Delta P_{max}\cdot V/(R\cdot T)} = \frac{\Delta P}{\Delta P_{max}}'
            note: "Division terme a terme des deux relations (question 4 et ci-dessus) : V/(RT) se simplifie."
          - math: '\boxed{x(t) = x_{max}\,\frac{\Delta P}{\Delta P_{max}}}'
            note: "Relation demandee."
      - id: q6
        part: "Lecture graphique de t_1/2 — la garde S1 s'applique ici"
        stem: |-
          **(1 pt)** Une étude expérimentale a permis de traçer la courbe de la figure 1, traduisant les variations de $\Delta P$ en fonction du temps. Trouver graphiquement la valeur du temps de demi-réaction $t_{1/2}$. *(« traçer » tel qu'imprimé, pour « tracer ».)*
        reasoning: |-
          ⛔ **La garde S1 s'applique intégralement à cette question — voir la note en tête de fiche.** On ne va PAS lire un $\Delta P_{max}$ en hPa sur cette figure : son échelle imprimée est incompatible avec les données (facteur ≈ 3,24, voir `sourcing.note`), et toute valeur qu'on en tirerait serait fausse. On n'en a heureusement pas besoin.

          Par définition (chapitre 5), $t_{1/2}$ est l'instant où $x(t_{1/2}) = x_{max}/2$. Par la relation établie à la question 5, $x(t)/x_{max} = \Delta P(t)/\Delta P_{max}$ — un rapport de deux hauteurs sur CETTE MÊME courbe, quelle que soit l'unité ou la justesse de l'étalonnage vertical. La condition sur $x$ se traduit donc en une condition purement RELATIVE sur la figure :

          $$x(t_{1/2}) = \frac{x_{max}}{2} \iff \Delta P(t_{1/2}) = \frac{\Delta P_{max}}{2}$$

          C'est la MI-HAUTEUR DU PALIER — un point que l'on repère visuellement sans jamais lire le nombre d'hPa qu'il représente : on prend le milieu, en hauteur, entre l'origine et le plateau, et on lit l'abscisse du point de la courbe qui l'atteint. Cette lecture ne dépend que de la FORME de la courbe et de l'axe des temps — le seul des deux axes que le défaut S1 ne touche pas.
        steps:
          - math: 'x(t_{1/2}) = \frac{x_{max}}{2} \iff \Delta P(t_{1/2}) = \frac{\Delta P_{max}}{2} \quad \text{(question 5, rapport insensible a l échelle verticale)}'
            note: "Condition de définition du chapitre 5, traduite en une lecture RELATIVE (mi-hauteur du palier), pas en une valeur absolue de DeltaP."
          - math: '\boxed{t_{1/2} \approx 42\ \text{min}}'
            note: "Lecture graphique : abscisse du point de la figure 1 a mi-hauteur du plateau -- aucune valeur absolue de DeltaP utilisée (garde S1)."

