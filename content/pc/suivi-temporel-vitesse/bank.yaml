        stem: |-
          **(0 ,5 pt)** *(barème tel qu'imprimé — espace avant la virgule, T7.)* Soitent $n_i(H_3O^+)$ et $n_i(Zn)$ les quantités de matière initiales respectivement des ions oxonium et du Zn. Recopier, sur votre copie de rédaction, le tableau descriptif suivant et le compléter. *(« Soitent » tel qu'imprimé, pour « Soient ».)*
        reasoning: |-
          C'est exactement la construction du rung 2 : une ligne par état d'avancement (initial, intermédiaire, maximal), chaque espèce évoluant selon son coefficient stœchiométrique dans l'équation — $1$ pour $Zn$, $Zn^{2+}$ et $H_2$ ; $2$ pour $H_3O^+$ ; $H_2O$, le solvant, reste « en excès » et n'entre pas dans le compte. On complète chaque colonne en RETRANCHANT le coefficient fois l'avancement pour un réactif, en l'AJOUTANT pour un produit — sans introduire aucune valeur numérique à ce stade : ni le réactif limitant, ni $x_{max}$, ne sont encore connus (ce sera l'objet des questions 2 et 3).

          | État | Avancement | $n(Zn)$ | $n(H_3O^+)$ | $n(Zn^{2+})$ | $n(H_2)$ | $n(H_2O)$ |
          |---|---|---|---|---|---|---|
          | Initial | $x=0$ | $n_i(Zn)$ | $n_i(H_3O^+)$ | $0$ | $0$ | en excès |
          | Intermédiaire | $x$ | $n_i(Zn)-x$ | $n_i(H_3O^+)-2x$ | $x$ | $x$ | en excès |
          | Maximal | $x_{max}$ | $n_i(Zn)-x_{max}$ | $n_i(H_3O^+)-2x_{max}$ | $x_{max}$ | $x_{max}$ | en excès |
      - id: q2
