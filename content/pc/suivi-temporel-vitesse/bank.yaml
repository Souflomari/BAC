    intro: |-
      **Suivi de l'action de l'acide sulfurique sur le zinc, par mesure de pression (examen national, session normale 2011 — Chimie, Partie I, 4,50 points sur les 7,00 de l'exercice complet).**

      *La seconde partie de cet exercice — l'argenture d'une pièce de cuivre par électrolyse — est indépendante et traitée à part, sous la notion « Électrolyse » (entrée bk-2011-n-x1b). Rien de ce qui suit n'en dépend.*

      Le dihydrogène est considéré comme un combustible possédant une haute énergie non polluante. Il peut-être synthétisé au laboratoire par action des acides sur quelques métaux. *(« peut-être » tel qu'imprimé sur le sujet officiel — trait d'union fautif, sans incidence.)*

      Le but de cet exercice est le suivi de l'action de l'acide sulfurique sur le zinc par mesure de pression.

      **Données :**
      - Tous les gaz sont considérés comme parfaits ;
      - Toutes les mesures ont été faites à $25\,^\circ\text{C}$ ;
      - On rappelle la loi des gaz parfaits : $P.V = n.R.T$ ;
      - La masse molaire atomique du zinc : $M(Zn) = 65{,}4\ \text{g.mol}^{-1}$.

      On modélise la réaction du zinc $Zn_{(S)}$ avec une solution d'acide sulfurique $\left(2\,H_3O^+_{(aq)} + SO_4^{2-}\right)$, par l'équation chimique suivante :

      $$Zn_{(S)} + 2\,H_3O^+_{(aq)} \rightleftharpoons Zn^{2+}_{(aq)} + H_{2(g)} + 2\,H_2O_{(\ell)}$$

      Pour étudier la cinétique de cette réaction, on introduit dans un ballon de volume constant $V = 1\ \text{L}$, une quantité de masse $m = 0{,}6\ \text{g}$ de poudre de Zinc *(« de Zinc », avec majuscule, tel qu'imprimé)* $Zn_{(S)}$, et on y verse à l'instant $t_0 = 0$, un volume $V_a = 75\ \text{mL}$ de la solution aqueuse d'acide sulfurique de concentration en ions oxonium $[H_3O^+] = 0{,}4\ \text{mol.L}^{-1}$. On mesure la pression $P$ à l'interieur du ballon, à chaque instant, à l'aide d'un capteur de presssion. *(« interieur » et « presssion » tels qu'imprimés sur le sujet officiel.)*

      **Figure 1 — la courbe $\Delta P(t)$, telle qu'imprimée sur le sujet officiel.** Repère orthogonal. Axe vertical $\Delta P\ (\text{hPa})$, gradué $0,\ 200,\ 400,\ 600$ ; axe horizontal $t\ (\text{min})$, gradué $50,\ 100,\ 150,\ 200,\ 250$. Quadrillage fin de pas $5\ \text{min} \times 20\ \text{hPa}$. La courbe part de l'origine, croît en décélérant, et plafonne à droite, à une hauteur voisine de la ligne $600$ (soit $\approx 740\ \text{hPa}$ à lire naïvement sur cette échelle imprimée).

      ⛔ *Cette échelle imprimée est un DÉFAUT DU SUJET OFFICIEL, consigné et non réparé — le plateau imprimé (≈ 740 hPa) contredit d'un facteur ≈ 3,24 la valeur que les données de l'énoncé imposent (≈ 227 hPa) ; le mécanisme identifié est une courbe tracée avec le mauvais réactif limitant (voir `sourcing.note` pour le détail complet). **Aucune valeur absolue de ΔP n'est utilisée dans ce qui suit** — seules la FORME de la courbe (croissance, plateau) et une lecture RELATIVE à mi-hauteur du palier, insensible à ce défaut, servent à la question 6.*
