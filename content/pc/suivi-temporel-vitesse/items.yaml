        correct: false
        feedback: >-
          Être proche de $x_{max}$ correspond à la fin de la réaction, pas
          à sa moitié ; $t_{1/2}$ exige $x=x_{max}/2$ exactement, atteint à
          $t=10$ min.
    correct_feedback: >
      $t_{1/2}$ se lit directement : on calcule $x_{max}/2$, puis on
      cherche cette valeur dans le tableau ou sur la courbe.
    solution: |
      x_max/2 = 6,0/2 = 3,0 mmol. Le tableau donne x(10 min) = 3,0 mmol
      exactement, donc t_1/2 = 10 min.

