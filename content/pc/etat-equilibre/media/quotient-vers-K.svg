<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le quotient de réaction Qr(t) augmente au cours du temps puis se fige à l'équilibre, à la valeur K de la constante d'équilibre : Qr,éq = K.">
  <title>Qr(t) et la constante d&#8217;équilibre K</title>
  <!--
    quotient-vers-K.svg — graphe STATIQUE de Qr(t) rejoignant l'asymptote K,
    pour Fe3+ + SCN- ⇌ FeSCN2+ (le fil rouge de la leçon).

    Géométrie — reprend délibérément le même gabarit que uc-charge.svg
    (content/pc/rc-charge/media/uc-charge.svg) : les deux figures montrent
    une grandeur qui monte vers une asymptote horizontale.
      origine (t=0, Qr=0) : (80, 208)
      asymptote K         : y = 78         → hauteur utile = 208-78 = 130 px
      échelle temporelle  : 24 px / minute (choix arbitraire de lisibilité,
                            pas une calibration mesurée)

    Données RÉELLES utilisées (tableau du rung R3, mêmes valeurs que le
    texte) :
      t (min)      0     2       5       10      équilibre
      Qr           0     3,1e2   7,4e2   1,4e3   K = 1875 (≈1,9e3)

    Tracé en SEGMENTS DE DROITE reliant ces points réels — PAS une courbe
    exponentielle ajustée. Vérification explicite que Qr(t) n'est PAS une
    simple exponentielle en t (donc une bézier "lissée" aurait menti sur la
    forme) : en résolvant Qr(t) = K(1-e^(-t/T)) séparément à t=2, 5, 10 min,
    on obtient T ≈ 11,1 / 10,0 / 7,3 — trois valeurs DIFFÉRENTES, preuve que
    Qr (rapport produit/(réactifs)²) n'évolue pas comme une simple
    exponentielle du temps, contrairement à une concentration isolée. Relier
    les points réels par des segments est donc la représentation honnête ;
    les points eux-mêmes sont marqués (cercles) pour montrer que ce sont des
    mesures, pas une loi continue.

    t_éq (x=440, soit t=15 min) est SCHÉMATIQUE : la leçon ne donne aucun
    instant précis pour l'équilibre de ce système (seulement "après
    quelques minutes", R0/R7) — 15 min est un placement plausible après le
    dernier point mesuré (t=10 min), choisi pour que le ralentissement de
    la courbe soit visuellement cohérent avec une approche de palier.

    Rôle des couleurs :
      courbe Qr(t) + ses points de mesure (t=2,5,10 min)     : --figure-ink
      axes, "0", ticks de temps (2, 5, 10)                    : --figure-ink-soft
      asymptote K + point d&#8217;équilibre + repère t_éq + label
        "Qr,éq = K"                                           : --figure-accent
        (le seul foyer : LA constante K et LE point où Qr la rejoint)
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Q<tspan dy="3" font-size="8.5">r</tspan><tspan dy="-3">(t) rejoint la constante d&#8217;équilibre K</tspan>
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="200" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ── Axes ──────────────────────────────────────────────── -->
  <line x1="80" y1="208" x2="610" y2="208"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="610,208 598,203.5 598,212.5" fill="var(--figure-ink-soft)"/>
  <line x1="80" y1="208" x2="80" y2="50"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="80,50 75.5,61 84.5,61" fill="var(--figure-ink-soft)"/>
  <text x="617" y="212" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">t<tspan dy="0" font-style="normal" font-size="9"> (min)</tspan></text>
  <text x="72" y="54" text-anchor="end" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">Q<tspan dy="3" font-size="7.5">r</tspan></text>
  <text x="72" y="212" text-anchor="end" font-size="10"
        fill="var(--figure-ink-soft)">0</text>

  <!-- Ticks de temps (données réelles du tableau R3) -->
  <line x1="128" y1="204" x2="128" y2="212" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
  <text x="128" y="222" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">2</text>
  <line x1="200" y1="204" x2="200" y2="212" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
  <text x="200" y="222" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">5</text>
  <line x1="320" y1="204" x2="320" y2="212" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
  <text x="320" y="222" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">10</text>

  <!-- Asymptote K -->
  <line x1="80" y1="78" x2="610" y2="78"
        stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="68" y="82" text-anchor="end" font-size="11" font-style="italic"
        fill="var(--figure-accent)">K</text>

  <!-- Repère vertical à t_éq -->
  <line x1="440" y1="78" x2="440" y2="208"
        stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="440" y1="204" x2="440" y2="212"
        stroke="var(--figure-accent)" stroke-width="1.6"/>
  <text x="440" y="225" text-anchor="middle" font-size="10"
        fill="var(--figure-accent)">équilibre</text>

  <!--
    Courbe Qr(t) — segments de droite reliant les valeurs RÉELLES du
    tableau R3 (t=0,2,5,10 min), puis plateau à K à partir de t_éq=15 min
    (schématique, voir en-tête).
  -->
  <path d="M80,208 L128,186.5 L200,156.7 L320,110.9 L440,78 L610,78"
        fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Points de mesure réels (t=2, 5, 10 min) -->
  <circle cx="128" cy="186.5" r="3" fill="var(--figure-ink)"/>
  <circle cx="200" cy="156.7" r="3" fill="var(--figure-ink)"/>
  <circle cx="320" cy="110.9" r="3" fill="var(--figure-ink)"/>

  <!-- Point d'équilibre : Qr,éq = K -->
  <circle cx="440" cy="78" r="4" fill="var(--figure-accent)"/>

  <!-- Étiquette directe sur la courbe -->
  <text x="150" y="163" font-size="12" font-style="italic" fill="var(--figure-ink)">Q<tspan
        dy="3" font-size="8.5">r</tspan></text>

  <!-- Étiquette directe au point d'équilibre -->
  <text x="452" y="64" font-size="11.5" font-style="italic" fill="var(--figure-accent)">Q<tspan
        dy="4" font-size="8">r,éq</tspan><tspan
        dy="-4"> = K</tspan>
  </text>

  <!-- Captions -->
  <text x="335" y="253" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">Q<tspan dy="3" font-size="7.5">r</tspan><tspan dy="-3">croît tant que le sens direct l&#8217;emporte, puis se fige à l&#8217;équilibre : Q</tspan><tspan dy="3" font-size="7.5">r,éq</tspan><tspan dy="-3"> = K (R3&#8211;R4).</tspan></text>
  <text x="335" y="269" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">K ne dépend que de la réaction et de la température — jamais de l&#8217;instant considéré.</text>

</svg>
