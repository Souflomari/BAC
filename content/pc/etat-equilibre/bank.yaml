  - id: bk-2015-n-x1
    title: "L'acide benzoïque dans l'eau : taux d'avancement final, quotient de réaction à l'équilibre et pKA"
    source:
      year: 2015
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 1 (Chimie) — Deuxième partie, §1 : réaction de l'acide benzoïque avec l'eau"
    bareme_total: 2.25
    duration_min: 14
    sourcing:
      status: sourced
      note: >-
        2015 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS 28, element/94472 (Exercice 1 — Chimie, Deuxième
        partie, §1 : réaction de l'acide benzoïque avec l'eau, état
        d'équilibre ; barème du §1 = 2,25 pt (0,75×3) sur les 4,75 pt de la
        Deuxième partie et les 7 pt de l'exercice complet — le §2
        (estérification de l'acide benzoïque, catalyseur H2SO4, rendement) et
        la Première partie (électrolyse du chlorure de sodium) sont hors
        périmètre de cette entrée). Transcription vérifiée en une passe :
        re-fetch indépendant AlloSchool + diff caractère par caractère
        (agent-vérificateur, 2026-07-14 ; docs/sujets/pc/etat-equilibre.md,
        statut « vérifié »). Recoupement assumé avec le sommet de leçon : ce
        même sujet est déjà le sommet r-bac de exercises.yaml (marqueur
        [[exercise:r-bac]] à R7 « Exercice de type bac ») — mêmes questions,
        mêmes valeurs numériques (τ = 0,072 ; Qr,eq = Cτ²/(1-τ) ; pKA ≈ 4,25) ;
