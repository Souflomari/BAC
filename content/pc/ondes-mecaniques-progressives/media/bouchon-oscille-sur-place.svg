<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le bouchon sur l’étang, en trois étapes. Étape 1 : une vague arrive de la gauche vers un bouchon au repos sur une ligne de position de repos. Étape 2 : la vague a dépassé le bouchon et continue vers le bord ; le bouchon, lui, est monté jusqu’à une position de crête puis redescendu jusqu’à une position de creux, avant de revenir à sa position de repos — un aller-retour vertical, marqué par des positions fantômes. Étape 3 : comparaison entre l’idée fausse (le bouchon dériverait horizontalement vers le bord, barrée) et l’idée correcte (le bouchon oscille sur place ; c’est l’énergie, pas l’eau, qui voyage vers le bord).">
  <title>Le bouchon oscille sur place : ce qui bouge, ce qui voyage</title>
  <!--
    bouchon-oscille-sur-place.svg — figure STAGED (LESSON-EXPERIENCE-SPEC
    §2.5 : figure autre qu'un graphe, ≥3 couches sémantiques, ordre =
    geste d'enseignement — ici le pari / le film / le nommage du modèle
    faux, exactement la progression narrative de R0 du texte).

    Scène unique (pas de panneaux empilés comme onde-propagation-retard) :
    une coupe latérale de la surface de l'étang, avec le bouchon à
    l'abscisse FIXE x=320. Convention d'inset reprise à l'identique des
    autres figures de cette leçon (rect x=40 width=560 → tracé x=64..576).

    STEP 1 — le pari : la boîte de scène, la ligne pointillée « position de
      repos » (= la ligne de base y=150), la surface de l'eau plate avec
      une bosse (la crête) qui approche par la gauche (x=150, loin du
      bouchon), la flèche « sens de propagation », et le bouchon au repos
      (cercle à x=320, sur la ligne de base) avec son étiquette.

    STEP 2 — le film : AJOUTE (jamais un restyle du step-1, contrat
      DOM-absence) —
        - une NOUVELLE surface d'eau, même gabarit de bosse, translatée à
          x=460 (la crête a dépassé le bouchon, continue vers le bord) ;
        - une nouvelle flèche de propagation, entre l'ancienne et la
          nouvelle crête, étiquetée « la vague continue vers le bord » ;
        - la trajectoire verticale du bouchon : ligne pointillée entre une
          position fantôme de crête (y=122) et une position fantôme de
          creux (y=178), une pointe de flèche vers le haut et une vers le
          bas ;
        - le bouchon plein REDESSINÉ au repos (mêmes coordonnées que le
          step-1), par-dessus la copie du step-1 qui, elle, sera atténuée
          à l'opacité 0.55 par le renderer — le bouchon reste donc net,
          « revenu à sa place », alors que la crête d'origine s'estompe
          en arrière-plan comme une image fantôme du « avant ».

    STEP 3 — nommer le modèle faux : AJOUTE deux panneaux sous la scène —
      à gauche l'idée fausse (flèche horizontale grisée, barrée d'une
      croix, « le bouchon dérive vers le bord ») ; à droite la paire
      correcte (double flèche verticale « oscille sur place » + flèche
      horizontale « l'énergie voyage, pas l'eau »), même grammaire de
      panneaux que transverse-longitudinal.svg.

    Couleurs (palette --figure-* uniquement) :
      surface de l'eau (la grandeur qui avance)       : --figure-accent
      le bouchon (l'objet qu'on suit, distinct de
        l'eau et des repères neutres)                 : --figure-energy-C
      repères neutres, flèches de propagation, ligne
        de repos, idée fausse (grisée)                : --figure-ink-soft
      libellés structurels (S, titres de panneau)      : --figure-ink
      paire correcte (step-3, à droite)                : --figure-accent
  -->

  <!-- Titre (chrome — précède tous les groupes step-N) -->
  <text x="320" y="18" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Le bouchon sur l’étang : ce qui bouge, ce qui voyage
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le pari : la scène au repos, la vague approche
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <rect x="40" y="40" width="560" height="200" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Ligne de référence « position de repos » -->
    <line x1="64" y1="150" x2="576" y2="150"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="70" y="143" text-anchor="start" font-size="10"
          fill="var(--figure-ink-soft)">position de repos</text>

    <!-- Surface de l'eau : plate, avec une bosse (la crête) qui approche par la gauche -->
    <path d="M64,150 L108,150 C122,150 129,122 150,122 C171,122 178,150 192,150 L576,150"
          fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Flèche de propagation -->
    <line x1="210" y1="95" x2="260" y2="95"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="260,95 248,90.5 248,99.5" fill="var(--figure-ink-soft)"/>
    <text x="235" y="82" text-anchor="middle" font-size="9.5"
          fill="var(--figure-ink-soft)">sens de propagation</text>

    <!-- Le bouchon, au repos -->
    <circle cx="320" cy="150" r="7" fill="var(--figure-energy-C)"
            stroke="var(--figure-surface)" stroke-width="1.5"/>
    <text x="320" y="174" text-anchor="middle" font-size="11"
          fill="var(--figure-ink)">bouchon</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — le film : la vague continue, le bouchon monte puis redescend
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Nouvelle surface d'eau : même gabarit de bosse, la crête a dépassé le bouchon -->
    <path d="M64,150 L418,150 C432,150 439,122 460,122 C481,122 488,150 502,150 L576,150"
          fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nouvelle flèche de propagation, entre l'ancienne et la nouvelle crête -->
    <line x1="350" y1="95" x2="400" y2="95"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="400,95 388,90.5 388,99.5" fill="var(--figure-ink-soft)"/>
    <text x="375" y="82" text-anchor="middle" font-size="9.5"
          fill="var(--figure-ink-soft)">la vague continue vers le bord</text>

    <!-- Trajectoire verticale du bouchon : crête fantôme → creux fantôme -->
    <line x1="320" y1="122" x2="320" y2="178"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="320,122 315.5,130 324.5,130" fill="var(--figure-energy-C)"/>
    <polygon points="320,178 315.5,170 324.5,170" fill="var(--figure-energy-C)"/>
    <circle cx="320" cy="122" r="7" fill="var(--figure-energy-C)" fill-opacity="0.35"/>
    <circle cx="320" cy="178" r="7" fill="var(--figure-energy-C)" fill-opacity="0.35"/>

    <!-- Le bouchon plein, redessiné au repos (par-dessus la copie atténuée du step-1) -->
    <circle cx="320" cy="150" r="7" fill="var(--figure-energy-C)"
            stroke="var(--figure-surface)" stroke-width="1.5"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — nommer le modèle faux : idée fausse (barrée) vs paire correcte
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- Panneau gauche : l'idée fausse -->
    <g id="panel-faux">
      <rect x="40" y="256" width="270" height="130" rx="8"
            fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
      <text x="175" y="276" text-anchor="middle" font-size="11" font-weight="600"
            fill="var(--figure-ink)">ce qu’on croit</text>

      <circle cx="95" cy="316" r="6" fill="var(--figure-ink-soft)" fill-opacity="0.7"/>
      <line x1="255" y1="296" x2="255" y2="336"
            stroke="var(--figure-ink-soft)" stroke-width="2.2"/>
      <line x1="105" y1="316" x2="245" y2="316"
            stroke="var(--figure-ink-soft)" stroke-width="1.8" stroke-dasharray="4,3"/>
      <polygon points="245,316 233,311.5 233,320.5" fill="var(--figure-ink-soft)"/>

      <!-- Croix de barrage, superposée sur la flèche -->
      <line x1="163" y1="304" x2="187" y2="328" stroke="var(--figure-ink-soft)" stroke-width="2.4"/>
      <line x1="163" y1="328" x2="187" y2="304" stroke="var(--figure-ink-soft)" stroke-width="2.4"/>

      <text x="175" y="356" text-anchor="middle" font-size="10.5" font-style="italic"
            fill="var(--figure-ink-soft)">le bouchon dérive vers le bord</text>
    </g><!-- /panel-faux -->

    <!-- Panneau droit : la paire correcte -->
    <g id="panel-correct">
      <rect x="330" y="256" width="270" height="130" rx="8"
            fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
      <text x="465" y="276" text-anchor="middle" font-size="11" font-weight="600"
            fill="var(--figure-ink)">ce qui se passe vraiment</text>

      <circle cx="385" cy="316" r="6" fill="var(--figure-energy-C)"/>
      <line x1="385" y1="298" x2="385" y2="334"
            stroke="var(--figure-accent)" stroke-width="1.8"/>
      <polygon points="385,298 380.5,306 389.5,306" fill="var(--figure-accent)"/>
      <polygon points="385,334 380.5,326 389.5,326" fill="var(--figure-accent)"/>
      <text x="400" y="320" text-anchor="start" font-size="10.5"
            fill="var(--figure-accent)">oscille sur place</text>

      <line x1="345" y1="358" x2="585" y2="358"
            stroke="var(--figure-accent)" stroke-width="1.8"/>
      <polygon points="585,358 573,353.5 573,362.5" fill="var(--figure-accent)"/>
      <text x="465" y="372" text-anchor="middle" font-size="10.5"
            fill="var(--figure-accent)">l’énergie voyage, pas l’eau</text>
    </g><!-- /panel-correct -->

  </g><!-- /step-3 -->

</svg>
