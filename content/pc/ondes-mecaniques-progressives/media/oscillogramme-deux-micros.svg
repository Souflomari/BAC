<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Écran d’oscilloscope à deux voies, 10 divisions à l’horizontale et 8 à la verticale, calibré à 0,5 milliseconde par division. La voie 1 (M1) montre une courte salve entre les divisions 1 et 2 ; la voie 2 (M2), une salve identique entre les divisions 7 et 8, décalée vers la droite. L’écart entre le début des deux salves vaut 6 divisions, soit 3,0 millisecondes.">
  <title>Oscillogramme à deux voies — mesurer un décalage de 6 divisions</title>
  <!--
    oscillogramme-deux-micros.svg — figure STAGED (LESSON-EXPERIENCE-SPEC
    §2.5 : un graphe est TOUJOURS stagé, ordre canonique axes → données →
    lecture), 3 étapes.
    content/pc/ondes-mecaniques-progressives/lesson.md, R4,
    "Mesurer une célérité avec deux microphones".

    PAS d'axes gradués en unités physiques ici (contrairement aux graphes
    E(θ)/u(t) des autres leçons) : un écran d'oscilloscope réel ne montre
    QUE des divisions comptables, et c'est délibérément ainsi que le texte
    le décrit ("on compte ce décalage... 6 divisions") — la lecture EST le
    comptage de carreaux, pas la lecture d'une valeur imprimée sur un axe.

    Écran : 10 divisions × 8 divisions, 50 px/division (nombre rond) :
      grille horizontale (verticale, x) : x = 90 + 50k, k=0..10 → 90..590
      grille verticale (horizontale, y) : y = 60 + 50k, k=0..8  → 60..460

    Étalonnage (donné par l'énoncé) : 0,5 ms/div — la réglette calibrée
    tient EXACTEMENT une division (x=90 à x=140).

    Salves — MÊME gabarit pour les deux voies (largeur ≈ 1 division = 50 px,
    hauteur crête-à-crête = 60 px = 1,2 division, dans la fourchette
    "≈ 1–1,5 div" du brief), un paquet d'onde amorti-réamorti à 9 points
    (Δx = 6,25 px), offsets verticaux identiques (px, + = vers le haut) :
      [0, 12, −22, 30, −30, 24, −16, 8, 0]
    Voie 1 (M1), ligne de base y=210, salve de la division 1 à 2
    (x=140 à x=190, DÉBUT en x=140 = 1 div depuis le bord gauche) :
      x = 140, 146.25, 152.5, 158.75, 165, 171.25, 177.5, 183.75, 190
      y = 210, 198,    232,   180,    240, 186,    226,   202,    210
    Voie 2 (M2), ligne de base y=360, salve de la division 7 à 8
    (x=440 à x=490, DÉBUT en x=440 = 7 div depuis le bord gauche) :
      x = 440, 446.25, 452.5, 458.75, 465, 471.25, 477.5, 483.75, 490
      y = 360, 348,    382,   330,    390, 336,    376,   352,    360
    (offsets vérifiés : 210−198=12 ✓ ; 210−(−22−210)... i.e. 232−210=22 ✓ ;
     180−210=−30→|+30| ✓ ; 240−210=30 ✓ ; identiques sur les deux voies —
     "même largeur, même hauteur" du brief.)

    Écart entre DÉBUTS homologues (le piège nommé par le texte : jamais
    largeur-d'une-salve, toujours début-à-début) :
      x(début M2) − x(début M1) = 440 − 140 = 300 px = 300/50 = 6 divisions ✓
      Δt = 6 div × 0,5 ms/div = 3,0 ms — cohérent avec le texte et avec
      v = d/Δt = 1,02 / 3,0×10⁻³ = 340 m/s.

    Rôle des couleurs :
      voie 1 (M1), voie 2 (M2) — les données      : --figure-energy-C / --figure-energy-L
      réglette d'étalonnage, quadrillage, bordure  : --figure-ink-soft / --figure-grid
      flèche de lecture (6 div), points homologues : --figure-accent
  -->

  <!-- Titre (chrome) -->
  <text x="340" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Deux microphones, un oscilloscope à deux voies
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — l'écran et son étalonnage (aucune trace encore)
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Chrome (fond) -->
    <rect x="70" y="44" width="540" height="436" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Bordure de l'écran (10 × 8 divisions) -->
    <rect x="90" y="60" width="500" height="400" fill="none"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>

    <!-- Quadrillage vertical (10 divisions, tous les 50 px) -->
    <line x1="140" y1="60" x2="140" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="190" y1="60" x2="190" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="240" y1="60" x2="240" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="290" y1="60" x2="290" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="340" y1="60" x2="340" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="390" y1="60" x2="390" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="440" y1="60" x2="440" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="490" y1="60" x2="490" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="540" y1="60" x2="540" y2="460" stroke="var(--figure-grid)" stroke-width="0.75"/>

    <!-- Quadrillage horizontal (8 divisions, tous les 50 px) -->
    <line x1="90" y1="110" x2="590" y2="110" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="90" y1="160" x2="590" y2="160" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="90" y1="210" x2="590" y2="210" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="90" y1="260" x2="590" y2="260" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="90" y1="310" x2="590" y2="310" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="90" y1="360" x2="590" y2="360" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="90" y1="410" x2="590" y2="410" stroke="var(--figure-grid)" stroke-width="0.75"/>

    <!-- Réglette d'étalonnage : exactement 1 division -->
    <line x1="90" y1="405" x2="90" y2="415" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="140" y1="405" x2="140" y2="415" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="90" y1="410" x2="140" y2="410" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="115" y="428" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">0,5 ms/div</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les deux voies : M1, puis M2 plus loin
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Voie 1 (M1) — ligne de base y=210, salve div. 1→2 -->
    <path d="M90,210 L140,210
             L146.25,198 L152.5,232 L158.75,180 L165,240 L171.25,186 L177.5,226 L183.75,202 L190,210
             L590,210"
          fill="none" stroke="var(--figure-energy-C)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="200" text-anchor="start" font-size="10" fill="var(--figure-energy-C)"
      >voie 1 (M<tspan dy="2.5" font-size="7.5">1</tspan><tspan dy="-2.5">)</tspan></text>

    <!-- Voie 2 (M2) — ligne de base y=360, salve div. 7→8, MÊME gabarit -->
    <path d="M90,360 L440,360
             L446.25,348 L452.5,382 L458.75,330 L465,390 L471.25,336 L477.5,376 L483.75,352 L490,360
             L590,360"
          fill="none" stroke="var(--figure-energy-L)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="350" text-anchor="start" font-size="10" fill="var(--figure-energy-L)"
      >voie 2 (M<tspan dy="2.5" font-size="7.5">2</tspan><tspan dy="-2.5">)</tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : 6 divisions entre les débuts homologues
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Points homologues : DÉBUT de chaque salve (jamais la largeur d'une salve) -->
    <circle cx="140" cy="210" r="3.4" fill="var(--figure-accent)"/>
    <circle cx="440" cy="360" r="3.4" fill="var(--figure-accent)"/>

    <!-- Guides verticaux jusqu'à la rangée de lecture -->
    <line x1="140" y1="210" x2="140" y2="110" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="440" y1="360" x2="440" y2="110" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Flèche double : 6 divisions -->
    <line x1="140" y1="110" x2="440" y2="110" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="140,110 150,105.5 150,114.5" fill="var(--figure-accent)"/>
    <polygon points="440,110 430,105.5 430,114.5" fill="var(--figure-accent)"/>
    <rect x="266" y="90" width="48" height="16" rx="3" fill="var(--figure-surface)"/>
    <text x="290" y="102" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-accent)">6 div</text>
  </g><!-- /step-3 -->

</svg>
