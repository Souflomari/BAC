    intro: |-
      **Propagation des ondes sonores dans l'air : mesure d'un retard temporel (examen national, session normale 2022, Exercice 2 — Partie 1).**

      Pour déterminer la célérité des ondes sonores dans l'air, on réalise le montage expérimental représenté sur le schéma de la figure 1. Ce montage est constitué d'un émetteur $E$ et d'un récepteur $R$ d'ondes sonores distants de $L = 85\ \text{cm}$. Une onde sonore émise par $E$, se propageant dans l'air, est reçue par $R$.

      On visualise à l'aide d'un système d'acquisition informatisé, à la fois, le signal (a) émis et le signal (b) reçu (figure 2).

      **Figure 1 (schéma).** Deux blocs rectangulaires étiquetés « $E$ » (Émetteur, à gauche) et « $R$ » (Récepteur, à droite), chacun dessiné avec une découpe en créneau sur le côté qui fait face à l'autre. Entre les deux, une flèche horizontale orientée vers la droite, étiquetée « Sens de propagation » au-dessus. En dessous, une double flèche horizontale reliant les deux blocs, étiquetée « $L$ ». Légende : « Figure 1 ».

      **Figure 2 (écran d'acquisition).** Grille quadrillée de 10 colonnes sur 8 lignes (11 traits verticaux × 9 traits horizontaux) représentant l'affichage du système d'acquisition ; les deux axes médians (ligne horizontale centrale, trait vertical central) portent de fines graduations non chiffrées. Deux petits rectangles pleins (signaux), chacun large d'une division : le signal (a), en haut à gauche, bord gauche sur le 2ᵉ trait vertical, sommet sur le 2ᵉ trait horizontal (étiqueté « (a) » en dessous) ; le signal (b), une ligne plus bas et cinq colonnes plus à droite, bord gauche sur le 7ᵉ trait vertical, sommet sur le 3ᵉ trait horizontal (étiqueté « (b) » en dessous) — soit un décalage horizontal d'exactement 5 divisions entre (a) et (b). Un repère d'échelle temporelle, en bas à droite de la grille, est matérialisé par une double flèche horizontale large d'exactement une division, étiquetée « $0{,}5\ \text{ms}$ » : c'est un étalonnage, 1 division $= 0{,}5\ \text{ms}$ — ce n'est pas une période. Légende : « Figure 2 ».
    questions:
      - id: q1a
        part: "1. Recopier le numéro de la question et répondre par vrai ou faux"
        stem: |-
          **1.1.** (0,25 pt) L'onde sonore est une onde transversale.
        reasoning: |-
          D'après le chapitre 5, le son se propage par compressions et dilatations successives de l'air, dans la même direction que celle où il avance — exactement le mécanisme du ressort étudié au chapitre 3. C'est le critère « déplacement parallèle à la propagation » qui définit une onde longitudinale, pas transversale (qui exigerait un déplacement perpendiculaire, comme sur une corde).

          L'affirmation est fausse : l'onde sonore est longitudinale.
      - id: q1b
        stem: |-
          **1.2.** (0,25 pt) L'onde sonore ne se propage pas dans le vide.
        reasoning: |-
          Une onde sonore est une onde mécanique (chapitre 2) : elle a besoin d'un milieu matériel, déformable et élastique, pour se propager de proche en proche — sans matière à déformer, rien ne peut relayer la perturbation. Le chapitre 5 le rappelle explicitement pour le son.

          L'affirmation est vraie : l'onde sonore ne se propage pas dans le vide.
      - id: q2
        stem: |-
          **(0,25 pt)** Déterminer la durée $\Delta t$ mise par le signal pour arriver au récepteur $R$.
        reasoning: |-
          Même lecture que celle décrite au chapitre 5 pour la mesure au double microphone : le décalage horizontal entre les deux signaux, compté en divisions de la grille, se convertit en temps grâce à l'étalonnage donné par la double flèche « $0{,}5\ \text{ms}$ », qui couvre exactement une division. Sur la figure 2, le bord du signal (b) est exactement 5 divisions plus loin que celui du signal (a) : ce décalage, c'est $\Delta t$, le retard du chapitre 4 appliqué ici entre l'émission et la réception.
        steps:
          - math: '\Delta t = 5\ \text{divisions} \times 0{,}5\ \text{ms/division}'
            note: "Comptage direct sur la grille (figure 2) : le bord du signal (b) est exactement 5 divisions après celui du signal (a), étalonnage 0,5 ms par division."
          - math: '\boxed{\Delta t = 2{,}5\ \text{ms}}'
            note: "Retard entre l'émission (signal a) et la réception (signal b)."
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer la célérité $v$ des ondes sonores dans l'air.
        reasoning: |-
          On applique directement la définition du chapitre 4, $v=d/\Delta t$, avec ici $d=L$ (la distance émetteur-récepteur, donnée) et $\Delta t$ le retard trouvé à la question précédente — exactement la méthode déjà illustrée au chapitre 5 avec les deux microphones, qui donnait la même valeur numérique.
        steps:
          - math: 'v = \frac{L}{\Delta t} = \frac{0{,}85}{2{,}5\times10^{-3}}'
            note: "Définition de la célérité (chapitre 4) : distance parcourue divisée par la durée mise pour la parcourir."
          - math: '\boxed{v \approx 340\ \text{m.s}^{-1}}'
            note: "Valeur canonique de la célérité du son dans l'air (coherente avec le chapitre 5)."

  # ── bk-2024-n-x2 — 2024 N, Exercice 2 : onde circulaire à la surface de l'eau ──
  - id: bk-2024-n-x2
    title: "Propagation d'un signal à la surface de l'eau : onde circulaire et célérité"
    source:
      year: 2024
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 2 — Propagation d'un signal à la surface de l'eau"
    bareme_total: 2.5
    duration_min: 15
    sourcing:
      status: sourced
      note: >-
        2024 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/145763, course-422/upload-87465
        (Exercice 2 — propagation d'un signal mécanique circulaire à la
        surface de l'eau ; barème de l'exercice = 2,5 pt). NB : le résumé
        HTML d'AlloSchool pour cet élément annonce à tort « 2ème BAC Sciences
        Mathématiques B » — l'en-tête du scan, lu directement, confirme sans
        ambiguïté SPC/BIOF. Transcription vérifiée : 2ᵉ passe, vérificateur
        indépendant (agent-vérificateur-indépendant, 2026-08-07), diff OK,
        portant sur le titre, le chapeau, le QCM (options A/B/C/D relues
        ligne à ligne au zoom ×1,6), le tableau de mesures (relu au zoom
        ×2,2) et la figure (revue élément par élément au zoom ×2,8 :
        l'encadré « Caillou » relié par une flèche au point $O$, les deux
        fronts en demi-cercles concentriques tracés à droite d'une corde
        verticale passant par $O$, l'étiquette « $r_2$ » sans unité, l'unité
        portée seulement sur l'étiquette d'axe « $r(\text{cm})$ »). Barème
        marginal recompté au scan : $0{,}5\times5=\mathbf{2{,}5}$. Physique
        re-dérivée et cohérente :
        $v=(r_2-r_1)/\Delta t=42/1{,}5=0{,}28\ \text{m.s}^{-1}$,
        $t_1=r_1/v=0{,}5\ \text{s} \Rightarrow t_2=t_1+1{,}5=2{,}0\ \text{s}$,
        $h=v^2/g=0{,}28^2/9{,}8\approx8{,}0\times10^{-3}\ \text{m}$.
    intro: |-
      **Propagation d'un signal à la surface de l'eau (examen national, session normale 2024, Exercice 2).**

      On se propose dans cet exercice d'étudier la propagation d'un signal mécanique à la surface de l'eau.

      Un caillou jeté, en un point $O$, dans une cuve contenant de l'eau de profondeur $h$, provoque la formation d'une onde circulaire qui se propage à la surface de l'eau. (Figure ci-dessous)

      **Figure (schéma, vue de dessus de la surface de l'eau).** En haut à gauche, un encadré rectangulaire « Caillou » relié par une flèche oblique descendante au point $O$ (gros point noir, centre du dispositif) — le caillou lui-même n'est pas dessiné. Centrés sur $O$ et tracés à droite d'une corde verticale passant par $O$, deux demi-cercles concentriques matérialisent les fronts d'onde successifs : le premier, de petit rayon, est relié par une flèche à un encadré « L'aspect à l'instant $t_1$ » (en haut à droite) ; le second, de grand rayon, est relié par une flèche à un encadré « L'aspect à l'instant $t_2$ » (en bas à droite). Un axe horizontal fléché vers la droite part de $O$, traverse les deux demi-cercles et porte, en bout, l'étiquette « $r(\text{cm})$ ». Les rayons sont repérés par deux étiquettes posées sur cet axe : « $r_1$ » juste après le petit demi-cercle et « $r_2$ » juste après le grand (« $r_2$ » sans l'unité — celle-ci n'apparaît que sur l'étiquette de l'axe). Aucune valeur numérique autre que celles du tableau n'est chiffrée sur le schéma ; pas de légende numérotée imprimée sur cette figure.

      **On peut estimer la célérité $v$ de l'onde qui se propage à la surface de l'eau par la relation :** $v = \sqrt{g.h}$, avec $g = 9{,}8\ \text{m.s}^{-2}$ l'intensité de la pesanteur et $h$ la profondeur de l'eau.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Choisir la proposition juste parmi les propositions suivantes :

          | | |
          |---|---|
          | A | Une onde progressive périodique est caractérisée par sa célérité. |
          | B | Un milieu est dispersif si la célérité de l'onde dépend de sa période T. |
          | C | Lors de la diffraction dans un même milieu, la célérité de l'onde est modifiée. |
          | D | Les ondes mécaniques progressives peuvent se propager dans le vide. |
        reasoning: |-
          On élimine d'abord ce qu'on peut trancher avec les chapitres de cette leçon. Proposition D : Le chapitre 2 est explicite, une onde mécanique a besoin d'un milieu matériel pour exister — elle ne se propage jamais dans le vide. D est fausse. Proposition C : la diffraction change la direction ou la forme du front d'onde, mais ne change ni le milieu ni sa rigidité — or le chapitre 4 établit que c'est seulement le milieu qui fixe la célérité ; la diffraction ne la modifie donc pas. C est fausse. Proposition A : Le chapitre 4 montre que la célérité caractérise toute onde progressive, périodique ou non — ce n'est donc pas un trait qui caractérise spécifiquement le caractère périodique de l'onde ; A est trop imprécise pour être la bonne réponse.

          Reste B, qui est la définition usuelle d'un milieu dispersif — un milieu où la célérité dépend de la période (ou de la fréquence) de l'onde qui le traverse. Cette notion de dispersion n'est pas construite dans les chapitres 1 à 6 de cette leçon (le pointeur d'échelle du chapitre 2 renvoie explicitement la périodicité au chapitre suivant, « Ondes mécaniques progressives périodiques ») ; on la reconnaît ici par élimination des trois autres propositions, toutes tranchables avec les chapitres 2 et 4. La proposition juste est donc B.
      - id: q2a
        part: "Exploitation du tableau des rayons du front d'onde"
        stem: |-
          **2-1.** (0,5 pt) Déterminer la valeur de la célérité $v$ de l'onde.
        reasoning: |-
          Exactement la méthode des chapitres 4 à 5 : la célérité, c'est une distance parcourue par le front d'onde divisée par la durée mise pour la parcourir. Entre les instants $t_1$ et $t_2$, le front avance du rayon $r_1$ au rayon $r_2$ — la distance parcourue par le front pendant cet intervalle est donc $r_2-r_1$, et la durée est $t_2-t_1=1{,}5\ \text{s}$ (donnée directement dans la définition de $t_2$ du tableau). Le chapitre 4 établit que la célérité ne dépend que du milieu (ici, l'eau) : elle est donc la même entre $0$ et $t_1$ qu'entre $t_1$ et $t_2$, ce qui justifie de la calculer sur l'intervalle où l'on connaît une durée exploitable.
        steps:
          - math: 'v = \frac{r_2 - r_1}{t_2 - t_1} = \frac{56 - 14}{1{,}5}\ \text{cm.s}^{-1}'
            note: "Définition de la célérité (chapitre 4) appliquee entre les instants t1 et t2 : distance parcourue par le front divisée par la durée."
          - math: 'v = \frac{42}{1{,}5} = 28\ \text{cm.s}^{-1}'
            note: "Application numérique."
          - math: '\boxed{v = 0{,}28\ \text{m.s}^{-1}}'
            note: "Conversion en unités SI (1 cm = 1e-2 m)."
      - id: q2b
        stem: |-
          **2-2.** (0,5 pt) En déduire la valeur de l'instant $t_2$.
        reasoning: |-
          La célérité étant fixée par le milieu (chapitre 4), elle est aussi celle du trajet entre $t=0$ (où le front part de $r=0$, en $O$) et $t_1$. On isole donc $t_1$ à partir de $v=r_1/t_1$ (retard du chapitre 4 appliqué ici entre $O$ et le rayon $r_1$), puis on utilise la relation donnée dans le tableau, $t_2=t_1+1{,}5$, pour obtenir $t_2$.
        steps:
          - math: 't_1 = \frac{r_1}{v} = \frac{14\times10^{-2}}{0{,}28}'
            note: "Même célérité qu'a la question précédente (chapitre 4 : elle ne dépend que du milieu), appliquee entre O (r=0, t=0) et r_1."
          - math: '\boxed{t_1 = 0{,}5\ \text{s}}'
            note: "Application numérique."
          - math: 't_2 = t_1 + 1{,}5 = 0{,}5 + 1{,}5'
            note: "Relation donnée dans le tableau de l'énoncé."
          - math: '\boxed{t_2 = 2{,}0\ \text{s}}'
            note: "Instant correspondant au grand front (r_2 = 56 cm)."
      - id: q3a
        part: "Estimation de la célérité par la relation donnée dans l'énoncé"
        stem: |-
          **3-1.** (0,5 pt) En utilisant les équations aux dimensions, vérifier l'homogénéité de cette relation.
        reasoning: |-
          Cette vérification ne repose sur aucun chapitre de cette leçon — l'équation aux dimensions est un outil transversal (utilisé dans toutes les notions de mécanique), pas une technique introduite ici. On écrit les dimensions de chaque grandeur : $[g]=\text{L.T}^{-2}$ (accélération), $[h]=\text{L}$ (longueur). Le produit $g.h$ a donc pour dimension $\text{L}^2.\text{T}^{-2}$, et sa racine carrée $\text{L.T}^{-1}$ — exactement la dimension d'une vitesse, celle de $v$ dans la définition du chapitre 4 ($v=d/\Delta t$, une longueur sur un temps). La relation est donc homogène.
        steps:
          - math: '[g.h] = \text{L.T}^{-2}\times\text{L} = \text{L}^2.\text{T}^{-2}'
            note: "Dimension du produit g fois h : g est une accélération (L.T^-2), h une longueur (L)."
          - math: '\left[\sqrt{g.h}\right] = \text{L.T}^{-1} = [v]'
            note: "La racine carrée donne la dimension d'une vitesse, coherente avec [v] = [d]/[Delta t] (chapitre 4)."
      - id: q3b
        stem: |-
          **3-2.** (0,5 pt) Calculer $h$.
        reasoning: |-
          On isole $h$ dans la relation $v=\sqrt{g.h}$ donnée dans l'énoncé, en réutilisant la valeur de $v$ trouvée à la question 2-1 — une célérité fixée par le milieu (chapitre 4), donc la même tout au long de la propagation observée dans le tableau.
        steps:
          - math: 'v = \sqrt{g.h} \implies h = \frac{v^2}{g}'
            note: "On isole h par élévation au carré des deux membres."
          - math: 'h = \frac{0{,}28^2}{9{,}8}'
            note: "Application numérique, avec v = 0,28 m/s trouve a la question 2-1."
          - math: '\boxed{h \approx 8{,}0\times10^{-3}\ \text{m}}'
            note: "Profondeur de l'eau dans la cuve."

