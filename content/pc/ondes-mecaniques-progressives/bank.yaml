    intro: |-
      **Propagation d'un signal à la surface de l'eau (examen national, session normale 2024, Exercice 2).**

      On se propose dans cet exercice d'étudier la propagation d'un signal mécanique à la surface de l'eau.

      Un caillou jeté, en un point $O$, dans une cuve contenant de l'eau de profondeur $h$, provoque la formation d'une onde circulaire qui se propage à la surface de l'eau. (Figure ci-dessous)

      **Figure (schéma, vue de dessus de la surface de l'eau).** En haut à gauche, un encadré rectangulaire « Caillou » relié par une flèche oblique descendante au point $O$ (gros point noir, centre du dispositif) — le caillou lui-même n'est pas dessiné. Centrés sur $O$ et tracés à droite d'une corde verticale passant par $O$, deux demi-cercles concentriques matérialisent les fronts d'onde successifs : le premier, de petit rayon, est relié par une flèche à un encadré « L'aspect à l'instant $t_1$ » (en haut à droite) ; le second, de grand rayon, est relié par une flèche à un encadré « L'aspect à l'instant $t_2$ » (en bas à droite). Un axe horizontal fléché vers la droite part de $O$, traverse les deux demi-cercles et porte, en bout, l'étiquette « $r(\text{cm})$ ». Les rayons sont repérés par deux étiquettes posées sur cet axe : « $r_1$ » juste après le petit demi-cercle et « $r_2$ » juste après le grand (« $r_2$ » sans l'unité — celle-ci n'apparaît que sur l'étiquette de l'axe). Aucune valeur numérique autre que celles du tableau n'est chiffrée sur le schéma ; pas de légende numérotée imprimée sur cette figure.

      **On peut estimer la célérité $v$ de l'onde qui se propage à la surface de l'eau par la relation :** $v = \sqrt{g.h}$, avec $g = 9{,}8\ \text{m.s}^{-2}$ l'intensité de la pesanteur et $h$ la profondeur de l'eau.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Choisir la proposition juste parmi les propositions suivantes :

          | | |
          |---|---|
          | A | Une onde progressive périodique est caractérisée par sa célérité. |
          | B | Un milieu est dispersif si la célérité de l'onde dépend de sa période T. |
          | C | Lors de la diffraction dans un même milieu, la célérité de l'onde est modifiée. |
          | D | Les ondes mécaniques progressives peuvent se propager dans le vide. |
        reasoning: |-
          On élimine d'abord ce qu'on peut trancher avec les rungs de cette leçon. Proposition D : R1 est explicite, une onde mécanique a besoin d'un milieu matériel pour exister — elle ne se propage jamais dans le vide. D est fausse. Proposition C : la diffraction change la direction ou la forme du front d'onde, mais ne change ni le milieu ni sa rigidité — or R3 établit que c'est seulement le milieu qui fixe la célérité ; la diffraction ne la modifie donc pas. C est fausse. Proposition A : R3 montre que la célérité caractérise toute onde progressive, périodique ou non — ce n'est donc pas un trait qui caractérise spécifiquement le caractère périodique de l'onde ; A est trop imprécise pour être la bonne réponse.

          Reste B, qui est la définition usuelle d'un milieu dispersif — un milieu où la célérité dépend de la période (ou de la fréquence) de l'onde qui le traverse. Cette notion de dispersion n'est pas construite dans les rungs R0–R5 de cette leçon (le pointeur d'échelle de R1 renvoie explicitement la périodicité au chapitre suivant, « Ondes mécaniques progressives périodiques ») ; on la reconnaît ici par élimination des trois autres propositions, toutes tranchables avec R1 et R3. La proposition juste est donc B.
      - id: q2a
        part: "Exploitation du tableau des rayons du front d'onde"
        stem: |-
          **2-1.** (0,5 pt) Déterminer la valeur de la célérité $v$ de l'onde.
        reasoning: |-
          Exactement la méthode de R3–R4 : la célérité, c'est une distance parcourue par le front d'onde divisée par la durée mise pour la parcourir. Entre les instants $t_1$ et $t_2$, le front avance du rayon $r_1$ au rayon $r_2$ — la distance parcourue par le front pendant cet intervalle est donc $r_2-r_1$, et la durée est $t_2-t_1=1{,}5\ \text{s}$ (donnée directement dans la définition de $t_2$ du tableau). R3 établit que la célérité ne dépend que du milieu (ici, l'eau) : elle est donc la même entre $0$ et $t_1$ qu'entre $t_1$ et $t_2$, ce qui justifie de la calculer sur l'intervalle où l'on connaît une durée exploitable.
        steps:
          - math: 'v = \frac{r_2 - r_1}{t_2 - t_1} = \frac{56 - 14}{1{,}5}\ \text{cm.s}^{-1}'
            note: "Definition de la celerite (R3) appliquee entre les instants t1 et t2 : distance parcourue par le front divisee par la duree."
          - math: 'v = \frac{42}{1{,}5} = 28\ \text{cm.s}^{-1}'
            note: "Application numerique."
          - math: '\boxed{v = 0{,}28\ \text{m.s}^{-1}}'
            note: "Conversion en unites SI (1 cm = 1e-2 m)."
      - id: q2b
        stem: |-
          **2-2.** (0,5 pt) En déduire la valeur de l'instant $t_2$.
        reasoning: |-
          La célérité étant fixée par le milieu (R3), elle est aussi celle du trajet entre $t=0$ (où le front part de $r=0$, en $O$) et $t_1$. On isole donc $t_1$ à partir de $v=r_1/t_1$ (retard de R3 appliqué ici entre $O$ et le rayon $r_1$), puis on utilise la relation donnée dans le tableau, $t_2=t_1+1{,}5$, pour obtenir $t_2$.
        steps:
          - math: 't_1 = \frac{r_1}{v} = \frac{14\times10^{-2}}{0{,}28}'
            note: "Meme celerite qu'a la question precedente (R3 : elle ne depend que du milieu), appliquee entre O (r=0, t=0) et r_1."
          - math: '\boxed{t_1 = 0{,}5\ \text{s}}'
            note: "Application numerique."
          - math: 't_2 = t_1 + 1{,}5 = 0{,}5 + 1{,}5'
            note: "Relation donnee dans le tableau de l'enonce."
          - math: '\boxed{t_2 = 2{,}0\ \text{s}}'
            note: "Instant correspondant au grand front (r_2 = 56 cm)."
      - id: q3a
        part: "Estimation de la célérité par la relation donnée dans l'énoncé"
        stem: |-
          **3-1.** (0,5 pt) En utilisant les équations aux dimensions, vérifier l'homogénéité de cette relation.
        reasoning: |-
          Cette vérification ne repose sur aucun rung de cette leçon — l'équation aux dimensions est un outil transversal (utilisé dans toutes les notions de mécanique), pas une technique introduite ici. On écrit les dimensions de chaque grandeur : $[g]=\text{L.T}^{-2}$ (accélération), $[h]=\text{L}$ (longueur). Le produit $g.h$ a donc pour dimension $\text{L}^2.\text{T}^{-2}$, et sa racine carrée $\text{L.T}^{-1}$ — exactement la dimension d'une vitesse, celle de $v$ dans la définition de R3 ($v=d/\Delta t$, une longueur sur un temps). La relation est donc homogène.
        steps:
          - math: '[g.h] = \text{L.T}^{-2}\times\text{L} = \text{L}^2.\text{T}^{-2}'
            note: "Dimension du produit g fois h : g est une acceleration (L.T^-2), h une longueur (L)."
          - math: '\left[\sqrt{g.h}\right] = \text{L.T}^{-1} = [v]'
            note: "La racine carree donne la dimension d'une vitesse, coherente avec [v] = [d]/[Delta t] (R3)."
      - id: q3b
        stem: |-
          **3-2.** (0,5 pt) Calculer $h$.
        reasoning: |-
          On isole $h$ dans la relation $v=\sqrt{g.h}$ donnée dans l'énoncé, en réutilisant la valeur de $v$ trouvée à la question 2-1 — une célérité fixée par le milieu (R3), donc la même tout au long de la propagation observée dans le tableau.
        steps:
          - math: 'v = \sqrt{g.h} \implies h = \frac{v^2}{g}'
            note: "On isole h par elevation au carre des deux membres."
          - math: 'h = \frac{0{,}28^2}{9{,}8}'
            note: "Application numerique, avec v = 0,28 m/s trouve a la question 2-1."
          - math: '\boxed{h \approx 8{,}0\times10^{-3}\ \text{m}}'
            note: "Profondeur de l'eau dans la cuve."
