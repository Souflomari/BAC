    intro: |-
      **Ondes le long d'une corde (examen national, session de rattrapage 2015 — Exercice 2, bloc « Ondes », 1,5 point sur les 03 de l'exercice complet).**

      *L'Exercice 2 est un QCM de cinq questions à numérotation continue : les questions 1 à 3 (Ondes) sont ici ; les questions 4 et 5 (Physique nucléaire) vivent sous la notion « Décroissance radioactive » (entrée du sujet 2015).*

      L'exercice comprend cinq questions, à chacune on a proposé quatres réponses. Recopier sur la copie, le numéro de la question et écrire à coté la réponse juste, parmi les quatres réponses proposées, sans aucune justification. *(« quatres » (×2), « à coté » et la virgule après « Recopier sur la copie » tels qu'imprimés — défauts du sujet officiel, sans incidence)*

      Pour déterminer la célérité de propagation d'une onde le long d'une corde, le professeur de physique demande à l'un des élèves de produire un ébranlement à l'une des extrémité d'une corde horizontale, et en même temps, il demande à une élève de filmer la séquence à l'aide d'une caméra numérique réglée sur la prise de **25 images par seconde**. *(« à l'une des extrémité » tel qu'imprimé)*

      Une règle blanche (R) de logueur **1 m**, a été placée au voisinage de la corde comme échelle de mesure. *(« logueur » tel qu'imprimé)*

      Après traitement informatique avec un logiciel convenable, le professeur choisit parmi les photos obtenues, les photos N°8 et N°12 (Figure ci-dessus), pour les étudier et les exploiter.

      **Figure (photos N°8 et N°12, sans numéro sur le sujet).** Deux panneaux superposés sur quadrillage (les lignes majeures espacées d'environ un demi-mètre à l'échelle de la règle). **Panneau haut, « Photo N°8 »** : la corde, trait horizontal épais, porte un ébranlement en S — une crête PUIS un creux dans le sens de lecture ; la règle blanche (R), rectangle à bord noir posé SOUS la corde à droite, couvre **deux carreaux majeurs** pour son mètre de longueur. **Panneau bas, « Photo N°12 »** : même corde, même règle exactement au même endroit ; l'ébranlement, de forme inchangée, s'est déplacé vers la droite. **Mesure de la vérification : entre les deux photos, l'ébranlement s'est déplacé — sur son bord avant comme sur son bord arrière — d'exactement la longueur de la règle, soit deux carreaux majeurs ($d = 130\ \text{px}$ pour une règle de $131\ \text{px}$).**
    questions:
      - id: q1
        part: "❖ Ondes (QCM, questions 1 à 3)"
        stem: |-
          **1-** (0,5 pt) La durée $\Delta t$ séparant la prise des deux photos N°8 et N°12 de l'onde est :

          | | |
          |---|---|
          | **A** | $\Delta t = 0{,}12\ \text{s}$ |
          | **B** | $\Delta t = 0{,}16\ \text{s}$ |
          | **C** | $\Delta t = 0{,}20\ \text{s}$ |
          | **D** | $\Delta t = 0{,}24\ \text{s}$ |
        reasoning: |-
          La caméra prend $25$ images par seconde : deux photos consécutives sont séparées de $\dfrac{1}{25} = 0{,}04\ \text{s}$. Entre la photo N°8 et la photo N°12, il s'écoule $12-8 = 4$ **intervalles** :

          $$\Delta t = 4\times\frac{1}{25} = 0{,}16\ \text{s}$$

          $$\boxed{\text{B}}$$

          **Pourquoi les trois autres échouent — chacune est une erreur de comptage identifiable.** A ($0{,}12\ \text{s}$) compte $3$ intervalles, comme si l'écart des numéros devait être diminué de $1$. C ($0{,}20\ \text{s}$) compte $5$ — c'est le piège classique : compter les PHOTOS ($8, 9, 10, 11, 12$, soit cinq images) au lieu des intervalles qui les séparent (quatre). D ($0{,}24\ \text{s}$) compte $6$ intervalles, sans lecture cohérente possible. La règle sûre : $n$ photos numérotées consécutivement = $n-1$ intervalles, et ici l'écart des numéros ($12-8$) EST directement le nombre d'intervalles.
        steps:
          - math: '\frac{1}{25} = 0{,}04\ \text{s entre deux images consécutives}'
            note: "25 images par seconde (donnée de l'énoncé)."
          - math: '\Delta t = (12-8)\times0{,}04 = 0{,}16\ \text{s}'
            note: "L'écart des numéros de photos EST le nombre d'intervalles."
          - math: '\boxed{\text{B\,: } \Delta t = 0{,}16\ \text{s}}'
            note: "C (0,20 s) compterait les 5 photos au lieu des 4 intervalles."
      - id: q2
        stem: |-
          **2-** (0,5 pt) La distance d  parcourue par l'onde pendant la durée $\Delta t$ est :

          | | |
          |---|---|
          | **A** | $d = 2\ \text{cm}$ |
          | **B** | $d = 0{,}50\ \text{m}$ |
          | **C** | $d = 1{,}00\ \text{m}$ |
          | **D** | $d = 1{,}50\ \text{m}$ |
        reasoning: |-
          L'ébranlement se propage SANS se déformer (chapitre 2 : c'est la perturbation qui voyage, la matière de la corde ne fait que monter et descendre) : on peut donc suivre n'importe quel point identifiable de sa forme — son bord avant, son bord arrière — entre les deux photos, à condition de comparer des points HOMOLOGUES.

          La règle (R) donne l'échelle : $1\ \text{m}$ pour deux carreaux majeurs du quadrillage. Entre la photo N°8 et la photo N°12, le bord avant ET le bord arrière de l'ébranlement se sont déplacés de **deux carreaux majeurs** — exactement la longueur de la règle (mesure de la vérification : $130\ \text{px}$ de déplacement pour une règle de $131\ \text{px}$) :

          $$\boxed{\text{C\,: } d = 1{,}00\ \text{m}}$$

          **Pourquoi les trois autres échouent.** A ($2\ \text{cm}$) lirait une distance « sur le papier », sans passer par l'échelle — la règle est imprimée précisément pour interdire cette lecture. B ($0{,}50\ \text{m}$) ne compte qu'UN carreau majeur : c'est ce qu'on trouve en comparant deux points non homologues (la crête d'une photo avec le creux de l'autre, par exemple), la moitié du déplacement réel. D ($1{,}50\ \text{m}$) exigerait trois carreaux de déplacement — aucun point de l'ébranlement ne se déplace d'autant entre les deux photos.
        steps:
          - math: '1\ \text{m (règle)} = 2\ \text{carreaux majeurs}'
            note: "L'échelle est donnée par la règle (R), pas par le papier."
          - math: 'd = 2\ \text{carreaux} = 1{,}00\ \text{m}'
            note: "Déplacement identique du bord avant et du bord arrière : la forme se conserve (chapitre 2)."
          - math: '\boxed{\text{C\,: } d = 1{,}00\ \text{m}}'
            note: "B (0,50 m) comparerait des points non homologues ; A ignorerait l'échelle."
      - id: q3
        stem: |-
          **3-** (0,5 pt) La célerité de propagation de l'onde le long de la corde est : *(« célerité » tel qu'imprimé — défaut du sujet officiel, sans incidence)*

          | | |
          |---|---|
          | **A** | $v = 5{,}10\ \text{m.s}^{-1}$ |
          | **B** | $v = 6{,}25\ \text{m.s}^{-1}$ |
          | **C** | $v = 7{,}30\ \text{m.s}^{-1}$ |
          | **D** | $v = 10{,}50\ \text{m.s}^{-1}$ |
        reasoning: |-
          La célérité d'une onde progressive (chapitre 4) est le rapport de la distance parcourue à la durée du parcours — et les questions 1 et 2 viennent d'établir les deux :

          $$v = \frac{d}{\Delta t} = \frac{1{,}00}{0{,}16}$$

          $$\boxed{\text{B\,: } v = 6{,}25\ \text{m.s}^{-1}}$$

          **Pourquoi les trois autres échouent.** Seule $6{,}25\ \text{m.s}^{-1}$ vaut exactement $d/\Delta t$ avec les valeurs correctes : $5{,}10$ et $7{,}30$ ne correspondent à aucun rapport exact des valeurs proposées aux questions 1 et 2, et $10{,}50$ supposerait un déplacement presque double (ou une durée presque moitié) de ce que montrent les photos. Remarque de prudence propre aux QCM en cascade : une erreur aux questions 1 ou 2 peut retomber « par chance » sur une proposition ici ($1{,}50/0{,}24 = 6{,}25$ aussi !) — c'est la cohérence de TOUTE la chaîne ($4$ intervalles, $2$ carreaux, $6{,}25$) qui valide le triplet, pas une case isolée.
        steps:
          - math: 'v = \frac{d}{\Delta t} = \frac{1{,}00}{0{,}16}'
            note: "Célérité d'une onde progressive (chapitre 4) : distance / durée."
          - math: '\boxed{\text{B\,: } v = 6{,}25\ \text{m.s}^{-1}}'
            note: "Coherent avec le triplet complet : 4 intervalles, 2 carreaux, 6,25 m/s."
