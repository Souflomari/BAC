  # ── bk-2018-n-x2 — 2018 N, Exercice II : ultrasons dans un liquide ────────
  # Même sujet que le sommet de leçon r-bac (exercises.yaml). Voir la note
  # éditoriale et la lacune de sourçage signalées en tête de ce fichier.
  - id: bk-2018-n-x2
    title: "Détermination de la célérité d'une onde ultrasonore dans un liquide"
    source:
      year: 2018
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice II — Détermination de la célérité d'une onde ultrasonore dans un liquide"
    bareme_total: 2.5
    duration_min: 15
    sourcing:
      status: sourced
      note: >-
        2018 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/57726 (Exercice II — détermination de
        la célérité d'une onde ultrasonore dans le pétrole liquide, par
        mesure d'un retard temporel entre deux récepteurs — l'un dans l'air,
        l'autre dans le pétrole — reliés à un oscilloscope ; barème de
        l'exercice = 2,5 pt). Transcription vérifiée : re-fetch indépendant
        AlloSchool + diff OK (agent-vérificateur, 2026-07-11 ;
        docs/sujets/pc/ondes-mecaniques-progressives.md, statut « vérifié »).
        RECOUPEMENT ASSUMÉ (signalé, non résolu ici) : ce même sujet est
        aussi le sommet de leçon r-bac (exercises.yaml, marqueur
        [[exercise:r-bac]] à R5 « Exercice de type bac ») ; les valeurs
        numériques ci-dessous (décalage de 2 divisions à l'écran,
        $\tau=4{,}0\ \text{ms}$, $V_p\approx1{,}3\times10^3\ \text{m.s}^{-1}$)
        sont reprises à l'identique de r-bac pour rester cohérentes avec le
        sommet, avec un raisonnement rédigé à nouveau (voix maison), pas
        copié de exercises.yaml. LACUNE DE SOURÇAGE SIGNALÉE (à l'arbitrage
        de l'owner, non corrigée ici — voir l'en-tête du fichier) : ni la
        fiche docs/sujets pour ce sujet 2018 ni exercises.yaml ne documentent
        de mesure au pixel du décalage réel entre les deux salves sur
        l'oscillogramme — contrairement aux entrées 2022 et 2024 de cette
        même notion, qui portent chacune une section « Physique re-dérivée »
        avec re-mesure au pixel de la figure.
    intro: |-
      **Détermination de la célérité d'une onde ultrasonore dans un liquide (examen national, session normale 2018, Exercice II).**

      Les ondes mécaniques se propagent seulement dans un milieu matériel, et leur célérité (vitesse de propagation) croît avec la densité du milieu où elles se propagent.

      Pour déterminer la valeur approximative de la célérité $V_p$ d'une onde ultrasonore dans le pétrole liquide, on réalise l'expérience suivante : dans une cuve contenant du pétrole, on fixe à l'une de ses extrémités deux émetteurs $E_1$ et $E_2$ qui sont reliés à un générateur GBF. À l'instant $t_0 = 0$, les deux émetteurs émettent chacun une onde ultrasonore, une se propage dans l'air et l'autre dans le pétrole. À l'autre extrémité de la cuve, on place deux récepteurs $R_1$ et $R_2$, l'un dans l'air et l'autre dans le pétrole. Les récepteurs sont à une distance $L$ des émetteurs. On visualise sur l'écran d'un oscilloscope les deux signaux reçus par $R_1$ et $R_2$.

      **Données :** les deux ondes parcourent la même distance $L = 1{,}84\ \text{m}$ ; la célérité des ultrasons dans l'air $V_{air} = 340\ \text{m.s}^{-1}$ ; la sensibilité horizontale de l'oscilloscope $2\ \text{ms/div}$ ; sur l'écran, le décalage horizontal entre les débuts des deux salves mesure $2$ divisions.

      **Figure 1 (schéma).** Cuve horizontale. À gauche, les émetteurs $E_1$ (en haut, dans l'air) et $E_2$ (en bas, dans le pétrole), reliés au GBF. À droite, les récepteurs $R_1$ (air) et $R_2$ (pétrole), reliés à l'oscilloscope. La partie haute de la cuve est de l'air, la partie basse (grisée) est le pétrole ; la distance émetteurs → récepteurs est notée $L$.

      **Figure 2 (écran d'oscilloscope).** Deux salves (trains d'ondes ultrasonores) décalées horizontalement — Voie A (en haut) et Voie B (en bas). Le décalage horizontal entre les débuts des deux salves matérialise le retard $\tau$, à mesurer en divisions puis à convertir via $2\ \text{ms/div}$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Les ondes ultrasonores sont-elles longitudinales ou transversales ? Justifier.
        reasoning: |-
          Les ultrasons sont des ondes sonores, seulement trop aiguës pour être entendues — R4 établit que le son se propage par compressions et dilatations successives du milieu, exactement le mécanisme du ressort étudié en R2. Le critère de R2 : on compare la direction du déplacement de la matière à la direction de propagation. Dans une compression qui court le long d'un milieu (air, liquide), les molécules oscillent dans l'axe même où la perturbation avance — les deux directions coïncident.

          L'onde ultrasonore est donc longitudinale, et non transversale (qui exigerait un déplacement perpendiculaire à la propagation, comme sur une corde).
      - id: q2
        stem: |-
          **(0,5 pt)** En exploitant la figure 2, déterminer la valeur du retard temporel $\tau$ entre les deux ondes reçues.
        reasoning: |-
          Même geste qu'en R4 pour la mesure au double microphone : le décalage horizontal entre les débuts des deux salves, compté en divisions sur l'écran, se convertit en temps grâce à la sensibilité horizontale (base de temps) de l'oscilloscope. Sur la figure 2, ce décalage vaut $2$ divisions.
        steps:
          - math: '\tau = 2\ \text{div}\times 2\ \text{ms/div}'
            note: "Comptage du decalage horizontal entre les deux salves sur la figure 2, converti via la base de temps 2 ms/division."
          - math: '\boxed{\tau = 4{,}0\ \text{ms} = 4{,}0\times10^{-3}\ \text{s}}'
            note: "Retard entre l'onde recue dans l'air (plus lente) et celle recue dans le petrole."
      - id: q3
        stem: |-
          **(0,75 pt)** Montrer que l'expression de $\tau$ s'écrit sous la forme :

          $$\tau = L\left(\dfrac{1}{V_{air}} - \dfrac{1}{V_p}\right).$$
        reasoning: |-
          Les deux ondes partent ensemble, à $t_0=0$ (même source, le GBF), et parcourent la même distance $L$ — mais pas à la même célérité, donc pas dans le même temps : c'est exactement la relation de R3, $\tau=d/v$, appliquée séparément à chaque milieu. L'onde dans l'air met $t_{air}=L/V_{air}$, celle dans le pétrole met $t_p=L/V_p$. Comme le pétrole est plus dense que l'air, R3 dit que sa célérité y est plus grande — l'onde du pétrole arrive donc en premier, et le retard $\tau$ observé est celui de l'onde de l'air par rapport à celle du pétrole : la différence de ces deux durées.
        steps:
          - math: 't_{air} = \frac{L}{V_{air}} \qquad t_p = \frac{L}{V_p}'
            note: "Duree de parcours de chaque onde sur la distance L (R3 : temps = distance / celerite)."
          - math: '\tau = t_{air} - t_p = \frac{L}{V_{air}} - \frac{L}{V_p}'
            note: "Le retard est la difference des durees : l'onde de l'air, plus lente, arrive apres celle du petrole."
          - math: '\boxed{\tau = L\left(\frac{1}{V_{air}} - \frac{1}{V_p}\right)}'
            note: "On met L en facteur."
      - id: q4
        stem: |-
          **(0,75 pt)** Trouver la valeur approchée de la célérité $V_p$.
        reasoning: |-
          La relation de la question précédente relie $\tau$ (trouvé à la question 2), $L$ et $V_{air}$ (données) à la seule inconnue $V_p$ : on isole $1/V_p$, puis on inverse. Le résultat est une petite différence entre deux termes voisins, donc on garde plusieurs chiffres significatifs à chaque étape pour ne pas perdre la précision finale.
        steps:
          - math: '\frac{1}{V_p} = \frac{1}{V_{air}} - \frac{\tau}{L}'
            note: "On isole 1/V_p dans la relation de la question precedente."
          - math: '\frac{1}{V_p} = \frac{1}{340} - \frac{4{,}0\times10^{-3}}{1{,}84} \approx 2{,}94\times10^{-3} - 2{,}17\times10^{-3}'
            note: "Application numerique : V_air = 340 m/s, tau = 4,0 ms, L = 1,84 m."
          - math: '\frac{1}{V_p} \approx 7{,}7\times10^{-4}\ \text{s.m}^{-1}'
            note: "On garde plusieurs chiffres significatifs : petite difference de deux termes voisins."
          - math: '\boxed{V_p \approx 1{,}3\times10^{3}\ \text{m.s}^{-1}}'
            note: "On inverse. Bien superieure a V_air = 340 m/s, coherent avec R3 : un milieu plus dense relaie la perturbation plus vite."

  # ── bk-2022-n-x2 — 2022 N, Exercice 2 (Partie 1) : célérité du son dans l'air ──
  - id: bk-2021-r-x2
    title: "Les ondes sonores : nature de l'onde (vrai/faux) et identification d'un métal par sa célérité"
    source:
      year: 2021
      session: rattrapage
      filiere: "SPC"
      exercise_label: "Exercice 2 — Les ondes sonores"
    bareme_total: 2.0
    duration_min: 12
    sourcing:
      status: sourced
      note: >-
        2021 session de rattrapage — examen national PC BIOF (Sciences
        Physiques, SPC), AlloSchool RS 28F, element/127290 (Exercice 2,
        barème complet 2 pt). Transcription vérifiée par une passe
        adversariale indépendante (2026-08-22) : re-fetch du scan, les
        deux figures re-décrites depuis le dessin, mesures au pixel sur la
        figure 2. La droite passe exactement par les intersections
        (10 ; 0,02), (20 ; 0,04), (30 ; 0,06) et (40 ; 0,08) du quadrillage
        principal — lecture au trait, pas d'interpolation. La pente donne
        v = 0,10/2×10⁻⁵ = 5000 m.s⁻¹, valeur EXACTEMENT tabulée pour
        l'aluminium dans la donnée du sujet : le recoupement confirme la
        lecture. La vérification signale aussi deux traits pointillés
        parasites en bas à gauche de la figure (repères de construction
        vers d ≈ 4 et 14 cm) qui n'ont AUCUNE valeur de lecture — mention
        conservée ici pour qu'ils ne soient jamais pris pour des points de
        mesure.
    intro: |-
      **Les ondes sonores (examen national, session de rattrapage 2021 — Exercice 2, 2 points).**

      **Donnée — célérité du son dans différents métaux.**

      | Métal | fer | cuivre | aluminium | zinc |
      |---|---|---|---|---|
      | $v\ (\text{m.s}^{-1})$ | 5960 | 3900 | 5000 | 4190 |

      **Le dispositif (figure 1).** Une barre métallique horizontale. À son extrémité gauche, un marteau. Posés sur la barre, deux capteurs $C_1$ (près de l'extrémité gauche) et $C_2$ (environ aux deux tiers de la barre) ; sous la barre, une double flèche cotée $d$ relie les verticales descendant de $C_1$ et de $C_2$. Chaque capteur est relié par un câble à une interface, elle-même reliée à un ordinateur.

      On produit une impulsion sonore par un bref coup de marteau sur l'extrémité gauche de la barre et on mesure, pour différentes valeurs de la distance $d$, la durée de propagation $\Delta t$ de l'onde entre les deux capteurs. Le système d'acquisition trace la courbe $\Delta t = f(d)$.

      **La courbe (figure 2).** $\Delta t$ en millisecondes en fonction de $d$ en centimètres, sur quadrillage fin. Une droite croissante issue de l'origine passe exactement par les intersections $(10\,;\,0{,}02)$, $(20\,;\,0{,}04)$, $(30\,;\,0{,}06)$ et $(40\,;\,0{,}08)$ du quadrillage principal. *(Deux traits pointillés subsistent en bas à gauche de la figure : ce sont des repères de construction, sans valeur de lecture.)*
    questions:
      - id: q1
        part: "1- La nature de l'onde sonore (vrai ou faux)"
        stem: |-
          Recopier le numéro de la question et répondre par vrai ou faux.

          **a)** (0,25 pt) L'onde sonore est une onde électromagnétique.

          **b)** (0,25 pt) L'onde sonore est une onde longitudinale.

          **c)** (0,25 pt) L'onde sonore est une onde qui se propage dans le vide.

          **d)** (0,25 pt) L'onde sonore se propage avec une célérité qui dépend du milieu de propagation.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Ces quatre affirmations testent une seule idée, sous quatre angles : le son est une onde MÉCANIQUE. Tiens fermement ce fait et les quatre réponses tombent d'elles-mêmes — c'est plus sûr que de mémoriser quatre phrases séparées.

          **a) FAUX.** L'onde sonore est une onde mécanique : elle consiste en une déformation de la matière (compressions et dilatations successives du milieu), pas en une variation de champs électrique et magnétique. Les ondes électromagnétiques (lumière, ondes radio) sont d'une autre nature.

          **b) VRAI.** Les particules du milieu oscillent PARALLÈLEMENT à la direction de propagation de l'onde — c'est la définition d'une onde longitudinale. C'est ce qui distingue le son d'une onde à la surface de l'eau, où la surface monte et descend perpendiculairement à la propagation.

          **c) FAUX.** C'est la conséquence directe de a). Une onde mécanique a besoin d'un milieu matériel à déformer ; dans le vide, il n'y a rien à comprimer. Le son ne s'y propage pas — contrairement à la lumière, qui nous vient bien du Soleil.

          **d) VRAI.** La célérité d'une onde mécanique est une propriété DU MILIEU, pas de la source. La donnée de l'énoncé le montre : le même son se propage à $3900\ \text{m.s}^{-1}$ dans le cuivre et à $5960\ \text{m.s}^{-1}$ dans le fer. C'est précisément ce que la partie 2 va exploiter pour identifier le métal.

          **Le fil qui relie les quatre.** a) et c) disent la même chose (mécanique, donc pas dans le vide), b) précise la géométrie de l'oscillation, d) annonce la suite de l'exercice.
      - id: q2-1
        part: "2- Identifier le métal de la barre"
        stem: |-
          (0,75 pt) Déterminer la célérité $v$ de l'onde dans la barre.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'onde parcourt la distance $d$ entre les deux capteurs en la durée $\Delta t$ : sa célérité est donc $v = d/\Delta t$. Mais l'énoncé ne donne pas UN couple $(d, \Delta t)$ — il donne une droite. C'est délibéré : exploiter la pente d'une droite qui passe par plusieurs points de mesure vaut mieux qu'un point isolé, car chaque mesure isolée porte son erreur.

          La relation $\Delta t = \dfrac{d}{v}$ est bien celle d'une fonction linéaire de $d$, de coefficient directeur $\dfrac{1}{v}$ — ce qui explique que la droite tracée passe par l'origine.

          On lit deux points AU TRAIT sur la droite, en prenant l'écart le plus large possible pour minimiser l'erreur : l'origine $(0\,;\,0)$ et le point $(40\,;\,0{,}08)$.

          Coefficient directeur :

          $$\frac{1}{v} = \frac{\Delta t}{d} = \frac{0{,}08\ \text{ms}}{40\ \text{cm}}$$

          **Les conversions, avant tout calcul.** $0{,}08\ \text{ms} = 0{,}08\times10^{-3}\ \text{s} = 8\times10^{-5}\ \text{s}$ et $40\ \text{cm} = 0{,}40\ \text{m}$.

          $$v = \frac{d}{\Delta t} = \frac{0{,}40}{8\times10^{-5}} = 5000\ \text{m.s}^{-1}$$

          $$\boxed{v = 5000\ \text{m.s}^{-1}}$$

          **Le piège de cet exercice, et il est double.** Les deux axes sont dans des unités « piégées » : des CENTIMÈTRES et des MILLISECONDES. Oublier l'une des deux conversions donne un résultat faux d'un facteur $10$, $1000$ ou $100\,000$ — et aucune des valeurs du tableau ne correspondra, ce qui est justement le signal d'alarme à saisir.
      - id: q2-2
        part: "2- Identifier le métal de la barre"
        stem: |-
          (0,25 pt) En déduire la nature du métal constituant la barre.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La célérité est une signature du milieu (c'est l'affirmation d) de la première partie). Il suffit donc de comparer la valeur trouvée à la table fournie.

          | Métal | fer | cuivre | aluminium | zinc |
          |---|---|---|---|---|
          | $v\ (\text{m.s}^{-1})$ | 5960 | 3900 | **5000** | 4190 |

          La valeur $v = 5000\ \text{m.s}^{-1}$ coïncide exactement avec celle de l'aluminium.

          $$\boxed{\text{La barre est en aluminium.}}$$

          **Ce que la coïncidence exacte t'apprend.** Une valeur qui tombe pile sur la table n'est pas un hasard : c'est la confirmation que ta lecture graphique et tes conversions étaient justes. Si tu avais trouvé $500$ ou $50\,000$, aucune ligne n'aurait correspondu — l'exercice est construit pour que l'erreur d'unité se voie.
  - id: bk-2022-n-x2
    title: "Célérité des ondes sonores dans l'air : mesure d'un retard temporel"
    source:
      year: 2022
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 2 (3,5 points) — Partie 1 : Propagation des ondes sonores dans l'air"
    bareme_total: 1.25
    duration_min: 8
    sourcing:
      status: sourced
      note: >-
        2022 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/136621, course-422/upload-84516
        (Exercice 2, Partie 1 — propagation des ondes sonores dans l'air,
        mesure d'un retard temporel par système d'acquisition informatisé ;
        barème de la partie = 1,25 pt sur les 3,5 pt de l'exercice complet,
        dont la Partie 2 — désintégration de l'iode 131 — est hors périmètre
        de cette notion, transcrite sous decroissance-radioactive.md).
        Transcription vérifiée en deux passes indépendantes : re-fetch
        AlloSchool + diff caractère par caractère (agent-vérificateur), PUIS
        re-lecture de contrôle indépendante des corrections de figure
        (agent-relecteur-de-contrôle, 2026-08-07), diff OK
        (docs/sujets/pc/ondes-mecaniques-progressives.md, statut
        « vérifié »). Figure 2 re-mesurée au pixel à trois reprises : grille
        10 colonnes × 8 lignes (pas 44,1 px vertical) avec axes médians
        finement gradués ; écart (a)→(b) mesuré à 221,5 px = 5,02 divisions,
        confirmé par la grille à exactement 5 divisions (bords sur le 2ᵉ et
        le 7ᵉ trait vertical) ; flèche d'étalonnage « 0,5 ms » mesurée à
        1023→1068 px, couvrant exactement une division (traits de grille en
        1023 et 1067) — c'est un étalonnage, pas une période. Physique
        re-dérivée et cohérente : $v=L/\Delta t=0{,}85/2{,}5\times10^{-3}
        =\mathbf{340\ \text{m.s}^{-1}}$, valeur canonique de la célérité du
        son dans l'air.
    intro: |-
      **Propagation des ondes sonores dans l'air : mesure d'un retard temporel (examen national, session normale 2022, Exercice 2 — Partie 1).**

      Pour déterminer la célérité des ondes sonores dans l'air, on réalise le montage expérimental représenté sur le schéma de la figure 1. Ce montage est constitué d'un émetteur $E$ et d'un récepteur $R$ d'ondes sonores distants de $L = 85\ \text{cm}$. Une onde sonore émise par $E$, se propageant dans l'air, est reçue par $R$.

      On visualise à l'aide d'un système d'acquisition informatisé, à la fois, le signal (a) émis et le signal (b) reçu (figure 2).

      **Figure 1 (schéma).** Deux blocs rectangulaires étiquetés « $E$ » (Émetteur, à gauche) et « $R$ » (Récepteur, à droite), chacun dessiné avec une découpe en créneau sur le côté qui fait face à l'autre. Entre les deux, une flèche horizontale orientée vers la droite, étiquetée « Sens de propagation » au-dessus. En dessous, une double flèche horizontale reliant les deux blocs, étiquetée « $L$ ». Légende : « Figure 1 ».

      **Figure 2 (écran d'acquisition).** Grille quadrillée de 10 colonnes sur 8 lignes (11 traits verticaux × 9 traits horizontaux) représentant l'affichage du système d'acquisition ; les deux axes médians (ligne horizontale centrale, trait vertical central) portent de fines graduations non chiffrées. Deux petits rectangles pleins (signaux), chacun large d'une division : le signal (a), en haut à gauche, bord gauche sur le 2ᵉ trait vertical, sommet sur le 2ᵉ trait horizontal (étiqueté « (a) » en dessous) ; le signal (b), une ligne plus bas et cinq colonnes plus à droite, bord gauche sur le 7ᵉ trait vertical, sommet sur le 3ᵉ trait horizontal (étiqueté « (b) » en dessous) — soit un décalage horizontal d'exactement 5 divisions entre (a) et (b). Un repère d'échelle temporelle, en bas à droite de la grille, est matérialisé par une double flèche horizontale large d'exactement une division, étiquetée « $0{,}5\ \text{ms}$ » : c'est un étalonnage, 1 division $= 0{,}5\ \text{ms}$ — ce n'est pas une période. Légende : « Figure 2 ».
    questions:
      - id: q1a
        part: "1. Recopier le numéro de la question et répondre par vrai ou faux"
        stem: |-
          **1.1.** (0,25 pt) L'onde sonore est une onde transversale.
        reasoning: |-
          D'après R4, le son se propage par compressions et dilatations successives de l'air, dans la même direction que celle où il avance — exactement le mécanisme du ressort étudié en R2. C'est le critère « déplacement parallèle à la propagation » qui définit une onde longitudinale, pas transversale (qui exigerait un déplacement perpendiculaire, comme sur une corde).

          L'affirmation est fausse : l'onde sonore est longitudinale.
      - id: q1b
        stem: |-
          **1.2.** (0,25 pt) L'onde sonore ne se propage pas dans le vide.
        reasoning: |-
          Une onde sonore est une onde mécanique (R1) : elle a besoin d'un milieu matériel, déformable et élastique, pour se propager de proche en proche — sans matière à déformer, rien ne peut relayer la perturbation. R4 le rappelle explicitement pour le son.

          L'affirmation est vraie : l'onde sonore ne se propage pas dans le vide.
      - id: q2
        stem: |-
          **(0,25 pt)** Déterminer la durée $\Delta t$ mise par le signal pour arriver au récepteur $R$.
        reasoning: |-
          Même lecture que celle décrite en R4 pour la mesure au double microphone : le décalage horizontal entre les deux signaux, compté en divisions de la grille, se convertit en temps grâce à l'étalonnage donné par la double flèche « $0{,}5\ \text{ms}$ », qui couvre exactement une division. Sur la figure 2, le bord du signal (b) est exactement 5 divisions plus loin que celui du signal (a) : ce décalage, c'est $\Delta t$, le retard de R3 appliqué ici entre l'émission et la réception.
        steps:
          - math: '\Delta t = 5\ \text{divisions} \times 0{,}5\ \text{ms/division}'
            note: "Comptage direct sur la grille (figure 2) : le bord du signal (b) est exactement 5 divisions apres celui du signal (a), etalonnage 0,5 ms par division."
          - math: '\boxed{\Delta t = 2{,}5\ \text{ms}}'
            note: "Retard entre l'emission (signal a) et la reception (signal b)."
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer la célérité $v$ des ondes sonores dans l'air.
        reasoning: |-
          On applique directement la définition de R3, $v=d/\Delta t$, avec ici $d=L$ (la distance émetteur-récepteur, donnée) et $\Delta t$ le retard trouvé à la question précédente — exactement la méthode déjà illustrée en R4 avec les deux microphones, qui donnait la même valeur numérique.
        steps:
          - math: 'v = \frac{L}{\Delta t} = \frac{0{,}85}{2{,}5\times10^{-3}}'
            note: "Definition de la celerite (R3) : distance parcourue divisee par la duree mise pour la parcourir."
          - math: '\boxed{v \approx 340\ \text{m.s}^{-1}}'
            note: "Valeur canonique de la celerite du son dans l'air (coherente avec R4)."

