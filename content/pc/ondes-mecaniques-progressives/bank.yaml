        Transcription vérifiée en deux passes indépendantes : re-fetch
        AlloSchool + diff caractère par caractère (agent-vérificateur), PUIS
        re-lecture de contrôle indépendante des corrections de figure
        (agent-relecteur-de-contrôle, 2026-08-07), diff OK
        (docs/sujets/pc/ondes-mecaniques-progressives.md, statut
        « vérifié »). Figure 2 re-mesurée au pixel à trois reprises : grille
        10 colonnes × 8 lignes (pas 44,1 px vertical) avec axes médians
        finement gradués ; écart (a)→(b) mesuré à 221,5 px = 5,02 divisions,
        confirmé par la grille à exactement 5 divisions (bords sur le 2ᵉ et
        le 7ᵉ trait vertical) ; flèche d'étalonnage « 0,5 ms » mesurée à
        1023→1068 px, couvrant exactement une division (traits de grille en
        1023 et 1067) — c'est un étalonnage, pas une période. Physique
        re-dérivée et cohérente : $v=L/\Delta t=0{,}85/2{,}5\times10^{-3}
        =\mathbf{340\ \text{m.s}^{-1}}$, valeur canonique de la célérité du
