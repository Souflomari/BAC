# numérique avec le 2021 N (E = 6 V / R1 = 120 ohms / C = 100 µF ici,
# contre E = 12 V / R = 1000 ohms / C = 12 µF là).
#
# Le 2019 N (Exercice III, Partie I — charge) sert AUSSI de sommet de leçon
# (r-bac, exercises.yaml, marqueur [[exercise:r-bac]] à R5) : mêmes données,
# mêmes réponses numériques (Q = 100 µC, τ = 1 ms, C = 10 µF, R = 100 Ω),
