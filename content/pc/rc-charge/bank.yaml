# ici pour que la banque soit le corpus complet des annales de la notion
# (BANK-SPEC §1 : « la banque est le volume derrière le sommet, jamais son
# remplacement ») — recoupement assumé, même disposition que
# reactions-acido-basiques bk-2021-n-x1. À l'arbitrage de l'owner si l'on
