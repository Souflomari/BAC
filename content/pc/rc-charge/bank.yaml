    intro: |-
      **Réponse d'un dipôle RC à un échelon de tension (examen national, session de rattrapage 2024 — Exercice 4, partie 1, 1,5 point).**

      Les circuits $RC$, $RLC$,… sont utilisés dans les montages électroniques de plusieurs appareils électriques et électroniques. On se propose, dans cet exercice, d'étudier la réponse d'un dipôle RC à un échelon de tension, et les oscillations libres dans un circuit RLC série.

      Le montage électrique schématisé sur la figure 1 comporte : un générateur idéal de tension de force électromotrice $E$ ; un condensateur de capacité $C$ initialement déchargé ; un conducteur ohmique de résistance $R = 50\ \Omega$ ; une bobine d'inductance $L = 20\ \text{mH}$ et de résistance $r$ ; un interrupteur $K$ à double position.

      **1 — Réponse d'un dipôle RC à un échelon de tension.** À un instant choisi comme origine des dates $t_0 = 0$ on met l'interrupteur $K$ en position (1). Un système d'acquisition informatisé adéquat permet de suivre l'évolution temporelle de la tension $u_R(t)$ aux bornes du conducteur ohmique (figure 2). Dans cette figure, $(T)$ représente la tangente à la courbe au point d'abscisse $t_0 = 0$ et $\tau$ la constante de temps du circuit.

      **Figure 1 (schéma).** Un cadre rectangulaire. Branche de gauche : le générateur, symbolisé par un cercle traversé par le fil, avec une flèche verticale montante tracée à sa gauche et étiquetée « $E$ ». Branche du haut : partant du coin supérieur gauche vers la droite, un fil portant une flèche de courant étiquetée « $i$ » (orientée vers la droite) et se terminant par le plot (1) ; à droite, le plot (2) ; entre les deux, la lame de l'interrupteur $K$, dessinée verticale au centre et étiquetée « $K$ » au-dessus, son pivot posé sur la branche médiane verticale. Branche médiane verticale, du pivot de $K$ vers le bas : d'abord le condensateur $C$ (deux armatures horizontales, étiquette « $C$ » à droite), avec la tension $u_C$ fléchée vers le haut à sa gauche ; plus bas le conducteur ohmique $R$ (rectangle vertical, étiquette « $R$ » à droite), avec la tension $u_R$ fléchée vers le haut à sa gauche ; puis le fil rejoint le rail du bas. Branche de droite : du plot (2), le fil descend vers la bobine, dessinée en spires verticales et étiquetée « $(L,r)$ » à droite, puis rejoint le rail du bas. Le condensateur est un condensateur ordinaire : $C$ n'est pas ajustable dans ce sujet. Légende « Figure 1 ».

      **Figure 2 (courbe).** $u_R\ (\text{V})$ en ordonnée, $t\ (\mu\text{s})$ en abscisse. Quadrillage à double graduation : traits majeurs tous les $5\ \mu\text{s}$ en abscisse et tous les $1\ \text{V}$ en ordonnée, avec dix sous-divisions fines par division majeure (donc $0{,}5\ \mu\text{s}$ et $0{,}1\ \text{V}$ par sous-carreau). Les seuls chiffrages imprimés sont « $0$ » à l'origine, « $\tau$ », « $10$ » et « $20$ » sur l'axe des temps, et « $1$ » et « $2$ » sur l'axe des tensions — rien d'autre. Le cadre va bien au-delà de ces chiffrages : il s'étend jusqu'à $t = 30\ \mu\text{s}$ (six divisions majeures) et monte jusqu'à $u_R = 5\ \text{V}$ (cinq divisions majeures), le bord supérieur du cadre étant exactement le niveau $5\ \text{V}$. Courbe : exponentielle décroissante partant du sommet du cadre, donc de $u_R(0) = 5{,}0\ \text{V}$, et tendant vers $0$ en fin de cadre. La tangente $(T)$ à l'origine est tracée en trait fin, étiquetée « $(T)$ » à gauche sous elle, et coupe l'axe des temps exactement au trait majeur repéré « $\tau$ ». Légende « Figure 2 ».
    questions:
      - id: q1
        part: "1 — Établir le modèle, cette fois en u_R(t)"
        stem: |-
          **1-1-** (0,5 pt) En utilisant la loi d'additivité des tensions, montrer que l'équation différentielle vérifiée par la tension $u_R(t)$ s'écrit sous la forme : $\dfrac{du_R(t)}{dt} + \dfrac{1}{RC}u_R(t) = 0$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On veut une équation qui ne contienne qu'UNE seule fonction inconnue du temps. Le circuit en offre trois à la fois — $u_C$, $u_R$ et $i$ — reliées entre elles. C'est le mécanisme du rung 1 de la leçon, à ceci près que l'inconnue demandée ici n'est ni $u_C$ ni la charge : c'est la tension aux bornes du CONDUCTEUR OHMIQUE, celle que le système d'acquisition a réellement enregistrée.

          **Le pont à faire.** Le rung 1 n'établit l'équation qu'en $u_C$, et il l'obtient en substituant directement dans la maille. Ici la substitution directe ne suffit pas : $u_C$ ne s'exprime pas avec $u_R$ sans passer par le temps. Le geste qui débloque est court et il vaut d'être ajouté à ton répertoire — **on dérive la loi des mailles par rapport au temps**. C'est légitime parce que la maille est vraie à CHAQUE instant, pas seulement à un instant : deux fonctions du temps égales ont des dérivées égales.

          Interrupteur en position (1) : la maille active est celle du générateur, de $R$ et de $C$. Loi d'additivité des tensions, en convention récepteur :

          $$E = u_R + u_C$$

          On dérive membre à membre par rapport à $t$. Le générateur est idéal et $E$ est une constante, donc sa dérivée est nulle :

          $$0 = \frac{du_R}{dt} + \frac{du_C}{dt}$$

          Reste à exprimer $\dfrac{du_C}{dt}$ avec $u_R$. Les deux relations du rung 1 le donnent : $i = \dfrac{dq}{dt}$ et $q = C\,u_C$, donc $i = C\dfrac{du_C}{dt}$, c'est-à-dire

          $$\frac{du_C}{dt} = \frac{i}{C}$$

          et la loi d'Ohm remplace le courant par la tension cherchée, $i = \dfrac{u_R}{R}$ :

          $$\frac{du_C}{dt} = \frac{u_R}{RC}$$

          On reporte dans la maille dérivée :

          $$\boxed{\frac{du_R}{dt} + \frac{1}{RC}\,u_R = 0}$$

          **Le contrôle qui rassure.** Le même résultat s'obtient sans jamais dériver la maille, par un chemin entièrement différent : de $E = u_R + u_C$ on tire $u_C = E - u_R$, donc $\dfrac{du_C}{dt} = -\dfrac{du_R}{dt}$ ; alors $u_R = R\,i = R\,C\dfrac{du_C}{dt} = -RC\dfrac{du_R}{dt}$, qui se range exactement en $\dfrac{du_R}{dt} + \dfrac{u_R}{RC} = 0$. Deux routes indépendantes, une seule équation : elle est juste.

          **Le piège de cette question.** Il est dans le signe, et il est invisible si on va vite. Beaucoup écrivent $i = C\dfrac{du_R}{dt}$ « par analogie », alors que la relation du rung 1 porte sur la tension du CONDENSATEUR, $i = C\dfrac{du_C}{dt}$, et que $u_C$ et $u_R$ varient en sens opposés puisque leur somme est constante. Cette confusion donne $\dfrac{du_R}{dt} - \dfrac{u_R}{RC} = 0$, dont la solution est une exponentielle CROISSANTE $e^{+t/RC}$ — une tension qui exploserait, alors que la figure 2 montre une décroissance. Piège jumeau : s'étonner de la disparition de $E$ et le rajouter au second membre. Rien ne s'est perdu — dériver une constante l'efface, voilà tout ; et cette différence a un sens physique, car sans second membre la solution tend vers zéro, ce qui est bien le comportement de $u_R$, alors que $u_C$, elle, tendait vers $E$.
      - id: q2
        part: "1-2 — Lire E au tout premier instant"
        stem: |-
          **1-2-1-** (0,25 pt) En s'aidant du graphe de la figure 2, déterminer la valeur de $E$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'énoncé ne donne aucune valeur numérique à $E$ — seulement « un générateur idéal de tension de force électromotrice $E$ ». Il faut donc la récolter sur la figure. Or la figure ne trace pas $u_C$, elle trace $u_R$ : il faut trouver l'instant où la maille livre $E$ directement à partir de $u_R$, et cet instant est $t_0 = 0$.

          Le condensateur est **initialement déchargé**, et sa tension est continue (rung 2) : elle ne peut pas sauter à la fermeture du circuit.

          $$u_C(0^+) = u_C(0^-) = 0$$

          La loi d'additivité des tensions, à cet instant précis, se réduit alors à une seule tension :

          $$E = u_R(0^+) + u_C(0^+) = u_R(0^+)$$

          C'est le mécanisme du rung 1 regardé à son tout premier instant : tant que le condensateur est vide, il ne s'oppose encore à rien et toute la force électromotrice tombe sur le conducteur ohmique. On lit donc $E$ sur l'ordonnée de départ de la courbe, qui part du bord supérieur du cadre :

          $$\boxed{E = u_R(0) = 5{,}0\ \text{V}}$$

          **Le contrôle qui rassure.** $R$ est donnée, donc on peut prédire le courant de départ : $i(0^+) = \dfrac{E}{R} = \dfrac{5}{50} = 0{,}1\ \text{A} = 100\ \text{mA}$ — un ordre de grandeur banal pour un montage de laboratoire. Rien ne cloche.

          **Le piège de cette question.** Il est double, et les deux moitiés sont sur l'axe des ordonnées. D'abord le réflexe du palier : dans la leçon, $E$ se lit sur l'asymptote horizontale — mais c'est l'asymptote de $u_C$, pas celle de $u_R$. Ici la courbe tracée DÉCROÎT vers zéro : lire $E$ « sur le palier » donnerait $E = 0$. Sur une courbe de $u_R$, $E$ est la valeur de DÉPART, jamais la valeur finale. Ensuite le chiffrage : l'axe des tensions ne porte imprimés que « $1$ » et « $2$ », alors que le cadre monte jusqu'à $5\ \text{V}$. Répondre $2\ \text{V}$ parce que $2$ est le dernier nombre écrit, c'est laisser l'imprimeur décider à ta place. Le trait majeur vaut $1\ \text{V}$ : on compte les traits majeurs jusqu'au bord supérieur du cadre, il y en a cinq.
      - id: q3
        part: "1-2 — Lire τ sur la tangente, puis vérifier C"
        stem: |-
          **1-2-2-** (0,75 pt) En s'aidant du graphe de la figure 2, vérifier que $C = 0{,}10\ \mu\text{F}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le mot « vérifier » est un ordre : la valeur $0{,}10\ \mu\text{F}$ ne doit surtout pas être réutilisée comme donnée, il faut la RETROUVER par un chemin indépendant. Or la seule grandeur du circuit déjà connue est $R = 50\ \Omega$, et la seule grandeur mesurable sur la figure 2 qui contienne la capacité est la constante de temps $\tau = RC$ — le groupement identifié à la question 1, où il apparaît au dénominateur. Le chemin est donc forcé : lire $\tau$ sur le graphe, puis en déduire $C$.

          **Le pont à faire.** Le rung 3 démontre la méthode de la tangente à l'origine sur la courbe CROISSANTE $u_C(t)$, où la tangente coupe l'asymptote $u_C = E$ en $t = \tau$. Ici la courbe décroît vers zéro, et la tangente coupe l'axe des abscisses — la démonstration se refait en une ligne, à l'identique. La solution de l'équation de la question 1 est $u_R(t) = E\,e^{-t/\tau}$, donc la pente à l'origine vaut

          $$\frac{du_R}{dt}(0) = -\frac{E}{\tau}$$

          La tangente est donc la droite $y = E - \dfrac{E}{\tau}\,t$, et elle atteint $y = 0$ quand $\dfrac{E}{\tau}\,t = E$, c'est-à-dire en

          $$t = \tau$$

          **La lecture.** Sur la figure 2, la tangente $(T)$ coupe l'axe des temps exactement au trait majeur repéré « $\tau$ ». Les traits majeurs valent $5\ \mu\text{s}$ (les chiffrages $10$ et $20$ tombent sur le deuxième et le quatrième), et ce repère est le PREMIER trait majeur après l'origine :

          $$\tau = 5\ \mu\text{s} = 5\times10^{-6}\ \text{s}$$

          **La capacité.** On inverse $\tau = RC$, avec $R = 50\ \Omega$ donné dans l'énoncé :

          $$C = \frac{\tau}{R} = \frac{5\times10^{-6}}{50} = 1{,}0\times10^{-7}\ \text{F}$$

          $$\boxed{C = 1{,}0\times10^{-7}\ \text{F} = 0{,}10\ \mu\text{F}}$$

          La valeur annoncée est retrouvée exactement : la lecture $\tau = 5\ \mu\text{s}$ était donc juste.

          **Le contrôle qui rassure.** Deux recoupements gratuits sur la même figure. D'abord la méthode des $63\ \%$ retournée (rung 3) : sur une décroissance, à $t = \tau$ il reste $37\ \%$ de la valeur de départ, soit $u_R(\tau) = 5 \times e^{-1} \approx 5 \times 0{,}37 = 1{,}8\ \text{V}$ — et c'est bien la hauteur du tracé au repère $\tau$. Ensuite la fin du régime transitoire : elle est atteinte vers $5\tau = 25\ \mu\text{s}$, et la courbe rejoint effectivement zéro juste avant le bord droit du cadre, à $30\ \mu\text{s}$. Trois lectures indépendantes qui se confirment : c'est le meilleur signal qu'on puisse avoir en copie.

          **Le piège de cette question.** Il est dans le préfixe, et il coûte un facteur mille. L'axe des temps est en MICROsecondes : $\tau = 5\ \mu\text{s} = 5\times10^{-6}\ \text{s}$, et non $5\times10^{-3}\ \text{s}$. Traiter les $\mu\text{s}$ comme des $\text{ms}$ donne $C = \dfrac{5\times10^{-3}}{50} = 1\times10^{-4}\ \text{F} = 100\ \mu\text{F}$ au lieu de $0{,}10\ \mu\text{F}$ — mille fois trop, et l'erreur ne se dénonce pas toute seule si on ne regarde pas l'ordre de grandeur. Deuxième piège, sur le chiffrage : le repère « $\tau$ » est imprimé sur le PREMIER trait majeur, et les nombres $10$ et $20$ n'apparaissent que sur le deuxième et le quatrième ; lire $\tau = 10\ \mu\text{s}$ parce que $10$ est le premier nombre écrit double la réponse, $C = 0{,}20\ \mu\text{F}$. Compte toujours le pas de division entre deux traits CHIFFRÉS — ici $(20 - 10)/2 = 5\ \mu\text{s}$ par trait majeur — avant de lire un repère non chiffré. Piège jumeau, celui de toutes les tangentes : c'est la DROITE $(T)$ qui coupe l'axe des temps, pas la courbe — la courbe, elle, n'atteint jamais vraiment zéro, elle s'en approche seulement, et il lui faut environ $5\tau$ pour que ce soit indiscernable.

  # ── bk-2025-n-x1 — 2025 N, Exercice 3 (Partie 1) : charge par générateur de courant, loi horaire linéaire ──
  - id: bk-2025-n-x1
    title: "Charge d'un condensateur par une source de courant : loi horaire linéaire et détermination de la capacité"
    source:
      year: 2025
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 3 — Partie 1. Charge d'un condensateur par une source de courant"
    bareme_total: 1
    duration_min: 6
    sourcing:
      status: sourced
      note: >-
        2025 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/145796 (Exercice 3, Partie 1 —
        charge d'un condensateur par une source de courant ; barème de la
        partie = 1,0 pt sur les 5 pt de l'exercice complet, dont une
        Partie 2 sur la décharge du même condensateur dans un dipôle RL —
        transcrite sous rlc-serie.md — et une Partie 3 sur la sélection et
        la démodulation d'une onde modulée en amplitude — transcrite sous
        ondes-em-modulation.md ; les trois parties partagent la même
        figure 1). Transcription vérifiée en trois passes
        (docs/sujets/pc/rc-charge.md, statut « vérifié », 2026-08-06) :
        transcription initiale, diff adverse par un second agent (symbole
        du générateur de courant $G$ corrigé — cercle traversé d'un trait
        horizontal droit, et non un arc courbe), puis re-lecture
        indépendante par un troisième agent — figure 2 re-mesurée au pixel
        (grille $5\times5$ divisions, pente $1\ \text{V.s}^{-1}$, droite
        jusqu'au coin exact $(10\ \text{s}\,;\,10\ \text{V})$) et figure 1
        re-vérifiée élément par élément (symbole du générateur confirmé,
        nœuds (1)/(2)/N/M conformes) — entrée promue.
    intro: |-
      **Charge d'un condensateur par une source de courant (examen national, session normale 2025, Exercice 3 — Partie 1).**

      Les composantes électroniques telles que les diodes, les bobines, les condensateurs se trouvent dans différents circuits électriques et électroniques de plusieurs appareils électriques utilisés dans le domaine industriel, de communication, de numérisation… Cet exercice se propose d'étudier la charge d'un condensateur et sa décharge dans un dipôle RL, ainsi que la sélection et la démodulation d'une onde modulée en amplitude. Le montage électrique représenté par le schéma de la figure 1 comporte un circuit de charge d'un condensateur et un autre de sa décharge.

      **1 — Charge d'un condensateur par une source de courant.** On veut déterminer la capacité $C_0$ d'un condensateur, initialement déchargé, en utilisant le montage de la figure 1. Le générateur de courant $G$ débite un courant électrique d'intensité constante $I_0 = 1\ \mu\text{A}$. À un instant choisi comme origine des dates $(t_0 = 0)$, on met l'interrupteur $K$ en position (1). Un système d'acquisition informatisé permet d'obtenir la courbe d'évolution temporelle de la tension $u_C(t)$ aux bornes du condensateur lors de sa charge (figure 2).

      **Figure 1 (schéma, commun aux trois parties de l'exercice).** Boucle comportant, de gauche à droite en partant du bas : le générateur $G$ (symbole cercle traversé d'un trait horizontal droit, en diamètre — symbole du générateur de courant continu), en série avec le conducteur ohmique $R$ (rectangle, étiquette « R » au-dessus) porté par la branche du haut, jusqu'au nœud « (1) » ; à droite de ce nœud, un interrupteur à double position, actionné par le levier « K », pouvant basculer sur la position « (1) » (vers $R$–$G$) ou sur la position « (2) » (vers le nœud « N », à droite). Le condensateur $C_0$ est monté verticalement entre le point commun (pivot) de l'interrupteur $K$ et le nœud « M » en bas ; sa tension $u_C$ est fléchée vers le haut, et le courant $i$ est fléché vers le bas juste en dessous du condensateur. À droite, entre N et M, une bobine « (b) » $(L, r)$ est dessinée en spires.

      **Figure 2 (courbe).** $u_C\ (\text{V})$ en fonction de $t\ (\text{s})$, sur quadrillage à double graduation (traits principaux noirs, sous-quadrillage fin bleu). Axe des ordonnées gradué aux traits principaux $2$ et $4$ ; axe des abscisses gradué aux traits principaux $2$ et $4$. Droite croissante partant exactement de l'origine, passant par les points $(2\,;\,2)$ et $(4\,;\,4)$ — pente apparente $1\ \text{V.s}^{-1}$ — et se prolongeant en ligne droite jusqu'au coin supérieur droit du cadre : le cadre compte $5$ divisions principales de $2$ unités sur chacun des deux axes, donc ce coin vaut exactement $(10\ \text{s}\,;\,10\ \text{V})$.
    questions:
      - id: q1
        part: "1 — Charge d'un condensateur par une source de courant : établir la loi horaire"
        stem: |-
          **(0,5 pt)** Exprimer la tension $u_C(t)$ en fonction de $I_0$, $C_0$ et $t$.
        reasoning: |-
          On reprend les deux relations rappelées au rung 1 — le courant est le débit de charge, $i = \dfrac{dq}{dt}$, et la charge posée sur les armatures fixe la tension, $q = C_0 u_C$. Mais le mécanisme qui construit l'équation de R1 — la boucle qui se referme sur elle-même, $i = \dfrac{E-u_C}{R}$, un courant qui ralentit à mesure que $u_C$ monte — ne s'applique pas ici : le générateur $G$ est un générateur **idéal de courant**, qui impose $I_0$ constant dans toute la boucle série, quelle que soit la tension à ses bornes. Contrairement à l'échelon de tension des rungs R0–R4, le courant ne dépend jamais de $u_C$ : il ne ralentit pas. Le courant qui charge $C_0$ vaut donc $I_0$ à chaque instant, et l'on intègre directement.
        steps:
          - math: 'i(t) = \frac{dq}{dt} = I_0'
            note: "Générateur idéal de courant : I0 imposé constant dans toute la boucle série, sans ralentir (contrairement à l'échelon de tension des rungs R0-R4)."
          - math: 'q(t) = I_0\,t'
            note: "On intègre à courant constant, avec q(0)=0 (condensateur initialement déchargé)."
          - math: '\boxed{u_C(t) = \frac{q(t)}{C_0} = \frac{I_0}{C_0}\,t}'
            note: "Définition de la capacité (rung 1) : q = C0 uC."
      - id: q2
        part: "1 — Vérification numérique de la capacité $C_0$"
        stem: |-
          **(0,5 pt)** Vérifier que $C_0 = 1\ \mu\text{F}$.
        reasoning: |-
          L'expression établie à la question précédente dit que $u_C(t)$ est une droite passant par l'origine, de pente $\dfrac{I_0}{C_0}$ — exactement la droite lue sur la figure 2. On lit cette pente sur le graphe, puis on isole $C_0$.
        steps:
          - math: 'u_C(t) = \frac{I_0}{C_0}\,t \implies \text{pente} = \frac{I_0}{C_0}'
            note: "Coefficient directeur de la droite (question précédente)."
          - math: '\text{pente} = \frac{u_C}{t} = \frac{10}{10} = 1\ \text{V.s}^{-1}'
            note: "Lecture graphique : la droite part de l'origine et rejoint exactement le coin (10 s ; 10 V) du cadre."
          - math: 'C_0 = \frac{I_0}{\text{pente}} = \frac{1\times10^{-6}}{1}'
            note: "On isole C0, avec I0 = 1 microA donné par l'énoncé."
          - math: '\boxed{C_0 = 1\times10^{-6}\ \text{F} = 1\ \mu\text{F}}'
            note: "Résultat à vérifier — conforme à l'énoncé."

