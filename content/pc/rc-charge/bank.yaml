#     à l'origine ou méthode des 63 %, rung 3). Pontée au point d'usage
#     dans le raisonnement de la question 2.
#   - bk-2021-r-x4, q2 : l'établissement de l'équation différentielle en
#     i(t) passe par la DÉRIVATION de la loi des mailles par rapport au
#     temps (dE/dt = 0, puis du_C/dt = i/C). Le rung 1 n'établit jamais
#     l'équation qu'en u_C — et bk-2019-n-x3 la pose en q — ; la variante en
#     i, avec son second membre nul, n'apparaît nulle part dans la leçon.
#     Pontée au point d'usage dans le raisonnement de la question 2.
#   - bk-2021-r-x4, q4 : lecture de tau par la tangente à l'origine sur une
#     exponentielle DÉCROISSANTE (i(t)), où la tangente coupe l'axe des
#     abscisses — c'est-à-dire l'asymptote i = 0 — en t = tau. Le rung 3
#     n'énonce et ne démontre la méthode que sur la CROISSANTE u_C(t)
#     (tangente coupant l'asymptote u_C = E). Même propriété, démonstration
#     re-faite en une ligne au point d'usage dans le raisonnement de la
#     question 4, pas invoquée de mémoire.
#   - bk-2025-n-x1, q1 et q2 : le générateur G est un générateur IDÉAL DE
#     COURANT (I0 constant), et non le générateur idéal de tension E des
#     rungs R0–R4. Le mécanisme de R1 — la boucle qui se referme sur
#     elle-même, i = (E-u_C)/R, un courant qui ralentit à mesure que u_C
#     monte — ne s'applique donc pas ici : i = I0 reste constant, u_C(t)
#     croît LINÉAIREMENT (pas d'exponentielle, pas d'équation
#     différentielle à établir ni résoudre). Seules les deux relations de
#     base rappelées au rung 1 (i = dq/dt, q = Cu_C) sont réutilisées ;
#     aucun pont vers le mécanisme ou la résolution de l'équation
#     différentielle de R1–R2 n'est requis ni tenté. Même configuration de
#     générateur que bk-2018-n-x3b (déjà banquée), pour mémoire — sujet et
#     grandeurs différents, aucun recoupement numérique.
#   - bk-2023-r-x3, q1 : l'équation différentielle est demandée en CHARGE
#     q(t), pas en u_C. Le rung 1 ne l'établit qu'en u_C ; le passage se
#     fait avec les deux relations que ce même rung rappelle (i = dq/dt et
#     q = C.u_C, donc u_C = q/C), refait en une ligne au point d'usage et
#     non invoqué de mémoire. Même pont que bk-2019-n-x3, q1.
#   - bk-2023-r-x3, q2 : la méthode de la tangente à l'origine est énoncée
#     et démontrée au rung 3 sur la courbe u_C(t), coupant l'asymptote
#     u_C = E en t = tau. Ici la courbe fournie est q(t) et la tangente
#     coupe le palier de CHARGE q_max. Même propriété (q = C.u_C est une
#     simple homothétie verticale, qui ne déplace aucune abscisse), mais la
#     démonstration est refaite en une ligne au point d'usage à partir de
#     q(t) = Q(1 - e^(-t/tau)) : pente initiale Q/tau, donc la tangente
#     atteint le palier Q en t = tau.
#   - bk-2024-r-x4, q1 : l'équation différentielle est demandée en u_R(t),
#     la tension aux bornes du CONDUCTEUR OHMIQUE. Le rung 1 ne l'établit
#     qu'en u_C, par substitution directe dans la maille — substitution qui
#     ne suffit pas ici, puisque u_C ne s'exprime pas avec u_R sans passer
#     par le temps. Le geste requis est la DÉRIVATION de la loi des mailles
#     par rapport au temps (dE/dt = 0), puis du_C/dt = i/C et enfin la loi
#     d'Ohm i = u_R/R. Même pont que bk-2021-r-x4, q2, avec une substitution
#     de plus (la loi d'Ohm) et un piège de signe propre : u_C et u_R varient
#     en sens opposés puisque leur somme est constante. Démonstration refaite
#     au point d'usage, et recoupée par une seconde route (u_C = E - u_R)
#     dans le raisonnement de la question 1 — jamais « on admet ».
#   - bk-2024-r-x4, q3 : lecture de tau par la tangente à l'origine sur une
#     exponentielle DÉCROISSANTE (u_R(t)), où la tangente coupe l'axe des
#     abscisses — c'est-à-dire l'asymptote u_R = 0 — en t = tau. Le rung 3
#     n'énonce et ne démontre la méthode que sur la CROISSANTE u_C(t)
#     (tangente coupant l'asymptote u_C = E). Même propriété, démonstration
#     re-faite en une ligne au point d'usage à partir de u_R = E.e^(-t/tau) :
#     pente initiale -E/tau, donc la tangente atteint 0 en t = tau. Même pont
#     que bk-2021-r-x4, q4, sur une autre grandeur. La méthode des 63 %
#     (rung 3) est de même retournée en « il reste 37 % à t = tau » pour le
#     contrôle, avec sa justification écrite au point d'usage.
#   - bk-2023-r-x3, q3 : la f.é.m. E n'est PAS donnée numériquement par le
#     sujet (« générateur de tension de force électromotrice E », sans
#     valeur). Elle doit être récoltée sur la figure avant toute
#     application numérique : en régime permanent i = 0, donc u_C = E, et
#     E = q_max/C0 = 12 V. Aucun rung ne fait cette récolte-là — R2 et R3
#     lisent E directement sur le palier d'une courbe u_C(t), jamais à
#     travers q = C.u_C. Pontée au point d'usage dans le raisonnement de
#     la question 3. La formule d'énergie elle-même (E_C = (1/2).C.u_C^2,
#     et (1/2).C.E^2 en régime permanent) est en revanche dans le corps
#     enseigné, rung 4 — aucun pont requis.

