    intro: |-
      **Réponse d'un dipôle RC à un échelon de tension (examen national, session normale 2021, Exercice IV — Partie I).**

      Les circuits des appareils électriques, utilisés dans plusieurs domaines de la vie courante, sont constitués de condensateurs, de bobines, de conducteurs ohmiques, de circuits intégrés… Cette partie se propose d'étudier la réponse d'un dipôle RC à un échelon de tension.

      On réalise le montage, représenté sur le schéma de la figure 1, constitué d'un générateur idéal de tension de force électromotrice $E$, d'un condensateur $D$ de capacité $C$ initialement déchargé, d'un conducteur ohmique de résistance $R = 10^{3}\ \Omega$, et d'un interrupteur $K$. On ferme l'interrupteur à un instant choisi comme origine des dates $t = 0$. Un système d'acquisition informatisé permet de tracer la courbe de la figure 2, représentant les variations de $\dfrac{du_c}{dt}$ en fonction de $u_c$ ; $u_c$ étant la tension à un instant $t$ aux bornes du condensateur et $\dfrac{du_c}{dt}$ sa dérivée par rapport au temps.

      **Figure 1 (schéma).** Boucle série ; à gauche, un générateur idéal (symbole cercle) avec une flèche de tension orientée vers le haut, étiquetée « E », à sa gauche ; flèche de courant $i$ en haut à gauche, orientée vers la droite ; branche haute = conducteur ohmique (rectangle, étiquette « R » en dessous du rectangle) ; à droite, le condensateur (deux traits parallèles) avec l'étiquette « D » à sa gauche et une flèche $u_C$ orientée vers le haut à sa droite ; branche basse = interrupteur (deux plots et un levier ouvert), étiquette « K » au-dessus du fil, refermant la boucle vers le générateur.

      **Figure 2 (courbe).** Ordonnée $\dfrac{du_c}{dt}\ (\text{V.s}^{-1})$ graduée $0$, $500$, $1000$ ; abscisse $u_c\ (\text{V})$ graduée $0$, $6$, $12$. Droite décroissante partant exactement du point $(0\,;\,1000)$, passant exactement par $(6\,;\,500)$, et atteignant l'axe des abscisses exactement en $(12\,;\,0)$.
    questions:
      - id: q1
        part: "I — Réponse d'un dipôle RC à un échelon de tension : établir le modèle"
        stem: |-
          **(0,5 pt)** Montrer que l'équation différentielle vérifiée par la tension $u_c(t)$ s'écrit sous la forme : $\dfrac{du_c}{dt} = -\dfrac{1}{RC}u_c + \dfrac{E}{RC}$.
        reasoning: |-
          Même geste qu'en R1 de la leçon, avec les mêmes notations : loi des mailles sur la boucle série, $E = u_R + u_C$ en convention récepteur ; $u_R = Ri$ par la loi d'Ohm ; puis $i = C\dfrac{du_c}{dt}$, obtenu de $i = \dfrac{dq}{dt}$ et $q = Cu_c$ — exactement les deux relations rappelées au rung 1. On substitue, on isole la dérivée en divisant toute l'équation par $RC$ (l'étape que R1 fait pour retrouver $\dfrac{du_C}{dt} = \dfrac{E-u_C}{RC}$), puis on sépare le second membre en deux termes pour obtenir exactement la forme demandée ici.
        steps:
          - math: 'E = u_R + u_c'
            note: "Loi des mailles sur la boucle serie, convention recepteur (rung 1)."
          - math: 'u_R = R\,i = R\,C\frac{du_c}{dt}'
            note: "Loi d'Ohm, avec i = C du_c/dt (de i = dq/dt et q = C u_c, rung 1)."
          - math: 'RC\frac{du_c}{dt} + u_c = E'
            note: "Meme equation qu'au rung 1, ici en notation u_c."
          - math: '\boxed{\frac{du_c}{dt} = -\frac{1}{RC}\,u_c + \frac{E}{RC}}'
            note: "On divise par RC et on separe les deux termes du second membre : forme demandee."
      - id: q2
        part: "I — Exploitation graphique de la courbe de la figure 2"
        stem: |-
          **(0,5 pt)** En exploitant la courbe de la figure 2, montrer que la capacité du condensateur est : $C = 12\ \mu\text{F}$.
        reasoning: |-
          Nouvelle lecture graphique, à ponter avec la question précédente : la leçon ne trace jamais $\dfrac{du_C}{dt}$ en fonction de $u_C$ elle-même — ses courbes sont $q(t)$, $u_C(t)$ ou $i(t)$ contre le temps, lues par la tangente à l'origine ou la méthode des $63\ \%$ (R3). Mais l'équation établie en question 1 EST la droite qu'on regarde ici : $\dfrac{du_c}{dt} = -\dfrac{1}{RC}u_c + \dfrac{E}{RC}$ est affine en $u_c$, de pente $-\dfrac{1}{RC}$ et d'ordonnée à l'origine $\dfrac{E}{RC}$. Deux lectures suffisent : à $u_c = 0$ (ordonnée à l'origine), on lit $\dfrac{E}{RC} = 1000\ \text{V.s}^{-1}$ ; là où la droite coupe l'axe des abscisses ($\dfrac{du_c}{dt}=0$), on lit directement $u_c = E = 12\ \text{V}$ — c'est le régime permanent, retrouvé ici par lecture graphique plutôt que par la limite $t\to\infty$ vue en R2. Une fois $E$ connu, on combine les deux lectures pour remonter à $RC$, puis à $C$ puisque $R$ est donnée.
        steps:
          - math: 'u_c = 0 \implies \frac{du_c}{dt} = \frac{E}{RC} = 1000\ \text{V.s}^{-1}'
            note: "Ordonnee a l'origine de la droite (figure 2) : lecture directe."
          - math: '\frac{du_c}{dt} = 0 \implies u_c = E = 12\ \text{V}'
            note: "Abscisse ou la droite coupe l'axe : regime permanent, u_c = E (rung 2), retrouve ici par lecture graphique."
          - math: 'RC = \frac{E}{1000} = \frac{12}{1000} = 1{,}2\times10^{-2}\ \text{s}'
            note: "On combine les deux lectures : E/(RC) = 1000 et E = 12 donnent RC."
          - math: 'C = \frac{RC}{R} = \frac{1{,}2\times10^{-2}}{10^{3}}'
            note: "R = 10^3 ohms est donne dans l'enonce."
          - math: '\boxed{C = 1{,}2\times10^{-5}\ \text{F} = 12\ \mu\text{F}}'
            note: "Resultat demande."

