    intro: |-
      **Détermination expérimentale de la capacité d'un condensateur — en utilisant un générateur de courant (examen national, session normale 2018, Exercice III — sous-partie I-1).**

      Un professeur a consacré, avec ses élèves, une séance de travaux pratiques de physique pour déterminer expérimentalement la valeur de la capacité d'un condensateur par deux méthodes différentes, et étudier un circuit RLC série.

      Un premier groupe d'élèves réalise le montage expérimental de la figure 1, constitué d'un générateur idéal de courant qui alimente le circuit par un courant électrique d'intensité $I_0$, d'un conducteur ohmique de résistance $R$, de deux condensateurs $(c_1)$ et $(c_2)$ montés en parallèle, respectivement de capacités $C_1 = 7{,}5\ \mu\text{F}$ et $C_2$ inconnue, et d'un interrupteur $K$.

      À l'instant $t_0 = 0$, un élève ferme le circuit. À l'aide d'un système d'acquisition informatisé, le groupe d'élèves obtient la courbe des variations de la charge $q$ du condensateur équivalent à l'association des deux condensateurs $(c_1)$ et $(c_2)$ en fonction de la tension $u_{AB}$ (figure 2).

      **Figure 1 (schéma).** Boucle unique. Branche de gauche, de haut en bas : le générateur idéal de courant, dessiné par un cercle barré horizontalement en son milieu, avec une flèche verticale montante tracée à l'extérieur, à sa gauche, étiquetée « $I_0$ » ; puis, sous le cercle, le conducteur ohmique (rectangle vertical) étiqueté « R » à sa gauche. Branche du haut : depuis le sommet du générateur, un fil part vers la droite, porte l'interrupteur $K$ (levier ouvert, étiquette « K » au-dessus) et rejoint le nœud A (point noir, étiquette « A » au-dessus). Branche de droite : de A, le fil descend et se dédouble en deux branches parallèles portant chacune un condensateur — celui de gauche étiqueté « $C_1$ » (étiquette à sa gauche), celui de droite « $C_2$ » (étiquette à sa droite) — qui se rejoignent et descendent vers le nœud B (point noir, étiquette « B » au-dessous). Branche du bas : de B, le fil repart vers la gauche jusqu'au bas du conducteur ohmique, fermant la boucle.

      **Figure 2 (courbe).** $q\ (\mu\text{C})$ en fonction de $u_{AB}\ (\text{V})$, sur un quadrillage de 6 divisions en largeur et 6 divisions en hauteur ; seules les valeurs $10$ et $20$ sont chiffrées en ordonnée, $1$ et $2$ en abscisse, plus le $0$ à l'origine : le pas du quadrillage vaut donc $1\ \text{V}$ horizontalement et $10\ \mu\text{C}$ verticalement, et le cadre va jusqu'à $6\ \text{V}$ / $60\ \mu\text{C}$. Droite croissante partant exactement de l'origine et rejoignant exactement le coin supérieur droit du cadre $(6\ \text{V}\,;\,60\ \mu\text{C})$, en passant par les intersections $(1\,;\,10)$, $(2\,;\,20)$, $(3\,;\,30)$… du quadrillage principal : la pente se lit donc $10\ \mu\text{C.V}^{-1}$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Quel est l'intérêt de monter des condensateurs en parallèle ?
        reasoning: |-
          Question de cours sur les condensateurs, hors des rungs de cette leçon : R0–R4 étudient un condensateur **unique** soumis à un échelon de tension, jamais une association de plusieurs condensateurs. En montant deux condensateurs en parallèle sous la même tension $u_{AB}$, les charges qu'ils portent s'additionnent — la capacité équivalente $C_{eq} = C_1 + C_2$ est donc strictement supérieure à celle de chaque condensateur pris isolément.

          L'intérêt de l'association en parallèle est d'obtenir, à partir de composants disponibles, une capacité équivalente plus grande que celle de chacun des deux condensateurs pris séparément — donc de stocker davantage de charge sous une même tension.
      - id: q2
        stem: |-
          **(0,75 pt)** En exploitant la courbe de la figure 2, déterminer la valeur de la capacité $C_{eq}$ du condensateur équivalent aux deux condensateurs $(c_1)$ et $(c_2)$.
        reasoning: |-
          On réutilise la relation rappelée au rung 1 — la charge posée sur les armatures fixe la tension, $q = Cu_C$ — généralisée ici au condensateur équivalent : $q = C_{eq}\,u_{AB}$ à chaque instant, quelle que soit la façon dont le courant $I_0$ les a chargés. Cette relation dit que $q$ est proportionnelle à $u_{AB}$, une droite passant par l'origine, et que son coefficient de proportionnalité **est** $C_{eq}$. Il suffit donc de lire la pente sur le graphe fourni : la droite rejoint exactement le coin $(6\ \text{V}\,;\,60\ \mu\text{C})$ du quadrillage en partant de l'origine.
        steps:
          - math: 'q = C_{eq}\,u_{AB}'
            note: "Definition de la capacite (rung 1), generalisee au condensateur equivalent : q proportionnelle a u, droite par l'origine."
          - math: 'C_{eq} = \frac{q}{u_{AB}} = \frac{60\times10^{-6}}{6}'
            note: "Pente de la droite, lue sur le quadrillage : elle passe exactement par (6 V ; 60 microC)."
          - math: '\boxed{C_{eq} = 10\times10^{-6}\ \text{F} = 10\ \mu\text{F}}'
            note: "Resultat demande."
      - id: q3
        stem: |-
          **(0,5 pt)** En déduire la valeur de la capacité $C_2$.
        reasoning: |-
          Les deux condensateurs $(c_1)$ et $(c_2)$ sont montés en parallèle (figure 1) : pour cette association, les charges s'additionnent à tension commune, $q = q_1 + q_2 = C_1u_{AB} + C_2u_{AB}$, donc les capacités s'additionnent, $C_{eq} = C_1 + C_2$ — un résultat du cours sur les condensateurs, hors des rungs de cette leçon (qui ne traitent qu'un condensateur unique). On isole $C_2$, avec $C_{eq}$ tout juste lu (question 2) et $C_1$ donné par l'énoncé.
        steps:
          - math: 'C_{eq} = C_1 + C_2'
            note: "Association en parallele : les capacites s'additionnent (regle du cours, hors rungs de cette lecon)."
          - math: 'C_2 = C_{eq} - C_1 = 10 - 7{,}5'
            note: "On isole C2, avec Ceq lu a la question 2 et C1 = 7,5 microF donne par l'enonce."
          - math: '\boxed{C_2 = 2{,}5\ \mu\text{F}}'
            note: "Coherent avec la sous-partie I-2 deja banquee (bk-2018-n-x3) : tau = R C2 = 4,0 ms retrouve la meme valeur par une autre methode."

