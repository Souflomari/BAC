# sourcing.note : le même condensateur « ajustable » vaut 10 µF ici et
# 3–11 pF en section 3.
#
# Le 2021 R (Exercice 4, Partie I — échelon de tension lu sur la courbe
# i(t), tangente à l'origine) est la PREMIÈRE entrée de session rattrapage
# de cette banque. Elle ne recoupe ni le sommet de leçon ni aucune autre
