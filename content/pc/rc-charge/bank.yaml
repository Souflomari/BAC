#
# SCOPE NOTES (techniques mobilisées au-delà de ce que les rungs R0–R4 de la
# leçon montrent explicitement pas à pas — pontées au point d'usage dans le
# raisonnement de la question concernée, PAS corrigées ni simplifiées ici) :
#   - bk-2018-n-x3b, q1 et q3 : l'association de deux condensateurs en
#     parallèle (C_eq = C1 + C2, additivité des charges à tension commune)
