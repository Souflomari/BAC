    intro: |-
      **Charge d'un condensateur par une source de courant (examen national, session normale 2025, Exercice 3 — Partie 1).**

      Les composantes électroniques telles que les diodes, les bobines, les condensateurs se trouvent dans différents circuits électriques et électroniques de plusieurs appareils électriques utilisés dans le domaine industriel, de communication, de numérisation… Cet exercice se propose d'étudier la charge d'un condensateur et sa décharge dans un dipôle RL, ainsi que la sélection et la démodulation d'une onde modulée en amplitude. Le montage électrique représenté par le schéma de la figure 1 comporte un circuit de charge d'un condensateur et un autre de sa décharge.

      **1 — Charge d'un condensateur par une source de courant.** On veut déterminer la capacité $C_0$ d'un condensateur, initialement déchargé, en utilisant le montage de la figure 1. Le générateur de courant $G$ débite un courant électrique d'intensité constante $I_0 = 1\ \mu\text{A}$. À un instant choisi comme origine des dates $(t_0 = 0)$, on met l'interrupteur $K$ en position (1). Un système d'acquisition informatisé permet d'obtenir la courbe d'évolution temporelle de la tension $u_C(t)$ aux bornes du condensateur lors de sa charge (figure 2).

      **Figure 1 (schéma, commun aux trois parties de l'exercice).** Boucle comportant, de gauche à droite en partant du bas : le générateur $G$ (symbole cercle traversé d'un trait horizontal droit, en diamètre — symbole du générateur de courant continu), en série avec le conducteur ohmique $R$ (rectangle, étiquette « R » au-dessus) porté par la branche du haut, jusqu'au nœud « (1) » ; à droite de ce nœud, un interrupteur à double position, actionné par le levier « K », pouvant basculer sur la position « (1) » (vers $R$–$G$) ou sur la position « (2) » (vers le nœud « N », à droite). Le condensateur $C_0$ est monté verticalement entre le point commun (pivot) de l'interrupteur $K$ et le nœud « M » en bas ; sa tension $u_C$ est fléchée vers le haut, et le courant $i$ est fléché vers le bas juste en dessous du condensateur. À droite, entre N et M, une bobine « (b) » $(L, r)$ est dessinée en spires.

      **Figure 2 (courbe).** $u_C\ (\text{V})$ en fonction de $t\ (\text{s})$, sur quadrillage à double graduation (traits principaux noirs, sous-quadrillage fin bleu). Axe des ordonnées gradué aux traits principaux $2$ et $4$ ; axe des abscisses gradué aux traits principaux $2$ et $4$. Droite croissante partant exactement de l'origine, passant par les points $(2\,;\,2)$ et $(4\,;\,4)$ — pente apparente $1\ \text{V.s}^{-1}$ — et se prolongeant en ligne droite jusqu'au coin supérieur droit du cadre : le cadre compte $5$ divisions principales de $2$ unités sur chacun des deux axes, donc ce coin vaut exactement $(10\ \text{s}\,;\,10\ \text{V})$.
    questions:
      - id: q1
        part: "1 — Charge d'un condensateur par une source de courant : établir la loi horaire"
        stem: |-
          **(0,5 pt)** Exprimer la tension $u_C(t)$ en fonction de $I_0$, $C_0$ et $t$.
        reasoning: |-
          On reprend les deux relations rappelées au rung 1 — le courant est le débit de charge, $i = \dfrac{dq}{dt}$, et la charge posée sur les armatures fixe la tension, $q = C_0 u_C$. Mais le mécanisme qui construit l'équation de R1 — la boucle qui se referme sur elle-même, $i = \dfrac{E-u_C}{R}$, un courant qui ralentit à mesure que $u_C$ monte — ne s'applique pas ici : le générateur $G$ est un générateur **idéal de courant**, qui impose $I_0$ constant dans toute la boucle série, quelle que soit la tension à ses bornes. Contrairement à l'échelon de tension des rungs R0–R4, le courant ne dépend jamais de $u_C$ : il ne ralentit pas. Le courant qui charge $C_0$ vaut donc $I_0$ à chaque instant, et l'on intègre directement.
        steps:
          - math: 'i(t) = \frac{dq}{dt} = I_0'
            note: "Générateur idéal de courant : I0 imposé constant dans toute la boucle série, sans ralentir (contrairement à l'échelon de tension des rungs R0-R4)."
          - math: 'q(t) = I_0\,t'
            note: "On intègre à courant constant, avec q(0)=0 (condensateur initialement déchargé)."
          - math: '\boxed{u_C(t) = \frac{q(t)}{C_0} = \frac{I_0}{C_0}\,t}'
            note: "Définition de la capacité (rung 1) : q = C0 uC."
      - id: q2
        part: "1 — Vérification numérique de la capacité $C_0$"
        stem: |-
          **(0,5 pt)** Vérifier que $C_0 = 1\ \mu\text{F}$.
        reasoning: |-
          L'expression établie à la question précédente dit que $u_C(t)$ est une droite passant par l'origine, de pente $\dfrac{I_0}{C_0}$ — exactement la droite lue sur la figure 2. On lit cette pente sur le graphe, puis on isole $C_0$.
        steps:
          - math: 'u_C(t) = \frac{I_0}{C_0}\,t \implies \text{pente} = \frac{I_0}{C_0}'
            note: "Coefficient directeur de la droite (question précédente)."
          - math: '\text{pente} = \frac{u_C}{t} = \frac{10}{10} = 1\ \text{V.s}^{-1}'
            note: "Lecture graphique : la droite part de l'origine et rejoint exactement le coin (10 s ; 10 V) du cadre."
          - math: 'C_0 = \frac{I_0}{\text{pente}} = \frac{1\times10^{-6}}{1}'
            note: "On isole C0, avec I0 = 1 microA donné par l'énoncé."
          - math: '\boxed{C_0 = 1\times10^{-6}\ \text{F} = 1\ \mu\text{F}}'
            note: "Résultat à vérifier — conforme à l'énoncé."
