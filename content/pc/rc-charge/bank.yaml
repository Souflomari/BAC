#
# ⚑ FLAG DE JUMELAGE — bk-2024-r-x4 (2024 R) face à bk-2021-r-x4 (2021 R).
# Les deux portent le MÊME intitulé officiel (« Réponse d'un dipôle RC à un
# échelon de tension », partie 1 de l'Exercice 4 d'un sujet de rattrapage),
# les deux se lisent sur une exponentielle DÉCROISSANTE, et les deux se
# ferment par une lecture de tau à la tangente à l'origine. Décision : les
# GARDER TOUTES LES DEUX, sans trancher seul — précédent de l'électrolyse
# 2023-r face à 2019-n, où la loi de Faraday est posée dans l'autre sens.
# Ce qui les distingue :
#   (a) LE SENS DE RÉSOLUTION EST INVERSÉ. En 2021 R, E est donnée (6 V) et
#       c'est la RÉSISTANCE qui se récolte au premier instant (R1 = E/I0 =
#       120 Ω) ; en 2024 R, R est donnée (50 Ω) et c'est la F.É.M. qui se
#       récolte au premier instant (E = u_R(0) = 5 V). Le même geste
#       physique — à t = 0 le condensateur déchargé laisse toute la tension
#       sur R — sert deux inconnues opposées. C'est exactement le motif du
#       précédent électrolyse cité ci-dessus, et c'est la raison principale
#       de garder les deux : un élève qui n'a vu qu'un seul sens croit avoir
#       appris une formule, pas un mécanisme.
#   (b) LA GRANDEUR ENREGISTRÉE DIFFÈRE. 2021 R trace i(t) et demande
#       l'équation différentielle en i ; 2024 R trace u_R(t) et demande
#       l'équation en u_R. Les deux équations sont homogènes (second membre
#       nul) et proportionnelles l'une à l'autre par u_R = R.i, mais le
#       chemin d'établissement n'est pas le même : 2021 R dérive la maille
#       puis substitue du_C/dt = i/C ; 2024 R dérive la maille PUIS doit
#       encore passer par la loi d'Ohm i = u_R/R, et son piège de signe
#       (u_C et u_R varient en sens opposés) n'existe pas dans l'autre.
#   (c) AUCUN RECOUPEMENT NUMÉRIQUE. E = 5 V / R = 50 Ω / C = 0,10 µF /
#       tau = 5 µs ici, contre E = 6 V / R1 = 120 Ω / C = 100 µF /
#       tau = 12 ms là-bas — six ordres de grandeur d'écart sur C, trois sur
#       tau. Les pièges de lecture graphique portent d'ailleurs sur des
#       choses différentes : chiffrage un trait sur deux et bord de cadre
#       au-delà du dernier nombre en 2021 R ; préfixe µs (facteur mille) et
#       repère « tau » non chiffré placé AVANT le premier nombre imprimé en
#       2024 R.
#   (d) LA DENSITÉ DIFFÈRE. 2021 R fait 4 questions / 2,0 pt et inclut la
#       vérification de la solution exponentielle (méthode du physicien,
#       rung 2) ; 2024 R fait 3 questions / 1,5 pt et ne la demande jamais —
#       il donne l'équation à établir puis passe directement aux lectures.
# À l'arbitrage de l'owner s'il préfère n'en garder qu'une sur la page ; la
# recommandation de l'auteur est de garder les deux, pour (a).
#
# Le 2023 R (Exercice 3, section 1 — échelon de tension lu sur la courbe
# q(t)) est la DEUXIÈME entrée de session rattrapage de cette banque. Elle
# est la seule qui fasse tourner la même figure trois fois : équation
# différentielle en q, lecture de tau à la tangente pour VÉRIFIER une
# capacité annoncée, puis énergie emmagasinée — le tout sans que la f.é.m.
# E soit jamais donnée (elle se récolte sur le palier, E = q_max/C0 = 12 V).
# Aucun recoupement numérique avec le 2022 N (R = 1000 ohms / C = 50 µF /
# E lue directement sur le palier de u_C, là ; R = 35 ohms / C0 = 10 µF /
# q_max = 120 µC ici) : seule la valeur de E coïncide, par hasard, et elle
# est obtenue par des chemins différents. L'exercice 3 du sujet est un
# composite électricité dont les trois sections partagent le montage de la
# figure 1 ; les sections 2 et 3 sont converties séparément sous rlc-serie
