        l'enonce et confirmee par un corrige de professeur retrouve pour ce
        sujet (tau = 13 ms, non officiel) — et signale nommement la valeur
        concurrente (12,4 ms, 2,76 microF) plutot que de la taire. Second
        defaut, sans incidence : l'interrupteur K de la Figure 1 est dessine
        de facon ambigue (lame touchant les deux bornes au pixel) ; aucune
