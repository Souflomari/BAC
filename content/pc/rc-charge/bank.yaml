    intro: |-
      **Réponse d'un dipôle RC à un échelon de tension (examen national, session normale 2022, Exercice 3 — section 1).**

      Cet exercice se propose de déterminer la capacité d'un condensateur, de déterminer l'inductance d'une bobine, et d'effectuer une étude énergétique d'un circuit RLC série. On réalise le montage électrique schématisé sur la figure 1, constitué d'un générateur idéal de tension de force électromotrice $E$, d'un condensateur de capacité $C$ initialement déchargé, d'une bobine d'inductance $L$ et de résistance $r$, d'un conducteur ohmique de résistance $R$, et d'un interrupteur $K$ à double position.

      **1. Réponse d'un dipôle RC à un échelon de tension.** À un instant choisi comme origine des dates $t = 0$, on place l'interrupteur $K$ sur la position (1). Les courbes $(C_1)$ et $(C_2)$ de la figure 2 représentent l'évolution de la tension $u_C(t)$ aux bornes du condensateur et celle de l'intensité $i(t)$ du courant électrique qui circule dans le circuit. La droite $(T)$ est la tangente à la courbe $(C_1)$ au point d'abscisse $t = 0$.

      **Figure 1 (schéma).** Boucle comportant, en haut, un conducteur ohmique $R$ (rectangle) suivi d'un interrupteur $K$ à double position, de bornes « (1) » et « (2) ». À gauche, le générateur $E$ (symbole cercle, flèche de tension). Au centre, le condensateur (tension $u_C$ fléchée) monté entre le nœud (1)/$K$ et le bas du circuit. À droite de la position (2), une bobine étiquetée « $(L,r)$ ».

      **Figure 2 (deux courbes côte à côte).** À gauche, $u_C\ (\text{V})$ en fonction de $t\ (\text{ms})$ ; axe des ordonnées gradué $0,\ 3,\ 6,\ 9,\ 12$ ; axe des abscisses gradué $0,\ 50,\ 100,\ 150,\ 200$. Courbe $(C_1)$ croissante, concave, partant de $0$ et tendant asymptotiquement vers un palier à $u_C = 12{,}0\ \text{V}$ ; une droite en pointillés $(T)$, tangente à l'origine, coupe ce palier à $t = 50\ \text{ms}$. À droite, $i\ (\text{mA})$ en fonction de $t\ (\text{ms})$, mêmes graduations d'axes. Courbe $(C_2)$ décroissante, partant exactement de $12{,}0\ \text{mA}$ à $t = 0$ et décroissant exponentiellement vers $0$.
    questions:
      - id: q1
        part: "1. Réponse d'un dipôle RC à un échelon de tension : établir le modèle"
        stem: |-
          **(0,25 pt)** Montrer que l'équation différentielle vérifiée par la tension $u_C(t)$ s'écrit sous la forme : $\dfrac{du_C}{dt} + \dfrac{1}{RC}u_C = \dfrac{E}{RC}$.
        reasoning: |-
          Même geste qu'en R1 de la leçon : loi des mailles sur la boucle série, $E = u_R + u_C$ en convention récepteur ; $u_R = Ri$ par la loi d'Ohm ; puis $i = C\dfrac{du_C}{dt}$, obtenu de $i = \dfrac{dq}{dt}$ et $q = Cu_C$ — les deux relations rappelées au rung 1. On substitue, on obtient $RC\dfrac{du_C}{dt} + u_C = E$ — exactement l'équation boxée en R1 — puis on divise toute l'équation par $RC$ pour isoler la dérivée, ce qui donne la forme demandée ici.
        steps:
          - math: 'E = u_R + u_C'
            note: "Loi des mailles sur la boucle série, convention récepteur (rung 1)."
          - math: 'u_R = R\,i = R\,C\frac{du_C}{dt}'
            note: "Loi d'Ohm, avec i = C du_C/dt (de i = dq/dt et q = C u_C, rung 1)."
          - math: 'RC\frac{du_C}{dt} + u_C = E'
            note: "Même équation qu'en R1 de la leçon."
          - math: '\boxed{\frac{du_C}{dt} + \frac{1}{RC}\,u_C = \frac{E}{RC}}'
            note: "On divise par RC : forme demandée."
      - id: q2
        part: "1.2 — Exploiter la solution : le courant, puis la lecture graphique de R et C"
        stem: |-
          **(0,5 pt)** La solution de cette équation différentielle est de la forme $u_C(t) = E\left(1 - e^{-t/RC}\right)$. Établir l'expression de l'intensité du courant $i(t)$ en fonction de $E$, $R$, $C$ et $t$.
        reasoning: |-
          C'est exactement le calcul mené en R2 de la leçon : le courant se déduit de $u_C$ sans nouvelle hypothèse, par $i = C\dfrac{du_C}{dt}$. On dérive la forme donnée, on remplace, et le $C$ se simplifie avec le $C$ du dénominateur — on retrouve le résultat déjà établi en R2, ici avec $RC$ à la place de $\tau$ (puisque $\tau = RC$).
        steps:
          - math: '\frac{du_C}{dt} = \frac{E}{RC}\,e^{-t/RC}'
            note: "Dérivée de la forme donnée."
          - math: 'i(t) = C\frac{du_C}{dt} = C\cdot\frac{E}{RC}\,e^{-t/RC}'
            note: "i = C du_C/dt (rung 1) ; on substitue la dérivée."
          - math: '\boxed{i(t) = \frac{E}{R}\,e^{-t/RC}}'
            note: "Le C se simplifie : même résultat qu'en R2 de la leçon."
      - id: q3
        stem: |-
          **(0,5 pt)** En exploitant les courbes de la figure 2, déterminer la valeur de la résistance $R$.
        reasoning: |-
          L'expression établie à la question précédente donne, à $t=0$ (où $e^0=1$), $i(0^+) = \dfrac{E}{R}$ — le courant maximal du mécanisme de R1, toute la tension $E$ tombant d'abord sur la résistance. Deux lectures graphiques suffisent : $E$ se lit sur le palier de $(C_1)$, et $i(0^+)$ se lit sur la valeur de départ de $(C_2)$. On isole ensuite $R$.
        steps:
          - math: 'i(0^+) = \frac{E}{R}'
            note: "À t=0, l'exponentielle vaut 1 (question précédente)."
          - math: 'E = 12{,}0\ \text{V} \quad (\text{palier de } (C_1)), \qquad i(0^+) = 12{,}0\ \text{mA} \quad (\text{valeur initiale de } (C_2))'
            note: "Lectures graphiques sur la figure 2."
          - math: 'R = \frac{E}{i(0^+)} = \frac{12{,}0}{12{,}0\times10^{-3}}'
            note: "On isole R."
          - math: '\boxed{R = 1000\ \Omega}'
            note: "Résultat demandé."
      - id: q4
        stem: |-
          **(0,25 pt)** Montrer que la capacité $C$ du condensateur est : $C = 50\ \mu\text{F}$.
        reasoning: |-
          C'est la méthode de la tangente à l'origine, vue en R3 : la droite $(T)$, tangente à $(C_1)$ en $t=0$, coupe l'asymptote horizontale exactement à l'abscisse $t = \tau$. L'énoncé indique que $(T)$ coupe le palier à $t = 50\ \text{ms}$ : on lit $\tau$ directement. On remonte ensuite à $C$ par $\tau = RC$, avec $R$ tout juste trouvée (question précédente).
        steps:
          - math: '\tau = RC = 50\ \text{ms} = 50\times10^{-3}\ \text{s}'
            note: "Lecture graphique : la tangente (T) coupe le palier de (C1) en t = 50 ms (rung 3)."
          - math: 'C = \frac{\tau}{R} = \frac{50\times10^{-3}}{1000}'
            note: "On inverse tau = RC ; R = 1000 ohms vient de la question précédente."
          - math: '\boxed{C = 5{,}0\times10^{-5}\ \text{F} = 50\ \mu\text{F}}'
            note: "Résultat demandé."

