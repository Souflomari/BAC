    intro: |-
      **Étude d'un dipôle RC soumis à un échelon de tension ascendant (examen national, session normale 2015, Exercice 3 — Première partie, 2,50 points sur les 04,5 de l'exercice complet).**

      *La Deuxième partie de cet exercice — l'étude de la modulation d'amplitude — est indépendante de celle-ci et vit sous la notion « Ondes électromagnétiques — modulation d'amplitude » (entrée bk-2015-n-x3b).*

      Les thérmomètres électroniques permettent le repérage des hautes températures non repérables à l'aide des thérmomètres à mercure ou à alcool. Le fonctionnent de certains de ces thérmomètres utilise le comportement du circuit RC soumis à un échelon de tension ascendant, où $R$ est la résistance d'une thermistance. *(« thérmomètres » ×3, « fonctionnent » pour « fonctionnement » : défauts du sujet officiel, sans incidence.)*

      Pour établir la relation entre la résistance $R$ et la température $\theta$, une enseignante réalise le montage expérimental représenté sur la figure 1, constitué de :

      - Un condensateur de capacité $C = 1{,}5\ \mu\text{F}$ ;
      - Une sonde thermique, sous forme d'une thérmistance de résistance variable avec $\theta$ *(« thérmistance » tel qu'imprimé — défaut du sujet officiel, sans incidence)* ;
      - Interrupteur $K$ ;
      - Générateur idéal de tension de f.é.m. $E = 6\ \text{V}$ ;
      - Interface informatique permettant de suivre l'évolution de la tension $u_C$ aux bornes du condensateur en fonction du temps.

      Après immersion de la sonde thermique dans un milieu de température $\theta$ ajustable et fermeture de l'interrupteur, l'enseignante charge le condensateur à différentes température *(« différentes température » tel qu'imprimé, sans le pluriel attendu — défaut du sujet officiel, sans incidence)*. Les courbes de la figure 2 résument les résultats obtenus.

      **Figure 1 — le montage (schéma pour redessin).** Une maille unique : la thermistance $R$ (représentée par un rectangle plein) est enfermée dans un cadre en tirets légendé « Milieu de température $\theta$ » (une flèche descendante l'y désigne) ; l'interrupteur $K$, ouvert ; le générateur idéal, avec une flèche de tension $E$ orientée ; et le condensateur $C$. L'interface informatique est branchée en dérivation aux bornes du condensateur, par deux fils.

      **Figure 2 — les trois courbes $u_C(t)$ (description ET valeurs).** Trois courbes, toutes issues de l'origine $(0\,;\,0)$, toutes croissantes, toutes asymptotiques à $u_C = 6\ \text{V}$ ($=E$), d'autant plus « molles » (lentes à monter) qu'elles sont à droite. Axe des temps gradué $1,2,3,4,5\ \text{ms}$ ; axe des tensions gradué $2,4,6\ \text{V}$. Chacune porte, dans un cadre blanc posé sur le quadrillage, son étiquette de température : **`205°C`** sur la courbe la plus raide (la plus à gauche), **`185°C`** sur celle du milieu, **`175°C`** sur la plus molle (la plus à droite).

      **Figure 3 — $R$ en fonction de $\theta$ (description ET valeurs).** Une seule courbe, décroissante et convexe, avec une double rupture d'échelle (les deux axes ne partent pas de zéro). Axe $\theta(°C)$ gradué de $170$ à $220$ ; axe $R(\text{k}\Omega)$ gradué de $0,2$ à $1$. Valeurs lisibles sur la courbe :

      | $\theta$ (°C) | 170 | 175 | 180 | 185 | 190 | 195 | 200 | 205 | 210 | 215 | 220 |
      |---|---|---|---|---|---|---|---|---|---|---|---|
      | $R$ (kΩ) | 1,273 | 1,075 | 0,883 | 0,740 | 0,614 | 0,495 | 0,412 | 0,341 | 0,296 | 0,260 | 0,230 |
    questions:
      - id: q1
        part: "Première partie — Dipôle RC avec sonde thermique"
        stem: |-
          **1-1-** (0,5 pt) Recopier, sur la copie de rédaction, le montage de la figure 1, et représenter dessus la tension $u_C(t)$ aux bornes du condensateur, et $u_R(t)$ aux bornes de la sonde thermique, en convension récepteur. *(« convension » tel qu'imprimé — défaut du sujet officiel, sans incidence.)*
        reasoning: |-
          Exactement le rung R1 : dans une boucle série où $C$ et la thermistance $R$ sont traversés par le MÊME courant, la convention récepteur flèche chaque tension dans le même sens que ce courant — pas en alternant d'un dipôle à l'autre, pas en devinant un signe. On flèche donc $u_C$ au-dessus du condensateur et $u_R$ au-dessus de la thermistance, toutes deux orientées dans le sens de circulation du courant imposé par le générateur $E$ à la fermeture de $K$.

          **Le piège nommé de cette question.** Flécher $u_C$ et $u_R$ en sens opposés, par le réflexe de vouloir « faire le tour » de la maille en alternant les signes. $C$ et la thermistance sont en série, traversés par le même courant : les deux flèches suivent la MÊME direction, celle de ce courant.
      - id: q2
        stem: |-
          **1-2-** (0,5 pt) Établir l'équation différentielle vérifiée par $u_C(t)$.
        reasoning: |-
          Rien ne distingue cette thermistance d'un conducteur ohmique ordinaire du point de vue du circuit : c'est une résistance, simplement sensible à la température. La construction du rung R1 s'applique donc telle quelle. Loi des mailles en convention récepteur (question 1-1) :

          $$E = u_R + u_C$$

          On exprime $u_R$ par la loi d'Ohm, et le courant par les deux relations rappelées au rung 1 ($i=\frac{dq}{dt}$, $q=Cu_C$), ce qui donne $u_R = RC\dfrac{du_C}{dt}$.
        steps:
          - math: 'E = u_R + u_C'
            note: "Loi des mailles, convention recepteur (question 1-1)."
          - math: 'u_R = R\,i = R\,C\frac{du_C}{dt}'
            note: "Loi d'Ohm pour la thermistance R, avec i = C du_C/dt (rung R1)."
          - math: '\boxed{R\,C\,\frac{du_C}{dt} + u_C = E}'
            note: "Meme forme que le rung R1 : la thermistance joue exactement le role de R."
      - id: q3
        stem: |-
          **1-3-** (0,5 pt) La solution de cette équation différentielle s'écrit sous la forme : $u_C(t) = A + B\cdot e^{-\frac{t}{\tau}}$. Trouver les constantes $A$ et $B$.
        reasoning: |-
          Même méthode qu'au rung R2 : on n'intègre rien, on injecte la forme proposée dans l'équation différentielle et on identifie terme à terme, plutôt que de recopier une formule de mémoire.

          $$\frac{du_C}{dt} = -\frac{B}{\tau}\,e^{-t/\tau}$$

          On substitue dans $RC\dfrac{du_C}{dt} + u_C = E$ :

          $$RC\left(-\frac{B}{\tau}\right)e^{-t/\tau} + A + B\,e^{-t/\tau} = E$$

          Pour que cette égalité tienne à chaque instant, le terme constant et le terme en $e^{-t/\tau}$ doivent s'identifier séparément — exactement comme au rung R2 : le terme constant donne $A$, le terme exponentiel (qui doit s'annuler tout seul) fixe la relation entre $\tau$, $R$ et $C$, et la condition initiale $u_C(0)=0$ (condensateur déchargé à la fermeture de $K$) donne $B$.
        steps:
          - math: '\text{terme constant : } A = E'
            note: "Le terme sans exponentielle doit egaler E a lui seul (rung R2)."
          - math: '\text{condition initiale : } u_C(0) = A + B = 0 \implies B = -A = -E'
            note: "Le condensateur est decharge a la fermeture de K (rung R1)."
          - math: '\boxed{A = E = 6\ \text{V} \qquad B = -E = -6\ \text{V}}'
            note: "Meme forme que u_C(t) = E(1-e^{-t/tau}) du rung R2, ecrite ici A + B.e^{-t/tau}."
