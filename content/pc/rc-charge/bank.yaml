      status: sourced
      note: >-
        2021 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS 28F, element/127287 (Exercice IV, Partie I —
        réponse d'un dipôle RC à un échelon de tension ; barème de la partie
        = 1,0 pt sur les 4,75 pt de l'exercice complet, qui comporte aussi
        une Partie II sur les oscillations LC — transcrite sous
        rlc-serie.md — et une Partie III sur la modulation d'amplitude —
