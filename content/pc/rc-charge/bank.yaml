# — voir le renvoi croisé dans le sourcing.note de bk-2018-n-x3b.
#
# Le 2021 N (Exercice IV, Partie I — échelon de tension, lecture de
# du_C/dt = f(u_C)) ne recoupe ni le sommet (r-bac = 2019, r-variation =
