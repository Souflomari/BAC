    solution: |
      Énergie initialement stockée (condensateur chargé à E) :
      E_C = (1/2) C E^2 = 0,5 × 4,0e-6 × 100 = 2,0e-4 J = 200 µJ.
      À la fin de la décharge (t ≈ 5τ), u_C ≈ 0, donc l'énergie restant
