<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Droite du_C/dt = f(u_C) pour le dipôle RC : ordonnée à l’origine 4,0×10³ V par seconde en u_C = 0, droite de pente négative, racine (intersection avec l’axe des u_C) en u_C = E = 8,0 V.">
  <title>Droite du_C/dt = f(u_C) — troisième lecture du dipôle RC</title>
  <!--
    droite-duc-f-uc.svg — graphe de du_C/dt = f(u_C) pour la charge d'un
    dipôle RC (content/pc/rc-charge/lesson.md, "Une troisième lecture") : à
    partir de RC·du_C/dt + u_C = E, on isole du_C/dt = E/(RC) − u_C/(RC),
    une fonction AFFINE de u_C. Géométrie construite POINT POUR POINT comme
    droite-didt-f-i.svg (content/pc/dipole-rl/media/) — même famille de
    lecture, même forme de droite, seules les grandeurs changent. STAGED
    (LESSON-EXPERIENCE-SPEC §2.5 — un graphe est TOUJOURS staged, ordre
    canonique axes → données → lecture) :
      step-1 : le repère — axe u_C (V) en abscisse, axe du_C/dt en
               ordonnée, croisant à l'origine (u_C=0, du_C/dt=0)
      step-2 : les données — la droite et sa formule
      step-3 : la lecture — l'ordonnée à l'origine (4,0×10³ V/s) et la
               racine (E = 8,0 V), les deux valeurs que le texte donne

    Données numériques (texte, "Exemple numérique") :
      ordonnée à l'origine : E/(RC) = 4,0×10³ V/s (donnée du texte)
      racine : u_C = E = 8,0 V (donnée du texte)
      d'où τ = racine/ordonnée = 8,0/4,0×10³ = 2,0×10⁻³ s = 2,0 ms — déjà
      calculé dans le texte, pas répété comme lecture graphique ici : cette
      figure porte l'ordonnée et la racine, pas leur rapport.

    Repère écran — IDENTIQUE, point pour point, à droite-didt-f-i.svg :
      origine (u_C=0, du_C/dt=0) : (80, 200)
      échelle u_C     : 55 px/V     → u_C=8,0 V en x=520 (racine)
      échelle du_C/dt : 35 px/(×10³ V/s) → 4,0×10³ V/s en y=60 (ordonnée)
    Droite de (80,60) [u_C=0, 4,0×10³ V/s] à (586,221) [u_C=9,2 V,
    du_C/dt=4000−500×9,2=−600 V/s=−0,6×10³ V/s] — prolongement au-delà de
    la racine pour rendre le franchissement visible. Vérification que la
    droite passe par la racine : à u_C=8,0 V, x=80+8×55=520 ; y attendu
    entre les deux extrémités : 60+(520−80)×(221−60)/(586−80)
    = 60+440×161/506 = 60+140,0 = 200,0 — exactement la ligne de zéro.

    Rôle des couleurs (cohérent avec uc-charge.svg / charge-courant-
    constant.svg de cette même leçon) :
      droite (donnée, "propriété du condensateur qui se charge") :
        --figure-energy-C
      ordonnée à l'origine, racine (lecture)                      :
        --figure-accent (mise en évidence neutre — comme dans uc-charge.svg,
        τ = RC mêle R et C, aucune des deux couleurs de composant ne serait
        plus juste que l'autre)
      axes / "0"                                                  :
        --figure-ink-soft
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le repère : axes u_C (V) / du_C/dt
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Titre -->
    <text x="340" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Troisième lecture : la droite du<tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3">/dt = f(u</tspan><tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3">)</tspan>
    </text>

    <!-- Fond du panneau -->
    <rect x="40" y="32" width="590" height="200" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axe vertical (du_C/dt) — traverse le zéro, positif ET négatif -->
    <line x1="80" y1="224" x2="80" y2="56"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,45 75.5,56 84.5,56" fill="var(--figure-ink-soft)"/>

    <!-- Axe horizontal (u_C) — seulement u_C ≥ 0 -->
    <line x1="80" y1="200" x2="604" y2="200"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="616,200 604,195.5 604,204.5" fill="var(--figure-ink-soft)"/>

    <!-- Étiquettes d'axes -->
    <text x="70" y="42" text-anchor="end" font-size="11"
          fill="var(--figure-ink-soft)">
      <tspan font-style="italic">du</tspan><tspan dy="3" font-size="7.5">C</tspan><tspan
      dy="-3" font-style="italic">/dt</tspan>
    </text>
    <text x="624" y="204" font-size="11" fill="var(--figure-ink-soft)">
      <tspan font-style="italic">u</tspan><tspan dy="3" font-size="7.5">C</tspan><tspan
      dy="-3" font-size="9"> (V)</tspan>
    </text>
    <text x="70" y="214" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : la droite et sa formule
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Boîte formule -->
    <rect x="255" y="40" width="245" height="32" rx="5"
          fill="var(--figure-energy-C)" fill-opacity="0.12"/>
    <text x="377" y="61" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-energy-C)">du<tspan
          dy="4" font-size="9">C</tspan><tspan
          dy="-4">/dt = E/(RC) − u</tspan><tspan
          dy="4" font-size="9">C</tspan><tspan
          dy="-4">/(RC)</tspan>
    </text>

    <!-- Droite du_C/dt = f(u_C), exacte de (80,60) à (586,221) -->
    <line x1="80" y1="60" x2="586" y2="221"
          stroke="var(--figure-energy-C)" stroke-width="2.4" stroke-linecap="round"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : ordonnée à l'origine et racine
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Ordonnée à l'origine : (u_C=0, du_C/dt = 4,0×10³ V/s) -->
    <line x1="75" y1="60" x2="85" y2="60"
          stroke="var(--figure-accent)" stroke-width="1.6"/>
    <circle cx="80" cy="60" r="3.5" fill="var(--figure-accent)"/>
    <text x="68" y="64" text-anchor="end" font-size="10.5"
          fill="var(--figure-accent)">4,0×10<tspan dy="-4" font-size="7.5">3</tspan><tspan
          dy="4"> V/s</tspan></text>

    <!-- Racine : (u_C = E = 8,0 V, du_C/dt = 0) -->
    <line x1="520" y1="195" x2="520" y2="205"
          stroke="var(--figure-accent)" stroke-width="1.6"/>
    <circle cx="520" cy="200" r="3.5" fill="var(--figure-accent)"/>
    <text x="528" y="180" font-size="10.5"
          fill="var(--figure-accent)">E = 8,0 V</text>
  </g><!-- /step-3 -->

</svg>
