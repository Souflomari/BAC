<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Schéma du circuit RC série : générateur de f.é.m. E, interrupteur K, conducteur ohmique R, condensateur C, courant i.">
  <title>Circuit RC série</title>

  <!-- Dégradé partagé pour le corps de R — même technique que rl-schema.svg / rlc-schema.svg -->
  <defs>
    <linearGradient id="r-body-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="var(--figure-surface)"/>
      <stop offset="45%"  stop-color="var(--figure-grid)"/>
      <stop offset="100%" stop-color="var(--figure-surface)"/>
    </linearGradient>
  </defs>

  <!--
    rc-schema.svg — Circuit RC série, figure STATIQUE (pas de step-groups).
    Mirrors rl-schema.svg's layout grammar exactly, for visual-family
    consistency across the corpus:
      Corners : TL(72,64) TR(456,64) BR(456,256) BL(72,256)
      K  : fil du haut, centre  (x=195..265, y=64)
      Générateur E : fil gauche, vertical (x=72, y=118..194) — identique à rl-schema
      Condensateur C : fil du bas, horizontal (x=170..370, y=256) — remplace
                       la bobine de rl-schema à la même position
      R  : fil droit, vertical (x=436..476, y=114..190) — même boîte que rl-schema/rlc-schema

    Role-color convention (matches rl-schema.svg / rlc-schema.svg):
      wires / K / générateur / R body : --figure-ink (structural, neutral)
      hachures R                       : --figure-ink-soft
      condensateur C (plaques + label) : --figure-energy-C (slate-blue)
      courant i                        : --figure-accent

    Sens du courant : conventionnel, sort de la borne + du générateur (en
    haut du symbole), remonte vers TL, traverse K puis R (haut→bas), puis le
    fil du bas de droite à gauche (à travers C) vers BL, puis remonte dans le
    générateur par sa borne −. Cohérent avec la flèche i dessinée sur le fil
    du haut (gauche → droite) — même flèche que rl-schema.svg.

    Polarité des plaques du condensateur : le courant parcourt le fil du bas
    de droite (sortant de R) vers gauche (entrant dans le générateur) — donc
    la plaque de droite (la plus proche de R) est atteinte la première par le
    courant conventionnel : c'est la plaque +. La plaque de gauche (la plus
    proche du générateur) est la plaque −. Même logique de polarité que le
    condensateur de rlc-schema.svg (plaque "en amont" du courant = +).
  -->

  <!-- Titre -->
  <text x="280" y="26" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Circuit RC série
  </text>

  <!-- ── Fils du circuit ──────────────────────────────────── -->
  <!-- Fil haut gauche → borne gauche de K -->
  <line x1="72" y1="64" x2="195" y2="64"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil haut droite, borne droite de K → coin TR -->
  <line x1="265" y1="64" x2="456" y2="64"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil droit haut : TR → haut de la boîte R -->
  <line x1="456" y1="64" x2="456" y2="114"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil droit bas : bas de la boîte R → coin BR -->
  <line x1="456" y1="190" x2="456" y2="256"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil bas droite → plaque droite du condensateur -->
  <line x1="370" y1="256" x2="456" y2="256"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil bas gauche, plaque gauche du condensateur → coin BL -->
  <line x1="72" y1="256" x2="170" y2="256"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil gauche bas : borne − du générateur → coin BL -->
  <line x1="72" y1="170" x2="72" y2="256"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil gauche haut : coin TL → borne + du générateur -->
  <line x1="72" y1="64" x2="72" y2="140"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>

  <!-- Points de coin (jonctions) -->
  <circle cx="72"  cy="64"  r="3" fill="var(--figure-ink)"/>
  <circle cx="456" cy="64"  r="3" fill="var(--figure-ink)"/>
  <circle cx="456" cy="256" r="3" fill="var(--figure-ink)"/>
  <circle cx="72"  cy="256" r="3" fill="var(--figure-ink)"/>

  <!-- ── Interrupteur K (haut centre) ─────────────────────── -->
  <circle cx="195" cy="64" r="3" fill="var(--figure-ink)"/>
  <circle cx="265" cy="64" r="3" fill="var(--figure-ink)"/>
  <line x1="195" y1="64" x2="258" y2="46"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <text x="226" y="40" text-anchor="middle"
        font-size="13" font-style="italic" fill="var(--figure-ink)">K</text>

  <!-- ── Générateur E (fil gauche, vertical) ──────────────── -->
  <!-- Borne + : trait long et fin -->
  <line x1="50" y1="140" x2="94" y2="140"
        stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Borne − : trait court et épais -->
  <line x1="58" y1="170" x2="86" y2="170"
        stroke="var(--figure-ink)" stroke-width="5" stroke-linecap="round"/>
  <!-- Signes + / − -->
  <text x="72" y="131" text-anchor="middle"
        font-size="9" font-weight="700" fill="var(--figure-ink)">+</text>
  <text x="72" y="187" text-anchor="middle"
        font-size="9" font-weight="700" fill="var(--figure-ink)">−</text>
  <!-- Étiquette E, à gauche du symbole -->
  <text x="34" y="159" text-anchor="end"
        font-size="13" font-style="italic" fill="var(--figure-ink)">E</text>

  <!-- ── Résistor R (fil droit, vertical) ──────────────────── -->
  <rect x="436" y="114" width="40" height="76" rx="5"
        fill="url(#r-body-grad)"
        stroke="var(--figure-ink)" stroke-width="1.8"/>
  <!-- Hachures internes (symbole européen) -->
  <line x1="445" y1="128" x2="467" y2="128" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-linecap="round"/>
  <line x1="445" y1="140" x2="467" y2="140" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-linecap="round"/>
  <line x1="445" y1="152" x2="467" y2="152" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-linecap="round"/>
  <line x1="445" y1="164" x2="467" y2="164" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-linecap="round"/>
  <line x1="445" y1="176" x2="467" y2="176" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-linecap="round"/>
  <!-- Étiquette R -->
  <text x="456" y="156" text-anchor="middle"
        font-size="13" font-style="italic" fill="var(--figure-ink)">R</text>

  <!-- ── Condensateur C (fil du bas, horizontal) — energy-C ── -->
  <!-- Fil d'entrée : coin BL → plaque gauche -->
  <line x1="170" y1="256" x2="252" y2="256"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fil de sortie : plaque droite → coin BR -->
  <line x1="288" y1="256" x2="370" y2="256"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <!-- Plaque gauche (−) -->
  <line x1="252" y1="241" x2="252" y2="271"
        stroke="var(--figure-energy-C)" stroke-width="3" stroke-linecap="round"/>
  <!-- Plaque droite (+) -->
  <line x1="288" y1="241" x2="288" y2="271"
        stroke="var(--figure-energy-C)" stroke-width="3" stroke-linecap="round"/>
  <!-- Signe − (plaque gauche) -->
  <text x="252" y="233" text-anchor="middle"
        font-size="9" font-weight="700" fill="var(--figure-ink)">−</text>
  <!-- Signe + (plaque droite) -->
  <text x="288" y="233" text-anchor="middle"
        font-size="9" font-weight="700" fill="var(--figure-ink)">+</text>
  <!-- Étiquette C, au-dessus des plaques -->
  <text x="270" y="221" text-anchor="middle"
        font-size="13" font-style="italic" fill="var(--figure-energy-C)">C</text>

  <!-- ── Courant i (fil du haut, entre K et TR) ────────────── -->
  <line x1="330" y1="64" x2="376" y2="64"
        stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="376,64 362,58.5 362,69.5" fill="var(--figure-accent)"/>
  <text x="353" y="53" text-anchor="middle"
        font-size="14" font-style="italic" fill="var(--figure-accent)">i</text>

</svg>
