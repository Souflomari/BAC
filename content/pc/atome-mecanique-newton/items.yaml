notion: atome-mecanique-newton
skill_code: pc_atome_mecanique_newton

# Misconception inventory (backfilled in the summit-conversion pass, PC named
# exception — see docs/sujets/pc/atome-mecanique-newton.md). This end bank
# (AMN-1…18) was authored before the inventory existed (`misconceptions: []`),
# so every item now carries an item-level `primary_misconception`, and every
# distractor carries a `misconception:` tag (a handful are honestly `null` —
# pure arithmetic/algebra slips, not a stable conceptual model). See
# `coverage_summary` at the end of this file for honest counts: this is a
# short, single-arc conceptual chapter, not a computation-heavy one, so its
# 18 items span mostly-distinct facets rather than repeating a handful of
# models 3+ times each — only 1 of 19 misconceptions meets the ≥3 floor.
misconceptions:
  - id: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
    label: >-
      « La gravitation compte, ou est comparable à la force de Coulomb, à
      l'échelle atomique »
    description: >-
      L'élève croit que la présence de deux masses suffit à rendre la
      gravitation significative (voire dominante) entre l'électron et le
      noyau, au lieu de comparer réellement les ordres de grandeur des deux
      forces.
    contradicts_principle: >-
      Le calcul du rapport (R1) donne F_C/F_G ≈ 2,3 × 10^39, un facteur
      indépendant de r et pratiquement indépendant de Z : la gravitation
      existe mais est totalement négligeable devant la force de Coulomb à
      cette échelle.

  - id: mc.physics.pc_atome_mecanique_newton.force-electrostatique-mal-identifiee
    label: >-
      « Une autre interaction (nucléaire, de contact) retient l'électron, ou
      Coulomb ne s'applique qu'aux charges libres »
    description: >-
      L'élève propose une interaction qui n'a pas cours à l'échelle de
      l'orbite électronique (force nucléaire à courte portée, force de
      contact) ou restreint à tort la loi de Coulomb aux charges non liées.
    contradicts_principle: >-
      La force de Coulomb s'applique dès que deux charges sont en présence,
      liées ou non ; l'interaction nucléaire forte agit entre nucléons, à
      très courte portée, bien en-deçà de la distance électron-noyau ; il
      n'existe aucun lien matériel entre les deux.

  - id: mc.physics.pc_atome_mecanique_newton.coulomb-toujours-attractive-comme-gravitation
    label: >-
      « La force électrostatique est toujours attractive, comme la
      gravitation »
    description: >-
      L'élève généralise à tort la propriété « toujours attractive » de la
      gravitation à la force de Coulomb, qui peut au contraire être
      répulsive.
    contradicts_principle: >-
      F_C = k|q1 q2|/r² est attractive si q1 et q2 sont de signes opposés,
      répulsive s'ils sont de même signe — contrairement à la gravitation,
      toujours attractive entre deux masses.

  - id: mc.physics.pc_atome_mecanique_newton.distance-confondue-avec-signe-charge
    label: >-
      « C'est la proximité électron-noyau qui rend la force attractive »
    description: >-
      L'élève attribue le caractère attractif de la force à la distance
      (l'électron est « très proche »), au lieu du signe des charges en
      présence.
    contradicts_principle: >-
      La distance règle uniquement l'intensité de la force (en 1/r²) ; son
      caractère attractif ou répulsif ne dépend que du signe du produit
      q1 q2, quelle que soit la distance.

  - id: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
    label: "« Mouvement circulaire uniforme ⇒ accélération nulle »"
    description: >-
      L'élève confond la norme constante du vecteur vitesse (« uniforme »)
      avec un vecteur vitesse constant, et en déduit à tort que
      l'accélération est nulle.
    contradicts_principle: >-
      La direction de la vitesse change à chaque instant même si sa norme
      reste constante : l'accélération est non nulle, purement normale
      (centripète), de norme a_N = v²/r.

  - id: mc.physics.pc_atome_mecanique_newton.confond-composante-tangentielle-et-normale
    label: >-
      « L'accélération du mouvement circulaire uniforme est tangentielle »
    description: >-
      L'élève place la composante non nulle de l'accélération dans le sens
      du mouvement (tangentielle) au lieu de la composante normale
      (centripète).
    contradicts_principle: >-
      En mouvement circulaire uniforme, a_T = dv/dt = 0 (norme de v
      constante) ; c'est la composante NORMALE a_N = v²/r, liée au
      changement de direction, qui est non nulle.

  - id: mc.physics.pc_atome_mecanique_newton.norme-acceleration-mcu-non-constante
    label: >-
      « La norme de l'accélération centripète varie au cours du temps en
      MCU »
    description: >-
      L'élève pense que le vecteur accélération change à la fois de norme
      et de direction, alors qu'en mouvement circulaire uniforme seule la
      direction tourne.
    contradicts_principle: >-
      a_N = v²/r : puisque v et r sont constants dans un mouvement
      circulaire uniforme, la norme de l'accélération l'est aussi ; seule sa
      direction, toujours dirigée vers le centre, tourne avec l'électron.

  - id: mc.physics.pc_atome_mecanique_newton.vitesse-orbitale-dependance-r-mal-comprise
    label: "« La vitesse orbitale v augmente avec r, ou n'en dépend pas »"
    description: >-
      L'élève inverse le sens de variation de v = √(ke²/(m_e r)) avec r, ou
      croit que le mouvement circulaire uniforme impose une même vitesse
      quelle que soit la taille de l'orbite.
    contradicts_principle: >-
      v est inversement proportionnelle à √r : plus l'orbite est grande,
      plus l'électron tourne lentement — chaque rayon possède sa propre
      vitesse ; « uniforme » qualifie la constance de v dans le temps sur
      une orbite donnée, pas l'égalité entre orbites.

  - id: mc.physics.pc_atome_mecanique_newton.rapport-forces-dependrait-de-r
    label: "« Le rapport F_C/F_G dépend de r (ou de Z) »"
    description: >-
      L'élève pense qu'il faut connaître r (ou que le résultat ne vaudrait
      que pour un r particulier, ou changerait notablement avec Z) pour
      comparer les deux forces.
    contradicts_principle: >-
      Les deux forces varient de la même façon en 1/r² : ce facteur se
      simplifie exactement dans le rapport F_C/F_G = ke²/(G m_e m_p),
      indépendant de r et, à un facteur Z près (quelques unités),
      pratiquement indépendant du noyau considéré.

  - id: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
    label: >-
      « Le calcul mécanique de l'orbite (chapitre 3) suffit à expliquer la
      stabilité réelle de l'atome »
    description: >-
      L'élève croit que puisque la mécanique de Newton donne une orbite
      stable, elle rend compte à elle seule de la stabilité observée de la
      matière — voire qu'elle prédirait directement la quantification des
      niveaux d'énergie.
    contradicts_principle: >-
      Le calcul du chapitre 3 est correct mais incomplet : une charge accélérée
      (l'électron en orbite) rayonne de l'énergie électromagnétique, ce qui
      devrait faire s'effondrer l'électron sur le noyau — un ingrédient
      extérieur à la mécanique, qu'elle ne prédit ni n'explique.

  - id: mc.physics.pc_atome_mecanique_newton.calcul-incomplet-confondu-avec-calcul-faux
    label: >-
      « Puisque la réalité contredit la mécanique seule, le calcul du chapitre 3
      était faux »
    description: >-
      L'élève conclut, du paradoxe du chapitre 4, que la deuxième loi de Newton a
      été mal appliquée au chapitre 3 ou que la force utilisée n'était pas la
      bonne, au lieu de distinguer un calcul correct-mais-incomplet.
    contradicts_principle: >-
      Le calcul du chapitre 3 reste une description instantanée correcte d'une
      orbite à rayon fixe ; ce qui manque, c'est un ingrédient extérieur à
      la mécanique (le rayonnement d'une charge accélérée), pas une erreur
      dans l'application de la deuxième loi de Newton.

  - id: mc.physics.pc_atome_mecanique_newton.ingredient-manquant-mal-identifie
    label: >-
      « Le mécanisme qui bouleverse la conclusion mécanique n'est pas le
      rayonnement d'une charge accélérée »
    description: >-
      L'élève propose un autre mécanisme (perte de masse, force de Coulomb
      qui changerait de signe, noyau non immobile) pour expliquer pourquoi
      la conclusion du chapitre 3 doit être révisée.
    contradicts_principle: >-
      L'ingrédient manquant est un résultat de l'électromagnétisme : toute
      charge électrique accélérée rayonne de l'énergie. L'électron, en
      accélération centripète permanente, perd donc de l'énergie en
      continu — aucun autre mécanisme n'est en jeu.

  - id: mc.physics.pc_atome_mecanique_newton.energie-atome-continue-non-quantifiee
    label: "« L'énergie de l'atome varie de façon continue (comme le prédit le chapitre 3) »"
    description: >-
      L'élève garde l'idée d'un continuum d'énergies possibles,
      éventuellement borné par une valeur minimale, au lieu du fait
      expérimental de la quantification.
    contradicts_principle: >-
      L'énergie d'un atome ne peut prendre qu'un ensemble discret de
      valeurs — des niveaux, comme des marches d'escalier, pas une rampe
      continue même bornée — contrairement à ce qu'autoriserait la
      mécanique classique seule.

  - id: mc.physics.pc_atome_mecanique_newton.mecanisme-arret-effondrement-mal-compris
    label: >-
      « Ce qui arrête l'effondrement, ce n'est pas l'existence d'un niveau
      d'énergie minimal »
    description: >-
      L'élève invoque un mécanisme erroné pour expliquer l'arrêt de
      l'effondrement classique (la quantification empêcherait le
      rayonnement, la force de Coulomb s'annulerait, l'électron cesserait
      d'accélérer).
    contradicts_principle: >-
      Ce qui arrête l'effondrement, c'est l'existence d'un niveau d'énergie
      le plus bas (l'état fondamental) en dessous duquel l'électron ne peut
      pas descendre — le rayonnement et l'accélération centripète, eux,
      restent des faits physiques, non supprimés par la quantification.

  - id: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
    label: >-
      « ΔE = hν mal manipulée (inversée, en somme, au carré, ou mauvais
      isolement de ν) »
    description: >-
      L'élève inverse la relation de Planck-Einstein (h/ν, h+ν, hν²), ou
      isole mal ν lors d'une application numérique.
    contradicts_principle: >-
      ΔE = h·ν est un produit, linéaire en ν ; pour en tirer ν, on divise
      ΔE par h (pas l'inverse), h et ν n'étant homogènes ni pour une somme
      ni pour un carré.

  - id: mc.physics.pc_atome_mecanique_newton.formule-orbite-non-adaptee-Z
    label: >-
      « La formule de v (ou T) établie pour l'hydrogène se généralise sans
      adapter le facteur de charge Z »
    description: >-
      L'élève réapplique la formule du chapitre 3 (Z=1) sans changement, ou adapte
      mal le facteur Z (mauvaise puissance, mauvais placement sous la
      racine) pour un ion à charge nucléaire différente.
    contradicts_principle: >-
      Le noyau de charge +Ze donne F_C = kZe²/r² : le facteur Z entre
      linéairement dans la force, doit rester sous la racine dans
      v = √(Zke²/(m_e r)), et ne doit ni disparaître, ni être élevé au
      carré, ni sortir de la racine.

  - id: mc.physics.pc_atome_mecanique_newton.mecanique-jugee-inapplicable-aux-charges
    label: >-
      « La mécanique de Newton ne s'applique pas à une particule chargée
      microscopique »
    description: >-
      L'élève pense que la deuxième loi de Newton est réservée aux objets
      macroscopiques (satellites, planètes) et ne peut pas s'appliquer à
      l'électron.
    contradicts_principle: >-
      La deuxième loi de Newton s'applique à toute particule soumise à une
      force, quelle que soit son origine ; le chapitre 3 l'applique précisément à
      l'électron avec la force de Coulomb et obtient un résultat cohérent.

  - id: mc.physics.pc_atome_mecanique_newton.confond-cause-et-consequence-effondrement
    label: >-
      « La force de Coulomb diminue avec le temps, ce qui ferait fuir
      l'électron »
    description: >-
      L'élève imagine que la force s'affaiblit spontanément dans le temps
      et en déduit une fuite de l'électron, inversant la relation
      cause-conséquence réelle.
    contradicts_principle: >-
      La force de Coulomb ne dépend que de la distance r, pas explicitement
      du temps : c'est la perte d'énergie par rayonnement qui fait DIMINUER
      r (donc AUGMENTER la force), pas l'inverse — et le mouvement
      résultant est un rapprochement, pas une fuite.

  - id: mc.physics.pc_atome_mecanique_newton.trajectoire-elliptique-supposee-necessaire
    label: >-
      « Le modèle aurait dû utiliser une trajectoire elliptique, pas
      circulaire »
    description: >-
      L'élève importe la généralisation képlérienne (orbites elliptiques)
      vue en gravitation, alors que le modèle de ce chapitre pose
      explicitement une trajectoire circulaire uniforme.
    contradicts_principle: >-
      Le paradoxe de R3 ne porte pas sur la forme de l'orbite : il vient du
      rayonnement d'une charge accélérée, qui empêche r de rester constant
      dans le temps quelle que soit la trajectoire supposée au départ.

items:

  # ── Confondre force de Coulomb et force gravitationnelle ──────────────────
  - id: AMN-1
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_atome_mecanique_newton
    tags: [force_coulomb, force_gravitationnelle, comparaison]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
    stem: >
      Un élève affirme : « c'est la force gravitationnelle qui maintient
      l'électron en orbite autour du noyau, exactement comme pour un
      satellite autour de la Terre. » Cette affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : la force électrostatique de Coulomb domine très largement la
          force gravitationnelle à cette échelle (facteur d'environ
          $10^{39}$) ; c'est elle qui retient l'électron.
        correct: true
      - id: B
        text: "Oui : les deux particules possèdent une masse, donc la gravitation s'applique en premier lieu, la force électrostatique ne venant qu'ensuite la corriger légèrement."
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          La gravitation existe bien entre l'électron et le noyau, mais elle
          est totalement négligeable face à la force électrostatique
          (environ $10^{39}$ fois plus faible). Ce n'est pas parce qu'une
          interaction existe qu'elle domine le mouvement : il faut comparer
          les ordres de grandeur, pas seulement constater la présence d'une
          masse.
      - id: C
        text: >-
          Oui : la force électrostatique ne s'applique qu'à des charges libres, et non à
          des particules déjà liées entre elles au sein d'un atome, où seule la
          gravitation subsiste.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.force-electrostatique-mal-identifiee
        feedback: >
          La force électrostatique s'applique dès que deux charges sont en
          présence, liées ou non. Rien ne la désactive à l'intérieur d'un
          atome — c'est au contraire elle qui y domine entièrement.
      - id: D
        text: >-
          Aucune des deux ne s'applique ici : c'est une force nucléaire, de même nature
          que celle qui tient les nucléons ensemble, qui retient l'électron autour du
          noyau.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.force-electrostatique-mal-identifiee
        feedback: >
          L'interaction nucléaire forte agit entre nucléons, à très courte
          portée, à l'intérieur du noyau — elle n'a aucune action sur
          l'électron, situé bien au-delà de sa portée. C'est la force
          électrostatique de Coulomb qui retient l'électron.
    correct_feedback: >
      Le calcul du rapport des deux forces (chapitre 2) montre que la force de
      Coulomb l'emporte sur la gravitation d'un facteur d'environ $10^{39}$
      entre l'électron et le proton : la gravitation est présente mais
      totalement négligeable à cette échelle.
    solution: |
      **Les deux expressions :**
      $$F_G = G\frac{m_e m_p}{r^2} \qquad F_C = k\frac{e^2}{r^2}$$

      **Calcul du rapport (indépendant de $r$, car les deux forces varient en $1/r^2$) :**
      $$\frac{F_C}{F_G} = \frac{k e^2}{G\,m_e m_p} \approx 2{,}3 \times 10^{39}$$

      La force électrostatique domine si largement que la gravitation peut
      être ignorée dans ce modèle : c'est elle qui joue le rôle de force
      centripète.

  - id: AMN-2
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [force_coulomb, force_gravitationnelle, ordre_de_grandeur]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
    stem: >
      On donne $G \approx 6{,}67 \times 10^{-11}\ \text{N}\cdot\text{m}^2\cdot\text{kg}^{-2}$,
      $k \approx 9{,}0 \times 10^{9}\ \text{N}\cdot\text{m}^2\cdot\text{C}^{-2}$,
      $m_e \approx 9{,}1 \times 10^{-31}\ \text{kg}$,
      $m_p \approx 1{,}67 \times 10^{-27}\ \text{kg}$,
      $e \approx 1{,}6 \times 10^{-19}\ \text{C}$. Que peut-on dire des ordres
      de grandeur de $F_C$ (force de Coulomb) et $F_G$ (force gravitationnelle)
      entre un électron et un proton, à une distance $r$ quelconque ?
    type: mcq
    choices:
      - id: A
        text: "$F_C$ est environ $10^{39}$ fois plus grande que $F_G$, quelle que soit la valeur de $r$."
        correct: true
      - id: B
        text: "$F_C$ et $F_G$ sont du même ordre de grandeur, car les deux forces varient en $1/r^2$."
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          Varier de la même façon avec $r$ (en $1/r^2$) ne veut pas dire
          avoir la même valeur : ce sont les constantes ($k$ et $G$) et les
          grandeurs multipliées (charges contre masses) qui fixent
          l'intensité de chaque force, et elles sont radicalement
          différentes ici.
      - id: C
        text: "$F_G$ est plus grande que $F_C$, car la masse du proton est très supérieure à celle de l'électron."
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          Le rapport des masses ($m_p/m_e \approx 1836$) reste bien plus
          petit que l'écart entre les deux forces (facteur $10^{39}$). C'est
          l'inverse : $F_C$ domine très largement $F_G$.
      - id: D
        text: >-
          On ne peut pas comparer les deux forces sans connaître la valeur
          précise de $r$.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.rapport-forces-dependrait-de-r
        feedback: >
          Le rapport $F_C/F_G$ ne dépend pas de $r$ : les deux forces
          contiennent le même facteur $1/r^2$, qui se simplifie exactement
          dans le rapport. Le résultat ($\approx 10^{39}$) est valable à
          n'importe quelle distance.
    correct_feedback: >
      $\dfrac{F_C}{F_G} = \dfrac{k e^2}{G\,m_e m_p} \approx 2{,}3 \times
      10^{39}$, un rapport indépendant de $r$ puisque les deux forces varient
      de la même façon avec la distance.
    solution: |
      $$\frac{F_C}{F_G} = \frac{k\,e^2 / r^2}{G\,m_e m_p / r^2} = \frac{k e^2}{G\,m_e m_p}$$

      Le facteur $1/r^2$ se simplifie : le rapport ne dépend que des
      constantes et des grandeurs des particules, pas de la distance.

      $$\frac{F_C}{F_G} = \frac{9{,}0 \times 10^{9} \times (1{,}6\times 10^{-19})^2}{6{,}67\times 10^{-11} \times 9{,}1\times 10^{-31} \times 1{,}67\times 10^{-27}} \approx 2{,}3 \times 10^{39}$$

  # ── Mal appliquer la condition de mouvement circulaire uniforme ───────────
  - id: AMN-3
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_atome_mecanique_newton
    tags: [mouvement_circulaire_uniforme, acceleration_centripete]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
    stem: >
      Dans le modèle planétaire, l'électron effectue un mouvement circulaire
      uniforme autour du noyau. Que peut-on dire de son vecteur accélération
      $\vec{a}_G$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\vec{a}_G \neq \vec{0}$ : elle est purement normale (centripète),
          de norme $v^2/r$, car la direction de $\vec{v}_G$ change à chaque
          instant même si sa norme reste constante.
        correct: true
      - id: B
        text: "$\\vec{a}_G = \\vec{0}$, car le mouvement est uniforme : la vitesse ne change pas, et une accélération nulle en découle directement."
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
        feedback: >
          « Uniforme » ne veut dire que la NORME de la vitesse reste
          constante — pas que le vecteur vitesse lui-même reste constant. Sa
          direction change à chaque instant puisque l'électron tourne, ce qui
          suffit à produire une accélération non nulle.
      - id: C
        text: >-
          $\vec{a}_G \neq \vec{0}$, mais elle est purement tangentielle, dirigée dans le
          sens du mouvement, puisque c'est le long de la trajectoire que l'électron
          avance.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.confond-composante-tangentielle-et-normale
        feedback: >
          C'est l'inverse : puisque le mouvement est uniforme (norme de $v$
          constante), la composante TANGENTIELLE de l'accélération est
          nulle. La composante non nulle est la composante NORMALE
          (centripète), liée au changement de direction, pas de norme.
      - id: D
        text: >-
          $\vec{a}_G$ change de norme à chaque instant, en plus de changer de direction,
          la vitesse étant plus grande sur certaines portions de l'orbite.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.norme-acceleration-mcu-non-constante
        feedback: >
          La norme de $\vec{a}_G$ vaut $v^2/r$ : puisque $v$ et $r$ sont
          constants dans ce mouvement circulaire uniforme, la norme de
          l'accélération est elle aussi constante. Seule sa direction tourne
          avec l'électron, pas sa norme.
    correct_feedback: >
      Le vecteur vitesse change de direction à chaque instant (même à norme
      constante) : l'accélération est non nulle, purement centripète, de
      norme $a_N = v^2/r$, dirigée vers le noyau.
    solution: |
      En mouvement circulaire uniforme, l'accélération se décompose en une
      composante tangentielle et une composante normale :
      $$a_T = \frac{dv}{dt} = 0 \quad (\text{norme de } v \text{ constante})$$
      $$a_N = \frac{v^2}{r} \neq 0 \quad (\text{la direction de } \vec{v} \text{ change})$$
      « Uniforme » qualifie la norme de la vitesse, pas le vecteur vitesse
      dans son ensemble : un vecteur qui tourne n'est pas un vecteur
      constant, même si sa longueur ne change pas.

  - id: AMN-4
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [mouvement_circulaire_uniforme, deuxieme_loi_newton]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
    stem: >
      Un élève écrit, pour l'électron en mouvement circulaire uniforme
      autour du noyau : $\sum \vec{F}_{ext} = \vec{0}$, « car "uniforme"
      signifie qu'il n'y a pas de force en plus de l'équilibre ». Cette
      équation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : $\sum \vec{F}_{ext} = m_e\,\vec{a}_G \neq \vec{0}$, car
          $\vec{a}_G$ est non nulle (centripète) même si le mouvement est
          uniforme ; c'est justement la force de Coulomb qui joue ce rôle.
        correct: true
      - id: B
        text: >-
          Oui : « uniforme » veut dire que la vitesse est constante, donc que
          l'accélération est nulle, donc que la somme des forces l'est aussi d'après la
          deuxième loi.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
        feedback: >
          « Uniforme » porte sur la norme de la vitesse, pas sur le vecteur
          vitesse entier. Ici la direction de $\vec{v}_G$ change en
          permanence, donc $\vec{a}_G \neq \vec{0}$, et la deuxième loi
          impose alors $\sum \vec{F}_{ext} \neq \vec{0}$.
      - id: C
        text: >-
          Oui, car la force de Coulomb exercée par le noyau et le poids de l'électron se
          compensent exactement à cette distance, laissant une résultante nulle.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          Le poids de l'électron n'intervient nulle part dans ce modèle : à
          cette échelle, seule la force électrostatique de Coulomb compte
          (la gravitation est négligeable, d'un facteur $10^{39}$). Il n'y a
          pas de compensation poids/Coulomb ici.
      - id: D
        text: >-
          Non, mais seulement parce qu'il faudrait aussi inclure la force
          gravitationnelle exercée par le noyau dans le bilan des forces extérieures.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          La conclusion (l'équation est fausse) est correcte, mais la
          raison ne l'est pas : la gravitation est négligeable ici, elle
          n'est pas la force manquante. C'est l'accélération centripète, non
          nulle, qui rend $\sum \vec{F}_{ext} = \vec{0}$ incorrect — pas
          l'oubli d'une force supplémentaire.
    correct_feedback: >
      Le mouvement est uniforme (norme de $v$ constante) mais pas rectiligne :
      la direction de $\vec{v}_G$ change à chaque instant, donc
      $\vec{a}_G = v^2/r \neq \vec{0}$, et la deuxième loi de Newton impose
      $\sum \vec{F}_{ext} = m_e\vec{a}_G \neq \vec{0}$ — c'est précisément la
      force de Coulomb qui fournit cette accélération centripète.
    solution: |
      Le principe d'inertie ($\sum \vec{F}_{ext} = \vec{0}$) s'applique
      seulement quand $\vec{v}_G$ est constant EN VECTEUR (même norme, même
      direction, même sens). Ici la norme de $\vec{v}_G$ est constante mais
      la direction tourne en permanence, donc $\vec{v}_G$ n'est pas constant
      et $\vec{a}_G \neq \vec{0}$ :
      $$\sum \vec{F}_{ext} = m_e\,\vec{a}_G = m_e\frac{v^2}{r} \neq \vec{0}$$
      Cette force résultante non nulle est exactement la force de Coulomb,
      dirigée vers le centre.

  # ── Croire que le modèle classique explique tout correctement ─────────────
  - id: AMN-5
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [limites_mecanique_newton, rayonnement, paradoxe]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
    stem: >
      Que prédit la mécanique de Newton, complétée par l'électromagnétisme
      classique, pour un électron en mouvement circulaire autour du noyau
      dans le modèle planétaire ?
    type: mcq
    choices:
      - id: A
        text: >-
          L'électron, charge en accélération permanente, devrait rayonner de
          l'énergie électromagnétique en continu et s'effondrer sur le
          noyau en un temps extrêmement court.
        correct: true
      - id: B
        text: >-
          L'électron reste indéfiniment sur son orbite, exactement comme une planète
          autour du Soleil, sans la moindre perte d'énergie au fil du temps.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: >
          C'est ce que prédit la mécanique SEULE (chapitre 3), mais ce n'est pas la
          prédiction complète. Une charge en accélération (comme l'électron
          en orbite) rayonne de l'énergie d'après l'électromagnétisme : elle
          ne peut donc pas rester indéfiniment sur une orbite à rayon
          constant. Croire que le calcul mécanique du chapitre 3 suffit à expliquer
          la stabilité de l'atome, c'est ignorer cet ingrédient
          supplémentaire.
      - id: C
        text: >-
          L'électron finirait par s'échapper du noyau, car la force de Coulomb qui le
          retient diminue progressivement avec le temps qui passe.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.confond-cause-et-consequence-effondrement
        feedback: >
          La force de Coulomb ne dépend que de la distance $r$, pas du
          temps directement : elle ne « diminue » pas toute seule. C'est la
          perte d'énergie par rayonnement qui fait diminuer $r$ (donc
          augmenter la force), pas l'inverse.
      - id: D
        text: >-
          La mécanique de Newton prédit directement la quantification des niveaux
          d'énergie que l'on observe expérimentalement dans les spectres atomiques.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: >
          C'est l'inverse : rien dans la deuxième loi de Newton ni dans la
          force de Coulomb ne prédit une quantification. Ces lois
          autoriseraient un continuum d'orbites et d'énergies — c'est
          précisément leur limite, pas une réussite supplémentaire.
    correct_feedback: >
      Une charge accélérée rayonne de l'énergie électromagnétique (fait
      admis de l'électromagnétisme). L'électron en orbite, en accélération
      centripète permanente, devrait donc perdre de l'énergie en continu et
      s'effondrer sur le noyau presque instantanément — en contradiction
      frontale avec la stabilité observée de la matière.
    solution: |
      Le calcul du chapitre 3 (mécanique seule) donne une orbite parfaitement
      stable : rien n'y force $r$ à changer.

      Mais l'électron est une charge en accélération centripète permanente
      ($a_N = v^2/r \neq 0$). Un résultat de l'électromagnétisme (admis,
      non démontré ici) affirme que toute charge accélérée rayonne de
      l'énergie. Cette énergie est prélevée sur l'orbite : $r$ devrait donc
      diminuer en continu, jusqu'à un effondrement en un temps extrêmement
      bref.

      Ce n'est pas ce qu'on observe : la matière est stable. La mécanique de
      Newton, même combinée à l'électromagnétisme classique, ne résout pas
      cette contradiction — c'est la limite centrale de ce chapitre.

  - id: AMN-6
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [limites_mecanique_newton, quantification]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
    stem: >
      Quelle affirmation décrit correctement une limite de la mécanique de
      Newton à l'échelle de l'atome ?
    type: mcq
    choices:
      - id: A
        text: >-
          Elle ne permet en aucun cas d'expliquer pourquoi l'énergie de l'atome est
          quantifiée, ni pourquoi l'atome ne s'effondre pas.
        correct: true
      - id: B
        text: >-
          Elle prédit exactement les niveaux d'énergie observés : il n'y a
          donc aucune limite à signaler.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: >
          C'est l'inverse : la mécanique de Newton et la force de Coulomb,
          seules, n'imposent aucune restriction sur les valeurs possibles de
          $r$ ou de l'énergie — un continuum, pas des niveaux discrets. C'est
          précisément ce qu'elles ne peuvent pas expliquer.
      - id: C
        text: >-
          Elle ne s'applique qu'aux objets macroscopiques comme les
          satellites, jamais à une particule chargée comme l'électron.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mecanique-jugee-inapplicable-aux-charges
        feedback: >
          Ce n'est pas vrai : Le chapitre 3 applique justement la deuxième loi de
          Newton à l'électron, avec la force de Coulomb, et obtient un
          résultat cohérent (une vitesse et une période bien définies). La
          limite ne porte pas sur le fait d'appliquer la loi à une charge,
          mais sur l'impossibilité d'expliquer la quantification de
          l'énergie et la stabilité réelle de l'atome.
      - id: D
        text: >-
          Elle prédit que l'atome devrait être stable indéfiniment, sans
          aucune perte d'énergie, ce qui est confirmé par l'expérience.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: >
          C'est le sens inverse du paradoxe : la mécanique, combinée à
          l'électromagnétisme classique, prédit au contraire un effondrement
          rapide de l'électron sur le noyau (perte d'énergie par
          rayonnement), pas une stabilité parfaite. C'est cette prédiction
          d'instabilité qui contredit l'observation, pas une prédiction de
          stabilité confirmée.
    correct_feedback: >
      La limite précise à retenir : la mécanique de Newton (et
      l'électromagnétisme classique) ne permettent pas d'expliquer la
      quantification des niveaux d'énergie de l'atome, ni sa stabilité
      réelle — un cadre différent (la physique quantique) est nécessaire.
    solution: |
      Deux faits à distinguer nettement :
      - la mécanique de Newton CALCULE correctement une orbite à rayon
        fixe (chapitre 3) — ce n'est pas là que se situe la limite ;
      - elle ne peut pas expliquer pourquoi l'énergie de l'atome est
        quantifiée (niveaux discrets, pas un continuum), ni pourquoi
        l'atome ne s'effondre pas malgré le rayonnement attendu d'une
        charge accélérée.

      C'est cette impossibilité d'expliquer la quantification et la
      stabilité réelle, pas une erreur de calcul, qui constitue la limite
      de la mécanique de Newton évoquée dans ce chapitre.

  # ── (R0) Bien lire l'accroche : le modèle, sa prédiction, l'ingrédient manquant ──
  - id: AMN-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_atome_mecanique_newton
    tags: [modele_planetaire, force_electrique, accroche]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
    stem: >
      D'après le texte d'introduction (chapitre 1), dans le modèle planétaire de
      l'atome, quelle interaction joue le rôle tenu par la gravitation dans
      le cas d'une planète en orbite autour du Soleil ?
    type: mcq
    choices:
      - id: A
        text: >-
          L'attraction électrique entre la charge négative de l'électron et
          la charge positive du noyau.
        correct: true
      - id: B
        text: >-
          La gravitation elle-même : comme pour une planète, ce sont les
          masses de l'électron et du noyau qui expliquent l'orbite.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          Le texte le précise explicitement : « ce n'est pas la gravitation
          qui retient l'électron ». À l'échelle de l'atome, c'est
          l'attraction électrique qui joue ce rôle, pas la gravitation.
      - id: C
        text: >-
          L'interaction nucléaire forte entre les nucléons du noyau et
          l'électron.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.force-electrostatique-mal-identifiee
        feedback: >
          L'interaction forte agit entre nucléons, à l'intérieur du noyau, à
          très courte portée : elle n'a aucune action sur l'électron, situé
          bien au-delà de sa portée.
      - id: D
        text: >-
          Une force de contact, comme un fil qui relierait l'électron au
          noyau.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.force-electrostatique-mal-identifiee
        feedback: >
          Il n'y a aucun contact ni aucun lien matériel entre l'électron et
          le noyau : l'attraction est une force à distance, de nature
          électrique, exactement comme la gravitation est une force à
          distance entre masses.
    correct_feedback: >
      Le texte du chapitre 1 le dit explicitement : ce n'est pas la gravitation,
      mais l'attraction électrique entre la charge négative de l'électron et
      la charge positive du noyau qui joue, dans ce modèle, le rôle tenu par
      la gravitation pour une planète.
    solution: |
      Le modèle planétaire remplace la gravitation (force entre masses) par
      la force électrostatique (force entre charges) : l'électron, chargé
      négativement, est attiré par le noyau, chargé positivement. Le chapitre 2 confirmera par le calcul que cette force électrique domine très
      largement la gravitation à cette échelle.

  - id: AMN-8
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_atome_mecanique_newton
    tags: [modele_planetaire, mecanique_newton, accroche]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.calcul-incomplet-confondu-avec-calcul-faux
    stem: >
