        feedback: >
          C'est l'inverse : la mécanique de Newton seule (sans
          l'électromagnétisme) prédit une orbite stable. C'est un ingrédient
          extérieur à la mécanique — le rayonnement d'une charge accélérée —
          qui vient ensuite remettre en cause cette stabilité.
      - id: B
        text: >-
          Une orbite parfaitement stable, avec une vitesse et une période
          bien définies — mais le texte annonce déjà qu'un ingrédient
          extérieur à la mécanique va changer cette conclusion.
        correct: true
      - id: C
        text: >-
          Aucune prédiction n'est possible, car la mécanique de Newton ne s'applique
          tout simplement pas à une particule chargée comme l'électron de l'atome.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mecanique-jugee-inapplicable-aux-charges
        feedback: >
          La mécanique de Newton s'applique à toute particule soumise à une
          force, quelle que soit son origine (électrique, gravitationnelle...).
          Rien ne l'empêche de s'appliquer ici — le texte annonce d'ailleurs
          que ce calcul sera fait, et qu'il sera correct.
      - id: D
        text: >-
          Le rayon de l'orbite augmente progressivement avec le temps, jusqu'à ce que
          l'électron finisse par s'échapper complètement de l'attraction du noyau.
        correct: false
        misconception: null
        feedback: >
          Ce n'est pas ce que prédit la mécanique seule : sans ingrédient
          extérieur, rien ne fait varier le rayon $r$, qui reste constant.
          Et le paradoxe évoqué plus loin va même dans le sens inverse (un
          rapprochement du noyau), pas un éloignement.
    correct_feedback: >
      Le texte l'annonce précisément : la mécanique de Newton, appliquée
      correctement, donne une orbite parfaitement stable — vitesse et
      période calculables (ce sera fait au chapitre 3). Mais un ingrédient extérieur
      à la mécanique va s'inviter dans l'histoire et changer cette
      conclusion (ce sera le chapitre 4).
    solution: |
      Le chapitre 1 pose le paradoxe sans le résoudre : la mécanique seule (chapitre 3) donnera
      un calcul parfaitement correct et une orbite stable. Ce n'est qu'en
      ajoutant un résultat de l'électromagnétisme — une charge accélérée
      rayonne de l'énergie — que cette conclusion sera remise en cause (chapitre 4).

  - id: AMN-9
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_atome_mecanique_newton
    tags: [rayonnement, accroche, paradoxe]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.ingredient-manquant-mal-identifie
    stem: >
      Quel est, d'après l'accroche du chapitre (chapitre 1), l'élément extérieur à
      la mécanique de Newton qui vient bouleverser la conclusion du calcul
      mécanique sur l'orbite de l'électron ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le fait que l'électron perd de la masse à mesure qu'il tourne
          autour du noyau.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.ingredient-manquant-mal-identifie
        feedback: >
          Aucune perte de masse n'est en jeu ici : le texte parle d'une
          perte d'énergie, pas de masse. C'est une charge électrique qui
          accélère qui rayonne de l'énergie, pas une particule qui s'allège.
      - id: B
        text: >-
          Le fait que la force de Coulomb change de signe lorsque l'électron
          s'approche du noyau.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.ingredient-manquant-mal-identifie
        feedback: >
          La force de Coulomb ne change pas de signe ici : elle reste
          attractive tant que les charges de l'électron et du noyau restent
          opposées, quelle que soit la distance. Ce n'est pas ce mécanisme
          qui est en jeu dans le paradoxe.
      - id: C
        text: >-
          Le fait qu'une charge électrique accélérée rayonne de l'énergie
          sous forme d'onde électromagnétique.
        correct: true
      - id: D
        text: >-
          Le fait que le noyau, en réalité, n'est pas parfaitement immobile.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.ingredient-manquant-mal-identifie
        feedback: >
          Le texte suppose au contraire le noyau quasiment immobile (il est
          bien plus massif que l'électron) : ce n'est pas cette hypothèse
          simplificatrice qui est à l'origine du paradoxe, mais le
          rayonnement d'une charge accélérée.
    correct_feedback: >
      Le texte l'annonce : « une charge électrique qui accélère... rayonne
      de l'énergie ». Un électron en orbite accélère en permanence (même à
      vitesse constante, sa direction change) : ce résultat, extérieur à la
      mécanique, entraîne une perte d'énergie continue et ouvre le paradoxe
      développé au chapitre 4.
    solution: |
      L'ingrédient manquant n'appartient pas à la mécanique : c'est un
      résultat de l'électromagnétisme (toute charge accélérée rayonne de
      l'énergie) qui, combiné à l'orbite mécaniquement stable du chapitre 3, produit
      la contradiction développée au chapitre 4.

  # ── (R1) La force de Coulomb n'est pas toujours attractive ────────────────
  - id: AMN-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_atome_mecanique_newton
    tags: [force_coulomb, signe_des_charges, attractive_repulsive]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.coulomb-toujours-attractive-comme-gravitation
    stem: >
      Le noyau porte une charge $+Ze$ et l'électron une charge $-e$.
      Pourquoi la force électrostatique entre eux est-elle attractive ?
    type: mcq
    choices:
      - id: A
        text: >-
          Parce que toute force électrostatique est nécessairement attractive,
          exactement comme l'est la force gravitationnelle entre deux masses
          quelconques.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.coulomb-toujours-attractive-comme-gravitation
        feedback: >
          C'est faux : contrairement à la gravitation (toujours attractive
          entre deux masses), la force de Coulomb peut être répulsive. Entre
          deux charges de même signe, elle repousse ; ce n'est que parce que
          le noyau et l'électron sont de signes opposés qu'elle est ici
          attractive.
      - id: B
        text: >-
          Parce que le noyau est beaucoup plus massif que l'électron, et que c'est
          toujours le corps le plus massif qui attire l'autre vers lui.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          La masse des particules ne détermine pas le caractère attractif ou
          répulsif de la force électrostatique — c'est un critère propre à
          la gravitation. La force de Coulomb dépend du signe des charges,
          pas des masses.
      - id: C
        text: >-
          Parce que l'électron est très proche du noyau, à l'échelle atomique, et qu'à
          si courte distance toute interaction devient attractive.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.distance-confondue-avec-signe-charge
        feedback: >
          La distance influence l'intensité de la force (en $1/r^2$), pas
          son caractère attractif ou répulsif. Une force de Coulomb reste
          attractive ou répulsive quelle que soit la distance : c'est
          uniquement le signe des charges en présence qui le détermine.
      - id: D
        text: >-
          Parce que le noyau ($+Ze$) et l'électron ($-e$) portent des
          charges de signes opposés : la force de Coulomb est attractive
          lorsque $q_1$ et $q_2$ sont de signes opposés.
        correct: true
    correct_feedback: >
      Contrairement à la gravitation, toujours attractive, la force de
      Coulomb peut être attractive ou répulsive selon le signe des charges
      en présence. Ici, le noyau ($+Ze$) et l'électron ($-e$) sont de signes
      opposés : la force est donc attractive, dirigée vers le noyau —
      exactement ce qu'il faut pour jouer le rôle de force centripète.
    solution: |
      $$F_C = k\frac{\lvert q_1 q_2\rvert}{r^2}, \quad \text{attractive si } q_1 q_2 < 0, \quad \text{répulsive si } q_1 q_2 > 0$$

      Ici $q_1 = +Ze$ et $q_2 = -e$, donc $q_1 q_2 = -Ze^2 < 0$ : la force
      est attractive. Si l'on considérait plutôt deux électrons (deux
      charges $-e$), le produit serait positif et la force serait
      répulsive — la gravitation, elle, resterait attractive dans les deux
      cas.

  # ── (R2) Lire correctement la formule : comment $v$ varie avec $r$ ────────
  - id: AMN-11
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_atome_mecanique_newton
    tags: [vitesse_orbitale, dependance_en_r, lecture_de_formule]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.vitesse-orbitale-dependance-r-mal-comprise
    stem: >
      D'après la relation $v = \sqrt{\dfrac{k e^2}{m_e r}}$ établie au chapitre 3,
      que devient la vitesse $v$ de l'électron lorsque le rayon $r$ de son
      orbite augmente ?
    type: mcq
    choices:
      - id: A
        text: >-
          $v$ diminue : $v$ est inversement proportionnelle à $\sqrt{r}$,
          donc plus l'électron est loin du noyau, plus il tourne lentement.
        correct: true
      - id: B
        text: >-
          $v$ augmente, car une orbite plus grande permet à l'électron de
          développer une vitesse plus élevée.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.vitesse-orbitale-dependance-r-mal-comprise
        feedback: >
          C'est l'inverse de ce que montre la formule : $r$ apparaît au
          DÉNOMINATEUR sous la racine. Quand $r$ augmente, la quantité sous
          la racine diminue, donc $v$ diminue.
      - id: C
        text: >-
          $v$ reste constante, car le mouvement circulaire uniforme impose
          une vitesse identique quelle que soit la taille de l'orbite.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.vitesse-orbitale-dependance-r-mal-comprise
        feedback: >
          « Uniforme » signifie que $v$ est constante AU COURS DU TEMPS, sur
          une orbite de rayon $r$ donné — pas que $v$ serait la même pour
          toutes les orbites possibles. La formule montre au contraire que
          $v$ dépend de $r$ : chaque rayon possède sa propre vitesse.
      - id: D
        text: >-
          On ne peut pas savoir sans connaître la valeur du numéro atomique
          $Z$.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.vitesse-orbitale-dependance-r-mal-comprise
        feedback: >
          Le sens de variation de $v$ avec $r$ (une diminution) est fixé par
          la présence de $r$ au dénominateur sous la racine, quel que soit
          $Z$. $Z$ changerait la valeur numérique de $v$, pas le sens dans
          lequel elle varie avec $r$.
    correct_feedback: >
      La formule $v = \sqrt{\dfrac{k e^2}{m_e r}}$ montre que $v$ est
      inversement proportionnelle à $\sqrt{r}$ : plus l'orbite est grande,
      plus l'électron tourne lentement — exactement comme une planète plus
      éloignée du Soleil orbite plus lentement.
    solution: |
      $$v = \sqrt{\frac{k e^2}{m_e r}} = \sqrt{\frac{k e^2}{m_e}} \times \frac{1}{\sqrt{r}}$$

      Le facteur $\sqrt{k e^2/m_e}$ est constant : $v$ varie donc comme
      $1/\sqrt{r}$, une fonction strictement décroissante de $r$. Plus $r$
      augmente, plus $v$ diminue.

  # ── (R3) « Incomplet » n'est pas « faux » : le calcul de R2 reste-t-il correct ? ──
  - id: AMN-12
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [limites_mecanique_newton, calcul_correct_vs_incomplet]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.calcul-incomplet-confondu-avec-calcul-faux
    stem: >
      Le paradoxe du rayonnement, présenté au chapitre 4, remet-il en cause
      l'exactitude du calcul de la vitesse et de la période effectué au chapitre 3 à
      partir de la deuxième loi de Newton ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui : la deuxième loi de Newton a été mal appliquée au chapitre 3, ce qui
          invalide les expressions de $v$ et $T$.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-incomplet-confondu-avec-calcul-faux
        feedback: >
          Le texte est explicite sur ce point : le calcul du chapitre 3 est
          « parfaitement correct ». Ce n'est pas une erreur de calcul qui
          pose problème, mais le fait que ce calcul, à lui seul, ne suffit
          pas à décrire ce que l'électron fait dans le temps.
      - id: B
        text: >-
          Non : le calcul du chapitre 3 reste correct comme description instantanée
          d'une orbite à rayon fixe ; ce qui manque, c'est un ingrédient extérieur à la
          mécanique, le rayonnement d'une charge accélérée.
        correct: true
      - id: C
        text: >-
          Oui : la force de Coulomb utilisée au chapitre 3 n'est en réalité pas la
          bonne force à l'échelle de l'atome.
        correct: false
        misconception: null
        feedback: >
          Le chapitre 2 a établi, calcul à l'appui, que la force de Coulomb domine bien
          la gravitation d'un facteur $10^{39}$ : ce n'est pas la force
          utilisée au chapitre 3 qui est remise en cause par le paradoxe du chapitre 4.
      - id: D
        text: >-
          Non, mais uniquement parce que le chapitre 3 aurait dû utiliser une
          trajectoire elliptique plutôt que circulaire, ce qui modifie les expressions
          obtenues pour la vitesse et pour la période.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.trajectoire-elliptique-supposee-necessaire
        feedback: >
          La forme de l'orbite (circulaire ou elliptique) n'est pas ce qui
          est en jeu dans le paradoxe : le problème vient du rayonnement
          d'énergie par une charge accélérée, qui empêche $r$ de rester
          constant dans le temps, quelle que soit la trajectoire supposée.
    correct_feedback: >
      C'est précisément la nuance à retenir de ce chapitre : le calcul
      mécanique du chapitre 3 n'est pas faux, il est incomplet. Il décrit
      correctement une orbite à rayon $r$ fixé, mais ne peut pas dire si $r$
      reste fixe dans le temps — c'est l'électromagnétisme (le rayonnement
      d'une charge accélérée) qui répond à cette question, et sa réponse
      contredit la stabilité observée.
    solution: |
      Deux affirmations à ne pas confondre :
      - « le calcul du chapitre 3 est faux » — FAUX : $\vec{F}_C = m_e \vec{a}_G$
        est correctement appliqué, et donne une orbite mécaniquement stable ;
      - « le calcul du chapitre 3 suffit à expliquer la stabilité de l'atome » —
        FAUX également : un fait d'électromagnétisme (rayonnement d'une
        charge accélérée), extérieur à la mécanique, montre que le rayon ne
        peut pas rester constant dans le temps.

      L'erreur à éviter est précisément de confondre un calcul incomplet
      avec un calcul faux.

  # ── (R4) La quantification de l'énergie et la relation ΔE = hν ────────────
  - id: AMN-13
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_atome_mecanique_newton
    tags: [quantification_energie, niveaux_discrets]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.energie-atome-continue-non-quantifiee
    stem: >
      Dans le modèle classique du chapitre 3, l'énergie de l'électron pouvait varier
      de façon continue en fonction de $r$. Que dit, à l'inverse, le constat
      expérimental évoqué au chapitre 5 sur l'énergie d'un atome ?
    type: mcq
    choices:
      - id: A
        text: >-
          L'énergie de l'atome reste continue, comme le prédit la mécanique de Newton,
          mais elle est bornée par une valeur minimale en dessous de laquelle elle ne
          peut pas descendre.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.energie-atome-continue-non-quantifiee
        feedback: >
          C'est l'inverse du constat expérimental : l'énergie n'est pas
          continue-avec-un-plancher, elle est quantifiée — un ensemble de
          valeurs discrètes bien précises, pas un intervalle continu, même
          borné.
      - id: B
        text: >-
          L'énergie de l'atome ne dépend plus du tout de la configuration de l'électron
          autour du noyau, ce que le modèle classique du chapitre 3 ne pouvait pas
          prévoir.
        correct: false
        misconception: null
        feedback: >
          L'énergie reste bien liée à la configuration de l'électron (à quel
          niveau il se trouve) — simplement, seules certaines
          configurations, discrètes, sont autorisées, plutôt qu'un
          continuum.
      - id: C
        text: >-
          L'énergie de l'atome est quantifiée : elle ne peut prendre qu'un
          ensemble discret de valeurs, comme des marches d'escalier, et non
          un continuum comme le prédirait la mécanique classique.
        correct: true
      - id: D
        text: >-
          L'énergie de l'atome varie de façon continue, exactement comme le prédit le
          chapitre 3, mais uniquement dans le cas particulier de l'atome d'hydrogène.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.energie-atome-continue-non-quantifiee
        feedback: >
          La quantification n'est pas une exception propre à l'hydrogène :
          c'est un fait expérimental général, qui contredit justement ce que
          prédirait la mécanique classique du chapitre 3 pour n'importe quel atome.
    correct_feedback: >
      C'est le constat central du chapitre 5 : contrairement au continuum d'orbites
      et d'énergies qu'autoriserait la mécanique classique seule (chapitre 3),
      l'énergie d'un atome ne peut prendre qu'un ensemble discret de
      valeurs — des niveaux d'énergie, comme des marches d'escalier plutôt
      qu'une rampe continue.
    solution: |
      La mécanique de Newton et la force de Coulomb, seules, n'imposent
      aucune restriction sur les valeurs possibles de $r$ (donc de
      l'énergie) : un continuum serait autorisé. L'expérience montre au
      contraire que seules certaines valeurs discrètes d'énergie sont
      permises — la quantification, un fait que la mécanique classique ne
      prédit pas et ne peut pas expliquer.

  - id: AMN-14
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_atome_mecanique_newton
    tags: [relation_planck, delta_E_h_nu]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
    stem: >
      Un atome passe d'un niveau d'énergie à un autre en émettant un photon
      de fréquence $\nu$. Quelle relation relie correctement la différence
      d'énergie $\Delta E$ entre les deux niveaux à cette fréquence, avec
      $h$ la constante de Planck ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\Delta E = \dfrac{h}{\nu}$, car une fréquence plus grande
          correspond à une énergie échangée plus faible.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: >
          C'est l'inverse : plus la fréquence est grande, plus le photon
          transporte d'énergie. La relation correcte est une
          proportionnalité directe entre $\Delta E$ et $\nu$, pas un rapport
          inversé.
      - id: B
        text: >-
          $\Delta E = h\,\nu^2$, par analogie avec l'énergie cinétique qui
          varie en $v^2$.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: >
          Cette analogie avec l'énergie cinétique ne s'applique pas ici : la
          relation de Planck est linéaire en fréquence, pas quadratique. Il
          n'y a pas de $\nu^2$ dans $\Delta E = h\nu$.
      - id: C
        text: >-
          $\Delta E = h + \nu$, la constante de Planck s'ajoutant à la
          fréquence.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: >
          $h$ et $\nu$ n'ont pas la même unité (J·s pour $h$, Hz pour
          $\nu$) : on ne peut pas les additionner. La relation correcte est
          un produit, $\Delta E = h\nu$, pas une somme.
      - id: D
        text: "$\\Delta E = h\\,\\nu$, où $h$ est la constante de Planck : l'énergie croît avec la fréquence."
        correct: true
    correct_feedback: >
      La relation de Planck-Einstein, $\Delta E = h\nu$, relie directement
      (par un produit, pas une somme ni un rapport) la différence d'énergie
      entre deux niveaux à la fréquence de la lumière échangée.
    solution: |
      $$\Delta E = h \cdot \nu$$

      $h \approx 6{,}63 \times 10^{-34}\ \text{J}\cdot\text{s}$ est la
      constante de Planck : un produit, homogène (J·s $\times$ Hz = J), pas
      une somme ni un rapport entre $h$ et $\nu$.

  - id: AMN-15
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [quantification_energie, stabilite_atome, synthese]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.mecanisme-arret-effondrement-mal-compris
    stem: >
      En quoi le fait que l'énergie de l'atome soit quantifiée, évoqué en
      chapitre 5, permet-il de comprendre pourquoi l'atome ne s'effondre pas
      indéfiniment, contrairement à ce que prédisait la mécanique classique
      au chapitre 4 ?
    type: mcq
    choices:
      - id: A
        text: >-
          Il existe un niveau d'énergie le plus bas (l'état fondamental), en
          dessous duquel l'électron ne peut pas descendre : l'effondrement
          continu prédit par la mécanique classique n'est donc pas possible.
        correct: true
      - id: B
        text: >-
          Parce que la quantification de l'énergie empêche purement et simplement toute
          charge accélérée de rayonner de l'énergie électromagnétique, quel que soit le
          mouvement qu'elle décrit.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mecanisme-arret-effondrement-mal-compris
        feedback: >
          Le rayonnement d'une charge accélérée reste un fait de
          l'électromagnétisme ; la quantification ne l'annule pas. Ce que
          change la quantification, c'est l'existence d'un niveau d'énergie
          minimal, pas la suppression du mécanisme de rayonnement en
          lui-même.
      - id: C
        text: >-
          Parce que la force de Coulomb exercée par le noyau devient nulle lorsque
          l'électron s'en approche suffisamment, ce qui interrompt sa chute.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mecanisme-arret-effondrement-mal-compris
        feedback: >
          Aucun seuil de ce type n'apparaît dans la force de Coulomb, qui
          varie continûment en $1/r^2$ sans jamais s'annuler à distance
          finie. Ce n'est pas ce mécanisme qui explique la stabilité de
          l'atome.
      - id: D
        text: >-
          Parce que l'électron cesse totalement d'accélérer une fois la quantification
          de l'énergie prise en compte dans la description de son mouvement.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mecanisme-arret-effondrement-mal-compris
        feedback: >
          L'électron en orbite reste en accélération centripète ; la
          quantification ne supprime pas cette accélération. Ce qu'elle
          apporte, c'est l'existence d'un état fondamental, un niveau
          d'énergie plancher, qui arrête l'effondrement plutôt que
          d'empêcher l'accélération elle-même.
    correct_feedback: >
      C'est le point qui referme la boucle ouverte aux chapitres 1 et 4 : puisque
      l'énergie de l'atome ne peut descendre en dessous d'un niveau minimal
      (l'état fondamental), l'effondrement continu que prédisait la
      mécanique classique (chapitre 4) n'a pas lieu d'être — l'électron ne peut
      simplement pas atteindre des niveaux d'énergie encore plus bas.
    solution: |
      Le paradoxe du chapitre 4 repose sur une perte d'énergie continue, sans
      limite, jusqu'à un effondrement total. La quantification change la
      donne : puisqu'il existe un niveau d'énergie le plus bas (l'état
      fondamental) et qu'aucun niveau inférieur n'est autorisé, l'électron
      ne peut pas continuer à perdre de l'énergie indéfiniment — il est
      « bloqué » à ce niveau plancher. C'est ce constat, établi
      expérimentalement, que la mécanique de Newton seule ne pouvait pas
      prédire.

  # ── (R5) Entraînement bac : généraliser le calcul à un autre ion à un électron ──
  - id: AMN-16
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [application_bac, vitesse_orbitale, generalisation_Z]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.formule-orbite-non-adaptee-Z
    stem: >
      On modélise un ion lithium doublement ionisé, $\text{Li}^{2+}$ (noyau
      de charge $+3e$, un seul électron), par le modèle planétaire de ce
      chapitre, avec un rayon d'orbite $r$. On donne $k$, $e$ et $m_e$. En
      appliquant la deuxième loi de Newton au mouvement circulaire uniforme
      de l'électron, quelle est l'expression correcte de sa vitesse $v$ ?
    type: mcq
    choices:
      - id: A
        text: "$v = \\sqrt{\\dfrac{k e^2}{m_e r}}$"
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.formule-orbite-non-adaptee-Z
        feedback: >
          Cette expression oublie le facteur $3$ dû à la charge $+3e$ du
          noyau : elle correspond au calcul de l'hydrogène (charge $+e$),
          pas à celui de $\text{Li}^{2+}$.
      - id: B
        text: "$v = \\sqrt{\\dfrac{3 k e^2}{m_e r}}$"
        correct: true
      - id: C
        text: "$v = \\sqrt{\\dfrac{9 k e^2}{m_e r}}$"
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.formule-orbite-non-adaptee-Z
        feedback: >
          Cette expression utilise $Z^2 = 9$ au lieu de $Z = 3$ : seule la
          charge du noyau ($+3e$) intervient linéairement dans la force de
          Coulomb ($F_C = k \times 3e \times e / r^2$), pas son carré.
      - id: D
        text: "$v = 3\\sqrt{\\dfrac{k e^2}{m_e r}}$"
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.formule-orbite-non-adaptee-Z
        feedback: >
          Le facteur $3$, issu de la charge du noyau, doit rester SOUS la
          racine carrée (car il multiplie $v^2$, pas $v$) : le sortir de la
          racine comme ici revient à multiplier $v$ par $3$ au lieu de
          $\sqrt{3}$.
    correct_feedback: >
      Le noyau porte la charge $+3e$, donc $F_C = k\dfrac{3e \times
      e}{r^2} = \dfrac{3ke^2}{r^2}$. En l'égalant à $m_e v^2 / r$
      (deuxième loi de Newton, mouvement circulaire uniforme) : $v^2 =
      \dfrac{3ke^2}{m_e r}$, donc $v = \sqrt{\dfrac{3ke^2}{m_e r}}$ —
      exactement la méthode du chapitre 3, avec le facteur $3$ introduit par la
      charge du noyau.
    solution: |
      $$F_C = k\frac{\lvert (+3e)(-e)\rvert}{r^2} = \frac{3ke^2}{r^2}$$

      Deuxième loi de Newton, projetée sur la direction normale :
      $$\frac{3ke^2}{r^2} = m_e \frac{v^2}{r} \Longrightarrow v^2 = \frac{3ke^2}{m_e r} \Longrightarrow v = \sqrt{\frac{3ke^2}{m_e r}}$$

      Même méthode qu'au chapitre 3 (hydrogène, $Z=1$) ou qu'à l'exercice de type
      bac ($\text{He}^+$, $Z=2$) : seul le facteur devant $ke^2$ change,
      selon la charge $+Ze$ du noyau.

  - id: AMN-17
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [force_gravitationnelle, ordre_de_grandeur, application_bac]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
    stem: >
      Pour le même ion $\text{Li}^{2+}$ (noyau de charge $+3e$), un élève
      affirme qu'il faudrait ajouter la force gravitationnelle à la force de
      Coulomb dans le calcul de $v$, sinon le résultat serait inexact. Cette
      affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui : une charge de noyau plus élevée ($+3e$ au lieu de $+e$)
          renforce l'effet de la gravitation, qu'il faut alors prendre en
          compte.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          La charge du noyau intervient dans la force de Coulomb, pas dans
          la force gravitationnelle, qui ne dépend que des masses.
          Augmenter $Z$ ne change rien à l'intensité de la gravitation entre
          l'électron et le noyau.
      - id: B
        text: >-
          Oui, car pour un ion nettement plus lourd que l'hydrogène, la masse du noyau
          devient comparable à celle de l'électron, ce qui rend la gravitation non
          négligeable dans le bilan des forces.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: >
          Même pour un noyau plus lourd, celui-ci reste des milliers de fois
          plus massif que l'électron, jamais comparable. Et surtout, le
          rapport $F_C/F_G$ reste de l'ordre de $10^{39}$ quel que soit
          l'élément considéré : la gravitation demeure totalement
          négligeable.
      - id: C
        text: >-
          Non : le rapport $F_C/F_G$ reste de l'ordre de $10^{39}$ à cette
          échelle, indépendamment de $r$ et pratiquement indépendamment de
          la charge du noyau ; la gravitation reste donc totalement
          négligeable devant la force de Coulomb.
        correct: true
      - id: D
        text: >-
          Non, mais uniquement parce que le rayon $r$ choisi ici est trop
          petit pour que la gravitation ait un effet mesurable.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.rapport-forces-dependrait-de-r
        feedback: >
          Le rapport $F_C/F_G$ ne dépend pas de $r$ : les deux forces
          varient en $1/r^2$, donc ce facteur se simplifie exactement dans
          le rapport. La gravitation est négligeable à n'importe quelle
          distance atomique, pas seulement pour ce $r$ particulier.
    correct_feedback: >
      Comme établi au chapitre 2 pour l'hydrogène, le rapport $F_C/F_G$ reste, à un
      facteur $Z$ près, de l'ordre de $10^{39}$ : un écart si énorme que
      même en changeant d'élément ou de rayon, la conclusion ne change
      pas — la gravitation est toujours totalement négligeable à l'échelle
      atomique.
    solution: |
      Comme au chapitre 2, le facteur $1/r^2$ se simplifie exactement dans le
      rapport $F_C/F_G$, qui ne dépend donc ni de $r$ ni, de façon
      significative, du numéro atomique $Z$ (facteur au plus quelques
      unités face à un écart de $10^{39}$). L'affirmation de l'élève
      confond « il existe une force gravitationnelle non nulle » avec « elle
      est assez grande pour compter » — c'est le même piège qu'au chapitre 2.

  - id: AMN-18
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_atome_mecanique_newton
    tags: [relation_planck, application_numerique, delta_E_h_nu]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
    stem: >
      Un atome émet un photon lorsqu'il passe d'un niveau d'énergie à un
      autre, avec une différence d'énergie $\Delta E = 3{,}0 \times
      10^{-19}\ \text{J}$. On donne $h \approx 6{,}63 \times
      10^{-34}\ \text{J·s}$. Quelle est la fréquence $\nu$ de la lumière
      émise ?
    type: mcq
    choices:
      - id: A
        text: "$\\nu = \\Delta E \\times h \\approx 2{,}0 \\times 10^{-52}\\ \\text{Hz}$"
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: >
          Cette expression inverse la relation $\Delta E = h\nu$ : il faut
          DIVISER $\Delta E$ par $h$ pour obtenir $\nu$, pas les multiplier.
      - id: B
        text: "$\\nu = \\dfrac{h}{\\Delta E} \\approx 2{,}2 \\times 10^{-15}\\ \\text{Hz}$"
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: >
          C'est la fraction inversée : à partir de $\Delta E = h\nu$, on
          isole $\nu$ en divisant $\Delta E$ par $h$ ($\nu = \Delta E / h$),
          pas $h$ par $\Delta E$.
      - id: C
        text: "$\\nu \\approx 4{,}5 \\times 10^{-14}\\ \\text{Hz}$"
        correct: false
        misconception: null
        feedback: >
          La méthode ($\nu = \Delta E / h$) est correcte, mais l'exposant
          est faux. Le calcul complet : $(3{,}0/6{,}63)	imes10^{-19-(-34)} =
             0{,}45	imes10^{15} = 4{,}5	imes10^{14}$ Hz — l'exposant final
             est $+14$, pas $-14$.
      - id: D
        text: "$\\nu = \\dfrac{\\Delta E}{h} \\approx 4{,}5 \\times 10^{14}\\ \\text{Hz}$"
        correct: true
    correct_feedback: >
      À partir de $\Delta E = h\nu$, on isole $\nu = \dfrac{\Delta E}{h} =
      \dfrac{3{,}0\times10^{-19}}{6{,}63\times10^{-34}} \approx
      4{,}5\times10^{14}\ \text{Hz}$ — une fréquence typique du domaine
      visible/proche infrarouge.
    solution: |
      $$\nu = \frac{\Delta E}{h} = \frac{3{,}0 \times 10^{-19}}{6{,}63 \times 10^{-34}} \approx 4{,}5 \times 10^{14}\ \text{Hz}$$

      Attention à la soustraction des exposants négatifs :
      $10^{-19}/10^{-34} = 10^{-19-(-34)} = 10^{15}$, pas $10^{-14}$ — une
      erreur de signe fréquente à surveiller.

