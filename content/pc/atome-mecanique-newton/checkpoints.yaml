checkpoints:

  # ════════════════════════════════════════════════════════════════
  # CP-0  |  id: cp-r0-predict  |  placed IN R0 (the hook's commit)
  #        Probes: calcul-mecanique-suffit-a-expliquer-stabilite — the
  #        central trap the whole chapter dismantles. NOT a clone of any
  #        end-bank item (item_source: original).
  # ════════════════════════════════════════════════════════════════

  - id: cp-r0-predict
    rung: "R0"
    habilete: utilisation
    skill_code: pc_atome_mecanique_newton
    tags: [checkpoint, formative, misconception_driven, pc_atome_mecanique_newton, hook_commit]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
    item_source: original
    lesson_placement: in_R0

    stem: |
      Le modèle planétaire de l'atome — un électron en mouvement circulaire
      uniforme, retenu par la force de Coulomb — traité avec les seules lois
      de la mécanique que tu connais.
      **Prédit-il un atome stable pour toujours ?** Engage-toi — c'est ta
      prédiction, avant de lire la suite.

    type: mcq

    choices:
      - id: A
        text: >-
          Non : dès la seule mécanique de Newton, on voit que l'électron va
          s'effondrer presque immédiatement sur le noyau.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-incomplet-confondu-avec-calcul-faux
        feedback: |
          C'est l'inverse : la mécanique de Newton SEULE, appliquée à ce
          modèle, donne une orbite parfaitement stable — tu vas le calculer
          toi-même dans ce chapitre (R2), et rien dans ce calcul ne force le
          rayon à changer. L'effondrement ne vient pas de la mécanique : il
          vient d'un ingrédient extérieur (l'électromagnétisme), qui
          n'intervient qu'en R3.

      - id: B
        text: >-
          Oui : la mécanique de Newton prédit une orbite stable — mais ce
          n'est pas le dernier mot du chapitre.
        correct: true
        feedback: |
          Exact — et c'est la prudence qui compte ici : la mécanique seule
          donne bien une orbite stable, calculable précisément (ce sera fait
          en R2). Mais un ingrédient qui n'appartient pas à la mécanique va
          s'inviter dans l'histoire (R3) et remettre cette conclusion en
          question. Garde cette prudence — c'est exactement ce que le
          chapitre va construire.

      - id: C
        text: >-
          Oui, et c'est là toute l'histoire : une orbite mécaniquement
          stable explique complètement pourquoi la matière ne s'effondre
          pas.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: |
          Modèle détecté : « le calcul mécanique suffit. » C'est précisément
          le piège de ce chapitre. Le calcul de R2 est correct, mais un
          résultat de l'électromagnétisme (une charge accélérée rayonne de
          l'énergie) va montrer, en R3, que cette orbite ne peut pas rester
          stable indéfiniment. La mécanique seule ne suffit pas.

      - id: D
        text: >-
          On ne peut rien prédire : les lois de la mécanique de Newton ne
          s'appliquent pas à une particule aussi petite qu'un électron.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mecanique-jugee-inapplicable-aux-charges
        feedback: |
          La deuxième loi de Newton s'applique à toute particule soumise à
          une force, quelle que soit son origine ou la taille de la
          particule. Ce chapitre l'applique justement à l'électron avec la
          force de Coulomb (R2), et obtient un résultat parfaitement défini.

  # ════════════════════════════════════════════════════════════════
  # CP-1  |  id: cp-r1-gravitation  |  placed AFTER R1
  #        Probes: gravitation-consideree-significative
  #        Source: CLONE of AMN-2 (items.yaml)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r1-gravitation
    rung: "R1"
    habilete: utilisation
    skill_code: pc_atome_mecanique_newton
    tags: [checkpoint, formative, misconception_driven, pc_atome_mecanique_newton]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
    item_source: clone_of_AMN-2
    lesson_placement: after_R1

    stem: |
      On donne $G \approx 6{,}67 \times 10^{-11}\ \text{N}\cdot\text{m}^2\cdot\text{kg}^{-2}$,
      $k \approx 9{,}0 \times 10^{9}\ \text{N}\cdot\text{m}^2\cdot\text{C}^{-2}$,
      $m_e \approx 9{,}1 \times 10^{-31}\ \text{kg}$,
      $m_p \approx 1{,}67 \times 10^{-27}\ \text{kg}$,
      $e \approx 1{,}6 \times 10^{-19}\ \text{C}$. Que peut-on dire des ordres
      de grandeur de $F_C$ (force de Coulomb) et $F_G$ (force gravitationnelle)
      entre un électron et un proton, à une distance $r$ quelconque ?

    type: mcq

    choices:
      - id: A
        text: "$F_C$ est environ $10^{39}$ fois plus grande que $F_G$, quelle que soit la valeur de $r$."
        correct: true
        feedback: |
          Exact. $\dfrac{F_C}{F_G} = \dfrac{k e^2}{G\,m_e m_p} \approx 2{,}3
          \times 10^{39}$ — un facteur qui ne dépend pas de $r$, puisque les
          deux forces varient de la même façon en $1/r^2$ (ce facteur se
          simplifie exactement dans le rapport).

      - id: B
        text: "$F_C$ et $F_G$ sont du même ordre de grandeur, car les deux forces varient en $1/r^2$."
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: |
          Modèle détecté : « même dépendance en $r$ ⇒ même intensité. »
          Varier de la même façon avec $r$ ne veut pas dire avoir la même
          valeur : ce sont les constantes ($k$ et $G$) et les grandeurs
          multipliées (charges contre masses) qui fixent l'intensité de
          chaque force, et elles sont radicalement différentes ici.

      - id: C
        text: "$F_G$ est plus grande que $F_C$, car la masse du proton est très supérieure à celle de l'électron."
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.gravitation-consideree-significative
        feedback: |
          Modèle détecté : la présence d'une masse plus grande ne rend pas
          la gravitation dominante. Le rapport des masses ($m_p/m_e \approx
          1836$) reste bien plus petit que l'écart entre les deux forces
          (facteur $10^{39}$). C'est l'inverse : $F_C$ domine très largement
          $F_G$.

      - id: D
        text: >-
          On ne peut pas comparer les deux forces sans connaître la valeur
          précise de $r$.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.rapport-forces-dependrait-de-r
        feedback: |
          Modèle détecté : « le rapport dépend de $r$. » Le rapport $F_C/F_G$
          ne dépend pas de $r$ : les deux forces contiennent le même facteur
          $1/r^2$, qui se simplifie exactement dans le rapport. Le résultat
          ($\approx 10^{39}$) est valable à n'importe quelle distance.

  # ════════════════════════════════════════════════════════════════
  # CP-2  |  id: cp-r2-mcu  |  placed AFTER R2
  #        Probes: mcu-implique-acceleration-nulle
  #        Source: CLONE of AMN-3 (items.yaml)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r2-mcu
    rung: "R2"
    habilete: utilisation
    skill_code: pc_atome_mecanique_newton
    tags: [checkpoint, formative, misconception_driven, pc_atome_mecanique_newton]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
    item_source: clone_of_AMN-3
    lesson_placement: after_R2

    stem: |
      Dans le modèle planétaire, l'électron effectue un mouvement circulaire
      uniforme autour du noyau. Que peut-on dire de son vecteur accélération
      $\vec{a}_G$ ?

    type: mcq

    choices:
      - id: A
        text: >-
          $\vec{a}_G \neq \vec{0}$ : elle est purement normale (centripète),
          de norme $v^2/r$, car la direction de $\vec{v}_G$ change à chaque
          instant même si sa norme reste constante.
        correct: true
        feedback: |
          Exact. « Uniforme » ne porte que sur la norme de la vitesse. La
          direction de $\vec{v}_G$ tourne en permanence, donc l'accélération
          est non nulle — purement centripète, $a_N = v^2/r$, dirigée vers
          le noyau. C'est cette accélération que la deuxième loi de Newton
          relie à la force de Coulomb.

      - id: B
        text: >-
          $\vec{a}_G = \vec{0}$, car le mouvement est uniforme et circulaire :
          la vitesse angulaire est constante, la vitesse linéaire est
          constante, donc rien ne varie et l'accélération doit être nulle.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.mcu-implique-acceleration-nulle
        feedback: |
          Modèle détecté : « uniforme ⇒ accélération nulle. » « Uniforme »
          ne veut dire que la NORME de la vitesse reste constante — pas que
          le vecteur vitesse lui-même reste constant. Sa direction change à
          chaque instant puisque l'électron tourne, ce qui suffit à produire
          une accélération non nulle.

      - id: C
        text: >-
          $\vec{a}_G \neq \vec{0}$, mais elle est purement tangentielle,
          dans le sens du mouvement.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.confond-composante-tangentielle-et-normale
        feedback: |
          Modèle détecté : composante tangentielle et normale inversées.
          C'est l'inverse : puisque le mouvement est uniforme (norme de $v$
          constante), la composante TANGENTIELLE de l'accélération est
          nulle. La composante non nulle est la composante NORMALE
          (centripète), liée au changement de direction, pas de norme.

      - id: D
        text: >-
          $\vec{a}_G$ change de norme à chaque instant, en plus de changer de
          direction.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.norme-acceleration-mcu-non-constante
        feedback: |
          Modèle détecté : norme de l'accélération jugée variable en MCU. La
          norme de $\vec{a}_G$ vaut $v^2/r$ : puisque $v$ et $r$ sont
          constants dans ce mouvement circulaire uniforme, la norme de
          l'accélération est elle aussi constante. Seule sa direction tourne
          avec l'électron, pas sa norme.

  # ════════════════════════════════════════════════════════════════
  # CP-3  |  id: cp-r3-limites  |  placed AFTER R3
  #        Probes: calcul-mecanique-suffit-a-expliquer-stabilite
  #        Source: CLONE of AMN-5 (items.yaml)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r3-limites
    rung: "R3"
    habilete: resolution
    skill_code: pc_atome_mecanique_newton
    tags: [checkpoint, formative, misconception_driven, pc_atome_mecanique_newton]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
    item_source: clone_of_AMN-5
    lesson_placement: after_R3

    stem: |
      Que prédit la mécanique de Newton, complétée par l'électromagnétisme
      classique, pour un électron en mouvement circulaire autour du noyau
      dans le modèle planétaire ?

    type: mcq

    choices:
      - id: A
        text: >-
          L'électron, charge en accélération permanente, devrait rayonner de
          l'énergie électromagnétique en continu et s'effondrer sur le
          noyau en un temps extrêmement court.
        correct: true
        feedback: |
          Exact. Une charge accélérée rayonne de l'énergie (résultat de
          l'électromagnétisme). L'électron, en accélération centripète
          permanente, devrait donc perdre de l'énergie en continu et
          s'effondrer sur le noyau presque instantanément — en contradiction
          frontale avec la stabilité observée de la matière.

      - id: B
        text: >-
          L'électron reste indéfiniment sur son orbite, exactement comme une
          planète autour du Soleil : la mécanique de Newton et la loi de
          Coulomb suffisent à elles seules à expliquer une orbite stable,
          sans aucune perte d'énergie ni effondrement.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: |
          Modèle détecté : « le calcul mécanique de R2 suffit. » C'est ce
          que prédit la mécanique SEULE, mais ce n'est pas la prédiction
          complète. Une charge en accélération (comme l'électron en orbite)
          rayonne de l'énergie d'après l'électromagnétisme : elle ne peut
          donc pas rester indéfiniment sur une orbite à rayon constant.

      - id: C
        text: >-
          L'électron s'échapperait du noyau, car la force de Coulomb
          diminue avec le temps.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.confond-cause-et-consequence-effondrement
        feedback: |
          Modèle détecté : cause et conséquence inversées. La force de
          Coulomb ne dépend que de la distance $r$, pas du temps
          directement : elle ne « diminue » pas toute seule. C'est la perte
          d'énergie par rayonnement qui fait diminuer $r$ (donc AUGMENTER la
          force), pas l'inverse — et le mouvement résultant est un
          rapprochement, pas une fuite.

      - id: D
        text: >-
          La mécanique de Newton prédit directement la quantification des
          niveaux d'énergie observée expérimentalement.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.calcul-mecanique-suffit-a-expliquer-stabilite
        feedback: |
          Modèle détecté : la mécanique créditée de plus qu'elle ne fait.
          C'est l'inverse : rien dans la deuxième loi de Newton ni dans la
          force de Coulomb ne prédit une quantification. Ces lois
          autoriseraient un continuum d'orbites et d'énergies — c'est
          précisément leur limite, pas une réussite supplémentaire.

  # ════════════════════════════════════════════════════════════════
  # CP-4  |  id: cp-r4-planck  |  placed AFTER R4
  #        Probes: relation-planck-mal-manipulee
  #        Source: CLONE of AMN-14 (items.yaml)
  # ════════════════════════════════════════════════════════════════

  - id: cp-r4-planck
    rung: "R4"
    habilete: utilisation
    skill_code: pc_atome_mecanique_newton
    tags: [checkpoint, formative, misconception_driven, pc_atome_mecanique_newton]
    primary_misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
    item_source: clone_of_AMN-14
    lesson_placement: after_R4

    stem: |
      Un atome passe d'un niveau d'énergie à un autre en émettant un photon
      de fréquence $\nu$. Quelle relation relie correctement la différence
      d'énergie $\Delta E$ entre les deux niveaux à cette fréquence, avec
      $h$ la constante de Planck ?

    type: mcq

    choices:
      - id: A
        text: >-
          $\Delta E = \dfrac{h}{\nu}$, car une fréquence plus grande
          correspond à une énergie échangée plus faible.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: |
          Modèle détecté : relation inversée. C'est l'inverse : plus la
          fréquence est grande, plus le photon transporte d'énergie. La
          relation correcte est une proportionnalité DIRECTE entre $\Delta
          E$ et $\nu$, pas un rapport inversé.

      - id: B
        text: >-
          $\Delta E = h\,\nu^2$, par analogie avec l'énergie cinétique qui
          varie en $v^2$.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: |
          Modèle détecté : analogie importée à tort. Cette analogie avec
          l'énergie cinétique ne s'applique pas ici : la relation de Planck
          est linéaire en fréquence, pas quadratique. Il n'y a pas de
          $\nu^2$ dans $\Delta E = h\nu$.

      - id: C
        text: >-
          $\Delta E = h + \nu$, la constante de Planck s'ajoutant à la
          fréquence.
        correct: false
        misconception: mc.physics.pc_atome_mecanique_newton.relation-planck-mal-manipulee
        feedback: |
          Modèle détecté : produit confondu avec une somme. $h$ et $\nu$
          n'ont pas la même unité (J·s pour $h$, Hz pour $\nu$) : on ne peut
          pas les additionner. La relation correcte est un produit, $\Delta
          E = h\nu$, pas une somme.

      - id: D
        text: "$\\Delta E = h\\,\\nu$, où $h$ est la constante de Planck."
        correct: true
        feedback: |
          Exact. La relation de Planck-Einstein, $\Delta E = h\nu$, relie
          directement (par un produit, pas une somme ni un rapport) la
          différence d'énergie entre deux niveaux à la fréquence de la
          lumière échangée.

