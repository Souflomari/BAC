<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Comparaison d'un spectre continu (toutes les longueurs d'onde, représentées par de nombreuses bandes fines adjacentes) et d'un spectre de raies (seulement quatre longueurs d'onde discrètes : 410, 434, 486 et 656 nanomètres, les raies de la série de Balmer de l'hydrogène), sur un axe commun de longueur d'onde en nanomètres.">
  <title>Spectre continu et spectre de raies</title>
  <!--
    spectre-raies.svg — figure STATIQUE, contraste continu / discret.

    Pourquoi cette figure : la leçon (R4) affirme explicitement que la
    quantification de l'énergie de l'atome "explique que les atomes
    émettent ou absorbent la lumière à des fréquences bien précises,
    formant des raies dans un spectre, plutôt qu'une lumière de toutes les
    couleurs mélangées." Cette figure rend cette phrase concrète.

    COMPROMIS ASSUMÉ (à signaler) : la leçon ne donne aucune longueur
    d'onde numérique. Les 4 raies dessinées sont les 4 raies visibles
    réelles de la série de Balmer de l'atome d'hydrogène (Hα, Hβ, Hγ, Hδ)
    — le même atome que celui du diagramme niveaux-energie.svg — choisies
    pour donner un ancrage numérique réel plutôt qu'un simple schéma
    "quelques traits au hasard".

    CONTRAINTE "pas de dégradé de couleur, tokens seulement" : la bande du
    haut n'utilise NI <linearGradient> NI variation de teinte. L'impression
    de continuité est produite par de nombreux rectangles fins ADJACENTS
    (53 bandes de 10px), dont le remplissage alterne seulement entre les
    deux tokens neutres --figure-ink-soft et --figure-grid à des opacités
    variées (un motif répétitif de période 4, pas un dégradé) : "beaucoup
    de tons adjacents" plutôt qu'un camaïeu continu.

    Géométrie (calculée) :
      échelle commune aux deux bandes : x = 80 + (λ - 380) × (530/320)
        (plage visible 380-700 nm mappée sur x = 80..610 ; 530/320 = 1,65625 px/nm)
      Vérification des 4 raies (série de Balmer, hydrogène) :
        Hδ  λ = 410 nm → x = 80 + 30×1,65625  ≈ 129,7
        Hγ  λ = 434 nm → x = 80 + 54×1,65625  ≈ 169,4
        Hβ  λ = 486 nm → x = 80 + 106×1,65625 ≈ 255,6
        Hα  λ = 656 nm → x = 80 + 276×1,65625 ≈ 537,1

    Rôle des couleurs :
      bande continue (53 rectangles fins) : --figure-ink-soft / --figure-grid
        en alternance (chrome neutre — AUCUNE des deux n'est le focus ; la
        variation sert seulement l'impression visuelle de "toutes les
        fréquences", pas une donnée à lire)
      cadre des deux bandes, axe λ, libellés génériques : --figure-ink-soft
      libellés "spectre continu" / "spectre de raies" : --figure-ink
      LES 4 RAIES (barres, guides, ticks, valeurs nm) : --figure-accent —
        LE point focal unique de la figure : ce sont les seules longueurs
        d'onde permises par la quantification.
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Spectre continu et spectre de raies (atome d'hydrogène)
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="330" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       Bande 1 — spectre continu : 53 rectangles fins adjacents,
       alternance ink-soft/grid (motif de période 4), PAS un dégradé.
       ══════════════════════════════════════════════════════ -->
  <text x="76" y="119" text-anchor="end" font-size="10.5" fill="var(--figure-ink)">spectre continu</text>

  <rect x="80" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="90" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="100" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="110" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="120" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="130" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="140" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="150" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="160" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="170" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="180" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="190" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="200" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="210" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="220" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="230" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="240" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="250" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="260" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="270" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="280" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="290" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="300" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="310" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="320" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="330" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="340" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="350" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="360" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="370" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="380" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="390" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="400" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="410" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="420" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="430" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="440" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="450" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="460" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="470" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="480" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="490" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="500" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="510" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="520" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="530" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="540" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="550" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="560" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>
  <rect x="570" y="90" width="10" height="50" fill="var(--figure-grid)"/>
  <rect x="580" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.5"/>
  <rect x="590" y="90" width="10" height="50" fill="var(--figure-grid)" fill-opacity="0.7"/>
  <rect x="600" y="90" width="10" height="50" fill="var(--figure-ink-soft)" fill-opacity="0.85"/>

  <!-- Cadre de la bande continue, dessiné par-dessus, fill none -->
  <rect x="80" y="90" width="530" height="50" fill="none" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       Bande 2 — spectre de raies : fond presque vide + 4 raies accent
       ══════════════════════════════════════════════════════ -->
  <text x="76" y="209" text-anchor="end" font-size="10.5" fill="var(--figure-ink)">spectre de raies</text>

  <rect x="80" y="180" width="530" height="50" fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Hδ 410 nm -->
  <rect x="128.2" y="180" width="3" height="50" fill="var(--figure-accent)"/>
  <line x1="129.7" y1="230" x2="129.7" y2="280" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="129.7" y1="277" x2="129.7" y2="283" stroke="var(--figure-accent)" stroke-width="1.6"/>
  <text x="129.7" y="295" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">410</text>

  <!-- Hγ 434 nm -->
  <rect x="167.9" y="180" width="3" height="50" fill="var(--figure-accent)"/>
  <line x1="169.4" y1="230" x2="169.4" y2="280" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="169.4" y1="277" x2="169.4" y2="283" stroke="var(--figure-accent)" stroke-width="1.6"/>
  <text x="169.4" y="295" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">434</text>

  <!-- Hβ 486 nm -->
  <rect x="254.1" y="180" width="3" height="50" fill="var(--figure-accent)"/>
  <line x1="255.6" y1="230" x2="255.6" y2="280" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="255.6" y1="277" x2="255.6" y2="283" stroke="var(--figure-accent)" stroke-width="1.6"/>
  <text x="255.6" y="295" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">486</text>

  <!-- Hα 656 nm -->
  <rect x="535.6" y="180" width="3" height="50" fill="var(--figure-accent)"/>
  <line x1="537.1" y1="230" x2="537.1" y2="280" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="537.1" y1="277" x2="537.1" y2="283" stroke="var(--figure-accent)" stroke-width="1.6"/>
  <text x="537.1" y="295" text-anchor="middle" font-size="9.5" fill="var(--figure-accent)">656</text>

  <!-- Axe commun λ (nm) — ink-soft, chrome neutre -->
  <line x1="80" y1="280" x2="610" y2="280" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="610,280 598,275.5 598,284.5" fill="var(--figure-ink-soft)"/>
  <text x="617" y="284" font-size="11" fill="var(--figure-ink-soft)">
    <tspan font-style="italic">λ</tspan><tspan> (nm)</tspan>
  </text>

  <!-- Captions -->
  <text x="335" y="380" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">En haut : spectre continu (toutes les longueurs d'onde). En bas : spectre de raies (quelques-unes, précises).</text>
  <text x="335" y="394" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">Les 4 raies sont celles de l'hydrogène (série de Balmer) — le même atome qu'au diagramme des niveaux.</text>

</svg>
