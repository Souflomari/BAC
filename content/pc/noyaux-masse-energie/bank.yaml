  - id: bk-2020-n-x1
    title: "Désintégration du polonium 210 : équation, énergie libérée et défaut de masse"
    source:
      year: 2020
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice III — volet masse-énergie (désintégration du polonium 210)"
    bareme_total: 1.5
    duration_min: 9
    sourcing:
