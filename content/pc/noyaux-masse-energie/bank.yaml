    intro: |-
      **Physique nucléaire — énergie de liaison de l'Uranium 238 (examen national, session normale 2012, 1 point sur les 3 de l'exercice).**

      *Les questions 1-1, 1-2, 2-1 et 2-2 de cet exercice — les lois de conservation de l'équation bilan et la datation d'une roche métallique par le rapport Uranium-Plomb — sont traitées à part, sous la notion « Décroissance radioactive » (entrée bk-2012-n-x3). La question ci-dessous n'en dépend pas : tout ce dont elle a besoin est rappelé ici.*

      Le nucléide Uranium 238 $\left(^{238}_{92}\text{U}\right)$ est radioactif : il se transforme en nucléide de Plomb 206 par une succession d'émissions de type $\alpha$ et $\beta^-$.

      **Données :**
      - Masse du noyau d'Uranium 238 : $238{,}00031\ \text{u}$ ;
      - Masse du proton : $1{,}00728\ \text{u}$ ;
      - Masse du neutron : $1{,}00866\ \text{u}$ ;
      - L'unité de masse atomique : $1\ \text{u} = 931{,}5\ \text{MeV.c}^{-2}$ ;
      - Énergie de liaison par nucléon du Plomb 206 : $\mathcal{E}(Pb) = 7{,}87\ \text{MeV/nucléon}$.

      *Aucune figure n'accompagne cet exercice : toutes les données sont dans le texte.*
    questions:
      - id: q1
        stem: |-
          **1-3-** (1 pt) Calculer l'énergie de liaison par nucléon de l'Uranium 238, et vérifier que le noyau $^{206}_{82}\text{Pb}$ est plus stable que le noyau $^{238}_{92}\text{U}$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste : on ne connaît, pour l'Uranium 238, ni son énergie de liaison ni son énergie de liaison par nucléon directement — seulement la masse du noyau assemblé et celles des nucléons séparés. C'est exactement la donnée dont dépend le défaut de masse $\Delta m$, donc $E_l$ (R2) : on calcule $\Delta m$ d'abord, jamais $E_l$ directement, pour contrôler chaque arrondi avant de multiplier par $931{,}5$.

          La composition du noyau — $Z=92$ protons et $N=146$ neutrons — a été établie à la question 1-2 (sous la notion « Décroissance radioactive »).

          $$\Delta m = Z\,m_p + N\,m_n - m(^{238}_{92}\text{U})$$

          $$\Delta m = 92\times1{,}00728 + 146\times1{,}00866 - 238{,}00031$$

          $$\Delta m = 239{,}93412 - 238{,}00031 = 1{,}93381\ \text{u}$$

          On convertit en énergie avec le facteur donné par l'énoncé :

          $$E_l(U) = 1{,}93381\times931{,}5 \approx 1801{,}3\ \text{MeV}$$

          $E_l$ seule ne compare rien entre deux noyaux de tailles différentes (R3) : $A(U) = 238$ et $A(Pb) = 206$ ne sont pas égaux, donc comparer $1801{,}3$ à une énergie de liaison totale du Plomb, qu'on n'a même pas ici, ne dirait rien. C'est l'énergie de liaison **par nucléon** qui compare honnêtement :

          $$\frac{E_l}{A}(U) = \frac{1801{,}3}{238} \approx 7{,}57\ \text{MeV/nucléon}$$

          On compare directement à la donnée fournie par l'énoncé pour le Plomb 206, $\mathcal{E}(Pb) = 7{,}87\ \text{MeV/nucléon}$ — déjà l'énergie de liaison par nucléon, pas besoin de la recalculer :

          $$7{,}87 > 7{,}57$$

          Plus $E_l/A$ est grand, plus le noyau est stable (R3) : le Plomb 206 est donc bien plus stable que l'Uranium 238 — cohérent avec le fait que l'Uranium 238 est justement le noyau père qui se désintègre spontanément vers lui.
        steps:
          - math: '\Delta m = 92\,m_p + 146\,m_n - m(^{238}_{92}\text{U})'
            note: "Z=92 protons et N=146 neutrons, etablis a la question 1-2 (defaut de masse, R2)."
          - math: '92\times1{,}00728 + 146\times1{,}00866 = 92{,}66976 + 147{,}26436 = 239{,}93412\ \text{u}'
            note: "Masse des nucleons SEPARES."
          - math: '\Delta m = 239{,}93412 - 238{,}00031 = 1{,}93381\ \text{u}'
            note: "Toujours positif : le noyau assemble est plus leger que ses morceaux."
          - math: 'E_l(U) = 1{,}93381\times931{,}5 \approx 1801{,}3\ \text{MeV}'
            note: "1 u vaut 931,5 MeV.c-2 (donnee de l'enonce) : simple multiplication."
          - math: '\frac{E_l}{A}(U) = \frac{1801{,}3}{238} \approx \boxed{7{,}57\ \text{MeV/nucleon}}'
            note: "Energie de liaison PAR NUCLEON (R3), seule grandeur qui compare deux noyaux de A differents."
          - math: '7{,}87 > 7{,}57 \implies \boxed{\text{Pb-206 plus stable que U-238}}'
            note: "Comparaison a la donnee de l'enonce pour le Plomb 206 ; plus El/A est grand, plus le noyau est stable (R3)."
