  # mobilisee au-dela de ce que la lecon derive pas a pas.
  - id: bk-2023-n-x1
    title: "Fusion du deutérium et du tritium : énergie de liaison, stabilité comparée et énergie libérée"
    source:
      year: 2023
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 2 — §2 : Réaction de fusion du tritium et du deutérium"
    bareme_total: 1.0
    duration_min: 6
    sourcing:
      status: sourced
      note: >-
        2023 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, https://www.alloschool.com/element/142476
        (Exercice 2, §2 — réaction de fusion du tritium et du deutérium ;
        barème du §2 = 1,0 pt sur les 2,5 pt de l'exercice complet, dont le
        §1 — désintégration β⁻ du tritium, demi-vie, activité — relève de
        decroissance-radioactive, qui partage le même tableau des énergies de
        liaison). Transcription vérifiée en une passe de vérification
        adversariale indépendante (agent-vérificateur-adversarial,
        2026-08-07), diff caractère par caractère OK, y compris la coquille
        du scan « … pour le dissocier en ces nucléons … » (pour « ses »),
        reproduite ici telle quelle (docs/sujets/pc/noyaux-masse-energie.md,
        statut « vérifié »). Physique re-dérivée indépendamment et
        cohérente : $E_{lib} = E_\ell(^4\text{He}) -
        [E_\ell(^2\text{H})+E_\ell(^3\text{H})] = 28{,}296-(2{,}366+8{,}475)
        = 17{,}455\ \text{MeV}$, la valeur canonique de la fusion D-T
        ($\simeq 17{,}6$ MeV) ; a- vrai (définition même de l'énergie de
        liaison) ; b- vrai ($E_\ell/A$ : $2{,}83$ MeV/nucléon pour le tritium
        contre $1{,}18$ pour le deutérium).
    intro: |-
      **Réaction de fusion du tritium et du deutérium (examen national, session normale 2023, Exercice 2 — §2).**

      La réaction de fusion entre un noyau de deutérium et un noyau de tritium conduit à la formation d'un noyau d'hélium $^{4}_{2}\text{He}$ et s'accompagne de l'émission d'un neutron.

      **Données — énergies de liaison de quelques noyaux (tableau partagé avec le §1 de l'exercice) :**

      | Noyau | $^{2}_{1}\text{H}$ | $^{3}_{1}\text{H}$ | $^{4}_{2}\text{He}$ |
      |---|:---:|:---:|:---:|
      | $E_\ell\ (\text{MeV})$ | $2{,}366$ | $8{,}475$ | $28{,}296$ |

      *(Aucune figure dans ce §2 ; énoncé textuel.)*
    questions:
      - id: q1a
        part: "2- Réaction de fusion du tritium et du deutérium : vrai ou faux justifiés"
        stem: |-
          **(0,25 pt)** **2-1.** Pour chaque affirmation suivante, répondre par vrai ou faux en justifiant. **a-** L'énergie qu'il faut fournir à un noyau de tritium au repos pour le dissocier en ces nucléons au repos est de $8{,}475\ \text{MeV}$.
        reasoning: |-
          C'est très exactement la définition du R2 : l'énergie de liaison $E_l$ d'un noyau est l'énergie qu'il faut fournir depuis l'extérieur pour le dissocier complètement en ses nucléons séparés et immobiles — jamais une énergie que le noyau contiendrait et pourrait relâcher tout seul. Le tableau fourni par l'énoncé donne directement $E_\ell(^{3}_{1}\text{H}) = 8{,}475\ \text{MeV}$ : l'affirmation ne fait que reformuler cette valeur en mots. Elle est donc vraie, sans le moindre calcul supplémentaire.
        steps:
          - math: 'E_\ell(^{3}_{1}\text{H}) = 8{,}475\ \text{MeV}'
            note: "Valeur lue directement dans le tableau des energies de liaison fourni par l'enonce."
          - math: '\boxed{\text{Vrai}}'
            note: "L'affirmation reformule exactement la definition de l'energie de liaison (R2)."
      - id: q1b
        stem: |-
          **(0,25 pt)** **b-** Le tritium est plus stable que le deutérium.
        reasoning: |-
          $E_l$ seule ne compare rien entre deux noyaux de tailles différentes (R3) : le tritium a $3$ nucléons, le deutérium seulement $2$, donc comparer $8{,}475$ à $2{,}366$ directement ne dirait rien de leur stabilité relative — il faut diviser chacune par son propre $A$ pour obtenir l'énergie de liaison par nucléon, la seule grandeur qui compare honnêtement. Une fois cette division faite, le tritium l'emporte nettement sur le deutérium : l'affirmation est vraie.
        steps:
          - math: '\dfrac{E_\ell(^{3}_{1}\text{H})}{A} = \dfrac{8{,}475}{3} \approx 2{,}83\ \text{MeV/nucleon}'
            note: "Energie de liaison PAR NUCLEON du tritium (R3) ; A = 3."
          - math: '\dfrac{E_\ell(^{2}_{1}\text{H})}{A} = \dfrac{2{,}366}{2} \approx 1{,}18\ \text{MeV/nucleon}'
            note: "Energie de liaison par nucleon du deuterium ; A = 2."
          - math: '2{,}83 > 1{,}18'
            note: "Le tritium est mieux lie par nucleon que le deuterium."
          - math: '\boxed{\text{Vrai}}'
            note: "Plus E_l/A est grand, plus le noyau est stable (R3) : le tritium est plus stable que le deuterium."
      - id: q2
        stem: |-
          **(0,5 pt)** **2-2.** Calculer, en unité MeV, l'énergie libérée $E_{lib} = |\Delta E|$ par la réaction de fusion d'un noyau de tritium et d'un noyau de deutérium.
        reasoning: |-
          Au R4, on calcule l'énergie libérée par une réaction à partir de la variation de masse totale, $\Delta m = m_{\text{produits}} - m_{\text{réactifs}}$, puis $|E| = |\Delta m|\,c^2$ — exactement la réaction $^{2}_{1}\text{H} + \ ^{3}_{1}\text{H} \rightarrow\ ^{4}_{2}\text{He} + \ ^{1}_{0}\text{n}$ étudiée au R4 lui-même. Ici, l'énoncé ne donne pas les masses des noyaux mais leurs énergies de liaison : on passe par le pont $E_l = \Delta m\,c^2$ du R2, appliqué à chaque noyau plutôt qu'au bilan global — un neutron libre, non lié, n'a pas d'énergie de liaison. La masse de chaque noyau composé « manque » exactement de $E_l/c^2$ par rapport à ses nucléons séparés ; en sommant ce manque des deux côtés de la réaction, les nucléons eux-mêmes se compensent exactement (leur nombre total est conservé), et il ne reste que la différence des énergies de liaison. L'énergie libérée est donc simplement l'énergie de liaison du noyau formé, moins la somme des énergies de liaison des noyaux consommés — sans jamais reconvertir en masses.
        steps:
          - math: '^{2}_{1}\text{H} + \ ^{3}_{1}\text{H} \longrightarrow\ ^{4}_{2}\text{He} + \ ^{1}_{0}\text{n}'
            note: "Reaction de fusion (A et Z conserves : 2+3=4+1 ; 1+1=2+0) - la meme reaction qu'au R4."
          - math: 'E_{lib} = E_\ell(^{4}_{2}\text{He}) - \left[E_\ell(^{2}_{1}\text{H}) + E_\ell(^{3}_{1}\text{H})\right]'
            note: "Pont E_l -> Delta m (R2) applique aux deux membres de la reaction (R4) ; le neutron libre n'a pas d'energie de liaison."
          - math: 'E_{lib} = 28{,}296 - (2{,}366+8{,}475) = 28{,}296 - 10{,}841'
            note: "Lecture des trois energies de liaison dans le tableau fourni par l'enonce."
          - math: '\boxed{E_{lib} \approx 17{,}455\ \text{MeV}}'
            note: "Coherent avec la valeur canonique de la fusion D-T (environ 17,6 MeV, meme reaction qu'au R4)."
