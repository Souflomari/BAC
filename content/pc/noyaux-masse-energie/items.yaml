notion: noyaux-masse-energie
skill_code: pc_noyaux_masse_energie
misconceptions:
  - id: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
    label: "« Le noyau assemblé n'est pas plus léger, ou la masse manquante disparaît — E=mc² ne relie pas masse et énergie »"
    description: "L'élève nie le défaut de masse (noyau assemblé aussi lourd ou plus lourd que ses nucléons séparés, ou formule au signe inversé), ou croit que la masse « manquante » d'une réaction est détruite, cachée, ou une erreur de mesure — au lieu d'une conversion masse vers énergie. Peut aussi croire E=mc² réservé aux noyaux."
    contradicts_principle: "Un noyau lié est toujours plus léger que ses nucléons séparés (Δm = Z·mp + N·mn − m_noyau > 0), et toute masse manquante se retrouve exactement en énergie par la relation universelle et réciproque E = m·c² (donc ΔE = Δm·c²)."
  - id: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
    label: "« E_l est une réserve libérable, ou se compare en valeur totale ; la courbe d'Aston et le sens fusion/fission mal lus »"
    description: "L'élève voit E_l comme une énergie stockée libérable spontanément (au lieu de l'énergie à fournir pour dissocier), compare des E_l totales au lieu de E_l/A, ou lit mal la courbe d'Aston (fusion ou fission « libère toujours », noyaux légers vus comme hauts sur la courbe, fission et fusion confondues)."
    contradicts_principle: "E_l est l'énergie à fournir pour dissocier un noyau ; pour comparer deux noyaux de tailles différentes on divise par A (E_l/A). Une réaction ne libère de l'énergie que si elle rapproche les noyaux du maximum de la courbe d'Aston (E_l/A croissant vers le fer)."
  - id: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
    label: "« Une des deux lois de Soddy oubliée : bilan de A ou de Z incomplet, ou comptage Z/N erroné »"
    description: "L'élève n'applique qu'une des deux lois de conservation (A ou Z), oublie un réactif dans le bilan de A (le neutron incident), oublie que le neutron a une charge nulle (Z=0), confond A et N en comptant les nucléons, ou croit que le nombre de nucléons peut varier au cours d'une réaction."
    contradicts_principle: "Les deux lois de Soddy s'appliquent ensemble : conservation de A ET de Z. Un noyau (A,Z)X a Z protons et N=A−Z neutrons ; tout réactif, neutron incident compris, entre dans le bilan, et le nombre total de nucléons est rigoureusement conservé."
  - id: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
    label: "« Mauvaise manipulation des unités et ordres de grandeur nucléaires (facteur 931,5, MeV vs eV, facteur chimique/nucléaire) »"
    description: "L'élève oublie le facteur 1 u ≈ 931,5 MeV/c² (traite une valeur en u comme déjà en MeV, ou l'applique tel quel sans multiplier par Δm), confond MeV et eV, utilise u directement dans E=mc² avec c en unités SI, ou se trompe d'ordre de grandeur sur le facteur qui sépare énergie chimique et énergie nucléaire."
    contradicts_principle: "À l'échelle nucléaire on convertit u en MeV par le facteur 931,5 (jamais u directement avec c en m/s) ; l'énergie nucléaire par réaction dépasse la chimique d'un facteur de l'ordre du million (10⁶ à 10⁸), ni 10 ni 10¹²."
  - id: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
    label: "« Signe de Δm mal interprété dans un bilan : Δm>0 vu comme énergie libérée (ou l'inverse), ou réactif/produit oublié »"
    description: "L'élève inverse le lien entre le signe de Δm = m_produits − m_réactifs et le sens du transfert d'énergie, néglige le signe en ne gardant que la valeur absolue, ou oublie un réactif ou un produit dans le bilan de masse d'une réaction."
    contradicts_principle: "Δm<0 (produits plus légers) implique une énergie libérée |Δm|·c² ; Δm>0 implique une énergie à fournir et une réaction non spontanée. Le signe décide du sens du transfert ; la valeur absolue n'en donne que la quantité."

items:
  - id: NME-1
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
    stem: >
      Un noyau atomique, une fois ses nucléons assemblés, a une masse
      comparée à la somme des masses de ses nucléons pris séparément (le
      proton et le neutron isolés). Que peut-on affirmer, pour n'importe
      quel noyau stable ?
    type: mcq
    choices:
      - id: A
        text: >-
          Sa masse est strictement inférieure à la somme des masses des
          nucléons séparés.
        correct: true
      - id: B
        text: >-
          Sa masse est strictement supérieure à la somme des masses des
          nucléons séparés.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          C'est l'inverse : assembler les nucléons libère de l'énergie
          (via l'interaction forte), et par $E=mc^2$ cette énergie libérée
          correspond à une perte de masse, pas à un gain. Le noyau assemblé
          est toujours plus léger.
      - id: C
        text: "Sa masse est exactement égale à la somme des masses des nucléons séparés."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          Ce serait le cas si l'assemblage ne mettait en jeu aucune
          énergie de liaison — or c'est précisément l'énergie de liaison,
          jamais nulle pour un noyau réellement lié, qui crée cet écart de
          masse.
      - id: D
        text: >-
          Ça dépend du noyau : certains noyaux sont plus lourds, d'autres
          plus légers que la somme de leurs nucléons séparés.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          Le défaut de masse $\Delta m = Zm_p + Nm_n - m_{\text{noyau}}$
          est positif pour tout noyau lié, sans exception — c'est une
          conséquence directe du fait que l'assemblage libère de l'énergie,
          quel que soit le noyau.
    correct_feedback: >
      Le défaut de masse est toujours positif pour un noyau lié : le noyau
      assemblé pèse toujours moins lourd que ses nucléons pris séparément.
    solution: |
      Assembler des nucléons libres en un noyau, sous l'effet de
      l'interaction forte, libère de l'énergie. Par l'équivalence
      masse-énergie ($E = mc^2$), cette énergie libérée correspond à une
      diminution de la masse du système : $\Delta m = Zm_p + Nm_n -
      m_{\text{noyau}} > 0$ pour tout noyau lié.

  - id: NME-2
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
    stem: >
      Un noyau stable, livré à lui-même, va-t-il spontanément libérer, au
      cours du temps, son énergie de liaison $E_l$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non — $E_l$ est l'énergie qu'il faudrait fournir du dehors pour casser le
          noyau, pas une énergie qu'il tiendrait prête à sortir.
        correct: true
      - id: B
        text: >-
          Oui, un peu à chaque instant qui passe, exactement comme le ferait une pile
          qui se décharge lentement au fil des heures.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          $E_l$ n'est pas une réserve d'énergie que le noyau relâche
          spontanément : c'est le prix à payer pour le dissocier. Un noyau
          stable ne se dissocie pas tout seul, donc il ne « rend » rien.
      - id: C
        text: "Oui, mais seulement à la condition que le noyau soit chauffé suffisamment fort."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          La chaleur (l'agitation thermique) ne mobilise pas l'énergie de
          liaison nucléaire : il faudrait des énergies d'un tout autre
          ordre de grandeur (des MeV par nucléon) pour dissocier un noyau,
          bien au-delà de ce qu'apporte l'agitation thermique ordinaire.
      - id: D
        text: >-
          Impossible à savoir sans connaître au préalable la constante radioactive
          $\lambda$ propre à ce noyau.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          $\lambda$ (chapitre précédent) gouverne une désintégration
          radioactive spontanée d'un noyau instable vers un autre noyau —
          un phénomène différent de l'énergie de liaison, qui, elle, mesure
          la solidité de l'assemblage des nucléons et ne se « libère »
          jamais spontanément pour un noyau stable.
    correct_feedback: >
      $E_l$ est l'énergie qu'il faut fournir pour dissocier le noyau, pas
      une énergie qu'il libère de lui-même : un noyau stable reste stable
      indéfiniment, sans rien relâcher.
    solution: |
      $E_l$ est définie comme l'énergie à fournir pour séparer le noyau en
      ses nucléons isolés (ou, de façon équivalente, l'énergie libérée
      lors de sa formation à partir de ces nucléons). Un noyau stable, une
      fois formé, ne se dissocie pas spontanément : il n'y a donc rien à
      « libérer » de nouveau sans apport d'énergie extérieur.

  - id: NME-3
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
    stem: >
      Le noyau X a une énergie de liaison totale $E_l$ deux fois plus
      grande que celle du noyau Y. Peut-on en conclure que X est plus
      stable, nucléon pour nucléon, que Y ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non, pas nécessairement : il faut comparer $E_l/A$, pas $E_l$
          brute, car X peut simplement avoir beaucoup plus de nucléons que
          Y.
        correct: true
      - id: B
        text: "Oui : une énergie de liaison totale plus grande signifie toujours un noyau plus solidement lié, donc plus stable."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          $E_l$ totale grandit presque automatiquement avec la taille du
          noyau (plus de nucléons, plus de liaisons à casser) — elle ne
          mesure pas, à elle seule, la solidité de chaque liaison. C'est
          $E_l/A$, l'énergie de liaison par nucléon, qui compare
          honnêtement deux noyaux de tailles différentes.
      - id: C
        text: >-
          Non, on ne peut rien conclure du tout sans connaître au préalable le rapport
          $N/Z$ de chacun des deux noyaux.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          Le rapport $N/Z$ (chapitre précédent) renseigne sur la stabilité
          d'un noyau vis-à-vis d'une désintégration radioactive — une
          notion différente. La comparaison demandée ici porte sur
          l'énergie de liaison par nucléon, qu'on peut très bien évaluer
          sans connaître $N/Z$.
      - id: D
        text: >-
          Oui, car $E_l$ est proportionnelle à $A$, si bien que $E_l/A$ serait lui aussi
          deux fois plus grand pour X.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          $E_l$ n'est pas simplement proportionnelle à $A$ : c'est
          exactement pour ça que la courbe d'Aston n'est pas une droite,
          mais monte puis redescend. Rien ne permet de déduire $E_l/A$ à
          partir de $E_l$ seule sans connaître $A$ pour chaque noyau.
    correct_feedback: >
      C'est $E_l/A$, l'énergie de liaison par nucléon, qui mesure
      honnêtement la stabilité — pas l'énergie de liaison totale, qui
      grandit avec la taille du noyau.
    solution: |
      $E_l$ totale dépend à la fois de la solidité des liaisons ET du
      nombre de nucléons. Pour comparer deux noyaux de tailles
      différentes, il faut diviser par $A$ : $E_l/A$ mesure ce que chaque
      nucléon, en moyenne, doit à sa liaison avec ses voisins,
      indépendamment de la taille totale du noyau.

  - id: NME-4
    rung: "R3"
    difficulty_level: 4
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
    stem: >
      D'après la courbe d'Aston (énergie de liaison par nucléon $E_l/A$ en
      fonction de $A$, croissante puis décroissante avec un maximum vers
      $A \approx 60$), pourquoi la fusion de deux noyaux légers libère-t-elle
      de l'énergie ?
    type: mcq
    choices:
      - id: A
        text: >-
          Parce que le noyau formé, plus lourd, a un $E_l/A$ plus grand
          que les noyaux légers de départ : il se rapproche du maximum de
          la courbe.
        correct: true
      - id: B
        text: >-
          Parce qu'un noyau plus lourd contient toujours plus de neutrons,
          ce qui le stabilise automatiquement contre la radioactivité.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est confondre deux notions différentes : le rapport $N/Z$
          (chapitre précédent) gouverne la stabilité contre la
          désintégration radioactive, pas l'énergie de liaison par
          nucléon. C'est bien $E_l/A$, pas $N/Z$, qui explique l'énergie
          libérée ici.
      - id: C
        text: >-
          Parce que la fusion, comme la fission, libère toujours de
          l'énergie, quels que soient les noyaux en jeu.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          Faux en général : fusionner deux noyaux déjà proches du maximum
          de la courbe (ou au-delà) n'en libérerait pas. C'est la position
          des noyaux sur la courbe d'Aston, pas le simple fait de
          fusionner, qui détermine si de l'énergie est libérée.
      - id: D
        text: >-
          Parce que les noyaux légers ont un $E_l/A$ plus grand que les
          noyaux lourds, donc fusionner les en rapproche du bas de la
          courbe.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est l'inverse : les noyaux très légers ont un $E_l/A$ plus
          PETIT (la courbe grimpe depuis les petits $A$). C'est justement
          parce qu'ils sont bas sur la courbe que les rapprocher du
          maximum, en fusionnant, libère de l'énergie.
    correct_feedback: >
      La fusion rapproche des noyaux légers du sommet de la courbe
      d'Aston : leur $E_l/A$ augmente, donc de l'énergie est libérée.
    solution: |
      Un système évolue spontanément vers un état de moindre énergie,
      c'est-à-dire vers un $E_l/A$ plus grand sur la courbe d'Aston. Deux
      noyaux légers, situés sur la partie montante de la courbe (avant le
      maximum vers $A \approx 60$), forment par fusion un noyau plus
      lourd et plus proche du maximum : son $E_l/A$ est plus grand que
      celui des noyaux de départ, donc de l'énergie est libérée.

  - id: NME-5
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
    stem: >
      Un noyau a un défaut de masse $\Delta m = 0{,}010\ \text{u}$. Quelle
      est, en ordre de grandeur, l'énergie de liaison correspondante ?
    type: mcq
    choices:
      - id: A
        text: "Environ $9{,}3\\ \\text{MeV}$."
        correct: true
      - id: B
        text: "Environ $9{,}3\\ \\text{eV}$."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est un facteur $10^6$ trop petit : le facteur de conversion
          $1\ \text{u} \approx 931{,}5\ \text{MeV}/c^2$ est exprimé en MeV,
          pas en eV.
      - id: C
        text: "Environ $0{,}010\\ \\text{MeV}$."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          Ce choix oublie de multiplier $\Delta m$ par le facteur de
          conversion $931{,}5$ — il traite la valeur en $\text{u}$ comme si
          elle était déjà une énergie en MeV.
      - id: D
        text: "Environ $931{,}5\\ \\text{MeV}$."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est l'énergie équivalente à $1\ \text{u}$ tout entier, pas à
          $\Delta m = 0{,}010\ \text{u}$. Il faut multiplier $931{,}5$ par
          la valeur réelle de $\Delta m$, pas l'utiliser telle quelle.
    correct_feedback: >
      $E_l = \Delta m \times 931{,}5 = 0{,}010 \times 931{,}5 \approx
      9{,}3\ \text{MeV}$.
    solution: |
      $E_l = \Delta m \, c^2$, et le facteur de conversion établi au chapitre 2
      donne directement $E_l \text{(MeV)} = \Delta m \text{(u)} \times
      931{,}5$. Ici : $E_l = 0{,}010 \times 931{,}5 \approx 9{,}3\ \text{MeV}$.

  - id: NME-6
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
    stem: >
      Dans une réaction nucléaire, on calcule $\Delta m = m_{\text{produits}}
      - m_{\text{réactifs}} = +0{,}05\ \text{u}$ (positif). Que peut-on en
      conclure ?
    type: mcq
    choices:
      - id: A
        text: >-
          Cette réaction ne peut pas se produire spontanément : il
          faudrait au contraire lui fournir de l'énergie.
        correct: true
      - id: B
        text: "Cette réaction libère de l'énergie, comme toute réaction nucléaire."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
        feedback: >
          Un $\Delta m$ positif signifie que les produits sont plus lourds
          que les réactifs — c'est l'inverse d'une libération d'énergie,
          qui exige $\Delta m < 0$ (des produits plus légers que les
          réactifs).
      - id: C
        text: >-
          Le signe de $\Delta m$ n'a pas d'importance : seule sa valeur
          absolue compte pour calculer l'énergie mise en jeu.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
        feedback: >
          La valeur absolue donne bien l'énergie mise en jeu, mais le
          signe indique si cette énergie est libérée ou doit être
          fournie — une information qu'on ne peut pas ignorer pour savoir
          si la réaction est possible spontanément.
      - id: D
        text: "Cette réaction est nécessairement une fission, jamais une fusion."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          Le signe de $\Delta m$ renseigne sur le sens du transfert
          d'énergie, pas sur la nature fission/fusion de la réaction :
          une fusion mal choisie, entre noyaux déjà très proches du
          maximum de la courbe d'Aston, pourrait tout aussi bien donner
          $\Delta m > 0$.
    correct_feedback: >
      $\Delta m > 0$ signifie des produits plus lourds que les réactifs :
      la réaction consommerait de l'énergie plutôt que d'en libérer, donc
      elle ne se produit pas spontanément.
    solution: |
      $\Delta m = m_{\text{produits}} - m_{\text{réactifs}}$. Si $\Delta m
      < 0$, les produits sont plus légers : de l'énergie $|\Delta m| c^2$
      est libérée. Si $\Delta m > 0$, comme ici, les produits sont plus
      lourds : la réaction demanderait un apport d'énergie extérieur pour
      avoir lieu, elle ne se produit donc pas spontanément.

  # ── R0 (append) ──

  - id: NME-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
    stem: >
      D'après le raisonnement de l'accroche, pourquoi une combustion
      chimique — même avec le meilleur combustible imaginable, brûlant
      dans tout l'oxygène nécessaire — ne peut-elle pas expliquer que le
      Soleil brille depuis 4,6 milliards d'années ?
    type: mcq
    choices:
      - id: A
        text: >-
          Parce qu'une réaction chimique, contrairement à une réaction
          nucléaire, ne libère jamais la moindre énergie.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est faux, et ce n'est pas l'argument de l'accroche : une
          combustion chimique libère bel et bien de l'énergie (quelques
          dizaines de mégajoules par kilogramme) — seulement des millions
          de fois moins, par kilogramme, qu'une réaction nucléaire. C'est
          un écart d'ordre de grandeur, pas une absence totale d'énergie
          côté chimique.
      - id: B
        text: >-
          Parce que l'énergie chimique libérée par kilogramme est bien
          trop faible : le calcul ne donne que quelques milliers d'années
          d'autonomie, un facteur d'environ un million trop petit par
          rapport à l'âge réel du Soleil.
        correct: true
      - id: C
        text: >-
          Parce que la réaction qui alimente le Soleil est en réalité une
          fission de l'hydrogène, et non une combustion.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est confondre fission et fusion : le Soleil est alimenté par
          une fusion (des noyaux légers qui s'assemblent en un noyau plus
          lourd), pas par une fission (un noyau lourd qui se casse). Et de
          toute façon, le nom de la réaction n'est pas l'argument qui
          explique l'écart de durée : c'est l'ordre de grandeur de
          l'énergie libérée par kilogramme qui tranche.
      - id: D
        text: >-
          Parce que l'écart entre les deux durées n'est en réalité qu'une
          erreur d'unités : exprimées dans le même système d'unités,
          l'énergie chimique et l'énergie nucléaire par kilogramme
          seraient du même ordre de grandeur.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          Non : l'écart est réel, pas un artefact d'unités. Même
          converties proprement dans les mêmes unités, l'énergie
          nucléaire par kilogramme reste des millions de fois plus grande
          que l'énergie chimique — c'est précisément ce facteur, chiffré
          au chapitre 5, qui comble l'écart de durée.
    correct_feedback: >
      L'argument est un argument d'ordre de grandeur : la meilleure
      combustion chimique imaginable ne tient que quelques milliers
      d'années à la puissance du Soleil, contre 4,6 milliards d'années
      réels — un facteur d'environ un million qu'aucune réaction chimique
      ne peut combler.
    solution: |
      On compare l'énergie totale disponible dans la masse du Soleil si
      elle brûlait chimiquement (quelques dizaines de MJ par kg) à
      l'énergie qu'il faut fournir pour rayonner sa puissance pendant 4,6
      milliards d'années. Le premier chiffre tient quelques milliers
      d'années ; le second en demande des milliards : un facteur de
      l'ordre du million sépare les deux, bien au-delà de ce qu'une
      réaction chimique, aussi énergétique soit-elle, peut fournir.

  - id: NME-8
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
    stem: >
      Dans la réaction de fusion qui alimente le Soleil, la matière
      produite pèse un peu moins lourd que la matière de départ. Où «
      passe » cette masse manquante ?
    type: mcq
    choices:
      - id: A
        text: >-
          Elle est réellement détruite : la fusion nucléaire est l'une
          des rares réactions où de la matière peut disparaître sans
          laisser aucune trace.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          Ce n'est pas une destruction, c'est une conversion : par
          l'équivalence masse-énergie, cette masse ne « disparaît » pas,
          elle se retrouve intégralement sous forme d'énergie libérée. La
          masse et l'énergie sont deux façons de mesurer la même chose,
          pas deux choses dont l'une peut s'évanouir sans laisser de
          trace.
      - id: B
        text: >-
          Elle se retrouve sous forme de particules supplémentaires
          (neutrons, protons) non comptabilisées dans le bilan, ce qui
          explique la masse manquante.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Le nombre de nucléons (protons + neutrons) est rigoureusement
          conservé dans toute réaction nucléaire : il n'y a pas de
          particule « cachée » qui s'ajouterait au bilan. La masse
          manquante n'est pas un défaut de comptage des nucléons, c'est
          une vraie différence de masse entre les nucléons séparés et le
          noyau assemblé, qui devient de l'énergie.
      - id: C
        text: >-
          Elle ne disparaît pas au sens propre : par l'équivalence
          masse-énergie, elle correspond exactement à l'énergie libérée
          par la réaction.
        correct: true
      - id: D
        text: >-
          C'est une erreur de mesure : avec une précision suffisante, on
          trouverait exactement la même masse totale avant et après la
          réaction.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          Ce n'est pas une erreur de mesure : la différence de masse est
          systématique, reproductible, et mesurée avec une précision
          extrême en laboratoire. Elle est réelle et directement liée,
          par $E=mc^2$, à l'énergie libérée.
    correct_feedback: >
      La masse manquante n'a pas disparu : par $E=mc^2$, elle s'est
      convertie en l'énergie libérée par la réaction.
    solution: |
      Par l'équivalence masse-énergie établie au chapitre 2, une variation de
      masse $\Delta m$ correspond toujours à une énergie $\Delta m\,c^2$.
      Ici, la masse « manquante » entre réactifs et produits n'est pas
      perdue : elle est exactement l'énergie libérée par la fusion,
      exprimée en unité de masse plutôt qu'en joules.

  - id: NME-9
    rung: "R0"
    difficulty_level: 2
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
    stem: >
      L'accroche estime que la combustion chimique de toute la masse du
      Soleil ne tiendrait que quelques milliers d'années, très loin des
      4,6 milliards d'années réels. Quel est l'ordre de grandeur du
      facteur qui sépare ces deux durées ?
    type: mcq
    choices:
      - id: A
        text: "Environ un million ($10^{6}$)."
        correct: true
      - id: B
        text: "Environ dix (10)."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est très en dessous de la réalité : l'écart entre l'énergie
          chimique (quelques dizaines de mégajoules par kilogramme) et
          l'énergie nucléaire par kilogramme n'est pas un facteur 10,
          mais de l'ordre du million.
      - id: C
        text: "Environ mille milliards ($10^{12}$)."
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est très au-dessus de la réalité : l'écart, chiffré
          précisément au chapitre 5 en comparant électronvolts et
          méga-électronvolts par réaction, est de l'ordre de $10^{6}$ à
          $10^{8}$, pas $10^{12}$.
      - id: D
        text: >-
          Le même facteur qu'entre l'énergie de liaison par nucléon d'un
          noyau léger et d'un noyau lourd, soit environ 2.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est confondre deux comparaisons différentes : le facteur «
          chimique contre nucléaire » (environ un million) mesure l'écart
          entre deux types de réactions ; le facteur « $E_l/A$ d'un noyau
          léger contre un noyau lourd » (chapitre 4) mesure un écart bien plus
          modeste entre deux noyaux, tous deux nucléaires. Les deux ne
          sont pas du même ordre de grandeur.
    correct_feedback: >
      Le facteur est de l'ordre du million : c'est cet écart-là, chiffré
      précisément au chapitre 5, qui sépare l'énergie nucléaire de l'énergie
      chimique par réaction.
    solution: |
      Quelques milliers d'années contre 4,6 milliards d'années : le
      rapport des deux durées est de l'ordre de $10^{6}$. Ce facteur n'est
      pas anodin — c'est exactement celui qu'on retrouve au chapitre 5 en
      comparant l'énergie libérée par une réaction nucléaire à celle
      d'une réaction chimique.

  # ── R1 (append) ──

  - id: NME-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
    stem: >
      Un système voit son énergie augmenter de $\Delta E$, sans qu'aucune
      variation de masse ne soit détectable avec une balance ordinaire.
      Que peut-on affirmer, d'après $E=mc^2$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Rien : à notre échelle, masse et énergie sont deux grandeurs
          indépendantes, et l'une ne peut jamais se transformer en
          l'autre.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          C'est nier le postulat lui-même : $E=mc^2$ s'applique à tout
          système, pas seulement aux noyaux atomiques. La masse et
          l'énergie ne sont jamais deux grandeurs totalement
          indépendantes — c'est seulement que la variation de masse
          associée à une énergie ordinaire est trop petite pour être
          détectée.
      - id: B
        text: >-
          Sa masse a diminué, car toute augmentation d'énergie stockée
          par un système fait nécessairement perdre de la masse à ce
          système.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          C'est le sens inverse : une augmentation d'énergie $\Delta E >
          0$ correspond à une augmentation de masse $\Delta m =
          \Delta E/c^2 > 0$, pas une diminution. Le signe de $\Delta m$
          suit toujours celui de $\Delta E$.
      - id: C
        text: >-
          On ne peut rien dire, car la relation $E=mc^2$ ne s'applique
          qu'aux noyaux atomiques, jamais à un système macroscopique
          comme celui-ci.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          $E=mc^2$ est un postulat général, valable pour tout système,
          quelle que soit son échelle — c'est justement le point du chapitre 2.
          Ce n'est qu'à l'échelle nucléaire que $\Delta m$ devient assez
          grand pour être mesurable ; à l'échelle macroscopique, la
          relation s'applique toujours, elle donne seulement un $\Delta
          m$ indétectable.
      - id: D
        text: >-
          Sa masse a bel et bien augmenté de $\Delta m = \Delta E/c^2$, mais aucune
          balance ne peut détecter une variation aussi petite à l'échelle macroscopique.
        correct: true
    correct_feedback: >
      $E=mc^2$ s'applique toujours : $\Delta m = \Delta E/c^2$ est non
      nul, simplement ridiculement petit à l'échelle macroscopique, à
      cause de la valeur énorme de $c^2$.
    solution: |
      Par réciprocité de $E=mc^2$, toute variation d'énergie $\Delta E$
      s'accompagne d'une variation de masse $\Delta m = \Delta E/c^2$.
      Comme $c^2 \approx 9\times10^{16}\ \text{m}^2/\text{s}^2$ est
      énorme, convertir une énergie usuelle en variation de masse donne
      un $\Delta m$ indétectable par la meilleure balance — mais non nul
      en toute rigueur.

  - id: NME-11
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
    stem: >
      Un élève calcule l'énergie de liaison d'un noyau à partir de
      $\Delta m = 0{,}020\ \text{u}$ en écrivant directement $E = \Delta m
      \times c^2 = 0{,}020 \times (3{,}00\times10^{8})^2$, sans convertir
      $\Delta m$ en kilogrammes au préalable. Que peut-on dire du résultat
      obtenu ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le résultat est parfaitement correct, car l'unité de masse atomique u
          appartient déjà au Système International.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est faux : l'unité de masse atomique u n'est pas une unité du
          Système International — le kilogramme l'est. Utiliser $\Delta
          m$ en u directement dans $E=mc^2$ avec $c$ en m/s mélange deux
          systèmes d'unités et donne un résultat sans sens physique.
      - id: B
        text: >-
          Le résultat est faux : il faut convertir $\Delta m$ de u en kilogrammes avant
          d'appliquer $E=mc^2$ en unités SI — ou utiliser le raccourci $1\ \text{u}
          \approx 931{,}5\ \text{MeV}/c^2$.
        correct: true
      - id: C
        text: >-
          Le résultat est faux, mais seulement parce qu'il fallait exprimer la célérité
          $c$ en kilomètres par seconde plutôt qu'en mètres par seconde.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          Changer l'unité de $c$ ne corrige pas le vrai problème : c'est
          l'unité de $\Delta m$ (u au lieu de kg) qui est incompatible
          avec $c$ en unités SI, pas l'unité de $c$ elle-même.
      - id: D
        text: >-
          Le résultat est faux, mais cela n'a guère d'importance : à l'échelle
          nucléaire, $\Delta m$ est de toute façon trop petit pour donner une énergie
          mesurable.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          C'est l'inverse : c'est précisément à l'échelle nucléaire que
          $\Delta m$ devient assez grand, relativement à la masse du
          noyau, pour donner une énergie parfaitement mesurable — des MeV
          par réaction, comme vu tout au long de cette leçon. L'erreur de
          calcul, elle, reste bien réelle.
    correct_feedback: >
      Mélanger u (une unité adaptée à l'échelle nucléaire) avec c en m/s
      (unités SI) sans convertir donne un résultat sans signification :
      il faut soit tout passer en kg et J, soit utiliser directement le
      facteur $931{,}5\ \text{MeV}$ par u établi au chapitre 2.
    solution: |
      $\text{u}$ n'est pas une unité SI : $1\ \text{u} =
      1{,}6605\times10^{-27}\ \text{kg}$. Pour appliquer $E=mc^2$ avec $c$
      en m/s, il faut d'abord convertir $\Delta m$ en kilogrammes, ou
      utiliser directement le facteur de conversion $1\ \text{u} \approx
      931{,}5\ \text{MeV}/c^2$, qui évite justement d'avoir à repasser par
      le kilogramme et le joule.

  # ── R2 (append) ──

  - id: NME-12
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
    stem: >
      Le noyau d'azote 14, $^{14}_{7}\text{N}$, a une masse (masse du
      noyau) $m(^{14}_{7}\text{N}) = 13{,}99923\ \text{u}$. On donne $m_p
      = 1{,}00728\ \text{u}$ et $m_n = 1{,}00867\ \text{u}$. Quel calcul
      donne correctement le défaut de masse $\Delta m$ de ce noyau ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\Delta m = 14\,m_p - m(^{14}_{7}\text{N})$
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Ce calcul traite les 14 nucléons comme s'ils étaient tous des
          protons. Or l'azote 14 a $Z=7$ protons et $N=A-Z=7$ neutrons :
          il faut compter les deux types de nucléons séparément, avec
          leurs masses $m_p$ et $m_n$ respectives.
      - id: B
        text: >-
          $\Delta m = m(^{14}_{7}\text{N}) - 7\,m_p - 7\,m_n$
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.defaut-masse-et-equivalence
        feedback: >
          Le signe est inversé : le défaut de masse se définit comme
          (masse des nucléons séparés) moins (masse du noyau assemblé),
          jamais l'inverse — puisque le noyau assemblé est toujours plus
          léger, cette formule inversée donnerait systématiquement un
          $\Delta m$ négatif, ce qui contredit le fait que $\Delta m$ est
          toujours positif pour un noyau lié.
      - id: C
        text: >-
          $\Delta m = 7\,m_p + 7\,m_n - m(^{14}_{7}\text{N})$
        correct: true
      - id: D
        text: >-
          $\Delta m = 7\,m_p + 14\,m_n - m(^{14}_{7}\text{N})$
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Ce calcul utilise $N=14$ neutrons au lieu de $N=A-Z=14-7=7$ : il
          confond le nombre de masse $A$ (le nombre total de nucléons)
          avec le nombre de neutrons $N$. Il faut lire soigneusement $Z$
          et $A$ dans la notation $^{A}_{Z}\text{X}$ pour en déduire
          $N=A-Z$.
    correct_feedback: >
      L'azote 14 a $Z=7$ protons et $N=A-Z=14-7=7$ neutrons : le défaut de
      masse compare la somme de ces 7 protons et 7 neutrons séparés à la
      masse du noyau assemblé.
    solution: |
      $$\Delta m = Z\,m_p + N\,m_n - m(^{14}_{7}\text{N}) = 7\,m_p +
      7\,m_n - m(^{14}_{7}\text{N})$$
      avec $Z=7$ et $N=A-Z=7$, lus directement dans la notation
      $^{14}_{7}\text{N}$.

  # ── R3 (append) ──

  - id: NME-13
    rung: "R3"
    difficulty_level: 4
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
    stem: >
      Un noyau lourd, situé sur la partie descendante de la courbe
      d'Aston (à droite du maximum), se casse en deux noyaux de masse
      intermédiaire. Que peut-on dire de cette réaction ?
    type: mcq
    choices:
      - id: A
        text: >-
          C'est une fission : les noyaux fils ont, ensemble, un $E_l/A$
          plus grand que le noyau initial, donc de l'énergie est libérée.
        correct: true
      - id: B
        text: >-
          C'est une fusion, car le nombre de noyaux augmente au cours de
          la réaction.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est confondre fission et fusion : la fusion, c'est
          l'assemblage de plusieurs noyaux en un seul plus lourd ; ici
          c'est l'inverse, un seul noyau lourd se casse en plusieurs
          noyaux plus légers — c'est la définition même de la fission,
          quel que soit le nombre de noyaux obtenus.
      - id: C
        text: >-
          C'est une fission, mais elle absorbe de l'énergie, car casser un
          noyau demande toujours de fournir de l'énergie.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          Casser un noyau ne demande de l'énergie que s'il est déjà
          proche du maximum de la courbe d'Aston. Ici, le noyau initial
          est sur la partie descendante (à droite du maximum) : le casser
          rapproche les fragments du sommet de la courbe, ce qui libère
          de l'énergie plutôt que d'en absorber.
      - id: D
        text: >-
          C'est une fission, et l'énergie libérée ne dépend pas de la
          position du noyau initial sur la courbe d'Aston.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est l'inverse : c'est précisément la position du noyau sur la
          courbe d'Aston (avant et après cassure) qui détermine si de
          l'énergie est libérée, et combien. Un noyau déjà proche du
          maximum libérerait très peu, voire rien.
    correct_feedback: >
      Un noyau lourd se cassant en fragments plus proches du maximum de
      la courbe d'Aston est une fission qui libère de l'énergie — c'est
      exactement le principe d'un réacteur nucléaire.
    solution: |
      Sur la partie descendante de la courbe d'Aston, $E_l/A$ diminue à
      mesure que $A$ augmente : les noyaux lourds sont donc moins bien
      liés par nucléon que des noyaux de masse intermédiaire. En se
      cassant, un noyau lourd produit des fragments plus proches du
      maximum, avec un $E_l/A$ moyen plus grand : ce gain d'énergie de
      liaison par nucléon se traduit par une énergie libérée — c'est une
      fission.

  # ── R4 (append) ──

  - id: NME-14
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
    stem: >
      On étudie la réaction de fission suivante, où $X$ est un noyau à
      identifier : $^{1}_{0}\text{n} + \ ^{235}_{92}\text{U}
      \longrightarrow \ ^{140}_{54}\text{Xe} + X + 2\,^{1}_{0}\text{n}$.
      Quel noyau $X$ complète correctement cette équation ?
    type: mcq
    choices:
      - id: A
        text: "$^{93}_{38}\\text{Sr}$"
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Le bilan de $A$ oublie le neutron incident côté réactifs : $A_X
          = 1 + 235 - 140 - 2 = 94$, pas $235-140-2=93$. Le neutron qui
          percute l'uranium fait partie des réactifs, au même titre que
          l'uranium lui-même.
      - id: B
        text: "$^{94}_{36}\\text{Kr}$"
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Le bilan de $Z$ est faux : les neutrons ont une charge nulle
          ($Z=0$), donc les « 2 n » du membre de droite ne doivent rien
          retrancher au bilan de $Z$. Il faut $Z_X = 92 - 54 = 38$, pas
          $92-54-2=36$.
      - id: C
        text: >-
          $^{94}_{40}\text{Zr}$ ; il suffit de vérifier la conservation de
          $A$, la conservation de $Z$ n'est pas nécessaire pour identifier
          un noyau.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Les deux lois de conservation (celle de $A$ ET celle de $Z$)
          doivent être vérifiées ensemble pour identifier un noyau sans
          ambiguïté : $A=94$ seul ne suffit pas, il existe plusieurs
          noyaux de nombre de masse 94. Ici $Z_X = 92-54=38$ (le
          strontium), pas $40$ (le zirconium).
      - id: D
        text: "$^{94}_{38}\\text{Sr}$"
        correct: true
    correct_feedback: >
      Conservation de $A$ : $1+235=140+A_X+2 \Rightarrow A_X=94$.
      Conservation de $Z$ : $0+92=54+Z_X+0 \Rightarrow Z_X=38$. D'où
      $X=\,^{94}_{38}\text{Sr}$.
    solution: |
      Les deux lois de Soddy s'appliquent simultanément :
      $$A:\ 1+235=140+A_X+2\times1 \Rightarrow A_X=236-140-2=94$$
      $$Z:\ 0+92=54+Z_X+2\times0 \Rightarrow Z_X=92-54=38$$
      Le noyau $X$ est donc $^{94}_{38}\text{Sr}$ (strontium 94).

  - id: NME-15
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
    stem: >
      Deux noyaux de deutérium fusionnent selon $^{2}_{1}\text{H} + \
      ^{2}_{1}\text{H} \longrightarrow \ ^{3}_{2}\text{He} + \
      ^{1}_{0}\text{n}$ (cette réaction sera étudiée avec ses données
      numériques au chapitre 6). Comment qualifier cette réaction, et pourquoi
      libère-t-elle de l'énergie ?
    type: mcq
    choices:
      - id: A
        text: >-
          C'est une fission, car l'un des noyaux de départ (le deutérium)
          se retrouve transformé, avec production d'un neutron libre.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est confondre fission et fusion : ici, deux noyaux de départ
          s'assemblent en un seul noyau plus lourd ($^{3}_{2}\text{He}$)
          — c'est la définition même de la fusion. Produire un neutron
          libre en supplément ne change pas la nature de la réaction, qui
          reste un assemblage de noyaux, pas une cassure.
      - id: B
        text: >-
          C'est une fusion : deux noyaux légers s'assemblent en un noyau
          plus proche du maximum de la courbe d'Aston, donc d'énergie de
          liaison par nucléon plus grande — cette différence est libérée
          sous forme d'énergie.
        correct: true
      - id: C
        text: >-
          C'est une fusion, mais rien ne permet de prévoir en général si
          elle libère ou absorbe de l'énergie : cela dépend uniquement
          des données de masse de chaque réaction particulière, sans lien
          avec une courbe générale de stabilité.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.energie-liaison-par-nucleon-et-aston
        feedback: >
          C'est précisément la courbe d'Aston (chapitre 4) qui permet de prévoir
          si une réaction libère de l'énergie, sans même connaître les
          masses en détail : une fusion entre noyaux légers, sur la
          partie montante de la courbe, libère toujours de l'énergie,
          parce qu'elle rapproche les noyaux du maximum.
      - id: D
        text: >-
          C'est une fusion qui libère de l'énergie parce que le nombre
          total de nucléons diminue entre les réactifs et les produits.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Le nombre de nucléons est rigoureusement conservé dans toute
          réaction nucléaire : $2+2=4$ côté réactifs, $3+1=4$ côté
          produits — il ne diminue jamais. L'énergie libérée vient d'un
          gain d'énergie de liaison par nucléon, pas d'une disparition de
          nucléons.
    correct_feedback: >
      Deux noyaux légers qui s'assemblent en un noyau plus lourd, c'est
      une fusion ; elle libère de l'énergie parce qu'elle rapproche les
      noyaux du maximum de la courbe d'Aston.
    solution: |
      Le deutérium ($A=2$) est un noyau très léger, situé loin à gauche
      sur la courbe d'Aston. En fusionnant, les deux noyaux de deutérium
      forment des produits plus proches du maximum de la courbe : leur
      $E_l/A$ moyen est plus grand que celui des réactifs, donc de
      l'énergie est libérée. C'est une fusion, pas une fission.

  # ── R5 (append) ──

  - id: NME-16
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
    stem: >
      On étudie une autre voie de fission de l'uranium 235, différente de
      celle vue au chapitre 5 : $^{1}_{0}\text{n} + \ ^{235}_{92}\text{U}
      \longrightarrow \ ^{140}_{54}\text{Xe} + \ ^{94}_{38}\text{Sr} +
      2\,^{1}_{0}\text{n}$. On donne (masses des noyaux) : $m(\text{n}) =
      1{,}00867\ \text{u}$, $m(^{235}_{92}\text{U}) = 234{,}99342\
      \text{u}$, $m(^{140}_{54}\text{Xe}) = 139{,}88137\ \text{u}$,
      $m(^{94}_{38}\text{Sr}) = 93{,}90578\ \text{u}$, $1\ \text{u}
      \approx 931{,}5\ \text{MeV}/c^2$. Quelle est l'énergie libérée par
      cette réaction ?
    type: mcq
    choices:
      - id: A
        text: >-
          Cette réaction absorbe environ $755{,}5\ \text{MeV}$ (elle ne
          peut pas se produire spontanément).
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
        feedback: >
          Ce résultat oublie le neutron incident dans la masse des
          réactifs (en ne comptant que $m(^{235}_{92}\text{U})$ seul). Le
          neutron qui percute l'uranium fait partie des réactifs :
          $m_{\text{réactifs}} = m(\text{n}) + m(^{235}_{92}\text{U})$,
          pas $m(^{235}_{92}\text{U})$ seul.
      - id: B
        text: >-
          Cette réaction absorbe environ $184{,}1\ \text{MeV}$ (elle ne
          peut pas se produire spontanément).
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
        feedback: >
          La valeur absolue est correcte, mais l'interprétation du signe
          est inversée : $\Delta m = m_{\text{produits}} -
          m_{\text{réactifs}}$ est ici négatif (les produits sont plus
          légers), ce qui signifie que l'énergie est **libérée**, pas
          absorbée.
      - id: C
        text: >-
          Cette réaction libère environ $184{,}1\ \text{MeV}$.
        correct: true
      - id: D
        text: >-
          Cette réaction libère environ $0{,}1976\ \text{MeV}$.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          Ce résultat oublie de multiplier $|\Delta m|=0{,}19760\
          \text{u}$ par le facteur de conversion $931{,}5$ : il traite la
          valeur en u comme si elle était déjà une énergie en MeV.
    correct_feedback: >
      $m_{\text{réactifs}} = 236{,}00209\ \text{u}$ (comme au chapitre 5, mêmes
      réactifs), $m_{\text{produits}} = 235{,}80449\ \text{u}$, donc
      $\Delta m \approx -0{,}19760\ \text{u}$ et $E \approx 184{,}1\
      \text{MeV}$ sont libérés.
    solution: |
      $$m_{\text{réactifs}} = m(\text{n}) + m(^{235}_{92}\text{U}) =
      1{,}00867 + 234{,}99342 = 236{,}00209\ \text{u}$$
      $$m_{\text{produits}} = m(^{140}_{54}\text{Xe}) +
      m(^{94}_{38}\text{Sr}) + 2\,m(\text{n}) = 139{,}88137 + 93{,}90578
      + 2\times1{,}00867 = 235{,}80449\ \text{u}$$
      $$\Delta m = 235{,}80449 - 236{,}00209 = -0{,}19760\ \text{u}$$
      $$E = 0{,}19760 \times 931{,}5 \approx 184{,}1\ \text{MeV}$$
      Comme $\Delta m<0$, cette énergie est libérée.

  - id: NME-17
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
    stem: >
      Dans le Soleil, deux noyaux d'hélium 3 fusionnent selon
      $^{3}_{2}\text{He} + \ ^{3}_{2}\text{He} \longrightarrow \
      ^{4}_{2}\text{He} + 2\,^{1}_{1}\text{H}$ (une étape réelle de la
      chaîne de réactions qui alimente le Soleil, évoquée à l'accroche).
      On donne (masses des noyaux) : $m(^{3}_{2}\text{He}) =
      3{,}01493\ \text{u}$, $m(^{4}_{2}\text{He}) = 4{,}00151\ \text{u}$,
      $m_p = 1{,}00728\ \text{u}$, $1\ \text{u} \approx 931{,}5\
      \text{MeV}/c^2$. Quelle est l'énergie libérée par cette réaction ?
    type: mcq
    choices:
      - id: A
        text: >-
          Cette réaction libère environ $12{,}8\ \text{MeV}$.
        correct: true
      - id: B
        text: >-
          Cette réaction libère environ $951{,}1\ \text{MeV}$.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
        feedback: >
          Ce résultat ne compte qu'un seul proton produit au lieu de
          deux : l'équation produit $2\,^{1}_{1}\text{H}$, donc
          $m_{\text{produits}} = m(^{4}_{2}\text{He}) + 2\,m_p$, pas
          $m(^{4}_{2}\text{He}) + m_p$.
      - id: C
        text: >-
          Cette réaction absorbe environ $12{,}8\ \text{MeV}$ (elle ne
          peut pas se produire spontanément).
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.signe-delta-m-bilan
        feedback: >
          La valeur absolue est correcte, mais le signe de $\Delta m$
          (négatif : les produits sont plus légers que les réactifs)
          indique que cette énergie est **libérée**, pas absorbée — c'est
          d'ailleurs cohérent avec le fait que cette réaction se produit
          spontanément au cœur du Soleil.
      - id: D
        text: >-
          Cette réaction libère environ $0{,}01379\ \text{MeV}$.
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.unites-et-ordres-de-grandeur
        feedback: >
          Ce résultat oublie de multiplier $|\Delta m|=0{,}01379\
          \text{u}$ par le facteur de conversion $931{,}5$ : il donne
          $\Delta m$ en u comme s'il s'agissait déjà d'une énergie en
          MeV.
    correct_feedback: >
      $m_{\text{réactifs}} = 2\times3{,}01493 = 6{,}02986\ \text{u}$,
      $m_{\text{produits}} = 4{,}00151+2\times1{,}00728 = 6{,}01607\
      \text{u}$, donc $\Delta m \approx -0{,}01379\ \text{u}$ et $E
      \approx 12{,}8\ \text{MeV}$ sont libérés.
    solution: |
      $$m_{\text{réactifs}} = 2\,m(^{3}_{2}\text{He}) = 2\times3{,}01493 =
      6{,}02986\ \text{u}$$
      $$m_{\text{produits}} = m(^{4}_{2}\text{He}) + 2\,m_p = 4{,}00151 +
      2\times1{,}00728 = 6{,}01607\ \text{u}$$
      $$\Delta m = 6{,}01607 - 6{,}02986 = -0{,}01379\ \text{u}$$
      $$E = 0{,}01379 \times 931{,}5 \approx 12{,}8\ \text{MeV}$$
      Cette énergie est libérée ($\Delta m<0$) : c'est l'une des réactions
      qui alimentent réellement le Soleil, prolongeant directement le
      raisonnement de l'accroche (chapitre 1).

  - id: NME-18
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_noyaux_masse_energie
    tags: []
    primary_misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
    stem: >
      Un proton fusionne avec un noyau de bore 11, $^{1}_{1}\text{H} + \
      ^{11}_{5}\text{B} \longrightarrow\ ?$. Laquelle des équations
      suivantes complète correctement cette réaction, en respectant les
      lois de conservation de $A$ et de $Z$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $2\,^{4}_{2}\text{He} + \ ^{3}_{2}\text{He}$
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          La conservation de $A$ échoue : $1+11=12$ côté réactifs, mais
          $4+4+3=11$ côté produits — il manque un nucléon. Vérifier $A$
          d'abord aurait suffi à écarter cette réponse.
      - id: B
        text: >-
          $2\,^{4}_{2}\text{He} + \ ^{4}_{3}\text{Li}$
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          $A$ est bien conservé ($4+4+4=12=1+11$), mais pas $Z$ :
          $2+2+3=7$ côté produits, contre $1+5=6$ côté réactifs. Les deux
          lois de conservation doivent être vérifiées séparément — $A$
          juste ne garantit pas $Z$ juste.
      - id: C
        text: >-
          $2\,^{4}_{2}\text{He} + \ ^{2}_{1}\text{H} + \ ^{1}_{0}\text{n}$
        correct: false
        misconception: mc.physics.pc_noyaux_masse_energie.conservation-A-Z
        feedback: >
          Ni $A$ ($4+4+2+1=11\neq12$) ni $Z$ ($2+2+1+0=5\neq6$) ne sont
          conservés ici : c'est une combinaison de produits choisie sans
          vérifier aucune des deux lois de Soddy.
      - id: D
        text: >-
          $3\,^{4}_{2}\text{He}$
        correct: true
    correct_feedback: >
      $A$ : $1+11=12=3\times4$. $Z$ : $1+5=6=3\times2$. Les deux lois de
      conservation sont vérifiées : $3\,^{4}_{2}\text{He}$ est la bonne
      réponse.
    solution: |
      Il faut vérifier séparément les deux lois de Soddy :
      $$A:\ 1+11=12 \quad\text{et}\quad 3\times4=12 \ \checkmark$$
      $$Z:\ 1+5=6 \quad\text{et}\quad 3\times2=6 \ \checkmark$$
      Les deux bilans sont satisfaits : la réaction produit bien
      $3\,^{4}_{2}\text{He}$ (une fusion aneutronique, sans neutron émis,
      étudiée pour de futurs réacteurs à fusion).

