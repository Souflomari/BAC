<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Bilan énergétique par réaction, échelle logarithmique de 1 eV à 10⁹ eV (1 GeV) : une réaction chimique typique libère environ 4 eV par molécule (barre minuscule, presque au ras de l’axe) ; la fusion deutérium-tritium (²H + ³H → ⁴He + n) libère 17,6 MeV, soit 17,6×10⁶ eV ; la fission de l’uranium 235 (n + ²³⁵U → ¹⁴¹Ba + ⁹²Kr + 3n) libère 173 MeV, soit 173×10⁶ eV — deux barres qui dominent tout le graphique. Une accolade en bas relie la réaction chimique aux réactions nucléaires et indique un rapport de l’ordre de 10⁶ à 10⁷,
     le même facteur qu’à l’accroche de la leçon.">
  <title>Énergie libérée par réaction — chimique vs nucléaire (échelle log)</title>
  <!--
    nucleaire-vs-chimique.svg — diagramme à barres STATIQUE, échelle
    logarithmique. STAGED (docs/design/LESSON-EXPERIENCE-SPEC.md §2), 4
    étapes, R4 (bilan énergétique fission/fusion, comparaison au chimique
    de l'accroche R0). Spec du pédagogue (4 stages, cf. rapport d'approbation) :
      (1) axes  (2) données chimique  (3) données nucléaire  (4) lecture

    DÉCISION DE CONCEPTION — l'axe EST une étape (contrairement à
    courbe-aston.svg où les axes sont un chrome permanent hors étapes) :
    le pédagogue a explicitement listé "axes" comme stage 1/4, donc les
    lignes/graduations de l'axe sont dans id="step-1", pas avant. Seuls le
    titre et le fond de panneau restent un chrome non-stepped (ils ne
    portent aucune information mathématique, contrairement à l'échelle
    elle-même).

    CONTRAIREMENT à defaut-masse.svg (où la géométrie N'ENCODE PAS la
    masse, par choix, l'écart réel étant trop petit pour tenir sur une
    figure), ICI la hauteur des barres EST proportionnelle à la grandeur
    représentée — mais via un axe logarithmique, pas linéaire : c'est
    justement ce que demande la leçon ("le rapport est de l'ordre de
    10^7 à 10^8", R4) — un tel écart ne tient sur AUCUNE figure à échelle
    linéaire, d'où le choix explicite du log pour cette figure précise.

    Valeurs, copiées telles quelles du texte (rung R4, "Ordres de
    grandeur : pourquoi le nucléaire domine à ce point le chimique") :
      réaction chimique (combustion, ordre de grandeur)  : ≈ 4 eV
      fusion deutérium-tritium ²H + ³H → ⁴He + n          : 17,6 MeV = 17,6×10⁶ eV
      fission de l'uranium 235 n + ²³⁵U → ¹⁴¹Ba + ⁹²Kr+3n : 173 MeV  = 173×10⁶ eV
      "Le rapport est de l'ordre de 10^7 à 10^8" — citation directe du
      texte, qui décrit la PLAGE couverte par les deux réactions
      nucléaires (fusion ≈ 4,4×10⁶ ≈ 10^6,6 fois le chimique ; fission
      ≈ 4,3×10⁷ ≈ 10^7,6 fois le chimique) — un énoncé d'ordre de
      grandeur du texte, repris tel quel, pas re-dérivé ici.

    Géométrie (calculée, échelle log) :
      axe vertical : x = 100, de y = 400 (n = 0, soit 1 eV) à y = 76
        (n = 9, soit 10⁹ eV = 1 GeV), avec un brin de ligne + flèche
        au-delà jusqu'à y ≈ 54 (même convention que courbe-aston.svg).
      formule : y(E) = 400 − log₁₀(E en eV) × 36   (36 px/décade)
      Vérification des 3 barres :
        chimique : E = 4 eV        → log₁₀(4)        = 0,60206 → y = 400 − 21,67 = 378,3
        fusion   : E = 1,76×10⁷ eV → log₁₀(1,76×10⁷) = 7,2455  → y = 400 − 260,84 = 139,2
        fission  : E = 1,73×10⁸ eV → log₁₀(1,73×10⁸) = 8,2380  → y = 400 − 296,57 = 103,4
      Décades marquées n = 0..9, étiquetées en eV/keV/MeV/GeV à n = 0, 3, 6, 9
      (y = 400, 292, 184, 76) ; graduations intermédiaires (n = 1,2,4,5,7,8)
      non étiquetées, pour ne pas surcharger.
      3 barres, largeur 70 px, centres en x = 200 (chimique), 370 (fusion),
      510 (fission) ; toutes posées sur le même plancher catégoriel y = 400.

    Rôle des couleurs :
      les 3 barres (même rôle sémantique : énergie libérée PAR RÉACTION,
      seule l'échelle diffère) : --figure-accent, fill-opacity 0,5 — un
      accent uniforme, pas de code couleur par catégorie : c'est la
      HAUTEUR (donc la valeur) qui porte toute la distinction, pas la
      teinte (cohérence avec "un seul accent restreint", pas de
      différenciation arbitraire entre chimique/nucléaire par la couleur).
      valeur numérique de chaque barre (le nombre qui la définit) : accent
      catégorie + équation de la réaction (nucléaires seulement, "tagué
      avec sa réaction" par consigne du pédagogue) : ink / ink-soft
      axe, graduations, plancher : ink-soft (chrome neutre)
      accolade finale (étape 4, le point de la figure) : accent
  -->

  <!-- Titre (chrome, toujours visible) -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Énergie libérée par réaction — chimique vs nucléaire (échelle log)
  </text>

  <!-- Fond du panneau (chrome, toujours visible) -->
  <rect x="30" y="34" width="580" height="436" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes : échelle logarithmique verticale,
       de 1 eV à 10⁹ eV (1 GeV), décades marquées
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Axe vertical (log) -->
    <line x1="100" y1="400" x2="100" y2="65"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="100,54 95.5,65 104.5,65" fill="var(--figure-ink-soft)"/>

    <!-- Plancher catégoriel (pas une grandeur continue : pas de flèche) -->
    <line x1="100" y1="400" x2="590" y2="400"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>

    <!-- Titre de l'axe -->
    <text x="116" y="52" font-size="10" font-style="italic"
          fill="var(--figure-ink-soft)">énergie libérée / réaction (échelle log)</text>

    <!-- Graduations majeures, étiquetées (n = 0, 3, 6, 9) -->
    <line x1="88" y1="400" x2="100" y2="400" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="84" y="403.5" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">1 eV</text>

    <line x1="88" y1="292" x2="100" y2="292" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="84" y="295.5" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">1 keV</text>

    <line x1="88" y1="184" x2="100" y2="184" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="84" y="187.5" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">1 MeV</text>

    <line x1="88" y1="76" x2="100" y2="76" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="84" y="79.5" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">1 GeV</text>

    <!-- Graduations mineures, non étiquetées (n = 1,2,4,5,7,8) -->
    <line x1="95" y1="364" x2="100" y2="364" stroke="var(--figure-ink-soft)" stroke-width="0.9"/>
    <line x1="95" y1="328" x2="100" y2="328" stroke="var(--figure-ink-soft)" stroke-width="0.9"/>
    <line x1="95" y1="256" x2="100" y2="256" stroke="var(--figure-ink-soft)" stroke-width="0.9"/>
    <line x1="95" y1="220" x2="100" y2="220" stroke="var(--figure-ink-soft)" stroke-width="0.9"/>
    <line x1="95" y1="148" x2="100" y2="148" stroke="var(--figure-ink-soft)" stroke-width="0.9"/>
    <line x1="95" y1="112" x2="100" y2="112" stroke="var(--figure-ink-soft)" stroke-width="0.9"/>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — données chimique : une barre minuscule
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <rect x="165" y="378.3" width="70" height="21.7"
          fill="var(--figure-accent)" fill-opacity="0.5"
          stroke="var(--figure-accent)" stroke-width="1.3"/>

    <text x="200" y="352" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-ink)">réaction chimique</text>
    <text x="200" y="368" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-accent)">≈ 4 eV / molécule</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — données nucléaire : deux barres qui dominent
       tout le graphique (fusion D-T, fission ²³⁵U)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Fusion deutérium-tritium -->
    <rect x="335" y="139.2" width="70" height="260.8"
          fill="var(--figure-accent)" fill-opacity="0.5"
          stroke="var(--figure-accent)" stroke-width="1.3"/>

    <text x="370" y="98" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-ink)">fusion deutérium-tritium</text>
    <text x="370" y="114" text-anchor="middle" font-size="9" font-style="italic"
          fill="var(--figure-ink-soft)"><tspan dy="-4" font-size="7">2</tspan><tspan
          dy="4">H + </tspan><tspan dy="-4" font-size="7">3</tspan><tspan
          dy="4">H → </tspan><tspan dy="-4" font-size="7">4</tspan><tspan
          dy="4">He + n</tspan></text>
    <text x="370" y="130" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-accent)">17,6 MeV = 17,6×10<tspan
          dy="-4" font-size="7.5">6</tspan><tspan dy="4"> eV</tspan></text>

    <!-- Fission de l'uranium 235 -->
    <rect x="475" y="103.4" width="70" height="296.6"
          fill="var(--figure-accent)" fill-opacity="0.5"
          stroke="var(--figure-accent)" stroke-width="1.3"/>

    <text x="510" y="58" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-ink)">fission de l’uranium 235</text>
    <text x="510" y="74" text-anchor="middle" font-size="9" font-style="italic"
          fill="var(--figure-ink-soft)">n + <tspan dy="-4" font-size="7">235</tspan><tspan
          dy="4">U → </tspan><tspan dy="-4" font-size="7">141</tspan><tspan
          dy="4">Ba + </tspan><tspan dy="-4" font-size="7">92</tspan><tspan
          dy="4">Kr + 3n</tspan></text>
    <text x="510" y="90" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-accent)">173 MeV = 173×10<tspan
          dy="-4" font-size="7.5">6</tspan><tspan dy="4"> eV</tspan></text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — lecture : l'accolade chimique → nucléaire,
       le facteur ×10⁷ à 10⁸ — le lien explicite avec l'accroche (R0)
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="200" y1="400" x2="200" y2="428"
          stroke="var(--figure-accent)" stroke-width="1.4"/>
    <line x1="510" y1="400" x2="510" y2="428"
          stroke="var(--figure-accent)" stroke-width="1.4"/>
    <line x1="200" y1="428" x2="500" y2="428"
          stroke="var(--figure-accent)" stroke-width="1.8"/>
    <polygon points="510,428 500,423.5 500,432.5" fill="var(--figure-accent)"/>

    <text x="355" y="447" text-anchor="middle" font-size="12.5" font-weight="700"
          fill="var(--figure-accent)">×10<tspan dy="-5" font-size="9">7</tspan><tspan
          dy="5"> à 10</tspan><tspan dy="-5" font-size="9">8</tspan></text>
    <text x="355" y="461" text-anchor="middle" font-size="9.5" font-style="italic"
          fill="var(--figure-ink-soft)">le même facteur qu’à l’accroche</text>
  </g><!-- /step-4 -->

</svg>
