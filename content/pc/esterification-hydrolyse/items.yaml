    correct_feedback: >
      $n_0$ n'apparaît nulle part dans $K = \dfrac{\tau^2}{(1-\tau)^2}$ :
      doubler les quantités initiales double la quantité d'ester produite,
      mais laisse $\tau$ inchangé.
    solution: |
      le chapitre 4 montre que $n_0$ se simplifie complètement dans
      l'expression de $K$ : $\tau$ ne dépend que de $K$ (donc de la réaction
      et de la température), jamais de la quantité de matière engagée.

