      - id: C
        text: "$K = 16$"
        correct: true
      - id: D
        text: "$K \\approx 0{,}44$"
        correct: false
        feedback: >
          Cette valeur vient d'avoir divisé par la quantité totale initiale
          ($0{,}60$ mol) plutôt que par $n_0$ d'un seul réactif.
    correct_feedback: >
      $\tau = \dfrac{0{,}24}{0{,}30} = 0{,}8$, donc
