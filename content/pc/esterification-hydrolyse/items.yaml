        feedback: >
          Cette valeur inverse le rapport produits/réactifs : $K$ place
          l'ester et l'eau au numérateur, l'acide et l'alcool au
          dénominateur.
      - id: B
        text: "$K \\approx 0{,}18$"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          Cette valeur vient d'avoir divisé par la quantité totale initiale
          ($1{,}0$ mol) plutôt que par $n_0$ d'un seul réactif :
          $\tau = \dfrac{0{,}30}{0{,}50} = 0{,}6$.
      - id: C
        text: "$K = 2{,}25$"
        correct: true
      - id: D
        text: "$K = 1{,}5$"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          Cette valeur vient d'avoir oublié d'élever $\dfrac{\tau}{1-\tau}$
          au carré : $K = \left(\dfrac{\tau}{1-\tau}\right)^2$.
    correct_feedback: >
      $\tau = \dfrac{0{,}30}{0{,}50} = 0{,}6$, donc
      $K = \dfrac{\tau^2}{(1-\tau)^2} = \dfrac{0{,}36}{0{,}16} = 2{,}25$.
    solution: |
      $n(acide)_{eq} = n(alcool)_{eq} = 0{,}50 - 0{,}30 = 0{,}20$ mol, donc
      $K = \dfrac{0{,}30 \times 0{,}30}{0{,}20 \times 0{,}20} = 2{,}25$.

  # ── catalyseur : structure/expression de K (variant, R4) ────────────────────
  - id: EH-17
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.catalyseur-augmente-rendement
    stem: >
      Laquelle de ces affirmations sur le catalyseur acide (par exemple
      l'acide sulfurique) utilisé dans une estérification est correcte ?
    type: mcq
    choices:
      - id: A
        text: "Il figure dans l'expression de $K$, ce qui explique qu'il change la position de l'équilibre."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.catalyseur-augmente-rendement
        feedback: >
          Un catalyseur ne figure jamais dans l'expression de $K$ ni dans
          l'équation bilan : il n'a aucune prise sur la position de
          l'équilibre.
      - id: B
        text: "Il accélère seulement l'estérification, pas l'hydrolyse, ce qui déplace l'équilibre vers la droite."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.catalyseur-augmente-rendement
        feedback: >
          Un catalyseur accélère les deux sens à la fois, dans les mêmes
          proportions : il ne favorise ni l'estérification ni l'hydrolyse
          plus que l'autre.
      - id: C
        text: "Il permet d'atteindre un taux d'avancement final supérieur à celui obtenu sans catalyseur, mais seulement si on chauffe en même temps."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.catalyseur-augmente-rendement
        feedback: >
          Chauffer est, comme le catalyseur, un facteur cinétique :
          combiner les deux accélère l'arrivée à l'équilibre, mais ne
          change jamais sa position.
      - id: D
        text: "Il figure dans le mécanisme mais jamais dans l'expression de $K$ ; il accélère les deux sens (estérification et hydrolyse) dans les mêmes proportions."
        correct: true
    correct_feedback: >
      Le catalyseur agit uniquement sur la vitesse : il accélère
      l'estérification et l'hydrolyse à parts égales, sans jamais apparaître
      dans $K$.
    solution: |
      Un catalyseur ouvre un chemin réactionnel qui demande moins d'énergie,
      pour les deux réactions à la fois, sans changer leur rapport de
      vitesses - c'est justement ce rapport qui fixe $K$.

  # ── proportion des réactifs : ajout d'ester, direction de Qr (R5) ───────────
  - id: EH-18
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.confond-k-et-qr
    stem: >
      Un système acide + alcool + ester + eau est à l'équilibre ($K=4$). On
      ajoute, sans changer le volume, une certaine quantité d'ester pur au
      mélange. Que se passe-t-il ?
    type: mcq
    choices:
      - id: A
        text: "$Q_r$ augmente au-dessus de $K$ : le système évolue dans le sens inverse (hydrolyse) pour le rejoindre, donc une partie de l'ester ajouté est reconsommée."
        correct: true
      - id: B
        text: "$Q_r$ diminue en dessous de $K$ : le système évolue dans le sens direct, ce qui produit encore plus d'ester."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.confond-k-et-qr
        feedback: >
          L'ester figure au numérateur de $Q_r$ : en ajouter augmente $Q_r$,
          ce n'est pas en retirer qui le diminue.
      - id: C
        text: "Rien ne change : $K$ reste fixe à température constante, donc l'ajout d'ester ne peut pas affecter la composition finale."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.confond-k-et-qr
        feedback: >
          C'est confondre $K$ (fixe à température constante) et $Q_r$ (qui
          varie dès que les concentrations changent, y compris quand on en
          ajoute).
      - id: D
        text: "Le système reste à l'équilibre, car ajouter un produit ne fait qu'accélérer la réaction inverse sans en changer l'issue finale."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.cinetique-thermodynamique-confondues
        feedback: >
          Ajouter de l'ester change la composition du système, donc $Q_r$ :
          ce n'est pas un effet cinétique comme le catalyseur, c'est un
          déplacement réel.
    correct_feedback: >
      L'ester figure au numérateur de $Q_r$ : en ajouter fait dépasser
      $Q_{r,i} > K$, ce qui relance le système en sens inverse (hydrolyse).
    solution: |
      $Q_r = \dfrac{[ester][eau]}{[acide][alcool]}$ : ajouter de l'ester
      augmente $[ester]$, donc $Q_r$ dépasse $K$, et le système évolue en
      sens inverse pour reconsommer une partie de l'ester ajouté.

  # ── nomenclature bac-style, couple frais (R6) ────────────────────────────────
  - id: EH-19
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.nomenclature-radicaux-inverses
    stem: >
      On réalise l'estérification entre l'acide butanoïque
      $CH_3CH_2CH_2COOH$ et le méthanol $CH_3OH$. Quel est le nom de
      l'ester obtenu ?
    type: mcq
    choices:
      - id: A
        text: "Méthanoate de butyle"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.nomenclature-radicaux-inverses
        feedback: >
          Ce nom inverse les deux radicaux : « méthanoate de butyle »
          correspondrait à l'acide méthanoïque et au butan-1-ol, l'inverse
          des réactifs donnés.
      - id: B
        text: "Butanoate de méthyle"
        correct: true
      - id: C
        text: "Butyloate de méthanyle"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.nomenclature-radicaux-inverses
        feedback: >
          Ces suffixes n'existent pas : c'est le radical de l'acide qui
          prend « -oate », celui de l'alcool qui prend « -yle ».
      - id: D
        text: "Acide butanoïque de méthanol"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.nomenclature-radicaux-inverses
        feedback: >
          Ce choix recopie les noms des réactifs sans appliquer la règle de
          nomenclature de l'ester.
    correct_feedback: >
      L'acide butanoïque donne « butanoate » ; le méthanol donne « méthyle ».
      L'ester s'appelle donc butanoate de méthyle.
    solution: |
      Radical de l'acide : butanoïque $\rightarrow$ butanoate. Radical de
      l'alcool : méthanol $\rightarrow$ méthyle. Assemblés : butanoate de
      méthyle, soit $CH_3CH_2CH_2COOCH_3$.

  # ── rendement bac-style : calcul de K, chiffres frais (R6) ──────────────────
  - id: EH-20
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
    stem: >
      Un chimiste réalise une estérification simple entre un acide
      carboxylique et un alcool, tous deux à chaîne linéaire, en partant de
      $n_0 = 0{,}30$ mol de chacun. À l'équilibre, il mesure
      $n(ester)_{eq} = 0{,}24$ mol. Quelle est la valeur de la constante
      d'équilibre $K$ de cette réaction ?
    type: mcq
    choices:
      - id: A
        text: "$K \\approx 0{,}06$"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          Cette valeur inverse le rapport produits/réactifs : $K$ place
          l'ester et l'eau au numérateur, l'acide et l'alcool au
          dénominateur.
      - id: B
        text: "$K = 4$"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          Cette valeur vient d'avoir oublié d'élever $\dfrac{\tau}{1-\tau}
          = 4$ au carré : $K = 4^2 = 16$.
      - id: C
        text: "$K = 16$"
        correct: true
      - id: D
        text: "$K \\approx 0{,}44$"
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          Cette valeur vient d'avoir divisé par la quantité totale initiale
          ($0{,}60$ mol) plutôt que par $n_0$ d'un seul réactif.
    correct_feedback: >
      $\tau = \dfrac{0{,}24}{0{,}30} = 0{,}8$, donc
      $K = \dfrac{\tau^2}{(1-\tau)^2} = \dfrac{0{,}64}{0{,}04} = 16$.
    solution: |
      $n(acide)_{eq} = n(alcool)_{eq} = 0{,}30 - 0{,}24 = 0{,}06$ mol, donc
      $K = \dfrac{0{,}24 \times 0{,}24}{0{,}06 \times 0{,}06} = 16$.

  # ── synthèse bac-style : élimination de l'ester, pas seulement l'eau (R6) ───
  - id: EH-21
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.cinetique-thermodynamique-confondues
    stem: >
      Dans certains montages, l'ester formé est plus volatil que les autres
      espèces du mélange et peut être distillé au fur et à mesure de sa
      formation, exactement comme on distillerait l'eau. Un élève affirme :
      « Retirer l'ester ne peut pas améliorer le rendement, puisque c'est
      justement l'ester qu'on veut obtenir - le retirer revient à s'en
      priver. » Cette affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: "Oui, l'élève a raison : retirer le produit qu'on cherche à obtenir ne peut jamais améliorer un rendement, quel que soit le mécanisme."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.confond-k-et-qr
        feedback: >
          Il faut distinguer l'ester présent dans le ballon à un instant
          donné de la quantité totale récupérée dans le distillat, qui,
          elle, augmente.
      - id: B
        text: "Non, mais seulement parce que retirer l'ester revient exactement au même que retirer l'eau : les deux gestes n'ont d'effet que sur la vitesse, pas sur le rendement final."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.cinetique-thermodynamique-confondues
        feedback: >
          Retirer l'ester ou l'eau diminue le numérateur de $Q_r$, ce qui
          déplace réellement l'équilibre - ce n'est pas un simple effet de
          vitesse comme le catalyseur.
      - id: C
        text: "Non, mais seulement si on retire aussi une partie de l'eau en même temps ; retirer l'ester seul, sans retirer l'eau, ne change rien à $Q_r$."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.confond-k-et-qr
        feedback: >
          $Q_r$ dépend du produit $[ester][eau]$ : diminuer $[ester]$ seul
          suffit déjà à faire repasser $Q_r$ sous $K$.
      - id: D
        text: "Non : retirer l'ester du mélange (par exemple par distillation continue) diminue $[ester]$ dans $Q_r$, donc $Q_{r,i}$ repasse sous $K$ et relance l'estérification, qui reforme de l'ester en continu - la quantité totale d'ester récupérée dans le distillat augmente."
        correct: true
    correct_feedback: >
      Retirer l'ester diminue $[ester]$ dans $Q_r$, donc relance
      l'estérification pour en reformer : la quantité totale récupérée dans
      le distillat augmente.
    solution: |
      Retirer l'ester ou l'eau a le même effet sur $Q_r$ : les deux figurent
      au numérateur, donc les retirer fait repasser $Q_{r,i}$ sous $K$ et
      relance la réaction directe en continu.

  # ── chauffage bref puis refroidissement : toujours pas de déplacement ───────
  # (floor-closing: chauffage-augmente-rendement 2→3)
  - id: EH-22
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.chauffage-augmente-rendement
    stem: >
      On reprend le même mélange équimolaire acide + alcool (estérification
      simple, $K=4$), mais cette fois on compare deux protocoles différents :
      le flacon P est chauffé à reflux en continu jusqu'à stabilisation ; le
      flacon Q est chauffé très fort pendant seulement les dix premières
      minutes, puis laissé refroidir et se stabiliser à température
      ambiante, sans catalyseur. Comment se comparent les taux d'avancement
      finaux $\tau_P$ et $\tau_Q$, une fois les deux flacons stabilisés ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau_Q > \\tau_P$ : les dix minutes de chauffage intense ont permis de « pousser » la réaction plus loin, avant que le refroidissement ne fige cet avancement supplémentaire."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.chauffage-augmente-rendement
        feedback: >
          Modèle « le chauffage déplace l'équilibre » à nouveau - même bref,
          un passage à haute température n'entraîne aucun déplacement
          permanent : l'estérification est quasi athermique, donc $\tau$
          dépend de $K$, qui varie à peine avec la température, à n'importe
          quel instant du protocole.
      - id: B
        text: "$\\tau_P \\approx \\tau_Q \\approx 66{,}7\\,\\%$ : dans les deux cas, l'équilibre final ne dépend que de $K$ à la température finale (ambiante), pas du chemin thermique suivi pour y arriver."
        correct: true
      - id: C
        text: "$\\tau_P > \\tau_Q$ : seul un chauffage continu jusqu'au bout permet d'atteindre le taux maximal ; un chauffage interrompu laisse la réaction inachevée à un niveau plus bas."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.chauffage-augmente-rendement
        feedback: >
          Le chauffage ne fait qu'accélérer l'arrivée à l'équilibre, dans
          les deux flacons ; qu'il soit maintenu ou interrompu ne change
          rien à la composition finale, seulement au temps mis pour
          l'atteindre.
      - id: D
        text: "Impossible de comparer sans connaître précisément la durée exacte pendant laquelle chaque flacon a mis pour se stabiliser."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.cinetique-thermodynamique-confondues
        feedback: >
          Le temps mis pour atteindre l'équilibre est une information
          cinétique, sans lien avec sa position : $\tau$ ne dépend que de
          $K$ à la température finale, jamais du chemin ou de la durée
          empruntés pour y parvenir.
    correct_feedback: >
      L'estérification étant quasi athermique, $K$ varie à peine avec la
      température, et surtout l'équilibre final ne dépend que de la
      température À LAQUELLE il se stabilise (ici, ambiante pour les deux),
      pas du chemin thermique suivi. $\tau_P \approx \tau_Q \approx 2/3$.
    solution: |
      Ce que change une différence de protocole thermique, c'est uniquement
      la vitesse à laquelle chaque flacon atteint son équilibre - jamais la
      composition de cet équilibre, qui ne dépend que de $K$ à la
      température où le système se stabilise. Les deux flacons finissent
      par se stabiliser à peu près à la même composition, car $K$ à reflux
      et $K$ à température ambiante sont quasiment égaux (réaction quasi
      athermique) : $\tau_P \approx \tau_Q \approx 2/3$, exactement comme
      aux chapitres précédents. Seule la durée pour s'y stabiliser diffère.

  # ── temps + catalyseur ne rendent jamais la réaction totale ─────────────────
  # (floor-closing: esterification-totale 2→3)
  - id: EH-23
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.esterification-totale
    stem: >
      Un élève, avant d'avoir étudié ce chapitre, fait le raisonnement
      suivant : « Si on laisse le ballon à reflux deux fois plus longtemps -
      quatre heures au lieu de deux -, on obtiendra deux fois plus d'ester ;
      et si on chauffe suffisamment longtemps, disons plusieurs jours, on
      finira par convertir la totalité de l'acide initial en ester. » Que
      peut-on dire de ce raisonnement, à la lumière de ce que tu as appris
      sur l'estérification ?
    type: mcq
    choices:
      - id: A
        text: "Il est vrai sur les deux points : l'estérification progresse tant qu'on chauffe, et finit nécessairement par consommer tout l'acide si on patiente assez longtemps."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.esterification-totale
        feedback: >
          Modèle « l'estérification finit par être totale ». Non : l'ester
          et l'eau formés réagissent en sens inverse (hydrolyse) dès qu'ils
          apparaissent, ce qui fige la composition à un équilibre bien avant
          l'épuisement de l'acide - quelle que soit la durée de chauffage.
      - id: B
        text: "Il devient vrai si on ajoute, en plus, davantage de catalyseur acide en cours de route : c'est la combinaison temps + catalyseur qui permettrait d'épuiser l'acide."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.catalyseur-augmente-rendement
        feedback: >
          Le catalyseur ne fait qu'accélérer l'arrivée à l'équilibre, il ne
          le déplace jamais, quelle que soit la quantité utilisée ou la
          durée écoulée : combiner temps et catalyseur ne fait qu'atteindre
          plus vite le même équilibre incomplet.
      - id: C
        text: "Il est faux sur les deux points : une fois l'équilibre atteint (bien avant quatre heures, en général), prolonger le chauffage ne change plus rien à la composition du mélange - ni l'acide ni l'alcool ne disparaissent jamais complètement, quelle que soit la durée."
        correct: true
      - id: D
        text: "Il est faux seulement sur le premier point (doubler la durée ne double pas l'ester) ; le second point reste vrai, il faut juste chauffer beaucoup plus longtemps que quelques jours."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.esterification-totale
        feedback: >
          Le second point reste tout aussi faux, quelle que soit la durée
          envisagée : les quatre espèces coexistent indéfiniment à
          l'équilibre, l'acide et l'alcool ne disparaissant jamais
          complètement, pas même après un temps extrêmement long.
    correct_feedback: >
      Les deux affirmations de l'élève supposent une réaction totale, qui
      n'existe pas ici : l'équilibre est atteint bien avant que quatre
      heures ne s'écoulent, et prolonger le chauffage indéfiniment ne fait
      jamais disparaître complètement l'acide et l'alcool.
    solution: |
      Ce raisonnement calque, à tort, l'estérification sur une réaction
      totale et proportionnelle au temps. En réalité, dès que de l'ester et
      de l'eau se forment, ils peuvent réagir en sens inverse (hydrolyse) :
      le système atteint un état d'équilibre où les quatre espèces
      coexistent indéfiniment, généralement en quelques heures, bien avant
      que « quatre heures » ou « plusieurs jours » ne changent quoi que ce
      soit. Doubler la durée de chauffage, une fois l'équilibre atteint, ne
      double donc pas la quantité d'ester - et aucune durée, aussi longue
      soit-elle, ne fait disparaître complètement l'acide et l'alcool.

  # ── avancement maximal vs avancement final, calcul direct (nouveau) ─────────
  # (floor-closing: avancement-final-egale-maximal 0→3, item 1/3)
  - id: EH-24
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
    stem: >
      Pour une estérification simple, on part de $n_0 = 1{,}0$ mol d'acide
      et $n_0 = 1{,}0$ mol d'alcool ($K=4$, donc $\tau \approx 0{,}667$,
      comme au chapitre 4). Quelles sont les valeurs de l'avancement maximal
      $x_{max}$ (si la réaction était totale) et de l'avancement final $x_f$
      (réellement atteint à l'équilibre) ?
    type: mcq
    choices:
      - id: A
        text: "$x_{max} = x_f \\approx 0{,}667$ mol : l'avancement maximal, c'est justement la valeur atteinte à l'équilibre, par définition."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          C'est confondre les deux définitions. $x_{max}$ est une borne
          stoechiométrique théorique (ce qu'on obtiendrait si toute la
          réaction, l'acide entier, était consommé) ; $x_f$ est ce que la
          réaction atteint réellement à l'équilibre. Ici $x_{max}=1{,}0$
          mol, $x_f\approx0{,}667$ mol : ce sont deux valeurs différentes,
          pas la même par définition.
      - id: B
        text: "$x_{max} = 0{,}667$ mol et $x_f = 1{,}0$ mol : c'est l'avancement final qui représente la limite stoechiométrique complète, une fois l'équilibre atteint."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          Les deux valeurs sont inversées, et le sens même de $x_{max}$ est
          mal compris : $x_{max}=n_0=1{,}0$ mol est la borne stoechiométrique
          (fixe, indépendante de l'équilibre), tandis que $x_f=\tau n_0
          \approx 0{,}667$ mol est toujours inférieur ou égal à $x_{max}$,
          jamais supérieur.
      - id: C
        text: "$x_{max} = 4{,}0$ mol, en confondant l'avancement maximal avec la valeur de $K$."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          $K=4$ est une constante d'équilibre, sans dimension et sans lien
          direct avec une quantité de matière en mol. $x_{max}$ se lit
          uniquement à partir de la stoechiométrie et des quantités
          initiales ($x_{max}=n_0=1{,}0$ mol ici), jamais à partir de $K$.
      - id: D
        text: "$x_{max} = 1{,}0$ mol (limité par l'acide, réactif en quantité égale à l'alcool) ; $x_f = \\tau \\, n_0 \\approx 0{,}667$ mol, strictement inférieur à $x_{max}$."
        correct: true
    correct_feedback: >
      $x_{max}=n_0=1{,}0$ mol est une borne stoechiométrique fixe ;
      $x_f=\tau n_0\approx0{,}667$ mol est ce que la réaction, limitée par
      l'équilibre, atteint réellement - $x_f<x_{max}$, donc
      $\tau=x_f/x_{max}<1$.
    solution: |
      L'avancement maximal $x_{max}$ se lit sur la stoechiométrie seule, en
      imaginant la réaction totale : ici, l'acide (comme l'alcool) est en
      quantité $n_0=1{,}0$ mol, donc $x_{max}=1{,}0$ mol.

      L'avancement final $x_f$ est celui réellement atteint, fixé par $K$
      via $\tau=x_f/x_{max}=x_f/n_0\approx0{,}667$, donc
      $x_f\approx0{,}667$ mol.

      $x_f < x_{max}$ : il reste, à l'équilibre, $n_0 - x_f \approx
      0{,}333$ mol d'acide et d'alcool non convertis - la signature d'une
      réaction limitée.

  # ── équilibre atteint ≠ réactifs épuisés, conceptuel (nouveau) ──────────────
  # (floor-closing: avancement-final-egale-maximal 0→3, item 2/3)
  - id: EH-25
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
    stem: >
      Après un long moment de chauffage à reflux, la quantité d'ester dans
      le ballon cesse d'augmenter : le système a atteint son état
      d'équilibre. Peut-on en conclure que tout l'acide initial a bien été
      transformé, c'est-à-dire que l'avancement a atteint sa valeur maximale
      possible ?
    type: mcq
    choices:
      - id: A
        text: "Oui : puisque la quantité d'ester ne bouge plus, c'est qu'il n'y a plus d'acide disponible pour continuer la réaction."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          C'est confondre « la composition ne change plus » (équilibre) et
          « il n'y a plus de réactif » (avancement maximal atteint). Ici,
          l'acide et l'alcool restent présents en quantité non nulle et
          détectable, aux côtés de l'ester et de l'eau, indéfiniment.
      - id: B
        text: "Non : atteindre l'équilibre signifie seulement que la composition ne change plus, pas que les réactifs sont épuisés. Il reste de l'acide et de l'alcool non transformés, aux côtés de l'ester et de l'eau."
        correct: true
      - id: C
        text: "Oui, car un système chimique cesse toujours d'évoluer précisément au moment où l'un des réactifs est épuisé."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          Ce n'est vrai que pour une réaction totale. Ici, la réaction est
          limitée : elle cesse d'évoluer (en apparence) parce que les
          vitesses des deux sens (estérification, hydrolyse) s'égalisent,
          bien avant que l'acide ne soit épuisé.
      - id: D
        text: "On ne peut pas conclure avec certitude, mais il est raisonnable de penser qu'il ne reste que des traces négligeables d'acide, ce qui revient à peu près à un avancement maximal."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          Ce n'est pas une question de « traces négligeables » : pour
          l'estérification simple étudiée, la proportion d'acide restant à
          l'équilibre est loin d'être négligeable (de l'ordre du tiers de la
          quantité initiale, pour $K=4$) - l'avancement final $x_f$ reste
          nettement inférieur à $x_{max}$, pas juste « à peu près » égal.
    correct_feedback: >
      L'équilibre fige la composition, mais ne l'amène jamais à
      l'épuisement des réactifs : il reste toujours de l'acide et de
      l'alcool, aux côtés de l'ester et de l'eau - l'avancement final $x_f$
      reste strictement inférieur à l'avancement maximal $x_{max}$.
    solution: |
      Que l'odeur (ou la quantité d'ester) cesse de changer signale
      seulement que les vitesses de l'estérification et de l'hydrolyse sont
      devenues égales : c'est la définition de l'équilibre, pas celle d'une
      réaction totale. Un test chimique, à cet instant, révèle
      systématiquement la présence résiduelle d'acide et d'alcool :
      l'avancement final $x_f$ est donc strictement inférieur à
      l'avancement maximal stoechiométrique $x_{max}$, quel que soit le
      temps écoulé.

  # ── avancement maximal vs final, bac-style avec chiffres frais (nouveau) ────
  # (floor-closing: avancement-final-egale-maximal 0→3, item 3/3)
  - id: EH-26
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
    stem: >
      Un chimiste réalise une estérification simple entre un acide et un
      alcool à chaîne linéaire, en partant de $n_0=0{,}40$ mol de chacun.
      Après un temps très long, une chromatographie confirme que le système
      a atteint son état d'équilibre, avec $n(ester)_{eq}=0{,}32$ mol.
      Peut-on affirmer que l'avancement a atteint sa valeur maximale
      $x_{max}$ ? Justifie à l'aide d'un calcul.
    type: mcq
    choices:
      - id: A
        text: "Oui : puisque le système est à l'équilibre après un temps très long, cela signifie que la réaction est allée à son terme, donc $x_f=x_{max}=0{,}40$ mol."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          « Équilibre » et « terme de la réaction » ne sont pas synonymes
          ici. Le fait mesuré ($n(ester)_{eq}=0{,}32$ mol, pas $0{,}40$
          mol) montre justement que $x_f<x_{max}$ : la réaction s'est
          arrêtée à un équilibre, pas à l'épuisement de l'acide.
      - id: B
        text: "On ne peut rien dire sur $x_{max}$ sans connaître d'abord $K$."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.erreur-algebre-k-tau
        feedback: >
          $x_{max}$ ne dépend que de la stoechiométrie et des quantités
          initiales ($x_{max}=n_0=0{,}40$ mol ici), jamais de $K$. C'est
          $\tau$ (et donc, indirectement, $K$) qui dépend de la position de
          l'équilibre - pas $x_{max}$, qui est une donnée de départ.
      - id: C
        text: "Non : $x_{max}=n_0=0{,}40$ mol, alors que l'avancement réellement atteint est $x_f=n(ester)_{eq}=0{,}32$ mol $< x_{max}$ ; le taux d'avancement final vaut $\\tau=x_f/x_{max}=0{,}80<1$."
        correct: true
      - id: D
        text: "Oui, car $0{,}32$ mol d'ester formé est déjà très proche de $0{,}40$ mol : la différence est négligeable, donc on peut considérer que $x_f\\approx x_{max}$."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.avancement-final-egale-maximal
        feedback: >
          $\tau=0{,}32/0{,}40=0{,}80$, soit $80\,\%$ : ce n'est pas
          négligeable, il reste $20\,\%$ de l'acide (et de l'alcool) non
          convertis, soit $0{,}080$ mol chacun. Sur le plan des principes,
          « proche » et « égal » restent deux choses différentes :
          $x_f<x_{max}$ reste strictement vrai.
    correct_feedback: >
      $x_{max}=n_0=0{,}40$ mol (borne stoechiométrique) ; $x_f=0{,}32$ mol
      (avancement réellement atteint à l'équilibre) : $x_f<x_{max}$, donc
      $\tau=0{,}80<1$. Il reste $0{,}080$ mol d'acide et d'alcool non
      convertis.
    solution: |
      L'avancement maximal se lit sur la stoechiométrie seule : les deux
      réactifs étant en quantités égales, $x_{max}=n_0=0{,}40$ mol.

      L'avancement final, mesuré, est $x_f=n(ester)_{eq}=0{,}32$ mol.

      $\tau=\dfrac{x_f}{x_{max}}=\dfrac{0{,}32}{0{,}40}=0{,}80$.

      Comme $\tau<1$, l'équilibre est atteint AVANT l'épuisement de
      l'acide : il reste $n_0-x_f=0{,}080$ mol d'acide (et autant d'alcool)
      non transformés, malgré le temps très long écoulé.

