notion: esterification-hydrolyse
skill_code: pc_esterification_hydrolyse
misconceptions: []

items:

  # ── confondre accélérer (catalyseur) et déplacer l'équilibre (canonique) ────
  - id: EH-1
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Deux flacons contiennent le même mélange équimolaire d'acide éthanoïque
      et d'éthanol (estérification simple, $K=4$). Le flacon A est laissé à
      température ambiante, sans catalyseur ; le flacon B reçoit quelques
      gouttes d'acide sulfurique concentré comme catalyseur. Une fois les deux
      flacons stabilisés, comment se comparent les taux d'avancement finaux
      $\tau_A$ et $\tau_B$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau_A = \\tau_B \\approx 66{,}7\\,\\%$ ; seul le temps nécessaire pour atteindre l'équilibre diffère entre les deux flacons."
        correct: true
      - id: B
        text: "$\\tau_B > \\tau_A$, car le catalyseur favorise la formation de l'ester."
        correct: false
        feedback: >
          Un catalyseur acide accélère l'estérification ET l'hydrolyse, dans
          les mêmes proportions - il ne favorise aucun des deux sens plus que
          l'autre. Le rapport de leurs vitesses, qui fixe la position de
          l'équilibre, reste inchangé : $\tau_B$ vaut la même chose que
          $\tau_A$, atteint simplement plus vite.
      - id: C
        text: "$\\tau_B > \\tau_A$, car le catalyseur déplace l'équilibre vers la droite."
        correct: false
        feedback: >
          Un catalyseur n'apparaît jamais dans l'expression de la constante
          d'équilibre $K$ : il n'a aucune prise sur la position de
          l'équilibre, seulement sur la vitesse à laquelle le système
          l'atteint. « Déplacer l'équilibre » et « accélérer la réaction »
          sont deux effets différents, et le catalyseur ne produit que le
          second.
      - id: D
        text: "On ne peut pas comparer $\\tau_A$ et $\\tau_B$ sans connaître le temps exact mis par chaque flacon pour se stabiliser."
        correct: false
        feedback: >
          Le temps mis pour atteindre l'équilibre n'entre pour rien dans la
          composition de cet équilibre : $\tau$ ne dépend que de $K$ (donc de
          la réaction et de la température), jamais de la vitesse à laquelle
          on y arrive.
    correct_feedback: >
      Le catalyseur accélère l'estérification et l'hydrolyse à parts égales :
      il ne change ni $K$ ni $\tau$, seulement le temps nécessaire pour
      atteindre le même équilibre. $\tau_A = \tau_B \approx 2/3$.
    solution: |
      Un catalyseur ouvre un chemin réactionnel qui demande moins d'énergie,
      pour les DEUX réactions à la fois (estérification et hydrolyse). Il
      accélère donc les deux vitesses dans les mêmes proportions, sans changer
      leur rapport - qui est justement ce qui fixe $K$. Le catalyseur ne
      figure dans aucune expression de $K$ ou de $Q_r$ : il n'a aucun effet
      sur la position de l'équilibre.

      **Conclusion :** $\tau_A = \tau_B \approx 66{,}7\,\%$. Seule la durée
      pour atteindre l'équilibre diffère (plusieurs jours contre environ une
      heure).

  # ── confondre accélérer (chauffage) et déplacer l'équilibre (variant) ───────
  - id: EH-2
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Le même mélange équimolaire (acide + alcool, $K=4$) est chauffé à
      reflux dans un flacon C, sans catalyseur, plutôt que laissé à
      température ambiante comme dans le flacon A ($\tau_A \approx 66{,}7\,\%$).
      Une fois l'équilibre atteint dans le flacon C, comment se compare
      $\tau_C$ à $\tau_A$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau_C \\approx \\tau_A \\approx 66{,}7\\,\\%$ : le chauffage accélère l'estérification et l'hydrolyse dans les mêmes proportions, et la réaction est quasi athermique."
        correct: true
      - id: B
        text: "$\\tau_C > \\tau_A$, car la chaleur apportée favorise la formation des produits."
        correct: false
        feedback: >
          Le chauffage est un facteur cinétique : il augmente la fréquence et
          l'énergie des chocs entre entités, dans les deux sens à la fois.
          Comme l'estérification (et l'hydrolyse) sont des réactions quasi
          athermiques, chauffer ne déplace quasiment pas $K$ - la chaleur
          apportée n'avantage pas la formation des produits plus que celle
          des réactifs.
      - id: C
        text: "$\\tau_C < \\tau_A$, car chauffer favorise toujours la réaction inverse."
        correct: false
        feedback: >
          Rien n'indique ici que l'hydrolyse serait favorisée par la chaleur :
          l'estérification est une réaction quasi athermique, donc sa
          constante d'équilibre $K$ varie très peu avec la température, dans
          un sens comme dans l'autre. Le chauffage reste, dans ce cas, un
          levier essentiellement cinétique.
      - id: D
        text: "Impossible à dire sans connaître précisément la vitesse de chacune des deux réactions, directe et inverse."
        correct: false
        feedback: >
          La vitesse de chaque réaction détermine le temps mis pour atteindre
          l'équilibre, pas sa position. Ici, la question porte sur $\tau$ à
          l'équilibre, qui ne dépend que de $K$ - et $K$ change à peine avec
          la température pour une réaction quasi athermique.
    correct_feedback: >
      Chauffer accélère les deux sens de la réaction à la fois (chocs
      efficaces plus fréquents et plus énergétiques), sans avantager l'un des
      deux sens plus que l'autre pour une réaction quasi athermique.
      $\tau_C \approx \tau_A \approx 2/3$.
    solution: |
      Le chauffage augmente l'agitation thermique des molécules, donc la
      fréquence des chocs ET la proportion de chocs suffisamment
      énergétiques - pour l'estérification comme pour l'hydrolyse à la fois.
      Comme la réaction dégage ou absorbe très peu de chaleur (elle est
      qualifiée d'athermique), sa constante d'équilibre $K$ ne varie
      quasiment pas avec la température.

      **Conclusion :** $\tau_C \approx \tau_A \approx 66{,}7\,\%$. Le
      chauffage raccourcit fortement le temps nécessaire pour atteindre
      l'équilibre, sans en changer la composition.

  # ── mal identifier ester vs acide/alcool dans l'équation (canonique) ────────
  - id: EH-3
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Dans l'équation
      $CH_3CH_2COOH + CH_3OH \rightleftharpoons CH_3CH_2COOCH_3 + H_2O$,
      quelle espèce est l'ester ?
    type: mcq
    choices:
      - id: A
        text: "$CH_3CH_2COOCH_3$"
        correct: true
      - id: B
        text: "$CH_3CH_2COOH$"
        correct: false
        feedback: >
          C'est l'acide propanoïque : il porte le groupe $-COOH$ seul, pas le
          groupe ester $-COO-$ relié à deux chaînes carbonées. C'est un
          réactif de l'estérification (et un produit de l'hydrolyse), pas
          l'ester.
      - id: C
        text: "$CH_3OH$"
        correct: false
        feedback: >
          C'est le méthanol : il porte le groupe hydroxyle $-OH$ seul, sans
          groupe ester. C'est l'alcool de cette réaction, pas l'ester formé.
      - id: D
        text: "$H_2O$"
        correct: false
        feedback: >
          C'est l'eau, le sous-produit de l'estérification (et le réactif de
          l'hydrolyse) - toujours $H_2O$, jamais l'espèce organique formée.
    correct_feedback: >
      L'ester est la seule espèce qui porte le groupe $-COO-$ entre deux
      chaînes carbonées : ici, $CH_3CH_2COOCH_3$ (propanoate de méthyle).
    solution: |
      Le repère ne varie jamais : l'ester est la molécule qui contient le
      groupe ester $-COO-$ pris en sandwich entre un radical issu de l'acide
      et un radical issu de l'alcool. $CH_3CH_2COOH$ est l'acide (groupe
      $-COOH$ seul), $CH_3OH$ est l'alcool (groupe $-OH$ seul), $H_2O$ est
      l'eau. Seul $CH_3CH_2COOCH_3$ correspond à la définition de l'ester.

  # ── quel geste améliore vraiment le rendement (canonique) ───────────────────
  - id: EH-4
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Pour améliorer réellement le rendement d'une estérification - c'est-à-dire
      augmenter le taux d'avancement final $\tau$ - lequel des gestes
      suivants fonctionne ?
    type: mcq
    choices:
      - id: A
        text: "Verser, dès le départ, un excès de l'un des deux réactifs."
        correct: true
      - id: B
        text: "Ajouter davantage de catalyseur acide."
        correct: false
        feedback: >
          Le catalyseur accélère l'estérification et l'hydrolyse à parts
          égales : il n'apparaît dans aucune expression de $K$, donc il ne
          change jamais $\tau$, quelle que soit la quantité utilisée.
      - id: C
        text: "Chauffer le mélange plus fort."
        correct: false
        feedback: >
          Chauffer est un facteur cinétique : ça accélère l'atteinte de
          l'équilibre, mais la réaction étant quasi athermique, $K$ (et donc
          $\tau$) ne change quasiment pas avec la température.
      - id: D
        text: "Attendre plus longtemps que le mélange se stabilise."
        correct: false
        feedback: >
          Une fois l'équilibre atteint, $\tau$ ne bouge plus : attendre
          encore ne change rien à la composition du mélange, qui est déjà
          stabilisée.
    correct_feedback: >
      Un excès de réactif augmente le dénominateur de $Q_r$ dès le mélange
      initial : $Q_{r,i}$ part en dessous de $K$, ce qui pousse le système à
      avancer davantage dans le sens direct - c'est un déplacement réel de
      l'équilibre, contrairement au catalyseur, au chauffage, ou au temps
      d'attente.
    solution: |
      Trois des quatre choix (catalyseur, chauffage, attente) jouent sur la
      VITESSE d'atteindre l'équilibre, pas sur sa position - $\tau$ reste
      identique dans les trois cas. Seul l'excès de réactif change la
      composition initiale du système, donc $Q_{r,i}$, ce qui déplace
      réellement l'équilibre et augmente $\tau$ (le rung R5 le montre
      numériquement : $66{,}7\,\%$ sans excès contre $84{,}5\,\%$ avec un
      excès d'alcool, pour $K=4$).

  # ── élimination de l'eau et confusion K/Qr (variant) ─────────────────────────
  - id: EH-5
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      On retire, par distillation et au fur et à mesure de sa formation, une
      partie de l'eau produite par une estérification en cours. Quel est
      l'effet de ce geste sur le système ?
    type: mcq
    choices:
      - id: A
        text: "$Q_r$ diminue en dessous de $K$, ce qui relance la réaction dans le sens direct : la conversion de l'acide augmente."
        correct: true
      - id: B
        text: "Aucun effet : puisque $K$ ne change jamais à température fixée, retirer de l'eau ne peut rien changer à l'issue de la réaction."
        correct: false
        feedback: >
          C'est confondre $K$ (qui reste fixe, à température constante) et
          $Q_r$ (qui varie dès que les concentrations changent, y compris
          parce qu'on en a retiré une partie à la main). Retirer de l'eau
          déséquilibre $Q_r$ par rapport à $K$, ce qui relance la réaction -
          même si $K$, lui, ne bouge pas.
      - id: C
        text: "$K$ diminue, ce qui relance la réaction dans le sens direct."
        correct: false
        feedback: >
          C'est $Q_r$ qui varie ici, pas $K$. $K$ ne dépend que de la réaction
          et de la température, jamais d'une manipulation comme le retrait
          d'un produit du mélange.
      - id: D
        text: "La réaction accélère, mais la quantité finale d'ester obtenue n'est pas modifiée."
        correct: false
        feedback: >
          C'est confondre vitesse et position de l'équilibre. Ici, c'est
          justement la position de l'équilibre qui se déplace : retirer de
          l'eau force le système à en reformer une partie, ce qui consomme
          davantage d'acide et d'alcool et augmente la quantité finale
          d'ester.
    correct_feedback: >
      Retirer de l'eau diminue le numérateur de $Q_r$ instantanément :
      $Q_{r,i}$ passe en dessous de $K$, et le système réagit dans le sens
      direct pour s'en rapprocher de nouveau - ce qui consomme davantage
      d'acide et d'alcool. Répété en continu, ce geste permet d'approcher une
      conversion quasi totale.
    solution: |
      $$Q_r = \frac{[ester][eau]}{[acide][alcool]}$$

      Retirer de l'eau diminue $[eau]$, donc diminue $Q_r$ à cet instant :
      $Q_{r,i} < K$. D'après le critère d'évolution, le système évolue alors
      dans le sens direct (estérification) pour reformer une partie de l'eau
      retirée et rejoindre $K$ à nouveau - ce qui consomme, au passage, de
      l'acide et de l'alcool supplémentaires. $K$ lui-même ne change pas : ce
      n'est pas lui qui bouge, c'est le rapport $Q_r/K$ qu'on vient de
      déséquilibrer.

  # ── nomenclature d'un ester (variant) ────────────────────────────────────────
  - id: EH-6
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Quel est le nom de l'ester formé par réaction entre l'acide méthanoïque
      $HCOOH$ et le propan-1-ol $CH_3CH_2CH_2OH$ ?
    type: mcq
    choices:
      - id: A
        text: "Méthanoate de propyle"
        correct: true
      - id: B
        text: "Propanoate de méthyle"
        correct: false
        feedback: >
          Ce nom inverse les deux radicaux : « propanoate de méthyle »
          correspondrait à un ester formé à partir de l'acide propanoïque et
          du méthanol - l'inverse des réactifs donnés dans cet énoncé. Le
          radical qui précède « -oate » vient toujours de l'acide, celui qui
          suit « de » vient toujours de l'alcool.
      - id: C
        text: "Propyloate de méthanyle"
        correct: false
        feedback: >
          Ces suffixes n'existent pas. La règle est fixe : le radical de
          l'acide (terminaison « -oïque » remplacée par « -oate ») suivi de
          « de » puis du radical de l'alcool (terminaison « -yle ») - jamais
          l'inverse des suffixes.
      - id: D
        text: "Méthanol de propanoïque"
        correct: false
        feedback: >
          Ce choix recopie simplement les noms des deux réactifs de départ,
          sans appliquer la règle de nomenclature de l'ester (radical en
          « -oate » suivi de « de » et du radical en « -yle »).
    correct_feedback: >
      L'acide méthanoïque donne le radical « méthanoate » ; le propan-1-ol
      donne le radical « propyle ». L'ester $HCOOCH_2CH_2CH_3$ s'appelle donc
      méthanoate de propyle.
    solution: |
      **Étape 1 - radical de l'acide :** acide méthanoïque $\rightarrow$
      « méthanoate » (terminaison « -oïque » remplacée par « -oate »).

      **Étape 2 - radical de l'alcool :** propan-1-ol $\rightarrow$
      « propyle » (terminaison « -yle »).

      **Étape 3 - assembler :** « méthanoate » + « de » + « propyle » =
      **méthanoate de propyle**, correspondant à la molécule
      $HCOOCH_2CH_2CH_3$.

  # ── réaction non totale : équilibre vs manque de temps/catalyseur (R0) ──────
  - id: EH-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Dans le ballon décrit en introduction, après plusieurs heures de
      chauffage à reflux, un test chimique révèle qu'il reste, indéfiniment,
      de l'acide éthanoïque et de l'éthanol non transformés, aux côtés de
      l'ester et de l'eau déjà formés. Que peut-on en conclure sur cette
      réaction ?
    type: mcq
    choices:
      - id: A
        text: "Il s'agit d'une erreur expérimentale : dans une estérification normale, l'acide et l'alcool finissent toujours par disparaître complètement."
        correct: false
        feedback: >
          Ce n'est pas une erreur : cette coexistence indéfinie des quatre
          espèces est le comportement normal de l'estérification, pas une
          anomalie à corriger.
      - id: B
        text: "La réaction n'est pas totale : elle atteint un état où les quatre espèces coexistent indéfiniment, quelle que soit la durée de chauffage."
        correct: true
      - id: C
        text: "Le chauffage n'a pas duré assez longtemps ; avec encore plus de temps, l'acide et l'alcool finiraient par disparaître."
        correct: false
        feedback: >
          Prolonger le chauffage ne change rien à cette coexistence : ce
          n'est pas une question de durée insuffisante, mais d'un état
          d'équilibre que le système ne dépasse jamais.
      - id: D
        text: "Il manque du catalyseur : avec davantage d'acide sulfurique, l'acide et l'alcool seraient entièrement consommés."
        correct: false
        feedback: >
          Le catalyseur accélère la réaction sans jamais changer sa quantité
          finale : plus de catalyseur mène au même équilibre, seulement plus
          vite.
    correct_feedback: >
      Le test chimique montre que l'acide et l'alcool subsistent
      indéfiniment aux côtés de l'ester et de l'eau : la réaction n'est pas
      totale, elle atteint un équilibre entre les quatre espèces.
    solution: |
      L'estérification et son inverse, l'hydrolyse, coexistent en permanence
      dans le même mélange, ce qui empêche l'acide et l'alcool de disparaître
      complètement, quelle que soit la durée de chauffage ou la quantité de
      catalyseur. Le système atteint un état d'équilibre, jamais une
      transformation totale.

  # ── groupe caractéristique ester, sur l'équation concrète du R0 ─────────────
  - id: EH-8
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Reprends l'équation de l'estérification donnée en introduction :
      $CH_3COOH + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + H_2O$.
      Laquelle de ces quatre espèces est l'ester ?
    type: mcq
    choices:
      - id: A
        text: "$CH_3COOH$"
        correct: false
        feedback: >
          C'est l'acide éthanoïque, qui porte le groupe $-COOH$ seul : un
          réactif, pas l'ester formé.
      - id: B
        text: "$C_2H_5OH$"
        correct: false
        feedback: >
          C'est l'éthanol, qui porte le groupe hydroxyle $-OH$ seul :
          l'alcool, pas l'ester.
      - id: C
        text: "$CH_3COOC_2H_5$"
        correct: true
      - id: D
        text: "$H_2O$"
        correct: false
        feedback: >
          C'est l'eau, le sous-produit de la réaction, toujours $H_2O$ -
          jamais l'espèce organique formée.
    correct_feedback: >
      $CH_3COOC_2H_5$ est la seule espèce qui porte le groupe $-COO-$ entre
      deux chaînes carbonées : c'est l'ester, l'éthanoate d'éthyle.
    solution: |
      Le repère ne varie jamais : l'ester est la molécule qui contient le
      groupe $-COO-$ encadré par deux chaînes carbonées. $CH_3COOH$ est
      l'acide, $C_2H_5OH$ est l'alcool, $H_2O$ est l'eau ; seul
      $CH_3COOC_2H_5$ correspond à la définition de l'ester.

  # ── quel levier change vraiment le résultat (prédiction, R0) ────────────────
  - id: EH-9
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Un chimiste veut repartir avec plus d'ester à la fin de son
      estérification. Il hésite entre trois pistes : ajouter encore plus de
      catalyseur, chauffer plus fort, ou verser un excès d'un des deux
      réactifs au départ. Laquelle de ces trois pistes change réellement la
      quantité finale d'ester obtenue ?
    type: mcq
    choices:
      - id: A
        text: "Ajouter encore plus de catalyseur."
        correct: false
        feedback: >
          Le catalyseur accélère la réaction sans changer sa position
          finale : plus de catalyseur veut dire plus vite, pas plus d'ester.
      - id: B
        text: "Chauffer plus fort."
        correct: false
        feedback: >
          Chauffer accélère aussi la réaction, dans les deux sens à la fois,
          sans changer la quantité finale d'ester obtenue.
      - id: C
        text: "Aucune des trois : la quantité d'ester obtenue est toujours fixée par la réaction, quoi qu'on fasse."
        correct: false
        feedback: >
          Une des trois pistes change bel et bien la quantité finale
          d'ester : ce n'est donc pas vrai qu'aucun levier n'a d'effet sur le
          résultat.
      - id: D
        text: "Verser un excès d'un des deux réactifs au départ."
        correct: true
    correct_feedback: >
      Seul l'excès de réactif change la composition initiale du système,
      donc déplace réellement l'équilibre vers plus d'ester ; le catalyseur
      et le chauffage ne font qu'accélérer l'arrivée au même résultat.
    solution: |
      Trois leviers sont proposés, mais un seul change la position de
      l'équilibre : le catalyseur et le chauffage sont des leviers
      cinétiques (ils changent la vitesse), tandis qu'un excès de réactif
      change la composition initiale du système, donc le résultat final.

  # ── nomenclature d'un ester, sens direct, couple frais (R1) ──────────────────
  - id: EH-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Quel est le nom de l'ester formé par réaction entre l'acide propanoïque
      $CH_3CH_2COOH$ et l'éthanol $C_2H_5OH$ ?
    type: mcq
    choices:
      - id: A
        text: "Propanoate d'éthyle"
        correct: true
      - id: B
        text: "Éthanoate de propyle"
        correct: false
        feedback: >
          Ce nom correspond à l'ester formé à partir de l'acide éthanoïque
          et du propan-1-ol - l'inverse du couple donné ici.
      - id: C
        text: "Propanyloate d'éthanoate"
        correct: false
        feedback: >
          Ces suffixes n'existent pas et sont inversés par rapport à la
          règle : « -oate » vient de l'acide, « -yle » vient de l'alcool.
      - id: D
        text: "Acide propanoïque éthylique"
        correct: false
        feedback: >
          Ce n'est pas la nomenclature d'un ester : un ester se nomme par
          ses deux radicaux, « -oate de -yle », pas en juxtaposant les noms
          des réactifs.
    correct_feedback: >
      L'acide propanoïque donne « propanoate » ; l'éthanol donne « éthyle ».
      L'ester $CH_3CH_2COOC_2H_5$ s'appelle donc propanoate d'éthyle.
    solution: |
      Radical de l'acide : propanoïque $\rightarrow$ propanoate. Radical de
      l'alcool : éthanol $\rightarrow$ éthyle. Assemblés : propanoate
      d'éthyle, soit $CH_3CH_2COOC_2H_5$.

  # ── groupe caractéristique ester, sur l'équation générale R/R' (R1) ─────────
  - id: EH-11
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Dans l'équation générale
      $R-COOH + R'-OH \rightleftharpoons R-COO-R' + H_2O$, quel groupe
      caractéristique permet de reconnaître spécifiquement l'ester, et de le
      distinguer de l'acide et de l'alcool ?
    type: mcq
    choices:
      - id: A
        text: "$-COOH$, le groupe carboxyle."
        correct: false
        feedback: >
          C'est le groupe qui caractérise l'acide carboxylique, présent dans
          le réactif $R-COOH$, pas dans l'ester $R-COO-R'$.
      - id: B
        text: "$-COO-$, le groupe ester, encadré par les deux chaînes carbonées $R$ et $R'$."
        correct: true
      - id: C
        text: "$-OH$, le groupe hydroxyle."
        correct: false
        feedback: >
          C'est le groupe qui caractérise l'alcool, présent dans le réactif
          $R'-OH$, et absent de l'ester formé.
      - id: D
        text: "$C=O$ seul, le groupe carbonyle."
        correct: false
        feedback: >
          Le carbonyle seul, sans les deux chaînes carbonées de part et
          d'autre, ne suffit pas à identifier l'ester : il faut le groupe
          $-COO-$ complet.
    correct_feedback: >
      Le groupe ester $-COO-$, encadré par $R$ et $R'$, est le seul repère
      qui identifie sans ambiguïté l'ester parmi les quatre espèces.
    solution: |
      L'acide porte $-COOH$, l'alcool porte $-OH$ : ce sont les groupes des
      réactifs. L'ester, lui, se reconnaît au groupe $-COO-$ relié à deux
      chaînes carbonées, $R$ d'un côté et $R'$ de l'autre.

  # ── équilibre dynamique : les deux réactions continuent (R2) ────────────────
  - id: EH-12
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Un mélange équimolaire d'acide et d'alcool atteint un état
      d'équilibre : l'odeur de l'ester cesse de s'intensifier. Que peut-on
      affirmer sur l'estérification et l'hydrolyse à cet instant précis ?
    type: mcq
    choices:
      - id: A
        text: "Les deux réactions se sont arrêtées : plus aucune transformation ne se produit dans le mélange."
        correct: false
        feedback: >
          C'est confondre l'arrêt de l'évolution observable (l'odeur ne
          change plus) avec l'arrêt des réactions elles-mêmes, qui
          continuent toutes les deux.
      - id: B
        text: "Seule l'estérification continue ; l'hydrolyse ne s'est jamais vraiment mise en route."
        correct: false
        feedback: >
          Si seule l'estérification continuait, l'ester s'accumulerait
          encore et l'odeur continuerait de s'intensifier.
      - id: C
        text: "Les deux réactions se produisent toujours, à la même vitesse l'une que l'autre."
        correct: true
      - id: D
        text: "Seule l'hydrolyse continue ; l'estérification s'est arrêtée dès que l'ester a commencé à se former."
        correct: false
        feedback: >
          Si seule l'hydrolyse continuait, l'ester serait consommé sans être
          reformé, et son odeur diminuerait.
    correct_feedback: >
      L'équilibre est dynamique : estérification et hydrolyse se produisent
      en permanence, toutes les deux, à la même vitesse.
    solution: |
      À l'équilibre, la vitesse de l'estérification égale celle de
      l'hydrolyse : les deux réactions continuent sans discontinuer, mais
      leur effet net s'annule, ce qui explique que l'odeur cesse de changer.

  # ── pourquoi acide/alcool ne disparaissent jamais (mécanisme, R2) ───────────
  - id: EH-13
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Pourquoi l'acide et l'alcool ne disparaissent-ils jamais complètement
      au cours d'une estérification, même après un temps très long ?
    type: mcq
    choices:
      - id: A
        text: "Parce que la réaction est trop lente pour se terminer, même après plusieurs jours."
        correct: false
        feedback: >
          C'est confondre vitesse et position d'équilibre : même accélérée
          par un catalyseur, la réaction s'arrête au même point.
      - id: B
        text: "Parce qu'il faudrait davantage de catalyseur pour consommer tout l'acide et l'alcool restants."
        correct: false
        feedback: >
          Le catalyseur ne change jamais la quantité finale d'acide et
          d'alcool restants, quelle que soit la quantité utilisée.
      - id: C
        text: "Parce que l'eau formée empêche physiquement l'acide et l'alcool restants de se rencontrer."
        correct: false
        feedback: >
          Rien n'empêche physiquement les molécules de se rencontrer dans ce
          mélange liquide homogène : la limite vient de l'hydrolyse, pas
          d'un obstacle physique.
      - id: D
        text: "Parce que l'ester et l'eau formés peuvent eux-mêmes réagir en sens inverse (hydrolyse), donc les quatre espèces coexistent en permanence."
        correct: true
    correct_feedback: >
      Dès que de l'ester et de l'eau se forment, ils peuvent réagir en sens
      inverse (hydrolyse), ce qui empêche l'acide et l'alcool de disparaître
      complètement.
    solution: |
      Estérification et hydrolyse coexistent toujours dans le même
      mélange : c'est cette coexistence, pas un manque de temps, de
      catalyseur, ou un obstacle physique, qui limite la conversion de
      l'acide et de l'alcool.

  # ── rendement : calcul de τ à partir de K (R3) ───────────────────────────────
  - id: EH-14
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Pour un autre couple acide/alcool, dans les conditions de
      l'estérification simple (quantités initiales égales $n_0$, chaînes
      linéaires), on mesure $K = 9$ à une certaine température. Quelle est
      la valeur de $\tau$ à l'équilibre ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau = 0{,}75$"
        correct: true
      - id: B
        text: "$\\tau = 0{,}90$"
        correct: false
        feedback: >
          Cette valeur vient d'avoir résolu $\dfrac{\tau}{1-\tau} = 9$
          directement, en oubliant la racine carrée : $\dfrac{\tau}{1-\tau}
          = \sqrt{K} = 3$, pas $9$.
      - id: C
        text: "On ne peut pas calculer $\\tau$ sans connaître $n_0$."
        correct: false
        feedback: >
          Le calcul du rung R3 montre que $n_0$ disparaît de l'expression de
          $K$ : $\tau$ ne dépend que de $K$, jamais de la quantité de
          matière engagée.
      - id: D
        text: "$\\tau = \\dfrac{1}{9} \\approx 0{,}11$"
        correct: false
        feedback: >
          Cette valeur inverse la relation entre $K$ et $\tau$ : un $K$ plus
          grand correspond à un $\tau$ plus grand, pas plus petit.
    correct_feedback: >
      $\dfrac{\tau^2}{(1-\tau)^2} = 9 \Rightarrow \dfrac{\tau}{1-\tau} = 3
      \Rightarrow \tau = 0{,}75$.
    solution: |
      $\dfrac{\tau^2}{(1-\tau)^2} = K = 9$, donc $\dfrac{\tau}{1-\tau} =
      \sqrt{9} = 3$, donc $\tau = 3(1-\tau)$, soit $4\tau = 3$ et
      $\tau = 0{,}75$.

  # ── rendement : indépendance de τ vis-à-vis de n0 (R3) ──────────────────────
  - id: EH-15
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      On réalise une estérification simple avec $n_0 = 0{,}50$ mol d'acide
      et $0{,}50$ mol d'alcool ($K=4$), et on obtient $\tau \approx 0{,}667$
      à l'équilibre. On refait l'expérience en doublant les deux quantités
      initiales ($n_0 = 1{,}0$ mol de chaque), toutes choses égales par
      ailleurs. Quel est l'effet sur $\tau$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau$ double aussi, pour atteindre environ $1{,}33$."
        correct: false
        feedback: >
          $\tau$ est une proportion, toujours comprise entre $0$ et $1$ :
          c'est la quantité de matière d'ester formée qui double, pas
          $\tau$.
      - id: B
        text: "$\\tau$ reste inchangé, toujours environ $0{,}667$ ; seule la quantité de matière convertie double en valeur absolue."
        correct: true
      - id: C
        text: "$\\tau$ diminue de moitié, pour atteindre environ $0{,}33$."
        correct: false
        feedback: >
          Rien dans $K = \dfrac{\tau^2}{(1-\tau)^2}$ ne fait intervenir
          $n_0$ : doubler $n_0$ ne peut donc pas diviser $\tau$ par deux.
      - id: D
        text: "On ne peut pas savoir sans refaire tout le calcul avec les nouvelles quantités."
        correct: false
        feedback: >
          $n_0$ disparaît complètement de l'expression de $K$ : $\tau$ ne
          dépend que de $K$, pas besoin de refaire le calcul.
    correct_feedback: >
      $n_0$ n'apparaît nulle part dans $K = \dfrac{\tau^2}{(1-\tau)^2}$ :
      doubler les quantités initiales double la quantité d'ester produite,
      mais laisse $\tau$ inchangé.
    solution: |
      Le rung R3 montre que $n_0$ se simplifie complètement dans
      l'expression de $K$ : $\tau$ ne dépend que de $K$ (donc de la réaction
      et de la température), jamais de la quantité de matière engagée.

  # ── rendement : calcul de K à partir de τ mesuré, sens inverse (R3) ─────────
  - id: EH-16
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      On réalise une estérification simple avec $n_0 = 0{,}50$ mol d'acide
      et $0{,}50$ mol d'alcool. À l'équilibre, on mesure
      $n(ester)_{eq} = 0{,}30$ mol. Quelle est la valeur de la constante
      d'équilibre $K$ ?
    type: mcq
    choices:
      - id: A
        text: "$K \\approx 0{,}44$"
        correct: false
        feedback: >
          Cette valeur inverse le rapport produits/réactifs : $K$ place
          l'ester et l'eau au numérateur, l'acide et l'alcool au
          dénominateur.
      - id: B
        text: "$K \\approx 0{,}18$"
        correct: false
        feedback: >
          Cette valeur vient d'avoir divisé par la quantité totale initiale
          ($1{,}0$ mol) plutôt que par $n_0$ d'un seul réactif :
          $\tau = \dfrac{0{,}30}{0{,}50} = 0{,}6$.
      - id: C
        text: "$K = 2{,}25$"
        correct: true
      - id: D
        text: "$K = 1{,}5$"
        correct: false
        feedback: >
          Cette valeur vient d'avoir oublié d'élever $\dfrac{\tau}{1-\tau}$
          au carré : $K = \left(\dfrac{\tau}{1-\tau}\right)^2$.
    correct_feedback: >
      $\tau = \dfrac{0{,}30}{0{,}50} = 0{,}6$, donc
      $K = \dfrac{\tau^2}{(1-\tau)^2} = \dfrac{0{,}36}{0{,}16} = 2{,}25$.
    solution: |
      $n(acide)_{eq} = n(alcool)_{eq} = 0{,}50 - 0{,}30 = 0{,}20$ mol, donc
      $K = \dfrac{0{,}30 \times 0{,}30}{0{,}20 \times 0{,}20} = 2{,}25$.

  # ── catalyseur : structure/expression de K (variant, R4) ────────────────────
  - id: EH-17
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Laquelle de ces affirmations sur le catalyseur acide (par exemple
      l'acide sulfurique) utilisé dans une estérification est correcte ?
    type: mcq
    choices:
      - id: A
        text: "Il figure dans l'expression de $K$, ce qui explique qu'il change la position de l'équilibre."
        correct: false
        feedback: >
          Un catalyseur ne figure jamais dans l'expression de $K$ ni dans
          l'équation bilan : il n'a aucune prise sur la position de
          l'équilibre.
      - id: B
        text: "Il accélère seulement l'estérification, pas l'hydrolyse, ce qui déplace l'équilibre vers la droite."
        correct: false
        feedback: >
          Un catalyseur accélère les deux sens à la fois, dans les mêmes
          proportions : il ne favorise ni l'estérification ni l'hydrolyse
          plus que l'autre.
      - id: C
        text: "Il permet d'atteindre un taux d'avancement final supérieur à celui obtenu sans catalyseur, mais seulement si on chauffe en même temps."
        correct: false
        feedback: >
          Chauffer est, comme le catalyseur, un facteur cinétique :
          combiner les deux accélère l'arrivée à l'équilibre, mais ne
          change jamais sa position.
      - id: D
        text: "Il figure dans le mécanisme mais jamais dans l'expression de $K$ ; il accélère les deux sens (estérification et hydrolyse) dans les mêmes proportions."
        correct: true
    correct_feedback: >
      Le catalyseur agit uniquement sur la vitesse : il accélère
      l'estérification et l'hydrolyse à parts égales, sans jamais apparaître
      dans $K$.
    solution: |
      Un catalyseur ouvre un chemin réactionnel qui demande moins d'énergie,
      pour les deux réactions à la fois, sans changer leur rapport de
      vitesses - c'est justement ce rapport qui fixe $K$.

  # ── proportion des réactifs : ajout d'ester, direction de Qr (R5) ───────────
  - id: EH-18
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_esterification_hydrolyse
    tags: []
    stem: >
      Un système acide + alcool + ester + eau est à l'équilibre ($K=4$). On
      ajoute, sans changer le volume, une certaine quantité d'ester pur au
      mélange. Que se passe-t-il ?
    type: mcq
    choices:
      - id: A
        text: "$Q_r$ augmente au-dessus de $K$ : le système évolue dans le sens inverse (hydrolyse) pour le rejoindre, donc une partie de l'ester ajouté est reconsommée."
        correct: true
      - id: B
        text: "$Q_r$ diminue en dessous de $K$ : le système évolue dans le sens direct, ce qui produit encore plus d'ester."
        correct: false
        feedback: >
          L'ester figure au numérateur de $Q_r$ : en ajouter augmente $Q_r$,
          ce n'est pas en retirer qui le diminue.
      - id: C
        text: "Rien ne change : $K$ reste fixe à température constante, donc l'ajout d'ester ne peut pas affecter la composition finale."
        correct: false
        feedback: >
          C'est confondre $K$ (fixe à température constante) et $Q_r$ (qui
          varie dès que les concentrations changent, y compris quand on en
          ajoute).
      - id: D
        text: "Le système reste à l'équilibre, car ajouter un produit ne fait qu'accélérer la réaction inverse sans en changer l'issue finale."
        correct: false
        feedback: >
          Ajouter de l'ester change la composition du système, donc $Q_r$ :
          ce n'est pas un effet cinétique comme le catalyseur, c'est un
          déplacement réel.
    correct_feedback: >
      L'ester figure au numérateur de $Q_r$ : en ajouter fait dépasser
      $Q_{r,i} > K$, ce qui relance le système en sens inverse (hydrolyse).
    solution: |
      $Q_r = \dfrac{[ester][eau]}{[acide][alcool]}$ : ajouter de l'ester
      augmente $[ester]$, donc $Q_r$ dépasse $K$, et le système évolue en
      sens inverse pour reconsommer une partie de l'ester ajouté.

