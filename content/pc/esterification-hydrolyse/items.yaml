  # ── groupe caractéristique ester, sur l'équation générale R/R' (R1) ─────────
  - id: EH-11
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.mauvaise-identification-ester
    stem: >
      Dans l'équation générale
      $R-COOH + R'-OH \rightleftharpoons R-COO-R' + H_2O$, quel groupe
      caractéristique permet de reconnaître spécifiquement l'ester, et de le
      distinguer de l'acide et de l'alcool ?
    type: mcq
    choices:
      - id: A
        text: "$-COOH$, le groupe carboxyle."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.mauvaise-identification-ester
        feedback: >
          C'est le groupe qui caractérise l'acide carboxylique, présent dans
          le réactif $R-COOH$, pas dans l'ester $R-COO-R'$.
      - id: B
        text: "$-COO-$, le groupe ester, encadré par les deux chaînes carbonées $R$ et $R'$."
        correct: true
      - id: C
        text: "$-OH$, le groupe hydroxyle."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.mauvaise-identification-ester
        feedback: >
          C'est le groupe qui caractérise l'alcool, présent dans le réactif
          $R'-OH$, et absent de l'ester formé.
      - id: D
        text: "$C=O$ seul, le groupe carbonyle."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.mauvaise-identification-ester
        feedback: >
          Le carbonyle seul, sans les deux chaînes carbonées de part et
          d'autre, ne suffit pas à identifier l'ester : il faut le groupe
          $-COO-$ complet.
    correct_feedback: >
      Le groupe ester $-COO-$, encadré par $R$ et $R'$, est le seul repère
      qui identifie sans ambiguïté l'ester parmi les quatre espèces.
    solution: |
      L'acide porte $-COOH$, l'alcool porte $-OH$ : ce sont les groupes des
      réactifs. L'ester, lui, se reconnaît au groupe $-COO-$ relié à deux
      chaînes carbonées, $R$ d'un côté et $R'$ de l'autre.

  # ── équilibre dynamique : les deux réactions continuent (R2) ────────────────
  - id: EH-12
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.equilibre-percu-comme-arret
    stem: >
      Un mélange équimolaire d'acide et d'alcool atteint un état
      d'équilibre : l'odeur de l'ester cesse de s'intensifier. Que peut-on
      affirmer sur l'estérification et l'hydrolyse à cet instant précis ?
    type: mcq
    choices:
      - id: A
        text: "Les deux réactions se sont arrêtées : plus aucune transformation ne se produit dans le mélange."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.equilibre-percu-comme-arret
        feedback: >
          C'est confondre l'arrêt de l'évolution observable (l'odeur ne
          change plus) avec l'arrêt des réactions elles-mêmes, qui
          continuent toutes les deux.
      - id: B
        text: "Seule l'estérification continue ; l'hydrolyse ne s'est jamais vraiment mise en route."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.equilibre-percu-comme-arret
        feedback: >
          Si seule l'estérification continuait, l'ester s'accumulerait
          encore et l'odeur continuerait de s'intensifier.
      - id: C
        text: "Les deux réactions se produisent toujours, à la même vitesse l'une que l'autre."
        correct: true
      - id: D
        text: "Seule l'hydrolyse continue ; l'estérification s'est arrêtée dès que l'ester a commencé à se former."
        correct: false
        misconception: mc.physics.pc_esterification_hydrolyse.equilibre-percu-comme-arret
        feedback: >
          Si seule l'hydrolyse continuait, l'ester serait consommé sans être
          reformé, et son odeur diminuerait.
    correct_feedback: >
      L'équilibre est dynamique : estérification et hydrolyse se produisent
      en permanence, toutes les deux, à la même vitesse.
    solution: |
      À l'équilibre, la vitesse de l'estérification égale celle de
      l'hydrolyse : les deux réactions continuent sans discontinuer, mais
      leur effet net s'annule, ce qui explique que l'odeur cesse de changer.

  # ── pourquoi acide/alcool ne disparaissent jamais (mécanisme, R2) ───────────
  - id: EH-13
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_esterification_hydrolyse
    tags: []
    primary_misconception: mc.physics.pc_esterification_hydrolyse.esterification-totale
