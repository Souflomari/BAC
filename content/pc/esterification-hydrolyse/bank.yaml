    intro: |-
      **Synthèse de la phéromone (P) (examen national, session de rattrapage 2015 — Exercice 1, Deuxième partie, 3,00 points sur les 07 de l'exercice complet).**

      *La Première partie de cet exercice — le dosage de l'acide éthanoïque par la soude — est indépendante et traitée à part, sous la notion « Réactions acido-basiques » (entrée bk-2015-r-x1). Rien de ce qui suit n'en dépend.*

      Quelques insectes, commes les abeilles et les fourmies, communiquent entre elles à l'aide de substances chimiques organiques, appelées phéromones, pour se défendre ou se féconder… *(« commes », « fourmies », « entre elles » tels qu'imprimés — défauts du sujet officiel, sans incidence)*

      **Données** (imprimées en tête de l'Exercice 1, communes aux deux parties) :
      - Toutes les mesures ont été faites à $25\,^\circ\text{C}$ ;
      - La masse molaire de l'acide éthanoïque est : $M(\text{CH}_3\text{COOH}) = 60\ \text{g.mol}^{-1}$ ;
      - La masse volumique de l'acide éthanoïque pur est : $\rho = 1{,}05\ \text{g.mL}^{-1}$ ;
      - La masse molaire de la phéromone est : $M(\text{P}) = 130\ \text{g.mol}^{-1}$.

      **Deuxième partie :** *Synthèse de la phéromone (P)*

      La synyhèse de la phéromone au laboratoire, peut être réalisée par la réaction entre l'acide éthanoïque (A) et un alcool (B) de formule $\text{C}_5\text{H}_{11}\text{-OH}$. *(« synyhèse » et la virgule entre sujet et verbe tels qu'imprimés — défauts du sujet officiel, sans incidence)*
    questions:
      - id: q2-1
        part: "Deuxième partie — synthèse de la phéromone (P)"
        stem: |-
          **2-1-** (0,5 pt) Écrire l'équation modélisant la réaction entre (A) et (B).
        reasoning: |-
          On applique le geste du chapitre 2 : le groupe $-COOH$ de l'acide et le groupe $-OH$ de l'alcool se combinent, une molécule d'eau en part, et ce qui reste des deux chaînes se relie par le groupe ester $-COO-$. Ici $R = \text{CH}_3-$ (le radical de l'acide éthanoïque) et $R' = \text{C}_5\text{H}_{11}-$ (le radical de l'alcool (B)).

          $$\boxed{\text{CH}_3-\text{COOH} + \text{C}_5\text{H}_{11}-\text{OH} \rightleftharpoons \text{CH}_3-\text{COO}-\text{C}_5\text{H}_{11} + \text{H}_2\text{O}}$$

          Double flèche, comme toujours pour une estérification (chapitre 3) : réaction limitée, jamais totale — c'est précisément ce que le rendement de la question 2-3c va chiffrer.

          **Le contrôle gratuit, offert par l'énoncé.** L'ester formé EST la phéromone (P) : sa masse molaire doit donc valoir $M(\text{P}) = 130\ \text{g.mol}^{-1}$. Or $M(\text{ester}) = M(\text{acide}) + M(\text{alcool}) - M(\text{H}_2\text{O}) = 60 + 88 - 18 = 130$ — l'équation est cohérente avec les données ($M(\text{C}_5\text{H}_{11}\text{OH}) = 5\times12+12\times1+16 = 88\ \text{g.mol}^{-1}$).

          Le piège nommé de cette question. Écrire une flèche simple $\longrightarrow$ : l'estérification est LIMITÉE (chapitre 3), et la double flèche fait partie de la réponse attendue — l'oublier ici, c'est aussi se priver de la caractéristique que la question suivante demande.
      - id: q2-2
        # F4 : sur le sujet officiel, cette valeur « 0,5 » est imprimée une ligne trop bas, en face du chapeau 2-3 (sans consigne) ; lecture 0,5 → 2-2 endossée par la vérification, somme insensible — voir le bloc de commentaire et la note de sourcing de cette entrée.
        stem: |-
          **2-2-** (0,5 pt) Citer deux caractéristiques de cette réaction.
        reasoning: |-
          Les deux caractéristiques de toute estérification, posées aux chapitres 3 et 5 :

          - **lente** : sans intervention, il faut des jours pour approcher l'état final (chapitre 5 — c'est exactement pour cela que l'énoncé chauffe à reflux et ajoute un catalyseur, question suivante) ;
          - **limitée** : la réaction inverse — l'hydrolyse de l'ester — coexiste toujours avec elle (chapitre 3) ; le système s'arrête sur un équilibre où les quatre espèces coexistent, jamais sur la disparition d'un réactif.

          $$\boxed{\text{Réaction lente et limitée}}$$

          Le piège nommé de cette question. Répondre « athermique » n'est pas faux (l'estérification l'est, quasiment), mais ce n'est pas le couple attendu : « lente et limitée » est LE binôme canonique du cours, celui que le reste de l'exercice met en scène — le reflux et le catalyseur répondent à « lente », le rendement de 2-3c répond à « limitée ».
      - id: q2-3a
        part: "2-3 — Étude quantitative du mélange équimolaire"
        stem: |-
          **2-3-** On mélange le volume $V_A = 28{,}6\ \text{mL}$ d'acide (A) pur, avec la quantité de matière $n_B = 0{,}50\ \text{mol}$ de l'alcool (B). On ajoute quelques gouttes d'acide sulfurique. On chauffe à reflux, le mélange réactionnel pendant presque quatre heures. à l'équilibre, et après traitement nécéssaire, on obtient une quantité de la phéromone (P), de masse $m_P = 43{,}40\ \text{g}$. *(« On chauffe à reflux, le mélange » et « nécéssaire » tels qu'imprimés — défauts du sujet officiel, sans incidence)*

          **a-** (0,5 pt) Quel est l'interêt du chauffage à reflux, et de l'addition d'acide sulfurique ? *(« interêt » tel qu'imprimé)*
        reasoning: |-
          Les deux leviers visent la même caractéristique — la LENTEUR (question 2-2) — et aucun des deux ne touche à l'équilibre. C'est le cœur du chapitre 5, et, dans sa formulation générale, le terrain de la notion « Contrôle par un réactif ou par catalyse » (chapitre 3 de cette notion-là pour le catalyseur) :

          - le **chauffage à reflux** accélère la réaction (température plus élevée, chocs plus fréquents et plus efficaces) **sans perte de matière** : les vapeurs du mélange bouillant se condensent dans le réfrigérant vertical et retombent dans le ballon ;
          - l'**acide sulfurique** est un **catalyseur** : il accélère l'estérification ET l'hydrolyse inverse dans les mêmes proportions, donc il raccourcit le temps d'atteinte de l'équilibre sans en déplacer la position.

          **Conclusion.** Atteindre l’état d’équilibre plus rapidement — sans changer ni le rendement ni la composition finale.

          Le piège nommé de cette question. Répondre « le catalyseur améliore le rendement » : c'est l'idée fausse que le chapitre 5 démonte par le test des deux flacons — même composition finale, vitesses différentes. Reflux et catalyseur achètent du temps, jamais de l'ester en plus ; pour obtenir PLUS d'ester, il faudrait changer de réactif ou déplacer l'équilibre (chapitre 6), ce que cet énoncé ne fait pas.
      - id: q2-3b
        stem: |-
          **b-** (1 pt) Déterminer, à l'aide du tableau descriptif, la composition molaire du mélange réactionnel à l'équilibre.
        reasoning: |-
          D'abord convertir le volume d'acide PUR en quantité de matière — c'est ici que servent $\rho$ et $M$ des données :

          $$n_A = \frac{\rho\,V_A}{M(\text{CH}_3\text{COOH})} = \frac{1{,}05\times28{,}6}{60} \approx 0{,}50\ \text{mol}$$

          Le mélange est donc **équimolaire** ($n_A = n_B = 0{,}50\ \text{mol}$) — exactement le cas du chapitre 4. L'avancement à l'équilibre se lit sur l'ester obtenu, c'est-à-dire la phéromone :

          $$x_{éq} = n_P = \frac{m_P}{M(\text{P})} = \frac{43{,}40}{130} \approx 0{,}334\ \text{mol}$$

          Le tableau descriptif (chapitre 4), avec la stœchiométrie $1{:}1{:}1{:}1$ de la question 2-1 :

          | État | $\text{CH}_3\text{COOH}$ | $\text{C}_5\text{H}_{11}\text{OH}$ | ester (P) | $\text{H}_2\text{O}$ |
          |---|:---:|:---:|:---:|:---:|
          | initial | $0{,}50$ | $0{,}50$ | $0$ | $0$ |
          | équilibre | $0{,}50-x_{éq}$ | $0{,}50-x_{éq}$ | $x_{éq}$ | $x_{éq}$ |

          $$\boxed{n(\text{acide})_{éq} = n(\text{alcool})_{éq} \approx 0{,}166\ \text{mol} \qquad n(\text{P})_{éq} = n(\text{H}_2\text{O})_{éq} \approx 0{,}334\ \text{mol}}$$

          Le piège nommé de cette question. Oublier l'eau dans la composition : le tableau a QUATRE colonnes, et l'eau est produite mole pour mole avec l'ester — une « composition du mélange à l'équilibre » qui ne liste que trois espèces est incomplète, même si aucune question n'exploite l'eau ensuite.
        steps:
          - math: 'n_A = \frac{\rho\,V_A}{M} = \frac{1{,}05\times28{,}6}{60} \approx 0{,}50\ \text{mol} = n_B'
            note: "Acide PUR : passer par la masse volumique. Mélange équimolaire, le cas du chapitre 4."
          - math: 'x_{éq} = \frac{m_P}{M(\text{P})} = \frac{43{,}40}{130} \approx 0{,}334\ \text{mol}'
            note: "L'avancement d'équilibre se lit sur l'ester (la phéromone) obtenu."
          - math: 'n(\text{acide})_{éq} = n(\text{alcool})_{éq} = 0{,}50 - 0{,}334 \approx 0{,}166\ \text{mol}'
            note: "Tableau d'avancement, stoechiometrie 1:1:1:1."
          - math: '\boxed{0{,}166\ /\ 0{,}166\ /\ 0{,}334\ /\ 0{,}334\ \text{mol}}'
            note: "Composition complete à l'équilibre : acide / alcool / ester / eau."
      - id: q2-3c
        stem: |-
          **c-** (0,5 pt) Calculer le rendement r de la synthèse de la phéromone (P).
        reasoning: |-
          Le rendement rapporte l'ester réellement obtenu à celui qu'aurait donné une réaction **totale** (chapitre 4). Mélange équimolaire : une conversion totale donnerait $x_{max} = n_A = n_B = 0{,}50\ \text{mol}$ d'ester.

          $$r = \frac{x_{éq}}{x_{max}} = \frac{0{,}334}{0{,}50}$$

          $$\boxed{r \approx 0{,}668 = 66{,}8\ \%}$$

          Et ce chiffre DIT quelque chose : $66{,}8\ \% \approx 2/3$, très exactement le taux canonique de l'estérification équimolaire du chapitre 4 ($K = 4$, deux réactifs sans empêchement stérique en quantités égales, $\tau = 2/3$). Le sujet retombe sur le résultat du cours presque au chiffre près — un indice fort que toute la chaîne de calcul est juste.

          Le piège nommé de cette question. Calculer $r$ depuis l'acide RESTANT ($0{,}166/0{,}50 = 33{,}2\ \%$) : ce rapport mesure la fraction d'acide qui n'a PAS réagi, pas la fraction convertie en phéromone. Le rendement se rapporte toujours au produit obtenu (ou à l'avancement), jamais au réactif survivant.
        steps:
          - math: 'x_{max} = n_A = n_B = 0{,}50\ \text{mol}'
            note: "Réaction supposée totale d'un mélange équimolaire : tout l'acide serait converti."
          - math: 'r = \frac{x_{éq}}{x_{max}} = \frac{0{,}334}{0{,}50}'
            note: "Rendement = avancement réel / avancement maximal (chapitre 4)."
          - math: '\boxed{r \approx 66{,}8\ \% \approx \frac{2}{3}}'
            note: "Le taux canonique de l'estérification équimolaire (chapitre 4, K = 4) : chaîne de calcul confirmée."

