    intro: |-
      **Synthèse du méthanoate d'éthyle (examen national, session de rattrapage 2013 — Chimie, deuxième partie §2, 2,75 points sur les 05,00 de la deuxième partie).**

      *Le §1 de cette même deuxième partie — la réaction de l'acide méthanoïque avec l'eau (2,25 pt) — est indépendant et vit sous « Réactions acido-basiques », entrée bk-2013-r-x1b. La Première partie du même exercice de Chimie (électrolyse, 2,00 pt) vit sous « Électrolyse », entrée bk-2013-r-x1. 2,00 + 2,25 + 2,75 = 7,00, le barème imprimé.*

      On pose un ballon, contenant une quantité de matière $n_0 = 100\ \text{mmol}$ d'acide méthanoïque, dans un bain marie de température constante, puis on lui ajoute une quantité de matière $n = n_0 = 100\ \text{mmol}$ d'éthanol et quelques gouttes d'acide sulfurique concentré ; on obtient ainsi un mélange de **volume constant $V = 25\ \text{mL}$**.

      Le suivi de l'évolution au cours du temps de l'avancement $x$ de la réaction permet de tracer la courbe ci-dessous.

      **La courbe $x(t)$, décrite pour être exploitée** *(le sujet imprime un tracé sur papier millimétré ; les repères ci-dessous sont ceux de la figure, mesurés sur les deux éditions)* **:**

      - **axe vertical** $x\ (\text{mmol})$, graduations chiffrées $20$, $40$, $60$ ; **axe horizontal** $t\ (\text{min})$, graduations chiffrées $0$, $20$, $40$, $60$, $80$ ;
      - **quadrillage** : maille fine de $1\ \text{min} \times 1\ \text{mmol}$, lignes fortes tous les $10\ \text{min}$ et tous les $10\ \text{mmol}$ ;
      - **la courbe** part de l'origine, monte raide, s'infléchit vers $t \approx 12\ \text{min}$, et rejoint un **plateau parfaitement horizontal à $x = 67\ \text{mmol}$** à partir de $t \approx 53\ \text{min}$ ;
      - **une droite en tirets, étiquetée $(T)$**, traverse la région de la courbe : elle joint exactement les deux points de grille $(5\ \text{min}\ ;\ 50\ \text{mmol})$ et $(36\ \text{min}\ ;\ 70\ \text{mmol})$.

      *Le sujet ne numérote pas cette figure : son texte l'appelle « la courbe ci-contre ».*
    questions:
      - id: q1
        part: "Chimie, deuxième partie §2 — Synthèse du méthanoate d'éthyle"
        stem: |-
          **2-1-** (0,25 pt) Écrire, en utilisant les formules semi-développées, l'équation modélisant la transformation. *(« Écrire », E majuscule non accentué, tel qu'imprimé.)*
        reasoning: |-
          C'est le geste du chapitre 2, appliqué au couple le plus simple de toute la chimie organique du programme : le groupe $-\text{COOH}$ de l'acide et le groupe $-\text{OH}$ de l'alcool se rencontrent, une molécule d'eau en part, et ce qui reste des deux chaînes se relie par le groupe ester $-\text{COO}-$.

          Ici l'acide est l'**acide méthanoïque** $\text{HCOOH}$ — le plus court de tous, son « radical » se réduit à un simple atome d'hydrogène — et l'alcool est l'**éthanol** $\text{CH}_3-\text{CH}_2-\text{OH}$.

          $$\boxed{\text{H}-\text{CO}-\text{OH} + \text{CH}_3-\text{CH}_2-\text{OH} \rightleftharpoons \text{H}-\text{CO}-\text{O}-\text{CH}_2-\text{CH}_3 + \text{H}_2\text{O}}$$

          **La double flèche n'est pas décorative** (chapitre 3) : elle dit que l'hydrolyse inverse a lieu en même temps, que la transformation est **limitée**, et c'est exactement ce que le plateau de la courbe montre — $x$ s'arrête à $67\ \text{mmol}$ alors que $100\ \text{mmol}$ d'acide ont été introduites.

          **Le nom, pour vérifier l'écriture.** Radical de l'acide méthanoïque : « méthanoate ». Radical de l'éthanol : « éthyle ». L'ester est donc le **méthanoate d'éthyle**, $\text{HCOOC}_2\text{H}_5$ — cohérent avec l'énoncé.

          **Le piège de cette question.** Répondre par l'équation générale $\text{R}-\text{COOH} + \text{R}'-\text{OH} \rightleftharpoons \text{R}-\text{COO}-\text{R}' + \text{H}_2\text{O}$ sans remplacer $\text{R}$ et $\text{R}'$ : la consigne demande les formules **semi-développées**, donc les chaînes écrites.
      - id: q2
        stem: |-
          **2-2-** (0,25 pt) Quel est le rôle *(sic, pour « rôle »)* de l'acide sulfurique concentré ajouté ?
        reasoning: |-
          C'est le chapitre 5, et il tient en une phrase que la question suivante va rendre visible : l'acide sulfurique concentré est un **catalyseur**.

          Ce qu'il fait : il **accélère** la réaction — sans lui, une estérification à température modérée demande des heures, voire des jours.

          Ce qu'il ne fait **pas**, et c'est là tout l'enjeu du chapitre 5 : il ne déplace pas l'équilibre. Il accélère l'estérification **et** l'hydrolyse inverse, exactement dans le même rapport ; la composition finale du mélange, donc $x_{éq}$, donc le rendement, sont rigoureusement les mêmes avec ou sans lui. Il n'apparaît pas non plus dans le bilan : il est régénéré.

          **Le piège de cette question, nommé.** Répondre « il améliore le rendement ». C'est l'idée fausse que le chapitre 5 démonte par le test des deux flacons — avec et sans catalyseur, la **même** composition finale est atteinte, à des vitesses différentes. Le catalyseur achète du **temps**, jamais de l'ester en plus. Ce qui améliore le rendement, c'est le déplacement d'équilibre (chapitre 6), et la question 2-6 en donnera un exemple chiffré.
      - id: q3
        stem: |-
          **2-3-** (0,5 pt) Déterminer la valeur de l'avancement final $x_{éq}$, et le temps de demi-réaction $t_{1/2}$.
        reasoning: |-
          **CROSS-LIST honoré ici (« Suivi temporel d'une transformation, vitesse »).** Le temps de demi-réaction est l'outil central de cette autre notion. Il pèse, avec la question 2-4, $1{,}00\ \text{pt}$ sur les $2{,}75$ de ce bloc : la règle de la maison veut qu'un cross-list de ce poids soit honoré dans le raisonnement plutôt que traité ailleurs. La définition et le geste sont donc refaits ici en entier.

          **Deux lectures graphiques, dans cet ordre — la seconde a besoin de la première.**

          **$x_{éq}$, l'avancement final** : c'est la valeur du **plateau**, celle vers laquelle la courbe cesse de monter. Le plateau est parfaitement horizontal à partir de $t \approx 53\ \text{min}$, posé sur une ligne du quadrillage :

          $$x_{éq} = 67\ \text{mmol}$$

          *Ce que ce nombre raconte, avant même le calcul de K.* On a introduit $100\ \text{mmol}$ d'acide et $100\ \text{mmol}$ d'alcool, en quantités égales et sans empêchement stérique : le chapitre 4 prédit dans ce cas $\tau \approx 2/3$, soit $x_{éq} \approx 67\ \text{mmol}$. La courbe confirme le cas canonique — et ce n'est pas une coïncidence, c'est la signature de l'estérification équimolaire.

          **$t_{1/2}$, le temps de demi-réaction** : par définition, l'instant où l'avancement atteint **la moitié de sa valeur finale**, pas la moitié de $x_{max}$. Il faut donc $x_{éq}$ d'abord, puis lire l'abscisse à mi-hauteur :

          $$x(t_{1/2}) = \frac{x_{éq}}{2} = \frac{67}{2} = 33{,}5\ \text{mmol} \implies t_{1/2} \approx 6{,}8\ \text{min}$$

          *(Mesure fine sur le tracé : $6{,}84\ \text{min}$. À l'échelle du quadrillage, un élève qui lit « environ $7\ \text{min}$ » lit juste.)*

          **Le piège de cette question.** Prendre $x_{max} = 100\ \text{mmol}$ et chercher $t$ à $50\ \text{mmol}$ : cela donnerait $\approx 5\ \text{min}$, et c'est faux. Le temps de demi-réaction se définit sur l'avancement **final atteint**, pas sur l'avancement maximal théorique — la distinction n'existe que pour les transformations limitées, et c'en est une.
        steps:
          - math: 'x_{eq} = 67\ \text{mmol}'
            note: "Lecture du plateau, atteint vers t = 53 min et pose sur une ligne de grille."
          - math: '\tau = \frac{x_{eq}}{x_{max}} = \frac{67}{100} = 0{,}67 \approx \frac{2}{3}'
            note: "Controle : mélange équimolaire sans empêchement stérique, le cas canonique du chapitre 4."
          - math: 'x(t_{1/2}) = \frac{x_{eq}}{2} = 33{,}5\ \text{mmol}'
            note: "Définition : moitié de l'avancement FINAL, pas de l'avancement maximal."
          - math: '\boxed{t_{1/2} \approx 6{,}8\ \text{min}}'
            note: "Abscisse du point d'ordonnée 33,5 mmol. Mesure fine sur le trace : 6,84 min."
      - id: q4
        stem: |-
          **2-4-** (0,5 pt) La droite $(T)$ représente la tangente à la courbe au point d'abscisse $t = 20\ \text{min}$. Calculer, en $\text{mol.L}^{-1}.\text{min}^{-1}$, la valeur de **la vitesse volumique $v$ de la réaction** à cet instant.

          *Le document officiel imprime ici « la valeur de **cette vitesse** à cet instant » — mais le mot « vitesse » n'apparaît nulle part ailleurs dans les six pages du sujet français : la consigne est référentiellement cassée telle qu'imprimée. L'original arabe écrit « قيمة السرعة الحجمية v للتفاعل », c'est-à-dire « la valeur de la vitesse **volumique** $v$ **de la réaction** » — trois éléments perdus dans l'édition française. La consigne est rétablie ici, et la réparation est déclarée. (L'édition française de ce sujet est ministérielle : c'est donc un défaut du document officiel, pas un artefact de traduction.)*
        reasoning: |-
          **La définition (chapitre 4 de « Suivi temporel d'une transformation », cross-list honoré ici).** La vitesse **volumique** de réaction est la dérivée de l'avancement par rapport au temps, **rapportée au volume** du mélange :

          $$v = \frac{1}{V}\left(\frac{dx}{dt}\right)_{t=20\ \text{min}}$$

          Le volume est constant ($V = 25\ \text{mL}$, l'énoncé le précise) : il sort de la dérivée, et le calcul se réduit à une pente divisée par un volume.

          **Lire la pente de $(T)$, et la lire sur ses deux extrémités.** La consigne dit explicitement que $(T)$ **est** la tangente : c'est donc sa pente qu'il faut mesurer, et non essayer de dériver la courbe à l'œil. $(T)$ joint deux nœuds exacts du quadrillage, ce qui rend la lecture nette :

          $$\text{pente}(T) = \frac{70 - 50}{36 - 5} = \frac{20}{31} \approx 0{,}645\ \text{mmol.min}^{-1}$$

          **Puis convertir, en une fois.** L'avancement est en millimoles et le volume en millilitres ; la vitesse demandée est en $\text{mol.L}^{-1}.\text{min}^{-1}$ :

          $$v = \frac{0{,}645\times10^{-3}\ \text{mol.min}^{-1}}{25\times10^{-3}\ \text{L}} \approx 2{,}6\times10^{-2}\ \text{mol.L}^{-1}.\text{min}^{-1}$$

          **⚠️ Ce que le sujet fait ici, et qu'il faut savoir.** La droite $(T)$ n'est **pas** exactement la tangente de la courbe qu'elle prétend toucher : mesurée sur le dessin, sa pente vaut $0{,}645\ \text{mmol.min}^{-1}$ alors que la dérivée réelle de la courbe en $t = 20\ \text{min}$ vaut $0{,}684$ — $(T)$ est tracée $5{,}6\ \%$ trop plate, et elle reste au-dessus de la courbe sur tout son parcours sans jamais la toucher (l'écart passe par un minimum de $0{,}41\ \text{mmol}$ vers $t = 21{,}4\ \text{min}$). C'est un **défaut du sujet officiel**, présent dans les deux éditions, déclaré et non réparé ici — le corpus a déjà rencontré exactement ce cas (PC 2010 N, $5{,}5\ \%$).

          **La conséquence pratique, et c'est la seule qui compte pour toi :** trois valeurs sont défendables selon ce qu'on lit — $2{,}6\times10^{-2}$ (la pente de $(T)$ **telle qu'elle est tracée**, ce que la consigne demande), $2{,}7\times10^{-2}$ (la dérivée réelle de la courbe), $2{,}8\times10^{-2}$ (une lecture plus large de $(T)$). **Toute valeur entre $2{,}6$ et $2{,}8\times10^{-2}\ \text{mol.L}^{-1}.\text{min}^{-1}$ est juste** ; aucune de ces trois n'est « la » valeur exacte. La question reste parfaitement résoluble : c'est le geste — pente de la droite, puis division par le volume — qui est évalué.

          **Le piège de cette question.** Oublier le $\dfrac{1}{V}$ et répondre $0{,}645\ \text{mmol.min}^{-1}$ : c'est une vitesse de réaction en avancement, pas une vitesse **volumique**, et l'unité demandée ($\text{mol.L}^{-1}.\text{min}^{-1}$) le dit. Second piège : diviser par $25$ au lieu de $25\times10^{-3}$ — le volume doit être en litres.
        steps:
          - math: 'v = \frac{1}{V}\left(\frac{dx}{dt}\right)_{t=20\ \text{min}}'
            note: "Définition de la vitesse volumique, valable parce que le volume du mélange est constant."
          - math: '\text{pente}(T) = \frac{70 - 50}{36 - 5} = \frac{20}{31} \approx 0{,}645\ \text{mmol.min}^{-1}'
            note: "Lecture sur les deux extrémités de (T), qui tombent exactement sur des noeuds du quadrillage."
          - math: 'V = 25\ \text{mL} = 25\times10^{-3}\ \text{L} \qquad \frac{dx}{dt} = 0{,}645\ \text{mmol.min}^{-1} = 0{,}645\times10^{-3}\ \text{mol.min}^{-1}'
            note: "Les deux conversions a faire avant la division : millimoles en moles, millilitres en litres."
          - math: 'v = \frac{0{,}645\times10^{-3}}{25\times10^{-3}}'
            note: "Division de la pente par le volume."
          - math: '\boxed{v \approx 2{,}6\times10^{-2}\ \text{mol.L}^{-1}.\text{min}^{-1}}'
            note: "Tolerance a ouvrir : toute valeur entre 2,6 et 2,8 x 10^-2 est juste (voir le raisonnement : la droite (T) n'est pas exactement la tangente de la courbe)."
      - id: q5
        stem: |-
          **2-5-** (0,5 pt) Déterminer la constante d'équilibre $K$ associée à cette réaction.
        reasoning: |-
          **CROSS-LIST honoré ici (« État d'équilibre d'un système chimique »).** La constante d'équilibre est l'outil central de cette autre notion ; avec la question 2-6 elle pèse $1{,}25\ \text{pt}$ sur les $2{,}75$ de ce bloc. Le routage retenu garde le bloc entier ici — les six questions décrivent une seule expérience, un seul ballon, une seule courbe — et honore le cross-list dans le raisonnement.

          **Le tableau d'avancement, en quantités de matière**, avec $n_0 = n = 100\ \text{mmol}$ :

          | | acide | + alcool | $\rightleftharpoons$ ester | + eau |
          |---|---|---|---|---|
          | initial | $100$ | $100$ | $0$ | $0$ |
          | à l'équilibre | $100 - x_{éq}$ | $100 - x_{éq}$ | $x_{éq}$ | $x_{éq}$ |

          **Pourquoi le volume disparaît, et c'est le point de la question.** $K$ s'écrit avec des concentrations :

          $$K = \frac{[\text{ester}]_{éq}\,[\text{eau}]_{éq}}{[\text{acide}]_{éq}\,[\text{alcool}]_{éq}}$$

          Il y a **autant d'espèces au numérateur qu'au dénominateur** (deux et deux), et toutes sont dans le **même** volume $V$ : chaque concentration s'écrit « quantité $/\,V$ », et les quatre $V$ se simplifient deux à deux. On peut donc calculer $K$ **directement en quantités de matière** — et même en millimoles, sans convertir.

          $$K = \frac{x_{éq}^2}{\left(n_0 - x_{éq}\right)^2} = \left(\frac{x_{éq}}{n_0 - x_{éq}}\right)^2 = \left(\frac{67}{33}\right)^2$$

          $$\boxed{K \approx 4{,}1}$$

          C'est le $K = 4$ canonique du chapitre 4, celui qui produit $\tau = 2/3$ pour un mélange équimolaire : la boucle est fermée avec la lecture de la question 2-3.

          **Un mot d'honnêteté sur ce nombre.** Le plateau est **dessiné** à $67{,}0\ \text{mmol}$, sur une ligne de grille ; un plateau à $66{,}67\ \text{mmol}$ donnerait exactement $K = 4{,}00$. Le sujet a arrondi le dessin, pas le calcul — c'est visible à la question suivante, dont la valeur à vérifier ($78{,}5\ \text{mmol}$) correspond à $K = 4{,}00$. Il ne faut donc pas présenter $4{,}12$ comme une valeur exacte : $K \approx 4$ est la lecture honnête.

          **Le piège de cette question.** Convertir en $\text{mol.L}^{-1}$ « pour faire propre » : c'est du travail inutile, et c'est là qu'on se trompe. $K$ est **sans dimension** dès que les nombres d'espèces s'équilibrent de part et d'autre — vérifie-le sur l'écriture avant de sortir la calculatrice.
        steps:
          - math: 'K = \frac{[\text{ester}]_{eq}\,[\text{eau}]_{eq}}{[\text{acide}]_{eq}\,[\text{alcool}]_{eq}}'
            note: "Définition du quotient de réaction à l'équilibre pour cette estérification."
          - math: 'K = \frac{x_{eq}^2}{(n_0 - x_{eq})^2}'
            note: "Deux espèces au numérateur, deux au dénominateur, même volume : les V se simplifient, on calcule en quantités de matière."
          - math: 'K = \left(\frac{67}{33}\right)^2 = (2{,}0303)^2'
            note: "x_eq = 67 mmol lu au plateau (question 2-3), n0 - x_eq = 33 mmol."
          - math: '\boxed{K \approx 4{,}1}'
            note: "Le K canonique de l'estérification équimolaire (chapitre 4). Le plateau dessine a 67,0 mmol donne 4,12 ; un plateau a 66,67 donnerait exactement 4,00."
      - id: q6
        stem: |-
          **2-6-** (0,75 pt) On mélange dans les mêmes conditions expérimentales précédentes, la quantité de matière $n_1 = 150\ \text{mmol}$ d'acide méthanoïque avec la quantité de matière $n_2 = 100\ \text{mmol}$ d'éthanol. S'assurer que la nouvelle valeur de l'avancement de la réaction à l'équilibre est $x'_{éq} = 78{,}5\ \text{mmol}$.
        reasoning: |-
          **Ce que la consigne demande vraiment.** « S'assurer que » n'est pas « calculer » : on peut, et c'est le chemin le plus court et le plus sûr, **vérifier** que la valeur proposée satisfait la constante d'équilibre — plutôt que résoudre le trinôme et comparer.

          **Pourquoi $K$ ne change pas.** « Dans les mêmes conditions expérimentales » veut dire à la **même température**. Or $K$ ne dépend que de la température, jamais des quantités initiales : c'est le pivot de tout le chapitre 6. On travaille donc avec le $K \approx 4$ de la question 2-5, sur un mélange qui n'est plus équimolaire.

          **Le nouveau tableau**, avec $n_1 = 150$ et $n_2 = 100\ \text{mmol}$ :

          | | acide | + alcool | $\rightleftharpoons$ ester | + eau |
          |---|---|---|---|---|
          | initial | $150$ | $100$ | $0$ | $0$ |
          | à l'équilibre | $150 - x'_{éq}$ | $100 - x'_{éq}$ | $x'_{éq}$ | $x'_{éq}$ |

          Les volumes se simplifient comme à la question 2-5, et il vient :

          $$K = \frac{x'^2_{éq}}{\left(150 - x'_{éq}\right)\left(100 - x'_{éq}\right)}$$

          **La vérification, en une ligne**, avec $x'_{éq} = 78{,}5\ \text{mmol}$ :

          $$\frac{78{,}5^2}{(150-78{,}5)(100-78{,}5)} = \frac{6162{,}25}{71{,}5 \times 21{,}5} = \frac{6162{,}25}{1537{,}25} \approx 4{,}01$$

          On retrouve bien $K \approx 4$ : la valeur proposée est cohérente, et l'écart aux $4{,}12$ lus sur la figure ($2{,}7\ \%$) est très en dessous de la précision d'une lecture graphique. **La valeur est vérifiée.**

          *(Chemin inverse, si l'on préfère résoudre : avec $K = 4{,}12$, l'équation $3{,}12\,x'^2 - 1030{,}5\,x' + 61830 = 0$ donne $x'_{éq} \approx 78{,}8\ \text{mmol}$, à $0{,}4\ \%$ de la valeur à vérifier. La seconde racine, $\approx 251\ \text{mmol}$, est à **rejeter** : elle dépasse $x_{max} = 100\ \text{mmol}$, l'alcool étant le réactif limitant.)*

          **Ce que le résultat enseigne, et c'est tout le chapitre 6.** Avec un mélange équimolaire, le rendement plafonnait à $\tau = 67/100 = 67\ \%$. Ici l'alcool est le réactif limitant ($100\ \text{mmol}$ contre $150$), et le rendement **par rapport à lui** devient :

          $$\tau' = \frac{x'_{éq}}{x'_{max}} = \frac{78{,}5}{100} = 78{,}5\ \%$$

          **Mettre un réactif en excès déplace l'équilibre dans le sens direct et améliore le rendement de l'autre réactif** — sans toucher à $K$, sans catalyseur, sans rien changer d'autre. C'est le premier des deux gestes du chapitre 6 (le second étant d'éliminer l'eau au fur et à mesure).

          **Le piège de cette question.** Croire que $K$ a changé parce que les quantités initiales ont changé. $K$ est fixé par la température seule ; ce sont les **quantités à l'équilibre** qui s'ajustent, pas la constante.
        steps:
          - math: 'K = \frac{x^{\prime 2}_{eq}}{\left(150 - x^{\prime}_{eq}\right)\left(100 - x^{\prime}_{eq}\right)}'
            note: "Nouveau tableau d'avancement, volumes simplifies comme a la question 2-5. K inchangé : même température."
          - math: '150 - 78{,}5 = 71{,}5 \qquad 100 - 78{,}5 = 21{,}5'
            note: "Quantités restantes à l'équilibre, avec la valeur proposée par la consigne."
          - math: '\frac{78{,}5^2}{71{,}5\times 21{,}5} = \frac{6162{,}25}{1537{,}25} \approx 4{,}01'
            note: "Vérification directe : on retrouve K voisin de 4, ce que la question demandait de s'assurer."
          - math: '\boxed{x^{\prime}_{eq} = 78{,}5\ \text{mmol}\ \text{verifie} \quad (K \approx 4)}'
            note: "Écart de 2,7 pourcent avec le K = 4,12 lu sur la figure : bien dans la tolerance d'une lecture graphique."
          - math: '\tau^{\prime} = \frac{x^{\prime}_{eq}}{x^{\prime}_{max}} = \frac{78{,}5}{100} = 78{,}5\ \% \quad > \quad \tau = 67\ \%'
            note: "L'alcool est limitant. Mettre l'acide en excès a fait passer le rendement de 67 a 78,5 pourcent : c'est le déplacement d'équilibre du chapitre 6."
