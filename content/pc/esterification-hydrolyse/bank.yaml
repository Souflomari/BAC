        stem: |-
          **(0,5 pt)** Quel est l'intérêt d'un chauffage à reflux ?
        reasoning: |-
          C'est exactement le chapitre 5 de cette leçon : le chauffage augmente l'agitation thermique, donc la fréquence des chocs efficaces (chapitre Transformations lentes et rapides), dans les deux sens à la fois — il accélère l'atteinte de l'équilibre sans en changer la position. Le montage à reflux permet de chauffer sans perdre de matière : les vapeurs qui s'échappent du mélange bouillant se condensent dans le réfrigérant et retombent dans le ballon, au lieu de s'évaporer dans l'air. *(Le catalyseur acide, quelques gouttes d'acide sulfurique concentré présentes dans la première expérience, joue le même rôle cinétique — voir la notion « Contrôle par un réactif ou par catalyse », chapitre 3 : il accélère l'estérification ET l'hydrolyse dans les mêmes proportions, sans déplacer l'équilibre.)*

          **Le piège de cette question.** Répondre « pour obtenir plus d'ester » : c'est précisément l'idée que le chapitre 5 démonte par le test des deux flacons (avec et sans chauffage/catalyseur), qui atteignent la même composition finale à des vitesses différentes. Le reflux et le catalyseur achètent du temps, jamais de l'ester en plus — c'est tout l'intérêt de comparer ici deux réactifs différents (acide contre anhydride) pour changer réellement le rendement, question 2.3 et 2.4.
