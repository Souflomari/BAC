    intro: |-
      **Réactions de l'acide butanoïque et de son anhydride sur l'éthanol (examen national, session normale 2017, Exercice I — Partie II, §2, 2,75 points sur les 7,00 de l'exercice).**

      *La Partie I de cet exercice — la pile aluminium-cuivre — vit sous la notion « Piles ». Le §1 de cette même Partie II — l'acide butanoïque avec l'eau, taux d'avancement final et $pK_A$ — vit sous la notion « Réactions acido-basiques ».*

      Pour comparer la réaction de l'acide butanoïque et la réaction de son anhydride sur l'éthanol, on réalise séparément deux expériences à la même température.

      - **La première expérience** : on introduit dans un ballon la quantité $n_0 = 0{,}3\ \text{mol}$ d'éthanol, la même quantité $n_0$ d'acide butanoïque, et quelques gouttes d'acide sulfurique concentré ; puis on chauffe à reflux le mélange. Une réaction d'estérification se produit.
      - **La deuxième expérience** : on introduit dans un autre ballon la quantité $n_0 = 0{,}3\ \text{mol}$ d'anhydride butanoïque et la même quantité $n_0$ d'éthanol, puis on chauffe à reflux le mélange. Une réaction chimique se produit.

      Les courbes (1) et (2) de la figure ci-dessous représentent respectivement l'évolution temporelle de l'avancement de la réaction lors de la première et de la deuxième expérience.

      **Figure A (courbes $x(t)$, mesurée sur les objets vectoriels du PDF natif).** Axe des abscisses $t\,(\text{min})$, gradué de $0$ à $70$ ; axe des ordonnées $x\,(\text{mol})$, gradué $0{,}1$ · $0{,}2$ · $0{,}3$. Deux courbes croissantes partant de l'origine, toutes deux asymptotiques. **La courbe (2)** (supérieure) plafonne à $x \approx 0{,}30\ \text{mol}$ — pratiquement la conversion totale des $n_0 = 0{,}3\ \text{mol}$ engagés — et atteint la moitié de son plateau ($0{,}15\ \text{mol}$) vers $t \approx 2{,}3\ \text{min}$. **La courbe (1)** (inférieure) plafonne à $x \approx 0{,}20\ \text{mol}$ et atteint la moitié de son plateau ($0{,}10\ \text{mol}$) vers $t \approx 8{,}3\ \text{min}$. *(L'étiquetage (1)/(2) est confirmé par chaîne de mesure indépendante de la proximité des cadres imprimés — voir le sourcing de cette entrée.)*
