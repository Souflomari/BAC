        reasoning: |-
          $\tau_f = x_f/x_{max}$, avec $x_{max} = n_0 = 0{,}3\ \text{mol}$ commun aux deux expériences (les deux réactifs sont introduits en quantités égales, stœchiométrie $1{:}1$ dans les deux cas), et $x_f$ le plateau réellement lu sur chaque courbe.

          $$\tau_f(1) = \frac{0{,}20}{0{,}30} \approx 0{,}67 \qquad \tau_f(2) = \frac{0{,}30}{0{,}30} \approx 1{,}0$$

          $\tau_f(2) \approx 1$ : la réaction de l'anhydride butanoïque sur l'éthanol (deuxième expérience) est **totale**. $\tau_f(1) \approx 0{,}67$ : la réaction de l'acide butanoïque sur l'éthanol (première expérience, une estérification classique) est **limitée** — et remarque ce que dit ce chiffre : $n_0$ égal des deux réactifs, tous deux à chaîne linéaire sans empêchement stérique, c'est très exactement le cas de l'« estérification simple » du rung R3 de cette leçon, dont le résultat canonique est $\tau = 2/3 \approx 0{,}667$. Le sujet retombe sur ce résultat presque au chiffre près.

          $$\boxed{\text{La reaction de l'anhydride sur l'ethanol (deuxieme experience) est TOTALE ; l'esterification (premiere experience) est LIMITEE}}$$

          **Le piège de cette question.** Diviser par $n_0$ commun, ce qui est correct ici, MAIS sans revérifier que les deux plateaux $x_f$ ont bien été relus sur CHAQUE courbe séparément (question 2.2) : une erreur de lecture de plateau se propage directement dans $\tau_f$, et c'est exactement ce qu'une réaction totale ($\tau_f \to 1$) contre une réaction limitée ($\tau_f < 1$) permet de trancher sans ambiguïté sur ce sujet.
