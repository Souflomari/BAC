          - math: '3y^2 - 4y + 0{,}12 = 0'
            note: "Développement et simplification de l'équation précédente."
          - math: 'y = \frac{4-\sqrt{16-1{,}44}}{6} = \frac{4-\sqrt{14{,}56}}{6}'
            note: "Racine du polynôme ; seule la racine la plus petite a un sens physique (l'autre dépasserait les quantités disponibles d'acide et d'alcool)."
          - math: '\boxed{y \approx 0{,}0307\ \text{mol}}'
            note: "Avancement supplémentaire après le nouvel ajout."
          - math: 'x_{total} = x_{eq} + y = 0{,}60+0{,}0307'
            note: "Avancement total depuis le tout début de l'expérience (avant même l'ajout)."
          - math: '\boxed{x_{total} \approx 0{,}631\ \text{mol}}'
            note: "Application numérique."
          - math: 'r_{nouveau} = \frac{x_{total}}{x_{max}} = \frac{0{,}631}{0{,}90}'
            note: "Nouveau rendement, rapporté à x_max = 0,90 mol : l'alcool n'a jamais reçu d'ajout et reste le réactif limitant de tout le système — l'acide total disponible (0,9+0,1=1,0 mol) le dépasse désormais."
          - math: '\boxed{r_{nouveau} \approx 0{,}701 = 70{,}1\ \%}'
            note: "Rendement amélioré par rapport aux 66,7 % de la question 5 : ajouter de l'acide en cours de route a bien déplacé l'équilibre, exactement le premier geste du chapitre 6."

