            note: "Un temps de demi-reaction plus petit signifie un état final atteint plus vite (chapitre 5, Suivi temporel)."
      - id: q3
        part: "2.3 — Comparer les taux d'avancement final, identifier la réaction totale"
        stem: |-
          **(0,75 pt)** Déterminer pour chaque expérience le taux d'avancement final de la réaction. En déduire laquelle des deux réactions chimiques est totale.
        reasoning: |-
          $\tau_f = x_f/x_{max}$, avec $x_{max} = n_0 = 0{,}3\ \text{mol}$ commun aux deux expériences (les deux réactifs sont introduits en quantités égales, stœchiométrie $1{:}1$ dans les deux cas), et $x_f$ le plateau réellement lu sur chaque courbe.

          $$\tau_f(1) = \frac{0{,}20}{0{,}30} \approx 0{,}67 \qquad \tau_f(2) = \frac{0{,}30}{0{,}30} \approx 1{,}0$$

          $\tau_f(2) \approx 1$ : la réaction de l'anhydride butanoïque sur l'éthanol (deuxième expérience) est **totale**. $\tau_f(1) \approx 0{,}67$ : la réaction de l'acide butanoïque sur l'éthanol (première expérience, une estérification classique) est **limitée** — et remarque ce que dit ce chiffre : $n_0$ égal des deux réactifs, tous deux à chaîne linéaire sans empêchement stérique, c'est très exactement le cas de l'« estérification simple » du chapitre 4 de cette leçon, dont le résultat canonique est $\tau = 2/3 \approx 0{,}667$. Le sujet retombe sur ce résultat presque au chiffre près.

          **Conclusion.** La réaction de l’anhydride sur l’éthanol (deuxième expérience) est **totale** ; l’estérification (première expérience) est **limitée**.

          **Le piège de cette question.** Diviser par $n_0$ commun, ce qui est correct ici, MAIS sans revérifier que les deux plateaux $x_f$ ont bien été relus sur CHAQUE courbe séparément (question 2.2) : une erreur de lecture de plateau se propage directement dans $\tau_f$, et c'est exactement ce qu'une réaction totale ($\tau_f \to 1$) contre une réaction limitée ($\tau_f < 1$) permet de trancher sans ambiguïté sur ce sujet.
        steps:
          - math: '\tau_f(1) = \frac{x_f(1)}{n_0} = \frac{0{,}20}{0{,}30} \approx 0{,}67'
            note: "Estérification (première expérience) : proche de 2/3, le cas canonique du chapitre 4 (K=4, même n0)."
          - math: '\tau_f(2) = \frac{x_f(2)}{n_0} = \frac{0{,}30}{0{,}30} \approx 1{,}0'
            note: "Anhydride (deuxième expérience) : plateau confondu avec n0 = 0,3 mol."
          - math: '\boxed{\tau_f(2) \approx 1 \implies \text{réaction de l anhydride TOTALE} \qquad \tau_f(1) \approx 0{,}67 \implies \text{estérification LIMITÉE}}'
            note: "Conclusion demandee par l'énoncé."
      - id: q4
        part: "2.4 — Écrire l'équation de la réaction totale"
        stem: |-
          **(0,75 pt)** En utilisant les formules semi-développées, écrire l'équation de la réaction chimique qui se produit lors de la deuxième expérience.
        reasoning: |-
          La deuxième expérience met en jeu l'anhydride butanoïque, pas l'acide : c'est le geste du chapitre 2 de la notion Contrôle par un réactif ou par catalyse — remplacer l'acide carboxylique par son anhydride pour obtenir une réaction rapide ET totale, exactement ce que les questions 2.2 et 2.3 viennent de confirmer par la mesure. L'anhydride butanoïque s'obtient formellement en retirant une molécule d'eau à deux molécules d'acide butanoïque et en soudant les deux restes par un atome d'oxygène central :

          $$\text{C}_3\text{H}_7-\text{CO}-\text{O}-\text{CO}-\text{C}_3\text{H}_7$$

          Avec l'éthanol, il réagit — comme tout anhydride d'acide (chapitre 2 de « Contrôle par un réactif ou par catalyse ») — par une réaction à UNE SEULE FLÈCHE, puisque le sous-produit n'est plus l'eau (qui pourrait réhydrolyser l'ester formé) mais l'acide butanoïque lui-même :

          $$\boxed{(\text{C}_3\text{H}_7\text{CO})_2\text{O} + \text{C}_2\text{H}_5-\text{OH} \longrightarrow \text{C}_3\text{H}_7-\text{COO}-\text{C}_2\text{H}_5 + \text{C}_3\text{H}_7\text{COOH}}$$

          **Contrôle par le nom.** L'ester formé se nomme, par la règle du chapitre 2 de cette leçon-ci (radical de l'acide en « -oate », puis « de » et le radical de l'alcool en « -yle ») : **butanoate d'éthyle**.

          **Le piège de cette question.** Écrire une double flèche $\rightleftharpoons$ par réflexe, comme pour l'estérification classique des chapitres 2 à 3 : la réaction d'un anhydride d'acide est TOTALE, une seule flèche $\longrightarrow$ — c'est précisément ce que la question 2.3 vient d'établir par le calcul ($\tau_f(2) \approx 1$), et l'équation doit le refléter.
        steps:
          - math: '(\text{C}_3\text{H}_7\text{CO})_2\text{O} + \text{C}_2\text{H}_5-\text{OH} \longrightarrow \text{C}_3\text{H}_7-\text{COO}-\text{C}_2\text{H}_5 + \text{C}_3\text{H}_7\text{COOH}'
            note: "Réaction TOTALE (une seule fleche) : anhydride + alcool -> ester + acide carboxylique (chapitre 2, notion Controle par un réactif ou par catalyse)."

