    intro: |-
      **Réaction de l'acide benzoïque avec l'éthanol (examen national, session normale 2015, Exercice 1 — Deuxième Partie, §2, 2,50 points).**

      *Le §1 de cette même Deuxième Partie — taux d'avancement final et $pK_A$ du couple $(\text{C}_6\text{H}_5\text{COOH}/\text{C}_6\text{H}_5\text{COO}^-)$ — vit sous la notion « État d'équilibre d'un système chimique », entrée bk-2015-n-x1. Cette entrée-ci en est indépendante.*

      L'acide benzoïque est utilisé dans la conservation des aliments et des boissons non alcooliques, ainsi que dans la fabrication de plusieurs composés organiques.

      **Données :**
      - Toutes les mesures ont été faites à $25\ ^\circ\text{C}$ ;
      - Masse molaire de l'acide benzoïque : $M(\text{C}_6\text{H}_5\text{COOH}) = 122\ \text{g.mol}^{-1}$ ;
      - Masse molaire de l'éthanol : $M(\text{C}_2\text{H}_5\text{OH}) = 46\ \text{g.mol}^{-1}$ ;
      - Masse volumique de l'éthanol pur : $\rho = 0{,}78\ \text{g.mL}^{-1}$
           ;
      - Masse molaire du benzoate d'éthyle : $M(\text{C}_6\text{H}_5\text{COOC}_2\text{H}_5) = 150\ \text{g.mol}^{-1}$.

      *Le benzoate d'éthyle est caractérisé par le goût des cerises, c'est pourquoi il est utilisé dans l'industrie alimentaire pour donner ce goût aux aliments synthétisés (encadré du sujet officiel).*

      Pour préparer le benzoate d'éthyle au laboratoire, on mélange dans un ballon un échantillon d'acide benzoïque de masse $m_{ac} = 2{,}44\ \text{g}$ avec un volume $V_{a\ell} = 10\ \text{mL}$ d'éthanol pur, puis on y ajoute quelques gouttes d'acide sulfurique concentré jouant le rôle d'un catalyseur. Le mélange est chauffé à reflux à température constante.
    questions:
      - id: q1
        part: "§2 — Réaction de l'acide benzoïque avec l'éthanol"
        stem: |-
          **2-1.** (0,5 pt) Quel est le rôle du catalyseur dans cette réaction ?
        reasoning: |-
          C'est très exactement le chapitre 5 de cette leçon : un catalyseur acide — ici quelques gouttes d'acide sulfurique concentré, le même réactif que celui du chapitre 1 — accélère l'estérification, mais **dans les deux sens à la fois** : il facilite tout autant l'hydrolyse inverse. Le rapport entre les deux vitesses, celui-là même qui fixe la position de l'équilibre, ne bouge donc pas.

          Le catalyseur permet d'atteindre l'état final (l'équilibre entre l'acide, l'éthanol, l'ester et l'eau) **plus rapidement**, sans changer ni le rendement final ni la composition du mélange à l'équilibre.

          **Le piège de cette question.** Répondre « il améliore le rendement » : c'est précisément l'idée fausse que le chapitre 5 démonte par le test des deux flacons (avec et sans catalyseur), qui atteignent la **même** composition finale à des vitesses différentes. Le catalyseur achète du temps, jamais de l'ester en plus.
      - id: q2
        stem: |-
          **2-2.** (0,5 pt) Écrire, en utilisant les formules semi-développées, l'équation modélisant la transformation ayant lieu entre l'acide benzoïque et l'éthanol.
        reasoning: |-
          On applique le geste du chapitre 2 : le groupe $-COOH$ de l'acide et le groupe $-OH$ de l'alcool se combinent, une molécule d'eau en part, et ce qui reste des deux chaînes se relie par le groupe ester $-COO-$. Ici $R = \text{C}_6\text{H}_5-$ (le radical de l'acide benzoïque, un groupe phényle) et $R' = \text{C}_2\text{H}_5-$ (le radical de l'éthanol).

          $$\boxed{\text{C}_6\text{H}_5-\text{COOH} + \text{C}_2\text{H}_5-\text{OH} \rightleftharpoons \text{C}_6\text{H}_5-\text{COO}-\text{C}_2\text{H}_5 + \text{H}_2\text{O}}$$

          Double flèche, comme toujours pour une estérification (chapitre 3) : c'est une réaction limitée, pas totale — exactement ce que le rendement de la question 2-3 va vérifier avec un chiffre.

          **Le nom de l'ester, pour vérifier l'écriture.** Radical de l'acide benzoïque : « benzoate ». Radical de l'éthanol : « éthyle ». L'ester formé est donc le **benzoate d'éthyle** — cohérent avec la masse molaire donnée dans l'énoncé, $M = 150\ \text{g.mol}^{-1}$, et avec le contrôle gratuit $M(\text{ester}) = M(\text{acide}) + M(\text{éthanol}) - M(\text{H}_2\text{O}) = 122+46-18 = 150$.

          **Le piège de cette question.** L'énoncé demande les formules **semi-développées** : écrire l'équation générale $R-COOH + R'-OH \rightleftharpoons R-COO-R' + H_2O$ sans remplacer $R$ et $R'$ par $\text{C}_6\text{H}_5-$ et $\text{C}_2\text{H}_5-$ ne répond pas à la consigne.
      - id: q3
        stem: |-
          **2-3.** (1 pt) On obtient à la fin de la réaction une quantité de masse $m_e = 2{,}25\ \text{g}$ de benzoate d'éthyle. Calculer le rendement de cette réaction.
        reasoning: |-
          Le rendement rapporte l'ester réellement obtenu à celui qu'aurait donné une réaction **totale** : $r = m_{obtenue}/m_{max}$, la version en masses du même geste qu'au chapitre 4 ($\tau$, en avancement). Il faut d'abord identifier le réactif limitant — et ici, contrairement au cas de l'estérification simple du chapitre 4 (quantités égales), les deux réactifs ne sont PAS en proportions égales : il faut convertir les deux masses en quantités de matière et comparer.

          $$n(\text{acide}) = \frac{m_{ac}}{M(\text{acide})} = \frac{2{,}44}{122} = 2{,}00\times10^{-2}\ \text{mol}$$

          Pour l'éthanol, il faut d'abord passer par sa masse — c'est ici qu'intervient la donnée $\rho$, dont la valeur utilisable est $0{,}78\ \text{g.mL}^{-1}$ (voir la correction déclarée dans les données ci-dessus) :

          $$m(\text{éthanol}) = \rho \times V_{a\ell} = 0{,}78\times10 = 7{,}8\ \text{g} \implies n(\text{éthanol}) = \frac{7{,}8}{46} \approx 0{,}1696\ \text{mol}$$

          L'éthanol ($\approx 0{,}17$ mol) est en **large excès** devant l'acide benzoïque ($0{,}0200$ mol) : avec une stœchiométrie $1{:}1{:}1{:}1$ (question 2-2), c'est l'acide benzoïque qui est le réactif **limitant**. La masse maximale d'ester correspond donc à la conversion totale de l'acide :

          $$m_{max} = n(\text{acide})\times M(\text{ester}) = 2{,}00\times10^{-2}\times150 = 3{,}00\ \text{g}$$

          $$r = \frac{m_e}{m_{max}} = \frac{2{,}25}{3{,}00}$$

          $$\boxed{r = 0{,}75 = 75{,}00\ \%}$$

          Un rendement rond, cohérent avec un couple acide/alcool tous deux sans empêchement stérique majeur — nettement plus proche des $66{,}7\ \%$ de l'« estérification simple » du chapitre 4 (quantités égales) qu'il ne l'aurait été sans excès d'éthanol, exactement ce que prédit le chapitre 6 : un réactif en excès pousse l'équilibre plus loin que $\tau \approx 2/3$.

          **Le piège de cette question.** Prendre l'acide comme réactif limitant par réflexe (« c'est toujours l'acide dans les exercices simples ») sans vérifier le calcul : ici c'est vrai, mais seulement parce que $n(\text{éthanol}) \gg n(\text{acide})$ — un calcul qu'il faut refaire à chaque énoncé, jamais supposer. Deuxième piège : garder l'unité imprimée sans la questionner, alors qu'une masse volumique en g/L (ce que la coquille imprime) donnerait une masse d'éthanol mille fois trop petite et un rendement supérieur à $100\ \%$ — un signal qui doit alerter, jamais être accepté tel quel (voir la correction déclarée dans les données).
        steps:
          - math: 'n(\text{acide}) = \frac{2{,}44}{122} = 2{,}00\times10^{-2}\ \text{mol}'
            note: "Quantité de matière d'acide benzoïque, depuis la masse donnée."
          - math: 'm(\text{éthanol}) = \rho\times V_{a\ell} = 0{,}78\times10 = 7{,}8\ \text{g}'
            note: "Masse d'éthanol, avec la valeur utilisable de rho (0,78 g/mL, corrigee - voir les données)."
          - math: 'n(\text{éthanol}) = \frac{7{,}8}{46} \approx 0{,}1696\ \text{mol}'
            note: "Quantité de matière d'éthanol : très supérieure a celle de l'acide, donc éthanol en excès."
          - math: 'n(\text{éthanol}) \gg n(\text{acide}) \implies \text{acide benzoïque = réactif limitant}'
            note: "Stoechiometrie 1:1:1:1 (question 2-2) : le réactif le moins abondant limite la réaction."
          - math: 'm_{max} = n(\text{acide})\times M(\text{ester}) = 2{,}00\times10^{-2}\times150 = 3{,}00\ \text{g}'
            note: "Masse maximale d'ester si l'acide, limitant, était totalement converti."
          - math: 'r = \frac{m_e}{m_{max}} = \frac{2{,}25}{3{,}00}'
            note: "Rendement = masse réellement obtenue / masse maximale théorique."
          - math: '\boxed{r = 0{,}75 = 75{,}00\ \%}'
            note: "Valeur ronde : coherente avec l'excès d'éthanol (chapitre 6), au-dessus des 66,7 pourcent de l'estérification simple (chapitre 4)."
      - id: q4
        stem: |-
          **2-4.** (0,5 pt) Pour améliorer le rendement de synthèse de benzoate d'éthyle, on remplace l'acide benzoïque par un autre réactif. Donner le nom de ce réactif et écrire da formule semi-développée. *(« da » tel qu'imprimé — défaut du sujet officiel, sans incidence)*
        reasoning: |-
          SCOPE NOTE : le rendement obtenu à la question 2-3 ($75\ \%$) est déjà au-dessus des $66{,}7\ \%$ de l'estérification simple, grâce à l'excès d'éthanol — mais rester avec l'acide benzoïque, aussi favorisée soit la réaction, plafonne toujours à un équilibre. Pour dépasser tout plafond d'équilibre, le levier n'est ni un déplacement (chapitre 6 de cette leçon-ci, déjà exploité par l'excès d'éthanol) ni un catalyseur (question 2-1) : c'est de **changer de réactif**, le geste du chapitre 2 de la notion « Contrôle par un réactif ou par catalyse ».

          On remplace l'acide benzoïque $\text{C}_6\text{H}_5-\text{COOH}$ par son **anhydride**, l'anhydride benzoïque : on prend deux molécules d'acide benzoïque, on leur retire une molécule d'eau, et on soude les deux restes par un atome d'oxygène central.

          $$\boxed{\text{C}_6\text{H}_5-\text{CO}-\text{O}-\text{CO}-\text{C}_6\text{H}_5}$$

          Avec l'éthanol, cet anhydride réagirait par une réaction à **une seule flèche** — rapide (quelques minutes, souvent sans chauffage) et **totale** ($\tau = 1$, pas de plafond à $2/3$ ni même à $75\ \%$) — puisque le sous-produit n'est plus de l'eau (qui pourrait réhydrolyser l'ester) mais de l'acide benzoïque lui-même.

          **Le piège de cette question.** Répondre « il faut chauffer plus fort » ou « ajouter plus de catalyseur » : ce sont des leviers cinétiques (chapitre 5, question 2-1), qui accélèrent l'arrivée à l'équilibre sans jamais en changer la position. La question demande un réactif de substitution, pas un réglage des conditions expérimentales — c'est le signal qui pointe vers le chapitre 2 de « Contrôle par un réactif », pas vers un chapitre déjà mobilisé dans ce même exercice.

