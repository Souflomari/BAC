    intro: |-
      **Étude d'une réaction d'estérification avec l'acide éthanoïque (examen national, session de rattrapage 2025 — Exercice 1, §2, 2,0 points).**

      *Cet exercice de 7 points étudie aussi, dans ses deux autres sous-parties : une solution aqueuse d'acide éthanoïque (§1, sous la notion « Réactions acido-basiques ») ; une hydrolyse basique d'un ester (§3, sous la notion « Suivi temporel d'une transformation — vitesse de réaction »).*

      Pour synthétiser l'éthanoate d'éthyle noté E, on fait réagir $0{,}100\ \text{mol}$ d'acide éthanoïque avec $0{,}100\ \text{mol}$ d'éthanol $C_2H_5OH$. Lorsque la réaction est terminée, on dose, dans des conditions expérimentales bien déterminées, l'acide restant avec une solution aqueuse $S_B$ d'hydroxyde de sodium $Na^+_{(aq)} + HO^-_{(aq)}$ de concentration $C_B = 1{,}50\ \text{mol.L}^{-1}$. Le volume de $S_B$ versé à l'équivalence est $V_{BE} = 22{,}0\ \text{mL}$.
    questions:
      - id: q1
        stem: |-
          **2-1. (0,75 pt)** Écrire, en utilisant les formules semi-développées, l'équation de la réaction d'estérification qui s'est produite.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On applique le geste du rung R1 : le groupe $-COOH$ de l'acide éthanoïque et le groupe $-OH$ de l'éthanol se combinent, une molécule d'eau en part, et ce qui reste des deux chaînes se relie par le groupe ester $-COO-$. C'est, au mot près, l'exemple travaillé qui ouvre ce chapitre.

          $$\boxed{CH_3-COOH + CH_3-CH_2-OH \rightleftharpoons CH_3-COO-CH_2-CH_3 + H_2O}$$

          Double flèche : c'est une estérification, réaction **limitée** (rung R2) — c'est ce que le rendement de la question 2-3 va confirmer.

          **Le nom de l'ester, pour vérifier l'écriture.** Radical de l'acide éthanoïque : « éthanoate ». Radical de l'éthanol : « éthyle ». L'ester $E$ est donc l'**éthanoate d'éthyle** — exactement l'exemple nommé au rung R1.

          **Le piège nommé de cette question.** L'énoncé demande les formules **semi-développées** : écrire l'équation générale $R-COOH + R'-OH \rightleftharpoons R-COO-R' + H_2O$ sans remplacer $R$ et $R'$ par $CH_3-$ et $CH_3-CH_2-$ ne répond pas à la consigne et coûte des points, même si la logique de construction est correcte.
      - id: q2
        stem: |-
          **2-2. (0,5 pt)** Calculer la quantité de matière $n_r$ d'acide restant en fin de la réaction d'estérification.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** SCOPE NOTE (voir le commentaire en tête de cette entrée) : la relation d'équivalence d'un dosage n'est enseignée par aucun rung de cette leçon-ci, qui ne traite que l'équilibre estérification/hydrolyse. Elle appartient nommément au rung R9 de la notion **Réactions acido-basiques** : à l'équivalence, la quantité de réactif titré présent égale la quantité de réactif titrant versé, $n_r = C_B\,V_{BE}$ — l'acide restant, ici, joue le rôle du titré, et la soude celui du titrant.

          $$n_r = C_B\,V_{BE} = 1{,}50 \times 22{,}0\times10^{-3}$$

          $$\boxed{n_r \approx 3{,}30\times10^{-2}\ \text{mol}}$$

          **Le piège nommé de cette question.** Convertis $V_{BE}$ en litres avant de multiplier ($22{,}0\ \text{mL} = 22{,}0\times10^{-3}\ \text{L}$) : $C_B$ est donnée en $\text{mol.L}^{-1}$, et laisser $V_{BE}$ en millilitres donnerait un résultat mille fois trop grand.
      - id: q3
        stem: |-
          **2-3. (0,75 pt)** En exploitant le tableau d'avancement de la réaction d'estérification, déterminer son rendement.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le rendement rapporte l'ester réellement obtenu à celui qu'aurait donné une réaction **totale** : $r = x/x_{max}$ — le même geste qu'au rung R3 de cette leçon, où $\tau \approx 2/3$ jouait ce rôle pour le cas des quantités égales. Le mélange est équimolaire ($0{,}100\ \text{mol}$ d'acide, $0{,}100\ \text{mol}$ d'alcool) et tous les coefficients stœchiométriques valent $1$ : si la réaction était totale, les deux réactifs s'épuiseraient exactement ensemble, donc $x_{max} = n_0 = 0{,}100\ \text{mol}$.

          **Le tableau d'avancement, exploité à l'état final.** L'acide restant, dosé à la question 2-2, donne l'avancement réellement atteint par différence :

          $$x = n_0 - n_r = 0{,}100 - 3{,}30\times10^{-2}$$

          $$\boxed{x \approx 6{,}70\times10^{-2}\ \text{mol}}$$

          (C'est aussi la quantité d'ester $E$ formée : un mole d'ester par mole d'avancement, coefficient $1$.)

          $$r = \frac{x}{x_{max}} = \frac{6{,}70\times10^{-2}}{0{,}100}$$

          $$\boxed{r \approx 0{,}670 = 67{,}0\ \%}$$

          **Le piège nommé de cette question.** Ne calcule pas le rendement à partir de l'acide **restant** directement ($n_r/n_0$) : ce rapport donnerait la fraction d'acide **n'ayant pas réagi**, pas la fraction convertie en ester. Il faut d'abord passer par l'avancement $x = n_0 - n_r$, puis rapporter $x$ à $x_{max}$ — deux soustractions dans des directions opposées, faciles à inverser sous pression.
