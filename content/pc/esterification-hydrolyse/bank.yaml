          $$\boxed{t_{1/2}(\text{estérification}) \approx 8\ \text{min} \qquad t_{1/2}(\text{anhydride}) \approx 2\ \text{min}}$$

          Un $t_{1/2}$ plus petit signifie que l'état final est atteint plus vite : **la réaction de l'anhydride butanoïque sur l'éthanol (deuxième expérience) est la plus rapide.**

          **Le piège de cette question.** Chercher la moitié de $n_0 = 0{,}3\ \text{mol}$ sur les DEUX courbes : ça marche pour la courbe (2), qui plafonne bien à $0{,}3$, mais donnerait une lecture fausse sur la courbe (1), dont le plateau réel ($0{,}20\ \text{mol}$) est inférieur à $n_0$ — exactement la trace visible d'une réaction limitée, objet de la question suivante.
