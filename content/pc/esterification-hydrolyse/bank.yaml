        (agent-vérificateur-adversarial, 2026-08-07) PUIS relecture de
        contrôle indépendante d'un second vérificateur adversarial
        (2026-08-07) confirmant point par point la figure corrigée (mesures
        pixel refaites sur upload-85304/0002-big.jpg et 0003-big.jpg) —
        docs/sujets/pc/esterification-hydrolyse.md, statut « vérifié ».
        Barème en marge recompté : $0{,}5+0{,}5+0{,}5+0{,}5+0{,}75+0{,}5=
        3{,}25$. Chimie re-dérivée et cohérente (recontrôlée indépendamment
        ici) : composition à l'équilibre lue au palier commun aux deux
        courbes ($n_{a,eq}=0{,}30$ mol pour les deux mélanges, $x_{eq}=
        0{,}60$ mol) $\Rightarrow K=(0{,}60/0{,}30)^2=4$, identique au $K=4$
        imprimé en tête de la question 3.6 (contrôle croisé) ; rendement
        $r=x_{eq}/x_{max}=0{,}60/0{,}90\approx66{,}7\ \%$ ; après ajout de
        $n=0{,}1$ mol d'acide à l'équilibre, $Q_r=0{,}36/0{,}12=3<K$,
        l'avancement supplémentaire $y$ vérifie $3y^2-4y+0{,}12=0
        \Rightarrow y\approx0{,}0307$ mol, avancement total
        $\approx0{,}631$ mol pour $x_{max}=0{,}9$ mol $\Rightarrow$ nouveau
        rendement $\approx70{,}1\ \%$. Aucun recoupement avec le sommet de
        leçon (r-bac transcrit 2018, acide lactique + méthanol ; r-variation,
        acide butanoïque + éthanol) ni avec bk-2018-n-x1 (même sujet 2018) —
        voir l'en-tête du fichier.
    intro: |-
      **Étude de la réaction de l'acide éthanoïque avec le méthanol (examen national, session normale 2023, Exercice 1 — §3).**

      On réalise deux mélanges équimolaires de l'acide éthanoïque avec du méthanol $CH_3OH$ : $n_0(CH_3COOH) = n_0(CH_3OH) = 0{,}9\ \text{mol}$.

      Le suivi temporel de la quantité de matière $n_a$ de l'acide éthanoïque dans chaque mélange, à une même température $\theta$, a permis d'obtenir les courbes $C_1$ et $C_2$ de la figure ci-contre. L'une des deux courbes est obtenue en utilisant un catalyseur pour l'un des deux mélanges.

      **Figure (courbes $n_a = f(t)$).** Axe des ordonnées $n_a$ (mol), traits principaux chiffrés $0{,}2$ et $0{,}4$ (une division $=0{,}2$ mol, bord supérieur du cadre $=1{,}0$ mol) ; axe des abscisses $t$ (h), traits principaux chiffrés $5$ et $10$ (une division $=5$ h, bord droit du cadre $=30$ h) ; sous-quadrillage fin à 10 subdivisions par division dans les deux sens.

      Les deux courbes partent du même point, $n_a = 0{,}90\ \text{mol}$ à $t=0$ (conforme à $n_0$). La courbe $C_1$ (étiquette écrite sous la courbe) décroît vite et atteint son palier la première, vers $t\approx13$–$14$ h. La courbe $C_2$ (étiquette écrite au-dessus de la courbe) décroît plus progressivement et reste au-dessus de $C_1$ jusque vers $t\approx20$ h. Les deux courbes rejoignent ensuite le **même palier**, $n_a\approx0{,}30$ mol, et se confondent en un seul tracé de $t\approx20$ h jusqu'au bord droit du cadre ($t=30$ h).
    questions:
      - id: q1
        part: "§3 — Étude de la réaction de l'acide éthanoïque avec le méthanol"
        stem: |-
          **(0,5 pt)** Écrire l'équation modélisant la réaction qui se produit, en utilisant les formules semi-développées.
        reasoning: |-
          On applique le geste de R1 : le groupe $-COOH$ de l'acide éthanoïque et le groupe $-OH$ du méthanol se combinent, une molécule d'eau en part, et ce qui reste des deux chaînes se relie par le groupe ester $-COO-$. Avec la double flèche de la réaction limitée (R2) :

          $$CH_3-COOH + CH_3-OH \rightleftharpoons CH_3-COO-CH_3 + H_2O$$

          (L'ester ainsi formé, non demandé ici, se nomme par la règle du rung R1 l'éthanoate de méthyle — le radical de l'acide éthanoïque donne « éthanoate », celui du méthanol donne « méthyle ».)
      - id: q2
        stem: |-
          **(0,5 pt)** Indiquer, en justifiant la réponse, la courbe correspondant à la réaction utilisant le catalyseur.
        reasoning: |-
          Un catalyseur, au rung R4, ne déplace jamais la position de l'équilibre — il accélère seulement la vitesse à laquelle on l'atteint, dans les deux sens à la fois. Les deux courbes doivent donc, à terme, rejoindre le même palier — ce que la figure confirme ($n_a\approx0{,}30$ mol pour les deux). Seule la vitesse pour y parvenir les distingue : $C_1$ atteint son palier la première (vers $13$–$14$ h), $C_2$ met presque deux fois plus longtemps (vers $20$ h). La courbe qui rejoint l'équilibre le plus vite, sans en changer la position finale, est celle du mélange catalysé.

          C'est donc la courbe $\boxed{C_1}$ qui correspond à la réaction catalysée.
      - id: q3
        stem: |-
          **(0,5 pt)** Déterminer la composition du mélange réactionnel à l'équilibre.
        reasoning: |-
          Le palier commun aux deux courbes, lu sur le graphe, donne $n_a\approx0{,}30$ mol d'acide éthanoïque restant à l'équilibre, pour les deux mélanges (rung R2 : c'est un équilibre dynamique, pas un arrêt, et sa position ne dépend pas du catalyseur, question précédente). Par symétrie du mélange équimolaire (coefficients tous égaux à $1$), le méthanol restant vaut lui aussi $0{,}30$ mol. L'avancement à l'équilibre s'en déduit directement, puis la quantité d'ester et d'eau formés.
        steps:
          - math: 'n(CH_3COOH)_{eq} = n(CH_3OH)_{eq} \approx 0{,}30\ \text{mol}'
            note: "Lecture du palier commun aux deux courbes sur le graphe."
          - math: 'x_{eq} = n_0 - n_{a,eq} = 0{,}90-0{,}30'
            note: "Avancement à l'équilibre, par différence avec la quantité initiale."
          - math: '\boxed{x_{eq} = 0{,}60\ \text{mol}}'
            note: "Donc n(ester)_eq = n(eau)_eq = 0,60 mol : c'est la composition complète du mélange à l'équilibre."
      - id: q4
        stem: |-
          **(0,5 pt)** Trouver la valeur de $t_{1/2}$, le temps de demi-réaction dans le cas de la transformation chimique correspondant à la courbe $C_2$.
        reasoning: |-
          SCOPE NOTE (voir l'en-tête du fichier) : le temps de demi-réaction $t_{1/2}$ n'est défini par aucun rung de cette leçon — R1–R6 portent sur l'écriture, la position et le déplacement de l'équilibre, jamais sur un repère de vitesse comme celui-ci. Sa définition générale, mobilisée ici sans qu'aucun rung ne l'introduise : c'est l'instant où l'avancement atteint la moitié de sa valeur à l'équilibre. Ici $x_{eq}=0{,}60$ mol (question précédente), donc $t_{1/2}$ est l'instant où $x=0{,}30$ mol, c'est-à-dire où $n_a = n_0 - 0{,}30 = 0{,}60$ mol. Il reste à repérer, sur la courbe $C_2$, l'instant où elle croise cette valeur — une lecture graphique.
        steps:
          - math: 'n_a(t_{1/2}) = n_0 - \frac{x_{eq}}{2} = 0{,}90 - 0{,}30'
            note: "Définition du temps de demi-réaction : l'instant où l'avancement vaut la moitié de x_eq."
          - math: '\boxed{n_a(t_{1/2}) = 0{,}60\ \text{mol}}'
            note: "Valeur à repérer sur l'axe des ordonnées."
          - math: '\boxed{t_{1/2} \approx 3{,}7\ \text{h}}'
            note: "Lecture graphique : instant où la courbe C2 croise n_a = 0,60 mol."
      - id: q5
        stem: |-
          **(0,75 pt)** Calculer le rendement de la transformation chimique étudiée.
        reasoning: |-
          Le rendement rapporte l'avancement réellement atteint à celui qu'aurait donné une réaction totale : $r = x_{eq}/x_{max}$ — exactement le geste du rung R3, où $\tau$ jouait ce même rôle. Le mélange est équimolaire et tous les coefficients valent $1$ : si la réaction était totale, les deux réactifs s'épuiseraient ensemble, donc $x_{max} = n_0 = 0{,}90$ mol. L'avancement à l'équilibre, $x_{eq}=0{,}60$ mol, a déjà été lu au graphe (question 3).
        steps:
          - math: 'x_{max} = n_0 = 0{,}90\ \text{mol}'
            note: "Mélange équimolaire, coefficients tous égaux à 1 (rung R3)."
          - math: 'r = \frac{x_{eq}}{x_{max}} = \frac{0{,}60}{0{,}90}'
            note: "On rapporte l'avancement à l'équilibre (lu au graphe, question 3) à l'avancement maximal."
          - math: '\boxed{r \approx 0{,}667 = 66{,}7\ \%}'
            note: "Exactement le cas particulier K=4 du rung R3 (tau = 2/3) : cohérence confirmée par la question suivante, qui donne K=4."
      - id: q6
        stem: |-
          **(0,5 pt)** Quand l'état d'équilibre est atteint, on ajoute à l'un des deux mélanges réactionnels la quantité de matière $n = 0{,}1\ \text{mol}$ d'acide éthanoïque. Sachant que la constante d'équilibre de la transformation chimique étudiée est $K = 4$, trouver la nouvelle valeur du rendement de cette transformation.
        reasoning: |-
          On retrouve exactement le critère du rung R5 : comparer $Q_r$ à $K$ pour savoir dans quel sens le système va évoluer. Juste après l'ajout, avant toute nouvelle évolution, les quantités valent : acide $0{,}30+0{,}10=0{,}40$ mol (l'équilibre de la question 3, plus l'ajout), alcool $0{,}30$ mol (inchangé), ester et eau $0{,}60$ mol chacun (inchangés — l'ajout ne porte que sur l'acide).

          $$Q_r = \frac{[ester][eau]}{[acide][alcool]} = \frac{0{,}60\times0{,}60}{0{,}40\times0{,}30} = \frac{0{,}36}{0{,}12} = 3$$

          $Q_r = 3 < K = 4$ : exactement le signe du rung R5, le système repart dans le sens direct (l'estérification l'emporte de nouveau) jusqu'à ce que $Q_r$ rejoigne $K$. On construit alors un nouveau tableau d'avancement, avec $y$ l'avancement supplémentaire à partir de cet instant — même geste qu'au rung R5 pour l'excès d'alcool, mais ici on repart d'un état déjà partiellement avancé, pas de zéro.
        steps:
          - math: '\frac{(0{,}60+y)^2}{(0{,}40-y)(0{,}30-y)} = 4'
            note: "Nouveau tableau d'avancement, y = avancement supplémentaire à partir de l'instant de l'ajout."
          - math: '3y^2 - 4y + 0{,}12 = 0'
            note: "Développement et simplification de l'équation précédente."
          - math: 'y = \frac{4-\sqrt{16-1{,}44}}{6} = \frac{4-\sqrt{14{,}56}}{6}'
            note: "Racine du polynôme ; seule la racine la plus petite a un sens physique (l'autre dépasserait les quantités disponibles d'acide et d'alcool)."
          - math: '\boxed{y \approx 0{,}0307\ \text{mol}}'
            note: "Avancement supplémentaire après le nouvel ajout."
          - math: 'x_{total} = x_{eq} + y = 0{,}60+0{,}0307'
            note: "Avancement total depuis le tout début de l'expérience (avant même l'ajout)."
          - math: '\boxed{x_{total} \approx 0{,}631\ \text{mol}}'
            note: "Application numérique."
          - math: 'r_{nouveau} = \frac{x_{total}}{x_{max}} = \frac{0{,}631}{0{,}90}'
            note: "Nouveau rendement, rapporté à x_max = 0,90 mol : l'alcool n'a jamais reçu d'ajout et reste le réactif limitant de tout le système — l'acide total disponible (0,9+0,1=1,0 mol) le dépasse désormais."
          - math: '\boxed{r_{nouveau} \approx 0{,}701 = 70{,}1\ \%}'
            note: "Rendement amélioré par rapport aux 66,7 % de la question 5 : ajouter de l'acide en cours de route a bien déplacé l'équilibre, exactement le premier geste du rung R5."

