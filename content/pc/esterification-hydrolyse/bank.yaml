        reasoning: |-
          $t_{1/2}$ est défini, au chapitre 5 de la notion Suivi temporel d'une transformation — vitesse de réaction, comme l'instant où l'avancement atteint la moitié de son plateau observé : $x(t_{1/2}) = x_{plateau}/2$. C'est le plateau RÉELLEMENT atteint par CHAQUE courbe qui sert de référence — pas la valeur commune $n_0 = 0{,}3\ \text{mol}$ — puisqu'une des deux réactions, on va le voir à la question 2.3, ne va pas jusqu'au bout.

