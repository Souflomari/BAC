notion: transformations-deux-sens
skill_code: pc_transformations_deux_sens
misconceptions:
  # Déclarées le 2026-09-05. Les checkpoints de la leçon visaient déjà ces
  # neuf erreurs par leur id ; l'inventaire, lui, était resté `[]` — la chaîne
  # comptait les tags, mais rien ne pouvait en afficher le libellé.
  # Deux entrées ajoutées le 2026-09-05 en taguant le BANC (les neuf autres
  # venaient des checkpoints, qui ne comptent pas au plancher).
  - id: mc.physics.pc_transformations_deux_sens.vitesse-implique-avancement
    label: "« Une réaction lente finit forcément par aller jusqu'au bout, puisqu'elle a le temps »"
    description: >
      L'élève déduit l'avancement final de la durée observée : plus une
      transformation met de temps à se stabiliser, plus elle serait totale.
      Variante : il nie la lenteur constatée plutôt que de renoncer à la règle.
    contradicts_principle: >
      La durée que met une transformation à se stabiliser ne renseigne EN RIEN
      sur son caractère total ou limité. Une transformation peut être lente et
      totale (la rouille), rapide et limitée. Vitesse et avancement final sont
      deux propriétés indépendantes.

  - id: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
    label: "« On ne peut rien conclure sans mesure exacte » — alors que le qualitatif suffit"
    description: >
      Devant une information qualitative pourtant décisive (« riche en
      produits », « pauvre en réactif », deux tests identiques à cinq heures
      d'intervalle), l'élève réclame des concentrations exactes, un autre
      protocole, ou invoque un critère hors sujet pour ne pas trancher.
    contradicts_principle: >
      Le sens qui domine se lit dans la comparaison RELATIVE des quantités : un
      mélange riche en produits et pauvre en réactif évolue en sens inverse,
      sans qu'aucun chiffre soit nécessaire. Et deux tests identiques à cinq
      heures d'intervalle établissent que l'état final est atteint. Refuser de
      conclure quand l'information suffit est une erreur au même titre que
      conclure à tort.

  - id: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
    label: "« Toute réaction finit par consommer entièrement ses réactifs, il suffit d'attendre »"
    description: "L'élève tient le caractère total pour la règle et le temps pour le seul obstacle : avec assez de patience, tout réactif disparaîtrait."
    contradicts_principle: "Quand la réaction inverse coexiste, le système se stabilise avec les réactifs ENCORE PRÉSENTS — indéfiniment. Le temps ne fait pas disparaître un réactif : de l'acide et de l'alcool restent détectables des semaines après."

  - id: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
    label: "« Assez de catalyseur (ou assez de temps) pousse la réaction jusqu'au bout »"
    description: "L'élève attribue au catalyseur, ou à la durée, un pouvoir sur la composition finale."
    contradicts_principle: "Un catalyseur accélère l'ARRIVÉE à l'état stabilisé, il n'en change pas la composition. Avec dix fois plus de catalyseur, il resterait exactement autant d'acide et d'alcool."

  - id: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
    label: "« Une transformation limitée, c'est une transformation où il ne se passe presque rien »"
    description: "L'élève confond « s'arrêter avant la fin » et « produire une quantité négligeable »."
    contradicts_principle: "Une transformation limitée produit une quantité tout à fait notable de produits — assez, pour l'estérification, pour donner une odeur fruitée franche. « Non totale » ne veut pas dire « nulle »."

  - id: mc.physics.pc_transformations_deux_sens.equilibre-coexistence-signifie-arret
    label: "« À l'équilibre, tout est figé : plus aucune molécule ne réagit »"
    description: "L'élève lit la stabilité des quantités globales comme l'arrêt de l'activité microscopique."
    contradicts_principle: "Ce qui ne change plus, ce sont les quantités GLOBALES. Les deux réactions continuent et se compensent exactement, à la même vitesse : c'est un équilibre DYNAMIQUE, pas un arrêt."

  - id: mc.physics.pc_transformations_deux_sens.double-fleche-signifie-lente
    label: "« Le mélange se stabilise parce que la réaction est devenue trop lente »"
    description: "L'élève explique l'arrêt apparent par un ralentissement, et non par la compensation des deux sens."
    contradicts_principle: "Rapide ou lente, une transformation limitée s'arrête au MÊME état final : ce qui la stabilise est l'égalité des vitesses directe et inverse, pas leur faiblesse. La vitesse est une question séparée."

  - id: mc.physics.pc_transformations_deux_sens.reversible-jamais-quasi-totale
    label: "« Une réaction à double flèche reste toujours nettement limitée ($\\tau$ loin de 1) »"
    description: "L'élève déduit de la double flèche une borne sur le taux d'avancement final."
    contradicts_principle: "« Réversible » dit que les DEUX SENS existent, pas jusqu'où la transformation va. Acide éthanoïque + ammoniac est écrite à double flèche et atteint $\\tau \\approx 0{,}99$ — quasi totale."

  - id: mc.physics.pc_transformations_deux_sens.sens-propriete-fixe
    label: "« Le sens qui l'emporte est une propriété fixe de la réaction »"
    description: "L'élève attribue un sens privilégié à l'équation elle-même, indépendamment de la composition du mélange."
    contradicts_principle: "Le sens qui domine dépend de CE QU'ON A MIS AU DÉPART : c'est la comparaison de $Q_{r,i}$ à $K$ qui tranche, mélange par mélange. La même équation évolue dans un sens ou dans l'autre selon les quantités initiales."

  - id: mc.physics.pc_transformations_deux_sens.presence-produit-determine-sens
    label: "« C'est l'espèce qu'on vient d'ajouter qui impose le sens »"
    description: "L'élève raisonne sur l'ordre d'introduction plutôt que sur les quantités relatives."
    contradicts_principle: "Ajouter un PRODUIT pousse vers le sens INVERSE, pas vers le sens direct. Ce qui compte est la quantité relative de réactifs et de produits — jamais laquelle on vient de verser."

  - id: mc.physics.pc_transformations_deux_sens.conditions-physiques-sans-effet
    label: "« Le rendement est fixé une fois pour toutes par l'équation, quoi qu'on fasse »"
    description: "L'élève tient la composition finale pour intouchable, l'équation en décidant seule."
    contradicts_principle: "Agir sur les CONDITIONS INITIALES — excès d'un réactif, retrait continu d'un produit — déplace bel et bien l'état final vers plus de produit. Ce n'est pas l'équation qu'on change, ce sont les conditions."


items:

  # ── croire que toute réaction va jusqu'au bout (canonique) ──────────────────
  - id: TDS-1
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Un élève mélange de l'acide éthanoïque et de l'éthanol avec un
      catalyseur, et laisse le mélange réagir plusieurs jours. Un test
      chimique révèle qu'il reste, dans le mélange final, une quantité
      détectable d'acide éthanoïque et d'éthanol, aux côtés de l'ester et de
      l'eau formés. L'élève affirme : « Il suffit d'attendre encore plus
      longtemps, et tout l'acide et l'alcool finiront par disparaître. »
      Cette affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: "Non - la coexistence durable d'acide, d'alcool, d'ester et d'eau signale une transformation non totale (limitée) ; attendre plus longtemps ne fera pas disparaître le reste d'acide et d'alcool."
        correct: true
      - id: B
        text: "Oui - toute réaction chimique finit toujours par consommer entièrement ses réactifs si on lui laisse assez de temps ; ici, quelques jours n'ont simplement pas suffi."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
        feedback: >
          C'est l'erreur centrale à éviter dans ce chapitre : croire qu'une
          réaction va nécessairement jusqu'au bout si on attend assez
          longtemps. Ici, l'ester et l'eau déjà formés peuvent eux-mêmes
          réagir pour redonner de l'acide et de l'alcool (la réaction
          inverse, l'hydrolyse) : les deux sens coexistent en permanence, quel
          que soit le temps écoulé. Le temps seul ne fait pas disparaître un
          réactif dans une transformation non totale.
      - id: C
        text: "Oui, mais seulement si on ajoute encore du catalyseur - le temps seul ne suffit jamais à consommer entièrement l'acide et l'alcool présents dans le ballon."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
        feedback: >
          Un catalyseur accélère la vitesse à laquelle le mélange atteint son
          état stabilisé - il ne change rien à la composition de cet état. Le
          mélange resterait, même avec plus de catalyseur, un mélange où
          acide et alcool coexistent avec ester et eau : la transformation
          reste non totale.
      - id: D
        text: "Non, car il faudrait changer complètement d'équation chimique pour que la réaction devienne totale : celle-ci ne peut pas dépasser l'avancement déjà observé."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conditions-physiques-sans-effet
        feedback: >
          Ce n'est pas l'équation qu'il faut changer, mais les conditions
          physiques du système (par exemple, retirer l'un des produits au fur
          et à mesure qu'il se forme). Rien n'oblige à changer d'équation :
          c'est justement parce que l'ester et l'eau restent en contact avec
          l'acide et l'alcool que la réaction inverse reste possible.
    correct_feedback: >
      Tant que l'acide, l'alcool, l'ester et l'eau restent mélangés dans le
      même ballon, la réaction inverse (l'hydrolyse) reste possible et
      régénère de l'acide et de l'alcool au même rythme que l'estérification
      en consomme. Cette transformation est non totale : attendre plus
      longtemps ne change rien à ce fait.
    solution: |
      Une transformation n'est pas automatiquement totale du simple fait
      qu'on lui laisse du temps. Ici, les quatre espèces (acide, alcool,
      ester, eau) coexistent en contact permanent dans le même mélange : rien
      n'empêche l'ester et l'eau de réagir en sens inverse pour redonner de
      l'acide et de l'alcool. C'est cette coexistence des deux sens qui rend
      la transformation non totale (limitée), quelle que soit la durée
      d'attente.

  # ── croire que toute réaction va jusqu'au bout (variant, ammoniac) ──────────
  - id: TDS-2
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      On dissout de l'ammoniac gazeux $NH_3$ dans de l'eau. Une partie des
      molécules $NH_3$ réagit avec l'eau pour donner des ions $NH_4^+$ et
      $HO^-$, mais une quantité importante de $NH_3$ intact subsiste dans la
      solution, même après un temps très long. Quelle affirmation est
      correcte ?
    type: mcq
    choices:
      - id: A
        text: "Cette transformation est limitée : ni l'ammoniac ni l'eau ne disparaissent totalement, quel que soit le temps écoulé."
        correct: true
      - id: B
        text: "Comme pour toute réaction, il suffit d'attendre assez longtemps pour que tout le $NH_3$ finisse par réagir."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
        feedback: >
          Ce n'est pas vrai pour toutes les réactions : certaines, comme
          celle-ci, sont non totales par nature - les deux sens (direct et
          inverse) coexistent en permanence, donc le $NH_3$ ne peut pas
          disparaître totalement, même après un temps très long.
      - id: C
        text: "Puisque des ions $NH_4^+$ se sont formés, on peut affirmer que la réaction est totale."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
        feedback: >
          Former du produit ne suffit pas à rendre une transformation totale
          - il faut, en plus, qu'au moins un réactif de départ ait totalement
          disparu. Ici, l'ammoniac reste détectable en quantité importante :
          la formation d'ions $NH_4^+$ et le caractère non total coexistent
          très bien.
      - id: D
        text: "On ne peut rien conclure, car l'ammoniac est une base et non un acide."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
        feedback: >
          La nature acide ou basique de l'espèce ne détermine pas, à elle
          seule, si la réaction est totale ou limitée. Le critère est le
          même pour toutes les familles de réactions : est-ce qu'un réactif
          de départ disparaît totalement, ou coexiste-t-il durablement avec
          les produits ?
    correct_feedback: >
      Le $NH_3$ intact qui subsiste indéfiniment, aux côtés des ions $NH_4^+$
      et $HO^-$ formés, montre que les deux sens de la réaction coexistent :
      la transformation est limitée, et ce n'est pas une question de temps
      d'attente.
    solution: |
      La transformation $NH_3 + H_2O \rightleftharpoons NH_4^+ + HO^-$ est
      non totale : une fraction seulement des molécules $NH_3$ réagit, et le
      reste subsiste indéfiniment, quel que soit le temps écoulé. Ce n'est
      pas une question de patience - c'est une propriété de la réaction
      elle-même, qui se traduit par la double flèche dans son écriture.

  # ── confondre la double flèche avec une réaction lente (canonique) ──────────
  - id: TDS-3
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Un élève voit l'équation
      $CH_3COOH + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + H_2O$ et
      affirme : « La double flèche signifie que cette réaction est lente. »
      Que penser de cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : la double flèche indique que la transformation est non totale (les deux sens coexistent), pas qu'elle est lente ou rapide - la vitesse est une question complètement différente."
        correct: true
      - id: B
        text: "Elle est vraie : une double flèche signale toujours une transformation lente, jamais rapide - c'est précisément le rôle de cette notation dans une équation chimique."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.double-fleche-signifie-lente
        feedback: >
          C'est confondre deux questions indépendantes. La double flèche
          renseigne uniquement sur le caractère totale ou non totale d'une
          transformation, jamais sur sa vitesse. De nombreuses réactions
          non totales s'installent au contraire très rapidement.
      - id: C
        text: "Elle est vraie, mais seulement pour les réactions organiques comme l'estérification, où la lenteur est la règle et justifie à elle seule cette écriture particulière."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.double-fleche-signifie-lente
        feedback: >
          La double flèche a la même signification quelle que soit la
          famille chimique de la réaction (organique, acido-basique,
          précipitation...) : elle signale un caractère non total, jamais une
          vitesse. Restreindre la règle à un seul type de réaction ne la
          rend pas vraie pour autant.
      - id: D
        text: "Elle est fausse, car la double flèche signifie en réalité que la réaction est instantanée : elle atteint son état final dès l'instant où les réactifs sont mélangés."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.double-fleche-signifie-lente
        feedback: >
          Ce choix remplace une affirmation fausse sur la vitesse par une
          autre affirmation fausse sur la vitesse. La double flèche ne dit
          rien du tout sur la vitesse, ni dans un sens ni dans l'autre : elle
          concerne uniquement le fait que les deux sens de la réaction
          coexistent.
    correct_feedback: >
      La double flèche est un symbole de direction et de complétude (les
      deux sens coexistent, aucun réactif ne disparaît totalement), pas un
      symbole de vitesse. Rapide/lente et totale/limitée sont deux questions
      séparées.
    solution: |
      La double flèche $\rightleftharpoons$ signale uniquement qu'une
      transformation est non totale : le sens direct et le sens inverse
      coexistent, et aucun réactif de départ ne disparaît complètement. Elle
      ne renseigne en rien sur la vitesse de la réaction. Une transformation
      peut très bien être à la fois rapide et non totale (beaucoup de
      réactions acido-basiques), ou au contraire lente et totale (la rouille
      d'un clou en fer).

  # ── confondre la double flèche avec une réaction lente (variant) ───────────
  - id: TDS-4
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Un élève remarque que certaines réactions rapides s'écrivent avec une
      flèche simple $\rightarrow$, et en déduit une règle générale : « Une
      flèche simple signale toujours une réaction rapide, et une double
      flèche $\rightleftharpoons$ signale toujours une réaction lente. »
      Cette généralisation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: "Non - une transformation totale peut tout à fait être lente (la rouille, par exemple), et une transformation limitée peut être quasi instantanée : la vitesse et le caractère total ou limité sont deux propriétés indépendantes."
        correct: true
      - id: B
        text: "Si, cette règle est toujours vraie : c'est justement ce qui distingue les deux notations, la flèche simple étant réservée aux réactions rapides et la double flèche aux réactions lentes et progressives."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.double-fleche-signifie-lente
        feedback: >
          Le type de flèche ne renseigne jamais sur la vitesse. Il existe des
          transformations totales qui prennent des mois (la rouille d'un clou
          en fer), et des transformations non totales qui s'installent en une
          fraction de seconde. La flèche décrit uniquement si un réactif
          disparaît totalement ou non.
      - id: C
        text: "Non, mais seulement dans un sens : une flèche simple peut correspondre à une réaction lente, tandis qu'une double flèche signale toujours, elle, une réaction lente et jamais rapide."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.double-fleche-signifie-lente
        feedback: >
          Les deux moitiés de la règle sont fausses, pas une seule. Une
          transformation non totale peut très bien s'installer quasi
          instantanément - de nombreuses réactions acido-basiques atteignent
          leur état stabilisé, avec réactifs et produits coexistant, en une
          fraction de seconde.
      - id: D
        text: "On ne peut rien dire sans connaître la formule chimique exacte des réactifs : c'est leur nature, et non la notation employée pour les écrire, qui détermine la vitesse de la réaction."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
        feedback: >
          Il n'est pas nécessaire de connaître la formule exacte : le critère
          qui décide entre flèche simple et double flèche est le même pour
          toute réaction (un réactif disparaît-il totalement ou non), et il
          ne dépend jamais de la vitesse ni de la nature précise des
          réactifs.
    correct_feedback: >
      Le type de flèche décrit le caractère totale ou limité d'une
      transformation, jamais sa vitesse. Les deux questions - rapide/lente et
      totale/limitée - varient indépendamment l'une de l'autre.
    solution: |
      Rien n'impose de lien entre le type de flèche et la vitesse d'une
      réaction. Une transformation totale peut être lente (la rouille) ou
      rapide (une précipitation) ; une transformation limitée (non totale)
      peut, elle aussi, être lente ou rapide. Le type de flèche ne dépend
      que d'une seule chose : est-ce qu'un réactif de départ disparaît
      totalement, ou coexiste-t-il durablement avec les produits ?

  # ── croire qu'une transformation limitée signifie « rien ne se passe » (canonique) ──
  - id: TDS-5
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Un élève regarde l'équation
      $CH_3COOH + C_2H_5OH \rightleftharpoons CH_3COOC_2H_5 + H_2O$,
      accompagnée de la mention « transformation non totale », et conclut :
      « Donc, dans ce mélange, il ne s'est presque rien passé. » Que penser
      de cette conclusion ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : une quantité notable d'ester et d'eau se forme réellement ; « non totale » ne veut jamais dire « nulle » — la transformation s'arrête avant la disparition complète de l'acide et de l'alcool."
        correct: true
      - id: B
        text: "Elle est vraie : une transformation non totale, par définition, ne produit aucun changement observable dans le mélange, et le test ne devrait révéler que les réactifs du départ."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
        feedback: >
          « Non totale » ne veut pas dire « rien ne se passe » : ça veut dire
          que la transformation s'arrête avant que l'un des réactifs ait
          totalement disparu. Ici, une quantité tout à fait mesurable d'ester
          et d'eau s'est formée - assez pour dégager une odeur fruitée nette.
          Les deux réactions, directe et inverse, se sont bel et bien
          produites.
      - id: C
        text: "Elle est vraie seulement si le mélange n'a pas été chauffé : sans apport d'énergie, la transformation reste au point de départ et aucun ester ne peut se former dans le ballon."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conditions-physiques-sans-effet
        feedback: >
          Le chauffage change la vitesse à laquelle le mélange atteint son
          état stabilisé, pas le fait qu'un produit s'y forme réellement.
          Même sans chauffage - plus lentement - de l'ester et de l'eau
          finiraient par apparaître en quantité détectable.
      - id: D
        text: "Elle est fausse, mais seulement parce qu'il y a un catalyseur dans le mélange : sans lui, la mention « non totale » signifierait bien qu'aucun produit ne s'est formé du tout."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
        feedback: >
          Le catalyseur accélère la réaction, il ne crée pas, à lui seul, la
          formation de produit : sans catalyseur, la même transformation se
          produirait tout aussi réellement, simplement plus lentement. Ce
          n'est donc pas le catalyseur qui rend la conclusion fausse.
    correct_feedback: >
      Une transformation non totale produit bel et bien des produits, en
      quantité réelle et mesurable - elle s'arrête seulement avant que l'un
      des réactifs de départ ait totalement disparu. « Non totale » et
      « rien ne se passe » sont deux idées très différentes.
    solution: |
      Dans le mélange acide + alcool, une quantité notable d'ester et d'eau
      s'est bel et bien formée - suffisante pour être détectée par l'odeur ou
      mesurée en laboratoire. La transformation a réellement eu lieu et
      produit quelque chose de concret. « Non totale » décrit uniquement le
      fait qu'elle s'arrête avant que l'acide et l'alcool aient totalement
      disparu - ce n'est en rien une absence de réaction.

  # ── croire qu'une transformation limitée signifie « rien ne se passe » (variant, ammoniac) ──
  - id: TDS-6
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Dans une solution où de l'ammoniac $NH_3$ a été dissous dans l'eau, on
      mesure qu'une fraction seulement des molécules $NH_3$ a réagi avec
      l'eau pour donner $NH_4^+$ et $HO^-$ ; le reste de $NH_3$ demeure
      intact. Un élève en conclut que « puisque la transformation est
      limitée, elle n'a en réalité presque pas eu lieu ». Que peut-on
      répondre ?
    type: mcq
    choices:
      - id: A
        text: "C'est faux : une quantité réellement mesurable de $NH_4^+$ et de $HO^-$ s'est formée ; la transformation a bien eu lieu et a produit ces ions - elle s'est seulement arrêtée avant de convertir tout le $NH_3$."
        correct: true
      - id: B
        text: "C'est vrai : si $NH_3$ n'a pas totalement disparu, on peut considérer que la transformation ne s'est presque pas produite et que les ions détectés sont négligeables."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
        feedback: >
          Le fait qu'il reste du $NH_3$ intact ne veut pas dire que rien ne
          s'est produit : des ions $NH_4^+$ et $HO^-$, absents au départ, sont
          apparus en quantité mesurable. La transformation limitée a bien eu
          lieu - elle s'est seulement arrêtée avant la disparition complète
          du $NH_3$.
      - id: C
        text: "C'est faux, mais uniquement parce que $NH_3$ est une base forte qui réagit toujours complètement avec l'eau : la fraction non transformée provient nécessairement d'une erreur de mesure."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
        feedback: >
          C'est l'inverse : c'est précisément parce que $NH_3$ ne réagit
          qu'en partie avec l'eau que la transformation est limitée. Si
          $NH_3$ réagissait toujours complètement, la transformation serait
          totale, pas limitée.
      - id: D
        text: "C'est vrai seulement si la quantité de $NH_4^+$ formée est plus petite que celle de $NH_3$ restant : c'est ce rapport qui décide si la transformation a eu lieu."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
        feedback: >
          Comparer les quantités relatives de produit et de réactif restant
          ne dit rien sur le fait qu'une transformation a eu lieu ou non.
          Même si $NH_4^+$ reste minoritaire par rapport au $NH_3$ restant, sa
          présence en quantité non nulle prouve que la transformation s'est
          bel et bien produite.
    correct_feedback: >
      La présence d'ions $NH_4^+$ et $HO^-$, absents au départ et détectables
      à l'arrivée, prouve que la transformation s'est réellement produite.
      « Limitée » décrit seulement le fait qu'elle s'arrête avant que le
      $NH_3$ ait totalement disparu.
    solution: |
      Une transformation limitée reste une transformation réelle : elle
      produit une quantité mesurable de nouvelles espèces ($NH_4^+$ et
      $HO^-$ ici), qui n'existaient pas au départ. Ce qui la distingue d'une
      transformation totale, c'est uniquement le fait qu'elle s'arrête avant
      que le réactif de départ ($NH_3$) ait totalement disparu - pas le fait
      qu'elle n'aurait presque pas eu lieu.

  # ── croire que toute réaction va jusqu'au bout avec assez de temps (variant, niveau accroche) ──
  - id: TDS-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Reprends l'accroche : au moment où il verse l'acide éthanoïque et
      l'éthanol dans le ballon, avant tout test, un élève avance : « Si on
      chauffe assez longtemps, tout l'acide et tout l'alcool finiront
      forcément par disparaître complètement. » Cette prédiction est-elle
      justifiée ?
    type: mcq
    choices:
      - id: A
        text: "Oui - c'est vrai pour toute réaction chimique : il suffit d'attendre assez longtemps pour que les réactifs finissent par disparaître entièrement."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
        feedback: >
          C'est l'erreur à éviter : le test chimique montrera au contraire
          que l'acide et l'alcool restent détectables indéfiniment.
      - id: B
        text: "Rien ne permet de l'affirmer à l'avance : certaines transformations laissent coexister indéfiniment des réactifs avec les produits, quel que soit le temps attendu."
        correct: true
      - id: C
        text: "Oui, car un chauffage prolongé fournit toujours assez d'énergie pour consommer la totalité des réactifs présents au départ dans le ballon."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conditions-physiques-sans-effet
        feedback: >
          Le chauffage accélère la réaction, il ne change pas le fait que ce
          mélange laisse coexister acide et alcool avec l'ester et l'eau.
      - id: D
        text: "Non, mais seulement parce qu'il n'y a pas assez de catalyseur dans ce mélange pour mener la transformation jusqu'à son terme."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
        feedback: >
          Ce n'est pas une question de quantité de catalyseur : même avec
          plus de catalyseur, le mélange atteindrait le même état stabilisé.
    correct_feedback: >
      Rien ne garantit qu'une réaction aille jusqu'au bout : le test du chapitre
      3 le confirmera pour ce mélange précis.
    solution: |
      On ne peut pas prédire, sans test, qu'une transformation ira jusqu'au
      bout. Ici, le test chimique révèle qu'acide et alcool restent
      détectables indéfiniment : la prédiction de l'élève est fausse.

  # ── confondre lenteur (durée d'attente) et caractère totale (variant, niveau accroche) ──
  - id: TDS-8
    rung: "R0"
    difficulty_level: 2
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Toujours dans l'accroche : l'odeur d'ester met plusieurs heures à se
      stabiliser dans le ballon. Un élève en déduit : « Puisque cette
      réaction est lente - elle prend des heures - elle va forcément finir
      par aller jusqu'au bout, comme toute réaction qui prend du temps. »
      Que penser de ce raisonnement ?
    type: mcq
    choices:
      - id: A
        text: "Il est valide : plus une réaction est lente, plus elle a de chances d'être totale, car elle dispose de davantage de temps pour consommer ses réactifs."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.vitesse-implique-avancement
        feedback: >
          C'est confondre deux axes indépendants : la vitesse et le
          caractère totale/limitée n'ont aucun lien logique.
      - id: B
        text: "Il est valide, mais seulement parce qu'il y a un catalyseur dans ce mélange : sans lui, la lenteur ne dirait rien du caractère total de la réaction."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
        feedback: >
          Le catalyseur ne change que la vitesse d'installation de l'état
          stabilisé, jamais le fait que des réactifs y restent ou non.
      - id: C
        text: "Il est invalide : la durée que met une réaction à se stabiliser ne renseigne en rien sur le fait qu'elle soit totale ou limitée - ce sont deux questions indépendantes."
        correct: true
      - id: D
        text: "Il est invalide, car en réalité cette réaction est rapide et non lente : l'odeur met des heures à se stabiliser pour de tout autres raisons."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.vitesse-implique-avancement
        feedback: >
          Le problème n'est pas la vitesse réelle de cette réaction, mais le
          fait que vitesse et caractère totale/limitée sont indépendants.
    correct_feedback: >
      Rapide/lente et totale/limitée sont deux questions séparées : rien
      n'oblige une réaction lente à aller jusqu'au bout.
    solution: |
      La durée d'installation d'une réaction ne renseigne que sur sa
      vitesse. Malgré plusieurs heures de chauffage, le test montrera que la
      réaction reste limitée : la lenteur n'implique aucunement la totalité.

  # ── croire qu'une transformation limitée signifie « rien ne se passe » (variant, niveau accroche) ──
  - id: TDS-9
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Dernier point sur l'accroche : après plusieurs heures, on détecte
      encore de l'acide éthanoïque et de l'éthanol dans le ballon. Un élève
      en conclut : « Puisque l'acide et l'alcool sont encore là, c'est donc
      qu'il ne s'est en réalité rien passé dans ce ballon. » Que penser de
      cette conclusion ?
    type: mcq
    choices:
      - id: A
        text: "Elle est correcte : la présence persistante des réactifs prouve qu'aucune réaction n'a eu lieu dans le ballon, et l'odeur perçue vient nécessairement d'ailleurs."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
        feedback: >
          L'odeur fruitée qui se développe est la preuve sensible qu'une
          transformation réelle a eu lieu, malgré les réactifs restants.
      - id: B
        text: "Elle est correcte, mais seulement parce que le mélange n'a pas assez chauffé : avec un chauffage plus fort, les réactifs auraient fini par disparaître entièrement."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conditions-physiques-sans-effet
        feedback: >
          Chauffer davantage changerait la vitesse d'installation de l'état
          stabilisé, pas le fait qu'une odeur d'ester s'est déjà développée.
      - id: C
        text: "On ne peut rien dire sans mesurer précisément les quantités en présence : la seule détection d'acide et d'alcool ne permet aucune conclusion sur la transformation."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
        feedback: >
          L'odeur perceptible suffit déjà à indiquer qu'un produit nouveau
          s'est formé, sans qu'une mesure précise soit nécessaire.
      - id: D
        text: "Elle est fausse : une odeur fruitée franche s'est bel et bien développée, preuve qu'une quantité réelle d'ester et d'eau s'est formée, aux côtés de l'acide et de l'alcool restants."
        correct: true
    correct_feedback: >
      Une odeur nouvelle qui apparaît prouve qu'une transformation réelle
      s'est produite, même si l'acide et l'alcool restent détectables.
    solution: |
      La coexistence persistante des réactifs n'efface pas ce qui a été
      produit : l'odeur fruitée signale la formation réelle d'ester et
      d'eau. « Réactifs encore présents » ne veut pas dire « rien ne s'est
