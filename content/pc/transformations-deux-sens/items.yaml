  # ── croire que répéter le test plus tard changera le verdict totale/limitée (variant, niveau test) ──
  - id: TDS-10
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Un chimiste teste un mélange d'acide éthanoïque et d'éthanol deux
      heures après le début du chauffage : il détecte encore de l'acide et
      de l'alcool. Il refait le même test cinq heures plus tard : il détecte
      exactement les mêmes quantités, inchangées. Un camarade affirme : « Il
      faut refaire le test après une semaine entière - à ce moment-là, il ne
      détectera sans doute plus aucune trace d'acide ni d'alcool. » Que
      penser de cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Elle est peu probable : le test donnant exactement le même résultat à deux heures d'intervalle, le mélange a déjà atteint son état stabilisé - attendre une semaine de plus ne changera rien à la présence d'acide et d'alcool."
        correct: true
      - id: B
        text: "Elle est probable : plus on attend, plus la quantité de réactifs restants diminue, jusqu'à disparaître complètement ; deux heures sont une durée bien trop courte pour une transformation de ce type."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.reaction-toujours-totale
        feedback: >
          Un test répété qui donne le même résultat est au contraire le
          signe que l'état est stabilisé : rien ne disparaîtra de plus.
      - id: C
        text: "On ne peut rien conclure du test répété : deux résultats identiques ne prouvent rien, il faudrait changer complètement de méthode de test pour savoir si le mélange évolue encore ou non."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
        feedback: >
          Deux résultats identiques à deux heures d'intervalle sont au
          contraire le critère même utilisé pour reconnaître un état stabilisé.
      - id: D
        text: "Elle est probable, mais seulement si on ajoute davantage de catalyseur avant de refaire le test : sans cet ajout, la transformation resterait effectivement bloquée là où elle en est aujourd'hui."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
        feedback: >
          Le catalyseur change la vitesse d'atteinte de l'état stabilisé,
          pas la composition de cet état une fois atteint.
    correct_feedback: >
      Deux tests identiques à des instants différents signalent un état
      stabilisé : rien ne changera plus, quel que soit le temps attendu.
    solution: |
      Répéter le test et obtenir le même résultat confirme qu'un mélange a
      atteint son état stabilisé. L'acide et l'alcool restent, en quantité
      inchangée, ce qui exclut qu'un temps d'attente plus long fasse
      disparaître le reste.

  # ── croire qu'un grand excès de réactif restant signifie qu'il ne s'est presque rien passé (variant, niveau test) ──
  - id: TDS-11
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      Dans un ballon, on mélange une grande quantité d'acide éthanoïque et
      d'éthanol avec seulement un tout petit volume de catalyseur. Après
      stabilisation, un test révèle qu'une quantité d'ester s'est bien
      formée, mais qu'elle reste faible comparée à l'énorme quantité d'acide
      et d'alcool encore présente. Un élève conclut : « Vu la faible
      quantité d'ester par rapport à ce qui reste, on peut dire que cette
      transformation ne s'est presque pas produite. » Que penser de cette
      conclusion ?
    type: mcq
    choices:
      - id: A
        text: "Elle est correcte : pour qu'on puisse dire qu'une transformation a eu lieu, la quantité de produit formé doit dépasser celle des réactifs restants, faute de quoi le mélange reste celui du départ."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
        feedback: >
          Rien n'impose qu'un produit dépasse en quantité les réactifs
          restants pour que la transformation soit reconnue comme réelle.
      - id: B
        text: "Elle est fausse : même minoritaire face aux réactifs restants, la quantité d'ester détectée prouve qu'une transformation réelle a eu lieu ; cette comparaison ne définit ni le caractère totale ou limité, ni le fait que la réaction se soit produite."
        correct: true
      - id: C
        text: "Elle est correcte, à moins que l'ester formé ne dépasse la moitié de la quantité initiale d'acide : c'est ce seuil, et lui seul, qui décide si la transformation compte réellement pour quelque chose dans le bilan."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.limitee-rien-ne-se-passe
        feedback: >
          Il n'existe aucun seuil de proportion à atteindre : dès qu'une
          quantité détectable de produit apparaît, la transformation a eu lieu.
      - id: D
        text: "Elle est correcte, car le trop petit volume de catalyseur a empêché la réaction de vraiment démarrer : avec davantage de catalyseur, l'ester serait devenu largement majoritaire dans le ballon."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.catalyseur-ou-temps-change-etat-final
        feedback: >
          Un catalyseur en faible quantité ralentit l'installation de l'état
          stabilisé, il n'empêche pas la réaction de se produire.
    correct_feedback: >
      La quantité de produit formé, même faible comparée aux réactifs
      restants, prouve qu'une transformation réelle a eu lieu.
    solution: |
      Ce qui définit le caractère limité, c'est la persistance détectable
      des réactifs de départ, pas la proportion entre produit formé et
      réactif restant. L'ester détecté - même minoritaire - suffit à prouver
      qu'une transformation réelle s'est produite.

  # ── croire que la simple présence de produit au départ suffit à faire dominer le sens inverse, indépendamment des quantités relatives (canonique) ──
  - id: TDS-12
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
      On prépare un mélange contenant, dès l'instant initial, une grande
      quantité d'acide éthanoïque et d'éthanol, ainsi qu'une toute petite
      quantité d'ester et d'eau déjà présents (contrairement aux expériences
