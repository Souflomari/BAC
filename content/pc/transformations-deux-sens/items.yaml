      va dominer au départ dans ce nouveau mélange, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: "Le sens direct va dominer, car $NH_4Cl$ est le solide qu'on vient d'ajouter au mélange, et c'est toujours l'espèce introduite en dernier qui impose le sens de la réaction dans le milieu."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.presence-produit-determine-sens
        feedback: >
          $NH_4^+$ est un produit de la réaction directe, pas son réactif :
          sa présence abondante pousse au contraire vers le sens inverse.
      - id: B
        text: "Le sens direct va dominer, comme dans toute solution contenant de l'ammoniac, quelle que soit sa composition initiale et quelles que soient les espèces déjà présentes."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.sens-propriete-fixe
        feedback: >
          Le sens n'est pas une propriété fixe attachée à l'ammoniac : il
          dépend de la composition initiale de ce mélange précis.
      - id: C
        text: "On ne peut pas prédire sans connaître les concentrations exactes de chaque espèce : les seules indications « riche » et « pauvre » ne suffisent pas à trancher."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
        feedback: >
          Un raisonnement qualitatif suffit : comparer ce qui est abondant
          (les produits) à ce qui est rare ($NH_3$) prédit déjà le sens.
      - id: D
        text: "Le sens inverse va dominer : le mélange est déjà riche en produits ($NH_4^+$, $HO^-$) et pauvre en réactif $NH_3$, donc $NH_4^+$ et $HO^-$ réagissent davantage entre eux pour reformer $NH_3$ et $H_2O$, comme dans l'expérience B du cours."
        correct: true
    correct_feedback: >
      Un mélange riche en produits et pauvre en réactif voit le sens
      inverse dominer au départ - le miroir de l'expérience A du cours.
    solution: |
      Ce mélange est riche en $NH_4^+$ et $HO^-$ (les produits) et pauvre en
      $NH_3$ (le réactif) : par le même raisonnement que l'expérience B,
      c'est le sens inverse qui va dominer au départ, régénérant $NH_3$ et
      $H_2O$.

