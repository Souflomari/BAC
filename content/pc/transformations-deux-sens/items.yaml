      Un élève affirme : « Puisqu'il y a déjà de l'ester et de l'eau dans le
      mélange au départ, c'est forcément le sens inverse (l'hydrolyse) qui
      va dominer dès le début. » Que penser de cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : c'est en réalité toujours le sens direct qui domine au départ, quelle que soit la composition initiale du mélange, car c'est le sens dans lequel l'équation a été écrite."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.sens-propriete-fixe
        feedback: >
          Ce n'est pas vrai non plus en toute généralité : l'expérience B du
          cours (ester et eau purs) montre le contraire quand la composition
          initiale est inversée.
      - id: B
        text: "On ne peut rien affirmer sans calculer précisément les concentrations de chaque espèce présente : la seule liste des espèces initiales ne permet jamais de prévoir le sens qui va dominer."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.conclusion-refusee-a-tort
        feedback: >
          Le raisonnement qualitatif suffit ici : comparer les quantités
          relatives de chaque couple permet déjà de prédire le sens dominant.
      - id: C
        text: "Elle est fausse : ce n'est jamais la simple présence d'ester et d'eau qui compte, mais la quantité relative de chaque couple - ici l'acide et l'alcool sont largement majoritaires, donc le sens direct devrait au contraire dominer au départ."
        correct: true
      - id: D
        text: "On ne peut rien prédire : puisque les deux sens coexistent toujours en même temps dans ce type de transformation, aucun des deux ne peut dominer l'autre, même au tout début, quelles que soient les quantités introduites."
        correct: false
        misconception: mc.physics.pc_transformations_deux_sens.equilibre-coexistence-signifie-arret
        feedback: >
          Les deux sens coexistent en permanence, mais l'un peut dominer
          l'autre à un instant donné, comme le montrent les expériences A et B.
    correct_feedback: >
      C'est la quantité relative de chaque couple, pas la simple présence
      d'un peu de produit, qui décide quel sens domine au départ.
    solution: |
      La présence d'un peu d'ester et d'eau ne suffit pas à faire dominer le
      sens inverse : ce qui compte, c'est la disponibilité relative de
      chaque couple, comme le montre l'analogie des salles reliées. Ici,
      l'acide et l'alcool sont très majoritaires, donc le sens direct
      devrait dominer au départ.

  # ── croire que le sens qui domine est une propriété fixe de la réaction, indépendante de la composition initiale (variant bac, application) ──
  - id: TDS-13
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_transformations_deux_sens
    tags: []
    stem: >
