<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Schéma réactionnel de l’estérification : deux boîtes, réactifs (acide éthanoïque et éthanol) à gauche et produits (ester éthanoate d’éthyle et eau) à droite. Une flèche accent, sens direct, va des réactifs vers les produits, étiquetée estérification — sens direct ; une flèche ink-soft, sens inverse, va des produits vers les réactifs, étiquetée hydrolyse — sens inverse. Les deux flèches se rejoignent en un symbole ⇌ au centre, avec l’annotation consommation ⇄ régénération et les quatre espèces mises en évidence comme coexistant en permanence.">
  <title>Sens direct et sens inverse — la double flèche écrit la coexistence</title>
  <!--
    sens-direct-inverse.svg — figure SCHÉMATIQUE, un schéma réactionnel PUR
    (pas un graphe, pas de cinétique). Construit la notation ⇌ pas à pas,
    exactement comme le texte le fait (R1, sous-section « La double flèche :
    écrire cette coexistence », lesson.md lignes 33-41) : d'abord la flèche
    simple du sens direct seul (ce que R0 montrait, « une flèche simple — on
    va y revenir »), puis le sens inverse ajouté (le mécanisme de R1 :
    l'ester et l'eau peuvent régénérer l'acide et l'alcool), puis la fusion
    en double flèche ⇌ (la notation que R1 introduit).

    Contraintes dures respectées : AUCUN axe du temps, AUCUNE concentration
    ni nombre, AUCUN vocabulaire de vitesse/cinétique, AUCUN K/Qr — seulement
    les quatre espèces et deux flèches nommées. Rien dans cette figure ne
    suggère que la double flèche est une affaire de rapidité (cf. R1,
    « Teste l'idée avant de la croire »).

    Les deux boîtes (réactifs / produits) et leur contenu sont un CHROME
    PERSISTANT, dessiné hors des groupes step-N : les quatre espèces
    chimiques existent tout du long de l'histoire que raconte cette figure
    (l'ester et l'eau sont déjà nommés comme la destination avant même que
    la flèche inverse n'existe) — seules les FLÈCHES et leur fusion
    progressent d'étape en étape.

    Géométrie (calculée, pas devinée) :
      panneau                          : x=20 y=32 w=600 h=225 (bas=257)
      boîte réactifs                   : x=50  y=105 w=180 h=100 (centre x=140)
      boîte produits                   : x=410 y=105 w=180 h=100 (centre x=500)
      écart entre boîtes (zone flèches): x=230..410 (centre x=320)
      flèche directe (step-1)          : y=130, pointe à x=400, base à x=388
      flèche inverse (step-2)          : y=180, pointe à x=240, base à x=252
      symbole ⇌ fusionné (step-3)      : x=320 y=165, centré dans l'écart,
        recouvrant visuellement les deux flèches désormais adoucies (0,55 —
        comportement standard de StagedFigure pour les étapes antérieures)
      bandeau de lecture (step-3)      : x=210 y=215 w=220 h=32

    Rôle des couleurs (convention établie ICI, réutilisée dans
    experiences-miroir.svg) :
      sens direct (flèche, étiquette)             : --figure-accent
      sens inverse (flèche, étiquette)             : --figure-ink-soft
      squelette (boîtes, espèces, panneau, titre)  : --figure-ink / --figure-ink-soft
      symbole ⇌ fusionné                           : --figure-ink (la fusion
        neutralise le codage direct/inverse : aucun sens ne l'emporte)
      bandeau de lecture + surbrillance des quatre
        espèces (step-3)                           : --figure-accent (le
        foyer final : la coexistence elle-même, pas l'un ou l'autre sens)

    STAGED (LESSON-EXPERIENCE-SPEC §2.5, geste d'enseignement : l'ordre suit
    exactement celui du texte) :
      step-1 : la flèche directe seule.
      step-2 : la flèche inverse ajoutée.
      step-3 : la fusion en double flèche ⇌ + surbrillance des quatre
               espèces coexistantes + bandeau de lecture.
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    La double flèche &#8652; : deux sens qui coexistent
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="32" width="600" height="225" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Boîte réactifs (persistante — les espèces existent dès le départ) -->
  <rect x="50" y="105" width="180" height="100" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
  <text x="140" y="93" text-anchor="middle" font-size="10" font-weight="600"
        fill="var(--figure-ink-soft)">réactifs</text>
  <text x="140" y="143" text-anchor="middle" font-size="12.5"
        fill="var(--figure-ink)">acide éthanoïque</text>
  <text x="140" y="169" text-anchor="middle" font-size="12.5"
        fill="var(--figure-ink)">+ éthanol</text>

  <!-- Boîte produits (persistante — nommée dès le départ, avant même la flèche inverse) -->
  <rect x="410" y="105" width="180" height="100" rx="10"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
  <text x="500" y="93" text-anchor="middle" font-size="10" font-weight="600"
        fill="var(--figure-ink-soft)">produits</text>
  <text x="500" y="141" text-anchor="middle" font-size="10"
        fill="var(--figure-ink)">ester (éthanoate d&#8217;éthyle)</text>
  <text x="500" y="169" text-anchor="middle" font-size="13"
        fill="var(--figure-ink)">+ eau</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le sens direct seul (la flèche simple de R0)
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="240" y1="130" x2="388" y2="130"
          stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="400,130 388,125.5 388,134.5" fill="var(--figure-accent)"/>
    <text x="320" y="116" text-anchor="middle" font-size="10" font-weight="600"
          fill="var(--figure-accent)">estérification — sens direct</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — le sens inverse ajouté (le mécanisme de R1)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="400" y1="180" x2="252" y2="180"
          stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="240,180 252,175.5 252,184.5" fill="var(--figure-ink-soft)"/>
    <text x="320" y="200" text-anchor="middle" font-size="10" font-weight="600"
          fill="var(--figure-ink-soft)">hydrolyse — sens inverse</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — fusion en double flèche ⇌ : coexistence permanente
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Surbrillance des quatre espèces, désormais vues comme coexistant -->
    <rect x="44" y="99" width="192" height="112" rx="13"
          fill="var(--figure-accent)" fill-opacity="0.07"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="404" y="99" width="192" height="112" rx="13"
          fill="var(--figure-accent)" fill-opacity="0.07"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Symbole ⇌ fusionné, au-dessus des deux flèches désormais adoucies -->
    <text x="320" y="165" text-anchor="middle" font-size="34"
          fill="var(--figure-ink)">&#8652;</text>

    <!-- Bandeau de lecture -->
    <rect x="210" y="215" width="220" height="32" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="320" y="235" text-anchor="middle" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">consommation &#8644; régénération</text>
  </g><!-- /step-3 -->

</svg>
