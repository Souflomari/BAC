      - id: q4
        part: "2 — Étude de la réaction de l'acide éthanoïque avec l'alcool ROH"
        stem: |-
          **2-1.** (0,5 pt) Quel est l'intérêt du chauffage à reflux ?
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La question porte sur une technique expérimentale — le montage à reflux — pas sur la position de l'équilibre. Il faut séparer deux effets bien distincts.

          Le premier effet est cinétique, et il est couvert par le chapitre 5 de « Estérification et hydrolyse » : l'estérification, laissée à température ambiante, est **lente** — plusieurs jours peuvent être nécessaires pour atteindre l'équilibre. Chauffer augmente l'agitation thermique, donc la fréquence et l'énergie des chocs efficaces entre l'acide éthanoïque et l'alcool $\text{ROH}$ : la réaction atteint son équilibre bien plus vite. Ce levier n'a, à lui seul, aucun effet sur le rendement final — chauffer accélère l'estérification et l'hydrolyse dans les mêmes proportions (chapitre 5 de « Estérification et hydrolyse »), la position de l'équilibre ne bouge pas.

          Le second effet tient au mot « reflux » lui-même, distinct du simple fait de chauffer : le ballon est surmonté d'un réfrigérant vertical qui condense en continu les vapeurs (d'alcool, d'acide, d'ester) qui s'échappent sous l'effet de la chaleur, et les renvoie, liquides, dans le mélange réactionnel. Sans ce dispositif, chauffer plusieurs heures ferait perdre une partie de la matière par évaporation — ce qui fausserait directement la masse finale d'ester mesurée à la question 2-3, indépendamment de toute chimie. Le reflux permet donc de chauffer aussi longtemps que nécessaire sans perdre de matière.

          **Le piège nommé de cette question.** Répondre « le reflux améliore le rendement » : c'est confondre les deux effets qu'on vient de séparer. Le reflux permet de chauffer fort et longtemps sans rien perdre — il ne change strictement rien à la quantité finale d'ester obtenue à l'équilibre (chapitre 5, Estérification et hydrolyse) ; il ne fait qu'y arriver plus vite, et sans fausser la mesure par une perte de matière.
      - id: q5
        stem: |-
          **2-2.** (0,5 pt) Écrire l'équation modélisant la réaction entre l'acide éthanoïque et l'alcool $\text{ROH}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On applique l'équation générale d'une estérification, posée au chapitre 2 de « Estérification et hydrolyse » : $R\text{-}COOH + R'\text{-}OH \rightleftharpoons R\text{-}COO\text{-}R' + H_2O$. Attention à un piège de notation avant même d'écrire quoi que ce soit : dans cette formule générale, $R$ désigne le radical de l'ACIDE — mais l'énoncé de cet exercice utilise, lui, la lettre $R$ pour désigner le radical de l'ALCOOL (le linalol, noté $\text{ROH}$). Il faut donc lire la correspondance comme suit : l'acide éthanoïque $\text{CH}_3\text{COOH}$ joue le rôle du $R\text{-}COOH$ de la leçon (avec $R=\text{CH}_3$), et l'alcool $\text{ROH}$ de l'énoncé joue le rôle du $R'\text{-}OH$ de la leçon.

          $$\text{CH}_3\text{COOH} + \text{ROH} \rightleftharpoons \text{CH}_3\text{COOR} + \text{H}_2\text{O}$$

          La double flèche n'est pas optionnelle : c'est très exactement la réaction qui ouvre la leçon « Transformations dans les deux sens » (son chapitre 1) et qui donne son nom au chapitre 2 de Estérification et hydrolyse — l'ester et l'acide/alcool coexistent toujours, quelle que soit la durée du chauffage.

          **Un contrôle gratuit.** L'énoncé donne $M(\text{ROH}) = 154\ \text{g/mol}$ et $M(E) = 196\ \text{g/mol}$. Une estérification échange un $-\text{OH}$ de l'alcool et un $-\text{OH}$ de l'acide contre une liaison ester, en libérant une molécule d'eau : $M(E) = M(\text{ROH}) + M(\text{CH}_3\text{COOH}) - M(\text{H}_2\text{O}) = 154 + 60 - 18 = 196\ \text{g/mol}$ — exactement la valeur donnée. L'équation écrite est cohérente avec les masses molaires de l'énoncé.

          **Le piège nommé de cette question.** Confondre le $R$ de la formule générale de la leçon (le radical de l'ACIDE) avec le $R$ de cet énoncé précis (le radical de l'ALCOOL) — les deux notations se ressemblent mais ne désignent pas la même chose ; c'est un choix de l'énoncé, pas une règle universelle.
