        stem: |-
          **2-3. b.** (0,5 pt) Proposer deux méthodes différentes permettant l'augmentation du rendement de cette réaction.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Améliorer un rendement, ce n'est jamais accélérer la réaction (chapitre 5 de « Estérification et hydrolyse », déjà mobilisé à la question 2-1) : c'est **déplacer l'équilibre**, au sens du chapitre 6 de « Estérification et hydrolyse » — forcer, à un instant donné, $Q_{r,i}$ en dessous de $K$, pour que le système avance davantage dans le sens direct en cherchant à rejoindre $K$ à nouveau.

          $$Q_r = \dfrac{[\text{ester}][\text{eau}]}{[\text{acide}][\text{alcool}]}$$

          Deux méthodes, chacune agissant sur une partie différente de ce quotient :

          — **Utiliser un réactif en excès.** Verser, par exemple, un excès d'alcool $\text{ROH}$ par rapport à l'acide augmente le dénominateur de $Q_r$ dès le mélange initial : $Q_{r,i}$ part d'une valeur plus basse que $K$, et le système doit consommer une plus grande proportion du réactif limitant pour le rejoindre.

          — **Éliminer un produit au fur et à mesure de sa formation.** Retirer l'eau (par un déshydratant, ou par distillation si elle est plus volatile que le reste) — ou l'ester lui-même s'il est plus volatil — diminue le numérateur de $Q_r$ à chaque instant, ce qui relance sans cesse la réaction dans le sens direct.

          **Le piège nommé de cette question.** Proposer « chauffer davantage » ou « ajouter plus de catalyseur » : ce sont des leviers cinétiques (chapitre 5 de « Estérification et hydrolyse »), déjà mobilisés à la question 2-1 pour une tout autre raison — ils accélèrent l'arrivée à l'équilibre, dans les deux sens à la fois, sans jamais déplacer sa position. C'est exactement le test du chapitre 5 de « Estérification et hydrolyse » (flacon A contre flacon B) : deux flacons, l'un chauffé et catalysé, l'autre non, atteignent rigoureusement le même rendement final, seulement à des vitesses différentes.
