          **2-3. a.** (1 pt) Calculer le rendement $r$ de cette réaction.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le rendement d'une estérification — le mot employé au chapitre 6 de « Estérification et hydrolyse », interchangeable là-bas avec $\tau$ — compare la quantité d'ester réellement obtenue à la quantité maximale que donnerait une conversion totale du réactif limitant. Ici, aucune concentration ni pH à manipuler : seulement deux masses, à convertir en quantités de matière via les masses molaires données.

          Le mélange de départ est équimolaire (énoncé du §2) et la stœchiométrie de l'équation (question 2-2) est $1{:}1{:}1{:}1$ : les deux réactifs, introduits à égalité, s'épuiseraient ensemble si la réaction allait jusqu'au bout — la quantité maximale d'ester possible est donc directement la quantité d'alcool introduite.

          **Ce que ce chiffre raconte.** $4{,}1\ \%$ est très loin des $66{,}7\ \%$ que donne, à l'équilibre, l'« estérification simple » du chapitre 4 de « Estérification et hydrolyse » — mais ce chapitre précise explicitement que ce cas ($\tau \approx 2/3$) suppose des chaînes carbonées « linéaires, sans ramification qui gênerait la rencontre des groupes réactifs ». Le linalol est tout le contraire : un alcool **tertiaire**, très ramifié (un terpène), dont le groupe $-\text{OH}$ est encombré de toutes parts. Ce n'est donc pas un cas d'« estérification simple », et le rendement, très inférieur à ce que ce chapitre annoncerait pour un couple non ramifié, en est la trace numérique directe.

          **Le piège nommé de cette question.** Diviser par la mauvaise référence — par exemple par $n_0(\text{acide})$ recalculé séparément à partir d'une masse d'acide non donnée, en oubliant que le mélange équimolaire rend $n_0(\text{ROH})$ directement utilisable comme référence, puisque les deux réactifs partent à égalité. Une masse d'acide n'est d'ailleurs même pas fournie par l'énoncé — c'est un indice qu'elle n'est pas nécessaire ici.
        steps:
          - math: 'n(E)_{obtenu} = \dfrac{m_E}{M(E)} = \dfrac{2}{196} \approx 1{,}02\times10^{-2}\ \text{mol}'
            note: "Ester obtenu, à partir de la masse mesurée en fin de réaction."
          - math: 'n_0(\text{ROH}) = \dfrac{m_A}{M(\text{ROH})} = \dfrac{38{,}5}{154} = 0{,}250\ \text{mol} = n(E)_{max}'
            note: "Alcool introduit au départ ; mélange équimolaire donc n0(acide) = n0(ROH), et la stoechiometrie 1:1 donne n(ester)max = n0(ROH)."
          - math: 'r = \dfrac{n(E)_{obtenu}}{n(E)_{max}} = \dfrac{1{,}02\times10^{-2}}{0{,}250}'
            note: "Rendement = quantité réellement obtenue / quantité maximale théorique (1:1, equimolaire)."
          - math: '\boxed{r \approx 4{,}08\times10^{-2} \approx 4{,}1\ \%}'
            note: "Très loin des 66,7 pourcent de l'estérification simple (chapitre 4, « Estérification et hydrolyse ») - cohérent avec un alcool tertiaire très encombre (linalol)."
