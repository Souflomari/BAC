    intro: |-
      **Réaction de l'acide éthanoïque avec l'ammoniac et avec un alcool (examen national, session normale 2012 — Exercice de Chimie, Première partie, 5 points).**

      « L'acide éthanoïque de formule brute $\text{CH}_3\text{COOH}$ est utilisé dans la conservation des viandes et des poissons, et dans la synthèse de plusieurs composés aromatiques et solvants. Il est aussi utilisé dans la tannerie et l'industrie textile. »

      On s'intéresse dans cette partie à l'étude de la réaction de l'acide éthanoïque avec l'ammoniac $\text{NH}_3$, et à l'étude de la réaction du même acide avec le linalol, qui est un alcool qu'on désignera par $\text{ROH}$.

      *La Deuxième partie de cet exercice — l'étude d'une pile cuivre-zinc, indépendante de celle-ci — vit sous la notion « Évolution spontanée d'un système chimique », entrée du sujet 2012.*

      **Données :**
      - $pK_A$ du couple $(\text{CH}_3\text{COOH}/\text{CH}_3\text{COO}^-)$ : $pK_{A1} = 4{,}8$ ;
      - $pK_A$ du couple $(\text{NH}_4^+/\text{NH}_3)$ : $pK_{A2} = 9{,}2$ ;
      - Masse molaire de l'alcool $\text{ROH}$ : $M(\text{ROH}) = 154\ \text{g}\cdot\text{mol}^{-1}$ ;
      - Masse molaire de l'ester $E$ : $M(E) = 196\ \text{g}\cdot\text{mol}^{-1}$.

      **1 — Étude de la réaction de l'acide éthanoïque avec l'ammoniac.** On prépare un mélange $(S)$ de volume $V$, en introduisant $n_1 = 10^{-3}\ \text{mol}$ d'acide éthanoïque et $n_2 = 10^{-3}\ \text{mol}$ d'ammoniac, dans un récipient contenant de l'eau distillée. La transformation ayant lieu est modélisée par l'équation suivante :

      $$\text{CH}_3\text{COOH}_{(aq)} + \text{NH}_{3(aq)} \;\underset{2}{\overset{1}{\rightleftarrows}}\; \text{CH}_3\text{COO}^-_{(aq)} + \text{NH}_{4(aq)}^+$$

      **2 — Étude de la réaction de l'acide éthanoïque avec l'alcool ROH.** Pour synthétiser l'ester $E$ (acétate de linalyle), on chauffe à reflux un mélange équimolaire constitué d'acide éthanoïque et de l'alcool $\text{ROH}$, en présence d'un catalyseur convenable. Partant d'une masse $m_A = 38{,}5\ \text{g}$ d'alcool $\text{ROH}$, on obtient à la fin de la réaction une masse $m_E = 2\ \text{g}$ d'ester $E$.
    questions:
      - id: q1
        part: "1 — Étude de la réaction de l'acide éthanoïque avec l'ammoniac"
        stem: |-
          **1-1.** (0,5 pt) Construire le tableau descriptif de l'évolution de cette réaction.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le tableau d'avancement liste, ligne par ligne, la quantité de chaque espèce de l'équation à trois instants — avant, pendant, à l'équilibre — en fonction d'un seul avancement. C'est l'outil qui va nourrir directement les deux questions suivantes : sans lui, ni le quotient de réaction (1-2) ni le taux d'avancement final (1-3) n'ont de quoi se construire. Cette construction n'est pas propre à cette notion-ci — elle est reprise telle quelle par la notion voisine « État d'équilibre d'un système chimique » (chapitre 3 : « reprends le tableau d'avancement, comme tu l'as construit dans les chapitres précédents ») et par « Réactions acido-basiques » (chapitre 8, exemple travaillé 2) ; elle est traitée ici comme un acquis, re-bâtie au point d'usage.

          L'équation donnée est $\text{CH}_3\text{COOH}_{(aq)} + \text{NH}_{3(aq)} \;\underset{2}{\overset{1}{\rightleftarrows}}\; \text{CH}_3\text{COO}^-_{(aq)} + \text{NH}_{4(aq)}^+$, avec tous les coefficients stœchiométriques égaux à $1$ : chaque unité d'avancement $x$ consomme donc exactement un $\text{CH}_3\text{COOH}$ et un $\text{NH}_3$, et produit exactement un $\text{CH}_3\text{COO}^-$ et un $\text{NH}_4^+$. Le volume $V$ du mélange n'est pas donné numériquement — c'est un signal : on raisonne en **quantités de matière** (mol), jamais en concentrations, et $V$ n'aura besoin d'apparaître nulle part avant la toute fin (il se simplifiera de lui-même, comme au chapitre 3 de État d'équilibre).

          | État | $\text{CH}_3\text{COOH}$ | $\text{NH}_3$ | $\text{CH}_3\text{COO}^-$ | $\text{NH}_4^+$ |
          |------|:---:|:---:|:---:|:---:|
          | initial ($x=0$) | $n_1$ | $n_2$ | $0$ | $0$ |
          | en cours ($x$) | $n_1-x$ | $n_2-x$ | $x$ | $x$ |
          | final ($x=x_f$) | $n_1-x_f$ | $n_2-x_f$ | $x_f$ | $x_f$ |

          avec $n_1 = n_2 = 10^{-3}\ \text{mol}$ (donnée de l'énoncé).

          **Le piège nommé de cette question.** Vouloir absolument convertir en concentrations avant d'avoir $V$ — un réflexe qui bloque le calcul net, puisque $V$ n'est simplement pas donné ici. Le tableau se construit très bien en mol seules ; c'est justement le fait que $n_1 = n_2$ exactement qui évitera, à la question 1-3, toute ambiguïté sur lequel des deux réactifs serait limitant.
      - id: q2
        stem: |-
          **1-2.** (1 pt) Établir l'expression du quotient de réaction à l'équilibre $Q_{r,\text{éq}}$ en fonction de $pK_{A1}$ et $pK_{A2}$, puis calculer sa valeur.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le quotient de réaction, une fois les concentrations remplacées par leur expression du tableau (question 1-1), se fige à l'équilibre à la constante $K$ de la réaction (chapitre 5, État d'équilibre d'un système chimique). Mais ici on nous demande $Q_{r,\text{éq}}$ en fonction de $pK_{A1}$ et $pK_{A2}$ — pas en fonction de concentrations : il faut donc relier la constante de CETTE réaction (entre deux couples acide-base, sans eau dans l'équation écrite) aux deux constantes d'acidité données. C'est exactement le geste du chapitre 8 de « Réactions acido-basiques » : combiner deux couples.

          D'abord, l'expression brute, directement depuis le tableau (l'eau, solvant, n'apparaît pas dans cette équation-ci, à la différence des réactions d'un acide ou d'une base avec l'eau) :

          $$Q_{r,\text{éq}} = \dfrac{[\text{CH}_3\text{COO}^-]_{eq}\,[\text{NH}_4^+]_{eq}}{[\text{CH}_3\text{COOH}]_{eq}\,[\text{NH}_3]_{eq}}$$

          Ensuite, la combinaison des deux couples (chapitre 8 de « Réactions acido-basiques ») : l'acide éthanoïque cède son proton à l'eau ($K_{A1}$), et l'ammoniac le récupère depuis l'eau — on écrit donc la réaction du couple $\text{NH}_4^+/\text{NH}_3$ à l'envers de son sens habituel, ce qui inverse sa constante ($1/K_{A2}$). En additionnant les deux, l'eau et $\text{H}_3\text{O}^+$ s'annulent des deux côtés et il ne reste plus que l'équation de l'énoncé — la preuve que la constante de cette équation-là est bien le produit des deux.

          Enfin l'application numérique — et il se trouve que ce sont très exactement les valeurs de « l'Exemple travaillé 1 » du chapitre 8 de « Réactions acido-basiques » : un $K$ énorme, l'image des « deux salles reliées par une porte » du chapitre 4 de cette leçon-ci — l'acide éthanoïque ($pK_{A1}=4{,}8$, un acide nettement plus fort) impose son proton à l'ammoniac presque sans retour en arrière.

          **Le piège nommé de cette question.** Inverser l'ordre de la soustraction et écrire $10^{pK_{A1}-pK_{A2}} = 10^{-4,4}$ — un nombre minuscule, qui prédirait à tort une réaction quasi nulle, alors que l'acide éthanoïque, nettement plus fort que l'ion ammonium, doit au contraire imposer son proton presque totalement. Un $K \ll 1$ ici serait le signal immédiat d'une erreur de signe, pas d'un résultat à accepter tel quel.
        steps:
          - math: 'Q_{r,\text{éq}} = \dfrac{[\text{CH}_3\text{COO}^-]_{eq}\,[\text{NH}_4^+]_{eq}}{[\text{CH}_3\text{COOH}]_{eq}\,[\text{NH}_3]_{eq}}'
            note: "Quotient associe a l'équation écrite (chapitre 4, état d'équilibre) ; l'eau, solvant, n'apparaît pas dans cette équation."
          - math: '\text{CH}_3\text{COOH} + \text{H}_2\text{O} \rightleftharpoons \text{CH}_3\text{COO}^- + \text{H}_3\text{O}^+ \quad (K_{A1}) \qquad \text{NH}_3 + \text{H}_3\text{O}^+ \rightleftharpoons \text{NH}_4^+ + \text{H}_2\text{O} \quad \left(\dfrac{1}{K_{A2}}\right)'
            note: "On combine les deux couples (chapitre 8 de la leçon Réactions acido-basiques) : le second couple est écrit a l'envers, d'ou l'inverse de KA2."
          - math: 'Q_{r,\text{éq}} = K = K_{A1}\times\dfrac{1}{K_{A2}} = \dfrac{K_{A1}}{K_{A2}} = 10^{-pK_{A1}}\times10^{pK_{A2}} = 10^{pK_{A2}-pK_{A1}}'
            note: "La somme des deux réactions redonne l'équation de l'énoncé ; H3O+ et H2O s'annulent des deux cotes."
          - math: '\boxed{Q_{r,\text{éq}} = 10^{9{,}2-4{,}8} = 10^{4{,}4} \approx 2{,}5\times10^{4}}'
            note: "Application numérique avec pKA1 = 4,8 et pKA2 = 9,2."
      - id: q3
        stem: |-
          **1-3.** (1 pt) Trouver le taux d'avancement final, et s'assurer que la transformation est totale.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le taux d'avancement final $\tau = x_f/x_{max}$ (chapitre 3, État d'équilibre) est le nombre qui va enfin trancher, avec un chiffre, ce que cette leçon-ci annonçait encore qualitativement à son chapitre 4 (« cette idée reste ici qualitative — le chapitre suivant te donnera un nombre précis ») et à son chapitre 5 (« ce degré se quantifiera au chapitre suivant »). On dispose de $Q_{r,\text{éq}} = K$ (question 1-2) et du tableau (question 1-1) : il reste à résoudre pour $x_f$.

          Comme $n_1 = n_2$ exactement, les deux réactifs s'épuiseraient ensemble si la réaction allait au bout : $x_{max} = n_1 = n_2 = 10^{-3}\ \text{mol}$. On reporte les concentrations d'équilibre du tableau dans $K$ — le volume $V$ se simplifie, exactement comme annoncé à la question 1-1. C'est très exactement la construction algébrique de « l'Exemple travaillé 2 » du chapitre 8 de « Réactions acido-basiques » : quantités initiales égales, un carré parfait des deux côtés, on prend la racine directement plutôt que de développer une équation du second degré complète — et ici la racine se calcule sans calculatrice, en divisant l'exposant par deux.

          **S'assurer que la transformation est totale.** $\tau \approx 0{,}994$ : il ne reste, à l'équilibre, qu'environ $0{,}6\ \%$ des quantités initiales de $\text{CH}_3\text{COOH}$ et de $\text{NH}_3$ — une trace. Selon le critère du chapitre 3 (État d'équilibre) — « $\tau=1$, ou très proche de $1$ : transformation totale » — c'est un $\tau$ très proche de $1$ : la transformation est bien, dans les faits, totale. C'est exactement le cas que le chapitre 5 de cette leçon-ci anticipait sans le chiffrer : une transformation réversible, gouvernée par une double flèche, mais dont le taux d'avancement final est si proche de $1$ qu'on la traite comme totale — au point qu'on l'écrirait souvent, dans la pratique, avec une flèche simple $\rightarrow$, même si en toute rigueur elle reste réversible.

          **Le piège nommé de cette question.** Conclure « $K$ est grand, donc la transformation est totale » sans jamais calculer $\tau$ — un raccourci qualitatif correct dans son verdict, mais qui ne répond pas à ce que demande la question. Elle demande le nombre : $\tau \approx 0{,}994$, pas $\tau = 1$ exactement — aucune transformation gouvernée par une double flèche n'atteint jamais rigoureusement $1$ (chapitre 2, cette leçon).
        steps:
          - math: '\tau = \dfrac{x_f}{x_{max}}, \qquad x_{max} = n_1 = n_2 = 10^{-3}\ \text{mol}'
            note: "Définition du taux d'avancement final (chapitre 3, état d'équilibre) ; les deux réactifs, introduits a égalité et consommes 1 pour 1, s'épuiseraient ensemble."
          - math: 'Q_{r,\text{éq}} = \dfrac{x_f^{2}}{(n_1-x_f)^{2}} = K \implies \dfrac{x_f}{n_1-x_f} = \sqrt{K}'
            note: "Même construction algébrique que l'exemple travaille 2 du chapitre 8 de la leçon Réactions acido-basiques : quantités initiales égales, le rapport se résout par une racine carrée."
          - math: '\sqrt{K} = \sqrt{10^{4{,}4}} = 10^{2{,}2} \approx 158{,}5'
            note: "Racine carrée d'une puissance de 10 : on divise l'exposant par 2."
          - math: 'x_f = \dfrac{\sqrt{K}}{1+\sqrt{K}}\,n_1 \implies \tau = \dfrac{x_f}{n_1} = \dfrac{\sqrt{K}}{1+\sqrt{K}} = \dfrac{158{,}5}{159{,}5}'
