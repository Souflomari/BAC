<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Diffraction d'une onde mécanique selon la largeur de l'ouverture : à gauche, une ouverture large (a très supérieur à lambda), les fronts d'onde plans continuent presque tout droit derrière l'ouverture ; à droite, une ouverture étroite (a inférieur ou de l'ordre de lambda), les fronts d'onde deviennent des arcs qui s'étalent sur un large domaine derrière l'ouverture, comme si l'ouverture était devenue une nouvelle source. Formule de synthèse : a inférieur ou égal à lambda entraîne une diffraction notable.">
  <title>Diffraction : étalement selon la largeur de l'ouverture</title>
  <!--
    diffraction-fente-fronts.svg — R5. Deux panneaux CÔTE À CÔTE, la MÊME
    onde incidente (mêmes 3 fronts plans, même pas λ) arrivant sur une
    ouverture de largeur a différente dans chaque panneau — SEULE la largeur
    de l'ouverture change entre A et B, tout le reste de la géométrie est
    partagé (panneau B = panneau A translaté de +304 en x, sauf le gap et
    ce qui sort de la fente).

    DÉLIBÉRÉMENT SANS le vocabulaire de la diffraction lumineuse (pas de θ,
    pas d'écran, pas de D/L — cf. diffraction-fente.svg dans
    propagation-onde-lumineuse, qui EST ce vocabulaire quantitatif, hors-
    cadre ici). Ici : une image de fronts d'onde qui s'étalent ou non,
    condition a ≤ λ annotée en toutes lettres, rien de plus.

    Géométrie commune aux deux panneaux :
      cadre A : x=32..304, y=46..312 (272×266) ; cadre B : x=336..608 (même y)
      cy (axe de symétrie vertical, commun) = 46 + 266/2 = 179
      fronts d'onde INCIDENTS (avant l'ouverture) : 3 droites verticales,
        pas λ_px = 20 px, à x = 44,64,84 (panneau A) / 348,368,388 (panneau B,
        = +304), hauteur y=70..286 — IDENTIQUES dans les deux panneaux
        (même onde, même λ, avant qu'elle ne rencontre l'ouverture).
      flèche de propagation (discrète, sans texte) au-dessus des fronts.
      paroi (deux barres) : épaisseur 12 px, x=124..136 (A) / 428..440 (B).

    Panneau A — ouverture LARGE (a ≫ λ) :
      demi-ouverture 85 px → gap y=94..264 (a_px=170, soit 8,5×λ_px=20).
      Fronts SORTANTS : simple CONTINUATION des droites verticales (même
      pas 20 px), confinées à la hauteur de l'ouverture (94..264) — le
      faisceau reste quasi rectiligne, dans le prolongement direct de
      l'ouverture (simplification de manuel : la légère courbure aux bords,
      réelle mais du second ordre ici, n'est pas dessinée).

    Panneau B — ouverture ÉTROITE (a ≤ λ) :
      demi-ouverture 8 px → gap y=171..187 (a_px=16, légèrement INFÉRIEUR
      à λ_px=20 — exactement la condition a ≤ λ annoncée).
      Fronts SORTANTS : 5 arcs CONCENTRIQUES, centrés sur le centre de
      l'ouverture (440,179), rayons 30/55/80/105/130 (pas 25 px, proche de
      λ_px, cohérent avec « la fente devient une source »), chacun balayant
      ±75° (150° < 180°, arc mineur) — l'ouverture s'est étalée en un très
      large domaine angulaire, y compris derrière les deux bords de la
      paroi (la « zone d'ombre » géométrique), la signature même de la
      diffraction. Chaque arc : commande SVG "A r,r 0 0,1 …", vérifiée par
      calcul direct du centre (formule de l'arc elliptique, avec fA=0,
      fS=1 → centre à gauche de la corde, donc arc bombé VERS LA DROITE,
      loin de la paroi) — pas devinée à l'écran.

    Repères a et λ (--figure-accent, la grandeur comparée = l'idée de la
    figure) : bracket vertical pour a (à gauche de la paroi, dans la zone
    incidente, pour ne jamais chevaucher les fronts sortants) ; bracket
    horizontal pour λ (entre les deux premiers fronts incidents, en bas du
    panneau) — même construction que les brackets λ/T de
    double-periodicite.svg (chute pointillée, ticks, label).

    Couleurs : fronts INCIDENTS + paroi = --figure-ink-soft / --figure-ink
    (structurel, partagé, pas l'idée) ; fronts SORTANTS + brackets a/λ +
    bandeau de synthèse = --figure-accent (l'idée : ce qui CHANGE selon la
    largeur de l'ouverture, et les deux grandeurs qui pilotent la
    comparaison) ; en-têtes de panneau = --figure-accent (convention
    chrome du corpus, comme dephasage.svg / double-periodicite.svg).

    MISE EN ÉTAPES (schéma dont l'ORDRE est un geste d'enseignement — R5 du
    texte est un predict-then-break : « imagine… prends position… »,
    l'expérience tranche ensuite) :
      step-1 : le montage — cadres, en-têtes, fronts incidents, paroi/gap
               (déjà fixée grande ou étroite) — la donnée AVANT le résultat,
               pour laisser la place à la prédiction du texte.
      step-2 : le résultat — les fronts sortants dans les deux panneaux
               (rectilignes en A, étalés en B) — la révélation.
      step-3 : la lecture — brackets a et λ, bandeau de synthèse a ≤ λ.
    Les captions vivent dans diffraction-fente-fronts.stages.json.
  -->

  <!-- Titre (chrome non-stagé) -->
  <text x="320" y="18" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Diffraction : étalement selon la largeur de l'ouverture</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Le montage : cadres, en-têtes, fronts incidents, paroi/gap
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- ── Panneau A — en-tête + cadre ── -->
    <text x="32" y="36" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">Ouverture large : a ≫ λ</text>
    <rect x="32" y="46" width="272" height="266" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Flèche de propagation (discrète) -->
    <line x1="40" y1="60" x2="92" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="92,60 82,56 82,64" fill="var(--figure-ink-soft)"/>

    <!-- Fronts d'onde incidents (3 droites, pas λ = 20 px) -->
    <line x1="44" y1="70" x2="44" y2="286" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="64" y1="70" x2="64" y2="286" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="84" y1="70" x2="84" y2="286" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>

    <!-- Paroi : ouverture LARGE, gap y=94..264 -->
    <rect x="124" y="46" width="12" height="48" fill="var(--figure-ink-soft)" fill-opacity="0.22"
          stroke="var(--figure-ink)" stroke-width="1.5"/>
    <rect x="124" y="264" width="12" height="48" fill="var(--figure-ink-soft)" fill-opacity="0.22"
          stroke="var(--figure-ink)" stroke-width="1.5"/>

    <!-- ── Panneau B — en-tête + cadre ── -->
    <text x="336" y="36" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">Ouverture étroite : a ≤ λ</text>
    <rect x="336" y="46" width="272" height="266" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Flèche de propagation -->
    <line x1="344" y1="60" x2="396" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="396,60 386,56 386,64" fill="var(--figure-ink-soft)"/>

    <!-- Fronts d'onde incidents — IDENTIQUES au panneau A, translatés de +304 -->
    <line x1="348" y1="70" x2="348" y2="286" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="368" y1="70" x2="368" y2="286" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="388" y1="70" x2="388" y2="286" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>

    <!-- Paroi : ouverture ÉTROITE, gap y=171..187 (a légèrement inférieur à λ) -->
    <rect x="428" y="46" width="12" height="125" fill="var(--figure-ink-soft)" fill-opacity="0.22"
          stroke="var(--figure-ink)" stroke-width="1.5"/>
    <rect x="428" y="187" width="12" height="125" fill="var(--figure-ink-soft)" fill-opacity="0.22"
          stroke="var(--figure-ink)" stroke-width="1.5"/>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — Le résultat : fronts sortants (rectilignes en A, étalés en B)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- Panneau A : continuation quasi rectiligne, confinée à la hauteur de l'ouverture -->
    <line x1="156" y1="94" x2="156" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="176" y1="94" x2="176" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="196" y1="94" x2="196" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="216" y1="94" x2="216" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="236" y1="94" x2="236" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="256" y1="94" x2="256" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>
    <line x1="276" y1="94" x2="276" y2="264" stroke="var(--figure-accent)" stroke-width="2.2"/>

    <!-- Panneau B : 5 arcs concentriques, centrés sur le centre de l'ouverture (440,179), ±75° -->
    <path d="M447.8,150.0 A30,30 0 0,1 447.8,208.0"
          fill="none" stroke="var(--figure-accent)" stroke-width="2"/>
    <path d="M454.2,125.9 A55,55 0 0,1 454.2,232.1"
          fill="none" stroke="var(--figure-accent)" stroke-width="2"/>
    <path d="M460.7,101.7 A80,80 0 0,1 460.7,256.3"
          fill="none" stroke="var(--figure-accent)" stroke-width="2"/>
    <path d="M467.2,77.6 A105,105 0 0,1 467.2,280.4"
          fill="none" stroke="var(--figure-accent)" stroke-width="2"/>
    <path d="M473.7,53.4 A130,130 0 0,1 473.7,304.6"
          fill="none" stroke="var(--figure-accent)" stroke-width="2"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — La lecture : brackets a et λ, bandeau de synthèse
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- Panneau A — bracket a (vertical, à gauche de la paroi) -->
    <line x1="104" y1="94" x2="112" y2="94" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="104" y1="264" x2="112" y2="264" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="108" y1="94" x2="108" y2="264" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="96" y="182" text-anchor="end" font-size="12" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">a</text>

    <!-- Panneau A — bracket λ (horizontal, entre les deux premiers fronts incidents) -->
    <line x1="44" y1="286" x2="44" y2="298" stroke="var(--figure-accent)" stroke-width="1"
          stroke-dasharray="3,3"/>
    <line x1="64" y1="286" x2="64" y2="298" stroke="var(--figure-accent)" stroke-width="1"
          stroke-dasharray="3,3"/>
    <line x1="44" y1="298" x2="44" y2="308" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="64" y1="298" x2="64" y2="308" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="44" y1="303" x2="64" y2="303" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="54" y="300" text-anchor="middle" font-size="11" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">λ</text>

    <!-- Panneau B — bracket a (même construction, gap plus petit) -->
    <line x1="408" y1="171" x2="416" y2="171" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="408" y1="187" x2="416" y2="187" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="412" y1="171" x2="412" y2="187" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="400" y="182" text-anchor="end" font-size="12" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">a</text>

    <!-- Panneau B — bracket λ -->
    <line x1="348" y1="286" x2="348" y2="298" stroke="var(--figure-accent)" stroke-width="1"
          stroke-dasharray="3,3"/>
    <line x1="368" y1="286" x2="368" y2="298" stroke="var(--figure-accent)" stroke-width="1"
          stroke-dasharray="3,3"/>
    <line x1="348" y1="298" x2="348" y2="308" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="368" y1="298" x2="368" y2="308" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="348" y1="303" x2="368" y2="303" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="358" y="300" text-anchor="middle" font-size="11" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">λ</text>

    <!-- Bandeau de synthèse -->
    <rect x="190" y="336" width="260" height="34" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="320" y="358" text-anchor="middle" font-size="15" font-style="italic"
          fill="var(--figure-accent)">a ≤ λ → diffraction notable</text>
  </g><!-- /step-3 -->

</svg>
