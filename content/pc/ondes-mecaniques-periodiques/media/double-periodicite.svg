<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Double périodicité d'une onde progressive périodique sinusoïdale : en haut, photographie y(x) de la corde à un instant t fixé, avec la longueur d'onde lambda marquée entre deux crêtes consécutives ; en bas, évolution y(t) d'un point fixé de la corde au cours du temps, avec la période T marquée entre deux crêtes consécutives ; les deux grandeurs sont liées par lambda = c fois T.">
  <title>Double périodicité : y(x) et y(t) d'une même onde</title>
  <!--
    double-periodicite.svg — même onde, deux lectures.
    Panneau A (haut)  : photographie y(x) à t fixé  → longueur d'onde λ marquée.
    Panneau B (bas)   : évolution y(t) en un point fixé → période T marquée.

    Technique reprise à l'identique de rlc-serie/media/regimes-uc.svg (step-1) :
    sinusoïde approchée par des courbes de Bézier, période géométrique = 125px,
    amplitude = 32px. Les DEUX panneaux réutilisent EXACTEMENT le même gabarit
    de courbe (mêmes abscisses de crêtes/creux), seule l'ordonnée de l'axe
    change — ce qui est correct : une même forme sinusoïdale, lue une fois en
    fonction de x, une fois en fonction de t.

    Gabarit (dérivé de regimes-uc step-1, axis_y=98 de référence) :
      axis_y     : ligne de base
      crête_y    = axis_y - 32   (premières crêtes en x = 141.5 et x = 266.5,
                                   puis 391.5 et 516.5 — pas de 125px)
      creux_y    = axis_y + 32   (creux en x = 204, 329, 454, 579)
      la trace s'arrête à x = 554, laissant un gutter libre 554..624 à droite
      (comme dans regimes-uc, pour ne jamais collisionner un label).

    Panneau A : axis_y = 98  → crête = 66,  creux = 130.  Rect y = 40..158.
    Panneau B : axis_y = 238 → crête = 206, creux = 270.  Rect y = 180..298.
    (offset vertical = +140 entre les deux panneaux, aucune autre différence
    de géométrie horizontale.)

    Repère λ (panneau A) et repère T (panneau B) : bracket entre les deux
    premières crêtes (x = 141.5 et x = 266.5), avec chute pointillée depuis la
    crête jusqu'au bracket — technique reprise du repère T de regimes-uc
    step-2 (pseudo-périodique).

    Pas de repère d'amplitude (Ym) ici : R2 du texte ne l'introduit pas
    encore (Ym n'apparaît qu'en R3, pour l'onde sinusoïdale) — on ne marque
    que ce qui sert exactement le propos de R2 : λ et T.

    Couleurs : courbe = --figure-accent (même onde dans les deux panneaux,
    même couleur, pour souligner qu'il s'agit d'une seule et même onde) ;
    axes / labels neutres = --figure-ink-soft ; sous-titres de panneau =
    --figure-accent (texte, pas de pastille remplie) ; bracket λ/T =
    --figure-accent.

    MISE EN ÉTAPES (LESSON-EXPERIENCE-SPEC §2.5 — graphe, toujours staged,
    axes → données → lecture) :
      step-1 : les deux sous-titres de panneau + les deux paires d'axes vides.
      step-2 : la même sinusoïde se trace dans les deux panneaux.
      step-3 : la lecture — bracket λ (panneau A), bracket T (panneau B), et
               la formule de synthèse λ = c·T.
    Les deux légendes-paragraphes qui répétaient en toutes lettres "λ se lit
    sur la photo / T se lit sur l'évolution" ont été retirées : ce texte vit
    maintenant dans double-periodicite.stages.json (étape 3), pour ne pas
    dupliquer la caption.
  -->

  <!-- Titre (chrome non-stagé — doit précéder tous les groupes step-N,
       la réassemblage du renderer les ajoute en dernier avant </svg>) -->
  <text x="320" y="16" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Double périodicité de l'onde : <tspan
        font-style="italic">y</tspan>(<tspan
        font-style="italic">x</tspan>) et <tspan
        font-style="italic">y</tspan>(<tspan
        font-style="italic">t</tspan>)</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Axes : les deux sous-titres + les deux paires d'axes vides
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- Panneau A — photographie y(x) à t fixé -->
    <text x="96" y="32" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">Photographie à un instant <tspan
          font-style="italic">t</tspan> fixé — <tspan
          font-style="italic">y</tspan>(<tspan font-style="italic">x</tspan>)</text>

    <rect x="88" y="40" width="536" height="118" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="98" x2="604" y2="98"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="604,98 592,93.5 592,102.5" fill="var(--figure-ink-soft)"/>
    <line x1="104" y1="148" x2="104" y2="58"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="104,58 99.5,69 108.5,69" fill="var(--figure-ink-soft)"/>
    <text x="611" y="102" font-size="11" fill="var(--figure-ink-soft)"><tspan
          font-style="italic">x</tspan><tspan> (m)</tspan></text>
    <text x="96" y="58" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">y</text>
    <text x="96" y="102" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>

    <!-- Panneau B — évolution y(t) en un point fixé -->
    <text x="96" y="172" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">Un point fixé de la corde, au cours du temps — <tspan
          font-style="italic">y</tspan>(<tspan font-style="italic">t</tspan>)</text>

    <rect x="88" y="180" width="536" height="118" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="238" x2="604" y2="238"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="604,238 592,233.5 592,242.5" fill="var(--figure-ink-soft)"/>
    <line x1="104" y1="288" x2="104" y2="198"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="104,198 99.5,209 108.5,209" fill="var(--figure-ink-soft)"/>
    <text x="611" y="242" font-size="11" fill="var(--figure-ink-soft)"><tspan
          font-style="italic">t</tspan><tspan> (s)</tspan></text>
    <text x="96" y="198" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">y</text>
    <text x="96" y="242" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — Données : la même sinusoïde se trace dans les deux panneaux
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!--
      Panneau A : sinusoïde spatiale — gabarit regimes-uc/step-1 (axis 98, crête 66, creux 130).
      Crêtes en x = 141.5, 266.5, 391.5, 516.5 ; creux en x = 204, 329, 454, 579.
    -->
    <path d="
      M104,98
      C113,76 128,66 141.5,66
      C155,66 170,76 179,98
      C188,120 203,130 216.5,130
      C230,130 245,120 254,98
      C263,76 278,66 291.5,66
      C305,66 320,76 329,98
      C338,120 353,130 366.5,130
      C380,130 395,120 404,98
      C413,76 428,66 441.5,66
      C455,66 470,76 479,98
      C488,120 503,130 516.5,130
      C530,130 545,120 554,98
    " fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!--
      Panneau B : même gabarit que le panneau A, translaté de +140 en y (axis 238, crête 206,
      creux 270) — même forme, seul l'axe change de sens physique (x → t).
    -->
    <path d="
      M104,238
      C113,216 128,206 141.5,206
      C155,206 170,216 179,238
      C188,260 203,270 216.5,270
      C230,270 245,260 254,238
      C263,216 278,206 291.5,206
      C305,206 320,216 329,238
      C338,260 353,270 366.5,270
      C380,270 395,260 404,238
      C413,216 428,206 441.5,206
      C455,206 470,216 479,238
      C488,260 503,270 516.5,270
      C530,270 545,260 554,238
    " fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — Lecture : bracket λ, bracket T, formule de synthèse
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- Repère λ (panneau A) : chute pointillée depuis les deux premières crêtes, bracket, label -->
    <line x1="141.5" y1="66" x2="141.5" y2="145"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="266.5" y1="66" x2="266.5" y2="145"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="141.5" y1="150" x2="266.5" y2="150"
          stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="141.5" y1="145" x2="141.5" y2="155"
          stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="266.5" y1="145" x2="266.5" y2="155"
          stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="204" y="147" text-anchor="middle" font-size="12" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">λ</text>

    <!-- Repère T (panneau B) : même construction que λ, translatée -->
    <line x1="141.5" y1="206" x2="141.5" y2="285"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="266.5" y1="206" x2="266.5" y2="285"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="141.5" y1="290" x2="266.5" y2="290"
          stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="141.5" y1="285" x2="141.5" y2="295"
          stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="266.5" y1="285" x2="266.5" y2="295"
          stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="204" y="287" text-anchor="middle" font-size="12" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">T</text>

    <!-- Relation de synthèse -->
    <rect x="220" y="310" width="200" height="34" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="320" y="332" text-anchor="middle" font-size="15" font-style="italic"
          fill="var(--figure-accent)">λ = c · T</text>
  </g><!-- /step-3 -->

</svg>
