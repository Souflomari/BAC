<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le son, onde longitudinale : en haut, des couches d’air uniformément espacées au repos, avec la source (membrane) à gauche ; au centre, la source pousse vers l’avant, créant une compression (couches resserrées) devant elle et une dilatation (couches espacées) derrière, avec une flèche montrant que le déplacement des couches d’air est horizontal, le long de l’axe de propagation ; en bas, le motif périodique établi, des compressions et dilatations alternées se propageant vers la droite à la célérité c, avec la longueur d’onde lambda marquée entre deux compressions successives, et une annotation rappelant que ce déplacement est dans le sens de propagation, contrairement à la corde où il est perpendiculaire.">
  <title>Le son : onde mécanique longitudinale — compressions et dilatations</title>
  <!--
    son-longitudinal-compressions.svg — R4 : le son comme onde progressive
    périodique longitudinale. Trois bandes empilées (même principe de mise
    en page que onde-propagation-retard.svg dans la leçon précédente : une
    bande = un instant/aspect, révélée par étape), chacune montrant l'état
    d'une rangée de couches d'air, avec la source (membrane) à gauche.

    Bande 1 (step-1, repos) : 16 repères également espacés (pas 30px),
      x = 114..564.
    Bande 2 (step-2, la source pousse) : une zone dilatée (repères espacés
      de 20px, x=110..170) suivie d'une zone comprimée (repères resserrés
      de 8px, x=178..202), puis un espacement normal repris au-delà — plus
      une flèche à double pointe montrant que le déplacement des couches
      d'air est HORIZONTAL, dans l'axe de propagation (le critère
      longitudinal, repris du panneau droit de transverse-longitudinal.svg,
      leçon précédente : même convention de flèche à double pointe).
    Bande 3 (step-3, régime établi) : motif périodique de période 100px —
      un groupe de 3 repères resserrés (compression, largeur 16px) suivi
      d'un repère isolé (dilatation), répété 5 fois — avec la longueur
      d'onde λ marquée entre les centres de deux compressions consécutives
      (x=122 et x=222).

    Couleurs : la source (membrane) et les repères de couches d'air restent
    neutres (--figure-ink / --figure-ink-soft) — ce sont des éléments
    structurels répétés, pas la grandeur enseignée. --figure-accent est
    réservé aux DEUX marques qui portent l'idée : la flèche de déplacement
    longitudinal (bande 2) et le repère λ (bande 3) — plus les en-têtes de
    bande, par cohérence avec double-periodicite.svg / dephasage.svg.
  -->

  <!-- Titre (chrome non-stagé) -->
  <text x="320" y="16" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Le son : une onde longitudinale — compressions et dilatations</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Au repos : couches d'air également espacées, source à gauche
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <text x="96" y="34" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">Au repos : couches d’air uniformément espacées</text>

    <rect x="40" y="42" width="560" height="110" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Sens de propagation -->
    <line x1="110" y1="64" x2="190" y2="64" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="190,64 178,59.5 178,68.5" fill="var(--figure-ink-soft)"/>
    <text x="150" y="56" text-anchor="middle" font-size="9"
          fill="var(--figure-ink-soft)">sens de propagation</text>

    <!-- Source (membrane) -->
    <rect x="58" y="90" width="14" height="44" rx="3" fill="var(--figure-ink)"/>
    <text x="65" y="145" text-anchor="middle" font-size="10" font-style="italic"
          fill="var(--figure-ink)">S</text>

    <!-- Couches d'air, également espacées (pas = 30px) -->
    <line x1="114" y1="102" x2="114" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="144" y1="102" x2="144" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="174" y1="102" x2="174" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="204" y1="102" x2="204" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="234" y1="102" x2="234" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="264" y1="102" x2="264" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="294" y1="102" x2="294" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="324" y1="102" x2="324" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="354" y1="102" x2="354" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="384" y1="102" x2="384" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="414" y1="102" x2="414" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="444" y1="102" x2="444" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="474" y1="102" x2="474" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="504" y1="102" x2="504" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="534" y1="102" x2="534" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="564" y1="102" x2="564" y2="122" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — La source pousse : compression devant, dilatation derrière,
       déplacement longitudinal
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <text x="96" y="182" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">La source pousse : compression devant, dilatation derrière</text>

    <rect x="40" y="190" width="560" height="120" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Sens de propagation -->
    <line x1="110" y1="206" x2="190" y2="206" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="190,206 178,201.5 178,210.5" fill="var(--figure-ink-soft)"/>
    <text x="150" y="198" text-anchor="middle" font-size="9"
          fill="var(--figure-ink-soft)">sens de propagation</text>

    <!-- Source (membrane), poussée vers l'avant -->
    <rect x="58" y="228" width="14" height="44" rx="3" fill="var(--figure-ink)"/>
    <text x="65" y="286" text-anchor="middle" font-size="10" font-style="italic"
          fill="var(--figure-ink)">S</text>
    <line x1="74" y1="250" x2="90" y2="250" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="90,250 82,246 82,254" fill="var(--figure-accent)"/>

    <!-- Zone de dilatation : couches espacées (pas 20px) -->
    <line x1="110" y1="240" x2="110" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="130" y1="240" x2="130" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="150" y1="240" x2="150" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="170" y1="240" x2="170" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <!-- Zone de compression : couches resserrées (pas 8px) -->
    <line x1="178" y1="240" x2="178" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="186" y1="240" x2="186" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="194" y1="240" x2="194" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="202" y1="240" x2="202" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <!-- Espacement normal repris au-delà (pas 30px) -->
    <line x1="232" y1="240" x2="232" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="262" y1="240" x2="262" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="292" y1="240" x2="292" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="322" y1="240" x2="322" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="352" y1="240" x2="352" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="382" y1="240" x2="382" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="412" y1="240" x2="412" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="442" y1="240" x2="442" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="472" y1="240" x2="472" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="502" y1="240" x2="502" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="532" y1="240" x2="532" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="562" y1="240" x2="562" y2="260" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <!-- Étiquettes de zone -->
    <text x="140" y="232" text-anchor="middle" font-size="10" font-weight="600"
          fill="var(--figure-ink)">dilatation</text>
    <line x1="110" y1="236" x2="170" y2="236" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="190" y="232" text-anchor="middle" font-size="10" font-weight="600"
          fill="var(--figure-ink)">compression</text>
    <line x1="178" y1="236" x2="202" y2="236" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>

    <!-- Déplacement des couches d'air : HORIZONTAL, le long de l'axe de
         propagation (le critère longitudinal) -->
    <line x1="182" y1="278" x2="222" y2="278" stroke="var(--figure-accent)" stroke-width="1.8"/>
    <polygon points="182,278 190,273.5 190,282.5" fill="var(--figure-accent)"/>
    <polygon points="222,278 214,273.5 214,282.5" fill="var(--figure-accent)"/>
    <text x="202" y="294" text-anchor="middle" font-size="9.5"
          fill="var(--figure-accent)">déplacement, le long de la propagation</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — Régime établi : motif périodique, λ entre deux compressions
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <text x="96" y="340" font-size="11.5" font-weight="600"
          fill="var(--figure-accent)">Le motif périodique se propage, à la célérité <tspan
          font-style="italic">c</tspan></text>

    <rect x="40" y="348" width="560" height="130" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Sens de propagation -->
    <line x1="110" y1="364" x2="190" y2="364" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="190,364 178,359.5 178,368.5" fill="var(--figure-ink-soft)"/>
    <text x="150" y="356" text-anchor="middle" font-size="9"
          fill="var(--figure-ink-soft)">sens de propagation</text>
    <text x="198" y="368" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">c</text>

    <!-- Motif périodique (période 100px) : groupe resserré (compression) +
         un repère isolé (dilatation), répété 5 fois -->
    <line x1="114" y1="392" x2="114" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="122" y1="392" x2="122" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="130" y1="392" x2="130" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="172" y1="392" x2="172" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <line x1="214" y1="392" x2="214" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="222" y1="392" x2="222" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="230" y1="392" x2="230" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="272" y1="392" x2="272" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <line x1="314" y1="392" x2="314" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="322" y1="392" x2="322" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="330" y1="392" x2="330" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="372" y1="392" x2="372" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <line x1="414" y1="392" x2="414" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="422" y1="392" x2="422" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="430" y1="392" x2="430" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="472" y1="392" x2="472" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <line x1="514" y1="392" x2="514" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="522" y1="392" x2="522" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="530" y1="392" x2="530" y2="412" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>

    <!-- Repère λ : entre les centres de deux compressions consécutives (x=122 et x=222) -->
    <line x1="122" y1="412" x2="122" y2="444"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="222" y1="412" x2="222" y2="444"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="122" y1="449" x2="222" y2="449" stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="122" y1="444" x2="122" y2="454" stroke="var(--figure-accent)" stroke-width="2"/>
    <line x1="222" y1="444" x2="222" y2="454" stroke="var(--figure-accent)" stroke-width="2"/>
    <text x="172" y="446" text-anchor="middle" font-size="12" font-style="italic"
          font-weight="600" fill="var(--figure-accent)">λ</text>

    <!-- Synthèse : contraste avec la corde (onde transversale) -->
    <rect x="110" y="496" width="420" height="54" rx="8"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="320" y="516" text-anchor="middle" font-size="12.5" font-weight="600"
          fill="var(--figure-accent)">Contrairement à la corde (onde transversale) :</text>
    <text x="320" y="536" text-anchor="middle" font-size="12.5"
          fill="var(--figure-accent)">le déplacement est dans le sens de propagation, pas perpendiculaire.</text>
  </g><!-- /step-3 -->

</svg>
