          $\lambda = cT$ qui les relie.
    correct_feedback: >
      Léa et Yanis décrivent la même onde périodique sous deux angles
      différents — le temps pour un point fixe ($T$), l'espace à un instant
      fixe ($\lambda$) — et ces deux répétitions sont nécessairement liées,
