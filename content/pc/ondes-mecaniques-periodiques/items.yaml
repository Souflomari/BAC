          au son — qui n'est qu'un exemple parmi d'autres d'onde mécanique
          progressive périodique, pas un cas à part.
    correct_feedback: >
      La double périodicité — temporelle et spatiale — est une propriété
      générale de toute onde progressive périodique, quelle que soit la
      nature précise du mouvement de la source (sinusoïdal ou non) et quel
      que soit le milieu (corde, air, etc.).
    solution: |
      Le mécanisme établi par le chapitre (retard + périodicité de la
      source) ne fait intervenir à aucun moment une forme particulière du
      mouvement de $S$ : il vaut pour n'importe quelle source périodique. Le
      lien entre $T$ et $\lambda$ est donc général — il ne dépend ni de la
      nature sinusoïdale ou non du mouvement, ni du type d'onde (corde, son,
