  - id: OMPP-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [periodicite_temporelle, transport_matiere, retard, longitudinale_transversale]
    stem: >
      Une onde progressive périodique est définie comme le cas particulier
      d'une onde progressive où...
    type: mcq
    choices:
      - id: A
        text: >-
          la perturbation imposée par la source se répète à l'identique, à
          intervalles de temps réguliers $T$.
        correct: true
      - id: B
        text: >-
          la perturbation transporte de la matière en plus de l'énergie,
          contrairement à une onde progressive simple.
        correct: false
        misconception: OND-NAT-1
        feedback: >
          Une onde progressive — périodique ou non — ne transporte jamais de
          matière, seulement de l'énergie : c'est une propriété de TOUTE
          onde progressive, héritée du chapitre précédent, pas quelque chose
          que la périodicité changerait.
      - id: C
        text: >-
          la perturbation se propage sans aucun retard entre la source et
          les points du milieu.
        correct: false
        misconception: OND-PH-3
        feedback: >
          Le retard $\tau = d/c$ entre la source et un point $M$ existe
          toujours, périodicité ou non : $M$ rejoue le mouvement de $S$ avec
          ce retard, il ne le reproduit pas instantanément. La périodicité
          ne supprime pas le retard, elle garantit seulement que $M$ vibre à
          la même période que $S$ malgré ce retard.
      - id: D
        text: >-
          la perturbation change de nature (une onde transversale devient
          longitudinale) à chaque nouvelle période.
        correct: false
        misconception: OND-NAT-1
        feedback: >
          La nature d'une onde — transversale ou longitudinale — est fixée
          par le mécanisme physique de la source et du milieu, elle ne
          change jamais d'une période à l'autre. La périodicité concerne la
          répétition du mouvement dans le temps, pas la nature géométrique
          de la vibration.
    correct_feedback: >
      Ce qui définit une onde progressive périodique, c'est uniquement que
      le mouvement de la source se répète à l'identique à intervalles
      réguliers $T$ — tout le reste (absence de transport de matière, retard
      $d/c$, nature transversale ou longitudinale) est hérité tel quel du
      cas général d'onde progressive.
    solution: |
      Une onde progressive périodique est un CAS PARTICULIER d'onde
      progressive : elle en garde toutes les propriétés générales
      (propagation de proche en proche, sans transport de matière, avec un
      retard $\tau = d/c$ entre source et point atteint, une nature fixée
      par le mécanisme physique) et y ajoute une seule propriété
      supplémentaire — la répétition à l'identique du mouvement de la
      source, à intervalles de temps réguliers $T$.

  - id: OMPP-11
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [periodicite_temporelle, retard, milieu_de_propagation, dephasage]
    stem: >
      Le retard $\tau = d/c$ entre la source $S$ et un point $M$ dépend de
      la distance $d$. Cela signifie-t-il que deux points du milieu, à des
      distances différentes de $S$, vibrent avec des périodes différentes ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : quelle que soit la distance $d$, chaque point $M$ vibre avec exactement
          la même période $T$ que la source ; seul l'instant du cycle change avec le
          retard.
        correct: true
      - id: B
        text: >-
          Oui : plus le point $M$ est loin de $S$, plus le signal met de temps à
          l'atteindre, et donc plus sa période est grande.
        correct: false
        misconception: OND-PH-3
        feedback: >
          Le retard $\tau$ (le temps que met le signal à atteindre $M$ pour
          la première fois) et la période $T$ (le temps que met $M$, une
          fois atteint, à répéter son propre mouvement) sont deux durées
          différentes. Un retard plus grand décale seulement le début de la
          vibration de $M$ dans le temps, il n'allonge jamais sa période une
          fois que $M$ vibre.
      - id: C
        text: >-
          Oui, mais seulement si le milieu est tel que la célérité $c$ varie avec la
          distance parcourue par l'onde ; sinon la période reste inchangée.
        correct: false
        misconception: OND-PH-3
        feedback: >
          La démonstration ($y_M(t+T) = y_M(t)$) ne fait intervenir que la
          périodicité de la source, jamais une propriété particulière du
          milieu : elle vaut pour n'importe quel milieu, homogène ou non. La
          période de chaque point est toujours celle de la source, sans
          condition supplémentaire sur le milieu.
      - id: D
        text: >-
          Non, la période ne change pas, mais le déphasage entre $S$ et $M$ est toujours
          nul, quelle que soit la distance $d$ qui les sépare.
        correct: false
        misconception: OND-PH-2
        feedback: >
          Le déphasage $\Delta\varphi = 2\pi d/\lambda$ dépend de $d$ et
          n'est nul que si $d$ est un multiple entier de $\lambda$ : il
          n'est pas systématiquement nul. Ce qui est vrai pour TOUT point
          $M$, c'est l'égalité des périodes, pas l'absence de déphasage.
    correct_feedback: >
      Le retard ne fait que décaler dans le temps le mouvement de $M$ ;
      décaler une fonction périodique ne change jamais sa période. Tout
      point atteint par l'onde vibre avec exactement la période $T$ de la
      source, quelle que soit sa distance à celle-ci.
    solution: |
      On a établi $y_M(t+T) = y_M(t)$ pour tout point $M$, en utilisant
      uniquement la périodicité de $S$ (et non une valeur particulière de
      $\tau$ ou de $c$). Le retard $\tau = d/c$ décale seulement l'instant
      où le cycle de $M$ commence à être observé — il ne modifie ni la durée
      de ce cycle ($T$), ni la conclusion, quelle que soit la distance $d$
      ou le milieu traversé.

  - id: OMPP-12
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [periodicite_temporelle, periodicite_spatiale, calcul]
    stem: >
      Une onde progressive périodique sinusoïdale se propage le long d'une
      corde à la célérité $c = 12\ \text{m/s}$. La période de la source est
      $T = 0{,}4\ \text{s}$. Quelle est la longueur d'onde $\lambda$ de cette
      onde ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\lambda = cT = 12 \times 0{,}4 = 4{,}8\ \text{m}$
        correct: true
      - id: B
        text: >-
          $\lambda = c/T = 12/0{,}4 = 30\ \text{m}$
        correct: false
        misconception: OND-CALC-1
        feedback: >
          Ce calcul divise $c$ par $T$ au lieu de les multiplier : la
          relation correcte, dérivée au chapitre 3, est $\lambda = cT$ (un produit),
          pas un quotient. De plus, $c/T$ n'a pas la dimension d'une
          longueur.
      - id: C
        text: >-
          $\lambda = T/c = 0{,}4/12 \approx 0{,}033\ \text{m}$
        correct: false
        misconception: OND-CALC-1
        feedback: >
          Ce calcul inverse le rôle de $c$ et $T$ dans la relation
          $\lambda = cT$ : c'est un produit des deux grandeurs, pas un
          quotient de l'une par l'autre — et $T/c$ n'a d'ailleurs pas la
          dimension d'une longueur.
      - id: D
        text: >-
          $\lambda = c + T = 12{,}4\ \text{m}$
        correct: false
        misconception: OND-CALC-1
        feedback: >
          On ne peut jamais additionner une célérité (en m/s) et une durée
          (en s) : ce ne sont pas des grandeurs de même nature. La longueur
          d'onde se calcule par le PRODUIT $\lambda = cT$, jamais par une
          somme.
    correct_feedback: >
      La longueur d'onde se dérive du fait que l'onde avance d'une distance
      $\lambda$ pendant chaque période $T$, à la célérité $c$ :
      $\lambda = cT = 12 \times 0{,}4 = 4{,}8\ \text{m}$.
    solution: |
      $$\lambda = cT = 12 \times 0{,}4 = 4{,}8\ \text{m}$$
      On peut vérifier avec l'écriture équivalente : $f = 1/T =
      2{,}5\ \text{Hz}$, donc $\lambda = c/f = 12/2{,}5 = 4{,}8\ \text{m}$ —
      les deux calculs coïncident.

  - id: OMPP-13
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [dephasage, concordance_opposition, periodicite_spatiale]
    stem: >
      Deux points $M_1$ et $M_2$ d'une corde sont séparés d'une distance
      $d = 2\lambda$ (deux longueurs d'onde complètes). Quelle est leur
      relation de phase ?
    type: mcq
    choices:
      - id: A
        text: >-
          Concordance de phase : $d$ est un multiple entier de $\lambda$
          ($d = 2\lambda$), donc $\Delta\varphi = 4\pi\ \text{rad}$, un
          multiple entier de $2\pi$.
        correct: true
      - id: B
        text: >-
          Opposition de phase : $d$ est un multiple de $\lambda/2$, puisque
          $2\lambda = 4 \times (\lambda/2)$.
        correct: false
        misconception: OND-PH-2
        feedback: >
          L'opposition de phase exige un multiple IMPAIR de $\lambda/2$, pas
          n'importe quel multiple. Ici $2\lambda = 4 \times (\lambda/2)$, où
          $4$ est un multiple PAIR — ce qui équivaut exactement à
          $2\lambda$, donc à la concordance, pas à l'opposition.
      - id: C
        text: >-
          On ne peut pas savoir sans connaître les valeurs numériques de $d$
          et $\lambda$ ; une relation générale n'existe pas.
        correct: false
        misconception: OND-CALC-1
        feedback: >
          Le rapport $d/\lambda = 2$ suffit entièrement : la relation
          $\Delta\varphi = 2\pi d/\lambda$ ne dépend que de ce rapport, pas
          des valeurs numériques séparées de $d$ et de $\lambda$. Ici
          $d/\lambda$ est un entier, ce qui détermine la concordance sans
          calcul supplémentaire.
      - id: D
        text: >-
          Ni concordance ni opposition : $d = 2\lambda$ ne correspond à
          aucun des deux cas particuliers reconnus.
        correct: false
        misconception: OND-PH-2
        feedback: >
          La concordance de phase correspond à TOUT multiple entier de
          $\lambda$ ($d = k\lambda$, pour n'importe quel entier $k$), pas
          seulement à $d = \lambda$. Avec $k = 2$, $d = 2\lambda$ est bien un
          cas de concordance.
    correct_feedback: >
      $d = 2\lambda$ est un multiple entier de $\lambda$ ($k=2$), donc
      $\Delta\varphi = 2\pi \times 2 = 4\pi\ \text{rad}$, un multiple entier
      de $2\pi$ : $M_1$ et $M_2$ vibrent en concordance de phase.
    solution: |
      $$\Delta\varphi = \frac{2\pi d}{\lambda} = \frac{2\pi \times 2\lambda}{\lambda} = 4\pi\ \text{rad}$$
      $4\pi = 2 \times 2\pi$ : un multiple entier de $2\pi$, donc concordance
      de phase. Tout multiple entier de $\lambda$ ($\lambda$, $2\lambda$,
      $3\lambda$, ...) donne la concordance ; seuls les multiples IMPAIRS de
      $\lambda/2$ donnent l'opposition.

  - id: OMPP-14
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [longitudinale_transversale, milieu_de_propagation, son]
    stem: >
      Le son est une onde mécanique progressive périodique. Comment les
      particules d'air vibrent-elles par rapport à la direction de
      propagation du son ?
    type: mcq
    choices:
      - id: A
        text: >-
          Elles vibrent (compressions et dilatations) dans la MÊME direction
          que la propagation : le son est une onde longitudinale.
        correct: true
      - id: B
        text: >-
          Elles vibrent perpendiculairement à la direction de propagation,
          comme sur une corde : le son est une onde transversale.
        correct: false
        misconception: OND-NAT-1
        feedback: >
          C'est l'inverse : contrairement à l'onde sur une corde
          (transversale), le son se propage par des compressions et des
          dilatations de l'air DANS la même direction que la propagation —
          c'est précisément ce qui définit une onde longitudinale.
      - id: C
        text: >-
          Elles ne vibrent pas du tout : seule l'énergie se déplace, sans
          que l'air soit localement perturbé.
        correct: false
        misconception: OND-NAT-1
        feedback: >
          Une onde mécanique se propage justement PARCE QUE le milieu est
          perturbé localement, de proche en proche : pour le son, cette
          perturbation, ce sont les compressions et dilatations de l'air.
          Sans vibration locale des particules d'air, il n'y aurait aucune
          perturbation à relayer.
      - id: D
        text: >-
          Elles vibrent dans le vide, ce qui explique que le son puisse se
          propager dans l'espace.
        correct: false
        misconception: OND-NAT-1
        feedback: >
          Le son est une onde MÉCANIQUE : il a besoin d'un milieu matériel
          pour se propager (ici, l'air) et ne se propage jamais dans le
          vide — contrairement à la lumière. Il n'y a donc rien à faire
          vibrer dans le vide.
    correct_feedback: >
      Le son se propage par des compressions et dilatations successives de
      l'air, dans la MÊME direction que la propagation : c'est la définition
      même d'une onde longitudinale, à la différence d'une onde sur une
      corde qui est transversale.
    solution: |
      Comme toute onde mécanique, le son a besoin d'un milieu matériel (il
      ne se propage pas dans le vide) et perturbe ce milieu localement pour
      se propager de proche en proche. Cette perturbation prend la forme de
      compressions et de dilatations de l'air ALIGNÉES avec la direction de
      propagation : le son est donc une onde longitudinale, contrairement à
      l'onde sur une corde, transversale.

  - id: OMPP-15
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [frequence, hauteur, milieu_de_propagation, longitudinale_transversale]
    stem: >
      Deux notes de musique, l'une aiguë et l'autre grave, sont jouées dans
      la même salle (même air, même température). D'un point de vue
      physique, qu'est-ce qui les distingue nécessairement ?
