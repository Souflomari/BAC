    solution: |
      L'expérience de l'accroche est décisive : quand on resserre le rythme
      du vibreur sans toucher à la corde, les bosses sur la photo se
      rapprochent aussi, exactement au même rythme. Si les deux répétitions
      étaient indépendantes, cela n'aurait aucune raison de se produire. La
      relation qui formalise ce lien, dérivée au chapitre suivant, est
      $\lambda = cT$ : à célérité $c$ fixée par le milieu, resserrer $T$ (le
      rythme de la source) resserre $\lambda$ dans les mêmes proportions.

  - id: OMPP-8
    rung: "R0"
    difficulty_level: 2
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [periodicite_temporelle, periodicite_spatiale]
