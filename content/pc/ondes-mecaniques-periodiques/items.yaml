  # Ajouté le 2026-09-05 : OND-DP-2 (période et longueur d'onde confondues)
  # siégeait à 2 items du banc, donc sous le plancher de 3 — inévaluable par le
  # modèle apprenant. Surface volontairement différente de OMPP-2, qui fait
  # LIRE une distance sur une photographie : ici on critique un raisonnement
  # chiffré, où la confusion produit un nombre juste au mauvais endroit.
  - id: OMPP-25
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [periodicite_temporelle, periodicite_spatiale, relation_lambda_ct]
    stem: >
      Une onde progressive périodique se propage à
      $c = 2{,}0\ \text{m}\cdot\text{s}^{-1}$ le long d'une corde ; sa
      fréquence vaut $f = 5{,}0\ \text{Hz}$. Un élève écrit : « la période
      vaut $T = 0{,}20\ \text{s}$, donc la longueur d'onde vaut
      $\lambda = 0{,}20\ \text{m}$ ». Que penser de ce raisonnement ?
    type: mcq
    choices:
      - id: A
        text: >-
          La période est juste, la conclusion non : il faut multiplier par la
          célérité, $\lambda = cT = 2{,}0 \times 0{,}20 = 0{,}40\ \text{m}$
        correct: true
      - id: B
        text: >-
          Le raisonnement est correct : $T$ et $\lambda$ sont la même grandeur,
          mesurée en secondes d'un côté et en mètres de l'autre
        correct: false
        misconception: OND-DP-2
        feedback: >
          Une durée et une distance n'ont pas la même dimension : aucune
          convention d'unité ne transforme l'une en l'autre. $T$ est la période
          TEMPORELLE (ce que voit un point fixe du milieu), $\lambda$ la période
          SPATIALE (ce que montre une photographie instantanée) ; le pont entre
          les deux est la célérité, $\lambda = cT$.
      - id: C
        text: >-
          La période est juste, mais la longueur d'onde vaut
          $\lambda = c/T = 2{,}0/0{,}20 = 10\ \text{m}$
        correct: false
        misconception: OND-CALC-1
        feedback: >
          La relation est $\lambda = cT$, pas $c/T$. Le contrôle qui la
          retrouve sans l'apprendre : pendant une période, l'onde avance
          d'exactement une longueur d'onde, donc distance = célérité × durée.
          Divisez, et vous obtenez $10\ \text{m}$ pour une corde de laboratoire.
      - id: D
        text: >-
          On ne peut pas conclure : la période et la longueur d'onde varient
          indépendamment l'une de l'autre, il faudrait mesurer $\lambda$ sur une
          photographie
        correct: false
        misconception: OND-DP-1
        feedback: >
          Les deux périodicités ne sont pas indépendantes : c'est justement ce
          que dit $\lambda = cT$. Le milieu recopie fidèlement la source, et la
          célérité du milieu fixe le pas spatial de cette copie. Connaître $c$
          et $T$ suffit — la photographie servirait à vérifier, pas à conclure.
    correct_feedback: >
      $T = 1/f = 0{,}20\ \text{s}$ est bien la période. Mais la longueur d'onde
      est la distance parcourue par l'onde PENDANT une période :
      $\lambda = cT = 2{,}0 \times 0{,}20 = 0{,}40\ \text{m}$. Le nombre
      $0{,}20$ est juste — c'est la grandeur qui est fausse.
    solution: |
      $$T = \frac{1}{f} = \frac{1}{5{,}0} = 0{,}20\ \text{s}$$
      Pendant une période, l'onde avance d'exactement une longueur d'onde :
      $$\lambda = c\,T = 2{,}0 \times 0{,}20 = 0{,}40\ \text{m}$$
      Le contrôle d'homogénéité tranche à lui seul :
      $\text{m}\cdot\text{s}^{-1} \times \text{s} = \text{m}$. Écrire
      $\lambda = T$ reviendrait à égaler des secondes et des mètres ; écrire
      $\lambda = c/T$ donnerait des $\text{m}\cdot\text{s}^{-2}$.

