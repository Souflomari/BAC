    solution: |
      Une seule onde progressive périodique se propage sur la corde. Le film
      de Léa révèle sa répétition dans le temps ($T = 20\ \text{ms}$) ; la
      photo de Yanis révèle sa répétition dans l'espace
      ($\lambda = 15\ \text{cm}$). Ces deux grandeurs ne sont ni deux ondes
      séparées, ni de simples coïncidences numériques : elles sont liées par
      la célérité de la corde, $\lambda = cT$, une relation dérivée au chapitre
      suivant.

  - id: OMPP-9
    rung: "R0"
    difficulty_level: 2
    skill_code: pc_ondes_mecaniques_periodiques
    tags: [periodicite_temporelle, periodicite_spatiale, onde_sinusoidale]
