    intro: |-
      **Propagation d'une onde mécanique à la surface de l'eau (examen national, session normale 2019, Exercice II — Partie 1).**

      Pour étudier la propagation des ondes mécaniques à la surface de l'eau, on utilise une cuve à ondes. À l'aide d'un vibreur d'une cuve à ondes, on crée en un point $S$ de la surface libre de l'eau une onde progressive sinusoïdale de fréquence $N = 20\ \text{Hz}$. Cette onde se propage à $t = 0$ à partir du point $S$, sans amortissement et sans réflexion.

      La figure ci-contre représente une coupe, dans un plan vertical, d'une partie de la surface de l'eau à l'instant de date $t_1$ : un profil sinusoïdal partant du point $S$ (à gauche) et s'étendant jusqu'au point $M$ (à droite), où la surface redevient plane — $M$ est le front de l'onde à l'instant $t_1$. Une double flèche horizontale, cotée $1{,}5\ \text{cm}$, est tracée au-dessus de deux crêtes voisines du profil. Entre $S$ et $M$, le profil présente environ deux arches complètes du motif sinusoïdal.
    questions:
      - id: q1
        part: "Caractériser l'onde à la surface de l'eau"
        stem: |-
          **(0,5 pt)** L'onde qui se propage à la surface de l'eau est-elle transversale ou longitudinale ? Justifier.
        reasoning: |-
          Le critère est toujours le même : comparer la direction dans laquelle le milieu est perturbé à la direction dans laquelle l'onde avance. *(Cette définition générale de « onde transversale » vient du chapitre précédent, ondes-mecaniques-progressives — elle se déduit ici par contraste avec le rung R4 de cette leçon, qui définit l'onde longitudinale comme celle où la perturbation est parallèle à la propagation ; voir la SCOPE NOTE en tête de ce fichier.)* À la surface de l'eau, chaque point du milieu monte et descend verticalement — la surface se creuse et se bombe — tandis que l'onde progresse horizontalement de $S$ vers $M$. La perturbation est perpendiculaire à la direction de propagation : l'onde est transversale.
      - id: q2
        stem: |-
          **(0,25 pt)** Déterminer la longueur d'onde $\lambda$ de l'onde étudiée.
        reasoning: |-
          D'après R2, $\lambda$ est la plus petite distance séparant deux points qui vibrent exactement de la même façon à chaque instant — sur une coupe figée dans le temps, c'est l'écart entre deux crêtes voisines. C'est précisément ce que mesure la double flèche cotée $1{,}5\ \text{cm}$, tracée au-dessus de deux crêtes voisines du profil : on lit $\lambda$ directement, sans calcul.

          $$\lambda = 1{,}5\ \text{cm} = 1{,}5\times10^{-2}\ \text{m}$$
      - id: q3
        stem: |-
          **(0,5 pt)** Déduire la célérité $V$ de l'onde à la surface de l'eau.
        reasoning: |-
          La relation dérivée en R2, $\lambda = cT = c/f$, relie exactement les deux grandeurs dont on dispose ici : $\lambda$ vient d'être lue (question 2), et la fréquence $N$ est une donnée de l'énoncé. Il suffit d'isoler la célérité.
        steps:
          - math: 'V = \lambda \, N'
            note: "On isole V dans la relation lambda = V/N = VT (rung R2), avec N donnee par l'enonce."
          - math: 'V = 1{,}5\times10^{-2} \times 20'
            note: "Application numerique : lambda = 1,5 cm = 1,5e-2 m, N = 20 Hz."
          - math: '\boxed{V = 0{,}30\ \text{m.s}^{-1}}'
            note: "Celerite de l'onde a la surface de l'eau."
      - id: q4
        stem: |-
          **(0,5 pt)** Le point $M$, situé à la distance $d = SM$ du point $S$, est le front de l'onde à l'instant de date $t_1$. Exprimer le retard temporel $\tau$ du mouvement de $M$ par rapport au mouvement de $S$, en fonction de la période $T$ de l'onde. Calculer $\tau$.
        reasoning: |-
          Le mécanisme du retard (R1) donne $\tau = d/c$, avec ici $d = SM$. Pour l'exprimer en fonction de $T$ plutôt qu'en secondes brutes, on compte combien de longueurs d'onde tient la distance $SM$ : la figure montre environ deux arches complètes entre $S$ et $M$, donc $SM = 2\lambda$. Or R2 établit que l'onde avance exactement d'une longueur d'onde $\lambda$ pendant une période $T$ — parcourir $2\lambda$ prend donc $2T$. On retrouve ce résultat par le calcul en remplaçant $c = \lambda/T$ dans $\tau = d/c$ : $\lambda$ se simplifie et il ne reste que le compte de périodes.
        steps:
          - math: '\tau = \frac{d}{V} = \frac{SM}{\lambda/T} = \frac{SM}{\lambda}\,T'
            note: "On remplace V = lambda/T (de lambda = VT, rung R2) : le retard vaut le nombre de longueurs d'onde SM/lambda multiplie par T."
          - math: 'SM = 2\lambda \implies \tau = \frac{2\lambda}{\lambda}\,T = 2\,T'
            note: "Lecture de la figure : SM vaut environ deux arches completes, soit 2 lambda. La longueur d'onde se simplifie."
          - math: 'T = \frac{1}{N} = \frac{1}{20} = 0{,}05\ \text{s}'
            note: "T est l'inverse de la frequence N donnee par l'enonce."
          - math: '\boxed{\tau = 2\,T = 0{,}10\ \text{s}}'
            note: "Retard du point M par rapport a S."

