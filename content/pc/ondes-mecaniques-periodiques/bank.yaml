        de ce fichier) ; le raisonnement ci-dessous est rédigé de nouveau
        (voix maison), pas copié de exercises.yaml. Description de figure
        reprise de la version réglée dans exercises.yaml (double flèche
        cotée 1,5 cm entre deux crêtes voisines ; SM ≈ deux arches
        complètes = 2λ), pas de la variante hédgée « la correspondance
        exacte flèche ↔ longueur d'onde est à confirmer sur le scan » du
