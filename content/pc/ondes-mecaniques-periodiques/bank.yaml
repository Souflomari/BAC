  # ── bk-2019-n-x2 — 2019 N, Exercice II (partie 1) : cuve à ondes ──────────
  # Même sujet que le sommet de leçon r-bac (exercises.yaml). Voir la note
  # éditoriale en tête de fichier pour le recoupement assumé.
  - id: bk-2019-n-x2
    title: "Propagation d'une onde mécanique à la surface de l'eau"
    source:
      year: 2019
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice II (partie 1) — Propagation d'une onde mécanique"
    bareme_total: 1.75
    duration_min: 11
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/68300 (Exercice II, Partie 1 —
        propagation d'une onde mécanique à la surface de l'eau dans une cuve
        à ondes ; barème de la partie = 1,75 pt sur les 3,5 pt de l'exercice
        complet, dont la Partie 2 — décroissance radioactive du radon 222 —
        est transcrite sous decroissance-radioactive.md ; l'énoncé précise
