      On crée, à l'instant $t = 0$, en un point $S$ de la surface de l'eau, une onde mécanique progressive sinusoïdale de fréquence $N = 50\ \text{Hz}$. La figure ci-dessous représente une coupe verticale de la surface de l'eau à un instant $t$. La règle graduée sur le schéma indique l'échelle utilisée.

      **Figure B (coupe verticale, bitmap re-mesuré sur un rendu de page 1200 dpi, jamais sur le PNG extrait — retourné verticalement).** Bandeau horizontal encadré : un rectangle gris uni représente l'eau, sa frontière supérieure est le profil de la surface. Sur la gauche et sur la droite la surface est plate (ligne d'eau horizontale) ; au centre, un train d'ondes. Une règle graduée horizontale est posée juste sous la ligne d'eau ; à son extrémité droite, une double flèche horizontale entre deux graduations longues, légendée « **1 cm** ». La source $S$ est repérée au centre du bandeau, sur un profil symétrique par rapport à elle. Mesure : deux crêtes voisines espacées de $4{,}0\ \text{cm}$ ($\lambda$) ; la zone perturbée s'étend sur environ $6{,}0\ \text{cm}$ de part et d'autre de $S$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** La longueur d'onde est :

          | ■ $\lambda = 0{,}2\,\text{cm}$ | ■ $\lambda = 4\,\text{cm}$ | ■ $\lambda = 5\,\text{cm}$ | ■ $\lambda = 6\,\text{cm}$ |
          |---|---|---|---|
        reasoning: |-
          Comme au chapitre 3, $\lambda$ est la plus petite distance séparant deux points qui vibrent exactement de la même façon — sur une coupe figée, l'écart entre deux crêtes voisines. La règle graduée donne l'échelle ($1\ \text{cm}$ étalonné), et deux crêtes voisines du profil sont séparées de $4{,}0\ \text{cm}$.

          $$\boxed{\lambda = 4\ \text{cm}}$$

          **Pourquoi les trois autres échouent.** $0{,}2\ \text{cm}$ confondrait $\lambda$ avec une fraction de graduation, bien en-deçà de la résolution de la règle imprimée. $5\ \text{cm}$ et $6\ \text{cm}$ surestiment l'écart, comme si on avait mesuré entre une crête et le second creux suivant plutôt qu'entre deux crêtes immédiatement voisines — c'est précisément l'erreur que la règle graduée, posée sous la ligne d'eau, sert à éviter en donnant une échelle de référence directement sur la figure.
      - id: q2
        stem: |-
          **(0,5 pt)** La vitesse de propagation de l'onde à la surface de l'eau est :

          | ■ $v = 2\,\text{m.s}^{-1}$ | ■ $v = 200\,\text{m.s}^{-1}$ | ■ $v = 3\,\text{m.s}^{-1}$ | ■ $v = 8\times10^{-4}\,\text{m.s}^{-1}$ |
          |---|---|---|---|
        reasoning: |-
          La relation de la double périodicité (chapitre 3), $\lambda = v/N$, relie la longueur d'onde qui vient d'être lue à la fréquence $N = 50\ \text{Hz}$ donnée par l'énoncé. On isole $v$.

          $$v = \lambda\,N = 4\times10^{-2}\times50$$

          $$\boxed{v = 2\ \text{m.s}^{-1}}$$

          **Pourquoi les trois autres échouent.** $200\ \text{m.s}^{-1}$ vient d'un oubli de conversion de $\lambda$ en mètres (garder $4$ au lieu de $0{,}04$). $3\ \text{m.s}^{-1}$ ne se retrouve par aucun des deux chiffres de l'énoncé combinés simplement. $8\times10^{-4}\ \text{m.s}^{-1}$ est l'inverse du produit ($\lambda/N$ au lieu de $\lambda\,N$) — une célérité d'un fraction de millimètre par seconde n'aurait d'ailleurs aucun sens pour une ride à la surface de l'eau.
        steps:
          - math: 'v = \lambda\,N = (4\times10^{-2})\times50'
            note: "Chapitre 3 : lambda = v/N, isole pour v ; lambda convertie en metres."
          - math: '\boxed{v = 2\ \text{m.s}^{-1}}'
            note: "Celerite de propagation."
      - id: q3
        stem: |-
          **(0,75 pt)** L'instant $t$, où la coupe de la surface de l'eau est représentée, a pour valeur :

          | ■ $t = 8\,\text{s}$ | ■ $t = 0{,}03\,\text{s}$ | ■ $t = 0{,}3\,\text{s}$ | ■ $t = 3\,\text{s}$ |
          |---|---|---|---|
        reasoning: |-
          L'onde a été créée en $S$ à $t=0$ ; l'instant $t$ de la coupe est donc la durée qu'il a fallu à la perturbation pour atteindre le bord du domaine déjà agité, mesuré sur la figure de part et d'autre de $S$ : $d \approx 6{,}0\ \text{cm}$. Le mécanisme du retard (chapitre 2) donne directement $t = d/v$, avec $v = 2\ \text{m.s}^{-1}$ (question 2).

          $$t = \frac{d}{v} = \frac{6{,}0\times10^{-2}}{2}$$

          $$\boxed{t = 0{,}03\ \text{s}}$$

          **Pourquoi les trois autres échouent.** $0{,}3\ \text{s}$ et $3\ \text{s}$ viennent d'un facteur $10$ ou $100$ manqué dans la conversion des centimètres. $8\ \text{s}$ ne correspond à aucune combinaison simple des grandeurs de la figure ; à cette vitesse de $2\ \text{m.s}^{-1}$, l'onde aurait parcouru $16\ \text{m}$ en $8\ \text{s}$, bien au-delà de la petite cuve représentée.
        steps:
          - math: 't = \frac{d}{v}'
            note: "Chapitre 2 : le retard (ici, le temps ecoule depuis la creation en S) vaut la distance parcourue divisee par la celerite."
          - math: 't = \frac{6{,}0\times10^{-2}}{2}'
            note: "d ~ 6,0 cm mesure sur la figure (etendue perturbee de part et d'autre de S), v = 2 m/s (question 2)."
          - math: '\boxed{t = 0{,}03\ \text{s}}'
            note: "Instant de la coupe."
      - id: q4
        stem: |-
          **(0,75 pt)** On considère un point M de la surface de l'eau, éloigné de la source S d'une distance SM=6cm. Le point M reprend le même mouvement que celui de S avec un retard temporel $\tau$. La relation entre l'élongation du point M et celle de la source S s'écrit :

          | ■ $y_M(t) = y_S(t - 0{,}3)$ | ■ $y_M(t) = y_S(t + 0{,}03)$ |
          |---|---|
          | ■ $y_M(t) = y_S(t - 0{,}03)$ | ■ $y_M(t) = y_S(t + 0{,}3)$ |
        reasoning: |-
          Comme au chapitre 2, un point du milieu rejoue le mouvement de la source avec un retard $\tau = SM/v$ — jamais en avance, puisque l'information ne peut se propager que depuis $S$ vers $M$, jamais l'inverse. Avec $SM = 6\ \text{cm}$ (donnée) et $v = 2\ \text{m.s}^{-1}$ (question 2) :

          $$\tau = \frac{SM}{v} = \frac{6\times10^{-2}}{2}$$

          $$\tau = 0{,}03\ \text{s}$$

          $$\boxed{y_M(t) = y_S(t-0{,}03)}$$

          **Pourquoi les trois autres échouent.** Les deux propositions en $t+\tau$ inverseraient le sens de causalité : elles feraient de $M$ un point qui ANTICIPE le mouvement de $S$, ce qu'aucune onde progressive ne permet (chapitre 2). $y_S(t-0{,}3)$ reprend le bon signe mais une valeur dix fois trop grande de $\tau$ — le même facteur $10$ qui piège la question 3.
        steps:
          - math: '\tau = \frac{SM}{v} = \frac{6\times10^{-2}}{2} = 0{,}03\ \text{s}'
            note: "Chapitre 2 : retard = distance / celerite, avec SM = 6 cm (donnee) et v = 2 m/s (question 2)."
          - math: '\boxed{y_M(t) = y_S(t-0{,}03)}'
            note: "Retard, jamais avance : le signe moins vient du sens de propagation S vers M."
