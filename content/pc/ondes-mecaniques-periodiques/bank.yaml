        Transcription vérifiée à l'issue de QUATRE passes indépendantes
        (docs/sujets/pc/ondes-mecaniques-periodiques.md, statut « vérifié »,
        2026-08-06) : passe 1, transcription initiale depuis le scan ; passe
        2, diff caractère par caractère par un second agent — une correction
