        un troisième agent — ÉCART DE FIGURE identifié et corrigé : la cote
        « 1cm » imprimée ne couvre pas un seul intervalle entre crêtes mais
        DEUX — elle relie la crête 2 et la crête 4 (pas les deux cercles les
        plus extérieurs), et la crête 3 passe entre les deux traits
        pointillés qui portent la cote — donc 1 cm = 2λ, pas λ ; passe 4,
        mesure refaite de zéro par un quatrième agent, sans reprendre aucun
        chiffre des passes précédentes (centre de S localisé au pixel,
        balayages radiaux horizontal et vertical, rayons des 4 crêtes dans
        le rapport 1:2:3:4, pas radial constant ≈ 29,7 px, écart entre les
        deux traits = 2,05 × le pas radial) — figure jugée CONFORME, entrée
        PROMUE. La banque enseigne donc λ = 0,5 cm = 5×10⁻³ m (et non 1 cm),
        N = v/λ = 50 Hz (et non 25 Hz), et τ = d/v = 0,2 s = 10T (et non 5T,
        d = 5 cm = 10λ). Re-dérivé ci-dessous, question par question.
    intro: |-
      **Propagation des ondes (examen national, session normale 2020, Exercice II — 3 points).**

      Exercice en deux parties : Partie I, un QCM de 5 questions à 0,25 pt chacune (« Recopier le numéro de la question et écrire, parmi les affirmations proposées, la lettre qui correspond à la réponse juste ») ; Partie II, trois questions numériques sur une cuve à ondes, dont les données suivent.

      **Données pour la Partie II.** La pointe $S$ d'un vibreur crée une onde progressive sinusoïdale de fréquence $N$ à la surface libre de l'eau d'une cuve à ondes. L'onde, ainsi créée, se propage sans amortissement ni réflexion avec une célérité $v = 0{,}25\ \text{m.s}^{-1}$.

      *Figure (aspect de la surface de l'eau à l'instant $t_1$, valable pour la Partie II) :* quatre cercles concentriques, régulièrement espacés, centrés sur un point marqué $S$ (point noir au centre, étiquette « S » juste au-dessus). Les cercles représentent les crêtes de l'onde circulaire issue de $S$ ; en les numérotant de 1 (la plus intérieure) à 4 (la plus extérieure), leurs rayons sont dans le rapport $1:2:3:4$ — le pas radial est constant. Deux traits verticaux en pointillés descendent, l'un du point le plus à droite de la crête 2, l'autre du point le plus à droite de la crête 4 (la plus extérieure) ; la crête 3 passe entre ces deux traits. Une double flèche horizontale cotée « 1 cm » joint les deux traits, en bas de la figure : la cote imprimée couvre donc deux intervalles entre crêtes consécutives, pas un seul.
    questions:
      - id: q1
        part: "I - Recopier le numéro de la question et écrire, parmi les affirmations proposées, la lettre qui correspond à la réponse juste (QCM)"
        stem: |-
          **(0,25 pt)** Lors de la propagation d'une onde :

          | | | | |
          |---|---|---|---|
          | A | il y a transport de la matière et il n'y a pas transport de l'énergie | C | il n'y a ni transport de la matière ni transport de l'énergie |
          | B | il y a transport de l'énergie et il n'y a pas transport de la matière | D | il y a transport de la matière et de l'énergie |
        reasoning: |-
          R1 pose la définition même de l'onde progressive : « une perturbation qui se propage de proche en proche dans un milieu de propagation, sans transport de matière, avec transport d'énergie ». C'est exactement l'option B. Les points du milieu oscillent sur place — ils ne sont jamais emportés par l'onde — mais l'énergie, elle, avance avec la perturbation.

          **Réponse : B.**
      - id: q2
        stem: |-
          **(0,25 pt)** Une onde est dite transversale si :

          | | | | |
          |---|---|---|---|
          | A | la perturbation se fait dans la même direction que celle de la propagation | C | la perturbation se fait perpendiculairement à la direction de la propagation |
          | B | elle se propage dans le vide | D | la propagation se fait sans amortissement |
        reasoning: |-
          Le critère général — perturbation perpendiculaire ou parallèle à la propagation — n'est pas formellement énoncé dans les rungs R0–R7 de cette leçon (seule l'onde longitudinale y est définie, au rung R4, à propos du son) ; il vient du chapitre précédent, ondes-mecaniques-progressives, et se déduit ici par contraste avec R4 (perturbation parallèle ⟹ longitudinale, donc perpendiculaire ⟹ transversale — voir la SCOPE NOTE en tête de ce fichier). L'option A décrit au contraire une onde longitudinale, B et D ne sont pas des critères de transversalité (une onde transversale peut très bien s'amortir, et le vide n'a rien à voir avec la direction de la perturbation). C'est l'option C.

          **Réponse : C.**
      - id: q3
        stem: |-
          **(0,25 pt)** Le son est une onde :

          | | | | |
          |---|---|---|---|
          | A | électromagnétique | C | mécanique longitudinale |
          | B | mécanique transversale | D | qui se propage dans le vide |
        reasoning: |-
          R4 le dit explicitement : le son est une onde mécanique (elle a besoin d'un milieu matériel, contrairement à une onde électromagnétique — donc pas A, pas D) et longitudinale (elle se propage par compressions et dilatations successives de l'air, dans la même direction que sa propagation — donc pas B). C'est l'option C.

          **Réponse : C.**
      - id: q4
        stem: |-
          **(0,25 pt)** Lors de la diffraction d'une onde :

          | | | | |
          |---|---|---|---|
          | A | il y a modification de la fréquence | C | il y a modification de la célérité |
          | B | il y a modification de la longueur d'onde | D | la fréquence, la longueur d'onde et la célérité ne sont pas modifiées |
        reasoning: |-
          R5 est explicite sur ce point précis : « L'onde diffractée garde exactement la même fréquence $f$, la même célérité $c$, et — puisque $\lambda = c/f$ — la même longueur d'onde $\lambda$ [...] La diffraction ne change qu'une chose : la géométrie de la propagation ». C'est l'option D — les options A, B et C décrivent chacune un changement que R5 exclut explicitement. Rétrécir l'ouverture change la façon dont l'onde se répand dans l'espace, jamais son rythme ($f$) ni son pas spatial ($\lambda$, $c$), parce que ni la source ni le milieu ne changent au passage de l'ouverture.

          **Réponse : D.**
      - id: q5
        stem: |-
          **(0,25 pt)** On considère un point M de la surface de l'eau où se propage une onde progressive. Ce point M reprend le même mouvement que celui de la source S avec un retard temporel $\tau$. La relation entre l'élongation du point M et celle de la source est :

          | | | | |
          |---|---|---|---|
          | A | $y_M(t) = y_s(t+\tau)$ | C | $y_M(t) = y_s(t+2\tau)$ |
          | B | $y_M(t) = y_s(t-2\tau)$ | D | $y_M(t) = y_s(t-\tau)$ |
        reasoning: |-
          C'est exactement la relation établie au rung R1 : le point $M$ rejoue le mouvement de la source avec un retard $\tau$, donc $y_M(t) = y_s(t - \tau)$ — l'élongation de $M$ à l'instant $t$ est celle que $S$ avait $\tau$ secondes plus tôt, pas plus tard (le retard soustrait du temps, il ne l'avance pas : A et C sont donc exclues), et une seule fois $\tau$, pas deux (B est donc exclue aussi). C'est l'option D.

          **Réponse : D.**
      - id: q6
        part: "II - Cuve à ondes : exploitation de la figure"
        stem: |-
          **(0,5 pt)** En exploitant la figure ci-contre, déterminer la longueur d'onde $\lambda$.
        reasoning: |-
          D'après R2, $\lambda$ est la plus petite distance séparant deux points voisins qui vibrent exactement de la même façon — ici, l'écart entre deux crêtes consécutives. La figure ne permet pas de lire cet écart directement sur la cote imprimée : les deux traits pointillés qui portent la cote « 1 cm » ne tombent pas de deux crêtes voisines, mais de la crête 2 et de la crête 4, avec la crête 3 qui passe entre les deux. La cote couvre donc deux intervalles crête-à-crête consécutifs, soit $2\lambda$, et non $\lambda$.
        steps:
          - math: '1\ \text{cm} = 2\lambda'
            note: "Les deux traits pointilles tombent des cretes 2 et 4, pas de deux cretes voisines : la crete 3 passe entre les deux, donc la cote imprimee couvre deux intervalles crete-a-crete consecutifs, soit 2 lambda (rung R2 : lambda est l'ecart entre deux points voisins qui vibrent a l'identique)."
          - math: '\boxed{\lambda = \frac{1}{2} = 0{,}5\ \text{cm} = 5\times10^{-3}\ \text{m}}'
            note: "On divise par 2, pas une lecture directe de la cote imprimee."
      - id: q7
        stem: |-
          **(0,5 pt)** Trouver la fréquence N de l'onde.
        reasoning: |-
          La relation de R2, $\lambda = c/f$ (ici $\lambda = v/N$), relie la célérité — donnée par l'énoncé — à la fréquence, à trouver. On isole $N$.
        steps:
          - math: 'N = \frac{v}{\lambda}'
            note: "On isole N dans lambda = v/N (rung R2), avec v donnee par l'enonce et lambda de la question precedente."
          - math: 'N = \frac{0{,}25}{5\times10^{-3}}'
            note: "Application numerique : v = 0,25 m/s, lambda = 5e-3 m (soit 0,5 cm)."
          - math: '\boxed{N = 50\ \text{Hz}}'
            note: "Frequence de l'onde."
      - id: q8
        stem: |-
          **(0,75 pt)** On considère un point M de la surface de l'eau situé à une distance $d = 5\ \text{cm}$ de la source S. Calculer le retard temporel $\tau$ du mouvement de M par rapport à celui de la source S.
        reasoning: |-
          Le mécanisme du retard (R1) donne directement $\tau = d/v$, avec $d = 5\ \text{cm}$ la distance de $M$ à $S$ et $v$ la célérité donnée. On vérifie la cohérence en comptant, comme au rung R2, combien de périodes ce retard représente : $d = 5\ \text{cm}$ et $\lambda = 0{,}5\ \text{cm}$ (question précédente), donc $d = 10\lambda$ — l'onde met $10$ périodes $T$ à parcourir cette distance, donc $\tau = 10T$. Les deux calculs, direct et par comptage de périodes, doivent coïncider.
        steps:
          - math: '\tau = \frac{d}{v}'
            note: "Mecanisme du retard (rung R1) : M rejoue S avec un retard egal a la distance divisee par la celerite."
          - math: 'd = 5\ \text{cm} = 5\times10^{-2}\ \text{m}'
            note: "Conversion de la distance en metres, coherente avec v en m/s."
          - math: '\tau = \frac{5\times10^{-2}}{0{,}25}'
            note: "Application numerique."
          - math: '\boxed{\tau = 0{,}2\ \text{s}}'
            note: "Retard du point M par rapport a S."
          - math: 'T = \frac{1}{N} = \frac{1}{50} = 0{,}02\ \text{s} \implies \tau = 10\,T'
            note: "Verification en nombre de periodes (rung R2) : d = 5 cm = 10 lambda (lambda = 0,5 cm), donc tau = 10 T. Coherent avec le calcul direct."
