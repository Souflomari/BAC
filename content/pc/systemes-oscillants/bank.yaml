    intro: |-
      **Étude énergétique d'un oscillateur mécanique (solide-ressort) (examen national, session normale 2018, Exercice IV — Partie II).**

      On modélise une partie d'une machine mécanique par un oscillateur horizontal, constitué d'un solide $(S)$, de centre d'inertie $G$ et de masse $m$ fixé à l'extrémité d'un ressort horizontal à spires non jointives de masse négligeable et de raideur $K = 35\ \text{N.m}^{-1}$.

      L'autre extrémité est attachée à un support immobile.

      On écarte le solide $(S)$ de sa position d'équilibre d'une distance $X_m$ puis on le lâche sans vitesse initiale. Le solide $(S)$ oscille sans frottements sur un plan horizontal.

      On étudie le mouvement du centre d'inertie $G$ dans un repère $(O, \vec{i})$ lié à un référentiel terrestre considéré comme galiléen.

      La position de $G$, lorsque le solide $(S)$ est à l'équilibre, coïncide avec l'origine $O$ de l'axe $(O, \vec{i})$.

      On repère la position de $G$ à un instant $t$ par l'abscisse $x$ dans le repère $(O, \vec{i})$ (figure 3).

      On choisit la position de $G$ à l'état d'équilibre ($x = 0$) comme référence de l'énergie potentielle élastique.

      L'équation horaire du mouvement de $G$ s'écrit sous la forme : $x(t) = X_m \cos\left(\dfrac{2\pi t}{T_0} + \varphi\right)$.

      La courbe de la figure 4 représente les variations de l'abscisse $x$ en fonction du temps.

      **Figure 3 (schéma) :** ressort horizontal fixé par une extrémité à un support mural, l'autre extrémité attachée au solide $(S)$ (centre d'inertie $G$) posé sur un plan horizontal ; axe $(O, \vec{i})$ horizontal orienté vers la droite, origine $O$ à la position d'équilibre, abscisse $x$.

      **Figure 4 (courbe) :** $x\ (\text{cm})$ en fonction de $t\ (\text{s})$ ; sinusoïde d'amplitude $X_m = 6\ \text{cm}$ ; ordonnées graduées $-6,\ -3,\ 3,\ 6$ ; abscisses repérées aux valeurs $0{,}5$ et $1$. La courbe part de son minimum à $t=0$ (soit $x(0)=-6\ \text{cm}$), remonte jusqu'à son maximum $+6\ \text{cm}$ à $t=0{,}5\ \text{s}$, puis revient à son minimum $-6\ \text{cm}$ à $t=1\ \text{s}$.
    questions:
      - id: q1
        part: "Partie II — Lire le graphe $x(t)$ et déterminer les caractéristiques du mouvement"
        stem: |-
          **(0,75 pt)** Déterminer les valeurs de $X_m$, $T_0$ et $\varphi$.
        reasoning: |-
          Comme au rung R2 (« Déterminer $X_m$ et $\varphi$ à partir des conditions initiales »), on lit d'abord $X_m$ et $T_0$ directement sur le graphe : $X_m$ est l'écart maximal atteint (l'amplitude), $T_0$ la durée d'un cycle complet — ici entre deux minima consécutifs ($t=0$ et $t=1\ \text{s}$), cohérente avec un passage par le maximum exactement à mi-chemin ($t=0{,}5\ \text{s}=T_0/2$). Pour $\varphi$, on utilise les conditions initiales lues sur la courbe : $x(0)=-X_m$ et $v(0)=0$ (la courbe part d'un extremum, tangente horizontale) — c'est le « Premier lancer » du rung R2, mais avec un départ côté négatif plutôt que positif, donc $\cos\varphi=-1$ plutôt que $\cos\varphi=+1$.
        steps:
          - math: 'X_m = 6{,}0\ \text{cm} = 6{,}0\times10^{-2}\ \text{m} \qquad T_0 = 1\ \text{s}'
            note: "Lecture directe sur la figure 4 : Xm est l'ecart maximal (rung R2), T0 la duree entre deux minima consecutifs (t=0 et t=1s)."
          - math: 'x(0) = X_m\cos\varphi = -X_m \implies \cos\varphi = -1 \implies \varphi = \pi\ \text{rad}'
            note: "Depart au minimum (rung R2, meme geste que le Premier lancer mais cote negatif) : x(0) = -Xm."
          - math: 'v(0) = -X_m\,\omega_0\sin\varphi = -X_m\,\omega_0\sin\pi = 0'
            note: "Controle : la vitesse initiale est bien nulle (sin pi = 0), conforme au lacher sans vitesse."
      - id: q2
        stem: |-
          **(0,5 pt)** Trouver la valeur de l'énergie potentielle élastique $E_{pe1}$ du système mécanique à la date $t_1 = 0{,}5\ \text{s}$.
        reasoning: |-
          Le rung R5 donne l'expression de l'énergie potentielle élastique comme un résultat, $E_{pe}=\frac12Kx^2$ — pas encore démontrée à ce stade du cours (la démonstration est au chapitre Aspects énergétiques), mais utilisable directement ici. Il faut d'abord la position $x(t_1)$, obtenue en réinjectant $t_1$ dans l'équation horaire trouvée à la question précédente.
        steps:
          - math: 'x(t_1) = X_m\cos\left(\frac{2\pi}{T_0}t_1+\varphi\right) = 6{,}0\times10^{-2}\cos\left(2\pi\times0{,}5+\pi\right)'
            note: "On reinjecte t1 = 0,5 s dans l'equation horaire (question 1) : T0 = 1 s, phi = pi."
          - math: 'x(t_1) = 6{,}0\times10^{-2}\cos(2\pi) = 6{,}0\times10^{-2}\ \text{m}'
            note: "cos(2 pi) = 1 : a t1 = 0,5 s = T0/2, le solide est revenu a l'extremum oppose, ici +Xm."
          - math: 'E_{pe1} = \frac{1}{2}K\,x(t_1)^2 = \frac{1}{2}\times35\times(6{,}0\times10^{-2})^2'
            note: "Formule du rung R5, Epe = (1/2) K x^2, appliquee a x(t1)."
          - math: '\boxed{E_{pe1} \approx 6{,}3\times10^{-2}\ \text{J}}'
            note: "Application numerique."
      - id: q3
        stem: |-
          **(0,75 pt)** Calculer le travail $W_{AB}(\vec{F})$ de la force de rappel, lorsque le centre d'inertie $G$ se déplace de la position A d'abscisse $x_A = X_m$ à la position B d'abscisse $x_B = -X_m$.
        reasoning: |-
          Rung R5 : A et B sont tous les deux à l'écart maximal, donc tous les deux des points où le solide s'arrête un instant — $\dot x=0$ en A comme en B, exactement le second cas décrit au rung R5 (« Quand $x=\pm X_m$ ... $\dot x=0$ ... toute l'énergie est dans le ressort »). Le lien entre le travail d'une force conservative et la variation de son énergie potentielle associée, $W_{AB}(\vec F)=E_{pe}(A)-E_{pe}(B)$, appartient au chapitre Aspects énergétiques (signalé par R5 lui-même) — on l'emprunte ici pour conclure. Comme $|x_A|=|x_B|=X_m$, les deux énergies potentielles élastiques sont égales, donc leur différence est nulle.
        steps:
          - math: 'E_{pe}(A) = \frac12 K x_A^2 = \frac12 K X_m^2 \qquad E_{pe}(B) = \frac12 K x_B^2 = \frac12 K X_m^2'
            note: "A et B sont les deux extrema, |xA| = |xB| = Xm (rung R5) : meme energie potentielle elastique aux deux points."
          - math: 'W_{AB}(\vec F) = E_{pe}(A) - E_{pe}(B)'
            note: "Travail d'une force conservative entre A et B = la perte d'energie potentielle correspondante."
          - math: '\boxed{W_{AB}(\vec F) = 0\ \text{J}}'
            note: "La difference est nulle : coherent avec le theoreme de l'energie cinetique, qui donne aussi Delta Ec = 0 entre A et B (vA = vB = 0)."

  # ── bk-2023-n-x4b — 2023 N, Exercice 4 (Partie II) : la balançoire, pendule pesant ──
  - id: bk-2023-n-x4b
    title: "La balançoire, pendule pesant : énergie potentielle, vitesse angulaire maximale et période propre"
    source:
      year: 2023
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 4 — Partie II : Étude du mouvement d'une balançoire"
    bareme_total: 2.25
    duration_min: 14
    sourcing:
      status: sourced
      note: >-
        2023 session normale — examen national PC BIOF (Sciences Physiques,
        SPC, confirmé directement sur l'image du scan — le résumé HTML
        d'AlloSchool pour element/142476 annonce à tort « Sciences
        Mathématiques B »), AlloSchool NS28F, element/142476,
        course-422/upload-85304 (Exercice 4, Partie II — balançoire,
        pendule pesant assimilé à un pendule simple, petites oscillations ;
        barème de la partie = 2,25 pt sur les 5,5 pt de l'exercice complet,
        dont la Partie I — chute d'une balle — est transcrite sous
        chute-mouvements-plans.md, bk-2023-n-x4). Transcription vérifiée en
        2 passes : 1ʳᵉ passe de vérification adversariale indépendante
        (agent-vérificateur-adversarial), qui a corrigé la description de
        la figure 3 sur deux points (l'arc $\theta$ est à mi-tige, pas près
        de $O$ ; le vecteur $\vec k$ est tracé SUR la ligne pointillée, pas
        à côté d'elle) ; 2ᵉ passe de relecture de contrôle par un
        re-lecteur indépendant (agent-relecteur-indépendant, 2026-08-07),
        relevé pixel refait de zéro, qui CONFIRME les deux corrections de
        la 1ʳᵉ passe sans divergence nouvelle — l'entrée passe à
        « vérifié » à l'issue de cette 2ᵉ passe
        (docs/sujets/pc/systemes-oscillants.md). Physique re-dérivée et
        cohérente : $E_{pp}=mg\ell(1-\cos\theta)\approx\frac12mg\ell\theta^2$ ;
        $\dot\theta_{max}=\theta_0\sqrt{g/\ell}\approx0{,}32\ \text{rad.s}^{-1}$ ;
        $\ddot\theta+\frac{g}{\ell}\theta=0$ ;
        $T_0=2\pi\sqrt{\ell/g}\approx3{,}1\ \text{s}$ — ordre de grandeur
        d'une vraie balançoire, les données referment bien les questions.
        SCOPE NOTES (voir l'en-tête du fichier) : q1 (hauteur
        $z=\ell(1-\cos\theta)$, géométrie du cercle non détaillée pas à pas
        dans cette leçon) et q2a (énergie cinétique de rotation
        $E_c=\frac12J_\Delta\dot\theta^2$, formule du chapitre sur la
        rotation d'un solide autour d'un axe fixe, déjà référencé par R3
        pour la loi des moments mais jamais donnée sous forme énergétique
        dans cette leçon) sont pontées au point d'usage dans le
        raisonnement des questions concernées — drapeau reporté à
        l'orchestrateur.
    intro: |-
      **Étude du mouvement d'une balançoire (examen national, session normale 2023, Exercice 4 — Partie II).**

      Un enfant oscille à l'aide d'une balançoire (figure 2). On modélise la balançoire avec l'enfant par un pendule formé par un corps solide $(S)$ de masse $m$ et de centre d'inertie $G$, suspendu en un point $O$ par une tige rigide, de masse négligeable et de longueur $\ell$ pouvant effectuer un mouvement de rotation dans un plan vertical autour d'un axe horizontal $(\Delta)$ passant par $O$ (figure 3). On étudie le mouvement du pendule dans un repère $(G_0, \vec{k})$ lié à un référentiel terrestre supposé galiléen.

      On écarte le pendule de sa position d'équilibre stable d'un angle petit $\theta_0 = 9°$, dans le sens positif, puis on le lâche sans vitesse initiale à l'instant de date $t_0 = 0$. On repère la position du pendule à un instant de date $t$ par l'abscisse angulaire $\theta$. On néglige tous les frottements et on choisit le plan horizontal passant par $G_0$ (position de $G$ à l'équilibre stable) comme état de référence de l'énergie potentielle de pesanteur ($E_{pp} = 0$).

      **Données :** le moment d'inertie du pendule par rapport à l'axe de rotation $(\Delta)$ est $J_\Delta = m.\ell^2$ ; accélération de la pesanteur $g = 10\ \text{m.s}^{-2}$ ; $\ell = 2{,}4\ \text{m}$ ; pour les oscillations de faible amplitude, $\cos\theta \approx 1 - \dfrac{\theta^2}{2}$ ($\theta$ en radian).

      **Figure 2 (photographie) :** photographie en couleur d'un enfant assis sur une balançoire suspendue par des chaînes/cordes à une structure, dans un cadre extérieur herbeux.

      **Figure 3 (schéma) :** point $O$ en haut (étiquette « O » à gauche de la ligne, « $(\Delta)$ » à sa droite, l'axe de rotation) ; au-dessus de $O$, une courte flèche pleine orientée vers le haut, étiquetée « z » (un « z » simple, sans flèche de vecteur au-dessus). Une ligne verticale en pointillés descend de $O$ jusqu'à un point noir étiqueté « $G_0$ » (position d'équilibre de $G$). Le vecteur $\vec{k}$ est une courte flèche pleine vers le haut, tracée dans le prolongement exact de cette ligne pointillée, partant de $G_0$ ; seule l'étiquette « k » est écrite à gauche de la ligne. Une tige rigide part de $O$ et descend en oblique vers la droite jusqu'à un point noir étiqueté « $G$ » suivi de « $(S)$ ». L'angle $\theta$ est marqué par un arc fléché (pointe du côté de la tige) entre la pointillée et la tige, à mi-longueur de la tige environ (≈54 % de $|OG|$), étiquette « $\theta$ » sous l'arc. Un arc en pointillés relie $G_0$ à $G$, représentant la trajectoire circulaire du pendule.
    questions:
      - id: q1
        part: "Partie II — Étude du mouvement d'une balançoire : établir l'énergie potentielle de pesanteur"
        stem: |-
          **(0,5 pt)** Montrer que l'expression de l'énergie potentielle de pesanteur du pendule à un instant $t$ pour les oscillations de faible amplitude est : $E_{pp} = \dfrac{1}{2}mg\ell\theta^2$.
        reasoning: |-
          L'énergie potentielle de pesanteur, $E_{pp}=mgz$ (rung R5, définition générale renvoyée au chapitre Aspects énergétiques), demande ici la hauteur $z$ de $G$ au-dessus de sa position d'équilibre $G_0$ — un calcul de géométrie du cercle que ni R3 ni R5 ne détaillent pas à pas (R3 travaille avec les forces et les moments, pas les hauteurs). $G$ est à distance $\ell$ du pivot $O$ ; quand la tige fait l'angle $\theta$ avec la verticale, $G$ est à une profondeur $\ell\cos\theta$ sous $O$, contre $\ell$ (profondeur maximale) à l'équilibre — la différence de hauteur par rapport à $G_0$ est donc $z=\ell-\ell\cos\theta=\ell(1-\cos\theta)$. On substitue ensuite l'approximation des petites oscillations donnée dans les données, $\cos\theta\approx1-\theta^2/2$, exactement l'approximation du rung R3.
        steps:
          - math: 'z = \ell - \ell\cos\theta = \ell(1-\cos\theta)'
            note: "Hauteur de G au-dessus de sa position d'equilibre G0 : geometrie du cercle de rayon ell (ni R3 ni R5 ne detaille ce calcul pas a pas, il est ponte ici)."
          - math: 'E_{pp} = mgz = mg\ell(1-\cos\theta)'
