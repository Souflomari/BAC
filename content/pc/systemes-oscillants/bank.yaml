    intro: |-
      **Étude d'un oscillateur mécanique {solide, ressort} (examen national, session de rattrapage 2011 — Exercice Mécanique, 2ème situation, 3,25 points sur les 5,50 de l'exercice complet).**

      *La 1ère situation de cet exercice — l'étude dynamique d'une grue — est indépendante et déjà en banque à part, sous la notion « Rotation autour d'un axe fixe » (entrée bk-2011-r-x1). Rien de ce qui suit n'en dépend.*

      Les études dynamique et énergétique des systèmes mécaniques, dans différentes situations, permettent la détermination de quelques caractéristiques du système étudié et de suivre son évolution temporelle. On néglige tous les frottements et on prend $g = 10\ \text{m.s}^{-2}$.

      **2ème situation.** On fixe à l'extrémité libre d'un ressort de masse négligeable, à spires non jointives et de raideur $K$, un solide $(S_2)$ de masse $m_2 = 182\ \text{g}$. L'autre extrémité est fixée à un support fixe (figure 2). Le solide $(S_2)$ est susceptible de glisser sur un plan horizontal.

      On écarte le solide $(S_2)$ de sa position d'équilibre, d'une distance $X_m$, et on l'abandonne sans vitesse initiale. Pour étudier le mouvement du centre de gravité $G_2$ du solide $(S_2)$, on choisit un repère galiléen $(O,\vec{i})$, tel que $G_2$ coïncide à l'équilibre avec l'origine $O$. On repère la position de $G_2$ à un instant $t$ dans le repère $(O,\vec{i})$, par son abscisse $x$.

      L'équation différentielle du mouvement de $G_2$ s'écrit sous la forme $\ddot{x} + \dfrac{K}{m_2}x = 0$, et sa solution est : $x(t) = X_m\cos\!\left(\dfrac{2\pi}{T_0}t + \varphi\right)$.

      Une étude expérimentale a permis de tracer la courbe représentée sur la figure 3.

      **Figure 2 — l'oscillateur horizontal.** À gauche, un mur hachuré. Un ressort à spires non jointives (une douzaine de boucles) part du mur, horizontalement, et se raccorde à un bloc carré portant un point plein en son centre : l'étiquette $(S_2)$ est au-dessus du bloc, l'étiquette $G_2$ en dessous. Le ressort et le bloc reposent sur un plan horizontal. Sous ce plan, un axe horizontal fléché vers la droite porte un point $O$ (étiqueté sous l'axe), placé exactement à l'aplomb de $G_2$ — le dessin représente donc la position d'équilibre, cohérent avec « $G_2$ coïncide à l'équilibre avec l'origine $O$ » — et, à sa droite, une courte flèche $\vec{i}$.

      **Figure 3 — la courbe $x(t)$, avec son quadrillage** *(bitmap natif, mesuré au pixel).* Axe des ordonnées $x\,(\text{cm})$, graduations principales $4$, $2$, $0$, $-2$, $-4$ ; axe des abscisses $t\,(\text{s})$, graduations principales $0{,}3$, $0{,}6$, $0{,}9$, $1{,}2$. La courbe part de $x(0) \approx +3{,}98\ \text{cm}$ à $t = 0$, un MAXIMUM (le premier maximum mesuré tombe à $t \approx 0{,}03\ \text{s}$, à moins de deux pixels de l'axe des ordonnées). Minima mesurés à $t \approx 0{,}285$, $0{,}885$ et $1{,}485\ \text{s}$ — espacés d'exactement $0{,}600\ \text{s}$ ; amplitudes lues : $+4{,}03$ / $-3{,}97$ / $-3{,}97$ / $+4{,}00\ \text{cm}$.
    questions:
      - id: q2-1
        stem: |-
          **(0,75 pt)** **2-1-** Déterminer graphiquement les grandeurs suivantes : l'amplitude $X_m$, la période propre $T_0$ et la phase $\varphi$ à l'origine des dates.
        reasoning: |-
          **Lecture graphique** (chapitre 3). L'amplitude $X_m$ est l'écart maximal atteint par la courbe : les extrema de la figure 3 touchent $+4$ et $-4\ \text{cm}$ (mesurés à $0{,}03$ à $0{,}05\ \text{cm}$ près des traits chiffrés) :

          $$X_m = 4{,}0\ \text{cm} = 4{,}0\times10^{-2}\ \text{m}$$

          La période propre $T_0$ se lit entre deux passages identiques, en prenant l'écart le plus large possible pour limiter l'erreur : les trois minima mesurés, à $0{,}285$, $0{,}885$ et $1{,}485\ \text{s}$, sont espacés d'EXACTEMENT $0{,}600\ \text{s}$ à chaque fois — une régularité qui confirme la lecture :

          $$T_0 = 0{,}60\ \text{s}$$

          La phase $\varphi$ ne se lit pas séparément : elle se lit sur la FORME du départ. La solution proposée s'écrit $x(t) = X_m\cos\!\left(\frac{2\pi}{T_0}t+\varphi\right)$ ; à $t=0$, $x(0) = X_m\cos\varphi$. La courbe part de $x(0) \approx X_m$ (le sommet même du premier maximum, à $t\approx0{,}03\ \text{s}$, à peine après l'origine) : c'est un cosinus qui démarre DÉJÀ à son maximum, donc $\cos\varphi = 1$.

          $$\boxed{X_m = 4{,}0\ \text{cm} \qquad T_0 = 0{,}60\ \text{s} \qquad \varphi = 0\ \text{rad}}$$
        steps:
          - math: '\boxed{X_m = 4{,}0\ \text{cm}}'
            note: "Lecture graphique : extrema de la courbe (figure 3) touchant +4 et -4 cm."
          - math: '\boxed{T_0 = 0{,}60\ \text{s}}'
            note: "Lecture graphique : trois minima consecutifs, espaces d'exactement 0,600 s a chaque fois."
          - math: 'x(0) \approx X_m \implies \cos\varphi = 1'
            note: "La courbe demarre a son maximum (t=0 tombe quasiment sur le premier sommet) : c'est un cosinus non dephase."
          - math: '\boxed{\varphi = 0\ \text{rad}}'
            note: "Phase a l'origine des dates."
      - id: q2-2
        stem: |-
          **(0,75 pt)** **2-2-** En déduire la valeur de la raideur $K$ du ressort.
        reasoning: |-
          L'équation différentielle de l'énoncé donne $\omega_0^2 = K/m_2$, et la période propre $T_0 = 2\pi/\omega_0$ (chapitre 2) ; il reste à retourner la relation avec la valeur de $T_0$ lue à la question précédente.
        steps:
          - math: 'T_0 = 2\pi\sqrt{\frac{m_2}{K}} \implies K = \frac{4\pi^2\,m_2}{T_0^2}'
