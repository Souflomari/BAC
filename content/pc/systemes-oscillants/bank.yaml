    intro: |-
      **Mouvement d'un oscillateur (examen national, session normale 2025, Exercice 4 — Partie 2).**

      L'oscillateur mécanique étudié est modélisé par le système (solide-ressort) constitué d'un solide $(S)$ de masse $m = 250\ \text{g}$ et d'un ressort à spires non jointives, de masse négligeable et de raideur $K$.

      Le ressort est horizontal, une de ses extrémités est fixe et sur l'autre on accroche le solide $(S)$. Ce solide peut glisser sans frottement sur le plan horizontal.

      On étudie le mouvement du centre d'inertie $G$ du solide $(S)$ dans un repère $R(O, \vec{i})$ lié à un référentiel terrestre considéré galiléen.

      On repère la position de $G$ à un instant $t$ par l'abscisse $x$ sur l'axe $(O, \vec{i})$. À l'équilibre, l'abscisse de $G$ est nul (figure 2).

      On écarte $(S)$ de sa position d'équilibre dans le sens positif d'une distance $X_m$ et on le lâche sans vitesse initiale à un instant choisi comme origine des dates $(t = 0)$.

      L'exploitation d'un enregistrement vidéo du mouvement de $G$ à l'aide d'un logiciel adéquat, a permis d'obtenir la courbe de la figure 3 représentant l'évolution temporelle de la vitesse $v_x(t)$ de $G$.

      **Figure 2 (schéma) :** ressort horizontal à spires, fixé par son extrémité gauche à un mur, l'autre extrémité attachée au solide $(S)$ (centre d'inertie $G$) posé sur un plan horizontal. L'axe $(O, \vec{i})$ : l'origine $O$ est nettement à gauche du solide (position d'équilibre) ; $\vec{i}$ part de $O$ vers la droite ; plus à droite, un trait vertical en pointillés monte de l'axe jusqu'au solide, étiqueté « x » sous l'axe — le solide est dessiné à l'abscisse $x$, pas en $O$.

      **Figure 3 (courbe) :** $v_x\ (10^{-2}\ \text{m.s}^{-1})$ en fonction de $t$, sur un cadre de 4 divisions en abscisse et 4 en ordonnée (1 division $=6{,}25$). Ordonnées graduées $12{,}5$ (trait du haut), $6{,}25$, $0$, $-6{,}25$ ; le trait du bas, non chiffré, vaut $-12{,}5$. Courbe sinusoïdale partant exactement de l'origine $(0\,;\,0)$ à $t=0$, puis décroissante (cohérent avec un lâcher sans vitesse depuis $x=+X_m$, donc $v_x<0$ juste après $t=0$). Extremums, tous tangents aux traits du haut et du bas : division $0{,}5$, premier minimum ($-12{,}5$) ; division $1{,}5$, premier maximum ($+12{,}5$) ; division $2{,}5$, deuxième minimum ; division $3{,}5$, deuxième maximum — le cadre montre exactement deux périodes complètes. Une double flèche horizontale étiquetée « $1\ \text{s}$ » s'étend exactement d'un trait principal au suivant (une division), ses extrémités coïncidant avec deux passages par zéro consécutifs : c'est **l'étalon de graduation de l'axe des temps** (1 division $=1\ \text{s}$), **pas la période propre**. La période se lit entre deux maxima consécutifs, soit 2 divisions.
    questions:
      - id: q1
        part: "Partie 2 — Mouvement d'un oscillateur : établir le modèle"
        stem: |-
          **(0,5 pt)** En appliquant la deuxième loi de Newton, établir l'équation différentielle vérifiée par l'abscisse $x(t)$.
        reasoning: |-
          C'est exactement le système du rung R1 (solide-ressort horizontal, sans frottement) : on applique la même méthode — système, référentiel galiléen, bilan (poids, réaction normale, force de rappel), deuxième loi, projection sur l'axe horizontal.
        steps:
          - math: '\vec P + \vec N + \vec F_{rappel} = m\vec a_G \qquad \text{avec} \qquad \vec F_{rappel} = -K\,x\,\vec i'
            note: "Deuxieme loi de Newton, exactement le bilan du rung R1 (poids, reaction normale, force de rappel)."
          - math: '-K\,x = m\,\ddot x'
            note: "Projection sur l'axe horizontal (O, i) : seule la force de rappel a une composante horizontale (rung R1)."
          - math: '\boxed{\ddot x + \frac{K}{m}\,x = 0}'
            note: "Forme standard de l'oscillateur harmonique (rung R1)."
      - id: q2a
        part: '2. La solution de cette équation différentielle s''écrit $x(t) = X_m\cos\left(\dfrac{2\pi}{T_0}t+\varphi\right)$ avec $T_0$ la période propre de l''oscillateur.'
        stem: |-
          **2-1.** (0,75 pt) Déterminer les valeurs de : $T_0$, $X_m$ et $\varphi$.
        reasoning: |-
          Différence avec le sujet 2018 ci-dessus : ici la courbe donnée est celle de la VITESSE $v_x(t)$, pas de la position $x(t)$. Le rung R2 le permet directement — $T_0$ reste la durée au bout de laquelle $x$, $\dot x$ ET $\ddot x$ reprennent les mêmes valeurs, donc se lit tout aussi bien sur $v_x(t)=\dot x(t)$ : deux maxima consécutifs de $v_x$, séparés de 2 divisions, avec 1 division $=1\ \text{s}$ (l'étalon donné par la double flèche, PAS la période elle-même — un piège de lecture détaillé dans la note de sourcing). Pour $X_m$, il faut passer par la relation $v(t)=-X_m\omega_0\sin(\omega_0t+\varphi)$ des rungs R1/R2 : l'amplitude de $v_x$ vaut $X_m\omega_0$, donc $X_m=v_{x,max}/\omega_0$ — on ne peut pas la lire directement en ordonnée comme au sujet 2018. Pour $\varphi$, l'énoncé donne directement le lâcher : écart positif, sans vitesse initiale — exactement le « Premier lancer » du rung R2, qui donne $\varphi=0$ ; la courbe le confirme ($v_x(0)=0$ et décroissante juste après, cohérent avec $v_x(t)=-X_m\omega_0\sin(\omega_0t)<0$ pour $t$ petit positif).
        steps:
          - math: 'T_0 = 2\times(\text{1 division}) = 2\times1\ \text{s} = 2\ \text{s}'
            note: "Deux maxima consecutifs de v_x (rung R2) separes de 2 divisions ; 1 division = 1 s est l'etalon de l'axe (la double fleche imprimee), PAS la periode directement."
          - math: 'v_{x,max} = 12{,}5\times10^{-2}\ \text{m.s}^{-1} \qquad \omega_0 = \frac{2\pi}{T_0} = \pi\ \text{rad.s}^{-1}'
            note: "Vitesse maximale lue en ordonnee (tangente aux traits du cadre) ; pulsation deduite de T0 (rung R2)."
          - math: 'X_m = \frac{v_{x,max}}{\omega_0} = \frac{0{,}125}{\pi} \approx 3{,}98\times10^{-2}\ \text{m}'
            note: "v(t) = -Xm.omega0.sin(...) (rungs R1/R2) : l'amplitude de v_x vaut Xm.omega0, donc Xm = v_max / omega0."
          - math: '\boxed{T_0 = 2\ \text{s} \qquad X_m \approx 4{,}0\times10^{-2}\ \text{m} \qquad \varphi = 0}'
            note: "Phi = 0 : lacher sans vitesse depuis l'ecart positif (enonce), le cas Premier lancer du rung R2 - confirme par v_x(0) = 0 decroissante sur la courbe."
      - id: q2b
        stem: |-
          **2-2.** (0,5 pt) Déduire la valeur de la raideur $K$ (On prend $\pi^2 = 10$).
        reasoning: |-
          Le rung R1 relie $\omega_0$ à $K$ et $m$ par $\omega_0^2=K/m$ : on inverse, avec $\omega_0=\pi\ \text{rad/s}$ trouvé à la question précédente et $m=250\ \text{g}$ donné.
        steps:
          - math: 'K = m\,\omega_0^2 = m\left(\frac{2\pi}{T_0}\right)^2'
            note: "On isole K dans omega0^2 = K/m (rung R1)."
          - math: 'K = 0{,}250\times\pi^2 = 0{,}250\times10'
            note: "Application numerique avec pi^2 = 10 (donne par l'enonce) et T0 = 2 s."
          - math: '\boxed{K = 2{,}5\ \text{N.m}^{-1}}'
            note: "Raideur du ressort."
      - id: q3
        stem: |-
          **(0,75 pt)** Déterminer la variation de l'énergie potentielle élastique du système (solide $(S)$ - ressort) entre les instants $t = 1\ \text{s}$ et $t = 2{,}5\ \text{s}$.
        reasoning: |-
          On calcule d'abord $x(t)$ aux deux instants avec l'équation horaire complète ($X_m\approx4{,}0\times10^{-2}\ \text{m}$, $\omega_0=\pi\ \text{rad/s}$, $\varphi=0$, question 2-1), puis on applique la formule du rung R5, $E_{pe}=\frac12Kx^2$, aux deux positions. $t=1\ \text{s}=T_0/2$ ramène le solide à l'extrémité opposée ($x=-X_m$) ; $t=2{,}5\ \text{s}=1{,}25\,T_0$ le ramène au passage par l'équilibre ($x=0$) — ce n'est donc pas une variation triviale entre deux mêmes états.
        steps:
          - math: 'x(1) = X_m\cos(\pi\times1) = -X_m \qquad x(2{,}5) = X_m\cos\left(\pi\times2{,}5\right) = X_m\cos\left(\frac{\pi}{2}\right) = 0'
            note: "On reinjecte t = 1 s et t = 2,5 s dans x(t) = Xm.cos(omega0.t) (phi = 0, question 2-1)."
          - math: 'E_{pe}(1) = \frac12KX_m^2 \qquad E_{pe}(2{,}5) = 0'
            note: "Formule du rung R5, Epe = (1/2) K x^2, appliquee aux deux positions."
          - math: '\Delta E_{pe} = E_{pe}(2{,}5) - E_{pe}(1) = -\frac12KX_m^2 = -\frac12\times2{,}5\times(4{,}0\times10^{-2})^2'
            note: "Variation entre les deux instants : on retranche l'etat initial (t=1s) de l'etat final (t=2,5s)."
          - math: '\boxed{\Delta E_{pe} \approx -2{,}0\times10^{-3}\ \text{J}}'
            note: "L'energie potentielle elastique diminue : coherent, le solide passe de l'extremite opposee (toute l'energie dans le ressort) a l'equilibre (aucune energie dans le ressort)."
