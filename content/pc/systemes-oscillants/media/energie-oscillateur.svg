<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Échange d'énergie dans l'oscillateur élastique non amorti : l'énergie cinétique E c et l'énergie potentielle élastique E p e oscillent en opposition de phase ; leur somme E m reste constante, égale à E max.">
  <title>Échange d'énergie E_c ↔ E_pe — pendule élastique (sans frottement)</title>

  <!--
    energie-oscillateur.svg — figure STATIQUE, un seul panneau (pas de
    step-groups). Ec(t) et Epe(t) tracées en fonction du TEMPS (le choix
    "vs temps" plutôt que "vs position" pour rester au plus près du calcul
    du rung R5 : Ec(t)=½mXm²ω0²sin²(ω0t+φ), Epe(t)=½mXm²ω0²cos²(ω0t+φ),
    Ec+Epe = constante). Chaque instant-clé est ANNOTÉ avec la position x
    correspondante (x=0 aux pics de Ec ; x=±Xm aux pics de Epe), ce qui
    relie explicitement le graphe temporel à la position — cf. R5 : "Quand
    x=0... quand x=±Xm...".

    BORNE DE PRUDENCE PHYSIQUE (à ne pas reproduire par erreur ailleurs) :
    Epe(t) et Ec(t) sont des fonctions en cos²/sin² de ω0·t : leur PROPRE
    période est T0/2, pas T0 (l'énergie repasse par son maximum deux fois
    par période mécanique — une fois à chaque extremum ±X_m). Cette figure
    ne trace donc AUCUN bracket "T0" sur l'axe des temps (à la différence
    de pendule-elastique.svg, où x(t) est une fonction en cos simple dont
    le bracket pic-à-pic EST exactement T0). Seuls des repères d'instants
    qualitatifs (x=+Xm / x=0 / x=−Xm) sont marqués ici.

    Couleurs — cohérentes avec l'analogie LC (R1, R5) ET avec
    pendule-elastique.svg :
      E_pe = ½kx² (potentiel élastique, lié à k)  → --figure-energy-C
      E_c  = ½mv² (cinétique, liée à m)           → --figure-energy-L
      E_m = E_c+E_pe = constante                  → --figure-accent
                                                      ("le fait qui compte")

    Construction des dômes Epe(t)/Ec(t) : à la différence d'un cosinus
    simple, cos² et sin² ont une tangente HORIZONTALE aux deux extrémités
    de chaque demi-arche (au pic ET au passage par zéro) — d'où un bezier
    symétrique par demi-arche (largeur w=100px) : c1 = début+(0,5w, 0),
    c2 = fin−(0,5w, 0) (offsets en x seulement, y = valeur de l'ancre la
    plus proche). Les deux courbes sont des images miroir strictes l'une
    de l'autre (même amplitude, même ligne de base) : leur somme, en
    fraction d'énergie, vaut exactement 1 en tout point (vérifié :
    à mi-arche, chaque courbe vaut 50% → somme = 100% = E_max).
  -->

  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Échange d'énergie dans l'oscillateur élastique (sans frottement)
  </text>

  <rect x="20" y="32" width="600" height="310" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Axes -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="600,300 588,295.5 588,304.5" fill="var(--figure-ink-soft)"/>
  <line x1="90" y1="155" x2="90" y2="310" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="90,155 85.5,167 94.5,167" fill="var(--figure-ink-soft)"/>
  <text x="607" y="304" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">t</text>
  <text x="82" y="159" text-anchor="end" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">E</text>
  <text x="82" y="304" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>

  <!-- Repère E_max -->
  <line x1="86" y1="170" x2="94" y2="170" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="66" y="174" text-anchor="end" font-size="9.5" font-style="italic"
        fill="var(--figure-ink-soft)">E<tspan dy="3" font-size="7">max</tspan></text>

  <!-- E_pe(t) — dômes, pics à x=90,290,490 (x=±X_m) -->
  <path d="
    M90,170
    C140,170 140,300 190,300
    C240,300 240,170 290,170
    C340,170 340,300 390,300
    C440,300 440,170 490,170
    C540,170 540,300 590,300
  " fill="none" stroke="var(--figure-energy-C)" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- E_c(t) — dômes en antiphase, pics à x=190,390,590 (x=0) -->
  <path d="
    M90,300
    C140,300 140,170 190,170
    C240,170 240,300 290,300
    C340,300 340,170 390,170
    C440,170 440,300 490,300
    C540,300 540,170 590,170
  " fill="none" stroke="var(--figure-energy-L)" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- E_m = constante (repère plat) -->
  <line x1="90" y1="170" x2="590" y2="170" stroke="var(--figure-accent)" stroke-width="2"
        stroke-dasharray="8,5"/>
  <text x="440" y="160" text-anchor="middle" font-size="11" font-style="italic"
        fill="var(--figure-accent)">E<tspan dy="3" font-size="8">m</tspan><tspan
        dy="-3"> = constante</tspan>
  </text>

  <!-- Étiquettes de courbe -->
  <text x="290" y="155" text-anchor="middle" font-size="12" font-style="italic"
        fill="var(--figure-energy-C)">E<tspan dy="3" font-size="8.5">pe</tspan></text>
  <text x="190" y="155" text-anchor="middle" font-size="12" font-style="italic"
        fill="var(--figure-energy-L)">E<tspan dy="3" font-size="8.5">c</tspan></text>

  <!-- Instants-clés annotés (les 3 premiers ; le motif se répète ensuite) -->
  <circle cx="90" cy="300" r="3.5" fill="var(--figure-energy-C)"/>
  <text x="90" y="316" text-anchor="middle" font-size="10" font-style="italic"
        fill="var(--figure-ink)">x = +X<tspan dy="3" font-size="7">m</tspan></text>
  <text x="90" y="330" text-anchor="middle" font-size="8.5" fill="var(--figure-ink-soft)">Epe max, Ec = 0</text>

  <circle cx="190" cy="300" r="3.5" fill="var(--figure-energy-L)"/>
  <text x="190" y="316" text-anchor="middle" font-size="10" font-style="italic"
        fill="var(--figure-ink)">x = 0</text>
  <text x="190" y="330" text-anchor="middle" font-size="8.5" fill="var(--figure-ink-soft)">Ec max, Epe = 0</text>

  <circle cx="290" cy="300" r="3.5" fill="var(--figure-energy-C)"/>
  <text x="290" y="316" text-anchor="middle" font-size="10" font-style="italic"
        fill="var(--figure-ink)">x = −X<tspan dy="3" font-size="7">m</tspan></text>
  <text x="290" y="330" text-anchor="middle" font-size="8.5" fill="var(--figure-ink-soft)">Epe max, Ec = 0</text>

  <!-- Instants suivants — motif déjà établi, marqueur seul -->
  <circle cx="390" cy="300" r="3" fill="var(--figure-energy-L)"/>
  <circle cx="490" cy="300" r="3" fill="var(--figure-energy-C)"/>
  <circle cx="590" cy="300" r="3" fill="var(--figure-energy-L)"/>

  <!-- Légende -->
  <line x1="60" y1="362" x2="90" y2="362" stroke="var(--figure-energy-L)" stroke-width="2.5"/>
  <text x="96" y="366" font-size="10.5" fill="var(--figure-energy-L)">E<tspan
        font-style="italic" dy="3" font-size="8">c</tspan><tspan
        dy="-3"> (cinétique) = ½ m v²</tspan>
  </text>

  <line x1="340" y1="362" x2="370" y2="362" stroke="var(--figure-energy-C)" stroke-width="2.5"/>
  <text x="376" y="366" font-size="10.5" fill="var(--figure-energy-C)">E<tspan
        font-style="italic" dy="3" font-size="8">pe</tspan><tspan
        dy="-3"> (potentiel élastique) = ½ k x²</tspan>
  </text>

  <line x1="60" y1="384" x2="90" y2="384" stroke="var(--figure-accent)" stroke-width="2"
        stroke-dasharray="6,4"/>
  <text x="96" y="388" font-size="10.5" fill="var(--figure-accent)">E<tspan
        font-style="italic" dy="3" font-size="8">m</tspan><tspan
        dy="-3"> = E</tspan><tspan font-style="italic" dy="3" font-size="8">c</tspan><tspan
        dy="-3"> + E</tspan><tspan font-style="italic" dy="3" font-size="8">pe</tspan><tspan
        dy="-3"> = constante</tspan>
  </text>

  <text x="320" y="406" text-anchor="middle" font-size="9.5" font-style="italic"
        fill="var(--figure-ink-soft)">
    Cas idéal, sans frottement : l'énergie mécanique totale ne varie pas au cours du temps.
  </text>

</svg>
