<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -2 648 434" width="640" height="430"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Courbe de résonance : amplitude du résonateur en fonction de la fréquence imposée par l’excitateur, pour trois amortissements croissants — dans les trois cas le pic est exactement à la fréquence propre du résonateur ; un amortissement plus fort donne un pic plus bas et plus large.">
  <title>Courbe de résonance — amplitude en fonction de la fréquence de l’excitateur</title>

  <!--
    resonance-sandbox.svg — DOWNGRADE STATIQUE de [[embed:resonance-sandbox]]
    (couverture 2026-07, voir HANDOFF) : la cible reste un manipulable
    (C-RES-1, docs/design/INTERACTIVE-FIGURE-SPEC.md — sweep f_exc + curseur
    d'amortissement), non construite dans cette passe ; cette figure STATIQUE
    couvre la même idée avec une FAMILLE de courbes déjà tracées (au lieu
    d'un curseur), pour que le marqueur résolve sans régression pédagogique.
    Figure STAGÉE, 3 étapes (LESSON-EXPERIENCE-SPEC §2.5 : graphe → toujours
    stagé, axes → données → lecture) :
      step-1 : les axes (f_exc horizontal, amplitude verticale) + la
               fréquence propre f0 repérée (trait vertical)
      step-2 : les données — trois courbes, amortissement croissant
      step-3 : la lecture — le pic est TOUJOURS à f_exc = f0 ; seules la
               hauteur et la largeur du pic changent avec l'amortissement

    LIMITE R7 (§0.5 spec-extension) : aucune formule d'amplitude n'apparaît
    dans le rendu, aucun axe gradué numériquement, aucun facteur de
    qualité — "sketched from data, never derived". Les courbes SONT
    calculées depuis la réponse standard d'un oscillateur forcé amorti,
    normalisée, UNIQUEMENT pour obtenir une forme fidèle (hauteur/largeur
    relatives correctes) ; cette formule n'est ni affichée ni nommée :

      A(r)/A(1) proportionnel à 1 / sqrt((1−r²)² + (2ζr)²), r = f_exc/f0

    ζ_faible=0,05 (pic normalisé à 230px de haut), ζ_moyen=0,15 (140px),
    ζ_fort=0,4 (70px) — hauteurs choisies pour la LISIBILITÉ du contraste,
    pas pour représenter une échelle métrique réelle (exagération
    schématique assumée, comme sur toutes les figures de ce corpus qui
    n'ont pas de graduation numérique, cf. celerite-vs-frequence.svg).
    Par construction, les trois pics sont forcés à r=1 exactement (f_exc =
    f0) : la vraie formule déplacerait légèrement le maximum d'un
    amortissement FORT en dessous de r=1 (hors-programme, cf. LIMITE — la
    leçon enseigne "maximale quand f_exc ≈ f0" pour tout amortissement,
    jamais un déplacement du pic) — un choix délibéré pour rester
    STRICTEMENT à l'intérieur de la limite qualitative enseignée, jamais
    une figure "plus physiquement exacte que le programme".

    Repère f→pixel : f0 (r=1) en x=330 ; une unité de r = 180px.
    Repère amplitude→pixel : ligne de base (amplitude nulle) en y=300.

    Couleurs : amortissement faible → --figure-regime-pseudo (même famille
    que le pseudo-périodique de regimes-amortissement.svg — l'amortissement
    faible laisse le système "vivant" dans les deux figures) ; amortissement
    fort → --figure-regime-aperiodic (même famille que l'apériodique —
    l'amortissement fort "étouffe" dans les deux cas) ; amortissement moyen
    → --figure-ink (teinte neutre, entre les deux familles nommées) ;
    repère f0 → --figure-accent (l'UNE idée : le pic reste à f0 dans tous
    les cas, DESIGN-BIBLE §6).
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Courbe de résonance — amplitude en fonction de la fréquence de l’excitateur
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="24" width="600" height="316" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════
       STEP 1 — les axes + f0
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="60" y1="300" x2="612" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="612,300 600,295.5 600,304.5" fill="var(--figure-ink-soft)"/>
    <line x1="60" y1="330" x2="60" y2="45" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="60,45 55.5,57 64.5,57" fill="var(--figure-ink-soft)"/>
    <text x="500" y="322" text-anchor="middle" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">fréquence de l’excitateur</text>
    <text x="52" y="49" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">amplitude</text>

    <!-- Repère f0 -->
    <line x1="330" y1="300" x2="330" y2="45" stroke="var(--figure-accent)" stroke-width="1.3"
          stroke-dasharray="5,4"/>
    <text x="330" y="315" text-anchor="middle" font-size="10.5" font-style="italic" font-weight="600"
          fill="var(--figure-accent)">f<tspan dy="3" font-size="7.5">0</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════════════════
       STEP 2 — les données : trois amortissements
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Amortissement fort (le plus bas, le plus large) -->
    <path d="
      M80,292
      C109,288.5 138.33,286.5 168,281.5
      C197.67,276.5 234,269.23 258,262
      C282,254.77 300,243.43 312,238.1
      C324,232.77 324,230 330,230
      C336,230 336,232.77 348,238.1
      C360,243.43 378,254.77 402,262
      C426,269.23 462.33,276.5 492,281.5
      C521.67,286.5 550.96,288.53 580,292
    " fill="none" stroke="var(--figure-regime-aperiodic)" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Amortissement moyen -->
    <path d="
      M150,294
      C173.8,279.7 198,265.68 222,250.5
      C246,235.32 277.5,217.88 294,202.9
      C310.5,187.92 315,167.75 321,160.6
      C327,153.45 327,157.9 330,160
      C333,162.1 333,162.18 339,173.2
      C345,184.22 349.5,209.25 366,226.1
      C382.5,242.95 405.67,263.15 438,274.3
      C470.33,285.45 519.74,286.84 560,293
    " fill="none" stroke="var(--figure-ink)" stroke-width="2.2" opacity="0.82"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Amortissement faible (le plus haut, le plus étroit) -->
    <path d="
      M150,296
      C173.8,288.3 198,282.4 222,272.7
      C246,262.97 277.5,261.22 294,237.6
      C310.5,213.98 315,158.93 321,131
      C327,103.07 327,67.95 330,70
      C333,72.05 333,113.37 339,143.3
      C345,173.23 349.5,225.93 366,249.6
      C382.5,273.27 405.67,277.4 438,285.3
      C470.33,293.2 519.74,293.14 560,297
    " fill="none" stroke="var(--figure-regime-pseudo)" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Légende — trois lignes empilées, sous le panneau -->
    <line x1="40" y1="352" x2="68" y2="352" stroke="var(--figure-regime-pseudo)" stroke-width="2.6"/>
    <text x="74" y="356" font-size="10.5" fill="var(--figure-ink)">Amortissement faible — pic haut et étroit</text>

    <line x1="40" y1="372" x2="68" y2="372" stroke="var(--figure-ink)" stroke-width="2.2" opacity="0.82"/>
    <text x="74" y="376" font-size="10.5" fill="var(--figure-ink)">Amortissement moyen — pic intermédiaire</text>

    <line x1="40" y1="392" x2="68" y2="392" stroke="var(--figure-regime-aperiodic)" stroke-width="2.4"/>
    <text x="74" y="396" font-size="10.5" fill="var(--figure-ink)">Amortissement fort — pic bas et large</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════════════════
       STEP 3 — la lecture
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <circle cx="330" cy="70" r="3" fill="var(--figure-regime-pseudo)"/>
    <circle cx="330" cy="160" r="3" fill="var(--figure-ink)" opacity="0.82"/>
    <circle cx="330" cy="230" r="3" fill="var(--figure-regime-aperiodic)"/>

    <text x="320" y="416" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-accent)">Dans les trois cas, l’amplitude est maximale exactement à f<tspan
          dy="3" font-size="7.5">exc</tspan><tspan dy="-3"> = f</tspan><tspan
          dy="3" font-size="7.5">0</tspan><tspan dy="-3">.</tspan>
    </text>
  </g><!-- /step-3 -->

</svg>
