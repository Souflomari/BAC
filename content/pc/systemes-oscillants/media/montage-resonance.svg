<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Montage de résonance mécanique : un excitateur à fréquence réglable entraîne, via un ressort, un résonateur de fréquence propre fixe ; la courbe de résonance mesurée, amplitude en fonction de la fréquence de l'excitateur, montre un pic à la fréquence propre, plus haut et étroit (aigu) pour un amortissement faible, plus bas et large (flou) pour un amortissement fort.">
  <title>Montage de résonance — excitateur, résonateur, et la courbe de résonance</title>

  <!--
    montage-resonance.svg — R7 (C-RES-2). Figure composée, DEUX panneaux
    empilés, STAGÉE (contient un graphe → toujours stagé, LESSON-EXPERIENCE-
    SPEC §2.5) :
      step-1 : le montage (excitateur → ressort → résonateur, f0 fixe
               annoncé) + les axes vides de la courbe de résonance (avec
               f0 repéré)
      step-2 : les données — les deux courbes mesurées (amortissement
               faible / fort)
      step-3 : la lecture — étiquettes "aiguë" / "floue" sur chaque pic

    PANNEAU 1 (montage, y=32..244) : même grammaire que pendule-elastique.svg
    / rl-schema.svg (mur/bâti → ressort zigzag --figure-energy-C → bloc masse
    --figure-energy-L), à la différence que l'extrémité FIXE habituelle est
    remplacée par l'excentrique de l'excitateur (texte R7 : "l'extrémité
    libre du ressort est reliée à un excentrique entraîné par un petit
    moteur électrique"). Le résonateur (bloc masse) glisse sur un banc
    horizontal.

    PANNEAU 2 (graphe, y=262..472) : DEUX courbes seulement (contrairement
    à resonance-sandbox.svg qui en montre trois) — exactement les deux
    conditions du TP décrit dans le texte ("une fois avec un frottement
    faible... une fois avec un frottement renforcé"). Mêmes coordonnées
    relatives que le panneau du haut de resonance-sandbox.svg, réduites
    d'échelle et recentrées dans ce panneau plus petit (~0,7×) — courbes
    RECALCULÉES aux nouvelles coordonnées avec la même méthode (Béziers
    cubiques Catmull-Rom/6 à travers des points d'appui physiquement
    informés — cf. l'en-tête de resonance-sandbox.svg pour la formule
    utilisée UNIQUEMENT en interne, jamais affichée).

    Couleurs : ressort → --figure-energy-C ; bloc résonateur →
    --figure-energy-L ; f_exc (le réglage de l'expérimentateur) →
    --figure-accent (l'UNE idée structurelle du panneau 1 : c'est f_exc
    qu'on règle, jamais f0) ; courbe aiguë (amortissement faible) →
    --figure-regime-pseudo ; courbe floue (amortissement fort) →
    --figure-regime-aperiodic — même langage de couleur que
    resonance-sandbox.svg et regimes-amortissement.svg.
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Montage de résonance — excitateur, résonateur, et la courbe de résonance
  </text>

  <!-- Fond des deux panneaux -->
  <rect x="20" y="32" width="600" height="212" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
  <rect x="20" y="262" width="600" height="210" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
  <text x="320" y="256" text-anchor="middle" font-size="10.5" font-style="italic"
        fill="var(--figure-ink-soft)">Courbe de résonance mesurée</text>

  <!-- ══════════════════════════════════════════════════════════════════
       STEP 1 — le montage + les axes vides
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Banc horizontal -->
    <line x1="50" y1="192" x2="590" y2="192" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <line x1="60" y1="200" x2="76" y2="192" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="90" y1="200" x2="106" y2="192" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="120" y1="200" x2="136" y2="192" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <!-- Excitateur : moteur + excentrique -->
    <circle cx="96" cy="150" r="26" fill="none" stroke="var(--figure-ink)" stroke-width="2"/>
    <circle cx="96" cy="150" r="2.5" fill="var(--figure-ink)"/>
    <!-- flèche de rotation -->
    <path d="M78,132 A24,24 0 0,1 114,132" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="114,132 106,128 108,138" fill="var(--figure-ink-soft)"/>
    <!-- bras d'excentrique -->
    <line x1="96" y1="150" x2="118" y2="136" stroke="var(--figure-accent)" stroke-width="2"/>
    <circle cx="118" cy="136" r="3.5" fill="var(--figure-accent)"/>
    <!-- tige de liaison vers le ressort -->
    <line x1="122" y1="150" x2="150" y2="150" stroke="var(--figure-ink)" stroke-width="2"/>

    <text x="96" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-ink)">excitateur</text>
    <text x="96" y="217" text-anchor="middle" font-size="10" fill="var(--figure-accent)">f<tspan
          dy="3" font-size="7">exc</tspan><tspan dy="-3"> (réglable)</tspan></text>

    <!-- Ressort -->
    <polyline points="150,150 165,140 180,160 195,140 210,160 225,140 240,150"
              fill="none" stroke="var(--figure-energy-C)" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="128" text-anchor="middle" font-size="12" font-style="italic"
          fill="var(--figure-energy-C)">k</text>

    <!-- Résonateur : bloc masse -->
    <rect x="240" y="125" width="70" height="50" rx="6"
          fill="var(--figure-energy-L)" fill-opacity="0.16"
          stroke="var(--figure-energy-L)" stroke-width="1.8"/>
    <text x="275" y="155" text-anchor="middle" font-size="14" font-style="italic" fill="var(--figure-ink)">m</text>

    <text x="275" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="var(--figure-ink)">résonateur</text>
    <text x="275" y="217" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">(f<tspan
          dy="3" font-size="7">0</tspan><tspan dy="-3"> fixe)</tspan></text>

    <!-- double flèche d'oscillation au-dessus du bloc -->
    <line x1="255" y1="108" x2="295" y2="108" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <polygon points="255,108 261,104.5 261,111.5" fill="var(--figure-ink-soft)"/>
    <polygon points="295,108 289,104.5 289,111.5" fill="var(--figure-ink-soft)"/>

    <!-- note de cohérence -->
    <text x="470" y="150" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">
      L'excitateur impose f<tspan dy="3" font-size="7">exc</tspan><tspan dy="-3"> ; f</tspan><tspan
      dy="3" font-size="7">0</tspan><tspan dy="-3"> ne bouge jamais.</tspan>
    </text>
    <text x="470" y="168" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">
      Deux frottements testés : faible, puis renforcé.
    </text>

    <!-- Axes du graphe (panneau 2) -->
    <line x1="60" y1="430" x2="600" y2="430" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="600,430 588,425.5 588,434.5" fill="var(--figure-ink-soft)"/>
    <line x1="60" y1="458" x2="60" y2="284" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="60,284 55.5,296 64.5,296" fill="var(--figure-ink-soft)"/>
    <text x="500" y="452" text-anchor="middle" font-size="10.5" font-style="italic"
          fill="var(--figure-ink-soft)">fréquence de l'excitateur</text>
    <text x="52" y="288" text-anchor="end" font-size="10.5" font-style="italic"
          fill="var(--figure-ink-soft)">amplitude</text>

    <line x1="325" y1="430" x2="325" y2="284" stroke="var(--figure-accent)" stroke-width="1.3"
          stroke-dasharray="5,4"/>
    <text x="325" y="445" text-anchor="middle" font-size="10" font-style="italic" font-weight="600"
          fill="var(--figure-accent)">f<tspan dy="3" font-size="7">0</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════════════════
       STEP 2 — les données : deux courbes mesurées
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Amortissement fort — floue -->
    <path d="
      M180,410
      C203.1,406.04 231.67,401 250,398
      C268.33,395 277.5,393.33 290,392
      C302.5,390.67 313.33,390 325,390
      C336.67,390 347.5,390.67 360,392
      C372.5,393.33 381.67,395 400,398
      C418.33,401 446.9,406.04 470,410
    " fill="none" stroke="var(--figure-regime-aperiodic)" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Amortissement faible — aiguë -->
    <path d="
      M230,415
      C246.5,400.15 266.67,385.83 280,370
      C293.33,354.17 302.5,331.67 310,320
      C317.5,308.33 320,300 325,300
      C330,300 332.5,308.33 340,320
      C347.5,331.67 356.67,354.17 370,370
      C383.33,385.83 403.5,400.15 420,415
    " fill="none" stroke="var(--figure-regime-pseudo)" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════════════════
       STEP 3 — la lecture : étiquettes aiguë / floue
       ══════════════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <circle cx="325" cy="300" r="3" fill="var(--figure-regime-pseudo)"/>
    <text x="335" y="286" font-size="10.5" font-weight="600"
          fill="var(--figure-regime-pseudo)">aiguë (amortissement faible)</text>

    <circle cx="325" cy="390" r="3" fill="var(--figure-regime-aperiodic)"/>
    <text x="400" y="378" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--figure-regime-aperiodic)">floue (amortissement fort)</text>
  </g><!-- /step-3 -->

</svg>
