      - id: D
        text: "Il n'a aucun effet sur les oscillations du balancier ; son seul rôle est de faire avancer les aiguilles de la montre."
        correct: false
        misconception: M-OSC-RES-3
        feedback: >
          C'est l'inverse : sans ce dispositif, les frottements internes
          amortiraient et arrêteraient le balancier, et la montre
          s'arrêterait complètement. C'est justement parce qu'il entretient
          l'oscillation du balancier que les aiguilles peuvent continuer
          d'avancer régulièrement.
    correct_feedback: >
      Le dispositif d'entretien compense exactement l'énergie dissipée par
      frottement, à chaque cycle — il ne fixe pas le rythme. Le balancier
      oscille à sa propre période propre, déterminée par $J$ et $C$ (son
      ressort spiral), exactement comme le générateur d'entretien du
      circuit RLC ne fixe pas non plus la fréquence du circuit.
    solution: |
      Le dispositif d'entretien apporte, à chaque période, un complément
      d'énergie calé pour compenser exactement la perte par frottement — ni
      plus, ni moins. Le balancier continue donc d'osciller à sa période
      propre $T_0 = 2\pi\sqrt{J/C}$, fixée par son moment d'inertie $J$ et
      la raideur de son ressort spiral $C$ : l'entretien ne fait que
      prolonger l'oscillation naturelle, il ne la pilote pas depuis
      l'extérieur.

  - id: SO-22
    rung: "R8"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [pendule_simple, isochronisme, bac]
    stem: >
      Un pendule simple de longueur $L = 2{,}5\ \text{m}$ oscille avec de
      petites oscillations au voisinage d'un lieu où
      $g \approx 10\ \text{m}\cdot\text{s}^{-2}$ (on prendra
      $\pi^2\approx 10$). Un élève affirme : « Si on utilise une bille deux
      fois plus lourde au bout du même fil, la période $T_0$ va doubler,
      car il faudra deux fois plus d'énergie pour la faire osciller. » Que
      peut-on dire de cette affirmation, et quelle est la valeur numérique
      de $T_0$ (pour la masse initiale) ?
    type: mcq
    choices:
      - id: A
        text: "L'affirmation est vraie : en doublant la masse, $T_0$ double aussi, ce qui donnerait, pour la masse initiale, une valeur de référence $T_0 \\approx 6{,}28\\ \\text{s}$."
        correct: false
        misconception: M-OSC-ISO-1
        feedback: >
          $T_0 = 2\pi\sqrt{L/g}$ ne contient pas la masse : elle se
          simplifie complètement dans l'établissement de l'équation du
          pendule simple. « Plus d'énergie nécessaire » n'implique pas
          « plus de temps » — c'est la même confusion masse/durée qu'en
          chute libre. $6{,}28\ \text{s}$ n'est d'ailleurs pas non plus la
          bonne valeur numérique.
      - id: B
        text: "L'affirmation est fausse, mais $T_0 \\approx 0{,}5\\ \\text{s}$ (on a confondu $T_0$ avec $\\sqrt{L/g}$, en oubliant le facteur $2\\pi$ entièrement)."
        correct: false
        misconception: M-OSC-FORM-1
        feedback: >
          Le rejet de l'affirmation sur la masse est correct, mais le
          calcul numérique oublie complètement le facteur $2\pi$ :
          $\sqrt{L/g}=\sqrt{2{,}5/10}=0{,}5\ \text{s}$ n'est qu'une étape
          intermédiaire, pas $T_0$.
      - id: C
        text: "L'affirmation est fausse : $T_0 = 2\\pi\\sqrt{L/g} = 2\\pi\\sqrt{2{,}5/10} = 2\\pi\\times0{,}5 \\approx 3{,}14\\ \\text{s}$, une valeur indépendante de la masse."
        correct: true
      - id: D
        text: "L'affirmation est fausse, mais $T_0 \\approx 1{,}57\\ \\text{s}$ (on a calculé $\\pi\\sqrt{L/g}$ au lieu de $2\\pi\\sqrt{L/g}$)."
        correct: false
        misconception: M-OSC-FORM-1
        feedback: >
          Le rejet de l'affirmation sur la masse est correct, mais il
          manque un facteur 2 dans le calcul : c'est $2\pi\sqrt{L/g}$, pas
          $\pi\sqrt{L/g}$. $1{,}57\ \text{s}\approx\pi\times0{,}5$
          correspond à la moitié seulement de la bonne valeur.
    correct_feedback: >
      La masse se simplifie entièrement dans l'établissement de l'équation
      du pendule simple : elle n'a aucun effet sur $T_0$. Numériquement,
      $T_0 = 2\pi\sqrt{2{,}5/10} = 2\pi\times0{,}5\approx3{,}14\ \text{s}$,
      quelle que soit la masse de la bille.
    solution: |
      **Sur l'affirmation :** dans $mL\ddot\theta = -mg\sin\theta$, la masse
      se simplifie des deux côtés avant même d'arriver à $T_0$ : elle ne
      peut donc pas réapparaître dans $T_0=2\pi\sqrt{L/g}$. L'argument
      énergétique de l'élève ne trouve aucune prise dans cette formule —
      l'affirmation est fausse.

      **Calcul :**
      $$T_0 = 2\pi\sqrt{\frac{L}{g}} = 2\pi\sqrt{\frac{2{,}5}{10}} = 2\pi\sqrt{0{,}25} = 2\pi\times0{,}5 \approx 3{,}14\ \text{s}$$

  - id: SO-23
    rung: "R8"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [pendule_torsion, energie, bac]
    stem: >
      Un pendule de torsion (disque de moment d'inertie
      $J = 5{,}0\times10^{-3}\ \text{kg}\cdot\text{m}^2$, fil de constante
      de torsion $C = 0{,}20\ \text{N}\cdot\text{m/rad}$) est lâché depuis
      $\theta_0 = 0{,}30\ \text{rad}$, sans vitesse angulaire initiale, sans
      frottement. Par analogie avec le pendule élastique (où
      $E_{pe}=\frac{1}{2}kx^2$), l'énergie potentielle de torsion s'écrit
      $E_{p,tor} = \frac{1}{2}C\theta^2$. Quelle est l'énergie mécanique de
      ce pendule ?
    type: mcq
    choices:
      - id: A
        text: "$E_m = 1{,}8\\times10^{-2}\\ \\text{J}$ (calculée comme $C\\theta_0^2$, sans le facteur $\\frac12$)."
        correct: false
        misconception: M-OSC-ENER-1
        feedback: >
          Le facteur $\frac12$ a été oublié : $E_{p,tor}=\frac{1}{2}C\theta_0^2$,
          exactement comme $E_{pe}=\frac{1}{2}kx^2$ pour le ressort. Sans ce
          facteur, le résultat est deux fois trop grand.
      - id: B
        text: "$E_m = 3{,}0\\times10^{-2}\\ \\text{J}$ (calculée comme $\\frac{1}{2}C\\theta_0$, avec $\\theta_0$ à la puissance 1)."
        correct: false
        misconception: M-OSC-ENER-1
        feedback: >
          L'énergie potentielle varie comme le carré de l'écart, pas
          proportionnellement à l'écart : il faut $\theta_0^2$, pas
          $\theta_0$ seul. C'est la même dépendance quadratique que pour
          $E_{pe}=\frac{1}{2}kx^2$.
      - id: C
        text: "$E_m = \\frac{1}{2}J\\theta_0^2 = 2{,}25\\times10^{-4}\\ \\text{J}$."
        correct: false
        misconception: M-OSC-ENER-1
        feedback: >
          Ce calcul utilise $J$ (la grandeur d'« inertie », qui
          interviendrait dans une énergie cinétique, $E_c=\frac12
          J\dot\theta^2$) à la place de $C$ (la grandeur de « rappel », qui
          intervient dans l'énergie potentielle). Ce sont deux rôles
          différents, à ne pas intervertir.
      - id: D
        text: "$E_m = 9{,}0\\times10^{-3}\\ \\text{J}$"
        correct: true
    correct_feedback: >
      Au lâcher, la vitesse angulaire est nulle : toute l'énergie mécanique
      est potentielle. $E_m = \frac{1}{2}C\theta_0^2 =
      \frac{1}{2}\times0{,}20\times(0{,}30)^2 = 9{,}0\times10^{-3}\ \text{J}$,
      et elle reste constante ensuite (pas de frottement).
    solution: |
      $$E_m = E_{p,tor}(0) = \frac{1}{2}C\theta_0^2 = \frac{1}{2}\times0{,}20\times(0{,}30)^2 = \frac{1}{2}\times0{,}20\times0{,}09 = 9{,}0\times10^{-3}\ \text{J}$$

      Sans vitesse angulaire initiale, l'énergie cinétique est nulle à
      $t=0$ : toute l'énergie est dans le fil tordu. Sans frottement, $E_m$
      reste constante à cette valeur pendant tout le mouvement.

  - id: SO-24
    rung: "R8"
    difficulty_level: 4
    skill_code: pc_systemes_oscillants
    tags: [synthese, analogie, tous_systemes]
    stem: >
      Pour les quatre systèmes oscillants étudiés (pendule élastique,
      pendule simple, pendule pesant, pendule de torsion), l'équation
      différentielle a toujours la forme $\ddot{X} + \omega_0^2 X = 0$, où
      $X$ joue le rôle d'une position ou d'un angle. Laquelle des
      propositions suivantes associe correctement la grandeur $\omega_0^2$
      à chacun des quatre systèmes ?
    type: mcq
    choices:
      - id: A
        text: "Pendule élastique : $k/m$ ; pendule simple : $g/L$ ; pendule pesant : $mgd/J_\\Delta$ ; pendule de torsion : $C/J$."
        correct: true
      - id: B
        text: "Pendule élastique : $k/m$ ; pendule simple : $L/g$ ; pendule pesant : $J_\\Delta/(mgd)$ ; pendule de torsion : $J/C$."
        correct: false
        misconception: M-OSC-FORM-1
        feedback: >
          Chaque rapport (sauf celui du pendule élastique) est inversé :
          « inertie » doit toujours être au dénominateur et « rappel » au
          numérateur dans $\omega_0^2$. Ces rapports inversés donneraient
          en réalité $T_0^2/(4\pi^2)$, pas $\omega_0^2$.
      - id: C
        text: "Pendule élastique : $k/m$ ; pendule simple : $g/L$ ; pendule pesant : $g/L$ (comme le pendule simple) ; pendule de torsion : $C/J$."
        correct: false
        misconception: M-OSC-FORM-1
        feedback: >
          Le pendule pesant ne se réduit à $g/L$ que dans le cas particulier
          d'une masse ponctuelle. Pour un solide étendu quelconque, il faut
          $mgd/J_\Delta$, qui dépend de la répartition de la masse (via
          $J_\Delta$) et de la distance $d=\Delta G$ — pas seulement d'une
          longueur $L$.
      - id: D
        text: "Pendule élastique : $k/m$ ; pendule simple : $g/L$ ; pendule pesant : $mgd/J_\\Delta$ ; pendule de torsion : $J/C$."
        correct: false
        misconception: M-OSC-FORM-1
        feedback: >
          Les trois premiers rapports sont corrects, mais celui du pendule
          de torsion est inversé : c'est $J$ (l'inertie) qui doit être au
          dénominateur et $C$ (le rappel) au numérateur, soit $C/J$ — pas
          $J/C$.
    correct_feedback: >
      Dans chaque cas, $\omega_0^2$ = (grandeur de rappel) / (grandeur
      d'inertie) : $k/m$, $g/L$, $mgd/J_\Delta$, $C/J$ — la même structure
      se répète, seuls les noms changent.
    solution: |
      | Système | Inertie | Rappel | $\omega_0^2$ |
      |---|---|---|---|
      | Pendule élastique | $m$ | $k$ | $k/m$ |
      | Pendule simple | — (s'annule) | $g/L$ | $g/L$ |
      | Pendule pesant | $J_\Delta$ | $mgd$ | $mgd/J_\Delta$ |
      | Pendule de torsion | $J$ | $C$ | $C/J$ |

      Dans les quatre cas, $\omega_0^2$ = rappel / inertie, jamais l'inverse.

  - id: SO-25
    rung: "R6"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [amortissement, pseudo_periode, regime_pseudo_periodique, utilisation]
    stem: >
      Un solide-ressort ($m$, $k$ fixés) oscille sur un banc à frottement
      faible. On mesure l'intervalle de temps entre deux passages successifs
      par l'écart maximal du même côté. Comparé à la période propre
      $T_0 = 2\pi\sqrt{m/k}$, cet intervalle (la pseudo-période $T$) :
    type: mcq
    choices:
      - id: A
        text: >-
          vaut approximativement $T_0$ : un amortissement faible ne change presque rien
          à la période.
        correct: true
      - id: B
        text: >-
          est nettement plus court, car l'amplitude diminue à chaque
          aller-retour.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Ce choix fusionne deux effets distincts : le terme de frottement
          $h\dot{x}$ retire de l'énergie, donc fait décroître l'amplitude,
          mais le terme de rappel $kx$ (qui fixe le rythme) n'est pas
          touché. Pour un amortissement faible, l'espacement entre deux
          extrêmes reste voisin de $T_0$, même si leur hauteur diminue
          nettement.
      - id: C
        text: >-
          n'existe pas : dès qu'il y a du frottement, il n'y a plus de
          période.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Le régime pseudo-périodique garde une pseudo-période bien définie
          et mesurable — c'est justement ce qui permet de la comparer à
          $T_0$. Ce n'est que pour un amortissement très fort (régime
          apériodique) qu'il n'y a plus aucune oscillation, donc plus de
          période au sens propre.
      - id: D
        text: >-
          augmente d'un aller-retour au suivant, à mesure que l'amplitude
          décroît.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Ce choix imagine que la décroissance de l'amplitude « traîne »
          aussi la période vers le haut. Mais l'amplitude et la
          pseudo-période ne dépendent pas des mêmes termes de l'équation
          $m\ddot{x}+h\dot{x}+kx=0$ : rien n'indique une dérive progressive
          de $T$ d'un cycle à l'autre.
    correct_feedback: >
      Le frottement fait fuir l'énergie (donc l'amplitude) cycle après
      cycle, mais il ne touche pas au terme de rappel qui fixe le rythme :
      pour un amortissement faible, $T \approx T_0 = 2\pi\sqrt{m/k}$.
    solution: |
      **Deux effets à ne pas fusionner :** le terme $h\dot{x}$ dissipe de
      l'énergie (l'amplitude décroît) ; le terme $kx$ fixe le rythme du
      mouvement. Pour un amortissement faible, seul le premier effet est
      net :
      $$T \approx T_0 = 2\pi\sqrt{\frac{m}{k}}$$

      L'amplitude diminue visiblement d'un aller-retour à l'autre ;
      l'espacement entre deux passages par un même extrême, lui, reste
      presque inchangé.

  - id: SO-26
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [amortissement, regimes, application_experimentale, document_experimental, hors_cadre_probe]
    stem: >
      On enregistre $x(t)$ pour trois amortissements croissants d'un même
      pendule élastique. Le premier oscille en s'amortissant. Le second
      revient à l'équilibre sans osciller, le plus rapidement possible
      parmi les trois. Le troisième revient à l'équilibre sans osciller lui
      non plus, mais lentement. Quels sont, dans l'ordre (premier, second,
      troisième), les trois régimes ?
    type: mcq
    choices:
      - id: A
        text: >-
          périodique ; pseudo-périodique ; apériodique.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          Le régime périodique (amplitude constante, sans frottement) n'est
          pas un régime d'amortissement : il correspond au cas idéal étudié
          avant ce chapitre. Le premier système décrit ici oscille en
          s'amortissant : c'est le régime pseudo-périodique, pas le régime
          périodique.
      - id: B
        text: >-
          pseudo-périodique ; apériodique ; critique.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          Le second et le troisième régime sont inversés. Le second système
          décrit revient le plus vite, sans osciller : c'est le régime
          critique, le cas-limite le plus rapide. Le troisième, plus lent,
          est l'apériodique — pas l'inverse.
      - id: C
        text: >-
          pseudo-périodique ; critique ; apériodique.
        correct: true
      - id: D
        text: >-
          amorti ; critique ; forcé.
        correct: false
        misconception: null
        feedback: >
          « Amorti » n'est pas le nom d'un régime précis (les trois régimes
          de ce chapitre sont pseudo-périodique, critique, apériodique), et
          « forcé » désigne un régime d'oscillations entretenues par un
          excitateur extérieur — une notion hors de ce chapitre sur les
          oscillations libres.
    correct_feedback: >
      Pseudo-périodique : oscille en s'amortissant. Critique : retour le
      plus rapide, sans dépassement — le cas-limite. Apériodique : retour
      sans dépassement lui aussi, mais plus lent que le critique.
    solution: |
      **Pseudo-périodique :** amplitude décroissante, oscillations
      persistantes.

      **Critique :** cas-limite entre les deux, retour le plus rapide
      possible sans aucun dépassement de l'équilibre.

      **Apériodique :** retour sans dépassement, mais plus lent que le
      critique (amortissement plus fort que le critique).

  - id: SO-27
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_systemes_oscillants
    tags: [amortissement, energie, bilan_energetique, resolution, hors_cadre_probe]
    stem: >
      Un pendule pesant oscille avec frottement, sans aucun dispositif
      d'entretien extérieur. Que peut-on affirmer sur son énergie mécanique
      $E_m$ et sur son mouvement à long terme ?
    type: mcq
    choices:
      - id: A
        text: >-
          $E_m$ finit par réaugmenter et l'amplitude repart, car l'oscillateur finit par
          s'entretenir de lui-même.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          Rien, dans le frottement seul, ne peut faire réaugmenter $E_m$ :
          le travail des forces de frottement est toujours négatif (elles
          s'opposent au mouvement). Un oscillateur ne peut « se relancer »
          que grâce à un dispositif d'entretien extérieur — absent ici, par
          hypothèse.
      - id: B
        text: >-
          $E_m$ décroît (dissipée en chaleur) et l'amplitude tend vers
          zéro ; sans dispositif d'entretien, le mouvement s'arrête.
        correct: true
      - id: C
        text: >-
          $E_m$ reste rigoureusement constante : le frottement ne change que la période,
          jamais l'énergie du système.
        correct: false
        misconception: [M-OSC-AMO-1, M-OSC-AMO-3]
        feedback: >
          Double erreur : le frottement n'agit pas d'abord sur la période
          (c'est l'amplitude qui décroît, la pseudo-période reste voisine
          de $T_0$), et il ne laisse surtout pas $E_m$ constante — il la
          dissipe continûment en chaleur.
      - id: D
        text: >-
          $E_m$ décroît, ce dont on peut déduire la pseudo-période par une formule du
          type $T = f(m, h, k)$.
        correct: false
        misconception: null
        feedback: >
          La leçon établit l'équation différentielle amortie
          $m\ddot{x}+h\dot{x}+kx=0$ puis s'arrête volontairement là : aucune
          formule fermée de la pseudo-période en fonction de $m$, $h$, $k$
          n'est au programme. Que $E_m$ décroisse ne donne pas accès à une
          telle formule.
    correct_feedback: >
      Le frottement dissipe l'énergie mécanique en chaleur, cycle après
      cycle ; sans dispositif d'entretien extérieur (étudié au chapitre
      RLC), l'amplitude décroît jusqu'à l'arrêt complet du mouvement.
    solution: |
      Les forces de frottement s'opposant toujours au mouvement, leur
      travail est négatif à chaque instant : $E_m$ décroît continûment, en
      chaleur. Sans aucun apport extérieur, cette perte n'est jamais
      compensée : l'amplitude tend vers zéro et le pendule finit par
      s'immobiliser à l'équilibre.

  - id: SO-28
    rung: "R6"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [amortissement, pseudo_periode, pendule_torsion, application_experimentale, document_experimental]
    stem: |
      Un pendule de torsion ($J$, $C$ fixés, période propre théorique
      $T_0 = 1{,}20\ \text{s}$) oscille avec un amortissement faible. Un
      dispositif relève les instants de passage par l'élongation angulaire
      maximale du même côté, et l'amplitude correspondante :

      | Cycle | instant (s) | intervalle avec le précédent (s) | amplitude ($^\circ$) |
      |---|---|---|---|
      | 1 | 0,00 | — | 40 |
      | 2 | 1,21 | 1,21 | 34 |
      | 3 | 2,39 | 1,18 | 29 |
      | 4 | 3,60 | 1,21 | 25 |

      Que peut-on conclure de ce tableau ?
    type: mcq
    choices:
      - id: A
        text: >-
          Les intervalles diminuent nettement d'un cycle à l'autre, de $1{,}21$ à
          $1{,}18\ \text{s}$, preuve que le frottement raccourcit la période du pendule.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          L'écart entre $1{,}21$ et $1{,}18\ \text{s}$ (moins de $3\%$)
          relève de la précision de mesure, pas d'une tendance : les quatre
          intervalles restent tous voisins de $T_0=1{,}20\ \text{s}$, sans
          dérive systématique.
      - id: B
        text: >-
          Les intervalles restent voisins de $T_0=1{,}20\ \text{s}$ malgré
          la décroissance nette de l'amplitude (de $40^\circ$ à $25^\circ$) :
          c'est cohérent avec un amortissement faible.
        correct: true
      - id: C
        text: >-
          Puisque l'amplitude a diminué d'environ $40\%$, de $40^\circ$ à $25^\circ$, la
          pseudo-période a nécessairement diminué elle aussi d'environ $40\%$.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          L'amplitude et la pseudo-période ne varient pas dans les mêmes
          proportions : le tableau montre justement que la pseudo-période
          reste quasi constante ($\approx 1{,}20\ \text{s}$) pendant que
          l'amplitude chute nettement — ce sont deux grandeurs
          indépendantes ici.
      - id: D
        text: >-
          Ce tableau ne permet de conclure sur aucune période : dès qu'il y
          a du frottement, la notion de période perd tout son sens.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Le régime pseudo-périodique garde une pseudo-période bien définie
          et mesurable — c'est exactement ce que ce tableau permet de
          vérifier, colonne par colonne.
    correct_feedback: >
      Les trois intervalles mesurés ($1{,}21$ ; $1{,}18$ ;
      $1{,}21\ \text{s}$) restent tous voisins de $T_0=1{,}20\ \text{s}$,
      alors que l'amplitude chute nettement : c'est la signature attendue
      d'un amortissement faible.
    solution: |
      **Colonne « intervalle » :** $1{,}21$ ; $1{,}18$ ; $1{,}21\ \text{s}$
      — toutes proches de $T_0=1{,}20\ \text{s}$, aux incertitudes de
      mesure près.

      **Colonne « amplitude » :** décroissance nette et régulière,
      $40^\circ \to 25^\circ$.

      Ces deux lectures combinées confirment le régime pseudo-périodique
      pour un amortissement faible : rythme quasi inchangé, amplitude en
      baisse.

  - id: SO-29
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [amortissement, regimes, pendule_simple, classement, application_experimentale]
    stem: >
      Trois pendules simples identiques sont plongés dans trois fluides de
      viscosités croissantes (fluide 1 < fluide 2 < fluide 3) puis lâchés
      du même angle. Dans le fluide 1, le pendule oscille encore plusieurs
      fois en s'amortissant. Dans le fluide 3, il revient à l'équilibre
      sans le dépasser, mais très lentement. Dans le fluide 2, il revient à
      l'équilibre sans le dépasser, le plus rapidement possible parmi les
      trois. Lequel des trois pendules atteint l'équilibre en premier ?
    type: mcq
    choices:
      - id: A
        text: >-
          Celui du fluide 1 (régime pseudo-périodique), car il n'est pas
          ralenti par un frottement fort.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          Le pendule du fluide 1 oscille encore plusieurs fois avant de
          s'immobiliser : même si chaque aller-retour n'est pas ralenti
          individuellement, le fait de devoir osciller à répétition avant
          de se stabiliser le rend plus long à atteindre l'équilibre que le
          retour direct du régime critique.
      - id: B
        text: >-
          Celui du fluide 3 (régime apériodique), car plus de frottement
          ramène toujours plus vite vers l'équilibre.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          C'est l'inverse au-delà du régime critique : un amortissement
          plus fort que le critique ralentit lui-même le retour (le
          pendule « patauge » dans un fluide trop visqueux). Le fluide 3
          est justement décrit comme le plus lent des trois.
      - id: C
        text: >-
          Les trois atteignent l'équilibre exactement en même temps ; seul
          le chemin suivi diffère.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          Le temps de retour à l'équilibre dépend bel et bien de
          l'amortissement, et de façon non monotone : il diminue jusqu'au
          régime critique, puis réaugmente au-delà. Les trois pendules
          décrits n'ont pas le même temps de stabilisation.
      - id: D
        text: >-
          Celui du fluide 2 (régime critique) : c'est le cas-limite qui
          revient le plus vite, sans dépassement.
        correct: true
    correct_feedback: >
      Le régime critique est le cas-limite qui sépare le pseudo-périodique
      (retour retardé par les oscillations) de l'apériodique (retour
      retardé par un frottement trop fort) : c'est lui qui atteint
      l'équilibre le plus rapidement des trois.
    solution: |
      **Fluide 1 (pseudo-périodique) :** le pendule doit osciller plusieurs
      fois, en s'amortissant, avant de s'immobiliser — un détour qui prend
      du temps.

      **Fluide 3 (apériodique) :** retour direct, mais ralenti par un
      frottement trop important.

      **Fluide 2 (critique) :** le compromis exact entre les deux effets —
      retour direct, sans le frein d'un excès de frottement : c'est le plus
      rapide des trois.

  - id: SO-30
    rung: "R6"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [amortissement, energie, bilan_energetique, application_experimentale, document_experimental]
    stem: >
      On trace l'énergie mécanique $E_m(t)$ d'un pendule élastique
      horizontal soumis à un frottement fluide, sans aucun dispositif
      d'entretien. La courbe obtenue décroît régulièrement vers zéro. Que
      peut-on prévoir de cette courbe si l'on prolonge l'enregistrement
      suffisamment longtemps ?
    type: mcq
    choices:
      - id: A
        text: >-
          $E_m$ va forcément remonter à un moment donné, car un système
          physique ne peut pas perdre indéfiniment de l'énergie.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          Un système isolé (sans apport extérieur) peut au contraire perdre
          de l'énergie jusqu'à épuisement complet de son mouvement : rien
          n'oblige $E_m$ à remonter. Seul un dispositif d'entretien
          extérieur pourrait provoquer une remontée — absent ici.
      - id: B
        text: >-
          $E_m$ va se stabiliser à une valeur non nulle et rester constante
          indéfiniment, sans jamais s'annuler.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          Tant que le solide bouge encore, le frottement continue de
          dissiper de l'énergie : il n'existe aucun palier non nul où la
          dissipation s'arrêterait spontanément. Supposer un tel palier
          revient à supposer, implicitement, un apport qui compenserait la
          perte — exactement le rôle d'un dispositif d'entretien, absent
          ici.
      - id: C
        text: >-
          $E_m$ continue de décroître, sans jamais remonter, jusqu'à
          devenir quasi nulle : le solide finit par s'immobiliser à
          l'équilibre.
        correct: true
      - id: D
        text: >-
          $E_m$ oscille indéfiniment entre une valeur haute et une valeur
          basse, sans jamais décroître en moyenne.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          C'est l'échange $E_c \leftrightarrow E_{pe}$ (à énergie totale
          fixée) qui oscille dans le cas SANS frottement. Ici, avec
          frottement, c'est la somme $E_m = E_c + E_{pe}$ elle-même qui
          diminue en moyenne, cycle après cycle — pas seulement sa
          répartition entre les deux réservoirs.
    correct_feedback: >
      Sans dispositif d'entretien, rien ne peut compenser la dissipation
      par frottement : $E_m$ décroît de façon monotone vers zéro, et le
      solide s'immobilise à l'équilibre.
    solution: |
      Le frottement dissipe de l'énergie tant qu'il y a du mouvement ; il
      n'existe aucun mécanisme, dans ce système isolé, pour interrompre
      cette perte avant l'arrêt complet. $E_m(t)$ décroît donc de façon
      monotone vers zéro — jamais de remontée, jamais de palier non nul,
      jamais d'oscillation autour d'une moyenne constante.

  - id: SO-31
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [amortissement, pseudo_periode, pendule_simple, utilisation]
    stem: >
      Un pendule simple oscille dans l'air (frottement très faible), aux
      petites oscillations. Un
      élève, en observant que l'amplitude a nettement diminué après
      quelques minutes, affirme : « Comme l'amplitude a diminué de moitié,
      la pseudo-période a dû, elle aussi, diminuer d'environ moitié. »
      Cette affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : pour un amortissement faible, la pseudo-période $T$ reste voisine de
          $T_0=2\pi\sqrt{L/g}$, quelle que soit la décroissance de l'amplitude.
        correct: true
      - id: B
        text: >-
          Oui, car l'amplitude et la pseudo-période sont deux mesures d'un seul et même
          phénomène de décroissance du mouvement.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Ce sont deux grandeurs distinctes, gouvernées par des termes
          différents de l'équation du mouvement amorti : l'amplitude
          décroît sous l'effet du frottement, tandis que la pseudo-période
          reste fixée, pour un amortissement faible, par $L$ et $g$ (comme
          $T_0$), pas par le frottement.
      - id: C
        text: >-
          Oui, mais dans l'autre sens : une amplitude divisée par deux entraîne une
          pseudo-période multipliée par deux.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Même erreur, dans l'autre sens : cela suppose encore un lien
          direct entre amplitude et pseudo-période, qui n'existe pas pour
          un amortissement faible. $T$ reste voisine de $T_0$, quelle que
          soit l'ampleur de la décroissance de l'amplitude.
      - id: D
        text: >-
          On ne peut rien en dire : un pendule qui perd de l'amplitude n'a déjà plus de
          période clairement définie.
        correct: false
        misconception: M-OSC-AMO-1
        feedback: >
          Le régime pseudo-périodique garde une pseudo-période bien
          définie et mesurable, précisément parce que les passages par les
          extrêmes restent régulièrement espacés, même si leur hauteur
          diminue.
    correct_feedback: >
      L'amplitude et la pseudo-période obéissent à des mécanismes
      différents : la première décroît sous l'effet du frottement, la
      seconde reste voisine de $T_0$ tant que l'amortissement est faible.
      L'affirmation de l'élève fusionne à tort les deux.
    solution: |
      Dans l'équation amortie du pendule simple, le terme de frottement
      agit sur la décroissance de l'amplitude, pas sur le terme de rappel
      qui fixe le rythme ($g/L$). Pour un amortissement faible,
      $$T \approx T_0 = 2\pi\sqrt{\frac{L}{g}}$$
      quelle que soit l'ampleur de la décroissance de l'amplitude observée.

  - id: SO-32
    rung: "R6"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [amortissement, regimes, pendule_pesant, application_experimentale]
    stem: >
      Un pendule pesant est lâché deux fois du même angle, avec deux
      réglages d'amortissement différents. Réglage 1 : le solide revient à
      l'équilibre sans jamais le dépasser, en $2{,}4\ \text{s}$. Réglage 2 :
      le solide revient à l'équilibre sans jamais le dépasser non plus,
      mais en seulement $1{,}1\ \text{s}$. Que peut-on en conclure sur ces
      deux réglages ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le réglage 1, plus lent, est forcément le régime critique, car
          « critique » signifie « qui prend le plus de temps à se
          stabiliser ».
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          C'est l'inverse : le régime critique est le cas-limite le plus
          RAPIDE parmi les régimes non oscillants, pas le plus lent. Un
          retour sans dépassement mais lent (réglage 1) signale au
          contraire un amortissement plus fort que le critique
          (apériodique).
      - id: B
        text: >-
          C'est impossible : deux réglages sans aucune oscillation sont
          nécessairement identiques ; seul le régime pseudo-périodique peut
          varier en durée.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          Il existe une famille entière de réglages sans oscillation, du
          régime critique (le plus rapide) aux réglages de plus en plus
          apériodiques (de plus en plus lents à mesure que le frottement
          augmente) : l'absence d'oscillation ne signifie pas l'identité
          des temps de retour.
      - id: C
        text: >-
          Le réglage le plus rapide (réglage 2) est forcément le plus
          fortement amorti, car plus de frottement fait toujours revenir
          plus vite vers l'équilibre.
        correct: false
        misconception: M-OSC-AMO-2
        feedback: >
          « Plus de frottement = toujours plus vite » n'est vrai que
          jusqu'au régime critique ; au-delà, plus de frottement ralentit
          le retour. Le réglage le plus rapide des deux est donc le plus
          proche du critique, pas nécessairement le plus amorti des deux.
      - id: D
        text: >-
          Le réglage 2 est plus proche du régime critique — le retour le plus rapide
          sans aucune oscillation ; le réglage 1, plus lent, correspond à un
          amortissement plus fort.
        correct: true
    correct_feedback: >
      Parmi les régimes sans oscillation, le retour le plus rapide est
      celui du régime critique ; un retour plus lent, toujours sans
      dépassement, signale un amortissement plus fort que le critique
      (apériodique) — pas l'inverse.
    solution: |
      Le temps de retour à l'équilibre, parmi les régimes non oscillants,
      est minimal au régime critique et croît à mesure que l'amortissement
      s'en éloigne (vers l'apériodique). Le réglage 2 ($1{,}1\ \text{s}$,
      plus rapide) est donc le plus proche du critique ; le réglage 1
      ($2{,}4\ \text{s}$, plus lent) est plus fortement amorti que le
      critique.

  - id: SO-33
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [amortissement, energie, entretien, pendule_torsion, resolution]
    stem: >
      Un pendule de torsion oscille avec un frottement non négligeable,
      sans aucun dispositif d'entretien. Après quelques dizaines
      d'oscillations, l'amplitude est devenue très faible. Un élève
      propose : « Il suffit d'attendre encore un peu : le fil, en se
      détordant, va relâcher l'énergie qu'il avait emmagasinée au début et
      relancer les oscillations. » Que penser de cette proposition ?
    type: mcq
    choices:
      - id: A
        text: >-
          Elle est vraie : le fil accumule de l'énergie de torsion au fil des cycles
          successifs, énergie qu'il finira nécessairement par restituer d'un seul coup.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          Le fil ne fait qu'échanger, à chaque cycle, son énergie de
          torsion contre de l'énergie cinétique (et réciproquement) — il
          n'en accumule pas de réserve supplémentaire d'un cycle à l'autre.
          C'est justement cet échange, de plus en plus faible, qui
          s'amortit.
      - id: B
        text: >-
          Elle est vraie, car l'amortissement observé n'est qu'une pause temporaire
          avant que le système ne reparte de lui-même dans un nouveau cycle.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          L'amortissement n'est pas une pause : c'est une perte
          irréversible d'énergie mécanique, dissipée en chaleur par
          frottement. Rien, dans ce mécanisme, ne prépare un « redépart »
          futur du système livré à lui-même.
      - id: C
        text: >-
          Elle est fausse : l'énergie du fil est déjà restituée en énergie cinétique à
          chaque passage par l'équilibre, cycle après cycle — c'est cet échange qui
          s'amortit.
        correct: true
      - id: D
        text: >-
          Elle est fausse, mais seulement parce que le fil a fini par se casser ; en
          théorie, l'énergie serait bien restituée intégralement au système.
        correct: false
        misconception: M-OSC-AMO-3
        feedback: >
          Aucune casse n'est en jeu ici : c'est le mécanisme même de
          l'amortissement (le frottement, qui dissipe de l'énergie à
          chaque cycle) qui rend la restitution impossible, indépendamment
          de tout dommage matériel sur le fil.
    correct_feedback: >
      À chaque cycle, l'énergie de torsion du fil est déjà restituée en
      énergie cinétique au passage par l'équilibre — c'est l'échange
      normal d'un oscillateur. Le frottement grignote cet échange cycle
      après cycle ; il n'existe pas de réserve cachée que le fil
      « garderait » pour plus tard.
    solution: |
      Le fil de torsion échange son énergie potentielle avec l'énergie
      cinétique du disque à chaque quart de période, comme dans tout
      oscillateur — ce n'est pas une accumulation. Le frottement prélève
      une petite fraction de l'énergie totale à chaque cycle : c'est cette
      fuite progressive, et non une réserve cachée dans le fil, qui explique
      la décroissance de l'amplitude jusqu'à l'arrêt.

  - id: SO-34
    rung: "R7"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [resonance, condition_resonance, excitateur_resonateur, utilisation]
    stem: >
      Un résonateur de fréquence propre $f_0$ est forcé par un excitateur
      de fréquence $f_{exc}$ réglable. Pour quelle valeur de $f_{exc}$
      l'amplitude des oscillations du résonateur est-elle maximale ?
    type: mcq
    choices:
      - id: A
        text: >-
          $f_{exc} \approx f_0$ : c'est la condition de résonance du système forcé.
        correct: true
      - id: B
        text: >-
          Pour $f_{exc}$ la plus grande possible.
        correct: false
        misconception: M-OSC-RES-1
        feedback: >
          Une amplitude maximale ne vient pas d'un excitateur « rapide »,
          mais d'une coïncidence de fréquences : au-delà de $f_0$,
          l'amplitude retombe au contraire, elle ne continue pas de
          croître avec $f_{exc}$.
      - id: C
        text: >-
          Pour n'importe quelle $f_{exc}$, si on attend suffisamment
          longtemps.
        correct: false
        misconception: M-OSC-RES-1
        feedback: >
          Le temps d'attente ne remplace pas la coïncidence de fréquences :
          loin de $f_0$, l'amplitude du résonateur reste petite, aussi
          longtemps qu'on excite le système à cette fréquence-là.
      - id: D
        text: >-
          Pour $f_{exc}$ la plus petite possible.
        correct: false
        misconception: M-OSC-RES-1
        feedback: >
          Symétrique de l'erreur « le plus vite » : ici aussi, ce n'est ni
          la fréquence la plus basse ni la plus haute qui maximise
          l'amplitude, mais celle qui coïncide avec $f_0$.
    correct_feedback: >
      L'amplitude du résonateur culmine quand l'excitateur pousse au même
      rythme que la fréquence propre du résonateur : $f_{exc} \approx f_0$
      — ni la plus haute, ni la plus basse fréquence, mais celle qui
      coïncide.
    solution: |
      À chaque cycle, l'excitateur transmet de l'énergie au résonateur.
      Quand $f_{exc} \approx f_0$, ces apports arrivent en phase avec le
      mouvement propre du résonateur et s'accumulent efficacement : c'est
      la condition de résonance. Loin de $f_0$, les apports sont
      partiellement désynchronisés et l'amplitude reste faible.

  - id: SO-35
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_systemes_oscillants
    tags: [resonance, amortissement, acuite, application_experimentale, document_experimental]
    stem: >
      On trace, pour un même résonateur, la courbe amplitude = $f(f_{exc})$
      dans deux conditions : (1) frottements faibles, (2) frottements
      forts. Laquelle des deux courbes présente le pic le plus haut et le
      plus étroit, et comment nomme-t-on cette résonance ?
    type: mcq
    choices:
      - id: A
        text: >-
          La courbe à frottements forts ; résonance aiguë.
        correct: false
        misconception: M-OSC-RES-2
        feedback: >
          C'est l'inverse : un amortissement fort abaisse et élargit le
          pic (résonance floue), il ne le rend jamais plus haut ni plus
          étroit.
      - id: B
        text: >-
          La courbe à frottements faibles ; résonance aiguë.
        correct: true
      - id: C
        text: >-
          La courbe à frottements forts, car un fort amortissement
          concentre l'énergie sur $f_0$.
        correct: false
        misconception: M-OSC-RES-2
        feedback: >
          Le frottement dissipe de l'énergie à chaque cycle, il n'en
          « concentre » aucune : plus le frottement est fort, plus il faut
          une large plage de $f_{exc}$ pour entretenir une amplitude
          notable, d'où un pic bas et large, pas concentré.
      - id: D
        text: >-
          Les deux courbes ont le même pic ; l'amortissement ne change que
          la position de $f_0$.
        correct: false
        misconception: [M-OSC-RES-2, M-OSC-RES-3]
        feedback: >
          Double erreur : l'amortissement change la hauteur et la largeur
          du pic (pas son existence), et $f_0$ est une propriété fixe du
          résonateur (fixée par $m,k$ ou $J,C$) — elle ne se déplace
          jamais, quel que soit le frottement.
    correct_feedback: >
      Un amortissement faible donne un pic haut et étroit (résonance
      aiguë) ; un amortissement fort donne un pic bas et large (résonance
      floue). L'amortissement émousse toujours la résonance, il ne la
      concentre jamais.
    solution: |
      L'amplitude à l'équilibre est atteinte quand l'énergie dissipée par
      frottement sur un cycle égale l'énergie injectée par l'excitateur.
      Faible amortissement → cet équilibre n'est atteint qu'à très grande
      amplitude, et seulement tout près de $f_0$ → pic haut et étroit.
      Fort amortissement → équilibre atteint à amplitude modeste, sur une
      large plage de $f_{exc}$ → pic bas et large.

  - id: SO-36
    rung: "R7"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [resonance, excitateur_resonateur, utilisation]
    stem: >
      À la résonance, on observe que le résonateur oscille avec une très
      grande amplitude. Que peut-on dire des fréquences en jeu ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le résonateur oscille à sa fréquence propre $f_0$, qui a augmenté jusqu'à
          rejoindre celle imposée par l'excitateur.
        correct: false
        misconception: M-OSC-RES-3
        feedback: >
          $f_0$ est fixée par les caractéristiques du résonateur ($m,k$ ou
          $J,C$) : elle ne « bouge » jamais pour rejoindre quoi que ce
          soit. C'est au contraire l'excitateur qui règle $f_{exc}$ pour
          la rapprocher de $f_0$.
      - id: B
        text: >-
          C'est le résonateur qui impose sa propre fréquence à l'excitateur, et non
          l'inverse comme on pourrait le croire.
        correct: false
        misconception: M-OSC-RES-3
        feedback: >
          Les rôles sont inversés : c'est l'excitateur qui impose une
          fréquence réglable $f_{exc}$ au résonateur ; le résonateur, lui,
          garde sa fréquence propre fixe $f_0$ — il ne pilote rien de
          l'extérieur.
      - id: C
        text: >-
          Le résonateur oscille à la fréquence imposée par l'excitateur
          ($f_{exc}$), et cette $f_{exc}$ est proche de sa fréquence propre
          $f_0$, qui elle reste fixe.
        correct: true
      - id: D
        text: >-
          Les deux oscillent à des fréquences sans aucun rapport entre elles ; la grande
          amplitude vient seulement de la puissance de l'excitateur.
        correct: false
        misconception: [M-OSC-RES-1, M-OSC-RES-3]
        feedback: >
          Double erreur : la grande amplitude ne vient pas de la
          « puissance » de l'excitateur mais de la coïncidence des
          fréquences, et les deux fréquences ne sont justement pas « sans
          rapport » à la résonance — $f_{exc}$ y est au contraire proche de
          $f_0$.
    correct_feedback: >
      En régime établi, le résonateur oscille à la fréquence imposée par
      l'excitateur ($f_{exc}$) ; l'amplitude est grande précisément parce
      que cette $f_{exc}$ coïncide avec la fréquence propre fixe $f_0$ du
      résonateur.
    solution: |
      L'excitateur impose $f_{exc}$ (réglable) ; le résonateur, en régime
      établi, suit cette fréquence imposée. Sa fréquence PROPRE $f_0$, elle,
      reste une caractéristique fixe du résonateur (fixée par $m,k$ ou
      $J,C$), qui ne se déplace jamais. La grande amplitude observée
      signale que $f_{exc}$ a rejoint ce $f_0$ fixe — pas l'inverse.

  - id: SO-37
    rung: "R7"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [resonance, condition_resonance, application_experimentale, document_experimental]
    stem: |
      Pour un résonateur de fréquence propre $f_0 = 2{,}0\ \text{Hz}$, on
      relève l'amplitude des oscillations pour différentes fréquences
      d'excitation :

      | $f_{exc}$ (Hz) | 1,0 | 1,6 | 1,9 | 2,0 | 2,1 | 3,0 |
      |---|---|---|---|---|---|---|
      | Amplitude (cm) | 0,4 | 1,1 | 3,8 | 5,2 | 3,6 | 0,3 |

      D'après ce tableau, à quelle fréquence d'excitation le résonateur
      atteint-il sa plus grande amplitude, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: >-
          À $f_{exc}=3{,}0\ \text{Hz}$, car c'est la fréquence la plus
          élevée du tableau.
        correct: false
        misconception: M-OSC-RES-1
        feedback: >
          Le tableau montre au contraire l'amplitude la plus faible
          ($0{,}3\ \text{cm}$) à cette fréquence : « le plus élevé » n'est
          pas le bon critère, c'est la coïncidence avec $f_0$ qui compte,
          et $3{,}0\ \text{Hz}$ en est la plus éloignée du tableau.
      - id: B
        text: >-
          L'amplitude devrait continuer à croître au-delà de
          $f_{exc}=3{,}0\ \text{Hz}$ si on poursuivait l'essai à des
          fréquences encore plus hautes.
        correct: false
        misconception: M-OSC-RES-1
        feedback: >
          Le tableau montre au contraire une amplitude déjà en chute nette
          entre $2{,}1$ et $3{,}0\ \text{Hz}$ : rien n'indique une reprise
          de la croissance au-delà, bien au contraire — la tendance est
          à la baisse continue, loin de $f_0$.
      - id: C
        text: >-
          On ne peut pas le dire sans savoir combien de temps a duré
          chaque essai ; en attendant assez longtemps à n'importe quelle
          fréquence, l'amplitude finirait par y culminer.
        correct: false
        misconception: M-OSC-RES-1
        feedback: >
          Le tableau lui-même donne la réponse, sans besoin de connaître
          la durée des essais : c'est la coïncidence entre $f_{exc}$ et
          $f_0$ qui détermine où l'amplitude culmine, pas le temps
          d'attente à une fréquence quelconque.
      - id: D
        text: >-
          À $f_{exc}=2{,}0\ \text{Hz}$, car cette valeur coïncide avec
          $f_0$ : l'amplitude est maximale exactement autour de cette
          fréquence, et décroît de part et d'autre.
        correct: true
    correct_feedback: >
      Le tableau montre un maximum net ($5{,}2\ \text{cm}$) à
      $f_{exc}=2{,}0\ \text{Hz}$, exactement là où $f_{exc}$ coïncide avec
      $f_0$ ; l'amplitude décroît nettement de part et d'autre de cette
      valeur.
    solution: |
      L'amplitude croît de $1{,}0$ à $2{,}0\ \text{Hz}$
      ($0{,}4 \to 5{,}2\ \text{cm}$), culmine à $f_{exc}=f_0=2{,}0\
      \text{Hz}$, puis redécroît jusqu'à $3{,}0\ \text{Hz}$
      ($3{,}6 \to 0{,}3\ \text{cm}$) : c'est la signature expérimentale de
      la condition de résonance $f_{exc} \approx f_0$.

