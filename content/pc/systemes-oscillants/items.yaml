        correct: false
        misconception: M-OSC-RES-2
        feedback: >
          Le frottement ne change pas seulement la hauteur du pic : il en
          change aussi la largeur. Plus l'amortissement est fort, plus il
          faut s'écarter de $f_0$ que l'amplitude reste notable — d'où un
          pic plus large, pas seulement plus bas.
      - id: D
        text: >-
          Le second, mais uniquement parce que l'huile modifie $f_0$ du
          résonateur, pas à cause de l'amortissement lui-même.
        correct: false
        misconception: [M-OSC-RES-2, M-OSC-RES-3]
        feedback: >
          $f_0$ est une propriété fixe du résonateur ($m,k$ ou $J,C$), pas
          du fluide environnant : l'huile ne la modifie pas. C'est bien
          l'amortissement lui-même (le frottement fluide) qui élargit et
          abaisse le pic, indépendamment de toute variation de $f_0$.
    correct_feedback: >
      Un fort amortissement (l'huile) élargit et abaisse le pic de
      résonance : le second résonateur présente donc la résonance floue,
      pendant que le premier (dans l'air, faiblement amorti) garde une
      résonance aiguë.
    solution: |
      L'amplitude à l'équilibre résulte d'une balance entre énergie
      injectée par l'excitateur et énergie dissipée par frottement. Un
      frottement fort (huile) dissipe beaucoup à chaque cycle : la balance
      se fait à amplitude modeste, sur une plage large de $f_{exc}$
      — résonance floue. Un frottement faible (air) dissipe peu : la
      balance ne se fait qu'à grande amplitude, tout près de $f_0$
      — résonance aiguë.

