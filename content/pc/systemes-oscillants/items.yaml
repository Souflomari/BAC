      $$f_0 = \frac{1}{2\pi}\sqrt{\frac{g}{L}} \quad \text{(fixe, tant que } L \text{ ne change pas)}$$
      Le moteur, via l'excentrique, impose au support une vibration à
      $f_{exc}$, réglable indépendamment de $L$. La résonance survient
      quand $f_{exc}$ rejoint ce $f_0$ fixe — jamais l'inverse.

