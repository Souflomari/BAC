  #    couverture en fin de fichier annonçait `floor_met: true` en ne comptant
  #    que les six ids AMO/RES du cluster amortissement-résonance, décrits comme
  #    « le seul inventaire tagué de la notion » — ce qui avait cessé d'être
  #    vrai. Voir web/scripts/resume-couverture.mjs, qui garde désormais l'écart
  #    entre ce qu'un fichier affirme et ce qu'il contient.
  - id: SO-42
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_systemes_oscillants
    tags: [conditions_initiales, phase_a_l_origine, equation_differentielle]
    stem: >
      Un solide accroché à un ressort horizontal de raideur $k$ est lancé à
      $t = 0$ depuis sa position d'ÉQUILIBRE, avec une vitesse dirigée dans le
      sens positif de l'axe. On écrit son mouvement sous la forme
      $x(t) = X_m\cos(\omega_0 t + \varphi)$. Quelle proposition est
      entièrement correcte ?
    type: mcq
    choices:
      - id: A
        text: "$\\varphi = -\\dfrac{\\pi}{2}$, et $x(t)$ vérifie $\\ddot{x} + \\dfrac{k}{m}x = 0$, soit $x(t) = X_m\\sin(\\omega_0 t)$ avec $\\omega_0 = \\sqrt{k/m}$"
        correct: true
      - id: B
        text: >-
          $\varphi = +\dfrac{\pi}{2}$, et $x(t)$ vérifie
          $\ddot{x} + \dfrac{k}{m}x = 0$ : le sens du lancer ne change pas le
          signe de la phase
        correct: false
        misconception: M-OSC-PHASE-1
        feedback: >
          Le sens du lancer est justement ce qui fixe le signe. Avec
          $\varphi = +\pi/2$, on aurait $\dot{x}(0) = -X_m\omega_0 < 0$ : le
          solide partirait dans le sens NÉGATIF. Les deux conditions initiales
          se lisent ensemble — $x(0) = 0$ donne $\varphi = \pm\pi/2$, et
          $\dot{x}(0) > 0$ tranche pour $-\pi/2$.
      - id: C
        text: >-
          $\varphi = -\dfrac{\pi}{2}$, et $x(t)$ vérifie
          $\ddot{x} - \dfrac{k}{m}x = 0$, le signe moins traduisant le rappel
          qui s'oppose au mouvement
        correct: false
        misconception: M-OSC-EQD-1
        feedback: >
          Le signe « moins » du rappel est déjà passé de l'autre côté de
          l'égalité : $m\ddot{x} = -kx$ s'écrit $\ddot{x} + \frac{k}{m}x = 0$,
          avec un PLUS. Avec un moins, les solutions seraient des
          exponentielles réelles — un écart qui s'emballe, jamais une
          oscillation.
      - id: D
        text: >-
          $\varphi = -\dfrac{\pi}{2}$ et $\ddot{x} + \dfrac{k}{m}x = 0$, mais
          avec un ressort plus raide la pulsation $\omega_0$ serait plus petite
        correct: false
        misconception: M-OSC-RAID-1
        feedback: >
          Les deux premières affirmations sont justes, la troisième non.
          $\omega_0 = \sqrt{k/m}$ : la raideur est au NUMÉRATEUR. Un ressort
          plus raide rappelle plus fort, donc oscille plus vite — pulsation
          plus grande, période plus courte. L'intuition « plus dur à déformer,
          donc plus lent » confond la force qu'il faut exercer et la vitesse
          du retour à l'équilibre.
    correct_feedback: >
      $x(0) = 0$ impose $\cos\varphi = 0$, donc $\varphi = \pm\pi/2$ ; le sens
      du lancer, $\dot{x}(0) > 0$, tranche pour $\varphi = -\pi/2$. Et la
      deuxième loi de Newton projetée sur l'axe donne
      $\ddot{x} + \frac{k}{m}x = 0$, avec un PLUS devant le terme de rappel.
    solution: |
      **L'équation différentielle.** La seule force selon $(Ox)$ est le
      rappel $-kx$ (poids et réaction se compensent verticalement) :
      $$
      m\ddot{x} = -kx \quad\Longrightarrow\quad
      \ddot{x} + \frac{k}{m}x = 0, \qquad \omega_0 = \sqrt{\frac{k}{m}}
      $$
      **La phase.** Les deux conditions initiales se lisent ensemble :
      $$
      x(0) = X_m\cos\varphi = 0 \quad\Longrightarrow\quad
      \varphi = \pm\frac{\pi}{2}
      $$
      $$
      \dot{x}(0) = -X_m\omega_0\sin\varphi > 0 \quad\Longrightarrow\quad
      \sin\varphi < 0 \quad\Longrightarrow\quad \varphi = -\frac{\pi}{2}
      $$
      La position seule laisse deux possibilités ; c'est le SENS de la vitesse
      qui choisit. L'amplitude $X_m$, elle, n'intervient jamais dans ce choix.

  - id: SO-43
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_systemes_oscillants
    tags: [oscillateur_libre, conservation_energie, equation_differentielle]
    stem: >
      Sur un banc à coussin d'air (frottements négligeables), un solide
      accroché à un ressort est écarté de $X_m$ de sa position d'équilibre,
      puis lâché SANS vitesse initiale. Que peut-on affirmer de la suite du
      mouvement ?
    type: mcq
    choices:
      - id: A
        text: "Il oscille indéfiniment entre $-X_m$ et $+X_m$, et passe par l'équilibre à vitesse maximale"
        correct: true
      - id: B
        text: >-
          Il revient à sa position d'équilibre et s'y arrête : c'est là que le
          ressort ne tire plus, donc plus rien ne le met en mouvement
        correct: false
        misconception: M-OSC-LIBRE-1
        feedback: >
          À l'équilibre, c'est la FORCE qui est nulle, pas la VITESSE. Le
          solide y arrive lancé — l'énergie potentielle élastique du départ
          s'y est entièrement convertie en énergie cinétique — et il le
          dépasse. Une force nulle ne freine rien : elle cesse simplement
          d'accélérer.
      - id: C
        text: >-
          Son écart obéit à $\ddot{x} - \dfrac{k}{m}x = 0$ : il s'éloigne donc
          de plus en plus de l'équilibre
        correct: false
        misconception: M-OSC-EQD-1
        feedback: >
          Cette équation-là décrirait bien une fuite exponentielle — et c'est
          précisément le contrôle qui permet de repérer l'erreur de signe. Le
          rappel du ressort vaut $-kx$, d'où $\ddot{x} + \frac{k}{m}x = 0$,
          dont les solutions sont sinusoïdales.
      - id: D
        text: >-
          Il oscille selon $x(t) = X_m\cos(\omega_0 t + \varphi)$, la phase
          $\varphi$ valant $+\dfrac{\pi}{2}$ ou $-\dfrac{\pi}{2}$ selon le côté
          d'où on l'a lâché
        correct: false
        misconception: M-OSC-PHASE-1
        feedback: >
          Lâché SANS vitesse depuis l'écart maximal, le solide part d'un
          sommet de la sinusoïde : $x(0) = X_m$ donne $\cos\varphi = 1$, donc
          $\varphi = 0$ (et $\varphi = \pi$ s'il est lâché de l'autre côté).
          Les valeurs $\pm\pi/2$ correspondent au cas inverse — un départ
          DEPUIS l'équilibre, à vitesse maximale.
    correct_feedback: >
      Sans frottement, l'énergie mécanique se conserve : le solide repasse
      indéfiniment par les mêmes positions, entre $-X_m$ et $+X_m$. À
      l'équilibre l'énergie est entièrement cinétique, donc la vitesse y est
      maximale ; aux extrémités elle est entièrement potentielle, donc la
      vitesse y est nulle.
    solution: |
      L'équation du mouvement est $\ddot{x} + \dfrac{k}{m}x = 0$, dont les
      solutions sont sinusoïdales : $x(t) = X_m\cos(\omega_0 t + \varphi)$ avec
      $\omega_0 = \sqrt{k/m}$. Ici $x(0) = X_m$ et $\dot{x}(0) = 0$ donnent
      $\varphi = 0$, soit $x(t) = X_m\cos(\omega_0 t)$.
      Le raisonnement énergétique dit la même chose sans calcul :
      $$
      E_m = \frac{1}{2}kx^2 + \frac{1}{2}m\dot{x}^2 = \frac{1}{2}kX_m^2
      = \text{constante}
      $$
      En $x = 0$, tout est cinétique : $\dot{x}$ y est maximale en valeur
      absolue. En $x = \pm X_m$, tout est potentiel : la vitesse y est nulle.
      Rien ne retire d'énergie au système, donc l'amplitude ne décroît pas.

