        correct: false
        misconception: M-OSC-RES-3
        feedback: >
          Dans ce montage, $L$ reste fixe pendant le balayage de
          $f_{exc}$ : le pendule est le résonateur, à fréquence propre
          fixe, et c'est justement en gardant $L$ fixe qu'on peut observer
