        reasoning: |-
          **La réponse porte sur les parties 2 et 3** — pas sur les parties 1 et 2 (voir l'avertissement porté à l'énoncé). Démoduler, c'est retrouver le signal informatif à partir de l'onde reçue, et cela se fait en **deux étapes successives**, une par partie (chapitre 5).

          **Rôle de la partie 2 — la détection d'enveloppe, c'est-à-dire l'élimination de la porteuse haute fréquence.** Elle est faite de deux organes qui travaillent ensemble :

          - la **diode $D$** ne laisse passer le courant que dans un sens : elle **redresse** le signal, supprimant toutes les alternances négatives. Ce qui reste est une suite de bosses positives, toujours à la fréquence de la porteuse, mais dont le sommet dessine l'enveloppe ;
          - le **condensateur $C_2$ en parallèle avec $R_2$** forme un **filtre passe-bas** : il se charge très vite à chaque bosse et se décharge lentement dans $R_2$ entre deux bosses. Il **lisse** donc les oscillations rapides de la porteuse sans effacer les variations lentes de l'enveloppe.

          À la sortie de la partie 2, au nœud $G$, on a donc **l'enveloppe du signal — mais accompagnée de sa composante continue**, héritée du redressement. C'est exactement la courbe **(a)** : une sinusoïde entièrement au-dessus de l'axe.

          *La condition de réussite de cet étage, admise ici : la constante de temps $R_2C_2$ doit être grande devant la période de la porteuse et petite devant celle du signal modulant. Trop petite, le condensateur suit la porteuse et rien n'est lissé ; trop grande, il ne suit plus l'enveloppe et le signal est écrêté.*

          **Rôle de la partie 3 — l'élimination de la composante continue.** $C_3$ est en **série** et $R_3$ en parallèle : c'est un **filtre passe-haut**, autrement dit un condensateur de liaison. Un condensateur ne laisse pas passer le continu — il bloque la composante constante — mais transmet les variations. À la sortie, au nœud $H$, il ne reste que le **signal modulant seul**, centré sur zéro : c'est exactement la courbe **(c)**.

          **Pourquoi ces deux étages et pas un seul, et c'est ce que la question veut entendre.** La partie 2 supprime **ce qui est trop rapide** (la porteuse) ; la partie 3 supprime **ce qui ne varie pas du tout** (la composante continue). Les deux filtres sont complémentaires — un passe-bas puis un passe-haut —, et il faut les deux pour retrouver le signal d'origine, ni plus rapide ni décalé.

          **Ce que la partie 1 fait, et qu'il ne faut pas répéter ici.** Elle **sélectionne** la station, et c'est tout : c'était la réponse à la question 1-1. Elle n'intervient en rien dans la démodulation — c'est précisément le défaut de l'énoncé imprimé.
      - id: q4
        stem: |-
          **3-** (0,75 pt) On visualise sur l'écran d'un oscilloscope les tensions $u_{EM}$ *(sic — le sujet imprime une espace avant la virgule)*, $u_{GM}$ et $u_{HM}$, on obtient les courbes suivantes :

          *(les trois écrans **(a)**, **(b)** et **(c)**, décrits en tête d'énoncé)*

          Associer chacune des courbes (a), (b) et (c), à la tension corréspondante *(sic)*. Justifier.
        reasoning: |-
          Trois tensions, trois écrans, et **le montage impose l'ordre** : $E$ est en entrée de la partie 2, $G$ en sortie de la partie 2, $H$ en sortie de la partie 3. On suit donc le signal de gauche à droite dans la figure 3, et à chaque étage on demande : *qu'est-ce que cet étage vient de retirer ?*

          **$u_{EM}$ — au nœud $E$, entre le circuit d'accord et la masse : c'est l'onde reçue, encore modulée. → courbe (b).**
          Rien n'a encore été retiré : le signal porte toujours sa porteuse haute fréquence, dont l'amplitude varie au rythme du signal informatif. C'est la seule des trois courbes qui montre des oscillations **très rapides** enveloppées dans une variation lente — la signature même d'un signal modulé en amplitude. Aucune ambiguïté : les deux autres écrans portent des sinusoïdes simples.

          **$u_{GM}$ — au nœud $G$, après la diode et le filtre $C_2/R_2$ : c'est l'enveloppe, AVEC sa composante continue. → courbe (a).**
          La partie 2 a supprimé la porteuse ; il reste l'enveloppe. Mais le redressement a laissé le signal **entièrement d'un seul côté de zéro** : la courbe (a) est **entièrement au-dessus de l'axe médian**, sa valeur moyenne étant décalée d'environ $+2$ divisions. Une tension qui ne change **jamais** de signe est la marque d'un signal redressé et non encore débarrassé de son continu.

          **$u_{HM}$ — au nœud $H$, après $C_3$ et $R_3$ : c'est le signal modulant seul. → courbe (c).**
          La partie 3 a supprimé la composante continue ; la courbe est maintenant **centrée sur zéro**.

          **L'argument qui verrouille la réponse, et c'est lui qu'il faut écrire dans la justification.** Les courbes **(a) et (c) portent exactement la même sinusoïde** — même amplitude ($0{,}97$ division toutes les deux) et même période ($\approx 5{,}1$ divisions toutes les deux). La **seule** différence entre elles est un **décalage vertical d'environ deux divisions**. C'est très précisément la signature d'un signal et du **même signal privé de sa composante continue** — donc de l'entrée et de la sortie de la partie 3. Le rapprochement (a) ↔ (c) n'est pas une impression, il se mesure.

          **Et un second recoupement, gratuit :** l'**enveloppe** de la courbe (b) a la **même période** que les sinusoïdes de (a) et (c) — $\approx 5{,}2$ divisions contre $5{,}1$. C'est normal : c'est le même signal informatif, d'abord porté par la modulation, puis extrait. La démodulation n'a rien changé au rythme, elle n'a fait que retirer deux choses.

          **Le piège de cette question.** Intervertir (a) et (c) en raisonnant « le signal démodulé est plus propre, donc c'est le dernier ». Les deux sont également « propres » : ce qui les distingue est **le décalage vertical**, pas la forme. La règle sûre est de suivre le montage : la composante continue est retirée par la **dernière** partie, donc la courbe **centrée** est la **dernière**.

          *Rappel : aucun de ces écrans ne porte de base de temps ni de sensibilité verticale — dans aucune des deux éditions du sujet. Aucune fréquence, aucune tension n'est à en tirer, et la question ne le demande pas : c'est une association purement qualitative.*
