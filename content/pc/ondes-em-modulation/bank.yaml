    intro: |-
      **Modulation d'amplitude d'un signal (examen national, session normale 2023, Exercice 3 — §3).**

      La courbe de la figure 5 représente l'évolution temporelle de la tension $u(t)$ associée à un signal modulé en amplitude. L'expression mathématique de $u(t)$ est de la forme :

      $$u(t) = A\left(1 + m\cos(2\pi f_s\,t)\right)\cos(2\pi f_p\,t)$$

      avec $A$ une constante, $m$ le taux de modulation, $f_s$ et $f_p$ respectivement les fréquences du signal modulant et de la porteuse.

      **Figure 5 (oscillogramme).** $u\ (\text{V})$ en fonction de $t\ (\text{ms})$, sur un quadrillage de $12$ divisions en abscisse et $8$ divisions en ordonnée (axe des temps sur la ligne médiane) ; seule l'origine « $0$ » est chiffrée sur l'axe des ordonnées, aucun autre repère n'est chiffré directement sur les axes. Un repère d'échelle en forme de L (deux flèches à une seule pointe) est placé à $7$ divisions à droite de l'axe des ordonnées et $2$ divisions au-dessus de l'axe des temps : la flèche verticale, étiquetée « $2\text{V}$ », couvre exactement $1$ division ; la flèche horizontale, étiquetée « $1\ \text{ms}$ », couvre elle aussi exactement $1$ division. Le sommet du repère (à $t=7{,}0\ \text{ms}$) surplombe un **resserrement** de l'enveloppe — pas le renflement central, qui, lui, culmine deux divisions plus tôt, vers $t\approx5{,}0\ \text{ms}$. Le tracé montre une oscillation rapide (la porteuse) dont l'enveloppe, symétrique par rapport à l'axe des temps, alterne renflements (au bord gauche, $t\approx0$ ; vers $t\approx5{,}0\ \text{ms}$ ; vers $t\approx9{,}8\ \text{ms}$) et resserrements (vers $t\approx2{,}5\ \text{ms}$ ; vers $t\approx7{,}4\ \text{ms}$) ; l'enveloppe supérieure culmine à $3$ divisions ($6\ \text{V}$) et redescend à $1$ division ($2\ \text{V}$) à chaque resserrement.
    questions:
      - id: q1
        part: "3- Modulation d'amplitude d'un signal : choisir la bonne proposition"
        stem: |-
          **(0,5 pt)** Choisir la bonne proposition :

          | | |
          |---|---|
          | A | La fréquence du signal modulant est $4\ \text{kHz}$. |
          | B | La fréquence de la porteuse est $4\ \text{kHz}$. |
          | C | La fréquence du signal modulant est $100\ \text{Hz}$. |
          | D | La fréquence de la porteuse est $200\ \text{Hz}$. |
        reasoning: |-
          Deux échelles de temps cohabitent sur la figure 5 — exactement la distinction du chapitre 4 entre l'oscillation rapide (la porteuse) et l'enveloppe lente (le signal modulant). Le repère en L donne l'échelle (1 division = 1 ms, 1 division = 2 V) ; on lit la période de l'enveloppe entre deux renflements successifs pour $f_s$, et la période de l'oscillation rapide, comptée sur l'ensemble du tracé, pour $f_p$. Il ne reste plus qu'à confronter ces deux valeurs aux quatre propositions.
        steps:
          - math: 'T_s \approx 5\ \text{ms}'
            note: "Periode de l'enveloppe (chapitre 4), lue entre deux renflements successifs (t=0 et t=5,0 ms)."
          - math: 'f_s = \frac{1}{T_s} = \frac{1}{5\times10^{-3}} = 200\ \text{Hz}'
            note: "Frequence du signal modulant."
          - math: 'T_p \approx 0{,}25\ \text{ms}'
            note: "Periode de la porteuse (oscillation rapide), comptage des sommets sur l'ensemble du trace ; lecture fine, drapeau maintenu dans la source."
          - math: 'f_p = \frac{1}{T_p} = \frac{1}{0{,}25\times10^{-3}} = 4000\ \text{Hz} = 4\ \text{kHz}'
            note: "Frequence de la porteuse."
          - math: '\boxed{\text{proposition B}: f_p = 4\ \text{kHz}}'
            note: "Seule B est juste : A et D echangent porteuse et signal modulant (4 kHz revient a la porteuse, 200 Hz reviendrait au signal, pas l'inverse) ; C avance une valeur erronee (100 Hz) pour le signal modulant."
      - id: q2a
        part: "Répondre par vrai ou faux en justifiant"
        stem: |-
          **(0,5 pt)** **a.** Le taux de modulation est $m = 0{,}4$.
        reasoning: |-
          L'enveloppe supérieure de la figure 5 vaut $A(1+m)$ à son maximum et $A(1-m)$ à son minimum — la lecture directe de la forme donnée dans l'intro, prise à $\cos(2\pi f_s t)=+1$ puis $-1$ (chapitre 4). Le rapport de ces deux extrema, lus au repère en L, élimine $A$ et ne laisse que $m$.
        steps:
          - math: 'U_{\max} = 3\ \text{div} \times 2\ \text{V/div} = 6\ \text{V} \qquad U_{\min} = 1\ \text{div} \times 2\ \text{V/div} = 2\ \text{V}'
            note: "Extrema de l'enveloppe, lus via le repere en L (chapitre 4)."
          - math: 'm = \frac{U_{\max}-U_{\min}}{U_{\max}+U_{\min}} = \frac{6-2}{6+2} = 0{,}5'
            note: "Le rapport des extrema elimine A ; il ne reste que m (chapitre 4)."
          - math: '\boxed{m = 0{,}5 \neq 0{,}4 \implies \text{affirmation fausse}}'
            note: "La valeur proposee (0,4) ne correspond pas a la valeur lue (0,5) ; l'affirmation est fausse."
      - id: q2b
        stem: |-
          **(0,25 pt)** **b.** La valeur de la composante continue de la tension est $U_0 = 2\ \text{V}$.
        reasoning: |-
          La composante continue $U_0$ est la valeur moyenne de l'enveloppe (chapitre 3 : $u_2(t) = U_0 + s(t)$, l'enveloppe oscille entre $U_0-S_m$ et $U_0+S_m$) : on la retrouve en moyennant les deux mêmes extrema que ceux utilisés à la question précédente.
        steps:
          - math: 'U_0 = \frac{U_{\max}+U_{\min}}{2} = \frac{6+2}{2} = 4\ \text{V}'
            note: "Composante continue = valeur moyenne de l'enveloppe (chapitre 3)."
          - math: '\boxed{U_0 = 4\ \text{V} \neq 2\ \text{V} \implies \text{affirmation fausse}}'
            note: "La valeur proposee (2 V) ne correspond pas a la valeur lue (4 V) ; l'affirmation est fausse."
      - id: q3
        stem: |-
          **(0,5 pt)** Représenter l'allure du spectre de fréquences du signal modulé $u(t)$ sans respect d'échelle très précise.
        reasoning: |-
          Cette question mobilise une technique que la leçon ne couvre pas : chapitres 3 à 4 décrivent le signal modulé dans le domaine temporel (l'enveloppe), jamais dans le domaine fréquentiel — aucun chapitre à citer ici. On applique directement la relation trigonométrique de produit-somme, $\cos p \cos q = \frac{1}{2}[\cos(p-q)+\cos(p+q)]$, à la forme canonique donnée dans l'intro : le terme en $\cos(2\pi f_s t)\cos(2\pi f_p t)$ se scinde en deux oscillations pures, à $f_p-f_s$ et $f_p+f_s$. Le spectre attendu porte donc trois raies : une raie centrale à $f_p$, encadrée de deux raies latérales symétriques à $f_p \pm f_s$, chacune de hauteur moitié de la raie centrale (puisque $m=0{,}5$).
        steps:
          - math: 'u(t) = A\cos(2\pi f_p t) + A m \cos(2\pi f_s t)\cos(2\pi f_p t)'
            note: "On developpe la forme canonique donnee par l'enonce."
          - math: 'Am\cos(2\pi f_s t)\cos(2\pi f_p t) = \frac{Am}{2}\cos(2\pi (f_p-f_s) t) + \frac{Am}{2}\cos(2\pi (f_p+f_s) t)'
            note: "Relation trigonometrique produit-somme (hors chapitres de la lecon), appliquee directement."
          - math: 'u(t) = A\cos(2\pi f_p t) + \frac{Am}{2}\cos(2\pi (f_p-f_s) t) + \frac{Am}{2}\cos(2\pi (f_p+f_s) t)'
            note: "Trois composantes pures : le spectre est fait de trois raies."
          - math: 'f_p - f_s = 4000 - 200 = 3800\ \text{Hz} \qquad f_p + f_s = 4000 + 200 = 4200\ \text{Hz}'
            note: "Position numerique des deux raies laterales, avec fp et fs de la question 1."
          - math: '\boxed{\text{raies a } 3{,}8\ \text{kHz}\ (Am/2),\ 4{,}0\ \text{kHz}\ (A),\ 4{,}2\ \text{kHz}\ (Am/2)}'
            note: "Trois raies symetriques autour de fp ; la raie centrale deux fois plus haute que chaque raie laterale (m=0,5)."


