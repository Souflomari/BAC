    intro: |-
      **Sélection et démodulation d'une onde modulée en amplitude (examen national, session normale 2025, Exercice 3 — Partie 3).**

      On utilise une chaîne électronique simplifiée représentée sur la figure 4 pour sélectionner et démoduler une onde électromagnétique modulée en amplitude.

      Dans cette chaîne on utilise une diode $D$ considérée idéale, la bobine $(b)$ (supposée aussi idéale) et le condensateur de capacité $C_0$ précédemment utilisé.

      **Figure 4 (schéma).** Chaîne électronique en deux étages encadrés en pointillés, avec deux blocs « Amplification » intercalés. **Étage 1** (à gauche) : une antenne — un mât vertical surmonté d'un V ouvert vers le haut (deux traits obliques divergents) — alimente un circuit formé de la bobine $(b)$ (spires) montée en parallèle avec un condensateur variable $C$ (symbole de capacité réglable) ; la sortie entre dans le premier bloc « Amplification ». **Étage 2** (à droite du premier bloc) : le signal entre par une diode $D$ (triangle + barre, pointe vers la droite) jusqu'au nœud $B$ ; de $B$, un rhéostat $R$ descend vers la masse $M$ ; le fil continue vers le nœud $N$, d'où le condensateur $C_0$ descend également vers $M$ ; le fil continue à travers le condensateur $C_2$ (monté en série) jusqu'à un dernier nœud d'où $R_2$ descend vers $M$ ; la sortie de l'étage 2 entre dans le second bloc « Amplification », dont la sortie porte la flèche « HP » (haut-parleur). Légendes : « Étage 1 », « Étage 2 », « Figure 4 ».
    questions:
      - id: q1
        part: "3- Sélection et démodulation d'une onde modulée en amplitude : rôle de l'étage 2"
        stem: |-
          **(0,25 pt)** Quel est le rôle de l'étage 2 ?
        reasoning: |-
          L'étage 2 regroupe une diode $D$ et un dipôle $R$-$C_0$ : c'est très exactement le détecteur de crête décrit au rung 4 (R4) — la diode ne laisse passer que la partie positive de l'oscillation rapide déjà sélectionnée par l'étage 1, et le condensateur $C_0$, chargé quasi instantanément à chaque sommet puis se déchargeant plus lentement dans $R$, retrace l'enveloppe de la tension. Le rôle de l'étage 2 est donc la démodulation : extraire le signal informatif basse fréquence (l'enveloppe) de l'onde déjà sélectionnée en fréquence par l'étage 1 (le circuit bouchon du rung 5).
      - id: q2
        stem: |-
          **(0,75 pt)** Trouver la valeur $C_1$ à laquelle il faut ajuster la capacité $C$ pour capter le signal modulé de fréquence $f_p = 162\ \text{kHz}$ sachant que $L = 2\ \text{mH}$ (on prend $\pi^2 = 10$).
        reasoning: |-
          On connaît déjà, du rung 5, la condition d'accord $f_0 = 1/(2\pi\sqrt{LC})$ et le geste qui en découle : on isole $C$ pour obtenir la capacité qui place $f_0$ exactement sur la porteuse qu'on veut capter — exactement l'exemple numérique du rung 5, mais ici avec une bobine et une porteuse différentes, et $\pi^2 = 10$ imposé par l'énoncé (au lieu de la valeur usuelle $\pi^2 \approx 9{,}87$) pour simplifier le calcul à la main.
        steps:
          - math: 'f_0 = \frac{1}{2\pi\sqrt{LC}} \quad\Longrightarrow\quad C = \frac{1}{(2\pi f_0)^2\,L} = \frac{1}{4\pi^2 f_0^2 L}'
            note: "On isole C dans la condition d'accord (rung 5), comme dans l'exemple numerique du rung."
          - math: 'C_1 = \frac{1}{4\pi^2\,f_p^2\,L}, \qquad f_p = 162\times10^{3}\ \text{Hz}, \quad L = 2\times10^{-3}\ \text{H}, \quad \pi^2 = 10'
            note: "On accorde le circuit sur la porteuse a capter (f0 = fp) ; valeurs de l'enonce, pi^2 = 10 impose."
          - math: '(162\times10^{3})^2 = 2{,}6244\times10^{10}\ \text{Hz}^2'
            note: "Calcul intermediaire du carre de la frequence."
          - math: 'C_1 = \frac{1}{4\times10\times2{,}6244\times10^{10}\times2\times10^{-3}} \approx 4{,}76\times10^{-10}\ \text{F}'
            note: "Application numerique."
          - math: '\boxed{C_1 \approx 4{,}76\times10^{-10}\ \text{F} \approx 476\ \text{pF}}'
            note: "Ordre de grandeur realiste d'un condensateur d'accord (rung 5)."
      - id: q3
        stem: |-
          **(0,5 pt)** La fréquence du signal modulant est $f_s = 5\ \text{kHz}$. Si on ajuste $R$ à la valeur $R_0 = 1{,}5\ \text{k}\Omega$, aura-t-on une démodulation de bonne qualité ? Justifier.
        reasoning: |-
          Au rung 4, le détecteur de crête ne retrace fidèlement l'enveloppe que si sa décharge, entre deux sommets de la porteuse, respecte un compromis : assez lente pour ne pas redescendre avant le sommet suivant de la porteuse (donc la constante de temps $R_0C_0$ doit être grande devant la période de la porteuse, $1/f_p$), mais assez rapide pour ne pas rater les variations de l'enveloppe elle-même (donc $R_0C_0$ doit rester petit devant la période du signal modulant, $1/f_s$). Le rung 4 décrit ce compromis en mots (« charge rapide, décharge lente [qui] rattrape le sommet suivant ») ; ici on le teste numériquement, avec $C_0 = 1\ \mu\text{F}$ — la valeur fixée dans la Partie 1 du même sujet (rc-charge.md, sujet 2025 session normale, vérifié), puisque l'énoncé de cette Partie 3 renvoie explicitement au condensateur « précédemment utilisé » sans en redonner la valeur ici.
        steps:
          - math: 'R_0 C_0 = 1{,}5\times10^{3} \times 1\times10^{-6} = 1{,}5\times10^{-3}\ \text{s}'
            note: "Constante de temps du detecteur de crete, avec C0 = 1 microF (Partie 1 du meme sujet, rc-charge.md, verifie)."
          - math: '\frac{1}{f_p} = \frac{1}{162\times10^{3}} \approx 6{,}2\times10^{-6}\ \text{s} \qquad \frac{1}{f_s} = \frac{1}{5\times10^{3}} = 2{,}0\times10^{-4}\ \text{s}'
            note: "Les deux bornes du critere : periode de la porteuse et periode du signal modulant."
          - math: 'R_0C_0 = 1{,}5\times10^{-3}\ \text{s} \gg \frac{1}{f_p} = 6{,}2\times10^{-6}\ \text{s}'
            note: "Premiere borne respectee : la decharge est bien lente devant la porteuse."
          - math: 'R_0C_0 = 1{,}5\times10^{-3}\ \text{s} \not\ll \frac{1}{f_s} = 2{,}0\times10^{-4}\ \text{s} \qquad (R_0C_0 > 1/f_s)'
            note: "Seconde borne violee : la decharge est trop lente pour suivre l'enveloppe."
          - math: '\boxed{R_0C_0 > \frac{1}{f_s} \implies \text{demodulation de mauvaise qualite} \implies \text{reponse : non}}'
            note: "La double inegalite du rung 4 n'est pas verifiee sur sa borne haute ; la reponse est non."
