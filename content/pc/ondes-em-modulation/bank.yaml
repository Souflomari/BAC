          - math: 'u_{GM} \;\longrightarrow\; \text{courbe (a)}'
            note: "Noeud G, apres la diode et le filtre C2/R2 : l'enveloppe AVEC sa composante continue. Courbe entierement au-dessus de l'axe, valeur moyenne environ +2 divisions."
