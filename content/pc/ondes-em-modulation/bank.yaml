        porteuse $u_1$, et non la modulante $u_2$, qui porte la plus grande
        amplitude crête à crête) ; (3) re-lecture indépendante des figures
        par un troisième agent (passe 3, 2026-08-06), sans réutiliser le
        relevé de la passe 2 : quadrillage $10\times8$ divisions retrouvé
        indépendamment, porteuse $u_1$ mesurée de $-1{,}48$ à $+1{,}51$
        division (soit $3{,}0$ div crête à crête, centrée sur l'axe),
        modulante $u_2$ mesurée entre les traits $+1{,}00$ et $+2{,}00$
        division (soit $1{,}0$ div crête à crête, moyenne $+1{,}5$ div) —
        correction de la passe 2 confirmée par mesure indépendante. Figure 5
        (schéma du multiplieur) jugée fidèle au zoom aux passes 1 et 3.
        Drapeau « lecture à confirmer » partiellement levé : les amplitudes
        sont lisibles exactement sur le quadrillage (levé pour ce point) ;
        le comptage exact des oscillations de la porteuse ($\simeq3$ par
        division, $\simeq30$ à l'écran) reste une lecture fine sur un tracé
        très resserré, et le drapeau est maintenu sur ce seul point —
        conservé tel quel ci-dessous. SCOPE NOTE (questions q2a/q2b) : voir
        la note éditoriale en tête de fichier — ce sujet fait lire $F_p$,
        $f_s$, $S_m$ et $U_0$ directement sur les deux voies d'entrée
