    intro: |-
      **Modulation d'amplitude d'un signal (examen national, session normale 2021, Exercice IV — Partie III).**

      Pour obtenir un signal modulé en amplitude, on réalise le montage représenté sur le schéma de la figure 5 où le multiplieur $X$ est un circuit intégré possédant deux entrées $E_1$ et $E_2$ et une sortie $S$.

      On applique :
      - sur l'entrée $E_1$ une tension $u_1(t)$ ayant pour expression $u_1(t) = P_m \cos(2\pi F_p.t)$ ;
      - sur l'entrée $E_2$ une tension $u_2(t)$ ayant pour expression $u_2(t) = U_0 + s(t)$ où $s(t) = S_m \cos(2\pi f_s.t)$ est la tension modulante et $U_0$ est la composante continue de cette tension.

      On obtient à la sortie $S$ du multiplieur $X$ une tension $u_s(t)$ modulée en amplitude. On visualise la tension $u_1(t)$ sur la voie A de l'oscilloscope et la tension $u_2(t)$ sur la voie B (figure 6).

      **Données.** Sensibilité verticale : $1\ \text{V/div}$. Sensibilité horizontale : $2\ \text{ms/div}$.

      **Figure 5 (schéma).** Cadre englobant, à l'intérieur duquel le multiplieur $X$ est représenté par un rectangle étiqueté « X ». Deux lignes horizontales entrent par la gauche dans le rectangle : la ligne supérieure, étiquetée $E_1$, reliée par une flèche verticale montante $u_1$ à un rail de masse en bas du cadre ; la ligne inférieure, étiquetée $E_2$, reliée par une flèche verticale montante $u_2$ au même rail de masse. Une ligne horizontale sort par la droite du rectangle, étiquetée $S$, reliée par une flèche verticale montante $u_s$ au rail de masse. Le rail de masse porte le symbole de terre (hachures) en son milieu.

      **Figure 6 (oscillogramme).** Écran d'oscilloscope quadrillé de **10 divisions en largeur et 8 divisions en hauteur**, avec un axe vertical central et un axe horizontal central. Deux tracés superposés, étiquetés « $u_2(t)$ » (en haut) et « $u_1(t)$ » (en bas) en bordure droite de l'écran :

      - $u_1(t)$ — la **porteuse** : oscillation très rapide et très resserrée occupant toute la largeur de l'écran, **centrée sur l'axe horizontal central** et d'amplitude **$1,5$ division** (le faisceau s'étend exactement de $-1{,}5$ à $+1{,}5$ division, soit $3{,}0$ divisions crête à crête). Elle compte environ $3$ oscillations par division, soit une trentaine sur la largeur de l'écran *(comptage exact des oscillations — lecture à confirmer)*.
      - $u_2(t)$ — la **modulante décalée** : oscillation nettement plus lente et de plus faible amplitude que la porteuse, entièrement située au-dessus de l'axe horizontal central, oscillant **exactement entre les traits $+1$ et $+2$ divisions** (soit $1,0$ division crête à crête, autour d'un niveau moyen de $+1,5$ division). Sa période vaut environ $4$ divisions.
    questions:
      - id: q1
        part: "III- Modulation d'amplitude d'un signal : définir et exploiter la courbe"
        stem: |-
          **(0,25 pt)** Définir la modulation d'amplitude.
        reasoning: |-
          La définition attendue est celle du rung 2 : la modulation d'amplitude consiste à faire varier, au rythme du signal informatif basse fréquence $s(t)$, l'amplitude d'une tension porteuse sinusoïdale — tout en gardant sa fréquence $F_p$ rigoureusement constante. Ici il ne s'agit pas d'un calcul mais de restituer clairement les deux idées du rung 2 : ce qui varie (l'amplitude instantanée $U_0+s(t)$, qui suit fidèlement $s(t)$) et ce qui ne varie jamais (la fréquence $F_p$ de l'oscillation rapide).

          La modulation d'amplitude est le procédé qui consiste à faire varier l'amplitude d'une tension porteuse sinusoïdale de fréquence fixe $F_p$, au rythme d'un signal informatif basse fréquence $s(t)$, la fréquence de l'oscillation rapide restant, elle, inchangée.
      - id: q2a
        part: "Déterminer graphiquement"
        stem: |-
          **(0,5 pt)** Déterminer graphiquement les fréquences $F_p$ et $f_s$.
        reasoning: |-
          Deux voies distinctes coexistent sur la figure 6 — exactement la distinction du rung 3 entre oscillation rapide (porteuse $u_1$) et oscillation lente (modulante $u_2$), mais ici lues chacune directement sur son propre tracé plutôt que sur l'enveloppe d'un signal unique (le sujet 2017 N ci-dessus, lui, procédait par enveloppe). Pour $f_s$, on lit la période de $u_2$ en divisions, convertie avec la sensibilité horizontale donnée ($2\ \text{ms/div}$). Pour $F_p$, on compte le nombre d'oscillations de $u_1$ sur une division puis on convertit en fréquence — un comptage fin, la source elle-même le signale comme une lecture délicate sur un tracé aussi resserré.
        steps:
          - math: 'T_s \approx 4\ \text{div} \times 2\ \text{ms/div} = 8\ \text{ms}'
            note: "Periode de u2 (modulante) lue sur la figure 6, convertie avec la sensibilite horizontale (2 ms/div)."
          - math: 'f_s = \frac{1}{T_s} = \frac{1}{8\times10^{-3}} \approx 125\ \text{Hz}'
            note: "Frequence de la tension modulante."
          - math: 'F_p \approx 3\ \text{oscillations/div} \times \frac{10\ \text{div}}{20\ \text{ms}} = \frac{30}{20\times10^{-3}} = 1500\ \text{Hz}'
            note: "Comptage des oscillations de u1 (porteuse) sur l'ecran entier (10 div = 20 ms) ; lecture fine, drapeau maintenu dans la source."
      - id: q2b
        stem: |-
          **(0,5 pt)** Déterminer graphiquement la valeur de $S_m$ et celle de $U_0$.
        reasoning: |-
          Sur la figure 6, l'oscillation $u_2$ (la modulante décalée) oscille entre les traits $+1$ et $+2$ division — sa valeur moyenne donne directement la composante continue $U_0$ (rung 2 : $u_2(t)=U_0+s(t)$), et l'écart entre son maximum et cette moyenne donne l'amplitude $S_m$ de la partie variable $s(t)$. La sensibilité verticale ($1\ \text{V/div}$) convertit ces divisions en volts.
        steps:
          - math: 'U_0 = \frac{2{,}00 + 1{,}00}{2}\ \text{div} \times 1\ \text{V/div} = 1{,}5\ \text{V}'
            note: "Valeur moyenne de u2 (rung 2 : U0 est la composante continue) ; sensibilite verticale 1 V/div."
          - math: 'S_m = (2{,}00 - 1{,}5)\ \text{div} \times 1\ \text{V/div} = 0{,}5\ \text{V}'
            note: "Ecart entre le maximum de u2 et sa valeur moyenne U0."
      - id: q3
        stem: |-
          **(0,5 pt)** La modulation réalisée dans ce cas sera-t-elle de bonne qualité ? Justifier votre réponse.
        reasoning: |-
          Les deux conditions de bonne modulation du rung 3 se re-testent ici avec les valeurs lues aux questions précédentes. D'abord $F_p \gg f_s$ : la porteuse doit osciller beaucoup plus vite que la modulante pour que l'enveloppe se dessine nettement — sans cette condition, il n'y aurait pas assez d'oscillations de porteuse par cycle de modulante pour tracer une enveloppe lisible. Ensuite $m = S_m/U_0 < 1$ : l'amplitude instantanée $U_0+s(t)$ doit rester positive à tout instant, sans quoi l'oscillation rapide change brutalement de phase et l'enveloppe ne reproduit plus fidèlement le signal — c'est la surmodulation. On vérifie les deux avec $F_p \approx 1500\ \text{Hz}$, $f_s \approx 125\ \text{Hz}$, $S_m = 0{,}5\ \text{V}$ et $U_0 = 1{,}5\ \text{V}$.
        steps:
          - math: '\frac{F_p}{f_s} = \frac{1500}{125} = 12 \gg 1'
            note: "Premiere condition du rung 3 : la porteuse oscille bien plus vite que la modulante."
          - math: 'm = \frac{S_m}{U_0} = \frac{0{,}5}{1{,}5} = \frac{1}{3} \approx 0{,}33 < 1'
            note: "Seconde condition du rung 3 : taux de modulation inferieur a 1, pas de surmodulation."
          - math: '\boxed{\text{les deux conditions sont verifiees} \implies \text{bonne modulation}}'
            note: "Conclusion : Fp >> fs et m < 1 sont toutes deux respectees."
