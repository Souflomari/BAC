      *La première partie du même exercice est indépendante — le sujet l'écrit — et vit ailleurs : l'étude du circuit idéal LC (3,00 pt) sous « Circuit RLC série », entrée bk-2012-r-x3. 3,00 + 2,00 = 5,00, le barème imprimé.*

      Pour recevoir une onde issue d'une station de diffusion, on utilise le dispositif simplifié, qui est constitué de **trois parties** comme l'indique la **figure 3**.

      **Figure 3 — le dispositif de réception, re-décrit depuis l'image.** Schéma en **trois cadres en tirets** juxtaposés, partageant un **rail horizontal de masse en bas** et un **rail de signal en haut**. Les trois cadres sont légendés, sous le schéma, **Partie 1**, **Partie 2**, **Partie 3**, de gauche à droite.

      - **Partie 1** *(cadre gauche)* : une **antenne** en Y au-dessus du cadre, descendant sur le nœud $E$ du rail haut. Entre le rail haut et le rail bas, **en parallèle** : une **bobine** (arches verticales, barrée d'une **flèche oblique** — son inductance est **ajustable**) et un **condensateur $C_1$**.
      - **Partie 2** *(cadre milieu)* : sur le rail haut, une **diode $D$** (triangle + barre, pointe vers la droite) entre $E$ et le nœud $F$ ; de $F$ au rail bas, un **condensateur $C_2$** ; plus à droite, le nœud $G$, avec un **résistor $R_2$** de $G$ au rail bas. Sur le rail bas, sous $C_2$, le nœud $M$ porte le **symbole de masse**.
      - **Partie 3** *(cadre droit)* : un **condensateur $C_3$ en SÉRIE** sur le rail haut, entre $G$ et le nœud $H$ ; de $H$ au rail bas, un **résistor $R_3$**. Les deux rails se prolongent en tirets vers la droite — c'est la sortie.

      *Nœuds étiquetés : $E$ (partie 1), $F$ et $G$ (partie 2), $H$ (partie 3), $M$ (la masse). Les trois tensions de la question 3 se lisent toutes par rapport à $M$.*

      ---

      **Les trois écrans d'oscilloscope de la question 3, re-décrits depuis les images.** Trois écrans identiques, cadre gris arrondi, quadrillage **8 divisions en hauteur × 10 en largeur**, avec un **axe horizontal médian** et un **axe vertical médian** en pointillés fins. Étiquetés **(a)**, **(b)**, **(c)** de gauche à droite.

      | Écran | Ce qu'on voit | Position verticale | Amplitude | Période |
      |---|---|---|---|---|
      | **(a)** | une sinusoïde **entièrement au-dessus** de l'axe médian | sommets $+2{,}93$ div, creux $+1{,}00$ div, **valeur moyenne $+1{,}97$ div** | $0{,}97$ div | $\approx 5{,}1$ div |
      | **(b)** | un signal **haute fréquence** dont **l'amplitude est modulée** | centré sur $0$ | enveloppe : demi-amplitude max $\approx 3{,}3$ div, min $\approx 1{,}5$ div | enveloppe $\approx 5{,}2$ div ; porteuse $\approx 0{,}51$ div |
      | **(c)** | une sinusoïde **centrée** sur l'axe médian | milieu $-0{,}01$ div | $0{,}97$ div | $\approx 5{,}1$ div |

      ⚠️ **Aucun de ces trois écrans ne porte de base de temps ni de sensibilité verticale** — ni dans l'édition française, ni dans l'original arabe. **Aucune fréquence et aucune tension ne peut en être tirée**, et aucune question ne le demande : la question 3 est une association purement qualitative. Les chiffres ci-dessus sont donnés **en divisions**, pour te permettre de comparer les trois courbes entre elles — c'est tout ce dont tu as besoin.
    questions:
      - id: q1
        part: "Electricité, Deuxième partie — Réception d'une onde AM et démodulation"
        stem: |-
          **1-** La partie 1 est constituée d'une antenne reliée à un circuit parallèle, constitué d'une bobine d'inductance ajustable et de résistance négligeable et d'un condensateur de capacité $C_1 = 4{,}7\times10^{-10}\ \text{F}$.

          **1-1-** (0,25 pt) Quel est le rôle de la partie 1 ?
        reasoning: |-
          La partie 1 est un **circuit bouchon** — une bobine et un condensateur **en parallèle** — relié à l'antenne. Son rôle est la **SÉLECTION** : parmi toutes les ondes que l'antenne capte simultanément, il ne retient que celle dont la fréquence est égale à sa propre **fréquence propre**. C'est l'**accord** sur une station (chapitre 6).

          **Pourquoi il faut un tel étage, et c'est le point de fond.** Une antenne est un capteur **aveugle** : elle reçoit en même temps toutes les ondes électromagnétiques qui passent — toutes les stations de la bande, plus le bruit. Sans filtre, on entendrait tout à la fois, donc rien. Le circuit bouchon résout ce problème parce que son **impédance est maximale à sa fréquence propre** : à cette fréquence-là, et à elle seule, une tension notable apparaît à ses bornes ; toutes les autres sont court-circuitées vers la masse.

          **Et c'est là qu'intervient la bobine ajustable, dont la flèche oblique sur le schéma n'est pas décorative.** La fréquence propre vaut $f_0 = \dfrac{1}{2\pi\sqrt{L_1C_1}}$ : faire varier $L_1$ fait varier $f_0$, donc **change de station**. C'est physiquement le bouton de recherche d'un poste de radio. La question 1-2 va justement demander de calculer le $L_1$ qui accorde le récepteur sur une station donnée.

          **Le piège de cette question.** Répondre « elle démodule » ou « elle détecte l'enveloppe ». La partie 1 **ne démodule rien** : elle ne fait que choisir la fréquence porteuse à laisser passer. La démodulation, c'est-à-dire l'extraction du signal informatif, est le travail des parties **2** et **3** — et c'est exactement le point que la question 2 va rendre confus (voir l'avertissement qui y est porté). Retenir dès maintenant que **partie 1 = sélection** évite d'y perdre des points.
      - id: q2
        stem: |-
          **1-2-** (0,5 pt) Pour recevoir une onde AM de fréquence $f = 160\ \text{KHz}$ *(sic — le préfixe kilo s'écrit avec un k minuscule ; le K majuscule désigne le kelvin. L'original arabe imprime correctement « 160 kHz ». Sans conséquence sur le calcul)*, on fixe l'inductance de la bobine sur la valeur $L_1$.

          Calculer $L_1$.
        reasoning: |-
          **La condition à écrire, et c'est toute la question.** Recevoir une station, c'est **accorder** le circuit bouchon sur sa fréquence : sa fréquence propre doit être égale à la fréquence de l'onde reçue (chapitre 6).

          $$f = f_0 = \frac{1}{2\pi\sqrt{L_1 C_1}}$$

          On isole $L_1$ en élevant d'abord au carré, exactement comme pour la période propre :

          $$f^2 = \frac{1}{4\pi^2 L_1 C_1} \qquad \Longrightarrow \qquad \boxed{L_1 = \frac{1}{4\pi^2 f^2 C_1}}$$

          **L'application numérique, en convertissant la fréquence d'abord** — $f = 160\ \text{kHz} = 1{,}60\times10^{5}\ \text{Hz}$, et $C_1 = 4{,}7\times10^{-10}\ \text{F}$ :

          $$L_1 = \frac{1}{4\pi^2 \times \left(1{,}60\times10^{5}\right)^2 \times 4{,}7\times10^{-10}} = \frac{1}{4{,}75\times10^{2}} \approx 2{,}1\times10^{-3}\ \text{H} = 2{,}1\ \text{mH}$$

          **Le contrôle de vraisemblance, qui vaut d'être fait.** Quelques millihenrys pour un circuit d'accord de radio grandes ondes : c'est l'ordre de grandeur réel d'une bobine de récepteur AM. Et le recoupement est encore plus parlant si l'on compare à la première partie de cet exercice : là-bas, un condensateur de $4{,}7\ \text{mF}$ et une bobine de $0{,}485\ \text{H}$ oscillaient à $3{,}3\ \text{Hz}$ ; ici, un condensateur **dix millions de fois plus petit** et une bobine **deux cents fois plus petite** oscillent à $160\ \text{kHz}$. Les deux circuits obéissent à la même formule — c'est le même $\frac{1}{2\pi\sqrt{LC}}$ —, ce qui change n'est que l'échelle des composants.

          **Les deux pièges de cette question.** Le premier : **oublier de convertir les kilohertz**, et calculer avec $f = 160$. Le résultat sort alors $10^{6}$ fois trop grand — $2{,}1\times10^{3}\ \text{H}$, une bobine impossible. Le second : **oublier le carré sur $f$** ou le $4\pi^2$ ; on part de $f_0 = \dfrac{1}{2\pi\sqrt{L_1C_1}}$ et l'on élève **les deux membres au carré avant** d'isoler, ce qui fait apparaître $4\pi^2$ et $f^2$ ensemble. Aucune des deux fautes ne se voit sans contrôle d'ordre de grandeur.
        steps:
          - math: 'f = f_0 = \frac{1}{2\pi\sqrt{L_1 C_1}}'
            note: "Condition d'accord : la frequence propre du circuit bouchon egale la frequence de l'onde a recevoir (chapitre 6)."
          - math: '\boxed{L_1 = \frac{1}{4\pi^{2} f^{2} C_1}}'
            note: "On eleve les deux membres au carre AVANT d'isoler : c'est la que naissent le 4 pi carre et le f carre."
          - math: 'L_1 = \frac{1}{4\pi^{2} \times \left(1{,}60\times10^{5}\right)^{2} \times 4{,}7\times10^{-10}} = \frac{1}{4{,}75\times10^{2}}'
            note: "Application numerique. La frequence est convertie en hertz AVANT tout : 160 kHz = 1,60 x 10^5 Hz."
          - math: '\boxed{L_1 \approx 2{,}1\times10^{-3}\ \text{H} = 2{,}1\ \text{mH}}'
            note: "Valeur exacte 2,105 mH. Quelques millihenrys : l'ordre de grandeur reel d'une bobine d'accord de recepteur AM."
