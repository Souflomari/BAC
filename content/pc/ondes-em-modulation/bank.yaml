  # ── bk-2017-n-x3 — 2017 N, Exercice III (Partie II) : forme canonique et taux de modulation ──
  - id: bk-2017-n-x3
    title: "Modulation d'amplitude par circuit multiplieur : forme canonique et taux de modulation"
    source:
      year: 2017
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice III — Partie II — Modulation d'amplitude"
    bareme_total: 1.75
    duration_min: 11
    sourcing:
      status: sourced
      note: >-
        2017 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), code sujet NS28F, AlloSchool element/57711 (Exercice III,
        Partie II — modulation d'amplitude par circuit multiplieur ; barème
        de la partie = 1,75 pt sur les 5 pt de l'exercice complet, dont la
        Partie I — établissement et rupture du courant dans un dipôle RL —
        relève de dipole-rl.md, non transcrite là). Transcription vérifiée :
        re-fetch indépendant AlloSchool + diff OK (agent-vérificateur,
        docs/sujets/pc/ondes-em-modulation.md, statut « vérifié »,
        2026-07-11). Figure 4 (oscillogramme) transcrite avec sa réserve
        d'origine : la lecture d'échelle des extrema de l'enveloppe (3 V /
        1 V) est marquée « à confirmer » dans la source vérifiée ; conservée
        telle quelle ici, drapeau non levé pour ce sujet. La source vérifiée
        donne les repères d'abscisse (5 ms, 15 ms) mais ne détaille pas la
        période de l'oscillation rapide (porteuse) sur le scan ; comme dans
        exercises.yaml (r-bac, même sujet), on retient $T_p = 0{,}5$ ms
        (soit $F_p = 2$ kHz) pour que la question de lecture graphique reste
        posable au niveau TP décrit par l'énoncé — valeur reprise à
        l'identique de r-bac, pas re-dérivée indépendamment ici.
        RECOUPEMENT ASSUMÉ avec le sommet de leçon r-bac (exercises.yaml,
        marqueur exercise r-bac à R6) — voir la note éditoriale en tête de
        fichier.
    intro: |-
      **Modulation d'amplitude (examen national, session normale 2017, Exercice III — Partie II).**

      Pour étudier la modulation d'amplitude et vérifier la qualité de la modulation, au cours d'une séance de TP, le professeur a utilisé avec ses élèves, un circuit intégré multiplieur $(X)$ en appliquant une tension sinusoïdale $u_1(t) = P_m \cos(2\pi F_p\,t)$ à son entrée $E_1$ et une tension $u_2(t) = U_0 + s(t)$ à son entrée $E_2$, avec $U_0$ la composante continue de la tension et $s(t) = S_m \cos(2\pi f_s\,t)$ la tension modulante (figure 3).

      La courbe de la figure 4 représente la tension de sortie $u_s(t) = k\,u_1(t)\,u_2(t)$, visualisée par les élèves sur l'écran d'un oscilloscope. $k$ est une constante positive caractérisant le multiplieur $X$.

      **Figure 3 (schéma).** Circuit intégré multiplieur $(X)$ (symbole $\times$) avec deux entrées, $E_1$ (tension $u_1(t)$) et $E_2$ (tension $u_2(t)$), et une sortie $S$ (tension $u_s(t)$), le montage étant relié à la masse.

      **Figure 4 (oscillogramme).** $u_s\ (\text{V})$ en fonction de $t\ (\text{ms})$ ; signal modulé en amplitude (enveloppe sinusoïdale) ; ordonnées graduées de $-3$ à $+3$ ; axe des abscisses marqué aux valeurs $5$ et $15\ \text{ms}$. Amplitude maximale de l'enveloppe $\approx 3\ \text{V}$ et minimale $\approx 1\ \text{V}$ *(lecture d'échelle à confirmer)*.
    questions:
      - id: q1
        part: "Partie II — Modulation d'amplitude : établir la forme canonique"
        stem: |-
          **(0,75 pt)** Montrer, en précisant les expressions de $A$ et de $m$, que la tension $u_s(t)$ s'écrit sous la forme :

          $$u_s(t) = A\left[1 + m \cos(2\pi f_s\,t)\right]\cos(2\pi F_p\,t)$$
        reasoning: |-
          Comme au rung 2 (la forme générale $s(t)=(U_0+s_m(t))\cos(2\pi f_p t)$), l'enjeu n'est pas de résoudre une équation mais de reconnaître la même structure dans le produit du multiplieur. On part de la définition $u_s = k\,u_1\,u_2$, on remplace $u_1$ et $u_2$ par leurs expressions, puis on met en facteur la composante continue $U_0$ à l'intérieur de $u_2$ — exactement le geste du rung 2. C'est cette mise en facteur qui fait apparaître d'un bloc l'amplitude globale $A$ (tout ce qui multiplie l'oscillation rapide $\cos(2\pi F_p t)$) et le taux de modulation $m$ (le rapport $S_m/U_0$, défini au rung 3). Il ne reste plus qu'à identifier terme à terme avec la forme canonique demandée.
        steps:
          - math: 'u_s(t) = k\,u_1(t)\,u_2(t) = k\,P_m\cos(2\pi F_p\,t)\left[U_0 + S_m\cos(2\pi f_s\,t)\right]'
            note: "Definition du multiplieur (enonce) : on remplace u1 et u2 par leurs expressions."
          - math: 'U_0 + S_m\cos(2\pi f_s\,t) = U_0\left[1 + \frac{S_m}{U_0}\cos(2\pi f_s\,t)\right]'
            note: "Mise en facteur de U0 (rung 2) : c'est ce geste qui fait apparaitre A et m."
          - math: 'u_s(t) = \underbrace{k\,P_m\,U_0}_{A}\left[1 + \underbrace{\frac{S_m}{U_0}}_{m}\cos(2\pi f_s\,t)\right]\cos(2\pi F_p\,t)'
            note: "On reporte : la forme canonique demandee apparait, avec A et m identifies."
          - math: '\boxed{A = k\,P_m\,U_0 \qquad m = \frac{S_m}{U_0}}'
            note: "Reponse aux deux expressions demandees."
      - id: q2
        part: "En exploitant la courbe de la figure 4"
        stem: |-
          **(0,5 pt)** Trouver les fréquences $F_p$ de la porteuse et $f_s$ de la tension modulante.
        reasoning: |-
          Deux échelles de temps distinctes coexistent sur l'oscillogramme — précisément la distinction faite au rung 3 entre l'oscillation rapide (la porteuse, $F_p$) et l'enveloppe lente (la modulante, $f_s$). L'enveloppe accomplit une période complète entre les deux repères donnés sur l'axe des abscisses ; cette durée donne $T_s$, d'où $f_s = 1/T_s$. La porteuse, elle, est l'oscillation la plus rapide sous l'enveloppe ; sa période $T_p$ se lit séparément, sur un intervalle bien plus court, et donne $F_p = 1/T_p$.
        steps:
          - math: 'T_s = t_2 - t_1 = 15\ \text{ms} - 5\ \text{ms} = 10\ \text{ms} = 10\times10^{-3}\ \text{s}'
            note: "Periode de l'enveloppe (rung 3), lue entre les deux reperes de l'axe des abscisses."
          - math: 'f_s = \frac{1}{T_s} = \frac{1}{10\times10^{-3}} = 100\ \text{Hz}'
            note: "Frequence de la tension modulante."
          - math: 'F_p = \frac{1}{T_p} = \frac{1}{0{,}5\times10^{-3}} = 2000\ \text{Hz} = 2\ \text{kHz}'
            note: "Frequence de la porteuse, a partir de Tp = 0,5 ms (valeur reprise de r-bac ; la figure verifiee ne detaille pas ce comptage fin)."
      - id: q3
        stem: |-
          **(0,5 pt)** Déterminer le taux de modulation et en déduire la qualité de modulation.
        reasoning: |-
          L'enveloppe supérieure de la figure 4 vaut $A(1+m)$ à son maximum et $A(1-m)$ à son minimum — c'est directement la lecture de la forme établie à la question 1, prise à $\cos(2\pi f_s t) = +1$ puis $-1$. Le rapport de ces deux extrema élimine $A$ et ne laisse que $m$, sans qu'il soit nécessaire de connaître $A$ séparément. La qualité se tranche ensuite au seul critère du rung 3 : $m < 1$ signe une bonne modulation, $m \geq 1$ une surmodulation.
        steps:
          - math: 'U_{s,\max} = A(1+m) = 3\ \text{V} \qquad U_{s,\min} = A(1-m) = 1\ \text{V}'
            note: "Lecture des extrema de l'enveloppe sur la figure 4 (drapeau d'echelle a confirmer, conserve)."
          - math: 'm = \frac{U_{s,\max} - U_{s,\min}}{U_{s,\max} + U_{s,\min}} = \frac{3-1}{3+1} = 0{,}5'
            note: "Le rapport des extrema elimine A (rung 3) ; il ne reste que m."
          - math: '\boxed{m = 0{,}5 < 1 \implies \text{bonne modulation}}'
            note: "Critere du rung 3 : m < 1, l'enveloppe reste positive et fidele au signal modulant."

  # ── bk-2021-n-x4 — 2021 N, Exercice IV (Partie III) : lecture d'un oscillogramme a deux voies ──
  - id: bk-2021-n-x4
    title: "Modulation d'amplitude d'un signal : lecture d'un oscillogramme à deux voies"
    source:
      year: 2021
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice IV — III- Modulation d'amplitude d'un signal"
    bareme_total: 1.75
    duration_min: 11
    sourcing:
      status: sourced
      note: >-
        2021 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), code NS 28F, AlloSchool element/127287 (Exercice IV, Partie
        III — modulation d'amplitude par circuit multiplieur, oscilloscope
        visualisant les deux tensions d'entrée $u_1(t)$/$u_2(t)$ plutôt que
        la sortie ; barème de la partie = 1,75 pt sur les 4,75 pt de
