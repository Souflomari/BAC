    intro: |-
      **Sélection et démodulation d'une onde modulée en amplitude (examen national, session normale 2025, Exercice 3 — Partie 3).**

      On utilise une chaîne électronique simplifiée représentée sur la figure 4 pour sélectionner et démoduler une onde électromagnétique modulée en amplitude.

      Dans cette chaîne on utilise une diode $D$ considérée idéale, la bobine $(b)$ (supposée aussi idéale) et le condensateur de capacité $C_0$ précédemment utilisé.

      **Figure 4 (schéma).** Chaîne électronique en deux étages encadrés en pointillés, avec deux blocs « Amplification » intercalés. **Étage 1** (à gauche) : une antenne — un mât vertical surmonté d'un V ouvert vers le haut (deux traits obliques divergents) — alimente un circuit formé de la bobine $(b)$ (spires) montée en parallèle avec un condensateur variable $C$ (symbole de capacité réglable) ; la sortie entre dans le premier bloc « Amplification ». **Étage 2** (à droite du premier bloc) : le signal entre par une diode $D$ (triangle + barre, pointe vers la droite) jusqu'au nœud $B$ ; de $B$, un rhéostat $R$ descend vers la masse $M$ ; le fil continue vers le nœud $N$, d'où le condensateur $C_0$ descend également vers $M$ ; le fil continue à travers le condensateur $C_2$ (monté en série) jusqu'à un dernier nœud d'où $R_2$ descend vers $M$ ; la sortie de l'étage 2 entre dans le second bloc « Amplification », dont la sortie porte la flèche « HP » (haut-parleur). Légendes : « Étage 1 », « Étage 2 », « Figure 4 ».
