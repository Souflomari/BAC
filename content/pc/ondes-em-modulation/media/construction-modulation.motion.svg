  <text x="96" y="524" font-size="10" fill="var(--figure-ink)">
    enveloppe : U<tspan dy="2" font-size="7">0</tspan><tspan dy="-2">+s</tspan><tspan dy="2" font-size="7">m</tspan><tspan dy="-2">(t) — l'information transmise</tspan>
