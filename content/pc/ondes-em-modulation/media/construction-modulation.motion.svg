       porteuse (Δx=240 px / demi-période). Baseline y=228, pic y=204 (t=0),
       creux y=252 (mi-période), retour au pic y=204. Ink-soft : l'ingrédient,
       pas encore le résultat. -->
  <path id="p2-curve"
        d="M112,204
           C155.2,204 203.2,211.5 232,228
           C260.8,244.5 308.8,252 352,252
           C395.2,252 443.2,244.5 472,228
           C500.8,211.5 548.8,204 592,204"
