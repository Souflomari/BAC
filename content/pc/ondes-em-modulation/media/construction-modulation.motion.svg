    <line x1="108" y1="338" x2="116" y2="338"
          stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="98" y="342" text-anchor="end" font-size="9"
          fill="var(--figure-ink-soft)">U<tspan dy="2" font-size="6.5">0</tspan></text>
  </g>

  <!-- Porteuse modulée s(t) — même 12 demi-périodes (mêmes x_k) que le panel 1,
       mais l'amplitude à chaque extremum suit E_k = U0+S_m·cos(30k°). Baseline
       y=386. Ink : c'est physiquement LA MÊME porteuse qu'au panel 1, dont
       seule l'amplitude varie maintenant. -->
  <path id="p3-curve"
        d="M112,314
           C119.2,314 127.2,336.5 132,386
           C136.8,433.29 144.8,454.78 152,454.78
           C159.2,454.78 167.2,433.29 172,386
           C176.8,344.75 184.8,326 192,326
           C199.2,326 207.2,344.75 212,386
           C216.8,419 224.8,434 232,434
           C239.2,434 247.2,419 252,386
           C256.8,361.25 264.8,350 272,350
           C279.2,350 287.2,361.25 292,386
           C296.8,404.71 304.8,413.22 312,413.22
           C319.2,413.22 327.2,404.71 332,386
           C336.8,369.5 344.8,362 352,362
           C359.2,362 367.2,369.5 372,386
           C376.8,404.71 384.8,413.22 392,413.22
           C399.2,413.22 407.2,404.71 412,386
           C416.8,361.25 424.8,350 432,350
           C439.2,350 447.2,361.25 452,386
           C456.8,419 464.8,434 472,434
           C479.2,434 487.2,419 492,386
           C496.8,344.75 504.8,326 512,326
           C519.2,326 527.2,344.75 532,386
           C536.8,433.29 544.8,454.78 552,454.78
           C559.2,454.78 567.2,433.29 572,386
           C576.8,336.5 584.8,314 592,314"
        fill="none"
        stroke="var(--figure-ink)"
        stroke-width="2.2"
        stroke-linejoin="round"
        opacity="0"/>

  <!-- Doublon atténué de la porteuse — introduit seulement au beat 3 (slot
       "carrier-emphasis" du mécanisme `replace` : #p3-curve sort, celui-ci
       entre). MÊME tracé, ink-soft, trait plus fin : la porteuse "s'efface"
       pour laisser l'enveloppe seule à l'avant-plan. -->
  <path id="p3-curve-dim"
        d="M112,314
           C119.2,314 127.2,336.5 132,386
           C136.8,433.29 144.8,454.78 152,454.78
           C159.2,454.78 167.2,433.29 172,386
           C176.8,344.75 184.8,326 192,326
           C199.2,326 207.2,344.75 212,386
           C216.8,419 224.8,434 232,434
           C239.2,434 247.2,419 252,386
