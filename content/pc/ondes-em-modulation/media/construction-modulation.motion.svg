  <!-- Enveloppe — haute (+E_k) et basse (-E_k), tracée en polyligne à travers
       les 13 mêmes x_k. Touche exactement chaque extremum de #p3-curve. -->
  <g id="p3-envelope" opacity="0">
    <polyline points="112,314 152,317.22 192,326 232,338 272,350 312,358.78 352,362 392,358.78 432,350 472,338 512,326 552,317.22 592,314"
