        stroke="var(--figure-ink-soft)"
        stroke-width="2.2"
        stroke-linejoin="round"
        opacity="0"/>

  <!-- ══════════════════════════════════════════════════════════════════════
       PANEL 3 — le produit modulé + son enveloppe, puis (beat 3) l'enveloppe
       isolée. Region: x:0 y:290 w:680 h:200.
       ══════════════════════════════════════════════════════════════════════ -->

  <rect id="p3-bg" x="90" y="298" width="550" height="176" rx="5"
        fill="var(--figure-grid)" opacity="0.35" style="opacity:0"/>

  <!-- Spotlight discret derrière l'enveloppe — introduit seulement au beat 3,
       jamais montré avant (aucun risque de préséance avec pulse-settle : ici
       un simple fade, from:none). Placé tôt dans le document pour rester
       DERRIÈRE la courbe et l'enveloppe. -->
  <rect id="p3-spotlight" x="100" y="310" width="530" height="148" rx="14"
        fill="var(--figure-accent)" fill-opacity="0.07" opacity="0"/>

  <g id="p3-axes" opacity="0">
    <line x1="112" y1="386" x2="602" y2="386"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="602,386 592,381.5 592,390.5" fill="var(--figure-ink-soft)"/>
    <line x1="112" y1="463" x2="112" y2="306"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="112,306 107,316.5 117,316.5" fill="var(--figure-ink-soft)"/>
    <text x="608" y="390" font-size="10.5" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="100" y="304" text-anchor="end" font-size="10.5" font-style="italic"
          fill="var(--figure-ink-soft)">s(t)</text>
    <text x="104" y="390" text-anchor="end" font-size="9.5"
