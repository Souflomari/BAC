  <path id="p1-curve"
        d="M112,60
           C119.2,60 127.2,75 132,108
           C136.8,141 144.8,156 152,156
           C159.2,156 167.2,141 172,108
           C176.8,75 184.8,60 192,60
           C199.2,60 207.2,75 212,108
           C216.8,141 224.8,156 232,156
           C239.2,156 247.2,141 252,108
           C256.8,75 264.8,60 272,60
           C279.2,60 287.2,75 292,108
           C296.8,141 304.8,156 312,156
           C319.2,156 327.2,141 332,108
           C336.8,75 344.8,60 352,60
           C359.2,60 367.2,75 372,108
           C376.8,141 384.8,156 392,156
           C399.2,156 407.2,141 412,108
           C416.8,75 424.8,60 432,60
           C439.2,60 447.2,75 452,108
