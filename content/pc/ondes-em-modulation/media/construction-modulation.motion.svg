<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540"
     font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
     aria-label="Construction de la tension modulée s(t) : la porteuse seule, le signal informatif seul, leur produit modulé (porteuse d'amplitude variable) avec son enveloppe, puis l'enveloppe isolée qui porte l'information transmise au récepteur.">
  <title>Construire s(t) : de la porteuse au signal modulé</title>

  <!--
    construction-modulation.motion.svg  (v1 — MotionStage engine, ADR 0022)
    ─────────────────────────────────────────────────────────────────────────
    Engine: MotionStage.tsx (GSAP DrawSVGPlugin for trace; fade for entrances
    and de-emphasis via the `replace` slot mechanism).

    CONCEPT: this notion's two static figures (modulation-amplitude,
    bonne-surmodulation) show the FINISHED modulated tension s(t). Neither can
    show it being BUILT from its two ingredients. This clip does exactly that,
    one beat at a time: porteuse seule -> signal seul -> leur produit (avec
    l'enveloppe qui apparaît) -> l'enveloppe isolée (ce que le récepteur doit
    retrouver). Supports R2's construction of s(t) = (U0+s_m(t))·cos(2π f_p t).

    MODEL (identical to modulation-amplitude.svg, same worked example — R2):
      u_p(t)  = U0 · cos(2π f_p t)                          (panel 1)
      s_m(t)  = S_m · cos(2π f_signal t)                    (panel 2)
      s(t)    = (U0 + s_m(t)) · cos(2π f_p t)                (panel 3)
      U0 = 6 V, S_m = 3 V  ->  m = S_m/U0 = 0,5 (bonne modulation, cf. R2/R3).
      Rapport f_p/f_signal RÉDUIT à 6 (au lieu de 300 dans le cours) pour que
      l'oeil distingue les cycles individuels de la porteuse — EXACTEMENT le
      même rapport réduit que modulation-amplitude.svg (voir son en-tête).
      Seul ce rapport est schématique ; U0, S_m et la forme de l'enveloppe
      sont physiquement exacts.

    CONSTRUCTION DES POINTS (même recette que modulation-amplitude.svg /
    regimes-uc.svg : chaque "bosse" entre deux extremums consécutifs = 2 arcs
    cubiques par le zéro ; contrôle proche d'un EXTREMUM à tangente plate
    (même y que l'extremum, décalé de 0,18·Δx) ; contrôle proche d'un ZÉRO à
    tangente raide, y = 0,3125·y_axe + 0,6875·y_extremum, décalé de 0,12·Δx).

    Panel 1 (porteuse seule) : baseline y=108, échelle 8 px/V, Δx=40 px par
      demi-période, 12 demi-périodes (6 périodes complètes) sur x=112..592.
      Amplitude CONSTANTE U0=6V -> pics à y=60, creux à y=156, toujours.

    Panel 2 (signal seul) : baseline y=228, même échelle 8 px/V, UNE période
      complète du signal sur la même largeur x=112..592 (Δx=240 px par
      demi-période) — cette largeur représente exactement 6 périodes de
      porteuse = 1 période de signal (rapport fp/fsignal=6). Pic S_m=3V à
      y=204 (t=0), creux à y=252 (mi-période), retour au pic à y=204.

    Panel 3 (produit + enveloppe) : baseline y=386, même échelle 8 px/V, même
      découpage en 12 demi-périodes de porteuse que le panel 1 (mêmes x_k),
      mais l'amplitude à chaque extremum suit maintenant E_k = U0+S_m·cos(30k°)
      (k=0..12, soit UNE période de signal — theta_k=30k° car f_p=6·f_signal,
      identique à la table de modulation-amplitude.svg, restreinte à k=0..12) :
        E_k : 9  8,598  7,5  6  4,5  3,402  3  3,402  4,5  6  7,5  8,598  9
      v_k = +E_k si k pair (pic), -E_k si k impair (creux) ; y_k = 386-8·v_k.
      L'enveloppe (haute=+E_k, basse=-E_k) est tracée en polyligne simple à
      travers les mêmes 13 points x_k — elle touche exactement chaque extremum
      de la porteuse modulée (vérifié point par point), comme dans
      modulation-amplitude.svg.

    LAYOUT MODEL: reserved-regions (default) — chrome / panel-1 / panel-2 /
    panel-3 / footer sont des bandes disjointes. Une seule exception locale :
    dans panel-3, le beat-3 utilise le mécanisme `replace` (spec `replaces`)
    pour ESTOMPER la porteuse déjà tracée (#p3-curve, plein contraste) en la
    remplaçant par un doublon atténué (#p3-curve-dim, ink-soft) — le verbe
    `fade` ne peut animer QUE vers une opacité pleine (1), jamais vers une
    valeur partielle ; le seul moyen propre de faire disparaître un élément
    déjà réglé visible par un beat antérieur est la sortie automatique du
    mécanisme `replace` (fade-out géré par le moteur). AUCUN `pulse-settle`
    n'est utilisé sur un élément déjà visible dans un beat antérieur : la
    pré-passe du moteur (`setPre`) masque INCONDITIONNELLEMENT la cible d'un
    `pulse-settle` (autoAlpha:0) au moment de la construction de la timeline,
    quel que soit le beat où le tween apparaît — l'appliquer à #p3-curve ou à
    #p3-envelope (déjà révélés en beat-2) les aurait rendus invisibles dès le
    beat-2 (bug de préséance). D'où le choix : #p3-curve-dim et #p3-spotlight
    sont des éléments NEUFS, jamais montrés avant le beat-3, animés par un
    simple `fade` (from:none) — sans risque.

    BEAT PRE-STATES (no-flash contract) :
      Beat 0 (settled on load) : panel-1 entièrement authored VISIBLE (bg,
        axes, tick U0, courbe #p1-curve) — aucun opacity="0". Seul #p1-curve
        porte un tween `trace` (cohérent avec regime-traces-forming.motion.json :
        le beat 0 est de toute façon "seek-past" instantanément par le moteur).
      Beat 1 : panel-2 (#p2-bg, #p2-axes, #p2-curve) authored opacity="0".
      Beat 2 : panel-3 (#p3-bg, #p3-axes, #p3-curve, #p3-envelope,
        #p3-label-envelope) authored opacity="0". #p3-spotlight et
        #p3-curve-dim (utilisés seulement au beat 3) sont AUSSI authored
        opacity="0" dès maintenant (ils n'apparaissent qu'au beat 3, donc pas
        de flash avant cela).

    PALETTE (DESIGN-TOKENS §7.1, RENDERING CONTRACT) : l'ACCENT est réservé à
    l'enveloppe (le foyer pédagogique — R2 : "l'enveloppe reproduit le
    signal"). La porteuse (panels 1 et 3, MÊME teinte pour signaler qu'il
    s'agit physiquement de la même onde, seulement modulée) est en
    --figure-ink. Le signal informatif seul (panel 2) est en --figure-ink-soft
    (plus doux — c'est l'ingrédient, pas encore le résultat). Chrome / axes /
    grilles en --figure-ink-soft / --figure-grid.

    CURRICULUM BOUNDARY : le beat 3 nomme la démodulation ("c'est la
    démodulation") sans montrer le détecteur de crête (diode + condensateur)
    — ce mécanisme est le sujet de R4, hors du périmètre de ce clip qui reste
    sur la CONSTRUCTION de s(t) (R2). Aucun schéma de circuit ici.
  -->

  <!-- ── Background ───────────────────────────────────────────────────────── -->
  <rect width="680" height="540" rx="8" fill="var(--figure-surface)"/>

  <!-- ── Chrome: title + subtitle (always visible) ───────────────────────── -->
  <text x="340" y="22" text-anchor="middle"
        font-size="12.5" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Construire s(t) : de la porteuse au signal modulé
  </text>
  <text x="340" y="38" text-anchor="middle"
        font-size="10" fill="var(--figure-ink-soft)">
    U<tspan dy="2" font-size="7">0</tspan><tspan dy="-2">=6 V, S</tspan><tspan dy="2" font-size="7">m</tspan><tspan dy="-2">=3 V (m=0,5) — rapport f</tspan><tspan dy="2" font-size="7">p</tspan><tspan dy="-2">/f</tspan><tspan dy="2" font-size="7">signal</tspan><tspan dy="-2"> réduit à 6 pour la lisibilité</tspan>
  </text>

  <!-- ══════════════════════════════════════════════════════════════════════
       PANEL 1 — la porteuse seule (beat 0, settled on load)
       Region: x:0 y:50 w:680 h:120. All elements authored VISIBLE.
       ══════════════════════════════════════════════════════════════════════ -->

  <rect id="p1-bg" x="90" y="56" width="550" height="104" rx="5"
        fill="var(--figure-grid)" opacity="0.35"/>

  <line x1="112" y1="108" x2="602" y2="108"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="602,108 592,103.5 592,112.5" fill="var(--figure-ink-soft)"/>
  <line x1="112" y1="158" x2="112" y2="54"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="112,54 107,64.5 117,64.5" fill="var(--figure-ink-soft)"/>

  <text x="608" y="112" font-size="10.5" font-style="italic"
        fill="var(--figure-ink-soft)">t</text>
  <text x="100" y="46" text-anchor="end" font-size="10.5" font-style="italic"
        fill="var(--figure-ink-soft)">u<tspan dy="2" font-size="7">p</tspan><tspan dy="-2">(t)</tspan></text>
  <text x="104" y="112" text-anchor="end" font-size="9.5"
        fill="var(--figure-ink-soft)">0</text>
  <line x1="108" y1="60" x2="116" y2="60"
        stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
  <text x="98" y="64" text-anchor="end" font-size="9"
        fill="var(--figure-ink-soft)">U<tspan dy="2" font-size="6.5">0</tspan></text>

