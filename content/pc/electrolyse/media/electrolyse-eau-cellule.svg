<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Cellule d’électrolyse de l’eau : une solution aqueuse légèrement acidifiée, deux électrodes inertes en platine ou graphite, reliées à un générateur dont les bornes plus et moins sont repérées. À la cathode, reliée à la borne moins, les ions H plus de la solution sont réduits et donnent du dihydrogène gazeux H2. À l’anode, reliée à la borne plus, l’eau est oxydée et donne du dioxygène gazeux O2. Résultat : le volume de dihydrogène recueilli est le double du volume de dioxygène, un rapport 2 pour 1 conforme à l’équation bilan : 2 H2O donne 2 H2 plus O2.">
  <title>Électrolyse de l’eau</title>
  <!--
    electrolyse-eau-cellule.svg — 4 étapes progressives (LESSON-EXPERIENCE-
    SPEC §2.5), R5 (électrolyse — applications : l'électrolyse de l'eau).

      step-1 : le montage — fils, générateur (bornes + / −), cuve, solution
               aqueuse acidifiée, deux électrodes inertes SANS identité
               électrochimique (juste deux plaques de Pt/graphite).
      step-2 : identité de la CATHODE (borne −) — réduction des H+, bulles
               de H2, demi-équation 2H+ + 2e− ⇌ H2.
      step-3 : identité de l'ANODE (borne +) — oxydation de l'eau, bulles
               de O2, demi-équation 2H2O ⇌ O2 + 4H+ + 4e−.
      step-4 : le résultat — un panneau séparé sous la cellule montre les
               volumes de gaz recueillis dans un rapport 2:1 (H2:O2), tel
               que le prédit l'équation bilan 2H2O → 2H2 + O2.

    Grammaire de construction — RÉUTILISE EXACTEMENT la grammaire de
    cellule-electrolyse.svg (même leçon, R2) pour la cohérence visuelle de
    la famille de schémas de cette leçon :
      Corners : TL(90,66) TR(550,66) BR(550,278) BL(90,278)
      Générateur : fil gauche, vertical (x=90, y=150..182), même symbole
                   (plaque longue/fine = +, plaque courte/épaisse = −).
      Cuve : suspendue au fil du bas, entre les deux jonctions (x=253
                   cathode / x=397 anode) — identique à cellule-electrolyse.svg.
      Contrairement à cellule-electrolyse.svg (schéma générique, espèces
      ioniques génériques M^n+/X^n-), CETTE figure fixe l'exemple concret
      du rung R5 : électrolyte = eau acidifiée, électrodes = inertes
      (Pt/graphite), et remplace la migration ionique générique par le
      dégagement gazeux spécifique (H2 à la cathode, O2 à l'anode) et son
      résultat quantifié (rapport de volumes 2:1).

    Simplification assumée (disclosée) : le panneau "résultat" (step-4)
    représente deux tubes gradués génériques (icône schématique de
    collecte de gaz), pas un appareillage nommé (voltamètre de Hofmann ou
    autre) — le texte de la leçon (R5) ne précise pas l'appareil de
    collecte, seulement le dégagement gazeux à chaque électrode et le
    bilan global. La hauteur des colonnes de gaz est tracée EXACTEMENT au
    rapport 2:1 (60 px pour H2, 30 px pour O2, à 30 px/unité de volume) —
    ce rapport reflète la stœchiométrie de l'équation bilan, pas une
    mesure réelle de volume.

    Rôle des couleurs (identique à cellule-electrolyse.svg pour les
    éléments structurels) :
      fils / générateur / cuve / électrodes / bulles : --figure-ink,
      --figure-ink-soft (structurel, neutre).
      Le panneau résultat (step-4) est le seul foyer accent de la figure :
      le remplissage des deux colonnes de gaz et l'étiquette du rapport
      V(H2):V(O2) = 2:1 sont en --figure-accent — c'est LE fait numérique
      que cette figure ajoute par rapport à cellule-electrolyse.svg.
  -->

  <defs>
    <linearGradient id="liquid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--figure-surface)"/>
      <stop offset="100%" stop-color="var(--figure-grid)"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le montage nu : fils, générateur, cuve,
       solution aqueuse acidifiée, électrodes inertes SANS
       identité électrochimique
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- Titre -->
    <text x="320" y="24" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Électrolyse de l’eau
    </text>
    <text x="320" y="40" text-anchor="middle"
          font-size="10" font-style="italic" fill="var(--figure-ink-soft)">
      l’eau ne se décompose jamais spontanément — le générateur la force
    </text>

    <!-- ── Fils du circuit ──────────────────────────────────── -->
    <line x1="90" y1="66" x2="550" y2="66"
          stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="550" y1="66" x2="550" y2="278"
          stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="66" x2="90" y2="150"
          stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="182" x2="90" y2="278"
          stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="278" x2="253" y2="278"
          stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="397" y1="278" x2="550" y2="278"
          stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>

    <!-- Jonctions -->
    <circle cx="90"  cy="66"  r="3" fill="var(--figure-ink)"/>
    <circle cx="550" cy="66"  r="3" fill="var(--figure-ink)"/>
    <circle cx="550" cy="278" r="3" fill="var(--figure-ink)"/>
    <circle cx="90"  cy="278" r="3" fill="var(--figure-ink)"/>

    <!-- ── Générateur (fil gauche), bornes marquées ──────────── -->
    <line x1="68" y1="150" x2="112" y2="150"
          stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76" y1="182" x2="104" y2="182"
          stroke="var(--figure-ink)" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="141" text-anchor="middle"
          font-size="9" font-weight="700" fill="var(--figure-ink)">+</text>
    <text x="90" y="199" text-anchor="middle"
          font-size="9" font-weight="700" fill="var(--figure-ink)">−</text>

    <!-- ── Cuve : solution aqueuse acidifiée ──────────────────── -->
    <text x="325" y="234" text-anchor="middle"
          font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">
      solution aqueuse acidifiée
    </text>
    <line x1="325" y1="240" x2="325" y2="292"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="2,2"/>

    <path d="M195,294 L195,344 Q195,352 203,352 L447,352 Q455,352 455,344 L455,294"
          fill="none" stroke="var(--figure-ink)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M197,310 L197,342 Q197,350 205,350 L445,350 Q453,350 453,342 L453,310 Z"
          fill="url(#liquid-grad)"/>
    <line x1="197" y1="310" x2="453" y2="310"
          stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <!-- ── Électrodes inertes (encore sans identité électrochimique) ─── -->
    <rect x="253" y="278" width="14" height="67" rx="3"
          fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1.5"/>
    <rect x="383" y="278" width="14" height="67" rx="3"
          fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1.5"/>

    <text x="325" y="364" text-anchor="middle"
          font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">
      deux électrodes inertes (Pt ou graphite)
    </text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la cathode (borne −) : réduction des H+,
       dégagement de H2
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <text x="260" y="256" text-anchor="middle"
          font-size="12" font-weight="600" fill="var(--figure-ink)">Cathode</text>
    <text x="260" y="270" text-anchor="middle"
          font-size="9" font-style="italic" fill="var(--figure-ink-soft)">(borne −)</text>

    <!-- Bulles de H2, montant de l'électrode -->
    <circle cx="257" cy="338" r="3"   fill="none" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <circle cx="263" cy="324" r="3"   fill="none" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <circle cx="258" cy="311" r="2.5" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="105" y="298" text-anchor="middle"
          font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">réduction</text>
    <text x="105" y="317" text-anchor="middle"
          font-size="10.5" fill="var(--figure-ink)">2H<tspan
          dy="-5" font-size="8">+</tspan><tspan
          dy="5"> + 2e</tspan><tspan
          dy="-5" font-size="8">−</tspan><tspan
          dy="5"> ⇌ H</tspan><tspan
          dy="4" font-size="8">2</tspan>
    </text>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — l'anode (borne +) : oxydation de l'eau,
       dégagement de O2
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <text x="390" y="256" text-anchor="middle"
          font-size="12" font-weight="600" fill="var(--figure-ink)">Anode</text>
    <text x="390" y="270" text-anchor="middle"
          font-size="9" font-style="italic" fill="var(--figure-ink-soft)">(borne +)</text>

    <!-- Bulles de O2, montant de l'électrode -->
    <circle cx="387" cy="338" r="3"   fill="none" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <circle cx="393" cy="324" r="3"   fill="none" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <circle cx="388" cy="311" r="2.5" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="540" y="298" text-anchor="middle"
          font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">oxydation</text>
    <text x="540" y="317" text-anchor="middle"
          font-size="10.5" fill="var(--figure-ink)">2H<tspan
          dy="4" font-size="8">2</tspan><tspan
          dy="-4">O ⇌ O</tspan><tspan
          dy="4" font-size="8">2</tspan><tspan
          dy="-4"> + 4H</tspan><tspan
          dy="-5" font-size="8">+</tspan><tspan
          dy="5"> + 4e</tspan><tspan
          dy="-5" font-size="8">−</tspan>
    </text>

  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — le résultat : les volumes de gaz recueillis,
       rapport 2:1 (H2:O2), conforme au bilan global
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">

    <rect x="170" y="384" width="300" height="150" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <text x="320" y="402" text-anchor="middle"
          font-size="10" font-style="italic" fill="var(--figure-ink-soft)">
      le résultat : volumes de gaz recueillis
    </text>

    <!-- Tubes gradués (icône schématique de collecte de gaz) -->
    <rect x="247" y="408" width="26" height="72" rx="2"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <rect x="377" y="408" width="26" height="72" rx="2"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>

    <!-- Graduation partagée (0, 1, 2 unités de volume), portée par le tube H2 -->
    <line x1="241" y1="480" x2="247" y2="480" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="238" y="483" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">0</text>
    <line x1="241" y1="450" x2="247" y2="450" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="238" y="453" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">1</text>
    <line x1="241" y1="420" x2="247" y2="420" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <text x="238" y="423" text-anchor="end" font-size="9" fill="var(--figure-ink-soft)">2</text>

    <!-- Colonnes de gaz recueilli, à l'échelle exacte du rapport 2:1 -->
    <rect x="247" y="420" width="26" height="60" fill="var(--figure-accent)" fill-opacity="0.38"/>
    <rect x="377" y="450" width="26" height="30" fill="var(--figure-accent)" fill-opacity="0.38"/>

    <text x="260" y="443" text-anchor="middle" font-size="10" font-weight="600"
          fill="var(--figure-ink)">H<tspan dy="4" font-size="7">2</tspan></text>
    <text x="390" y="468" text-anchor="middle" font-size="10" font-weight="600"
          fill="var(--figure-ink)">O<tspan dy="4" font-size="7">2</tspan></text>

    <text x="320" y="500" text-anchor="middle" font-size="12.5" font-weight="600"
          fill="var(--figure-accent)"><tspan
          font-style="italic">V</tspan><tspan>(H</tspan><tspan
          dy="4" font-size="9">2</tspan><tspan
          dy="-4">) : </tspan><tspan
          font-style="italic">V</tspan><tspan>(O</tspan><tspan
          dy="4" font-size="9">2</tspan><tspan
          dy="-4">) = 2 : 1</tspan>
    </text>

    <text x="320" y="518" text-anchor="middle" font-size="10.5"
          fill="var(--figure-ink)">2H<tspan
          dy="4" font-size="8">2</tspan><tspan
          dy="-4">O → 2H</tspan><tspan
          dy="4" font-size="8">2</tspan><tspan
          dy="-4"> + O</tspan><tspan
          dy="4" font-size="8">2</tspan>
    </text>

  </g><!-- /step-4 -->

</svg>
