notion: electrolyse

exercises:
  # ── r-bac — the VERIFIED 2019 national sujet, Exercice I Partie 1 ─────────
  # Faithful transcription of docs/sujets/pc/electrolyse.md → "2019 — session
  # normale — Exercice I (Partie 1)". Électrolyse d'une solution aqueuse
  # d'iodure de zinc entre deux électrodes de graphite A et B. Le générateur G
  # a sa borne + (à gauche) reliée à l'électrode B et sa borne − (à droite)
  # reliée à l'électrode A. On observe un dégagement de diiode à une électrode
  # et un dépôt de zinc à l'autre. Le schéma du dispositif est décrit en toutes
  # lettres dans l'intro (pas de renvoi à un SVG qui encoderait d'autres
  # nombres — cf. la cellule Daniell de cellule-electrolyse.svg).
  - id: r-bac
    title: "Exercice de type bac — électrolyse d'une solution d'iodure de zinc (2019)"
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF, code NS28F (Exercice I,
        Partie 1 — électrolyse d'une solution aqueuse d'iodure de zinc ; barème
        ≈ 2 pt sur les 7 pt de l'exercice). Transcription vérifiée : re-fetch
        indépendant AlloSchool element/68300 + diff OK
        (docs/sujets/pc/electrolyse.md).
    intro: |-
      **Électrolyse d'une solution aqueuse d'iodure de zinc (examen national, session normale 2019).**

      On réalise l'électrolyse d'une solution aqueuse d'iodure de zinc $Zn^{2+}_{(aq)} + 2\,I^-_{(aq)}$, à l'aide de deux électrodes $A$ et $B$ en graphite. On observe un dégagement de gaz diiode au niveau d'une électrode et la formation d'un dépôt de zinc au niveau de l'autre.

      Le dispositif est le suivant : un générateur $G$ alimente un tube en U contenant la solution d'iodure de zinc. Sa borne $+$ (à gauche) est reliée à l'**électrode B** ; sa borne $-$ (à droite) est reliée à l'**électrode A**. Les deux électrodes de graphite plongent dans la solution.

      **Données :** $1\text{F} = 9{,}65\times10^{4}\ \text{C.mol}^{-1}$ ; les deux couples mis en jeu sont $Zn^{2+}_{(aq)}/Zn_{(s)}$ et $I_{2(g)}/I^-_{(aq)}$ ; masse molaire du zinc $M(Zn) = 65{,}4\ \text{g.mol}^{-1}$.
    questions:
      - id: q1
        part: "Partie 1 — Reconnaître l'anode et écrire les réactions aux électrodes"
        stem: |-
          **(0,5 pt)** Parmi les deux électrodes $A$ et $B$, préciser laquelle est l'anode. Justifier la réponse.
        reasoning: |-
          L'anode est, par définition, l'électrode siège de l'**oxydation** — dans une pile comme dans une électrolyse (chapitre 2). Il faut donc repérer où se produit l'oxydation. Deux transformations sont observées : le dégagement de diiode, qui correspond à l'oxydation des ions iodure $2\,I^- \rightarrow I_2 + 2\,e^-$, et le dépôt de zinc, qui correspond à la réduction des ions zinc $Zn^{2+} + 2\,e^- \rightarrow Zn$. L'anode est donc l'électrode où se dégage le diiode.

          Reste à dire si c'est $A$ ou $B$. En électrolyse, c'est le générateur qui impose la polarité (chapitre 3) : sa borne $+$ tire les électrons hors de l'électrode qu'elle alimente, ce qui y force une oxydation. L'électrode reliée à la borne $+$ est donc l'anode. Ici, l'**électrode B** est reliée à la borne $+$ : c'est elle l'anode — et c'est bien là que le diiode se dégage. L'électrode $A$, reliée à la borne $-$, est la cathode, où le zinc se dépose.
      - id: q2
        stem: |-
          **(0,75 pt)** Écrire l'équation de la réaction à chaque électrode, puis l'équation bilan de l'électrolyse.
        reasoning: |-
          On écrit chaque demi-équation dans le sens réellement imposé par le générateur, en s'appuyant sur les deux couples fournis. À l'anode $B$ (borne $+$), le générateur arrache les électrons : le couple $I_2/I^-$ fonctionne en oxydation, les ions iodure cèdent leurs électrons et forment du diiode. À la cathode $A$ (borne $-$), le générateur pousse les électrons : le couple $Zn^{2+}/Zn$ fonctionne en réduction, les ions zinc captent les électrons et se déposent en métal.

          Pour l'équation bilan, on additionne les deux demi-équations en équilibrant les électrons. Chacune échange exactement $2\,e^-$ : ils s'éliminent directement dans la somme, sans avoir à multiplier l'une ou l'autre demi-équation.
        steps:
          - math: '2\,I^-_{(aq)} \rightarrow I_{2(g)} + 2\,e^-'
            note: "À l'anode B (borne +) : oxydation des ions iodure, dégagement de diiode."
          - math: 'Zn^{2+}_{(aq)} + 2\,e^- \rightarrow Zn_{(s)}'
            note: "À la cathode A (borne −) : réduction des ions zinc, dépôt de zinc."
          - math: 'Zn^{2+}_{(aq)} + 2\,I^-_{(aq)} \rightarrow Zn_{(s)} + I_{2(g)}'
            note: "Équation bilan : on additionne, les 2 électrons de chaque côté s'éliminent."
      - id: q3
        part: "Partie 1 — Quantité d'électricité et durée de l'électrolyse"
        stem: |-
          **(0,75 pt)** Pendant la durée $\Delta t$ de l'électrolyse, un courant d'intensité constante $I = 0{,}5\ \text{A}$ circule dans le circuit ; il se forme un dépôt de zinc de masse $m = 1{,}6\ \text{g}$. Déterminer $\Delta t$ en minutes.
        reasoning: |-
          On remonte de la masse déposée jusqu'à la durée, en parcourant à l'envers la chaîne de la loi de Faraday (chapitre 5). La masse de zinc donne la quantité de matière de zinc ; la demi-équation $Zn^{2+} + 2\,e^- \rightarrow Zn$ dit que chaque atome de zinc déposé a mobilisé **deux** électrons, d'où la quantité de matière d'électrons ; la constante de Faraday convertit ces électrons en quantité d'électricité $Q$ ; enfin $Q = I\,\Delta t$, à intensité constante, livre la durée. On termine par la conversion en minutes demandée.

          Le facteur $2$ est ici décisif : l'oublier reviendrait à diviser par deux le nombre d'électrons, donc la durée.
        steps:
          - math: 'n(Zn) = \frac{m}{M(Zn)} = \frac{1{,}6}{65{,}4} \approx 2{,}45\times10^{-2}\ \text{mol}'
            note: "La masse déposée devient une quantité de matière de zinc."
          - math: 'n(e^-) = 2\,n(Zn) \approx 4{,}89\times10^{-2}\ \text{mol}'
            note: "Chaque atome de zinc déposé a consommé 2 électrons (Zn²⁺ + 2 e⁻ → Zn)."
          - math: 'Q = n(e^-)\,F \approx 4{,}89\times10^{-2}\times 9{,}65\times10^{4} \approx 4{,}72\times10^{3}\ \text{C}'
            note: "Quantité d'électricité, par la constante de Faraday."
          - math: '\Delta t = \frac{Q}{I} \approx \frac{4{,}72\times10^{3}}{0{,}5} \approx 9{,}44\times10^{3}\ \text{s}'
            note: "On isole la durée dans Q = I·Δt (intensité constante)."
          - math: '\Delta t \approx \frac{9{,}44\times10^{3}}{60} \approx 157\ \text{min}'
            note: "Conversion en minutes (soit environ 2 h 37 min)."

  # ── r-variation — fresh anti-memorisation twin (NOT a real sujet) ────────
  # Même profondeur de compétences que r-bac (identifier anode/cathode à partir
  # du branchement, écrire demi-équations + bilan, appliquer Q = I·Δt = n·F),
  # mais sur le chlorure de cuivre(II) (métal + gaz différents), avec un autre
  # branchement énoncé et la question de Faraday posée dans l'AUTRE sens (on
  # donne Δt et I, on cherche la masse — r-bac donnait la masse et cherchait
  # Δt). S'ajoute une question de seuil de tension (rung 3), absente de r-bac,
  # pour couvrir une compétence de plus. On ne peut donc pas recopier le
  # corrigé 2019 : il faut reconnaître quelle procédure s'applique.
  - id: r-variation
    title: "Une variation pour ne pas mémoriser — électrolyse du chlorure de cuivre(II)"
    sourcing:
      status: not-applicable
      note: >-
        Variation construite exprès (anti-mémorisation) — n'a pas vocation à
        être un sujet réel. Le sujet réel est r-bac (2019, sourcé).
    intro: |-
      Même structure profonde que le sujet précédent — identifier les électrodes à partir du branchement, écrire les réactions, puis appliquer la loi de Faraday — mais sur un autre système et avec la question quantitative posée dans l'autre sens. Le but est que tu ne puisses pas recopier le corrigé de 2019 : tu dois reconnaître quelle procédure s'applique.

      On électrolyse une solution aqueuse de chlorure de cuivre(II) $Cu^{2+}_{(aq)} + 2\,Cl^-_{(aq)}$ avec deux électrodes de graphite inertes. Un générateur impose un courant constant $I = 1{,}5\ \text{A}$. L'électrode reliée à la borne $-$ se couvre d'un dépôt de cuivre métallique ; à l'électrode reliée à la borne $+$, un gaz jaune-vert se dégage.

      **Données :** $F \approx 9{,}65\times10^{4}\ \text{C.mol}^{-1}$ ; couples $Cu^{2+}_{(aq)}/Cu_{(s)}$ et $Cl_{2(g)}/Cl^-_{(aq)}$ ; $M(Cu) = 63{,}5\ \text{g.mol}^{-1}$.
    questions:
      - id: q1
        part: "Identifier les électrodes et écrire les réactions"
        stem: |-
          Identifier l'anode et la cathode de cette cellule : préciser, pour chacune, la borne du générateur à laquelle elle est reliée et la transformation (oxydation ou réduction) qui s'y produit.
        reasoning: |-
          On part de l'observation, comme dans le sujet. Le dépôt de cuivre métallique correspond à la réduction $Cu^{2+} + 2\,e^- \rightarrow Cu$ : c'est donc la **cathode**, et l'énoncé précise qu'elle est reliée à la borne $-$ (le générateur y pousse les électrons, ce qui force la réduction — chapitre 3). Le gaz jaune-vert est du dichlore : il vient de l'oxydation des ions chlorure $2\,Cl^- \rightarrow Cl_2 + 2\,e^-$, c'est donc l'**anode**, reliée à la borne $+$ (le générateur y arrache les électrons).

          Le point à ne pas manquer : comme dans toute électrolyse, l'anode est ici la borne $+$ et la cathode la borne $-$ — l'inverse d'une pile.
      - id: q2
        stem: |-
          Écrire la demi-équation à chaque électrode, puis l'équation bilan de l'électrolyse.
        reasoning: |-
          On écrit chaque demi-équation dans le sens imposé par le générateur, à partir des deux couples fournis, puis on somme en équilibrant les électrons. La cathode réduit les ions cuivre ; l'anode oxyde les ions chlorure. Chaque demi-équation échange $2\,e^-$, donc les électrons s'éliminent directement dans la somme.
        steps:
          - math: 'Cu^{2+}_{(aq)} + 2\,e^- \rightarrow Cu_{(s)}'
            note: "Cathode (borne −) : réduction, dépôt de cuivre."
          - math: '2\,Cl^-_{(aq)} \rightarrow Cl_{2(g)} + 2\,e^-'
            note: "Anode (borne +) : oxydation, dégagement de dichlore."
          - math: 'Cu^{2+}_{(aq)} + 2\,Cl^-_{(aq)} \rightarrow Cu_{(s)} + Cl_{2(g)}'
            note: "Bilan : 2 électrons échangés de chaque côté, ils s'éliminent."
      - id: q3
        part: "Loi de Faraday : masse de cuivre déposée"
        stem: |-
          Le courant $I = 1{,}5\ \text{A}$ est maintenu pendant $\Delta t = 30\ \text{min}$. Calculer la masse de cuivre déposée sur la cathode.
        reasoning: |-
          Ici on va dans le sens direct de la loi de Faraday (à l'inverse du sujet, qui partait de la masse pour trouver la durée) : durée et intensité donnent la quantité d'électricité, la constante de Faraday la convertit en électrons, la stœchiométrie de $Cu^{2+} + 2\,e^- \rightarrow Cu$ (deux électrons par atome) donne la quantité de cuivre, et la masse molaire finit le travail. On n'oublie pas de convertir les minutes en secondes avant tout calcul de charge.
        steps:
          - math: '\Delta t = 30\times 60 = 1800\ \text{s}'
            note: "Conversion en secondes avant tout calcul de charge."
          - math: 'Q = I\,\Delta t = 1{,}5\times 1800 = 2{,}7\times10^{3}\ \text{C}'
            note: "Quantité d'électricité débitée."
          - math: 'n(e^-) = \frac{Q}{F} = \frac{2{,}7\times10^{3}}{9{,}65\times10^{4}} \approx 2{,}80\times10^{-2}\ \text{mol}'
            note: "Loi de Faraday : quantité de matière d'électrons échangés."
          - math: 'n(Cu) = \frac{n(e^-)}{2} \approx 1{,}40\times10^{-2}\ \text{mol}'
            note: "Cu²⁺ + 2 e⁻ → Cu : deux électrons par atome de cuivre."
          - math: 'm(Cu) = n(Cu)\,M(Cu) \approx 1{,}40\times10^{-2}\times 63{,}5 \approx 0{,}89\ \text{g}'
            note: "Masse de cuivre déposée."
      - id: q4
        part: "Seuil de tension : un générateur trop faible suffit-il ?"
        stem: |-
          Cette cellule possède, comme toute pile, une force électromotrice propre $E \approx 1{,}0\ \text{V}$ dans le sens opposé à celui imposé. Un générateur réglé sur $U = 0{,}7\ \text{V}$ (branché en opposition) suffirait-il à réaliser le dépôt de cuivre ? Justifier.
        reasoning: |-
          On compare la tension imposée au seuil fixé par la force électromotrice propre de la cellule (chapitre 4). Pour inverser réellement le sens de la réaction, il faut $U > E$ en valeur absolue. Ici $U = 0{,}7\ \text{V} < E \approx 1{,}0\ \text{V}$ : le générateur ne fait qu'affaiblir la tendance spontanée de la cellule sans l'inverser — aucun dépôt net de cuivre ne se forme. Il faudrait régler le générateur au-dessus de $1{,}0\ \text{V}$. Ce n'est pas un curseur continu : sous le seuil, rien ne s'inverse ; au-dessus, le sens forcé l'emporte totalement.
