          - math: '\boxed{n(e^-) \approx 0{,}1492\ \text{mol}}'
            note: "Application numerique."
          - math: 'n(Cr) = \frac{n(e^-)}{3} \approx \frac{0{,}1492}{3}'
            note: "Cr3+ + 3 e- -> Cr (question 2.2) : trois electrons par atome de chrome depose, pas deux comme dans les exemples de la lecon."
          - math: '\boxed{n(Cr) \approx 4{,}97\times10^{-2}\ \text{mol}}'
            note: "Application numerique."
          - math: 'm(Cr) = n(Cr)\times M(Cr) \approx 4{,}97\times10^{-2}\times 52'
            note: "Conversion mole -> masse par la masse molaire du chrome."
          - math: '\boxed{m(Cr) \approx 2{,}59\ \text{g}}'
            note: "Masse de chrome deposee sur la plaque d'acier pendant Delta t."
