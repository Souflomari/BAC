entries:
  # ── bk-2018-n-x1 — 2018 N, Exercice I (Partie I) : électrolyse du bromure de plomb ──
  - id: bk-2018-n-x1
    title: "Électrolyse du bromure de plomb : anode, équations aux électrodes, intensité et volume de dibrome par la loi de Faraday"
    source:
      year: 2018
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice I — Partie I : électrolyse du bromure de plomb"
    bareme_total: 2
    duration_min: 12
    sourcing:
      status: sourced
      note: >-
        2018 session normale — examen national PC BIOF, code NS28F
        (Exercice I, Partie I — électrolyse du bromure de plomb à haute
        température ; barème de la partie = 2 pt sur les 7 pt de l'exercice
        complet, dont la Partie II — réactions de l'acide lactique — se
        répartit entre reactions-acido-basiques.md et
        esterification-hydrolyse.md). Transcription vérifiée en trois passes
        indépendantes (README §3) : re-fetch AlloSchool element/57726 + diff
        caractère par caractère (passe 1→2, correction des indices $(aq)$
        inventés au couple $Pb^{2+}/Pb_{(s)}$ et $Br_{2(g)}/Br^-$ — absents
        du scan), puis re-lecture indépendante d'un troisième agent
        confirmant la notation corrigée conforme au scan (zoom ×9, crop au
        pixel ; docs/sujets/pc/electrolyse.md, statut « vérifié »,
        2026-08-06). Physique re-dérivée et cohérente : $n(Pb)=0{,}100$ mol
        $\Rightarrow I \approx 5{,}4$ A ; $n(Br_2)=n(Pb) \Rightarrow
        V(Br_2) \approx 7{,}05$ L. Aucun recoupement avec le sommet de leçon
        (r-bac/exercises.yaml transcrit le sujet 2019, iodure de zinc — voir
        l'en-tête du fichier).
    intro: |-
      **Électrolyse d'un composé ionique : le bromure de plomb (examen national, session normale 2018, Exercice I — Partie I).**

      On réalise l'électrolyse du bromure de plomb $Pb^{2+} + 2\,Br^-$ à haute température par un générateur fournissant un courant électrique d'intensité $I$ constante.

      Au cours de cette électrolyse, le métal plomb se dépose sur l'une des électrodes et au niveau de l'autre, il se forme le gaz dibrome.

      Au cours du fonctionnement de l'électrolyseur pendant la durée $\Delta t = 3600\ \text{s}$, la masse de plomb déposé est : $m = 20{,}72\ \text{g}$.

      **Données :** les 2 couples mis en jeu : $Pb^{2+}/Pb_{(s)}$ et $Br_{2(g)}/Br^-$ ; la constante de Faraday : $F = 9{,}65 \cdot 10^{4}\ \text{C.mol}^{-1}$ ; le volume molaire des gaz dans les conditions de l'expérience : $V_m = 70{,}5\ \text{L.mol}^{-1}$ ; la masse molaire du plomb : $M(Pb) = 207{,}2\ \text{g.mol}^{-1}$.

      *(Aucune figure dans cette partie ; énoncé intégralement textuel.)*
    questions:
      - id: q1
        part: "Partie I — Électrolyse d'un composé ionique : le bromure de plomb"
        stem: |-
          **(0,25 pt)** Donner le nom de l'électrode (anode ou cathode) au niveau de laquelle se forme le dibrome.
        reasoning: |-
          Comme au rung 1, l'anode et la cathode se distinguent par le mécanisme — ici, aucun schéma de branchement n'est même fourni, donc aucune polarité à lire. Il suffit de regarder les deux couples donnés : $Pb^{2+}/Pb_{(s)}$ est le couple du plomb, qui se dépose (donc une réduction) ; le dibrome ne peut venir que de l'autre couple, $Br_{2(g)}/Br^-$, où $Br_2$ est la forme oxydée. Former du $Br_2$ à partir de $Br^-$, c'est perdre des électrons — une oxydation — et l'électrode où se produit une oxydation est, par définition, l'anode (rung 1).

          Le dibrome se forme donc à l'**anode**.
      - id: q2
        stem: |-
          **(0,75 pt)** Écrire les équations des réactions aux électrodes, ainsi que l'équation bilan lors de l'électrolyse.
        reasoning: |-
          Même geste qu'au rung 1 : une demi-équation par électrode, dans le sens que le mécanisme impose, puis la somme équilibrée en électrons. À l'anode (question 1), les ions bromure s'oxydent en dibrome. À la cathode — l'autre électrode, où le plomb se dépose, donc une réduction — les ions plomb captent des électrons. Les deux demi-équations échangent chacune $2\,e^-$ : ils s'annulent directement dans la somme, sans multiplier ni l'une ni l'autre.
        steps:
          - math: '2\,Br^- \rightarrow Br_{2(g)} + 2\,e^-'
            note: "A l'anode : oxydation des ions bromure, degagement de dibrome."
          - math: 'Pb^{2+} + 2\,e^- \rightarrow Pb_{(s)}'
            note: "A la cathode : reduction des ions plomb, depot de plomb metal."
          - math: 'Pb^{2+} + 2\,Br^- \rightarrow Pb_{(s)} + Br_{2(g)}'
            note: "Bilan : les 2 electrons de chaque cote s'eliminent."
      - id: q3
        part: "Partie I — Loi de Faraday : intensité et volume de dibrome"
        stem: |-
          **(0,5 pt)** Déterminer la valeur de l'intensité $I$ du courant électrique passant dans le circuit pendant la durée $\Delta t$.
        reasoning: |-
          On remonte la chaîne du rung 4, dans le sens inverse de l'exemple travaillé de la leçon (qui partait d'un courant connu pour trouver une masse) : ici c'est la masse déposée qui est connue, et c'est le courant qu'il faut en tirer. La masse de plomb donne d'abord sa quantité de matière ; la demi-équation de la question 2 dit que chaque atome de plomb déposé a mobilisé **deux** électrons ; la constante de Faraday convertit ces électrons en quantité d'électricité $Q$ ; et $Q = I\,\Delta t$, à intensité constante, livre enfin $I$ une fois $\Delta t$ connu (donnée de l'énoncé).
        steps:
          - math: 'n(Pb) = \frac{m}{M(Pb)} = \frac{20{,}72}{207{,}2}'
            note: "La masse de plomb deposee devient une quantite de matiere."
          - math: '\boxed{n(Pb) = 0{,}100\ \text{mol}}'
            note: "Valeur ronde, signe d'un jeu de donnees coherent."
          - math: 'n(e^-) = 2\,n(Pb) = 0{,}200\ \text{mol}'
            note: "Chaque atome de plomb depose a consomme 2 electrons (Pb2+ + 2e- -> Pb, question 2)."
          - math: 'Q = n(e^-)\,F = 0{,}200\times 9{,}65\times10^{4}'
            note: "Quantite d'electricite, par la constante de Faraday."
          - math: '\boxed{Q = 1{,}93\times10^{4}\ \text{C}}'
            note: "Application numerique."
          - math: 'I = \frac{Q}{\Delta t} = \frac{1{,}93\times10^{4}}{3600}'
            note: "On isole I dans Q = I.Delta t (intensite constante), avec Delta t donne dans l'enonce."
          - math: '\boxed{I \approx 5{,}4\ \text{A}}'
            note: "Intensite du courant impose par le generateur."
      - id: q4
        stem: |-
          **(0,5 pt)** Calculer, dans les conditions de l'expérience, le volume $V$ du gaz dibrome formé pendant $\Delta t$.
        reasoning: |-
          SCOPE NOTE (voir l'en-tête du fichier) : convertir une quantité de matière de gaz en volume par le volume molaire $V_m$ n'est traité par aucun rung de cette leçon — R4 chiffre des masses déposées, jamais des volumes de gaz ; c'est une relation générale de chimie ($n = V/V_m$), mobilisée ici sans qu'aucun rung ne l'introduise. On commence par la stœchiométrie, qui elle relève bien du rung 1 : le bilan de la question 2 associe un $Br_2$ formé à chaque $Pb$ déposé (même nombre d'électrons échangés de chaque côté), donc $n(Br_2) = n(Pb) = 0{,}100\ \text{mol}$, déjà calculé à la question 3 — pas besoin de repasser par les électrons. Il reste à convertir cette quantité de matière en volume, avec le volume molaire donné dans l'énoncé.
        steps:
          - math: 'n(Br_2) = n(Pb) = 0{,}100\ \text{mol}'
            note: "Bilan de la question 2 : un Br2 forme pour un Pb depose (meme nombre d'electrons echanges)."
          - math: 'V = n(Br_2)\times V_m = 0{,}100\times 70{,}5'
            note: "Conversion mole -> volume par le volume molaire des gaz, donne dans l'enonce (hors rungs de cette lecon)."
          - math: '\boxed{V = 7{,}05\ \text{L}}'
            note: "Volume de dibrome degage pendant Delta t."

  # ── bk-2019-n-x1 — 2019 N, Exercice I (Partie 1) : électrolyse d'iodure de zinc ──
  # Même sujet que le sommet de leçon r-bac (exercises.yaml). Voir la NOTE
  # ÉDITORIALE en tête de fichier pour le recoupement assumé.
  - id: bk-2019-n-x1
    title: "Électrolyse d'une solution aqueuse d'iodure de zinc : anode, équations aux électrodes et durée par la loi de Faraday"
    source:
      year: 2019
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice I — Partie 1 : électrolyse d'une solution aqueuse d'iodure de zinc"
    bareme_total: 2
    duration_min: 12
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF, code NS28F
        (Exercice I, Partie 1 — électrolyse d'une solution aqueuse d'iodure
        de zinc entre deux électrodes de graphite A et B ; barème de la
        partie = 2 pt sur les 7 pt de l'exercice complet, dont la Partie 2 —
        étude conductimétrique de l'acide benzoïque — est transcrite sous
        reactions-acido-basiques.md). Transcription vérifiée : re-fetch
        indépendant AlloSchool element/68300 + diff OK (agent-vérificateur,
        2026-07-11 ; docs/sujets/pc/electrolyse.md, statut « vérifié »).
        FLAG RECOUPEMENT (voir l'en-tête du fichier) : ce même sujet
        sous-tend le sommet de leçon r-bac (exercises.yaml, marqueur
        [[exercise:r-bac]] à R6 « Pour t'entraîner ») — recoupement assumé,
        même disposition que piles bk-2020-n-x1 ; le raisonnement ci-dessous
        est rédigé de nouveau (voix maison), pas copié de exercises.yaml.
    intro: |-
      **Électrolyse d'une solution aqueuse d'iodure de zinc (examen national, session normale 2019, Exercice I — Partie 1).**

      On réalise l'électrolyse d'une solution aqueuse d'iodure de zinc $\text{Zn}^{2+}_{(aq)} + 2\,\text{I}^-_{(aq)}$, en utilisant deux électrodes A et B en graphite. On observe un dégagement du gaz diiode au niveau d'une électrode et la formation d'un dépôt de zinc au niveau de l'autre électrode.

      La figure ci-contre représente le schéma du dispositif expérimental utilisé pour réaliser cette électrolyse.

      **Données :** $1\text{F} = 9{,}65 \cdot 10^{4}\ \text{C.mol}^{-1}$ ; les deux couples mis en jeu sont : $\text{Zn}^{2+}_{(aq)}/\text{Zn}_{(s)}$ et $\text{I}_{2(g)}/\text{I}^-_{(aq)}$ ; la masse molaire du zinc : $M(\text{Zn}) = 65{,}4\ \text{g.mol}^{-1}$.

      **Figure (schéma du dispositif).** Un générateur $G$ (bornes $+$ à gauche, $-$ à droite) alimente un tube en U contenant la solution d'iodure de zinc. Deux électrodes en graphite plongent dans la solution : **Electrode B** (branche de gauche, reliée à la borne $+$) et **Electrode A** (branche de droite, reliée à la borne $-$).
    questions:
      - id: q1
        part: "Partie 1 — Électrolyse d'une solution aqueuse d'iodure de zinc"
        stem: |-
          **(0,5 pt)** Parmi les deux électrodes A et B, préciser l'anode. Justifier la réponse.
        reasoning: |-
          L'anode se définit sans ambiguïté, en électrolyse comme en pile : c'est l'électrode où se produit l'oxydation (rung 1). Reste à savoir laquelle des deux, A ou B, est concernée — et c'est le générateur qui tranche (rung 2) : sa borne $+$ arrache des électrons à l'électrode qu'elle alimente, ce qui y force précisément une oxydation. Sur le schéma, la borne $+$ du générateur $G$ est reliée à l'**électrode B**. C'est donc B qui est l'anode ; l'électrode A, reliée à la borne $-$, est la cathode (siège de la réduction).
      - id: q2
        stem: |-
          **(0,75 pt)** Écrire l'équation de la réaction à chaque électrode et l'équation bilan lors de l'électrolyse.
        reasoning: |-
          À l'anode B (borne $+$), le générateur arrache des électrons : parmi les deux couples fournis, seul $\text{I}_2/\text{I}^-$ peut en céder ici, donc les ions iodure s'oxydent en diiode — cohérent avec le dégagement gazeux observé. À la cathode A (borne $-$), le générateur pousse des électrons : le couple $\text{Zn}^{2+}/\text{Zn}$ fonctionne alors en réduction, les ions zinc les captent et se déposent en métal — cohérent avec le dépôt observé. Les deux demi-équations échangent chacune $2\,e^-$ : ils s'annulent directement dans la somme, sans multiplier ni l'une ni l'autre.
        steps:
          - math: '2\,I^-_{(aq)} \rightarrow I_{2(g)} + 2\,e^-'
            note: "Anode B (borne +) : oxydation des ions iodure."
          - math: 'Zn^{2+}_{(aq)} + 2\,e^- \rightarrow Zn_{(s)}'
            note: "Cathode A (borne -) : reduction des ions zinc."
          - math: 'Zn^{2+}_{(aq)} + 2\,I^-_{(aq)} \rightarrow Zn_{(s)} + I_{2(g)}'
            note: "Bilan : les 2 electrons de chaque cote s'eliminent."
      - id: q3
        part: "Partie 1 — Quantité d'électricité et durée de l'électrolyse"
        stem: |-
          **(0,75 pt)** Pendant la durée $\Delta t$ de l'électrolyse, un courant électrique d'intensité constante $I = 0{,}5\ \text{A}$ circule dans le circuit ; il se forme alors un dépôt de zinc de masse $m = 1{,}6\ \text{g}$. Déterminer $\Delta t$ en minutes.
        reasoning: |-
          On repart de la masse de zinc déposée pour remonter, étape par étape, jusqu'à la durée — la chaîne du rung 4, parcourue à l'envers cette fois (l'exemple travaillé de la leçon partait d'un courant connu pour trouver une masse). La demi-équation de la question 2, $Zn^{2+}+2\,e^-\rightarrow Zn$, dit que chaque atome de zinc déposé a mobilisé deux électrons : c'est ce facteur $2$ qui relie $n(Zn)$ à $n(e^-)$. La constante de Faraday convertit ensuite $n(e^-)$ en quantité d'électricité $Q$, et $Q=I\,\Delta t$ — à intensité constante — livre finalement $\Delta t$, qu'il ne reste plus qu'à convertir en minutes comme demandé.
        steps:
          - math: 'n(Zn) = \frac{m}{M(Zn)} = \frac{1{,}6}{65{,}4}'
            note: "La masse de zinc deposee devient une quantite de matiere."
          - math: '\boxed{n(Zn) \approx 2{,}45\times10^{-2}\ \text{mol}}'
            note: "Application numerique."
          - math: 'n(e^-) = 2\,n(Zn) \approx 4{,}89\times10^{-2}\ \text{mol}'
            note: "Chaque atome de zinc depose a consomme 2 electrons (Zn2+ + 2e- -> Zn, question 2)."
          - math: 'Q = n(e^-)\,F \approx 4{,}89\times10^{-2}\times 9{,}65\times10^{4}'
            note: "Quantite d'electricite, par la constante de Faraday."
          - math: '\boxed{Q \approx 4{,}72\times10^{3}\ \text{C}}'
            note: "Application numerique."
          - math: '\Delta t = \frac{Q}{I} = \frac{4{,}72\times10^{3}}{0{,}5}'
            note: "On isole Delta t dans Q = I.Delta t, intensite constante donnee dans l'enonce."
          - math: '\boxed{\Delta t \approx 9{,}44\times10^{3}\ \text{s}}'
            note: "Duree en secondes."
          - math: '\Delta t \approx \frac{9{,}44\times10^{3}}{60}'
            note: "Conversion en minutes, demandee par l'enonce."
          - math: '\boxed{\Delta t \approx 157\ \text{min}}'
            note: "Soit environ 2 h 37 min."

  # ── bk-2022-n-x1 — 2022 N, Exercice 1 (Partie 1) : chromage d'une plaque d'acier par électrolyse ──
  - id: bk-2022-n-x1
    title: "Chromage d'une plaque d'acier par électrolyse : cathode, réactions aux électrodes (QCM) et masse de chrome déposée par la loi de Faraday"
    source:
      year: 2022
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 1 — Partie 1 : chromage d'une plaque d'acier par électrolyse"
    bareme_total: 2.25
    duration_min: 13
    sourcing:
      status: sourced
      note: >-
        2022 session normale — examen national PC BIOF, code NS 28F
        (Exercice 1, Partie 1 — chromage d'une plaque d'acier par
        électrolyse ; barème de la partie = 2,25 pt sur les 7 pt de
        l'exercice complet, dont la Partie 2 — étude de quelques propriétés
        d'une solution aqueuse d'acide propanoïque — relève de
        reactions-acido-basiques.md). Transcription vérifiée par re-lecture
        de contrôle indépendante des corrections de la passe adversariale
        (agent-relecteur-de-contrôle, 2026-08-07), diff OK contre
        upload-84516/0002-big.jpg (docs/sujets/pc/electrolyse.md, statut
        « vérifié ») ; barème en marge recompté au zoom ×2 :
        $0{,}5+0{,}5+0{,}5+0{,}75=2{,}25$. Physique re-dérivée et cohérente
        (recontrôlée indépendamment ici) : $n(e^-) = I\Delta t/F =
        2\times7200/96500 \approx 0{,}1492$ mol $\Rightarrow n(Cr) =
        n(e^-)/3 \approx 4{,}97\times10^{-2}$ mol $\Rightarrow m(Cr)
        \approx 2{,}59$ g ; cathode = plaque d'acier (réduction
        $Cr^{3+}+3e^- \to Cr$), anode = électrode de graphite (oxydation
        de l'eau, dégagement de $O_2$) ; une seule réponse juste par QCM
        (2.1 = A, 2.2 = B). Aucun recoupement avec le sommet de leçon
        (r-bac transcrit le sujet 2019, iodure de zinc) ni avec
        bk-2018-n-x1 (bromure de plomb) — voir l'en-tête du fichier.
    intro: |-
      **Chromage d'une plaque d'acier par électrolyse (examen national, session normale 2022, Exercice 1 — Partie 1).**

      *L'électrolyse est un processus de conversion de l'énergie électrique en énergie chimique. Parmi ses applications on trouve la couverture d'objets par une fine couche de métal et ce pour les protéger de la corrosion. On se propose, dans cette partie, d'étudier le chromage d'une plaque d'acier par électrolyse.*

      Pour réaliser cette électrolyse, on plonge totalement une plaque en acier dans une solution aqueuse de chlorure de chrome (III) $Cr^{3+}_{(aq)} + 3\,Cl^-_{(aq)}$ et on la relie à l'un des pôles d'un générateur $G$. L'autre pôle du générateur est relié à une électrode en graphite (figure 1). En fermant l'interrupteur $K$, un courant électrique d'intensité constante $I = 2\ \text{A}$ circule alors dans le circuit. On observe un dégagement de dioxygène $O_{2(g)}$ au niveau de l'électrode en graphite et un dépôt uniforme de chrome sur la plaque d'acier.

      **Données :** les couples mis en jeu : $Cr^{3+}_{(aq)}/Cr_{(s)}$ et $O_{2(g)}/H_2O_{(l)}$ ; $1\text{F} = 96500\ \text{C.mol}^{-1}$ ; la masse molaire du chrome : $M(Cr) = 52\ \text{g.mol}^{-1}$.

      **Figure 1 (schéma du dispositif).** Un générateur $G$ (en haut, au centre du schéma) est relié par un fil à un interrupteur $K$ (en haut à droite, à droite de $G$). Un bécher contient la solution de chlorure de chrome (III) $Cr^{3+}_{(aq)} + 3\,Cl^-_{(aq)}$, dans laquelle plongent deux électrodes reliées au circuit : à gauche, la **plaque en acier** (reliée au générateur $G$) ; à droite, l'**électrode en graphite** (reliée à l'interrupteur $K$).
    questions:
      - id: q1
        part: "Partie 1 — Chromage d'une plaque d'acier par électrolyse"
        stem: |-
          **(0,5 pt)** Identifier l'électrode qui joue le rôle de la cathode. Justifier votre réponse.
        reasoning: |-
          Comme au rung 1, l'anode et la cathode se distinguent par le mécanisme qui s'y produit, pas par leur position sur le schéma — et ici, aucune polarité de générateur n'est même précisée, donc rien à lire de ce côté-là. Il faut repartir des deux observations données : un dépôt de chrome métallique sur la plaque d'acier, et un dégagement de dioxygène gazeux à l'électrode de graphite. Un dépôt de métal à partir d'un ion en solution, c'est cet ion qui capte des électrons pour redevenir un atome métal — une réduction (rung 1) — et l'électrode où se produit une réduction est, par définition, la cathode.

          La **plaque d'acier** est donc la cathode : c'est là que les ions $Cr^{3+}$ de la solution sont réduits en chrome métal, qui vient s'y déposer. (L'électrode de graphite, siège du dégagement de $O_2$ — une oxydation de l'eau — est l'anode.)
      - id: q2
        part: "Partie 1 — Réactions aux électrodes (QCM)"
        stem: |-
          **(0,5 pt)** L'équation de la réaction au niveau de l'électrode de graphite s'écrit ainsi :

          | | |
          |---|---|
          | A | $2\,H_2O_{(\ell)} \rightleftharpoons O_{2(g)} + 4\,H^+_{(aq)} + 4\,e^-$ |
          | B | $Cr^{3+}_{(aq)} + 3\,e^- \rightleftharpoons Cr_{(s)}$ |
          | C | $2\,O^{2-}_{(aq)} \rightleftharpoons O_{2(g)} + 4\,e^-$ |
          | D | $2\,H_2O_{(\ell)} \rightleftharpoons O_{2(g)} + 2\,H_{2(g)}$ |
        reasoning: |-
          L'électrode de graphite est l'anode (question précédente) : il s'y produit une oxydation, celle qui dégage le dioxygène observé. Reste à identifier la bonne demi-équation parmi les quatre proposées.

          B décrit une réduction (l'ion $Cr^{3+}$ qui capte des électrons) : c'est la réaction de la plaque d'acier, pas celle du graphite. Faux ici. C invente une espèce $O^{2-}_{(aq)}$ absente des données — le seul couple fourni pour l'oxygène est $O_{2(g)}/H_2O_{(l)}$, pas $O_2/O^{2-}$. Faux. D ne fait apparaître aucun électron échangé : ce n'est pas une demi-équation redox, elle ne peut donc pas décrire ce qui se produit à une électrode. Faux.

          A est la seule à exploiter le couple donné $O_{2(g)}/H_2O_{(l)}$ dans le bon sens — l'eau oxydée en dioxygène, avec libération d'électrons — cohérent avec l'oxydation attendue à l'anode et le dégagement de $O_2$ observé au graphite. $\boxed{\text{A}}$.
      - id: q3
        stem: |-
          **(0,5 pt)** L'équation de la réaction au niveau de la plaque d'acier s'écrit ainsi :

          | | |
          |---|---|
          | A | $2\,H_2O_{(\ell)} \rightleftharpoons O_{2(g)} + 4\,H^+_{(aq)} + 4\,e^-$ |
          | B | $Cr^{3+}_{(aq)} + 3\,e^- \rightleftharpoons Cr_{(s)}$ |
          | C | $Cr^{2+}_{(aq)} + 2\,e^- \rightleftharpoons Cr_{(s)}$ |
          | D | $2\,H_2O_{(\ell)} \rightleftharpoons O_{2(g)} + 2\,H_{2(g)}$ |
        reasoning: |-
          La plaque d'acier est la cathode (question 1) : il s'y produit une réduction, celle qui dépose le chrome métal observé.

          A et D décrivent toutes deux une transformation à l'électrode de graphite (l'oxydation de l'eau) : hors sujet ici, à la plaque d'acier. C propose de réduire un ion $Cr^{2+}_{(aq)}$ — cet ion n'apparaît nulle part dans les données, qui ne donnent que le couple $Cr^{3+}/Cr$. Faux.

          B réduit exactement l'ion donné dans les données, $Cr^{3+}_{(aq)}$, en chrome métal $Cr_{(s)}$ — cohérent avec le dépôt de chrome observé sur la plaque d'acier. $\boxed{\text{B}}$.
      - id: q4
        part: "Partie 1 — Masse de chrome déposée (loi de Faraday)"
        stem: |-
          **(0,75 pt)** L'électrolyse a duré $\Delta t = 2\ \text{h}$. Déterminer la masse $m(Cr)$ de chrome déposé sur la plaque d'acier.
        reasoning: |-
          On applique la même chaîne qu'au rung 4 — courant et durée donnent la quantité d'électricité, la constante de Faraday la convertit en quantité de matière d'électrons — mais avec un coefficient différent de celui des exemples travaillés de la leçon : la demi-équation de la question 2.2 dit que chaque atome de chrome déposé mobilise **trois** électrons, pas deux. C'est exactement le geste décrit au rung 5 pour la galvanoplastie — l'objet à recouvrir (ici la plaque d'acier) est branché en cathode, et son dépôt métallique se chiffre par cette même loi de Faraday ; le chrome y est d'ailleurs cité comme exemple de métal déposé. On convertit d'abord la durée en secondes, indispensable avant tout calcul de charge.
        steps:
          - math: '\Delta t = 2\times 3600 = 7200\ \text{s}'
            note: "Conversion de la duree en secondes avant tout calcul de charge."
          - math: 'Q = I\,\Delta t = 2\times 7200 = 1{,}44\times10^{4}\ \text{C}'
            note: "Quantite d'electricite debitee par le generateur."
          - math: 'n(e^-) = \frac{Q}{F} = \frac{1{,}44\times10^{4}}{96500}'
            note: "Loi de Faraday : conversion de la charge en quantite de matiere d'electrons."
          - math: '\boxed{n(e^-) \approx 0{,}1492\ \text{mol}}'
            note: "Application numerique."
          - math: 'n(Cr) = \frac{n(e^-)}{3} \approx \frac{0{,}1492}{3}'
            note: "Cr3+ + 3 e- -> Cr (question 2.2) : trois electrons par atome de chrome depose, pas deux comme dans les exemples de la lecon."
          - math: '\boxed{n(Cr) \approx 4{,}97\times10^{-2}\ \text{mol}}'
            note: "Application numerique."
          - math: 'm(Cr) = n(Cr)\times M(Cr) \approx 4{,}97\times10^{-2}\times 52'
            note: "Conversion mole -> masse par la masse molaire du chrome."
          - math: '\boxed{m(Cr) \approx 2{,}59\ \text{g}}'
            note: "Masse de chrome deposee sur la plaque d'acier pendant Delta t."

