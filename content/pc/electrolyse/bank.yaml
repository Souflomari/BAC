    intro: |-
      **Électrolyse d'une solution de chlorure de nickel II (examen national, session de rattrapage 2013 — Chimie, Première partie, 2,00 points sur les 07,00 de l'exercice de Chimie).**

      *Les deux autres parties du même exercice de Chimie sont indépendantes et vivent ailleurs : la réaction de l'acide méthanoïque avec l'eau (2,25 pt) sous « Réactions acido-basiques » (entrée bk-2013-r-x1b), et la synthèse du méthanoate d'éthyle (2,75 pt) sous « Estérification et hydrolyse » (entrée bk-2013-r-x1c). Rien de ce qui suit n'en dépend ; 2,00 + 2,25 + 2,75 = 7,00, le barème imprimé.*

      L'électrolyse a plusieurs applications dans le domaine industrièl *(« industrièl » tel qu'imprimé, pour « industriel »)*, en particulier la synthèse de quelques métaux et gaz. Le but de cet exercice est la synthèse du métal nickel par la technique d'électrolyse.

      **Données :**
      - La masse molaire du **nickel** <!-- DÉFAUT DE L'ÉDITION OFFICIELLE, DÉCLARÉ ET RÉPARÉ ICI (D1), 2026-09-04.
           Le document officiel francophone imprime, mot pour mot : « La masse
           molaire du cuivre : M(Ni) = 58,7 g.mol-1 ». Le MOT est faux : 58,7
           g/mol est la masse molaire du NICKEL (celle du cuivre vaut 63,5), et
           l'original arabe RS28 écrit bien « الكتلة المولية للنيكل », « la masse
           molaire du nickel ». Le symbole M(Ni) et la valeur 58,7 imprimés sont,
           eux, corrects, et c'est le nickel que la question 3 demande de peser :
           aucune question ne devient insoluble, et la réparation ne touche qu'un
           mot. Elle est faite ici, et déclarée, plutôt que faite en silence.
           IMPORTANT POUR LA CLASSIFICATION : l'édition française de ce sujet est
           MINISTÉRIELLE (code d'examen RS28 encadré, imprimé à l'identique dans
           les deux cartouches ; pieds de page vides sur les six pages ; aucun
           crédit de traducteur). Ce n'est donc PAS un artefact de traduction
           professorale — c'est un défaut de l'édition OFFICIELLE de langue
           française. Voir docs/sujets/_incoming/pc-2013-r.md, D1 et V.7/V.8. --> : $M(\text{Ni}) = 58{,}7\ \text{g.mol}^{-1}$ ;
      - La constante de Faraday : $\mathcal{F} = 9{,}65\times10^{4}\ \text{C.mol}^{-1}$. *(Le sujet compose ce symbole en écriture calligraphique — notation d'époque, pas un glyphe cassé.)*

      Pour produire le métal nickel, on réalise l'électrolyse d'une solution de chlorure de nickel II de formule $\left(\text{Ni}^{2+}_{(aq)} + 2\,\text{C}\ell^{-}_{(aq)}\right)$. *(Le chlore est noté $\text{C}\ell$ dans les deux éditions du sujet : c'est la convention marocaine, à reproduire et non à « corriger ».)*

      On verse cette solution dans un électrolyseur en forme de U, et on y fait circuler, entre deux électrodes immérgées *(sic, pour « immergées »)* dans la solution, un courant électrique continu, d'intensité constante $I = 0{,}5\ \text{A}$, pendant une durée d'une heure ($\Delta t = 1\ \text{h}$).

      La cathode est en platine, et l'anode en graphite. On constate, au cours de l'électrolyse, un dépôt de nickel sur la cathode et dégagement du dichlore au voisinage de l'anode.
    questions:
      - id: q1
        part: "Chimie, Première partie — Électrolyse d'une solution de chlorure de nickel II"
        stem: |-
          **1-** (0,5 pt) Préciser les couples (Oxydant/Réducteur), intervenants dans cette électrolyse. *(« intervenants » et la virgule qui le précède sont tels qu'imprimés — le participe présent est invariable, et la virgule est parasite.)*
        reasoning: |-
          C'est le geste du chapitre 2, et il se fait **sans regarder la polarité du générateur** : l'énoncé n'en donne aucune, mais il donne mieux — il dit ce qu'on **observe** à chaque électrode.

          - Sur la **cathode** (en platine), il se forme un **dépôt de nickel métallique**. Un ion métallique qui redevient métal a **gagné** des électrons : c'est une **réduction**, et le couple qui la porte est $\left(\text{Ni}^{2+}_{(aq)}/\text{Ni}_{(s)}\right)$.
          - Au voisinage de l'**anode** (en graphite), il se **dégage du dichlore**. L'ion chlorure de la solution a **perdu** un électron pour devenir $\text{C}\ell_2$ : c'est une **oxydation**, et le couple est $\left(\text{C}\ell_{2(g)}/\text{C}\ell^{-}_{(aq)}\right)$.

          Le nom des deux électrodes suit alors le chapitre 3, et il est le même dans une pile et dans un électrolyseur : **la cathode est le siège de la réduction, l'anode celui de l'oxydation**. Ce qui s'inverse entre pile et électrolyse, c'est la **polarité** — dans un électrolyseur, l'anode est reliée à la borne **+** du générateur et la cathode à la borne **−** —, jamais la définition.

          **Le piège de cette question.** Chercher la polarité pour décider qui est la cathode : elle n'est pas donnée ici, et il n'en faut pas. L'observation chimique suffit, et c'est toujours elle qui est la plus sûre — un dépôt de métal est une réduction, un dégagement de dihalogène à partir de son ion est une oxydation.
      - id: q2
        stem: |-
          **2-** (0,75 pt) Ecrire l'équation modélisant la réaction ayant lieu au voisinage de chaque électrode, et l'équation bilan modélisant cette transformation. *(« Ecrire », E majuscule non accentué, tel qu'imprimé.)*
        reasoning: |-
          On écrit chaque demi-équation dans le sens où elle a réellement lieu (chapitre 2), puis on les additionne en **égalisant les électrons** : c'est cette égalisation qui donne le bilan, et elle est ici immédiate parce que les deux demi-équations mettent en jeu **deux** électrons chacune.

          À la cathode, la réduction du cation nickel consomme deux électrons par atome déposé. À l'anode, l'oxydation de deux ions chlorure en libère deux et forme une molécule de dichlore. Les deux nombres coïncident : on somme membre à membre, les électrons disparaissent, et il reste le bilan.

          **Contrôle gratuit sur le bilan.** À gauche comme à droite, on compte un nickel, deux chlores, et une charge totale nulle ($+2 - 2 = 0$ à gauche, $0$ à droite). Une équation bilan d'électrolyse qui ne s'équilibre pas en charge est fausse avant même d'être lue.
        steps:
          - math: '\text{Ni}^{2+}_{(aq)} + 2\,e^{-} \rightarrow \text{Ni}_{(s)}'
            note: "Cathode (en platine) : reduction des ions nickel II, deux electrons par atome depose."
          - math: '2\,\text{C}\ell^{-}_{(aq)} \rightarrow \text{C}\ell_{2(g)} + 2\,e^{-}'
            note: "Anode (en graphite) : oxydation des ions chlorure, degagement de dichlore."
          - math: '\boxed{\text{Ni}^{2+}_{(aq)} + 2\,\text{C}\ell^{-}_{(aq)} \rightarrow \text{Ni}_{(s)} + \text{C}\ell_{2(g)}}'
            note: "Equation bilan : les deux demi-equations mettent en jeu deux electrons chacune, la somme les elimine."
      - id: q3
        stem: |-
          **3-** (0,75 pt) Trouver la masse $m$ du dépôt du métal nickel ainsi produit.
        reasoning: |-
          C'est la chaîne du chapitre 5, prise dans le sens direct — et c'est exactement la même loi de Faraday que dans une pile, appliquée à l'envers : ici c'est le générateur qui impose la quantité d'électricité, et la chimie qui suit.

          Trois maillons, dans cet ordre :

          1. le courant et la durée donnent la **quantité d'électricité** $Q = I\,\Delta t$ ;
          2. la constante de Faraday la convertit en **quantité de matière d'électrons**, $n(e^-) = Q/\mathcal{F}$ ;
          3. la **demi-équation de la cathode** (question 2) dit combien d'électrons il faut par atome déposé — **deux** ici, pas un : $n(\text{Ni}) = n(e^-)/2$.

          Ce facteur $2$ est le seul endroit où l'on peut se tromper sans que le calcul proteste : il ne vient pas de la loi de Faraday, mais de la demi-équation qu'on vient d'écrire.

          **Le piège d'unité.** $\Delta t$ est donné en heures et $\mathcal{F}$ est en coulombs par mole : il faut passer en **secondes** avant tout, sans quoi la masse sort 3 600 fois trop petite.
        steps:
          - math: '\Delta t = 1\ \text{h} = 3600\ \text{s}'
            note: "Conversion prealable : la constante de Faraday est en C par mole, donc le temps doit etre en secondes."
          - math: 'Q = I\,\Delta t = 0{,}5\times 3600 = 1800\ \text{C}'
            note: "Quantite d'electricite debitee pendant l'electrolyse (chapitre 5)."
          - math: 'n(e^-) = \frac{Q}{\mathcal{F}} = \frac{1800}{9{,}65\times10^{4}} \approx 1{,}865\times10^{-2}\ \text{mol}'
            note: "Quantite de matiere d'electrons echanges, loi de Faraday."
          - math: 'n(\text{Ni}) = \frac{n(e^-)}{2} \approx 9{,}33\times10^{-3}\ \text{mol}'
            note: "Deux electrons par atome depose, d'apres la demi-equation de cathode ecrite a la question 2."
          - math: '\boxed{m = \frac{I\,\Delta t}{2\,\mathcal{F}}\,M(\text{Ni}) = \frac{0{,}5\times3600}{2\times9{,}65\times10^{4}}\times 58{,}7 \approx 0{,}547\ \text{g}}'
            note: "Masse de nickel deposee, environ 0,55 g. La valeur re-derivee par la passe de verification est 0,5474 g."

