        devinée), et 27 questions du sujet entier re-dérivées, dont les
        trois de ce bloc. Physique re-dérivée ici, conforme à la source :
        $Q = I\Delta t = 3\times1500 = 4500$ C $\Rightarrow n(e^-) =
        Q/\mathcal{F} \approx 4{,}66\times10^{-2}$ mol $\Rightarrow
        n(Cl_2) = n(e^-)/2 \approx 2{,}33\times10^{-2}$ mol $\Rightarrow
        V(Cl_2) = n(Cl_2)\times V_m \approx 0{,}583$ L — aucune divergence
        avec la source.
    intro: |-
      **Électrolyse d'une solution concentrée de chlorure de sodium (examen national, session normale 2015, Exercice 1 — Première Partie, 2,25 points).**

      L'électrolyse permet d'obtenir des gaz d'une grande pureté.

      On réalise l'électrolyse d'une solution concentrée de chlorure de sodium $(\text{Na}^+_{(aq)} + \text{Cl}^-_{(aq)})$ : on obtient un dégagement de dichlore au voisinage de l'une des électrodes, et un dégagement de dihydrogène au voisinage de l'autre électrode ; de plus, le milieu réactionnel devient basique au cours de la transformation chimique.

      **Données :**
      - Les couples intervenant dans la transformation chimique : $(\text{H}_2\text{O}_{(\ell)}/\text{H}_{2(g)})$ et $(\text{Cl}_{2(g)}/\text{Cl}^-_{(aq)})$ ;
      - Le faraday : $\mathcal{F} = 9{,}65\times10^{4}\ \text{C.mol}^{-1}$ ;
      - Le volume molaire dans les conditions de l'expérience : $V_m = 25{,}0\ \text{L.mol}^{-1}$.

      **Figure (schéma du dispositif, sans numéro imprimé).** Un tube en U contient la solution. En haut, un générateur — un cercle traversé par le fil du circuit — porte le signe $+$ à sa **gauche** et le signe $-$ à sa **droite**. Le fil descend de chaque côté vers une électrode : celle de gauche, reliée à la borne $+$, porte l'étiquette « Electrode (B) » ; celle de droite, reliée à la borne $-$, porte l'étiquette « Electrode (A) ». Chaque branche du tube porte, en haut, une sortie de gaz (« Sortie du gaz ») — le dessin ne dit pas quel gaz sort de quel côté, c'est précisément ce que les questions 1 et 2 établissent. En bas, une légende désigne la « Solution concentrée de chlorure de sodium ».
    questions:
      - id: q1
        part: "Première Partie — Électrolyse d'une solution de chlorure de sodium"
        stem: |-
          **1-** (0,5 pt) Déterminer laquelle, parmi les électrodes (A) et (B), joue le rôle de l'anode, et celle qui joue le rôle de la cathode.
        reasoning: |-
          Comme au chapitre 2, l'anode et la cathode se distinguent par le mécanisme qui s'y produit — jamais par leur position sur le papier. Mais ici, contrairement à bk-2022-r-x1 de cette même banque (électrolyse de l'or, sans aucune polarité dessinée), le générateur EST représenté avec ses deux bornes : c'est donc le chapitre 3 qui tranche directement. En électrolyse, c'est le générateur qui impose la polarité, et sa borne $+$ arrache des électrons à l'électrode qu'elle alimente — ce qui y force une oxydation.

          Sur la figure, le signe $+$ est à GAUCHE du cercle du générateur, et le fil de gauche rejoint l'électrode (B) ; le signe $-$ est à DROITE, et le fil de droite rejoint l'électrode (A).

          L'électrode (B), reliée à la borne $+$, est donc l'**anode** (siège de l'oxydation) ; l'électrode (A), reliée à la borne $-$, est la **cathode** (siège de la réduction).

          **Le piège de cette question.** Deviner la polarité au lieu de la lire : elle est bel et bien donnée sur ce sujet (contrairement à bk-2022-r-x1), et rien n'oblige la borne $+$ à être à droite ou à gauche par convention — c'est le signe imprimé à côté du cercle qui tranche, ici à gauche.
      - id: q2
        stem: |-
          **2-** (0,75 pt) Écrire l'équation de la réaction ayant lieu au voisinage de chaque électrode, et l'équation bilan de cette électrolyse.
        reasoning: |-
          Même geste qu'au chapitre 2 : une demi-équation par électrode, dans le sens que le mécanisme impose, puis la somme équilibrée en électrons.

          À l'anode (B), il faut une espèce qui CÈDE des électrons. Parmi les deux couples donnés, seul $\text{Cl}^-$ — la forme réduite du couple $\text{Cl}_2/\text{Cl}^-$ — peut le faire : il s'oxyde en dichlore, cohérent avec le dégagement de gaz observé à ce voisinage.

          À la cathode (A), il faut une espèce qui CAPTE des électrons. Aucun cation métallique n'est en jeu ici (contrairement au chromage ou au dorage d'autres entrées de cette banque) : c'est l'eau elle-même, via le couple $\text{H}_2\text{O}/\text{H}_2$, qui se réduit en dihydrogène — en libérant, au passage, des ions hydroxyde $\text{HO}^-$. C'est exactement ce qui explique le second fait rapporté par l'énoncé : le milieu devient basique.

          Les deux demi-équations échangent chacune $2\,e^-$ : elles s'annulent directement dans la somme, sans qu'il faille en multiplier aucune.

          **Le piège de cette question.** Chercher un cation métallique à réduire à la cathode, par réflexe (c'est le cas dans la plupart des autres électrolyses de cette banque) : ici la solution ne contient que $\text{Na}^+$, un ion qui n'est PAS réductible en solution aqueuse (il ne fait partie d'aucun des deux couples donnés) — c'est l'eau du solvant qui réagit à sa place, et c'est ce détail qui produit la basicité observée.
        steps:
          - math: '2\,Cl^-_{(aq)} \rightarrow Cl_{2(g)} + 2\,e^-'
            note: "A l'anode (B) : oxydation des ions chlorure."
          - math: '2\,H_2O_{(\ell)} + 2\,e^- \rightarrow H_{2(g)} + 2\,HO^-_{(aq)}'
            note: "A la cathode (A) : reduction de l'eau, liberation d'ions hydroxyde - explique le milieu qui devient basique."
          - math: '\boxed{2\,H_2O_{(\ell)} + 2\,Cl^-_{(aq)} \rightarrow H_{2(g)} + Cl_{2(g)} + 2\,HO^-_{(aq)}}'
            note: "Bilan : les 2 electrons de chaque cote s'eliminent."
      - id: q3
        part: "Première Partie — Loi de Faraday : volume de dichlore"
        stem: |-
          **3-** (1 pt) Le générateur alimente le circuit avec un courant électrique d'intensité constante $I = 3\ \text{A}$. Calculer le volume du dichlore formé pendant la durée $\Delta t = 25\ \text{min}$.
        reasoning: |-
          On applique la chaîne du chapitre 5, dans le sens direct cette fois (contrairement à bk-2019-n-x1 ou bk-2023-r-x1 de cette même banque, où c'était une masse ou une durée à retrouver) : le courant et la durée sont donnés, donc la quantité d'électricité $Q$ se calcule directement ; la constante de Faraday la convertit en quantité de matière d'électrons ; et la demi-équation de l'ANODE (question 2) — pas celle de la cathode, puisque c'est le dichlore, formé à l'anode, qui est demandé ici — dit que chaque molécule de $\text{Cl}_2$ mobilise deux électrons.

          SCOPE NOTE (voir l'en-tête du fichier, comme pour bk-2018-n-x1) : convertir cette quantité de matière de gaz en volume par le volume molaire $V_m$ n'est traité par aucun chapitre de cette leçon — le chapitre 5 ne chiffre que des masses déposées, jamais des volumes de gaz. C'est une relation générale de chimie ($n = V/V_m$), mobilisée ici sans qu'aucun chapitre ne l'introduise, avec le $V_m$ donné dans l'énoncé.
        steps:
          - math: '\Delta t = 25\ \text{min} = 25\times60 = 1500\ \text{s}'
            note: "Conversion de la duree en secondes avant tout calcul de charge."
          - math: 'Q = I\,\Delta t = 3\times1500 = 4500\ \text{C}'
            note: "Quantite d'electricite debitee par le generateur, intensite constante (chapitre 5)."
          - math: 'n(e^-) = \frac{Q}{\mathcal{F}} = \frac{4500}{9{,}65\times10^{4}}'
            note: "Loi de Faraday : conversion de la charge en quantite de matiere d'electrons."
          - math: '\boxed{n(e^-) \approx 4{,}66\times10^{-2}\ \text{mol}}'
            note: "Application numerique."
          - math: 'n(Cl_2) = \frac{n(e^-)}{2} \approx \frac{4{,}66\times10^{-2}}{2}'
            note: "2 Cl- -> Cl2 + 2 e- (question 2, demi-equation de l'anode) : deux electrons par molecule de dichlore formee."
          - math: '\boxed{n(Cl_2) \approx 2{,}33\times10^{-2}\ \text{mol}}'
            note: "Application numerique."
          - math: 'V(Cl_2) = n(Cl_2)\times V_m \approx 2{,}33\times10^{-2}\times25{,}0'
            note: "Conversion mole -> volume par le volume molaire des gaz, donne dans l'enonce (hors chapitres de cette lecon, meme pont que bk-2018-n-x1)."
          - math: '\boxed{V(Cl_2) \approx 0{,}583\ \text{L}}'
            note: "Volume de dichlore degage pendant Delta t."

