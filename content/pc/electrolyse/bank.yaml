        laboratoires », et le DOUBLE ESPACE réel « ℱ  = 9,65.10⁴ »
        (contrôlé au caractère : deux glyphes espace distincts de largeur
        normale) ; registre complet en docs/sujets/_incoming/pc-2012-r.md
        § 5 et V.12. ⚠️ LE CORRIGÉ ARABE N'EST QU'UN TÉMOIN DE VALEURS,
        JAMAIS UN ARBITRE (K-8), et ce bloc en donne la démonstration la
        plus nette du sujet : il corrobore le résultat (1,18 g) mais SON
