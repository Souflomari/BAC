#                                         spontanée (le générateur impose le sens
#                                         inverse, il n'accélère pas le spontané).
#   cp-electrolyse-vs-pile (after R1)  — rupture gate: électrolyse vs PILE — une
#                                         cellule d'électrolyse CONSOMME de
#                                         l'énergie, elle n'en produit pas.
#   cp-anode-cathode       (after R2)  — rupture gate: nommer anode/cathode et
#                                         la polarité imposée (anode = borne +,
