#   cp-faraday             (after R4)  — rupture gate: Q = I·Δt = n·F, avec la
#                                         stœchiométrie électronique correcte.
#
# Clone note: cp-forcee-vs-spontanee clones ELECTROLYSE-9's stem,
# cp-electrolyse-vs-pile clones ELECTROLYSE-3's, cp-anode-cathode clones
