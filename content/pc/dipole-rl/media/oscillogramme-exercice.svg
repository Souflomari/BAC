<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Oscillogramme de l’exercice : i (mA) en fonction de t (ms), courbe montant vers l’asymptote I_max = 120 mA, tangente à l’origine coupant l’asymptote en τ = 4 ms, point à 63 % (i ≈ 75,8 mA).">
  <title>Oscillogramme i(t) — exercice</title>
  <!--
    oscillogramme-exercice.svg — graphe de l'exercice de type bac de R5 :
    i(t) = I_max(1 - e^(-t/tau)) avec I_max = 120 mA, tau = 4 ms.
    Révélation progressive 3 étapes (LESSON-EXPERIENCE-SPEC §2.5 — un graphe
    est TOUJOURS staged, ordre canonique axes → données → lecture) :
      step-1 : les axes — t (ms) / i (mA), quadrillage, échelle numérotée
      step-2 : les données — la courbe i(t) et l'asymptote I_max = 120 mA
      step-3 : la lecture — tangente à l'origine, τ = 4 ms, point à 63 %

    Géométrie (calculée, pas devinée) :
      origine (t=0, i=0)   : (x0,y0) = (100, 224)
      échelle temporelle   : 25 px/ms   → t=20 ms en x=600
      échelle de courant    : 1,2 px/mA → I_max=120 mA en y=80 (hauteur 144px)
      tau = 4 ms            → x = 100 + 4*25 = 200

    La courbe est une polyligne calculée exactement via
    i(t) = 120*(1 - e^(-t/4)) à des pas réguliers de tau/6 ≈ 0,667 ms
    (Δx = 16,667 px), de t=0 à t=20 ms — jamais une bézier devinée à la main.

    Propriété vérifiée par construction : la tangente à l'origine, de pente
    hauteur/tau_px = 144/100, part de (100,224) et atteint EXACTEMENT
    (100+100, 224-144) = (200,80) — le point où l'asymptote est croisée à
    t = tau = 4 ms, conforme à l'énoncé de l'exercice (R5).

    Au même x=200 (t=tau), la courbe réelle vaut i=75,85 mA (y=133,0), soit
    un facteur (224-133,0)/144 = 0,632 ≈ 1 - e^-1 — la méthode des 63 %,
    cohérente avec la valeur donnée dans le corrigé de l'exercice
    (i(τ) ≈ 75,8 mA).

    Rôle des couleurs (cohérent avec i-etablissement.svg) :
      courbe i(t)                    : --figure-accent
      tangente à l'origine + repère τ : --figure-energy-L (écho : τ = L/R)
      asymptote / axes / quadrillage / repère 63 % : --figure-ink-soft
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes : quadrillage, échelle numérotée
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- Titre -->
    <text x="330" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Oscillogramme i(t) — exercice
    </text>

    <!-- Fond du panneau -->
    <rect x="30" y="32" width="600" height="224" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Quadrillage horizontal (i = 30, 60, 90 mA) -->
    <line x1="100" y1="188" x2="608" y2="188" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="100" y1="152" x2="608" y2="152" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="100" y1="116" x2="608" y2="116" stroke="var(--figure-grid)" stroke-width="0.75"/>

    <!-- Quadrillage vertical (t = 5, 10, 15, 20 ms) -->
    <line x1="225" y1="60" x2="225" y2="224" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="350" y1="60" x2="350" y2="224" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="475" y1="60" x2="475" y2="224" stroke="var(--figure-grid)" stroke-width="0.75"/>
    <line x1="600" y1="60" x2="600" y2="224" stroke="var(--figure-grid)" stroke-width="0.75"/>

    <!-- Axes -->
    <line x1="100" y1="224" x2="604" y2="224" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="616,224 604,219.5 604,228.5" fill="var(--figure-ink-soft)"/>
    <line x1="100" y1="224" x2="100" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="100,48 95.5,59 104.5,59" fill="var(--figure-ink-soft)"/>

    <text x="624" y="228" font-size="11" fill="var(--figure-ink-soft)">
      <tspan font-style="italic">t</tspan><tspan font-size="9"> (ms)</tspan>
    </text>
    <text x="92" y="56" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)">
      <tspan font-style="italic">i</tspan><tspan font-size="9"> (mA)</tspan>
    </text>
    <text x="92" y="228" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>

    <!-- Graduations t -->
    <text x="225" y="240" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">5</text>
    <text x="350" y="240" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">10</text>
    <text x="475" y="240" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">15</text>
    <text x="600" y="240" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">20</text>

    <!-- Graduations i -->
    <text x="92" y="191" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">30</text>
    <text x="92" y="155" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">60</text>
    <text x="92" y="119" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">90</text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : la courbe i(t) et l'asymptote I_max
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- Asymptote horizontale I_max = 120 mA -->
    <line x1="100" y1="80" x2="608" y2="80" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="92" y="72" text-anchor="end" font-size="10.5" fill="var(--figure-ink-soft)">
      I<tspan dy="3" font-size="7.5">max</tspan><tspan dy="-3"> = 120 mA</tspan>
    </text>

    <!--
      Courbe i(t) — polyligne calculée, pas = tau/6 ≈ 0,667 ms (Δx = 16,667 px),
      de t=0 à t=20 ms. i(t) = 120*(1 - e^(-t/4)) ; y = 224 - 1,2*i.
    -->
    <path d="
      M100,224
      L116.7,201.9 L133.3,183.2 L150,167.3 L166.7,153.9 L183.3,142.6
      L200,133.0  L216.7,124.8 L233.3,118.0 L250,112.1  L266.7,107.2
      L283.3,103.0 L300,99.5  L316.7,96.5  L333.3,94.0  L350,91.8
      L366.7,90.0 L383.3,88.5 L400,87.2   L416.7,86.1  L433.3,85.1
      L450,84.3   L466.7,83.7 L483.3,83.1 L500,82.6   L516.7,82.2
      L533.3,81.9 L550,81.6   L566.7,81.4 L583.3,81.1 L600,81.0
    " fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"/>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : tangente, τ = 4 ms, point à 63 %
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!--
      Tangente à l'origine — droite exacte de (100,224) [pente = hauteur/tau_px]
      jusqu'à (200,80), où elle rencontre l'asymptote pile à t = tau = 4 ms.
    -->
    <line x1="100" y1="224" x2="200" y2="80"
          stroke="var(--figure-energy-L)" stroke-width="1.8"
          stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Repère vertical à t = tau -->
    <line x1="200" y1="80" x2="200" y2="224"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="220" x2="200" y2="228"
          stroke="var(--figure-energy-L)" stroke-width="1.6"/>
    <text x="200" y="250" text-anchor="middle" font-size="10.5" fill="var(--figure-energy-L)">
      <tspan font-style="italic">τ</tspan><tspan> = 4 ms</tspan>
    </text>

    <!-- Point : intersection tangente/asymptote, à t = tau -->
    <circle cx="200" cy="80" r="3.2" fill="var(--figure-energy-L)"/>

    <!-- Point : valeur réelle de la courbe à t = tau (méthode des 63 %) -->
    <circle cx="200" cy="133.0" r="3.2" fill="var(--figure-accent)"/>
    <line x1="204" y1="136" x2="260" y2="160"
          stroke="var(--figure-ink-soft)" stroke-width="0.9" stroke-dasharray="3,2"/>
    <text x="266" y="163" font-size="9.5" fill="var(--figure-ink)">
      i(<tspan font-style="italic">τ</tspan>) ≈ 75,8 mA
    </text>
    <text x="266" y="176" font-size="9" fill="var(--figure-ink-soft)">(méthode des 63 %)</text>

  </g><!-- /step-3 -->

</svg>
