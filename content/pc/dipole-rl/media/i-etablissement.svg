<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Établissement du courant i(t) dans un dipôle RL : montée exponentielle de 0 vers l'asymptote I_max, tangente à l'origine coupant l'asymptote en t = τ, et point à 63 % sur la courbe réelle.">
  <title>Établissement du courant i(t)</title>
  <!--
    i-etablissement.svg — graphe de i(t) = I_max(1 - e^(-t/tau)) pendant
    l'établissement du courant dans un dipôle RL. Révélation progressive
    3 étapes (LESSON-EXPERIENCE-SPEC §2.5 — un graphe est TOUJOURS staged,
    ordre canonique axes → données → lecture) :
      step-1 : le repère (titre, panneau, axes t/i)
      step-2 : les données — la courbe i(t) et sa formule
      step-3 : la lecture — asymptote I_max, tangente à l'origine,
               construction de τ, annotation de la méthode des 63 %

    Géométrie du tracé (calculée, pas devinée) :
      origine (t=0, i=0)  : (x0,y0)   = (80, 208)
      sommet i-axis       : (80, 50)
      asymptote I_max     : y = 78            → hauteur = y0 - 78 = 130 px
      échelle temporelle  : tau_px = 84 px     (1 tau = 84 px sur x)

    La courbe est un polyligne de points calculés exactement via
    i/I_max = 1 - e^(-t/tau) à des pas réguliers de 14px (= tau/6) — jamais
    une bézier devinée à la main, pour garantir l'exactitude physique.

    Propriété vérifiée par construction : la tangente à l'origine, de pente
    hauteur/tau_px = 130/84, part de (80,208) et atteint EXACTEMENT
    (80+84, 208-130) = (164,78) — le point où l'asymptote est croisée à
    t = tau. C'est la propriété que R3 du texte décrit ("la tangente...
    coupe l'asymptote...en t = tau"), pas une approximation graphique.

    Au même x=164 (t=tau), la courbe réelle vaut y=125.8, soit un facteur
    (208-125.8)/130 = 0,632 ≈ 1 - e^-1 — la méthode des 63 % (R3, deuxième
    méthode). Les deux méthodes sont donc visibles sur la même figure, au
    même repère vertical x=164, avec deux repères visuels distincts.

    Rôle des couleurs (cohérent avec rl-schema.svg) :
      courbe i(t)                    : --figure-accent
      tangente à l'origine + repère τ : --figure-energy-L (écho : τ = L/R)
      asymptote / axes / repère 63 %  : --figure-ink-soft (neutre)
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le repère : titre, panneau, axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- Titre -->
    <text x="320" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Établissement du courant i(t) — dipôle RL
    </text>

    <!-- Fond du panneau -->
    <rect x="40" y="32" width="590" height="200" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- ── Axes ──────────────────────────────────────────────── -->
    <line x1="80" y1="208" x2="610" y2="208"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="610,208 598,203.5 598,212.5" fill="var(--figure-ink-soft)"/>
    <line x1="80" y1="208" x2="80" y2="50"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,50 75.5,61 84.5,61" fill="var(--figure-ink-soft)"/>
    <text x="617" y="212" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="72" y="54" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">i</text>
    <text x="72" y="212" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : la courbe i(t) et sa formule
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- Boîte formule -->
    <rect x="260" y="40" width="230" height="32" rx="5"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="375" y="61" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">i(t) = I<tspan
          dy="4" font-size="9">max</tspan><tspan
          dy="-4"> (1 - e</tspan><tspan
          dy="-5" font-size="9">-t/τ</tspan><tspan
          dy="5">)</tspan>
    </text>

    <!--
      Courbe i(t) — polyligne calculée, pas=14px (=tau/6), de t=0 à t=5tau,
      puis deux points de prolongement doux jusqu'au bord du panneau.
    -->
    <path d="
      M80,208
      L94,188.0 L108,171.2 L122,156.9 L136,144.7 L150,134.5
      L164,125.8 L178,118.5 L192,112.3 L206,107.0 L220,102.6
      L234,98.8  L248,95.6  L262,92.9  L276,90.6  L290,88.7
      L304,87.0  L318,85.7  L332,84.5  L346,83.5  L360,82.6
      L374,81.9  L388,81.3  L402,80.8  L416,80.4  L430,80.0
      L444,79.7  L458,79.4  L472,79.2  L486,79.0  L500,78.9
      L540,78.5  L580,78.3
    " fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"/>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : asymptote, tangente, construction de τ,
       annotation de la méthode des 63 %
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- Asymptote horizontale I_max -->
    <line x1="80" y1="78" x2="610" y2="78"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="68" y="82" text-anchor="end" font-size="10.5"
          fill="var(--figure-ink-soft)">I<tspan dy="3" font-size="7.5">max</tspan></text>

    <!--
      Tangente à l'origine — droite exacte de (80,208) [pente = hauteur/tau_px]
      jusqu'à (164,78), où elle rencontre l'asymptote pile à t = tau.
    -->
    <line x1="80" y1="208" x2="164" y2="78"
          stroke="var(--figure-energy-L)" stroke-width="1.8"
          stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Repère vertical à t = tau (chute depuis l'intersection tangente/asymptote) -->
    <line x1="164" y1="78" x2="164" y2="208"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Petite marque sur l'axe t, à t = tau -->
    <line x1="164" y1="204" x2="164" y2="212"
          stroke="var(--figure-energy-L)" stroke-width="1.6"/>
    <text x="164" y="225" text-anchor="middle" font-size="11" font-style="italic"
          fill="var(--figure-energy-L)">τ</text>

    <!-- Point : intersection tangente/asymptote, à t = tau -->
    <circle cx="164" cy="78" r="3.2" fill="var(--figure-energy-L)"/>

    <!-- Point : valeur réelle de la courbe à t = tau (méthode des 63 %) -->
    <circle cx="164" cy="125.8" r="3.2" fill="var(--figure-accent)"/>
    <!-- Ligne de repère discrète vers le label (finding : ancrer les labels flottants) -->
    <line x1="167" y1="128" x2="222" y2="149"
          stroke="var(--figure-ink-soft)" stroke-width="0.9" stroke-dasharray="3,2"/>
    <text x="228" y="152" font-size="9.5" fill="var(--figure-ink)">i(τ) ≈ 0,63 · I<tspan dy="3" font-size="7">max</tspan></text>
    <text x="228" y="165" font-size="9" fill="var(--figure-ink-soft)">(méthode des 63 %)</text>

  </g><!-- /step-3 -->

</svg>
