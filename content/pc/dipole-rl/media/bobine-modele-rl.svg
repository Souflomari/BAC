<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="620" height="460"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="De la bobine réelle à son modèle électrique : l’objet enroulé (r, L), puis le modèle série L-r en boîte pointillée, puis la loi u = ri + L di/dt localisée sur chaque élément.">
  <title>La bobine : objet réel, modèle, loi localisée</title>
  <!--
    bobine-modele-rl.svg — 3 progressive steps (LESSON-EXPERIENCE-SPEC §2.5 —
    geste d'enseignement : l'objet réel devient un modèle, puis la loi se
    localise sur ce modèle) :
      step-1 : le composant réel — bobine enroulée, étiquetée "bobine (r, L)"
      step-2 : le modèle — boîte pointillée, L et r en série ("modèle de la
               bobine réelle")
      step-3 : la loi localisée — u en convention récepteur (i entre par le
               + ), ri attaché à r, L·di/dt attaché à L, équation de synthèse

    Layout (une seule colonne verticale, généreusement espacée) :
      objet réel   : capsule enroulée, y=90..140, bornes x=150/470
      connecteur    : flèche pointillée verticale à x=145 (objet → modèle)
      boîte modèle : pointillés, x=170..450, y=235..345, bornes x=140/480
      annotations  : flèche u au-dessus (y=222), +/- aux bornes, flèche i
                     à gauche, "ri"/"L·di/dt" sous les éléments, équation
                     de synthèse en bas

    Rôle des couleurs (cohérent avec rl-schema.svg / rlc-schema.svg) :
      r (résistance interne, loi d'Ohm)      : --figure-ink-soft
      L (inductance, auto-induction)         : --figure-energy-L
      u (tension aux bornes du dipôle entier) : --figure-accent
      structure neutre (fils, bornes, boîte)  : --figure-ink / --figure-ink-soft
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le composant réel
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- Titre -->
    <text x="310" y="24" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      La bobine : de l’objet réel à son modèle électrique
    </text>

    <!-- Capsule / noyau (représentation physique du fil enroulé) -->
    <rect x="210" y="90" width="200" height="50" rx="25"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>

    <!-- Enroulement : traits obliques évoquant le fil bobiné -->
    <g stroke="var(--figure-ink)" stroke-width="1.3" stroke-linecap="round">
      <line x1="235" y1="92" x2="245" y2="138"/>
      <line x1="250" y1="92" x2="260" y2="138"/>
      <line x1="265" y1="92" x2="275" y2="138"/>
      <line x1="280" y1="92" x2="290" y2="138"/>
      <line x1="295" y1="92" x2="305" y2="138"/>
      <line x1="310" y1="92" x2="320" y2="138"/>
      <line x1="325" y1="92" x2="335" y2="138"/>
      <line x1="340" y1="92" x2="350" y2="138"/>
      <line x1="355" y1="92" x2="365" y2="138"/>
      <line x1="370" y1="92" x2="380" y2="138"/>
      <line x1="385" y1="92" x2="395" y2="138"/>
    </g>

    <!-- Fils de sortie -->
    <line x1="150" y1="115" x2="210" y2="115" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="410" y1="115" x2="470" y2="115" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="115" r="3" fill="var(--figure-ink)"/>
    <circle cx="470" cy="115" r="3" fill="var(--figure-ink)"/>

    <!-- Étiquette -->
    <text x="310" y="168" text-anchor="middle" font-size="13" fill="var(--figure-ink)">
      bobine (<tspan font-style="italic" fill="var(--figure-ink-soft)">r</tspan>, <tspan
      font-style="italic" fill="var(--figure-energy-L)">L</tspan>)
    </text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — le modèle : L et r en série, boîte pointillée
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- Connecteur conceptuel : l'objet réel devient ce modèle -->
    <line x1="145" y1="182" x2="145" y2="258"
          stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="4,3" stroke-linecap="round"/>
    <polygon points="145,258 139,246 151,246" fill="var(--figure-ink-soft)"/>

    <!-- Boîte pointillée du modèle -->
    <rect x="170" y="235" width="280" height="110" rx="8"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.4" stroke-dasharray="5,4"/>

    <!-- Bornes du dipôle modèle -->
    <line x1="140" y1="290" x2="170" y2="290" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="450" y1="290" x2="480" y2="290" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="290" r="3" fill="var(--figure-ink)"/>
    <circle cx="480" cy="290" r="3" fill="var(--figure-ink)"/>

    <!-- Câblage interne : fil — L — fil — r — fil -->
    <line x1="170" y1="290" x2="210" y2="290" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <path d="M210,290 a13,9 0 0,1 26,0" fill="none" stroke="var(--figure-energy-L)" stroke-width="2.2"/>
    <path d="M236,290 a13,9 0 0,1 26,0" fill="none" stroke="var(--figure-energy-L)" stroke-width="2.2"/>
    <path d="M262,290 a13,9 0 0,1 26,0" fill="none" stroke="var(--figure-energy-L)" stroke-width="2.2"/>
    <line x1="288" y1="290" x2="320" y2="290" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>

    <!-- Résistance r -->
    <rect x="320" y="275" width="50" height="30" rx="4"
          fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <line x1="330" y1="282" x2="330" y2="298" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="340" y1="282" x2="340" y2="298" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="350" y1="282" x2="350" y2="298" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="360" y1="282" x2="360" y2="298" stroke="var(--figure-ink-soft)" stroke-width="1"/>
    <line x1="370" y1="290" x2="450" y2="290" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>

    <!-- Étiquettes L et r -->
    <text x="249" y="270" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-energy-L)">L</text>
    <text x="345" y="270" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-ink-soft)">r</text>

    <!-- Légende de la boîte -->
    <text x="310" y="372" text-anchor="middle" font-size="11" fill="var(--figure-ink-soft)">
      modèle de la bobine réelle
    </text>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la loi localisée : u = ri + L di/dt
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- Flèche i, convention récepteur : entre par la borne + -->
    <line x1="70" y1="290" x2="136" y2="290" stroke="var(--figure-accent)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="136,290 124,285 124,295" fill="var(--figure-accent)"/>
    <text x="100" y="280" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">i</text>

    <!-- Signes de polarité (convention récepteur) -->
    <text x="156" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-ink)">+</text>
    <text x="480" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="var(--figure-ink)">−</text>

    <!-- Flèche u, sur tout le dipôle -->
    <line x1="190" y1="222" x2="430" y2="222" stroke="var(--figure-accent)" stroke-width="1.6"
          stroke-dasharray="5,3" stroke-linecap="round"/>
    <polygon points="430,222 418,217 418,227" fill="var(--figure-accent)"/>
    <text x="310" y="213" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">u</text>

    <!-- Terme attaché à L -->
    <text x="249" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-energy-L)">
      L·di/dt
    </text>

    <!-- Terme attaché à r -->
    <text x="345" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">
      ri
    </text>

    <!-- Équation de synthèse -->
    <rect x="190" y="392" width="240" height="34" rx="5" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="310" y="414" text-anchor="middle" font-size="13" font-style="italic">
      <tspan fill="var(--figure-accent)">u</tspan><tspan fill="var(--figure-ink)"> = </tspan><tspan
      fill="var(--figure-ink-soft)">ri</tspan><tspan fill="var(--figure-ink)"> + </tspan><tspan
      fill="var(--figure-energy-L)">L·di/dt</tspan>
    </text>

  </g><!-- /step-3 -->

</svg>
