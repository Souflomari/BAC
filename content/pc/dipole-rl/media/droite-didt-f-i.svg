<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Droite di/dt = f(i) pour le dipôle RL : ordonnée à l’origine E/L = 20 A/s en i = 0, droite de pente négative, racine (intersection avec l’axe des i) en i = E/R = 100 mA.">
  <title>Droite di/dt = f(i) — troisième lecture du dipôle RL</title>
  <!--
    droite-didt-f-i.svg — graphe de di/dt = f(i) pour le circuit
    (content/pc/dipole-rl/lesson.md, "Une troisième lecture") : à partir de
    L di/dt + (R0+r) i = E, on isole di/dt = E/L − ((R0+r)/L) i, une
    fonction AFFINE de i. STAGED (LESSON-EXPERIENCE-SPEC §2.5 — un graphe
    est TOUJOURS staged, ordre canonique axes → données → lecture) :
      step-1 : le repère — axe i (mA) en abscisse, axe di/dt (A/s) en
               ordonnée, croisant à l'origine (i=0, di/dt=0)
      step-2 : les données — la droite et sa formule
      step-3 : la lecture — l'ordonnée à l'origine (E/L) et la racine
               (E/(R0+r) = I_max), les deux valeurs que le texte donne

    Données numériques (texte, "Exemple numérique de cette lecture") :
      E = 6 V, R = R0+r = 60 Ω, L = 0,3 H
      ordonnée à l'origine : E/L = 6/0,3 = 20 A/s
      pente : −R/L = −60/0,3 = −200 s⁻¹
      racine : i = E/R = 6/60 = 0,1 A = 100 mA (= I_max, déjà donné aux
        chapitres 3-4 de cette même leçon — pas une valeur nouvelle à
        deviner, elle est répétée ici comme la leçon elle-même le fait)

    Repère écran (calculé, pas deviné) :
      origine (i=0, di/dt=0)      : (80, 200)
      échelle i                    : 4,4 px/mA   → i=100 mA en x=520
      échelle di/dt                : 7 px/(A/s)  → di/dt=20 A/s en y=60

    Droite tracée de (80,60) [i=0, di/dt=20] à (586,221) [i=115 mA,
    di/dt=20−0,2×115=−3 A/s] — un point de prolongement au-delà de la
    racine, pour que le franchissement de l'axe soit VISIBLE, pas simplement
    affirmé. Vérification que la droite passe exactement par la racine :
    au point milieu i=100 mA, x=80+100×4,4=520 ; y attendu par la droite
    entre les deux extrémités : 60 + (520−80)×(221−60)/(586−80)
    = 60 + 440×161/506 = 60 + 140,0 = 200,0 — exactement la ligne de zéro.
    La racine n'est donc pas positionnée à l'œil : elle tombe pile sur la
    droite tracée entre les deux points connus.

    Rôle des couleurs (cohérent avec i-etablissement.svg / oscillogramme-
    exercice.svg de cette même leçon) :
      droite (donnée)                        : --figure-accent
      ordonnée à l'origine, racine (lecture)  : --figure-energy-L (écho :
        cette lecture donne précisément L et R séparément)
      axes / "0"                             : --figure-ink-soft
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le repère : axes i (mA) / di/dt (A/s)
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Titre -->
    <text x="340" y="20" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Troisième lecture : la droite di/dt = f(i)
    </text>

    <!-- Fond du panneau -->
    <rect x="40" y="32" width="590" height="200" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axe vertical (di/dt) — traverse le zéro, positif ET négatif -->
    <line x1="80" y1="224" x2="80" y2="56"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="80,45 75.5,56 84.5,56" fill="var(--figure-ink-soft)"/>

    <!-- Axe horizontal (i) — seulement i ≥ 0 -->
    <line x1="80" y1="200" x2="604" y2="200"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="616,200 604,195.5 604,204.5" fill="var(--figure-ink-soft)"/>

    <!-- Étiquettes d'axes -->
    <text x="70" y="42" text-anchor="end" font-size="11"
          fill="var(--figure-ink-soft)">
      <tspan font-style="italic">di/dt</tspan><tspan font-size="9"> (A/s)</tspan>
    </text>
    <text x="624" y="204" font-size="11" fill="var(--figure-ink-soft)">
      <tspan font-style="italic">i</tspan><tspan font-size="9"> (mA)</tspan>
    </text>
    <text x="70" y="214" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : la droite et sa formule
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Boîte formule -->
    <rect x="270" y="40" width="230" height="32" rx="5"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="385" y="61" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">di/dt = E/L − (R/L)·i</text>

    <!-- Droite di/dt = f(i), exacte de (80,60) à (586,221) -->
    <line x1="80" y1="60" x2="586" y2="221"
          stroke="var(--figure-accent)" stroke-width="2.4" stroke-linecap="round"/>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : ordonnée à l'origine et racine
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Ordonnée à l'origine : (i=0, di/dt = E/L = 20 A/s) -->
    <line x1="75" y1="60" x2="85" y2="60"
          stroke="var(--figure-energy-L)" stroke-width="1.6"/>
    <circle cx="80" cy="60" r="3.5" fill="var(--figure-energy-L)"/>
    <text x="68" y="64" text-anchor="end" font-size="10.5"
          fill="var(--figure-energy-L)">E/L = 20 A/s</text>

    <!-- Racine : (i = E/R = 100 mA, di/dt = 0) -->
    <line x1="520" y1="195" x2="520" y2="205"
          stroke="var(--figure-energy-L)" stroke-width="1.6"/>
    <circle cx="520" cy="200" r="3.5" fill="var(--figure-energy-L)"/>
    <text x="528" y="180" font-size="9.5"
          fill="var(--figure-energy-L)">I<tspan dy="3" font-size="7">max</tspan><tspan
          dy="-3"> = E/R = 100 mA</tspan></text>
  </g><!-- /step-3 -->

</svg>
