#                                            courant-saute-instantane.
#   cp-r1-i-continuite         (after R1)  — rupture gate: CONTINUITÉ de i dans
#                                            une bobine ; i(0+) = 0.
#   cp-r2-etablissement-permanent (after R2) — rupture gate: ÉTABLISSEMENT vs
#                                            RÉGIME PERMANENT ; I_max = E/(R+r),
#                                            indépendant de L.
#   cp-r2-role-r               (after R2)  — rupture gate: RÔLE de la résistance
