#                                            unité ET sens).
#
# Clone note: cp-r1-i-continuite clones RL-6/RL-1's stem, cp-r2-etablissement-
# permanent clones RL-12's, cp-r2-role-r clones RL-2's, cp-r3-tau clones RL-3's.
