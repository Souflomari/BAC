#
# Boundary guard: pure dipôle RL (établissement du courant sous échelon). Pas
# de condensateur, pas d'oscillations, pas de régime alternatif. Courant i
# CONTINU à travers la bobine (i(0+)=0) ; τ = L/R lue au graphe (tangente ou
