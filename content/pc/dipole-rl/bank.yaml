            note: "Loi d'Ohm sur le palier de la figure 2 (pas de 1,25 V/division, pas 2,5)."
          - math: '\boxed{I_0 = 0{,}1\ \text{A} = 100\ \text{mA}}'
            note: "Intensite en regime permanent."
      - id: q3
        stem: |-
          **1-3.** (0,5 pt) Vérifier que $L = 0{,}10\ \text{H}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'équation de la question 1-1 a la forme $\dfrac{du_R}{dt}+\dfrac1\tau u_R=\dfrac{RE}{L}$, avec $\tau=\dfrac{L}{R}$ — c'est le coefficient de $u_R$ qui la porte, exactement le rôle que joue $\tau=L/R$ au rung 3 (ici sans $r$, puisque la bobine a une résistance négligeable). On inverse cette relation avec le $\tau$ lu à la question précédente.

