    intro: |-
      **Réponse d'un dipôle RL à un échelon de tension ascendant (examen national, session de rattrapage 2015 — Exercice 3, § 1, 2,00 points sur les 04,5 de l'exercice complet).**

      *Le § 2 de cet exercice — les oscillations libres dans un circuit RLC série — vit sous la notion « RLC série » (entrée bk-2015-r-x3b) ; il réutilise les valeurs établies ici.*

      Les résistors, les condensateurs et les bobines, sont parmi les composants essentiels entrant dans la composition de plusieurs appareils électroniques qu'on utilise dans notre vie quotidienne. *(La virgule après « les bobines » est telle qu'imprimée — défaut du sujet officiel, sans incidence)*

      Le but de cet exercice est de déterminer les deux grandeurs caractérisant une bobine, et à l'étude d'un circuit électrique oscillant librement, pour déterminer la capacité d'un condensateur. *(Anacoluthe telle qu'imprimée — défaut du sujet officiel, sans incidence)*

      **1- Réponse d'un dipôle RL à un échelon de tension ascendant :**

      Le circuit de la figure 1 est constitué de :
      - Un générateur idéal de tension de f.é.m. $E$ ;
      - Une bobine d'inductance $L$ et de résistance interne $r$ ;
      - Un résistor de résistance $R = 90\ \Omega$ ;
      - Un interrupteur $K$.

      On ferme l'interrupteur à l'instant $t = 0$. Le suivi de l'évolution des tensions $u_R$ aux bornes du résistor et la tension $U_{PN}$ aux bornes du générateur, permet de tracer les courbes $u_R(t)$ et $U_{PN}(t)$ de la figure 2 ci-dessous. *(La casse mixte $u_R$/$U_{PN}$ et la tournure « des tensions … et la tension …, permet » sont telles qu'imprimées — défauts du sujet officiel, sans incidence)*

      **Figure 1 (le circuit, page 4 du sujet — re-décrite depuis le bitmap natif).** Circuit rectangulaire à une maille : au coin haut-gauche, le nœud $P$ ; sur la branche du haut, l'interrupteur $K$ ; sur la branche droite, de haut en bas, la bobine ($L$, $r$) puis le résistor $R$ ; au coin bas-gauche, le nœud $N$ ; sur la branche gauche, le générateur (cercle traversé d'une flèche), avec à sa gauche une grande flèche vers le haut étiquetée $E$, et au-dessus, sur le fil montant vers $P$, une petite flèche étiquetée $i$.

      **Figure 2 (les courbes, page 5 du sujet — re-décrite et re-mesurée au pixel par la vérification).** Quadrillage fin ; axe vertical « $U_{PN}$ , $u_R$ (V) » avec les étiquettes « 1 » et « 5 » sur deux lignes majeures ; axe horizontal « t (ms) » avec « 0 », « 2 », « 10 » — soit **1 carreau majeur = 1 V** et **1 carreau majeur = 2 ms** (cadre 0–12 V × 0–20 ms). Deux courbes : une **droite horizontale** à $10{,}0\ \text{V}$ ($U_{PN}$), et une **exponentielle croissante** ($u_R$) partant de $0$, qui passe par $\approx 5{,}7\ \text{V}$ à $t = 2\ \text{ms}$ et sature à $9{,}0\ \text{V}$ — un carreau SOUS la droite.
    questions:
      - id: q1-1
        part: "1 — Réponse du dipôle RL à un échelon de tension"
        stem: |-
          **1-1-** (0,25 pt) Recopier sur la copie, le schéma du circuit de la figure 1, et représenter dessus la tension $u_R$ en convention récepteur. *(La virgule après « Recopier sur la copie » est telle qu'imprimée — défaut du sujet officiel, sans incidence)*
        reasoning: |-
          En convention récepteur (chapitre 2 — la même convention qui donne $u = ri + L\,di/dt$ pour la bobine), la flèche de tension d'un dipôle est orientée en **sens INVERSE** de la flèche du courant qui le traverse.

          Sur le schéma, le courant $i$ circule de $P$ vers $N$ à travers la branche bobine-résistor (la flèche $i$ est imprimée sur le fil montant vers $P$). La flèche de $u_R$ se dessine donc **le long du résistor $R$, pointant contre le sens de $i$** — c'est-à-dire du bas vers le haut de la branche droite si $i$ la descend.

          $$\boxed{u_R\ \text{: flèche aux bornes de } R \text{, orientée en sens inverse de } i}$$

          Le piège nommé de cette question. Dessiner $u_R$ dans le même sens que $i$ : ce serait la convention GÉNÉRATEUR, celle qu'on réserve à la source. Avec la mauvaise convention, $u_R = -Ri$ au lieu de $+Ri$, et tous les signes de la loi des mailles du § basculent — un quart de point qui en coûte bien plus en aval.
      - id: q1-2a
        part: "1-2 — Exploitation du document de la figure 2"
        stem: |-
          **1-2-** Par exploitation du document de la figure 2, déterminer :

          **a-** (0,25 pt) La force électromotrice $E$ du générateur.
        reasoning: |-
          Le générateur est **idéal** (énoncé) : sa tension à ses bornes vaut sa f.é.m., quelle que soit l'intensité débitée — $U_{PN} = E$ à chaque instant. Il suffit donc de lire la droite horizontale de la figure 2 : elle est à $10{,}0\ \text{V}$ (dix carreaux d'un volt).

          $$\boxed{E = U_{PN} = 10\ \text{V}}$$

          Le piège nommé de cette question. Lire $E$ sur l'ASYMPTOTE de $u_R$ ($9{,}0\ \text{V}$) : en régime permanent, $u_R$ ne vaut pas $E$ mais $E - r\,I_p$ — l'écart d'un volt entre les deux courbes est précisément ce que la bobine « confisque » par sa résistance interne, et c'est lui qui portera la question 1-2c.
        steps:
          - math: 'U_{PN} = E\ \text{(générateur idéal)}'
            note: "Un générateur idéal impose sa f.e.m. a ses bornes, quel que soit le courant."
          - math: '\boxed{E = 10\ \text{V}}'
            note: "Lecture de la droite horizontale de la figure 2 (10 carreaux de 1 V)."
      - id: q1-2b
        stem: |-
          **b-** (0,5 pt) La valeur de la constante de temps $\tau$.
        reasoning: |-
          La méthode de lecture du chapitre 4, transposée à $u_R$ : comme $u_R = R\,i$ est proportionnelle à $i$, la courbe $u_R(t)$ a la MÊME forme exponentielle que $i(t)$, et $\tau$ se lit au même endroit — l'instant où la courbe atteint $63\ \%$ de son asymptote.

          Asymptote : $u_R^{\infty} = 9{,}0\ \text{V}$. Le repère à viser : $0{,}63\times9{,}0 \approx 5{,}7\ \text{V}$. La courbe passe par cette valeur à $t = 2\ \text{ms}$ — une lecture confortable, l'étiquette « 2 » est imprimée sur l'axe.

          $$\boxed{\tau = 2\ \text{ms}}$$

          Le piège nommé de cette question. Prendre $63\ \%$ de $E = 10\ \text{V}$ (soit $6{,}3\ \text{V}$) au lieu de $63\ \%$ de l'asymptote de LA COURBE LUE ($9{,}0\ \text{V}$) : les deux courbes de la figure n'ont pas la même valeur finale, et $\tau$ se définit par rapport à l'asymptote de l'exponentielle qu'on lit — la lecture fausse donnerait $\tau \approx 2{,}4\ \text{ms}$, et tout l'aval (question 1-3) dériverait.
        steps:
          - math: 'u_R(\tau) = 0{,}63\times u_R^{\infty} = 0{,}63\times9{,}0 \approx 5{,}7\ \text{V}'
            note: "63 pourcent de l'ASYMPTOTE de u_R (9,0 V), pas de E (10 V) -- chapitre 4."
          - math: '\boxed{\tau = 2\ \text{ms}}'
            note: "La courbe u_R passe par 5,7 V a t = 2 ms (étiquette imprimée sur l'axe)."
      - id: q1-2c
        stem: |-
          **c-** (0,75 pt) La résistance $r$ de la bobine.
        reasoning: |-
          En **régime permanent** (chapitre 3, la fin de l'histoire de l'établissement du courant) : $i$ est devenu constant, donc $di/dt = 0$, la bobine ne s'oppose plus à rien et se réduit à sa résistance interne $r$. La loi des mailles s'écrit alors sans terme inductif :

          $$E = (R + r)\,I_p$$

          Le courant permanent se lit sur l'asymptote de $u_R$ : $I_p = \dfrac{u_R^{\infty}}{R} = \dfrac{9{,}0}{90} = 0{,}10\ \text{A}$. D'où :

          $$r = \frac{E - u_R^{\infty}}{I_p} = \frac{10 - 9{,}0}{0{,}10}$$

          $$\boxed{r = 10\ \Omega}$$

          Autre écriture du même calcul, sans passer par $I_p$ : $r = R\,\dfrac{E - u_R^{\infty}}{u_R^{\infty}} = 90\times\dfrac{1}{9}= 10\ \Omega$ — le volt manquant entre les deux courbes, converti en ohms.

          Le piège nommé de cette question. Oublier $r$ dans la loi des mailles du régime permanent (écrire $E = R\,I_p$) : c'est se condamner à trouver $I_p = E/R = 0{,}111\ \text{A}$, incompatible avec la lecture $u_R^{\infty} = 9{,}0\ \text{V}$. L'écart entre $E$ et $u_R^{\infty}$ EST la preuve que la bobine est résistive — c'est même la « grandeur caractérisant la bobine » que l'énoncé annonce vouloir déterminer.
        steps:
          - math: 'I_p = \frac{u_R^{\infty}}{R} = \frac{9{,}0}{90} = 0{,}10\ \text{A}'
            note: "Courant permanent, lu sur l'asymptote de u_R (loi d'Ohm dans le resistor)."
          - math: 'E = (R+r)\,I_p \implies r = \frac{E - u_R^{\infty}}{I_p} = \frac{10-9{,}0}{0{,}10}'
            note: "Loi des mailles en régime permanent (chapitre 3) : di/dt = 0, la bobine se réduit a r."
          - math: '\boxed{r = 10\ \Omega}'
            note: "Le volt manquant entre U_PN et u_R infini, converti en ohms."
      - id: q1-3
        stem: |-
          **1-3-** (0,25 pt) Vérifier que la valeur du coefficient d'inductance de la bobine est : $L = 0{,}2\ \text{H}$.
        reasoning: |-
          « Vérifier » : on assemble ce que les questions précédentes ont établi, à travers la définition de la constante de temps du dipôle RL (chapitre 4) — avec la résistance TOTALE de la maille, puisque le courant traverse $R$ et $r$ en série :

          $$\tau = \frac{L}{R+r} \implies L = \tau\,(R+r) = 2\times10^{-3}\times(90+10)$$

          $$\boxed{L = 0{,}2\ \text{H}}$$

          La valeur annoncée par l'énoncé retombe exactement — le signe que la chaîne de lectures ($\tau = 2\ \text{ms}$, $r = 10\ \Omega$) est cohérente.

          Le piège nommé de cette question. Écrire $\tau = L/R$ en oubliant $r$ : la constante de temps se construit avec la résistance de TOUTE la maille traversée par $i$ (chapitre 4). Ici l'oubli donnerait $L = 0{,}18\ \text{H}$ — et la « vérification » demandée échouerait, ce qui est précisément le garde-fou que l'énoncé offre.
        steps:
          - math: '\tau = \frac{L}{R+r}'
            note: "Constante de temps du dipôle RL (chapitre 4), avec la résistance TOTALE de la maille."
          - math: 'L = \tau\,(R+r) = 2\times10^{-3}\times100'
            note: "tau = 2 ms (question 1-2b), R + r = 90 + 10 ohms (question 1-2c)."
          - math: '\boxed{L = 0{,}2\ \text{H}}'
            note: "La valeur a vérifier retombe exactement : chaîne de lectures coherente."

