      - id: q4
        stem: |-
          **1-4.** (0,75 pt) Quand le régime permanent est atteint, calculer la tension $u_{bf}$ aux bornes de la bobine et $E_m$ l'énergie qui y est emmagasinée.
        reasoning: |-
