          **La lecture de $I_0$.** Le palier de $u_R$ est atteint au niveau $10\ \text{V}$, et cette valeur COÏNCIDE avec $E=10\ \text{V}$ non par hasard : la bobine a une résistance négligeable, donc en régime permanent toute la tension $E$ se retrouve aux bornes de $R$. On repasse par la loi d'Ohm :

          $$I_0 = \frac{u_{R,max}}{R} = \frac{10}{100} = 0{,}1\ \text{A} = 100\ \text{mA}$$

          **Le piège de cette question.** Lire le pas de l'ordonnée comme $2{,}5\ \text{V}$ par division au lieu de $1{,}25\ \text{V}$ — les traits chiffrés « $2{,}5$ » et « $5$ » de la figure 2 sont séparés par DEUX divisions, pas une seule : une lecture au pas double donnerait un palier à $20\ \text{V}$, un $I_0$ deux fois trop grand, et une valeur de $L$ (question suivante) hors de portée de celle à vérifier. Deuxième piège : confondre le palier de $u_R$ (ce qu'on lit) avec $I_0$ (ce qu'on demande) — il faut repasser par $R$.
        steps:
