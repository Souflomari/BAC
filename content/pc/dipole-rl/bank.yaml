          - math: '0 = -\dfrac{R_1+r}{L}\,I_{max} + \dfrac{E}{L} \implies R_1+r = \dfrac{E}{I_{max}}'
            note: "Point ou la droite de la figure 4 coupe l'axe des i (di/dt = 0) : regime permanent (rung 2)."
          - math: 'I_{max} = 6\ \text{mA} = 6\times10^{-3}\ \text{A}'
            note: "Lecture directe sur la figure 4 (coin inferieur droit du segment)."
          - math: 'R_1+r = \dfrac{6}{6\times10^{-3}}'
