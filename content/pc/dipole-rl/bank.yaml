  - id: bk-2020-n-x4
    title: "Réponse d'un dipôle RL à un échelon de tension : résistance interne et inductance par tangente"
    source:
      year: 2020
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice IV — Partie I : Réponse d'un dipôle RL à un échelon de tension"
    bareme_total: 1.5
    duration_min: 9
    sourcing:
      status: sourced
      note: >-
        2020 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/109742 (Exercice IV, Partie I —
        réponse d'un dipôle RL à un échelon de tension ; barème de la
        Partie I = 1,5 pt sur les 5 pt de l'exercice complet, dont les
        Parties II et III — décharge d'un condensateur dans un dipôle RL puis
        entretien des oscillations RLC — sont transcrites sous
        rlc-serie.md). Transcription vérifiée en une passe : re-fetch
        indépendant AlloSchool + diff caractère par caractère
        (agent-vérificateur, 2026-07-11 ; docs/sujets/pc/dipole-rl.md,
        statut « vérifié »). Recoupement assumé avec le sommet de leçon : ce
        même sujet est déjà le sommet r-bac de exercises.yaml (marqueur
        [[exercise:r-bac]] à R5 « Exercice de type bac ») — mêmes questions,
        mêmes valeurs numériques (I_max = 100 mA, r = 10 Ω, τ = 0,01 s,
        L = 1 H) ; raisonnement rédigé de nouveau ici (voix maison), pas
