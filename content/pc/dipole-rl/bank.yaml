          $$\boxed{E_m = 5\times10^{-4}\ \text{J} = 0{,}5\ \text{mJ}}$$

          **Le piège de cette question.** Calculer $u_{bf}$ en oubliant que la question porte sur le régime PERMANENT, et reprendre par réflexe une valeur instantanée de $L\,di/dt$ prise ailleurs sur la courbe (par exemple à la pente à l'origine) — seule la valeur en régime permanent, où $di/dt=0$, est demandée ici, et elle est nulle. Deuxième piège, sur $E_m$ : utiliser $u_{R,max}=10\ \text{V}$ à la place de $I_0=0{,}1\ \text{A}$ dans $\frac12Li^2$ — l'énergie se calcule avec le COURANT, jamais directement avec une tension.
