    intro: |-
      **Réponse d'un dipôle RL à un échelon de tension (examen national, session de rattrapage 2022 — Exercice 3, section 1, 2,25 points).**

      *On se propose dans cet exercice d'étudier, sur un même montage : la réponse d'un dipôle RL à un échelon de tension (cette section) ; les oscillations libres dans un circuit RLC série ; puis la réception d'une onde modulée en amplitude — les deux dernières sont traitées à part, sous les notions « Oscillations libres dans un circuit RLC série » et « Ondes électromagnétiques — modulation d'amplitude ».*

      On réalise le montage expérimental schématisé sur la figure 1. Ce montage est constitué :
      - d'un générateur idéal de tension de force électromotrice $E = 10\ \text{V}$ ;
      - d'une bobine d'inductance $L$ réglable et de résistance $r$ ;
      - d'un conducteur ohmique de résistance $R = 490\ \Omega$ ;
      - d'un interrupteur $K$.

      On ajuste l'inductance de la bobine sur la valeur $L = L_0$ et on ferme le circuit à un instant choisi comme origine des dates $t = 0$.

      Un système d'acquisition informatisé permet de visualiser la courbe $C_1$ représentant l'évolution de la tension $u_R(t)$ aux bornes du conducteur ohmique (figure 2). La droite $(T)$ étant la tangente à la courbe au point d'abscisse $t = 0$.

      **Figure 1 (schéma).** Boucle unique. Branche de gauche : le générateur (symbole cercle) avec une flèche de tension verticale étiquetée « $E$ » à sa gauche. Branche du haut : une flèche de courant « $i$ » orientée vers la droite, puis l'interrupteur $K$ (deux plots et un levier ouvert, étiquette « $K$ » au-dessus). Branche de droite : la bobine, dessinée en spires verticales, étiquetée « $(L,r)$ » à sa gauche et barrée d'une flèche oblique (symbole d'inductance réglable). Branche du bas : le conducteur ohmique (rectangle horizontal) étiqueté « $R$ » au-dessous. Légende : « Figure 1 ».

      **Figure 2 (courbe).** Axe des ordonnées $u_R\ (\text{V})$ gradué $0,\ 2,\ 4,\ 6,\ 8,\ 10$ (pas principal noir $2\ \text{V}$ ; le cadre monte au-delà de $10$ et son bord supérieur est exactement le trait principal $12\ \text{V}$, non chiffré) ; axe des abscisses $t\ (\text{ms})$ gradué $1,\ 2,\ 3,\ 4,\ 5,\ 6$ (pas principal noir $1\ \text{ms}$ ; le bord gauche du cadre est exactement $t = 0$ et le bord droit exactement $t = 7\ \text{ms}$, trait non chiffré) ; sous-quadrillage fin bleu à $10$ subdivisions par carreau principal sur chaque axe ($0{,}1\ \text{ms}$ et $0{,}2\ \text{V}$). Courbe $C_1$ croissante, concave, partant de l'origine et tendant vers un palier situé légèrement au-dessous de la ligne $10\ \text{V}$ : palier $U_0 \approx 9{,}8\ \text{V}$ ; elle passe au voisinage du point $(1\ \text{ms}\ ;\ 6{,}2\ \text{V})$. La droite $(T)$, en pointillés, part de l'origine avec une forte pente ($\approx 9{,}5\ \text{V/ms}$ mesurée), coupe le niveau du palier à $t \approx 1{,}0\ \text{ms}$ et sort du cadre par le haut ($12\ \text{V}$) à $t \approx 1{,}25\ \text{ms}$ ; l'étiquette « $(T)$ » est posée en haut à gauche, à droite de la droite. Légende : « Figure 2 ».

      **Figure 3 (courbes).** Mêmes grandeurs. Axe des ordonnées $u_R\ (\text{V})$ chiffré $0,\ 2,\ 4,\ 6,\ 8,\ 10$ (traits principaux noirs tous les $2\ \text{V}$, lignes bleues intercalées aux volts impairs $1,\ 3,\ 5,\ 7,\ 9,\ 11$ ; le bord supérieur du cadre est le trait noir $12\ \text{V}$, non chiffré) ; axe des abscisses $t\ (\text{ms})$ chiffré $2,\ 4,\ 6,\ 8,\ 10$ (traits principaux noirs tous les $2\ \text{ms}$ — tous chiffrés dans la plage $2$–$10$ — et lignes bleues intercalées aux ms impairs ; le bord gauche est $t = 0$ et le cadre va jusqu'à $14\ \text{ms}$, les traits $12$ et $14$ n'étant pas chiffrés). Les quatre tracés s'arrêtent tous à $t = 12\ \text{ms}$, avant le bord du cadre. Quatre courbes croissantes issues de l'origine : $C_3$ (en tirets, étiquette au bord gauche vers $9\ \text{V}$) est la plus rapide et tend vers un palier légèrement sous $10\ \text{V}$ ; $C_4$ (en pointillés, étiquette en haut) est rapide elle aussi mais tend vers un palier plus haut, exactement sur la ligne bleue $11\ \text{V}$, au-dessus de la ligne $10$ ; $C_1$ (trait plein, étiquette au centre) est plus lente que $C_3$ et tend vers le même palier légèrement sous $10\ \text{V}$ ; $C_2$ (trait mixte point-tiret, la plus lente, étiquette en bas) tend aussi vers ce même palier sous $10\ \text{V}$, qu'elle n'atteint qu'aux alentours de $t = 8$–$9\ \text{ms}$. Ordre de rapidité près de l'origine : $C_3 > C_4 > C_1 > C_2$. Légende : « Figure 3 ».
    questions:
      - id: q1
        part: "1. Réponse d'un dipôle RL à un échelon de tension"
        stem: |-
          **1.1.** (0,25 pt) Recopier le schéma de la figure 1 et indiquer comment est branché le système d'acquisition informatisé pour visualiser la tension $u_R(t)$. (Le branchement du système d'acquisition est identique à celui de l'oscilloscope.)
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Un quart de point, mais une question purement expérimentale : la leçon (rungs R1 à R3, lesson.md) construit et résout l'équation du dipôle RL, elle ne dit jamais comment brancher un appareil de mesure sur le montage. Il faut donc reposer, depuis le principe général de la mesure électrique, la règle que l'énoncé rappelle lui-même entre parenthèses — « le branchement du système d'acquisition est identique à celui de l'oscilloscope ».

          **Le principe.** Un système d'acquisition informatisé, comme un oscilloscope, mesure une différence de potentiel entre son entrée (la « voie ») et sa masse (COM) — et cette masse est unique, partagée par toutes les voies de l'appareil. Pour visualiser une tension $u_X$ quelconque d'un dipôle $X$, on branche donc l'appareil EN DÉRIVATION (en parallèle) à ses bornes, jamais en série, ce qui couperait le circuit.

          **La règle qui évite l'erreur classique.** On relie systématiquement la borne « masse » (COM) de l'appareil au point du circuit déjà relié à la borne de référence du générateur $E$ — c'est cette règle-là que l'énoncé désigne en renvoyant à l'oscilloscope. Sur la figure 1, ce point commun est le nœud partagé entre le conducteur ohmique $R$ et le générateur, au bas de la boucle. La voie de mesure se branche alors sur l'AUTRE borne de $R$, celle qui rejoint la bobine $(L,r)$.

          Le schéma attendu est donc la figure 1 recopiée à l'identique — générateur $E$, interrupteur $K$, bobine $(L,r)$, conducteur ohmique $R$, tous en série sur la boucle unique — complétée par les deux fils du système d'acquisition branchés en parallèle sur $R$ : la masse au nœud commun avec $E$, la voie de mesure à l'autre borne de $R$.

          **Le piège de cette question.** Brancher l'appareil EN SÉRIE dans la boucle, par le réflexe qu'on aurait pour un ampèremètre. Un système d'acquisition, comme un voltmètre ou un oscilloscope, a une impédance d'entrée très élevée : l'insérer en série ouvrirait quasiment le circuit et empêcherait tout courant de circuler — on ne mesurerait plus rien du tout, ni $u_R$ ni quoi que ce soit d'autre.
      - id: q2
        stem: |-
          **1.2.** (0,5 pt) Montrer que l'équation différentielle vérifiée par la tension $u_R(t)$ s'écrit sous la forme :
          $$\dfrac{du_R}{dt} + \dfrac{(R+r)}{L_0}u_R = \dfrac{E\,R}{L_0}$$
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le rung 2 de la leçon établit l'équation différentielle du dipôle RL en fonction du COURANT, $L\dfrac{di}{dt}+Ri=E$. Ici l'énoncé veut l'équation en $u_R(t)$ — la grandeur que le système d'acquisition a réellement enregistrée (figure 2). Il faut refaire la même démarche (loi des mailles, puis substitution de la relation caractéristique de la bobine), en choisissant $u_R$ comme inconnue plutôt que $i$.

          **Le pont à construire.** La loi d'Ohm relie les deux grandeurs : $u_R = R\,i$, donc $i = \dfrac{u_R}{R}$ — c'est ce remplacement qui va permettre d'éliminer $i$ partout.

          **La loi des mailles**, sur la boucle série de la figure 1 :

          $$E = u_R + u_{bobine}$$

          **Chaque tension par son dipôle**, exactement comme au rung 2 : la loi d'Ohm pour $R$ (déjà utilisée pour poser $i=u_R/R$), et la relation caractéristique de la bobine établie au rung 1, qui porte à la fois sa résistance interne $r$ et son inductance $L_0$ :

          $$u_{bobine} = r\,i + L_0\,\frac{di}{dt}$$

          **On reporte $i = u_R/R$ partout**, y compris dans la dérivée : $\dfrac{di}{dt} = \dfrac{1}{R}\dfrac{du_R}{dt}$.

          $$E = u_R + r\,\frac{u_R}{R} + \frac{L_0}{R}\,\frac{du_R}{dt}$$

          **On multiplie toute l'équation par $R$**, pour effacer les fractions :

          $$ER = R\,u_R + r\,u_R + L_0\,\frac{du_R}{dt} = (R+r)\,u_R + L_0\,\frac{du_R}{dt}$$

          **On réordonne et on divise par $L_0$**, pour obtenir la forme demandée :

          $$\boxed{\frac{du_R}{dt} + \frac{R+r}{L_0}\,u_R = \frac{ER}{L_0}}$$

          **Le contrôle qui rassure.** L'équation garde la même structure que celle du rung 2 en $i(t)$ — un terme dérivé, un terme proportionnel à la grandeur elle-même, un second membre constant — parce que $u_R$ et $i$ ne diffèrent que par le facteur constant $R$ ($u_R = Ri$) : dériver et multiplier par une constante commutent, la forme de l'équation ne peut pas changer.

          **Le piège de cette question.** Multiplier par $R$ SEULEMENT certains termes de l'équation, ce qui laisse des fractions incohérentes et empêche de retrouver exactement la forme imposée. Deuxième piège, plus profond : écrire $i = \dfrac{E}{R}$ (la valeur de RÉGIME PERMANENT) au lieu de $i=\dfrac{u_R}{R}$ (la loi d'Ohm, valable à CHAQUE instant) — la première est une valeur particulière, la seconde est la relation instantanée dont on a besoin ici.
        steps:
          - math: 'E = u_R + u_{bobine} \qquad \text{avec} \qquad u_{bobine} = r\,i + L_0\,\frac{di}{dt}, \quad i = \frac{u_R}{R}'
            note: "Loi des mailles (rung 2) ; relation caracteristique de la bobine (rung 1) ; conversion i = u_R/R (loi d'Ohm)."
          - math: 'E = u_R + r\,\frac{u_R}{R} + \frac{L_0}{R}\,\frac{du_R}{dt}'
            note: "On reporte i = u_R/R partout, y compris dans la derivee."
          - math: 'ER = (R+r)\,u_R + L_0\,\frac{du_R}{dt}'
            note: "On multiplie toute l'equation par R pour effacer les fractions."
          - math: '\boxed{\frac{du_R}{dt} + \frac{R+r}{L_0}\,u_R = \frac{ER}{L_0}}'
            note: "On divise par L0 : exactement la forme demandee."
      - id: q3
        stem: |-
          **1.3.** (0,25 pt) Déterminer graphiquement la tension $U_0$ aux bornes du conducteur ohmique quand le régime permanent est atteint.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le régime permanent (rung 2) est l'instant où toutes les grandeurs cessent de varier : la courbe $C_1$ atteint alors un palier horizontal. On lit directement ce palier sur la figure 2.

          La courbe $C_1$ croît puis se stabilise sur un palier situé légèrement au-dessous de la ligne $10\ \text{V}$ :

          $$\boxed{U_0 \approx 9{,}8\ \text{V}}$$

          **Le piège de cette question.** Lire $U_0 = 10\ \text{V}$ « parce que c'est la graduation la plus proche ». Le palier de $C_1$ ne touche PAS le trait $10\ \text{V}$ : il reste visiblement en dessous, à $9{,}8\ \text{V}$. C'est précisément cet écart de $0{,}2\ \text{V}$ qui, à la question suivante, révèle que la résistance $r$ de la bobine n'est pas nulle — arrondir à $10\ \text{V}$ effacerait le phénomène même que l'exercice fait mesurer.
      - id: q4
        stem: |-
          **1.4.** (0,5 pt) En déduire la valeur de la résistance $r$ de la bobine.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** En régime permanent, $\dfrac{du_R}{dt}=0$ — le régime permanent du rung 2, traduit ici dans la variable $u_R$ de la question 1.2 : le terme dérivé de l'équation établie disparaît, et il ne reste qu'une relation algébrique entre $U_0$ et $r$.

          $$0 + \frac{R+r}{L_0}\,U_0 = \frac{ER}{L_0} \implies (R+r)\,U_0 = ER \implies R+r = \frac{ER}{U_0}$$

          **L'application numérique**, chiffre par chiffre, avec $E=10\ \text{V}$, $R=490\ \Omega$ et $U_0=9{,}8\ \text{V}$ (question précédente) :

          $$R+r = \frac{10\times490}{9{,}8} = \frac{4900}{9{,}8} = 500\ \Omega$$

          $$r = 500 - R = 500 - 490$$

          $$\boxed{r = 10\ \Omega}$$

          **Le contrôle qui rassure.** $r=10\ \Omega$ face à $R=490\ \Omega$ : un ordre de grandeur banal pour la résistance propre d'une bobine de laboratoire, très petite devant la résistance ajoutée. C'est bien parce que $U_0=9{,}8\ \text{V}$ et non $10\ \text{V}$ (l'écart repéré à la question précédente) que $r$ existe : une bobine parfaite ($r=0$) aurait donné un palier exactement à $E=10\ \text{V}$.

          **Le piège de cette question.** $r$ est ici la DIFFÉRENCE de deux nombres proches, $500$ et $490$ : une petite erreur de lecture sur $U_0$ se transforme en grosse erreur relative sur $r$. Lire $U_0=10\ \text{V}$ au lieu de $9{,}8\ \text{V}$ (le piège de la question précédente) donne $R+r=\frac{4900}{10}=490=R$, donc $r=0$ — la bobine deviendrait, à tort, parfaite.
        steps:
          - math: '\frac{du_R}{dt} = 0 \implies R+r = \frac{ER}{U_0}'
            note: "Regime permanent (rung 2, traduit en u_R) : le terme derive de l'equation de la question 1.2 s'annule."
          - math: 'R+r = \frac{10\times490}{9{,}8} = \frac{4900}{9{,}8}'
            note: "Application numerique : E = 10 V, R = 490 Ohm, U0 = 9,8 V (question 1.3)."
          - math: 'R+r = 500\ \Omega \implies r = 500 - 490'
            note: "On isole r."
          - math: '\boxed{r = 10\ \Omega}'
            note: "Resistance propre de la bobine."
      - id: q5
        stem: |-
          **1.5.** (0,25 pt) Vérifier que $L_0 = 0{,}5\ \text{H}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'équation de la question 1.2 a la forme $\dfrac{du_R}{dt}+\dfrac{1}{\tau}u_R=\dfrac{ER}{L_0}$, avec $\tau=\dfrac{L_0}{R+r}$ — c'est le coefficient de $u_R$ qui la porte, exactement le rôle que joue $\tau=L/R$ au rung 3. La méthode de la tangente à l'origine (rung 3) donne directement $\tau$ : la tangente $(T)$ à la courbe en $t=0$ coupe l'asymptote horizontale $u_R=U_0$ en une abscisse exactement égale à $\tau$.

          **La lecture.** Sur la figure 2, la droite $(T)$ coupe le niveau du palier à $t\approx1{,}0\ \text{ms}$ :

          $$\tau \approx 1{,}0\ \text{ms} = 1{,}0\times10^{-3}\ \text{s}$$

          **On inverse $\tau=\dfrac{L_0}{R+r}$**, avec $R+r=500\ \Omega$ (question précédente) :

          $$L_0 = \tau\,(R+r) = 1{,}0\times10^{-3}\times500$$

          $$\boxed{L_0 = 0{,}5\ \text{H}}$$

          C'est exactement la valeur que l'énoncé demandait de vérifier.

          **Le contrôle qui rassure.** La pente à l'origine de $u_R(t)=U_0(1-e^{-t/\tau})$ vaut $\dfrac{U_0}{\tau}=\dfrac{9{,}8}{1{,}0\times10^{-3}}=9{,}8\times10^3\ \text{V/s}=9{,}8\ \text{V/ms}$ — à comparer à la pente mesurée directement sur la tangente $(T)$, $\approx9{,}5\ \text{V/ms}$. Les deux valeurs concordent, aux incertitudes de lecture graphique près : la lecture $\tau\approx1{,}0\ \text{ms}$ est fiable.

          **Le piège de cette question.** Confondre $\tau$ avec l'instant où la courbe $C_1$ rejoint VISUELLEMENT son palier — la droite $(T)$ sort d'ailleurs du cadre par le haut vers $t\approx1{,}25\ \text{ms}$, bien avant que la courbe elle-même n'ait l'air stabilisée. $\tau$ se lit uniquement sur l'intersection de la tangente avec le palier, jamais sur l'allure visuelle de la courbe.
        steps:
          - math: '\tau \approx 1{,}0\ \text{ms} = 1{,}0\times10^{-3}\ \text{s}'
            note: "Tangente (T) a l'origine : coupe le niveau du palier a t = 1,0 ms (methode du rung 3)."
          - math: 'L_0 = \tau\,(R+r) = 1{,}0\times10^{-3}\times500'
            note: "tau = L0/(R+r) (rung 3), avec R+r = 500 Ohm (question 1.4)."
          - math: '\boxed{L_0 = 0{,}5\ \text{H}}'
            note: "Valeur verifiee, conforme a l'enonce."
      - id: q6
        stem: |-
          **1.6.** (0,5 pt) On refait la même expérience en ajustant l'inductance de la bobine sur la valeur $L = L_1 = 2L_0$. Choisir parmi les courbes $C_2$, $C_3$ et $C_4$ représentées sur la figure 3, celle qui représente l'évolution de la tension $u_R(t)$ dans le cas où $L = L_1$. Justifier votre réponse.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux grandeurs pilotent la courbe $u_R(t)$ : le palier $U_0=\dfrac{ER}{R+r}$ (question 1.4) et la constante de temps $\tau=\dfrac{L_0}{R+r}$ (question 1.5) — exactement les rôles de $I_{max}=E/R$ et $\tau=L/R$ aux rungs 2 et 3 de la leçon. Le point essentiel, à voir avant de regarder les courbes : $U_0$ ne dépend PAS de $L$, seulement de $E$, $R$ et $r$. Doubler $L$ ne peut donc pas changer le palier — seulement la vitesse à laquelle on l'atteint.

          **Ce que le doublement de $L$ change, et ce qu'il ne change pas.**

          $$\tau_1 = \frac{L_1}{R+r} = \frac{2L_0}{R+r} = 2\,\tau_0 \approx 2{,}0\ \text{ms}$$

          $$U_{0,1} = \frac{ER}{R+r} = U_0 \approx 9{,}8\ \text{V} \qquad \text{(inchangé : ne dépend pas de } L\text{)}$$

          Avec $L_1=2L_0$, on attend donc une courbe qui rejoint le MÊME palier que $C_1$ (≈$9{,}8\ \text{V}$, sous la ligne $10\ \text{V}$), mais deux fois plus lentement.

          **Le tri parmi les quatre courbes de la figure 3.** $(C_4)$ est exclue immédiatement, sans même comparer les vitesses : son palier est à $11\ \text{V}$, un palier DIFFÉRENT — impossible pour une expérience où seul $L$ a changé. $(C_3)$ tend vers le bon palier (sous $10\ \text{V}$, comme $C_1$), mais elle est PLUS RAPIDE que $C_1$ dans l'ordre de rapidité donné ($C_3 > C_1$) — or augmenter $L$ augmente $\tau$, donc ralentit la réponse, jamais l'inverse : $(C_3)$ est donc exclue aussi. Reste $(C_2)$ : même palier que $C_1$ (sous $10\ \text{V}$, atteint seulement vers $t\approx8$–$9\ \text{ms}$), et clairement plus lente que $C_1$ — cohérent avec $\tau_1=2\tau_0$.

          $$\boxed{\text{la courbe } (C_2) \text{ représente } u_R(t) \text{ pour } L=L_1}$$

          **Le piège de cette question.** Choisir $(C_4)$ en pensant que changer $L$ pourrait aussi changer le palier — une confusion entre ce que $L$ pilote (la VITESSE, via $\tau$) et ce que $R$ et $r$ pilotent (la valeur FINALE, via $U_0$). Deuxième piège, plus subtil : choisir $(C_3)$ en associant, à tort, « plus d'inductance » à « la bobine réagit plus fort, donc plus vite ». C'est l'inverse : une inductance plus grande s'oppose PLUS aux variations de courant (rung 1 de la leçon) — elle ralentit l'établissement, elle ne l'accélère jamais.

  # ── bk-2023-n-x3 — 2023 N, Exercice 3 (§1) : forme A+B.exp, palier + tangente ──
  - id: bk-2023-n-x3
    title: "Réponse d'un dipôle RL à un échelon de tension : forme A + B.e^(-t/tau), lecture du palier et de la tangente"
    source:
      year: 2023
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 3 — §1 : Réponse d'un dipôle RL à un échelon de tension"
    bareme_total: 1.75
    duration_min: 11
    sourcing:
      status: sourced
      note: >-
        2023 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/142476 (Exercice 3, §1 — réponse
        d'un dipôle RL à un échelon de tension ; barème du §1 = 1,75 pt sur
        les 5 pt de l'exercice complet, dont le §2 — circuit oscillant LC,
        même bobine (b) — est transcrit sous rlc-serie.md et le §3 —
        modulation d'amplitude — sous ondes-em-modulation.md). Transcription
        vérifiée en deux passes : 1ʳᵉ passe (correction de la figure 1 — le
        conducteur ohmique $R$ replacé sur la branche droite, en série sous
        la bobine, et non sur la branche inférieure comme précédemment
        décrit — et confirmation de l'étalonnage de la figure 2), puis 2ᵉ
        passe de contrôle indépendante (agent-relecteur-indépendant,
        2026-08-07), mesures pixel refaites de zéro sans reprise des
        relevés précédents, qui confirme au pixel les deux corrections
        (docs/sujets/pc/dipole-rl.md, statut « vérifié »). Physique
        re-dérivée et cohérente : $I_0 = 5\times9{,}6 = 48$ mA,
        $R = E/I_0 = 24/0{,}048 = 500\ \Omega$, $\tau \approx 2{,}0$ ms
        (tangente au trait chiffré « 2 »), $L = R\tau = 1$ H — exactement
        la Q1-2-2.
    intro: |-
      **Réponse d'un dipôle RL à un échelon de tension (examen national, session normale 2023, Exercice 3 — §1).**

      On réalise le montage électrique, représenté sur le schéma de la figure 1, comportant :
      - un générateur de tension de force électromotrice $E = 24\ \text{V}$ ;
      - un conducteur ohmique de résistance $R$ ;
      - une bobine $(b)$ d'inductance $L$ et de résistance négligeable ;
      - un interrupteur $K$.

      On ferme l'interrupteur $K$ à l'instant de date $t_0 = 0$. Un système d'acquisition informatisé adéquat permet d'obtenir la courbe représentant l'évolution temporelle de l'intensité du courant électrique $i(t)$ dans le circuit (figure 2). La droite $(T)$ représente la tangente à la courbe au point d'abscisse $t_0 = 0$.

      L'expression de l'intensité du courant circulant dans le circuit est : $i(t) = A + B.e^{-t/\tau}$ avec $A$ et $B$ deux constantes et $\tau$ la constante de temps du circuit.

      **Figure 1 (schéma).** Boucle rectangulaire. Branche gauche (verticale) : l'interrupteur $K$ en haut (symbole d'interrupteur ouvert : deux petits disques de contact reliés par un segment oblique, étiquette « K » à gauche), puis, en dessous, le générateur $E$ — un cercle traversé par le fil de la branche, avec une flèche verticale orientée vers le haut, étiquetée « E », placée à gauche du cercle. Branche supérieure : fil portant la flèche de courant $i$ orientée vers la droite (étiquette « i » au-dessus), du sommet de la branche $K$ jusqu'au coin supérieur droit. Branche droite (verticale) : la bobine $(b)$ en spires en haut (étiquette « (b) » à sa gauche) et, en série juste en dessous d'elle, sur la même branche verticale, le conducteur ohmique $R$ (rectangle vertical, étiquette « R » à sa droite). Branche inférieure : simple fil reliant le bas de $R$ au bas du générateur $E$ — le fil inférieur est nu, sans composant.

      **Figure 2 (courbe).** $i\ (\text{mA})$ en fonction de $t\ (\text{ms})$, sur quadrillage à double graduation. Étalonnage : $1$ division $= 2\ \text{ms}$ en abscisse, $1$ division $= 9{,}6\ \text{mA}$ en ordonnée. Courbe croissante et concave, partant de l'origine $(0\,;\,0)$, montant rapidement puis s'aplatissant sur un palier horizontal (régime permanent) situé à $5$ divisions de l'axe, soit $I_0 = 5\times 9{,}6 = 48\ \text{mA}$. La droite $(T)$, en pointillés, tangente à la courbe à l'origine, coupe le palier au premier trait chiffré, soit $\tau \approx 2{,}0\ \text{ms}$.
    questions:
      - id: q1
        part: "1- Réponse d'un dipôle RL à un échelon de tension : établir le modèle"
        stem: |-
          **(0,25 pt)** **1-1.** Établir l'équation différentielle vérifiée par $i(t)$.
        reasoning: |-
          Même méthode qu'au rung 2 — loi des mailles sur le circuit série, puis substitution de la relation caractéristique de la bobine (rung 1) — mais ici la bobine a une résistance négligeable (l'énoncé le précise), donc le terme $r\,i$ du rung 1 disparaît : $u_{bobine} = L\dfrac{di}{dt}$ seul. La seule résistance du circuit est $R$. On applique $E = u_R + u_{bobine}$, on remplace, on isole $\dfrac{di}{dt}$ — exactement la démarche du rung 2, réduite au cas particulier $r=0$.
        steps:
          - math: 'E = u_R + u_{bobine}'
            note: "Loi des mailles sur la maille serie (rung 2)."
          - math: 'u_R = R\,i \qquad u_{bobine} = L\dfrac{di}{dt}'
            note: "Loi d'Ohm pour R ; bobine de resistance negligeable (r=0 dans la relation du rung 1)."
          - math: 'E = R\,i + L\dfrac{di}{dt}'
            note: "On reporte les deux tensions."
          - math: '\boxed{\dfrac{di}{dt} + \dfrac{R}{L}\,i = \dfrac{E}{L}}'
            note: "On divise par L : equation differentielle de i(t)."
      - id: q2a
        stem: |-
          **(0,5 pt)** **1-2-1.** Déterminer les expressions de $A$ et $B$ en fonction de $E$ et $R$.
        reasoning: |-
          Au rung 2, la solution générale de cette équation est $i(t) = I_{max}\left(1-e^{-t/\tau}\right) = I_{max} - I_{max}e^{-t/\tau}$, avec $I_{max}=E/R$ (ici $R$ est la seule résistance, la bobine étant de résistance négligeable). Il suffit d'identifier terme à terme avec la forme donnée par l'énoncé, $A+Be^{-t/\tau}$ : le terme constant donne $A$, le coefficient de l'exponentielle donne $B$.
        steps:
          - math: 'i(t) = I_{max}\left(1-e^{-t/\tau}\right) = I_{max} - I_{max}\,e^{-t/\tau}'
            note: "Forme generale etablie au rung 2, avec R total = R (bobine de resistance negligeable ici)."
          - math: 'A + B\,e^{-t/\tau} = I_{max} - I_{max}\,e^{-t/\tau} \implies A = I_{max},\ B = -I_{max}'
            note: "Identification terme a terme avec la forme donnee par l'enonce."
          - math: '\boxed{A = \dfrac{E}{R} \qquad B = -\dfrac{E}{R}}'
            note: "Avec I_max = E/R (rung 2)."
      - id: q2b
        stem: |-
          **(0,5 pt)** **1-2-2.** Montrer que $L = 1\ \text{H}$.
        reasoning: |-
          On procède en deux temps, exactement comme au rung 3. D'abord le régime permanent (rung 1, $\dfrac{di}{dt}=0$) : le palier de la courbe donne $I_0$, d'où $R=E/I_0$. Ensuite la tangente à l'origine (rung 3) : elle coupe le palier à l'abscisse $t=\tau$, ce qui donne $\tau$ directement sur la figure 2. On remonte enfin à $L$ par $\tau=L/R$ (rung 3).
        steps:
          - math: 'I_0 = 5\times 9{,}6 = 48\ \text{mA} = 0{,}048\ \text{A}'
            note: "Lecture du palier sur la figure 2 : 5 divisions, 1 division = 9,6 mA."
          - math: 'R = \dfrac{E}{I_0} = \dfrac{24}{0{,}048}'
            note: "Regime permanent (rung 1) : E = R I_0, la bobine etant de resistance negligeable."
          - math: '\boxed{R = 500\ \Omega}'
            note: "Application numerique."
          - math: '\tau \approx 2{,}0\ \text{ms}'
            note: "Tangente (T) a l'origine : coupe le palier au premier trait chiffre de la figure 2 (methode du rung 3)."
          - math: 'L = R\,\tau = 500\times 2\times10^{-3}'
            note: "On isole L a partir de tau = L/R (rung 3)."
          - math: '\boxed{L = 1\ \text{H}}'
            note: "Exactement la valeur demandee."
      - id: q3
        stem: |-
          **(0,5 pt)** **1-3.** Déterminer, en unité SI, l'expression numérique de la tension $u_L(t)$ aux bornes de la bobine lors de l'établissement du courant.
        reasoning: |-
          La bobine ayant une résistance négligeable (question 1), $u_L(t) = L\dfrac{di}{dt}$ seul. On dérive $i(t)=I_{max}(1-e^{-t/\tau})$ comme au rung 2 : $\dfrac{di}{dt}=\dfrac{I_{max}}{\tau}e^{-t/\tau}$. Comme $\tau=L/R$ (rung 3), $L/\tau=R$, et $R\,I_{max}=E$ (régime permanent) : le préfacteur se simplifie exactement en $E$.
        steps:
          - math: 'u_L(t) = L\dfrac{di}{dt}'
            note: "Bobine de resistance negligeable (question 1)."
          - math: '\dfrac{di}{dt} = \dfrac{I_{max}}{\tau}\,e^{-t/\tau}'
            note: "Derivee de i(t), calculee au rung 2."
          - math: 'u_L(t) = \dfrac{L}{\tau}\,I_{max}\,e^{-t/\tau} = R\,I_{max}\,e^{-t/\tau} = E\,e^{-t/\tau}'
            note: "L/tau = R (rung 3) et R I_max = E (regime permanent)."
          - math: '\boxed{u_L(t) = 24\,e^{-500\,t}\ \text{V} \qquad (t\ \text{en s})}'
            note: "Avec E = 24 V et 1/tau = 1/0,002 = 500 par seconde."

