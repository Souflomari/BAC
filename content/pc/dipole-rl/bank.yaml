      - id: q5
        part: "2- Rupture du courant électrique dans le circuit RL"
        stem: |-
          Le régime permanent étant établi. À un instant $t = 0$ choisi comme nouvelle origine des dates, on ouvre l'interrupteur $K$. Juste après l'ouverture de $K$ (à l'instant $t = 0^+$) :

          **2-1.** (0,25 pt) déterminer l'intensité du courant traversant la bobine.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le rung 1 de la leçon l'a établi et vérifié par l'absurde : le courant qui traverse une bobine ne peut jamais sauter, il varie continûment — un saut exigerait une tension infinie à ses bornes, ce qu'aucun circuit réel ne peut fournir. Ouvrir $K$ change la TENSION appliquée au circuit, mais ne change pas, à cet instant précis, le courant qui traverse la bobine.

          **L'application.** Juste avant l'ouverture (fin du régime permanent, question 1-4), le courant dans la bobine valait $I_0=0{,}1\ \text{A}$ (question 1-2). Par continuité,

          $$\boxed{i(0^+) = I_0 = 0{,}1\ \text{A} = 100\ \text{mA}}$$

          **Le piège de cette question.** Penser que couper l'interrupteur annule instantanément le courant partout dans le circuit, comme le ferait un interrupteur sur un circuit purement résistif. C'est vrai pour la TENSION que le générateur applique — plus rien ne l'impose — mais c'est faux pour le courant DANS LA BOBINE : c'est précisément cette inertie électrique (rung 1) qui va le forcer à continuer de circuler, quitte à emprunter un tout autre chemin (la diode et $R_1$, questions suivantes).
        steps:
          - math: 'i(0^-) = I_0 = 0{,}1\ \text{A} \quad \text{(regime permanent, question 1-2)}'
            note: "Valeur du courant juste avant l'ouverture de K."
          - math: 'i(0^+) = i(0^-) \quad \text{(continuite du courant dans une bobine, rung 1)}'
            note: "Le courant dans une bobine ne peut pas sauter : meme valeur juste apres l'ouverture."
          - math: '\boxed{i(0^+) = 0{,}1\ \text{A} = 100\ \text{mA}}'
            note: "Intensite dans la bobine a l'instant t = 0+."
      - id: q6
        stem: |-
          **2-2.** (0,25 pt) vérifier que la tension aux bornes du conducteur ohmique de résistance $R_1$ est $u_{R_1} = 100\ \text{V}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Il faut d'abord relire la figure 1 : dès que $K$ s'ouvre, la branche du générateur est coupée à la source même (l'ouverture est dans le fil supérieur), et le conducteur $R$, placé dans le fil inférieur ENTRE le générateur et le nœud de la bobine, se retrouve lui aussi hors circuit — plus aucun chemin fermé ne le traverse. La seule maille qui subsiste est donc bobine + diode + $R_1$ ($R$ n'en fait pas partie). Le sens du courant continu (question 2-1) coïncide justement avec le sens passant de la diode (donnée de la figure 1) : la diode conduit, et son seuil nul ($u_s=0$) en fait un simple fil dans ce sens. Le courant $i(0^+)$ traverse donc intégralement $R_1$.

          $$u_{R_1} = R_1\,i(0^+) = 1000\times0{,}1$$

          $$\boxed{u_{R_1} = 100\ \text{V}}$$

          C'est exactement la valeur que l'énoncé demande de vérifier.

          **Le piège de cette question.** Utiliser $R$ au lieu de $R_1$, par réflexe (c'est $R$ qui portait le courant pendant l'établissement) — mais $R$ n'appartient plus à la maille active après l'ouverture de $K$, seul $R_1$ y est. Deuxième piège : douter du résultat parce que $100\ \text{V}$ dépasse largement les $10\ \text{V}$ du générateur — ce n'est pas une erreur, c'est précisément le phénomène de surtension à l'ouverture d'un circuit inductif, ici limité (et non infini) grâce au chemin de repli offert par la diode et $R_1$.
        steps:
          - math: '\text{maille active a } t=0^+ : \text{ bobine} + \text{diode} + R_1 \quad (R \text{ hors circuit})'
            note: "Topologie de la figure 1 : K ouvert coupe la branche du generateur ET celle de R."
          - math: 'u_{R_1} = R_1\,i(0^+) = 1000\times0{,}1'
            note: "Loi d'Ohm sur R1, avec i(0+) = 0,1 A (question 2-1)."
          - math: '\boxed{u_{R_1} = 100\ \text{V}}'
            note: "Valeur verifiee, conforme a l'enonce."
      - id: q7
        stem: |-
          **2-3.** (0,25 pt) déduire la valeur de $u_{bo}$ la tension aux bornes de la bobine.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La maille qui subsiste (question 2-2) ne contient aucun générateur : bobine, diode, $R_1$, rien d'autre. On y applique la loi des mailles (rung 2) comme sur n'importe quelle boucle, avec la diode idéale, de seuil nul, qui se comporte comme un simple fil ($u_{diode}=0$) puisqu'elle conduit.

          $$u_{bo} + u_{diode} + u_{R_1} = 0 \qquad \text{(loi des mailles, meme convention qu'a l'etablissement)}$$

          avec $u_{diode}=0$ (diode idéale passante) et $u_{R_1}=100\ \text{V}$ (question précédente) :

          $$\boxed{u_{bo} = -u_{R_1} = -100\ \text{V}}$$

          **Le contrôle qui rassure.** Le signe négatif n'est pas une erreur de calcul : c'est le signal physique que la bobine a changé de rôle. Pendant l'établissement, elle RECEVAIT de l'énergie du générateur (rung 4). À l'ouverture, plus de générateur : c'est elle, maintenant, qui LIVRE l'énergie qu'elle avait stockée pour maintenir le courant — et un dipôle qui fournit de l'énergie, dans la même convention où il en recevait avant, affiche nécessairement une tension de signe opposé à son courant.

          **Le piège de cette question.** Répondre $u_{bo}=+100\ \text{V}$ en gardant le réflexe de l'établissement, où $u_{bobine}$ s'opposait à une tension $E$ elle-même positive. Ici il n'y a plus de générateur : c'est la bobine elle-même qui impose la tension, et seule la loi des mailles, appliquée à la maille réellement active, donne son signe de façon fiable — pas l'intuition.
        steps:
          - math: 'u_{bo} + u_{diode} + u_{R_1} = 0'
            note: "Loi des mailles sur la maille bobine-diode-R1 (rung 2), sans generateur."
          - math: 'u_{diode} = 0 \quad (\text{diode ideale, seuil nul, passante})'
            note: "Donnee de l'enonce : diode ideale de tension seuil us = 0."
          - math: 'u_{bo} = -u_{R_1} = -100'
            note: "u_R1 = 100 V (question 2-2)."
          - math: '\boxed{u_{bo} = -100\ \text{V}}'
            note: "Tension negative : la bobine restitue l'energie stockee, elle ne la recoit plus."
      - id: q8
        part: "3- Circuit oscillant LC idéal"
        stem: |-
          On forme un circuit oscillant $LC$ considéré idéal par la bobine précédente et un condensateur de capacité $C = 1\ \mu\text{F}$ totalement chargé par le générateur de f.e.m $E$.

          **3-1.** (0,25 pt) Calculer $N_0$ la fréquence propre de cet oscillateur.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le circuit qu'on vient de former n'est plus un dipôle RL : c'est un circuit oscillant $LC$, sans résistance — un objet qui appartient à un autre chapitre, celui des oscillations libres.

          **L'outil, et où il s'apprend.** Un circuit $LC$ idéal oscille librement à une fréquence propre qui ne dépend que de $L$ et $C$ :

          $$N_0 = \frac{1}{2\pi\sqrt{LC}}$$

          Cette formule, sa démonstration complète (l'équation différentielle, la solution sinusoïdale) appartiennent à la leçon **Circuit RLC série** ; on l'emploie ici comme un outil déjà construit, avec la bobine de la Partie I ($L=0{,}10\ \text{H}$, question 1-3) et le condensateur donné ($C=1\ \mu\text{F}$).

          $$LC = 0{,}10\times1\times10^{-6} = 1\times10^{-7}\ \text{s}^2$$

          $$\sqrt{LC}\approx3{,}162\times10^{-4}\ \text{s}$$

          $$N_0=\frac{1}{2\pi\times3{,}162\times10^{-4}}=\frac{1}{1{,}987\times10^{-3}}$$

          $$\boxed{N_0\approx503\ \text{Hz}}$$

          **Le piège de cette question.** Réutiliser par erreur $R=100\ \Omega$ ou $R_1=1\ \text{k}\Omega$ de la Partie I dans le calcul : le circuit LC de cette question ne contient AUCUN résistor — l'énoncé le dit, « considéré idéal » — la fréquence propre ne dépend que de $L$ et $C$, jamais d'une résistance.
        steps:
          - math: 'N_0 = \frac{1}{2\pi\sqrt{LC}} \quad \text{(resultat de la lecon Circuit RLC serie, reenonce ici)}'
            note: "Frequence propre d'un circuit LC ideal, admise comme connue (hors rungs de cette lecon)."
          - math: 'LC = 0{,}10\times1\times10^{-6} = 1\times10^{-7}\ \text{s}^2'
            note: "L = 0,10 H (question 1-3), C = 1 microF (donnee)."
          - math: '\sqrt{LC} \approx 3{,}162\times10^{-4}\ \text{s}'
            note: "Racine carree du produit LC."
          - math: '\boxed{N_0 = \frac{1}{2\pi\times3{,}162\times10^{-4}} \approx 503\ \text{Hz}}'
            note: "Frequence propre de l'oscillateur LC."
      - id: q9
        stem: |-
          **3-2.** (0,25 pt) Déterminer $I_m$ l'intensité maximale du courant électrique circulant dans ce circuit.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Toujours un résultat du chapitre **Circuit RLC série**, employé ici comme un outil déjà construit : dans un circuit $LC$ idéal, aucune énergie ne se dissipe (pas de résistance), donc l'énergie totale — électrique dans le condensateur, magnétique dans la bobine — se conserve à chaque instant, et bascule entièrement de l'un à l'autre. Quand le condensateur est totalement chargé, le courant est nul ; quand le courant est maximal, le condensateur est totalement déchargé. On égale donc l'énergie initiale (toute dans le condensateur, chargé par le générateur avant que le circuit LC ne se forme) à l'énergie maximale plus tard (toute dans la bobine).

          $$\frac12 C E^2 = \frac12 L I_m^2 \implies I_m = E\sqrt{\frac{C}{L}}$$

          **L'application numérique**, avec $E=10\ \text{V}$, $C=1\times10^{-6}\ \text{F}$ et $L=0{,}10\ \text{H}$ (question 1-3) :

          $$\frac{C}{L} = \frac{1\times10^{-6}}{0{,}10} = 1\times10^{-5}$$

          $$\sqrt{\frac{C}{L}} \approx 3{,}162\times10^{-3}$$

          $$I_m = 10\times3{,}162\times10^{-3}$$

          $$\boxed{I_m \approx 3{,}16\times10^{-2}\ \text{A} = 31{,}6\ \text{mA}}$$

          **Le contrôle qui rassure.** On peut retrouver ce résultat autrement, sans repasser par l'énergie : $I_m=Q_{max}\,\omega_0$ avec $Q_{max}=CE=10^{-5}\ \text{C}$ et $\omega_0=2\pi N_0\approx3162\ \text{rad/s}$ (question 3-1) — $I_m=10^{-5}\times3162\approx3{,}16\times10^{-2}\ \text{A}$, exactement la même valeur.

          **Le piège de cette question.** Utiliser $E$ comme s'il restait présent dans le circuit $LC$ — une fois le condensateur chargé et le circuit $LC$ formé, le générateur n'y figure plus : $E$ n'intervient plus que par la condition INITIALE qu'il a imposée au condensateur ($u_C(0)=E$), pas comme source active de ce nouveau circuit.
        steps:
          - math: '\frac12 C E^2 = \frac12 L I_m^2 \implies I_m = E\sqrt{\frac{C}{L}}'
            note: "Conservation de l'energie dans un circuit LC ideal (lecon Circuit RLC serie, reenoncee ici)."
          - math: '\frac{C}{L} = \frac{1\times10^{-6}}{0{,}10} = 1\times10^{-5}'
            note: "C = 1 microF (donnee), L = 0,10 H (question 1-3)."
          - math: 'I_m = 10\times\sqrt{1\times10^{-5}} = 10\times3{,}162\times10^{-3}'
            note: "Application numerique, E = 10 V."
          - math: '\boxed{I_m \approx 3{,}16\times10^{-2}\ \text{A} = 31{,}6\ \text{mA}}'
            note: "Intensite maximale du courant dans l'oscillateur LC."

