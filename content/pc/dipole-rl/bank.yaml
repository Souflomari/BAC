    intro: |-
      **Réponse d'un dipôle RL à un échelon de tension (examen national, session normale 2024, Exercice 4 — Partie 2).**

      On réalise le circuit schématisé dans la figure 3 en utilisant le générateur de tension de force électromotrice $E = 6\ \text{V}$ ; la bobine $(b)$ et le conducteur ohmique de résistance $R$ ajustable et l'interrupteur $K$, précédemment utilisés.

