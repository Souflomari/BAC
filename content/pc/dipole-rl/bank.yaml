    intro: |-
      **Établissement et rupture du courant dans un circuit RL, puis circuit LC idéal (examen national, session de rattrapage 2025 — Exercice 3, §1, 3,75 points).**

      *Les deux parties de cet exercice sont indépendantes : cette partie (établissement et rupture du courant dans un circuit RL, puis circuit LC idéal formé avec la même bobine) ; la modulation d'amplitude, traitée à part sous la notion « Ondes électromagnétiques — modulation d'amplitude ».*

      Le dispositif schématisé dans la figure 1 ci-contre comporte :
      - Un générateur de force électromotrice $E = 10\ \text{V}$ et de résistance interne négligeable ;
      - Une bobine d'inductance $L$ et de résistance négligeable ;
      - Deux conducteurs ohmiques l'un de résistance $R = 100\ \Omega$ et l'autre de résistance $R_1 = 1\ \text{k}\Omega$ ;
      - Une diode supposée idéale de tension seuil $u_s = 0$ ;
      - Un interrupteur $K$.

      À la date $t = 0$, on ferme $K$ et par suite un courant électrique d'intensité $i$ circule dans le circuit.

      **Figure 1 (schéma, re-décrit depuis l'image, p. 4) :** circuit à trois branches verticales entre un fil supérieur et un fil inférieur.
      - Branche de **gauche** : le générateur, symbole cercle traversé par le fil, avec à sa gauche une flèche de tension **verticale montante** étiquetée « $E$ » ; au-dessus, sur le même fil, la flèche du courant « $i$ » **orientée vers le haut**.
      - Fil **supérieur** : l'interrupteur $K$ (levier ouvert, étiquette « $K$ » au-dessus) entre la branche de gauche et le nœud de la branche centrale ; le fil se poursuit jusqu'à la branche de droite.
      - Branche **centrale** : la bobine, dessinée en spires, étiquetée « $L$ » à sa gauche, avec à sa droite une flèche de tension **verticale montante** étiquetée « $u_b$ ».
      - Branche de **droite** : en haut **la diode — triangle en trait fin (non rempli) dont la pointe est dirigée VERS LE HAUT, surmontée de la barre de cathode** ; l'anode est donc en bas (côté $R_1$) et la cathode en haut (côté fil supérieur), le sens passant allant **de $R_1$ vers le fil supérieur**. En dessous, le conducteur ohmique $R_1$ (rectangle vertical, étiquette « $R_1$ » à sa gauche).
      - Fil **inférieur** : le conducteur ohmique $R$ (rectangle horizontal, étiquette « $R$ » au-dessous), placé **entre la branche du générateur et le nœud de la branche de la bobine** ; au-dessus de ce rectangle, la flèche de tension « $u_R$ » est **orientée vers la DROITE** (donc à contresens du courant qui, dans ce fil, revient de droite à gauche : convention récepteur, $u_R = R\,i > 0$). Le fil inférieur se prolonge ensuite, **sans autre dipôle**, du nœud de la bobine jusqu'au pied de $R_1$. *(Conséquence topologique, recoupée par la question 2-2 : après ouverture de $K$, la maille qui subsiste est bobine + diode + $R_1$ — $R$ n'en fait pas partie —, ce qui donne bien $u_{R_1} = R_1 I_0 = 1000 \times 0{,}1 = 100\ \text{V}$ exactement. Le sens passant relevé sur le dessin est aussi celui qui bloque la diode pendant l'établissement du courant.)* Légende : « Figure 1 ».

      On visualise à l'aide d'un dispositif adéquat l'évolution temporelle de la tension $u_R$. On obtient ainsi la courbe de la figure 2. La droite $(T)$ représente la tangente à la courbe au point d'abscisse $t = 0$.

      **Figure 2 (courbe, re-décrite depuis l'image, mesurée au pixel, p. 4) :** $u_R\ (\text{V})$ en fonction de $t\ (\text{ms})$, sur quadrillage simple (pas de sous-maille), cadre de **8 divisions en largeur** et **9 divisions en hauteur**. **Abscisse** : $1\ \text{ms}$ par division, un trait sur deux chiffré ($2$ et $4$) ; le cadre va donc de $0$ à $8\ \text{ms}$. **Ordonnée** : les traits chiffrés $2{,}5$ et $5$ sont séparés par **deux** divisions — le pas est donc de **$1{,}25\ \text{V}$ par division** (et non $2{,}5$) ; le haut du cadre vaut $9 \times 1{,}25 = 11{,}25\ \text{V}$.

      Courbe croissante concave partant de l'origine et tendant vers un **palier confondu avec la 8ᵉ ligne horizontale au-dessus de l'axe**, soit $u_R = 8 \times 1{,}25 = \mathbf{10\ \text{V}}$ (mesure au pixel : le tracé du palier se superpose exactement à cette ligne) — ce qui est bien $E$, la bobine étant de résistance négligeable. Le palier est atteint (courbe confondue avec la ligne) à partir de $t \approx 4$–$5\ \text{ms}$.

      La droite $(T)$, tangente à l'origine, est tracée depuis $(0\,;\,0)$ et **coupe le niveau du palier au droit du premier trait vertical, soit $\tau = 1\ \text{ms}$**. Lecture ferme, doublement recoupée : (i) la courbe atteint $0{,}63 \times 10 = 6{,}3\ \text{V}$ exactement à $t = 1{,}00\ \text{ms}$ (mesure au pixel : $1{,}00 \pm 0{,}03$) ; (ii) $I_0 = u_{R,max}/R = 10/100 = 0{,}1\ \text{A}$ et $L = \tau R = 10^{-3} \times 100 = 0{,}10\ \text{H}$, ce que la question 1-3 demande de vérifier. *(Le tracé de la tangente est très légèrement trop raide sur le scan — elle coupe le palier vers $0{,}9\ \text{ms}$ ; le trait de graduation $1\ \text{ms}$ est la lecture visée, confirmée par le critère des $63\ \%$.)* Légende : « Figure 2 ».
    questions:
      - id: q1
        part: "1- Établissement du courant électrique dans le circuit RL"
        stem: |-
          **1-1.** (0,5 pt) Montrer que l'équation différentielle vérifiée par la tension $u_R$ aux bornes du conducteur ohmique de résistance $R$ s'écrit : $\dfrac{du_R}{dt} + \dfrac{R}{L}u_R = \dfrac{RE}{L}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le chapitre 3 de la leçon établit l'équation différentielle du dipôle RL en fonction du courant, $L\dfrac{di}{dt}+Ri=E$ — avec, en toute généralité, un terme résistif $r\,i$ propre à la bobine (chapitre 2). Ici l'énoncé précise que la bobine a une résistance négligeable, donc $u_{bobine}=L\dfrac{di}{dt}$ seul. L'énoncé veut en plus l'équation en $u_R(t)$, la grandeur que le dispositif de mesure enregistre réellement (figure 2), et non en $i(t)$ : il faut refaire la démarche du chapitre 3 (loi des mailles puis substitution), en choisissant $u_R$ comme inconnue.

          **Le pont à construire.** La loi d'Ohm relie les deux grandeurs : $u_R=R\,i$, donc $i=\dfrac{u_R}{R}$ — c'est ce remplacement qui va permettre d'éliminer $i$ partout, y compris dans la dérivée.

          **La loi des mailles**, sur la boucle active (générateur $E$, résistor $R$, bobine — la branche diode + $R_1$ ne conduit pas pendant l'établissement, sens bloquant, voir la figure 1) :

          $$E = u_R + u_{bobine}$$

          **La tension de la bobine**, avec sa résistance négligeable (chapitre 2, le terme $r\,i$ disparaît) :

          $$u_{bobine} = L\,\frac{di}{dt}$$

          **On reporte $i=u_R/R$ partout**, y compris dans la dérivée, $\dfrac{di}{dt}=\dfrac1R\dfrac{du_R}{dt}$ :

          $$E = u_R + \frac{L}{R}\frac{du_R}{dt}$$

          **On multiplie par $R$** pour effacer la fraction, puis on divise par $L$ pour isoler $\dfrac{du_R}{dt}$ :

          $$\boxed{\frac{du_R}{dt}+\frac{R}{L}u_R=\frac{RE}{L}}$$

          **Le contrôle qui rassure.** $u_R$ et $i$ ne diffèrent que par le facteur constant $R$ ($u_R=Ri$) : l'équation garde donc la même structure — un terme dérivé, un terme proportionnel à la grandeur, un second membre constant — que celle du chapitre 3, juste réécrite dans une autre variable.

          **Le piège de cette question.** Garder, par réflexe, un terme $r\,i$ pour la bobine — la relation générale du chapitre 2 porte $ri+L\,di/dt$ ; ici l'énoncé précise que la bobine a une résistance négligeable, donc $r=0$ et ce terme disparaît. L'introduire quand même changerait la forme de l'équation et empêcherait de retrouver exactement celle imposée par l'énoncé.
        steps:
