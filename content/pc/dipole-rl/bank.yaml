      - id: q2
        stem: |-
          **1-2.** (0,75 pt) En exploitant la courbe de la figure 2, déterminer $\tau$ la constante du temps du circuit et $I_0$ l'intensité du courant en régime permanent.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux méthodes de lecture, toutes deux données au rung 3, s'appliquent ici : la tangente à l'origine donne directement $\tau$, et le palier de la courbe donne la valeur en régime permanent — mais la figure 2 trace $u_R(t)$, pas $i(t)$ : il faut donc, pour $I_0$, repasser par la loi d'Ohm $i=u_R/R$ une fois le palier lu.

          **La lecture de $\tau$.** La tangente $(T)$ à l'origine coupe le niveau du palier au droit du premier trait vertical de la figure 2 :

          $$\tau \approx 1{,}0\ \text{ms} = 1{,}0\times10^{-3}\ \text{s}$$

