        figure 3 : le palier I_p = 60 mA donne r = E/I_p − R_2 = 100 − 95
        = 5 Ω (question 4), et la tangente coupant le palier à la première
        graduation, tau = 5,1 ms, donne L = (R_2+r)·tau = 100 × 5,1×10⁻³
        = 0,51 H — exactement la valeur que la question 5 demande
        d'établir. Les graduations de l'axe des abscisses sont des
        multiples de 5,1, ce qui confirme que la tangente est censée
