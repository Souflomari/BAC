        pixel ; tangente à l'origine, pente $120{,}0\ \text{mA/ms}$, coupe le
        niveau $120\ \text{mA}$ à $t=1{,}006\ \text{ms}\approx1\ \text{ms}$.
        Avec $R=92\ \Omega$ et $E=12\ \text{V}$ imprimés, $I_{max}=120\ \text{mA}$
        donne $R+r=E/I_{max}=100\ \Omega$, soit $r=8\ \Omega$ et
        $L=\tau(R+r)=0{,}10\ \text{H}$ — valeurs rondes, signe qu'on lit la
        bonne courbe (aucune incohérence du sujet officiel relevée ici).
    intro: |-
      **Réponse d'un dipôle RL à un échelon de tension ascendant (examen national, session normale 2012 — Electricité, Première partie, 2,5 points sur les 4,5 de l'exercice).**

      *La Deuxième partie de cet exercice — oscillations libres dans un circuit RLC série — est indépendante de celle-ci et traitée à part, sous la notion « Circuit RLC série » (entrée bk-2012-n-x4b).*

      Dans le cadre de la réalisation d'un projet scientifique, une enseignante encadrant un club scientifique propose à un groupe d'élèves de s'assurer du coefficient d'inductance $L$ et de la résistance $r$ d'une bobine $(b)$, et du taux d'influence de cette résistance sur l'énergie électrique totale d'un circuit série RLC libre.

      Le groupe a réalisé le montage de la figure 1, qui se compose de : la bobine $(b)$ ; un résistor de résistance $R = 92\ \Omega$ ; un générateur de force électromotrice $E = 12\ \text{V}$ et de résistance négligeable ; un interrupteur $K$.

      **Figure 1 (schéma, re-décrit depuis l'image, p. 4).** Circuit série en boucle rectangulaire unique. Branche du haut : l'interrupteur $K$, dessiné ouvert. Branche de gauche (verticale) : le générateur, avec la flèche $E$ orientée vers le haut à l'intérieur de la boucle. Branche du bas, de gauche à droite : le résistor $R$, puis la bobine $(b)$. Branche de droite : fil nu. Aucune tension n'est fléchée sur la figure — c'est l'objet de la question 1.

      À l'aide d'un matériel informatique convenable, les élèves ont obtenu expérimentalement la courbe de la figure 2, représentant les variations, en fonction du temps, de l'intensité du courant $i$ traversant le circuit.

      **Figure 2 (courbe, mesurée au pixel sur l'image native extraite du PDF, jusqu'à 233 dpi).** $i\ (\text{mA})$ en fonction de $t\ (\text{ms})$. Graduations noires en ordonnée : $0$, $40$, $80$, $120$ (traits bleus intercalaires tous les $20\ \text{mA}$). Graduations noires en abscisse : $1$, $2$, $3$, $4$, $5$ (traits bleus intercalaires tous les $0{,}5\ \text{ms}$). Courbe croissante, concave, partant de l'origine et plafonnant à $i \approx 120\ \text{mA}$, valeur atteinte vers $t \approx 5\ \text{ms}$. Droite en tirets, tangente à la courbe à l'origine, de pente $120\ \text{mA/ms}$ : elle coupe le niveau du palier $i = 120\ \text{mA}$ à $t \approx 1{,}0\ \text{ms}$.
    questions:
      - id: q1
        stem: |-
          **1-** (0,5 pt) Recopier la figure 1 sur votre copie, et représenter dessus la tension $u_R$ aux bornes du résistor, et la tension $u_b$ aux bornes de la bobine, en convention récepteur.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Ce n'est pas un calcul : c'est la convention qui gouverne TOUT ce qui suit dans l'exercice (l'équation de la question 2-1 en dépend directement). Le chapitre 2 de la leçon la pose noir sur blanc : en convention récepteur, la flèche de tension d'un dipôle est orientée dans le MÊME sens que la flèche du courant qui le traverse — le courant « entre » par la borne où la tension est comptée positivement.

          Le résistor $R$ et la bobine $(b)$ sont deux récepteurs traversés par le même courant $i$ (ils sont en série dans la branche du bas de la figure 1). La règle s'applique donc identiquement aux deux : on flèche $u_R$ et $u_b$ chacune dans le même sens que $i$ le long de la branche du bas — c'est-à-dire les deux flèches pointant dans la MÊME direction l'une que l'autre, chacune au-dessus (ou en dessous) de son propre dipôle.

          Le piège nommé de cette question. Flécher les deux tensions en sens opposés l'un de l'autre — une erreur fréquente quand on croit qu'il faut « faire le tour » de la maille en alternant les sens. Il n'y a rien à alterner : les deux dipôles sont traversés par le MÊME courant $i$, donc les deux flèches suivent la MÊME direction, dictée uniquement par le sens de $i$, jamais par la position du dipôle dans la boucle.
      - id: q2
        part: "2- Établir l'équation différentielle et lire r, L sur la courbe"
        stem: |-
          **2-1-** (0,5 pt) Établir l'équation différentielle vérifiée par $i(t)$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement la méthode du chapitre 3 : loi des mailles sur la maille série, puis on remplace chaque tension par l'expression de son dipôle — la loi d'Ohm pour $R$ (question 1), et la relation caractéristique de la bobine $u_b = r\,i + L\dfrac{di}{dt}$ (chapitre 2), qui porte à la fois sa résistance interne $r$ et son inductance $L$. On regroupe ensuite les deux termes résistifs, qui jouent le même rôle du point de vue de la loi d'Ohm, avant de diviser par $L$.
        steps:
          - math: 'E = u_R + u_b'
            note: "Loi des mailles, convention récepteur (question 1)."
          - math: 'u_R = R\,i \qquad u_b = r\,i + L\,\frac{di}{dt}'
            note: "Loi d'Ohm pour R ; relation caractéristique de la bobine avec sa résistance interne r et son inductance L (chapitre 2)."
          - math: 'E = (R+r)\,i + L\,\frac{di}{dt}'
            note: "On regroupe les deux termes resistifs R et r (chapitre 3)."
          - math: '\boxed{\frac{di}{dt} + \frac{R+r}{L}\,i = \frac{E}{L}}'
            note: "On divise par L : équation différentielle vérifiée par i(t)."
      - id: q3
        stem: |-
          **2-2-** (0,5 pt) La solution de l'équation différentielle est : $i(t) = A\left(1 - e^{-\frac{t}{\tau}}\right)$. Trouver les expressions de $A$ et $\tau$ en fonction des paramètres du circuit.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Même méthode qu'au chapitre 3 : on n'intègre rien, on identifie. La solution proposée doit vérifier l'équation de la question 2-1 : on calcule sa dérivée, on substitue, et on regroupe pour retrouver la forme de l'équation, terme à terme.

          $$\frac{di}{dt} = \frac{A}{\tau}\,e^{-t/\tau}$$

          On reporte $i(t)$ et $\dfrac{di}{dt}$ dans $\dfrac{di}{dt}+\dfrac{R+r}{L}i=\dfrac{E}{L}$ :

          $$\frac{A}{\tau}e^{-t/\tau} + \frac{R+r}{L}A\left(1-e^{-t/\tau}\right) = \frac{E}{L}$$

          Si — et seulement si — $\dfrac{1}{\tau}=\dfrac{R+r}{L}$, le terme en $e^{-t/\tau}$ s'annule exactement entre les deux occurrences, et il reste $\dfrac{R+r}{L}A=\dfrac{E}{L}$, d'où $A=\dfrac{E}{R+r}$.
        steps:
          - math: '\tau = \frac{L}{R+r} \qquad \text{(coefficient de } i \text{ dans l équation, rung 2)}'
            note: "Identification par substitution : c'est la seule valeur de tau qui annule le terme exponentiel."
          - math: '\boxed{A = \frac{E}{R+r} \qquad \tau = \frac{L}{R+r}}'
            note: "A est la valeur du palier (régime permanent, di/dt=0) ; tau est le temps caractéristique."
      - id: q4
        stem: |-
          **2-3-** (1 pt) Déterminer les valeurs de $r$ et $L$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Les deux lectures graphiques de la figure 2 — le palier et la tangente à l'origine (chapitre 4) — donnent $I_{max}=A$ et $\tau$ ; il suffit ensuite d'inverser les deux relations de la question précédente pour en tirer $r$ puis $L$, avec $R=92\ \Omega$ et $E=12\ \text{V}$ donnés par l'énoncé.

          **Lecture du palier.** La courbe plafonne à $i \approx 120\ \text{mA}$ (figure 2) : $I_{max}=A=120\ \text{mA}$.

          **Lecture de la tangente.** La tangente à l'origine coupe le niveau du palier à $\tau \approx 1{,}0\ \text{ms}$ (figure 2, chapitre 4).

          On inverse $A=\dfrac{E}{R+r}$ pour isoler $r$ :

          $$R+r = \frac{E}{A} = \frac{12}{0{,}120} = 100\ \Omega \implies r = 100-92 = 8\ \Omega$$

          Puis $\tau=\dfrac{L}{R+r}$ pour isoler $L$ :

          $$L = \tau(R+r) = 1{,}0\times10^{-3}\times100$$

          Le contrôle qui rassure. $r=8\ \Omega$ et $L=0{,}10\ \text{H}$ sont des valeurs rondes — le signe qu'on a bien lu la bonne courbe, pas un artefact de mesure.
        steps:
          - math: 'I_{max} = A \approx 120\ \text{mA} \qquad \tau \approx 1{,}0\ \text{ms}'
            note: "Deux lectures graphiques indépendantes sur la figure 2 : palier et tangente à l'origine (chapitre 4)."
          - math: 'R+r = \frac{E}{A} = \frac{12}{0{,}120} = 100\ \Omega'
            note: "On inverse A = E/(R+r) ; E = 12 V, R = 92 Ohm donnes par l'énoncé."
          - math: '\boxed{r = 100 - 92 = 8\ \Omega}'
            note: "Résistance interne de la bobine."
          - math: 'L = \tau(R+r) = 1{,}0\times10^{-3}\times100'
            note: "On inverse tau = L/(R+r)."
          - math: '\boxed{L = 0{,}10\ \text{H}}'
            note: "Inductance de la bobine : valeur ronde, coherente avec r=8 Ohm."

