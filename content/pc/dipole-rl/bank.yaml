    intro: |-
      **Réponse d'un dipôle RL à un échelon de tension (examen national, session normale 2024, Exercice 4 — Partie 2).**

      On réalise le circuit schématisé dans la figure 3 en utilisant le générateur de tension de force électromotrice $E = 6\ \text{V}$ ; la bobine $(b)$ et le conducteur ohmique de résistance $R$ ajustable et l'interrupteur $K$, précédemment utilisés.

      On ajuste la valeur de la résistance $R$ à une valeur $R_1$ et on ferme l'interrupteur $K$ à l'instant $t_0 = 0$.

      **Figure 3 (schéma).** Boucle rectangulaire. Branche gauche : générateur de tension idéale $E$ (cercle traversé d'un trait vertical), avec, à sa gauche et hors de la boucle, une flèche pleine verticale orientée vers le haut étiquetée « E » ; sur le fil de cette même branche gauche, juste au-dessus du générateur, une flèche de courant $i$ (pointe pleine), verticale, orientée vers le haut, étiquetée « i » à sa gauche. Branche supérieure : interrupteur $K$ (à gauche), puis conducteur ohmique de résistance $R$ ajustable (rectangle traversé d'une flèche oblique, symbole rhéostat), étiqueté « R ». Branche droite (verticale) : bobine dessinée en spires, étiquetée « (L,r) » à gauche du symbole et « (b) » à droite. Branche inférieure : simple fil refermant la boucle.

      La courbe de la figure 4 représente les variations de $\dfrac{di}{dt}$ en fonction de l'intensité $i$. En s'aidant du graphe de la figure 4 :

      **Figure 4 (courbe).** Axe des ordonnées $\dfrac{di}{dt}\ (10^{3}\ \text{A.s}^{-1})$, gradué $1$ et $2$, origine $0$ ; axe des abscisses $i\ (\text{mA})$, gradué $1$ et $2$, origine $0$. Le cadre compte $6$ divisions principales en abscisse ($1$ division $=1\ \text{mA}$, bord droit $=6\ \text{mA}$) et $3$ divisions en ordonnée ($1$ division $=10^{3}\ \text{A.s}^{-1}$, bord supérieur $=3\times10^{3}\ \text{A.s}^{-1}$). Droite décroissante tracée d'un coin à l'autre du cadre : elle part du coin supérieur gauche, l'ordonnée à l'origine $\left.\dfrac{di}{dt}\right|_{i=0} = 3\times10^{3}\ \text{A.s}^{-1}$, et rejoint le coin inférieur droit, où elle coupe l'axe des abscisses à $\dfrac{di}{dt}=0$ pour $i = 6\ \text{mA}$.
    questions:
      - id: q1
        part: "2- Réponse d'un dipôle RL à un échelon de tension : établir le modèle"
        stem: |-
          **(0,5 pt)** **2-1.** En appliquant la loi d'additivité des tensions, montrer que : $\dfrac{di}{dt} = -\left(\dfrac{R_1+r}{L}\right)i + \dfrac{E}{L}$.
        reasoning: |-
          Même méthode qu'au chapitre 3 — loi des mailles (ici appelée « loi d'additivité des tensions »), puis substitution de la relation caractéristique de la bobine établie au chapitre 2, $u_{bobine}=r\,i+L\dfrac{di}{dt}$ : la bobine $(b)$ garde ici sa résistance interne $r$, non négligeable (contrairement au sujet 2023). On regroupe les deux termes résistifs $R_1$ et $r$, comme au chapitre 3, puis on réarrange pour isoler $\dfrac{di}{dt}$ directement — la même équation que celle du chapitre 3, présentée sous sa forme résolue plutôt que sous la forme $L\dfrac{di}{dt}+Ri=E$.
        steps:
          - math: 'E = u_{R_1} + u_{bobine}'
            note: "Loi d'additivité des tensions = loi des mailles sur la maille série (chapitre 3)."
          - math: 'u_{R_1} = R_1\,i \qquad u_{bobine} = r\,i + L\dfrac{di}{dt}'
            note: "Loi d'Ohm pour R1 ; relation caractéristique de la bobine, avec sa résistance interne r (chapitre 2)."
          - math: 'E = R_1\,i + r\,i + L\dfrac{di}{dt} = (R_1+r)\,i + L\dfrac{di}{dt}'
            note: "On regroupe les deux termes resistifs (chapitre 3)."
          - math: '\boxed{\dfrac{di}{dt} = -\dfrac{R_1+r}{L}\,i + \dfrac{E}{L}}'
            note: "On isole di/dt : même équation que celle du chapitre 3, présentée sous forme résolue."
      - id: q2a
        stem: |-
          **(0,5 pt)** **2-2-1.** Vérifier que la valeur de $L$ est : $L = 2\ \text{mH}$.
        reasoning: |-
          L'équation de la question 2-1 réarrangée est $\dfrac{di}{dt}=-\dfrac{R_1+r}{L}i+\dfrac{E}{L}$ — c'est exactement la relation linéaire entre $\dfrac{di}{dt}$ et $i$ déjà présente au chapitre 3 sous la forme $\dfrac{di}{dt}=-\dfrac{R}{L}\left(i-\dfrac{E}{R}\right)$, mais ici on l'exploite en la lisant directement sur un graphe de $\dfrac{di}{dt}$ en fonction de $i$ plutôt que sur la courbe usuelle $i(t)$ — une lecture graphique que le chapitre 4 ne couvre pas explicitement (voir la scope note de sourcing). En $i=0$, l'ordonnée à l'origine de cette droite vaut $E/L$ : on la lit sur la figure 4, puis on isole $L$.
        steps:
          - math: '\left.\dfrac{di}{dt}\right|_{i=0} = \dfrac{E}{L}'
            note: "On evalue l'équation de la question 2-1 en i=0 : c'est l'ordonnée à l'origine de la figure 4."
          - math: '\left.\dfrac{di}{dt}\right|_{i=0} = 3\times10^{3}\ \text{A.s}^{-1}'
            note: "Lecture directe sur la figure 4 (coin supérieur gauche du segment)."
          - math: 'L = \dfrac{E}{3\times10^{3}} = \dfrac{6}{3\times10^{3}}'
            note: "On isole L."
          - math: '\boxed{L = 2\times10^{-3}\ \text{H} = 2\ \text{mH}}'
            note: "Exactement la valeur demandee."
      - id: q2b
        stem: |-
          **(0,5 pt)** **2-2-2.** Déterminer la valeur de la constante de temps $\tau$ du circuit.
        reasoning: |-
          Toujours sur la même droite de la figure 4 (même scope note qu'à la question précédente) : au point où elle coupe l'axe des abscisses, $\dfrac{di}{dt}=0$, donc l'équation de la question 2-1 donne $0=-\dfrac{R_1+r}{L}I_{max}+\dfrac{E}{L}$, d'où $R_1+r=E/I_{max}$ — la même identification qu'au chapitre 3 pour le régime permanent ($I_{max}=E/R$), appliquée ici à ce graphe plutôt qu'à un palier de $i(t)$. On lit $I_{max}=6\ \text{mA}$ à l'abscisse où la droite coupe l'axe, puis on calcule $\tau=L/(R_1+r)$ comme au chapitre 4, avec le $L$ trouvé à la question précédente.
        steps:
          - math: '0 = -\dfrac{R_1+r}{L}\,I_{max} + \dfrac{E}{L} \implies R_1+r = \dfrac{E}{I_{max}}'
            note: "Point ou la droite de la figure 4 coupe l'axe des i (di/dt = 0) : régime permanent (chapitre 3)."
          - math: 'I_{max} = 6\ \text{mA} = 6\times10^{-3}\ \text{A}'
            note: "Lecture directe sur la figure 4 (coin inférieur droit du segment)."
          - math: 'R_1+r = \dfrac{6}{6\times10^{-3}}'
            note: "Application numérique."
          - math: '\boxed{R_1+r = 1000\ \Omega}'
            note: "Résistance totale du circuit."
          - math: '\tau = \dfrac{L}{R_1+r} = \dfrac{2\times10^{-3}}{1000}'
            note: "tau = L/R du chapitre 4, avec L de la question 2-2-1."
          - math: '\boxed{\tau = 2\times10^{-6}\ \text{s} = 2\ \mu\text{s}}'
            note: "Constante de temps du circuit."

