notion: dipole-rl
skill_code: pc_dipole_rl

# Misconception inventory (floor-backfill pass — mirrors the checkpoints.yaml
# gold standard: courant-saute-instantane, bobine-nature-erronee,
# imax-etablissement-mal-compris, oubli-resistance-interne,
# tau-mauvais-groupement, lecture-tau-erronee are the six ids already used in
# checkpoints.yaml; energie-lineaire-en-i is added here for the R4/R5 energy
# items, which checkpoints.yaml does not probe. See coverage_summary at the
# end of this file for honest per-misconception counts and floor_met.
misconceptions:
  - id: mc.physics.pc_dipole_rl.courant-saute-instantane
    label: "« Le courant i saute instantanément à sa valeur finale à la fermeture (ou à zéro à l'ouverture) »"
    description: "L'élève croit que i atteint E/(R+r) (ou 0) dès l'instant de commutation, sans montée (ou descente) progressive."
    contradicts_principle: "i est continu à travers une bobine (un saut exigerait L·di/dt infinie, donc une tension infinie) : il part de i(0-) et s'établit continûment vers I_max = E/(R+r), jamais par un saut."
  - id: mc.physics.pc_dipole_rl.bobine-nature-erronee
    label: "« Modèle physique erroné de ce que fait une bobine (bloque le courant, le stocke comme une charge, l'amplifie, ou n'est définie que par sa forme/sa résistance) »"
    description: "L'élève plaque sur la bobine un modèle emprunté à un autre dipôle (interrupteur ouvert, condensateur-réservoir, amplificateur) au lieu de la définir par u = ri + L·di/dt."
    contradicts_principle: "La bobine ne bloque pas, ne stocke pas de charge et n'amplifie rien : elle s'oppose aux VARIATIONS du courant (auto-induction), retardant son établissement sans jamais l'empêcher ni le dépasser."
  - id: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
    label: "« Confusion établissement / régime permanent : I_max dépend de L, ou dépend de E mais pas de R (ou l'inverse), ou il y a dépassement/oscillation »"
    description: "L'élève ne distingue pas ce qui règle la VALEUR finale (E et la résistance totale) de ce qui règle la DURÉE pour l'atteindre (L, via τ), ou attend un comportement transitoire absent d'un RL pur."
    contradicts_principle: "En régime permanent di/dt = 0, donc I_max = E/(R+r) : indépendant de L, proportionnel à E, inversement proportionnel à R+r. La montée est monotone, sans dépassement ni oscillation (propre au RLC)."
  - id: mc.physics.pc_dipole_rl.oubli-resistance-interne
    label: "« Oubli (ou mauvais traitement) de la résistance interne r de la bobine dans R_total, dans u_L, ou dans l'équation différentielle »"
    description: "L'élève calcule comme si la bobine était un fil parfait (r=0), ou omet r (ou R_0) dans la résistance totale du circuit."
    contradicts_principle: "La résistance totale est R = R_0 + r ; les deux résistances jouent le même rôle ohmique et se somment, y compris en régime permanent où u_L = ri ≠ 0."
  - id: mc.physics.pc_dipole_rl.tau-mauvais-groupement
    label: "« Mauvaise expression/unité/dépendance de τ (R/L, RC, L/R en henry, τ indépendant de R ou de L…) »"
    description: "L'élève ne retient pas le groupement L/R, se trompe d'unité, ou inverse le sens de la dépendance de τ en R ou en L."
    contradicts_principle: "τ = L/R, homogène à un temps (H/Ω = s). τ croît avec L, décroît quand R augmente ; ni R/L, ni RC (constante du dipôle RC), ni une unité en henry."
  - id: mc.physics.pc_dipole_rl.lecture-tau-erronee
    label: "« τ interprété comme l'instant où le courant/la tension a fini de varier, plutôt que comme l'échelle de temps caractéristique »"
    description: "L'élève place τ à l'instant où I_max (ou son palier) est atteint, confond la méthode des 63 % avec une demi-vie à 50 %, ou pense que τ dépend de la courbe lue (i(t) vs u_L(t))."
    contradicts_principle: "À t=τ, seulement 63 % de I_max est atteint (1-e^{-1}) ; le régime permanent n'est que PRATIQUEMENT atteint vers 5τ. τ est une propriété du circuit (L/R), la même quelle que soit la grandeur (i ou u_L) qu'on lit pour la déterminer."
  - id: mc.physics.pc_dipole_rl.energie-lineaire-en-i
    label: "« Énergie de la bobine non quadratique en i (E_L = Li, ou confondue avec une puissance dissipée / une autre formule d'énergie) »"
    description: "L'élève confond l'énergie magnétique stockée avec une expression linéaire en i, avec la puissance Joule dissipée, ou avec l'énergie d'un condensateur."
    contradicts_principle: "E_L = ½Li² : la puissance reçue Li·di/dt est la dérivée de ½Li². Li n'est même pas homogène à une énergie ; ½ri² et ½Cu² sont d'autres grandeurs (puissance dissipée, énergie d'un condensateur)."

items:
  - id: RL-1
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
    stem: >
      À l'instant où on ferme l'interrupteur d'un circuit série (générateur idéal $E$,
      résistance totale $R$, bobine $(r, L)$), quelle est la valeur du courant $i$
      juste après la fermeture, à $t = 0^+$ ?
    type: mcq
    choices:
      - id: A
        text: "$i(0^+) = 0$"
        correct: true
      - id: B
        text: "$i(0^+) = E/R$, comme si la bobine n'existait pas"
        correct: false
        misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
        feedback: >
          Le courant à travers une bobine ne peut pas sauter instantanément : un
          saut exigerait une tension infinie aux bornes de la bobine
          ($u = ri + L\,di/dt$), ce qu'un générateur de f.é.m. finie $E$ ne peut
          pas fournir.
      - id: C
        text: "$i(0^+) = E/r$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
        feedback: >
          Cette valeur ignore la résistance $R_0$ du reste du circuit, et surtout
          suppose à tort un établissement instantané du courant.
      - id: D
        text: "$i(0^+)$ est indéterminé, on ne peut rien en dire"
        correct: false
        misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
        feedback: >
          Le courant est parfaitement déterminé : la continuité du courant dans
          une bobine impose $i(0^+) = i(0^-) = 0$, puisque le circuit était
          ouvert avant $t=0$.
    correct_feedback: >
      Le courant dans une bobine est une grandeur continue : il vaut $0$ juste
      après la fermeture, exactement comme juste avant, puisque le circuit
      était ouvert.
    solution: |
      Le courant qui traverse une bobine ne peut varier que continûment. Un
      saut instantané de $i$ correspondrait à $di/dt$ infini à cet instant,
      donc à une tension $u = ri + L\,di/dt$ infinie aux bornes de la bobine —
      ce qu'aucun générateur de f.é.m. finie ne peut fournir.
      Avant $t=0$, le circuit est ouvert : $i(0^-) = 0$.
      Par continuité : $i(0^+) = i(0^-) = 0$.

  - id: RL-2
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
    stem: >
      En régime permanent (courant $i$ constant, établi depuis longtemps) dans
      un circuit comportant une bobine $(r, L)$, que vaut la tension $u$ à ses
      bornes ?
    type: mcq
    choices:
      - id: A
        text: "$u = ri$, exactement comme pour un simple résistor"
        correct: true
      - id: B
        text: "$u = L\\,di/dt$ uniquement"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          Ce terme est nul en régime permanent, puisque le courant est
          constant : $di/dt = 0$.
      - id: C
        text: "$u = 0$ : une bobine ne laisse jamais paraître de tension en régime établi"
        correct: false
        misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
        feedback: >
          La bobine a une résistance interne $r$ non nulle : en régime permanent
          elle se comporte comme un résistor ordinaire, $u = ri$, pas comme un
          fil sans résistance.
      - id: D
        text: "$u = ri + L\\,I_{max}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $L$ ne se multiplie jamais directement par le courant : il se
          multiplie par $di/dt$, qui est nul en régime permanent. Ce choix
          mélange les deux termes de la relation caractéristique.
    correct_feedback: >
      Dès que $di/dt = 0$, le terme inductif disparaît : la bobine, en régime
      permanent, se comporte comme un simple résistor de résistance $r$.
    solution: |
      Relation caractéristique : $u = ri + L\,di/dt$.
      En régime permanent, $i$ est constant, donc $di/dt = 0$.
      Il reste $u = ri$ : la bobine se comporte alors comme une résistance
      ordinaire $r$, sans opposition supplémentaire liée à $L$.

  - id: RL-3
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
    stem: >
      Quelle est l'expression correcte de la constante de temps d'un dipôle
      RL, et quelle est son unité ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau = L/R$, exprimée en secondes"
        correct: true
      - id: B
        text: "$\\tau = R/L$, exprimée en secondes"
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          C'est l'inverse de la bonne formule ; $R/L$ a d'ailleurs la dimension
          de l'inverse d'un temps ($\text{s}^{-1}$), pas d'un temps.
      - id: C
        text: "$\\tau = RC$, comme pour le dipôle RC"
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          Cette formule vient du chapitre RC, où le paramètre est une capacité
          $C$, pas une inductance $L$. Le dipôle RL n'a pas de condensateur :
          $\tau = L/R$.
      - id: D
        text: "$\\tau = L/R$, exprimée en henry"
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          Le henry est l'unité de l'inductance $L$, pas celle de $\tau$. Le
          rapport $L/R$ a la dimension d'un temps (la seconde), comme le
          confirme l'analyse dimensionnelle $\text{V}\cdot\text{s}/\text{A}$
          divisé par $\text{V}/\text{A}$.
    correct_feedback: >
      $\tau = L/R$ est homogène à un temps ($\text{H}/\Omega = \text{s}$) :
      c'est la durée caractéristique de l'établissement du courant.
    solution: |
      $[L] = \text{V}\cdot\text{s}/\text{A}$ (issu de $u_L = L\,di/dt$).
      $[R] = \text{V}/\text{A}$ (loi d'Ohm).
      $[L]/[R] = \text{s}$ : le rapport $L/R$ est homogène à un temps.
      C'est cette combinaison, et aucune autre, qui annule exactement le reste
      exponentiel lors de la vérification de la solution $i(t)$.

  - id: RL-4
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
    stem: >
      Quelle est l'expression correcte de l'énergie emmagasinée dans une
      bobine d'inductance $L$ parcourue par un courant $i$ ?
    type: mcq
    choices:
      - id: A
        text: "$E_L = \\frac{1}{2}Li^2$"
        correct: true
      - id: B
        text: "$E_L = Li$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Cette expression n'est même pas homogène à une énergie. L'énergie
          stockée se retrouve en reconnaissant que la puissance reçue par la
          bobine, $Li\,di/dt$, est la dérivée par rapport au temps de
          $\frac12 Li^2$.
      - id: C
        text: "$E_L = \\frac{1}{2}ri^2$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Cette expression est une puissance dissipée par effet Joule dans la
          résistance interne — de l'énergie perdue, pas stockée. L'énergie
          emmagasinée par la bobine ne dépend que de $L$ et $i$.
      - id: D
        text: "$E_L = \\frac{1}{2}Cu^2$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          C'est l'énergie stockée dans un condensateur (chapitre RC), pas dans
          une bobine. Une bobine ne stocke pas d'énergie via une capacité $C$
          qu'elle n'a pas.
    correct_feedback: >
      $E_L = \frac12 Li^2$ : elle croît avec le carré du courant établi, et se
      retrouve en reconnaissant $Li\,di/dt$ comme la dérivée de $\frac12 Li^2$
      dans le bilan de puissance du circuit.
    solution: |
      Bilan de puissance : $Ei = Ri^2 + Li\,di/dt$.
      $Ri^2$ est dissipé par effet Joule.
      $Li\,di/dt = \dfrac{d}{dt}\left(\dfrac12 Li^2\right)$ : c'est la
      puissance reçue par la bobine, donc $\dfrac12 Li^2$ est l'énergie
      qu'elle accumule.

  - id: RL-5
    rung: "R3"
    difficulty_level: 4
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
    stem: >
      Sur un oscillogramme enregistrant $i(t)$ lors de l'établissement du
      courant dans un circuit RL, on a repéré la valeur asymptotique
      $I_{max}$. Comment repère-t-on graphiquement l'instant $t = \tau$ ?
    type: mcq
    choices:
      - id: A
        text: "C'est l'instant où $i(t)$ atteint environ $0{,}63 \\times I_{max}$."
        correct: true
      - id: B
        text: "C'est l'instant où $i(t)$ atteint $I_{max}$ pour la première fois."
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          $i(t)$ ne fait que se rapprocher de $I_{max}$ sans jamais l'atteindre
          exactement en un temps fini : $i(t) = I_{max}(1-e^{-t/\tau})$ tend
          vers $I_{max}$ mais ne l'égale jamais strictement.
      - id: C
        text: "C'est l'instant où $i(t)$ atteint $0{,}5 \\times I_{max}$."
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          $50\%$ de $I_{max}$ correspond à un instant différent de $\tau$ : il
          faudrait résoudre $1-e^{-t/\tau} = 0{,}5$, ce qui donne
          $t = \tau\ln 2 \approx 0{,}69\,\tau$, pas $\tau$.
      - id: D
        text: "C'est l'instant où la pente de $i(t)$ devient négative."
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          La pente de $i(t)$ reste positive tout au long de l'établissement du
          courant : le courant croît continûment vers $I_{max}$, elle ne
          devient jamais négative dans cette phase.
    correct_feedback: >
      $1-e^{-1}\approx 0{,}63$ : à $t=\tau$, le courant a parcouru $63\%$ du
      chemin vers $I_{max}$. C'est la lecture graphique la plus directe.
    solution: |
      $i(\tau) = I_{max}(1-e^{-\tau/\tau}) = I_{max}(1-e^{-1})$
      $\approx I_{max} \times 0{,}632$.
      On repère donc, sur l'oscillogramme, l'instant où la courbe atteint
      $63\%$ de son asymptote : cet instant est $\tau$.

  - id: RL-6
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
    stem: >
      Pourquoi le courant traversant une bobine ne peut-il pas s'établir
      instantanément lors de la fermeture d'un interrupteur ?
    type: mcq
    choices:
      - id: A
        text: >-
          Parce qu'un saut instantané de courant imposerait une tension
          infinie aux bornes de la bobine ($u = ri + L\,di/dt$), que le
          générateur ne peut pas fournir.
        correct: true
      - id: B
        text: >-
          Parce que la résistance interne $r$ de la bobine est toujours très élevée et
          limite fortement l'intensité du courant.
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          Ce n'est pas $r$ qui empêche le saut instantané : $r$ se comporte
          comme une résistance ordinaire, qui n'empêche elle-même aucun saut.
          C'est le terme $L\,di/dt$, lié à la variation du courant, qui est
          en cause.
      - id: C
        text: >-
          Parce que le courant doit d'abord « remplir » physiquement les spires de la
          bobine, comme un réservoir se remplit lentement d'eau.
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          Cette image confond la bobine avec un condensateur qui stockerait de
          la charge. La bobine ne stocke pas de charge électrique ; elle
          s'oppose aux variations rapides du courant via l'auto-induction.
      - id: D
        text: "Parce que la loi d'Ohm ne s'applique tout simplement pas aux bobines, quelles que soient leurs caractéristiques."
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          La loi d'Ohm s'applique bien à la partie résistive de la bobine
          ($ri$). Ce qui est nouveau, c'est le terme additionnel $L\,di/dt$,
          pas une absence de la loi d'Ohm.
    correct_feedback: >
      Le terme $L\,di/dt$ deviendrait infini pour une variation instantanée de
      courant, ce qu'aucun générateur réel ne peut fournir : le courant dans
      une bobine varie donc toujours continûment.
    solution: |
      Un saut instantané de $i$ signifierait $di/dt \to \infty$ à cet instant.
      La relation $u = ri + L\,di/dt$ donnerait alors $u \to \infty$.
      Un générateur idéal de f.é.m. finie $E$ ne peut fournir une tension
      infinie à aucun dipôle du circuit : le saut est donc impossible.
      Conclusion : $i$ varie continûment à travers une bobine.

  - id: RL-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
    stem: >
      Dans l'expérience décrite en ouverture, on ferme l'interrupteur d'un
      circuit série contenant une lampe et une bobine. Que se passe-t-il pour
      l'éclat de la lampe au moment de la fermeture ?
    type: mcq
    choices:
      - id: A
        text: "L'éclat croît progressivement, depuis zéro jusqu'à son maximum"
        correct: true
      - id: B
        text: "L'éclat est maximal instantanément, exactement comme avec une résistance seule"
        correct: false
        misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
        feedback: >
          Ce comportement est celui d'un circuit purement résistif. Avec une
          bobine, le courant — et donc l'éclat de la lampe — ne peut pas
          sauter instantanément à sa valeur finale : il s'établit
          progressivement.
      - id: C
        text: "La lampe reste éteinte indéfiniment : le courant ne s'établit jamais réellement"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          Le courant se rapproche asymptotiquement de sa valeur finale sans
          jamais l'atteindre exactement en temps fini, mais il devient
          pratiquement établi après une durée de quelques $\tau$ : la lampe
          atteint bien, en pratique, son éclat maximal — elle ne reste pas
          éteinte.
      - id: D
        text: "L'éclat oscille plusieurs fois avant de se stabiliser"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          L'établissement du courant dans un circuit RL est un phénomène
          monotone : le courant croît continûment vers sa valeur finale, sans
          dépassement ni oscillation. Les oscillations apparaissent dans
          d'autres circuits (RLC), pas ici.
    correct_feedback: >
      Comme observé au ralenti, l'éclat — donc le courant — croît
      progressivement depuis zéro : c'est la signature de la bobine, qui
      retarde l'établissement du courant.
    solution: |
      L'expérience montre que la lampe en série avec la bobine met un court
      instant à atteindre son éclat maximal, contrairement à la résistance
      seule où l'allumage est instantané. Le courant grimpe progressivement
      depuis zéro jusqu'à sa valeur de régime permanent, sans saut ni
      oscillation.

  - id: RL-8
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
    stem: >
      On compare deux circuits identiques (même générateur, même lampe) :
      l'un contient une résistance seule, l'autre une résistance et une
      bobine en série. Dans lequel des deux circuits la lampe atteint-elle
      son éclat maximal instantanément à la fermeture de l'interrupteur ?
    type: mcq
    choices:
      - id: A
        text: "Le circuit avec la résistance seule, uniquement"
        correct: true
      - id: B
        text: "Les deux circuits : la présence d'une bobine ne change rien à l'allumage"
        correct: false
        misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
        feedback: >
          La bobine change justement ce point précis : elle retarde
          l'établissement du courant, donc de l'éclat, contrairement à la
          résistance seule où rien ne s'oppose à une variation instantanée du
          courant.
      - id: C
        text: "Le circuit avec la bobine, uniquement, car la bobine accélère l'établissement du courant"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          C'est l'inverse : la bobine s'oppose aux variations de courant,
          elle ralentit son établissement, elle ne l'accélère jamais.
      - id: D
        text: "Aucun des deux : un allumage instantané n'existe jamais physiquement, même sans bobine"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          Avec une résistance seule, rien dans le circuit ne s'oppose à une
          variation instantanée du courant : l'allumage y est bien
          instantané. C'est la présence de la bobine, et elle seule, qui
          introduit ce retard.
    correct_feedback: >
      Seule la bobine s'oppose aux variations rapides du courant ; une
      résistance seule n'introduit aucun retard à l'établissement du courant.
    solution: |
      Une résistance seule n'impose aucune relation entre $u$ et la vitesse
      de variation de $i$ : le courant peut y varier instantanément dès la
      fermeture. Une bobine impose au contraire $i$ continu, donc un
      établissement progressif. Seul le circuit avec la bobine montre un
      allumage retardé.

  - id: RL-9
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
    stem: >
      D'après l'expérience de l'accroche, quelle affirmation décrit
      correctement ce que fait la bobine, sans encore recourir à une
      équation ?
    type: mcq
    choices:
      - id: A
        text: "La bobine s'oppose aux variations rapides du courant qui la traverse, ce qui retarde son établissement"
        correct: true
      - id: B
        text: "La bobine bloque totalement le passage du courant, comme un interrupteur resté ouvert"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          La bobine ne bloque pas le courant : en régime permanent, le
          courant s'établit bien à sa valeur finale non nulle. Elle s'oppose
          seulement aux variations rapides du courant, pas à son passage.
      - id: C
        text: "La bobine stocke le courant électrique comme un réservoir, puis le libère progressivement"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          Cette image de réservoir décrit plutôt un condensateur, qui stocke
          une charge. Une bobine ne stocke pas de courant : elle s'oppose,
          par auto-induction, aux variations du courant qui la traverse.
      - id: D
        text: "La bobine amplifie le courant fourni par le générateur au démarrage"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          C'est l'inverse : la bobine limite et retarde la montée du courant
          au démarrage, elle ne l'amplifie jamais. Le courant final reste
          fixé par le générateur et les résistances, jamais augmenté par la
          bobine.
    correct_feedback: >
      C'est exactement l'idée : la bobine s'oppose aux variations de
      courant, ce qui explique le retard observé à l'allumage.
    solution: |
      Le comportement observé (allumage progressif) s'explique par le fait
      que la bobine s'oppose aux variations du courant qui la traverse — une
      opposition qui retarde, sans jamais bloquer ni amplifier,
      l'établissement du courant vers sa valeur finale.

  - id: RL-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
    stem: >
      Qu'est-ce qui définit fondamentalement une bobine en tant que dipôle
      électrique ?
    type: mcq
    choices:
      - id: A
        text: "Le fait qu'une tension apparaisse à ses bornes en réponse à une variation du courant qui la traverse"
        correct: true
      - id: B
        text: "Sa forme géométrique : tout fil enroulé en spires est nécessairement une bobine"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          C'est le comportement électrique — l'apparition d'une tension liée
          à la variation du courant — qui définit la bobine, pas sa forme
          matérielle. Un fil enroulé sans ce comportement ne serait pas une
          bobine du point de vue électrique.
      - id: C
        text: "Le fait qu'elle emmagasine une charge électrique proportionnelle à la tension à ses bornes"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          C'est la définition d'un condensateur ($q = Cu$), pas d'une
          bobine. La bobine ne stocke pas de charge ; elle développe une
          tension liée à $di/dt$.
      - id: D
        text: "Sa résistance interne $r$, seule grandeur nécessaire pour la caractériser"
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          $r$ ne caractérise que la partie résistive ordinaire du fil. Ce
          qui distingue la bobine, c'est le terme $L\,di/dt$, associé à
          l'inductance $L$ — sans lui, ce ne serait qu'un simple résistor.
    correct_feedback: >
      C'est ce comportement — une tension induite par la variation du
      courant — qui définit la bobine comme dipôle, indépendamment de sa
      forme.
    solution: |
      La relation caractéristique $u = ri + L\,di/dt$ montre que la bobine
      développe, en plus du terme résistif ordinaire $ri$, un terme
      $L\,di/dt$ qui n'existe que lorsque le courant varie. C'est ce
      comportement — pas la forme en spires — qui définit la bobine.

  - id: RL-11
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
    stem: >
      Un circuit série comporte un générateur idéal de f.é.m. $E$, un
      interrupteur, un résistor $R_0$, et une bobine $(r, L)$. On ferme
      l'interrupteur à $t=0$. Quelle est l'équation différentielle vérifiée
      par le courant $i(t)$ pour $t>0$ ?
    type: mcq
    choices:
      - id: A
        text: "$L\\dfrac{di}{dt} + (R_0+r)\\,i = E$"
        correct: true
      - id: B
        text: "$L\\dfrac{di}{dt} + R_0\\,i = E$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
        feedback: >
          Cette équation oublie la résistance interne $r$ de la bobine. La
          loi des mailles fait apparaître $R_0 i + ri$, qu'on regroupe en
          $(R_0+r)i = Ri$ — $r$ ne disparaît pas.
      - id: C
        text: "$R_0\\,i = E$, sans terme inductif"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          Cette équation ignore complètement le terme $L\,di/dt$, comme si
          la bobine se comportait comme un simple fil sans inductance. C'est
          ce terme qui explique justement l'établissement progressif du
          courant.
      - id: D
        text: "$L\\dfrac{di}{dt} = E$, sans terme résistif"
        correct: false
        misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
        feedback: >
          Cette équation ignore la partie résistive du circuit (le résistor
          $R_0$ et la résistance interne $r$ de la bobine), comme s'il n'y
          avait qu'une inductance pure dans le circuit.
    correct_feedback: >
      La loi des mailles donne $E = R_0 i + (ri + L\,di/dt)$, qui se
      regroupe en $L\,di/dt + (R_0+r)i = E$ : les deux résistances, celle du
      résistor et celle interne à la bobine, jouent le même rôle et se
      somment.
    solution: |
      Loi des mailles : $E = R_0 i + u_{bobine}$, avec
      $u_{bobine} = ri + L\,di/dt$. Donc
      $E = R_0 i + ri + L\,di/dt = (R_0+r)i + L\,di/dt$, soit
      $L\dfrac{di}{dt} + (R_0+r)i = E$.

  - id: RL-12
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
    stem: >
      Un circuit RL comporte un résistor $R_0 = 20\ \Omega$, une bobine de
      résistance interne $r = 5\ \Omega$ et d'inductance $L = 0{,}5\ \text{H}$,
      alimentés par un générateur idéal $E = 5\ \text{V}$. Quelle est la
      valeur du courant de régime permanent $I_{max}$ ?
    type: mcq
    choices:
      - id: A
        text: "$I_{max} = 200\\ \\text{mA}$"
        correct: true
      - id: B
        text: "$I_{max} = 250\\ \\text{mA}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
        feedback: >
          Ce résultat utilise $R_0 = 20\ \Omega$ seul au dénominateur, en
          oubliant la résistance interne $r$ de la bobine. La résistance
          totale du circuit est $R = R_0 + r = 25\ \Omega$, pas $R_0$ seul.
      - id: C
        text: "$I_{max} = 1000\\ \\text{mA}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
        feedback: >
          Ce résultat utilise $r = 5\ \Omega$ seul, en oubliant le résistor
          $R_0$. C'est la résistance totale $R = R_0 + r$ qui intervient
          dans $I_{max} = E/R$.
      - id: D
        text: "$I_{max}$ ne peut pas être déterminé sans connaître $L$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $I_{max} = E/R$ ne dépend que de $E$ et de la résistance totale
          $R = R_0+r$ : en régime permanent, $di/dt=0$, donc le terme en $L$
          disparaît entièrement de l'équation. $L$ ne joue aucun rôle dans
          la valeur de $I_{max}$.
    correct_feedback: >
      Avec $R = R_0 + r = 25\ \Omega$, on obtient
      $I_{max} = E/R = 5/25 = 0{,}2\ \text{A} = 200\ \text{mA}$.
    solution: |
      $R = R_0 + r = 20+5 = 25\ \Omega$. En régime permanent, $L\,di/dt=0$,
      donc $Ri_{max}=E$, soit
      $I_{max} = E/R = 5/25 = 0{,}2\ \text{A} = 200\ \text{mA}$.

  - id: RL-13
    rung: "R3"
    difficulty_level: 4
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
    stem: >
      Sur un oscillogramme de $i(t)$ enregistré lors de l'établissement du
      courant, on trace la tangente à la courbe au point $t=0$. Cette
      tangente coupe l'asymptote horizontale $i = I_{max}$ en un point
      d'abscisse particulière. Que vaut cette abscisse ?
    type: mcq
    choices:
      - id: A
        text: "$t = \\tau$"
        correct: true
      - id: B
        text: "$t = 5\\tau$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          $5\tau$ correspond à la durée au bout de laquelle le régime
          permanent est pratiquement atteint (l'écart à $I_{max}$ devient
          inférieur à $1\%$) — c'est une règle différente. La tangente à
          l'origine, elle, coupe l'asymptote exactement en $t=\tau$.
      - id: C
        text: "$t = 0$ : la tangente est confondue avec l'asymptote dès l'origine"
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          À $t=0$, la tangente part du point $(0,0)$ avec une pente non
          nulle, $\dfrac{di}{dt}(0) = I_{max}/\tau$ ; elle ne coïncide pas
          avec l'asymptote horizontale à l'origine, elle la rejoint
          seulement plus tard, en $t=\tau$.
      - id: D
        text: "Cette abscisse dépend de la valeur de $I_{max}$, elle n'est pas la même d'une courbe à l'autre"
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          L'abscisse du point de croisement est toujours $\tau$, quelle que
          soit la valeur de $I_{max}$ : cette propriété géométrique découle
          uniquement de la pente à l'origine $I_{max}/\tau$, qui fait
          atteindre à cette droite la valeur $I_{max}$ précisément en
          $t=\tau$, indépendamment de l'échelle de $I_{max}$.
    correct_feedback: >
      La tangente à l'origine, de pente $I_{max}/\tau$, atteint la valeur
      $I_{max}$ précisément en $t=\tau$ : c'est la méthode de la tangente à
      l'origine pour lire $\tau$ graphiquement.
    solution: |
      La pente à l'origine vaut $\dfrac{di}{dt}(0) = I_{max}/\tau$. Une
      droite partant de $0$ avec cette pente atteint la valeur $I_{max}$ en
      un temps $t$ tel que $\dfrac{I_{max}}{\tau}\times t = I_{max}$, soit
      $t=\tau$. C'est indépendant de la valeur numérique de $I_{max}$.

  - id: RL-14
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
    stem: >
      Dans le bilan de puissance d'un circuit RL,
      $Ei = Ri^2 + Li\dfrac{di}{dt}$, que représente physiquement le terme
      $Li\dfrac{di}{dt}$ ?
    type: mcq
    choices:
      - id: A
        text: "La puissance reçue par la bobine, emmagasinée sous forme d'énergie magnétique"
        correct: true
      - id: B
        text: "La puissance dissipée par effet Joule dans la bobine"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          La puissance dissipée par effet Joule dans la résistance totale du
          circuit (y compris la résistance interne de la bobine) est déjà
          comptée dans le terme $Ri^2$. Le terme $Li\,di/dt$ correspond, lui,
          à une puissance stockée, pas dissipée.
      - id: C
        text: "La puissance fournie par le générateur au circuit"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          La puissance fournie par le générateur est $Ei$, le terme de
          gauche de l'égalité, pas $Li\,di/dt$. Ce dernier n'est qu'une
          partie de cette puissance totale — celle qui est stockée par la
          bobine.
      - id: D
        text: "Une puissance perdue, non récupérable, comme de la chaleur"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Cette puissance n'est pas perdue : elle correspond à de l'énergie
          stockée sous forme magnétique dans la bobine
          ($E_L = \frac12 Li^2$), disponible tant que le courant circule —
          contrairement à l'effet Joule, qui est bien une perte
          irréversible.
    correct_feedback: >
      $Li\,di/dt$ est la dérivée par rapport au temps de $\frac12 Li^2$ :
      c'est la puissance que la bobine reçoit et accumule sous forme
      d'énergie magnétique.
    solution: |
      $Ei = Ri^2 + Li\,di/dt$ : $Ri^2$ est dissipé par effet Joule.
      $Li\,di/dt = \dfrac{d}{dt}\left(\dfrac12 Li^2\right)$ est la puissance
      reçue par la bobine, donc stockée sous forme d'énergie magnétique
      $E_L=\frac12 Li^2$, et non dissipée.

  - id: RL-15
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
    stem: >
      Une bobine d'inductance $L = 0{,}2\ \text{H}$ est parcourue par un
      courant établi $i = 0{,}5\ \text{A}$ en régime permanent. Quelle est
      l'énergie qu'elle a emmagasinée ?
    type: mcq
    choices:
      - id: A
        text: "$E_L = 25\\ \\text{mJ}$"
        correct: true
      - id: B
        text: "$E_L = 50\\ \\text{mJ}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Ce résultat correspond à $Li^2$ sans le facteur $\frac12$ :
          $0{,}2\times0{,}5^2=0{,}05\ \text{J}$. La formule correcte est
          $E_L=\frac12 Li^2$, avec le facteur $\frac12$.
      - id: C
        text: "$E_L = 100\\ \\text{mJ}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Ce résultat utilise $E_L = Li$ (linéaire en $i$) au lieu de
          $E_L=\frac12 Li^2$ (quadratique en $i$) :
          $0{,}2\times0{,}5=0{,}1\ \text{J}$. L'énergie magnétique croît avec
          le carré du courant, pas avec le courant lui-même.
      - id: D
        text: "$E_L = 125\\ \\text{mJ}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Ce résultat utilise $\frac12 i^2$ en oubliant complètement le
          facteur $L$ : $\frac12\times0{,}5^2=0{,}125\ \text{J}$.
          L'inductance $L$ doit multiplier $i^2$ dans la formule
          $E_L=\frac12 Li^2$.
    correct_feedback: >
      $E_L = \frac12 Li^2 = \frac12\times0{,}2\times0{,}5^2 =
      \frac12\times0{,}2\times0{,}25 = 0{,}025\ \text{J} = 25\ \text{mJ}$.
    solution: |
      $E_L=\frac12 Li^2$, avec $L=0{,}2\ \text{H}$ et $i=0{,}5\ \text{A}$
      (courant de régime permanent, la valeur qu'il faut utiliser une fois
      l'établissement terminé).
      $E_L=\frac12\times0{,}2\times0{,}25=0{,}025\ \text{J}=25\ \text{mJ}$.

  - id: RL-16
    rung: "R5"
    difficulty_level: 5
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
    stem: >
      On réalise un circuit RL : générateur idéal $E = 8\ \text{V}$,
      interrupteur $K$, résistor $R_0 = 70\ \Omega$, bobine de résistance
      interne $r = 10\ \Omega$ et d'inductance $L$ inconnue, tous en série.
      On ferme $K$ à $t=0$ et on enregistre $i(t)$ à l'oscilloscope. La
      tangente à l'origine de la courbe coupe l'asymptote horizontale à
      $t = 3\ \text{ms}$. Quelle est la valeur de l'inductance $L$ ?
    type: mcq
    choices:
      - id: A
        text: "$L = 0{,}24\\ \\text{H}$"
        correct: true
      - id: B
        text: "$L = 0{,}21\\ \\text{H}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.oubli-resistance-interne
        feedback: >
          Ce résultat utilise $R_0=70\ \Omega$ seul au lieu de la résistance
          totale $R = R_0+r = 80\ \Omega$, en oubliant la résistance interne
          $r$ de la bobine.
      - id: C
        text: "$L \\approx 2{,}7\\times10^4\\ \\text{H}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          Ce résultat inverse la formule, en calculant $R/\tau$ au lieu de
          $\tau\times R$ — comme si $\tau = R/L$ au lieu de $\tau = L/R$.
          Une inductance de cet ordre de grandeur est d'ailleurs
          physiquement absurde pour une bobine de laboratoire.
      - id: D
        text: "$L = 0{,}048\\ \\text{H}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          Ce résultat suppose que la tangente à l'origine coupe l'asymptote
          en $5\tau$ plutôt qu'en $\tau$ (confusion avec la règle du régime
          permanent pratiquement atteint), d'où $\tau = 3/5 = 0{,}6\
          \text{ms}$ utilisé à tort au lieu de $\tau=3\ \text{ms}$.
    correct_feedback: >
      La tangente à l'origine coupe l'asymptote en $t=\tau$, donc
      $\tau = 3\ \text{ms}$. Avec $R=R_0+r=80\ \Omega$, on obtient
      $L=\tau\times R = 3\times10^{-3}\times80=0{,}24\ \text{H}$.
    solution: |
      $R = R_0+r = 70+10=80\ \Omega$. La méthode de la tangente à l'origine
      donne directement $\tau=3\ \text{ms}$. Comme $\tau=L/R$, on a
      $L=\tau\times R = 3\times10^{-3}\times 80 = 0{,}24\ \text{H}$.

  - id: RL-17
    rung: "R5"
    difficulty_level: 5
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
    stem: >
      Un circuit RL a pour données $E = 15\ \text{V}$, $R_0 = 140\ \Omega$,
      $r = 10\ \Omega$, $L = 0{,}3\ \text{H}$. Quelle est l'énergie
      emmagasinée dans la bobine une fois le régime permanent atteint ?
    type: mcq
    choices:
      - id: A
        text: "$E_L = 1{,}5\\ \\text{mJ}$"
        correct: true
      - id: B
        text: "$E_L = 3\\ \\text{mJ}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Ce résultat correspond à $L I_{max}^2$ sans le facteur $\frac12$ :
          $0{,}3\times0{,}1^2=0{,}003\ \text{J}$. La formule correcte est
          $E_L=\frac12 LI_{max}^2$.
      - id: C
        text: "$E_L = 30\\ \\text{mJ}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.energie-lineaire-en-i
        feedback: >
          Ce résultat utilise $E_L=L\,I_{max}$ (linéaire) au lieu de
          $E_L=\frac12 LI_{max}^2$ (quadratique) :
          $0{,}3\times0{,}1=0{,}03\ \text{J}$.
      - id: D
        text: "$E_L \\approx 0{,}6\\ \\text{mJ}$"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          Ce résultat utilise le courant à $t=\tau$
          ($\approx 0{,}63\times I_{max}$), soit une valeur pendant la phase
          transitoire, au lieu du courant de régime permanent $I_{max}$.
          « Régime permanent atteint » signifie qu'il faut utiliser
          $I_{max}$, pas une valeur intermédiaire.
    correct_feedback: >
      $R=R_0+r=150\ \Omega$, donc $I_{max}=E/R=15/150=0{,}1\ \text{A}$.
      $E_L=\frac12 LI_{max}^2=\frac12\times0{,}3\times0{,}01=0{,}0015\
      \text{J}=1{,}5\ \text{mJ}$.
    solution: |
      $R=R_0+r=140+10=150\ \Omega$. $I_{max}=E/R=15/150=0{,}1\ \text{A}=100\
      \text{mA}$. En régime permanent,
      $E_L=\frac12 LI_{max}^2=\frac12\times0{,}3\times(0{,}1)^2=\frac12\times0{,}3\times0{,}01=0{,}0015\
      \text{J}=1{,}5\ \text{mJ}$.

  - id: RL-18
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
    stem: >
      On double la résistance totale $R$ d'un circuit RL, sans changer ni
      $L$ ni $E$. Comment évoluent la constante de temps $\tau$ et le
      courant de régime permanent $I_{max}$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau$ est divisée par 2, et $I_{max}$ est divisé par 2"
        correct: true
      - id: B
        text: "$\\tau$ est divisée par 2, mais $I_{max}$ reste inchangé"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $I_{max}=E/R$ dépend aussi de $R$ : en doublant $R$ sans changer
          $E$, $I_{max}$ est nécessairement divisé par 2 également, tout
          comme $\tau$. Cette réponse ignore le rôle de $R$ dans la formule
          de $I_{max}$.
      - id: C
        text: "$\\tau$ est multipliée par 2, et $I_{max}$ est divisé par 2"
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          Cette réponse inverse le sens de la dépendance de $\tau$ en $R$ :
          comme $\tau=L/R$, une augmentation de $R$ (à $L$ constant) diminue
          $\tau$, elle ne l'augmente pas. Doubler $R$ divise $\tau$ par 2,
          ne le multiplie pas.
      - id: D
        text: "$\\tau$ et $I_{max}$ restent tous deux inchangés, car $L$ et $E$ n'ont pas changé"
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $\tau=L/R$ et $I_{max}=E/R$ dépendent tous les deux de $R$, pas
          seulement de $L$ et $E$. Changer $R$ change nécessairement les
          deux grandeurs, même si $L$ et $E$ restent fixes.
    correct_feedback: >
      $\tau=L/R$ et $I_{max}=E/R$ sont toutes deux inversement
      proportionnelles à $R$ : doubler $R$ divise chacune par 2.
      Physiquement, la lampe atteindrait un éclat final plus faible, mais
      plus rapidement.
    solution: |
      $\tau=L/R$ : à $L$ fixé, doubler $R$ divise $\tau$ par 2.
      $I_{max}=E/R$ : à $E$ fixé, doubler $R$ divise $I_{max}$ par 2
      également. Les deux grandeurs sont inversement proportionnelles à
      $R$.

  # ──────────────────────────────────────────────────────────────────────
  # RL-19…RL-23 — floor-backfill additions (fresh stems, not memorizable
  # restatements of RL-1…RL-18 or of the R5 past-bac exercise r-bac in
  # exercises.yaml). Close the four models still under the ≥3-item floor
  # after RL-1…RL-18 were tagged: bobine-nature-erronee (2→3),
  # imax-etablissement-mal-compris (1→3), tau-mauvais-groupement (2→3),
  # lecture-tau-erronee (2→3). Correct-choice position is varied
  # (B, A, D, C, D) rather than always A, as in RL-1…RL-18.
  # ──────────────────────────────────────────────────────────────────────

  - id: RL-19
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
    stem: >
      On ouvre brusquement l'interrupteur d'un circuit RL parcouru par un
      courant établi $I_{max}$. On observe souvent une étincelle au niveau
      des contacts de l'interrupteur. Quelle est l'origine physique de ce
      phénomène ?
    type: mcq
    choices:
      - id: A
        text: >-
          La bobine libère d'un seul coup toute l'énergie qu'elle avait stockée sous
          forme de courant, exactement comme le ferait la décharge brutale d'un
          condensateur.
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          C'est de nouveau le modèle « bobine-réservoir », emprunté au
          condensateur. La bobine ne stocke pas de charge à libérer d'un
          coup : c'est la tension $u_L = L\,di/dt$, provoquée par la
          variation brutale de $i$, qui crée l'étincelle — pas une décharge.
      - id: B
        text: >-
          La bobine s'oppose à la disparition brutale du courant : $i$ ne pouvant
          s'annuler instantanément, $di/dt$ devient très grand, donc $u_L = L\,di/dt$
          très élevée — assez pour ioniser l'air.
        correct: true
      - id: C
        text: >-
          Le courant s'annule instantanément dès l'ouverture de l'interrupteur ;
          l'étincelle observée n'a aucun rapport avec cette annulation.
        correct: false
        misconception: mc.physics.pc_dipole_rl.courant-saute-instantane
        feedback: >
          Le courant dans une bobine reste continu, même à l'ouverture : il
          ne peut pas sauter à $0$. C'est justement parce que le circuit
          « refuse » cette continuité (contacts qui s'écartent) que $di/dt$
          devient énorme — et c'est cela, précisément, qui cause l'étincelle.
      - id: D
        text: >-
          C'est un phénomène purement mécanique, dû au frottement des contacts
          métalliques, et sans le moindre lien avec la bobine du circuit.
        correct: false
        misconception: mc.physics.pc_dipole_rl.bobine-nature-erronee
        feedback: >
          Ce phénomène est électrique, pas mécanique : il apparaît
          précisément parce qu'il y a une bobine dans le circuit (un circuit
          purement résistif ne produit pas cette étincelle à l'ouverture). La
          cause est le terme $L\,di/dt$, rendu énorme par la coupure brutale
          du courant.
    correct_feedback: >
      À l'ouverture, le courant établi $I_{max}$ ne peut pas s'annuler
      instantanément : la variation extrêmement brutale de $i$ produit une
      tension $u_L$ très élevée aux bornes de la bobine, suffisante pour
      créer une étincelle aux contacts.
    solution: |
      Avant l'ouverture, $i = I_{max}$. À l'ouverture, le circuit tend à se
      couper quasi instantanément, ce qui imposerait $di/dt$ très grand en
      valeur absolue si $i$ devait s'annuler tout de suite. Or $i$ reste
      continu (bobine) : la tension $u_L = L\,di/dt$ prend alors une valeur
      très élevée, bien supérieure à $E$, ce qui peut ioniser l'air entre les
      contacts de l'interrupteur et produire une étincelle. C'est une
      conséquence directe de l'auto-induction, pas un stockage de charge ni
      un phénomène mécanique.

  - id: RL-20
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
    stem: >
      On remplace la bobine d'un circuit RL par une autre, de même résistance
      interne $r$ mais d'inductance $L$ plus grande, sans changer ni $E$ ni
      $R_0$. Quel est l'effet sur l'établissement du courant $i(t)$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          La durée d'établissement augmente, via $\tau = L/(R_0+r)$, mais la valeur
          finale $I_{max} = E/(R_0+r)$ reste identique : $L$ n'y intervient pas.
        correct: true
      - id: B
        text: >-
          $I_{max}$ augmente elle aussi, puisqu'une bobine plus grosse est capable de
          stocker davantage de courant.
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          En régime permanent $di/dt = 0$, donc le terme en $L$ disparaît de
          l'équation : $I_{max} = E/(R_0+r)$ ne dépend pas de $L$. La bobine
          ne « stocke » pas de courant en réserve ; $L$ fixe seulement la
          durée de l'établissement.
      - id: C
        text: >-
          Cela ne change rigoureusement rien : ni la durée d'établissement du courant,
          ni sa valeur finale.
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          $\tau = L/(R_0+r)$ dépend bien de $L$ : augmenter $L$ à résistance
          totale inchangée augmente $\tau$, donc ralentit l'établissement.
          Seule la valeur finale $I_{max}$, elle, ne dépend pas de $L$.
      - id: D
        text: >-
          Une inductance plus grande accélère l'établissement du courant : celui-ci
          atteint donc plus vite sa valeur finale.
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          C'est l'inverse : $\tau = L/(R_0+r)$ croît avec $L$, donc une
          inductance plus grande ralentit l'établissement, elle ne
          l'accélère jamais. Plus $L$ est grand, plus l'inertie électrique de
          la bobine est forte.
    correct_feedback: >
      $\tau = L/(R_0+r)$ et $I_{max} = E/(R_0+r)$ ont des rôles distincts :
      $L$ ne pèse que sur $\tau$ (la durée), jamais sur $I_{max}$ (la valeur
      finale).
    solution: |
      L'équation différentielle est $L\,di/dt + (R_0+r)\,i = E$. En régime
      permanent, $di/dt=0$, donc $I_{max}=E/(R_0+r)$ : $L$ n'y figure pas.
      En revanche $\tau = L/(R_0+r)$ est directement proportionnelle à $L$ :
      augmenter $L$ (à $R_0$ et $r$ fixés) augmente $\tau$, donc ralentit
      l'établissement, sans changer la valeur finale atteinte.

  - id: RL-21
    rung: "R3"
    difficulty_level: 4
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
    stem: >
      Deux bobines, de même résistance interne $r$ mais d'inductances
      différentes ($L_1 \neq L_2$), sont utilisées tour à tour dans le même
      circuit RL (même $R_0$, même $E$). Une fois le régime permanent atteint
      dans chaque cas, comment se comparent les deux courants finaux
      $I_{max,1}$ et $I_{max,2}$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $I_{max,1} < I_{max,2}$ si $L_1 < L_2$ : une inductance plus
          grande laisse passer davantage de courant en régime permanent.
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $L$ ne fixe pas le courant final : en régime permanent le terme
          $L\,di/dt$ est nul, quelle que soit la valeur de $L$. Les deux
          bobines, ayant la même résistance interne $r$, donnent exactement
          le même $I_{max}$.
      - id: B
        text: >-
          $I_{max,1} > I_{max,2}$ si $L_1 < L_2$ : une bobine de plus petite
          inductance s'oppose moins au passage du courant.
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $L$ ne s'oppose pas au « passage » du courant, seulement à ses
          variations, un effet qui s'annule en régime permanent. Les deux
          $I_{max}$ sont identiques, quelle que soit la valeur de $L_1$ ou
          $L_2$.
      - id: C
        text: >-
          On ne peut pas comparer $I_{max,1}$ et $I_{max,2}$ sans connaître
          les deux constantes de temps $\tau_1$ et $\tau_2$.
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $\tau$ (qui dépend de $L$) règle la durée d'établissement, pas la
          valeur finale : $I_{max}=E/(R_0+r)$ se calcule sans connaître $\tau$
          ni $L$. Les deux grandeurs répondent à des questions différentes.
      - id: D
        text: >-
          Ils sont égaux : $I_{max} = E/(R_0+r)$ ne dépend pas de $L$,
          seulement de $E$ et des résistances, identiques dans les deux cas.
        correct: true
    correct_feedback: >
      La valeur finale $I_{max}$ ne dépend que de $E$ et de la résistance
      totale $R_0+r$ : deux bobines de même $r$ mais de $L$ différentes,
      dans le même circuit, atteignent exactement le même $I_{max}$ — seule
      la durée pour y parvenir diffère.
    solution: |
      En régime permanent, $di/dt=0$ pour les deux bobines, donc l'équation
      $L\,di/dt+(R_0+r)i=E$ se réduit, dans les deux cas, à
      $(R_0+r)I_{max}=E$, soit $I_{max}=E/(R_0+r)$ — une expression qui ne
      contient pas $L$. Avec $R_0$, $r$ et $E$ identiques dans les deux
      circuits, $I_{max,1}=I_{max,2}$, quelles que soient $L_1$ et $L_2$
      (qui ne fixent que $\tau_1 \neq \tau_2$, donc des durées différentes
      pour atteindre ce même $I_{max}$).

  - id: RL-22
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
    stem: >
      On double la force électromotrice $E$ du générateur d'un circuit RL,
      sans changer ni $R$ ni $L$. Comment évoluent $I_{max}$ et $\tau$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\tau$ double aussi, puisque tout est proportionnel à $E$ dans le circuit."
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          $\tau = L/R$ ne contient ni $E$ ni aucune référence à la force
          électromotrice : c'est un rapport entre les caractéristiques du
          circuit ($L$ et $R$), indépendant de la tension appliquée. Doubler
          $E$ ne change donc pas $\tau$.
      - id: B
        text: "$I_{max}$ reste inchangé, car il ne dépend que de $R$ et $L$."
        correct: false
        misconception: mc.physics.pc_dipole_rl.imax-etablissement-mal-compris
        feedback: >
          $I_{max} = E/R$ dépend directement de $E$ : c'est même le
          numérateur de cette expression. Doubler $E$ (à $R$ fixé) double
          nécessairement $I_{max}$ ; $L$, lui, n'intervient pas du tout dans
          $I_{max}$.
      - id: C
        text: >-
          $I_{max}$ double (proportionnel à $E$), mais $\tau = L/R$ reste
          inchangée : $\tau$ ne dépend pas de $E$.
        correct: true
      - id: D
        text: >-
          $I_{max}$ double et $\tau$ double également, car augmenter $E$
          accélère aussi l'établissement du courant.
        correct: false
        misconception: mc.physics.pc_dipole_rl.tau-mauvais-groupement
        feedback: >
          La valeur de $I_{max}$ est bien doublée, mais $\tau=L/R$ n'en
          dépend pas : la vitesse relative d'établissement (réglée par
          $\tau$) est la même, seule l'amplitude finale change. Augmenter
          $E$ ne « pousse » pas plus vite vers $I_{max}$ en proportion, il
          déplace seulement la cible.
    correct_feedback: >
      $I_{max}=E/R$ est proportionnel à $E$ : le doubler double $I_{max}$.
      $\tau=L/R$, en revanche, ne dépend que de $L$ et $R$ : elle reste
      rigoureusement inchangée.
    solution: |
      $I_{max}=E/R$ : à $R$ fixé, doubler $E$ double $I_{max}$.
      $\tau=L/R$ : cette expression ne fait intervenir ni $E$ ni la force
      électromotrice sous quelque forme que ce soit ; à $L$ et $R$ fixés,
      $\tau$ reste rigoureusement identique. $E$ fixe l'échelle du courant
      final, pas la vitesse relative à laquelle on l'atteint.

  - id: RL-23
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_dipole_rl
    tags: []
    primary_misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
    stem: >
      Un système d'acquisition enregistre, en plus de $i(t)$, la tension
      $u_L(t)$ aux bornes de la bobine : elle décroît de $E$ (à $t=0^+$)
      vers son palier final $rI_{max}$. Un élève affirme : « $\tau$, c'est
      l'instant où $u_L(t)$ atteint son palier final $rI_{max}$, car c'est
      là que la bobine a fini de s'opposer au courant. » Cette affirmation
      est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui, c'est exactement la définition de $\tau$ : l'instant précis où le régime
          permanent se trouve atteint dans le circuit.
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          Non : le régime permanent n'est jamais atteint exactement en un
          temps fini, il n'est que pratiquement atteint vers $5\tau$. À
          $t=\tau$, $u_L$ n'a parcouru que $63\%$ de la descente vers son
          palier, elle ne l'a pas encore rejoint.
      - id: B
        text: >-
          Oui, mais seulement si l'on regarde la courbe $i(t)$ et non celle de $u_L(t)$
          : les deux n'ont pas la même constante de temps.
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          $\tau$ est une propriété du circuit ($\tau=L/R$), pas de la courbe
          qu'on choisit de lire : elle est la même qu'on la retrouve sur
          $i(t)$ ou sur $u_L(t)$. Et, dans les deux cas, ce n'est pas
          l'instant où le palier final est atteint.
      - id: C
        text: >-
          Non, l'affirmation est fausse : $\tau$ ne peut se lire que sur la courbe
          $i(t)$, et jamais sur celle de $u_L(t)$.
        correct: false
        misconception: mc.physics.pc_dipole_rl.lecture-tau-erronee
        feedback: >
          $\tau$ peut se lire sur $u_L(t)$ tout comme sur $i(t)$ (méthode des
          $63\%$ ou tangente à l'origine, appliquées à la courbe choisie) : ce
          qui est faux dans l'affirmation, ce n'est pas le choix de la
          courbe, c'est d'y placer $\tau$ à l'instant du palier final.
      - id: D
        text: >-
          Non : à $t=\tau$, $u_L$ n'a parcouru que $63\%$ du chemin entre $E$ et
          $rI_{max}$ ; $\tau$ est une échelle de temps caractéristique, pas l'instant du
          régime permanent.
        correct: true
    correct_feedback: >
      $\tau$ est une échelle de temps caractéristique du circuit, la même sur
      $i(t)$ que sur $u_L(t)$ — jamais l'instant où l'une ou l'autre courbe
      atteint effectivement son palier final.
    solution: |
      $u_L(t) = E - (R_0+r)\,i(t) = E - RI_{max}(1-e^{-t/\tau}) =
      rI_{max} + (E-rI_{max})e^{-t/\tau}$ (avec $R=R_0+r$) décroît
      exponentiellement de $E$ vers $rI_{max}$, avec la même constante de
      temps $\tau=L/R$ que $i(t)$. À $t=\tau$, l'écart restant à $rI_{max}$
      vaut $(E-rI_{max})e^{-1}\approx 37\%$ de l'écart initial : $u_L$ a donc
      parcouru $63\%$ du chemin, pas $100\%$. Le palier n'est que
      pratiquement atteint vers $5\tau$, quelle que soit la courbe lue.

