notion: piles
skill_code: pc_piles
misconceptions: []

items:

  # ── confondre anode/cathode et borne +/- (canonique) ────────────────────────
  - id: PILES-1
    rung: "R3"
    difficulty_level: 2
    skill_code: pc_piles
    tags: []
    stem: >
      Dans une pile Daniell en fonctionnement, l'électrode de zinc est le
      siège de l'oxydation ($Zn \to Zn^{2+} + 2e^-$) et l'électrode de cuivre
      est le siège de la réduction ($Cu^{2+} + 2e^- \to Cu$). Quel est le nom
      de l'électrode de cuivre, et quelle est sa polarité ?
    type: mcq
    choices:
      - id: A
        text: "C'est la cathode, borne +."
        correct: true
      - id: B
        text: "C'est la cathode, borne -."
        correct: false
        feedback: >
          Le nom est juste (la réduction se produit bien à la cathode), mais
          la polarité est inversée. La réduction CONSOMME des électrons :
          l'électrode qui s'en appauvrit devient relativement plus positive,
          pas plus négative. Le mot « réduction » évoque une diminution, ce
          qui pousse à tort vers « négatif » - mais c'est le sens réel de
          circulation des électrons qui fixe le signe, pas la sonorité du mot.
      - id: C
        text: "C'est l'anode, borne +."
        correct: false
        feedback: >
          L'anode est par définition l'électrode où se produit l'OXYDATION -
          or c'est ici le zinc, pas le cuivre, qui s'oxyde. L'électrode de
          cuivre, siège de la réduction, s'appelle la cathode, pas l'anode.
      - id: D
        text: "C'est l'anode, borne -."
        correct: false
        feedback: >
          Double confusion : d'une part le nom (l'anode est le siège de
          l'oxydation, qui a lieu ici au zinc, pas au cuivre), d'autre part la
          polarité (une anode, quand il s'agit bien de l'électrode
          d'oxydation, est la borne -, jamais la borne +). L'électrode de
          cuivre est la cathode, borne +.
    correct_feedback: >
      L'électrode où se produit la réduction s'appelle la cathode. Comme la
      réduction consomme des électrons, cette électrode s'appauvrit en
      électrons et devient, relativement, la borne + de la pile.
    solution: |
      **Nommer l'électrode :** la réduction ($Cu^{2+}+2e^- \to Cu$) se produit
      à l'électrode de cuivre - par définition, l'électrode où a lieu la
      réduction s'appelle la **cathode**.

      **Trouver la polarité :** la réduction consomme des électrons, elle en
      tire hors du métal. L'électrode s'appauvrit en électrons, donc elle
      devient, par rapport au reste du circuit, relativement chargée
      positivement : c'est la **borne +**.

      **Conclusion :** l'électrode de cuivre est la cathode, borne +.

  # ── confondre anode/cathode et borne +/- (variant, sens inverse : polarité → mécanisme) ──
  - id: PILES-2
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Sur une pile en fonctionnement, un voltmètre indique que l'électrode A
      est la borne négative. Que peut-on en conclure sur ce qui se produit
      à cette électrode ?
    type: mcq
    choices:
      - id: A
        text: "C'est le siège de l'oxydation : c'est l'anode."
        correct: true
      - id: B
        text: "C'est le siège de la réduction : c'est la cathode."
        correct: false
        feedback: >
          C'est l'inverse : la cathode (siège de la réduction) est toujours
          la borne +, jamais la borne -, parce que la réduction consomme des
          électrons et appauvrit l'électrode, la rendant relativement plus
          positive. Une borne négative signale une électrode qui ACCUMULE des
          électrons, donc une oxydation.
      - id: C
        text: "On ne peut rien conclure sans connaître la nature chimique de l'électrode."
        correct: false
        feedback: >
          Le lien entre polarité et mécanisme (oxydation/réduction) ne dépend
          pas de la nature chimique de l'électrode : il découle uniquement du
          sens de circulation des électrons. Une borne - accumule des
          électrons - c'est nécessairement une oxydation, quelle que soit
          l'espèce chimique en jeu.
      - id: D
        text: "C'est forcément l'électrode de zinc, car le zinc est toujours l'anode."
        correct: false
        feedback: >
          Rien n'impose que ce soit spécifiquement du zinc : ce qui identifie
          l'anode, c'est le mécanisme (oxydation, électrons en excès), pas une
          liste de métaux à mémoriser. Le zinc est l'anode dans la pile
          Daniell parce que le calcul de $Q_{r,i}$ face à $K$ (rung 2) impose
          ce sens-là pour CE couple précis - pas parce que « le zinc est
          toujours l'anode » par principe.
    correct_feedback: >
      Une borne - accumule des électrons en excès : c'est la signature de
      l'oxydation. L'électrode où se produit l'oxydation s'appelle l'anode.
    solution: |
      Une électrode négative est, par définition électrique, une électrode où
      les électrons s'accumulent avant de partir dans le circuit extérieur.
      Or seule l'oxydation LIBÈRE des électrons dans le métal - la réduction,
      elle, en consomme. Une borne - est donc nécessairement le siège d'une
      oxydation, c'est-à-dire l'anode.

  # ── sens des électrons vs sens du courant (canonique) ───────────────────────
  - id: PILES-3
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_piles
    tags: []
    stem: >
      Dans le circuit extérieur d'une pile en fonctionnement, les électrons
      circulent de la borne - vers la borne +. Dans quel sens circule le
      courant électrique conventionnel, dans ce même circuit extérieur ?
    type: mcq
    choices:
      - id: A
        text: "De la borne + vers la borne -."
        correct: true
      - id: B
        text: "De la borne - vers la borne +, dans le même sens que les électrons."
        correct: false
        feedback: >
          Le courant électrique conventionnel a été défini, par convention
          historique, comme le sens de déplacement de charges POSITIVES.
          Les électrons, porteurs réels du courant dans un fil, sont des
          charges négatives : leur déplacement équivaut à un déplacement de
          charges positives en sens INVERSE. Le courant et les électrons
          circulent donc en sens opposés, jamais dans le même sens.
      - id: C
        text: "Il n'y a pas de courant électrique conventionnel, seulement un déplacement d'électrons."
        correct: false
        feedback: >
          Le courant conventionnel est une description valide et utilisée en
          permanence (c'est ce qu'affiche un ampèremètre, c'est le sens
          indiqué sur tous les schémas de circuit) : ce n'est pas une fiction
          à écarter, c'est une convention de signe, fixée avant la découverte
          de l'électron, qui coexiste avec le déplacement réel des électrons.
      - id: D
        text: "Le sens du courant dépend de la nature chimique des électrodes utilisées."
        correct: false
        feedback: >
          Le sens du courant conventionnel n'a rien à voir avec la nature
          chimique des électrodes : c'est une pure convention électrique
          (sens des charges positives), toujours opposée au sens réel des
          électrons, quel que soit le couple oxydant/réducteur utilisé dans
          la pile.
    correct_feedback: >
      Le courant conventionnel est défini en sens inverse du déplacement réel
      des électrons (qui sont des charges négatives) : dans le circuit
      extérieur, il va donc de + vers -.
    solution: |
      Les électrons vont de - vers + dans le circuit extérieur (donnée de
      l'énoncé). Le courant conventionnel est, par construction historique,
      toujours défini en sens inverse du déplacement réel des porteurs de
      charge négatifs. Il circule donc de + vers -, dans ce même circuit
      extérieur.

  # ── sens des électrons vs sens du courant (variant, sens inverse : courant → électrons) ──
  - id: PILES-4
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Sur le schéma d'une pile Daniell en fonctionnement, un courant
      électrique circule, dans le circuit extérieur, de l'électrode de cuivre
      (cathode) vers l'électrode de zinc (anode). Dans ce même circuit
      extérieur, dans quel sens se déplacent réellement les électrons ?
    type: mcq
    choices:
      - id: A
        text: "De l'anode (zinc) vers la cathode (cuivre) - donc en sens inverse du courant."
        correct: true
      - id: B
        text: "De la cathode (cuivre) vers l'anode (zinc) - le même sens que le courant."
        correct: false
        feedback: >
          Le courant conventionnel et le déplacement réel des électrons sont
          toujours en sens opposés dans un circuit, quelle que soit la pile
          considérée. Si le courant va de la cathode vers l'anode, les
          électrons, eux, vont nécessairement de l'anode vers la cathode.
      - id: C
        text: "Les électrons ne se déplacent pas dans le circuit extérieur ; seuls les ions se déplacent en solution."
        correct: false
        feedback: >
          C'est l'inverse qui décrit le circuit : les ÉLECTRONS circulent
          dans le fil du circuit extérieur (produits par l'oxydation à
          l'anode, consommés par la réduction à la cathode) ; ce sont les
          IONS qui assurent, eux, la conduction à l'intérieur des solutions
          et du pont salin, pas dans le fil.
      - id: D
        text: "Dans les deux sens à la fois, en alternance."
        correct: false
        feedback: >
          Une pile délivre un courant continu, dans un seul sens, tant que la
          réaction évolue spontanément dans le même sens (celui fixé par la
          comparaison entre $Q_{r,i}$ et $K$). Il n'y a pas d'alternance ici -
          ce comportement caractériserait un courant alternatif, pas celui
          d'une pile.
    correct_feedback: >
      Le courant conventionnel et les électrons circulent toujours en sens
      opposés dans le circuit extérieur : si le courant va de la cathode vers
      l'anode, les électrons vont de l'anode vers la cathode.
    solution: |
      Donnée : le courant va de la cathode (cuivre) vers l'anode (zinc) dans
      le circuit extérieur. Le courant conventionnel est, par construction,
      toujours en sens inverse du déplacement réel des électrons. Les
      électrons circulent donc en sens inverse du courant : de l'anode
      (zinc) vers la cathode (cuivre) - cohérent avec le mécanisme de la
      pile, puisque c'est bien à l'anode que l'oxydation les produit.

  # ── croire que la pile ne s'use pas (canonique, calcul Q = IΔt = n(e-)F) ────
  - id: PILES-5
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Une pile Daniell débite un courant $I = 100\ \text{mA}$ pendant
      $\Delta t = 1\ \text{h}\ 00$ ($=3600\ \text{s}$). On donne
      $F \approx 9{,}65\times10^{4}\ \text{C/mol}$. Quelle affirmation est
      correcte ?
    type: mcq
    choices:
      - id: A
        text: "$Q = I\\,\\Delta t = 360\\ \\text{C}$, ce qui correspond à $n(e^-)=Q/F\\approx 3{,}7\\times10^{-3}\\ \\text{mol}$ d'électrons échangés - donc à une quantité limitée de zinc consommé."
        correct: true
      - id: B
        text: "La pile peut fonctionner indéfiniment tant qu'on la laisse branchée, car la réaction chimique se recrée en permanence."
        correct: false
        feedback: >
          Chaque coulomb débité correspond, par $Q = n(e^-)\,F$, à une
          quantité précise et irréversible de zinc oxydé à l'anode. La lame
          de zinc contient une masse FINIE de métal, qui ne se régénère pas :
          une pile n'est pas une source d'énergie illimitée, c'est un
          réservoir fini d'énergie chimique.
      - id: C
        text: "$Q = I / \\Delta t = 100/3600 \\approx 0{,}028\\ \\text{C}$"
        correct: false
        feedback: >
          La quantité d'électricité se calcule par un PRODUIT, $Q = I\,\Delta
          t$ (un débit multiplié par une durée donne une quantité totale), pas
          par un quotient. De plus, $I$ doit être converti en ampères
          ($100\ \text{mA} = 0{,}100\ \text{A}$) avant le calcul.
      - id: D
        text: "La quantité d'électricité débitée ne dépend pas de la durée de fonctionnement, seulement du courant."
        correct: false
        feedback: >
          $Q = I\,\Delta t$ dépend explicitement des deux grandeurs : à
          courant $I$ fixé, une durée $\Delta t$ deux fois plus longue
          débite deux fois plus de charge. Ignorer $\Delta t$ revient à
          confondre un débit (le courant) avec une quantité accumulée (la
          charge).
    correct_feedback: >
      $Q = I\,\Delta t = 0{,}100 \times 3600 = 360\ \text{C}$, donc
      $n(e^-)=Q/F\approx 3{,}7\times10^{-3}\ \text{mol}$ d'électrons échangés -
      une quantité de matière bien précise et finie, qui correspond à une
      masse de zinc consommée elle aussi finie.
    solution: |
      **Quantité d'électricité :**
      $$Q = I\,\Delta t = 0{,}100 \times 3600 = 360\ \text{C}$$

      **Quantité de matière d'électrons échangés :**
      $$n(e^-) = \frac{Q}{F} = \frac{360}{9{,}65\times10^{4}} \approx 3{,}7\times10^{-3}\ \text{mol}$$

      Cette quantité d'électrons correspond, via la demi-équation
      $Zn \to Zn^{2+}+2e^-$, à une quantité de matière de zinc bien précise
      et non renouvelable : la pile consomme réellement son réactif, elle ne
      le régénère pas.

  # ── croire que la pile ne s'use pas (variant, lien Q_r,i → K) ───────────────
  - id: PILES-6
    rung: "R6"
    difficulty_level: 2
    skill_code: pc_piles
    tags: []
    stem: >
      Au fur et à mesure qu'une pile Daniell fonctionne, la concentration en
      $Zn^{2+}$ augmente et celle en $Cu^{2+}$ diminue dans les deux
      demi-piles. Comment évolue $Q_{r,i} = [Zn^{2+}]/[Cu^{2+}]$ au cours du
      temps, et que se passe-t-il quand $Q_{r,i}$ se rapproche de $K$ ?
    type: mcq
    choices:
      - id: A
        text: "$Q_{r,i}$ augmente progressivement ; quand il se rapproche de $K$, la f.é.m. de la pile s'effondre et elle cesse de débiter un courant utile."
        correct: true
      - id: B
        text: "$Q_{r,i}$ diminue progressivement ; la pile devient de plus en plus performante avec le temps."
        correct: false
        feedback: >
          Le numérateur $[Zn^{2+}]$ augmente et le dénominateur $[Cu^{2+}]$
          diminue : un rapport dont le numérateur grandit et le dénominateur
          rétrécit ne peut qu'AUGMENTER, jamais diminuer. Une pile ne devient
          jamais plus performante avec le temps - elle s'affaiblit.
      - id: C
        text: "$Q_{r,i}$ reste constant tant que la pile fonctionne : seule sa valeur à l'équilibre compte."
        correct: false
        feedback: >
          $Q_{r,i}$ se recalcule à chaque instant à partir des concentrations
          présentes, et celles-ci changent en permanence tant que la pile
          débite du courant (c'est justement ce courant qui traduit la
          réaction en cours). $Q_{r,i}$ ne peut donc pas rester constant
          pendant le fonctionnement.
      - id: D
        text: "La pile continue à fonctionner à la même intensité indéfiniment ; $Q_{r,i}$ n'a aucun rapport avec son fonctionnement au cours du temps."
        correct: false
        feedback: >
          C'est au contraire $Q_{r,i}$ qui explique pourquoi l'intensité
          disponible chute avec le temps : la f.é.m. de la pile est liée à
          l'écart entre $Q_{r,i}$ et $K$, et cet écart se réduit à mesure que
          $Q_{r,i}$ grimpe vers $K$. Une pile ne fonctionne jamais
          indéfiniment à intensité constante.
    correct_feedback: >
      $Q_{r,i}$ ne peut qu'augmenter ici (numérateur qui grandit, dénominateur
      qui rétrécit). En se rapprochant de $K$, il réduit l'écart qui alimente
      la f.é.m. de la pile : elle s'affaiblit, jusqu'à ne plus pouvoir
      débiter de courant utile - c'est l'usure de la pile.
    solution: |
      $[Zn^{2+}]$ grandit, $[Cu^{2+}]$ rétrécit : leur rapport
      $Q_{r,i}=[Zn^{2+}]/[Cu^{2+}]$ ne peut donc qu'augmenter au cours du
      fonctionnement de la pile. Comme la f.é.m. de la pile traduit
      électriquement l'écart entre $Q_{r,i}$ et $K$ (rung 5), cet écart qui
      se réduit progressivement fait chuter la tension disponible - jusqu'à
      ce que la pile ne puisse plus débiter de courant utile dans un circuit
      extérieur. C'est exactement la même mécanique que l'évolution vers
      l'équilibre étudiée dans le chapitre sur l'état d'équilibre, appliquée
      ici au fonctionnement d'une pile.
