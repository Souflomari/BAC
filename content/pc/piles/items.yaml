      solution de zinc s'enrichit en charges positives ($Zn^{2+}$ produit)
      tandis que celle de cuivre s'en appauvrit ($Cu^{2+}$ consommé) - ce
      déséquilibre électrique freine puis bloque très vite la réaction
      elle-même, donc le courant.

  # ── définition de la demi-pile : croire que l'électrode solide est superflue (R1) ──
  - id: PILES-11
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_piles
    tags: []
    stem: >
      Un élève veut construire une demi-pile $Zn^{2+}/Zn$. Il verse une
      solution de sulfate de zinc dans un bécher, mais n'y plonge aucune
      lame de zinc métallique, pensant qu'une demi-pile n'a besoin que des
      ions dissous du couple. Que penser de cette démarche ?
    type: mcq
    choices:
      - id: A
        text: "Elle est incomplète : une demi-pile associe toujours les deux formes du couple - ici, la forme oxydée $Zn^{2+}$ en solution ET la forme réduite $Zn$ sous forme d'électrode solide, qui échange les électrons avec le circuit extérieur."
        correct: true
      - id: B
        text: "Elle est suffisante : seuls les ions dissous du couple comptent pour une demi-pile, l'électrode solide ne jouant qu'un rôle de support mécanique, sans la moindre importance électrique dans le montage."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
        feedback: >
          L'électrode solide n'est pas un simple support : c'est elle qui
          échange réellement les électrons avec le circuit extérieur (elle
          s'oxyde ou se réduit). Sans elle, aucun échange d'électrons n'est
          possible avec le fil - la demi-pile ne peut pas fonctionner.
      - id: C
        text: "Elle est incomplète, mais il faudrait y plonger une lame de cuivre et non de zinc, pour que les électrons échangés avec le circuit extérieur soient bien ceux du cuivre métallique."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
        feedback: >
          Chaque demi-pile est associée à un seul couple oxydant/réducteur
          : l'électrode doit être la forme réduite de CE couple, donc du
          zinc métallique pour la demi-pile $Zn^{2+}/Zn$ - pas du cuivre,
          qui appartient à l'autre couple, dans l'autre demi-pile.
      - id: D
        text: "Elle est incomplète, il faudrait plonger à la fois une lame de zinc ET une lame de cuivre dans ce même bécher pour obtenir une demi-pile complète."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
        feedback: >
          Une demi-pile ne contient qu'un seul couple oxydant/réducteur,
          donc une seule électrode (ici, le zinc). Réunir deux métaux
          différents dans un même bécher reviendrait à mélanger les deux
          demi-piles - ce n'est plus le montage à détour forcé étudié dans
          cette leçon.
    correct_feedback: >
      Une demi-pile associe toujours les deux formes du même couple : les
      ions $Zn^{2+}$ en solution ET l'électrode de zinc métallique, seule
      capable d'échanger des électrons avec le circuit extérieur.
    solution: |
      Une demi-pile n'est pas réduite à la solution : elle associe la
      solution contenant la forme oxydée du couple (ici $Zn^{2+}$) et une
      électrode constituée de la forme réduite (ici le zinc métallique).
      C'est l'électrode, et elle seule, qui peut céder ou capter des
      électrons vers le fil du circuit extérieur - sans elle, aucun échange
      électronique n'est possible.

  # ── construction du montage : inverser l'électrode et sa propre solution (R1) ──
  - id: PILES-12
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Pour construire la pile Daniell, un élève place la lame de zinc dans
      le bécher contenant la solution de sulfate de CUIVRE, et la lame de
      cuivre dans le bécher contenant la solution de sulfate de ZINC, en
      pensant que « c'est là que la réaction
