      - id: D
        text: "Le courant s'inverse de sens, car le déséquilibre de charges impose à la réaction de repartir dans le sens inverse ($Cu \\rightarrow Cu^{2+}+2e^-$ et $Zn^{2+}+2e^- \\rightarrow Zn$), et l'ampèremètre dévie de l'autre côté."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
