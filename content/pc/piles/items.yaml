    solution: |
      Le principe du chapitre 2 est de séparer physiquement les deux espèces
      qui échangent des électrons, chacune dans sa propre demi-pile (couple
      + électrode). Plonger le zinc dans la solution de $Cu^{2+}$ recrée
      exactement le contact direct de l'accroche : les électrons sautent
      localement, sans passer par le fil. Le bon montage place le zinc
      dans une solution de $Zn^{2+}$ et le cuivre dans une solution de
      $Cu^{2+}$, chacun dans son propre bécher.

  # ── exclure les solides de Qr : intégrer la masse des électrodes (R2) ───────
  - id: PILES-13
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Pour la pile Daniell ($Zn + Cu^{2+} \rightarrow Zn^{2+} + Cu$), un
      élève écrit le quotient de réaction en y intégrant les deux
      électrodes métalliques : $Q_{r,i} = \dfrac{[Zn^{2+}]_i \times
      m_{Zn}}{[Cu^{2+}]_i \times m_{Cu}}$, avec $m_{Zn}$ et $m_{Cu}$ les
      masses des deux lames. Que penser de cette expression ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : le zinc et le cuivre métalliques sont des solides purs, qui n'entrent jamais dans l'expression de $Q_r$ - l'expression correcte, pour prédire quelle électrode va céder ses électrons, est $Q_{r,i} = [Zn^{2+}]_i / [Cu^{2+}]_i$, sans les masses des lames."
        correct: true
      - id: B
        text: "Elle est correcte : la masse de chaque électrode influence directement le sens dans lequel la pile va évoluer, une lame plus massive « poussant » davantage la réaction dans son propre sens, comme le ferait une concentration plus élevée."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          La masse des électrodes solides n'entre jamais dans $Q_r$ ni
          dans le critère de spontanéité : seules les concentrations des
          espèces dissoutes ($Zn^{2+}$, $Cu^{2+}$) comptent. Une lame plus
          massive dure simplement plus longtemps avant de s'épuiser (chapitre
            7), elle n'influence pas le sens de la réaction.
      - id: C
        text: "Elle est fausse, mais uniquement dans l'ordre : il faudrait écrire $Q_{r,i} = \\dfrac{m_{Cu}\\times[Cu^{2+}]_i}{m_{Zn}\\times[Zn^{2+}]_i}$, en plaçant les produits au numérateur."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          Peu importe l'ordre : les masses des solides purs ($Zn$, $Cu$)
          n'ont pas leur place dans $Q_r$, quelle que soit la façon de les
          combiner aux concentrations.
      - id: D
        text: "Elle est fausse, il manque aussi les volumes des deux solutions dans l'expression, en plus des masses des lames métalliques plongées dans chacun des béchers."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          $Q_r$ se construit uniquement à partir des concentrations
          molaires des espèces dissoutes, qui intègrent déjà implicitement
          les volumes des solutions : il n'y a ni volume séparé, ni masse
          de solide à ajouter dans son expression.
    correct_feedback: >
      Un solide pur (ici, le zinc et le cuivre métalliques) n'entre jamais
      dans $Q_r$ : seules les concentrations des espèces dissoutes
      comptent.
    solution: |
      Règle vue au chapitre sur l'évolution spontanée, appliquée ici à la
      pile : un solide pur n'entre jamais dans l'expression de $Q_r$.
      Seules les espèces dissoutes, $Zn^{2+}$ et $Cu^{2+}$, y figurent :
      $Q_{r,i} = [Zn^{2+}]_i / [Cu^{2+}]_i$. Les masses des électrodes
      n'ont aucun rôle dans le sens de la réaction ; elles déterminent
      seulement combien de temps la pile pourra fonctionner (chapitre 7).

  # ── comparer Qr,i à K : juger « grand »/« petit » sans comparer à K (R2) ────
  - id: PILES-14
    rung: "R2"
    difficulty_level: 4
    skill_code: pc_piles
    tags: []
    stem: >
      On construit une pile avec, initialement, $[Zn^{2+}]_i = 2{,}0\
      \text{mol/L}$ (très concentrée) et $[Cu^{2+}]_i = 1{,}0\times10^{-5}\
      \text{mol/L}$ (trace). On donne $K \approx 1{,}8\times10^{37}$ pour
      la réaction $Zn + Cu^{2+} \rightleftharpoons Zn^{2+} + Cu$. Quelle
      électrode s'oxyde dans ce cas précis ?
    type: mcq
    choices:
      - id: A
        text: "$Q_{r,i} = [Zn^{2+}]_i/[Cu^{2+}]_i = 2{,}0\\times10^{5} \\ll K$ : le système évolue quand même dans le sens direct, le zinc s'oxyde toujours - même avec ces concentrations extrêmes, l'écart à $K$ reste énorme (32 ordres de grandeur)."
        correct: true
      - id: B
        text: "Puisque $[Zn^{2+}]_i$ est très supérieure à $[Cu^{2+}]_i$, c'est le cuivre qui s'oxyde ici : il y a déjà « trop » de $Zn^{2+}$ dans le mélange pour que le zinc puisse continuer à s'oxyder."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          Ce n'est pas la comparaison entre les deux concentrations
          elles-mêmes qui tranche, mais la comparaison de leur RAPPORT
          $Q_{r,i}$ à $K$. Ici $Q_{r,i} = 2{,}0\times10^5$ reste des
          dizaines d'ordres de grandeur plus petit que
          $K \approx 1{,}8\times10^{37}$ : malgré une concentration
          élevée en $Zn^{2+}$, le système évolue toujours dans le sens
          direct.
      - id: C
        text: "$Q_{r,i} = 2{,}0\\times10^{5}$ est une valeur très grande, donc $Q_{r,i} > K$ : le système évolue dans le sens inverse, c'est le cuivre qui s'oxyde."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          $2{,}0\times10^{5}$ n'est « grand » qu'en apparence : comparé à
          $K \approx 1{,}8\times10^{37}$, il lui reste 32 ordres de
          grandeur d'écart, donc $Q_{r,i}$ est en réalité bien plus PETIT
          que $K$. Juger « grand » ou « petit » dans l'absolu, sans
          comparer effectivement à $K$, mène droit à l'erreur.
      - id: D
        text: "Le système est déjà à l'équilibre, puisque les deux espèces $Zn^{2+}$ et $Cu^{2+}$ sont présentes simultanément dans les deux demi-piles."
        correct: false
        misconception: mc.physics.pc_piles.qr-evolution-equilibre
        feedback: >
          La simple présence des deux espèces ne signifie pas l'équilibre
          : l'équilibre correspond précisément à $Q_{r,i}=K$, une égalité
          numérique précise, pas à la coexistence des espèces. Ici
          $Q_{r,i}=2{,}0\times10^5$ est très loin de
          $K\approx1{,}8\times10^{37}$ : le système est loin de
          l'équilibre.
    correct_feedback: >
      Même avec un excès de $Zn^{2+}$, $Q_{r,i}$ reste écrasé par un $K$
      encore bien plus grand : le sens direct l'emporte, le zinc s'oxyde
      toujours.
    solution: |
      $$
      Q_{r,i} = \frac{[Zn^{2+}]_i}{[Cu^{2+}]_i} =
      \frac{2{,}0}{1{,}0\times10^{-5}} = 2{,}0\times10^{5}
      $$
      Comparé à $K \approx 1{,}8\times10^{37}$, cette valeur reste encore
      32 ordres de grandeur plus petite : $Q_{r,i} \ll K$, donc le système
      évolue dans le sens direct, quelle que soit l'impression donnée par
      la valeur « élevée » en apparence de $[Zn^{2+}]_i$. Le zinc s'oxyde,
      les ions $Cu^{2+}$ se réduisent.

  # ── construire Qr : inverser produit et réactif au numérateur/dénominateur (R2) ──
  - id: PILES-15
    rung: "R2"
    difficulty_level: 4
    skill_code: pc_piles
    tags: []
    stem: >
      Pour prédire quelle électrode s'oxyde dans une pile Daniell avec
      $[Zn^{2+}]_i = 1{,}0\times10^{-3}\ \text{mol/L}$ et $[Cu^{2+}]_i =
      2{,}0\times10^{-1}\ \text{mol/L}$ ($K\approx1{,}8\times10^{37}$), un
      élève calcule $Q_{r,i} = [Cu^{2+}]_i/[Zn^{2+}]_i = 200$, puis
      conclut : « $Q_{r,i}=200 \ll K$, donc le zinc s'oxyde ». Que penser
      de ce raisonnement ?
    type: mcq
    choices:
      - id: A
        text: "Il contient une erreur d'expression qui, ici, ne change pas la conclusion : $Q_r$ vaut $[Zn^{2+}]/[Cu^{2+}]$ (produit sur réactif), pas l'inverse - avec la bonne expression, $Q_{r,i}=5{,}0\\times10^{-3} \\ll K$, donc le zinc s'oxyde bien."
        correct: true
      - id: B
        text: "Il est parfaitement correct : peu importe que $Q_r$ soit écrit $[Zn^{2+}]/[Cu^{2+}]$ ou son inverse, tant qu'on le compare à la même valeur de $K$, la conclusion tirée reste valable dans tous les cas."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          $Q_r$ a une définition fixe : produits (ici $Zn^{2+}$) au
          numérateur, réactifs (ici $Cu^{2+}$) au dénominateur, d'après
          l'équation telle qu'elle est écrite. Inverser change la valeur
          numérique de $Q_r$ (ici $200$ contre $5{,}0\times10^{-3}$) : la
          comparaison à $K$ n'est valable qu'avec la bonne expression,
          même si dans ce cas précis les deux versions mènent par
          coïncidence à la même conclusion, à cause de l'écart énorme
          entre $Q_r$ et $K$ dans les deux cas.
      - id: C
        text: "Il est faux, et avec la bonne expression, la conclusion s'inverse : c'est en réalité le cuivre qui s'oxyderait."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          Avec l'expression correcte,
          $Q_{r,i}=[Zn^{2+}]_i/[Cu^{2+}]_i=5{,}0\times10^{-3}$, qui reste
          très inférieur à $K\approx1{,}8\times10^{37}$ : le sens reste
          direct, le zinc s'oxyde bien. L'erreur d'expression, ici, ne
          change donc pas la conclusion finale (à cause de l'écart énorme
          à $K$), mais le raisonnement intermédiaire restait faux.
      - id: D
        text: "Il est faux, mais uniquement parce que les concentrations n'ont pas été converties dans la bonne unité avant le calcul."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          Les concentrations sont bien données en mol/L, l'unité attendue
          - il n'y a pas d'erreur d'unité ici. L'erreur porte sur
          l'expression même de $Q_r$ : les produits ($Zn^{2+}$) doivent
          être au numérateur, les réactifs ($Cu^{2+}$) au dénominateur,
          pas l'inverse.
    correct_feedback: >
      L'expression utilisée est inversée (réactif au numérateur, produit
      au dénominateur) : la bonne expression donne
      $Q_{r,i}=5{,}0\times10^{-3}$, toujours très inférieur à $K$ - la
      conclusion finale reste juste par coïncidence, pas le raisonnement.
    solution: |
      $Q_r$ se construit toujours produits au numérateur, réactifs au
      dénominateur : ici, $Q_{r,i} = [Zn^{2+}]_i/[Cu^{2+}]_i =
      \frac{1{,}0\times10^{-3}}{2{,}0\times10^{-1}} = 5{,}0\times10^{-3}$,
      pas $[Cu^{2+}]_i/[Zn^{2+}]_i = 200$ comme calculé par l'élève. Les
      deux valeurs restent, par un pur hasard lié à l'écart énorme entre
      $Q_r$ et $K$ pour cette réaction, très inférieures à
      $K\approx1{,}8\times10^{37}$ : la conclusion qualitative (sens
      direct, zinc oxydé) reste donc juste, mais uniquement par
      coïncidence - l'expression de $Q_r$ utilisée par l'élève était bien
      fausse.

  # ── confondre anode/cathode et borne +/- (variant 2, piège « réduction=négatif ») ──
  - id: PILES-16
    rung: "R3"
    difficulty_level: 4
    skill_code: pc_piles
    tags: []
    stem: >
      On construit une pile avec les couples $Ag^+/Ag$ et $Fe^{2+}/Fe$.
      Sachant que, pour cette pile, l'électrode d'argent est le siège de la
      réduction ($Ag^+ + e^- \rightleftharpoons Ag$) et l'électrode de fer
      le siège de l'oxydation ($Fe \rightleftharpoons Fe^{2+}+2e^-$),
      quelle est la polarité de l'électrode de fer ?
    type: mcq
    choices:
      - id: A
        text: "C'est l'anode, borne -, siège de l'oxydation du fer : c'est là que les électrons sont produits."
        correct: true
      - id: B
        text: "C'est l'anode, borne +, car l'oxydation, contrairement à la réduction, serait associée à une électrode positive."
        correct: false
        misconception: mc.physics.pc_piles.anode-cathode-polarite
        feedback: >
          C'est l'inverse. L'oxydation LIBÈRE des électrons dans le métal
          - ils s'y accumulent, ce qui rend l'électrode relativement plus
          négative, pas plus positive. L'impression que « oxydation »
          sonne plus « actif » donc « positif » ne reflète pas le
          mécanisme réel des électrons.
      - id: C
        text: "C'est la cathode, borne -, car le terme « cathode » évoquerait, par sa sonorité, le siège où les électrons sont produits en excès."
        correct: false
        misconception: mc.physics.pc_piles.anode-cathode-polarite
        feedback: >
          C'est l'électrode de fer, siège de l'OXYDATION, qui s'appelle
          l'anode - la cathode désigne toujours le siège de la réduction
          (ici, l'argent). Se fier à la sonorité des mots plutôt qu'à leur
          définition (anode = oxydation, cathode = réduction) mène à
          l'erreur.
      - id: D
        text: "C'est la cathode, borne +, comme pour n'importe quelle électrode où un métal solide est présent."
        correct: false
        misconception: mc.physics.pc_piles.anode-cathode-polarite
        feedback: >
          La présence d'un métal solide ne suffit pas à nommer l'électrode
          : les deux électrodes de cette pile (argent et fer) sont des
          métaux solides, et pourtant l'une est l'anode, l'autre la
          cathode - c'est le mécanisme (oxydation ou réduction) qui
          décide, pas la simple présence d'un solide.
    correct_feedback: >
      Le fer s'oxyde : c'est l'anode. Les électrons qu'il libère s'y
      accumulent, la rendant relativement négative - c'est la borne -.
    solution: |
      L'électrode où se produit l'oxydation s'appelle toujours l'anode,
      quel que soit le métal en jeu. L'oxydation libère des électrons dans
      le métal : ils s'y accumulent, rendant cette électrode relativement
      plus négative que l'autre - c'est la borne -. Ici, le fer s'oxyde :
      il est donc l'anode, borne -, tandis que l'argent, siège de la
      réduction, est la cathode, borne +.

  # ── sens des électrons vs sens du courant (variant 2, chaîne anode→électrons→courant) ──
  - id: PILES-17
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_piles
    tags: []
    stem: >
      Dans une pile constituée des couples $Ni^{2+}/Ni$ et $Ag^+/Ag$,
      l'électrode de nickel est le siège de l'oxydation
      ($Ni \rightleftharpoons Ni^{2+}+2e^-$). Dans le circuit extérieur,
      quel est le sens du courant électrique conventionnel ?
    type: mcq
    choices:
      - id: A
        text: "Le nickel, siège de l'oxydation, est l'anode (borne -) ; les électrons y sont produits et circulent, dans le circuit extérieur, du nickel vers l'argent (de - vers +) ; le courant conventionnel, en sens inverse, circule donc de l'argent vers le nickel (de + vers -)."
        correct: true
      - id: B
        text: "Le nickel est l'anode, borne - ; les électrons vont du nickel vers l'argent ; le courant suit donc le même trajet, du nickel vers l'argent."
        correct: false
        misconception: mc.physics.pc_piles.courant-sens-electrons
        feedback: >
          Les deux premières déductions sont justes (nickel = anode = -,
          électrons de - vers +), mais la dernière étape inverse la règle
          : le courant conventionnel circule toujours en sens inverse des
          électrons, donc de l'argent vers le nickel, pas dans le même
          sens.
      - id: C
        text: "Le nickel, siège de l'oxydation, est la cathode, donc la borne + de la pile ; les électrons vont par conséquent de l'argent vers le nickel dans le circuit extérieur, et le courant conventionnel va du nickel vers l'argent."
        correct: false
        misconception: mc.physics.pc_piles.anode-cathode-polarite
        feedback: >
          L'électrode où se produit l'oxydation s'appelle l'anode, pas la
          cathode - c'est la cathode qui est le siège de la réduction.
          Cette confusion de départ (nickel = anode, pas cathode) inverse
          toute la suite du raisonnement.
      - id: D
        text: "Le nickel est bien l'anode, borne -, et les électrons vont du nickel vers l'argent - mais le courant conventionnel n'a pas de sens propre dans le circuit extérieur, il dépend de l'appareil de mesure utilisé."
        correct: false
        misconception: mc.physics.pc_piles.courant-sens-electrons
        feedback: >
          Le courant conventionnel a un sens parfaitement défini, fixé par
          la convention historique (sens inverse du déplacement des
          électrons, porteurs négatifs) : il ne dépend d'aucun appareil de
          mesure. Ici, il circule de l'argent vers le nickel, de + vers -.
    correct_feedback: >
      Nickel = anode (-), électrons de - vers +, courant conventionnel en
      sens inverse : de + (argent) vers - (nickel).
    solution: |
      Le nickel s'oxyde : c'est l'anode, borne -. Les électrons qu'il
      libère circulent, dans le circuit extérieur, du nickel vers l'argent
      (de - vers +). Le courant conventionnel, toujours défini en sens
      inverse du déplacement réel des électrons, circule donc de l'argent
      vers le nickel (de + vers -).

  # ── formule de la f.é.m. : inverser cathode et anode dans E = V+ - V- (R5) ──
  - id: PILES-18
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Pour une pile Daniell en fonctionnement normal (zinc = anode, cuivre
      = cathode), un élève écrit la f.é.m. ainsi : $E = V_{Zn} - V_{Cu}$
      (potentiel de l'anode moins potentiel de la cathode). Que penser de
      cette expression, et de son signe ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : la f.é.m. se définit comme $E = V_{\\text{cathode}} - V_{\\text{anode}}$, soit ici $V_{Cu}-V_{Zn}$ (la borne + moins la borne -), et non l'inverse ; l'expression de l'élève donnerait une valeur négative."
        correct: true
      - id: B
        text: "Elle est correcte, et il est tout à fait normal qu'une pile en fonctionnement affiche une f.é.m. négative."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          Une pile qui fonctionne normalement (zinc anode/-, cuivre
          cathode/+) affiche toujours une f.é.m. positive, par définition
          $E=V_{\text{cathode}}-V_{\text{anode}}=V_+-V_-$. Une valeur
          négative signalerait une inversion (mauvais branchement du
          voltmètre, ou électrodes échangées), pas un fonctionnement
          normal.
      - id: C
        text: "L'ordre de soustraction n'a pas d'importance : $V_{Zn}-V_{Cu}$ et $V_{Cu}-V_{Zn}$ donnent nécessairement la même valeur positive pour une pile en fonctionnement."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          L'ordre de soustraction change le signe du résultat, comme pour
          toute différence : $V_{Zn}-V_{Cu}$ et $V_{Cu}-V_{Zn}$ sont
          opposés l'un de l'autre, pas égaux. Seul
          $V_{\text{cathode}}-V_{\text{anode}}$ (ici $V_{Cu}-V_{Zn}$)
          donne la f.é.m. positive attendue pour une pile qui fonctionne
          normalement.
      - id: D
        text: "Elle est correcte, car l'anode, siège de l'oxydation, est toujours l'électrode de potentiel le plus élevé, donc $V_{\\text{anode}}$ doit apparaître en premier dans la soustraction, avant celui de la cathode."
        correct: false
        misconception: mc.physics.pc_piles.anode-cathode-polarite
        feedback: >
          C'est l'inverse : l'anode, où les électrons s'accumulent
          (oxydation), est l'électrode de potentiel le plus bas (borne -),
          pas le plus élevé. C'est la cathode qui a le potentiel le plus
          élevé - c'est donc elle qui doit apparaître en premier dans
          $E=V_{\text{cathode}}-V_{\text{anode}}$.
    correct_feedback: >
      La f.é.m. se définit toujours borne + moins borne -, soit ici
      $V_{Cu}-V_{Zn}$ : l'expression de l'élève, inversée, donnerait une
      valeur négative, incompatible avec le fonctionnement normal de la
      pile.
    solution: |
      Par définition, $E = V_{\text{cathode}} - V_{\text{anode}} = V_+ -
      V_-$. Pour la pile Daniell, le cuivre est la cathode (+) et le zinc
      l'anode (-) : $E = V_{Cu} - V_{Zn}$, une valeur positive.
      L'expression de l'élève, $V_{Zn}-V_{Cu}$, est l'opposée de la bonne
      : elle donnerait une valeur négative, ce qui ne correspond pas à une
      pile en fonctionnement normal.

  # ── confondre f.é.m. à vide et tension en charge (R5) ───────────────────────
  - id: PILES-19
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      On branche un voltmètre directement entre les deux bornes d'une pile
      Daniell, sans rien connecter d'autre : il affiche $1{,}1\ \text{V}$.
      On retire le voltmètre et on branche à la place une lampe qui
      consomme un courant important : la tension à ses bornes affiche
      alors $0{,}9\ \text{V}$, une valeur plus faible. Un élève en
      conclut : « la f.é.m. de la pile a changé, elle vaut maintenant
      $0{,}9\ \text{V}$ ». Que penser de cette conclusion ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : la f.é.m. $E$ se définit comme la tension mesurée à courant quasiment nul (à vide, avec le voltmètre) - elle vaut donc $1{,}1$ V. Les $0{,}9$ V lus avec la lampe sont une tension en charge."
        correct: true
      - id: B
        text: "Elle est correcte : la f.é.m. est simplement la tension mesurée aux bornes de la pile, quel que soit l'appareil branché - elle vaut donc $0{,}9$ V dès qu'une lampe est connectée."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          La f.é.m. a une définition précise : c'est la tension mesurée à
          courant quasiment nul (voltmètre seul, à vide), pas la tension
          mesurée n'importe quand. Une fois qu'un récepteur consommant du
          courant est branché, la tension mesurée chute en dessous de $E$
          - ce n'est plus la f.é.m., même si elle reste une tension bien
          réelle.
      - id: C
        text: "Les deux valeurs mesurent la même grandeur $E$ ; l'écart entre $1{,}1$ V et $0{,}9$ V s'explique uniquement par l'imprécision des appareils de mesure utilisés."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          L'écart n'est pas une simple imprécision de mesure : il traduit
          un phénomène physique réel, le fait qu'un courant important
          circule dans le second cas (à travers la lampe), ce qui fait
          chuter la tension disponible en dessous de la f.é.m. $E=1{,}1$
          V, mesurée elle à courant quasiment nul.
      - id: D
        text: "L'écart montre que la pile s'est usée entre les deux mesures : sa f.é.m. réelle a diminué de $1{,}1$ V à $0{,}9$ V à cause de la consommation du zinc."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          Ce n'est pas l'usure de la pile (qui se manifeste sur une durée
          bien plus longue, via la consommation progressive du réactif)
          qui explique cet écart immédiat : c'est la différence entre une
          mesure à courant quasiment nul (voltmètre seul, $E=1{,}1$ V) et
          une mesure en charge, avec un courant important qui traverse la
          lampe (tension plus faible que $E$).
    correct_feedback: >
      La f.é.m. se mesure à courant quasiment nul (à vide) : elle reste
      $1{,}1$ V. La valeur mesurée en charge, avec la lampe, est une
      tension plus faible, pas la f.é.m. elle-même.
    solution: |
      La définition de la f.é.m. (chapitre 6) est précise : c'est la tension
      mesurée à courant quasiment nul, typiquement avec un voltmètre seul
      branché aux bornes. Ici, $E=1{,}1$ V reste la f.é.m. de la pile. La
      valeur $0{,}9$ V, mesurée avec une lampe qui consomme un courant
      important, est une tension EN CHARGE - toujours plus faible que $E$
      dès qu'un courant non négligeable circule - mais ce n'est pas la
      f.é.m., et ce n'est pas non plus le signe d'une usure de la pile à
      cet instant précis.

  # ── croire que la f.é.m. est une constante universelle pour toute pile (R5) ──
  - id: PILES-20
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_piles
    tags: []
    stem: >
      Un élève affirme : « toute pile a une f.é.m. de $1{,}1\ \text{V}$,
      puisque c'est la valeur qu'on trouve pour la pile Daniell ». Que
      penser de cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Elle est fausse : $1{,}1$ V est la f.é.m. typique de la pile Daniell précisément, dans les conditions usuelles de concentration - une pile bâtie sur d'autres couples, ou à d'autres concentrations, aura une f.é.m. différente."
        correct: true
      - id: B
        text: "Elle est correcte : la f.é.m. d'une pile est une constante physique universelle, comme la constante de Faraday, qui ne dépend ni des couples utilisés ni des concentrations mises en jeu."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          La f.é.m. n'est en rien une constante universelle : elle dépend
          directement des couples oxydant/réducteur utilisés (chaque pile
          a sa propre réaction, donc son propre $K$) et des concentrations
          initiales (via l'écart entre $Q_{r,i}$ et $K$). $1{,}1$ V est
          une valeur particulière à la pile Daniell dans des conditions
          usuelles, pas une constante générale.
      - id: C
        text: "Elle est fausse, mais seulement parce que la f.é.m. dépend de la taille des électrodes utilisées, pas de la nature des couples oxydant/réducteur."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          La taille des électrodes (leur masse, leur surface) n'influence
          pas la f.é.m. - elle joue seulement sur la durée de vie de la
          pile (chapitre 7). C'est la nature des couples oxydant/réducteur, et
          les concentrations initiales, qui déterminent la f.é.m., pas la
          géométrie des électrodes.
      - id: D
        text: "Elle est fausse, mais uniquement parce que la f.é.m. ne dépend que de la température, identique pour toute pile à une température donnée."
        correct: false
        misconception: mc.physics.pc_piles.fem-mal-comprise
        feedback: >
          La température influence bien $K$, donc indirectement la
          f.é.m., mais elle n'est pas le seul facteur : deux piles à la
          même température, utilisant des couples différents (donc des
          $K$ différents) ou des concentrations initiales différentes,
          auront en général des f.é.m. différentes.
    correct_feedback: >
      $1{,}1$ V n'est pas universel : c'est la valeur typique de LA pile
      Daniell, dans des conditions usuelles - une autre pile, avec
      d'autres couples ou d'autres concentrations, a en général une f.é.m.
      différente.
    solution: |
      La f.é.m. traduit électriquement l'écart entre $Q_{r,i}$ et $K$
      (chapitre 6) : elle dépend donc directement de la réaction (donc des
      couples oxydant/réducteur utilisés, donc de $K$) et des
      concentrations initiales (donc de $Q_{r,i}$). $1{,}1$ V n'est que la
      valeur typique obtenue pour la pile Daniell précisément, dans des
      conditions usuelles de concentration - rien ne garantit cette valeur
      pour une pile différente.

  # ── croire que la pile ne s'use pas (variant 2, calcul du dépôt cathodique) ──
  - id: PILES-21
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_piles
    tags: []
    stem: >
      Une pile Daniell débite un courant constant $I = 250\ \text{mA}$
      pendant $\Delta t = 45\ \text{min}$. On donne $F\approx9{,}65\times
      10^4\ \text{C/mol}$ et $M(Cu)=63{,}5\ \text{g/mol}$. Un élève calcule
      la masse de cuivre déposée à la cathode ainsi : $m(Cu) =
      I\times\Delta t\times M(Cu) = 0{,}250\times2700\times63{,}5\approx
      4{,}3\times10^{4}\ \text{g}$. Que penser de ce calcul, et quelle est
      la masse correcte ?
    type: mcq
    choices:
      - id: A
        text: "Le calcul est faux : il saute les étapes $Q=I\\Delta t$, $n(e^-)=Q/F$ et $n(Cu)=n(e^-)/2$ - la masse réellement déposée est d'environ $0{,}22$ g, et non $4{,}3\\times10^4$ g."
        correct: true
      - id: B
        text: "Le calcul est correct : multiplier directement $I$, $\\Delta t$ et $M(Cu)$ donne bien la masse de cuivre déposée sur l'électrode, sans qu'aucune étape intermédiaire soit nécessaire."
        correct: false
        misconception: mc.physics.pc_piles.calcul-quantite-electricite
        feedback: >
          Cette formule oublie deux étapes essentielles : convertir la
          charge $Q=I\Delta t$ en quantité de matière d'électrons via
          $n(e^-)=Q/F$ (diviser par la constante de Faraday), puis en
          quantité de matière de cuivre via la stœchiométrie de la
          demi-équation ($n(Cu)=n(e^-)/2$). Sans ces étapes, le résultat
          obtenu ($4{,}3\times10^4$ g, soit 43 kg de cuivre) est
          physiquement absurde pour une pile de laboratoire.
      - id: C
        text: "Il manque une seule étape : $n(Cu) = n(e^-) = Q/F \\approx 7{,}0\\times10^{-3}$ mol, chaque ion $Cu^{2+}$ captant un électron, donc $m(Cu)\\approx0{,}44$ g."
        correct: false
        misconception: mc.physics.pc_piles.calcul-quantite-electricite
        feedback: >
          Chaque ion $Cu^{2+}$ réduit capte 2 électrons (demi-équation
          $Cu^{2+}+2\,e^-\rightleftharpoons Cu$) : il faut donc diviser
          $n(e^-)$ par 2 pour obtenir $n(Cu)$, pas les assimiler
          directement. La masse correcte est environ $0{,}22$ g, pas
          $0{,}44$ g.
      - id: D
        text: "Correctement calculée avec les bonnes étapes, la masse de cuivre déposée est d'environ $0{,}23$ g, obtenue en utilisant $M(Zn)=65{,}4$ g/mol à la place de $M(Cu)$, les deux métaux ayant des masses molaires presque égales."
        correct: false
        misconception: mc.physics.pc_piles.calcul-quantite-electricite
        feedback: >
          Même si les deux masses molaires sont proches, c'est bien
          $M(Cu)=63{,}5$ g/mol qu'il faut utiliser pour une masse de
          CUIVRE déposée à la cathode - utiliser $M(Zn)$ mélangerait les
          deux électrodes, même si l'écart numérique final reste ici
          discret.
    correct_feedback: >
      Il faut passer par $Q=I\Delta t$, puis $n(e^-)=Q/F$, puis
      $n(Cu)=n(e^-)/2$ avant de multiplier par $M(Cu)$ : la masse correcte
      est environ $0{,}22$ g, pas $4{,}3\times10^4$ g.
    solution: |
      $$Q = I\,\Delta t = 0{,}250 \times 2700 = 675\ \text{C}$$
      $$
      n(e^-) = \frac{Q}{F} = \frac{675}{9{,}65\times10^4} \approx
      7{,}0\times10^{-3}\ \text{mol}
      $$
      À la cathode, $Cu^{2+}+2\,e^- \rightleftharpoons Cu$ : chaque ion
      $Cu^{2+}$ réduit capte 2 électrons, donc
      $$n(Cu) = \frac{n(e^-)}{2} \approx 3{,}5\times10^{-3}\ \text{mol}$$
      $$
      m(Cu) = n(Cu)\times M(Cu) \approx 3{,}5\times10^{-3}\times63{,}5
      \approx 0{,}22\ \text{g}
      $$

  # ── application bac : sens + polarité + sens du courant, synthèse (R7, fraîche) ──
  - id: PILES-22
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_piles
    tags: []
    stem: >
      On réalise une pile avec les couples $Ni^{2+}/Ni$ ($[Ni^{2+}]_i =
      1{,}0\times10^{-2}\ \text{mol/L}$) et $Ag^+/Ag$ ($[Ag^+]_i =
      5{,}0\times10^{-2}\ \text{mol/L}$), pour la réaction $Ni + 2\,Ag^+
      \rightleftharpoons Ni^{2+} + 2\,Ag$, avec
      $K\approx1\times10^{35}$. Quelle affirmation regroupe
      correctement le sens d'évolution, la polarité des électrodes, et le
      sens du courant dans le circuit extérieur ?
    type: mcq
    choices:
      - id: A
        text: "$Q_{r,i}=[Ni^{2+}]_i/[Ag^+]_i^2 = 4{,}0 \\ll K$ : sens direct, le nickel s'oxyde (anode, borne -) et les ions $Ag^+$ se réduisent (argent = cathode, borne +) ; dans le circuit extérieur, les électrons vont du nickel vers l'argent, le courant conventionnel de l'argent vers le nickel."
        correct: true
      - id: B
        text: "$Q_{r,i}=4{,}0 \\ll K$ : sens direct, le nickel s'oxyde, mais c'est la cathode (borne +) ; l'argent, qui se réduit, est alors l'anode (borne -) de la pile ainsi construite."
        correct: false
        misconception: mc.physics.pc_piles.anode-cathode-polarite
        feedback: >
          L'électrode d'oxydation (ici le nickel) s'appelle toujours
          l'anode, jamais la cathode - et elle est toujours la borne -,
          jamais la borne +. C'est l'argent, siège de la réduction, qui
          est la cathode, borne +.
      - id: C
        text: "$Q_{r,i}=4{,}0 \\ll K$ : sens direct, nickel = anode (-), argent = cathode (+) ; mais dans le circuit extérieur, le courant conventionnel va du nickel vers l'argent, et les électrons de l'argent vers le nickel, à l'inverse du trajet réel."
        correct: false
        misconception: mc.physics.pc_piles.courant-sens-electrons
        feedback: >
          C'est l'inverse : les électrons, produits par l'oxydation à
          l'anode, vont du nickel vers l'argent (de - vers +) ; le courant
          conventionnel, toujours en sens inverse des électrons, va donc
          de l'argent vers le nickel (de + vers -), pas le contraire.
      - id: D
        text: "$Q_{r,i}=[Ni^{2+}]_i/[Ag^+]_i = 0{,}20 \\ll K$ : sens direct, nickel = anode (-), argent = cathode (+) ; électrons du nickel vers l'argent, courant de l'argent vers le nickel."
        correct: false
        misconception: mc.physics.pc_piles.expression-quotient-reaction
        feedback: >
          Le coefficient stœchiométrique de $Ag^+$ dans l'équation est 2 :
          il doit apparaître comme exposant dans $Q_r$, soit
          $Q_{r,i}=[Ni^{2+}]_i/[Ag^+]_i^{\,2}$, pas au premier degré. La
          conclusion qualitative (sens direct) reste ici la même par
          chance, mais l'expression de $Q_r$ utilisée est incorrecte.
    correct_feedback: >
      $Q_{r,i}=[Ni^{2+}]_i/[Ag^+]_i^{\,2}=4{,}0 \ll K$ : sens direct.
      Nickel = anode (-), argent = cathode (+) ; électrons de - vers +,
      courant conventionnel de + vers -.
    solution: |
      $$
      Q_{r,i} = \frac{[Ni^{2+}]_i}{[Ag^+]_i^{\,2}} =
      \frac{1{,}0\times10^{-2}}{(5{,}0\times10^{-2})^2} = 4{,}0
      $$
      $Q_{r,i}=4{,}0 \ll K\approx7{,}0\times10^{16}$ : le système évolue
      dans le sens direct. Le nickel s'oxyde : c'est l'anode, borne -.
      L'argent se réduit : c'est la cathode, borne +. Dans le circuit
      extérieur, les électrons vont du nickel vers l'argent (de - vers
      +) ; le courant conventionnel, en sens inverse, va de l'argent vers
      le nickel (de + vers -).

  # ── application bac : f.é.m. à vide + usure chiffrée, synthèse (R7, fraîche) ──
  - id: PILES-23
    rung: "R7"
    difficulty_level: 5
    skill_code: pc_piles
    tags: []
    stem: >
      Une pile est construite avec les couples $Ni^{2+}/Ni$ et
      $Cu^{2+}/Cu$, pour la réaction $Ni + Cu^{2+} \rightleftharpoons
      Ni^{2+} + Cu$. On mesure, à vide, une f.é.m. $E \approx 0{,}6\
      \text{V}$. La pile débite ensuite un courant constant $I = 200\
      \text{mA}$ pendant $\Delta t = 4\ \text{h}$. On donne
      $F\approx9{,}65\times10^4\ \text{C/mol}$, $M(Ni)=58{,}7\
      \text{g/mol}$. Quelle masse de nickel a été consommée à l'anode
      pendant cette durée, et que peut-on dire de $E$ pendant ce temps ?
    type: mcq
    choices:
      - id: A
        text: "$Q=I\\Delta t=0{,}200\\times14400=2880$ C ; $n(e^-)=Q/F\\approx2{,}98\\times10^{-2}$ mol ; $n(Ni)=n(e^-)/2\\approx1{,}49\\times10^{-2}$ mol ; $m(Ni)\\approx0{,}88$ g. Pendant ce temps, $Q_{r,i}$ se rapproche de $K$ : la f.é.m. réelle disponible diminue progressivement en dessous de $0{,}6$ V, même si l'énoncé donne sa valeur initiale à vide."
        correct: true
      - id: B
        text: "$Q=I\\Delta t=0{,}200\\times4=0{,}8$ C ; $n(e^-)\\approx8{,}3\\times10^{-6}$ mol ; $n(Ni)\\approx4{,}1\\times10^{-6}$ mol ; $m(Ni)\\approx2{,}4\\times10^{-4}$ g."
        correct: false
        misconception: mc.physics.pc_piles.calcul-quantite-electricite
        feedback: >
          $\Delta t$ doit être converti en SECONDES avant d'utiliser
          $Q=I\Delta t$ (unité de $Q$ en coulombs, avec $I$ en ampères et
          $\Delta t$ en secondes) : $4$ h $=14400$ s, pas $4$. Utiliser
          des heures directement sous-estime $Q$ d'un facteur $3600$.
      - id: C
        text: "$Q=2880$ C ; $n(e^-)\\approx2{,}98\\times10^{-2}$ mol ; $n(Ni)=n(e^-)\\approx2{,}98\\times10^{-2}$ mol (une mole de nickel par mole d'électrons) ; $m(Ni)\\approx1{,}75$ g."
        correct: false
        misconception: mc.physics.pc_piles.calcul-quantite-electricite
        feedback: >
          La demi-équation $Ni^{2+}+2\,e^-\rightleftharpoons Ni$ montre
          que chaque atome de nickel échange 2 électrons, pas 1 : il faut
          diviser $n(e^-)$ par 2 pour obtenir $n(Ni)$, pas les assimiler
          directement. La masse correcte est environ $0{,}88$ g, pas
          $1{,}75$ g.
      - id: D
        text: "$Q=2880$ C, $n(e^-)\\approx2{,}98\\times10^{-2}$ mol, $n(Ni)\\approx1{,}49\\times10^{-2}$ mol, $m(Ni)\\approx0{,}88$ g - et la f.é.m. reste rigoureusement égale à $0{,}6$ V tout au long du fonctionnement, puisque c'est une caractéristique fixe de la pile, inscrite dans sa construction."
        correct: false
        misconception: mc.physics.pc_piles.qr-evolution-equilibre
        feedback: >
          La f.é.m. n'est pas une caractéristique fixe et immuable : elle
          traduit l'écart entre $Q_{r,i}$ et $K$, qui se réduit à mesure
          que la pile fonctionne (le nickel s'oxyde, $[Ni^{2+}]$ augmente,
          $[Cu^{2+}]$ diminue). $E\approx0{,}6$ V n'est que sa valeur à
          cet instant (mesurée à vide, en début de fonctionnement) - elle
          diminue progressivement ensuite.
    correct_feedback: >
      $Q=2880$ C, $n(e^-)\approx2{,}98\times10^{-2}$ mol,
      $n(Ni)\approx1{,}49\times10^{-2}$ mol, $m(Ni)\approx0{,}88$ g. La
      f.é.m. n'est pas figée : elle faiblit progressivement à mesure que
      $Q_{r,i}$ se rapproche de $K$.
    solution: |
      $$Q = I\,\Delta t = 0{,}200 \times 14400 = 2880\ \text{C}$$
      $$
      n(e^-) = \frac{Q}{F} = \frac{2880}{9{,}65\times10^4} \approx
      2{,}98\times10^{-2}\ \text{mol}
      $$
      À l'anode, $Ni \rightleftharpoons Ni^{2+}+2\,e^-$ : chaque atome de
      nickel libère 2 électrons, donc
      $$n(Ni) = \frac{n(e^-)}{2} \approx 1{,}49\times10^{-2}\ \text{mol}$$
      $$
      m(Ni) = n(Ni)\times M(Ni) \approx 1{,}49\times10^{-2}\times58{,}7
      \approx 0{,}88\ \text{g}
      $$
      Pendant ce fonctionnement, le nickel s'oxyde, $[Ni^{2+}]$ augmente et
      $[Cu^{2+}]$ diminue : $Q_{r,i}$ se rapproche donc de $K$, ce qui
      réduit progressivement la f.é.m. disponible en dessous de sa valeur
      initiale $E\approx0{,}6$ V, mesurée à vide en début de
      fonctionnement.

  # ── application bac : quantité totale d'électricité indépendante du courant (R7, fraîche) ──
  - id: PILES-24
    rung: "R7"
    difficulty_level: 5
    skill_code: pc_piles
    tags: []
    stem: >
      Deux piles Daniell identiques (même quantité initiale de zinc et de
      solutions) sont utilisées séparément : la pile 1 débite un courant
      constant $I_1=50\ \text{mA}$, la pile 2 un courant constant
      $I_2=500\ \text{mA}$, dix fois plus grand. Un élève affirme : « la
      pile 2 s'épuise dix fois plus vite en temps, mais les deux piles
      délivrent, sur toute leur durée de vie, à peu près la même quantité
      totale d'électricité $Q_{\text{totale}}$ - car cette quantité totale
      ne dépend que de la masse de zinc disponible, pas du courant
      demandé ». Que penser de cette affirmation ?
    type: mcq
    choices:
      - id: A
        text: "Elle est essentiellement juste : $Q_{\\text{totale}} = n(e^-)_{\\text{max}}\\times F$ est fixée par la quantité de zinc disponible au départ, quel que soit le courant choisi ; comme $Q=I\\Delta t$, un courant dix fois plus fort épuise cette même quantité dix fois plus vite."
        correct: true
      - id: B
        text: "Elle est fausse : la pile 2, qui débite un courant dix fois plus grand, délivre aussi dix fois plus de quantité d'électricité totale sur toute sa durée de vie, avant de s'épuiser."
        correct: false
        misconception: mc.physics.pc_piles.pile-source-illimitee
        feedback: >
          La quantité totale d'électricité disponible est fixée par la
          quantité de réactif limitant (le zinc), pas par le courant
          demandé : $Q_{\text{totale}}=n(e^-)_{\text{max}}\times F$ ne
          dépend que de $n(Zn)_{\text{disponible}}$. Un courant plus grand
          ne « débloque » pas plus de charge - il consomme la même réserve
          totale plus rapidement, en un temps plus court.
      - id: C
        text: "Elle est fausse : la pile 2, en imposant un courant plus fort, consomme le zinc de façon nettement moins efficace, ce qui réduit la quantité totale d'électricité qu'elle peut délivrer avant de s'épuiser."
        correct: false
        misconception: mc.physics.pc_piles.pile-source-illimitee
        feedback: >
          Rien, dans la relation $Q=I\Delta t=n(e^-)F$, ne rend la
          consommation du zinc « moins efficace » à courant plus élevé :
          chaque mole d'électrons échangée correspond toujours à la même
          quantité de zinc oxydé, quel que soit le courant. La quantité
          totale disponible reste fixée par la masse de zinc, pas par la
          vitesse à laquelle on la consomme.
      - id: D
        text: "Elle est fausse : les deux piles, étant identiques au départ, s'épuisent forcément après exactement la même durée $\\Delta t$, quel que soit le courant qu'on leur fait débiter."
        correct: false
        misconception: mc.physics.pc_piles.pile-source-illimitee
        feedback: >
          Les deux piles contiennent certes la même quantité de zinc au
          départ, mais elles ne la consomment pas à la même VITESSE : à
          courant $I$ plus grand, la même quantité totale de charge
          $Q_{\text{totale}}$ est atteinte en un temps
          $\Delta t = Q_{\text{totale}}/I$ plus court. La pile 2, dix fois
          plus sollicitée, s'épuise donc environ dix fois plus vite en
          temps, pas à la même date que la pile 1.
    correct_feedback: >
      $Q_{\text{totale}}$ est fixée par la quantité de zinc disponible, pas
      par le courant : un courant dix fois plus grand épuise la même
      réserve en un temps dix fois plus court, sans changer
      $Q_{\text{totale}}$.
    solution: |
      La quantité totale d'électricité que peut délivrer une pile avant
      épuisement est fixée par la quantité de réactif limitant disponible
      au départ : $Q_{\text{totale}} = n(e^-)_{\text{max}}\times F$, avec
      $n(e^-)_{\text{max}} = 2\,n(Zn)_{\text{disponible}}$ pour le couple
      $Zn^{2+}/Zn$. Cette quantité ne dépend pas du courant $I$ choisi.
      Puisque $Q=I\Delta t$, un courant plus grand atteint la même
      $Q_{\text{totale}}$ en un temps $\Delta t = Q_{\text{totale}}/I$
      plus court : la pile 2 (courant dix fois plus grand) s'épuise donc
      environ dix fois plus vite en temps, tout en délivrant, sur toute sa
      durée de vie, sensiblement la même quantité totale d'électricité que
      la pile 1.

