    type: mcq
    choices:
      - id: A
        text: "Il est incorrect : chaque électrode doit plonger dans la solution contenant sa propre espèce dissoute (le zinc dans une solution de $Zn^{2+}$, le cuivre dans une solution de $Cu^{2+}$) - c'est cette séparation qui force les électrons à passer par le fil."
        correct: true
      - id: B
        text: "Il est correct : puisque la réaction nécessite que le zinc rencontre les ions $Cu^{2+}$, il faut bien plonger le zinc directement dans la solution qui les contient."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
        feedback: >
          C'est exactement ce qu'on cherche à éviter : plonger le zinc
          directement dans une solution contenant des ions $Cu^{2+}$
          recrée un contact direct, où les électrons sautent localement
          d'une espèce à l'autre - on retrouve le tube à essai de
          l'accroche, pas une pile qui force un détour par le fil.
      - id: C
        text: "Peu importe l'agencement : le courant mesuré serait rigoureusement le même dans les deux configurations, seule l'esthétique du montage change."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
        feedback: >
          L'agencement n'est pas indifférent : plonger une électrode dans
          la mauvaise solution recrée un contact direct entre réactifs
          (ici, le zinc et les ions $Cu^{2+}$), ce qui court-circuite le
          détour par le fil et empêche tout courant mesurable exploitable.
      - id: D
        text: "Le montage est incorrect, mais uniquement parce que le pont salin doit être orienté dans un sens précis pour compenser cette inversion - une fois le pont salin correctement orienté, tout fonctionne alors normalement."
        correct: false
        misconception: mc.physics.pc_piles.role-constituants
        feedback: >
          Le pont salin ne peut pas compenser une inversion
          électrode/solution : son rôle se limite à maintenir
          l'électroneutralité de chaque solution en cours de
          fonctionnement, pas à réparer un contact direct entre réactifs
          créé par une mauvaise disposition initiale.
    correct_feedback: >
      Chaque électrode doit rester dans la solution contenant sa PROPRE
      espèce dissoute : c'est cette séparation, électrode par couple, qui
