notion: piles

exercises:
  # ── r-bac — le sujet national VÉRIFIÉ 2020, Exercice I Partie 2 ───────────
  # Transcription fidèle de docs/sujets/pc/piles.md → « 2020 — session normale
  # — Exercice I (Partie 2) ». Pile argent-chrome : électrode Cr dans Cr³⁺,
  # électrode Ag dans Ag⁺, pont salin, conducteur ohmique + ampèremètre entre
  # les pôles. Observations : courant constant, dépôt sur l'argent, diminution
  # de la masse du chrome. Données : M(Cr) = 52 g/mol ; F = 96500 C/mol.
  - id: r-bac
    title: "Exercice de type bac — étude d'une pile argent-chrome (2020)"
    sourcing:
      status: sourced
      note: >-
        2020 session normale — examen national PC BIOF, code NS28F, AlloSchool
        element/109742 (Exercice I, Partie 2 — étude de la pile argent-chrome ;
        barème Partie 2 ≈ 2,25 pt sur les 7 pt de l'exercice). Transcription
        vérifiée : re-fetch indépendant AlloSchool + diff OK (statut « vérifié »
        dans docs/sujets/pc/piles.md).
    intro: |-
      **Étude d'une pile argent-chrome (examen national, session normale 2020).**

      On étudie une pile électrochimique constituée :

      - d'une électrode en chrome ($Cr$) plongée dans une solution aqueuse de nitrate de chrome (III), contenant les ions $Cr^{3+}$ ;
      - d'une électrode en argent ($Ag$) plongée dans une solution aqueuse de nitrate d'argent, contenant les ions $Ag^{+}$ ;
      - d'un pont salin qui relie les deux solutions.

      On branche un conducteur ohmique en série avec un ampèremètre, et on place ce dipôle entre les pôles de la pile. L'ampèremètre indique le passage d'un courant électrique d'intensité constante dans le circuit. Après une durée $\Delta t$ de fonctionnement de la pile, on observe **un dépôt sur l'électrode d'argent** et **une diminution de la masse de l'électrode de chrome**.

      *Schéma de l'expérience (décrit en mots) :* deux béchers reliés par un pont salin. Le bécher de gauche contient l'électrode d'argent $Ag$ dans une solution d'ions $Ag^{+}$ ; le bécher de droite contient l'électrode de chrome $Cr$ dans une solution d'ions $Cr^{3+}$. En partie haute, un conducteur ohmique en série avec un ampèremètre relie les deux électrodes.

      **Données :** masse molaire du chrome $M(Cr) = 52\ \text{g/mol}$ ; constante de Faraday $1\,\text{F} = 96500\ \text{C/mol}$.
    questions:
      - id: q1
        part: "Partie 2 — Identifier le fonctionnement de la pile"
        stem: |-
          **(0,5 pt)** Préciser l'anode de la pile. Justifier.
        reasoning: |-
          Ne pars pas d'une règle apprise « électrode par électrode » : pars de l'observation expérimentale, elle décide tout. La masse de l'électrode de chrome **diminue** — cela veut dire que du chrome métallique disparaît de la lame, donc qu'il est **oxydé** : $Cr \rightarrow Cr^{3+} + 3\,e^-$. Or, par définition (chapitre 4), l'électrode où se produit l'oxydation est l'**anode**. Donc l'électrode de chrome est l'anode. La seconde observation confirme la cohérence de l'ensemble : le dépôt d'argent signale une réduction $Ag^{+} + e^- \rightarrow Ag$ à l'électrode d'argent, qui est donc la cathode.
      - id: q2
        stem: |-
          **(0,5 pt)** Représenter le schéma conventionnel de la pile.
        reasoning: |-
          Le schéma conventionnel obéit à une règle d'écriture fixe : on place la borne **négative** (l'anode, siège de l'oxydation) à gauche et la borne **positive** (la cathode, siège de la réduction) à droite. Une **barre simple** $\vert$ marque chaque interface électrode / solution ; une **double barre** $\Vert$ marque le pont salin qui sépare les deux demi-piles. Ici, l'anode est le chrome (borne $-$, établie à la question 1) et la cathode est l'argent (borne $+$).
        steps:
          - math: '(-)\ Cr_{(s)}\ \vert\ Cr^{3+}_{(aq)}\ \Vert\ Ag^{+}_{(aq)}\ \vert\ Ag_{(s)}\ (+)'
            note: "Anode (borne −, chrome) à gauche, cathode (borne +, argent) à droite ; barre simple = interface électrode/solution, double barre = pont salin."
      - id: q3
        stem: |-
          **(0,75 pt)** Écrire les équations aux électrodes ainsi que l'équation bilan lors du fonctionnement de la pile.
        reasoning: |-
          Chaque électrode est le siège d'une demi-réaction : oxydation à l'anode (le chrome cède des électrons), réduction à la cathode (les ions argent les captent). On écrit chaque demi-équation, puis on les combine — mais on ne peut sommer que si le **nombre d'électrons échangés est le même** de part et d'autre. Le chrome libère 3 électrons, l'argent n'en capte qu'un : on multiplie donc la demi-équation de l'argent par 3 pour équilibrer, avant d'additionner. Les électrons, qui ne sont ni un réactif ni un produit de la réaction globale, disparaissent alors de l'équation bilan.
        steps:
          - math: 'Cr \rightarrow Cr^{3+} + 3\,e^-'
            note: "À l'anode : oxydation du chrome (l'électrode dont la masse diminue), 3 électrons libérés."
          - math: 'Ag^{+} + e^- \rightarrow Ag'
            note: "À la cathode : réduction des ions argent (le dépôt observé sur l'électrode d'argent), 1 électron capté."
          - math: '3\,Ag^{+} + 3\,e^- \rightarrow 3\,Ag'
            note: "On multiplie la réduction par 3 pour que les 3 électrons libérés par le chrome soient tous captés — condition pour pouvoir sommer."
          - math: 'Cr + 3\,Ag^{+} \rightarrow Cr^{3+} + 3\,Ag'
            note: "Équation bilan : somme des deux demi-équations équilibrées ; les 3 électrons s'annulent."
      - id: q4
        part: "Partie 2 — Quantifier l'usure de l'électrode de chrome"
        stem: |-
          **(0,5 pt)** Sachant que la quantité d'électricité débitée par la pile pendant la durée $\Delta t$ est $Q = 5{,}79\ \text{C}$, déterminer la variation $\Delta m$ de la masse de l'électrode de chrome.
        reasoning: |-
          La charge débitée porte l'information sur le nombre d'électrons échangés, via la relation $Q = n(e^-)\,F$ (chapitre 7). Ici la charge est donnée directement (pas besoin de $Q = I\,\Delta t$) : on convertit d'abord $Q$ en moles d'électrons en divisant par $F$. On passe ensuite des électrons au chrome par la **stœchiométrie de la demi-équation de la question 3** : chaque atome de chrome oxydé libère 3 électrons, donc $n(Cr) = n(e^-)/3$. Enfin, on convertit en masse par $m = n\,M$. La variation $\Delta m$ est **négative** : la lame de chrome perd de la masse (le chrome quitte la lame sous forme d'ions $Cr^{3+}$).
        steps:
          - math: 'n(e^-) = \frac{Q}{F} = \frac{5{,}79}{96500} = 6{,}0\times10^{-5}\ \text{mol}'
            note: "Conversion de la charge débitée en quantité de matière d'électrons, par la constante de Faraday."
          - math: 'n(Cr) = \frac{n(e^-)}{3} = \frac{6{,}0\times10^{-5}}{3} = 2{,}0\times10^{-5}\ \text{mol}'
            note: "Stœchiométrie de l'oxydation Cr → Cr³⁺ + 3 e⁻ : 3 électrons par atome de chrome consommé."
          - math: '\Delta m = -\,n(Cr)\times M(Cr) = -\,2{,}0\times10^{-5}\times 52 \approx -1{,}0\times10^{-3}\ \text{g}'
            note: "Signe négatif : la masse de l'électrode de chrome DIMINUE. Environ 1,0 mg de chrome a quitté la lame."

  # ── r-variation — jumelle fraîche anti-mémorisation (PAS un sujet réel) ───
  # Mêmes savoir-faire profonds que r-bac (prédire le sens, nommer les
  # électrodes et leur polarité, écrire les demi-équations et le bilan, relier
  # charge et masse via Q = IΔt = n(e⁻)F), mais sur une AUTRE pile
  # (zinc-argent), avec la route Qr,i vs K en plus (le sujet, lui, donnait
  # l'observation) et Q à calculer depuis I et Δt (le sujet donnait Q) — pour
  # que l'élève ne puisse pas recopier et doive reconnaître quelle procédure
  # s'applique.
  - id: r-variation
    title: "Variation fraîche — une pile zinc-argent"
    sourcing:
      status: not-applicable
      note: >-
        Variation construite exprès (anti-mémorisation) — n'a pas vocation à
        être un sujet réel. Le sujet réel est r-bac (2020, sourcé).
    intro: |-
      Même structure profonde que le sujet précédent, enrobage différent : ici on te donne les concentrations initiales (et non l'observation), donc tu dois **prédire** le sens spontané en comparant $Q_{r,i}$ à $K$ ; et la quantité d'électricité n'est pas fournie — tu la calcules à partir du courant et de la durée. Le but est que tu ne puisses pas recopier la solution du sujet 2020 : tu dois reconnaître quelle procédure s'applique.

      On réalise une pile constituée d'une demi-pile $Zn^{2+}/Zn$ (électrode de zinc dans une solution telle que $[Zn^{2+}]_i = 1{,}0\times10^{-1}\ \text{mol/L}$) et d'une demi-pile $Ag^{+}/Ag$ (électrode d'argent dans une solution telle que $[Ag^{+}]_i = 1{,}0\times10^{-1}\ \text{mol/L}$), reliées par un pont salin. La réaction associée est $Zn + 2\,Ag^{+} \rightleftharpoons Zn^{2+} + 2\,Ag$, de constante d'équilibre $K \approx 2\times10^{52}$ à la température de l'expérience.

      **Données :** $F \approx 9{,}65\times10^{4}\ \text{C/mol}$ ; $M(Ag) = 108\ \text{g/mol}$.
    questions:
      - id: q1
        stem: |-
          Calculer le quotient de réaction initial $Q_{r,i}$, le comparer à $K$, et en déduire le sens d'évolution spontané : quelle espèce est oxydée, quelle espèce est réduite ?
        reasoning: |-
          C'est le critère du chapitre 3, appliqué à une nouvelle réaction. Attention à un piège d'expression : le coefficient stœchiométrique de $Ag^{+}$ dans l'équation est 2, il apparaît donc en **exposant** au dénominateur de $Q_r$ — les solides $Zn$ et $Ag$, eux, n'y figurent pas. Une fois $Q_{r,i}$ calculé, on le compare à $K$ : comme $K$ est gigantesque, l'écart tranche sans ambiguïté et le système évolue dans le sens direct.
        steps:
          - math: 'Q_{r,i} = \frac{[Zn^{2+}]_i}{[Ag^{+}]_i^{\,2}} = \frac{1{,}0\times10^{-1}}{(1{,}0\times10^{-1})^2} = \frac{0{,}10}{0{,}010} = 10'
            note: "Produit (Zn²⁺) au numérateur, réactif dissous (Ag⁺) au dénominateur AVEC l'exposant 2 ; les solides Zn et Ag sont exclus."
          - math: 'Q_{r,i} = 10 \;\ll\; K \approx 2\times10^{52}'
            note: "L'écart est écrasant (51 ordres de grandeur) : le sens direct l'emporte."
          - math: 'Zn \rightarrow Zn^{2+} + 2\,e^- \qquad\text{et}\qquad Ag^{+} + e^- \rightarrow Ag'
            note: "Sens direct : le zinc est oxydé (il cède ses électrons), les ions argent sont réduits."
      - id: q2
        stem: |-
          Nommer l'anode et la cathode de cette pile, préciser leur polarité, et représenter le schéma conventionnel de la pile.
        reasoning: |-
          On applique le chapitre 4, dans l'ordre mécanisme → polarité, sans se fier à la sonorité des mots. Le zinc s'oxyde : il libère des électrons dans le métal, où ils s'accumulent, ce qui rend cette électrode relativement négative — c'est l'**anode**, borne $-$. L'argent, siège de la réduction, s'appauvrit en électrons : c'est la **cathode**, borne $+$. Le schéma conventionnel place ensuite la borne $-$ à gauche et la borne $+$ à droite.
        steps:
          - math: '(-)\ Zn_{(s)}\ \vert\ Zn^{2+}_{(aq)}\ \Vert\ Ag^{+}_{(aq)}\ \vert\ Ag_{(s)}\ (+)'
            note: "Anode (zinc, borne −) à gauche ; cathode (argent, borne +) à droite ; double barre = pont salin."
      - id: q3
        stem: |-
          Écrire les deux demi-équations électroniques et l'équation bilan de la réaction qui se produit dans la pile.
        reasoning: |-
          Comme pour le sujet, on écrit une demi-équation par électrode, puis on équilibre les électrons échangés avant de sommer. Le zinc libère 2 électrons, l'argent n'en capte qu'un : on multiplie la réduction de l'argent par 2 pour que les électrons se compensent exactement dans la somme.
        steps:
          - math: 'Zn \rightarrow Zn^{2+} + 2\,e^-'
            note: "À l'anode : oxydation du zinc, 2 électrons libérés."
          - math: '2\,Ag^{+} + 2\,e^- \rightarrow 2\,Ag'
            note: "À la cathode : réduction de l'argent, multipliée par 2 pour capter les 2 électrons du zinc."
          - math: 'Zn + 2\,Ag^{+} \rightarrow Zn^{2+} + 2\,Ag'
            note: "Équation bilan : somme des deux demi-équations équilibrées ; les 2 électrons s'annulent."
      - id: q4
        stem: |-
          Indiquer le sens de circulation des électrons, puis celui du courant conventionnel, dans le circuit extérieur.
        reasoning: |-
          On raisonne dans l'ordre physique (chapitre 5) : d'abord les électrons (le déplacement réel), ensuite le courant (déduit par inversion). Les électrons sont produits à l'anode (zinc) et consommés à la cathode (argent) : dans le circuit extérieur, ils circulent donc du zinc vers l'argent, c'est-à-dire de la borne $-$ vers la borne $+$. Le courant conventionnel, défini en sens inverse du déplacement réel des électrons, circule à l'opposé : de l'argent vers le zinc, de la borne $+$ vers la borne $-$.
      - id: q5
        stem: |-
          La pile débite un courant constant $I = 20\ \text{mA}$ pendant une durée $\Delta t = 1\ \text{h}\ 30$. Calculer la masse d'argent déposée sur la cathode pendant cette durée.
        reasoning: |-
          Ici la quantité d'électricité n'est pas donnée : on la construit avec $Q = I\,\Delta t$ (chapitre 7), en pensant à convertir $I$ en ampères et $\Delta t$ en secondes avant tout calcul. On passe ensuite à la quantité de matière d'électrons par $n(e^-) = Q/F$, puis au dépôt d'argent par la stœchiométrie de la demi-équation cathodique : chaque ion $Ag^{+}$ réduit capte **un seul** électron, donc $n(Ag) = n(e^-)$ (pas de division ici, contrairement au chrome du sujet qui échangeait 3 électrons). Enfin, $m(Ag) = n(Ag)\,M(Ag)$.
        steps:
          - math: 'Q = I\,\Delta t = 20\times10^{-3}\times(1{,}5\times3600) = 0{,}020\times5400 = 108\ \text{C}'
            note: "Conversion : I = 20 mA = 0,020 A ; Δt = 1 h 30 = 5400 s."
          - math: 'n(e^-) = \frac{Q}{F} = \frac{108}{9{,}65\times10^{4}} \approx 1{,}12\times10^{-3}\ \text{mol}'
            note: "Charge convertie en moles d'électrons."
          - math: 'n(Ag) = n(e^-) \approx 1{,}12\times10^{-3}\ \text{mol}'
            note: "Ag⁺ + e⁻ → Ag : 1 électron par atome d'argent, donc n(Ag) = n(e⁻) (aucune division)."
          - math: 'm(Ag) = n(Ag)\times M(Ag) \approx 1{,}12\times10^{-3}\times 108 \approx 0{,}12\ \text{g}'
            note: "Masse d'argent déposée sur la cathode pendant Δt."
