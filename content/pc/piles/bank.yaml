    intro: |-
      **Étude de la pile Nickel-Zinc (examen national, session de rattrapage 2011 — Exercice de Chimie, Partie II, 2,00 points sur les 7,00 de l'exercice complet).**

      *La Partie I de cet exercice — l'étude d'une solution d'acide méthanoïque — est indépendante et traitée à part, sous la notion « Réactions acido-basiques » (entrée bk-2011-r-x1). Rien de ce qui suit n'en dépend.*

      On réalise la pile constituée des couples $(\text{Ni}^{2+}_{(aq)}/\text{Ni}_{(s)})$ et $(\text{Zn}^{2+}_{(aq)}/\text{Zn}_{(s)})$ en immergeant :

      - l'électrode de Nickel dans une solution de sulfate de Nickel $(\text{Ni}^{2+}_{(aq)} + \text{SO}_{4(aq)}^{2-})$, de volume $V = 150\ \text{mL}$ et de concentration molaire initiale $[\text{Ni}^{2+}_{(aq)}]_i = 10^{-2}\ \text{mol.L}^{-1}$ ;
      - l'électrode de Zinc dans une solution de sulfate de Zinc $(\text{Zn}^{2+}_{(aq)} + \text{SO}_{4(aq)}^{2-})$, du MÊME volume $V = 150\ \text{mL}$ et de concentration molaire initiale $[\text{Zn}^{2+}_{(aq)}]_i = 10^{-2}\ \text{mol.L}^{-1}$.

      On relie les deux compartiments par un pont ionique.

      **Données.**
      - La constante d'équilibre associée à l'équation de la réaction suivante est $K = 10^{18}$ :

      $$\text{Zn}_{(s)} + \text{Ni}^{2+}_{(aq)} \rightleftharpoons \text{Zn}^{2+}_{(aq)} + \text{Ni}_{(s)}$$

      - $1\,\mathcal{F} = 9{,}65\times10^4\ \text{mol}^{-1}$ *(unité imprimée telle quelle sur le sujet officiel — le coulomb manque ; on utilise $\mathcal{F} = 9{,}65\times10^4\ \text{C.mol}^{-1}$, la constante de Faraday, sans quoi aucune des grandeurs ci-dessous n'est homogène).*

      Au cours du fonctionnement de la pile, le circuit extérieur est traversé par un courant d'intensité $I = 0{,}1\ \text{A}$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** **1-** Préciser, en calculant le quotient de réaction $Q_{r,i}$ à l'état initial, le sens spontané d'évolution du système constituant la pile.
        reasoning: |-
          Comme au chapitre 3 de cette leçon (qui applique ici le critère de la notion « Évolution spontanée d'un système chimique » : comparer $Q_{r,i}$ à $K$), le quotient de réaction ne porte que les espèces dissoutes — $\text{Zn}_{(s)}$ et $\text{Ni}_{(s)}$ sont des solides purs, ils n'entrent pas dans $Q_r$.

          $$Q_{r,i} = \frac{[\text{Zn}^{2+}]_i}{[\text{Ni}^{2+}]_i} = \frac{10^{-2}}{10^{-2}} = 1$$

          $Q_{r,i} = 1$ est écrasé par $K = 10^{18}$ — un écart de $18$ ordres de grandeur.

          $$\boxed{Q_{r,i} \ll K \implies \text{le système évolue dans le sens direct (1)}}$$

          Concrètement (chapitre 4) : le zinc est oxydé (il devient l'anode, borne $-$) et les ions $\text{Ni}^{2+}$ sont réduits au voisinage de l'électrode de nickel (qui devient la cathode, borne $+$) — c'est ce sens qui débite le courant $I$ observé lors du fonctionnement de la pile, et c'est le point que la question 3 va exploiter.
        steps:
          - math: 'Q_{r,i} = \frac{[\text{Zn}^{2+}]_i}{[\text{Ni}^{2+}]_i}'
            note: "Solides Zn et Ni exclus du quotient de reaction (especes dissoutes seulement)."
          - math: 'Q_{r,i} = \frac{10^{-2}}{10^{-2}} = 1'
            note: "Les deux concentrations initiales sont egales (donnees de l'enonce)."
          - math: '\boxed{Q_{r,i} = 1 \ll K = 10^{18} \implies \text{sens direct}}'
            note: "Le zinc s'oxyde (anode), Ni2+ se reduit (cathode)."
      - id: q2
        stem: |-
          **(0,5 pt)** **2-** Donner le schéma conventionnel de la pile étudiée.
        reasoning: |-
          La polarité vient directement de la question 1 et du chapitre 4 : l'anode (le zinc, siège de l'oxydation) est la borne $-$, la cathode (le nickel, siège de la réduction) est la borne $+$. Le schéma conventionnel suit la convention d'écriture fixe du chapitre 4 : borne $-$ à gauche, borne $+$ à droite, barre simple pour chaque interface électrode/solution, double barre pour le pont ionique.
        steps:
          - math: '(-)\ \text{Zn}_{(s)}\ \vert\ \text{Zn}^{2+}_{(aq)}\ \Vert\ \text{Ni}^{2+}_{(aq)}\ \vert\ \text{Ni}_{(s)}\ (+)'
            note: "Anode (borne moins, zinc) a gauche ; cathode (borne plus, nickel) a droite ; barre simple = interface electrode-solution, double barre = pont ionique."
      - id: q3
        stem: |-
          **(1 pt)** **3-** Au cours du fonctionnement de la pile, le circuit extérieur est traversé par un courant d'intensité $I = 0{,}1\ \text{A}$. Trouver la durée maximale $\Delta t_{max}$ de fonctionnement de la pile en fonction de : $[\text{Zn}^{2+}_{(aq)}]_i$, $V$, $\mathcal{F}$ et $I$. Calculer $\Delta t_{max}$. *(Énoncé imprimé tel quel — l'espèce nommée n'est pas l'espèce limitante ; voir le raisonnement.)*
        reasoning: |-
          **Ce que la pile arrête réellement.** Une pile s'arrête quand un des deux réactifs de sa réaction est épuisé. À la question 1, le sens direct a été établi : $\text{Zn}_{(s)} + \text{Ni}^{2+}_{(aq)} \rightarrow \text{Zn}^{2+}_{(aq)} + \text{Ni}_{(s)}$. Dans cette réaction, $\text{Ni}^{2+}$ est CONSOMMÉ (réduit à la cathode) tandis que $\text{Zn}^{2+}$ est PRODUIT (par oxydation du zinc à l'anode) — sa concentration ne fait que croître au cours du fonctionnement. Une grandeur qui ne cesse de croître ne peut pas être celle qui « s'épuise » et fixe une durée maximale : c'est $\text{Ni}^{2+}$, l'espèce consommée, qui limite $\Delta t_{max}$ — pas $\text{Zn}^{2+}$, quoi qu'en dise l'énoncé.

          **La chaîne à trois maillons (chapitre 7), posée sur la BONNE espèce.** Toute la solution de $\text{Ni}^{2+}$ est consommée quand $\Delta t = \Delta t_{max}$. La demi-équation de réduction, $\text{Ni}^{2+} + 2\,e^- \rightarrow \text{Ni}$, montre que chaque ion $\text{Ni}^{2+}$ consommé demande $2$ électrons :

          $$n(e^-) = 2\,n(\text{Ni}^{2+})_i = 2\,[\text{Ni}^{2+}]_i\,V$$

          La charge correspondante, $Q_{max} = n(e^-)\,\mathcal{F}$, est aussi débitée à intensité constante, $Q_{max} = I\,\Delta t_{max}$ :

          $$\boxed{\Delta t_{max} = \frac{2\,\mathcal{F}\,[\text{Ni}^{2+}]_i\,V}{I}}$$

          **L'énoncé, verbatim, et pourquoi il tombe juste quand même.** Le sujet officiel demande cette durée « en fonction de $[\text{Zn}^{2+}]_i$ » — ce qui, physiquement, n'a pas de sens (ci-dessus). Mais l'énoncé donne aussi $[\text{Zn}^{2+}]_i = [\text{Ni}^{2+}]_i = 10^{-2}\ \text{mol.L}^{-1}$ : les deux concentrations initiales sont ÉGALES dans CE sujet précis. En conséquence, l'écriture imprimée $\Delta t_{max} = 2\mathcal{F}[\text{Zn}^{2+}]_iV/I$ donne EXACTEMENT le même nombre que l'écriture physiquement correcte ci-dessus — la substitution numérique ne peut pas trahir l'erreur, puisque $[\text{Zn}^{2+}]_i$ et $[\text{Ni}^{2+}]_i$ sont interchangeables ICI. Un sujet où les deux concentrations différeraient exposerait immédiatement le défaut : la bonne réponse, dans ce cas-là, ne dépendrait QUE de $[\text{Ni}^{2+}]_i$.

          **L'application numérique**, avec $\mathcal{F} = 9{,}65\times10^4\ \text{C.mol}^{-1}$ (l'unité complète — celle imprimée sur le sujet officiel, « $\text{mol}^{-1}$ », ampute le coulomb, S3) :

          $$\Delta t_{max} = \frac{2\times9{,}65\times10^4\times10^{-2}\times0{,}150}{0{,}1}$$

          $$\boxed{\Delta t_{max} \approx 2\,895\ \text{s} \approx 48\ \text{min}}$$

          Le piège nommé de cette question, et c'est le plus dangereux du lot officiel : une réponse numérique juste peut cacher un raisonnement faux. Écrire « $\Delta t_{max}$ en fonction de $[\text{Zn}^{2+}]_i$ » sans jamais se demander laquelle des deux espèces est réellement consommée conduit ici au bon chiffre par coïncidence — mais ce n'est pas parce que le nombre tombe juste que la phrase qui l'accompagne (« $\text{Zn}^{2+}$ limite la pile ») devient vraie.
        steps:
          - math: 'n(\text{Ni}^{2+})_i = [\text{Ni}^{2+}]_i\,V'
            note: "Ni2+ est l'espece CONSOMMEE (reduite a la cathode) : c'est elle qui limite, pas Zn2+ qui est produite."
          - math: 'n(e^-) = 2\,n(\text{Ni}^{2+})_i = 2\,[\text{Ni}^{2+}]_i\,V'
            note: "Demi-equation Ni2+ + 2e- -> Ni : deux electrons par ion Ni2+ consomme."
          - math: 'Q_{max} = n(e^-)\,\mathcal{F} = I\,\Delta t_{max}'
            note: "Meme relation charge-courant-duree que dans toute cette lecon (chapitre 7)."
          - math: '\boxed{\Delta t_{max} = \frac{2\,\mathcal{F}\,[\text{Ni}^{2+}]_i\,V}{I}}'
            note: "Expression physiquement correcte, sur l'espece reellement limitante."
          - math: '\Delta t_{max} = \frac{2\times9{,}65\times10^4\times10^{-2}\times0{,}150}{0{,}1}'
            note: "Application numerique, F=9,65e4 C/mol (unite completee, S3), V=150 mL=0,150 L."
          - math: '\boxed{\Delta t_{max} \approx 2\,895\ \text{s} \approx 48\ \text{min}}'
            note: "Meme valeur numerique qu'avec [Zn2+]i imprime par l'enonce, car les deux concentrations initiales sont egales dans ce sujet (coincidence, pas une regle generale)."
