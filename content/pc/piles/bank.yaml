    intro: |-
      **Étude de la pile fer-zinc (examen national, session de rattrapage 2024 — Exercice 1, Partie 1, 2,25 points).**

      *Parmi les applications des réactions d'oxydoréduction on trouve les piles électrochimiques. Au cours du fonctionnement de ces piles, une partie de l'énergie chimique produite par ces réactions est transformée en énergie électrique.*

      La pile fer-zinc étudiée dans cette partie est composée de deux compartiments (1) et (2) liés par un pont salin.

      Le compartiment (1) contient un volume $V_1$ de solution de sulfate de fer II : $\text{Fe}^{2+}_{(aq)} + \text{SO}_{4(aq)}^{2-}$ de concentration initiale en ion Fer II : $C_1 = \left[\text{Fe}^{2+}_{(aq)}\right]_i$ dans laquelle est plongée une plaque de fer.

      Le compartiment (2) contient un volume $V_2 = V_1$ de solution de sulfate de zinc $\text{Zn}^{2+}_{(aq)} + \text{SO}_{4(aq)}^{2-}$ de concentration initiale en ion zinc : $C_2 = C_1 = \left[\text{Zn}^{2+}_{(aq)}\right]_i$ dans laquelle est plongée une plaque de zinc.

      Un circuit électrique est réalisé en branchant un conducteur ohmique, un ampèremètre et un interrupteur en série avec la pile fer-zinc étudiée.

      L'ampèremètre est branché de façon que sa borne COM (pôle négatif) soit reliée à l'électrode de zinc.

      À un instant de date $t_0 = 0$ on ferme le circuit et l'ampèremètre affiche la valeur constante positive $I = 500\ \text{mA}$ de l'intensité du courant électrique durant $\Delta t = t_1 - t_0 = 10\ \text{min}$.

      **Données.**
      - Couples ox/red intervenant dans la réaction : $\text{Zn}^{2+}_{(aq)}/\text{Zn}_{(s)}$ et $\text{Fe}^{2+}_{(aq)}/\text{Fe}_{(s)}$ ;
      - Constante de Faraday : $1\text{F} = 9{,}65\cdot10^{4}\ \text{C.mol}^{-1}$ ;
      - Masse molaire : $M(\text{Fe}) = 56\ \text{g.mol}^{-1}$.

      On souligne que la réaction modélisant la transformation qui a eu lieu est totale.

      *Aucune figure n'accompagne cette partie : la pile n'est pas schématisée sur le scan. Tout ce qui est nécessaire est dans le texte, y compris le branchement de l'ampèremètre.*
    questions:
      - id: q1
        part: "1- L'électrode positive de la pile"
        stem: |-
          (0,5 pt) Indiquer, en justifiant, l'électrode positive de la pile.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Ici, aucune observation chimique ne t'est offerte : on ne te dit pas qu'une plaque maigrit ou qu'un dépôt apparaît. La seule information de terrain est ÉLECTRIQUE — le branchement de l'ampèremètre et le signe de ce qu'il affiche. C'est donc par l'électricité qu'on entre, et par la chimie qu'on confirme.

          **Ce que dit l'ampèremètre.** Un ampèremètre a deux bornes : la borne COM (marquée $-$) et la borne « A » (marquée $+$). L'appareil est construit et gradué pour afficher une valeur POSITIVE lorsque le courant conventionnel le traverse en ENTRANT par la borne $+$ et en SORTANT par la borne COM. C'est cette convention de branchement — et elle seule — qui donne un sens au mot « positive » dans l'énoncé.

          Ici, l'énoncé dit deux choses qu'il faut lire ensemble :
          - la borne COM est reliée à l'électrode de zinc ;
          - l'affichage est une valeur constante **positive**, $I = 500\ \text{mA}$.

          Le courant sort donc de l'ampèremètre par la borne COM, c'est-à-dire qu'il **arrive sur l'électrode de zinc** en venant du circuit extérieur.

          **Ce qu'on en déduit sur la pile.** Dans le circuit extérieur, le courant conventionnel circule du pôle $+$ vers le pôle $-$ (chapitre 5 : c'est le sens inverse du déplacement réel des électrons). Le courant qui ARRIVE sur le zinc y termine son trajet extérieur : le zinc est donc le pôle $-$, et il ne reste qu'une possibilité pour l'autre.

          $$\boxed{\text{L’électrode positive de la pile est l’électrode de fer.}}$$

          **Le contrôle chimique qui confirme.** Le pôle $+$ est la cathode, siège de la réduction (chapitre 4). Du côté du fer, avec le couple $\text{Fe}^{2+}/\text{Fe}$, la réduction s'écrit $\text{Fe}^{2+} + 2\,e^- \rightarrow \text{Fe}$ : la plaque de fer s'épaissit. Du côté du zinc, pôle $-$, donc anode : $\text{Zn} \rightarrow \text{Zn}^{2+} + 2\,e^-$, la plaque de zinc se consomme. Les deux couples de l'énoncé sont bien mobilisés, chacun dans le sens qui convient : l'ensemble est cohérent. C'est exactement ce que la question 3 va chiffrer, en pesant le fer GAGNÉ.

          **Le piège nommé de cette question : conclure sur le seul mot « COM ».** Beaucoup lisent « COM = pôle négatif de l'ampèremètre, COM est relié au zinc, donc le zinc est le pôle négatif » — et tombent, par chance, sur la bonne réponse avec un raisonnement faux. Le branchement SEUL ne décide de rien : si le courant circulait dans l'autre sens, le même branchement donnerait un affichage NÉGATIF. C'est la conjonction « COM sur le zinc » **et** « affichage positif » qui tranche. L'énoncé a écrit le mot « positive » exprès ; s'il l'avait omis, la question serait indécidable.

          **Et pourquoi le critère $Q_{r,i}$ contre $K$ ne sert pas ici.** Le réflexe du chapitre 3 serait de comparer $Q_{r,i} = \dfrac{[\text{Zn}^{2+}]_i}{[\text{Fe}^{2+}]_i}$ à $K$. Comme l'énoncé impose $C_2 = C_1$, on obtient bien $Q_{r,i} = 1$ — mais $K$ n'est PAS donné. Le critère est donc muet, et c'est délibéré : ce sujet-là te fait entrer par la mesure électrique. Ne va pas inventer une valeur de $K$, et n'invoque pas de potentiels standards $E°$ : ils ne sont pas au programme.
      - id: q2
        part: "2- Les équations aux électrodes et le bilan"
        stem: |-
          (0,75 pt) Écrire l'équation de la réaction au niveau de chaque électrode, et déduire l'équation bilan lors du fonctionnement de la pile.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le bilan d'une pile s'obtient toujours en trois temps : écrire chaque demi-réaction DANS LE SENS où elle se produit réellement (ce que la question 1 vient de fixer), équilibrer les électrons cédés avec les électrons captés, puis additionner. Les électrons ne sont ni réactif ni produit du bilan : ils doivent disparaître.

          **À l'électrode de zinc** — pôle $-$, donc anode, donc oxydation :

          $$\text{Zn}_{(s)} \longrightarrow \text{Zn}^{2+}_{(aq)} + 2\,e^-$$

          **À l'électrode de fer** — pôle $+$, donc cathode, donc réduction :

          $$\text{Fe}^{2+}_{(aq)} + 2\,e^- \longrightarrow \text{Fe}_{(s)}$$

          **L'équilibrage des électrons.** Le zinc en libère $2$, le fer en capte $2$ : les comptes tombent déjà juste, aucun coefficient multiplicateur n'est nécessaire. On additionne directement, et les $2\,e^-$ se simplifient de part et d'autre :

          $$\boxed{\text{Zn}_{(s)} + \text{Fe}^{2+}_{(aq)} \longrightarrow \text{Zn}^{2+}_{(aq)} + \text{Fe}_{(s)}}$$

          **Le contrôle.** Conservation des éléments : un zinc et un fer de chaque côté. Conservation de la charge : $+2$ à gauche (l'ion $\text{Fe}^{2+}$), $+2$ à droite (l'ion $\text{Zn}^{2+}$). Les ions sulfate $\text{SO}_4^{2-}$ et les ions du pont salin ne figurent pas dans le bilan : ce sont des spectateurs, ils n'échangent aucun électron.

          **Le piège nommé de cette question : le réflexe de multiplier.** Sur la plupart des piles au programme — argent-chrome, nickel-argent — les deux demi-équations n'échangent pas le même nombre d'électrons, et il faut multiplier l'une d'elles avant de sommer. Ce geste devient si automatique qu'on l'applique ici sans regarder, et on écrit des monstres du type $2\,\text{Zn} + 2\,\text{Fe}^{2+} \rightarrow \ldots$ — juste chimiquement, mais non simplifié, donc sanctionné. Compte les électrons AVANT de multiplier : ici, $2$ contre $2$, il n'y a rien à faire.

          **Le second piège, plus grave : le sens d'écriture.** Le couple $\text{Zn}^{2+}/\text{Zn}$ se note conventionnellement oxydant sur réducteur, ce qui pousse à écrire $\text{Zn}^{2+} + 2\,e^- \rightarrow \text{Zn}$. C'est la RÉDUCTION du zinc — l'inverse de ce qui se passe dans cette pile. Une demi-équation d'électrode s'écrit toujours dans le sens réellement observé, jamais dans le sens de la notation du couple.
      - id: q3
        part: "3- La variation de masse de la plaque de fer"
        stem: |-
          (1 pt) La pile fonctionne pendant la durée $\Delta t = 10\ \text{min}$. Montrer que la variation de la masse de la plaque de fer a pour expression $\Delta m = \dfrac{I.\Delta t.M(\text{Fe})}{2.F}$. Calculer sa valeur.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'énoncé demande d'abord une EXPRESSION LITTÉRALE, ensuite seulement un nombre — c'est la consigne imprimée en tête du sujet (« On donnera les expressions littérales avant de passer aux applications numériques »). La chaîne est toujours la même, et elle a trois maillons : la charge débitée donne les électrons, les électrons donnent la matière par la stœchiométrie de l'électrode considérée, la matière donne la masse par la masse molaire.

          **Maillon 1 — de la durée aux électrons.** À intensité constante, la charge débitée vaut $Q = I\,\Delta t$ ; et une mole d'électrons transporte la charge $F$, donc $Q = n(e^-)\,F$ (chapitre 7). En égalant les deux :

          $$n(e^-) = \frac{I\,\Delta t}{F}$$

          **Maillon 2 — des électrons au fer.** On raisonne sur la demi-équation de l'électrode ÉTUDIÉE, celle de fer (question 2) : $\text{Fe}^{2+} + 2\,e^- \rightarrow \text{Fe}$. Chaque atome de fer déposé consomme $2$ électrons, donc :

          $$n(\text{Fe}) = \frac{n(e^-)}{2} = \frac{I\,\Delta t}{2\,F}$$

          **Maillon 3 — du fer à la masse.** La plaque de fer GAGNE ce métal (c'est la cathode) : sa variation de masse $\Delta m = m_{\text{finale}} - m_{\text{initiale}}$ est donc positive et vaut $n(\text{Fe})\times M(\text{Fe})$ :

          $$\boxed{\Delta m = \frac{I\,\Delta t\,M(\text{Fe})}{2\,F}}$$

          C'est bien l'expression demandée. Remarque au passage que le $2$ du dénominateur n'est pas une constante universelle : c'est le nombre d'électrons de la demi-équation du fer. Avec un ion $\text{Cr}^{3+}$, ce serait un $3$.

          **L'application numérique, avec les conversions faites d'abord.**

          $$I = 500\ \text{mA} = 0{,}500\ \text{A} \qquad \Delta t = 10\ \text{min} = 600\ \text{s}$$

          $$\Delta m = \frac{0{,}500 \times 600 \times 56}{2 \times 9{,}65\cdot10^{4}} = \frac{16\,800}{1{,}93\cdot10^{5}}$$

          $$\boxed{\Delta m \approx 8{,}7\cdot10^{-2}\ \text{g} \quad (\text{soit } 87\ \text{mg gagnés par la plaque de fer})}$$

          **Le contrôle chiffre par chiffre.** Refais-le dans l'autre ordre pour vérifier : $Q = 0{,}500\times600 = 300\ \text{C}$ ; $n(e^-) = 300 / 9{,}65\cdot10^{4} = 3{,}11\cdot10^{-3}\ \text{mol}$ ; $n(\text{Fe}) = 1{,}55\cdot10^{-3}\ \text{mol}$ ; $\Delta m = 1{,}55\cdot10^{-3} \times 56 = 8{,}7\cdot10^{-2}\ \text{g}$. Même valeur — le calcul littéral n'a pas dérapé. (La division exacte donne $0{,}08705$ g ; on garde deux chiffres significatifs, comme les données.)

          **Le piège nommé de cette question : le signe.** Sur la pile argent-chrome (2020 normale, autre entrée de cette banque), la même loi de Faraday donne un $\Delta m$ NÉGATIF — parce que l'électrode qu'on y étudie, le chrome, est l'ANODE : elle se dissout. Ici, l'électrode étudiée est le fer, qui est la CATHODE : elle s'épaissit, $\Delta m$ est POSITIF. Le mot « variation » de l'énoncé n'est pas synonyme de « perte ». Et l'expression que le sujet te demande d'établir ne porte aucun signe moins : c'est ta vérification — si ton raisonnement t'amenait à un $\Delta m$ négatif, il contredirait la formule imposée, et c'est ton identification de la polarité (question 1) qu'il faudrait reprendre.

          **Les deux conversions à ne pas rater.** Les milliampères en ampères (facteur $10^{3}$) et les minutes en secondes (facteur $60$). Oublier la seconde conversion donne $1{,}45\cdot10^{-4}$ g, soit une plaque qui gagne un dixième de milligramme en dix minutes — invraisemblable pour un demi-ampère.

