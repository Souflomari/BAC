    title: "Étude d'une pile argent-chrome : anode, schéma conventionnel, équations et usure par la quantité d'électricité"
    source:
      year: 2020
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice I — Partie 2 : étude de la pile argent-chrome"
    bareme_total: 2.25
