    intro: |-
      **Étude d'une pile argent-chrome (examen national, session normale 2020).**

      Cette partie se propose d'étudier une pile électrochimique. Cette pile est constituée :

      - d'une électrode en chrome ($Cr$) plongée dans une solution aqueuse de nitrate de chrome (III) $Cr^{3+}_{(aq)} + 3\,NO_3^{-}{}_{(aq)}$ ;
      - d'une électrode en argent ($Ag$) plongée dans une solution aqueuse de nitrate d'argent $Ag^{+}_{(aq)} + NO_3^{-}{}_{(aq)}$ ;
      - d'un pont salin qui relie les deux solutions.

      On branche un conducteur ohmique en série avec un ampèremètre, et on place le dipôle, ainsi constitué, entre les pôles de la pile (figure 2). L'ampèremètre indique le passage d'un courant électrique, d'intensité constante, dans le circuit. Après une durée $\Delta t$ de fonctionnement de la pile, on observe un dépôt sur l'électrode d'argent et une diminution de la masse de l'électrode de chrome.

      **Données :** masse molaire du chrome $M(Cr) = 52\ \text{g.mol}^{-1}$ ; $1\,\text{F} = 96500\ \text{C.mol}^{-1}$.

      *Figure 2 (schéma de la pile, décrite en mots) :* deux béchers reliés par un pont salin. Bécher de gauche : électrode $Ag$ dans une solution $Ag^{+}_{(aq)} + NO_3^{-}{}_{(aq)}$. Bécher de droite : électrode $Cr$ dans une solution $Cr^{3+}_{(aq)} + 3\,NO_3^{-}{}_{(aq)}$. En partie haute, un conducteur ohmique en série avec un ampèremètre relie les deux électrodes.
    questions:
      - id: q1
        part: "Partie 2 — Identifier le fonctionnement de la pile"
        stem: |-
          **(0,5 pt)** Préciser l'anode de la pile. Justifier.
        reasoning: |-
          Ne pars pas d'une règle apprise « électrode par électrode » — c'est exactement le piège testé en R3 (« réduction, ça diminue, donc c'est négatif »). Pars de l'observation expérimentale, elle décide tout. La masse de l'électrode de chrome **diminue** : du chrome métallique disparaît donc de la lame, ce qui signifie qu'il est **oxydé**, $Cr \rightarrow Cr^{3+} + 3\,e^-$. Or, par définition (R3), l'électrode où se produit l'oxydation est l'**anode**. L'électrode de chrome est donc l'anode. Le dépôt observé sur l'argent confirme la cohérence de l'ensemble : c'est la trace d'une réduction $Ag^{+} + e^- \rightarrow Ag$, donc l'argent est la cathode.
      - id: q2
        stem: |-
          **(0,5 pt)** Représenter le schéma conventionnel de la pile.
        reasoning: |-
          La polarité vient directement de R3 : l'anode (le chrome, siège de l'oxydation établi à la question 1) est la borne −, la cathode (l'argent, siège de la réduction) est la borne +. Le schéma conventionnel s'écrit ensuite selon une convention d'écriture fixe, utilisée sur toutes les annales : la borne − à gauche, la borne + à droite, une barre simple pour chaque interface électrode/solution, une double barre pour le pont salin qui sépare les deux demi-piles.
        steps:
          - math: '(-)\ Cr_{(s)}\ \vert\ Cr^{3+}_{(aq)}\ \Vert\ Ag^{+}_{(aq)}\ \vert\ Ag_{(s)}\ (+)'
            note: "Anode (borne moins, chrome) a gauche ; cathode (borne plus, argent) a droite ; barre simple = interface electrode-solution, double barre = pont salin."
      - id: q3
        stem: |-
          **(0,75 pt)** Écrire les équations aux électrodes ainsi que l'équation bilan lors du fonctionnement de la pile.
        reasoning: |-
          Chaque électrode est le siège d'une demi-réaction : oxydation à l'anode (le chrome, question 1), réduction à la cathode (l'argent). On écrit chaque demi-équation, puis on ne peut les sommer que si le nombre d'électrons échangés est le même de part et d'autre. Le chrome libère 3 électrons, l'argent n'en capte qu'un : on multiplie donc la demi-équation de l'argent par 3 avant d'additionner, et les électrons — qui ne sont ni réactif ni produit de la réaction globale — disparaissent de l'équation bilan.
        steps:
          - math: 'Cr \rightarrow Cr^{3+} + 3\,e^-'
            note: "A l'anode : oxydation du chrome (l'electrode dont la masse diminue), 3 electrons liberes."
          - math: 'Ag^{+} + e^- \rightarrow Ag'
            note: "A la cathode : reduction des ions argent (le depot observe sur l'electrode d'argent), 1 electron capte."
          - math: '3\,Ag^{+} + 3\,e^- \rightarrow 3\,Ag'
            note: "On multiplie la reduction par 3 pour que les 3 electrons liberes par le chrome soient tous captes, condition pour pouvoir sommer."
          - math: 'Cr + 3\,Ag^{+} \rightarrow Cr^{3+} + 3\,Ag'
            note: "Equation bilan : somme des deux demi-equations equilibrees ; les electrons s'annulent."
      - id: q4
        part: "Partie 2 — Quantifier l'usure de l'électrode de chrome"
        stem: |-
          **(0,5 pt)** Sachant que la quantité d'électricité débitée par la pile pendant la durée $\Delta t$ est $Q = 5{,}79\ \text{C}$, déterminer la variation $\Delta m$ de la masse de l'électrode de chrome.
        reasoning: |-
          La charge débitée porte l'information sur le nombre d'électrons échangés, via $Q = n(e^-)\,F$ (R6). Ici $Q$ est donné directement — pas besoin de $Q = I\,\Delta t$ — donc on convertit d'abord en moles d'électrons en divisant par $F$. On passe ensuite des électrons au chrome par la stœchiométrie de la demi-équation de la question 3 : chaque atome de chrome oxydé libère 3 électrons, donc $n(Cr) = n(e^-)/3$. On termine par $m = n\,M$. La variation $\Delta m$ est négative : c'est le même constat qu'au « teste l'idée avant de la croire » de R6 — une pile qui débite s'use réellement, la lame de chrome perd de la masse de façon irréversible.
        steps:
          - math: 'n(e^-) = \frac{Q}{F} = \frac{5{,}79}{96500} = 6{,}0\times10^{-5}\ \text{mol}'
            note: "Conversion de la charge debitee en quantite de matiere d'electrons, via la constante de Faraday (rung R6)."
          - math: 'n(Cr) = \frac{n(e^-)}{3} = \frac{6{,}0\times10^{-5}}{3} = 2{,}0\times10^{-5}\ \text{mol}'
            note: "Stoechiometrie de l'oxydation Cr -> Cr3+ + 3 e- (question 3) : 3 electrons par atome de chrome consomme."
          - math: '\Delta m = -\,n(Cr)\times M(Cr) = -\,2{,}0\times10^{-5}\times 52 \approx -1{,}0\times10^{-3}\ \text{g}'
            note: "Signe negatif : la masse de l'electrode de chrome diminue. Environ 1,0 mg de chrome a quitte la lame."
