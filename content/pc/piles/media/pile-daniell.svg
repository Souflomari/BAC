<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Schéma de la pile Daniell : deux demi-piles séparées (zinc/Zn2+ à gauche, cuivre/Cu2+ à droite), reliées par un fil extérieur passant par un ampèremètre et par un pont salin. Le zinc est l'anode (borne moins, oxydation) ; le cuivre est la cathode (borne plus, réduction). Les électrons circulent dans le fil de gauche à droite (du zinc vers le cuivre) ; le courant conventionnel circule en sens inverse, de droite à gauche.">
  <title>Pile Daniell</title>

  <!--
    pile-daniell.svg — schéma STATIQUE de la pile Daniell (deux demi-piles).

    Layout :
      Demi-pile gauche (anode)  : bécher x=110..270, électrode Zn centrée x=190
      Demi-pile droite (cathode): bécher x=370..530, électrode Cu centrée x=450
      Fil extérieur (haut)      : verticales x=190 et x=450 (y=95..45), horizontale
                                  y=45, ampèremètre A inséré au centre (320,45)
      Pont salin                : arc bas, relie les deux parois internes des
                                  béchers (270,150)→(370,150), apex ~y=93

    Convention de couleur (5 tokens seulement, comme demandé) :
      structure (béchers, électrodes, fil, pont salin, texte de rôle) : --figure-ink / --figure-ink-soft
      solution / gel du pont salin (remplissage neutre)                : --figure-grid
      fond de l'ampèremètre                                            : --figure-surface
      SEULE emphase de la figure : le sens de circulation des électrons
        (--figure-accent) — le mécanisme que ce rung enseigne (« forcer
        les électrons à faire un détour »). Le sens du courant conventionnel
        est montré aussi (car indissociable du sens des électrons) mais reste
        en --figure-ink-soft, pour qu'une seule direction porte l'accent.

    Sens physique retenu (cohérent avec le rung 4 de la leçon, qui décrit
    littéralement ce schéma) : zinc à gauche (anode, borne −), cuivre à
    droite (cathode, borne +) ; électrons de gauche à droite dans le fil
    extérieur ; courant conventionnel de droite à gauche.

    Simplifications assumées (schéma pédagogique, pas à l'échelle) :
      - le pont salin est représenté comme un simple tube arqué rempli de
        gel, raccordé au niveau du bord des béchers (et non physiquement
        plongé dans la solution) ;
      - les ions spectateurs (SO4^2-) ne sont pas dessinés dans les béchers :
        seule l'espèce du couple oxydant/réducteur est étiquetée, pour ne
        garder que les traits essentiels au mécanisme ;
      - K+ / NO3- servent d'exemple illustratif d'ions inertes du pont salin
        (repris tel quel du texte de la leçon), pas les seuls ions possibles ;
      - électrons et courant sont dessinés sur deux segments distincts du
        même fil (au lieu de deux flèches superposées) pour rester lisibles.
  -->

  <!-- Titre -->
  <text x="320" y="24" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Pile Daniell</text>

  <!-- ══════════════ Bécher gauche (anode, Zn) ══════════════ -->
  <path d="M110,175 L110,310 Q110,330 130,330 L250,330 Q270,330 270,310 L270,175 Z"
        fill="var(--figure-grid)" opacity="0.6" stroke="none"/>
  <line x1="110" y1="175" x2="270" y2="175" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <path d="M110,150 L110,310 Q110,330 130,330 L250,330 Q270,330 270,310 L270,150"
        fill="none" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>

  <!-- ══════════════ Bécher droit (cathode, Cu) ══════════════ -->
  <path d="M370,175 L370,310 Q370,330 390,330 L510,330 Q530,330 530,310 L530,175 Z"
        fill="var(--figure-grid)" opacity="0.6" stroke="none"/>
  <line x1="370" y1="175" x2="530" y2="175" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <path d="M370,150 L370,310 Q370,330 390,330 L510,330 Q530,330 530,310 L530,150"
        fill="none" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>

  <!-- Étiquettes des solutions (espèce du couple, ions spectateurs omis) -->
  <text x="205" y="250" text-anchor="start" font-size="11" fill="var(--figure-ink-soft)"
        ><tspan font-style="italic">Zn</tspan><tspan dy="-5" font-size="7.5" font-style="normal">2+</tspan><tspan dy="5"> (aq)</tspan></text>
  <text x="435" y="250" text-anchor="end" font-size="11" fill="var(--figure-ink-soft)"
        ><tspan font-style="italic">Cu</tspan><tspan dy="-5" font-size="7.5" font-style="normal">2+</tspan><tspan dy="5"> (aq)</tspan></text>

  <!-- ══════════════ Électrodes ══════════════ -->
  <rect x="182" y="95" width="16" height="175" rx="2"
        fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1.2"/>
  <rect x="442" y="95" width="16" height="175" rx="2"
        fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1.2"/>
  <text x="190" y="122" text-anchor="middle" font-size="12" font-weight="600" font-style="italic"
        fill="var(--figure-surface)">Zn</text>
  <text x="450" y="122" text-anchor="middle" font-size="12" font-weight="600" font-style="italic"
        fill="var(--figure-surface)">Cu</text>

  <!-- ══════════════ Fil extérieur + ampèremètre ══════════════ -->
  <line x1="190" y1="95" x2="190" y2="45" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <line x1="450" y1="95" x2="450" y2="45" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <line x1="190" y1="45" x2="306" y2="45" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <line x1="334" y1="45" x2="450" y2="45" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="190" cy="95" r="3" fill="var(--figure-ink)"/>
  <circle cx="450" cy="95" r="3" fill="var(--figure-ink)"/>
  <circle cx="190" cy="45" r="3" fill="var(--figure-ink)"/>
  <circle cx="450" cy="45" r="3" fill="var(--figure-ink)"/>

  <circle cx="320" cy="45" r="14" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.8"/>
  <text x="320" y="49.5" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink)">A</text>

  <!-- Sens des électrons (SEUL trait en accent — le mécanisme de ce rung) -->
  <line x1="205" y1="45" x2="270" y2="45" stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="270,45 256,39.5 256,50.5" fill="var(--figure-accent)"/>
  <text x="237" y="32" text-anchor="middle" font-size="13" fill="var(--figure-accent)"
        ><tspan font-style="italic">e</tspan><tspan dy="-6" font-size="9" font-style="normal">−</tspan></text>

  <!-- Sens du courant conventionnel (segment opposé, ink-soft, pas d'accent) -->
  <line x1="435" y1="45" x2="370" y2="45" stroke="var(--figure-ink-soft)" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="370,45 384,39.5 384,50.5" fill="var(--figure-ink-soft)"/>
  <text x="402" y="32" text-anchor="middle" font-size="14" font-style="italic" fill="var(--figure-ink-soft)">I</text>

  <!-- ══════════════ Pont salin ══════════════ -->
  <path d="M270,150 Q320,35 370,150" fill="none" stroke="var(--figure-grid)" stroke-width="10" stroke-linecap="round"/>
  <path d="M270,150 Q320,35 370,150" fill="none" stroke="var(--figure-ink)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="270" cy="150" r="2.5" fill="var(--figure-ink)"/>
  <circle cx="370" cy="150" r="2.5" fill="var(--figure-ink)"/>
  <text x="320" y="108" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)">pont salin</text>

  <!-- Migration ionique dans le pont salin (anions vers l'anode, cations vers la cathode) -->
  <line x1="260" y1="150" x2="240" y2="170" stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="0,0 -8,-4.5 -8,4.5" fill="var(--figure-ink-soft)" transform="translate(240,170) rotate(135)"/>
  <text x="238" y="184" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)"
        ><tspan font-style="italic">NO</tspan><tspan dy="4" font-size="7" font-style="normal">3</tspan><tspan dy="-8" font-size="7" font-style="normal">−</tspan></text>

  <line x1="380" y1="150" x2="400" y2="170" stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="0,0 -8,-4.5 -8,4.5" fill="var(--figure-ink-soft)" transform="translate(400,170) rotate(45)"/>
  <text x="402" y="184" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)"
        ><tspan font-style="italic">K</tspan><tspan dy="-5" font-size="7" font-style="normal">+</tspan></text>

  <!-- ══════════════ Étiquettes de rôle (anode / cathode) ══════════════ -->
  <text x="8" y="190" text-anchor="start" font-size="12" font-weight="600" fill="var(--figure-ink)">ANODE</text>
  <text x="8" y="204" text-anchor="start" font-size="10" fill="var(--figure-ink-soft)">(borne −)</text>
  <text x="8" y="220" text-anchor="start" font-size="10" fill="var(--figure-ink-soft)">oxydation</text>
  <text x="8" y="236" text-anchor="start" font-size="9.5" fill="var(--figure-ink)"
        ><tspan font-style="italic">Zn</tspan><tspan> → </tspan><tspan font-style="italic">Zn</tspan><tspan dy="-4" font-size="7" font-style="normal">2+</tspan><tspan dy="4"> + 2</tspan><tspan font-style="italic">e</tspan><tspan dy="-4" font-size="7" font-style="normal">−</tspan></text>

  <text x="632" y="190" text-anchor="end" font-size="12" font-weight="600" fill="var(--figure-ink)">CATHODE</text>
  <text x="632" y="204" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">(borne +)</text>
  <text x="632" y="220" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">réduction</text>
  <text x="632" y="236" text-anchor="end" font-size="9.5" fill="var(--figure-ink)"
        ><tspan font-style="italic">Cu</tspan><tspan dy="-4" font-size="7" font-style="normal">2+</tspan><tspan dy="4"> + 2</tspan><tspan font-style="italic">e</tspan><tspan dy="-4" font-size="7" font-style="normal">−</tspan><tspan dy="4"> → </tspan><tspan font-style="italic">Cu</tspan></text>

</svg>
