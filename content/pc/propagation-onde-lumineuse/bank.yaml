    intro: |-
      **Étude du phénomène de diffraction de la lumière (examen national, session de rattrapage 2012 — exercice « Les ondes », 2,50 points).**

      Les rayons lasers sont utilisés dans plusieurs domaines tels que la métallurgie, l'ophtalmologie et opérations chirurgicales *(sic — « et les opérations » attendu)* … Ils sont aussi utilisés pour  la *(sic — double espace réel, contrôlé au caractère)* détermination des dimensions microscopiques de quelques corps.

      Cet exercice vise la détermination de la longueur d'onde d'une onde électromagnétique, et la détermination du diamètre d'un fil fin métallique en exploitant le phénomène de diffraction.

      On envoie, à l'aide d'une source laser, un faisceau de lumière monochromatique de longueur d'onde $\lambda$, sur une plaque contenant une **fente verticale** de largeur $a = 0{,}06\ \text{mm}$, on observe un phénomène de diffraction sur un écran vertical situé à une distance $D = 1{,}5\ \text{m}$ de la plaque.

      La mesure de la longueur de la frange centrale *(sic — l'original arabe écrit « la LARGEUR de la TACHE lumineuse centrale », et l'édition française se contredit elle-même : sa propre question 4 dira « la largeur de la tâche centrale ». Sans conséquence — c'est la même grandeur, mesurée de la même façon, et la relation qui en découle est la même)* donne $L_1 = 3{,}5\ \text{cm}$. (Figure ci-contre)

      **La figure du dispositif** *(elle n'a ni échelle ni graduation : les quatre données $a$, $D$, $L_1$, $L_2$ sont toutes dans le texte, et aucune question ne lit ce dessin)* **.** Perspective cavalière, de gauche à droite :

      - à gauche, un **rectangle horizontal étiqueté « Laser »**, terminé à droite par un petit rectangle gris — la sortie du faisceau ;
      - un **trait gras horizontal** part de cette sortie vers la droite : le faisceau incident ;
      - au centre, un **parallélogramme** vu en perspective (côtés gauche et droit verticaux, bords haut et bas obliques descendant vers la droite), étiqueté **« Plaque »** ; il porte en son milieu un **trait vertical gris fin** — la fente ;
      - à droite, un **second parallélogramme plus grand**, même perspective, étiqueté **« Écran »** ;
      - sur l'écran, la **figure de diffraction** : une grande **ellipse noire pleine** — la tache centrale — et **quatre ellipses plus petites**, deux au-dessus-gauche et deux au-dessous-droite, toutes alignées avec la grande sur une **oblique descendante vers la droite**. Cette oblique *est* la direction horizontale de l'écran dans cette perspective : le motif est donc bien **perpendiculaire à la fente verticale**, comme la physique l'exige ;
      - une **double flèche** parallèle à cette oblique, étiquetée $L_1$, couvre exactement la grande ellipse ;
      - depuis la fente partent **deux traits fins** délimitant l'ouverture du faisceau diffracté jusqu'aux bords de la tache centrale ; un **trait horizontal en pointillés** prolonge l'axe du laser jusqu'à l'écran, et l'angle entre ce pointillé et le trait supérieur porte l'étiquette $\theta$ ;
      - en bas, entre deux **verticales en pointillés** tombant de la plaque et de l'écran, une **double flèche horizontale étiquetée $D$**.
    questions:
      - id: q1
        part: "Les ondes — Étude du phénomène de diffraction de la lumière"
        stem: |-
          **1-** (0,5 pt) Quelle est la condition que doit satisfaire la largeur $a$ de la fente pour que le phénomène de diffraction se produise ?
        reasoning: |-
          La diffraction n'est pas un phénomène de seuil brutal — elle existe toujours — mais elle n'est **observable** que si l'obstacle ou l'ouverture a une taille **comparable à la longueur d'onde** (chapitre 4). La condition attendue est donc :

          $$a \lesssim \lambda \qquad \text{ou, sous la forme usuelle du programme,} \qquad \frac{\lambda}{a} > 10^{-3}$$

          **Pourquoi ce rapport, et pas une taille absolue.** L'écart angulaire du faisceau diffracté vaut $\theta = \dfrac{\lambda}{a}$ : c'est ce **rapport sans dimension** qui décide de tout. Si $a$ est très grande devant $\lambda$, $\theta$ est si petit que le faisceau traverse sans s'ouvrir de façon perceptible — la lumière semble aller tout droit. Si $a$ est de l'ordre de $\lambda$, $\theta$ devient appréciable et la tache s'étale visiblement sur l'écran.

          **Le contrôle sur les valeurs de cet exercice, qui vaut d'être fait.** Ici $a = 0{,}06\ \text{mm} = 6\times10^{-5}\ \text{m}$ et l'on trouvera $\lambda = 7\times10^{-7}\ \text{m}$ : le rapport vaut $\dfrac{7\times10^{-7}}{6\times10^{-5}} \approx 1{,}2\times10^{-2}$, largement au-dessus de $10^{-3}$. La condition est bien remplie — l'expérience de l'énoncé a un sens.

          **⚠️ Le piège de cette question, et il est du bon côté du bon sens.** Croire que « plus la fente est large, plus ça diffracte ». C'est exactement l'inverse : la diffraction est d'autant plus marquée que l'ouverture est **étroite**. Une fente large laisse passer un pinceau qui garde sa forme ; une fente étroite épanouit la lumière. C'est le point d'arrêt explicite du chapitre 4, et c'est celui qu'on retrouve en tête des erreurs de copie.
      - id: q2
        stem: |-
          **2-** (0,5 pt) Quelle est la nature de la lumière mise en évidence par cette expérience ?
        reasoning: |-
          La diffraction met en évidence la **nature ONDULATOIRE** de la lumière.

          **Pourquoi c'est une preuve, et pas une simple illustration.** La diffraction est un comportement que **seule une onde** peut avoir. Un flux de particules classiques traversant une ouverture continuerait tout droit et projetterait sur l'écran l'ombre géométrique de la fente — une bande nette, de la largeur de la fente, sans rien autour. Ce que l'on observe est autre chose : la lumière **s'étale au-delà** de l'ombre géométrique, et elle s'organise en une tache centrale large flanquée de taches secondaires. Cet étalement en franges est la signature d'un phénomène ondulatoire, exactement comme pour une onde à la surface de l'eau franchissant une ouverture.

          **Ce que la question ne demande pas, mais qu'il faut savoir ne pas dire.** Elle ne demande pas la nature de la lumière « en général » — l'aspect corpusculaire (le photon) existe aussi, et se manifeste dans d'autres expériences, comme l'effet photoélectrique. La question porte sur ce que **cette expérience-ci** met en évidence, et cette expérience-ci ne montre que l'onde. Répondre « la lumière est à la fois onde et particule » n'est pas faux dans l'absolu mais rate la question posée.

          **Une remarque qui prolonge, et qui n'est pas demandée.** Ce même dispositif montre une seconde chose : la lumière du laser est **monochromatique**, l'énoncé le dit. C'est ce qui permet à la question 3 de parler d'**une** longueur d'onde $\lambda$ — en lumière blanche, chaque couleur donnerait sa propre tache, de largeur différente, et l'on verrait des irisations au lieu d'une tache nette.
      - id: q3
        stem: |-
          **3-** (0,75 pt) Exprimer $\lambda$ en fonction de $L_1$, $D$ et $a$. calculer sa valeur. *(sic — le sujet imprime « calculer » avec une minuscule après le point)*

          *(On considère $\tan\theta \approx \theta$ pour les petit angles)* *(sic)*
        reasoning: |-
          Deux relations, et il faut les tenir séparées avant de les joindre — c'est la seule difficulté de la question.

          **Relation n° 1 — la géométrie du triangle.** Le demi-angle d'ouverture $\theta$ est celui que fait, avec l'axe, le trait qui va de la fente au **bord** de la tache centrale. Dans le triangle rectangle formé par la fente, le centre de la tache et son bord :

          $$\tan\theta = \frac{L_1/2}{D} = \frac{L_1}{2D}$$

          Le facteur $2$ vient de là et de nulle part ailleurs : $L_1$ est la largeur **totale** de la tache centrale, et l'angle $\theta$ n'en couvre que la **moitié**. C'est le point où se perdent le plus de copies.

          L'énoncé autorise ensuite $\tan\theta \approx \theta$ — légitime, puisque $\theta$ vaut ici environ $0{,}012\ \text{rad}$, soit $0{,}7°$.

          **Relation n° 2 — la physique de la diffraction** (chapitre 4) : l'écart angulaire ne dépend que de la longueur d'onde et de la largeur de la fente,

          $$\theta = \frac{\lambda}{a}$$

          **La jonction.** Les deux expressions décrivent le **même** angle, on les égale :

          $$\frac{\lambda}{a} = \frac{L_1}{2D} \qquad \Longrightarrow \qquad \boxed{\lambda = \frac{a\,L_1}{2D}}$$

          **L'application numérique, en convertissant TOUT en unités SI d'abord** — $a = 0{,}06\ \text{mm} = 6\times10^{-5}\ \text{m}$, $L_1 = 3{,}5\ \text{cm} = 3{,}5\times10^{-2}\ \text{m}$, $D = 1{,}5\ \text{m}$ :

          $$\lambda = \frac{6\times10^{-5} \times 3{,}5\times10^{-2}}{2 \times 1{,}5} = \frac{2{,}1\times10^{-6}}{3} = 7{,}0\times10^{-7}\ \text{m} = 700\ \text{nm}$$

          **Le contrôle de vraisemblance, et il ferme.** $700\ \text{nm}$ tombe dans le visible, tout au bout du **rouge** — la couleur des lasers de démonstration les plus courants (hélium-néon, $633\ \text{nm}$ ; diodes rouges, $650$ à $700\ \text{nm}$). Un résultat en dehors de la fourchette $400$–$800\ \text{nm}$ signalerait une erreur de conversion : la lumière ne serait pas visible, et l'expérience de l'énoncé n'aurait pas pu se faire à l'œil.

          **Les deux pièges de cette question.** Le premier : **oublier le facteur $2$** et écrire $\tan\theta = L_1/D$, ce qui double $\lambda$ et donne $1400\ \text{nm}$ — de l'infrarouge, invisible. Le contrôle de vraisemblance l'attrape immédiatement. Le second : **mélanger les unités**, laisser $a$ en millimètres ou $L_1$ en centimètres ; le résultat sort alors décalé d'un facteur $10$, $100$ ou $1000$ sans que le calcul proteste.
        steps:
          - math: '\tan\theta = \frac{L_1/2}{D} = \frac{L_1}{2D} \approx \theta'
            note: "Géométrie du triangle : L1 est la largeur TOTALE de la tache, l'angle theta n'en couvre que la moitié. D'ou le facteur 2."
          - math: '\theta = \frac{\lambda}{a}'
            note: "Écart angulaire de diffraction (chapitre 4) : il ne dépend que de lambda et de a."
          - math: '\boxed{\lambda = \frac{a\,L_1}{2D}}'
            note: "Les deux relations décrivent le même angle : on les égale et on isole lambda."
