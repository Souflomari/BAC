        part: "Dans un milieu d'indice n = 1,5 — la longueur d'onde (et la couleur qui ne bouge pas)"
        stem: |-
          **(0,5 pt)** On considère que la radiation jaune se propage dans un milieu d'indice de réfraction $n_1 = 1{,}5$. Calculer dans ce milieu la longueur d'onde $\lambda_{1j}$ de cette radiation.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On veut la longueur d'onde de la MÊME radiation, mais dans le milieu d'indice $n_1$. Le rung R4 donne le résultat directement ; la question mérite quand même qu'on refasse la démonstration en une ligne, parce que c'est elle qui explique pourquoi la couleur, elle, ne changera pas.

          **La démonstration (rung R4).** La fréquence $\nu$ est imposée par la source et ne change pas quand la lumière franchit l'interface : elle est invariante. La longueur d'onde, elle, est liée à la vitesse locale par $\lambda = v/\nu$. Dans le milieu, $v = V_{1j} = c/n_1$ (question 4-1), donc

          $$\lambda_{1j} = \frac{V_{1j}}{\nu} = \frac{c/n_1}{\nu} = \frac{1}{n_1}\cdot\frac{c}{\nu} = \frac{\lambda_{0j}}{n_1}$$

          puisque $\lambda_{0j} = c/\nu$ est justement la longueur d'onde dans le vide.

          **L'application numérique.**

          $$\lambda_{1j} = \frac{\lambda_{0j}}{n_1} = \frac{580}{1{,}5} = 386{,}66\ldots\ \text{nm}$$

          Là encore la division **ne tombe pas rond** ($580/1{,}5 = 386{,}\overline{6}$) — on le dit au lieu d'arrondir pour faire joli. Avec trois chiffres significatifs :

          $$\boxed{\lambda_{1j} \approx 387\ \text{nm} = 3{,}87\times10^{-7}\ \text{m}}$$

          **Le contrôle qui rassure — par une voie indépendante.** Recalculons sans passer par $\lambda_0/n$, en repartant de la fréquence. Elle vaut

          $$\nu = \frac{c}{\lambda_{0j}} = \frac{3\times10^{8}}{5{,}80\times10^{-7}} \approx 5{,}17\times10^{14}\ \text{Hz}$$

          et cette fréquence est la même dans le milieu. Donc

          $$\lambda_{1j} = \frac{V_{1j}}{\nu} = \frac{2\times10^{8}}{5{,}17\times10^{14}} \approx 3{,}87\times10^{-7}\ \text{m}$$

          Les deux chemins donnent le même nombre : la relation $\lambda = \lambda_0/n$ n'était pas une formule à croire, c'était un raccourci qu'on vient de refaire à la main.

          **Le piège de cette question.** Il est dans la couleur, et il est joliment tendu. $387\ \text{nm}$ tombe, dans le tableau du rung R4, sur la limite du violet — et pourtant cette radiation est et reste **jaune**, même à l'intérieur du milieu. La raison est celle qu'on vient d'utiliser : ce que l'œil interprète comme une couleur dépend de la fréquence $\nu$, et $\nu$ n'a pas bougé. Seule $\lambda$, qui dépend de la vitesse locale, a diminué. C'est exactement pour éviter cette confusion qu'une couleur se désigne toujours par $\lambda_0$, sa longueur d'onde dans le vide. Piège jumeau, dans l'autre sens : répondre « $580\ \text{nm}$, puisque c'est une radiation jaune » — c'est $\lambda_{0j}$, la valeur dans le vide ; dans un milieu la longueur d'onde est TOUJOURS plus petite, puisque $n \geq 1$. Et remarque au passage que cette question est la réfutation chiffrée de la proposition A du QCM de la question 1.
