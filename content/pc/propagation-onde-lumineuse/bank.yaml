          - math: '\boxed{d = \frac{2\lambda D}{L_2}}'
            note: "Expression littérale, demandee avant l'application numérique (consigne de la page 1 du sujet)."
          - math: 'd = \frac{2 \times 7{,}0\times10^{-7} \times 1{,}5}{2{,}8\times10^{-2}} = \frac{2{,}1\times10^{-6}}{2{,}8\times10^{-2}}'
            note: "Lambda et D sont inchanges : même laser, même écran. Seule la largeur de tache a change."
          - math: '\boxed{d = 7{,}5\times10^{-5}\ \text{m} = 75\ \mu\text{m}}'
            note: "Controle : la tache est plus étroite (2,8 contre 3,5 cm) donc l'obstacle est plus large (75 contre 60 micrometres). Le rapport 3,5/2,8 = 1,25 est bien l'inverse de 75/60."
