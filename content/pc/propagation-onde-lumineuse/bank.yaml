    intro: |-
      **Ondes lumineuses (examen national, session de rattrapage 2025 — Exercice 2, 2,5 points).**

      Cet exercice vise à déterminer l'indice de réfraction d'un liquide pour une lumière monochromatique. Une source laser émet, dans l'air, un faisceau de lumière monochromatique de longueur d'onde $\lambda_a$.

      **Données :**
      - célérité de la lumière dans le vide ou dans l'air : $c = 3\cdot10^{8}\ \text{m.s}^{-1}$ ;
      - on prend l'indice de réfraction de l'air $n_a = 1$.

      **Figure (schéma du dispositif).** De gauche à droite, trois éléments montés chacun sur un pied à socle elliptique : la « Source laser » (boîtier rectangulaire grisé prolongé à droite d'un petit embout), puis un panneau dessiné en perspective portant en son centre un trait vertical noir figurant la fente, étiqueté « Fente de largeur $a$ » au-dessus, puis un second panneau en perspective étiqueté « Écran » en haut à droite. Un trait horizontal joint l'embout de la source à la fente. Depuis la fente partent vers l'écran **un trait pointillé horizontal** — l'axe optique, qui aboutit au **centre** de la tache centrale — et **un trait plein légèrement incliné vers le haut**, qui aboutit au **bord** de la tache centrale ; l'angle entre les deux est marqué $\theta$ juste avant l'écran. Sur l'écran, cinq taches elliptiques sombres alignées le long de l'axe (rendu oblique par la perspective) : la tache **centrale**, nettement la plus grande, encadrée de deux taches plus petites de chaque côté, de taille décroissante vers les bords. Au-dessus de la tache centrale, une double flèche horizontale étiquetée « $L$ » cote sa largeur. Entre le pied de la fente et le pied de l'écran, une double flèche horizontale cote la distance « $D$ ».
    questions:
      - id: q1
        part: "1 — Ce qu'on sait de la lumière (QCM)"
        stem: |-
          **1-** (0,5 pt) Choisir la proposition juste parmi les propositions suivantes :

          | | |
          |---|---|
          | **A** | La lumière émise par la source laser est une onde mécanique. |
          | **B** | La vitesse de la lumière est plus grande dans les fibres optiques en verre que dans le vide. |
          | **C** | Les radiations du spectre visible ont des longueurs d'onde dans le vide comprises entre $0{,}4\ \text{nm}$ et $0{,}8\ \text{nm}$. |
          | **D** | La fréquence d'une lumière monochromatique ne dépend pas du milieu de propagation. |
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Quatre propositions, une seule juste : on les élimine une par une, et chacune tombe pour une raison **différente** — c'est ce qui fait la valeur de la question, elle balaie quatre points de cours d'un coup.

          **A — « La lumière émise par la source laser est une onde mécanique. » FAUX.** Une onde mécanique exige un **milieu matériel** pour se propager : c'est sa définition même. Or la lumière du Soleil nous parvient à travers le vide interplanétaire. La lumière est une onde **électromagnétique** — un champ électrique et un champ magnétique qui se soutiennent mutuellement (rung 1), sans avoir besoin de matière. C'est la différence la plus structurante entre ce chapitre et celui des ondes mécaniques.

          **B — « La vitesse de la lumière est plus grande dans les fibres optiques en verre que dans le vide. » FAUX.** L'indice de réfraction se définit par $n = \dfrac{c}{v}$ (rung 2), donc $v = \dfrac{c}{n}$. Tout milieu matériel a un indice $n > 1$ — le verre est autour de $1{,}5$ — donc $v < c$ **toujours**. Le vide est le milieu où la lumière va le plus vite, et rien ne peut la dépasser. Une fibre optique ne rend pas la lumière plus rapide, elle la **guide**.

          **C — « Les radiations du spectre visible ont des longueurs d'onde dans le vide comprises entre $0{,}4\ \text{nm}$ et $0{,}8\ \text{nm}$. » FAUX, et le défaut est dans l'UNITÉ, pas dans les chiffres.** Le spectre visible s'étend de $0{,}4\ \mu\text{m}$ à $0{,}8\ \mu\text{m}$, c'est-à-dire de $400\ \text{nm}$ à $800\ \text{nm}$ (rung 4). La proposition est fausse d'un facteur **mille**.

          Le contrôle qui l'attrape à coup sûr, et qu'il faut avoir en réflexe : $0{,}4\ \text{nm}$, c'est l'ordre de grandeur du **diamètre d'un atome**. Une onde de cette longueur serait un rayon X dur, pas de la lumière visible. Dès qu'une longueur d'onde optique est annoncée en nanomètres, vérifie qu'elle est de l'ordre de **quelques centaines**, jamais de quelques unités.

          **D — « La fréquence d'une lumière monochromatique ne dépend pas du milieu de propagation. » VRAIE.** C'est la réponse. La fréquence est imposée par la **source** — c'est elle qui fait vibrer le champ à une cadence donnée — et cette cadence ne change pas quand l'onde entre dans un autre milieu : les oscillations qui arrivent à l'interface en une seconde en repartent au même rythme. Ce qui change, c'est la **vitesse** $v = \dfrac{c}{n}$, et donc la **longueur d'onde** $\lambda = \dfrac{v}{\nu}$.

          $$\boxed{\text{Réponse D}}$$

          **Pourquoi cette proposition n'est pas là par hasard.** L'invariance de la fréquence est exactement le principe sur lequel repose la question 3-1 : c'est parce que $\nu$ ne change pas et que $v$ est divisée par $n_L$ que $\lambda$ l'est aussi, et donc la tache de diffraction avec elle. Le QCM installe l'outil que l'exercice utilisera trois questions plus loin.

          **Le piège nommé de cette question.** Croire que « la longueur d'onde change donc la couleur change » quand la lumière entre dans l'eau. Non : la couleur perçue est fixée par la **fréquence**, qui est invariante. Un laser rouge reste rouge sous l'eau, même si sa longueur d'onde y est plus courte d'un quart.
      - id: q2a
        part: "2 — La diffraction et la largeur de la tache"
        stem: |-
          **2-1.** (0,5 pt) Le dispositif expérimental représenté sur la figure est constitué de la source laser précédente, d'une fente de largeur $a$, et d'un écran parallèle à la fente placé à une distance $D$ de la fente. Le faisceau de lumière émis par la source laser arrive perpendiculairement à la fente. On observe sur l'écran des taches lumineuses comme le montre la figure. La tache centrale a une largeur $L = 2{,}4\ \text{cm}$.

          Nommer le phénomène observé. Quel est alors l'aspect de la lumière mis en évidence ?
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Deux réponses en une question, et le correcteur attend les deux : le **nom** du phénomène, et ce qu'il **prouve**. N'en donner qu'une, c'est perdre la moitié du point.

          **Le nom.** Le phénomène est la **diffraction** (rung 3). Sa signature est décrite par l'énoncé lui-même : la lumière, après avoir traversé une ouverture étroite, ne se contente pas de continuer tout droit — elle **s'étale** perpendiculairement à la fente et forme sur l'écran une figure de taches alternativement lumineuses et sombres, la centrale étant nettement la plus large et la plus brillante.

          **L'aspect mis en évidence : le caractère ONDULATOIRE de la lumière.** C'est la seconde moitié de la réponse, et il faut savoir dire pourquoi.

          Si la lumière était un flux de **corpuscules** allant en ligne droite, une fente étroite en laisserait passer un mince pinceau et l'on verrait sur l'écran une bande fine, de la largeur de la fente — jamais un étalement, et surtout jamais des zones **sombres** de part et d'autre. Or non seulement la lumière s'étale, mais elle s'étale **d'autant plus que la fente est étroite** : c'est l'inverse exact de ce qu'on attendrait d'un flux de particules.

          Cet étalement, et l'alternance de taches claires et sombres qui l'accompagne, sont le comportement caractéristique d'une **onde**. La diffraction est donc la preuve expérimentale que la lumière est une onde — c'est le résultat historique du chapitre.

          **Le piège nommé de cette question.** Répondre « interférences ». Les deux phénomènes produisent bien des figures alternées, mais l'interférence exige **deux sources** (ou deux fentes) dont les ondes se superposent, alors qu'ici il n'y a **qu'une seule fente**. Un dispositif à une ouverture, c'est de la diffraction. Le second piège : dire « cela prouve que la lumière est une onde **électromagnétique** ». La diffraction prouve le caractère **ondulatoire**, elle ne dit rien de la nature électromagnétique de l'onde — les ondes sonores diffractent aussi.
      - id: q2b
        stem: |-
          **2-2.** (0,5 pt) Montrer que l'expression de la largeur $L$ est : $L = \dfrac{2\,\lambda_a\,D}{a}$, sachant que l'écart angulaire $\theta$ est suffisamment petit pour prendre $\tan\theta \approx \theta$, avec $\theta$ en radian.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une question « montrer que » : le résultat est donné, les points sont dans le chemin. Il tient en deux relations et une approximation — mais chacune doit être écrite, et l'approximation doit être **utilisée explicitement**, puisque l'énoncé prend la peine de l'autoriser.

          **Première relation — l'écart angulaire de diffraction (rung 3).** Pour une fente de largeur $a$ éclairée par une onde de longueur d'onde $\lambda$, le demi-angle d'ouverture de la tache centrale vaut

          $$\theta = \frac{\lambda_a}{a}$$

          avec $\theta$ **en radians**. Attention à ce que cette formule dit : $\theta$ est le demi-angle, mesuré depuis l'axe optique jusqu'au **bord** de la tache centrale — ce sont exactement les deux traits que la figure dessine, le pointillé horizontal et le trait plein incliné.

          **Deuxième relation — la géométrie du triangle.** Sur l'écran, la demi-largeur de la tache centrale vaut $\dfrac{L}{2}$, et elle est vue depuis la fente sous l'angle $\theta$, à la distance $D$ :

          $$\tan\theta = \frac{L/2}{D}$$

          **L'approximation, utilisée là où l'énoncé l'autorise.** L'angle est petit, donc $\tan\theta \approx \theta$ :

          $$\theta \approx \frac{L}{2D}$$

          **On égale les deux expressions de $\theta$ :**

          $$\frac{\lambda_a}{a} = \frac{L}{2D}$$

          $$\boxed{\ L = \frac{2\,\lambda_a\,D}{a}\ }$$

          **Lire la formule au lieu de s'arrêter au résultat.** Trois enseignements y sont écrits :
          — $L$ est **inversement** proportionnelle à $a$ : plus la fente est **étroite**, plus la tache est **large**. C'est contre-intuitif si l'on pense en corpuscules, et c'est exactement ce que la question 2-1 relevait ;
          — $L$ est proportionnelle à $D$ : éloigner l'écran agrandit la figure, ce qui est le moyen pratique de la rendre mesurable ;
          — $L$ est proportionnelle à $\lambda$ : c'est **cette** dépendance-là que la question 3 va exploiter pour mesurer un indice.

          **Le piège nommé de cette question.** Oublier le facteur $2$ et écrire $L = \dfrac{\lambda_a D}{a}$. L'angle $\theta$ est un **demi**-angle : il donne la demi-largeur de la tache, pas sa largeur. C'est le facteur le plus perdu du chapitre, et l'énoncé le rend ici détectable puisqu'il donne la formule à retrouver. Le second piège : appliquer $\theta = \lambda/a$ avec $\theta$ en degrés. La formule n'est valable qu'en **radians** — l'énoncé le précise, ce n'est pas une coquetterie.
      - id: q3a
        part: "3 — L'indice du liquide, par comparaison"
        stem: |-
          **3-1.** (0,5 pt) On réalise l'expérience précédente dans un liquide d'indice $n_L$ en gardant la même distance $D$. On remarque que la largeur de la tache centrale prend la valeur $L' = 1{,}8\ \text{cm}$.

          Vérifier que $n_L \simeq 1{,}33$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** C'est le cœur de l'exercice, et il faut voir tout de suite ce qui est **difficile** : ni $\lambda_a$, ni $a$, ni $D$ n'ont de valeur numérique dans cet énoncé. On ne peut donc calculer **aucune** des deux largeurs séparément. La seule voie est de former le **rapport** des deux expériences, où tout ce qu'on ignore va s'éliminer.

          **Ce qui change et ce qui ne change pas quand on plonge le montage dans le liquide.** L'énoncé dit qu'on garde la même distance $D$ ; c'est le même laser et la même fente, donc $a$ ne change pas non plus. Reste la lumière :

          — la **fréquence** $\nu$ ne change pas — c'est exactement la proposition D du QCM de la question 1, et c'est ici qu'elle sert ;
          — la **vitesse** devient $v_L = \dfrac{c}{n_L}$ (rung 2) ;
          — donc la **longueur d'onde** change, puisque $\lambda = \dfrac{v}{\nu}$ :

          $$\lambda_L = \frac{v_L}{\nu} = \frac{c}{n_L\,\nu} = \frac{\lambda_a}{n_L}$$

          la dernière égalité venant de $\lambda_a = \dfrac{c}{\nu}$ dans l'air, où $n_a = 1$.

          **La nouvelle largeur.** On réapplique la formule de la question 2-2, avec la nouvelle longueur d'onde et les mêmes $D$ et $a$ :

          $$L' = \frac{2\,\lambda_L\,D}{a} = \frac{2\,\lambda_a\,D}{n_L\,a} = \frac{L}{n_L}$$

          **Le rapport, et l'élimination.** En divisant les deux expressions :

          $$\frac{L}{L'} = n_L
          \qquad\Longrightarrow\qquad
          n_L = \frac{2{,}4}{1{,}8} = \frac{4}{3} = 1{,}3333\ldots$$

          $$\boxed{n_L \simeq 1{,}33}$$

          **Ce qui vient de se passer, et c'est la leçon de l'exercice.** $\lambda_a$, $a$ et $D$ ont **tous les trois** disparu du calcul. On a mesuré un indice de réfraction sans connaître ni la longueur d'onde du laser, ni la largeur de la fente, ni la distance à l'écran — seulement deux largeurs de tache, à la règle. C'est pour cela que la formule de la question 2-2 valait la peine d'être établie : non pas pour calculer $L$, mais pour que tout s'élimine dans un rapport. Les deux longueurs de l'énoncé sont d'ailleurs choisies pour que le rapport tombe sur une fraction **exacte**, $\dfrac{4}{3}$.

          **Le contrôle de vraisemblance.** $n_L = 1{,}33$ est l'indice de l'**eau** — la valeur la plus connue de tout le chapitre. Le montage est donc crédible, et le résultat se reconnaît au premier coup d'œil.

          **Le piège nommé de cette question.** Écrire $n_L = \dfrac{L'}{L} = 0{,}75$. Un indice de réfraction est **toujours supérieur ou égal à $1$** : une valeur inférieure à $1$ signifierait une lumière plus rapide que dans le vide. Le sens du rapport se retrouve par le raisonnement — dans le liquide, $\lambda$ **diminue**, donc la tache **rétrécit**, donc $L' < L$, donc $n_L = L/L' > 1$ — mais aussi, en secours, par ce simple contrôle de bon sens.
        steps:
          - math: '\lambda_L = \frac{\lambda_a}{n_L}'
            note: "La frequence est invariante (question 1, proposition D) ; seule la vitesse change, donc lambda avec elle."
          - math: 'L = \frac{2\lambda_a D}{a} \qquad\text{et}\qquad L'' = \frac{2\lambda_L D}{a} = \frac{2\lambda_a D}{n_L\,a}'
            note: "Meme fente, meme distance : a et D sont identiques dans les deux experiences."
          - math: '\frac{L}{L''} = n_L'
            note: "lambda_a, a et D s'eliminent tous les trois. C'est tout l'interet du rapport."
