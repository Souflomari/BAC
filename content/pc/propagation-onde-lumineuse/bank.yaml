    intro: |-
      **Propagation des ondes lumineuses (examen national, session normale 2021 — Exercice II, 3 points).**

      Un faisceau cylindrique de lumière blanche, émis par une source $S$, arrive perpendiculairement à la face d'un prisme $(P)$ en verre. Le faisceau lumineux issu du prisme arrive sur un écran $(E)$. On observe alors sur cet écran un spectre lumineux (figure 1).

      **Figure 1 (schéma) :** source $S$ émettant un faisceau horizontal qui arrive perpendiculairement sur la première face d'un prisme $(P)$ triangulaire ; le faisceau émergent, dévié, forme un spectre lumineux sur l'écran vertical $(E)$.

      **Données** (utiles pour les questions 2 à 4) :

      - la célérité de la lumière dans le vide : $c = 3\times10^{8}\ \text{m.s}^{-1}$ ;
      - la longueur d'onde de la radiation rouge dans le prisme est : $\lambda_r = 474\ \text{nm}$ ;
      - la fréquence de la radiation rouge est : $\nu_r = 3{,}91\times10^{14}\ \text{Hz}$ ;
      - les longueurs d'onde de la radiation jaune sont : $\lambda_{0j} = 589\ \text{nm}$ dans le vide et $\lambda_j = 355\ \text{nm}$ dans le prisme $(P)$.
    questions:
      - id: q1
        part: "Partie 1 — Décomposition de la lumière blanche par le prisme"
        stem: |-
          **(0,25 pt)** Choisir parmi les propositions suivantes, celle qui est juste. L'expérience précédente montre que la lumière blanche :

          | A | B | C |
          |---|---|---|
          | est monochromatique | n'est formée que de deux radiations différentes | est polychromatique |
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Un prisme ne fabrique aucune couleur : il ne fait que dévier différemment des couleurs qui étaient déjà présentes dans le faisceau incident (c'est tout le mécanisme du chapitre 6, retrouvé en détail aux questions 2 à 4). La question se règle donc en remontant du résultat observé — un spectre étalé sur l'écran — vers ce qu'il implique nécessairement sur la lumière blanche AVANT le prisme, pas en récitant une définition.

          **Le raisonnement.** Si la lumière blanche était monochromatique (proposition A), le prisme la dévierait tout entière du même angle — puisque son indice $n$ ne dépendrait alors que d'UNE seule longueur d'onde — et l'écran montrerait un unique trait dévié, jamais un étalement. Si elle n'était formée que de deux radiations (proposition B), l'écran montrerait deux traits séparés et nets, avec du noir entre eux — pas un dégradé continu. Ce que l'énoncé décrit est un spectre, c'est-à-dire un étalement continu de couleurs : cela n'est possible que si la lumière blanche contenait, dès le départ, un mélange de très nombreuses longueurs d'onde, chacune déviée d'un angle légèrement différent par le prisme.

          $$\boxed{\text{C — la lumière blanche est polychromatique}}$$

          **Le piège de cette question.** Confondre « le prisme crée les couleurs » et « le prisme révèle des couleurs déjà là ». Le mot « décomposition », employé pour ce genre d'expérience, le dit bien : on ne compose rien, on sépare ce qui était superposé. C'est ce mécanisme — retrouvé chiffres à l'appui dans la suite de l'exercice — qui est démontré, et non simplement affirmé, aux questions 2 à 4.
      - id: q2
        part: "Partie 2 — Deux radiations dans le prisme : fréquence, célérités, dispersion"
        stem: |-
          **(0,5 pt)** Calculer la fréquence $\nu_j$ de la radiation jaune.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On dispose de DEUX longueurs d'onde pour le jaune : $\lambda_{0j} = 589\ \text{nm}$ dans le vide, et $\lambda_j = 355\ \text{nm}$ dans le prisme. Une seule des deux permet de calculer $\nu_j$ sans rien connaître d'autre sur le prisme : $\lambda_{0j}$, parce que dans le vide la vitesse vaut exactement $c$, une constante connue. Utiliser $\lambda_j$ demanderait de connaître la vitesse DANS le prisme, qu'on ne calcule qu'à la question suivante.

          **Pourquoi $\nu_j$ ne dépend pas du prisme.** La fréquence d'une radiation est imposée par la source qui l'émet — c'est le rythme d'oscillation des champs électrique et magnétique (chapitre 2) — et ce rythme ne change pas quand la lumière franchit une interface et entre dans un milieu matériel (chapitre 5) : $\nu$ est invariante. C'est cette invariance qui autorise à calculer $\nu_j$ dans le vide, puis à réutiliser directement ce résultat plus loin, DANS le prisme, aux questions 3 et 4.

          **Le calcul.** Dans le vide, $\lambda = v/\nu$ (chapitre 5) devient $\lambda_{0j} = c/\nu_j$ puisque $v = c$. On isole $\nu_j$ :

          $$\nu_j = \frac{c}{\lambda_{0j}}$$

          On convertit $\lambda_{0j}$ en mètres avant de diviser : $589\ \text{nm} = 5{,}89\times10^{-7}\ \text{m}$.

          $$\nu_j = \frac{3\times10^{8}}{5{,}89\times10^{-7}} \approx 5{,}09\times10^{14}\ \text{Hz}$$

          **Le contrôle qui rassure.** L'ordre de grandeur, $10^{14}\ \text{Hz}$, est celui de toutes les fréquences visibles — ni radio ($10^{6}$–$10^{9}\ \text{Hz}$), ni rayons X ($10^{18}\ \text{Hz}$ et plus). Un résultat très éloigné de $10^{14}$ aurait signalé une conversion ratée.

          **Le piège de cette question.** Utiliser $\lambda_j = 355\ \text{nm}$ (la valeur dans le prisme) à la place de $\lambda_{0j}$. La formule $\lambda_0 = c/\nu$ n'est valable QUE dans le vide (ou l'air, assimilé au vide) : $c$ y est la vitesse réelle. Dans le prisme, la vitesse est plus faible ($v_j < c$, question 3), et diviser $c$ par $\lambda_j$ donnerait une fréquence fausse, plus grande que la vraie. La donnée $\lambda_j$ n'est pas inutile pour autant : c'est elle qu'il faut mobiliser à la question suivante, une fois $\nu_j$ en poche.
        steps:
          - math: '\nu_j = \dfrac{c}{\lambda_{0j}}'
            note: "Dans le vide, lambda = v/nu avec v = c ; on isole la fréquence."
          - math: '\nu_j = \dfrac{3\times10^{8}}{589\times10^{-9}} \approx 5{,}09\times10^{14}\ \text{Hz}'
            note: "Application numérique : lambda_0j = 589 nm convertie en mètres."
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer les célérités $v_j$ et $v_r$ des radiations jaune et rouge dans le prisme.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On veut les célérités DANS le prisme — pas dans le vide. La relation à utiliser est $v = \lambda\nu$ (chapitre 5, $\lambda = v/\nu$ retournée), à condition de prendre, pour chaque couleur, la longueur d'onde mesurée DANS LE MILIEU où l'on veut la vitesse — ici le prisme — et la fréquence, qui elle vaut partout la même chose.

          **Ce qu'on a déjà en main.** Pour le rouge, l'énoncé donne directement les deux grandeurs dans le prisme : $\lambda_r = 474\ \text{nm}$ et $\nu_r = 3{,}91\times10^{14}\ \text{Hz}$. Pour le jaune, l'énoncé donne $\lambda_j = 355\ \text{nm}$ dans le prisme, et $\nu_j \approx 5{,}09\times10^{14}\ \text{Hz}$ vient d'être calculée (question 2) — valable ici aussi puisque la fréquence est invariante.

          **Le calcul, radiation par radiation.** Toutes les longueurs d'onde se convertissent en mètres avant de multiplier.

          Pour le jaune :

          $$v_j = \lambda_j\,\nu_j = 355\times10^{-9} \times 5{,}09\times10^{14} \approx 1{,}81\times10^{8}\ \text{m.s}^{-1}$$

          Pour le rouge :

          $$v_r = \lambda_r\,\nu_r = 474\times10^{-9} \times 3{,}91\times10^{14} \approx 1{,}85\times10^{8}\ \text{m.s}^{-1}$$

          **Le contrôle qui rassure — et qui prépare la question suivante.** Les deux vitesses sont bien inférieures à $c = 3\times10^{8}\ \text{m.s}^{-1}$, comme l'exige tout milieu matériel ($v \leq c$, chapitre 3) : aucune des deux ne franchit la limite. On peut même remonter, à partir de chaque vitesse, à l'indice que le prisme oppose à chaque couleur, avec $n = c/v$ (chapitre 3) :

          $$n_j = \frac{c}{v_j} \approx 1{,}66 \qquad\qquad n_r = \frac{c}{v_r} \approx 1{,}62$$

          Les deux indices ne sont PAS égaux — c'est précisément ce que la question suivante demande de commenter.

          **Le piège de cette question.** Réutiliser $\lambda_{0j} = 589\ \text{nm}$ (la valeur dans le vide) au lieu de $\lambda_j = 355\ \text{nm}$ (dans le prisme) pour calculer $v_j$. Cela redonnerait $v_j = \lambda_{0j}\nu_j = c$ presque exactement — un résultat qui dit simplement qu'on a refait le calcul du VIDE, pas trouvé la vitesse dans le prisme. La règle à retenir : la vitesse dans un milieu se calcule avec la longueur d'onde mesurée DANS CE MILIEU, jamais avec $\lambda_0$.
        steps:
          - math: 'v_j = \lambda_j\,\nu_j = 355\times10^{-9}\times 5{,}09\times10^{14} \approx 1{,}81\times10^{8}\ \text{m.s}^{-1}'
            note: "On prend lambda_j (dans le prisme) et nu_j (question 2)."
          - math: 'v_r = \lambda_r\,\nu_r = 474\times10^{-9}\times 3{,}91\times10^{14} \approx 1{,}85\times10^{8}\ \text{m.s}^{-1}'
            note: "On prend lambda_r (dans le prisme) et nu_r (donnée)."
      - id: q4
        stem: |-
          **(0,25 pt)** Quelle propriété du prisme est mise en évidence par les résultats de la question 2.2 ?
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La question demande de nommer une PROPRIÉTÉ du prisme à partir d'un résultat purement numérique — deux vitesses différentes. Le geste est de relire ce que ces deux nombres impliquent sur l'indice du prisme, puis de reconnaître le nom de la propriété que le chapitre 6 décrit pour ce comportement.

          **Ce que disent les deux vitesses.** $v_j \approx 1{,}81\times10^{8}\ \text{m.s}^{-1}$ et $v_r \approx 1{,}85\times10^{8}\ \text{m.s}^{-1}$ sont DIFFÉRENTES. Or dans un même prisme, la relation $n = c/v$ (chapitre 3) relie indice et vitesse pour CHAQUE radiation séparément :

          $$n_j = \frac{c}{v_j} \approx 1{,}66 \qquad\qquad n_r = \frac{c}{v_r} \approx 1{,}62$$

          Deux vitesses différentes donnent nécessairement deux indices différents : l'indice du VERRE du prisme n'est donc pas une constante unique, il dépend de la radiation qui le traverse — ici, $n_j > n_r$, l'indice est plus grand pour le jaune que pour le rouge.

          **Recoupement avec le mécanisme du chapitre 6.** Ce résultat n'est pas un hasard de cet exercice : Le chapitre 6 énonce que, pour la plupart des verres, l'indice est plus grand pour les courtes longueurs d'onde ($n_{violet} > n_{rouge}$). Vérifions que le jaune suit la même règle, par une voie indépendante de la donnée $\lambda_{0j} = 589\ \text{nm}$ : à partir de $\nu_j$,

          $$\lambda_{0j} = \frac{c}{\nu_j} \approx \frac{3\times10^{8}}{5{,}09\times10^{14}} \approx 589\ \text{nm} \quad\checkmark$$

          et, de la même façon, la longueur d'onde du rouge dans le vide, que l'énoncé ne donne pas directement :

          $$\lambda_{0r} = \frac{c}{\nu_r} = \frac{3\times10^{8}}{3{,}91\times10^{14}} \approx 767\ \text{nm}$$

          Le jaune ($589\ \text{nm}$) a bien une longueur d'onde dans le vide plus courte que le rouge ($767\ \text{nm}$), et c'est précisément le jaune qui a l'indice le plus grand ($1{,}66 > 1{,}62$) : exactement la règle « indice plus grand pour la longueur d'onde plus courte » que le chapitre 6 établit entre le violet et le rouge.

          **Le nom de la propriété.** Un milieu dans lequel l'indice — donc la vitesse — dépend de la couleur (de la fréquence) de la lumière qui le traverse s'appelle un **milieu dispersif**. *(Signalons la portée de ce terme : Le chapitre 6 établit bien le mécanisme — $n$ dépend de $\lambda_0$, $n_{violet} > n_{rouge}$, ce qui sépare les couleurs par la loi de Descartes — mais ne nomme nulle part explicitement « milieu dispersif ». Le pont est refait ici à partir de la définition même de la dispersion.)* C'est cette propriété — et elle seule — qui rend possible la dispersion observée dès la question 1 : sans écart d'indice entre les couleurs, le prisme dévierait toute la lumière blanche du même angle, et il n'y aurait rien à séparer.

          **Conclusion.** Le prisme est un milieu dispersif : son indice dépend de la couleur de la lumière.

          **Le piège de cette question.** Répondre « le prisme change la couleur de la lumière » ou « le prisme ralentit la lumière » — deux réponses vraies mais qui manquent le point. Ralentir la lumière ($v < c$), c'est la propriété de TOUT milieu transparent (chapitre 3), prisme ou pas. Ce que CETTE question isole, c'est que le ralentissement n'est PAS le même pour toutes les couleurs — c'est ça, et seulement ça, qui définit un milieu dispersif et qui explique le spectre de la question 1.
      - id: q5
        part: "Partie 3 — Diffraction par une fente, puis par un cheveu"
        stem: |-
          **(0,5 pt)** On éclaire, avec une radiation laser ayant une longueur d'onde $\lambda$, une fente fine horizontale de largeur $a = 0{,}06\ \text{mm}$. On observe sur un écran, placé à une distance $D$ de la fente, un ensemble de taches de direction verticale. La tache centrale a une largeur $L$ (figure 2).

          **Figure 2 (schéma) :** un Laser éclaire une fente de largeur $a$ ; sur l'écran placé à distance $D$, figure de diffraction dont la tache centrale a une largeur $L$ ; le demi-angle de diffraction est noté $\theta$.

          Établir l'expression de $L$ en fonction de $\lambda$, $a$ et $D$ ($\theta$ étant petit, on prend $\tan\theta \approx \theta$).
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On change complètement de phénomène : après la dispersion (questions 1 à 4), on passe à la diffraction, où c'est la petitesse de l'ouverture — pas la couleur — qui gouverne l'étalement. Le geste est celui du chapitre 4, utilisé dans le sens direct : une largeur de fente $a$ produit un écart angulaire $\theta$, que la distance à l'écran $D$ transforme en une longueur mesurable $L$.

          **Première relation — l'écart angulaire de diffraction (chapitre 4).** Pour une fente de largeur $a$ éclairée par une longueur d'onde $\lambda$ :

          $$\theta = \frac{\lambda}{a}$$

          **Deuxième relation — la géométrie sur l'écran.** L'angle $\theta$, tel que le décrit la figure, est le DEMI-angle : il va de l'axe optique jusqu'au bord de la tache centrale, pas d'un bord à l'autre. La demi-largeur de la tache, $L/2$, est donc vue depuis la fente sous cet angle $\theta$, à la distance $D$ :

          $$\tan\theta = \frac{L/2}{D}$$

          **L'approximation, utilisée là où l'énoncé l'autorise.** $\theta$ est petit, donc $\tan\theta \approx \theta$ :

          $$\frac{L}{2} \approx D\,\theta$$

          **On combine les deux relations,** en remplaçant $\theta$ par $\lambda/a$ :

          $$\frac{L}{2} = D\,\frac{\lambda}{a}$$

          $$\boxed{L = \frac{2\,\lambda\,D}{a}}$$

          **Ce que dit la formule, avant même de calculer.** $L$ est inversement proportionnelle à $a$ : une fente plus étroite donne une tache plus large — le contraire de ce qu'on attendrait d'un rayon lumineux qui irait tout droit. $L$ est proportionnelle à $D$ : c'est ce qui permet, en éloignant l'écran, de rendre la figure facilement mesurable — et c'est exactement ce que la question suivante exploite en faisant varier $D$.

          **Le piège de cette question.** Oublier le facteur $2$ et écrire $L = D\lambda/a$. L'angle $\theta$ de la figure est un DEMI-angle — il ne balaie que la moitié de la tache, de l'axe jusqu'à un seul bord — donc c'est $L/2$, pas $L$, qui lui correspond. Le second piège, plus discret : appliquer $\tan\theta \approx \theta$ sans que l'énoncé ne l'autorise explicitement — ici il l'autorise, mais ce n'est vrai que pour de petits angles, et il faut toujours vérifier, une fois une valeur numérique de $\lambda$ connue (question 6), que l'angle obtenu reste bien petit.
      - id: q6
        stem: |-
          **(0,5 pt)** On change la distance $D$ et on mesure à chaque fois la largeur $L$. La courbe de la figure 3 donne les variations de $L$ en fonction de $D$ : $L = f(D)$.

          **Figure 3 (courbe) :** $L$ (cm) en fonction de $D$ (cm) ; droite passant par l'origine ; ordonnées graduées $0{,}8$, $1{,}6$, $2{,}4$ ; abscisses graduées $50$, $100$, $150$.

          Sur ce graphe, on peut lire, par exemple, $L = 2{,}4\ \text{cm}$ pour $D = 120\ \text{cm}$. En exploitant la courbe $L = f(D)$, montrer que $\lambda = 600\ \text{nm}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'expression établie à la question 5, $L = 2\lambda D/a$, est de la forme $L = p\,D$ avec $p = 2\lambda/a$ constant : c'est exactement une droite passant par l'origine, ce que confirme la figure 3. La pente $p$ se lit donc directement sur le graphe comme le rapport $L/D$ d'un point quelconque de la droite — pas besoin de repasser par un calcul d'angle.

          **Lire la pente.** Au point donné, $L = 2{,}4\ \text{cm}$ pour $D = 120\ \text{cm}$ :

          $$p = \frac{L}{D} = \frac{2{,}4}{120} = 2{,}0\times10^{-2}$$

          C'est un nombre SANS UNITÉ (un rapport de deux longueurs dans la même unité, le centimètre), ce qui se vérifie en reprenant n'importe quel autre point du graphe : à $D = 40\ \text{cm}$, la droite passe par $L = 0{,}8\ \text{cm}$, et $0{,}8/40 = 2{,}0\times10^{-2}$ — la même pente, comme il se doit pour une droite passant par l'origine.

          **Isoler $\lambda$.** De $p = 2\lambda/a$ :

          $$\lambda = \frac{p\,a}{2}$$

          On convertit $a$ en mètres : $a = 0{,}06\ \text{mm} = 6{,}0\times10^{-5}\ \text{m}$.

          $$\lambda = \frac{2{,}0\times10^{-2} \times 6{,}0\times10^{-5}}{2} = \frac{1{,}2\times10^{-6}}{2}$$

          $$\boxed{\lambda = 6{,}0\times10^{-7}\ \text{m} = 600\ \text{nm}}$$

          **Le contrôle qui rassure.** $600\ \text{nm}$ tombe, dans le tableau du chapitre 5, sur la plage du jaune-orangé — un ordre de grandeur tout à fait crédible pour un laser visible, ni dans l'ultraviolet ni dans l'infrarouge. Et l'angle correspondant reste bien petit : $\theta = \lambda/a = 6{,}0\times10^{-7}/6{,}0\times10^{-5} = 1{,}0\times10^{-2}\ \text{rad}$, soit un peu moins de $0{,}6^\circ$ — ce qui valide a posteriori l'approximation $\tan\theta \approx \theta$ utilisée à la question 5.

          **Le piège de cette question.** Lire une longueur sur le graphe et la traiter comme $\lambda$ directement — $2{,}4\ \text{cm}$, par exemple, n'a évidemment rien à voir avec une longueur d'onde. Ce que le graphe donne, ce n'est jamais $\lambda$ elle-même, c'est la PENTE de la droite $L(D)$, une grandeur intermédiaire qu'il faut ensuite relier à $\lambda$ via $a$ — deux étapes, pas une.
        steps:
          - math: 'p = \dfrac{L}{D} = \dfrac{2{,}4\ \text{cm}}{120\ \text{cm}} = 2{,}0\times10^{-2}'
            note: "Pente de la droite, lue sur un point du graphe (grandeur sans dimension)."
          - math: '\lambda = \dfrac{p\,a}{2} = \dfrac{2{,}0\times10^{-2}\times 0{,}06\times10^{-3}}{2} = 6{,}0\times10^{-7}\ \text{m} = 600\ \text{nm}'
            note: "On isole lambda à partir de la pente p = 2 lambda / a, avec a = 0,06 mm = 6e-5 m."
      - id: q7
        stem: |-
          **(0,5 pt)** On fixe l'écran à une distance $D_i = 2\ \text{m}$ de la fente, et on remplace la fente par un cheveu fin de diamètre $d$. On obtient alors, avec la même radiation de longueur d'onde $\lambda$, une tache centrale de largeur $L_i = 3\ \text{cm}$. Déterminer le diamètre $d$ du cheveu.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On mesure quelque chose d'invisible à l'œil et d'imprenable à la règle — le diamètre d'un cheveu — sans microscope, avec le seul outil qu'on vient de valider deux fois : la relation de diffraction. Un fil fin diffracte exactement comme une fente de même largeur ($a$ dans la formule devient $d$, le diamètre du fil) : même physique, même formule, un autre obstacle.

          **L'expression, réutilisée telle quelle.** $L_i = \dfrac{2\lambda D_i}{d}$, la formule de la question 5 avec $a \to d$. On isole $d$ :

          $$d = \frac{2\,\lambda\,D_i}{L_i}$$

          **L'application numérique.** Toutes les longueurs en mètres : $\lambda = 600\ \text{nm} = 6\times10^{-7}\ \text{m}$ (question 6), $D_i = 2\ \text{m}$, $L_i = 3\ \text{cm} = 3\times10^{-2}\ \text{m}$.

          $$d = \frac{2 \times 6\times10^{-7} \times 2}{3\times10^{-2}} = \frac{2{,}4\times10^{-6}}{3\times10^{-2}}$$

          $$\boxed{d = 8\times10^{-5}\ \text{m} = 80\ \mu\text{m} = 0{,}08\ \text{mm}}$$

          **Le contrôle qui rassure.** $80\ \mu\text{m}$ est exactement l'ordre de grandeur réel d'un cheveu humain (de $50$ à $100\ \mu\text{m}$ selon les individus) — un résultat qui se vérifie au bon sens autant qu'au calcul, et qui confirme le principe démontré dès la question 5 : une largeur microscopique, transformée par diffraction, devient une tache mesurable à la règle.

          **Le piège de cette question.** Réutiliser $D = 120\ \text{cm}$ (le point de lecture de la question 6) au lieu de la nouvelle distance $D_i = 2\ \text{m}$ donnée ICI. Les deux $D$ n'ont rien à voir : $D = 120\ \text{cm}$ n'était qu'UN point particulier lu sur le graphe de la question 6 pour en extraire une pente, alors que $D_i = 2\ \text{m}$ est la distance RÉELLE de ce nouveau montage. Confondre les deux donnerait un diamètre faux, sans qu'aucun signal n'alerte forcément — d'où l'intérêt de toujours vérifier quelle donnée appartient à quelle expérience avant de l'injecter dans une formule.
        steps:
          - math: 'd = \dfrac{2\lambda D_i}{L_i}'
            note: "Même loi que pour la fente, avec le diamètre d a la place de a ; on isole d."
          - math: 'd = \dfrac{2\times 600\times10^{-9}\times 2}{3\times10^{-2}} = 8\times10^{-5}\ \text{m} = 80\ \mu\text{m} = 0{,}08\ \text{mm}'
            note: "Application numérique : lambda = 600 nm, D_i = 2 m, L_i = 3 cm = 0,03 m."

