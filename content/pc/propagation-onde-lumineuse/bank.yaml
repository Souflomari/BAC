      - id: q4
        stem: |-
          **4-** (0,75 pt) On remplace la plaque $(P)$ *(sic — la plaque n'a jamais été nommée $(P)$ auparavant : notation orpheline du document officiel ; l'original arabe n'introduit aucun symbole et précise en outre un fil « métallique » « fixé sur un support », deux précisions supprimées côté français)* par un fil fin de diamètre $d$, qu'on fixe à la même place de la plaque. On visualise sur l'écran des franges brillantes commes *(sic)* les précédentes, mais dont la largeur de la tâche *(sic)* centrale est $L_2 = 2{,}8\ \text{cm}$.

          Calculer $d$.
        reasoning: |-
          **Le fait qu'il faut connaître, et que l'énoncé suppose acquis.** Un **fil** de diamètre $d$ et une **fente** de largeur $d$ donnent, à la même distance, **la même figure de diffraction** — c'est le principe de Babinet, admis au programme. On peut donc réutiliser telle quelle la relation de la question 3, en remplaçant simplement la largeur de la fente $a$ par le diamètre du fil $d$, et $L_1$ par $L_2$ :

          $$\frac{\lambda}{d} = \frac{L_2}{2D} \qquad \Longrightarrow \qquad \boxed{d = \frac{2\lambda D}{L_2}}$$

          **Ce qui change et ce qui ne change pas entre les deux expériences.** Le laser est le même, donc $\lambda = 7{,}0\times10^{-7}\ \text{m}$ **ne change pas** ; l'écran n'a pas bougé, donc $D = 1{,}5\ \text{m}$ **ne change pas**. La seule grandeur mesurée qui change est la largeur de la tache : $L_2 = 2{,}8\ \text{cm}$ au lieu de $L_1 = 3{,}5\ \text{cm}$. C'est cette différence, et elle seule, qui livre $d$.

          $$d = \frac{2 \times 7{,}0\times10^{-7} \times 1{,}5}{2{,}8\times10^{-2}} = \frac{2{,}1\times10^{-6}}{2{,}8\times10^{-2}} = 7{,}5\times10^{-5}\ \text{m} = 75\ \mu\text{m}$$

          **Lire le résultat au lieu de le poser.** La tache est **plus étroite** qu'avec la fente ($2{,}8$ contre $3{,}5\ \text{cm}$), donc l'obstacle doit être **plus large** : $d = 75\ \mu\text{m}$ contre $a = 60\ \mu\text{m}$. Le rapport des largeurs de tache, $3{,}5/2{,}8 = 1{,}25$, est exactement l'inverse du rapport des obstacles, $75/60 = 1{,}25$ — c'est la relation $\theta = \lambda/a$ qui se lit dans les deux sens, et c'est le contrôle qui ferme sans calcul supplémentaire.

          **Ce que cette question raconte au fond, et pourquoi l'exercice existe.** On vient de **mesurer un diamètre de $75$ micromètres** — l'ordre de grandeur d'un cheveu — avec une règle graduée en centimètres. C'est exactement ce que l'encadré annonçait : le laser sert « à la détermination des dimensions microscopiques de quelques corps ». La diffraction transforme une longueur inaccessible en une longueur mesurable à l'œil, et le facteur d'agrandissement est $2D/L$.

          **Le piège de cette question.** Recalculer $\lambda$ à partir de $L_2$ au lieu de calculer $d$ — c'est-à-dire réutiliser la formule de la question 3 sans changer l'inconnue. La longueur d'onde est **fixée par le laser**, elle est la donnée reprise de la question précédente ; l'inconnue est $d$.
        steps:
