# with a `primary_misconception`, promotes per-distractor `misconception:` tags
# on every wrong choice (the checkpoints.yaml gold standard), and adds ONE new
# item (POL-22) to close the diffraction-condition model to the ≥3 floor.
# Counts are ITEM-LEVEL (each item counted once, by its `primary_misconception`).
# ──────────────────────────────────────────────────────────────────────────────
coverage_summary:
  method: "item-level, by primary_misconception (one item = one count)"
  total_items: 22
  per_misconception:
    mc.physics.pc_propagation_onde_lumineuse.lumiere-onde-em-niee: 3         # POL-8, POL-9, POL-11
    mc.physics.pc_propagation_onde_lumineuse.son-lumiere-memes-proprietes: 3 # POL-1, POL-7, POL-10
    mc.physics.pc_propagation_onde_lumineuse.indice-vitesse-erronee: 3       # POL-2, POL-12, POL-13
    mc.physics.pc_propagation_onde_lumineuse.diffraction-condition-taille: 3 # POL-3, POL-21, POL-22
    mc.physics.pc_propagation_onde_lumineuse.diffraction-formule-theta: 3    # POL-4, POL-14, POL-19
    mc.physics.pc_propagation_onde_lumineuse.lambda-nu-changement-milieu: 3  # POL-5, POL-15, POL-16
    mc.physics.pc_propagation_onde_lumineuse.dispersion-prisme: 4            # POL-6, POL-17, POL-18, POL-20
  floor: 3
  floor_met: true
  ramp_coverage:
    R0: 3   # POL-7, POL-8, POL-9
    R1: 3   # POL-1, POL-10, POL-11
    R2: 3   # POL-2, POL-12, POL-13
    R3: 4   # POL-3, POL-4, POL-14, POL-22
    R4: 3   # POL-5, POL-15, POL-16
    R5: 3   # POL-6, POL-17, POL-18
    R6: 3   # POL-19, POL-20, POL-21
  note: >
    Floor met for all seven models without padding: six models already had ≥3
    primaries across POL-1…POL-21; only the diffraction-condition model needed
    one fresh item (POL-22, R3) to reach 3. Per-distractor `misconception:` tags
    were added to every wrong choice of POL-1…POL-21 (additive only — no stem,
    feedback, or solution was deleted or weakened). A few items carry mixed
    distractor tags where a wrong choice voices a neighbouring model (e.g.
    POL-1 C = son-lumiere-memes-proprietes, POL-7 C/D = lumiere-onde-em-niee,
    POL-19 B/D = lambda-nu-changement-milieu, POL-21 C/D =
    diffraction-formule-theta): these are diagnostic metadata layered onto the
    item-level primary counts and do not change the method or counts above. The
    R0/R1 model lumiere-onde-em-niee intentionally bundles two faces of the same
    accroche confusion — « la lumière a besoin d'un support (éther) » and « la
    lumière est instantanée » — since the R0 hook confronts both with the single
    idea that light is a finite-speed electromagnetic wave needing no medium.
