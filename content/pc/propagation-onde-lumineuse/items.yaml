    correct_feedback: >
      L'hypothèse de l'éther a réellement été envisagée dans l'histoire des
      sciences avant d'être abandonnée : la lumière ne nécessite aucun
      support, visible ou invisible, pour se propager.
    solution: |
      L'idée d'un support invisible universel (l'éther lumineux) a été
      sérieusement testée puis rejetée faute de toute preuve expérimentale.
      La bonne image n'est pas « une matière invisible vibre », mais « deux
      champs s'entretiennent mutuellement, sans avoir besoin d'aucun
      support ».

  - id: POL-10
