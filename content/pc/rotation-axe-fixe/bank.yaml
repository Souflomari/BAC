          - math: '\sin\theta \approx \theta \implies \frac{1}{3}\ell\,\ddot\theta = -\frac{g}{2}\,\theta'
            note: "Approximation des petites oscillations, autorisee par l'énoncé. La masse et une longueur se simplifient."
          - math: '\boxed{\ddot\theta + \frac{3g}{2\ell}\,\theta = 0}'
