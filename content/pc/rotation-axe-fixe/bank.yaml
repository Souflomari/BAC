  - id: bk-2011-r-x1
    title: "Étude dynamique d'une grue : accélération de la charge et moment d'inertie de la poulie"
    source:
      year: 2011
      session: rattrapage
      filiere: "SPC"
      exercise_label: "Exercice Mécanique — 1ère situation : Étude dynamique d'une grue"
    bareme_total: 2.25
    duration_min: 14
    sourcing:
      status: sourced
      note: >-
