            note: "Mouvement sans frottements : l'énergie mécanique se conserve."
          - math: '\theta = \theta_m \implies \dot\theta = 0 \implies E_c = 0'
            note: "A l'écart maximal le pendule s'arrete avant de repartir : toute l'énergie y est potentielle."
          - math: 'E_m = E_{pp}(\theta_m)'
