    intro: |-
      **Étude dynamique d'une grue (examen national, session rattrapage 2011, Exercice Mécanique — 1ère situation).**

      On modélise une grue par une poulie $(\mathcal{P})$ homogène de rayon $r = 20\ \text{cm}$, susceptible de tourner autour d'un axe horizontal $(\Delta)$ fixe confondu avec son axe de symétrie, et un solide $(S_1)$ de masse $m_1 = 50\ \text{kg}$, relié à la poulie $(\mathcal{P})$ par un fil inextensible, de masse négligeable, passant sans glisser sur la gorge de la poulie au cours du mouvement. $J_\Delta$ désigne le moment d'inertie de la poulie $(\mathcal{P})$ par rapport à l'axe de rotation $(\Delta)$.

      La poulie $(\mathcal{P})$ tourne sous l'action d'un moteur lui communiquant un couple moteur de moment constant $\mathcal{M} = 104{,}2\ \text{N}\cdot\text{m}$, entraînant le solide $(S_1)$ vers le haut. On repère la position du centre d'inertie $G_1$ du solide $(S_1)$ à un instant $t$ par l'ordonnée $z$ dans le repère $(O, \vec{k})$ supposé galiléen (figure 1). $G_1$ coïncide avec l'origine $O$ du repère à l'instant $t_0 = 0$. On néglige tous les frottements et on prend $g = 10\ \text{m}\cdot\text{s}^{-2}$.

      **Figure 1 (schéma).** La poulie $(\mathcal{P})$ (disque) tourne autour de l'axe $(\Delta)$ horizontal passant par son centre ; le sens positif $(+)$ est fléché sur la poulie. Un axe vertical $z$ orienté vers le haut, d'origine $O$ ; le vecteur unitaire $\vec{k}$ pointe vers le haut. Le solide $(S_1)$, de centre d'inertie $G_1$, est suspendu au fil qui s'enroule sur la gorge de la poulie ; $G_1$ est confondu avec $O$ à $t_0 = 0$.
    questions:
      - id: q1
        part: "1ère situation — Étude dynamique d'une grue (rotation de la poulie)"
        stem: |-
          **(1,5 pt)** En appliquant la deuxième loi de Newton et la R.F.D en cas de rotation sur le système (Poulie, $S_1$, fil), montrer que l'accélération $a_{G_1}$ du mouvement de $G_1$ est :

          $$a_{G_1} = \frac{\mathcal{M}\cdot r - m_1\cdot g\cdot r^2}{m_1\cdot r^2 + J_\Delta}$$
        reasoning: |-
          On isole d'abord le solide $(S_1)$, en translation verticale : deux forces s'exercent sur lui, son poids $m_1\vec g$ et la tension $\vec T$ du fil. La deuxième loi de Newton, projetée sur l'axe ascendant $(O,\vec k)$, relie $a_{G_1}$ et $T$ dans une première équation.

          On isole ensuite la poulie $(\mathcal{P})$, en rotation autour de $(\Delta)$. Deux moments s'exercent sur elle : le moment moteur $\mathcal{M}$, qui l'entraîne, et le moment de la tension du fil, appliquée tangentiellement sur la gorge à la distance $r$ de l'axe (R2) — cette tension freine la rotation qui soulève $(S_1)$. Le poids de la poulie et la réaction de l'axe s'appliquent sur $(\Delta)$ elle-même : bras de levier nul, donc moment nul (R2), et ils disparaissent du bilan. La relation fondamentale de la dynamique de rotation (R4) relie alors l'accélération angulaire de la poulie à cette même tension $T$ : une deuxième équation.

          Reste à relier les deux équations. Le fil est inextensible et ne glisse pas sur la gorge : un point du fil se déplace exactement comme le point de la poulie à la distance $r$ de l'axe, avec une vitesse $r$ fois la vitesse angulaire de la poulie (R1, $v = d\omega$) — et c'est aussi la vitesse de $(S_1)$. En dérivant une fois de plus (R4), l'accélération de $(S_1)$ et l'accélération angulaire de la poulie sont liées par ce même facteur $r$ : c'est la condition de non-glissement qui permet de combiner les trois relations pour éliminer $T$ et l'accélération angulaire, et ne garder que $a_{G_1}$.
        steps:
          - math: 'm_1\,a_{G_1} = T - m_1\,g'
            note: >-
              Deuxieme loi de Newton sur le solide (S1), projete sur l'axe
              ascendant : poids et tension du fil sont les deux seules
              forces qui s'exercent sur lui.
          - math: 'J_\Delta\,\ddot\theta = \mathcal{M} - T\cdot r'
            note: >-
              Relation fondamentale de la dynamique de rotation sur la
              poulie : le moment moteur entraine, le moment de la tension
              du fil (bras de levier r) freine.
          - math: '\ddot\theta = \frac{a_{G_1}}{r}'
            note: >-
              Condition de non-glissement du fil sur la gorge de la
              poulie : relie l'acceleration lineaire de (S1) a
              l'acceleration angulaire de la poulie.
          - math: 'T = \frac{\mathcal{M}}{r} - \frac{J_\Delta\,a_{G_1}}{r^2}'
            note: >-
              On isole la tension T dans la relation fondamentale, en y
              remplacant l'acceleration angulaire par a_G1 / r.
          - math: 'm_1\,a_{G_1} = \frac{\mathcal{M}}{r} - \frac{J_\Delta\,a_{G_1}}{r^2} - m_1\,g'
            note: >-
              On substitue cette expression de la tension dans l'equation
              de Newton ecrite sur (S1) : la tension a disparu.
          - math: 'a_{G_1}\left(m_1 + \frac{J_\Delta}{r^2}\right) = \frac{\mathcal{M}}{r} - m_1\,g'
            note: "On regroupe tous les termes en a_G1 d'un meme cote."
          - math: '\boxed{a_{G_1} = \dfrac{\mathcal{M}\cdot r - m_1\cdot g\cdot r^2}{m_1\cdot r^2 + J_\Delta}}'
            note: >-
              On multiplie numerateur et denominateur par r carre : on
              retrouve exactement la forme demandee.
      - id: q2
        stem: |-
          **(0,75 pt)** L'étude expérimentale du mouvement de $G_1$ a permis d'établir l'équation horaire $z = 0{,}2\,t^2$, avec $z$ en mètre et $t$ en seconde. Déterminer le moment d'inertie $J_\Delta$ de la poulie $(\mathcal{P})$ par rapport à l'axe $(\Delta)$.
        reasoning: |-
          L'équation horaire donnée, $z = 0{,}2\,t^2$, ne comporte ni terme constant ni terme linéaire en $t$ : cohérent avec un départ du repos, $G_1$ confondu avec $O$ à $t_0 = 0$, exactement les conditions initiales de l'énoncé. C'est la signature d'un mouvement rectiligne uniformément accéléré, $z(t) = \frac12\,a_{G_1}\,t^2$ : on identifie terme à terme, $\frac12\,a_{G_1} = 0{,}2$.

          Il reste à relire l'équation de la question précédente dans l'autre sens : $a_{G_1}$ est maintenant connue (on vient de la calculer), et $J_\Delta$ est l'inconnue à isoler — la même relation, lue à l'envers.
        steps:
          - math: 'a_{G_1} = 2\times 0{,}2 = 0{,}4\ \text{m}\cdot\text{s}^{-2}'
            note: >-
              Identification par comparaison avec la forme generale d'un
              mouvement uniformement accelere partant du repos, z(t) =
              (1/2) a t^2.
          - math: 'J_\Delta = \dfrac{\mathcal{M}\cdot r - m_1\cdot g\cdot r^2}{a_{G_1}} - m_1\cdot r^2'
            note: >-
              On repart de la relation de la question 1 et on isole cette
              fois J_Delta au lieu de a_G1.
          - math: '\mathcal{M}\cdot r = 104{,}2\times 0{,}20 = 20{,}84 \qquad\qquad m_1\cdot g\cdot r^2 = 50\times 10\times 0{,}20^2 = 20{,}0'
            note: "Calcul separe des deux termes du numerateur."
          - math: 'J_\Delta = \dfrac{20{,}84 - 20{,}0}{0{,}4} - 50\times 0{,}20^2 = \dfrac{0{,}84}{0{,}4} - 2{,}0 = 2{,}1 - 2{,}0'
            note: >-
              Le quotient donne la somme (m1 r carre + J_Delta) ; on
              retranche ensuite m1 r carre pour isoler J_Delta seul.
          - math: '\boxed{J_\Delta = 0{,}10\ \text{kg}\cdot\text{m}^2}'
            note: "Moment d'inertie de la poulie par rapport a son axe (Delta)."

