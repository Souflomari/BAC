    intro: |-
      **Mouvement d'un pendule pesant — le balancier d'une horloge murale (examen national, session de rattrapage 2013 — exercice « Mécanique », 5,50 points).**

      L'homme a utilisé les hologes *(sic, pour « horloges »)* depuis longtemps, il a inventé plusieurs types tel que *(sic, pour « tels que »)* : l'horloge solaire, l'horloge hydraulique, l'horloge à sable… jusqu'à ce que le savant Huygens inventa *(sic — « jusqu'à ce que » régit le subjonctif)* l'horloge murale en 1657.

      Le fonctionnement de cette horloge dépend de son balancier, qu'on modélise par un **pendule pesant**, effectuant des petites oscillations libres sans frottements.

      Le pendule étudié est constitué d'une barre homogène $AB$, de masse $m = 0{,}203\ \text{kg}$, et de longueur $AB = \ell = 1{,}5\ \text{m}$, susceptible de tourner dans un plan vertical autour d'un axe horizontal $(\Delta)$, fixe et passant par son extrémité $A$ (**figure 1**).

      On étudie le mouvement du pendule dans un repère lié à la terre et supposé galiléen. On repère à chaque instant le pendule par son abscisse angulaire $\theta$.

      Le moment d'inertie de la barre par rapport à l'axe $(\Delta)$ est : $J_\Delta = \dfrac{1}{3}\,m\,\ell^2$.

      On admet que dans le cas des petites oscillations que *(sic — « que » redoublé)* : $\sin\theta \approx \theta$ avec $\theta$ en radian.

      On désigne l'intensité de pesanteur par la lettre $g$. *(Le sujet ne donne aucune valeur numérique de $g$ — et aucune des six questions n'en a besoin.)*

      On écarte le pendule de sa position d'équilibre stable d'un petit angle $\theta_m$ dans le sens positif, et on le lâche sans vitesse initiale à un instant choisi comme origine des temps.

      **Figure 1 — le pendule.** Schéma en élévation. À gauche, un axe vertical $Z$ fléché vers le haut, avec un point $O$ matérialisé par un tiret sur l'axe, à mi-hauteur — **$O$ est à la même hauteur que $G_0$**, ce qui matérialise le plan de référence défini plus bas. En haut, un point $A$ ; juste à sa gauche, l'étiquette $(\Delta)$ — l'axe de rotation vu en bout. De $A$ part une barre épaisse, oblique vers le bas-droite, qui se termine en $B$. De $A$ part aussi une verticale en tirets (la position d'équilibre de la barre) ; l'angle entre cette verticale et la barre est coté $\theta$, avec un petit arc. Sur la verticale en tirets, à mi-longueur, un point $G_0$ ; sur la barre, à la même distance de $A$, un point $G$ ; un arc en tirets relie $G_0$ à $G$. En bas à droite, sous $B$, une flèche courbe et un signe $+$ fixent le sens positif — celui de l'écartement dessiné.

      ---

      **2- Étude énergétique du pendule pesant** *(données communes aux questions 2-1 et 2-2)* **:**

      On choisit le plan horizontal contenant le point $G_0$, position du centre de gravité *(l'original arabe écrit « centre d'**inertie** » ; pour une barre homogène les deux points coïncident, la lecture n'est pas ambiguë)* $G$ de la barre à la position d'équilibre stable, comme état de référence de l'énergie potentielle de pesanteur ($E_{PP} = 0$).

      La **figure 2** représente les variations de l'énergie potentielle de pesanteur $E_{PP}(\theta)$ du pendule étudié dans l'intervalle $\left[-\theta_m\,,\,\theta_m\right]$.

      **Figure 2 — le diagramme d'énergie, décrit pour être exploité.** Tracé sur papier millimétré. *(Attention : le sujet remet ses numéros de figure à 1 dans l'exercice de mécanique — cette « figure 2 » n'a rien à voir avec celle de l'exercice d'électricité. C'est un trait du sujet, présent dans les deux éditions.)*

      - **axe vertical** $E_{pp}\ (\text{mJ})$, flèche vers le haut, graduations chiffrées **10** et **20** seulement ; **axe horizontal** $\theta\ (\text{rad})$, avec **trois repères portés sous l'axe** : $-\theta_m$, $0$, $\theta_m$ ;
      - **quadrillage à trois niveaux** : maille fine de $0{,}5\ \text{mJ}$ (et $\theta_m/30$ en abscisse), lignes intermédiaires tous les $2{,}5\ \text{mJ}$ (et $\theta_m/6$), lignes fortes tous les $5\ \text{mJ}$ (et $\theta_m/3$) ;
      - **cadre** : $E_{pp} \in [0\,;\,30]\ \text{mJ}$ ; en abscisse, le cadre déborde de $0{,}2\,\theta_m$ de part et d'autre de $\pm\theta_m$ ;
      - **la courbe** est une **parabole** de sommet exactement à l'origine $(0\,;\,0)$, tracée d'un bord à l'autre entre les verticales $-\theta_m$ et $+\theta_m$, parfaitement symétrique ;
