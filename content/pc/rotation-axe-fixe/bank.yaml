        en une passe adversariale (agent-vérificateur-indépendant,
        2026-08-07), diff OK — figure 3, données et énoncé relus au zoom
        ×3,2, aucune divergence de valeur, unité, indice ou exposant
        (docs/sujets/pc/rotation-axe-fixe.md, statut « vérifié »).
        Convention de transcription signalée dans la source et reprise ici
        sans la trancher : le cylindre est noté $(\mathcal{S})$ par
        convention uniforme — le scan porte deux glyphes différents pour le
        même objet (un artefact de police lisible comme un « i » vectoriel
        à trois endroits, et une capitale calligraphique compatible avec
        $\mathcal{S}$ comme avec $\mathcal{E}$ aux deux autres, non
        tranchable au zoom ×18) ; l'identité de l'objet est certaine, seule
        la lettre précise reste non confirmée — sans incidence sur la
        physique de l'exercice. Physique re-dérivée et cohérente :
        $\ddot\theta = 40\ \text{rad/s}^2 \Rightarrow a_G = r\,\ddot\theta =
        0{,}10\times40 = 4\ \text{m/s}^2$ (Q1-1) ;
        $d = \frac12 a_G t^2 = \frac12\times4\times2^2 = 8\ \text{m}$
        (Q1-2) ; $\mathcal{M} = \frac{a_G}{r}(J_\Delta + m\,r^2) +
        m\,g\,r\sin\alpha = 40\times1{,}02 + 70{,}7 \approx
        111{,}5\ \text{N}\cdot\text{m}$ (Q2) — l'énoncé est auto-cohérent.
    intro: |-
      **Mouvement d'un système mécanique (examen national, session normale 2024, Exercice 5 — Partie 2).**

      On se propose d'étudier le mouvement d'un système mécanique et de déterminer quelques paramètres de ce mouvement. Ce système mécanique, représenté sur la figure 3, est constitué :
      - d'une charge $(C)$ de masse $m$ et de centre d'inertie $G$ susceptible de glisser sans frottement sur un plan incliné d'un angle $\alpha$ par rapport au plan horizontal ;
      - d'un cylindre $(\mathcal{S})$ de rayon $r$ et de moment d'inertie $J_\Delta$ par rapport à son axe de rotation $(\Delta)$. Le cylindre est susceptible de tourner sans frottement autour de l'axe $(\Delta)$ sous l'effet d'un couple moteur de moment $\mathcal{M}$ constant ;
      - d'un câble inextensible de masse négligeable qui s'enroule sans glissement sur $(\mathcal{S})$ et attaché à la charge $(C)$.

      **Données :** $g = 10\ \text{m}\cdot\text{s}^{-2}$ ; $r = 10\ \text{cm}$ ; $m = 100\ \text{kg}$ ; $\alpha = 45°$ ; $J_\Delta = 2\cdot10^{-2}\ \text{kg}\cdot\text{m}^2$.

      On étudie le mouvement du système mécanique $\{(C)\,;\,(\mathcal{S})\}$ dans un repère lié à un référentiel terrestre supposé galiléen. On repère la position d'un point du cylindre à chaque instant $t$ par son abscisse angulaire $\theta$, et la position du centre d'inertie $G$ de $(C)$ par son abscisse $x$ suivant l'axe $(O, \vec{i})$.

      **Figure 3 (schéma).** Un plan incliné rectiligne monte, de gauche à droite, depuis un point $O$ (bas) jusqu'à une poulie/cylindre $(\mathcal{S})$ (cercle, centre marqué d'un point) monté sur son axe $(\Delta)$ (en haut à droite du schéma) ; une flèche courbe au-dessus du cylindre, orientée dans le sens horaire, porte le signe « + » (sens positif choisi pour la rotation). Sur le plan incliné, un petit carré étiqueté « (C) » représente la charge, avec son centre d'inertie $G$ marqué d'un point à l'intérieur. Un câble (segment épais), étiqueté « câble », relie la charge au cylindre le long de la pente ; une flèche en pointillés « x », partant d'un point proche de la charge et dirigée vers le cylindre le long du câble, matérialise l'axe $(O,\vec i)$. À l'origine $O$ (bas du plan incliné), un repère est tracé : le vecteur $\vec{i}$ (flèche pleine) est porté par le plan incliné, orienté vers le haut de la pente ; le vecteur $\vec{j}$ (flèche pleine), avec l'axe « y » associé (en pointillés), est perpendiculaire à $\vec{i}$, orienté vers le haut-gauche. Une droite horizontale en pointillés part de $O$ vers la droite ; l'angle $\alpha$ est marqué entre cette horizontale et le plan incliné, au niveau de $O$.
    questions:
      - id: q1
        part: "1- Mouvement d'un système mécanique : cinématique du cylindre et de la charge"
        stem: |-
          L'équation horaire du mouvement d'un point du cylindre $(\mathcal{S})$ s'écrit : $\theta(t) = 20\,t^2$, avec $\theta$ en rad et $t$ en s.

          **(0,5 pt)** **1-1.** Vérifier que l'accélération du mouvement de $G$ est : $a_G = 4\ \text{m/s}^2$.
        reasoning: |-
          On dérive deux fois l'équation horaire $\theta(t) = 20\,t^2$ : $\dot\theta = 40\,t$, puis $\ddot\theta = 40\ \text{rad}\cdot\text{s}^{-2}$ — une accélération angulaire constante.

          Le câble est inextensible et ne glisse pas sur le cylindre : un point de sa surface, à la distance $r$ de l'axe, se déplace comme la charge $(C)$ qu'il tire. Sa vitesse vaut donc $r$ fois la vitesse angulaire du cylindre (chapitre 2, $v = d\,\omega$), et son accélération tangentielle vaut $r$ fois l'accélération angulaire (chapitre 5, $a_{tan} = d\,\ddot\theta$) — c'est aussi, par le lien rigide du câble, l'accélération $a_G$ de $G$. D'où $a_G = r\,\ddot\theta$.
        steps:
          - math: '\theta(t) = 20\,t^2 \implies \dot\theta = 40\,t \implies \ddot\theta = 40\ \text{rad}\cdot\text{s}^{-2}'
            note: "On derive deux fois l'équation horaire : accélération angulaire constante."
          - math: 'a_G = r\,\ddot\theta'
            note: >-
              Câble inextensible sans glissement sur le cylindre : même
              relation qu'au chapitre 2 (v = d omega), dérivée une fois de
              plus (chapitre 5).
          - math: 'a_G = 0{,}10\times 40'
            note: "Application numérique, r = 10 cm = 0,10 m."
          - math: '\boxed{a_G = 4\ \text{m/s}^2}'
            note: "Valeur donnée par l'énoncé, bien vérifiée."
      - id: q2
        stem: |-
          **(0,75 pt)** **1-2.** Déterminer la distance $d$ parcourue par $G$ pendant les deux premières secondes.
        reasoning: |-
          Le câble étant inextensible et sans glissement, la position $x$ de $G$ est liée à $\theta$ par la même relation qu'à la question précédente, intégrée plutôt que dérivée : $x(t) = r\,\theta(t)$. Comme $\theta(t) = 20\,t^2$ ne comporte ni terme constant ni terme linéaire (départ du repos), $x(t)$ est aussi un mouvement uniformément accéléré, $x(t) = \frac12\,a_G\,t^2$, avec $a_G = 4\ \text{m/s}^2$ trouvée à la question précédente. Il suffit d'évaluer à $t = 2\ \text{s}$.
        steps:
          - math: 'x(t) = \frac{1}{2}\,a_G\,t^2'
            note: >-
              Mouvement uniformément accelere à partir du repos, avec
              a_G = 4 m/s^2 (question précédente).
          - math: 'd = x(2) = \frac{1}{2}\times 4\times 2^2'
            note: "Distance parcourue par G entre t = 0 et t = 2 s."
          - math: '\boxed{d = 8\ \text{m}}'
            note: "Distance parcourue pendant les deux premières secondes."
      - id: q3
        part: "2- Mouvement d'un système mécanique : bilan des actions et moment moteur"
        stem: |-
          **(1 pt)** **2.** En appliquant la deuxième loi de Newton et la relation fondamentale de la dynamique dans le cas de la rotation au système mécanique $\{(C)\,;\,(\mathcal{S})\}$, montrer que :

          $$\mathcal{M} = \frac{a_G}{r}\left(J_\Delta + m\,r^2\right) + m\,g\,r\sin\alpha$$

          Calculer la valeur de $\mathcal{M}$.
        reasoning: |-
          On isole la charge $(C)$, en translation le long de la pente. Trois forces s'exercent sur elle : son poids $m\vec g$, la réaction normale du plan (perpendiculaire à la pente, sans effet sur le mouvement le long de la pente), et la tension $\vec T$ du câble qui la tire vers le haut. Comme la pente fait un angle $\alpha$ avec l'horizontale, le poids se projette sur l'axe de la pente en une composante $mg\sin\alpha$ qui s'oppose à la montée — une décomposition du poids sur un plan incliné qui n'est pas un outil de ce chapitre (elle vient de « Les lois de Newton », au chapitre du solide sur un plan incliné), reprise ici telle quelle. La deuxième loi de Newton, projetée sur l'axe $(O,\vec i)$ orienté vers le haut de la pente, donne une première équation reliant $a_G$ et $T$.

          On isole ensuite le cylindre $(\mathcal{S})$, en rotation autour de $(\Delta)$. Deux moments agissent : le moment moteur $\mathcal{M}$, qui entraîne la rotation dans le sens positif marqué sur la figure, et le moment de la tension du câble (la même tension, par la troisième loi de Newton), qui s'exerce tangentiellement à la distance $r$ de l'axe et s'oppose à la rotation — exactement le même montage que la poulie de la grue (chapitres 3 et 5). La relation fondamentale de la dynamique de rotation (chapitre 5) donne une deuxième équation, reliant l'accélération angulaire du cylindre à cette même tension.

          La condition de non-glissement du câble (question 1-1, chapitres 2 et 5) relie $a_G$ à l'accélération angulaire par le facteur $r$ : c'est elle qui permet de combiner les deux équations précédentes en une seule. Il ne reste plus qu'à éliminer la tension $T$, inconnue et non demandée, entre les trois relations pour isoler $\mathcal{M}$.
        steps:
          - math: 'm\,a_G = T - m\,g\sin\alpha'
            note: >-
              Deuxième loi de Newton sur la charge (C), projetée sur l'axe
              de la pente oriente vers le haut : poids projete
              (m g sin alpha) et tension du cable.
          - math: 'J_\Delta\,\ddot\theta = \mathcal{M} - T\cdot r'
            note: >-
              Relation fondamentale de la dynamique de rotation sur le
              cylindre : le moment moteur entraine, le moment de la
              tension du cable (bras de levier r) freine.
          - math: '\ddot\theta = \frac{a_G}{r}'
            note: "Condition de non-glissement du câble, déjà utilisée a la question 1-1."
          - math: 'T = m\,a_G + m\,g\sin\alpha'
            note: "On isole la tension à partir de l'équation de Newton sur la charge."
          - math: 'J_\Delta\,\frac{a_G}{r} = \mathcal{M} - r\left(m\,a_G + m\,g\sin\alpha\right)'
            note: >-
              On substitue la tension et l'accélération angulaire dans la
              relation fondamentale.
          - math: '\mathcal{M} = J_\Delta\,\frac{a_G}{r} + m\,a_G\,r + m\,g\,r\sin\alpha'
            note: "On isole M."
          - math: '\boxed{\mathcal{M} = \frac{a_G}{r}\left(J_\Delta + m\,r^2\right) + m\,g\,r\sin\alpha}'
            note: >-
              On factorise a_G/r : m a_G r = (a_G/r)(m r carré), on
              retrouve exactement la forme demandee.
          - math: '\frac{a_G}{r} = \frac{4}{0{,}10} = 40\ \text{s}^{-2}'
            note: "Application numérique du premier facteur."
          - math: 'J_\Delta + m\,r^2 = 2\times10^{-2} + 100\times0{,}10^2 = 0{,}02+1{,}0 = 1{,}02\ \text{kg}\cdot\text{m}^2'
            note: "Somme entre parenthèses, avec J_Delta et m r carré donnes."
          - math: '\frac{a_G}{r}\left(J_\Delta+m\,r^2\right) = 40\times 1{,}02 = 40{,}8\ \text{N}\cdot\text{m}'
            note: "Premier terme de M."
          - math: 'm\,g\,r\sin\alpha = 100\times10\times0{,}10\times\sin45^\circ \approx 100\times10\times0{,}10\times0{,}707 \approx 70{,}7\ \text{N}\cdot\text{m}'
            note: "Second terme de M, avec sin 45 degrés environ 0,707."
          - math: '\boxed{\mathcal{M} = 40{,}8+70{,}7 \approx 111{,}5\ \text{N}\cdot\text{m}}'
            note: "Moment moteur nécessaire, cohérent avec la physique re-derivee en sourcing."

