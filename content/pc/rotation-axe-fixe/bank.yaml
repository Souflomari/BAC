        stem: |-
          **1-1-** (1 pt) Par application de la relation fondamentale de la dynamique de rotation, établir l'équation différentielle du mouvement du pendule.
        reasoning: |-
          C'est le chapitre 7 dans son intégralité, et il met au travail les chapitres 3, 4 et 5 en même temps. Trois gestes, dans l'ordre.

          **1. Le bilan des moments, par rapport à l'axe $(\Delta)$ — pas des forces, des MOMENTS.** Deux forces s'exercent sur la barre :

          - la **réaction de l'axe** $\vec R$, appliquée **sur l'axe lui-même** : sa ligne d'action passe par $(\Delta)$, donc son bras de levier est nul, donc son moment est nul (chapitre 3). Elle disparaît du bilan — et il faut le **dire**, pas l'oublier en silence ;
          - le **poids** $\vec P = m\vec g$, appliqué au centre d'inertie $G$. La barre étant homogène, $G$ est en son milieu : $\Delta G = \dfrac{\ell}{2}$.

          **2. Le moment du poids, et son signe.** Le poids est vertical. Quand la barre fait un angle $\theta$ avec la verticale, le vrai bras de levier — la distance de l'axe à la **ligne d'action** du poids — vaut $\dfrac{\ell}{2}\sin\theta$. Le moment est donc, en norme, $m\,g\,\dfrac{\ell}{2}\sin\theta$, et il est **négatif** parce qu'il tend **toujours** à ramener $\theta$ vers zéro, de quelque côté qu'on ait écarté la barre :

          $$\mathcal{M}_\Delta(\vec P) = -\,m\,g\,\frac{\ell}{2}\,\sin\theta$$

          **3. La relation fondamentale de la dynamique de rotation** (chapitre 5), avec ce seul moment non nul :

          $$J_\Delta\,\ddot\theta = \sum \mathcal{M}_\Delta \qquad\Longrightarrow\qquad \frac{1}{3}m\ell^2\,\ddot\theta = -\,m\,g\,\frac{\ell}{2}\,\sin\theta$$

          **L'approximation, et seulement maintenant.** L'équation ci-dessus est exacte mais n'est pas celle d'un oscillateur harmonique, à cause du $\sin\theta$. L'énoncé autorise $\sin\theta \approx \theta$ (petites oscillations). On remplace, puis on simplifie par $m$ et par $\ell$ — les deux disparaissent, ce qui est déjà un résultat :

          $$
          \frac{1}{3}\ell\,\ddot\theta = -\,\frac{g}{2}\,\theta
          \qquad\Longrightarrow\qquad
          \boxed{\ddot\theta + \frac{3g}{2\ell}\,\theta = 0}
          $$

          **Ce que la forme obtenue annonce.** C'est $\ddot\theta + \omega_0^2\,\theta = 0$, avec $\omega_0^2 = \dfrac{3g}{2\ell}$ : l'équation d'un **oscillateur harmonique**. La question 1-2 va en écrire la solution, la 1-3 en tirer la période.

          **Les deux pièges de cette question.** D'abord, oublier de justifier que le moment de la réaction de l'axe est nul : c'est un point de barème, pas une évidence. Ensuite, prendre $\ell$ comme bras de levier au lieu de $\ell/2$ : le poids s'applique en $G$, au milieu de la barre, pas en $B$. *(Et remarque que $J_\Delta = \frac13 m\ell^2$ — la valeur « tige, axe à une extrémité » du chapitre 4 — est bien celle que l'énoncé donne : elle est cohérente avec la géométrie décrite.)*
