      - id: q2
        stem: |-
          **1-2-** (1 pt) Préciser la nature du mouvement du pendule pesant, et écrire son équation horaire $\theta(t)$ en fonction de $t$, $\theta_m$ et la période *(sic)* propre $T_0$.
        reasoning: |-
          **La nature du mouvement se lit sur la forme de l'équation, pas sur le dessin.** L'équation de la question 1-1 est $\ddot\theta + \omega_0^2\theta = 0$ avec $\omega_0^2 = \dfrac{3g}{2\ell}$ : c'est la signature d'un **oscillateur harmonique**. Le mouvement est donc un **mouvement de rotation oscillatoire sinusoïdal**, de pulsation propre $\omega_0 = \sqrt{\dfrac{3g}{2\ell}}$ — et il est *isochrone*, c'est-à-dire que sa période ne dépend pas de l'amplitude $\theta_m$ (tant que celle-ci reste petite). C'est précisément la propriété qui a permis à Huygens d'en faire une horloge.

          **La solution générale** de cette équation s'écrit

          $$\theta(t) = \theta_{max}\cos\!\left(\frac{2\pi}{T_0}\,t + \varphi\right)$$

          et il reste à déterminer les **deux** constantes $\theta_{max}$ et $\varphi$ avec les **deux** conditions initiales que l'énoncé fournit.

          **Condition 1 — la position.** On lâche le pendule écarté de $\theta_m$ : $\theta(0) = \theta_m$, donc $\theta_{max}\cos\varphi = \theta_m$.

          **Condition 2 — la vitesse.** On le lâche **sans vitesse initiale** : $\dot\theta(0) = 0$. Or $\dot\theta(t) = -\theta_{max}\dfrac{2\pi}{T_0}\sin\!\left(\dfrac{2\pi}{T_0}t + \varphi\right)$, donc $\sin\varphi = 0$, soit $\varphi = 0$ ou $\varphi = \pi$.

          En reportant dans la condition 1 : $\varphi = 0$ donne $\theta_{max} = \theta_m > 0$, ce qui convient ; $\varphi = \pi$ donnerait $\theta_{max} = -\theta_m$, la même courbe écrite autrement. On retient la forme la plus simple :

          $$\boxed{\theta(t) = \theta_m\cos\!\left(\frac{2\pi}{T_0}\,t\right)}$$

          **La vérification, en trois secondes.** À $t = 0$ : $\cos 0 = 1$, donc $\theta(0) = \theta_m$ ✓. Et la dérivée en $0$ contient $\sin 0 = 0$, donc $\dot\theta(0) = 0$ ✓. Les deux conditions initiales sont satisfaites.

          **Le piège de cette question.** Écrire un **sinus**. Un sinus vaut $0$ à $t = 0$ : cela décrirait un pendule lâché **depuis la verticale avec une vitesse**, ce qui n'est pas l'expérience décrite. Le choix cosinus/sinus n'est jamais une question de goût : il est imposé par les conditions initiales. Second piège : laisser $\varphi$ dans la réponse alors que la consigne demande $\theta(t)$ **en fonction de $t$, $\theta_m$ et $T_0$** — trois symboles, et pas un de plus.
        steps:
          - math: '\ddot\theta + \omega_0^2\,\theta = 0 \qquad \omega_0 = \sqrt{\frac{3g}{2\ell}}'
            note: "Forme de l'équation établie a la question 1-1 : oscillateur harmonique."
          - math: '\theta(t) = \theta_{max}\cos\!\left(\frac{2\pi}{T_0}t + \varphi\right)'
            note: "Solution générale ; deux constantes a fixer avec les deux conditions initiales."
          - math: '\dot\theta(0) = 0 \implies \sin\varphi = 0 \implies \varphi = 0'
            note: "Lache sans vitesse initiale : la phase est nulle."
          - math: '\theta(0) = \theta_m \implies \theta_{max} = \theta_m'
            note: "Lache depuis l'écart maximal : l'amplitude est theta_m."
          - math: '\boxed{\theta(t) = \theta_m\cos\!\left(\frac{2\pi}{T_0}\,t\right)}'
            note: "Équation horaire, en fonction de t, theta_m et T0 seulement, comme la consigne le demande."
      - id: q3
        stem: |-
          **1-3-** (1 pt) Montrer que l'expression de la période propre $T_0$ est : $T_0 = 2\pi\sqrt{\dfrac{2\,\ell}{3g}}$.
        reasoning: |-
          La consigne dit « **montrer** » : il faut une démonstration, pas une identification de tête. Deux voies mènent au résultat ; la seconde est celle que le barème attend, parce qu'elle **utilise** l'équation horaire de la question précédente.

          **Voie 1 — par identification directe.** L'équation $\ddot\theta + \omega_0^2\theta = 0$ de la question 1-1 donne $\omega_0^2 = \dfrac{3g}{2\ell}$, et la période d'un oscillateur harmonique est $T_0 = \dfrac{2\pi}{\omega_0}$ :

          $$T_0 = \frac{2\pi}{\sqrt{\dfrac{3g}{2\ell}}} = 2\pi\sqrt{\frac{2\ell}{3g}} \qquad\checkmark$$

          **Voie 2 — par report de la solution dans l'équation**, la démonstration complète. On repart de $\theta(t) = \theta_m\cos\!\left(\dfrac{2\pi}{T_0}t\right)$ et on dérive deux fois :

          $$
          \dot\theta = -\theta_m\frac{2\pi}{T_0}\sin\!\left(\frac{2\pi}{T_0}t\right)
          \qquad
          \ddot\theta = -\theta_m\left(\frac{2\pi}{T_0}\right)^{2}\cos\!\left(\frac{2\pi}{T_0}t\right)
          $$

          On reporte $\theta$ et $\ddot\theta$ dans l'équation différentielle :

          $$-\theta_m\left(\frac{2\pi}{T_0}\right)^{2}\cos\!\left(\frac{2\pi}{T_0}t\right) + \frac{3g}{2\ell}\,\theta_m\cos\!\left(\frac{2\pi}{T_0}t\right) = 0$$

          $$\theta_m\cos\!\left(\frac{2\pi}{T_0}t\right)\left[\frac{3g}{2\ell} - \left(\frac{2\pi}{T_0}\right)^{2}\right] = 0$$

          **L'argument qui conclut, et c'est lui qui vaut le point.** Cette égalité doit être vraie **à tout instant** $t$. Or le facteur $\theta_m\cos\!\left(\frac{2\pi}{T_0}t\right)$ n'est pas identiquement nul (il ne s'annule qu'à des instants isolés). C'est donc le **crochet** qui doit s'annuler :

          $$
          \left(\frac{2\pi}{T_0}\right)^{2} = \frac{3g}{2\ell}
          \qquad\Longrightarrow\qquad
          \frac{2\pi}{T_0} = \sqrt{\frac{3g}{2\ell}}
          \qquad\Longrightarrow\qquad
          \boxed{T_0 = 2\pi\sqrt{\frac{2\ell}{3g}}}
          $$

          **Le contrôle d'homogénéité, à faire systématiquement.** $\dfrac{\ell}{g}$ est une longueur divisée par une accélération, soit $\dfrac{\text{m}}{\text{m.s}^{-2}} = \text{s}^2$ ; sa racine est bien un temps. Et le facteur $\dfrac{2}{3}$, sans dimension, ne change rien.

          **Ce que la formule raconte, et le lien avec la question suivante.** Comparée à la période d'un pendule simple, $T = 2\pi\sqrt{L/g}$, l'expression obtenue est **la même**, à condition de remplacer $L$ par $\dfrac{2\ell}{3}$. Une barre de $1{,}5\ \text{m}$ pivotant par son extrémité bat donc comme un fil de $1{,}0\ \text{m}$ — et c'est exactement ce que la question 1-4 va faire dire.

          **Le piège de cette question.** Écrire $T_0 = 2\pi\sqrt{\dfrac{3g}{2\ell}}$ en oubliant que la période est l'**inverse** de la pulsation à $2\pi$ près. Le contrôle d'homogénéité l'attrape immédiatement.
        steps:
          - math: '\theta(t) = \theta_m\cos\!\left(\frac{2\pi}{T_0}t\right) \implies \ddot\theta = -\theta_m\left(\frac{2\pi}{T_0}\right)^{2}\cos\!\left(\frac{2\pi}{T_0}t\right)'
            note: "Dérivée seconde de l'équation horaire établie a la question 1-2."
          - math: '\theta_m\cos\!\left(\frac{2\pi}{T_0}t\right)\left[\frac{3g}{2\ell} - \left(\frac{2\pi}{T_0}\right)^{2}\right] = 0'
            note: "Report de theta et theta point point dans l'équation différentielle, puis factorisation."
          - math: '\theta_m\cos\!\left(\frac{2\pi}{T_0}t\right) \neq 0 \implies \left(\frac{2\pi}{T_0}\right)^{2} = \frac{3g}{2\ell}'
            note: "L'égalité vaut a tout instant et le facteur n'est pas identiquement nul : c'est le crochet qui s'annule. C'est l'argument qui vaut le point."
          - math: '\boxed{T_0 = 2\pi\sqrt{\frac{2\ell}{3g}}}'
            note: "Expression demandee. Controle : racine de (longueur / accélération) est bien un temps."
      - id: q4
        stem: |-
          **1-4-** (0,75 pt) Calculer la valeur de la longueur $L$ du pendule simple synchrone au *(sic, pour « synchrone **du** » ou « synchrone **avec le** »)* pendule pesant étudié.
        reasoning: |-
          **Ce que « synchrone » veut dire, et c'est toute la question.** Deux pendules sont synchrones lorsqu'ils battent à la **même période**. On cherche donc la longueur $L$ du fil d'un pendule simple qui aurait exactement la période propre du pendule pesant étudié.

          **La période du pendule simple** — un point matériel au bout d'un fil de longueur $L$ — est celle du chapitre « Systèmes oscillants » :

          $$T = 2\pi\sqrt{\frac{L}{g}}$$

          **La condition de synchronisme**, et la simplification qui suit :

          $$
          2\pi\sqrt{\frac{L}{g}} = 2\pi\sqrt{\frac{2\ell}{3g}}
          \qquad\Longrightarrow\qquad
          \frac{L}{g} = \frac{2\ell}{3g}
          \qquad\Longrightarrow\qquad
          \boxed{L = \frac{2\ell}{3}}
          $$

          **Le $g$ disparaît des deux côtés** — ce qui est heureux, puisque le sujet n'en donne aucune valeur numérique. Le résultat est **exact**, pas approché :

          $$L = \frac{2 \times 1{,}5}{3} = \boxed{1{,}0\ \text{m}}$$

          **Ce que ce nombre raconte.** Une barre homogène de $1{,}5\ \text{m}$ suspendue par une extrémité oscille comme une masse ponctuelle au bout d'un fil de $1{,}0\ \text{m}$ — donc **plus vite** qu'un fil de $1{,}5\ \text{m}$. C'est le chapitre 4 qui l'explique : la masse de la barre est **répartie** sur toute sa longueur, une bonne partie se trouve près de l'axe, et cette masse-là contribue peu au moment d'inertie tout en contribuant pleinement au moment du poids. La longueur $\dfrac{2\ell}{3}$ porte un nom en mécanique : la **longueur équivalente** du pendule pesant.

          **Le piège de cette question.** Répondre $L = \ell/2 = 0{,}75\ \text{m}$ « puisque le centre d'inertie est au milieu ». Le centre d'inertie fixe le **moment du poids**, mais pas le moment d'inertie : les deux entrent dans la période, et leur combinaison donne $2\ell/3$, pas $\ell/2$. Un pendule pesant n'est jamais équivalent à un pendule simple placé en son centre d'inertie.
        steps:
          - math: 'T = 2\pi\sqrt{\frac{L}{g}} \qquad\text{(pendule simple de longueur } L)'
            note: "Période du pendule simple, du chapitre Systèmes oscillants."
          - math: '2\pi\sqrt{\frac{L}{g}} = 2\pi\sqrt{\frac{2\ell}{3g}}'
            note: "Condition de synchronisme : mêmes périodes."
          - math: '\frac{L}{g} = \frac{2\ell}{3g} \implies L = \frac{2\ell}{3}'
            note: "L'intensité de pesanteur se simplifie : le résultat ne dépend pas de g, que le sujet ne donne pas."
          - math: '\boxed{L = \frac{2\times 1{,}5}{3} = 1{,}0\ \text{m}}'
            note: "Longueur équivalente du pendule pesant. Résultat exact, sans arrondi."
      - id: q5
        part: "2- Étude énergétique du pendule pesant (par exploitation du diagramme d'énergie)"
        stem: |-
          **2-1-** (0,75 pt) Par exploitation du diagramme d'énergie (figure 2), donner la valeur de l'énrgie *(sic, pour « énergie »)* mécanique $E_m$ du pendule. *(L'original arabe écrit « **détermine** la valeur » ; la consigne française est affaiblie en « Donner » — c'est la seule consigne affaiblie des 33 du sujet.)*
        reasoning: |-
          **Un outil emprunté à une autre notion.** La lecture d'un diagramme d'énergie potentielle et la conservation de l'énergie mécanique relèvent aussi de « Systèmes oscillants ». La figure 2 est le diagramme du pendule **de la figure 1**, avec le **même** $\theta_m$ et le **même** $J_\Delta$ : la démonstration est refaite ici en entier.

          **L'argument, et il tient en deux lignes.** Le mouvement est **sans frottements** (l'énoncé le dit) : l'énergie mécanique se **conserve**, elle a donc la même valeur à tout instant, et il suffit de la calculer là où elle est le plus facile à lire.

          $$E_m = E_c + E_{pp} = \text{constante}$$

          Le meilleur endroit est l'**extrémité du mouvement**, $\theta = \pm\theta_m$ : c'est là que le pendule **s'arrête** avant de repartir, donc $\dot\theta = 0$, donc $E_c = 0$. Toute l'énergie mécanique y est purement potentielle :

          $$E_m = E_{pp}(\theta_m) + \underbrace{E_c(\theta_m)}_{=\,0} = E_{pp}(\theta_m)$$

          **La lecture sur la figure 2.** Il faut lire l'ordonnée des **extrémités** de la parabole, aux abscisses $\pm\theta_m$ — et la courbe est symétrique, les deux extrémités donnent la même valeur. Elles se situent **un peu au-dessus** de la ligne intermédiaire $22{,}5\ \text{mJ}$ :

          $$\boxed{E_m = E_{pp}(\theta_m) \approx 22{,}7\ \text{mJ}}$$

          **Sur la précision de cette lecture, honnêtement.** Le quadrillage a trois niveaux (fin $0{,}5\ \text{mJ}$, intermédiaire $2{,}5$, fort $5$), ce qui permet une lecture fine. Une réponse **$22{,}5\ \text{mJ}$** — la ligne intermédiaire juste en dessous — est parfaitement recevable, et elle redonne la même vitesse angulaire à la question suivante. Ce qui n'est **pas** recevable, c'est de lire $25\ \text{mJ}$ : ce niveau est une ligne **forte** du quadrillage, et la parabole passe nettement en dessous — de plus de huit largeurs de trait.

          **Le contrôle interne, gratuit, et il vaut la peine.** La courbe est une parabole exacte : $E_{pp} \propto \theta^2$. Si tu lis $E_{pp}\!\left(\tfrac{2}{3}\theta_m\right) \approx 10\ \text{mJ}$ — et c'est facile, le point tombe pratiquement sur une ligne —, alors la valeur en $\theta_m$ **doit** valoir $10 \times \left(\dfrac{3}{2}\right)^2 = 10 \times 2{,}25 = 22{,}5\ \text{mJ}$. Les deux lectures se contrôlent l'une l'autre, et elles concordent. Une lecture à $25\ \text{mJ}$ exigerait de lire $11{,}1\ \text{mJ}$ en $\tfrac{2}{3}\theta_m$ : les deux ne peuvent pas être vraies ensemble.

          **Le piège de cette question.** Chercher $E_m$ ailleurs qu'aux extrémités, par exemple en $\theta = 0$ — là où $E_{pp} = 0$ mais où $E_c$ est maximale et **illisible sur ce diagramme**, qui ne trace que l'énergie potentielle. Le diagramme ne donne accès à $E_m$ qu'aux points où la vitesse s'annule.
        steps:
