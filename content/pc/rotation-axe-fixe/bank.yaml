          - math: '\boxed{E_m \approx 22{,}7\ \text{mJ}}'
            note: "Lecture des extrémités de la parabole sur la figure 2. Une lecture a 22,5 mJ (ligne intermédiaire) est recevable et donne le même résultat en 2-2."
          - math: 'E_{pp}\!\left(\tfrac{2}{3}\theta_m\right) \times \left(\tfrac{3}{2}\right)^{2} = 10{,}1\times 2{,}25 \approx 22{,}7\ \text{mJ}'
            note: "Controle interne : la courbe est une parabole exacte, les deux lectures se confirment l'une l'autre."
      - id: q6
        stem: |-
          **2-2-** (1 pt) Par exploitation du diagramme d'énergie, trouver la valeur absolue de la vitesse angulaire $\dot\theta$ du pendule au passage par la position repérée par l'abscisse angulaire : $\theta = \dfrac{2}{3}\theta_m$.
        reasoning: |-
          **La stratégie, en une phrase :** l'énergie mécanique est connue (question 2-1) et constante ; on lit l'énergie potentielle à la position demandée ; la différence est l'énergie cinétique ; et l'énergie cinétique **de rotation** donne la vitesse angulaire.

          **Étape 1 — lire $E_{pp}$ à la position demandée.** Sur la figure 2, à l'abscisse $\dfrac{2}{3}\theta_m$ — soit deux cellules fortes sur les trois qui séparent $0$ de $\theta_m$ —, la parabole passe pratiquement sur la ligne $10$ :

          $$E_{pp}\!\left(\tfrac{2}{3}\theta_m\right) \approx 10{,}1\ \text{mJ}$$

          **Étape 2 — la conservation de l'énergie mécanique** (le mouvement est sans frottements) :

          $$E_c = E_m - E_{pp}\!\left(\tfrac{2}{3}\theta_m\right) = 22{,}7 - 10{,}1 = 12{,}6\ \text{mJ} = 12{,}6\times10^{-3}\ \text{J}$$

          **Étape 3 — l'énergie cinétique de ROTATION** (chapitre 6), et c'est là que le moment d'inertie entre en jeu :

          $$
          E_c = \frac{1}{2}\,J_\Delta\,\dot\theta^{\,2}
          \qquad\text{avec}\qquad
          J_\Delta = \frac{1}{3}m\ell^2 = \frac{1}{3}\times 0{,}203 \times 1{,}5^2 = 0{,}15225\ \text{kg}\cdot\text{m}^2
          $$

          **Étape 4 — isoler $\dot\theta$**, en remplaçant $J_\Delta$ par son expression pour obtenir une formule compacte :

          $$
          |\dot\theta| = \sqrt{\frac{2E_c}{J_\Delta}} = \sqrt{\frac{2E_c}{\frac13 m\ell^2}} = \sqrt{\frac{6\,E_c}{m\,\ell^2}}
          = \sqrt{\frac{6 \times 12{,}6\times10^{-3}}{0{,}203 \times 2{,}25}}
          = \sqrt{\frac{0{,}0756}{0{,}45675}}
          $$

          $$\boxed{|\dot\theta| \approx 0{,}41\ \text{rad.s}^{-1}}$$

          **Sur la robustesse du résultat, parce que la question vaut 1 point et repose sur une lecture graphique.** Si tu avais lu $E_m = 22{,}5\ \text{mJ}$ au lieu de $22{,}7$ — la ligne intermédiaire juste en dessous —, tu aurais $E_c = 12{,}4\ \text{mJ}$ et $|\dot\theta| = 0{,}404\ \text{rad.s}^{-1}$ : **la même réponse à deux chiffres**. La lecture n'a donc pas besoin d'être parfaite, elle a besoin d'être **honnête**. En revanche, une lecture **fausse** $E_m = 25\ \text{mJ}$ — celle que publient plusieurs corrigés en circulation pour ce sujet — conduirait à $0{,}44\ \text{rad.s}^{-1}$, soit $7\ \%$ d'écart, au-delà de toute tolérance. **Ces deux valeurs, $25\ \text{mJ}$ et $0{,}44\ \text{rad.s}^{-1}$, sont à écarter :** la parabole est mesurée à $22{,}7\ \text{mJ}$ en $\theta_m$, et un corrigé qui lit correctement $10\ \text{mJ}$ en $\tfrac{2}{3}\theta_m$ se contredit lui-même s'il écrit ensuite $25$. C'est pourquoi le contrôle de parabolicité de la question 2-1 vaut d'être fait : il te protège de cette erreur-là.

          **Un troisième chemin, pour qui veut vérifier sans la figure.** Avec $\theta(t) = \theta_m\cos(\omega_0 t)$, on a $\dot\theta = -\theta_m\omega_0\sin(\omega_0 t)$, et à $\theta = \tfrac{2}{3}\theta_m$ le cosinus vaut $2/3$, donc $|\sin| = \sqrt{1 - 4/9} = \dfrac{\sqrt5}{3}$ :

          $$|\dot\theta| = \theta_m\,\omega_0\,\frac{\sqrt5}{3}$$

          Avec $\omega_0 = \sqrt{\dfrac{3g}{2\ell}} = \sqrt{\dfrac{3 \times 9{,}8}{3}} = 3{,}13\ \text{rad.s}^{-1}$ et $\theta_m = 10^\circ = 0{,}1745\ \text{rad}$, cela donne $0{,}407\ \text{rad.s}^{-1}$ — la même valeur, par un chemin qui n'utilise ni le diagramme ni l'énergie. *(Ce contrôle demande $g$ et $\theta_m$, que le sujet ne donne pas : il n'est pas exigible en épreuve, mais il confirme la lecture.)*

          **Les deux pièges de cette question.** D'abord, écrire $E_c = \frac12 m v^2$ : le solide **tourne**, il ne se translate pas, et ses points n'ont pas tous la même vitesse — c'est $\frac12 J_\Delta\dot\theta^2$ qu'il faut, avec le moment d'inertie que l'énoncé donne. Ensuite, oublier de convertir les millijoules en joules : $12{,}6$ au lieu de $12{,}6\times10^{-3}$ ferait sortir une vitesse angulaire trente fois trop grande.
        steps:
          - math: 'E_{pp}\!\left(\tfrac{2}{3}\theta_m\right) \approx 10{,}1\ \text{mJ}'
            note: "Lecture sur la figure 2 a l'abscisse deux tiers de theta_m : la parabole passe pratiquement sur la ligne 10."
          - math: 'E_c = E_m - E_{pp} = 22{,}7 - 10{,}1 = 12{,}6\ \text{mJ} = 12{,}6\times10^{-3}\ \text{J}'
            note: "Conservation de l'énergie mécanique (mouvement sans frottements). Conversion en joules faite tout de suite."
          - math: 'J_\Delta = \frac{1}{3}m\ell^2 = \frac{1}{3}\times 0{,}203\times 1{,}5^2 = 0{,}15225\ \text{kg}\cdot\text{m}^2'
            note: "Moment d'inertie donne par l'énoncé, applique aux valeurs numériques."
          - math: 'E_c = \frac{1}{2}J_\Delta\,\dot\theta^{\,2} \implies |\dot\theta| = \sqrt{\frac{2E_c}{J_\Delta}} = \sqrt{\frac{6\,E_c}{m\,\ell^2}}'
            note: "Énergie cinétique de ROTATION (chapitre 6) : le solide tourne, il ne se translate pas."
          - math: '|\dot\theta| = \sqrt{\frac{6\times 12{,}6\times10^{-3}}{0{,}203\times 2{,}25}} = \sqrt{\frac{0{,}0756}{0{,}45675}} = \sqrt{0{,}1655}'
            note: "Application numérique."
          - math: '\boxed{|\dot\theta| \approx 0{,}41\ \text{rad.s}^{-1}}'
            note: "Valeur attendue : 0,4073 rad par seconde. Une lecture E_m = 22,5 mJ donnerait 0,404 : même réponse a deux chiffres."
