<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="620" height="480"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Un solide vu de face, en rotation autour d'un axe fixe Delta représenté par un point au centre. Une force F est appliquée en un point du solide ; sa droite d'action, prolongée en pointillé, passe à une distance d de l'axe — le bras de levier. L'angle theta repère la position angulaire du solide par rapport à une direction fixe, et une flèche courbe indique le sens de rotation positif choisi.">
  <title>Moment d'une force par rapport à un axe fixe Δ</title>
  <!--
    moment-force.svg — figure STAGED (4 étapes) pour M_Δ(F) = ±d·F.
      step-1 : le solide en rotation autour de Δ, sa position angulaire θ et
               son sens de rotation positif (le décor, avant toute force).
      step-2 : la force F, appliquée en A, et sa droite d'action prolongée
               dans les deux sens (le pointillé reste SOUS F — même z-order
               que la version statique, F peint par-dessus le pointillé
               dans leur zone de recouvrement, entre A et H).
      step-3 : le bras de levier d — la perpendiculaire de Δ à la droite
               d'action, PAS à A : geste pédagogique clé (d ≈ 96 px, plus
               court que R = |CA| = 150 px, précisément parce que F n'est
               pas tangentielle). Ce groupe ne recouvre ni la droite
               d'action ni F (vérifié géométriquement — x du segment d dans
               [283,300], hors de leur zone x∈[338,396]), donc le peindre
               après F ne change rien au rendu final.
      step-4 : le moment résultant, signé.

    Géométrie (calculée, pas devinée) :
      Axe Δ (perpendiculaire à la page) : C = (300, 260) — symbole ⊙ (cercle + point).
      Solide (vu de face) : rectangle arrondi x:100–500, y:70–410, centré sur C.

      Position angulaire θ = 50°, mesurée dans le sens trigonométrique (positif
      = sens anti-horaire à l'écran) depuis une direction fixe du référentiel
      (le rayon pointillé horizontal, C → (490,260)).
      Convention utilisée pour tout point à distance r de C et angle φ (dans ce
      sens positif) : P(φ) = C + r·(cos φ, −sin φ) — le signe "−" sur le sinus
      compense le repère SVG (y vers le bas) pour que φ croissant tourne bien
      anti-horaire à l'écran, comme le sens trigonométrique conventionnel.

      Point A (rayon attaché au solide, à θ = 50°, R = 150) :
        A = C + 150·(cos50°, −sin50°) = (396.4, 145.1) ≈ (396, 145).
      C'est en A qu'est appliquée la force F — un point matériel du solide,
      entraîné à la position angulaire θ.

      Force F : vecteur unitaire u = (−0.9842, 0.1770) (obtenu en inclinant la
      direction tangentielle en A de 50° vers la direction radiale — donc F
      n'est NI tangentielle ni radiale, pour que la droite d'action ne se
      confonde ni avec le cercle ni avec le rayon CA, et que la construction du
      bras de levier d soit non triviale).

      Pied de la perpendiculaire abaissée de C sur la droite d'action de F :
        t_H = (C−A)·u ≈ 114.84  →  H = A + t_H·u ≈ (283.0, 165.3).
      Bras de levier : d = |C H| ≈ 96.2 px (à comparer aux 150 px de R = |CA| :
      d < R, précisément parce que F n'est pas tangentielle — la distance qui
      compte est celle à la DROITE D'ACTION, pas au point d'application A).
      Vérification de perpendicularité : (H−C)·u ≈ 0 (produit scalaire nul).

      Signe du moment : le produit vectoriel (A−C) × u est négatif, exactement
      comme celui de (A−C) × (direction tangentielle du sens positif) — F fait
      donc tourner le solide dans le sens positif marqué par la flèche courbe :
      M_Δ(F) = +d·F sur cette figure.

      Arcs (θ et sens de rotation) : approximés par une courbe de Bézier
      quadratique dont le point de contrôle est placé sur la bissectrice à une
      distance r/cos(demi-angle) du centre — technique standard d'approximation
      d'un arc circulaire, qui évite toute ambiguïté de sweep-flag.

    Rôle des couleurs :
      solide, axe Δ, rayon CA, arc θ, sens de rotation : --figure-ink /
      --figure-ink-soft (structure neutre — ne varie pas d'un exemple à l'autre)
      F (force appliquée), droite d'action, bras de levier d, formule M_Δ(F) :
      --figure-accent (le contrat de rendu : accent = la force / le moment)
  -->

  <!-- Titre (permanent, ne change pas d'une étape à l'autre) -->
  <text x="300" y="26" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Moment d'une force par rapport à un axe fixe Δ
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le solide en rotation, θ et le sens positif
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- ── Le solide, vu de face ───────────────────────────────────────── -->
    <rect x="100" y="70" width="400" height="340" rx="30"
          fill="var(--figure-grid)" fill-opacity="0.35"
          stroke="var(--figure-ink)" stroke-width="1.8"/>

    <!-- ── Direction fixe du référentiel (référence de l'angle θ) ──────── -->
    <line x1="300" y1="260" x2="490" y2="260"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="450" y="250" text-anchor="middle" font-size="9.5"
          fill="var(--figure-ink-soft)">direction fixe (référence)</text>

    <!-- ── Rayon attaché au solide, jusqu'au point A où F est appliquée ── -->
    <line x1="300" y1="260" x2="396" y2="145"
          stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="396" cy="145" r="3.2" fill="var(--figure-ink)"/>

    <!-- ── Arc θ, entre la direction fixe et le rayon attaché au solide ── -->
    <path d="M342,260 Q342.0,240.4 327.0,227.8"
          fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <text x="352.6" y="239.5" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-ink)">θ</text>

    <!-- ── Sens de rotation positif (flèche courbe autour de Δ) ────────── -->
    <path d="M253.6,272.4 Q265.0,314.9 308.3,307.3"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <polygon points="316.2,305.9 309.0,311.2 307.6,303.3" fill="var(--figure-ink-soft)"/>
    <text x="283" y="332" text-anchor="middle" font-size="10"
          fill="var(--figure-ink-soft)">sens positif</text>

    <!-- ── Axe Δ (symbole ⊙ : perpendiculaire à la page) ───────────────── -->
    <circle cx="300" cy="260" r="6.5" fill="var(--figure-surface)"
            stroke="var(--figure-ink)" stroke-width="1.6"/>
    <circle cx="300" cy="260" r="2" fill="var(--figure-ink)"/>
    <text x="268" y="245" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-ink)">Δ</text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la force F et sa droite d'action prolongée
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- ── Droite d'action de F, prolongée en pointillé (dessinée sous F) -->
    <line x1="415.7" y1="141.5" x2="263.1" y2="168.9"
          stroke="var(--figure-accent)" stroke-width="1.4" stroke-dasharray="6,4"/>

    <!-- ── Force F, appliquée en A (dessinée par-dessus la droite d'action) -->
    <line x1="396" y1="145" x2="338.9" y2="155.3"
          stroke="var(--figure-accent)" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="327.1,157.4 339.8,160.2 338.0,150.3" fill="var(--figure-accent)"/>
    <!-- « F » passe AU-DESSUS de la droite d'action, qui la traversait de
         part en part (mesuré 100 %) — l'étiquette de la force était barrée
         par la droite qui porte cette force. -->
    <text x="306" y="148" text-anchor="middle" font-size="14" font-style="italic"
          fill="var(--figure-accent)">F</text>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — le bras de levier d (perpendiculaire de Δ à la
       droite d'action, pas à A)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- ── Bras de levier d = distance de Δ à la droite d'action ───────── -->
    <line x1="300" y1="260" x2="283.0" y2="165.3"
          stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- petite butée perpendiculaire, à l'extrémité côté Δ -->
    <line x1="304.9" y1="259.1" x2="295.1" y2="260.9"
          stroke="var(--figure-accent)" stroke-width="1.6"/>
    <!-- marque d'angle droit en H, contre la droite d'action -->
    <path d="M284.6,174.2 L275.7,175.8 L274.1,166.9"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="309" y="212" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">d</text>

  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — le moment résultant, signé
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">

    <!-- ── Formule ──────────────────────────────────────────────────────── -->
    <rect x="300" y="350" width="190" height="34" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="395" y="371" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">M<tspan
          dy="4" font-size="9" font-style="normal">Δ</tspan><tspan
          dy="-4">(F) = +d · F</tspan>
    </text>

  </g><!-- /step-4 -->

</svg>
