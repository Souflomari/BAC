<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="620" height="480"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Un pendule pesant : un solide quelconque pivote autour d’un axe fixe horizontal Delta, représenté par un point. Son centre d’inertie G est à une distance d de l’axe ; le segment Delta-G fait un angle theta avec la verticale, indiquée en pointillé, et une position fantôme montre où G se trouverait à l’équilibre stable, theta égal zéro. Le poids P, égal à m fois g, s’applique en G, verticalement vers le bas ; sa droite d’action est prolongée verticalement dans les deux sens. La perpendiculaire abaissée de l’axe sur cette droite d’action forme, avec le segment Delta-G, un triangle rectangle : le côté opposé à theta, de longueur d fois sinus theta, est le bras de levier ; une flèche courbe montre que le moment du poids ramène toujours l’angle theta vers zéro. Le moment du poids par rapport à Delta vaut donc moins m g d sinus theta.">
  <title>Le pendule pesant : bras de levier du poids et moment de rappel</title>
  <!--
    pendule-pesant-bras-levier.svg — figure STAGED (3 étapes) pour R6
    (rotation-axe-fixe) : M_Δ(P) = −mg·d·sinθ, construite géométriquement à
    partir du triangle rectangle Δ–H–G (H = pied de la perpendiculaire abaissée
    de Δ sur la droite d'action verticale du poids).
      step-1 : la géométrie seule — le solide, l'axe Δ, le centre d'inertie G,
               le segment ΔG (longueur d) faisant l'angle θ avec la verticale
               (pointillée), et une position fantôme montrant θ = 0, l'équilibre
               stable.
      step-2 : le poids — le vecteur P = mg, appliqué en G, vertical, et sa
               droite d'action prolongée dans les deux sens (même z-order que
               moment-force.svg : le pointillé est peint sous le vecteur).
      step-3 : le bras de levier — la perpendiculaire abaissée de Δ sur la
               droite d'action (segment ΔH, horizontal, PAS jusqu'à G : geste
               pédagogique clé, comme le bras de levier de R2 n'allait pas
               jusqu'au point d'application) ; le triangle rectangle Δ–H–G se
               referme avec une hypoténuse ΔG en pointillé fin ; le côté ΔH
               vaut d·sinθ, annoté "bras de levier" ; une flèche de rappel
               montre que le moment ramène toujours θ vers 0 ; conclusion
               encadrée M_Δ(P) = −mg·d·sinθ.

    Géométrie (calculée, pas devinée) :
      Axe Δ : C = (300, 90) — symbole ⊙ (axe horizontal, perpendiculaire au
      plan de la page = au plan d'oscillation, comme moment-force.svg).
      θ = 35° (angle générique, pas une valeur de l'exemple travaillé — le
      but ici est la construction géométrique, valable pour tout θ, pas
      seulement les petits angles de l'approximation harmonique).
      d = ΔG = 230 px (distance d'affichage, sans échelle physique dédiée —
      cette figure est une construction géométrique, pas un relevé chiffré).

      G = C + d·(sinθ, cosθ) = (300 + 230×0.5736, 90 + 230×0.8192)
        = (431.9, 278.4).
      (Paramétrage standard d'un pendule : x = d sinθ, y = d cosθ mesuré
      depuis Δ, θ compté depuis la verticale descendante.)

      Solide (schématique, pas à l'échelle d'une tige de longueur précise) :
      un rectangle arrondi tracé horizontalement puis tourné de 55° = 90°−θ
      autour de C (`transform="rotate(55 300 90)"`) — après rotation, son
      grand axe est exactement dans la direction (sinθ, cosθ), donc contient
      C et G par construction (vérifié : extrémité du rectangle après
      rotation = C + 260×(sinθ,cosθ) ≈ (449.1, 303.0), sur la droite CG).

      Droite d'action du poids (verticale, par G) : x = 431.9, la même pour
      toute la figure dès qu'elle apparaît en step-2.
      H = pied de la perpendiculaire abaissée de Δ = C sur cette droite
      verticale = (431.9, 90) (même ordonnée que Δ, puisque la droite est
      verticale et la perpendiculaire donc horizontale).
      Vérifications :
        |ΔH| = |431.9 − 300| = 131.9 ≈ 230×sin35° = 230×0.5736 = 131.9 ✓
          (c'est le bras de levier, annoté d·sinθ)
        |HG| = |278.4 − 90| = 188.4 ≈ 230×cos35° = 230×0.8192 = 188.4 ✓
          (le second côté du triangle rectangle, déjà tracé : c'est la
          portion de la droite d'action entre la hauteur de Δ et G)
        |ΔG| = 230 = d ✓ (hypoténuse, tracée en pointillé fin en step-3 pour
          fermer visuellement le triangle Δ–H–G)

      Arc θ : rayon 50 px, entre la verticale (φ=0 dans ce paramétrage local)
      et ΔG, point de contrôle sur la bissectrice (θ/2 = 17.5°) à
      50/cos17.5° ≈ 52.43 px de C — même technique d'approximation que les
      autres figures du chapitre.
      Flèche de rappel : même construction, rayon 70 px, mais tracée en sens
      INVERSE (de ΔG vers la verticale) pour montrer que le moment ramène θ
      vers 0, quel que soit le côté d'où l'écart est parti (cohérent avec le
      texte : "ce moment tend toujours à ramener θ vers 0").

    Rôle des couleurs :
      solide, axe Δ, verticale de référence, fantôme d'équilibre, arc θ,
      segment HG (portion de la droite d'action) : --figure-ink /
      --figure-ink-soft (structure neutre)
      poids P, sa droite d'action, le bras de levier ΔH, l'hypoténuse ΔG en
      pointillé, la flèche de rappel, la formule finale : --figure-accent
      (le contrat de rendu : accent = la force et le moment qu'elle produit)
  -->

  <!-- Titre (permanent, ne change pas d'une étape à l'autre) -->
  <text x="310" y="26" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Le pendule pesant : bras de levier du poids
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — la géométrie : solide, Δ, G, θ, équilibre θ=0
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- ── Le solide (schématique), tourné pour contenir Δ et G ─────────── -->
    <rect x="300" y="78" width="260" height="24" rx="12"
          fill="var(--figure-grid)" fill-opacity="0.35"
          stroke="var(--figure-ink)" stroke-width="1.6"
          transform="rotate(55 300 90)"/>

    <!-- ── Verticale de référence (pointillée) ──────────────────────────── -->
    <line x1="300" y1="90" x2="300" y2="340"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="5,4"/>

    <!-- ── Position fantôme de G à l'équilibre (θ = 0) ──────────────────── -->
    <circle cx="300" cy="320" r="4" fill="none"
            stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="312" y="324" text-anchor="start" font-size="9.5"
          fill="var(--figure-ink-soft)"><tspan font-style="italic">θ</tspan><tspan
          font-style="normal"> = 0 (équilibre stable)</tspan>
    </text>

    <!-- ── Arc θ, entre la verticale et ΔG ───────────────────────────────── -->
    <path d="M300,140 Q315.8,140.0 328.7,131.0"
          fill="none" stroke="var(--figure-ink)" stroke-width="1.4"/>
    <text x="320" y="153" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-ink)">θ</text>

    <!-- ── Distance d = ΔG, label décalé du corps du solide ─────────────── -->
    <text x="350" y="196" text-anchor="middle" font-size="12" font-style="italic"
          fill="var(--figure-ink-soft)">d</text>

    <!-- ── Axe Δ (symbole ⊙ : perpendiculaire au plan d'oscillation) ────── -->
    <circle cx="300" cy="90" r="6.5" fill="var(--figure-surface)"
            stroke="var(--figure-ink)" stroke-width="1.6"/>
    <circle cx="300" cy="90" r="2" fill="var(--figure-ink)"/>
    <text x="278" y="76" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-ink)">Δ</text>

    <!-- ── Centre d'inertie G ────────────────────────────────────────────── -->
    <circle cx="431.9" cy="278.4" r="4.5" fill="var(--figure-ink)"/>
    <text x="444" y="271" text-anchor="start" font-size="13" font-style="italic"
          fill="var(--figure-ink)">G</text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — le poids P = mg, appliqué en G, et sa droite d'action
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- ── Droite d'action du poids, verticale, prolongée (sous P) ──────── -->
    <line x1="431.9" y1="60" x2="431.9" y2="380"
          stroke="var(--figure-accent)" stroke-width="1.4" stroke-dasharray="6,4"/>

    <!-- ── Vecteur poids P, appliqué en G, vers le bas ──────────────────── -->
    <line x1="431.9" y1="278.4" x2="431.9" y2="347"
          stroke="var(--figure-accent)" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="431.9,357 425.9,345 437.9,345" fill="var(--figure-accent)"/>
    <text x="447" y="320" text-anchor="start" font-size="13"
          fill="var(--figure-accent)"><tspan font-style="italic">P</tspan><tspan
          font-style="normal"> = </tspan><tspan font-style="italic">mg</tspan>
    </text>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — le bras de levier ΔH = d·sinθ, le triangle, le rappel
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <!-- ── Hypoténuse ΔG, pointillé fin (ferme le triangle Δ–H–G) ───────── -->
    <line x1="300" y1="90" x2="431.9" y2="278.4"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>

    <!-- ── Bras de levier ΔH = d·sinθ (la perpendiculaire, pas jusqu'à G) ── -->
    <line x1="300" y1="90" x2="431.9" y2="90"
          stroke="var(--figure-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- petite butée perpendiculaire, à l'extrémité côté Δ -->
    <line x1="300" y1="86" x2="300" y2="94" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <!-- marque d'angle droit en H -->
    <path d="M423.9,90 L423.9,98 L431.9,98"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>

    <text x="366" y="112" text-anchor="middle" font-size="12"
          fill="var(--figure-accent)"><tspan font-style="italic">d</tspan><tspan
          font-style="normal">&#183;sin</tspan><tspan font-style="italic">θ</tspan>
    </text>
    <text x="366" y="124" text-anchor="middle" font-size="9"
          fill="var(--figure-ink-soft)">(bras de levier)</text>

    <!-- ── Flèche de rappel : le moment ramène toujours θ vers 0 ────────── -->
    <path d="M340.2,147.3 Q322.1,160.0 300,160"
          fill="none" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="294,160 302,155 302,165" fill="var(--figure-accent)"/>
    <text x="300" y="178" text-anchor="middle" font-size="9.5"
          fill="var(--figure-accent)">rappel vers <tspan font-style="italic">θ</tspan><tspan
          font-style="normal"> = 0</tspan>
    </text>

    <!-- ── Formule finale, encadrée ──────────────────────────────────────── -->
    <rect x="170" y="420" width="280" height="34" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="310" y="441" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">M<tspan
          dy="4" font-size="9" font-style="normal">Δ</tspan><tspan
          dy="-4" font-style="normal">(P) = −</tspan><tspan
          font-style="italic">mgd</tspan><tspan
          font-style="normal">&#183;sin</tspan><tspan font-style="italic">θ</tspan>
    </text>

  </g><!-- /step-3 -->

</svg>
