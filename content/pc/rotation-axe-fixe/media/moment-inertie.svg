<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Comparaison de deux solides de même masse totale (2,0 kilogrammes) et même longueur (1,0 mètre), tournant autour du même axe Delta perpendiculaire passant par le centre : à gauche une tige homogène, dont la masse est répartie continûment entre l'axe et les extrémités ; à droite un haltère, deux masses ponctuelles d'un kilogramme concentrées aux deux extrémités. Le moment d'inertie de l'haltère vaut trois fois celui de la tige, bien que la masse totale et la longueur soient identiques — seule la répartition de la masse autour de l'axe diffère. Un diagramme en barres, à l'échelle, rend cet écart visible.">
  <title>Le moment d'inertie J_Δ dépend de la répartition de la masse, pas seulement de la masse totale</title>
  <!--
    moment-inertie.svg — figure STAGED (3 étapes) reprenant EXACTEMENT le
    contre-exemple chiffré du rung R3 ("Arrête-toi — « même masse » ne veut
    pas dire « même J_Δ »") : une tige homogène contre un haltère, même masse
    totale (2,0 kg), même longueur (1,0 m), même axe Δ central — pour rendre
    visible que seule la répartition de la masse change J_Δ.
      step-1 : panneau A — la tige homogène, seule, avec son J calculé.
      step-2 : panneau B — l'haltère, seul, même masse et longueur, avec son
               J calculé (le geste : isoler chaque cas avant de les opposer).
      step-3 : la comparaison à l'échelle — le diagramme en barres qui rend
               le facteur 3 visible, pas seulement énoncé.
    Les trois blocs sont déjà contigus dans l'ordre du document d'origine ;
    aucune réorganisation n'était nécessaire pour les grouper.

    Échelle commune (calculée, pas devinée) : 200 px = 1,0 m → 100 px = L/2 =
    0,50 m. Les DEUX rayons (tige et haltère) utilisent exactement les mêmes
    100 px, pour que la longueur affichée soit identique par construction —
    seule la façon dont la masse est répartie le long de ce même segment change.

    Panneau A — tige homogène : m = 2,0 kg, L = 1,0 m.
      J_tige = (1/12) m L² = (1/12)×2,0×1,0² ≈ 0,167 kg·m² (calcul du texte, R3).
    Panneau B — haltère : deux masses ponctuelles de 1,0 kg aux extrémités,
    d = L/2 = 0,50 m.
      J_halt = 2 × 1,0 × 0,50² = 0,50 kg·m² (calcul du texte, R3).
    Rapport : J_halt / J_tige = 0,50 / 0,167 = 3,0 — exactement le facteur
    "trois fois" énoncé dans le texte.

    Diagramme en barres (bas de figure) : échelle 600 px par kg·m² (donc
    0,167 kg·m² → 100,2 px ; 0,50 kg·m² → 300 px), pour rendre le rapport 3:1
    directement visible, à l'échelle, et pas seulement énoncé en texte.

    Rôle des couleurs :
      tige (corps plein), rayon massless de l'haltère, axes Δ, légendes
      structurelles : --figure-ink / --figure-ink-soft (structure neutre,
      identique dans les deux panneaux — rien à mettre en évidence ici)
      masses ponctuelles, réglettes de distance d, boîtes J_Δ, barres de
      comparaison : --figure-accent (le contrat de rendu : accent = la
      grandeur "moment" — ici le moment d'inertie et la distance qui le
      pondère — appliqué IDENTIQUEMENT aux deux panneaux, sans favoritisme :
      c'est la longueur des barres, pas la couleur, qui code l'écart)
  -->

  <!-- Titre (permanent, ne change pas d'une étape à l'autre) -->
  <text x="380" y="24" text-anchor="middle"
        font-size="12.5" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Même masse, répartitions différentes : le moment d'inertie J<tspan
        dy="4" font-size="8.5">Δ</tspan><tspan dy="-4"> change</tspan>
  </text>
  <text x="380" y="46" text-anchor="middle" font-size="11"
        fill="var(--figure-ink-soft)"><tspan
        font-style="italic">m</tspan> = 2,0 kg (masse totale) · <tspan
        font-style="italic">L</tspan> = 1,0 m — même axe Δ, perpendiculaire, passant par le centre</text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — panneau A : la tige homogène, seule
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <rect x="40" y="62" width="300" height="210" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <text x="190" y="88" text-anchor="middle" font-size="12" font-weight="600"
          fill="var(--figure-ink)">Tige homogène</text>
    <text x="190" y="102" text-anchor="middle" font-size="9.5"
          fill="var(--figure-ink-soft)">masse continue, uniformément répartie</text>

    <!-- Corps de la tige (masse partout le long de la barre) -->
    <rect x="90" y="148" width="200" height="14" rx="7"
          fill="var(--figure-grid)" stroke="var(--figure-ink)" stroke-width="1.4"/>

    <!-- Axe Δ, au centre -->
    <circle cx="190" cy="155" r="6" fill="var(--figure-surface)"
            stroke="var(--figure-ink)" stroke-width="1.4"/>
    <circle cx="190" cy="155" r="2" fill="var(--figure-ink)"/>
    <text x="190" y="133" text-anchor="middle" font-size="11" font-style="italic"
          fill="var(--figure-ink)">Δ</text>

    <!-- Réglette de distance : la masse existe pour toute distance 0 ≤ d ≤ L/2 -->
    <line x1="190" y1="177" x2="190" y2="187" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="290" y1="177" x2="290" y2="187" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="190" y1="182" x2="290" y2="182" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="240" y="200" text-anchor="middle" font-size="10"
          fill="var(--figure-accent)">0 ≤ <tspan font-style="italic">d</tspan> ≤ <tspan
          font-style="italic">L</tspan>/2</text>

    <!-- Boîte J_tige -->
    <rect x="50" y="212" width="280" height="34" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="190" y="233" text-anchor="middle" font-size="10.5" font-style="italic"
          fill="var(--figure-accent)">J<tspan dy="3" font-size="7.5">tige</tspan><tspan
          dy="-3"> = (1/12)&#183;</tspan><tspan>m</tspan><tspan>&#183;</tspan><tspan
          font-style="italic">L</tspan><tspan>² ≈ 0,167 kg&#183;m²</tspan>
    </text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — panneau B : l'haltère, seul
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <rect x="420" y="62" width="300" height="210" rx="10"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <text x="570" y="88" text-anchor="middle" font-size="12" font-weight="600"
          fill="var(--figure-ink)">Haltère (masses aux extrémités)</text>
    <text x="570" y="102" text-anchor="middle" font-size="9.5"
          fill="var(--figure-ink-soft)">2 masses ponctuelles, tige sans masse</text>

    <!-- Tige sans masse (mince, neutre) -->
    <line x1="470" y1="155" x2="670" y2="155"
          stroke="var(--figure-ink-soft)" stroke-width="3" stroke-linecap="round"/>

    <!-- Axe Δ, au centre -->
    <circle cx="570" cy="155" r="6" fill="var(--figure-surface)"
            stroke="var(--figure-ink)" stroke-width="1.4"/>
    <circle cx="570" cy="155" r="2" fill="var(--figure-ink)"/>
    <text x="570" y="133" text-anchor="middle" font-size="11" font-style="italic"
          fill="var(--figure-ink)">Δ</text>

    <!-- Masses ponctuelles, concentrées aux deux extrémités -->
    <circle cx="470" cy="155" r="15" fill="var(--figure-accent)"/>
    <circle cx="670" cy="155" r="15" fill="var(--figure-accent)"/>
    <text x="470" y="119" text-anchor="middle" font-size="9"
          fill="var(--figure-ink-soft)">1,0 kg</text>
    <text x="670" y="119" text-anchor="middle" font-size="9"
          fill="var(--figure-ink-soft)">1,0 kg</text>

    <!-- Réglette de distance : d = L/2, fixe, à l'extrémité -->
    <line x1="570" y1="177" x2="570" y2="187" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="670" y1="177" x2="670" y2="187" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <line x1="570" y1="182" x2="670" y2="182" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="620" y="200" text-anchor="middle" font-size="10"
          fill="var(--figure-accent)"><tspan font-style="italic">d</tspan> = <tspan
          font-style="italic">L</tspan>/2 = 0,50 m</text>

    <!-- Boîte J_halt -->
    <rect x="430" y="212" width="280" height="34" rx="6"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="570" y="233" text-anchor="middle" font-size="10.5" font-style="italic"
          fill="var(--figure-accent)">J<tspan dy="3" font-size="7.5">halt</tspan><tspan
          dy="-3"> = 2&#183;</tspan><tspan>m</tspan><tspan>&#183;(</tspan><tspan
          font-style="italic">L</tspan><tspan>/2)² = 0,50 kg&#183;m²</tspan>
    </text>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la comparaison à l'échelle
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <text x="380" y="298" text-anchor="middle" font-size="11"
          fill="var(--figure-ink-soft)">Comparaison à l'échelle de J<tspan
          dy="3" font-size="7.5">Δ</tspan></text>

    <!-- Référence zéro -->
    <line x1="160" y1="312" x2="160" y2="388" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="160" y="401" text-anchor="middle" font-size="9" fill="var(--figure-ink-soft)">0</text>

    <!-- Barre J_tige : 0,167 kg·m² × 600 px/(kg·m²) ≈ 100 px -->
    <rect x="160" y="322" width="100" height="22" rx="4" fill="var(--figure-accent)"/>
    <text x="270" y="337" font-size="11" fill="var(--figure-ink)">J<tspan
          dy="3" font-size="7.5">tige</tspan><tspan dy="-3"> ≈ 0,167 kg&#183;m²</tspan></text>

    <!-- Barre J_halt : 0,50 kg·m² × 600 px/(kg·m²) = 300 px -->
    <rect x="160" y="356" width="300" height="22" rx="4" fill="var(--figure-accent)"/>
    <text x="470" y="371" font-size="11" fill="var(--figure-ink)">J<tspan
          dy="3" font-size="7.5">halt</tspan><tspan dy="-3"> = 0,50 kg&#183;m²</tspan></text>

  </g><!-- /step-3 -->

</svg>
