# docs/pipeline/SUMMIT-CONVERSION-RECIPE.md). Rendered by AttemptFirstExercise
# via [[exercise:<id>]] markers in lesson.md: the student sees the question,
# commits to an attempt, and only then unlocks the expert reasoning. Printed
# solutions at the summit are a template-v2 failure
# (docs/pipeline/NOTION-TEMPLATE-V2.md).
#
# `sourcing` is AUTHORING-SIDE ONLY (never rendered): while status != sourced,
# the notion is NOT DONE (template v2 blocking box). r-bac is a faithful
# transcription of the ONLY dedicated national exercise found for this notion
# (docs/sujets/pc/rotation-axe-fixe.md — Statut: vérifié): 2011, session
# rattrapage, épreuve Sciences Physiques (SPC) PC, code sujet RS28, exercice
# "Mécanique", 1ère situation only (2,25 points) — "Étude dynamique d'une
# grue", source AlloSchool https://www.alloschool.com/element/94449. The 2ème
