            note: "Défaut de masse par désintégration : la masse du père dépasse la somme des masses des produits."
          - math: '\Delta m \approx 4{,}314\times10^{-4}\ \text{u} \implies \Delta E_1 = \Delta m\times931{,}49 \approx 0{,}402\ \text{MeV par désintégration}'
            note: "Conversion via 1 u = 931,49 MeV/c² ; Δm positif, cohérent avec la désintégration β+ trouvée à la question 2."
          - math: 't_{1/2} = 6{,}93\ \text{h} = 6{,}93\times3600 = 24\,948\ \text{s}'
            note: "Conversion de la demi-vie en secondes, pour rester cohérent avec a0 en becquerels."
          - math: 'N_d = \frac{a_0\,t_{1/2}}{8\ln 2} = \frac{1{,}25\times10^{12}\times24\,948}{8\times0{,}693} \approx 5{,}62\times10^{15}\ \text{noyaux}'
            note: "Application numérique de l'expression établie à la question 4."
          - math: '\boxed{E = N_d\times\Delta E_1 \approx 5{,}62\times10^{15}\times0{,}402 \approx 2{,}26\times10^{15}\ \text{MeV}}'
            note: "L'énergie totale libérée entre t1 et t2 est le nombre de désintégrations survenues multiplié par l'énergie libérée à chacune."
  # ── bk-2022-r-x2b — 2022 R, Exercice 2 (Partie 2) : datation au carbone 14 ──
  #
