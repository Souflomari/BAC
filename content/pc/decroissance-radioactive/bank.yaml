    intro: |-
      **Physique nucléaire (examen national, session de rattrapage 2015 — Exercice 2, bloc « Physique nucléaire », 1,5 point sur les 03 de l'exercice complet).**

      *L'Exercice 2 est un QCM de cinq questions à numérotation continue : les questions 1 à 3 (Ondes) vivent sous la notion « Ondes mécaniques progressives » (entrée bk-2015-r-x2), qui porte aussi la consigne imprimée en tête de l'exercice — recopier le numéro de la question et écrire à côté la réponse juste, sans aucune justification. Les questions 4 et 5 sont ici.*

      Le noyau de Polonium $^{210}_{84}\text{Po}$, se désintègre en un noyau de Plomb $^{206}_{82}\text{Pb}$. *(La virgule entre sujet et verbe est telle qu'imprimée. Le symbole du noyau fils est CORRIGÉ : le sujet officiel imprime « Po » là où l'élément nommé est le Plomb — défaut F1, correction déclarée, voir la note de sourcing ; A = 206 et Z = 82 sont ceux du sujet.)*
    questions:
      - id: q1
        part: "❖ Physique nucléaire (QCM, questions 4 et 5)"
        stem: |-
          **4-** (0,75 pt) Au cours de cette désintegration, il y'a émission d'une particule sous forme : *(« désintegration », « il y'a » et « sous forme » tels qu'imprimés — défauts du sujet officiel, sans incidence)*

          | | |
          |---|---|
          | **A** | Particule $\alpha$ |
          | **B** | Neutron |
          | **C** | Electron |
          | **D** | Positron |
        reasoning: |-
          On pose l'équation de désintégration avec la particule émise en inconnue, et on applique les lois de conservation de Soddy (rung R2) — ce sont les nombres A et Z imprimés qui tranchent, pas le nom des noyaux :

          $$^{210}_{84}\text{Po} \longrightarrow\ ^{206}_{82}\text{Pb} +\ ^{A}_{Z}X$$

          Conservation du nombre de nucléons : $A = 210 - 206 = 4$. Conservation de la charge : $Z = 84 - 82 = 2$. La particule $^{4}_{2}X$ est le noyau d'hélium $^{4}_{2}\text{He}$ :

          $$\boxed{\text{A : particule } \alpha}$$

          **Pourquoi les trois autres échouent — chacune contre les deux conservations.** B (neutron, $^{1}_{0}n$) donnerait un fils $^{209}_{84}$ : ni le bon $A$ ni le bon $Z$. C (électron, $\beta^-$ : $^{\;\;0}_{-1}e$) conserverait $A = 210$ et donnerait $Z = 85$ — une désintégration $\beta^-$ ne change jamais le nombre de nucléons, or il en manque $4$ ici. D (positron, $\beta^+$ : $^{0}_{1}e$) conserverait aussi $A = 210$ avec $Z = 83$. Seule l'émission $\alpha$ retire à la fois $4$ nucléons et $2$ charges — exactement l'écart entre père et fils.
        steps:
          - math: 'A = 210 - 206 = 4'
            note: "Conservation du nombre de nucleons (rung R2, lois de Soddy)."
          - math: 'Z = 84 - 82 = 2'
            note: "Conservation de la charge (rung R2, lois de Soddy)."
          - math: '\boxed{^{4}_{2}\text{He} : \text{particule } \alpha\ \text{(réponse A)}}'
            note: "Seule l'emission alpha retire 4 nucleons ET 2 charges a la fois."
      - id: q2
        stem: |-
          **5-** (0,75 pt) On considère un échantillon radioactif de Polonium 210, de demi-vie $t_{1/2}$. Son activité initiale est $a_0$, et son activité à un instant $t$ est $a(t)$ :

          A l'instant $t_1 = 3\,t_{1/2}$, le rapport $\dfrac{a(t_1)}{a_0}$ est égal à :

          | | |
          |---|---|
          | **A** | $\dfrac{1}{3}$ |
          | **B** | $\dfrac{1}{6}$ |
          | **C** | $\dfrac{1}{8}$ |
          | **D** | $\dfrac{1}{9}$ |
        reasoning: |-
          La demi-vie (rung R4) divise l'activité par $2$ — et chaque demi-vie supplémentaire divise ENCORE par $2$, parce que la décroissance est exponentielle (rung R3), jamais linéaire. Après trois demi-vies :

          $$\frac{a(3\,t_{1/2})}{a_0} = \left(\frac{1}{2}\right)^3 = \frac{1}{8}$$

          $$\boxed{\text{C : } \frac{1}{8}}$$

          On peut le retrouver par la loi elle-même : $a(t) = a_0\,e^{-\lambda t}$ avec $\lambda = \ln 2/t_{1/2}$, donc $a(3t_{1/2})/a_0 = e^{-3\ln 2} = 2^{-3} = 1/8$.

          **Pourquoi les trois autres échouent — toutes traitent l'exponentielle comme une arithmétique.** A ($1/3$) suppose une décroissance LINÉAIRE — « trois demi-vies, donc divisé par trois » — c'est LE contresens que le rung R3 démonte : la moitié de ce qui RESTE disparaît à chaque demi-vie, pas la moitié du stock initial. B ($1/6$) combine les deux nombres de l'énoncé ($2\times3$) sans loi derrière. D ($1/9$) élève le mauvais nombre au carré ($3^2$), comme si la demi-vie divisait par $3$. La seule opération légitime est $2^n$ pour $n$ demi-vies : $2^3 = 8$.
        steps:
          - math: '\frac{a(3\,t_{1/2})}{a_0} = \left(\frac{1}{2}\right)^{3} = \frac{1}{8}'
            note: "Chaque demi-vie divise l'activite par 2 (rung R4) ; trois demi-vies divisent par 2^3."
          - math: '\boxed{\text{C : } \frac{1}{8}}'
            note: "Controle par la loi : a0.exp(-3.ln2) = a0/8 (rung R3)."

