        stem: |-
          **1-2-** (0,75 pt) Calculer en MeV, l'énergie libérée par la désintergation *(sic, pour « désintégration »)* d'un noyau d'iode 131.
        reasoning: |-
          **CROSS-LIST honoré ici (« Noyaux, masse et énergie »).** Le défaut de masse et son équivalent énergétique sont l'outil central de cette autre notion. Il pèse cette seule question, $0{,}75\ \text{pt}$ sur les $2{,}50$ du bloc : la règle de la maison veut qu'un cross-list de ce poids soit honoré dans le raisonnement plutôt que dédoublé en une entrée orpheline — voir la note éditoriale de routage en tête d'entrée, qui pose l'alternative et laisse l'owner juge. La démonstration est donc refaite ici en entier.

          **Le principe.** Toute désintégration spontanée libère de l'énergie parce que la masse **diminue** : la masse totale des produits est inférieure à celle du noyau père, et la différence est convertie en énergie selon $E = |\Delta m|\,c^2$. La donnée $1\ \text{u} = 931{,}5\ \text{MeV.c}^{-2}$ est là pour éviter tout passage par les kilogrammes et les joules : elle convertit directement une masse en énergie.

          **Le bilan de masse, terme par terme.** Attention à ce que sont les masses fournies : ce sont des masses **nucléaires**, et la désintégration produit **deux** objets, le noyau de xénon **et** l'électron. Il faut donc retrancher les deux :

          $$|\Delta m| = m\left({}^{131}_{53}\text{I}\right) - m\left({}^{131}_{54}\text{Xe}\right) - m(e^-)$$

          $$|\Delta m| = 130{,}8770 - 130{,}8755 - 0{,}00055 = 0{,}00095\ \text{u} = 9{,}5\times10^{-4}\ \text{u}$$

          $$E = |\Delta m|\times 931{,}5 \approx 0{,}885\ \text{MeV}$$

          **Ordre de grandeur, pour se rassurer.** Une désintégration $\beta$ libère typiquement quelques dixièmes de MeV à quelques MeV ; une réaction chimique, quelques eV. Le facteur $10^6$ entre les deux est la raison même pour laquelle on parle d'énergie **nucléaire**.

          **Le piège de cette question, et il coûte cher.** Oublier $m(e^-)$ et calculer seulement $130{,}8770 - 130{,}8755 = 1{,}5\times10^{-3}\ \text{u}$, ce qui donnerait $1{,}40\ \text{MeV}$ — soit $58\ \%$ de trop. La masse de l'électron est petite, mais elle est du même ordre que le défaut de masse lui-même : ici elle en représente plus du tiers. On ne la néglige jamais dans un bilan $\beta$.
