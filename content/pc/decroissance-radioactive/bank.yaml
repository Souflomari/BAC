    intro: |-
      **Désintégration du polonium 210 — volet décroissance (examen national, session normale 2020 — Exercice III, 1 point sur les 2,5 de l'exercice).**

      *Les questions 1 et 2 de cet exercice — l'équation de désintégration, l'énergie libérée lue sur le diagramme d'énergie et le défaut de masse — sont traitées à part, sous la notion « Noyaux, masse et énergie ». Les deux questions ci-dessous n'en dépendent pas : tout ce dont elles ont besoin est rappelé ici.*

      Le polonium est un métal radioactif rare découvert en 1898 par Pierre Curie. Ce métal de symbole Po et de numéro atomique $84$ est radioactif. Le polonium 210 est le seul isotope que l'on trouve dans la nature. La désintégration d'un noyau de polonium 210 produit un noyau de plomb $^{A}_{Z}\text{Pb}$ avec émission d'une particule $\alpha$.

      **Donnée :** la demi-vie du polonium 210 est $t_{1/2} = 138\ \text{jours}$.

      *Aucune figure n'est nécessaire pour ces deux questions — le diagramme d'énergie du sujet ne sert qu'aux questions 1 et 2.*
    questions:
      - id: q3
        part: "3 — De la demi-vie à la constante radioactive"
        stem: |-
          **(0,5 pt)** **3.** Calculer, en $\text{s}^{-1}$, la constante radioactive $\lambda$ du polonium 210.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La demi-vie et la constante radioactive décrivent la même chose — la rapidité de la désintégration — mais dans deux langages différents : $t_{1/2}$ est une **durée**, $\lambda$ une **probabilité de désintégration par unité de temps**. Passer de l'une à l'autre est un geste unique, et l'unité demandée ($\text{s}^{-1}$) dit d'avance où est le piège.

          **La relation, et d'où elle vient.** Au bout d'une demi-vie, il ne reste que la moitié des noyaux :

          $$N\left(t_{1/2}\right) = \frac{N_0}{2}
          \qquad\text{soit}\qquad
          N_0\,e^{-\lambda t_{1/2}} = \frac{N_0}{2}$$

          On divise par $N_0$, on applique le logarithme népérien — c'est lui qui fait descendre $\lambda t_{1/2}$ de l'exposant :

          $$e^{-\lambda t_{1/2}} = \frac{1}{2}
          \qquad\Longrightarrow\qquad
          -\lambda\,t_{1/2} = \ln\frac{1}{2} = -\ln 2
          \qquad\Longrightarrow\qquad
          \boxed{\lambda = \frac{\ln 2}{t_{1/2}}}$$

          Cette relation vaut la peine d'être sue **et** d'être reconstruite : elle tombe en trois lignes, et la reconstruire évite de se demander si c'est $\ln 2$ qui divise ou qui multiplie.

          **La conversion, qui est tout le travail de cette question.** L'énoncé donne $t_{1/2}$ en **jours** et demande $\lambda$ en $\text{s}^{-1}$. Il faut donc convertir, et l'écrire :

          $$t_{1/2} = 138\ \text{jours} = 138 \times 24 \times 3600\ \text{s} = 1{,}19232 \times 10^{7}\ \text{s}$$

          **Le calcul.**

          $$\lambda = \frac{0{,}693}{1{,}19232 \times 10^{7}} = \boxed{5{,}8 \times 10^{-8}\ \text{s}^{-1}}$$

          **Lire ce nombre au lieu de le poser.** $\lambda \approx 5{,}8\times10^{-8}\ \text{s}^{-1}$ signifie qu'à chaque seconde, chaque noyau a environ six chances sur cent millions de se désintégrer. C'est minuscule pour un noyau — et pourtant, sur un échantillon qui en contient $10^{20}$, cela fait des milliards de désintégrations par seconde. C'est exactement ce que l'activité de la question suivante va chiffrer.

          **Le piège nommé de cette question.** Répondre $\lambda = \dfrac{\ln 2}{138} = 5{,}0\times10^{-3}$ sans convertir. Le résultat serait en $\text{jour}^{-1}$, pas en $\text{s}^{-1}$ — et l'écart est d'un facteur $86\,400$. L'unité demandée par l'énoncé n'est jamais décorative : quand elle ne correspond pas à celle de la donnée, c'est **l'annonce d'une conversion**.
        steps:
          - math: 'N\!\left(t_{1/2}\right) = \frac{N_0}{2} \quad\Longrightarrow\quad e^{-\lambda t_{1/2}} = \frac{1}{2}'
            note: "Definition de la demi-vie, reportee dans la loi de decroissance."
          - math: '-\lambda\,t_{1/2} = -\ln 2 \quad\Longrightarrow\quad \lambda = \frac{\ln 2}{t_{1/2}}'
            note: "Le logarithme fait descendre l'exposant. Relation a savoir reconstruire, pas seulement retenir."
          - math: 't_{1/2} = 138 \times 24 \times 3600 = 1{,}19232 \times 10^{7}\ \text{s}'
            note: "L'unite demandee est la s-1 : la conversion est annoncee par l'enonce lui-meme."
          - math: '\boxed{\lambda = \frac{0{,}693}{1{,}19232\times10^{7}} = 5{,}8\times10^{-8}\ \text{s}^{-1}}'
            note: "Six chances sur cent millions par seconde et par noyau."
      - id: q4
        part: "4 — Dater par le rapport de deux activités"
        stem: |-
          **(0,5 pt)** **4.** Un échantillon de noyaux de polonium 210 a une activité $a_0 = 3{,}5 \cdot 10^{11}\ \text{Bq}$ à un instant de date $t = 0$. Déterminer, en jours, l'instant de date $t_1$ où l'activité de cet échantillon est $a_1 = 3{,}7 \cdot 10^{4}\ \text{Bq}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'activité suit exactement la même décroissance exponentielle que le nombre de noyaux — puisque $a = \lambda N$ et que $\lambda$ est une constante. On peut donc travailler directement sur les activités, sans jamais calculer un nombre de noyaux.

          **La loi, et son retournement.**

          $$a(t) = a_0\,e^{-\lambda t}
          \qquad\Longrightarrow\qquad
          a_1 = a_0\,e^{-\lambda t_1}$$

          On divise par $a_0$, on applique le logarithme, on isole $t_1$ :

          $$\frac{a_1}{a_0} = e^{-\lambda t_1}
          \qquad\Longrightarrow\qquad
          -\lambda\,t_1 = \ln\!\left(\frac{a_1}{a_0}\right)
          \qquad\Longrightarrow\qquad
          t_1 = \frac{1}{\lambda}\,\ln\!\left(\frac{a_0}{a_1}\right)$$

          Au dernier passage, on a **retourné le rapport** pour absorber le signe moins — $-\ln\frac{a_1}{a_0} = \ln\frac{a_0}{a_1}$. Le résultat est ainsi manifestement positif, ce qui est un contrôle en soi.

          **Le raccourci qui évite une conversion.** L'énoncé demande $t_1$ **en jours**, et l'on connaît $t_{1/2}$ en jours. Plutôt que de repasser par $\lambda$ en $\text{s}^{-1}$ puis de reconvertir, on utilise $\dfrac{1}{\lambda} = \dfrac{t_{1/2}}{\ln 2}$ **avec $t_{1/2}$ en jours** :

          $$t_1 = \frac{t_{1/2}}{\ln 2}\,\ln\!\left(\frac{a_0}{a_1}\right)$$

          Le résultat sort directement en jours. C'est plus court, et surtout cela supprime deux conversions où l'on peut se tromper.

          **L'application numérique, chiffre par chiffre.** Le rapport d'abord :

          $$\frac{a_0}{a_1} = \frac{3{,}5\times10^{11}}{3{,}7\times10^{4}} = 9{,}46\times10^{6}$$

          Son logarithme :

          $$\ln\!\left(9{,}46\times10^{6}\right) = 16{,}06$$

          Le préfacteur :

          $$\frac{t_{1/2}}{\ln 2} = \frac{138}{0{,}693} = 199{,}1\ \text{jours}$$

          Le produit :

          $$t_1 = 199{,}1 \times 16{,}06 = \boxed{3{,}2 \times 10^{3}\ \text{jours}}$$

          soit environ $3200$ jours, ou **près de neuf ans**.

          **Le contrôle indépendant, et il est particulièrement satisfaisant ici.** Compte en **demi-vies** plutôt qu'en logarithmes. L'activité a été divisée par $9{,}46\times10^{6}$ ; chaque demi-vie la divise par $2$. Il a donc fallu $n$ demi-vies avec $2^{n} = 9{,}46\times10^{6}$, c'est-à-dire

          $$n = \log_2\!\left(9{,}46\times10^{6}\right) = \frac{16{,}06}{0{,}693} = 23{,}2$$

          Et de fait, $\dfrac{3200}{138} = 23{,}2$ ✔. Les deux chemins tombent sur le même nombre. Ce contrôle est gratuit, et il attrape à coup sûr une erreur de rapport inversé ou de préfacteur.

          **Ce que ce nombre raconte.** Vingt-trois demi-vies, c'est énorme : de $3{,}5\times10^{11}$ becquerels — une activité de source industrielle — on est descendu à $3{,}7\times10^{4}$, soit le niveau d'une source d'étalonnage de laboratoire. En moins de neuf ans, un échantillon de polonium 210 devient pratiquement inoffensif. C'est le revers d'une demi-vie courte : très actif, mais vite éteint.

          **Les deux pièges nommés de cette question.** Le premier : **inverser le rapport** et calculer $\ln\frac{a_1}{a_0} = -16{,}06$, ce qui donne un instant **négatif**. Un instant négatif voudrait dire que l'échantillon était moins actif avant qu'après — le signe est un contrôle, pas une contrariété. Le second : reprendre le $\lambda$ de la question précédente, exprimé en $\text{s}^{-1}$, et oublier de reconvertir le résultat de secondes en jours ; on annoncerait $2{,}76\times10^{8}$, un nombre juste en secondes mais faux dans l'unité demandée.
        steps:
          - math: 'a_1 = a_0\,e^{-\lambda t_1} \quad\Longrightarrow\quad t_1 = \frac{1}{\lambda}\,\ln\!\left(\frac{a_0}{a_1}\right)'
            note: "Rapport retourne pour absorber le signe moins : le resultat est manifestement positif."
          - math: '\frac{1}{\lambda} = \frac{t_{1/2}}{\ln 2} \quad\Longrightarrow\quad t_1 = \frac{t_{1/2}}{\ln 2}\,\ln\!\left(\frac{a_0}{a_1}\right)'
            note: "Avec t_demi en JOURS : le resultat sort en jours, deux conversions evitees."
          - math: '\frac{a_0}{a_1} = \frac{3{,}5\times10^{11}}{3{,}7\times10^{4}} = 9{,}46\times10^{6} \quad;\quad \ln\!\left(9{,}46\times10^{6}\right) = 16{,}06'
            note: "Le rapport est gigantesque : pres de dix millions."
          - math: 't_1 = \frac{138}{0{,}693} \times 16{,}06 = 199{,}1 \times 16{,}06'
            note: "Prefacteur en jours, logarithme sans dimension."
          - math: '\boxed{t_1 \approx 3{,}2\times10^{3}\ \text{jours}}'
            note: "Environ 3200 jours, pres de neuf ans."
          - math: 'n = \log_2\!\left(9{,}46\times10^{6}\right) = \frac{16{,}06}{0{,}693} = 23{,}2 \quad\text{et}\quad \frac{3200}{138} = 23{,}2'
            note: "Controle independant en demi-vies : les deux chemins coincident exactement."

  # ── bk-2021-n-x3 — 2021 N, Exercice III : désintégration du plutonium 238 ──
  - id: bk-2021-n-x3
    title: "Le plutonium 238 d'un stimulateur cardiaque : désintégration α, demi-vie et activité"
    source:
      year: 2021
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice III — Désintégration du plutonium 238"
    bareme_total: 2.5
    duration_min: 14
    sourcing:
      status: sourced
      note: >-
        2021 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/127287 (Exercice III — désintégration
        du plutonium 238 dans un stimulateur cardiaque ; barème de l'exercice
        complet 2,5 pt). Transcription vérifiée : re-fetch indépendant
        AlloSchool + diff OK (docs/sujets/pc/decroissance-radioactive.md,
        statut « vérifié » agent-vérificateur 2026-07-11). NB : ce même sujet
        sous-tend le sommet de leçon r-bac (exercises.yaml, marqueur
        [[exercise:r-bac]] à R6) — mêmes données, mêmes réponses numériques,
        reprises ici à l'identique pour rester cohérentes avec le sommet ;
        recoupement assumé, même disposition que rc-charge bk-2019-n-x3.
    intro: |-
      **Un stimulateur cardiaque au plutonium 238 (examen national, session normale 2021).**

      Le stimulateur cardiaque (pacemaker) est un dispositif qui, une fois implanté dans l'organisme, fournit des impulsions électriques destinées à stimuler les muscles cardiaques. Ces impulsions permettent d'accélérer la pulsation du cœur lorsqu'il est trop lent. Certains stimulateurs cardiaques fonctionnent à partir de l'énergie libérée lors de la désintégration alpha des noyaux du plutonium 238. Cet exercice se propose d'étudier un stimulateur cardiaque au plutonium 238.

      **Données.**

      | noyau | Protactinium 238 | Uranium 234 | Uranium 238 | Neptunium 238 | Plutonium 238 |
      |-------|:----------------:|:-----------:|:-----------:|:-------------:|:-------------:|
      | symbole | $^{238}_{91}\text{Pa}$ | $^{234}_{92}\text{U}$ | $^{238}_{92}\text{U}$ | $^{238}_{93}\text{Np}$ | $^{238}_{94}\text{Pu}$ |

      On prend $1\ \text{an} = 365\ \text{jours}$.

      **La courbe.** La courbe de la figure représente l'évolution de l'activité $a(t)$ d'un échantillon de plutonium 238 présent dans le stimulateur cardiaque. On choisit l'instant d'implantation de ce stimulateur dans l'organisme d'un patient comme origine des dates $t = 0$. L'axe des ordonnées $a$ (en Bq) est gradué en $2{,}5\times10^{10},\ 5\times10^{10},\ 7{,}5\times10^{10},\ 10^{11}$ ; l'axe des abscisses $t$ (en ans) est gradué en $20,\ 40,\ 60,\ 80,\ 100$. La courbe est une décroissance exponentielle qui part de $a_0 \approx 10^{11}\ \text{Bq}$ à $t = 0$ et décroît régulièrement.
    questions:
      - id: q1
        part: "Partie I — La transformation nucléaire"
        stem: |-
          **(0,5 pt)** Écrire l'équation de désintégration alpha du plutonium 238 en identifiant le noyau fils.
        reasoning: |-
          Une désintégration $\alpha$ émet un noyau d'hélium $^{4}_{2}\text{He}$. On ne connaît que le père et le type de particule émise : les deux lois de conservation de Soddy, posées au R2, suffisent à reconstruire le fils sans rien d'autre. On pose le fils inconnu $^{A}_{Z}\text{Y}$ et on applique les deux conservations ensemble — nombre de nucléons ET charge. Le piège classique de l'$\alpha$ est de ne toucher qu'à une seule des deux grandeurs : ici $A$ et $Z$ diminuent tous les deux, car la particule $\alpha$ emporte à la fois 4 nucléons et 2 charges positives. Le $Z$ trouvé se lit ensuite dans le tableau des données.
        steps:
          - math: '^{238}_{94}\text{Pu} \longrightarrow\ ^{A}_{Z}\text{Y} +\ ^{4}_{2}\text{He}'
            note: "On pose l'équation avec le noyau fils inconnu et la particule alpha."
          - math: 'A + 4 = 238 \implies A = 234'
            note: "Conservation du nombre de nucléons : la somme des A est la même avant et après."
          - math: 'Z + 2 = 94 \implies Z = 92'
            note: "Conservation de la charge : la particule alpha emporte 2 charges positives, donc Z du fils diminue de 2."
          - math: '\boxed{^{238}_{94}\text{Pu} \longrightarrow\ ^{234}_{92}\text{U} +\ ^{4}_{2}\text{He}}'
            note: "Z = 92 correspond à l'uranium : le fils est l'uranium 234 du tableau."
      - id: q2
        part: "Partie II — Exploiter la courbe d'activité a(t)"
        stem: |-
          **(0,5 pt)** Déterminer graphiquement la demi-vie $t_{1/2}$ du plutonium 238.
        reasoning: |-
          La demi-vie est la durée au bout de laquelle l'activité tombe à la moitié de sa valeur initiale — l'activité suit exactement la même loi que le nombre de noyaux (R4), donc $t_{1/2}$ se lit aussi bien sur $a(t)$ que sur $N(t)$. On part de $a_0 \approx 10^{11}\ \text{Bq}$, on repère l'ordonnée $a_0/2 = 5\times10^{10}\ \text{Bq}$ — une graduation de l'axe donnée dans l'énoncé —, on rejoint la courbe, puis on redescend sur l'axe des temps.

          $$\frac{a_0}{2} = 5\times10^{10}\ \text{Bq} \quad\Longrightarrow\quad t_{1/2} \approx 88\ \text{ans}$$
      - id: q3
        stem: |-
          **(0,5 pt)** En déduire que la valeur de la constante radioactive $\lambda$ est : $\lambda \approx 7{,}88\times10^{-3}\ \text{ans}^{-1}$.
        reasoning: |-
          $\lambda$ ne se lit pas directement sur la courbe : on le déduit de $t_{1/2}$ par la relation du R4, $t_{1/2} = \ln 2/\lambda$, qu'on inverse. C'est précisément le point à garder net du R4 : $t_{1/2}$ et $\lambda$ ne sont pas la même grandeur ni de simples inverses l'une de l'autre — elles sont reliées par le facteur $\ln 2 \approx 0{,}693$.
        steps:
          - math: 't_{1/2} = \frac{\ln 2}{\lambda} \implies \lambda = \frac{\ln 2}{t_{1/2}}'
            note: "On inverse la relation demi-vie ↔ constante radioactive du R4."
          - math: '\boxed{\lambda = \frac{\ln 2}{88} \approx \frac{0{,}693}{88} \approx 7{,}88\times10^{-3}\ \text{ans}^{-1}}'
            note: "Application numérique avec t_1/2 ≈ 88 ans (question 2) : on retrouve bien la valeur annoncée."
      - id: q4
        stem: |-
          **(0,5 pt)** Trouver le nombre $N_0$ de noyaux de plutonium 238 présents à $t = 0$ dans ce stimulateur cardiaque (on prend : $1\ \text{an} = 365\ \text{jours}$).
        reasoning: |-
          Le lien entre l'activité et le nombre de noyaux est $a = \lambda N$ (R4) : l'activité n'est pas le nombre de noyaux, c'est le nombre de désintégrations par seconde, et $\lambda$ est justement le facteur qui relie les deux. À $t = 0$ : $a_0 = \lambda N_0$, donc $N_0 = a_0/\lambda$. Le vrai piège de la question est l'unité, pas la formule : $a_0$ est en becquerels, donc en désintégrations PAR SECONDE, alors que $\lambda$ vient d'être calculée en $\text{ans}^{-1}$. Il faut convertir $\lambda$ en $\text{s}^{-1}$ avant de diviser — d'où la donnée $1\ \text{an} = 365\ \text{jours}$ fournie dans l'énoncé.
        steps:
          - math: 'a_0 = \lambda N_0 \implies N_0 = \frac{a_0}{\lambda}'
            note: "On inverse la relation activité ↔ nombre de noyaux a = λN."
          - math: '\lambda = \frac{7{,}88\times10^{-3}}{365\times24\times3600} \approx 2{,}50\times10^{-10}\ \text{s}^{-1}'
            note: "Conversion de λ en s⁻¹ : le becquerel compte des désintégrations par seconde, pas par an."
          - math: '\boxed{N_0 = \frac{10^{11}}{2{,}50\times10^{-10}} \approx 4{,}0\times10^{20}\ \text{noyaux}}'
            note: "Application numérique avec a_0 ≈ 10¹¹ Bq lu à l'origine sur la courbe."
      - id: q5
        part: "Partie III — Durée de fonctionnement efficace"
        stem: |-
          **(0,5 pt)** On considère que ce stimulateur fonctionne de façon efficace lorsque le nombre de noyaux de plutonium 238 qui se désintègrent ne dépasse pas 30 % du nombre de noyaux présents dans l'échantillon à $t = 0$. Déterminer, en ans, la durée maximale $t_{max}$ du fonctionnement efficace du stimulateur cardiaque.
        reasoning: |-
          Premier geste : traduire la condition en une condition sur $N(t)$. Le nombre de noyaux désintégrés à l'instant $t$ vaut $N_0 - N(t)$. « Pas plus de 30 % désintégrés » signifie donc $N_0 - N(t) \leq 0{,}30\,N_0$, c'est-à-dire qu'il reste AU MOINS 70 % des noyaux : $N(t) \geq 0{,}70\,N_0$. À la limite $t_{max}$, il en reste exactement 70 %. Contrairement à la question 4 de l'exercice précédent (le radon), $0{,}70$ n'est pas une puissance de $1/2$ : on ne peut pas compter des demi-vies entières, il faut inverser la loi de décroissance par le logarithme, exactement comme au R5 (datation). On garde ici $\lambda$ en $\text{ans}^{-1}$ pour obtenir directement $t_{max}$ en années.
        steps:
          - math: 'N_0 - N(t) \leq 0{,}30\,N_0 \iff N(t) \geq 0{,}70\,N_0'
            note: "Traduction de la condition : pas plus de 30 % désintégrés, donc au moins 70 % restants."
          - math: '0{,}70 = e^{-\lambda t_{max}} \implies t_{max} = \frac{1}{\lambda}\ln\!\left(\frac{1}{0{,}70}\right)'
            note: "À la limite N(t_max) = 0,70 N_0 ; on isole le temps par le logarithme (méthode d'inversion du R5)."
          - math: '\boxed{t_{max} = \frac{\ln(1{,}43)}{7{,}88\times10^{-3}} \approx \frac{0{,}357}{7{,}88\times10^{-3}} \approx 45\ \text{ans}}'
            note: "Application numérique avec λ en ans⁻¹ : le résultat sort directement en années."

  # ── bk-2021-r-x3 — 2021 R, Exercice 3 : désintégration du phosphore 32 ──
  - id: bk-2021-r-x3
    title: "Désintégration du phosphore 32 : équation β⁻, exploitation de ln(N) = f(t), demi-vie et activité"
    source:
      year: 2021
      session: rattrapage
      filiere: "SPC"
      exercise_label: "Exercice 3 — Désintégration du phosphore 32"
    bareme_total: 2.5
    duration_min: 15
    sourcing:
      status: sourced
      note: >-
        2021 session de rattrapage — examen national PC BIOF (Sciences
        Physiques, SPC), AlloSchool RS 28F, element/127290 (Exercice 3,
        barème complet 2,5 pt). PREMIÈRE entrée de session rattrapage du
        corpus : jusqu'ici toutes les banques étaient en session normale.
        Transcription vérifiée par une passe adversariale indépendante
        (2026-08-22) : re-fetch du scan, chaque valeur relue sur l'image
        (upload-84198/0004-big.jpg et 0005-big.jpg), figure re-décrite
        depuis le dessin et non depuis l'énoncé, puis physique re-dérivée.
        Les deux couples lus sur la droite — (0 ; 33) et (200 ; 23,3) —
        donnent λ = 9,7/200 = 4,85×10⁻² j⁻¹ puis t₁/₂ = ln2/λ = 14,29 j,
        exactement la valeur que la question 2.3 demande d'établir : la
        lecture graphique est donc confirmée par son propre résultat. De
        même m₀ = 10⁻⁵ mg = 10⁻⁸ g (unité milligramme bien lue sur le
        scan) donne N₀ = 1,88×10¹⁴, et t₁ = 28,58 j est le double EXACT de
