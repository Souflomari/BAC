    intro: |-
      **Étude de la radioactivité du carbone 14 et datation d'une statue en bois (examen national, session normale 2011 — Physique nucléaire, 3,00 points).**

      La datation par le carbone 14 est parmi les techniques adoptées par les savants pour déterminer l'âge de quelques fossiles et roches. La teneur en ce carbone reste constante dans l'atmosphère et dans les êtres vivants, mais commence à diminuer juste après la mort de ces derniers à cause de la radioactivité.

      Le but de cet exercice est d'étudier la radioactivité du carbone 14 et la datation avec. *(« et la datation avec. » tel qu'imprimé sur le sujet officiel — tour calqué ; la page 1 du même sujet écrit « et son utilisation dans la datation ». Sans incidence.)*

      **Données :**
      - La demi-vie du carbone 14 : $t_{1/2} = 5570\ \text{ans}$ ;
      - $1u = 931{,}5\ \text{Mev/c}^2$ *(« Mev » tel qu'imprimé — défaut du sujet officiel, sans incidence ; c'est aussi le seul item de la liste sans point-virgule final)*
      - Masses des particules en unité de masse atomique (u)

      | Particule | $^{14}_{6}\text{C}$ | $^{14}_{7}\text{N}$ | Electron |
      |---|---|---|---|
      | Masse (u) | $13{,}9999$ | $13{,}9992$ | $0{,}0005$ |

      **1- Radioactivité du carbone 14.** De la radioactivité spontanée du nucléide carbone $^{14}_{6}\text{C}$, résulte l'azote $^{14}_{7}\text{N}$.
    questions:
      - id: q1
        part: "1-1 — L'équation de la désintégration"
        stem: |-
          **1-1-** (0,75 pt) Écrire l'équation de cette désintégration en précisant le type de la radioactivité.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement le rung 2 de la leçon — dont l'exemple travaillé est précisément ce noyau-là. On écrit l'équation avec la particule émise inconnue, puis les deux lois de conservation de Soddy fixent cette particule sans rien deviner : conservation du nombre de nucléons $A$ et conservation de la charge $Z$.

          Le père est $^{14}_{6}\text{C}$, le fils est $^{14}_{7}\text{N}$ (donné par l'énoncé). Pour la particule émise $^{A}_{Z}X$ : conservation de $A$ : $14 = 14 + A$, donc $A = 0$ ; conservation de $Z$ : $6 = 7 + Z$, donc $Z = -1$. La particule $^{0}_{-1}e$ est un électron : c'est une désintégration $\beta^-$ — cohérent avec le rung 1, qui repère l'excès de neutrons du carbone 14 comme la cause de son instabilité (un neutron se transforme en proton, d'où $Z$ qui augmente d'une unité à $A$ constant).
        steps:
          - math: '14 = 14 + A \implies A = 0 \qquad 6 = 7 + Z \implies Z = -1'
            note: "Lois de Soddy (rung 2) : conservation du nombre de nucleons et de la charge, appliquees a la particule emise."
          - math: '\boxed{^{14}_{6}\text{C} \longrightarrow\ ^{14}_{7}\text{N} +\ ^{0}_{-1}e}'
            note: "Equation de la desintegration."
          - math: '\boxed{\text{radioactivite } \beta^-}'
            note: "La particule emise est un electron : desintegration beta moins."
      - id: q2
        part: "1-2 — La composition du noyau fils"
        stem: |-
          **1-2-** (0,25 pt) Donner la composition du noyau fils.
        reasoning: |-
          Lecture directe de la notation $^{A}_{Z}\text{X}$ posée au rung 1 de la leçon, appliquée au fils $^{14}_{7}\text{N}$ : $Z$ donne le nombre de protons, $N = A - Z$ le nombre de neutrons.
        steps:
          - math: 'Z = 7 \implies 7\ \text{protons}'
            note: "Numero atomique lu directement sur le symbole du noyau fils (rung 1)."
          - math: '\boxed{N = A - Z = 14 - 7 = 7 \implies 7\ \text{neutrons}}'
            note: "Nombre de nucleons total moins le nombre de protons : 7 protons et 7 neutrons."
      - id: q3
        part: "1-3 — L'énergie libérée (cross-list « Noyaux, masse et énergie »)"
        stem: |-
          **1-3-** (1 pt) Calculer, en MeV, l'énergie $\Delta E$ libérée par la désintégration d'un noyau de carbone 14.
        reasoning: |-
          Cette question sort des rungs R1–R5 de cette leçon : elle relève de la notion « Noyaux, masse et énergie », qui établit l'équivalence masse-énergie $E = \Delta m\,c^2$ et le bilan de masse d'une réaction nucléaire. On la refait ici en entier, sans l'admettre (voir la note éditoriale en tête de fichier — cross-list honoré ici, pas de seconde entrée).

          **Le bilan de masse.** On compare la masse AVANT (le noyau de carbone 14) à la masse APRÈS (le noyau d'azote 14 ET l'électron émis — l'oublier est le piège classique de cette question, et l'énoncé donne sa masse précisément pour qu'on l'utilise) :

          $$\Delta m = \left[m(^{14}_{7}\text{N}) + m(e)\right] - m(^{14}_{6}\text{C})$$

          **La conversion en énergie**, par le facteur donné dans les données ($1u = 931{,}5\ \text{MeV/c}^2$) : $\Delta m < 0$ signifie que le système PERD de la masse — cette masse manquante est précisément l'énergie libérée, $\Delta E = |\Delta m| \times 931{,}5$ MeV.
        steps:
          - math: 'm(^{14}_{7}\text{N}) + m(e) = 13{,}9992 + 0{,}0005 = 13{,}9997\ u'
            note: "Masse totale APRES desintegration : noyau fils PLUS electron emis (l oublier est le piege de la question)."
          - math: '\Delta m = 13{,}9997 - 13{,}9999 = -0{,}0002\ u'
            note: "Bilan de masse : negatif, le systeme perd de la masse -- la reaction libere de l energie."
          - math: '\boxed{\Delta E = |\Delta m|\times931{,}5 = 0{,}0002\times931{,}5 \approx 0{,}186\ \text{MeV}}'
            note: "Equivalence masse-energie (notion Noyaux, masse et energie), conversion par 1u = 931,5 MeV/c2."
      - id: q4
        part: "2 — Datation par le carbone 14"
        stem: |-
          **2-** (1 pt) Les archéologues ont trouvé une statue en bois d'activité $135\ \text{Bq}$. Sachant que l'activité d'un morceau de bois récent, de même masse et de même nature que bois de la statue, est $165\ \text{Bq}$. *(« que bois » tel qu'imprimé — article manquant, défaut du sujet officiel, sans incidence.)* Déterminer, en années, l'âge approximatif de la statue en bois.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. C'est le principe de la datation du rung 5, mot pour mot : le bois récent, de même masse et de même nature, donne l'activité $a_0 = 165\ \text{Bq}$ qu'avait la statue de son vivant ; depuis la mort de l'arbre, l'activité décroît selon $a(t) = a_0\,e^{-\lambda t}$ (rung 4), et elle vaut aujourd'hui $a = 135\ \text{Bq}$. On inverse la loi pour extraire $t$, avec $\lambda = \dfrac{\ln 2}{t_{1/2}}$ (rung 4) :

          $$a = a_0\,e^{-\lambda t} \implies t = \frac{1}{\lambda}\ln\!\left(\frac{a_0}{a}\right) = \frac{t_{1/2}}{\ln 2}\,\ln\!\left(\frac{a_0}{a}\right)$$

          **Le piège nommé de cette question.** Ne pas inverser le rapport : c'est $a_0/a = 165/135 > 1$ qui va dans le logarithme (l'activité a DIMINUÉ depuis la mort, donc le rapport référence-sur-mesure est plus grand que $1$ et le temps sort positif). Écrire $135/165$ donnerait un âge négatif — un signal d'alarme, pas une convention.
        steps:
          - math: 't = \frac{t_{1/2}}{\ln 2}\,\ln\!\left(\frac{a_0}{a}\right) \qquad \frac{a_0}{a} = \frac{165}{135} \approx 1{,}222'
            note: "Inversion de la loi de decroissance appliquee a l activite (rungs 4 et 5) ; a0 est l activite du bois RECENT."
          - math: 't = \frac{5570}{0{,}6931}\times\ln(1{,}222) = \frac{5570}{0{,}6931}\times0{,}2007'
            note: "lambda = ln2/t_1/2, avec la demi-vie DONNEE par l enonce (5570 ans)."
          - math: '\boxed{t \approx 1612{,}5\ \text{ans} \approx 1613\ \text{ans}}'
            note: "Age approximatif de la statue -- concordant avec le corrige non officiel (1 612,5 ans)."

