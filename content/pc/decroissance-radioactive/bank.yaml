  - id: bk-2022-r-x2b
    title: "Datation au carbone 14 : énergie de liaison du noyau, puis âge d'un bois ancien par le rapport de deux activités"
    source:
      year: 2022
      session: rattrapage
      filiere: "SPC"
      exercise_label: "Exercice 2 — §2 : datation au carbone 14"
    bareme_total: 1.5
    duration_min: 9
    sourcing:
      status: sourced
      note: >-
        2022 session de rattrapage — examen national PC BIOF (Sciences
        Physiques, SPC), code sujet RS 28F, AlloSchool element/136624, scan
        course-422/upload-84519, pages 3 et 4 sur 8 (Exercice 2, partie 2 —
        datation au carbone 14 ; barème de la partie = 1,5 pt, recompté
        question par question : 0,25 + 0,25 + 0,5 + 0,5 = 1,5, sur les 3,5 pt
        de l'exercice complet, dont la partie 1 — propagation d'une onde
        mécanique — est transcrite sous
        ondes-mecaniques-periodiques/bank.yaml en bk-2022-r-x2. L'énoncé
        précise que les deux parties sont indépendantes). Transcription
        vérifiée par une passe adversariale indépendante (2026-08-22,
        docs/sujets/_incoming/pc-spc-2022-r.md, statut « vérifié ») : re-fetch
        des 8 pages du scan, figures re-décrites depuis le dessin, physique
        re-dérivée. Aucune figure n'accompagne cette partie : toutes les
        données sont dans le texte. CONTRE-CALCUL REFAIT ICI, chiffre par
        chiffre. Défaut de masse : 6 protons a 1,00728 u font 6,04368 u ;
        8 neutrons a 1,00866 u font 8,06928 u ; somme des nucléons séparés
        = 14,11296 u ; moins la masse du noyau 13,99995 u, le défaut vaut
        0,11301 u. Énergie de liaison : 0,11301 x 931,5 = 105,269 MeV, arrondi
        105,3 MeV. Contrôle de vraisemblance fait ici et non fourni par la
        source : l'énergie de liaison PAR NUCLÉON vaut 105,27/14 = 7,52 MeV
        par nucléon, ce qui place le carbone 14 exactement dans la bande des
        noyaux légers stables de la courbe d'Aston — la valeur est plausible.
        Âge : t_1 = (t_demi / ln 2) x ln(a_0/a_1) avec a_0/a_1 = 418/318 =
        1,31447 et ln(1,31447) = 0,27343 ; t_demi / ln 2 = 5730 / 0,69315 =
        8267,2 ans ; d'où t_1 = 8267,2 x 0,27343 = 2260,5 ans, arrondi
        2260 ans, soit environ 2,3 x 10^3 ans. Contrôle : cet âge vaut environ
        0,39 demi-vie, et l'activité résiduelle attendue après 0,39 demi-vie
        est 2^(-0,39) = 0,763, à comparer au rapport mesuré 318/418 = 0,761 —
