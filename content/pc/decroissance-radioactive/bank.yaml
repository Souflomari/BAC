    intro: |-
      **Désintégration en chaine (examen national, session de rattrapage 2024 — Exercice 3, 2 points).**

      Suite à des désintégrations en chaine, un nucléide peut se transformer en d'autres jusqu'à obtention d'un nucléide stable, formant ainsi une famille radioactive.

      Le diagramme ci-dessous donne quelques nucléides appartenant à une famille radioactive.

      **Données.**
      - Masses des noyaux : $m(^{212}_{83}\text{Bi}) = 211{,}991286\ \text{u}$ ; $m(^{208}_{81}\text{Tl}) = 207{,}982019\ \text{u}$ ; $m(\alpha) = 4{,}002603\ \text{u}$ ;
      - $1\ \text{u} = 931{,}5\ \text{MeV.c}^{-2}$.

      **Le diagramme.** Un repère orthogonal quadrillé, sans légende de figure. Le nombre de masse $A$ est porté en **ordonnée** (axe vertical fléché vers le haut, gradué 208, 209, 210, 211, 212 de bas en haut) et le numéro atomique $Z$ en **abscisse** (axe horizontal fléché vers la droite, gradué 81, 82, 83, 84). Quatre points marquent des nœuds du quadrillage :

      - $^{212}_{82}\text{Pb}$ au nœud $(Z = 82\,;\,A = 212)$, son étiquette imprimée à gauche du point ;
      - $^{212}_{83}\text{Bi}$ au nœud $(Z = 83\,;\,A = 212)$, étiquette à droite ;
      - $^{208}_{81}\text{Tl}$ au nœud $(Z = 81\,;\,A = 208)$, étiquette à gauche ;
      - $^{A}_{Z}\text{X}$ au nœud $(Z = 82\,;\,A = 208)$, étiquette au-dessus.

      Trois flèches relient ces points :

      - **(1)**, horizontale, va de $^{212}_{82}\text{Pb}$ vers $^{212}_{83}\text{Bi}$ (pointe à droite, sur le bismuth) ; l'étiquette « (1) » est au-dessus du trait ;
      - **(2)**, diagonale, va de $^{212}_{83}\text{Bi}$ vers $^{208}_{81}\text{Tl}$ (la pointe est en bas, sur le thallium) ; l'étiquette « (2) » est à droite du trait, à mi-hauteur ;
      - **(3)**, horizontale, va de $^{208}_{81}\text{Tl}$ vers $^{A}_{Z}\text{X}$ (pointe à droite) ; l'étiquette « (3) » est sous le trait.
    questions:
      - id: q1-1
        part: "1- Exploiter le diagramme"
        stem: |-
          (0,25 pt) Identifier, en justifiant, le type de la désintégration (1).
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Un diagramme de famille radioactive n'est rien d'autre qu'une suite d'équations de désintégration dessinées : chaque flèche va d'un noyau père à son noyau fils, et le type de la désintégration se lit dans le DÉPLACEMENT des deux coordonnées entre le point de départ et le point d'arrivée. Aucune donnée numérique n'est nécessaire — les deux lois de Soddy du R2 suffisent, appliquées à l'envers.

          **D'abord, la convention des axes.** Ce diagramme n'est pas la vallée de stabilité du R1 : ici l'ordonnée porte le nombre de masse $A$ (et non le nombre de neutrons $N$), l'abscisse porte le numéro atomique $Z$. Un déplacement horizontal est donc un changement de $Z$ à $A$ constant, et un déplacement vertical un changement de $A$.

          La flèche (1) part de $^{212}_{82}\text{Pb}$ et arrive sur $^{212}_{83}\text{Bi}$ :

          $$\Delta A = 212 - 212 = 0 \qquad \Delta Z = 83 - 82 = +1$$

          On pose l'équation avec la particule émise $^{A'}_{Z'}\text{p}$ en inconnue et on applique les deux conservations :

          $$^{212}_{82}\text{Pb} \longrightarrow\ ^{212}_{83}\text{Bi} +\ ^{A'}_{Z'}\text{p}$$

          Conservation du nombre de nucléons : $212 = 212 + A'$, donc $A' = 0$.

          Conservation de la charge : $82 = 83 + Z'$, donc $Z' = -1$.

          Une particule qui ne porte aucun nucléon et une charge $-1$, c'est l'électron $^{0}_{-1}\text{e}$ :

          $$\boxed{^{212}_{82}\text{Pb} \longrightarrow\ ^{212}_{83}\text{Bi} +\ ^{0}_{-1}\text{e} \qquad \text{désintégration } \beta^-}$$

          **Le piège à nommer.** Voir $Z$ AUGMENTER alors que la particule émise est négative surprend, et pousse beaucoup d'élèves à répondre $\beta^+$. C'est exactement l'inverse : en $\beta^-$ un neutron du noyau se transforme en proton, donc $Z$ monte d'une unité pendant que la charge $-1$ s'en va avec l'électron — le total reste bien $+82$. Ne devine jamais le type d'après le signe du nom : refais les deux conservations, comme ci-dessus.
      - id: q1-2
        part: "1- Exploiter le diagramme"
        stem: |-
          (0,25 pt) Reconnaitre le nucléide $^{A}_{Z}\text{X}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Reconnaître un nucléide, c'est donner son couple $(Z\,;\,A)$ puis LIRE son nom dans $Z$ — car c'est le numéro atomique, et lui seul, qui désigne l'élément chimique (R1). Le point $^{A}_{Z}\text{X}$ étant placé sur le diagramme, ses deux coordonnées se lisent directement sur les axes ; la flèche (3) permet ensuite de contrôler cette lecture par le calcul.

          **La lecture.** Le point $^{A}_{Z}\text{X}$ occupe le nœud $(Z = 82\,;\,A = 208)$ : donc $Z = 82$ et $A = 208$.

          **Le contrôle par la flèche (3),** qui part de $^{208}_{81}\text{Tl}$. En posant la particule émise en inconnue :

          $$^{208}_{81}\text{Tl} \longrightarrow\ ^{A}_{Z}\text{X} +\ ^{A'}_{Z'}\text{p}$$

          La flèche (3) est horizontale, donc $A = 208$ ; elle avance d'un cran vers la droite, donc $Z = 81 + 1 = 82$, et la particule émise est là encore un électron $^{0}_{-1}\text{e}$ — une seconde désintégration $\beta^-$. Les deux lectures concordent.

          $Z = 82$ est le numéro atomique du plomb, déjà présent sur le diagramme sous la forme $^{212}_{82}\text{Pb}$ :

          $$\boxed{^{A}_{Z}\text{X} =\ ^{208}_{82}\text{Pb}}$$

          C'est le nucléide stable qui clôt la famille : aucune flèche ne repart de lui.

          **Le piège à nommer.** $^{208}_{82}\text{Pb}$ et $^{212}_{82}\text{Pb}$ sont le même ÉLÉMENT — même $Z$, même case du tableau périodique, même nom « plomb » — mais deux nucléides DIFFÉRENTS : deux isotopes, $A = 208$ contre $A = 212$. « Reconnaître le nucléide » exige donc les deux nombres ; répondre « c'est du plomb » ne répond qu'à moitié. Et attention à la lecture graphique elle-même : l'étiquette de ce point est imprimée au-dessus de lui, ce sont les coordonnées du POINT qui donnent $A$, jamais la hauteur de l'étiquette.
      - id: q2-1
        part: "2- La désintégration (2) du bismuth 212"
        stem: |-
          (0,25 pt) On considère la désintégration d'un noyau de bismuth $^{212}_{83}\text{Bi}$ en noyau de thallium $^{208}_{81}\text{Tl}$ (désintégration (2)).

          Ecrire l'équation de cette désintégration.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Ici le père ET le fils sont donnés : c'est la particule émise qui est l'inconnue. Le geste ne change pas d'un iota — on pose l'équation avec l'inconnue et on applique les deux lois de Soddy (R2). Le diagramme annonce d'ailleurs la réponse : la flèche (2) descend de quatre crans en $A$ et recule de deux crans en $Z$, la signature exacte de l'émission d'un noyau d'hélium.

          $$^{212}_{83}\text{Bi} \longrightarrow\ ^{208}_{81}\text{Tl} +\ ^{A'}_{Z'}\text{p}$$

          Conservation du nombre de nucléons : $212 = 208 + A'$, donc $A' = 4$.

          Conservation de la charge : $83 = 81 + Z'$, donc $Z' = 2$.

          $A' = 4$ et $Z' = 2$ : la particule émise est un noyau d'hélium $^{4}_{2}\text{He}$, c'est-à-dire une particule $\alpha$.

          $$\boxed{^{212}_{83}\text{Bi} \longrightarrow\ ^{208}_{81}\text{Tl} +\ ^{4}_{2}\text{He} \qquad \text{désintégration } \alpha}$$

          C'est cohérent avec le R2 : la voie $\alpha$ est celle des noyaux LOURDS, et $A = 212$ place le bismuth 212 largement dans cette catégorie.

          **Le piège à nommer.** Le SENS de la flèche (2). Elle relie deux points, et sa pointe est en bas, sur le thallium : c'est donc le bismuth qui se désintègre, pas l'inverse. Lue à l'envers, elle décrirait un thallium qui capte une particule — une réaction provoquée, pas une désintégration spontanée — et les conservations donneraient $A' = -4$ et $Z' = -2$, une particule qui n'existe pas. Un nombre de nucléons négatif dans le résultat est le signal qu'on a inversé père et fils.
      - id: q2-2
        part: "2- La désintégration (2) du bismuth 212"
        stem: |-
          (0,5 pt) Déterminer, en unité (MeV), $E_{\text{libérée}} = |\Delta E|$ la valeur de l'énergie libérée par cette désintégration.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** *Cette question déborde des rungs de cette leçon : l'équivalence masse-énergie appartient à la notion noyaux-masse-energie, elle n'est pas établie en R1–R5. Elle est donc refaite ici en entier, sans rien admettre.* L'énergie libérée par une désintégration vient de ce que le noyau père est plus LOURD que l'ensemble de ses produits : la masse manquante $|\Delta m|$ est convertie en énergie selon $E = |\Delta m|\,c^2$. Tout le travail consiste à faire la soustraction proprement, puis à convertir des unités de masse atomique en MeV — ce que la donnée $1\ \text{u} = 931{,}5\ \text{MeV.c}^{-2}$ permet en une seule multiplication.

          **Premier temps — le défaut de masse.** On compare la masse du père à la somme des masses des produits de l'équation établie à la question précédente, le thallium et la particule $\alpha$ :

          $$m(^{208}_{81}\text{Tl}) + m(\alpha) = 207{,}982019 + 4{,}002603 = 211{,}984622\ \text{u}$$

          $$|\Delta m| = m(^{212}_{83}\text{Bi}) - \left[m(^{208}_{81}\text{Tl}) + m(\alpha)\right] = 211{,}991286 - 211{,}984622$$

          $$|\Delta m| = 6{,}664\times10^{-3}\ \text{u}$$

          Cette différence est positive : le père est bien le plus lourd, la désintégration libère effectivement de l'énergie.

          **Deuxième temps — la conversion en MeV.** La donnée $1\ \text{u} = 931{,}5\ \text{MeV.c}^{-2}$ dit qu'une masse de $1\ \text{u}$ correspond, multipliée par $c^2$, à une énergie de $931{,}5\ \text{MeV}$. Il suffit donc de multiplier :

          $$E_{\text{libérée}} = |\Delta m|\,c^2 = 6{,}664\times10^{-3}\times931{,}5 = 6{,}2075\ \text{MeV}$$

          $$\boxed{E_{\text{libérée}} \approx 6{,}21\ \text{MeV}}$$

          **Le piège à nommer.** La soustraction porte sur deux nombres qui ne diffèrent qu'à la troisième décimale : $211{,}991286$ contre $211{,}984622$. Toute troncature prématurée la détruit — arrondir à $211{,}99$ et $211{,}98$ donnerait $|\Delta m| = 0{,}01\ \text{u}$, soit $9{,}3\ \text{MeV}$, une valeur 50 % trop grande. On garde TOUS les chiffres donnés jusqu'à la soustraction, et on n'arrondit qu'au tout dernier résultat. Le contrôle d'ordre de grandeur : quelques MeV est la valeur normale d'une émission $\alpha$ ; quelques keV ou quelques centaines de MeV signaleraient une soustraction ou une conversion fautive.
      - id: q2-3
        part: "2- La désintégration (2) du bismuth 212"
        stem: |-
          (0,75 pt) Soit une source radioactive contenant à l'instant $t = 0$, $N_0 = 2{,}84\cdot10^{20}$ noyaux radioactifs de bismuth $^{212}_{83}\text{Bi}$. A l'instant $t_1 = 15\ \text{min}$, le nombre de noyaux de thallium formés est : $N_1 = 4{,}484\cdot10^{19}$.

          Montrer que l'expression de la demi-vie $t_{1/2}$ du bismuth $^{212}_{83}\text{Bi}$ est : $t_{1/2} = \dfrac{t_1.\ln 2}{\ln\!\left(\dfrac{N_0}{N_0 - N_1}\right)}$. Calculer sa valeur en minute.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Toute la question tient dans un seul mot de l'énoncé : $N_1$ est le nombre de noyaux de thallium **formés**, pas le nombre de bismuths restants. Or la loi de décroissance (R3) ne parle que des noyaux RESTANTS. Le premier geste est donc une traduction du comptage ; ensuite seulement viennent les deux gestes déjà connus — inverser la loi par le logarithme (R5), puis remplacer $\lambda$ par $\ln 2/t_{1/2}$ (R4).

          **Premier temps — traduire le comptage.** La désintégration (2) transforme un bismuth en un thallium, un pour un. Les $N_1$ thalliums présents à $t_1$ sont donc exactement les bismuths qui ont disparu — c'est le rappel explicite du R3 : le nombre de noyaux fils produits vaut $N_0 - N(t)$.

          $$N_1 = N_0 - N(t_1) \qquad\Longleftrightarrow\qquad N(t_1) = N_0 - N_1$$

          **Deuxième temps — écrire la loi de décroissance à $t_1$.**

          $$N(t_1) = N_0\,e^{-\lambda t_1} \qquad\Longrightarrow\qquad N_0 - N_1 = N_0\,e^{-\lambda t_1}$$

          **Troisième temps — inverser par le logarithme.** On isole l'exponentielle, puis on retourne le rapport pour faire disparaître le signe moins :

          $$e^{-\lambda t_1} = \frac{N_0 - N_1}{N_0} \qquad\Longrightarrow\qquad e^{\lambda t_1} = \frac{N_0}{N_0 - N_1}$$

          $$\lambda\,t_1 = \ln\!\left(\frac{N_0}{N_0 - N_1}\right)$$

          **Quatrième temps — faire apparaître la demi-vie.** Le R4 donne $\lambda = \dfrac{\ln 2}{t_{1/2}}$. En reportant :

          $$\frac{\ln 2}{t_{1/2}}\,t_1 = \ln\!\left(\frac{N_0}{N_0 - N_1}\right)$$

          $$\boxed{t_{1/2} = \frac{t_1\,\ln 2}{\ln\!\left(\dfrac{N_0}{N_0 - N_1}\right)}}$$

          C'est bien l'expression demandée.

          **Application numérique.** On aligne d'abord les deux puissances de dix avant de soustraire :

          $$N_0 - N_1 = 2{,}84\cdot10^{20} - 0{,}4484\cdot10^{20} = 2{,}3916\cdot10^{20}$$

          $$\frac{N_0}{N_0 - N_1} = \frac{2{,}84}{2{,}3916} \approx 1{,}1875 \qquad\Longrightarrow\qquad \ln(1{,}1875) \approx 0{,}1718$$

          $$t_{1/2} = \frac{15\times0{,}693}{0{,}1718} = \frac{10{,}395}{0{,}1718} \approx 60{,}5\ \text{min}$$

          $$\boxed{t_{1/2} \approx 60{,}5\ \text{minutes}}$$

          Le résultat garde l'unité de $t_1$ : $t_1$ était en minutes, le logarithme est un nombre sans dimension, donc $t_{1/2}$ sort en minutes — aucune conversion à faire, contrairement au cas où l'on veut une activité en becquerels.

          **Le piège à nommer.** Confondre « noyaux de thallium formés » et « noyaux de bismuth restants ». En écrivant $N(t_1) = N_1 = 4{,}484\cdot10^{19}$, on obtiendrait $\ln(N_0/N_1) = \ln(6{,}33) \approx 1{,}85$ et $t_{1/2} \approx 5{,}6\ \text{min}$ — dix fois trop petit, et surtout incompatible avec l'expression que l'énoncé demande d'établir, qui porte bien $N_0 - N_1$ au dénominateur. Prends l'habitude de relire le mot qui suit le nombre : « formés », « restants » et « désintégrés » ne désignent jamais la même population.

