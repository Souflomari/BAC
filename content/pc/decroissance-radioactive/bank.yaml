        Cette même passe a mesuré la figure 3 au pixel : croisement exact à
        (8 jours ; 2×10⁶ Bq) donnant t1/2 = 8 j et a0 = 4,0×10⁶ Bq ; le
        chiffrage des axes s'arrête à 24 jours et 4×10⁶ Bq alors que le
        cadre du graphe continue jusqu'à 40 jours et 5×10⁶ Bq — repris ici
        avec cette mise au point. NB : la question 2 (énergie libérée par
        défaut de masse) relève thématiquement de la notion
