    intro: |-
      **Désintégration du cadmium 107 (examen national, session normale 2025 — Exercice 2, 2,5 points).**

      On se propose dans cet exercice d'étudier la désintégration du cadmium 107. Le cadmium radioactif $^{107}_{48}\text{Cd}$ donne, en se désintégrant, le noyau d'argent $^{107}_{47}\text{Ag}$ et une particule $^{A}_{Z}\text{e}$, avec émission d'un rayonnement $\gamma$ (gamma).

      **Données.**
      - Masses : $m(^{107}_{48}\text{Cd}) = 106{,}88045\ \text{u}$ ; $m(^{107}_{47}\text{Ag}) = 106{,}87947\ \text{u}$ ; $m(^{A}_{Z}\text{e}) = 5{,}486\times10^{-4}\ \text{u}$ ;
      - Demi-vie du $^{107}_{48}\text{Cd}$ : $t_{1/2} = 6{,}93$ heures ;
      - $1\ \text{u} = 931{,}49\ \text{MeV.c}^{-2}$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Choisir parmi les affirmations suivantes l'affirmation juste :

          | | |
          |---|---|
          | A | Dans le noyau $^{107}_{48}\text{Cd}$ il y a 59 protons. |
          | B | La désintégration d'un échantillon radioactif est d'autant plus rapide que sa constante radioactive $\lambda$ est plus petite. |
          | C | Dans le diagramme $(N, Z)$ de Segré, les isotopes sont sur une ligne perpendiculaire à l'axe des $Z$. |
          | D | La cohésion du noyau est d'autant plus forte que son énergie de liaison par nucléon est petite. |
        reasoning: |-
          Quatre propositions, une seule vraie.

          A. Le numéro atomique $Z=48$ donne directement le nombre de protons (R1) : 48, pas 59. (59 est le nombre de NEUTRONS, $N=A-Z=107-48=59$ — l'énoncé confond les deux nombres.) Faux.

          B. C'est le sens inverse : $\lambda$ mesure la probabilité de désintégration par unité de temps (R3), et $t_{1/2}=\ln2/\lambda$ (R4) — plus $\lambda$ est GRAND, plus $t_{1/2}$ est petite, plus la désintégration est rapide. Faux.

          C. Le diagramme $(N,Z)$ de cette leçon (R1, la vallée de stabilité) place $Z$ en abscisse (horizontale) et $N$ en ordonnée (verticale). Deux isotopes partagent le même $Z$ mais des $N$ différents : ils sont donc alignés sur une droite VERTICALE, à $Z$ fixé — une droite verticale est perpendiculaire à l'axe horizontal des $Z$. Vrai.

          D. C'est encore le sens inverse : plus l'énergie de liaison par nucléon $E_\ell/A$ est GRANDE, plus chaque nucléon est fortement retenu, donc plus la cohésion est forte — pas l'inverse. Faux.

          Une seule affirmation vraie : $\boxed{\text{C}}$.
      - id: q2
        stem: |-
          **(0,5 pt)** Écrire l'équation de désintégration d'un noyau de cadmium $^{107}_{48}\text{Cd}$ en précisant le type de cette désintégration.
        reasoning: |-
          Comme le fils (l'argent) est donné dans l'énoncé, c'est ici la particule émise qui est l'inconnue des deux lois de Soddy (R2) — le père et le fils sont tous deux connus, il suffit d'appliquer les deux conservations pour identifier ce qui est éjecté.
        steps:
          - math: '^{107}_{48}\text{Cd} \longrightarrow\ ^{107}_{47}\text{Ag} +\ ^{A}_{Z}\text{e}'
            note: "On pose l'équation avec l'argent (donné) et la particule émise comme inconnue."
          - math: '107 = 107 + A \implies A = 0'
            note: "Conservation du nombre de nucléons : l'argent porte déjà les 107 nucléons du père, la particule n'en porte aucun."
          - math: '48 = 47 + Z \implies Z = 1'
            note: "Conservation de la charge : l'argent porte une charge de moins que le cadmium, donc la particule émise porte +1."
          - math: '\boxed{^{107}_{48}\text{Cd} \longrightarrow\ ^{107}_{47}\text{Ag} +\ ^{0}_{+1}\text{e}}'
            note: "A = 0, Z = +1 : c'est un positron — une désintégration β+ (Z diminue d'une unité, R2), cohérente avec un cadmium trop riche en protons par rapport à l'argent."
      - id: q3
        stem: |-
          **(0,5 pt)** Un laboratoire reçoit à la date $t = 0$ un échantillon de $^{107}_{48}\text{Cd}$ d'activité $a_0 = 1{,}25\times10^{12}\ \text{Bq}$. À l'instant $t_1 = 2\,t_{1/2}$ l'activité de cet échantillon est $a_1$ et à l'instant $t_2 = 3\,t_{1/2}$ son activité est $a_2$. Établir l'expression $a_2 = \dfrac{a_1}{2}$.
        reasoning: |-
          Pas besoin de calculer $a_0$ ni $\lambda$ numériquement : la propriété du R4 (après $n$ demi-vies, il reste $1/2^n$, aussi bien sur $N$ que sur l'activité) donne directement $a_1$ et $a_2$ comme fractions de $a_0$, et le rapport des deux fractions donne le résultat demandé.
        steps:
          - math: 'a_1 = a_0\left(\frac{1}{2}\right)^2 = \frac{a_0}{4}'
            note: "t1 = 2 t1/2 : deux demi-vies écoulées, la propriété du R4 donne directement le quart."
          - math: 'a_2 = a_0\left(\frac{1}{2}\right)^3 = \frac{a_0}{8}'
            note: "t2 = 3 t1/2 : trois demi-vies écoulées, un huitième."
          - math: '\boxed{\frac{a_2}{a_1} = \frac{a_0/8}{a_0/4} = \frac{1}{2} \implies a_2 = \frac{a_1}{2}}'
            note: "Le rapport des deux fractions donne directement la relation demandée."
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que l'expression de $N_d$, le nombre de noyaux désintégrés entre les instants $t_1$ et $t_2$, est : $N_d = \dfrac{a_0\,t_{1/2}}{8\ln 2}$.
        reasoning: |-
          Le nombre de noyaux désintégrés entre $t_1$ et $t_2$ est la différence des noyaux présents à ces deux instants, $N(t_1)-N(t_2)$. On repasse par $a=\lambda N$ (R4) pour relier chaque $N$ à l'activité, connue, puis on réexprime $1/\lambda$ en fonction de $t_{1/2}$ pour faire apparaître la forme demandée.
        steps:
          - math: 'N_d = N(t_1) - N(t_2) = \frac{a_1}{\lambda} - \frac{a_2}{\lambda} = \frac{a_1 - a_2}{\lambda}'
            note: "On repasse par a = λN (R4) pour relier le nombre de noyaux à l'activité."
          - math: 'a_1 - a_2 = \frac{a_0}{4} - \frac{a_0}{8} = \frac{a_0}{8}'
            note: "Avec a1 = a0/4 et a2 = a0/8 établis à la question précédente."
          - math: '\frac{1}{\lambda} = \frac{t_{1/2}}{\ln 2}'
            note: "On réexprime 1/λ en fonction de t1/2 (R4), pour faire apparaître t1/2 dans le résultat."
          - math: '\boxed{N_d = \frac{a_0}{8}\times\frac{t_{1/2}}{\ln 2} = \frac{a_0\,t_{1/2}}{8\ln 2}}'
            note: "On assemble les deux morceaux : c'est exactement l'expression à établir."
