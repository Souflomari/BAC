          - math: '|\Delta m| = m\left({}^{131}_{53}\text{I}\right) - m\left({}^{131}_{54}\text{Xe}\right) - m(e^-)'
            note: "Masses nucleaires : l'electron emis compte, il ne doit jamais etre oublie."
          - math: '|\Delta m| = 130{,}8770 - 130{,}8755 - 0{,}00055 = 9{,}5\times10^{-4}\ \text{u}'
            note: "Defaut de masse, en unites de masse atomique."
          - math: 'E = |\Delta m|\,c^2 = 9{,}5\times10^{-4}\times 931{,}5'
            note: "Conversion directe par la donnee 1 u = 931,5 MeV par c au carre."
