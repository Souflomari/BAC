      - id: q3
        part: "2- Etude d'un échantillon d'épinard contaminé par de l'iode 131"
        stem: |-
          **2-1-** (0,5 pt) La mesure de l'activité d'un échantillon d'épinard, pris d'une prairie proche du lieu de l'accident nucléaire, a donné la valeur $8\,000\ \text{Bq}$ par kilogramme, à un instant considéré comme origine des temps. *(L'arabe écrit « une exploitation agricole », le document officiel français « une prairie » — écart cosmétique, déclaré.)*

          Calculer le nombre $N_0$ de noyaux d'iode 131 radioactifs se trouvant dans l'échantillon d'épinard étudié à l'origine des temps.
        reasoning: |-
          **La relation qui fait tout le travail** (rung R4) : l'activité d'un échantillon est proportionnelle au nombre de noyaux encore présents,

          $$a = \lambda\,N \qquad\text{avec}\qquad \lambda = \frac{\ln 2}{t_{1/2}}$$

          À l'origine des temps, $a_0 = \lambda\,N_0$, donc $N_0 = a_0/\lambda$. En remplaçant $\lambda$ :

          $$N_0 = \frac{a_0\,t_{1/2}}{\ln 2}$$

          **Le piège d'unité, et c'est LE geste de la question.** Le becquerel est une **désintégration par seconde**. La constante radioactive $\lambda$ doit donc être en $\text{s}^{-1}$, ce qui oblige à convertir la demi-vie de jours en secondes **avant** tout calcul :

          $$t_{1/2} = 8\ \text{jours} = 8 \times 24 \times 3600 = 691\,200\ \text{s}$$

          Laisser $t_{1/2}$ en jours donnerait $N_0 \approx 9{,}2\times10^{4}$ — un nombre de noyaux dérisoire, incompatible avec une activité de $8\,000$ désintégrations par seconde. L'ordre de grandeur attendu est celui d'un très grand nombre de noyaux : $\approx 8\times10^{9}$, soit huit milliards, ce qui reste en réalité une masse infime d'iode (moins d'un milliardième de gramme).

          **Pourquoi $\lambda$ est si petite ici, et ce que ça veut dire.** $\lambda = \ln 2 / 691\,200 \approx 1{,}00\times10^{-6}\ \text{s}^{-1}$ : chaque seconde, environ un noyau sur un million se désintègre. Il en faut donc beaucoup pour produire $8\,000$ désintégrations par seconde — c'est exactement ce que le calcul dit.
        steps:
          - math: 't_{1/2} = 8\ \text{jours} = 8\times 24\times 3600 = 691200\ \text{s}'
            note: "Conversion obligatoire : le becquerel est une desintegration par seconde."
          - math: '\lambda = \frac{\ln 2}{t_{1/2}} = \frac{0{,}693}{691200} \approx 1{,}00\times10^{-6}\ \text{s}^{-1}'
            note: "Constante radioactive de l'iode 131, en inverse de seconde."
          - math: 'a_0 = \lambda\,N_0 \implies N_0 = \frac{a_0}{\lambda} = \frac{a_0\,t_{1/2}}{\ln 2}'
            note: "Relation activite-nombre de noyaux (rung R4), inversee."
          - math: 'N_0 = \frac{8000\times 691200}{0{,}693}'
            note: "Application numerique, toutes grandeurs en unites SI."
          - math: '\boxed{N_0 \approx 7{,}98\times10^{9}\ \text{noyaux} \approx 8\times10^{9}}'
            note: "Valeur re-derivee par la verification : 7,978 x 10^9 noyaux."
      - id: q4
        stem: |-
          **2-2-** (0,75 pt) Déterminer, en jours, la plus petite durée nécessaires *(sic, pour « nécessaire »)* pour la décontamination des épinards par l'iode 131.

          *La consigne est reproduite telle qu'imprimée. Elle est maladroite : « par l'iode 131 » se rattache grammaticalement à « décontamination » et se lirait comme si l'iode décontaminait. L'original arabe dit le sens visé sans ambiguïté — « la plus petite durée nécessaire pour que l'échantillon d'épinards étudié **devienne non contaminé** par l'iode 131 », c'est-à-dire pour que son activité redescende au niveau maximal admissible.*
        reasoning: |-
          **Traduire la question en inégalité, d'abord.** L'énoncé a donné le seuil dans son chapeau : les épinards sont considérés non contaminés lorsque leur activité **ne dépasse pas** $2\,000\ \text{Bq}$ par kilogramme. On cherche donc le plus petit $t$ tel que

          $$a(t) \le 2\,000\ \text{Bq} \qquad\text{avec}\qquad a(t) = a_0\,e^{-\lambda t} \quad\text{et}\quad a_0 = 8\,000\ \text{Bq}$$

          **La loi de décroissance s'applique à l'activité comme au nombre de noyaux** (rung R4) : puisque $a = \lambda N$ et que $\lambda$ est une constante, $a(t)$ décroît exactement comme $N(t)$, avec la même demi-vie.

          **Le raccourci que le sujet a préparé, et il faut le voir.** Le rapport $\dfrac{a_0}{a} = \dfrac{8\,000}{2\,000} = 4$ est une **puissance de 2**. Or la demi-vie est précisément la durée au bout de laquelle l'activité est divisée par $2$. Diviser par $4 = 2^2$, c'est donc attendre **deux demi-vies** — sans logarithme, sans calculatrice :

          $$8\,000 \xrightarrow{\ t_{1/2}\ } 4\,000 \xrightarrow{\ t_{1/2}\ } 2\,000$$

          $$\boxed{t_{min} = 2\,t_{1/2} = 2\times 8 = 16\ \text{jours}}$$

          **La voie générale, quand le rapport n'est pas une puissance de 2** (rung R5, celui de la datation, lu à l'envers) : on inverse la loi,

          $$t = \frac{t_{1/2}}{\ln 2}\,\ln\!\left(\frac{a_0}{a}\right) = \frac{8}{\ln 2}\times\ln 4 = \frac{8 \times 2\ln 2}{\ln 2} = 16\ \text{jours}$$

          Les $\ln 2$ se simplifient : la même réponse, par le chemin long.

          **Ici, l'unité ne pose aucun problème** — contrairement à la question 2-1. Comme on ne manipule qu'un **rapport** d'activités, $\lambda$ et $t$ peuvent rester en jours : la réponse sort directement dans l'unité demandée.

          **Le piège de cette question.** Répondre « $8$ jours » en confondant demi-vie et durée de décontamination : une demi-vie ramènerait l'activité à $4\,000\ \text{Bq}$, encore le double du seuil admissible. Le seuil est fixé par l'énoncé, pas par la demi-vie.
        steps:
          - math: 'a(t) = a_0\,e^{-\lambda t} \le 2000\ \text{Bq} \qquad a_0 = 8000\ \text{Bq}'
            note: "Mise en inequation : le seuil de non-contamination est donne par le chapeau de l'enonce."
          - math: '\frac{a_0}{a} = \frac{8000}{2000} = 4 = 2^2'
            note: "Le rapport est une puissance de 2 : le sujet a prepare le raccourci."
          - math: 'e^{-\lambda t} \le \frac{1}{4} \implies \lambda t \ge \ln 4 = 2\ln 2 \implies t \ge 2\,t_{1/2}'
            note: "Chaque demi-vie divise l'activite par deux ; il en faut donc exactement deux."
          - math: '\boxed{t_{min} = 2\times 8 = 16\ \text{jours}}'
            note: "Duree minimale pour que l'activite redescende a 2000 Bq par kilogramme."
