    intro: |-
      **Contamination des épinards par l'iode 131 après l'accident de Fukushima (examen national, session de rattrapage 2013 — exercice « Physique nucléaire », 2,50 points).**

      Les médias ayant couvert la catastrophe nucléaire japonaise de fukushima *(sic, sans majuscule — le sommaire du sujet écrit pourtant « Fukushima »)* le 11 mars 2011, ont déclaré que les taux de contamination radioactive des aliments a *(sic, pour « ont »)* parfois dépassé de 10 fois les taux autorisés. Par exemple l'activité de l'iode 131 dans les épinards a varié entre $6\,100\ \text{Bq}$ et $15\,020\ \text{Bq}$ par kilogramme. Au japon *(sic)*, les épinards sont considérés non contaminés, lorsque leur activité ne dépasse pas $2\,000\ \text{Bq}$ par kilogramme, comme niveau maximal admissible de contamination radioactive.

      *D'après le site : www.ciirad.org* <!-- DIVERGENCE DÉCLARÉE, 2026-09-04 : l'original arabe RS28 ajoute
           ici « ( بتصرف) » = « (adapté) », mention que l'édition française a
           supprimée. L'édition française de ce sujet étant MINISTÉRIELLE (code
           d'examen RS28 encadré, imprimé à l'identique dans les deux cartouches),
           c'est un défaut du DOCUMENT OFFICIEL francophone, pas un artefact de
           traduction professorale. Cosmétique : aucune question n'en dépend.
           Voir docs/sujets/_incoming/pc-2013-r.md, V.7 / V.8. -->

      Le but de cet exercice est l'étude de la décroissance radioactive d'un échantillon d'épinard contaminé par l'iode 131 radioactif.

      **Données :**
      - La demi-vie de l'iode 131 : $t_{1/2} = 8\ \text{jours}$ ;
      - $1\ \text{u} = 931{,}5\ \text{MeV.c}^{-2}$ ;
      - $m\left({}^{131}_{54}\text{Xe}\right) = 130{,}8755\ \text{u}$ ;
      - $m\left({}^{131}_{53}\text{I}\right) = 130{,}8770\ \text{u}$ ;
      - $m(e^-) = 0{,}00055\ \text{u}$.
    questions:
      - id: q1
        part: "1- Etude du nucléide iode 131"
        stem: |-
          **1-1-** (0,5 pt) La désintégration d'un noyau d'iode ${}^{131}_{53}\text{I}$ donne naissance à un noyau ${}^{131}_{54}\text{Xe}$. Ecrire la l'équation *(sic — mot dupliqué dans le sujet)* modélisant cette désintégration, et préciser son type.
        reasoning: |-
          Les deux **lois de conservation de Soddy** (rung R2) suffisent, et elles se posent avant de nommer quoi que ce soit :

          - conservation du **nombre de masse** $A$ : $131 = 131 + A_P$, donc la particule émise a $A_P = 0$ ;
          - conservation du **nombre de charge** $Z$ : $53 = 54 + Z_P$, donc $Z_P = 53 - 54 = -1$.

          Une particule de nombre de masse nul et de charge $-1$, c'est l'**électron** ${}^{\ 0}_{-1}e$. La désintégration est donc de type $\beta^-$ :

          $$\boxed{{}^{131}_{53}\text{I} \;\longrightarrow\; {}^{131}_{54}\text{Xe} + {}^{\ 0}_{-1}e}$$

          **Le contrôle de vraisemblance, à faire dans l'autre sens** (rung R1). Le noyau père a $Z = 53$ protons et $131 - 53 = 78$ neutrons : un rapport $N/Z \approx 1{,}47$, trop riche en neutrons pour un noyau de cette taille. C'est exactement la situation qui déclenche une désintégration $\beta^-$ : à l'intérieur du noyau, un **neutron se transforme en proton** avec émission d'un électron. Le $Z$ augmente d'une unité ($53 \to 54$), le $A$ ne bouge pas — ce que l'énoncé annonçait, et que les deux lois viennent de confirmer.

          **Le piège de cette question.** Écrire $Z_P = +1$ en soustrayant dans le mauvais sens et conclure « $\beta^+$ ». Le signe se lit sur la loi de conservation, pas sur l'intuition : le fils a **plus** de charge que le père, donc la particule emportée est **négative**. *(C'est précisément l'erreur d'arithmétique que commet le corrigé arabe de ce sujet — il écrit « donc $Z = 1$ » avant de conclure correctement $\beta^-$ : la conclusion est juste, la déduction écrite ne l'est pas.)*
