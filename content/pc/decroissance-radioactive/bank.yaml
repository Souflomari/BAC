entries:
  # ── bk-2019-n-x2 — 2019 N, Exercice II (Partie 2) : désintégration du radon 222 ──
  - id: bk-2019-n-x2
    title: "Désintégration du radon 222 : stabilité, énergie de liaison et loi de décroissance"
    source:
      year: 2019
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice II — Partie 2. Étude de la désintégration du radon 222"
    bareme_total: 1.75
    duration_min: 9
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/68300 (Exercice II, Partie 2 — étude
        de la désintégration du radon 222 ; barème de la partie ≈ 1,75 pt sur
        les 3,5 pt de l'exercice complet, qui comporte aussi une Partie 1 sur
        une onde mécanique périodique, transcrite sous
        ondes-mecaniques-periodiques.md). Transcription vérifiée : re-fetch
        indépendant AlloSchool + diff OK (docs/sujets/pc/decroissance-radioactive.md,
        statut « vérifié » agent-vérificateur 2026-07-11). NB : les questions
        1–3 (stabilité comparée, énergie de liaison de l'hélium, énergie
        libérée) relèvent thématiquement de la notion noyaux-masse-energie —
        signalé dans le fichier source ; reprises ici en entier pour que la
        banque reste le corpus complet des annales attachées à cette page
        (recoupement assumé, à arbitrer en revue, même disposition que
        rc-charge bk-2019-n-x3).
    intro: |-
      **Étude de la désintégration du radon 222 (examen national, session normale 2019).**

      Le radon de symbole Rn est un gaz rare naturellement présent dans l'atmosphère. Il est issu par décompositions successives de l'uranium présent dans les roches granitiques. L'isotope 222 du radon est radioactif. On se propose d'étudier dans cette partie la désintégration nucléaire de cet isotope.

      **Données.** La demi-vie du radon 222 est : $t_{1/2} = 3{,}8\ \text{jours}$.

      Tableau des énergies de liaison par nucléon :

      | Noyau | Hélium | Radon | Polonium |
      |-------|:------:|:-----:|:--------:|
      | Symbole | $^{4}_{2}\text{He}$ | $^{222}_{86}\text{Rn}$ | $^{218}_{84}\text{Po}$ |
      | Énergie de liaison par nucléon (MeV/nucléon) | 7,07 | 7,69 | 7,73 |
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Parmi les deux noyaux $^{222}_{86}\text{Rn}$ et $^{218}_{84}\text{Po}$, lequel est le plus stable ? Justifier la réponse.
        reasoning: |-
          Ce critère de stabilité n'est pas celui du R1 de cette leçon (le rapport $N/Z$, la vallée de stabilité) : c'est celui, complémentaire, de la notion noyaux-masse-energie — plus l'énergie de liaison par nucléon $E_\ell/A$ est grande, plus chaque nucléon est fortement retenu, donc plus le noyau est stable. Il suffit de comparer les deux valeurs données dans le tableau, sans aucun calcul.

          $$E_\ell/A(\text{Po}) = 7{,}73\ \text{MeV/nucléon} \; > \; E_\ell/A(\text{Rn}) = 7{,}69\ \text{MeV/nucléon}$$

          Le polonium 218 est donc le noyau le plus stable des deux.
      - id: q2
        stem: |-
          **(0,25 pt)** Montrer que l'énergie de liaison d'un noyau d'hélium $^{4}_{2}\text{He}$ est : $E_{\ell}(\text{He}) = 28{,}28\ \text{MeV}$.
        reasoning: |-
          Le tableau donne l'énergie de liaison PAR nucléon ; on veut l'énergie de liaison TOTALE. Le passage de l'une à l'autre est une simple multiplication par le nombre de nucléons $A$ du noyau considéré — ici $A(\text{He}) = 4$, pas $A(\text{Rn})$ ni $A(\text{Po})$.
        steps:
          - math: 'E_\ell(\text{He}) = \frac{E_\ell}{A}(\text{He}) \times A(\text{He})'
            note: "L'énergie de liaison totale est l'énergie de liaison par nucléon multipliée par le nombre de nucléons du noyau."
          - math: '\boxed{E_\ell(\text{He}) = 7{,}07 \times 4 = 28{,}28\ \text{MeV}}'
            note: "Application numérique : 7,07 MeV/nucléon, A = 4 pour l'hélium 4 (2 protons + 2 neutrons)."
      - id: q3
        stem: |-
          **(0,5 pt)** L'équation de désintégration du radon 222 s'écrit :

          $$^{222}_{86}\text{Rn} \longrightarrow\ ^{218}_{84}\text{Po} +\ ^{4}_{2}\text{He}.$$

          Choisir la réponse juste parmi les propositions suivantes : l'énergie libérée lors de la désintégration d'un noyau du radon 222 est :
          - $E_{lib} = 7{,}11\ \text{MeV}$
          - $E_{lib} = 22{,}56\ \text{MeV}$
          - $E_{lib} = 6{,}24\ \text{MeV}$
          - $E_{lib} = 3420{,}6\ \text{MeV}$
        reasoning: |-
          Toujours hors des rungs de cette leçon (domaine noyaux-masse-energie), mais le principe se déduit directement de la question précédente : l'énergie libérée est l'écart entre l'énergie de liaison totale des produits (plus liés, donc à plus basse énergie) et celle du noyau père. On a besoin des trois énergies de liaison totales — celle du radon et celle du polonium, obtenues comme à la question 2 en multipliant par $A$, et celle de l'hélium, déjà calculée. Plutôt que de calculer les quatre propositions une par une, on calcule directement $E_{lib}$ et on regarde laquelle des quatre elle égale.
        steps:
          - math: 'E_{lib} = \big[E_\ell(\text{Po}) + E_\ell(\text{He})\big] - E_\ell(\text{Rn})'
            note: "L'énergie libérée est l'écart entre l'énergie de liaison totale des produits et celle du père."
          - math: 'E_\ell(\text{Rn}) = 7{,}69 \times 222 = 1707{,}18\ \text{MeV}'
            note: "Énergie de liaison totale du radon 222 : énergie par nucléon multipliée par A = 222."
          - math: 'E_\ell(\text{Po}) = 7{,}73 \times 218 = 1685{,}14\ \text{MeV}'
            note: "Énergie de liaison totale du polonium 218 : A = 218."
          - math: 'E_{lib} = (1685{,}14 + 28{,}28) - 1707{,}18 = 1713{,}42 - 1707{,}18'
            note: "On additionne les deux produits (Po + He, dont l'énergie vient de la question 2) et on soustrait le père."
          - math: '\boxed{E_{lib} \approx 6{,}24\ \text{MeV}}'
            note: "Ce résultat correspond exactement à la troisième proposition."
      - id: q4
        stem: |-
          **(0,5 pt)** On considère un échantillon de noyaux du radon 222 ayant, à l'instant $t=0$, une activité $a_0$. Trouver, en jours, l'instant de date $t_1$ à laquelle cet échantillon a une activité $a_1 = \dfrac{a_0}{4}$.
        reasoning: |-
          Ici on retombe en plein cœur de cette leçon (R4) : l'activité suit exactement la même loi exponentielle que le nombre de noyaux, donc la propriété « après $n$ demi-vies, il reste $1/2^n$ » s'applique aussi bien à $a(t)$. Le réflexe à avoir avant de se jeter sur le logarithme : $1/4$ est-elle une puissance entière de $1/2$ ? Oui, $1/4 = (1/2)^2$ — donc $t_1$ correspond à exactement deux demi-vies, sans avoir besoin de résoudre quoi que ce soit.
        steps:
          - math: '\frac{a_1}{a_0} = \frac{1}{4} = \left(\frac{1}{2}\right)^2'
            note: "Le rapport demandé est une puissance entière de 1/2 : deux demi-vies exactement, pas besoin du logarithme."
          - math: 't_1 = 2 \times t_{1/2}'
            note: "Propriété du R4 : après n demi-vies, il reste 1/2^n du départ, sur N comme sur l'activité."
          - math: '\boxed{t_1 = 2 \times 3{,}8 = 7{,}6\ \text{jours}}'
            note: "Application numérique avec la demi-vie donnée t_1/2 = 3,8 jours."

