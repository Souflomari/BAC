<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le principe de la datation par le carbone 14 : l'activité A en fonction du temps t. Tant que l'organisme est vivant, l'activité reste constante au niveau de référence A0. À la mort de l'organisme (t=0), les échanges s'arrêtent et l'activité décroît exponentiellement, A(t) = A0 exp(-λt). L'activité mesurée aujourd'hui se reporte horizontalement sur la courbe puis verticalement sur l'axe des temps : l'écart donne l'âge de l'échantillon, le temps écoulé depuis la mort.">
  <title>Le principe de la datation — A(t) et l'âge de l'échantillon</title>
  <!--
    datation-c14.svg — graphe STATIQUE, A(t) en deux temps (plateau puis
    décroissance). STAGED (LESSON-EXPERIENCE-SPEC §2.5) : graphe → toujours
    staged, ordre canonique axes → données → lecture.
      step-1 : axes (A en fonction de t), repère A0 (chrome neutre)
      step-2 : la courbe en deux temps (les données) + la formule
      step-3 : la lecture — A(t) mesurée aujourd'hui → report horizontal
               sur la courbe → chute verticale sur l'axe des temps → l'âge

    Géométrie (calculée, pas devinée) :
      origine du repère (t=0, "mort de l'organisme") : (x0,y0) = (180,70)
        — PAS au bord gauche du panneau : le panneau garde une plage
        t<0 (x=80 à 180, organisme vivant, plateau) à gauche de l'axe A,
        contrairement aux autres graphes N(t)/A(t) de cette leçon qui
        commencent tous à t=0.
      axe A=0 (asymptote)  : y = 350           → hauteur pleine A0 = 280 px
      échelle temporelle   : t½_px = 140 px    (1 demi-vie = 140 px sur x,
        MÊME échelle que decroissance-courbe.svg — même loi physique)

    La partie t>0 de la courbe est la MÊME polyligne calculée que
    decroissance-courbe.svg (A/A0 = 2^(-t/t½), pas de 20 px = t½_px/7),
    simplement translatée de +100 px en x (origine à x=180 au lieu de 80)
    et tronquée à x=580 (au lieu de 610) pour garder une marge symétrique
    à droite. Le plateau (t<0) est un simple segment horizontal à y=70
    (A=A0), qui rejoint exactement le premier point de la décroissance —
    un seul <path> continu, pas deux tracés recollés visuellement.

    Le point "aujourd'hui" de l'étape 3 est le point EXACT de la
    polyligne à x=460 (soit t = 2 demi-vies depuis la mort), qui vaut par
    construction A/A0 = 1/4 (même valeur, même calcul que le point
    N0/4 de decroissance-courbe.svg à 2 demi-vies) — un choix délibéré :
    il fait écho à l'exercice résolu du R6 de cette leçon (A = A0/4,
    âge = 2·t½ ≈ 11 460 ans pour le carbone 14), sans réutiliser de valeur
    numérique propre au carbone 14 dans LA FIGURE elle-même (le nombre de
    demi-vies reste générique — "l'exemple" — la vraie donnée numérique
    reste dans le texte et le R6).

    Rôle des couleurs :
      la courbe (plateau + décroissance), le point "aujourd'hui", les
        guides de lecture, le repère A(t) : --figure-accent (le sujet)
      axes, "0", A0 (référence initiale), le repère "···" suggérant que
        l'organisme était vivant bien avant le bord du panneau : --figure-ink-soft
      étiquette flottante "mort de l'organisme (t=0)" et le texte "âge
        de l'échantillon" : --figure-ink (note explicative, même
        convention que tangente-tau.svg / courbe-aston.svg)
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Le principe de la datation — A(t) et l'âge de l'échantillon
  </text>

  <!-- Fond du panneau -->
  <rect x="40" y="32" width="590" height="350" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <g id="step-1">
    <!-- ── Axes — ink-soft, chrome neutre ───────────────────────── -->
    <line x1="80" y1="350" x2="610" y2="350"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="610,350 598,345.5 598,354.5" fill="var(--figure-ink-soft)"/>
    <!-- Axe A, placé à t=0 (x=180) : c'est là que l'activité de référence est lue -->
    <line x1="180" y1="350" x2="180" y2="50"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="180,50 175.5,61 184.5,61" fill="var(--figure-ink-soft)"/>
    <text x="617" y="354" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="172" y="54" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">A</text>
    <text x="172" y="354" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>

    <!-- Suggestion que le plateau se prolonge bien avant le bord du panneau -->
    <text x="66" y="347" font-size="11" fill="var(--figure-ink-soft)">···</text>

    <!-- Repère A0 (valeur de référence, organisme vivant) -->
    <line x1="176" y1="70" x2="184" y2="70"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="170" y="74" text-anchor="end" font-size="10.5"
          fill="var(--figure-ink-soft)">A<tspan dy="3" font-size="7.5">0</tspan></text>
  </g><!-- /step-1 -->

  <g id="step-2">
    <!--
      Courbe en deux temps — un seul path continu :
        plateau  : (80,70) → (180,70)               [A = A0, organisme vivant]
        décroissance : polyligne calculée A/A0 = 2^(-Δt/t½), pas de 20px,
          identique à decroissance-courbe.svg translatée de +100px en x.
    -->
    <path d="
      M80,70 L180,70
      L200,96.4 L220,120.31 L240,141.96 L260,161.58 L280,179.34
      L300,195.43 L320,210 L340,223.2 L360,235.15 L380,245.98
      L400,255.79 L420,264.67 L440,272.71 L460,280 L480,286.6
      L500,292.58 L520,297.99 L540,302.89 L560,307.33 L580,311.36
    " fill="none"
      stroke="var(--figure-accent)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Le point de rupture : la mort de l'organisme, t = 0 -->
    <circle cx="180" cy="70" r="3" fill="var(--figure-accent)"/>
    <text x="188" y="88" font-size="9.5" fill="var(--figure-ink)">mort de l'organisme (t = 0)</text>

    <!-- Boîte formule -->
    <rect x="405" y="48" width="210" height="32" rx="5"
          fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="510" y="69" text-anchor="middle" font-size="13" font-style="italic"
          fill="var(--figure-accent)">A(t) = A<tspan
          dy="4" font-size="9">0</tspan><tspan
          dy="-4"> e</tspan><tspan
          dy="-5" font-size="9">-λt</tspan>
    </text>
  </g><!-- /step-2 -->

  <g id="step-3">
    <!-- Report horizontal de A(t) mesurée (à x=460, A/A0=1/4) jusqu'à l'axe A -->
    <line x1="180" y1="280" x2="460" y2="280"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>
    <!-- Chute verticale jusqu'à l'axe des temps -->
    <line x1="460" y1="280" x2="460" y2="350"
          stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="5,3"/>

    <!-- Repère A(t) sur l'axe A -->
    <line x1="176" y1="280" x2="184" y2="280"
          stroke="var(--figure-accent)" stroke-width="1.2"/>
    <text x="170" y="284" text-anchor="end" font-size="10.5" font-style="italic"
          fill="var(--figure-accent)">A(t)</text>

    <!-- Point "aujourd'hui" sur la courbe -->
    <circle cx="460" cy="280" r="3.2" fill="var(--figure-accent)"/>

    <!-- Repère sur l'axe des temps (le point "aujourd'hui") -->
    <line x1="460" y1="345" x2="460" y2="355"
          stroke="var(--figure-accent)" stroke-width="1.6"/>

    <!-- L'âge : la distance entre t=0 (mort) et t (aujourd'hui) -->
    <line x1="182" y1="364" x2="458" y2="364"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="320" y="376" text-anchor="middle" font-size="9" fill="var(--figure-ink)">
      âge = temps écoulé depuis la mort
    </text>
  </g><!-- /step-3 -->

</svg>
