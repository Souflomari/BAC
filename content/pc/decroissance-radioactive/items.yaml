  - id: DECRO-19
    rung: "R6"
    difficulty_level: 5
    skill_code: decroissance_radioactive
    tags: [datation, activite, demi_vie, misconception_driven]
    stem: >
      Un échantillon de césium 137 ($t_{1/2}=30$ ans) a une activité
      initiale $A_0$. Quelle fraction de cette activité reste-t-il après
      150 ans ?
    type: mcq
    choices:
      - id: A
        text: "$A_0/5$, car on a compté 5 demi-vies, donc on divise par 5."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          Chaque demi-vie divise l'activité PAR 2, pas par un montant
          fixe : 5 demi-vies donnent $2^5=32$, pas 5.
      - id: B
        text: "$A_0/32$, car 150 ans représentent exactement 5 demi-vies, et $2^5=32$."
        correct: true
      - id: C
        text: "$0$, l'activité est totalement retombée à zéro après un nombre entier de demi-vies."
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          L'activité ne s'annule jamais exactement : il en reste toujours
          une fraction non nulle, ici $A_0/32$.
      - id: D
        text: "$A_0/32$ pour les noyaux « anciens » de l'échantillon seulement ; les noyaux plus « récemment formés » se désintègrent moins vite et faussent légèrement ce résultat."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-fraicheur-instable
        feedback: >
          Tous les noyaux de césium 137, quel que soit leur âge
          individuel, ont exactement la même constante λ : aucune
          sous-population ne se désintègre différemment.
    correct_feedback: >
      $150 = 5\times30 = 5\times t_{1/2}$, donc l'activité est divisée par
      $2^5=32$.
    solution: |
      5 demi-vies écoulées : $A(150)/A_0=(1/2)^5=1/32$. Vérification :
      $\lambda=\ln2/30\approx0{,}0231\ \text{an}^{-1}$, et
      $e^{-0{,}0231\times150}\approx1/32$.

  - id: DECRO-20
    rung: "R6"
    difficulty_level: 5
    skill_code: decroissance_radioactive
    tags: [datation, activite, misconception_driven]
    stem: >
      Un échantillon de strontium 90 ($t_{1/2}=28{,}8$ ans) a une activité
      initiale $A_0$. Aujourd'hui, son activité mesurée vaut $A_0/8$. Quel
      est l'âge de cet échantillon ?
    type: mcq
    choices:
      - id: A
        text: "$t=\\ln 8\\approx2{,}08$ an, en utilisant le logarithme directement sans diviser par λ."
        correct: false
        misconception: mc.physics.decroissance_radioactive.oubli-lambda-dans-exponentielle
        feedback: >
          $\ln 8$ est sans dimension : il faut le diviser par λ (ou
          multiplier par $t_{1/2}/\ln2$) pour obtenir une durée en années.
      - id: B
        text: "On ne peut pas déterminer un âge précis : une activité tombée au huitième de sa valeur initiale signifie que l'échantillon est déjà totalement désintégré."
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          $A_0/8$ reste une activité mesurable, non nulle : l'âge se
          calcule précisément, il vaut $3\times t_{1/2}$.
      - id: C
        text: "$t=3\\times t_{1/2}\\approx86{,}4$ ans, car $1/8=(1/2)^3$."
        correct: true
      - id: D
        text: "$t$ serait plus court que $3\\times t_{1/2}$, car les noyaux de strontium 90 les plus récemment formés dans l'échantillon se désintègrent plus vite et accélèrent la baisse d'activité mesurée."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-fraicheur-instable
        feedback: >
          Aucun noyau ne se désintègre plus vite parce qu'il est
          « récent » : λ est la même pour tous les noyaux de strontium 90,
          l'âge calculé par $3\times t_{1/2}$ est exact.
    correct_feedback: >
      $1/8=(1/2)^3$ : 3 demi-vies écoulées, donc
      $t=3\times28{,}8\approx86{,}4$ ans.
    solution: |
      $A(t)/A_0=1/8=(1/2)^3$, donc $t=3\times t_{1/2}=3\times28{,}8=86{,}4$
      ans. Vérification par la formule générale :
      $t=\frac{1}{\lambda}\ln(A_0/A)=\frac{t_{1/2}}{\ln2}\ln8$, même
      résultat.

  - id: DECRO-21
    rung: "R6"
    difficulty_level: 5
    skill_code: decroissance_radioactive
    tags: [datation, calcul, misconception_driven]
    stem: >
      Un géologue étudie une roche contenant du potassium 40
      ($t_{1/2}=1{,}3\times10^9$ ans). Il mesure qu'il reste 40 % du
      potassium 40 initial. Quel est l'âge de la roche ?
    type: mcq
    choices:
      - id: A
        text: '$t=\dfrac{t_{1/2}}{\ln2}\ln\!\left(\dfrac{1}{0{,}40}\right)\approx1{,}72\times10^9$ ans.'
        correct: true
      - id: B
        text: "$t=t_{1/2}\\times0{,}60=7{,}8\\times10^8$ ans, en réduisant la demi-vie proportionnellement au pourcentage désintégré (60 %)."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          La relation entre fraction restante et temps n'est pas
          linéaire, mais logarithmique : il faut passer par
          $t=\frac{1}{\lambda}\ln(1/0{,}40)$, pas une simple proportion.
      - id: C
        text: "On ne peut pas dater fiablement cette roche, car λ du potassium 40 a pu varier selon les conditions de pression et de température subies pendant son histoire géologique."
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          λ du potassium 40 est indépendant de la pression et de la
          température, y compris sur des échelles de temps géologiques :
          c'est ce qui rend la datation fiable.
      - id: D
        text: "Le résultat sous-estime l'âge réel, car après plus d'un milliard d'années, les noyaux de potassium 40 restants ont une probabilité de désintégration par seconde plus élevée qu'au départ."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-vieillit
        feedback: >
          La probabilité de désintégration par seconde reste λ,
          constante, quel que soit le temps déjà écoulé : aucune
          correction d'âge n'est nécessaire.
    correct_feedback: >
      $\ln(1/0{,}40)\approx0{,}916$, donc
      $t=(t_{1/2}/\ln2)\times0{,}916\approx1{,}72\times10^9$ ans.
    solution: |
      $$t=\frac{1}{\lambda}\ln\!\left(\frac{N_0}{N(t)}\right)=\frac{t_{1/2}}{\ln2}\ln(1/0{,}40)\approx\frac{1{,}3\times10^9}{0{,}693}\times0{,}916\approx1{,}72\times10^9\ \text{ans}$$

