    skill_code: decroissance_radioactive
    tags: [datation, calcul, misconception_driven]
    stem: >
      Un géologue étudie une roche contenant du potassium 40
      ($t_{1/2}=1{,}3\times10^9$ ans). Il mesure qu'il reste 40 % du
      potassium 40 initial. Quel est l'âge de la roche ?
    type: mcq
    choices:
      - id: A
        text: "$t=\\dfrac{t_{1/2}}{\\ln2}\\ln\\!\\left(\\dfrac{1}{0{,}40}\\right)\\approx1{,}72\\times10^9$ ans, en inversant la loi de décroissance exponentielle."
        correct: true
      - id: B
        text: "$t=t_{1/2}\\times0{,}60=7{,}8\\times10^8$ ans, en réduisant la demi-vie proportionnellement au pourcentage désintégré (60 %)."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          La relation entre fraction restante et temps n'est pas
          linéaire, mais logarithmique : il faut passer par
          $t=\frac{1}{\lambda}\ln(1/0{,}40)$, pas une simple proportion.
      - id: C
        text: "On ne peut pas dater fiablement cette roche, car λ du potassium 40 a pu varier selon les conditions de pression et de température subies pendant son histoire géologique."
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          λ du potassium 40 est indépendant de la pression et de la
          température, y compris sur des échelles de temps géologiques :
          c'est ce qui rend la datation fiable.
      - id: D
        text: "Le résultat sous-estime l'âge réel, car après plus d'un milliard d'années, les noyaux de potassium 40 restants ont une probabilité de désintégration par seconde plus élevée qu'au départ."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-vieillit
        feedback: >
          La probabilité de désintégration par seconde reste λ,
          constante, quel que soit le temps déjà écoulé : aucune
          correction d'âge n'est nécessaire.
    correct_feedback: >
      $\ln(1/0{,}40)\approx0{,}916$, donc
      $t=(t_{1/2}/\ln2)\times0{,}916\approx1{,}72\times10^9$ ans.
    solution: |
      $$t=\frac{1}{\lambda}\ln\!\left(\frac{N_0}{N(t)}\right)=\frac{t_{1/2}}{\ln2}\ln(1/0{,}40)\approx\frac{1{,}3\times10^9}{0{,}693}\times0{,}916\approx1{,}72\times10^9\ \text{ans}$$

