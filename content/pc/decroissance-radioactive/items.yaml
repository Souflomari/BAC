  # R4 — demi-vie, décroissance géométrique
  # ══════════════════════════════════════════════════════════════

  - id: DECRO-6
    rung: "R4"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [demi_vie, calcul, misconception_driven]
    stem: >
      Un échantillon contient initialement $N_0$ noyaux radioactifs d'un
      isotope de demi-vie $t_{1/2} = 8$ jours. Combien de noyaux n'ont pas
      encore désintégré après 24 jours ?
    type: mcq
    choices:
      - id: A
        text: "$N_0/8$, car 24 jours représentent exactement 3 demi-vies, et $2^3 = 8$."
        correct: true
      - id: B
        text: "$N_0/3$, car on a compté 3 demi-vies, donc on divise par 3."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          Chaque demi-vie divise la population restante PAR 2, pas par un
          montant fixe qu'on additionne. Ce n'est pas linéaire (diviser par
          le nombre de demi-vies) mais géométrique (diviser par 2, autant de
          fois qu'il y a de demi-vies) : $N_0/2^3 = N_0/8$, pas $N_0/3$.
      - id: C
        text: "$0$, car après un nombre entier de demi-vies, l'échantillon est totalement désintégré."
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          La demi-vie n'est pas une durée de vie totale : $N(t) = N_0
          e^{-\lambda t}$ ne s'annule jamais exactement, quel que soit le
          nombre de demi-vies écoulées. Il reste toujours une quantité non
          nulle, ici $N_0/8$.
      - id: D
        text: '$N_0 \, e^{-24}$, en appliquant directement l''exposant en jours.'
        correct: false
        misconception: mc.physics.decroissance_radioactive.oubli-lambda-dans-exponentielle
        feedback: >
          L'exposant d'une exponentielle doit être sans dimension : il faut
          $e^{-\lambda t}$, avec $\lambda = \ln 2 / t_{1/2}$, pas $e^{-t}$
          directement. Le temps $t$ seul, en jours, n'est pas une quantité
          sans dimension.
    correct_feedback: >
      24 jours, c'est $24/8 = 3$ demi-vies : la population restante est
      divisée par 2, trois fois de suite, soit $N_0/2^3 = N_0/8$.
    solution: |
      $t_{1/2} = 8$ jours, donc $\lambda = \dfrac{\ln 2}{8} \approx 0{,}0866\ \text{jour}^{-1}$.
      $24$ jours $= 3 \times t_{1/2}$, donc après 3 demi-vies successives :

      $$\frac{N(24)}{N_0} = \left(\frac{1}{2}\right)^3 = \frac{1}{8}$$

      Vérification par la formule directe :
      $N(24) = N_0 e^{-\lambda \times 24} = N_0 e^{-0{,}0866 \times 24} = N_0 e^{-2{,}08} \approx N_0/8$.
      Les deux méthodes s'accordent : il reste $N_0/8$.

  - id: DECRO-14
    rung: "R4"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [activite, demi_vie, calcul, misconception_driven]
    stem: >
      Un échantillon de cobalt 60 ($t_{1/2}=5{,}27$ ans) a une activité
      initiale $A_0=800$ Bq. Quelle est son activité environ 15,8 ans plus
      tard (soit environ 3 demi-vies) ?
    type: mcq
    choices:
      - id: A
        text: "$A_0/3\\approx267$ Bq, car on a compté 3 demi-vies, donc on divise par 3."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          Chaque demi-vie divise l'activité PAR 2, pas par un montant
          fixe : après 3 demi-vies, c'est $2^3=8$, pas 3.
      - id: B
        text: "$0$ Bq, l'activité est totalement retombée à zéro après un nombre entier de demi-vies."
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          $A(t)=A_0e^{-\lambda t}$ ne s'annule jamais exactement : il
          reste toujours une activité non nulle, ici $A_0/8$.
      - id: C
        text: '$A_0\,e^{-15{,}8}\approx1{,}1\times10^{-4}$ Bq, en utilisant directement 15,8 comme exposant.'
        correct: false
        misconception: mc.physics.decroissance_radioactive.oubli-lambda-dans-exponentielle
        feedback: >
          L'exposant doit être $\lambda t$, sans dimension, pas $t$ seul
          en années.
      - id: D
        text: "$A_0/8=100$ Bq, car 3 demi-vies divisent l'activité par $2^3=8$."
        correct: true
    correct_feedback: >
      $15{,}8$ ans $= 3\times5{,}27$ ans $= 3\times t_{1/2}$, donc
      l'activité est divisée par $2^3=8$ : $A=800/8=100$ Bq.
    solution: |
      $A(t)=A_0e^{-\lambda t}$ suit la même loi que $N(t)$. Après 3
      demi-vies successives, l'activité est divisée par $2^3=8$ :
      $A=800/8=100$ Bq — confirmé par $A_0e^{-\lambda\times15{,}8}$ avec
      $\lambda=\ln2/5{,}27$.

  - id: DECRO-15
    rung: "R4"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [demi_vie, calcul, misconception_driven]
    stem: >
      Le radon 222 a une demi-vie $t_{1/2}=3{,}8$ jours. Après 4 demi-vies
      (15,2 jours), quelle affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: "Il ne reste plus aucun noyau de radon 222 : après un nombre entier de demi-vies, la désintégration est totale."
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          $N(t)=N_0e^{-\lambda t}$ ne s'annule jamais exactement : il
          reste toujours une quantité non nulle, ici $N_0/16$.
      - id: B
        text: "Il reste $N_0/16$ des noyaux initiaux (car $2^4=16$) : une quantité faible mais non nulle, l'échantillon n'a pas totalement disparu."
        correct: true
      - id: C
        text: "Il reste $N_0/4$, car on divise par le nombre de demi-vies écoulées."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          Ce n'est pas une division linéaire par le nombre de demi-vies :
          à chaque demi-vie, la population restante est divisée PAR 2,
          soit $N_0/2^4=N_0/16$.
      - id: D
        text: '$N(15{,}2)=N_0\,e^{-15{,}2}$, en utilisant directement la durée en jours comme exposant.'
        correct: false
        misconception: mc.physics.decroissance_radioactive.oubli-lambda-dans-exponentielle
        feedback: >
          Il manque λ dans l'exposant : c'est $e^{-\lambda t}$, avec
          $\lambda=\ln2/t_{1/2}$, pas $e^{-t}$ directement.
    correct_feedback: >
      4 demi-vies divisent la population restante par $2^4=16$ : il reste
      $N_0/16$, une quantité petite mais jamais nulle.
    solution: |
      $t_{1/2}=3{,}8$ jours, donc $\lambda=\ln2/3{,}8\approx0{,}182\
      \text{jour}^{-1}$. Après 4 demi-vies : $N(15{,}2)/N_0=(1/2)^4=1/16$.
      Vérification directe : $N_0e^{-0{,}182\times15{,}2}\approx N_0/16$.

  # Summit-conversion ride-along (2026-07-12): four R4 items that bring the two
  # gate misconceptions surfaced by the R6 conversion to the ≥3 floor —
  # confond-activite-nombre-noyaux (DECRO-23, 25, 26) and
  # confond-demi-vie-constante-lambda (DECRO-23, 24, 25, 26). Sources for
  # cp-r4-activite-noyaux (DECRO-23) and cp-r4-demi-vie-lambda (DECRO-24).
  - id: DECRO-23
    rung: "R4"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [activite, calcul, misconception_driven]
    stem: |
      Un échantillon contient $N_0 = 3{,}0\times10^{18}$ noyaux radioactifs d'un
      isotope de demi-vie $t_{1/2} = 6{,}0$ jours. Quelle est son activité
      initiale $A_0$ ? (On rappelle $1\ \text{jour} = 86\,400\ \text{s}$.)
    type: mcq
    choices:
      - id: A
        text: |
          $A_0 = N_0 = 3{,}0\times10^{18}$ Bq : l'activité, c'est le nombre de
          noyaux présents dans l'échantillon.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-activite-nombre-noyaux
        feedback: >
          L'activité est le nombre de désintégrations PAR SECONDE (le Bq), pas le
          nombre de noyaux présents. Les deux sont reliés par $A = \lambda N$,
          avec $N$ bien plus grand que $A$.
      - id: B
        text: |
          $A_0 = \lambda N_0 \approx 4{,}0\times10^{12}$ Bq, avec
          $\lambda = \dfrac{\ln 2}{t_{1/2}}$ convertie en $\text{s}^{-1}$.
        correct: true
      - id: C
        text: |
          $A_0 = \dfrac{N_0}{t_{1/2}} = 5{,}0\times10^{17}$ Bq, en prenant la
          demi-vie comme constante radioactive.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-demi-vie-constante-lambda
        feedback: >
          La constante radioactive est $\lambda = \dfrac{\ln 2}{t_{1/2}}$ (avec le
          facteur $\ln 2$, et convertie en $\text{s}^{-1}$), pas
          $\dfrac{1}{t_{1/2}}$. Confondre $t_{1/2}$ et la constante de
          désintégration fausse tout le calcul.
      - id: D
        text: |
          Impossible de calculer $A_0$ sans connaître la température de
          l'échantillon, dont dépend son activité.
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          $\lambda$ est intrinsèque au noyau : $A_0 = \lambda N_0$ se calcule
          entièrement avec $t_{1/2}$ et $N_0$, sans aucune donnée extérieure.
    correct_feedback: >
      $\lambda = \dfrac{\ln 2}{6{,}0\times86\,400} \approx 1{,}3\times10^{-6}\ \text{s}^{-1}$,
      donc $A_0 = \lambda N_0 \approx 4{,}0\times10^{12}$ Bq.
    solution: |
      L'activité et le nombre de noyaux sont reliés par $A = \lambda N$. À
      $t = 0$ : $A_0 = \lambda N_0$. Il faut $\lambda$ en $\text{s}^{-1}$ car le
      becquerel est une désintégration par seconde :
      $\lambda = \dfrac{\ln 2}{6{,}0\times86\,400} \approx 1{,}3\times10^{-6}\ \text{s}^{-1}$.
      Donc $A_0 = 1{,}3\times10^{-6}\times3{,}0\times10^{18} \approx 4{,}0\times10^{12}$ Bq.

  - id: DECRO-24
    rung: "R4"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: [demi_vie, misconception_driven]
    stem: |
      Un isotope radioactif a une constante radioactive
      $\lambda = 2{,}0\times10^{-2}\ \text{an}^{-1}$. Quelle est sa demi-vie
      $t_{1/2}$ ?
    type: mcq
    choices:
      - id: A
        text: |
          $t_{1/2} = \lambda = 2{,}0\times10^{-2}\ \text{an}$ : la demi-vie et la
          constante radioactive sont une seule et même grandeur.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-demi-vie-constante-lambda
        feedback: >
          Ce sont deux grandeurs différentes, même pas de mêmes unités
          ($\text{an}$ contre $\text{an}^{-1}$). Elles sont reliées par
          $t_{1/2} = \dfrac{\ln 2}{\lambda}$, pas par une égalité.
      - id: B
        text: |
          $t_{1/2} = \dfrac{1}{\lambda} = 50$ ans : la demi-vie est simplement
          l'inverse de $\lambda$.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-demi-vie-constante-lambda
        feedback: >
          $\dfrac{1}{\lambda}$ est la constante de temps $\tau$, pas la demi-vie.
          Il manque le facteur $\ln 2$ : $t_{1/2} = \tau\ln 2 \approx 0{,}693\,\tau$,
          donc plus courte que $\tau$.
      - id: C
        text: |
          $t_{1/2} = \dfrac{\ln 2}{\lambda} = \dfrac{0{,}693}{2{,}0\times10^{-2}} \approx 35$ ans : le facteur $\ln 2$ vient de la division par deux.
        correct: true
      - id: D
        text: |
          $t_{1/2}$ n'est pas fixe : elle dépend de la température et de la
          pression subies par l'échantillon.
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          Comme $\lambda$, la demi-vie $t_{1/2} = \dfrac{\ln 2}{\lambda}$ est
          intrinsèque à l'isotope : invariable, quelles que soient la température
          et la pression.
    correct_feedback: >
      $t_{1/2} = \dfrac{\ln 2}{\lambda} = \dfrac{0{,}693}{2{,}0\times10^{-2}}
      \approx 35$ ans — ni $\lambda$ elle-même, ni $\dfrac{1}{\lambda} = 50$ ans.
    solution: |
      La demi-vie et la constante radioactive sont reliées par
      $t_{1/2} = \dfrac{\ln 2}{\lambda}$ (chapitre 5). Ici :
      $t_{1/2} = \dfrac{0{,}693}{2{,}0\times10^{-2}} \approx 35$ ans.
      À ne pas confondre avec la constante de temps
      $\tau = \dfrac{1}{\lambda} = 50$ ans : $t_{1/2} = \tau\ln 2$, donc plus
      courte que $\tau$.

  - id: DECRO-25
    rung: "R4"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [activite, calcul, misconception_driven]
    stem: |
      On veut trouver le nombre $N_0$ de noyaux présents à $t = 0$ dans un
      échantillon dont on connaît l'activité initiale $A_0$ (en Bq) et la
      demi-vie $t_{1/2}$. Quelle démarche est correcte ?
    type: mcq
    choices:
      - id: A
        text: |
          $N_0 = \dfrac{A_0}{\lambda}$, avec $\lambda = \dfrac{\ln 2}{t_{1/2}}$
          convertie en $\text{s}^{-1}$ (le becquerel étant une désintégration par
          seconde).
        correct: true
      - id: B
        text: |
          $N_0 = A_0$ : l'activité en becquerels donne directement le nombre de
          noyaux présents.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-activite-nombre-noyaux
        feedback: >
          $A_0$ est un nombre de désintégrations par seconde, pas un nombre de
          noyaux. On passe de l'un à l'autre par $A = \lambda N$, donc
          $N_0 = A_0/\lambda$, jamais $N_0 = A_0$.
      - id: C
        text: |
          $N_0 = A_0 \times t_{1/2}$, en utilisant la demi-vie comme constante
          radioactive.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-demi-vie-constante-lambda
        feedback: >
          La constante qui relie $A$ et $N$ est $\lambda = \dfrac{\ln 2}{t_{1/2}}$,
          pas $t_{1/2}$ elle-même. Utiliser la demi-vie à la place de $\lambda$
          confond deux grandeurs distinctes.
      - id: D
        text: |
          $N_0$ est le nombre de désintégrations par seconde : c'est $A_0$
          exprimée dans une autre unité.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-activite-nombre-noyaux
        feedback: >
          Non : le nombre de désintégrations par seconde EST l'activité $A_0$, ce
          n'est pas le nombre $N_0$ de noyaux présents. $N_0 = A_0/\lambda$ est en
          général bien plus grand que $A_0$.
    correct_feedback: >
      $A = \lambda N$ à chaque instant, donc à $t = 0$ : $N_0 = A_0/\lambda$, avec
      $\lambda = \dfrac{\ln 2}{t_{1/2}}$ en $\text{s}^{-1}$.
    solution: |
      L'activité et le nombre de noyaux sont liés par $A = \lambda N$. À
      $t = 0$ : $A_0 = \lambda N_0 \Rightarrow N_0 = \dfrac{A_0}{\lambda}$. Comme
      $A_0$ est en Bq (désintégrations par seconde), $\lambda$ doit être en
      $\text{s}^{-1}$, obtenue par $\lambda = \dfrac{\ln 2}{t_{1/2}}$ après
      conversion de $t_{1/2}$ en secondes.

  - id: DECRO-26
    rung: "R4"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: [activite, misconception_driven]
    stem: |
      Deux échantillons du même isotope radioactif contiennent, à un instant
      donné, $N_1$ et $N_2 = 2N_1$ noyaux non encore désintégrés. Que peut-on
      dire de leurs activités $A_1$ et $A_2$ à cet instant ?
    type: mcq
    choices:
      - id: A
        text: |
          $A_2 = 2A_1$ : pour un même isotope (même $\lambda$), l'activité
          $A = \lambda N$ est proportionnelle au nombre de noyaux présents.
        correct: true
      - id: B
        text: |
          $A_1 = A_2$ : l'activité ne dépend que de l'isotope (de $\lambda$), pas
          du nombre de noyaux présents.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-activite-nombre-noyaux
        feedback: >
          $A = \lambda N$ dépend bel et bien de $N$ : à même $\lambda$, deux fois
          plus de noyaux donnent deux fois plus de désintégrations par seconde.
          Ce n'est pas $\lambda$ seul qui fixe l'activité, c'est $\lambda N$.
      - id: C
        text: |
          On ne peut pas comparer sans connaître la demi-vie de l'isotope, car
          c'est elle, et non $\lambda$, qui fixe l'activité.
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-demi-vie-constante-lambda
        feedback: >
          La demi-vie et $\lambda$ portent la même information
          ($t_{1/2} = \ln 2/\lambda$) ; ici $\lambda$ est le même pour les deux
          échantillons (même isotope), donc seule la différence de $N$ compte :
          $A = \lambda N$.
      - id: D
        text: |
          Cela dépend des conditions extérieures (température) propres à chaque
          échantillon.
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          $\lambda$ est intrinsèque à l'isotope, identique dans les deux
          échantillons : la comparaison se fait par $A = \lambda N$, sans aucune
          condition extérieure.
    correct_feedback: >
      $A = \lambda N$ avec le même $\lambda$ : $A_2 = \lambda N_2 = \lambda(2N_1)
      = 2A_1$. L'activité est proportionnelle au nombre de noyaux présents.
    solution: |
      À un instant donné, $A = \lambda N$. Les deux échantillons sont du même
      isotope, donc partagent la même constante $\lambda$. Avec $N_2 = 2N_1$ :
      $A_2 = \lambda N_2 = 2\lambda N_1 = 2A_1$. L'activité suit le nombre de
      noyaux présents, à $\lambda$ fixé.

  # ══════════════════════════════════════════════════════════════
  # R5 — principe de la datation
