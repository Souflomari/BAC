  # R5 — principe de la datation
  # ══════════════════════════════════════════════════════════════

  - id: DECRO-16
    rung: "R5"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [datation, demi_vie, misconception_driven]
    stem: >
      Un fossile contient un isotope de demi-vie $t_{1/2}=1{,}3\times10^9$
      ans. On mesure qu'il reste $1/16$ de la quantité initiale de cet
      isotope. Quel est l'âge du fossile ?
    type: mcq
    choices:
      - id: A
        text: "$t=16\\times t_{1/2}=2{,}08\\times10^{10}$ ans, car on compte directement le dénominateur de la fraction comme un nombre de demi-vies."
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          $1/16$ signifie 4 demi-vies écoulées ($2^4=16$), pas 16 : chaque
          demi-vie divise par 2, ce n'est pas le dénominateur lui-même qui
          compte les demi-vies.
      - id: B
        text: "On ne peut pas dater précisément : un échantillon réduit à 1/16 de sa quantité initiale est déjà considéré comme totalement désintégré."
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          $1/16$ reste une quantité mesurable, non nulle : la datation
          reste parfaitement calculable, elle donne $4\times t_{1/2}$.
      - id: C
        text: "$t=4\\times t_{1/2}=5{,}2\\times10^9$ ans, car $1/16=(1/2)^4$."
        correct: true
      - id: D
        text: "$t=\\ln(16)\\approx2{,}77$ ans, sans diviser par λ."
        correct: false
        misconception: mc.physics.decroissance_radioactive.oubli-lambda-dans-exponentielle
        feedback: >
          $\ln(16)$ est sans dimension : il faut le diviser par λ (ou le
          multiplier par $t_{1/2}/\ln2$) pour obtenir une durée en années.
    correct_feedback: >
      $1/16=(1/2)^4$ : 4 demi-vies se sont écoulées, donc
      $t=4\times1{,}3\times10^9=5{,}2\times10^9$ ans.
    solution: |
      $N(t)/N_0=1/16=(1/2)^4$, donc 4 demi-vies se sont écoulées :
      $t=4\times t_{1/2}=4\times1{,}3\times10^9=5{,}2\times10^9$ ans.
      Vérification par la formule générale :
      $t=\frac{1}{\lambda}\ln(N_0/N(t))=\frac{t_{1/2}}{\ln2}\ln(16)$, qui
      redonne le même résultat.

  - id: DECRO-17
    rung: "R5"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [datation, sans_memoire, misconception_driven]
    stem: >
      Pourquoi peut-on utiliser la loi $N(t)=N_0e^{-\lambda t}$ pour dater
      un échantillon vieux de plusieurs milliards d'années, alors que λ a
      été mesuré en laboratoire sur des échantillons observés seulement
      quelques années ?
    type: mcq
    choices:
      - id: A
        text: "Parce que λ est une propriété intrinsèque de l'isotope, indépendante de l'âge du noyau et des conditions extérieures : elle est restée strictement la même pendant tout le temps écoulé, qu'il s'agisse de quelques secondes ou de milliards d'années."
        correct: true
      - id: B
        text: "On ne peut pas vraiment l'utiliser de façon fiable : λ a probablement varié avec les conditions extérieures (température, pression) sur d'aussi longues échelles de temps géologiques."
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          λ ne dépend d'aucune condition extérieure, à aucune échelle de
          temps : c'est précisément ce qui rend la datation fiable sur des
          durées géologiques.
      - id: C
        text: "On le peut, mais il faut corriger le résultat car les noyaux les plus anciens de l'échantillon ont une probabilité de désintégration plus élevée que ceux mesurés en laboratoire."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-vieillit
        feedback: >
          Aucune correction n'est nécessaire : le caractère sans mémoire
          garantit que λ est le même pour un noyau jeune ou millénaire.
      - id: D
        text: "On le peut seulement pour les noyaux « récents » de l'échantillon, les plus anciens ayant perdu leur caractère radioactif avec le temps."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-fraicheur-instable
        feedback: >
          Un noyau ne perd pas son caractère radioactif avec le temps :
          tant qu'il n'a pas désintégré, il a exactement la même
          probabilité λ de le faire, quel que soit son âge.
    correct_feedback: >
      C'est le caractère sans mémoire qui rend la datation possible : λ,
      la même hier, aujourd'hui, et dans un milliard d'années.
    solution: |
      La validité de toute datation radioactive repose entièrement sur le
      fait que λ est une constante caractéristique de l'isotope,
      invariable dans le temps et indépendante des conditions extérieures
      — sans cette propriété, la formule
      $t=\frac{1}{\lambda}\ln(N_0/N(t))$ n'aurait aucun sens sur des
      échelles de temps géologiques.

  - id: DECRO-18
    rung: "R5"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: [datation, calcul, misconception_driven]
    stem: >
      Un échantillon de bois montre qu'il reste 60 % du carbone 14 initial
      ($N(t)/N_0=0{,}60$). Avec $\lambda\approx1{,}21\times10^{-4}\
      \text{an}^{-1}$, quel est l'âge de cet échantillon ?
    type: mcq
    choices:
      - id: A
        text: "$t=\\ln(1/0{,}60)\\approx0{,}51$ an, en utilisant le logarithme directement sans diviser par λ."
        correct: false
        misconception: mc.physics.decroissance_radioactive.oubli-lambda-dans-exponentielle
        feedback: >
          $\ln(1/0{,}60)$ est sans dimension : il faut le diviser par λ
          pour obtenir une durée en années, sinon le résultat n'a pas de
          sens physique.
      - id: B
        text: "On ne peut pas conclure sans connaître les conditions climatiques du site, qui influencent λ du carbone 14."
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          λ du carbone 14 est fixe, indépendant du climat : la formule
          s'applique directement avec la valeur donnée.
      - id: C
        text: "Le résultat obtenu par la formule sous-estime l'âge réel, car les noyaux de carbone 14 les plus anciens de l'échantillon se désintègrent plus vite que ne le prévoit λ constant."
        correct: false
        misconception: mc.physics.decroissance_radioactive.noyau-vieillit
        feedback: >
          λ constant s'applique identiquement à tous les noyaux, anciens
          ou récents : aucune correction d'âge n'est nécessaire.
      - id: D
        text: '$t=\dfrac{1}{\lambda}\ln(1/0{,}60)\approx4220$ ans.'
        correct: true
    correct_feedback: >
      $\ln(1/0{,}60)\approx0{,}511$, donc
      $t=0{,}511/1{,}21\times10^{-4}\approx4220$ ans.
    solution: |
      $$t=\frac{1}{\lambda}\ln\!\left(\frac{N_0}{N(t)}\right)=\frac{\ln(1/0{,}60)}{1{,}21\times10^{-4}}\approx\frac{0{,}511}{1{,}21\times10^{-4}}\approx4220\ \text{ans}$$

