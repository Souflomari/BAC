  # Ajoutés le 2026-09-05 : huit familles sous le plancher de 3 items du banc,
  # cinq à un item et trois à deux — le vocabulaire du noyau (isotopes,
  # isobares, élément, stabilité) et les trois façons de prêter au rayonnement
  # $\gamma$ un effet qu'il n'a pas. Cinq items, treize places.
  - id: DECRO-27
    rung: "R1"
    difficulty_level: 2
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.isotope-confond-isobare
    stem: >
      Les noyaux $^{14}_{6}C$ et $^{12}_{6}C$ sont-ils des isotopes, et
      s'agit-il du même élément chimique ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui aux deux : ils ont le même $Z = 6$, donc le même élément, et des
          $A$ différents, donc des isotopes
        correct: true
      - id: B
        text: >-
          Non : des isotopes ont le même nombre de nucléons $A$, réparti
          autrement entre protons et neutrons — ce qui n'est pas le cas ici
        correct: false
        misconception: mc.physics.decroissance_radioactive.isotope-confond-isobare
        feedback: >
          La définition décrite est celle des ISOBARES : même $A$, $Z$
          différents. Les isotopes, eux, partagent le nombre de PROTONS $Z$ et
          diffèrent par $A$. Le repère qui les sépare : c'est $Z$ qui fait
          l'élément, donc seuls les isotopes sont « le même élément ».
      - id: C
        text: >-
          Non : ce sont deux éléments chimiques différents, puisque leurs masses
          diffèrent
        correct: false
        misconception: mc.physics.decroissance_radioactive.element-defini-par-masse
        feedback: >
          L'identité chimique est fixée par $Z$, le nombre de protons — donc par
          le nombre d'électrons de l'atome neutre, donc par ses propriétés
          chimiques. Le carbone 14 et le carbone 12 réagissent exactement de la
          même façon ; c'est ce qui rend la datation possible, l'organisme
          n'ayant aucun moyen de les distinguer.
      - id: D
        text: >-
          Oui pour l'élément, mais ce ne sont pas des isotopes : des isotopes
          partagent le nombre de neutrons, pas celui de protons
        correct: false
        misconception: mc.physics.decroissance_radioactive.isotope-confond-neutrons-protons
        feedback: >
          Les rôles de $Z$ et $N$ sont inversés. Des isotopes partagent le
          nombre de PROTONS ($Z$) et diffèrent par le nombre de neutrons. Ici
          $^{14}_{6}C$ a $8$ neutrons et $^{12}_{6}C$ en a $6$ : ils diffèrent
          bien par $N$, et se ressemblent par $Z$ — la définition même.
    correct_feedback: >
      Même $Z = 6$ : c'est le même élément, le carbone. Des $A$ différents,
      donc des nombres de neutrons différents ($8$ et $6$) : ce sont des
      isotopes. C'est $Z$ qui fait l'élément, $A$ qui fait l'isotope.
    solution: |
      **Les deux grandeurs.**
      $$
      Z = \text{nombre de protons} \qquad A = \text{nombre de nucléons}
      \qquad N = A - Z
      $$

      **Les définitions.**
      - *Isotopes* : même $Z$, $A$ différents. Même élément, masses différentes.
      - *Isobares* : même $A$, $Z$ différents. Éléments différents, même masse.

      **Ici.** $^{14}_{6}C$ : $Z = 6$, $N = 8$. $^{12}_{6}C$ : $Z = 6$,
      $N = 6$. Même $Z$ : isotopes du carbone.

      **Pourquoi $Z$ fait l'élément.** Le nombre de protons fixe le nombre
      d'électrons de l'atome neutre, donc son comportement chimique. Un
      organisme vivant absorbe indifféremment le carbone 12 et le carbone 14 —
      d'où la datation.

  - id: DECRO-28
    rung: "R1"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.instabilite-necessite-grand-noyau
    stem: >
      Le noyau de tritium $^{3}_{1}H$ ne compte que trois nucléons, et il est
      pourtant radioactif. Comment l'expliquer ?
    type: mcq
    choices:
      - id: A
        text: >-
          La stabilité dépend du rapport $N/Z$, pas de la taille : avec un
          proton pour deux neutrons, le tritium est trop riche en neutrons
        correct: true
      - id: B
        text: >-
          C'est impossible : un noyau aussi petit est forcément stable, seuls
          les noyaux lourds sont radioactifs
        correct: false
        misconception: mc.physics.decroissance_radioactive.instabilite-necessite-grand-noyau
        feedback: >
          La taille joue au-delà de $Z = 83$, où plus aucun noyau n'est stable —
          mais elle ne suffit pas à décider en deçà. Ce qui compte est le
          rapport $N/Z$ : le tritium ($N/Z = 2$) est bien trop riche en
          neutrons, alors que l'hélium 3, de même $A$, est parfaitement stable.
      - id: C
        text: >-
          C'est le nombre de protons qui décide de la stabilité : avec un seul
          proton, le noyau est trop peu lié pour tenir
        correct: false
        misconception: mc.physics.decroissance_radioactive.stabilite-ne-depend-que-de-Z
        feedback: >
          $Z$ seul ne décide de rien : $^{1}_{1}H$ et $^{2}_{1}H$ ont aussi un
          seul proton et sont parfaitement stables. Ce qui distingue le tritium
          de ses deux isotopes, c'est son nombre de NEUTRONS — donc le rapport
          $N/Z$, et non $Z$ pris isolément.
      - id: D
        text: >-
          Parce que sa masse diffère de celle de l'hydrogène ordinaire, ce qui
          en fait un élément chimique différent, aux propriétés instables
        correct: false
        misconception: mc.physics.decroissance_radioactive.element-defini-par-masse
        feedback: >
          Le tritium EST de l'hydrogène : même $Z = 1$, donc mêmes propriétés
          chimiques. Sa masse plus grande ne change pas l'élément — elle change
          l'isotope. Et l'instabilité est une propriété du NOYAU, sans rapport
          avec la chimie de l'atome.
    correct_feedback: >
      La stabilité se lit dans le rapport $N/Z$. Le tritium a $1$ proton pour
      $2$ neutrons : très au-dessus de la ligne de stabilité, qui vaut environ
      $N/Z = 1$ pour les noyaux légers. Il se désintègre en $\beta^{-}$ pour
      convertir un neutron en proton.
    solution: |
      **Ce que la taille explique.** Au-delà de $Z = 83$, la répulsion
      électrostatique entre protons l'emporte : aucun noyau n'est stable. C'est
      un critère de borne supérieure, pas un critère général.

      **Ce que le rapport $N/Z$ explique.** Pour les noyaux légers, la stabilité
      demande $N \approx Z$. Le tritium a $N/Z = 2$ : trop de neutrons.

      **La comparaison qui tranche.**
      $$
      ^{1}_{1}H \ (N/Z = 0) \ \text{stable} \qquad
      ^{2}_{1}H \ (N/Z = 1) \ \text{stable} \qquad
      ^{3}_{1}H \ (N/Z = 2) \ \text{radioactif}
      $$
      Même $Z$, même petitesse, comportements opposés : ni $Z$ ni $A$ ne
      suffisent.

      **La désintégration.** $^{3}_{1}H \rightarrow \, ^{3}_{2}He + \,
      ^{0}_{-1}e$ : un neutron devient proton, le rapport $N/Z$ redescend.

  - id: DECRO-29
    rung: "R1"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.instabilite-necessite-grand-noyau
    stem: >
      Parmi ces quatre affirmations sur la stabilité des noyaux, laquelle est
      correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Au-delà de $Z = 83$, aucun noyau n'est stable ; en deçà, c'est le
          rapport $N/Z$ qui décide
        correct: true
      - id: B
        text: >-
          Plus un noyau contient de nucléons, plus il est instable : la
          radioactivité est une affaire de taille
        correct: false
        misconception: mc.physics.decroissance_radioactive.instabilite-necessite-grand-noyau
        feedback: >
          La règle échoue dans les deux sens. Le tritium ($A = 3$) est
          radioactif, le plomb $^{208}_{82}Pb$ ($A = 208$) est stable. La taille
          fixe une borne au-delà de laquelle plus rien ne tient, elle ne classe
          pas les noyaux en deçà.
      - id: C
        text: >-
          Seul $Z$ décide : à nombre de protons égal, tous les noyaux ont la même
          stabilité
        correct: false
        misconception: mc.physics.decroissance_radioactive.stabilite-ne-depend-que-de-Z
        feedback: >
          Les isotopes d'un même élément ont tous le même $Z$ et des stabilités
          très différentes : le carbone 12 est stable, le carbone 14 non. C'est
          bien le nombre de NEUTRONS qui les sépare, donc le rapport $N/Z$.
      - id: D
        text: >-
          Deux noyaux de même nombre de nucléons $A$ sont des isotopes, et ont
          donc la même stabilité
        correct: false
        misconception: mc.physics.decroissance_radioactive.isotope-confond-isobare
        feedback: >
          Deux noyaux de même $A$ sont des ISOBARES, pas des isotopes — les
          isotopes partagent $Z$. Et les isobares n'ont aucune raison d'avoir la
          même stabilité : $^{3}_{1}H$ est radioactif tandis que $^{3}_{2}He$,
          de même $A$, est stable.
    correct_feedback: >
      Deux régimes. Au-delà de $Z = 83$, la répulsion entre protons l'emporte :
      plus aucun noyau n'est stable. En deçà, c'est le rapport $N/Z$ qui décide,
      et il doit rester proche de la vallée de stabilité.
    solution: |
      **La vallée de stabilité.** En portant $N$ en fonction de $Z$, les noyaux
      stables forment une bande étroite : $N \approx Z$ pour les légers,
      $N/Z \approx 1{,}5$ pour les lourds. S'en écarter, c'est être radioactif.

      **Les deux façons de s'en écarter.**
      - Trop de neutrons ($N/Z$ trop grand) → désintégration $\beta^{-}$.
      - Trop de protons ($N/Z$ trop petit) → désintégration $\beta^{+}$.
      - Noyau trop lourd ($Z > 83$) → désintégration $\alpha$.

      **Les deux contre-exemples à retenir.** $^{3}_{1}H$ : minuscule et
      radioactif. $^{208}_{82}Pb$ : très lourd et stable. Ni $A$ ni $Z$ pris
      seuls ne prédisent quoi que ce soit.

  - id: DECRO-30
    rung: "R2"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.gamma-change-Z-comme-beta
    stem: >
      Un noyau de cobalt 60 se désintègre en nickel 60, puis le noyau de nickel
      formé, resté excité, émet un rayonnement $\gamma$. Que devient-il après
      cette émission ?
    type: mcq
    choices:
      - id: A
        text: >-
          Il reste du nickel 60 : ni $Z$ ni $A$ ne changent, seule l'énergie du
          noyau diminue : un photon n'a pas de masse
        correct: true
      - id: B
        text: >-
          Il devient du cuivre 60 : l'émission $\gamma$ augmente $Z$ d'une unité,
          comme une désintégration $\beta^{-}$
        correct: false
        misconception: mc.physics.decroissance_radioactive.gamma-change-Z-comme-beta
        feedback: >
          Le rayonnement $\gamma$ est un photon : il ne porte ni charge ni
          nucléon, donc $Z$ ne peut pas changer. Ce qui modifie $Z$, c'est
          l'émission d'une particule chargée — un électron ($\beta^{-}$) ou un
          positon ($\beta^{+}$). Le $\gamma$ n'est pas une désintégration, c'est
          une désexcitation.
      - id: C
        text: >-
          Il devient du nickel 56 : l'émission $\gamma$ fait perdre quatre
          nucléons, comme une désintégration $\alpha$
        correct: false
        misconception: mc.physics.decroissance_radioactive.gamma-change-A-comme-alpha
        feedback: >
          Perdre quatre nucléons, c'est émettre un noyau d'hélium — une
          désintégration $\alpha$, qui est une particule de matière. Le $\gamma$
          est un photon, sans masse ni nucléon : $A$ reste rigoureusement
          inchangé.
      - id: D
        text: >-
          Il devient un autre isotope du nickel : le $\gamma$ emporte un neutron,
          donc $A$ diminue tandis que $Z$ reste le même
        correct: false
        misconception: mc.physics.decroissance_radioactive.gamma-change-isotope
        feedback: >
          Le $\gamma$ n'emporte aucune particule de matière : ni proton, ni
          neutron. La composition du noyau — $Z$ ET $N$ — est exactement la même
          avant et après. Ce qui a changé est son niveau d'ÉNERGIE : il passe
          d'un état excité à son état fondamental.
    correct_feedback: >
      Le noyau reste $^{60}_{28}Ni$. Le rayonnement $\gamma$ est un photon très
      énergétique, sans charge ni masse : il emporte de l'énergie, jamais des
      nucléons. Ce n'est pas une désintégration mais une DÉSEXCITATION.
    solution: |
      **L'écriture.**
      $$^{60}_{28}Ni^{*} \rightarrow \, ^{60}_{28}Ni + \gamma$$
      L'astérisque marque l'état excité. $Z$ et $A$ sont identiques des deux
      côtés — les lois de conservation de Soddy sont trivialement satisfaites.

      **Le contraste avec les trois désintégrations.**

      | émission | ce qui part | effet sur $Z$ | effet sur $A$ |
      |---|---|---|---|
      | $\alpha$ | noyau d'hélium | $-2$ | $-4$ |
      | $\beta^{-}$ | électron | $+1$ | $0$ |
      | $\beta^{+}$ | positon | $-1$ | $0$ |
      | $\gamma$ | photon | $0$ | $0$ |

      **La règle en une phrase.** Le $\gamma$ accompagne une désintégration ; il
      n'en est jamais une. Le noyau qui l'émet est déjà celui qu'il restera.

  - id: DECRO-31
    rung: "R2"
    difficulty_level: 4
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.gamma-change-isotope
    stem: >
      Un élève écrit la désexcitation d'un noyau excité de radium :
      $^{226}_{88}Ra^{*} \rightarrow \, ^{225}_{87}Fr + \gamma$. Combien
      d'erreurs cette écriture contient-elle ?
    type: mcq
    choices:
      - id: A
        text: >-
          Deux : ni $Z$ ni $A$ ne doivent changer lors d'une émission $\gamma$ —
          le noyau reste $^{226}_{88}Ra$
        correct: true
      - id: B
        text: >-
          Une seule : $A$ ne devrait pas changer, mais la baisse de $Z$ est
          normale, le $\gamma$ agissant comme une désintégration $\beta$
        correct: false
        misconception: mc.physics.decroissance_radioactive.gamma-change-Z-comme-beta
        feedback: >
          Un photon n'emporte aucune charge : $Z$ ne peut pas bouger. Et une
          $\beta$ ferait d'ailleurs MONTER $Z$ d'une unité ($\beta^{-}$), pas
          descendre. Deux façons de se tromper dans la même réponse.
      - id: C
        text: >-
          Une seule : $Z$ ne devrait pas changer, mais la perte d'un nucléon est
          normale, le $\gamma$ emportant un neutron
        correct: false
        misconception: mc.physics.decroissance_radioactive.gamma-change-isotope
        feedback: >
          Le $\gamma$ n'emporte pas de neutron — il n'emporte aucune matière. Le
          noyau conserve exactement les mêmes $88$ protons et $138$ neutrons ; il
          perd seulement de l'énergie. L'isotope obtenu est le MÊME que celui de
          départ.
      - id: D
        text: >-
          Aucune, à condition d'écrire $^{222}_{86}Rn$ à droite : le $\gamma$ se
          comporte comme une désintégration $\alpha$
        correct: false
        misconception: mc.physics.decroissance_radioactive.gamma-change-A-comme-alpha
        feedback: >
          $^{226}_{88}Ra \rightarrow \, ^{222}_{86}Rn$ est bien une
          désintégration $\alpha$ — mais elle émet une particule $\alpha$, pas un
          $\gamma$. Confondre les deux revient à faire perdre quatre nucléons à
          un noyau par l'émission d'un photon sans masse.
    correct_feedback: >
      Deux erreurs : $A$ passe de $226$ à $225$ et $Z$ de $88$ à $87$, alors
      qu'une émission $\gamma$ ne change ni l'un ni l'autre. L'écriture correcte
      est $^{226}_{88}Ra^{*} \rightarrow \, ^{226}_{88}Ra + \gamma$.
    solution: |
      **Le contrôle par les lois de Soddy.** Conservation du nombre de charge et
      du nombre de nucléons :
      $$
      88 = 87 + 0 \ ? \quad \text{non} \qquad
      226 = 225 + 0 \ ? \quad \text{non}
      $$
      Le photon $\gamma$ apporte $0$ dans les deux colonnes, donc les deux
      égalités imposent $Z$ et $A$ inchangés.

      **L'écriture correcte.**
      $$^{226}_{88}Ra^{*} \rightarrow \, ^{226}_{88}Ra + \gamma$$

      **Le réflexe transférable.** Toute équation nucléaire se vérifie en une
      ligne : la somme des $Z$ et celle des $A$ doivent se conserver. Ce contrôle
      attrape à lui seul les trois erreurs classiques sur le $\gamma$.

  # Ajoutés le 2026-09-24, sur la spec pc-decroissance-radioactive-scene-noyaux
  # §8.3–§8.4 : le vingtième modèle (loi-population-vs-noyau, deux items
  # qualitatifs) et le geste « lire un document » (un item de lecture de
  # tableau), qui rejoint ce même modèle par co-comptage de cases. Quatre
  # items, DECRO-32 à DECRO-35.
  - id: DECRO-32
    rung: "R3"
    difficulty_level: 2
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
    stem: >
      Un échantillon contient exactement 100 noyaux radioactifs d'un isotope
      de demi-vie $t_{1/2} = 2{,}0$ heures. Deux heures plus tard, on compte
      les noyaux qui n'ont pas encore désintégré, puis on recommence
      l'expérience à l'identique avec un second échantillon de 100 noyaux du
      même isotope. Que peut-on affirmer sur les deux comptages ?
    type: mcq
    choices:
      - id: A
        text: >-
          Les deux comptages donneront des nombres voisins de 50, mais rien
          n'oblige qu'ils soient égaux entre eux ni égaux à 50
        correct: true
      - id: B
        text: >-
          Les deux donneront exactement 50 : c'est ce que dit la loi de
          décroissance
        correct: false
        misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
        feedback: >
          Aucun noyau ne « sait » qu'il doit partir pour que le compte tombe
          rond ; la loi décrit ce que fait une population, et sur cent
          noyaux le compte varie d'une expérience à l'autre.
      - id: C
        text: >-
          Un résultat comme 5 ou 95 est exactement aussi probable qu'un
          résultat proche de 50, puisque chaque noyau tire son sort
          indépendamment
        correct: false
        misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
        feedback: >
          Le hasard de chaque noyau produit au contraire la régularité de
          l'ensemble : les comptages se placent dans le voisinage de 50, et
          un résultat comme 5 ou 95 ne se rencontre pas.
      - id: D
        text: >-
          Les deux donneront exactement 50 si les deux échantillons sont
          restés à la même température
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          $\lambda$ ne dépend d'aucune condition extérieure ; ce n'est pas
          la température qui empêche de trouver 50 tout rond, c'est le
          petit nombre de noyaux.
    correct_feedback: >
      La loi prévoit le comportement d'une population, pas le sort d'un
      noyau : sur cent noyaux, elle situe le résultat sans le fixer.
    solution: |
      La loi prévoit le comportement d'une **population**, pas le sort d'un
      noyau. Sur cent noyaux, elle situe le résultat autour de 50 sans le
      fixer ; sur un échantillon réel, qui en compte des milliers de
      milliards, l'écart devient invisible et on calcule avec la loi comme
      avec une égalité.

  - id: DECRO-33
    rung: "R4"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
    stem: >
      On prépare deux échantillons du même isotope au même instant : le
      premier contient une centaine de noyaux, le second des milliers de
      milliards. Pour chacun, on compare le nombre restant après une
      demi-vie à ce que prévoit la loi de décroissance. Lequel des deux
      suivra la prévision de plus près, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: >-
          Les deux la suivront exactement : la forme de la loi ne dépend
          pas du nombre de noyaux étudiés
        correct: false
        misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
        feedback: >
          La forme de la loi ne dépend pas du nombre, mais la fidélité avec
          laquelle un échantillon la suit, si : c'est toute la différence
          entre une loi de population et une horloge.
      - id: B
        text: >-
          Le grand échantillon : la loi décrit une population, et l'écart à
          la prévision diminue quand elle grandit
        correct: true
      - id: C
        text: >-
          Le petit échantillon : avec moins de noyaux, il y a moins de
          sources d'erreur possibles à corriger
        correct: false
        misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
        feedback: >
          Il n'y a pas d'« erreur » ici ; il y a du hasard, et le hasard se
          compense d'autant mieux que les tirages sont nombreux.
      - id: D
        text: >-
          Celui qui aura été conservé au frais : ici, c'est la température
          qui décide, pas la taille
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          Rien de ce qui entoure le noyau ne change $\lambda$ ; la seule
          grandeur qui décide ici est le nombre de noyaux.
    correct_feedback: >
      Le grand échantillon suit la prévision de plus près : plus une
      population est nombreuse, moins le résultat observé s'écarte de ce
      que prévoit la loi.
    solution: |
      La loi de décroissance décrit une population, et elle la décrit
      d'autant mieux que la population est grande. Sur le petit
      échantillon, l'écart au calcul se voit dès le premier comptage ; sur
      le grand, il devient invisible. La forme de la loi ne change pas avec
      le nombre de noyaux — c'est la fidélité de l'échantillon à cette
      forme qui change.

  - id: DECRO-34
    rung: "R4"
    difficulty_level: 2
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
    stem: |
      Le tableau donne l'activité $A$ d'un échantillon radioactif, mesurée
      tous les cinq jours. **Déterminer la demi-vie de cet isotope.**

      | $t$ (jour) | 0 | 5 | 10 | 15 | 20 | 25 | 30 |
      |---|---|---|---|---|---|---|---|
      | $A$ ($10^{5}$ Bq) | 8,00 | 5,66 | 4,00 | 2,83 | 2,00 | 1,41 | 1,00 |
    type: mcq
    choices:
      - id: A
        text: >-
          15 jours : une demi-vie est toujours la moitié de la durée mesurée
        correct: false
        misconception: mc.physics.decroissance_radioactive.demi-vie-egale-duree-de-vie-totale
        feedback: >
          La moitié dont il s'agit est une moitié d'activité, pas de
          durée ; la réponse changerait si l'on avait mesuré pendant 40
          jours, ce qui ne peut pas arriver à une propriété de l'isotope.
      - id: B
        text: >-
          20 jours : deux moitiés d'activité sont retirées entre $t=0$ et
          $t=20$ jours
        correct: false
        misconception: mc.physics.decroissance_radioactive.division-lineaire-demi-vies
        feedback: >
          Ces deux divisions par deux occupent deux demi-vies, pas une ; la
          première est achevée à $t = 10$ j, où l'activité vaut déjà 4,00.
      - id: C
        text: >-
          10 jours : quel que soit le départ, l'activité est divisée
          par deux en 10 jours
        correct: true
      - id: D
        text: >-
          14 jours : l'inverse de $\lambda$, tiré directement du tableau
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-demi-vie-constante-lambda
        feedback: >
          $1/\lambda$ est la constante de temps $\tau$, pas la demi-vie ;
          il manque le facteur $\ln 2$, et
          $t_{1/2} = \tau \ln 2 = 14{,}4 \times 0{,}693 = 10$ jours.
    correct_feedback: >
      Entre $t=0$ et $t=10$ j, l'activité passe de 8,00 à 4,00 ; entre
      $t=10$ et $t=20$ j, de 4,00 à 2,00 : la même durée à chaque division
      par deux, donc $t_{1/2}=10$ jours.
    solution: |
      On cherche deux dates où l'activité est dans le rapport 2, et on
      prend leur écart ; on vérifie sur une autre paire — le geste est le
      même que sur une courbe, où l'on part de l'ordonnée moitié.

      Vérification arithmétique : $t_{1/2} = 10$ jours, donc
      $A(t) = 8{,}00 \times 2^{-t/10}$ :
      $2^{-0{,}5} = 0{,}70711 \Rightarrow 5{,}66$ ;
      $2^{-1{,}5} = 0{,}35355 \Rightarrow 2{,}83$ ;
      $2^{-2{,}5} = 0{,}17678 \Rightarrow 1{,}41$ ;
      $2^{-3} = 0{,}125 \Rightarrow 1{,}00$ ✓.
      Et $\lambda = \ln 2/10 = 0{,}0693\ \text{j}^{-1}$,
      $\tau = 1/\lambda = 14{,}4$ j.

  - id: DECRO-35
    rung: "R4"
    difficulty_level: 3
    skill_code: decroissance_radioactive
    tags: []
    primary_misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
    stem: >
      On suit noyau par noyau, sur une grille de 36 cases, un échantillon
      de 36 noyaux d'un isotope de demi-vie $3{,}0$ heures. Au bout de
      $3{,}0$ heures, on compte 21 noyaux encore présents. Un élève
      déclare : « le comptage est faux, il devait en rester 18 ». Que
      répondre ?
    type: mcq
    choices:
      - id: A
        text: >-
          L'élève a raison : $36/2 = 18$, la loi de décroissance impose ce
          nombre exactement
        correct: false
        misconception: mc.physics.decroissance_radioactive.loi-population-vs-noyau
        feedback: >
          Aucun noyau ne se désintègre pour faire tomber le compte juste ;
          sur trente-six noyaux, l'écart à 18 se voit à chaque essai.
      - id: B
        text: >-
          L'élève a raison, sauf si l'échantillon a été chauffé pendant les
          trois heures
        correct: false
        misconception: mc.physics.decroissance_radioactive.lambda-depend-conditions-externes
        feedback: >
          La température ne change ni $\lambda$ ni la demi-vie ; ce qui
          explique l'écart, c'est le petit nombre de noyaux.
      - id: C
        text: >-
          Le comptage est faux pour une autre raison : on compte des
          désintégrations, pas des noyaux présents
        correct: false
        misconception: mc.physics.decroissance_radioactive.confond-activite-nombre-noyaux
        feedback: >
          C'est vrai d'un détecteur, qui compte des désintégrations par
          seconde ; ici on regarde les cases une par une, et 21 est bien un
          nombre de noyaux restants. Les deux grandeurs sont reliées par
          $A = \lambda N$.
      - id: D
        text: >-
          Le comptage n'a rien de faux : la loi situe le résultat autour de
          18 sans l'imposer
        correct: true
    correct_feedback: >
      Sur trente-six noyaux, l'écart à 18 est normal : c'est le grand
      nombre, pas trente-six, qui rend la loi exploitable comme une
      égalité.
    solution: |
      La loi de décroissance décrit une population ; sur trente-six noyaux
      le résultat se place autour de 18 sans y être forcé, et c'est le
      grand nombre qui, sur un échantillon réel, rend la loi utilisable
      comme une égalité.

