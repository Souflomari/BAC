  # ════════════════════════════════════════════════════════════════
  # CP-0  |  id: cp-r0-predict  |  placed IN R0 (the hook's commit)
  #        Day-5 hook re-author (audit C5): the predict-COMMIT-confront
  #        now commits through a real choice instead of a rhetorical
  #        "garde ta prédiction". Probes: M2 (energie-consommee) — the
  #        RC-decay carryover model. NOT a clone of any end-bank item.
  # ════════════════════════════════════════════════════════════════

  - id: cp-r0-predict
    rung: "R0"
    habilete: utilisation
    skill_code: rlc_serie
    tags: [checkpoint, formative, misconception_driven, rlc_serie, hook_commit]
    primary_misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
    item_source: original
    lesson_placement: in_R0

    stem: |
      On charge complètement un condensateur, puis on le connecte directement
      à une bobine (résistance négligeable). Le circuit est fermé.
      **Que va faire la tension $u_C(t)$ ?** Engage-toi — c'est ta prédiction.

    type: mcq

    choices:
      - id: A
        text: "Elle descend progressivement vers zéro et s'y arrête — comme la décharge du circuit RC."
        correct: false
        misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
        feedback: |
          Modèle détecté : « l'énergie se dépense et disparaît », importé du
          circuit RC. C'est la prédiction la plus fréquente — et la réalité va
          dans la direction opposée. Regarde la trace réelle juste en dessous :
          la tension repasse par zéro et **remonte de l'autre côté**. Il n'y a
          pas de résistance pour dissiper l'énergie ici — elle doit aller
          quelque part. Où ? C'est toute la leçon.

      - id: B
        text: "Elle descend, passe par zéro, remonte de l'autre côté — elle oscille."
        correct: true
        feedback: |
          Exact — et c'est le bon réflexe de ne PAS recopier le RC ici : sans
          résistance, rien ne dissipe l'énergie, donc elle ne peut pas
          simplement « s'épuiser ». La vraie question commence maintenant :
          **pourquoi** ça oscille, et où passe l'énergie à chaque instant ?

      - id: C
        text: "Elle reste constante à $U_0$ : sans résistance, rien ne peut changer."
        correct: false
        misconception: null
        feedback: |
          Le circuit est fermé : le condensateur chargé impose une tension aux
          bornes de la bobine, donc un courant s'établit — la charge NE PEUT PAS
          rester immobile. Regarde la trace réelle ci-dessous : il se passe
          quelque chose, et c'est plus surprenant qu'une décharge.
