        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Il n'y a pas d'erreur de calcul. Le terme $R\\dot{q}$ introduit un sinus qui ne peut pas s'annuler avec les termes en cosinus. Le cosinus simple n'est structurellement pas solution de l'ODE amortie."
      - id: C
        text: "Le reste est nul si on choisit $\\varphi = \\pi/2$."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Changer $\\varphi$ ne supprime pas le terme $R\\dot{q}$ qui oscille en sinus. Quelle que soit la valeur de $\\varphi$, un cosinus simple ne satisfait pas l'ODE amortie."
      - id: D
        text: "L'équation est fausse : il faudrait ajouter un terme $\\frac{dR}{dt}$."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "L'équation $L\\ddot{q} + R\\dot{q} + q/C = 0$ est correcte (R est constant). Le problème vient du cosinus proposé, qui ne convient pas comme solution."
    correct_feedback: "Le reste non nul démontre que le cosinus simple n'est pas solution de l'ODE amortie. C'est la raison pour laquelle le programme s'arrête à l'établissement de l'équation pour le cas amorti."
    solution: |
      Substitution de $q = Q_{max}\cos(\omega_0 t + \varphi)$ :
      $\dot{q} = -Q_{max}\omega_0\sin(\omega_0 t + \varphi)$
      $\ddot{q} = -Q_{max}\omega_0^2\cos(\omega_0 t + \varphi)$
      Avec $\omega_0^2 = 1/(LC)$ :
      $L\ddot{q} + \frac{q}{C}
      = -\frac{Q_{max}}{C}\cos(\ldots) + \frac{Q_{max}}{C}\cos(\ldots) = 0$ ✓
      mais $R\dot{q} = -RQ_{max}\omega_0\sin(\omega_0 t + \varphi) \neq 0$.
      Reste total = $-RQ_{max}\omega_0\sin(\omega_0 t+\varphi) \neq 0$ : le cosinus
      n'est pas solution.

  - id: RLC-M6-3
    rung: "R5"
    difficulty_level: 3
    habilete: resolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Pour un circuit RLC série en régime pseudo-périodique, un élève écrit :
      « $q(t) = Q_{max}\cos(2\pi t/T_0 + \varphi)$, donc la pseudo-période
      vaut exactement $T_0 = 2\pi\sqrt{LC}$. »
      Que penser de ce raisonnement ?
    type: mcq
    choices:
      - id: A
        text: "Il est incorrect : cette forme close sinusoïdale n'est valide que pour $R \\approx 0$. En régime amorti, on ne résout pas l'ODE ; $T \\approx T_0$ est une approximation, pas une identité."
        correct: true
      - id: B
        text: "Il est correct : le cosinus est toujours la solution de l'ODE RLC, amorti ou non."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: [mc.physics.rlc_serie.pseudo-periode-egale-periode-propre]
        feedback: "Le cosinus simple ne satisfait pas l'ODE amortie (il laisse un reste $R\\dot{q} \\neq 0$). Il n'est valable que pour $R = 0$."
      - id: C
        text: "Il est partiellement correct : la forme est juste mais l'amplitude $Q_{max}$ doit être remplacée par une exponentielle décroissante."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Donner une expression de la solution amortie (même avec une enveloppe exponentielle) dépasse le cadre du programme. En régime amorti, on établit l'ODE et on s'arrête là."
      - id: D
        text: "Il est correct : l'approximation $T \\approx T_0$ est toujours une égalité exacte."
        correct: false
        misconception: mc.physics.rlc_serie.pseudo-periode-egale-periode-propre
        also_reveals: [mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee]
        feedback: "$T \\approx T_0$ est une approximation valable pour faible amortissement, jamais une égalité exacte. La pseudo-période s'obtient par mesure graphique."
    correct_feedback: "La forme $q(t) = Q_{max}\\cos(\\ldots)$ est réservée au cas idéal ($R = 0$). Pour $R \\neq 0$ : on établit l'ODE, on s'arrête, et on mesure T sur l'oscillogramme."
    solution: |
      Le cosinus simple ne vérifie pas $L\ddot{q} + R\dot{q} + q/C = 0$
      (reste $= R\dot{q} \neq 0$).
      La forme close correcte pour le cas amorti implique une enveloppe
      exponentielle, ce qui sort du programme.
      Règle du cadre : cas idéal → on résout ; cas amorti → on établit l'ODE
      et on décrit qualitativement + on lit $T$ sur le graphe.

