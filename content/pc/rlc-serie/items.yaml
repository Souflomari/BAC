  # M7 — confusion-roles-C-L-stockage (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: RLC-M7-1
    rung: "R1"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit RLC série, quelles sont les expressions correctes des énergies
      emmagasinées par le condensateur et par la bobine ?
    type: mcq
    choices:
      - id: A
        text: "Condensateur : $E_C = \\frac{1}{2}\\frac{q^2}{C}$ (maximale quand $u_C$ est maximal) ; bobine : $E_L = \\frac{1}{2}Li^2$ (maximale quand $i$ est maximal)."
        correct: true
      - id: B
        text: "Condensateur : $E_C = \\frac{1}{2}Li^2$ ; bobine : $E_L = \\frac{1}{2}Cu_C^2$, chacune étant maximale au même instant du cycle."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "Les formules sont interverties. L'énergie électrique est stockée dans le condensateur ($E_C = \\frac{1}{2}Cu_C^2$) ; l'énergie magnétique est stockée dans la bobine ($E_L = \\frac{1}{2}Li^2$)."
      - id: C
        text: "Les deux énergies sont maximales exactement au même instant du cycle, puisque le condensateur et la bobine se chargent ensemble."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "Dans le cas idéal, $E_C$ et $E_L$ sont en opposition de phase : quand l'une est maximale, l'autre est nulle. Elles ne sont jamais maximales simultanément."
      - id: D
        text: "$E_C$ et $E_L$ sont égales à chaque instant du cycle, l'énergie se répartissant en permanence à parts égales entre les deux."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "$E_C$ et $E_L$ oscillent en opposition de phase et ne sont égales qu'à deux instants par période (croisement des deux courbes). Elles ne sont pas constamment égales."
    correct_feedback: "$E_C = \\frac{1}{2}Cu_C^2 = \\frac{1}{2}q^2/C$ dépend de la charge du condensateur ; $E_L = \\frac{1}{2}Li^2$ dépend du courant dans la bobine. Ces deux réservoirs sont en opposition de phase."
    solution: |
      Condensateur : stocke l'énergie électrique entre ses armatures.
      $E_C = \frac{1}{2}Cu_C^2 = \frac{1}{2}\frac{q^2}{C}$.
      Maximum quand $u_C$ max ($q$ max), c'est-à-dire quand $i = 0$.
      Bobine : stocke l'énergie magnétique dans son champ.
      $E_L = \frac{1}{2}Li^2$.
      Maximum quand $i$ max, c'est-à-dire quand $u_C = 0$ ($q = 0$).
      Les deux sont en antiphase dans le cas idéal.

  - id: RLC-M7-2
    rung: "R1"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit LC idéal, à l'instant $t = 0$, le condensateur est chargé
      à $U_0$ et le courant est nul ($i = 0$).
      Un demi-période plus tard ($t = T_0/2$), le condensateur est de nouveau
      chargé à $U_0$ (en sens inverse). Quel est alors le courant $i$ ?
    type: mcq
    choices:
      - id: A
        text: "$i = 0$ : aux instants de charge maximale du condensateur, le courant est nul."
        correct: true
      - id: B
        text: "$i$ est maximal : le courant est maximal quand le condensateur est chargé au maximum."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "C'est l'inverse : quand $|u_C|$ est maximal, $E_C = \\frac{1}{2}Cu_C^2$ est maximale, donc $E_L = \\frac{1}{2}Li^2 = 0$, ce qui implique $i = 0$."
      - id: C
        text: "$i$ est quelconque : il n'y a pas de lien entre la charge du condensateur et l'intensité du courant."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "Le lien est direct (conservation de l'énergie) : $E_C + E_L = E_0$ à tout instant. Quand $E_C = E_0$ (condensateur au maximum), $E_L = 0$ donc $i = 0$."
      - id: D
        text: "$i = i_{max}/2$ (la moitié de l'intensité maximale)."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "À la charge maximale du condensateur ($|u_C| = U_0$), toute l'énergie est électrique et $i = 0$, pas $i_{max}/2$."
    correct_feedback: "Aux instants où $|u_C|$ est maximal, le condensateur détient toute l'énergie ($E_C = E_0$, $E_L = 0$), ce qui impose $i = 0$."
    solution: |
      À $t = T_0/2$ : $u_C = -U_0$ (tension inversée, même amplitude).
      $E_C = \frac{1}{2}C(-U_0)^2 = \frac{1}{2}CU_0^2 = E_0$.
      Conservation : $E_L = E_0 - E_C = E_0 - E_0 = 0$.
      $E_L = \frac{1}{2}Li^2 = 0 \Rightarrow i = 0$.

  - id: RLC-M7-3
    rung: "R6"
    difficulty_level: 3
    habilete: application_experimentale
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie, document_experimental]
    stem: |
      On trace simultanément $E_C(t)$ et $E_L(t)$ pour un circuit LC idéal.
      L'observation montre que lorsque $E_C$ est nulle, $E_L$ est à son maximum.
      Quelle grandeur physique est alors à son maximum ?
    type: mcq
    choices:
      - id: A
        text: "Le courant $i$ : $E_L = \\frac{1}{2}Li^2$ est maximal quand $i$ est maximal."
        correct: true
      - id: B
        text: "La tension $u_C$ : quand $E_C = 0$, c'est que $u_C$ est à son maximum."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "$E_C = \\frac{1}{2}Cu_C^2 = 0 \\Leftrightarrow u_C = 0$, pas $u_C$ maximal. La grandeur maximale est le courant $i$ (stocké dans la bobine via $E_L = \\frac{1}{2}Li^2$)."
      - id: C
        text: "La charge $q$ du condensateur : quand $E_C = 0$, $q$ est maximale."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "$E_C = \\frac{1}{2}q^2/C = 0 \\Leftrightarrow q = 0$. La charge est nulle quand $E_C = 0$, pas maximale."
      - id: D
        text: "La résistance consomme toute l'énergie à cet instant."
        correct: false
        misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
        also_reveals: []
        feedback: "Le circuit est idéal ($R = 0$) ; il n'y a pas de dissipation. Quand $E_C = 0$, toute l'énergie est magnétique dans la bobine."
    correct_feedback: "Quand $E_C = 0$, $u_C = q = 0$ : le condensateur est vide. Par conservation, $E_L = E_0$, soit $\\frac{1}{2}Li^2 = E_0$ : le courant $i$ est à son maximum."
    solution: |
      $E_L = \frac{1}{2}Li^2$ est maximale $\Leftrightarrow$ $i$ est maximal.
      Vérification par conservation : $E_C + E_L = E_0$.
      $E_C = 0 \Rightarrow E_L = E_0 \Rightarrow \frac{1}{2}Li^2 = E_0
      \Rightarrow i = i_{max} = \sqrt{2E_0/L}$.
      C'est le courant qui circule au maximum quand le condensateur est vide.

