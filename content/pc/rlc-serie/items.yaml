        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: []
        feedback: "Ce calcul utilise R à la place de L, en confondant $T_0$ avec la constante de temps RC. $T_0 = 2\\pi\\sqrt{LC}$ ; R ne joue aucun rôle dans la période propre."
      - id: C
        text: "$T_0 = RC = 50 \\times 10^{-5} = 5 \\times 10^{-4}\\,\\text{s}$"
        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: []
        feedback: "$RC = 5 \\times 10^{-4}\\,\\text{s}$ est la constante de temps du circuit RC, pas la période d'oscillation. $T_0 = 2\\pi\\sqrt{LC} \\approx 6{,}28\\,\\text{ms}$."
      - id: D
        text: "$T_0 = 2\\pi\\sqrt{RLC} \\approx 22\\,\\text{ms}$"
        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: [mc.physics.rlc_serie.plus-de-R-oscille-plus-vite]
        feedback: "R n'entre dans aucune formule de $T_0$. La période propre est $2\\pi\\sqrt{LC}$, indépendante de R."
    correct_feedback: "$T_0 = 2\\pi\\sqrt{LC} = 2\\pi\\sqrt{0{,}1 \\times 10^{-5}} = 2\\pi \\times 10^{-3} \\approx 6{,}28\\,\\text{ms}$. La valeur de $R = 50\\,\\Omega$ n'intervient pas."
    solution: |
      $\sqrt{LC} = \sqrt{0{,}1 \times 10 \times 10^{-6}} = \sqrt{10^{-6}} = 10^{-3}\,\text{s}$.
      $T_0 = 2\pi \times 10^{-3} \approx 6{,}28 \times 10^{-3}\,\text{s} = 6{,}28\,\text{ms}$.
      Vérification dimensionnelle : $[LC] = \text{H} \cdot \text{F} = \Omega\cdot\text{s} \cdot \text{A/V}
      = \text{s}^2$ → $\sqrt{LC}$ est bien un temps.

