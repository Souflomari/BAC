  # M4 — T0-depend-de-R (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: RLC-M4-1
    rung: "R2"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit RLC série en régime peu amorti, quelle est l'expression
      de la période propre $T_0$ des oscillations ?
    type: mcq
    choices:
      - id: A
        text: "$T_0 = 2\\pi\\sqrt{LC}$"
        correct: true
      - id: B
        text: "$T_0 = 2\\pi\\sqrt{RC}$"
        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: []
        feedback: "$\\sqrt{RC}$ est la constante de charge $\\tau$ du circuit RC (étudié au chapitre précédent) : c'est un temps de charge, pas une période d'oscillation. $T_0$ ne contient pas R."
      - id: C
        text: "$T_0 = 2\\pi\\sqrt{L/C}$"
        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: []
        feedback: "$\\sqrt{L/C}$ a les dimensions d'une résistance (ohms), pas d'un temps. La bonne formule est $\\sqrt{LC}$, de dimension seconde."
      - id: D
        text: "$T_0 = RC$"
        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: []
        feedback: "$RC = \\tau$ est la constante de temps du circuit RC. Ce n'est pas une période d'oscillation ; de plus, R n'entre pas dans $T_0$."
    correct_feedback: "$T_0 = 2\\pi\\sqrt{LC}$ : seuls L et C déterminent la période propre. R n'y figure pas."
    solution: |
      De l'équation du circuit idéal ($R = 0$) :
      $L\ddot{q} + \frac{q}{C} = 0$, soit $\ddot{q} + \frac{1}{LC}q = 0$.
      C'est un oscillateur harmonique de pulsation $\omega_0 = \frac{1}{\sqrt{LC}}$,
      d'où $T_0 = \frac{2\pi}{\omega_0} = 2\pi\sqrt{LC}$.
      R n'est pas entré dans le calcul : $T_0$ est indépendante de R.

