notion: rlc-serie
skill_code: rlc_serie

misconceptions:
  - id: mc.physics.rlc_serie.resistance-entretient-oscillations
    label: "« C'est la résistance qui entretient (ou crée) les oscillations »"
    description: "L'élève croit que R est l'élément actif qui alimente ou maintient les oscillations ; supprimer R stopperait tout."
    contradicts_principle: "Dans les oscillations libres, aucun élément n'alimente le circuit : l'énergie placée initialement sur C oscille entre C et L. R ne fait que dissiper (effet Joule) ; R→0 donne un régime périodique parfait."

  - id: mc.physics.rlc_serie.energie-consommee-non-conservee
    label: "« L'énergie est consommée / disparaît, elle ne s'échange pas »"
    description: "L'élève pense que l'énergie se dépense et disparaît à chaque instant, sans voir le transfert conservatif entre C et L."
    contradicts_principle: "Dans le cas idéal (R négligeable) l'énergie totale $E = E_C + E_L$ est constante ; elle oscille entre les deux réservoirs. Avec R ≠ 0, l'énergie diminue mais est convertie en chaleur par effet Joule — elle ne disparaît pas."

  - id: mc.physics.rlc_serie.plus-de-R-oscille-plus-vite
    label: "« Plus R est grande, plus le circuit oscille vite (R agit sur la fréquence) »"
    description: "L'élève confond l'amortissement d'amplitude (régi par R) avec la fréquence des oscillations (régie par L et C)."
    contradicts_principle: "R gouverne l'amortissement (vitesse de décroissance), pas la fréquence. La période propre $T_0 = 2\\pi\\sqrt{LC}$ ne dépend que de L et C."

  - id: mc.physics.rlc_serie.T0-depend-de-R
    label: "« La période propre $T_0$ dépend de R (ex. $T_0 = 2\\pi\\sqrt{RC}$) »"
    description: "L'élève importe la constante de temps $\\tau = RC$ du chapitre RC précédent et l'utilise comme période propre."
    contradicts_principle: "$T_0 = 2\\pi\\sqrt{LC}$ ne contient que L et C. $\\sqrt{RC}$ est la constante de charge τ, pas une période d'oscillation."

  - id: mc.physics.rlc_serie.pseudo-periode-egale-periode-propre
    label: "« La pseudo-période (cas amorti) est exactement égale à $T_0$, ou bien il n'en existe pas »"
    description: "L'élève soit affirme que la pseudo-période mesurée vaut exactement $2\\pi\\sqrt{LC}$ quel que soit l'amortissement, soit nie toute notion de période sur une trace amortie."
    contradicts_principle: "La pseudo-période T existe (espacement régulier des pics) et vaut approximativement $T_0$ pour un faible amortissement. Ce n'est pas une égalité exacte ; on la mesure sur le graphe, on ne la calcule pas à partir de R."

  - id: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
    label: "« Le cas amorti a une solution sinusoïdale fermée $q(t)=Q_{max}\\cos(\\ldots)$ comme le cas idéal »"
    description: "L'élève généralise la solution du cas idéal au cas amorti, en écrivant un cosinus sans facteur d'amortissement."
    contradicts_principle: "En régime amorti on établit l'équation différentielle $L\\ddot{q} + R\\dot{q} + q/C = 0$ et on s'arrête là. La forme fermée sinusoïdale pure n'est valide que pour R ≈ 0. Substituer le cosinus idéal dans l'équation amortie laisse un reste non nul."

  - id: mc.physics.rlc_serie.confusion-roles-C-L-stockage
    label: "« Le condensateur et la bobine stockent la même chose / on confond leurs rôles »"
    description: "L'élève intervertit les expressions d'énergie ou place les deux maxima d'énergie au même instant."
    contradicts_principle: "$E_C = \\frac{1}{2}\\frac{q^2}{C}$ est maximale quand $u_C$ est maximal ($i = 0$) ; $E_L = \\frac{1}{2}Li^2$ est maximale quand $i$ est maximal ($u_C = 0$). Les deux sont en opposition de phase dans le cas idéal."

  - id: mc.physics.rlc_serie.entretien-est-regime-force
    label: "« L'entretien des oscillations, c'est imposer une fréquence de l'extérieur (régime forcé) »"
    description: "L'élève confond entretien (compensation de la perte Joule) et régime forcé (fréquence imposée par un générateur extérieur)."
    contradicts_principle: "Le générateur d'entretien délivre $u_G = k \\cdot i$ et compense exactement la perte Joule ($k = R$). L'ODE devient $L\\ddot{q} + q/C = 0$ : le circuit oscille librement à sa propre période $T_0 = 2\\pi\\sqrt{LC}$. Le générateur ne fixe pas de fréquence."

items:

  # ══════════════════════════════════════════════════════════════
  # M1 — resistance-entretient-oscillations (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: RLC-M1-1
    rung: "R3"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit RLC série en oscillations libres, on diminue progressivement
      la résistance $R$ jusqu'à la rendre négligeable ($R \to 0$).
      Que deviennent les oscillations de $u_C(t)$ ?
    type: mcq
    choices:
      - id: A
        text: "Elles persistent sans s'amortir : le circuit entre en régime périodique."
        correct: true
      - id: B
        text: "Elles s'arrêtent car plus rien ne les entretient."
        correct: false
        misconception: mc.physics.rlc_serie.resistance-entretient-oscillations
        also_reveals: []
        feedback: "Ce raisonnement suppose que R est le moteur des oscillations. Or R ne fait que dissiper l'énergie par effet Joule ; supprimer R supprime l'amortissement, pas les oscillations."
      - id: C
        text: "Elles s'amortissent plus vite."
        correct: false
        misconception: mc.physics.rlc_serie.plus-de-R-oscille-plus-vite
        also_reveals: []
        feedback: "C'est l'inverse : moins de R signifie moins d'amortissement, pas plus. L'amortissement est proportionnel à la puissance dissipée $P = Ri^2$."
      - id: D
        text: "Leur période $T_0$ augmente fortement."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "La période propre $T_0 = 2\\pi\\sqrt{LC}$ ne dépend que de L et C ; modifier R ne la change pas."
    correct_feedback: "Sans résistance le circuit est idéal (LC pur) : l'énergie oscille indéfiniment entre C et L, donnant un régime périodique parfait."
    solution: |
      L'énergie initiale $E_0 = \frac{1}{2}CU_0^2$ est stockée sur le condensateur.
      Elle s'échange entre $E_C = \frac{1}{2}\frac{q^2}{C}$ et $E_L = \frac{1}{2}Li^2$
      sans perte si $R = 0$.
      L'équation différentielle pour $R = 0$ est $L\ddot{q} + \frac{q}{C} = 0$,
      de solution $q(t) = Q_{max}\cos\!\left(\frac{2\pi t}{T_0} + \varphi\right)$
      avec $T_0 = 2\pi\sqrt{LC}$.
      La résistance n'alimente rien : elle dissipe. Son absence donne un régime périodique.

  - id: RLC-M1-2
    rung: "R3"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      On charge un condensateur ($C = 10\,\mu\text{F}$) à $U_0 = 6\,\text{V}$,
      puis on le connecte à une bobine ($L = 0{,}1\,\text{H}$) **sans résistance**.
      Quel élément « fournit » l'énergie qui fait osciller le circuit ?
    type: mcq
    choices:
      - id: A
        text: "Aucun élément extérieur : l'énergie initiale du condensateur s'échange entre C et L."
        correct: true
      - id: B
        text: "La résistance (effet Joule)."
        correct: false
        misconception: mc.physics.rlc_serie.resistance-entretient-oscillations
        also_reveals: []
        feedback: "Il n'y a pas de résistance dans ce circuit. Et même si elle existait, R ne fournirait rien : elle ne ferait que dissiper de l'énergie."
      - id: C
        text: "La bobine, car $E_L = \\frac{1}{2}Li^2$ est l'énergie motrice."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "La bobine stocke de l'énergie magnétique, mais elle ne la crée pas. Elle reçoit l'énergie du condensateur et la lui renvoie."
      - id: D
        text: "Le circuit puise l'énergie dans le champ magnétique terrestre."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "Non : l'unique source d'énergie est la charge initiale du condensateur."
    correct_feedback: "L'oscillation est autoentretenue par l'échange d'énergie entre les deux réservoirs (C et L). Aucun élément actif n'est nécessaire."
    solution: |
      Énergie initiale : $E_0 = \frac{1}{2}CU_0^2 = \frac{1}{2} \times 10^{-5} \times 36
      = 1{,}8 \times 10^{-4}\,\text{J}$.
      Cette énergie passe de C à L puis de L à C indéfiniment (cas idéal).
      Aucun élément n'en injecte : c'est la charge initiale qui alimente tout.

  - id: RLC-M1-3
    rung: "R3"
    difficulty_level: 3
    habilete: resolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Un circuit RLC série est en régime pseudo-périodique.
      Un élève affirme : « Pour que les oscillations durent plus longtemps,
      il faut **augmenter** $R$ afin de mieux les entretenir. »
      Cette affirmation est-elle correcte ? Justifiez en termes énergétiques.
    type: mcq
    choices:
      - id: A
        text: "Non. Augmenter $R$ accélère la dissipation d'énergie ($P = Ri^2$) et rend l'amortissement plus rapide ; pour prolonger les oscillations il faut **diminuer** $R$."
        correct: true
      - id: B
        text: "Oui. Une plus grande résistance fournit plus d'énergie aux oscillations."
        correct: false
        misconception: mc.physics.rlc_serie.resistance-entretient-oscillations
        also_reveals: []
        feedback: "R ne fournit jamais d'énergie : la puissance dissipée par R est $P = Ri^2 \\geq 0$, toujours positive, donc toujours perdue en chaleur."
      - id: C
        text: "Oui. Une plus grande résistance augmente la fréquence et les oscillations semblent plus nombreuses."
        correct: false
        misconception: mc.physics.rlc_serie.plus-de-R-oscille-plus-vite
        also_reveals: []
        feedback: "R n'agit pas sur la fréquence. Augmenter R amplifie l'amortissement ; les oscillations meurent plus vite, pas plus vite en fréquence."
      - id: D
        text: "Non. R n'a aucun effet sur les oscillations libres."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "R a bien un effet : elle dissipe de l'énergie et détermine la rapidité d'amortissement, voire le régime (apériodique si R trop grande)."
    correct_feedback: "R est le frein énergétique : $P_{Joule} = Ri^2$ retire de l'énergie à chaque oscillation. Moins R est grande, plus les oscillations persistent."
    solution: |
      Bilan énergétique sur une demi-période :
      $\Delta E = -\int_0^{T/2} R\,i^2\,dt < 0$.
      Plus $R$ est grande, plus $|\Delta E|$ est grand, plus l'enveloppe décroît vite.
      Pour prolonger les oscillations → réduire $R$.
      (Pour les entretenir indéfiniment → utiliser un générateur d'entretien $u_G = k\,i$
      avec $k = R$, qui **compense** exactement cette perte.)

  # ══════════════════════════════════════════════════════════════
  # M2 — energie-consommee-non-conservee (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: RLC-M2-1
    rung: "R1"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit LC idéal (résistance négligeable), à l'instant où la tension
      $u_C$ aux bornes du condensateur est **nulle**, où se trouve l'énergie du circuit ?
    type: mcq
    choices:
      - id: A
        text: "Entièrement emmagasinée dans la bobine : $E_L = \\frac{1}{2}Li^2$ est maximale."
        correct: true
      - id: B
        text: "Elle a été entièrement consommée, il n'en reste plus."
        correct: false
        misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
        also_reveals: []
        feedback: "L'énergie ne disparaît pas : dans le cas idéal elle est conservée. Quand $u_C = 0$, le condensateur est vide mais le courant $i$ est maximal, donc toute l'énergie est dans la bobine."
      - id: C
        text: "Entièrement dans le condensateur : $E_C = \\frac{1}{2}Cu_C^2$ est maximale."
        correct: false
        misconception: mc.physics.rlc_serie.confusion-roles-C-L-stockage
        also_reveals: []
        feedback: "Si $u_C = 0$, alors $E_C = \\frac{1}{2}C \\times 0 = 0$. L'énergie n'est pas dans le condensateur à cet instant."
      - id: D
        text: "Répartie également entre C et L."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "La répartition égale n'a rien de particulier ici. Quand $u_C = 0$ exactement, toute l'énergie est dans L ($E_C = 0$)."
    correct_feedback: "Quand $u_C = 0$, le condensateur est déchargé ($q = 0$, $E_C = 0$) mais $i$ est à son maximum : toute l'énergie est magnétique, dans la bobine."
    solution: |
      Conservation de l'énergie (cas idéal) :
      $E = E_C + E_L = \frac{1}{2}\frac{q^2}{C} + \frac{1}{2}Li^2 = \text{constante}$.
      À $u_C = 0$ : $q = Cu_C = 0$, donc $E_C = 0$.
      Par conservation : $E_L = E - 0 = E$ (maximum).
      L'énergie a migré entièrement de C vers L.

  - id: RLC-M2-2
    rung: "R1"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Un condensateur ($C = 10\,\mu\text{F}$, $U_0 = 6\,\text{V}$) est connecté à une bobine
      ($L = 0{,}1\,\text{H}$, $R \approx 0$). L'énergie initiale est
      $E_0 = 1{,}8 \times 10^{-4}\,\text{J}$.
      Un quart de période plus tard ($t = T_0/4$), quelle est la valeur de $E_L$ ?
    type: mcq
    choices:
      - id: A
        text: "$E_L = 1{,}8 \\times 10^{-4}\\,\\text{J}$ (tout dans la bobine)."
        correct: true
      - id: B
        text: "$E_L = 0$ (l'énergie a été dissipée entre $t = 0$ et $t = T_0/4$)."
        correct: false
        misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
        also_reveals: []
        feedback: "Avec $R \\approx 0$ il n'y a pas de dissipation. L'énergie n'est pas consommée ; elle passe intégralement du condensateur dans la bobine en un quart de période."
      - id: C
        text: "$E_L = 9{,}0 \\times 10^{-5}\\,\\text{J}$ (moitié-moitié)."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "La répartition moitié-moitié n'est pas l'état à $t = T_0/4$. À ce moment précis le condensateur est entièrement vide et toute l'énergie est dans la bobine."
      - id: D
        text: "$E_L = 1{,}8 \\times 10^{-4}\\,\\text{J}$ seulement si $L$ est très grand."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "La valeur de $L$ détermine la période, pas la conservation de l'énergie. Quelle que soit la valeur de $L$, $E_L = E_0$ à $t = T_0/4$ (cas idéal)."
    correct_feedback: "À $t = T_0/4$ le condensateur est entièrement déchargé. Par conservation : $E_L = E_0 = 1{,}8 \\times 10^{-4}\\,\\text{J}$."
    solution: |
      Cas idéal : $E = E_C + E_L = E_0 = 1{,}8 \times 10^{-4}\,\text{J}$ à tout instant.
      À $t = T_0/4$ : $u_C = 0 \Rightarrow E_C = \frac{1}{2}C \times 0 = 0$.
      Donc $E_L = E_0 - E_C = 1{,}8 \times 10^{-4} - 0 = 1{,}8 \times 10^{-4}\,\text{J}$.

  - id: RLC-M2-3
    rung: "R4"
    difficulty_level: 3
    habilete: resolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit RLC série en régime pseudo-périodique, l'amplitude des oscillations
      de $u_C(t)$ diminue progressivement. Quelle affirmation décrit correctement
      le devenir de l'énergie totale $E = E_C + E_L$ ?
    type: mcq
    choices:
      - id: A
        text: "$E$ diminue car une partie est convertie en chaleur dans R par effet Joule ($P = Ri^2$). L'échange C↔L continue à chaque oscillation."
        correct: true
      - id: B
        text: "$E$ diminue car les composants consomment et détruisent l'énergie."
        correct: false
        misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
        also_reveals: []
        feedback: "L'énergie ne se détruit pas. Elle est convertie en chaleur spécifiquement dans R. C et L ne consomment rien ; ils stockent et restituent."
      - id: C
        text: "$E$ reste constante : seule l'amplitude de $u_C$ change, pas l'énergie totale."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "La conservation de l'énergie totale n'est vraie que pour $R = 0$. Avec $R \\neq 0$, la dissipation Joule fait diminuer $E$ à chaque oscillation."
      - id: D
        text: "$E$ est nulle à chaque instant où $u_C = 0$, donc l'énergie disparaît périodiquement."
        correct: false
        misconception: mc.physics.rlc_serie.energie-consommee-non-conservee
        also_reveals: [mc.physics.rlc_serie.confusion-roles-C-L-stockage]
        feedback: "Quand $u_C = 0$, l'énergie n'est pas nulle : elle est entièrement dans la bobine ($E_L = \\frac{1}{2}Li^2$, $i$ maximal à cet instant)."
    correct_feedback: "R dissipe de l'énergie à chaque passage de courant (effet Joule). L'énergie totale décroît progressivement, mais l'échange C↔L se poursuit jusqu'à extinction."
    solution: |
      Bilan : $\frac{dE}{dt} = -Ri^2 \leq 0$.
      L'énergie décroît à un rythme proportionnel à $Ri^2$.
      À chaque instant elle se répartit entre $E_C = \frac{1}{2}q^2/C$ et $E_L = \frac{1}{2}Li^2$
      (l'échange continue), mais la somme diminue car R prélève constamment de la chaleur.

  # ══════════════════════════════════════════════════════════════
  # M3 — plus-de-R-oscille-plus-vite (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: RLC-M3-1
    rung: "R3"
    difficulty_level: 2
    habilete: utilisation
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Dans un circuit RLC série, on augmente la résistance $R$ en gardant $L$ et $C$
      constants. Comment évolue le comportement de $u_C(t)$ ?
    type: mcq
    choices:
      - id: A
        text: "Les oscillations s'amortissent plus rapidement (l'amplitude décroît plus vite)."
        correct: true
      - id: B
        text: "Les oscillations deviennent plus rapides (période plus courte)."
        correct: false
        misconception: mc.physics.rlc_serie.plus-de-R-oscille-plus-vite
        also_reveals: []
        feedback: "R n'agit pas sur la fréquence. La pseudo-période reste voisine de $T_0 = 2\\pi\\sqrt{LC}$ (qui ne dépend que de L et C). R accélère la décroissance d'amplitude."
      - id: C
        text: "La période propre $T_0$ augmente."
        correct: false
        misconception: mc.physics.rlc_serie.T0-depend-de-R
        also_reveals: [mc.physics.rlc_serie.plus-de-R-oscille-plus-vite]
        feedback: "$T_0 = 2\\pi\\sqrt{LC}$ est indépendante de R. Modifier R ne change pas L ni C, donc $T_0$ est inchangée."
      - id: D
        text: "Rien ne change : R n'a aucune influence sur les oscillations libres."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "R a une influence réelle : elle détermine le taux d'amortissement (vitesse de décroissance de l'amplitude) et peut conduire au régime apériodique."
    correct_feedback: "Augmenter R amplifie l'effet Joule et accélère la perte d'énergie : les oscillations s'amortissent plus vite, sans changer de fréquence."
    solution: |
      L'équation du circuit : $L\ddot{q} + R\dot{q} + \frac{q}{C} = 0$.
      Le terme $R\dot{q}$ est le terme dissipatif.
      Plus $R$ est grand, plus ce terme pèse → amortissement plus fort.
      La fréquence propre $\omega_0 = 1/\sqrt{LC}$ ne fait pas apparaître $R$ :
      la fréquence est inchangée.

  - id: RLC-M3-2
    rung: "R6"
    difficulty_level: 3
    habilete: application_experimentale
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie, document_experimental]
    stem: |
      Sur un oscillogramme d'un circuit RLC série, on observe un régime pseudo-périodique
      avec une pseudo-période $T \approx 6{,}3\,\text{ms}$ et une amplitude qui diminue
      de moitié en 4 oscillations.
      On double ensuite la valeur de $R$ (L et C sont inchangés).
      Que devient la pseudo-période mesurée sur le nouvel oscillogramme ?
    type: mcq
    choices:
      - id: A
        text: "Elle reste approximativement $6{,}3\\,\\text{ms}$ (seul l'amortissement change)."
        correct: true
      - id: B
        text: "Elle diminue de moitié, environ $3{,}15\\,\\text{ms}$ (oscillations plus rapides)."
        correct: false
        misconception: mc.physics.rlc_serie.plus-de-R-oscille-plus-vite
        also_reveals: []
        feedback: "Doubler R ne divise pas la pseudo-période. R n'agit que sur l'amortissement (les pics disparaissent plus vite) ; la pseudo-période reste $T \\approx T_0 = 2\\pi\\sqrt{LC}$."
      - id: C
        text: "Elle double, environ $12{,}6\\,\\text{ms}$ (oscillations plus lentes)."
        correct: false
        misconception: mc.physics.rlc_serie.plus-de-R-oscille-plus-vite
        also_reveals: []
        feedback: "R n'agit pas sur la pseudo-période. Même en doublant R, la pseudo-période reste voisine de $T_0 = 2\\pi\\sqrt{LC}$."
      - id: D
        text: "Elle ne peut plus être mesurée : le circuit est nécessairement apériodique."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "Doubler R augmente l'amortissement, mais n'implique pas nécessairement le régime apériodique. Si l'amortissement initial est faible, le régime peut rester pseudo-périodique."
    correct_feedback: "La pseudo-période est gouvernée par L et C ($T \\approx T_0 = 2\\pi\\sqrt{LC}$). Doubler R accélère l'extinction des oscillations sans modifier leur espacement temporel."
