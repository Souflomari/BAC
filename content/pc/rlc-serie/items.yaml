  # M8 — entretien-est-regime-force (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: RLC-M8-1
    rung: "R7"
    difficulty_level: 3
    habilete: résolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie, entretien]
    stem: |
      On entretient les oscillations d'un circuit RLC à l'aide d'un générateur
      délivrant une tension $u_G(t) = k \cdot i(t)$.
      Quel est le rôle de ce dispositif et que vaut la période des oscillations
      entretenues ?
    type: mcq
    choices:
      - id: A
        text: "Il compense l'énergie dissipée par effet Joule ; les oscillations se font à la période propre $T_0 = 2\\pi\\sqrt{LC}$."
        correct: true
      - id: B
        text: "Il impose sa propre fréquence au circuit (régime forcé) : la période dépend du générateur."
        correct: false
        misconception: mc.physics.rlc_serie.entretien-est-regime-force
        also_reveals: []
        feedback: "Ce générateur ne fixe pas de fréquence : $u_G = ki$ est proportionnel au courant existant. Avec $k = R$, il annule le terme d'amortissement et le circuit oscille à sa propre $T_0 = 2\\pi\\sqrt{LC}$."
      - id: C
        text: "Il augmente la résistance effective du circuit, amplifiant l'amortissement."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "Avec $k = R$ le générateur annule exactement R (terme $(R-k) = 0$). Il ne l'augmente pas ; il le compense."
      - id: D
        text: "Il rend la période dépendante de $k$ : $T = 2\\pi\\sqrt{LC} \\cdot f(k)$."
        correct: false
        misconception: mc.physics.rlc_serie.entretien-est-regime-force
        also_reveals: [mc.physics.rlc_serie.T0-depend-de-R]
        feedback: "Avec $k = R$, l'ODE devient $L\\ddot{q} + q/C = 0$ : $k$ a disparu de l'équation. La période est $T_0 = 2\\pi\\sqrt{LC}$, indépendante de $k$."
    correct_feedback: "Le générateur $u_G = ki$ avec $k = R$ compense exactement la dissipation Joule ($R-k = 0$). L'ODE redevient $L\\ddot{q} + q/C = 0$ : oscillation libre à $T_0 = 2\\pi\\sqrt{LC}$."
    solution: |
      Loi des mailles avec le générateur :
      $u_C + u_L + u_R - u_G = 0$
      $\frac{q}{C} + L\ddot{q} + R\dot{q} - k\dot{q} = 0$
      $L\ddot{q} + (R-k)\dot{q} + \frac{q}{C} = 0$.
      Avec $k = R$ : $(R-k) = 0$ → $L\ddot{q} + \frac{q}{C} = 0$.
      C'est l'ODE du circuit LC idéal : $T = T_0 = 2\pi\sqrt{LC}$.
      Le générateur choisit combien d'énergie restituer (via $k = R$),
      pas à quelle fréquence osciller.

  - id: RLC-M8-2
    rung: "R7"
    difficulty_level: 3
    habilete: résolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie, entretien]
    stem: |
      Dans un circuit RLC entretenu par un générateur $u_G = k \cdot i$,
      on choisit $k = R = 20\,\Omega$.
      Quelle est la condition sur $k$ pour que les oscillations soient entretenues
      (ni amorties ni amplifiées), et comment appelle-t-on ce rôle du générateur ?
    type: mcq
    choices:
      - id: A
        text: "$k = R$ : le générateur compense exactement la perte Joule, restituant à chaque cycle l'énergie dissipée par $R$."
        correct: true
      - id: B
        text: "$k = R$ : le générateur impose alors au circuit la fréquence de résonance qui lui est propre."
        correct: false
        misconception: mc.physics.rlc_serie.entretien-est-regime-force
        also_reveals: []
        feedback: "La condition $k = R$ annule l'amortissement et restaure l'oscillation libre à $T_0 = 2\\pi\\sqrt{LC}$. Il ne s'agit pas d'une résonance forcée : aucune fréquence extérieure n'est imposée."
      - id: C
        text: "$k = 1/R$ : le générateur doit valoir l'inverse de la résistance pour en compenser exactement l'effet."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "La condition correcte est $k = R$ (même unité : $\\Omega$ = V/A). Cela annule directement le terme $(R - k)$ dans l'ODE, pas $1/R$."
      - id: D
        text: "$k = 0$ : sans aucun apport extérieur d'énergie, les oscillations persistent d'elles-mêmes indéfiniment."
        correct: false
        misconception: mc.physics.rlc_serie.resistance-entretient-oscillations
        also_reveals: []
        feedback: "Avec $k = 0$, le générateur est absent et $R > 0$ : les oscillations s'amortissent. Il faut $k = R$ pour compenser l'effet Joule de R."
    correct_feedback: "La condition $k = R$ annule le terme dissipatif $(R - k)\\dot{q} = 0$ dans l'ODE. Le circuit se comporte comme un LC idéal et oscille à $T_0 = 2\\pi\\sqrt{LC}$ sans amortissement."
    solution: |
      ODE entretenue : $L\ddot{q} + (R-k)\dot{q} + q/C = 0$.
      Oscillation entretenue sans amortissement ↔ $(R-k) = 0$ ↔ $k = R$.
      Avec $R = 20\,\Omega$ : $k = 20\,\text{V/A}$.
      Rôle physique : chaque cycle le générateur injecte exactement l'énergie
      $\Delta E_{Joule} = \int_0^T Ri^2\,dt$ perdue dans R.
      Ce n'est pas un régime forcé : la fréquence est $T_0 = 2\pi\sqrt{LC}$,
      déterminée par L et C seuls.

  - id: RLC-M8-3
    rung: "R9"
    difficulty_level: 4
    habilete: résolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie, entretien]
    stem: |
      Un circuit RLC série ($L = 0{,}1\,\text{H}$, $C = 10\,\mu\text{F}$,
      $R = 50\,\Omega$) est entretenu par un générateur $u_G(t) = k \cdot i(t)$
      avec $k = 50\,\text{V/A}$.
      Un élève affirme : « La période des oscillations entretenues est différente
      de $T_0 = 2\pi\sqrt{LC}$ car le générateur modifie le circuit. »
      Cette affirmation est-elle correcte ?
    type: mcq
    choices:
      - id: A
        text: "Non. Avec $k = R = 50\\,\\Omega$, l'ODE devient $L\\ddot{q} + q/C = 0$ : la période est exactement $T_0 = 2\\pi\\sqrt{LC} \\approx 6{,}28\\,\\text{ms}$."
        correct: true
      - id: B
        text: "Oui. Le générateur impose sa propre dynamique ; la période change."
        correct: false
        misconception: mc.physics.rlc_serie.entretien-est-regime-force
        also_reveals: []
        feedback: "Non : $u_G = k \\cdot i$ est proportionnel au courant du circuit, pas à un signal extérieur autonome. Avec $k = R$, il annule l'amortissement sans introduire aucune nouvelle fréquence."
      - id: C
        text: "Oui. La période devient $T_0' = 2\\pi\\sqrt{LC} \\cdot (1 + k/R)$."
        correct: false
        misconception: mc.physics.rlc_serie.entretien-est-regime-force
        also_reveals: [mc.physics.rlc_serie.T0-depend-de-R]
        feedback: "Cette formule est inventée. Avec $k = R$, l'ODE réduite est $L\\ddot{q} + q/C = 0$, dont la solution a la période $T_0 = 2\\pi\\sqrt{LC}$. Aucun facteur correctif."
      - id: D
        text: "Oui. Pour que les oscillations soient entretenues, il faut $k > R$, ce qui amplifie la fréquence."
        correct: false
        misconception: mc.physics.rlc_serie.entretien-est-regime-force
        also_reveals: [mc.physics.rlc_serie.plus-de-R-oscille-plus-vite]
        feedback: "La condition d'entretien est $k = R$ (ni amorti ni amplifié). Avec $k > R$, $(R-k) < 0$ et les oscillations **s'amplifient** (énergie ajoutée > perdue). La fréquence reste $T_0 = 2\\pi\\sqrt{LC}$ dans tous les cas."
    correct_feedback: "Avec $k = R = 50\\,\\Omega$ : $(R - k) = 0$. L'ODE est $L\\ddot{q} + q/C = 0$, celle du LC idéal. $T_0 = 2\\pi\\sqrt{0{,}1 \\times 10^{-5}} \\approx 6{,}28\\,\\text{ms}$."
    solution: |
      Substitution de $k = R = 50\,\Omega$ :
      $L\ddot{q} + (R - k)\dot{q} + \frac{q}{C} = 0$
      $L\ddot{q} + 0 \cdot \dot{q} + \frac{q}{C} = 0$
      $L\ddot{q} + \frac{q}{C} = 0$ ← ODE du LC idéal.
      $\omega_0 = 1/\sqrt{LC}$, $T_0 = 2\pi\sqrt{LC} = 2\pi\sqrt{10^{-6}}
      = 2\pi \times 10^{-3} \approx 6{,}28\,\text{ms}$.
      $k$ a disparu de l'équation : il ne modifie pas la période.

