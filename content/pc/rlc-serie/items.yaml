  - id: RLC-M6-1
    rung: "R5"
    difficulty_level: 3
    habilete: résolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Pour un circuit RLC série avec une résistance $R$ non négligeable
      (régime pseudo-périodique), quelle affirmation est correcte
      concernant la charge $q(t)$ ?
    type: mcq
    choices:
      - id: A
        text: "On établit l'équation différentielle $L\\ddot{q} + R\\dot{q} + q/C = 0$, mais on ne donne pas de solution $q(t)$ sous forme close ; on décrit le régime qualitativement et expérimentalement."
        correct: true
      - id: B
        text: "$q(t) = Q_{max}\\cos\\!\\left(\\frac{2\\pi t}{T_0} + \\varphi\\right)$ avec $T_0 = 2\\pi\\sqrt{LC}$, exactement comme dans le cas idéal sans résistance, la résistance ne modifiant que l'amplitude."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Ce cosinus est la solution du cas idéal ($R = 0$). Substitué dans l'équation amortie, il laisse un reste $R\\dot{q} \\neq 0$, donc il ne la satisfait pas. En régime amorti, on établit l'équation et on s'arrête là."
      - id: C
        text: "$q(t) = Q_{max}\\,e^{-t/\\tau}$, une exponentielle décroissante pure, sans la moindre oscillation, la résistance imposant au circuit un simple retour progressif à l'équilibre."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Une exponentielle pure décrit le régime apériodique ou une charge RC, pas le régime pseudo-périodique. De plus, donner une forme close pour le régime amorti dépasse le cadre du programme."
      - id: D
        text: "$q(t)$ est constante au cours du temps : le circuit ne peut pas osciller dès lors que la résistance $R$ est différente de zéro."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "Le circuit oscille bien ($R$ non négligeable → régime pseudo-périodique). $q(t)$ n'est pas constante ; elle oscille avec une amplitude décroissante."
    correct_feedback: "En régime amorti, on établit l'ODE et on s'arrête là — le cadre du programme ne demande pas de la résoudre. Le régime est décrit qualitativement (forme amortie) et expérimentalement (mesure de T sur le graphe)."
    solution: |
      L'équation du circuit (loi des mailles, $R \neq 0$) :
      $u_C + u_L + u_R = 0$
      $\frac{q}{C} + L\ddot{q} + R\dot{q} = 0$
      soit $L\ddot{q} + R\dot{q} + \frac{q}{C} = 0$.
      Vérification que le cosinus idéal ne convient pas :
      posons $q(t) = Q_{max}\cos(\omega_0 t + \varphi)$,
      $\dot{q} = -Q_{max}\omega_0\sin(\omega_0 t + \varphi)$.
      Le terme $R\dot{q} = -RQ_{max}\omega_0\sin(\ldots) \neq 0$ :
      le reste ne s'annule pas → le cosinus simple n'est pas solution.
      Conclusion : on établit l'ODE et on lit le reste sur l'expérience.

  - id: RLC-M6-2
    rung: "R5"
    difficulty_level: 4
    habilete: résolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Un élève substitue $q(t) = Q_{max}\cos\!\left(\frac{2\pi t}{T_0} + \varphi\right)$
      dans l'équation $L\ddot{q} + R\dot{q} + \frac{q}{C} = 0$ (avec $R \neq 0$).
      Il obtient un « reste » après substitution.
      Que conclure ?
    type: mcq
    choices:
      - id: A
        text: "Ce cosinus n'est pas solution de l'équation amortie ; on ne peut pas écrire $q(t)$ sous forme close dans le cadre du programme."
        correct: true
      - id: B
        text: "L'élève a commis une erreur de calcul : avec les bons coefficients, le reste obtenu devrait être rigoureusement nul."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Il n'y a pas d'erreur de calcul. Le terme $R\\dot{q}$ introduit un sinus qui ne peut pas s'annuler avec les termes en cosinus. Le cosinus simple n'est structurellement pas solution de l'ODE amortie."
      - id: C
        text: "Le reste devient nul dès que l'on choisit la phase $\\varphi = \\pi/2$ dans l'expression proposée pour $q(t)$."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Changer $\\varphi$ ne supprime pas le terme $R\\dot{q}$ qui oscille en sinus. Quelle que soit la valeur de $\\varphi$, un cosinus simple ne satisfait pas l'ODE amortie."
      - id: D
        text: "L'équation différentielle est fausse : il faudrait y ajouter un terme en $\\frac{dR}{dt}$ pour tenir compte de la résistance."
        correct: false
        misconception: null
        also_reveals: []
        feedback: "L'équation $L\\ddot{q} + R\\dot{q} + q/C = 0$ est correcte (R est constant). Le problème vient du cosinus proposé, qui ne convient pas comme solution."
    correct_feedback: "Le reste non nul démontre que le cosinus simple n'est pas solution de l'ODE amortie. C'est la raison pour laquelle le programme s'arrête à l'établissement de l'équation pour le cas amorti."
    solution: |
      Substitution de $q = Q_{max}\cos(\omega_0 t + \varphi)$ :
      $\dot{q} = -Q_{max}\omega_0\sin(\omega_0 t + \varphi)$
      $\ddot{q} = -Q_{max}\omega_0^2\cos(\omega_0 t + \varphi)$
      Avec $\omega_0^2 = 1/(LC)$ :
      $L\ddot{q} + \frac{q}{C}
      = -\frac{Q_{max}}{C}\cos(\ldots) + \frac{Q_{max}}{C}\cos(\ldots) = 0$ ✓
      mais $R\dot{q} = -RQ_{max}\omega_0\sin(\omega_0 t + \varphi) \neq 0$.
      Reste total = $-RQ_{max}\omega_0\sin(\omega_0 t+\varphi) \neq 0$ : le cosinus
      n'est pas solution.

  - id: RLC-M6-3
    rung: "R5"
    difficulty_level: 3
    habilete: résolution
    skill_code: rlc_serie
    tags: [misconception_driven, rlc_serie]
    stem: |
      Pour un circuit RLC série en régime pseudo-périodique, un élève écrit :
      « $q(t) = Q_{max}\cos(2\pi t/T_0 + \varphi)$, donc la pseudo-période
      vaut exactement $T_0 = 2\pi\sqrt{LC}$. »
      Que penser de ce raisonnement ?
    type: mcq
    choices:
      - id: A
        text: "Il est incorrect : cette forme close sinusoïdale n'est valide que pour $R \\approx 0$. En régime amorti, on ne résout pas l'ODE ; $T \\approx T_0$ est une approximation, pas une identité."
        correct: true
      - id: B
        text: "Il est correct : le cosinus est toujours la solution de l'équation différentielle du circuit RLC, que le régime soit amorti ou non."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: [mc.physics.rlc_serie.pseudo-periode-egale-periode-propre]
        feedback: "Le cosinus simple ne satisfait pas l'ODE amortie (il laisse un reste $R\\dot{q} \\neq 0$). Il n'est valable que pour $R = 0$."
      - id: C
        text: "Il est partiellement correct : la forme sinusoïdale est juste, mais l'amplitude $Q_{max}$ doit être remplacée par une exponentielle décroissante du temps."
        correct: false
        misconception: mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee
        also_reveals: []
        feedback: "Donner une expression de la solution amortie (même avec une enveloppe exponentielle) dépasse le cadre du programme. En régime amorti, on établit l'ODE et on s'arrête là."
      - id: D
        text: "Il est correct : l'approximation $T \\approx T_0$ est en réalité toujours une égalité exacte, quelle que soit la valeur de la résistance."
        correct: false
        misconception: mc.physics.rlc_serie.pseudo-periode-egale-periode-propre
        also_reveals: [mc.physics.rlc_serie.cas-amorti-solution-sinusoidale-fermee]
        feedback: "$T \\approx T_0$ est une approximation valable pour faible amortissement, jamais une égalité exacte. La pseudo-période s'obtient par mesure graphique."
    correct_feedback: "La forme $q(t) = Q_{max}\\cos(\\ldots)$ est réservée au cas idéal ($R = 0$). Pour $R \\neq 0$ : on établit l'ODE, on s'arrête, et on mesure T sur l'oscillogramme."
    solution: |
      Le cosinus simple ne vérifie pas $L\ddot{q} + R\dot{q} + q/C = 0$
      (reste $= R\dot{q} \neq 0$).
      Le programme ne demande aucune forme close pour le cas amorti — on ne
      la résout pas analytiquement.
      Règle du cadre : cas idéal → on résout ; cas amorti → on établit l'ODE
      et on décrit qualitativement + on lit $T$ sur le graphe.

