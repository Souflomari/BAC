    intro: |-
      **2- Décharge d'un condensateur dans un dipôle RL (examen national, session normale 2025, Exercice 3 — Partie 2).**

      Lorsque la tension entre les bornes du condensateur prend la valeur $u_C = U_0 = 10\ \text{V}$, on bascule l'interrupteur $K$ en position (2) à un instant pris comme nouvelle origine des dates $(t_0 = 0)$. Un système d'acquisition informatisé adéquat permet d'obtenir la courbe représentant la tension $u_C(t)$ (figure 3). Le circuit est le condensateur $C_0$ en série avec la bobine $(L, r)$ — pas de conducteur ohmique séparé.

      *Figure 3 (courbe) :* $u_C\ (\text{V})$ en fonction de $t$ (axe non chiffré en unité). Cadre de 10 divisions en abscisse ; ordonnées graduées $4, 0, -4$ (1 division $=4\ \text{V}$ ; les traits $\pm8\ \text{V}$ existent mais ne sont pas chiffrés) ; un trait pointillé horizontal non principal, étiqueté « $7$ », marque le niveau $u_C = 7\ \text{V}$.

      Oscillation pseudopériodique d'amplitude décroissante, tous les extrema tombant sur un trait principal sur deux : maximum initial $u_C(0) = +10\ \text{V}$ à $t=0$ ; premier minimum $\approx -8{,}3\ \text{V}$ à la division 2 ; deuxième maximum à la division 4, touchant **exactement** le pointillé $u_C = 7\ \text{V}$ — c'est l'instant $t_A$ ; à la division 5, le passage par zéro descendant qui suit — c'est l'instant $t_B$, soit une division ($T/4$) après $t_A$ ; deuxième minimum $\approx -5{,}9\ \text{V}$ à la division 6 ; troisième maximum $\approx 4{,}9\ \text{V}$ à la division 8 ; troisième minimum $\approx -4{,}1\ \text{V}$ à la division 10 (bord droit, fin du tracé).

      Un repère à double flèche horizontale, étiqueté « $7\times10^{-5}\ \text{s}$ », est tracé entre le trait vertical de $t_B$ et le trait principal suivant : il couvre **exactement une division**, ni deux, ni quatre — c'est l'étalonnage de l'axe des temps (1 division $=7\times10^{-5}\ \text{s}$), pas la pseudo-période.
    questions:
      - id: q1
        part: "2- Décharge d'un condensateur dans un dipôle RL : établir le modèle"
        stem: |-
          **(0,5 pt)** Établir l'équation différentielle vérifiée par $u_C(t)$.
        reasoning: |-
          Même structure que la question 2a du sujet 2018 ci-dessus : ce montage n'a pas de conducteur ohmique séparé, seule la résistance propre $r$ de la bobine $(L,r)$ dissipe. On applique donc le rung 5 avec $r$ à la place de $R$.
        steps:
          - math: 'u_C + u_{bobine} = 0 \qquad \text{avec} \qquad u_{bobine} = L\frac{di}{dt} + r\,i'
            note: "Loi des mailles (rung 5) ; seule resistance ici : r, la resistance propre de la bobine, comme a la question 2a du sujet 2018 ci-dessus."
          - math: 'i = C_0\frac{du_C}{dt} \implies u_C + rC_0\frac{du_C}{dt} + LC_0\frac{d^2u_C}{dt^2} = 0'
            note: "On exprime i en u_C (rung 2)."
          - math: '\boxed{\frac{d^2u_C}{dt^2} + \frac{r}{L}\frac{du_C}{dt} + \frac{1}{LC_0}\,u_C = 0}'
            note: "Division par LC0 ; forme standard du cas amorti (rung 5), r jouant seul le role de la resistance totale."
      - id: q2
        part: "Exploiter la courbe : ne pas confondre l'étalon de temps et la pseudo-période"
        stem: |-
          **(0,5 pt)** En exploitant la courbe de la figure 3, déterminer la valeur de la pseudopériode des oscillations.
        reasoning: |-
          Le piège de cette figure, précisément : la double flèche imprimée, étiquetée « $7\times10^{-5}\ \text{s}$ », a l'air de mesurer un intervalle caractéristique de la courbe — mais elle ne couvre qu'**une seule division** du quadrillage, entre $t_B$ et le trait principal suivant. C'est l'étalon de l'axe des temps, pas la pseudo-période : la confondre avec la période donnerait une valeur environ quatre fois trop petite. La bonne méthode reste celle du rung 6 : on repère deux **maxima consécutifs** de la courbe — le maximum initial à $t=0$ et le deuxième maximum, à la division 4 (l'instant $t_A$, qui touche le pointillé $7\ \text{V}$) — et on compte l'écart en nombre de divisions, qu'on convertit ensuite avec l'étalon.
        steps:
          - math: 'T = 4 \times (\text{1 division}) = 4 \times 7\times10^{-5}\ \text{s}'
            note: "Deux maxima consecutifs (rung 6) : t=0 et t_A, soit 4 divisions - PAS la double fleche imprimee, qui ne couvre qu'une seule division."
          - math: '\boxed{T = 2{,}8\times10^{-4}\ \text{s}}'
            note: "Pseudo-periode ; coherente avec T0 = 2 pi sqrt(L C0) = 2,81e-4 s (L=2mH, Partie 3 du meme sujet ; C0=1 microF, Partie 1)."
      - id: q3
        stem: |-
          **(0,5 pt)** Déterminer, en exploitant la courbe de la figure 3, le signe de l'intensité du courant $i$ entre l'instant $t_A$ et l'instant $t_B$.
        reasoning: |-
          Rung 1 : $i = C_0\frac{du_C}{dt}$, le signe de $i$ suit donc directement le sens de variation de $u_C$. Entre $t_A$ (le deuxième maximum, sur le pointillé $7\ \text{V}$) et $t_B$ (le passage par zéro descendant qui suit, une division plus loin), la courbe est en train de **redescendre** depuis son maximum vers zéro : $u_C$ décroît, donc $\frac{du_C}{dt} < 0$.

          Le courant $i$ est **négatif** entre $t_A$ et $t_B$.
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que : $\dfrac{dE_T}{dt} = -r \cdot i^2$, avec $E_T$ l'énergie totale du circuit à un instant $t$.
        reasoning: |-
          On part de la formule du rung 1, $E_T = \frac{1}{2}C_0 u_C^2 + \frac{1}{2}Li^2$, et on la dérive par rapport au temps — le geste que le rung 1 ne fait jamais explicitement (il énonce la conservation dans le cas idéal ; ici on va plus loin en dérivant dans le cas amorti). On réinjecte ensuite l'équation de la question 1 pour remplacer $\frac{di}{dt}$, ce qui fait apparaître exactement le terme demandé.
        steps:
          - math: '\frac{dE_T}{dt} = C_0\,u_C\frac{du_C}{dt} + L\,i\frac{di}{dt}'
            note: "Derivee de E_T = (1/2)C0 uC^2 + (1/2)L i^2 par rapport au temps (regle de derivation d'un carre)."
          - math: 'i = C_0\frac{du_C}{dt} \implies C_0\,u_C\frac{du_C}{dt} = u_C\,i'
            note: "On remplace du_C/dt par i/C0 (definition du courant, rung 1)."
          - math: 'L\frac{di}{dt} = -u_C - r\,i \quad \text{(loi des mailles, question 1)} \implies L\,i\frac{di}{dt} = -u_C\,i - r\,i^2'
            note: "On isole L di/dt dans l'equation de la question 1, puis on multiplie par i."
          - math: '\frac{dE_T}{dt} = u_C\,i + \left(-u_C\,i - r\,i^2\right)'
            note: "On additionne les deux morceaux calcules ci-dessus."
          - math: '\boxed{\frac{dE_T}{dt} = -r\,i^2}'
            note: "Le terme u_C i se simplifie exactement : il ne reste que la dissipation par effet Joule dans r."
      - id: q5
        stem: |-
          **(0,5 pt)** Calculer $|E_{th}|$, l'énergie dissipée par effet Joule dans le circuit entre les instants $t = 0$ et $t = t_A$.
        reasoning: |-
          $t=0$ et $t_A$ sont tous deux des extrema de $u_C$ (le maximum initial et le deuxième maximum) : le courant y est nul dans les deux cas (rung 1), donc l'énergie totale y est purement électrique. L'énergie dissipée est la différence — rung 3/4, $r$ ne fait que dissiper, jamais restituer, cohérent avec le signe négatif trouvé à la question 3. $u_C(0) = U_0 = 10\ \text{V}$ (donné) et $u_C(t_A) = 7\ \text{V}$ (touche le pointillé, lu sur la figure 3) ; $C_0 = 1\ \mu\text{F}$ vient de la Partie 1 du même sujet (charge par générateur de courant, transcrite sous rc-charge.md) — un pont entre les deux parties du même exercice.
        steps:
          - math: 'E_{th} = E_T(0) - E_T(t_A) = \frac{1}{2}C_0\,u_C(0)^2 - \frac{1}{2}C_0\,u_C(t_A)^2'
