          La méthode est celle du chapitre 3, et le mot « pour que … soit solution » la dicte : **on ne résout pas l'équation, on injecte la solution proposée et on impose qu'elle marche.**

          On dérive deux fois. En posant $\omega_0 = \dfrac{2\pi}{T_0}$ :

          $$q(t) = Q_m\cos(\omega_0 t) \quad\Longrightarrow\quad \frac{\mathrm{d}q}{\mathrm{d}t} = -Q_m\omega_0\sin(\omega_0 t) \quad\Longrightarrow\quad \frac{\mathrm{d}^2q}{\mathrm{d}t^2} = -Q_m\omega_0^2\cos(\omega_0 t) = -\omega_0^2\,q(t)$$

          On reporte dans l'équation de la question 1 :

          $$-\omega_0^2\,q(t) + \frac{1}{LC}\,q(t) = 0 \qquad \Longleftrightarrow \qquad \left[\frac{1}{LC} - \omega_0^2\right] q(t) = 0$$

          **L'argument qui conclut, et qu'il faut écrire.** Cette égalité doit être vraie **à chaque instant**, pas seulement en un point. Or $q(t)$ n'est pas identiquement nulle. Le crochet doit donc être nul :

          $$\omega_0^2 = \frac{1}{LC} \qquad \Longrightarrow \qquad \left(\frac{2\pi}{T_0}\right)^2 = \frac{1}{LC} \qquad \Longrightarrow \qquad \boxed{T_0 = 2\pi\sqrt{LC}}$$

          **Ce que cette formule dit, et qui vaut d'être remarqué.** La période propre ne dépend **que du circuit** — de $L$ et de $C$ —, jamais de la façon dont on l'a excité. Charger le condensateur sous $12\ \text{V}$ ou sous $24\ \text{V}$ change $Q_m$, donc l'amplitude des oscillations, mais **pas leur rythme**. C'est exactement ce qui rendra la question 5-2 possible : on lira une période sur la courbe et on en déduira $L$, sans jamais avoir besoin de connaître l'amplitude — et c'est heureux, puisque l'axe des ordonnées de la figure 2 n'est pas gradué.

          **Le piège de cette question.** Confondre $\omega_0$ et $T_0$, et écrire $T_0 = \dfrac{1}{\sqrt{LC}}$. Le $2\pi$ n'est pas décoratif : il fait la conversion entre la pulsation, qui compte des radians par seconde, et la période, qui compte des secondes par tour. L'oublier fausse $T_0$ d'un facteur $6{,}28$.
