        éditeurs de cette entrée ne doivent PAS réintroduire
        $T=7\times10^{-5}\ \text{s}$ comme pseudo-période — cette valeur est
        morte (même discipline que la mise en garde de bk-2021-n-x4
        ci-dessus sur $T_0=28\ \text{ms}$). SCOPE NOTE : la question 2-4
        exige $C_0 = 1\ \mu\text{F}$, établi dans la Partie 1 du même sujet
