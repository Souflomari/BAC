      - id: q3
        stem: |-
          **3-** (0,25 pt) Vérifier *(sic)* que la période est homogène à un temps.
        reasoning: |-
          Une analyse dimensionnelle se fait **à partir des relations de définition**, jamais de mémoire. Il en faut deux, et ce sont exactement celles qu'on a utilisées à la question 1.

          **Dimension de l'inductance**, tirée de $u = L\dfrac{\mathrm{d}i}{\mathrm{d}t}$ :

          $$[U] = [L]\,\frac{[I]}{[T]} \qquad \Longrightarrow \qquad [L] = \frac{[U]\,[T]}{[I]}$$

          **Dimension de la capacité**, tirée de $q = C\,u$ et de $q = i\,t$ :

          $$[C] = \frac{[Q]}{[U]} = \frac{[I]\,[T]}{[U]}$$

          **Le produit**, où tout se simplifie :

          $$[LC] = \frac{[U][T]}{[I]} \times \frac{[I][T]}{[U]} = [T]^2$$

          Les intensités se compensent, les tensions aussi. Donc $\sqrt{[LC]} = [T]$, et comme $2\pi$ est un nombre sans dimension :

          $$\boxed{\left[2\pi\sqrt{LC}\right] = [T]}$$

          $T_0$ est bien **homogène à un temps**.

          **Pourquoi cette question vaut ses 0,25 point, au-delà du formalisme.** Une analyse dimensionnelle est le **contrôle le moins cher qui existe** : elle attrape une formule mal recopiée sans qu'on ait à refaire le calcul. Si l'on avait écrit $T_0 = 2\pi\sqrt{L/C}$ ou $T_0 = 2\pi LC$, ce test le dirait immédiatement — la première donnerait $[U][T]/([I]) \cdot [U]/([I][T])$, qui n'est pas un temps au carré, et la seconde donnerait un $[T]^2$ non racinné. Prendre l'habitude de ce contrôle avant de faire une application numérique fait gagner des points partout ailleurs.

          **Le piège de cette question.** Répondre « $L$ est en henrys, $C$ en farads, donc $\sqrt{LC}$ est en secondes ». Ce n'est pas une vérification, c'est une affirmation : il faut **remonter aux relations de définition** pour établir ce que valent le henry et le farad en grandeurs de base. C'est précisément ce que la question demande.
        steps:
          - math: 'u = L\frac{\mathrm{d}i}{\mathrm{d}t} \quad\Longrightarrow\quad [L] = \frac{[U]\,[T]}{[I]}'
            note: "Dimension de l'inductance, tiree de sa relation de définition."
          - math: 'q = C\,u \;\text{ et }\; q = i\,t \quad\Longrightarrow\quad [C] = \frac{[I]\,[T]}{[U]}'
            note: "Dimension de la capacité, tiree de ses deux relations de définition."
          - math: '[LC] = \frac{[U][T]}{[I]} \times \frac{[I][T]}{[U]} = [T]^{2}'
            note: "Les intensités et les tensions se compensent : il ne reste qu'un temps au carré."
          - math: '\boxed{\left[2\pi\sqrt{LC}\right] = \sqrt{[T]^{2}} = [T]}'
            note: "2 pi est sans dimension : la période propre est bien homogène a un temps."
      - id: q4
        stem: |-
          **4-** (0,5 pt) Calculer la valeur maximale $Q_m$ de la charge du condensateur.
        reasoning: |-
          Tout se joue sur la lecture de l'énoncé, pas sur le calcul — qui tient en une multiplication.

          **Où et quand la charge est-elle maximale ?** L'énoncé dit qu'on ferme $K$ sur la position 1 « jusqu'à ce que le condensateur soit chargé **complètement** », puis qu'on bascule en position 2 à $t_0 = 0$. Deux conséquences :

          1. à la fin de la charge, le **régime permanent** est atteint : plus aucun courant ne circule, donc plus aucune tension aux bornes du résistor $R$. Toute la f.é.m. du générateur se retrouve alors aux bornes du condensateur, $u_C = E = 12\ \text{V}$ — et la résistance interne du générateur étant négligeable, il n'y a rien d'autre à retrancher. **La valeur de $R$ ne sert donc pas ici** : elle n'a fixé que la *durée* de la charge, pas sa *valeur finale* ;
          2. cette charge-là est la **plus grande** que le condensateur atteindra : à $t = 0$ l'oscillateur démarre au sommet de son amplitude, et le circuit LC idéal ne fait ensuite que redistribuer cette énergie sans jamais en ajouter. D'où $q(0) = Q_m$, ce que la forme $q(t) = Q_m\cos(\omega_0 t)$ dit d'ailleurs déjà : à $t = 0$, le cosinus vaut $1$.

          $$Q_m = C\,E = 4{,}7\times10^{-3} \times 12 = \boxed{5{,}64\times10^{-2}\ \text{C}}$$

          **Le contrôle de cohérence avec la figure 2.** La courbe d'énergie électrique **part d'un maximum** à $t = 0$ — c'est exactement ce que $q(0) = Q_m$ impose, puisque $E_e = \dfrac{q^2}{2C}$ est maximale quand $|q|$ l'est. Le dessin et le raisonnement se confirment mutuellement, et c'est le genre de recoupement qu'il faut chercher systématiquement.

          **Le piège de cette question.** Faire intervenir $R$ dans un pont diviseur, ou retrancher une chute de tension. En régime permanent le courant est nul, donc $u_R = R \times 0 = 0$ : le résistor ne « prend » rien. Il n'aurait servi qu'à ralentir la charge — et l'énoncé, en disant « jusqu'à ce que le condensateur soit chargé complètement », nous dispense justement d'en tenir compte.
        steps:
          - math: '\text{Fin de la charge (position 1)\,: régime permanent} \Rightarrow i = 0 \Rightarrow u_R = 0 \Rightarrow u_C = E'
            note: "En régime permanent aucun courant ne circule : le resistor ne prend aucune tension. R ne fixe que la durée de la charge."
          - math: 'q = C\,u_C \quad\text{et}\quad q(0) = Q_m \quad\text{(le basculement se fait condensateur pleinement chargé)}'
            note: "Définition de la capacité, appliquee à l'instant du basculement. Coherent avec q(t) = Qm cos(omega0 t), qui vaut Qm en t = 0."
          - math: '\boxed{Q_m = C\,E = 4{,}7\times10^{-3} \times 12 = 5{,}64\times10^{-2}\ \text{C}}'
            note: "Charge maximale. Controle : la courbe d'énergie électrique de la figure 2 part bien d'un maximum en t = 0."
      - id: q5
        stem: |-
          **5-** La **figure 2** donne les variations de l'énergie électrique $E_e$ emmagasinée dans le condensateur en fonction du temps. *(Voir sa description en tête d'énoncé.)*

          **5-1-** (0,25 pt) Sachant que la période $T$ de l'énergie est $T = \dfrac{T_0}{2}$, déterminer la valeur de $T_0$.
        reasoning: |-
          Deux gestes, et le second est celui que l'énoncé offre.

          **Geste 1 — lire $T$ sur la courbe.** La période de la courbe d'énergie est l'intervalle qui sépare deux motifs identiques : deux sommets consécutifs, ou deux passages par zéro consécutifs. Sur ce tracé, cet intervalle vaut **trois carreaux de $0{,}05\ \text{s}$** :

          $$T = 3 \times 0{,}05 = 0{,}15\ \text{s}$$

          *(C'est la mesure la mieux tenue de ce sujet : deux chaînes de mesure indépendantes — la géométrie vectorielle de l'original et les pixels du bitmap — s'accordent à $0{,}3\ \%$ près sur $0{,}150\ \text{s}$.)*

          **Geste 2 — remonter à la période propre**, avec la relation que l'énoncé donne :

          $$T = \frac{T_0}{2} \qquad \Longrightarrow \qquad \boxed{T_0 = 2T = 0{,}30\ \text{s}}$$

          **Pourquoi l'énergie oscille DEUX FOIS plus vite que la charge — l'énoncé le donne, mais il faut le comprendre.** L'énergie électrique vaut $E_e = \dfrac{q^2}{2C}$ : elle dépend de $q$ **au carré**. Or $q$ change de signe à chaque demi-période — le condensateur se charge dans un sens, puis dans l'autre — mais $q^2$, lui, **ne voit pas le signe** : il repasse par son maximum à chaque fois que $|q|$ est maximal, c'est-à-dire deux fois par période de $q$. D'où des arches toutes positives, toutes de même hauteur, et deux fois plus serrées que les oscillations de charge. C'est aussi pourquoi la courbe **ne descend jamais sous l'axe** : une énergie ne peut pas être négative.

          **Le piège de cette question, et c'est celui que l'énoncé désamorce à moitié.** Lire $0{,}15\ \text{s}$ et répondre « $T_0 = 0{,}15\ \text{s}$ ». La période lue sur la figure est celle de **l'énergie**, pas celle de la **charge** : il faut la doubler. L'énoncé fournit la relation précisément parce que c'est là que les copies se perdent — encore faut-il l'utiliser dans le bon sens ($T_0 = 2T$, et non $T_0 = T/2$).
        steps:
