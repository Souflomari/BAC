    intro: |-
      **Exercice IV — « Étude de l'amortissement et de l'entretien des oscillations dans un circuit RLC série » (examen national, session normale 2020, Exercice IV — Parties II et III).**

      Le montage partage la bobine $(L, r)$ et la résistance $R = 90\ \Omega$ étudiées en Partie I (réponse d'un dipôle RL à un échelon de tension, hors périmètre ici).

      **II - Décharge d'un condensateur dans un dipôle RL**

      On monte en série, à un instant choisi comme nouvelle origine des dates $t = 0$, un condensateur de capacité $C$, totalement chargé, avec la bobine précédente et un conducteur ohmique de résistance $R = 90\ \Omega$ (figure 3). La courbe de la figure 4 représente l'évolution de la tension $u_c(t)$ aux bornes du condensateur.

      *Figure 3 (schéma) :* boucle série : $R$ en haut (flèche de courant $i$), bobine $(L, r)$ à droite, branche basse = simple fil, condensateur $C$ à gauche. Pas d'interrupteur $K$ ni de flèche $u_L$ sur ce schéma.

      *Figure 4 (courbe) :* $u_C\ (\text{V})$ en fonction de $t\ (\text{ms})$ ; aucune valeur numérique sur l'axe $u_C$ (seul $0$ est repéré). Oscillation pseudopériodique d'amplitude **décroissante** : la courbe part à $t=0$ de sa valeur la plus élevée, descend à un premier minimum (le plus profond) en $t=5$, remonte à un maximum (plus bas que le départ) en $t=10$, redescend à un second minimum (moins profond) en $t=15$, remonte à un maximum (plus bas que celui de $t=10$) en $t=20$, redescend à un troisième minimum (le moins profond) en $t=25$, puis remonte vers un dernier maximum en fin de tracé ($t\approx30$). Les extrema tombent exactement sur les repères $5, 10, 15, 20, 25$ et les passages par zéro à mi-chemin ($2{,}5$ ; $7{,}5$ ; $12{,}5$ ; $17{,}5$ ; $22{,}5$ ; $27{,}5\ \text{ms}$) : pseudo-période lue $T = 10\ \text{ms}$.

      **III - Entretien des oscillations dans un circuit RLC série**

      Pour entretenir les oscillations électriques dans le circuit précédent représenté sur la figure 3, on insère dans ce circuit un générateur $G$ délivrant une tension proportionnelle à l'intensité du courant : $u_G(t) = k \cdot i(t)$ (figure 5). La courbe de la figure 6 représente l'évolution de l'intensité $i(t)$ dans le circuit dans le cas où $k = k_0$.

      *Figure 5 (schéma) :* même boucle série que la figure 3, avec en plus un générateur $G$ (cercle étiqueté « G ») inséré dans la branche basse.

      *Figure 6 (courbe) :* $i\ (\text{mA})$ en fonction de $t\ (\text{ms})$ ; ordonnées $8, 4, 0, -4, -8$. Sinusoïde d'amplitude **constante**, oscillant entre $+8$ et $-8\ \text{mA}$. La courbe part de l'axe à $t=0$ ($i\approx0$) en décroissant immédiatement, atteint un minimum $-8\ \text{mA}$ en $t=2{,}5$, coupe l'axe en $t=5$, atteint un maximum $+8\ \text{mA}$ en $t=7{,}5$, coupe l'axe en $t=10$ — motif qui se répète avec minima à $12{,}5$ et $22{,}5\ \text{ms}$, maxima à $17{,}5$ et $27{,}5\ \text{ms}$. Période $T_0 = 10\ \text{ms}$.
    questions:
      - id: q1a
        part: "II — Décharge d'un condensateur dans un dipôle RL : régime observé"
        stem: |-
          **(0,25 pt)** Quel est le régime d'oscillation mis en évidence par la courbe de la figure 4 ?
        reasoning: |-
          Rung 4 : la courbe oscille (elle change de signe plusieurs fois) mais chaque maximum successif est plus bas que le précédent — amplitude décroissante. C'est exactement la signature du régime pseudo-périodique : ni le régime périodique (amplitude constante, exclu ici), ni le régime apériodique (pas d'oscillation du tout, exclu aussi puisque la courbe croise bien l'axe plusieurs fois).

          Le régime est **pseudo-périodique**.
      - id: q1b
        stem: |-
          **(0,5 pt)** Établir l'équation différentielle vérifiée par la tension $u_c(t)$.
        reasoning: |-
          Même méthode qu'au rung 5 (loi des mailles, cas amorti, exprimé ici en $u_c$ comme à la question 1 du sujet 2019 ci-dessus), mais avec une extension : la résistance qui amortit n'est pas une seule $R$, ce sont **deux** contributions en série — le conducteur ohmique $R=90\ \Omega$ ET la résistance propre $r$ de la bobine $(L,r)$, que le rung 5 ne décompose jamais explicitement. On les additionne au même endroit de la loi des mailles, puisqu'elles jouent exactement le même rôle physique (dissiper par effet Joule).
        steps:
          - math: 'u_C + u_R + u_{bobine} = 0 \qquad \text{avec} \qquad u_{bobine} = L\frac{di}{dt} + r\,i'
            note: "Loi des mailles (rung 5), pas de generateur dans cette partie ; deux resistances ici, R externe et r (resistance propre de la bobine), alors que le rung 5 n'en compte qu'une."
          - math: 'u_c + Ri + ri + L\frac{di}{dt} = 0 \implies u_c + (R+r)i + L\frac{di}{dt} = 0'
            note: "On regroupe les deux termes resistifs, R et r, qui jouent le meme role dans la loi des mailles."
          - math: 'i = C\frac{du_c}{dt} \implies u_c + (R+r)C\frac{du_c}{dt} + LC\frac{d^2u_c}{dt^2} = 0'
            note: "On exprime i en u_c (meme geste qu'au rung 2 et qu'a la question 1 du sujet 2019 ci-dessus)."
          - math: '\boxed{\frac{d^2u_c}{dt^2} + \frac{R+r}{L}\frac{du_c}{dt} + \frac{1}{LC}\,u_c = 0}'
            note: "Division par LC ; forme standard du cas amorti (rung 5), R+r jouant le role de la resistance totale."
      - id: q1c
        stem: |-
          **(0,5 pt)** Sachant que la pseudopériode est égale à la période propre, trouver la capacité $C$ du condensateur. (On prend : $\pi^{2} = 10$).
        reasoning: |-
          L'énoncé donne ici l'approximation du rung 6 ($T \approx T_0$ pour un amortissement faible) comme une égalité à utiliser directement : $T_0 = T = 10\ \text{ms}$, lu sur la figure 4 par la méthode du rung 6 (extrema exactement espacés de $10\ \text{ms}$). On inverse ensuite $T_0 = 2\pi\sqrt{LC}$ (rung 2) pour isoler $C$, avec $L = 1\ \text{H}$ — une valeur établie en Partie I (réponse du dipôle RL, hors périmètre RLC, transcrite sous dipole-rl.md), pas une donnée de cette partie-ci.
        steps:
          - math: 'T_0 = T = 10\ \text{ms}'
            note: "Pseudo-periode lue sur la figure 4 (rung 6), prise egale a T0 par hypothese de l'enonce."
          - math: 'T_0 = 2\pi\sqrt{LC} \implies C = \frac{T_0^2}{4\pi^2 L}'
            note: "On isole C (rung 2)."
          - math: 'C = \frac{(10\times10^{-3})^2}{4\times10\times1} = \frac{10^{-4}}{40}'
            note: "Application numerique, avec L = 1 H (etabli en Partie I, hors perimetre RLC, transcrite sous dipole-rl.md) et pi^2 = 10 donne par l'enonce."
          - math: '\boxed{C = 2{,}5\ \mu\text{F}}'
            note: "Valeur ronde, coherente avec les autres sujets de cette banque."
      - id: q2a
        part: "III — Entretien des oscillations dans un circuit RLC série"
        stem: |-
          **(0,5 pt)** Trouver, dans le système international d'unités, la valeur de $k_0$.
        reasoning: |-
          Le rung 7 donne la condition d'entretien pour une seule résistance ($k=R$). Ici, comme à la question 1b, deux résistances dissipent en série — $R$ et $r$ — donc la condition se généralise : le coefficient d'amortissement de la loi des mailles avec générateur est $(R+r-k)$, et l'entretien l'annule, soit $k_0 = R+r$. $R=90\ \Omega$ est donné dans cette partie ; $r=10\ \Omega$ vient de la Partie I (dipole-rl.md, hors périmètre RLC).
        steps:
          - math: 'u_C + u_R + u_{bobine} = u_G \implies L\frac{d^2q}{dt^2} + (R+r-k)\frac{dq}{dt} + \frac{q}{C} = 0'
            note: "Meme substitution qu'au rung 7, avec R remplace par R+r (les deux resistances s'additionnent dans la loi des mailles, comme a la question 1b)."
          - math: 'k_0 = R + r = 90 + 10'
            note: "Entretien (rung 7) : on annule le coefficient (R+r-k) ; r = 10 ohms etabli en Partie I (dipole-rl.md, hors perimetre RLC)."
          - math: '\boxed{k_0 = 100\ \text{(unites SI)}}'
            note: "k0 est homogene a une resistance (u_G = k.i), donc s'exprime en ohms."
      - id: q2b
        stem: |-
          **(0,75 pt)** Sachant que l'expression de l'intensité $i(t)$ dans le circuit s'écrit ainsi : $i(t) = I_m\cos\!\left(\dfrac{2\pi}{T_0}\, t + \varphi\right)$, déterminer les valeurs de $I_m$, $T_0$ et $\varphi$.
        reasoning: |-
          Sous entretien, le circuit obéit à l'équation idéale (rung 7) : $i(t)$ est un cosinus pur, exactement la forme donnée. $I_m$ se lit directement comme l'amplitude de la figure 6 ; $T_0$ se lit comme l'écart entre deux extrema consécutifs (rung 6) — et coïncide avec la pseudo-période de la figure 4, comme l'énoncé le suggère. Pour $\varphi$, on utilise la condition initiale : la courbe part de l'axe ($i(0)=0$) en décroissant, ce qui fixe le signe de $\varphi$ sans ambiguïté.
        steps:
          - math: 'I_m = 8{,}0\ \text{mA} = 8{,}0\times10^{-3}\ \text{A}'
            note: "Lecture directe de l'amplitude sur la figure 6 (courbe entre +8 et -8 mA)."
          - math: 'T_0 = 10\ \text{ms}'
            note: "Ecart entre deux extrema consecutifs (rung 6) ; identique a la pseudo-periode mesuree sur la figure 4, comme l'enonce le suggere."
          - math: 'i(0) = I_m\cos\varphi = 0 \quad \text{et} \quad \left.\frac{di}{dt}\right|_{t=0} < 0'
            note: "La courbe part de zero en decroissant a t=0 (figure 6)."
          - math: '\boxed{\varphi = \frac{\pi}{2}}'
            note: "Seul phi = pi/2 donne a la fois cos(phi)=0 et une pente negative a l'origine (phi = -pi/2 donnerait une pente positive)."
      - id: q2c
        stem: |-
          **(0,5 pt)** Déterminer l'énergie totale $E_t$ du circuit.
        reasoning: |-
          Comme au sujet 2019 ci-dessus (question 4a), le régime est maintenant équivalent au cas idéal (rung 1) : l'énergie totale est conservée et se calcule au moment le plus simple, ici le maximum du courant ($u_C = 0$, toute l'énergie est magnétique).
        steps:
          - math: 'E_t = \frac{1}{2}L\,I_m^2 = \frac{1}{2}\times1\times(8{,}0\times10^{-3})^2'
            note: "Au maximum du courant, toute l'energie est dans la bobine (rung 1) ; en regime entretenu l'energie totale est constante, ce calcul vaut a tout instant."
          - math: '\boxed{E_t \approx 3{,}2\times10^{-5}\ \text{J}}'
            note: "Application numerique."
      - id: q2d
        stem: |-
          **(0,5 pt)** Trouver l'énergie électrique $E_{e1}$ emmagasinée dans le condensateur à l'instant $t_1 = 16\ \text{ms}$.
        reasoning: |-
          Même geste qu'au sujet 2019 ci-dessus (question 4b) : conservation de l'énergie totale (rung 1), $E_{e1} = E_t - E_m(t_1)$. On calcule d'abord $E_m(t_1)$ à partir de $i(t_1)$, évalué avec l'expression identifiée à la question précédente.
        steps:
          - math: 'i(t_1) = I_m\cos\!\left(\frac{2\pi}{T_0}t_1+\varphi\right) = 8{,}0\times10^{-3}\cos\!\left(\frac{2\pi}{10}\times16+\frac{\pi}{2}\right)'
            note: "On evalue i(t) a t1 = 16 ms avec les valeurs de la question precedente."
          - math: 'i(t_1) \approx 8{,}0\times10^{-3}\times0{,}588 \approx 4{,}7\times10^{-3}\ \text{A}'
            note: "L'angle vaut 3,7 pi radians, soit 306 degres apres reduction modulo 2 pi ; cosinus environ 0,588."
          - math: 'E_m(t_1) = \frac{1}{2}L\,i(t_1)^2 = \frac{1}{2}\times1\times(4{,}7\times10^{-3})^2 \approx 1{,}1\times10^{-5}\ \text{J}'
            note: "Energie magnetique a cet instant."
          - math: '\boxed{E_{e1} = E_t - E_m(t_1) \approx 3{,}2\times10^{-5} - 1{,}1\times10^{-5} \approx 2{,}1\times10^{-5}\ \text{J}}'
            note: "Conservation de l'energie totale (rung 1) : ce qui n'est pas dans la bobine est dans le condensateur."

