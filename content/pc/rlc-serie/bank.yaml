        $E_{e1}\approx2{,}1\times10^{-5}\ \text{J}$ — conforme. Aucune
        divergence avec la note de vérification du sujet. SCOPE NOTES (voir
        l'en-tête du fichier) : q1c exige $L=1\ \text{H}$ et q2a exige
