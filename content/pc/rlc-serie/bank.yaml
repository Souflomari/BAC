    questions:
      - id: q1
        part: "Electricité — Deuxième expérience (circuit RLC série en régime libre)"
        stem: |-
          **1-** (0,25 pt) A quel des trois régimes d'oscillations, correspond la courbe de la figure 4 ? *(La consigne est reproduite telle qu'imprimée : « Auquel des trois régimes […] correspond » serait attendu, et la virgule entre sujet et verbe est parasite. C'est la seule faute de syntaxe du sujet qui tombe dans une consigne notée.)*
        reasoning: |-
          le chapitre 5 pose les trois régimes, et le critère de tri est visuel avant d'être calculatoire — **combien de fois la tension change-t-elle de signe ?**

          - **Régime périodique** : amplitude constante, oscillation qui ne s'éteint jamais. C'est le cas idéal $R = 0$, jamais observé sur un vrai circuit.
          - **Régime pseudo-périodique** : la tension **oscille encore** — elle change de signe à intervalles réguliers — mais l'amplitude **décroît** d'une alternance à l'autre.
          - **Régime apériodique** : plus d'oscillation du tout ; la tension revient vers zéro sans jamais changer de signe (ou une seule fois, dans le cas critique).

          Sur la figure 4, la courbe coupe l'axe **cinq fois** et présente deux maxima et deux minima nets, tandis que les amplitudes successives diminuent ($4{,}5$, puis $4{,}0$, puis $3{,}8$, puis $3{,}5$, puis $3{,}3\ \text{V}$). Les deux critères sont réunis :

          $$\boxed{\text{régime pseudo-périodique}}$$

          **Le contrôle par le calcul** (chapitre 5) : le régime est pseudo-périodique tant que la résistance totale reste inférieure à la résistance critique,

          $$R_{tot} < 2\sqrt{\frac{L}{C}} = 2\sqrt{\frac{0{,}2}{0{,}2\times10^{-6}}} = 2\sqrt{10^{6}} = 2\,000\ \Omega$$

          Ici $R_{tot} = R' + r = 208{,}4\ \Omega$, très en dessous : le circuit **doit** osciller, et il oscille. *(Le calcul et le dessin sont d'accord sur la NATURE du régime — c'est la seule chose que ce contrôle établit. Sur la vitesse d'amortissement, ils divergent : voir l'avertissement en tête d'énoncé.)*

          **Le piège de cette question.** Répondre « apériodique » parce que « l'amplitude diminue » : la décroissance de l'amplitude est justement la signature du pseudo-périodique. Ce qui distingue l'apériodique, c'est l'**absence d'oscillation**, pas l'amortissement.
      - id: q2
        stem: |-
          **2-** (0,5 pt) Établir l'équation différentielle vérifiée par la tension $u_C$.
        reasoning: |-
          **La méthode du chapitre 6, en trois gestes** — c'est la même que dans le cas idéal (chapitre 3), avec un terme de plus.

          **1. Loi des mailles sur le circuit fermé.** Il n'y a pas de générateur : la somme des tensions sur la boucle est nulle. En orientant comme la figure 3 :

          $$u_C + u_{R'} + u_b = 0$$

          **2. Chaque tension par sa loi caractéristique**, en gardant les deux termes de la bobine réelle :

          $$u_{R'} = R'\,i \qquad u_b = r\,i + L\,\frac{di}{dt}$$

          **3. Tout ramener à $u_C$.** L'intensité est le débit de charge du condensateur, et la charge est reliée à la tension par $q = C\,u_C$ :

          $$i = \frac{dq}{dt} = C\,\frac{du_C}{dt} \qquad\text{donc}\qquad \frac{di}{dt} = C\,\frac{d^2u_C}{dt^2}$$

          En substituant puis en divisant toute la ligne par $L\,C$ pour normaliser le coefficient de la dérivée seconde :

          $$u_C + (R'+r)\,C\,\frac{du_C}{dt} + L\,C\,\frac{d^2u_C}{dt^2} = 0$$

          $$\boxed{\frac{d^2u_C}{dt^2} + \frac{R'+r}{L}\,\frac{du_C}{dt} + \frac{1}{L\,C}\,u_C = 0}$$

          **Ce que chaque terme raconte** (chapitre 4). Le terme en dérivée seconde et le terme en $u_C$ sont ceux de l'oscillateur idéal : ce sont eux qui produisent le balancement d'énergie entre condensateur et bobine. Le terme du **milieu**, celui en $\dfrac{du_C}{dt}$, est le **frein** : il porte la résistance totale, il n'existe que parce que le circuit dissipe, et c'est lui qui fera décroître l'enveloppe. Le supprimer — c'est exactement ce que la question 5 va chercher à faire — rend les oscillations sinusoïdales.

          **Le piège de cette question.** Oublier $r$ et écrire $R'/L$ : la bobine est réelle, sa résistance interne est en série avec $R'$, et c'est la **somme** $R' + r = 208{,}4\ \Omega$ qui amortit. Second piège : écrire $i = -C\,du_C/dt$ sans que le schéma le justifie — le signe se lit sur l'orientation de la figure 3, pas sur l'habitude.
        steps:
          - math: 'u_C + u_{R^{\prime}} + u_b = 0'
            note: "Loi des mailles : aucun générateur dans le circuit, la somme des tensions est nulle."
          - math: 'u_{R^{\prime}} = R^{\prime}\,i \qquad u_b = r\,i + L\,\frac{di}{dt}'
            note: "Loi d'Ohm pour le resistor ; relation de la bobine réelle, avec ses deux termes."
          - math: 'i = C\,\frac{du_C}{dt} \qquad \frac{di}{dt} = C\,\frac{d^2u_C}{dt^2}'
            note: "L'intensité est le débit de charge du condensateur, avec q = C u_C."
          - math: 'L\,C\,\frac{d^2u_C}{dt^2} + (R^{\prime}+r)\,C\,\frac{du_C}{dt} + u_C = 0'
            note: "Substitution dans la loi des mailles."
          - math: '\boxed{\frac{d^2u_C}{dt^2} + \frac{R^{\prime}+r}{L}\frac{du_C}{dt} + \frac{1}{LC}\,u_C = 0}'
            note: "Division par LC : forme normalisee. Le terme du milieu est le frein, il porte la résistance TOTALE."
      - id: q3
        stem: |-
          **3-** (0,5 pt) En considérant que la pseudopériode $T$ est égale la *(sic, pour « égale **à** la »)* période propre $T_0$ de l'oscillateur LC, vérifier la valeur de l'inductance de la bobine étudiée. *(L'original arabe précise « la valeur du coefficient d'induction **$L$** de la bobine étudiée » ; le symbole est tombé dans l'édition française — sans conséquence, $L$ étant défini dans la première expérience.)*
        reasoning: |-
          **L'approximation que la consigne autorise.** En toute rigueur, la pseudo-période d'un circuit amorti est légèrement supérieure à la période propre. Mais tant que l'amortissement reste faible devant la résistance critique — ici $208{,}4\ \Omega$ contre $2\,000\ \Omega$ —, l'écart est négligeable, et la consigne dit explicitement de poser $T = T_0$. On utilise donc la formule de Thomson du chapitre 3 :

          $$T_0 = 2\pi\sqrt{L\,C} \qquad\Longrightarrow\qquad L = \frac{T^2}{4\pi^2\,C}$$

          **La lecture de $T$, et c'est là tout le travail.** L'axe des temps ne porte **qu'un seul** repère chiffré, $\dfrac{\pi}{5}$, et il tombe sur la **deuxième** ligne forte du quadrillage. Deux façons de conclure, qui donnent la même chose :

          - le repère $\pi/5\ \text{ms}$ marque la **demi**-pseudo-période (c'est l'intervalle entre deux passages par zéro consécutifs de même sens de traversée), donc $T = 2 \times \dfrac{\pi}{5} = \dfrac{2\pi}{5}\ \text{ms}$ ;
          - ou bien : une cellule forte vaut $\pi/10\ \text{ms}$, et une pseudo-période en couvre quatre.

          $$T = \frac{2\pi}{5}\times10^{-3}\ \text{s} \approx 1{,}26\ \text{ms}$$

          **Le calcul, et pourquoi il tombe rond.**

          $$L = \frac{T^2}{4\pi^2 C} = \frac{\left(\dfrac{2\pi}{5}\right)^2\times10^{-6}}{4\pi^2 \times 0{,}2\times10^{-6}} = \frac{\dfrac{4\pi^2}{25}}{4\pi^2 \times 0{,}2} = \frac{1}{25 \times 0{,}2} = \frac{1}{5}$$

          $$\boxed{L = 0{,}200\ \text{H}}$$

          **Les $\pi^2$ se simplifient exactement** : le repère $\pi/5$ n'a pas été choisi au hasard, il est là pour que $L$ tombe sur $1/5$ sans arrondi. Ce n'est pas une approximation, c'est exact.

          **Ce que « vérifier » veut dire ici.** La première expérience (entrée bk-2013-r-x3) avait trouvé $L = \tau\,(R+r) = 0{,}2016\ \text{H}$ par une lecture de constante de temps sur un tout autre montage. Les deux valeurs concordent à $0{,}8\ \%$ : **la vérification réussit**, et c'est bien ce que la consigne demandait — pas de recalculer $L$ à neuf, mais de confirmer la valeur déjà obtenue par une seconde voie indépendante.

          **Le piège de cette question.** Prendre $T = \pi/5\ \text{ms}$ en croyant que le repère marque la période entière : $L$ sortirait quatre fois trop petit ($0{,}05\ \text{H}$), et la « vérification » échouerait sans qu'on sache pourquoi. Compte les passages par zéro avant de conclure.
        steps:
          - math: 'T = T_0 = 2\pi\sqrt{LC} \implies L = \frac{T^2}{4\pi^2 C}'
            note: "Formule de Thomson (chapitre 3), inversee. L'approximation T = T0 est autorisee par la consigne."
          - math: 'T = 2\times\frac{\pi}{5} = \frac{2\pi}{5}\ \text{ms} \approx 1{,}26\ \text{ms}'
            note: "Lecture sur la figure 4 : le repère pi/5 marque la demi-pseudo-periode."
          - math: 'L = \frac{\left(\frac{2\pi}{5}\right)^2\times10^{-6}}{4\pi^2\times 0{,}2\times10^{-6}} = \frac{4\pi^2/25}{4\pi^2\times 0{,}2}'
            note: "Application numérique : les pi carré se simplifient exactement, le repère pi/5 est choisi pour cela."
          - math: '\boxed{L = \frac{1}{5} = 0{,}200\ \text{H}}'
            note: "Vérification reussie : la première expérience donnait 0,2016 H, soit 0,8 pourcent d'écart."
      - id: q4
        stem: |-
          **4-** (0,5 pt) Calculer l'énergie dissipée par effet joule *(sic — « effet **Joule** », éponyme, prend une majuscule)* entre les instants $t_0 = 0$ et $t_1 = \dfrac{3}{2}T$.
        reasoning: |-
          **CROSS-LIST honoré ici (« Aspects énergétiques »).** Le bilan d'énergie d'un oscillateur amorti relève aussi de cette autre notion. Il pèse cette seule question, $0{,}5\ \text{pt}$ sur les $2{,}75$ du bloc : la règle de la maison veut qu'un cross-list de ce poids — et orphelin, une seule question — soit honoré dans le raisonnement plutôt que dédoublé en entrée. La démonstration est donc refaite ici en entier.

          **Le principe, et il tient en une phrase** (chapitre 2, puis R3). L'énergie totale du circuit se partage à chaque instant entre le condensateur et la bobine :

          $$\mathcal{E}(t) = \underbrace{\frac{1}{2}C\,u_C^2}_{\text{électrostatique}} + \underbrace{\frac{1}{2}L\,i^2}_{\text{magnétique}}$$

          Cette énergie **diminue**, et tout ce qu'elle perd est dissipé par effet Joule dans $R' + r$. L'énergie dissipée entre deux instants est donc simplement la **différence** des énergies totales :

          $$W_J = \mathcal{E}(t_0) - \mathcal{E}(t_1)$$

          **L'astuce que le sujet a préparée, et c'est elle qui rend la question faisable.** Aux **deux** instants demandés, le courant est **nul** :

          - à $t_0 = 0$, le condensateur est initialement chargé complètement et on vient de fermer le circuit : rien ne circule encore ;
          - à $t_1 = \dfrac{3}{2}T$, la courbe $u_C(t)$ passe par un **extremum** — or $i = C\,\dfrac{du_C}{dt}$, et la dérivée d'une fonction est nulle en son extremum.

          Le terme magnétique $\frac12 L i^2$ s'annule donc aux deux bornes, et il ne reste que l'électrostatique :

          $$\boxed{W_J = \frac{1}{2}C\left[u_C^2(0) - u_C^2\!\left(\tfrac{3}{2}T\right)\right]}$$

          **Les deux lectures sur la figure 4** — et c'est bien ce que la consigne demande, **lire**, pas calculer :

          $$u_C(0) = 4{,}5\ \text{V} \qquad u_C\!\left(\tfrac{3}{2}T\right) = -3{,}5\ \text{V}$$

          *(La seconde valeur est le deuxième minimum de la courbe. Il tombe bien à $3T/2$ : mesuré sur le tracé, l'extremum est à $1{,}881\ \text{ms}$ contre $3T/2 = 1{,}887\ \text{ms}$.)*

          $$W_J = \frac{1}{2}\times 0{,}2\times10^{-6}\times\left(4{,}5^2 - 3{,}5^2\right) = 0{,}1\times10^{-6}\times(20{,}25 - 12{,}25)$$

          $$\boxed{W_J = 8{,}0\times10^{-7}\ \text{J} = 0{,}80\ \mu\text{J}}$$

          **⚠️ La garde de cette question, et elle est la raison pour laquelle l'avertissement figure en tête d'énoncé.** Cette valeur est cohérente avec le **dessin**, pas avec la résistance imprimée du circuit. Un calcul de $u_C(3T/2)$ à partir de $R' + r = 208{,}4\ \Omega$ donnerait $1{,}67\ \text{V}$ et une énergie dissipée de $1{,}72\ \mu\text{J}$ — plus du double. **La consigne demande de lire, et il faut lire** : c'est la seule voie cohérente avec la figure, et c'est celle que le sujet attend.

          **Le piège de cette question.** Prendre le signe de $u_C(3T/2)$ au sérieux dans le calcul : l'énergie dépend du **carré** de la tension, donc $(-3{,}5)^2 = 12{,}25$, et le signe disparaît. Second piège : oublier que le courant est nul aux deux bornes et tenter de calculer $\frac12 L i^2$ — inutile, et impossible sans dériver la courbe à la main.
        steps:
          - math: '\mathcal{E} = \frac{1}{2}C\,u_C^2 + \frac{1}{2}L\,i^2'
            note: "Énergie totale du circuit : electrostatique dans le condensateur, magnetique dans la bobine (chapitre 2)."
          - math: 'i(t_0) = 0 \quad\text{et}\quad i(t_1) = 0 \qquad \left(i = C\frac{du_C}{dt},\ \text{nul aux extremums de } u_C\right)'
            note: "A t = 0 le circuit vient d'être ferme ; a t = 3T/2 la courbe passe par un extremum. Le terme magnetique s'annule aux deux bornes."
          - math: '\boxed{W_J = \frac{1}{2}C\left[u_C^2(0) - u_C^2\!\left(\tfrac{3}{2}T\right)\right]}'
            note: "L'énergie dissipée par effet Joule est la différence des énergies totales, ici purement electrostatiques."
          - math: 'u_C(0) = 4{,}5\ \text{V} \qquad u_C\!\left(\tfrac{3}{2}T\right) = -3{,}5\ \text{V}'
            note: "Deux LECTURES sur la figure 4, comme la consigne le demande. Ne jamais recalculer ces amplitudes depuis R prime et r : voir l'avertissement en tête d'énoncé."
          - math: 'W_J = \frac{1}{2}\times 0{,}2\times10^{-6}\times\left(4{,}5^2 - 3{,}5^2\right) = 0{,}1\times10^{-6}\times 8{,}0'
            note: "Application numérique : le signe de la seconde amplitude disparaît, l'énergie dépend du carré."
          - math: '\boxed{W_J = 8{,}0\times10^{-7}\ \text{J} = 0{,}80\ \mu\text{J}}'
            note: "Valeur mesurée sur le trace avec les amplitudes fines (4,471 et 3,458) : 0,807 microjoule."
      - id: q5
        part: "5- Entretien des oscillations"
        stem: |-
          **5-1-** (0,5 pt) Pour compenser l'énergie dissipée, on monte en sérié *(sic)* dans le circuit précédent (figure 3), un générateur maintenant entre ses bornes une tension $u_G$ proportinnelle *(sic)* à l'intensité du courant, tel que $u_G(t) = k\cdot i(t)$.

          Établir, dans ce cas, l'équation différentielle vérifiée par la charge $q(t)$ du condensateur.
        reasoning: |-
          C'est exactement le dispositif du chapitre 8 — le générateur d'entretien —, et la démarche est celle de la question 2, avec **une** modification : la somme des tensions n'est plus nulle, elle vaut $u_G$.

          **1. La loi des mailles, avec le générateur.**

          $$u_C + u_{R'} + u_b = u_G = k\,i$$

          **2. Tout exprimer avec $q$**, puisque c'est la variable demandée. Ici la relation à connaître est $i = \dfrac{dq}{dt}$, et la charge se relie à la tension du condensateur par $u_C = \dfrac{q}{C}$ :

          $$\frac{q}{C} + R'\,\frac{dq}{dt} + r\,\frac{dq}{dt} + L\,\frac{d^2q}{dt^2} = k\,\frac{dq}{dt}$$

          **3. Tout passer à gauche et regrouper les termes en $\dfrac{dq}{dt}$** — c'est ce regroupement qui est le cœur de la question :

          $$L\,\frac{d^2q}{dt^2} + \left(R' + r - k\right)\frac{dq}{dt} + \frac{q}{C} = 0$$

          En divisant par $L$ :

          $$\boxed{\frac{d^2q}{dt^2} + \frac{R' + r - k}{L}\,\frac{dq}{dt} + \frac{1}{L\,C}\,q = 0}$$

          **Ce que cette équation dit, et pourquoi elle prépare la question suivante.** Elle a exactement la forme de celle de la question 2 — même dérivée seconde, même terme de rappel —, mais le coefficient d'amortissement n'est plus $R' + r$ : c'est $R' + r - k$. Le générateur **retranche** de la résistance : il injecte à chaque instant une énergie proportionnelle au courant, c'est-à-dire exactement là où l'effet Joule en prélève. Régler $k$, c'est régler le frein.

          **Le piège de cette question, et le corrigé officiel arabe y est tombé.** Le dernier terme est $\dfrac{q}{LC}$, avec le $q$ : une équation qui s'arrêterait à $\dfrac{1}{LC}$ serait **dimensionnellement incohérente** (on additionnerait une charge par seconde carrée et un inverse de temps carré). Vérifie toujours qu'aucune variable n'a disparu en recopiant. Second piège : oublier $r$ et écrire $R' - k$ — la résistance interne de la bobine reste dans la maille.
        steps:
          - math: 'u_C + u_{R^{\prime}} + u_b = u_G = k\,i'
            note: "Loi des mailles avec le générateur d'entretien : la somme des tensions n'est plus nulle."
          - math: 'u_C = \frac{q}{C} \qquad i = \frac{dq}{dt} \qquad u_b = r\,\frac{dq}{dt} + L\,\frac{d^2q}{dt^2}'
            note: "Toutes les tensions exprimees avec la charge q, la variable demandee."
          - math: '\frac{q}{C} + (R^{\prime}+r)\frac{dq}{dt} + L\frac{d^2q}{dt^2} = k\,\frac{dq}{dt}'
            note: "Substitution dans la loi des mailles."
          - math: 'L\,\frac{d^2q}{dt^2} + \left(R^{\prime}+r-k\right)\frac{dq}{dt} + \frac{q}{C} = 0'
            note: "Regroupement des termes du premier ordre : le générateur retranche k de la résistance."
          - math: '\boxed{\frac{d^2q}{dt^2} + \frac{R^{\prime}+r-k}{L}\frac{dq}{dt} + \frac{1}{LC}\,q = 0}'
            note: "Division par L. Attention : le dernier terme porte bien q, sans quoi l'équation serait dimensionnellement incoherente."
      - id: q6
        stem: |-
          **5-2-** (0,5 pt) On fixe le paramètre $k$ sur la valeur $208{,}4$ pour obtenir des oscillations électriques sinusoïdales. Vérifier la valeur de la résistance $r$ de la bobine étudiée.
        reasoning: |-
          **La condition d'entretien, c'est le chapitre 8.** Des oscillations **sinusoïdales** sont des oscillations d'amplitude **constante** : l'enveloppe ne décroît plus. Or, dans l'équation de la question 5-1, tout l'amortissement est porté par le terme du premier ordre. Il faut donc, et il suffit, que son coefficient s'annule :

          $$R' + r - k = 0$$

          L'équation se réduit alors à $\dfrac{d^2q}{dt^2} + \dfrac{1}{LC}\,q = 0$ — l'oscillateur harmonique idéal du chapitre 3, dont la solution est une sinusoïde pure de période $T_0 = 2\pi\sqrt{LC}$.

          **L'inversion, immédiate :**

          $$\boxed{r = k - R' = 208{,}4 - 200 = 8{,}4\ \Omega}$$

          **Ce que « vérifier » veut dire ici, et pourquoi c'est le plus beau bouclage du sujet.** Cette valeur n'est pas nouvelle : la **première expérience** (entrée bk-2013-r-x3, question 3-1) l'avait obtenue en lisant l'asymptote de la courbe $u_R(t)$ sur un tout autre montage — $r = R\left(\dfrac{E}{u_R(\infty)} - 1\right) = 42\left(\dfrac{12}{10}-1\right) = 8{,}4\ \Omega$. Deux chaînes **totalement indépendantes** :

          - l'une **graphique**, sur un dipôle RL en régime transitoire ;
          - l'autre **purement algébrique**, sur un circuit RLC entretenu, sans lire aucune courbe.

          Elles donnent le même nombre. C'est la meilleure validation possible d'une mesure expérimentale, et c'est manifestement ce que le sujet cherchait en construisant l'exercice en deux expériences sur **la même** bobine.

          **Et c'est aussi la seule question de ce bloc que le défaut de la figure 4 ne touche pas** : elle ne lit rien sur la courbe. Elle est donc entièrement à l'abri de l'avertissement porté en tête d'énoncé.

          **Le piège de cette question.** Écrire $k = R'$ en oubliant $r$, par analogie mécanique avec la « condition d'entretien $k = R$ » du cours : dans ce circuit-ci, la résistance à compenser est la résistance **totale** de la maille, $R' + r$, résistance interne de la bobine comprise. Le cours dit $k = R_{tot}$ ; ici $R_{tot} = R' + r$.
        steps:
          - math: '\frac{d^2q}{dt^2} + \frac{R^{\prime}+r-k}{L}\frac{dq}{dt} + \frac{1}{LC}\,q = 0'
            note: "Équation etablie a la question 5-1 : tout l'amortissement est dans le terme du premier ordre."
          - math: '\text{oscillations sinusoidales} \iff R^{\prime}+r-k = 0'
            note: "Condition d'entretien (chapitre 8) : le coefficient d'amortissement doit s'annuler."
          - math: '\frac{d^2q}{dt^2} + \frac{1}{LC}\,q = 0'
            note: "Ce qui reste : l'oscillateur harmonique ideal, de solution sinusoidale pure."
          - math: '\boxed{r = k - R^{\prime} = 208{,}4 - 200 = 8{,}4\ \Omega}'
            note: "Vérification reussie : la première expérience donnait déjà 8,4 ohms par lecture graphique, sur un autre montage."

