entries:
  # ── bk-2019-n-x3 — 2019 N, Exercice III (Partie II) : oscillations LC idéales ──
  - id: bk-2019-n-x3
    title: "Oscillations libres dans un circuit LC : identifier la courbe, période propre et bilan énergétique"
    source:
      year: 2019
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice III — II. Étude des oscillations électriques dans le circuit LC"
    bareme_total: 2.5
    duration_min: 15
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/68300 (Exercice III, Partie II —
        oscillations électriques dans un circuit LC idéal, sans amortissement ;
        barème de la partie = 2,5 pt sur les 4,5 pt de l'exercice complet, dont
        la Partie I — charge du condensateur — est transcrite sous
        rc-charge.md, bk-2019-n-x3 là-bas). Transcription vérifiée : re-fetch
        indépendant AlloSchool + diff OK (agent-vérificateur, 2026-07-11 ;
        docs/sujets/pc/rlc-serie.md, statut « vérifié »). SCOPE NOTE (voir
        l'en-tête du fichier) : la question 3 (inductance $L$) exige la valeur
        $C = 10\ \mu\text{F}$ établie dans la Partie I du même sujet, transcrite
        sous une autre notion (rc-charge) — pontée au point d'usage. FLAG
        RECOUPEMENT (voir l'en-tête du fichier) : ce sujet est exactement celui
        que la note de sourcing de r8-bac (exercises.yaml) cite comme
        « sujet vérifié existant mais de mauvaise portée » (r8-bac traite le
        cas amorti ; ce sujet-ci ne couvre que le cas idéal, LC pur) — confirme
        le diagnostic de r8-bac, ne le résout pas.
    intro: |-
      **Charge et décharge d'un condensateur — II. Étude des oscillations électriques dans le circuit LC (examen national, session normale 2019, Exercice III — Partie II).**

      Une fois que le régime permanent est établi, on bascule l'interrupteur $K$ en position (2) à un instant choisi comme nouvelle origine des dates ($t=0$). On visualise, à l'aide d'un dispositif adéquat, les variations de la tension $u_c$ aux bornes du condensateur en fonction du temps.

      **Figure 3 (trois courbes $u_c(\text{V})$ en fonction de $t(\text{ms})$, ordonnées graduées de $-10$ à $10$, abscisses avec repères $10$ et $20$) :**
      - **(a)** : part de $u_c = +10\ \text{V}$ à $t=0$, oscillation d'amplitude **décroissante** (allure pseudopériodique) — premier minimum $\approx -6\ \text{V}$ vers $t\approx 10$, remontée à $\approx +4\ \text{V}$ vers $t\approx 20$.
      - **(b)** : part de $u_c = +10\ \text{V}$ (maximum) à $t=0$, sinusoïde d'amplitude **constante** $10\ \text{V}$ ; minimum $-10\ \text{V}$ vers $t\approx 10$, maximum $+10\ \text{V}$ vers $t\approx 20$ (période $\approx 20\ \text{ms}$).
      - **(c)** : sinusoïde d'amplitude constante $10\ \text{V}$, mais **déphasée** — à $t=0$ elle ne part pas d'un extremum (démarre près de zéro puis croît).
    questions:
      - id: q1
        part: "II — Étude des oscillations électriques dans le circuit LC : établir le modèle"
        stem: |-
          **(0,25 pt)** Montrer que l'équation différentielle vérifiée par la tension $u_c(t)$ aux bornes du condensateur s'écrit : $\dfrac{d^{2}u_c}{dt^{2}} + \dfrac{1}{LC}\, u_c = 0$.
        reasoning: |-
          Même mécanisme qu'au rung 2, mais l'énoncé demande la relation directement en $u_c$ plutôt qu'en $q$ — les deux variables sont liées par $q = C u_c$. Circuit LC idéal (rien n'indique de résistance sur cette branche : c'est le cas $R \approx 0$ du rung 3) : la loi des mailles donne $u_C + u_L = 0$. On exprime le courant à partir de $u_c$ plutôt que l'inverse ($i = C\frac{du_c}{dt}$, la même relation $i = \frac{dq}{dt}$ du rung 1 réécrite avec $q = Cu_c$), puis $u_L$ suit — le même geste qu'au rung 2, juste réarrangé pour éliminer $q$ au profit de $u_c$.
        steps:
          - math: 'u_C + u_L = 0'
            note: "Loi des mailles, cas ideal (R negligeable), comme au rung 2."
          - math: 'i = \frac{dq}{dt} = C\frac{du_c}{dt}'
            note: "On exprime le courant directement en u_c (q = C u_c), plutot qu'en q comme au rung 2."
          - math: 'u_L = L\frac{di}{dt} = LC\frac{d^2u_c}{dt^2}'
            note: "Tension bobine (rung 2), avec i deja exprime en u_c."
          - math: '\boxed{\frac{d^2u_c}{dt^2} + \frac{1}{LC}\,u_c = 0}'
            note: "Substitution dans la loi des mailles et division par LC : la forme demandee."
      - id: q2a
        stem: |-
          **(0,5 pt)** L'une des trois courbes (a), (b) ou (c) de la figure 3 représente, pour cette expérience, l'évolution de la tension $u_c(t)$. Indiquer la courbe qui représente l'évolution de la tension $u_c(t)$ lors de cette expérience. Justifier votre réponse.
        reasoning: |-
          Deux critères, tous deux tirés de ce qu'on vient d'établir. D'abord l'équation de la question 1 ne contient aucun terme en $R$ — c'est le cas idéal du rung 3, amplitude **constante**, jamais amortie : la courbe (a), qui décroît, est donc exclue d'emblée. Ensuite la condition initiale : avant $t=0$, le régime permanent était établi avec $K$ en position (1), donc le condensateur était chargé au maximum — $u_c(0)$ doit être un **extremum**, exactement comme le cosinus du rung 2 qui démarre à son maximum quand $\varphi = 0$. La courbe (c), malgré son amplitude constante, ne part pas d'un extremum : elle est donc elle aussi exclue. Seule la courbe (b) satisfait les deux critères à la fois.

          La courbe **(b)** représente $u_c(t)$ : amplitude constante (cohérent avec l'équation idéale, sans terme d'amortissement) et départ à l'extremum $+10\ \text{V}$ (cohérent avec la charge maximale acquise avant la bascule de $K$).
      - id: q2b
        stem: |-
          **(0,25 pt)** Trouver la période propre $T_0$ de l'oscillateur LC.
        reasoning: |-
          Méthode du rung 6 : on repère deux maxima consécutifs sur la courbe identifiée (b) et on lit l'écart temporel. Le premier maximum est à $t=0$ (départ), le suivant vers $t\approx 20\ \text{ms}$ — c'est directement $T_0$, sans avoir besoin de passer par une soustraction puisque le premier maximum coïncide avec l'origine.

          $$T_0 \approx 20\ \text{ms}$$
      - id: q3
        stem: |-
          **(0,5 pt)** Déterminer l'inductance $L$ de la bobine. (On prend $\pi^{2} = 10$).
        reasoning: |-
          On inverse la formule du rung 2, $T_0 = 2\pi\sqrt{LC}$, pour isoler $L$. Il manque une donnée que cette partie ne fournit pas : la capacité $C$. Elle a été déterminée dans la Partie I du même sujet (charge du condensateur à travers $R$, transcrite sous la notion rc-charge) : $C = 10\ \mu\text{F}$ — un pont entre les deux parties du même exercice, pas une donnée nouvelle à deviner.
        steps:
          - math: 'T_0 = 2\pi\sqrt{LC} \implies L = \frac{T_0^2}{4\pi^2 C}'
            note: "On isole L (rung 2), avec T0 lu a la question precedente."
          - math: 'L = \frac{(20\times10^{-3})^2}{4\times10\times10\times10^{-6}} = \frac{4\times10^{-4}}{4\times10^{-4}}'
            note: "Application numerique : T0 = 20 ms, C = 10 microF (valeur venant de la Partie I, meme sujet, transcrite sous rc-charge), pi^2 = 10."
          - math: '\boxed{L = 1\ \text{H}}'
            note: "Valeur ronde, coherente avec l'ordre de grandeur d'une bobine de ce type de montage bac."
      - id: q4a
        part: "Exploitation énergétique de la courbe $u_c(t)$"
        stem: |-
          **(0,5 pt)** À l'aide de la courbe représentant l'évolution de la tension $u_c(t)$ pour cette expérience, trouver l'énergie totale $E_t$ du circuit.
        reasoning: |-
          Le circuit est idéal (rung 1) : l'énergie totale se calcule à n'importe quel instant, le plus simple étant un extremum de $u_c$, où le courant est nul et toute l'énergie est électrique. La courbe (b) atteint $\pm10\ \text{V}$ à ses extrema — on prend $U_0 = 10\ \text{V}$.
        steps:
          - math: 'E_t = \frac{1}{2}C\,U_0^2 = \frac{1}{2}\times10\times10^{-6}\times10^2'
            note: "Au maximum de u_c, le courant est nul (rung 1) : toute l'energie est dans le condensateur."
          - math: '\boxed{E_t = 5\times10^{-4}\ \text{J}}'
            note: "Application numerique, avec C = 10 microF (Partie I) et U0 = 10 V (amplitude lue sur la courbe b)."
      - id: q4b
        stem: |-
          **(0,5 pt)** En déduire l'énergie magnétique $E_{m1}$ emmagasinée dans la bobine à l'instant $t_1 = 12\ \text{ms}$.
        reasoning: |-
          Le rung 1 donne la relation-clé : l'énergie totale est conservée dans le cas idéal, donc $E_{m1} = E_t - E_{c1}$, où $E_{c1}$ est l'énergie électrique restante à $t_1$. Pour la trouver, on a besoin de $u_c(t_1)$ : la courbe (b) est le cosinus $u_c(t) = U_0\cos\!\left(\frac{2\pi t}{T_0}\right)$ identifié aux questions précédentes ($\varphi = 0$ car départ à l'extremum). On l'évalue à $t_1 = 12\ \text{ms}$.
        steps:
          - math: 'u_c(t_1) = U_0\cos\!\left(\frac{2\pi t_1}{T_0}\right) = 10\cos\!\left(\frac{2\pi\times12}{20}\right)'
            note: "Forme cosinus identifiee (rung 2), evaluee a t1 = 12 ms avec T0 = 20 ms."
          - math: 'u_c(t_1) = 10\cos(216^\circ) \approx 10\times(-0{,}809) \approx -8{,}09\ \text{V}'
            note: "L'angle 216 degres depasse 180 : le cosinus est negatif, coherent avec la courbe qui redescend a cet instant."
          - math: 'E_{c1} = \frac{1}{2}C\,u_c(t_1)^2 = \frac{1}{2}\times10\times10^{-6}\times8{,}09^2 \approx 3{,}27\times10^{-4}\ \text{J}'
            note: "Energie electrique restant dans le condensateur a t1."
          - math: '\boxed{E_{m1} = E_t - E_{c1} \approx 5\times10^{-4} - 3{,}27\times10^{-4} \approx 1{,}7\times10^{-4}\ \text{J}}'
            note: "Conservation de l'energie totale (rung 1) : ce qui n'est pas dans le condensateur est dans la bobine."

  # ── bk-2018-n-x3 — 2018 N, Exercice III (Partie II) : RLC série, pseudo-periode puis entretien ──
  - id: bk-2018-n-x3
    title: "Circuit RLC série : oscillations pseudopériodiques et entretien par générateur"
    source:
      year: 2018
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice III — II. Étude d'un circuit RLC série"
    bareme_total: 1.75
    duration_min: 11
    sourcing:
      status: sourced
      note: >-
        2018 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/57726 (Exercice III, Partie II —
        circuit RLC série : oscillations pseudo-périodiques de la charge
        $q(t)$, puis entretien par générateur $u_G = k\,i(t)$ ; barème de la
        partie = 1,75 pt sur les 5 pt de l'exercice complet, dont les
        sous-parties I-1 et I-2 — capacité d'un condensateur, décharge RC —
        sont transcrites sous rc-charge.md). Transcription vérifiée : re-fetch
        indépendant AlloSchool + diff OK (agent-vérificateur, 2026-07-11 ;
        docs/sujets/pc/rlc-serie.md, statut « vérifié »). SCOPE NOTES (voir
        l'en-tête du fichier) : ce montage n'a pas de conducteur ohmique
        séparé — seule la résistance propre $r$ de la bobine dissipe, donc la
        condition d'entretien du rung 7 ($k = R$) s'applique ici avec $r$ à la
        place de $R$ ; et ce sujet ne fournit pas l'indication « $\pi^2 = 10$ »
        (à la différence de 2019/2020), on utilise donc la valeur usuelle.
        FLAG RECOUPEMENT (voir l'en-tête du fichier) : la portée de ce sujet
        (régime pseudo-périodique puis entretien par générateur $k$) recoupe
        de près celle que r8-bac (exercises.yaml, non sourcé) tente de
        couvrir sans sujet réel identifié — candidat pour le remplacement
        prévu par ADR 0019, à arbitrer par l'owner.
    intro: |-
      **Détermination expérimentale de la capacité d'un condensateur / Étude d'un circuit RLC série — II. Étude d'un circuit RLC série (examen national, session normale 2018, Exercice III — Partie II).**

      Un élève de la même classe réalise le montage représenté sur la figure 5 qui comporte :
      - un condensateur, totalement chargé, de capacité $C = 2{,}5\ \mu\text{F}$ ;
      - une bobine d'inductance $L$ et de résistance $r$ ;
      - un interrupteur $K$.

      *Figure 5 (schéma) :* circuit série entre bornes $A$ et $B$ : condensateur $C$, interrupteur $K$, et bobine notée $(L, r)$.

      Après fermeture du circuit, on visualise, à l'aide d'un système d'acquisition informatisé, des oscillations pseudopériodiques représentant les variations de la charge $q(t)$ du condensateur.
    questions:
      - id: q1
        part: "II — Étude d'un circuit RLC série : régime observé"
        stem: |-
          **(0,25 pt)** Pourquoi observe-t-on des oscillations pseudopériodiques ?
        reasoning: |-
          Le rung 3 pose exactement cette question, et la réponse est celle du rung 4 : la bobine a une résistance propre $r$ non nulle (elle n'est pas idéale) — $r$ dissipe de l'énergie par effet Joule à chaque cycle (rung 3, « R est le frein »), donc l'amplitude des oscillations décroît d'un cycle à l'autre. C'est précisément la signature du régime pseudo-périodique (rung 4) : oscillations présentes, mais amplitude qui s'amortit progressivement.
      - id: q2a
        part: "Entretien des oscillations avec un générateur $u_G(t) = k\\,i(t)$"
        stem: |-
          **(0,5 pt)** Pour obtenir des oscillations électriques entretenues, un générateur $G$ délivrant une tension proportionnelle à l'intensité du courant $u_G(t) = k\, i(t)$ est inséré en série dans le circuit précédent. Établir l'équation différentielle vérifiée par la charge $q(t)$.
        reasoning: |-
          Même méthode qu'au rung 7 — loi des mailles avec le générateur inséré — mais avec une différence structurelle : ce montage n'a pas de conducteur ohmique séparé, la seule résistance du circuit est celle de la bobine elle-même, $r$. On remplace donc le $R$ générique du rung 7 par $r$ dans le même schéma de substitution.
        steps:
          - math: 'u_C + u_{bobine} = u_G \qquad \text{avec} \qquad u_{bobine} = L\frac{d^2q}{dt^2} + r\frac{dq}{dt}'
            note: "Loi des mailles avec generateur (rung 7) ; ici la bobine porte elle-meme la seule resistance du circuit, r, il n'y a pas de R separe."
          - math: '\frac{q}{C} + L\frac{d^2q}{dt^2} + r\frac{dq}{dt} = k\frac{dq}{dt}'
            note: "Chaque tension remplacee par son expression en q, comme au rung 7."
          - math: '\boxed{L\frac{d^2q}{dt^2} + (r-k)\frac{dq}{dt} + \frac{q}{C} = 0}'
            note: "Meme structure qu'au rung 7, avec r a la place de R (seule resistance ici)."
      - id: q2b
        stem: |-
          **(0,25 pt)** En ajustant le paramètre $k$ sur la valeur $k = 5$ (exprimée dans le système d'unités international), les oscillations deviennent sinusoïdales (figure 6). Déterminer la valeur de $r$.
        reasoning: |-
          Rung 7 : l'entretien (oscillations sinusoïdales à amplitude constante) annule le coefficient d'amortissement de l'équation qu'on vient d'établir. Ici ce coefficient est $(r-k)$ — pas $(R-k)$, puisqu'il n'y a pas de $R$ séparé dans ce montage. La condition est donc $r = k$, directement.
        steps:
          - math: 'r - k = 0 \implies r = k'
            note: "Condition d'entretien (rung 7), generalisee : ici r joue le role que R joue au rung 7."
          - math: '\boxed{r = 5\ \Omega}'
            note: "Application numerique directe, k = 5 SI etant donne par l'enonce."
      - id: q2c
        stem: |-
          **(0,75 pt)** En exploitant la courbe de la figure 6, trouver la valeur de l'inductance $L$ de la bobine.

          *Figure 6 (courbe) :* $q\ (\mu\text{C})$ en fonction de $t\ (\text{ms})$ ; sinusoïde d'amplitude **constante** oscillant entre $+q_m$ et $-q_m$ ; les maxima successifs apparaissent vers $t\approx1\ \text{ms}$ puis $t\approx3\ \text{ms}$ (période $\approx2\ \text{ms}$).
        reasoning: |-
          Une fois l'entretien réalisé (question précédente), le circuit obéit à l'équation idéale du rung 2 — la période observée sur la figure 6 n'est plus une pseudo-période approchée, c'est exactement $T_0$. On la lit entre deux maxima consécutifs (rung 6) : $t\approx1\ \text{ms}$ et $t\approx3\ \text{ms}$, soit $T_0\approx2\ \text{ms}$. On inverse ensuite $T_0 = 2\pi\sqrt{LC}$ (rung 2) avec $C = 2{,}5\ \mu\text{F}$ donné. Ce sujet ne fournit pas l'indication « $\pi^2 = 10$ » utilisée ailleurs : on garde la valeur usuelle de $\pi^2$, comme dans les exemples numériques de la leçon elle-même.
        steps:
          - math: 'T_0 = t_2 - t_1 = 3 - 1 = 2\ \text{ms}'
            note: "Deux maxima consecutifs sur la figure 6 (rung 6) ; sous entretien, c'est exactement T0, pas une pseudo-periode approchee."
          - math: 'T_0 = 2\pi\sqrt{LC} \implies L = \frac{T_0^2}{4\pi^2 C}'
            note: "On isole L (rung 2)."
          - math: 'L = \frac{(2\times10^{-3})^2}{4\pi^2\times2{,}5\times10^{-6}} \approx \frac{4\times10^{-6}}{9{,}87\times10^{-5}}'
            note: "Application numerique, avec la valeur usuelle de pi^2 (aucune indication pi^2 = 10 dans ce sujet)."
          - math: '\boxed{L \approx 40\ \text{mH}}'
            note: "Ordre de grandeur typique d'une bobine de ce type de montage bac."

  # ── bk-2020-n-x4 — 2020 N, Exercice IV (Parties II et III) : decharge amortie puis entretien ──
