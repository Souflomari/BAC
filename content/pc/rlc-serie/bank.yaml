      - Générateur de f.é.m. $E = 12\ \text{V}$ et de résistance négligeable ;
      - Condensateur de capacité $C = 4{,}7\times10^{-3}\ \text{F}$ ;
      - Résistor de résistance $R = 200\ \Omega$ ;
      - Bobine d'inductance $L$ et de résistance négligeable ;
      - Interruptur *(sic)* $K$ à double position.

      **Figure 1 — le circuit, re-décrite depuis l'image.** Trois branches horizontales parallèles partageant un **rail vertical à gauche** :

      - **branche du haut** : un **résistor** (rectangle) étiqueté $R$, puis un **générateur** (grand cercle) ; sous le cercle, une **flèche horizontale pointant vers la gauche** étiquetée $E$ — la f.é.m. La branche se poursuit à droite et descend jusqu'au **contact ① (« 1 »)** ;
      - **branche du milieu** : un **condensateur** (deux traits verticaux parallèles) étiqueté $C$ ; elle se termine à droite par un **point pivot** d'où part la **lame de l'interrupteur $K$**, qui bascule vers ① au-dessus ou ② au-dessous ;
      - **branche du bas** : une **bobine** (quatre arches en demi-cercles) étiquetée $L$ ; elle se poursuit à droite et remonte jusqu'au **contact ② (« 2 »)**.

      *Aucun ampèremètre, aucun voltmètre, aucune flèche de courant sur ce schéma. Lecture qui décide de tout l'exercice : la **position 1** met en série générateur + $R$ + condensateur — c'est la **charge** ; la **position 2** met en série condensateur + bobine seuls, $R$ étant alors hors circuit — c'est le **circuit LC idéal**, ce que confirme « bobine de résistance négligeable ».*

      On ferme l'interrupteur sur la position **1** jusqu'à ce que le condensateur soit chargé complétement *(sic)*, puis on le bascule vers la position **2**, à un instant considéré comme origine des temps $t_0 = 0$.

      ---

      **Figure 2 — la courbe de l'énergie électrique, re-décrite depuis le tracé et mesurée sur deux chaînes indépendantes** *(elle sert à la question 5 ; la figure n'est pas reproduite ici, ce qui suit est ce qu'elle porte).*

      - **axe vertical** étiqueté $E_e$, **sans aucune graduation numérique** — seul un $0$ marque l'origine. C'est voulu, dans les deux éditions du sujet : aucune question ne demande une valeur d'énergie lue sur cette courbe ;
      - **axe horizontal** étiqueté $t\ (\text{s})$, avec les graduations chiffrées $0{,}1 \cdot 0{,}2 \cdot 0{,}3 \cdot 0{,}4$ ; le quadrillage vertical a un pas de $0{,}05\ \text{s}$ (mailles noires, sous-mailles bleues) ;
      - **la courbe** est une suite d'**arches positives et jointives** (allure en $\cos^2$), **toutes de même hauteur** — mesurées à $0{,}4\ \%$ près l'une de l'autre —, tangentes en haut à une même horizontale et **retombant exactement à zéro** sur l'axe des temps ;
      - **elle part d'un MAXIMUM à $t = 0$**, ce qui est cohérent avec l'énoncé : le condensateur vient d'être chargé complètement quand on bascule en position 2 ;
      - **la lecture dont tu auras besoin** : les passages par zéro sont régulièrement espacés, et **deux zéros consécutifs — comme deux sommets consécutifs — sont séparés de trois intervalles de quadrillage**, soit $3 \times 0{,}05 = 0{,}15\ \text{s}$.
    questions:
      - id: q1
        part: "Electricité, Première partie — Étude du circuit LC"
        stem: |-
          **1-** (0,5 pt) Établir l'équation différentielle vérifiée par la charge $q$ du condensateur.
        reasoning: |-
          On est en **position 2** : le circuit ne contient plus que le condensateur et la bobine, tous deux idéaux (générateur et résistor hors circuit, bobine de résistance négligeable). C'est le cas idéal du chapitre 3, et il se construit en trois gestes.

          **Geste 1 — la loi des mailles.** La maille ne contient que deux dipôles, donc la somme de leurs tensions est nulle :

          $$u_C + u_L = 0$$

          **Geste 2 — remplacer chaque tension par ce qu'elle vaut.** Pour le condensateur, $u_C = \dfrac{q}{C}$ — c'est la définition même de la capacité. Pour la bobine idéale, $u_L = L\dfrac{\mathrm{d}i}{\mathrm{d}t}$.

          **Geste 3 — tout ramener à la seule inconnue $q$.** C'est le geste qui fait la question, et il repose sur un fait qu'il faut énoncer : **l'intensité est le débit de charge**, $i = \dfrac{\mathrm{d}q}{\mathrm{d}t}$. Donc $\dfrac{\mathrm{d}i}{\mathrm{d}t} = \dfrac{\mathrm{d}^2q}{\mathrm{d}t^2}$, et la maille devient une équation où ne figure plus que $q$ :

          $$\frac{q}{C} + L\frac{\mathrm{d}^2q}{\mathrm{d}t^2} = 0 \qquad \Longleftrightarrow \qquad \boxed{\frac{\mathrm{d}^2q}{\mathrm{d}t^2} + \frac{1}{LC}\,q = 0}$$

          **Comment lire cette équation, plutôt que de la subir.** C'est l'équation d'un **oscillateur harmonique** : une dérivée seconde, plus une constante positive fois la fonction, égale zéro. Aucun terme en $\dfrac{\mathrm{d}q}{\mathrm{d}t}$ — et c'est **précisément l'absence de ce terme** qui dit que le circuit est idéal. Le terme du premier ordre, quand il existe, porte toute la résistance et donc tout l'amortissement (chapitre 6) ; ici il n'y a pas de résistance, donc pas d'amortissement, donc des oscillations qui ne s'éteignent jamais.

          **Le piège de cette question.** Garder $R$ dans la maille. Le résistor est bien dans le circuit — mais dans la **branche du haut**, celle qui sert à la charge en position 1. En position 2, la lame de $K$ a basculé : la maille active est condensateur + bobine, et $R$ n'y est plus. Lire la figure avant d'écrire la maille est la moitié du travail.
        steps:
          - math: 'u_C + u_L = 0'
            note: "Loi des mailles en position 2 : la maille ne contient plus que le condensateur et la bobine. R est hors circuit."
