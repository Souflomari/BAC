    intro: |-
      **2. Oscillations libres dans un circuit RLC série (examen national, session normale 2022, Exercice 3).**

      Après avoir totalement chargé le condensateur de capacité $C = 50\ \mu\text{F}$, on bascule l'interrupteur $K$ sur la position (2) à un instant choisi comme nouvelle origine des dates $t = 0$. Ce condensateur se décharge alors dans la bobine d'inductance $L$ et de résistance $r$ (figure 1).

      **2.1. Premier cas :** on suppose, dans ce cas, que la résistance de la bobine est négligeable.

      *Figure 3 (trois courbes $u_C\ (\text{V})$ en fonction de $t\ (\text{ms})$) :*
      - **$(C_1)$** : axe des ordonnées gradué $12,\ 6,\ 0,\ -6,\ -12$ ; axe des abscisses gradué $5,\ 10,\ 15$. Oscillation sinusoïdale d'amplitude **constante** $\pm 12\ \text{V}$, période $10\ \text{ms}$.
      - **$(C_2)$** : axe des ordonnées gradué $10,\ 5,\ 0,\ -5,\ -10$ ; axe des abscisses gradué $5,\ 10,\ 15$. Oscillation sinusoïdale d'amplitude **constante** $\pm 10\ \text{V}$, période $10\ \text{ms}$.
      - **$(C_3)$** : axe des ordonnées gradué $12,\ 6,\ 0,\ -6,\ -12$ ; axe des abscisses gradué $2{,}5,\ 7{,}5,\ 12{,}5$. Oscillation d'amplitude **décroissante** (allure pseudopériodique amortie).

      **2.2. Deuxième cas :** en réalité, la résistance de la bobine n'est pas négligeable. On visualise, à l'aide d'un système d'acquisition informatisé, les courbes représentant l'évolution de la tension $u_C(t)$ aux bornes du condensateur et celle de l'intensité $i(t)$ qui traverse le circuit (figure 4).

      *Figure 4 (deux courbes côte à côte) :* à gauche, $i\ (\text{mA})$ en fonction de $t\ (\text{ms})$, partant de $i = 0$ à $t = 0$ ; à droite, $u_C\ (\text{V})$ en fonction de $t\ (\text{ms})$, partant de $u_C = 12\ \text{V}$ à $t = 0$. Les deux courbes sont en quadrature — les zéros de l'une coïncident avec les extrema de l'autre — et leurs enveloppes décroissent de concert (amortissement). Pseudo-période mesurée $T \approx 10\ \text{ms}$.
    questions:
      - id: q1
        part: "2.1. Premier cas : établir le modèle idéal"
        stem: |-
          **(0,25 pt)** Montrer que l'équation différentielle vérifiée par la tension $u_C(t)$ s'écrit sous la forme : $\dfrac{d^2u_C}{dt^2} + \dfrac{1}{LC}u_C = 0$.
        reasoning: |-
          Même mécanisme qu'au chapitre 3, écrit directement en $u_C$ comme à la question 1 du sujet 2019 ci-dessus. Ici la résistance négligée n'est pas un conducteur ohmique séparé — ce montage n'en a pas — c'est la résistance propre $r$ de la bobine elle-même, que l'énoncé demande explicitement de négliger dans ce premier cas : $R \approx 0$ au sens du chapitre 2. La loi des mailles donne $u_C + u_L = 0$, puis on exprime le courant à partir de $u_C$ ($i = C\frac{du_C}{dt}$, la relation $i = \frac{dq}{dt}$ du chapitre 2 réécrite avec $q = Cu_C$), et $u_L$ suit.
        steps:
          - math: 'u_C + u_L = 0'
            note: "Loi des mailles, cas ideal (chapitre 2) : ici c'est la résistance propre de la bobine qu'on néglige, il n'y a pas de conducteur ohmique séparé dans ce montage."
          - math: 'i = \frac{dq}{dt} = C\frac{du_C}{dt}'
            note: "Courant exprime directement en u_C (q = C u_C), même geste qu'a la question 1 du sujet 2019 ci-dessus."
          - math: 'u_L = L\frac{di}{dt} = LC\frac{d^2u_C}{dt^2}'
            note: "Tension bobine (chapitre 3), avec i déjà exprime en u_C."
          - math: '\boxed{\frac{d^2u_C}{dt^2} + \frac{1}{LC}\,u_C = 0}'
            note: "Substitution dans la loi des mailles et division par LC : la forme demandee."
      - id: q2
        stem: |-
          **(0,5 pt)** Choisir, parmi les courbes $(C_1)$, $(C_2)$ et $(C_3)$ de la figure 3, la courbe qui représente l'évolution de la tension $u_C(t)$. Justifier votre réponse.
        reasoning: |-
          Deux critères, comme à la question 2a du sujet 2019 ci-dessus. D'abord le régime : l'équation de la question précédente ne contient aucun terme d'amortissement — c'est le cas idéal du chapitre 4/4, amplitude **constante**, jamais amortie. La courbe $(C_3)$, qui décroît, est donc exclue d'emblée. Ensuite l'amplitude : le condensateur a été chargé totalement avant la bascule de $K$, donc $u_C(0)$ doit valoir $U_0 = E$, la tension du palier de charge établie dans la section 1 du même sujet (réponse RC, transcrite sous « Dipôle RC — réponse à un échelon de tension ».md) — soit $12\ \text{V}$. $(C_2)$, malgré une amplitude constante, plafonne à $10\ \text{V}$ : elle est donc elle aussi exclue. Seule $(C_1)$ satisfait les deux critères à la fois.

          La courbe **$(C_1)$** représente $u_C(t)$ : amplitude constante (cohérent avec l'équation idéale) et amplitude $12\ \text{V}$ (cohérent avec $U_0 = E$).
      - id: q3
        stem: |-
          **(0,5 pt)** La solution de l'équation différentielle précédente est $u_C(t) = U_0\cos\!\left(\dfrac{2\pi}{T_0}t\right)$, où $U_0$ est la valeur maximale de la tension et $T_0$ la période propre des oscillations. Trouver l'expression de $T_0$ en fonction de $L$ et $C$.
        reasoning: |-
          Même démarche que la vérification du chapitre 3 (derivation:verification-cosinus), et que la question 3 du sujet 2021 ci-dessus : on injecte la forme cosinus proposée par l'énoncé dans l'équation établie à la question 1, et on identifie ce qui doit être vrai pour que ce cosinus soit solution.
        steps:
          - math: 'u_C(t) = U_0\cos\!\left(\frac{2\pi}{T_0}t\right) \implies \frac{d^2u_C}{dt^2} = -\frac{4\pi^2}{T_0^2}\,u_C'
            note: "Dérivée seconde du cosinus propose par l'énoncé (même geste qu'au chapitre 3)."
          - math: '-\frac{4\pi^2}{T_0^2}\,u_C + \frac{1}{LC}u_C = 0 \implies \frac{4\pi^2}{T_0^2} = \frac{1}{LC}'
            note: "Substitution dans l'équation de la question 1 ; u_C se simplifie, il n'est jamais nul en permanence."
          - math: '\boxed{T_0 = 2\pi\sqrt{LC}}'
            note: "On isole T0 : même expression qu'au chapitre 3."
      - id: q4
        stem: |-
          **(0,5 pt)** Montrer que la valeur de l'inductance est : $L = 0{,}05\ \text{H}$. (on prend $\pi^2 = 10$).
        reasoning: |-
          On inverse la formule de la question précédente pour isoler $L$. Il manque la valeur numérique de $T_0$ : on la lit sur la courbe $(C_1)$ identifiée à la question 2 (méthode du chapitre 7, deux maxima consécutifs) — le premier maximum est à $t = 0$ (départ, condensateur chargé au maximum), le suivant vers $t \approx 10\ \text{ms}$, d'où $T_0 \approx 10\ \text{ms}$. $C = 50\ \mu\text{F}$ est donné directement dans l'énoncé de cette section, pas besoin de pontage cross-notion ici (à la différence des sujets 2019/2020/2021 ci-dessus).
        steps:
          - math: 'T_0 \approx 10\ \text{ms}'
            note: "Lu sur (C1) (chapitre 7) : deux maxima consecutifs, le premier a t=0."
          - math: 'T_0 = 2\pi\sqrt{LC} \implies L = \frac{T_0^2}{4\pi^2 C}'
            note: "On isole L (question précédente)."
          - math: 'L = \frac{(10\times10^{-3})^2}{4\times10\times50\times10^{-6}} = \frac{10^{-4}}{2\times10^{-3}}'
            note: "Application numérique : T0 = 10 ms (lecture graphique), C = 50 microF (donne dans cette section), pi^2 = 10 donne par l'énoncé."
          - math: '\boxed{L = 0{,}05\ \text{H}}'
            note: "Valeur ronde ; confirme retroactivement que la lecture T0 = 10 ms était la bonne (elle redonne exactement la période mesurée sur C1)."
      - id: q5
        part: "2.2. Deuxième cas : bilan énergétique en régime amorti"
        stem: |-
          **(0,5 pt)** Écrire l'expression de l'énergie totale $E_t$ du circuit en fonction de $C$, $u_C(t)$, $L$ et $i(t)$.
        reasoning: |-
          C'est directement la formule du chapitre 2 : l'énergie totale, à un instant donné, est la somme de ce qui est stocké dans le condensateur et de ce qui est stocké dans la bobine — quel que soit le régime. Ce qui change dans ce deuxième cas, ce n'est pas la formule (toujours vraie instant par instant), c'est que cette somme n'est **plus constante** au fil du temps : la résistance $r$, non négligeable ici, la fait décroître (chapitre 4/4).
        steps:
          - math: '\boxed{E_t = \frac{1}{2}C\,u_C(t)^2 + \frac{1}{2}L\,i(t)^2}'
            note: "Somme des deux énergies stockees à l'instant t (chapitre 2), valable dans les deux cas ; seule la constance de cette somme diffère entre le cas ideal et le cas amorti."
      - id: q6
        stem: |-
          **(0,75 pt)** En exploitant les courbes de la figure 4, trouver l'énergie $\Delta E$ dissipée dans le circuit entre les instants $t_0 = 0$ et $t_1 = 9\ \text{ms}$.
        reasoning: |-
          La méthode : $\Delta E = E_t(t_0) - E_t(t_1)$, où $E_t$ est la formule établie à la question précédente — R (ici $r$) ne fait que dissiper, jamais restituer (chapitre 4), donc cette différence est toujours positive. À $t_0 = 0$, les deux courbes donnent directement les deux grandeurs : $i(0) = 0$ (la courbe de gauche part de zéro) et $u_C(0) = 12\ \text{V}$ (la courbe de droite part de ce niveau, le même palier $E = 12\ \text{V}$ qu'à la question 2, pontage cross-notion avec la section 1) — toute l'énergie initiale est électrique.

          Pour $t_1 = 9\ \text{ms}$, la même méthode : lire $u_C(9\ \text{ms})$ et $i(9\ \text{ms})$ sur les deux courbes de la figure 4. $t = 9\ \text{ms}$ est à $3$ carreaux fins après le repère $7{,}5$ : la tension remonte vers son maximum $+7\ \text{V}$ (atteint à $10\ \text{ms}$) et se lit $u_C(9) \approx 6\ \text{V}$ ; le courant redescend de son maximum $+250\ \text{mA}$ (à $7{,}5\ \text{ms}$) vers son zéro de $10\ \text{ms}$ et se lit $i(9) \approx 150\ \text{mA}$. (Lectures graphiques au demi-carreau près, mesurées sur le scan original lors d'une passe de mesure dédiée — voir sourcing.)
        steps:
          - math: 'E_t(t_0=0) = \frac{1}{2}\times50\times10^{-6}\times12^2 + 0'
            note: "A t0=0 : i=0 (courbe de gauche) et u_C=12V (courbe de droite, même palier qu'a la question 2)."
          - math: 'E_t(0) = 3{,}6\times10^{-3}\ \text{J}'
            note: "Toute l'énergie initiale est électrique, le courant étant nul a cet instant."
          - math: 'E_t(9\ \text{ms}) = \frac{1}{2}\times50\times10^{-6}\times6^2 + \frac{1}{2}\times5\times10^{-2}\times(0{,}15)^2 \approx 1{,}5\times10^{-3}\ \text{J}'
            note: "Lectures graphiques : u_C(9 ms) = 6 V environ et i(9 ms) = 150 mA environ (au demi-carreau près)."
          - math: '\boxed{\Delta E = E_t(0) - E_t(9\ \text{ms}) \approx 2{,}1\times10^{-3}\ \text{J}}'
            note: "Énergie dissipée par effet Joule dans r entre les deux instants ; tolerance de lecture graphique, ordre de grandeur 2 mJ."

