      - id: q6
        stem: |-
          **5-2-** (0,5 pt) En déduire la valeur du coefficient d'inductance de la bobine.
        reasoning: |-
          « En déduire » : on ne repart de rien, on **inverse la formule de la question 2** avec la valeur de $T_0$ qu'on vient de lire.

          $$T_0 = 2\pi\sqrt{LC} \quad\Longrightarrow\quad T_0^{\,2} = 4\pi^2 LC \quad\Longrightarrow\quad \boxed{L = \frac{T_0^{\,2}}{4\pi^2 C}}$$

          L'application numérique, avec $T_0 = 0{,}30\ \text{s}$ et $C = 4{,}7\times10^{-3}\ \text{F}$ :

          $$L = \frac{(0{,}30)^2}{4\pi^2 \times 4{,}7\times10^{-3}} = \frac{0{,}090}{0{,}1856} \approx 0{,}485\ \text{H}$$

          **Le contrôle de vraisemblance, et il compte double ici.** $0{,}485\ \text{H}$, soit environ un demi-henry : c'est une **bobine parfaitement banale**, du genre de celles qu'on trouve sur une paillasse de lycée. Ce contrôle-là n'est pas décoratif — c'est lui qui valide, *a posteriori*, toute la chaîne : la lecture de $T$ sur la figure, le doublement en $T_0$, et l'inversion de la formule. Si l'on avait oublié de doubler ($T_0 = 0{,}15\ \text{s}$), on trouverait $L = 0{,}121\ \text{H}$ — encore plausible, donc le contrôle ne l'attraperait pas. Mais si l'on avait oublié le carré ou le $4\pi^2$, on tomberait sur des valeurs absurdes, de l'ordre du henry par milliers ou du microhenry.

          **Le piège de cette question.** Oublier d'élever $T_0$ au carré, ou l'élever après avoir divisé. La formule s'inverse d'un bloc : on part de $T_0 = 2\pi\sqrt{LC}$, on **élève les deux membres au carré d'abord** — ce qui fait apparaître $4\pi^2$, pas $2\pi$ —, et on isole $L$ ensuite. Écrire $L = \dfrac{T_0}{4\pi^2C}$ ou $L = \dfrac{T_0^2}{2\pi C}$ sont les deux fautes les plus fréquentes, et aucune des deux ne se voit sur le résultat sans contrôle d'ordre de grandeur.
