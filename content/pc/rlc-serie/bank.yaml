        (régime pseudo-périodique puis entretien par générateur $k$) recoupe
        de près celle que r8-bac (exercises.yaml, non sourcé) tente de
        couvrir sans sujet réel identifié — candidat pour le remplacement
        prévu par ADR 0019, à arbitrer par l'owner.
    intro: |-
      **Détermination expérimentale de la capacité d'un condensateur / Étude d'un circuit RLC série — II. Étude d'un circuit RLC série (examen national, session normale 2018, Exercice III — Partie II).**

      Un élève de la même classe réalise le montage représenté sur la figure 5 qui comporte :
      - un condensateur, totalement chargé, de capacité $C = 2{,}5\ \mu\text{F}$ ;
      - une bobine d'inductance $L$ et de résistance $r$ ;
      - un interrupteur $K$.

      *Figure 5 (schéma) :* circuit série entre bornes $A$ et $B$ : condensateur $C$, interrupteur $K$, et bobine notée $(L, r)$.

      Après fermeture du circuit, on visualise, à l'aide d'un système d'acquisition informatisé, des oscillations pseudopériodiques représentant les variations de la charge $q(t)$ du condensateur.
    questions:
      - id: q1
        part: "II — Étude d'un circuit RLC série : régime observé"
        stem: |-
          **(0,25 pt)** Pourquoi observe-t-on des oscillations pseudopériodiques ?
        reasoning: |-
          Le chapitre 4 pose exactement cette question, et la réponse est celle du chapitre 5 : la bobine a une résistance propre $r$ non nulle (elle n'est pas idéale) — $r$ dissipe de l'énergie par effet Joule à chaque cycle (chapitre 4, « R est le frein »), donc l'amplitude des oscillations décroît d'un cycle à l'autre. C'est précisément la signature du régime pseudo-périodique (chapitre 5) : oscillations présentes, mais amplitude qui s'amortit progressivement.
      - id: q2a
        part: "Entretien des oscillations avec un générateur $u_G(t) = k\\,i(t)$"
        stem: |-
          **(0,5 pt)** Pour obtenir des oscillations électriques entretenues, un générateur $G$ délivrant une tension proportionnelle à l'intensité du courant $u_G(t) = k\, i(t)$ est inséré en série dans le circuit précédent. Établir l'équation différentielle vérifiée par la charge $q(t)$.
        reasoning: |-
          Même méthode qu'au chapitre 8 — loi des mailles avec le générateur inséré — mais avec une différence structurelle : ce montage n'a pas de conducteur ohmique séparé, la seule résistance du circuit est celle de la bobine elle-même, $r$. On remplace donc le $R$ générique du chapitre 8 par $r$ dans le même schéma de substitution.
        steps:
          - math: 'u_C + u_{bobine} = u_G \qquad \text{avec} \qquad u_{bobine} = L\frac{d^2q}{dt^2} + r\frac{dq}{dt}'
            note: "Loi des mailles avec générateur (chapitre 8) ; ici la bobine porte elle-même la seule résistance du circuit, r, il n'y a pas de R separe."
          - math: '\frac{q}{C} + L\frac{d^2q}{dt^2} + r\frac{dq}{dt} = k\frac{dq}{dt}'
            note: "Chaque tension remplacee par son expression en q, comme au chapitre 8."
          - math: '\boxed{L\frac{d^2q}{dt^2} + (r-k)\frac{dq}{dt} + \frac{q}{C} = 0}'
            note: "Même structure qu'au chapitre 8, avec r a la place de R (seule résistance ici)."
      - id: q2b
        stem: |-
          **(0,25 pt)** En ajustant le paramètre $k$ sur la valeur $k = 5$ (exprimée dans le système d'unités international), les oscillations deviennent sinusoïdales (figure 6). Déterminer la valeur de $r$.
        reasoning: |-
          Chapitre 8 : l'entretien (oscillations sinusoïdales à amplitude constante) annule le coefficient d'amortissement de l'équation qu'on vient d'établir. Ici ce coefficient est $(r-k)$ — pas $(R-k)$, puisqu'il n'y a pas de $R$ séparé dans ce montage. La condition est donc $r = k$, directement.
        steps:
          - math: 'r - k = 0 \implies r = k'
            note: "Condition d'entretien (chapitre 8), generalisee : ici r joue le rôle que R joue au chapitre 8."
          - math: '\boxed{r = 5\ \Omega}'
            note: "Application numérique directe, k = 5 SI étant donne par l'énoncé."
      - id: q2c
        stem: |-
          **(0,75 pt)** En exploitant la courbe de la figure 6, trouver la valeur de l'inductance $L$ de la bobine.

          *Figure 6 (courbe) :* $q\ (\mu\text{C})$ en fonction de $t\ (\text{ms})$ ; sinusoïde d'amplitude **constante** oscillant entre $+q_m$ et $-q_m$ ; les maxima successifs apparaissent vers $t\approx1\ \text{ms}$ puis $t\approx3\ \text{ms}$ (période $\approx2\ \text{ms}$).
        reasoning: |-
          Une fois l'entretien réalisé (question précédente), le circuit obéit à l'équation idéale du chapitre 3 — la période observée sur la figure 6 n'est plus une pseudo-période approchée, c'est exactement $T_0$. On la lit entre deux maxima consécutifs (chapitre 7) : $t\approx1\ \text{ms}$ et $t\approx3\ \text{ms}$, soit $T_0\approx2\ \text{ms}$. On inverse ensuite $T_0 = 2\pi\sqrt{LC}$ (chapitre 3) avec $C = 2{,}5\ \mu\text{F}$ donné. Ce sujet ne fournit pas l'indication « $\pi^2 = 10$ » utilisée ailleurs : on garde la valeur usuelle de $\pi^2$, comme dans les exemples numériques de la leçon elle-même.
        steps:
          - math: 'T_0 = t_2 - t_1 = 3 - 1 = 2\ \text{ms}'
            note: "Deux maxima consecutifs sur la figure 6 (chapitre 7) ; sous entretien, c'est exactement T0, pas une pseudo-periode approchée."
          - math: 'T_0 = 2\pi\sqrt{LC} \implies L = \frac{T_0^2}{4\pi^2 C}'
            note: "On isole L (chapitre 3)."
          - math: 'L = \frac{(2\times10^{-3})^2}{4\pi^2\times2{,}5\times10^{-6}} \approx \frac{4\times10^{-6}}{9{,}87\times10^{-5}}'
            note: "Application numérique, avec la valeur usuelle de pi^2 (aucune indication pi^2 = 10 dans ce sujet)."
          - math: '\boxed{L \approx 40\ \text{mH}}'
            note: "Ordre de grandeur typique d'une bobine de ce type de montage bac."

  # ── bk-2020-n-x4 — 2020 N, Exercice IV (Parties II et III) : decharge amortie puis entretien ──
  - id: bk-2020-n-x4
    title: "Décharge oscillante puis entretien des oscillations dans un circuit RLC série"
    source:
