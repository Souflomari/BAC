           IMPORTANT POUR LA CLASSIFICATION : l'edition française de ce sujet est
           MINISTERIELLE (code d'examen RS28 au cartouche ; mention d'époque
           « (الترجمة الفرنسية) » sans le cadre anachronique « المسالك الدولية » ;
           pieds de page VIDES sur les six pages ; colonne « Bareme » miroir
