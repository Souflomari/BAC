    intro: |-
      **Étude du circuit idéal LC (examen national, session de rattrapage 2012 — exercice « Electricité », Première partie, 3,00 points sur 05,00).**

      *La deuxième partie du même exercice est indépendante — le sujet l'écrit — et vit ailleurs : la réception d'une onde modulée en amplitude et sa démodulation (2,00 pt) sous « Ondes électromagnétiques et modulation », entrée bk-2012-r-x3b. 3,00 + 2,00 = 5,00, le barème imprimé.*

      Les condensateurs et les bobines jouent un rôle *(sic)* très important dans la transmission et la reception *(sic)* d'ondes électromagnétiques.

      Le but de cet exercice est l'étude du circuit idéal LC et à la réception *(sic — rupture de construction : « et l'étude de la réception » attendu)* et démodulation d'une ondes *(sic)* modulée en amplitude.

      **Les deux parties sont indépendantes**

      **Première partie : Étude du circuit LC**

      On réalise le circuit de la **figure 1** <!-- DÉFAUT DU SUJET OFFICIEL, DÉCLARÉ ET RÉPARÉ ICI (F2), 2026-09-04.
           Le corps de la page 4 du document officiel francophone imprime « On
           realise le circuit de la FIGURE 2 » (couche de texte, y = 645,9),
