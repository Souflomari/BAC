          **2-** (0,25 pt) Trouver l'expression de la période propre $T_0$ de l'oscillateur en fonction de $L$ et $C$, pour que l'expression $q(t) = Q_m \cos\!\left(\dfrac{2\pi}{T_0}t\right)$ soit solution de cette équation différentielle.
