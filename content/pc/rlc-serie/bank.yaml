    intro: |-
      **2- Décharge d'un condensateur dans un dipôle RL (examen national, session normale 2025, Exercice 3 — Partie 2).**

      Lorsque la tension entre les bornes du condensateur prend la valeur $u_C = U_0 = 10\ \text{V}$, on bascule l'interrupteur $K$ en position (2) à un instant pris comme nouvelle origine des dates $(t_0 = 0)$. Un système d'acquisition informatisé adéquat permet d'obtenir la courbe représentant la tension $u_C(t)$ (figure 3). Le circuit est le condensateur $C_0$ en série avec la bobine $(L, r)$ — pas de conducteur ohmique séparé.

      *Figure 3 (courbe) :* $u_C\ (\text{V})$ en fonction de $t$ (axe non chiffré en unité). Cadre de 10 divisions en abscisse ; ordonnées graduées $4, 0, -4$ (1 division $=4\ \text{V}$ ; les traits $\pm8\ \text{V}$ existent mais ne sont pas chiffrés) ; un trait pointillé horizontal non principal, étiqueté « $7$ », marque le niveau $u_C = 7\ \text{V}$.

      Oscillation pseudopériodique d'amplitude décroissante, tous les extrema tombant sur un trait principal sur deux : maximum initial $u_C(0) = +10\ \text{V}$ à $t=0$ ; premier minimum $\approx -8{,}3\ \text{V}$ à la division 2 ; deuxième maximum à la division 4, touchant **exactement** le pointillé $u_C = 7\ \text{V}$ — c'est l'instant $t_A$ ; à la division 5, le passage par zéro descendant qui suit — c'est l'instant $t_B$, soit une division ($T/4$) après $t_A$ ; deuxième minimum $\approx -5{,}9\ \text{V}$ à la division 6 ; troisième maximum $\approx 4{,}9\ \text{V}$ à la division 8 ; troisième minimum $\approx -4{,}1\ \text{V}$ à la division 10 (bord droit, fin du tracé).

      Un repère à double flèche horizontale, étiqueté « $7\times10^{-5}\ \text{s}$ », est tracé entre le trait vertical de $t_B$ et le trait principal suivant : il couvre **exactement une division**, ni deux, ni quatre — c'est l'étalonnage de l'axe des temps (1 division $=7\times10^{-5}\ \text{s}$), pas la pseudo-période.
    questions:
      - id: q1
