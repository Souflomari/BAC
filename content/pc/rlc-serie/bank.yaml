           pointe vers la mauvaise figure.
           L'original arabe RS28 est coherent, et les trois occurrences ont été
           relues AU RENDU par la cloture du 2026-09-04 : « الشكل1 » dans le
           corps (p. 4 y = 466,4) ET en legende (p. 4 y = 608,3), « الشكل2 »
           pour la courbe d'énergie (p. 4 y = 760,9 et 795,3).
           Aucune conséquence sur la resolubilite : une seule figure de circuit
           existe dans tout l'exercice. La reparation ne touche qu'un chiffre de
