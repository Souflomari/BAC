    intro: |-
      **2- Circuit oscillant LC (examen national, session normale 2023, Exercice 3 — §2).**

      On réalise un circuit oscillant LC en associant la bobine $(b)$ précédemment utilisée (§1, hors périmètre ici) avec un condensateur de capacité $C$ chargé totalement par un générateur de tension de force électromotrice $E_0$ (figure 3).

      *Figure 3 (schéma) :* boucle rectangulaire. Branche gauche : condensateur $C$ (deux traits parallèles). Branche supérieure : fil portant la flèche de courant $i$ vers la droite. Branche droite : bobine $(b)$ en spires. Branche inférieure : simple fil.

      *Figure 4 (courbe) :* $u_C\ (\text{V})$ en fonction de $t\ (\text{ms})$, sur quadrillage à double graduation. Aucune valeur numérique sur les axes hormis l'origine « $0$ » : toute la lecture passe par un repère d'échelle en **coin (« L »)**, formé de deux flèches à une seule pointe — une flèche verticale « $5\text{V}$ » et une flèche horizontale « $0{,}5\ \text{ms}$ » — dont le sommet commun est posé sur l'intersection de deux traits principaux, à 2 divisions à droite de l'axe des ordonnées et 1 division au-dessus de l'axe des temps. Chaque flèche du coin ne couvre **qu'une seule division** : ce n'est pas une double flèche, et cette division n'est en aucun cas la période. Le cadre compte 6 divisions en abscisse et 4 en ordonnée (soit $\pm 2$ divisions $= \pm 10\ \text{V}$ autour de l'axe des temps).

      La courbe est une sinusoïde d'amplitude constante, exactement une période et demie : elle **part de son maximum à $t=0$** ($u_C(0) = +U_0 = +10\ \text{V}$, cohérent avec « chargé totalement »), franchit l'axe à $t=0{,}5\ \text{ms}$, atteint son minimum $-10\ \text{V}$ à $t=1{,}0\ \text{ms}$, refranchit l'axe à $t=1{,}5\ \text{ms}$, atteint son second maximum $+10\ \text{V}$ à $t=2{,}0\ \text{ms}$, puis redescend vers un second minimum atteint au bord droit du cadre, $t=3{,}0\ \text{ms}$.
    questions:
      - id: q1
        part: "2- Circuit oscillant LC : établir le modèle"
        stem: |-
          **(0,25 pt)** Établir l'équation différentielle vérifiée par la tension $u_C(t)$ entre les bornes du condensateur.
        reasoning: |-
          Même mécanisme qu'à la question 1 du sujet 2022 ci-dessus, et qu'au chapitre 3 : circuit LC pur (la figure 3 ne montre aucun conducteur ohmique dans la boucle, et la bobine $(b)$ n'est pas dite résistive ici). Loi des mailles $u_C + u_L = 0$, puis $u_C = \frac{q}{C}$ et $i = \frac{dq}{dt} = C\frac{du_C}{dt}$ (chapitre 2) pour aboutir à $u_L = LC\frac{d^2u_C}{dt^2}$.
        steps:
          - math: 'u_C + u_L = 0'
            note: "Loi des mailles, cas ideal (chapitre 2) : aucun conducteur ohmique dans la boucle (figure 3)."
          - math: 'i = C\frac{du_C}{dt} \qquad u_L = L\frac{di}{dt} = LC\frac{d^2u_C}{dt^2}'
            note: "Même substitution qu'a la question 1 du sujet 2022 ci-dessus."
          - math: '\boxed{\frac{d^2u_C}{dt^2} + \frac{1}{LC}\,u_C = 0}'
            note: "Forme standard du cas ideal (chapitre 3)."
      - id: q2
        part: "Exploiter la courbe : ne pas confondre le repère d'échelle et la période"
        stem: |-
          **(0,5 pt)** Trouver la valeur de la capacité $C$ du condensateur. (On prend $\pi^2 = 10$).
        reasoning: |-
          Piège à éviter en premier : le repère porté sur la figure — un coin en L, deux flèches à une seule pointe chacune — n'est PAS une mesure de période. Chaque flèche du coin couvre exactement **une division** (« $5\text{V}$ » verticalement, « $0{,}5\ \text{ms}$ » horizontalement) : c'est un étalonnage des deux axes, pas un repère de temps caractéristique de la courbe. Une fois l'échelle posée (1 division $= 0{,}5\ \text{ms}$), on applique la méthode du chapitre 7 : deux maxima consécutifs, à $t=0$ et $t=2{,}0\ \text{ms}$ (4 divisions), donnent $T_0 = 2{,}0\ \text{ms}$. On inverse ensuite $T_0 = 2\pi\sqrt{LC}$ (chapitre 3) pour isoler $C$, avec $L = 1\ \text{H}$ établi au §1 du même sujet (dipôle RL, hors périmètre RLC, transcrit sous « Dipôle RL ».md) — un pont entre les deux parties du même exercice, pas une donnée nouvelle à deviner.
        steps:
          - math: 'T_0 = 2{,}0\ \text{ms}'
            note: "Lu entre deux maxima consecutifs (chapitre 7), avec l'échelle du coin en L : 4 divisions x 0,5 ms."
          - math: 'T_0 = 2\pi\sqrt{LC} \implies C = \frac{T_0^2}{4\pi^2 L}'
            note: "On isole C (chapitre 3)."
          - math: 'C = \frac{(2\times10^{-3})^2}{4\times10\times1} = \frac{4\times10^{-6}}{40}'
            note: "Application numérique : T0 = 2,0 ms, L = 1 H (établi au paragraphe 1, hors périmètre RLC, transcrit sous « Dipôle RL ».md), pi^2 = 10 donne par l'énoncé."
          - math: '\boxed{C = 0{,}1\ \mu\text{F}}'
            note: "Valeur ronde, coherente avec les autres sujets de cette banque."
      - id: q3
        stem: |-
          **(0,75 pt)** Trouver l'énergie magnétique $E_m$ emmagasinée dans la bobine à l'instant $t = 1{,}8\ \text{ms}$.
        reasoning: |-
          Même geste qu'à la question 4b du sujet 2019 ci-dessus : circuit idéal (chapitre 2), énergie totale conservée, $E_m = E_t - E_C(t)$. On évalue d'abord $u_C(1{,}8\ \text{ms})$ avec la forme cosinus identifiée par la courbe ($u_C(0) = +U_0$, donc phase nulle), en utilisant $T_0 = 2{,}0\ \text{ms}$ et $U_0 = 10\ \text{V}$ (amplitude lue à la question précédente).
        steps:
          - math: 'E_t = \frac{1}{2}C\,U_0^2 = \frac{1}{2}\times0{,}1\times10^{-6}\times10^2'
            note: "Énergie totale, conservee dans le cas ideal (chapitre 2) ; calculée au maximum de u_C, ou tout est électrique."
          - math: '\boxed{E_t = 5\times10^{-6}\ \text{J}}'
            note: "Application numérique."
          - math: 'u_C(1{,}8) = U_0\cos\!\left(\frac{2\pi\times1{,}8}{2{,}0}\right) = 10\cos(1{,}8\pi)'
            note: "Forme cosinus identifiee (chapitre 3), evaluee a t = 1,8 ms avec T0 = 2,0 ms."
          - math: 'u_C(1{,}8) = 10\cos(324^\circ) \approx 10\times0{,}809 \approx 8{,}09\ \text{V}'
            note: "1,8 ms correspond a 0,9 période, soit 324 degrés ; le cosinus reste positif juste avant de refermer le cycle."
          - math: 'E_C(1{,}8) = \frac{1}{2}C\,u_C(1{,}8)^2 = \frac{1}{2}\times0{,}1\times10^{-6}\times8{,}09^2 \approx 3{,}27\times10^{-6}\ \text{J}'
            note: "Énergie électrique restant dans le condensateur a cet instant."
          - math: '\boxed{E_m \approx 5\times10^{-6} - 3{,}27\times10^{-6} \approx 1{,}7\times10^{-6}\ \text{J}}'
            note: "Conservation de l'énergie totale (chapitre 2) : ce qui n'est pas dans le condensateur est dans la bobine."

