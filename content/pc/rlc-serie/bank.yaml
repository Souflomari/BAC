    intro: |-
      **2- Décharge d'un condensateur dans un dipôle RL (examen national, session normale 2025, Exercice 3 — Partie 2).**

      Lorsque la tension entre les bornes du condensateur prend la valeur $u_C = U_0 = 10\ \text{V}$, on bascule l'interrupteur $K$ en position (2) à un instant pris comme nouvelle origine des dates $(t_0 = 0)$. Un système d'acquisition informatisé adéquat permet d'obtenir la courbe représentant la tension $u_C(t)$ (figure 3). Le circuit est le condensateur $C_0$ en série avec la bobine $(L, r)$ — pas de conducteur ohmique séparé.

      *Figure 3 (courbe) :* $u_C\ (\text{V})$ en fonction de $t$ (axe non chiffré en unité). Cadre de 10 divisions en abscisse ; ordonnées graduées $4, 0, -4$ (1 division $=4\ \text{V}$ ; les traits $\pm8\ \text{V}$ existent mais ne sont pas chiffrés) ; un trait pointillé horizontal non principal, étiqueté « $7$ », marque le niveau $u_C = 7\ \text{V}$.

