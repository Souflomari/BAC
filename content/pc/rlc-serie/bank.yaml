    intro: |-
      **Oscillations dans un circuit RLC série — deuxième expérience (examen national, session de rattrapage 2013 — exercice « Electricité », 2,75 points sur 05,00).**

      *La première expérience du même exercice — la réponse d'un dipôle RL à un échelon de tension, 2,25 pt — est indépendante et vit sous « Dipôle RL », entrée bk-2013-r-x3. Elle y établit les deux caractéristiques de la bobine réutilisée ici : $r = 8{,}4\ \Omega$ et $L \approx 0{,}20\ \text{H}$. 2,25 + 2,75 = 5,00, le barème imprimé.*

      **Deuxième expérience :**

      On monte la bobine précédente, en série, avec un condensateur (initialement chargé complétement *(sic)*) de capacité $C = 0{,}2\ \mu\text{F}$ et un résistor de résistance $R' = 200\ \Omega$ (**figure 3**). <!-- DIVERGENCE DÉCLARÉE, 2026-09-04 : l'original arabe RS28 écrit ici
           « (الشكل 3) » = « (figure 3) », renvoi que l'édition française a
           SUPPRIMÉ. Conséquence dans le document officiel français : la figure 3
           n'est appelée nulle part avant la question 5, alors que le schéma est
           bien légendé « Figure 3 ». Perte de renvoi, sans conséquence sur la
           résolubilité (la légende est là) ; le renvoi est rétabli ici pour que
           le texte se suive. L'édition française de ce sujet étant
           MINISTÉRIELLE (code d'examen RS28 encadré, imprimé à l'identique dans
           les deux cartouches), c'est un défaut du DOCUMENT OFFICIEL
           francophone, pas un artefact de traduction professorale. Voir
           docs/sujets/_incoming/pc-2013-r.md, V.6 / V.7 / V.8. -->

      On obtient, à l'aide du même dispositif informatique, la courbe de la **figure 4** qui représente les variations de la tension $u_C$ aux bornes du condensateur en fonction du temps.

      **Figure 3 — le montage.** Même boucle rectangulaire que la figure 1 de la première expérience, le générateur remplacé par le condensateur. **Branche haute** : depuis le coin haut-gauche, un interrupteur $K$, puis un point noir $A$. **Branche droite**, de haut en bas : un rectangle vertical (le résistor) étiqueté $R'$ à sa droite ; un point noir $B$ ; la bobine (quatre arches) étiquetée $(L,\,r)$ à sa droite ; un point noir $C$ en bas. **Branche gauche** : le condensateur (deux traits horizontaux parallèles courts interrompant le fil vertical) étiqueté $C$ à sa gauche, avec à sa droite une flèche verticale vers le haut étiquetée $u_C$ ; sur le fil vertical gauche, juste sous le coin haut, une flèche verticale vers le **bas** étiquetée $i$. *(Piège de lecture : la lettre $C$ sert deux fois sur ce schéma — le condensateur à gauche et le point $C$ en bas à droite. Et le sens de $i$ est inversé par rapport à la figure 1 : c'est voulu.)*

      **Figure 4 — l'oscillogramme $u_C(t)$, décrit pour être exploité.** Tracé sur papier millimétré.

      - **axe vertical** $u_C\ (\text{V})$ : **deux graduations chiffrées seulement**, $1$ et $0$, chacune suivie d'un petit tiret de repère ;
      - **axe horizontal** $t\ (\text{ms})$ : **un seul repère chiffré**, sous un petit tiret vertical, et c'est une fraction — $\dfrac{\pi}{5}$ ;
      - **quadrillage** : maille fine bleue, lignes fortes tous les $1\ \text{V}$ et toutes les $\pi/10\ \text{ms}$ ; cadre $t \in [0\,;\,19\pi/20]\ \text{ms}$ (soit $\approx 2{,}98\ \text{ms}$), $u_C \in [-5\,;\,+5]\ \text{V}$ ;
      - **la courbe** part de $u_C \approx +4{,}5\ \text{V}$ à $t = 0$, descend, coupe l'axe, atteint un minimum, et oscille en s'amortissant lentement : on voit **deux minima et deux maxima** complets, puis la courbe redescend au bord droit ;
      - amplitudes successives lisibles : $+4{,}5$ puis $\approx -4{,}0$, $+3{,}8$, $\approx -3{,}5$, $+3{,}3\ \text{V}$ ; les passages par zéro sont régulièrement espacés, et **le repère $\pi/5$ marque exactement la demi-pseudo-période**.

