    intro: |-
      **EXERCICE 4 — 1. Décharge d'un condensateur dans un dipôle RL (examen national, session normale 2024, Exercice 4 — Partie 1).**

      Le circuit électrique de la figure 1 comporte : un condensateur de capacité $C = 0{,}22\ \text{nF}$ ; une bobine $(b)$ d'inductance $L$ et de résistance $r$ ; un conducteur ohmique de résistance $R$ ajustable ; un interrupteur $K$. Le condensateur est initialement chargé totalement par un générateur de tension idéale de force électromotrice $E$. On ajuste la résistance $R$ à une valeur $R = R_0$. On ferme l'interrupteur $K$ à l'instant $t = 0$. La courbe de la figure 2 représente l'évolution temporelle de la tension $u_C(t)$ aux bornes du condensateur.

      *Figure 1 (schéma) :* boucle rectangulaire. Coin haut-gauche : interrupteur $K$. Branche supérieure : conducteur ohmique $R$ réglable (rhéostat). Branche gauche : condensateur $C$, flèche $u_C$ vers le haut. Branche droite : bobine $(L,r)$, notée $(b)$. Branche inférieure : simple fil.

      *Figure 2 (courbe) :* $u_C\ (\text{V})$ en fonction de $t$ (axe non gradué, simple flèche « t »). Ordonnées graduées $2, 0, -2$ (1 division $=2\ \text{V}$), cadre de $-6\ \text{V}$ à $+6\ \text{V}$ (9 divisions en abscisse). Oscillation pseudopériodique d'amplitude **décroissante** : la courbe part exactement du trait supérieur du cadre, $u_C(0) = +6{,}0\ \text{V}$ ; extrema sur les divisions paires, passages par zéro sur les divisions impaires (pseudopériode $=4$ divisions). Un court trait pointillé étiqueté « $t_1$ » marque le premier passage par zéro (division 1) ; un trait en tirets étiqueté « $t_2$ » marque le second minimum (division 6, $\approx -4{,}3\ \text{V}$). Les amplitudes successives décroissent d'un facteur $\approx 0{,}9$ d'un extremum au suivant.
    questions:
      - id: q1
        part: "1- Décharge d'un condensateur dans un dipôle RL : interprétation énergétique"
        stem: |-
          **(0,25 pt)** Expliquer de point de vue énergétique l'amortissement observé des oscillations dans le circuit.
        reasoning: |-
          Même réponse qu'à la question 1 du sujet 2018 ci-dessus, et le cœur du chapitre 4 : ce circuit comporte deux éléments résistifs — le conducteur ohmique $R_0$ ET la résistance propre $r$ de la bobine — qui dissipent tous deux de l'énergie par effet Joule à chaque passage de courant ($P = Ri^2 > 0$, toujours positive, chapitre 4 : « R est le frein »). L'énergie totale du circuit (chapitre 2) diminue donc à chaque cycle, ce qui se traduit par une amplitude qui décroît d'une oscillation à l'autre — la signature même du régime pseudo-périodique (chapitre 5).
      - id: q2
        stem: |-
          **(0,5 pt)** Établir l'équation différentielle vérifiée par la tension $u_C(t)$ aux bornes du condensateur.
        reasoning: |-
          Même méthode qu'à la question 1b du sujet 2020 ci-dessus (chapitre 6, généralisé) : deux résistances en série, le conducteur ohmique $R_0$ (l'énoncé fixe $R=R_0$ pour cette courbe) et la résistance propre $r$ de la bobine, qu'on additionne au même endroit de la loi des mailles puisqu'elles jouent le même rôle physique.
        steps:
          - math: 'u_C + u_R + u_{bobine} = 0 \qquad \text{avec} \qquad u_{bobine} = L\frac{di}{dt} + r\,i'
            note: "Loi des mailles (chapitre 6) ; deux résistances ici, chapitre 1 (conducteur ohmique ajustable) et r (résistance propre de la bobine), comme a la question 1b du sujet 2020 ci-dessus."
          - math: 'u_C + (R_0+r)\,i + L\frac{di}{dt} = 0'
            note: "On regroupe les deux termes resistifs."
          - math: 'i = C\frac{du_C}{dt} \implies u_C + (R_0+r)C\frac{du_C}{dt} + LC\frac{d^2u_C}{dt^2} = 0'
            note: "On exprime i en u_C (chapitre 3)."
          - math: '\boxed{\frac{d^2u_C}{dt^2} + \frac{R_0+r}{L}\frac{du_C}{dt} + \frac{1}{LC}\,u_C = 0}'
            note: "Division par LC ; forme standard du cas amorti (chapitre 6), R0+r jouant le rôle de la résistance totale."
      - id: q3
        stem: |-
          **(0,5 pt)** Indiquer, en justifiant, dans quel dipôle est principalement emmagasinée l'énergie totale de l'oscillateur à l'instant $t_1$ puis à l'instant $t_2$ (figure 2).
        reasoning: |-
          C'est exactement la mise en garde du chapitre 2 (« arrête-toi — qui stocke quoi, à quel instant ? ») : condensateur et bobine ne stockent jamais leur maximum au même instant, ils sont en opposition de phase. $t_1$ est un passage par zéro de $u_C$ : le condensateur est vide, $E_C = 0$ — toute l'énergie restante est donc dans la **bobine** (magnétique). $t_2$ est un extremum de $u_C$ : le courant y est nul (chapitre 2, un extremum de tension coïncide avec un zéro de courant), donc $E_L = 0$ — toute l'énergie restante est dans le **condensateur** (électrique). C'est précisément le motif du pendule d'énergie du chapitre 2, transposé au régime amorti : l'échange $E_C \leftrightarrow E_L$ continue à l'intérieur de chaque cycle, même si l'enveloppe totale décroît.
      - id: q4
        stem: |-
          **(0,75 pt)** Calculer $E_j = |\Delta E_t|$ l'énergie dissipée par effet Joule dans le circuit entre les instants $t = 0$ et $t = t_2$.
        reasoning: |-
          $t_1$ et $t_2$ étant respectivement un zéro et un extremum de $u_C$ (question précédente), et $t=0$ étant lui aussi un extremum ($u_C(0) = +6{,}0\ \text{V}$, le condensateur totalement chargé au départ) : le courant est nul à la fois en $t=0$ et en $t_2$, donc l'énergie totale y est purement électrique. $E_j$ se calcule alors comme la différence des deux énergies électriques — chapitre 4 : R (ici $R_0+r$) ne fait que dissiper, jamais restituer, donc cette différence est bien l'énergie perdue par effet Joule.
        steps:
          - math: 'E_j = E_t(0) - E_t(t_2) = \frac{1}{2}C\,u_C(0)^2 - \frac{1}{2}C\,u_C(t_2)^2'
            note: "i=0 en t=0 et en t2 (deux extrema de u_C, question précédente) : toute l'énergie y est électrique."
          - math: 'E_j = \frac{1}{2}\times0{,}22\times10^{-9}\times\left(6{,}0^2 - 4{,}3^2\right) = \frac{1}{2}\times0{,}22\times10^{-9}\times(36-18{,}49)'
            note: "Application numérique : u_C(0)=6,0 V (au trait), u_C(t2)=-4,3 V (hors trait, lecture graphique)."
          - math: '\boxed{E_j \approx 1{,}9\times10^{-9}\ \text{J}}'
            note: "Coherent avec le cross-check indépendant de la note de sourcing."

  # ── bk-2024-r-x4b — 2024 R, Exercice 4 (partie 2) : oscillations libres RLC,
  #    bilan d'energie entre deux instants dont AUCUN n'est un extremum ──
  #
  # NOTE ÉDITORIALE — FLAG DE JUMELAGE (bk-2024-r-x4b face à bk-2025-n-x3 et
  # bk-2023-n-x3). Les trois finissent sur « calculer l'énergie dissipée par
  # effet Joule entre deux instants ». Ce ne sont PAS des doublons, et la
  # différence est précisément ce qui fait la difficulté :
  #   — dans bk-2025-n-x3 et bk-2023-n-x3, les deux instants sont des extrema
  #     de u_C, donc i = 0 aux deux bornes et l'énergie y est PUREMENT
  #     électrique : le terme magnétique disparaît par construction et l'élève
  #     n'a jamais à l'écrire ;
  #   — ici, t_1 tombe sur le FLANC MONTANT de u_C (3,30 divisions, entre le
  #     minimum de 3,0 et le maximum de 4,0), donc i n'est pas nul : les deux
  #     termes doivent être posés. Que le terme magnétique se révèle ensuite
  #     négligeable (0,09 % du total) est un RÉSULTAT, pas une dispense.
  # Proposition : garder les trois, cette entrée servant de cas discriminant.
  # À l'arbitrage de l'owner.
  #
  # NOTE ÉDITORIALE — INCOHÉRENCE DU SUJET OFFICIEL, signalée et NON réparée.
  # L'échelle des ordonnées de la figure 4 (u_R en mV) est incompatible d'un
  # facteur ≈ 60 avec les valeurs de L, C, R et E données par l'énoncé : au
  # premier extremum de u_R (≈ 0,45 division) la figure 3 montre u_C ≈ 0, donc
  # l'énergie totale s'y réduit au terme magnétique, soit 3,8e-10 J contre
  # 1,25e-6 J à t = 0 — il faudrait que 99,97 % de l'énergie ait été dissipée
  # en un quart de pseudopériode, ce qu'une courbe montrant encore trois
  # pseudopériodes marquées interdit. Contrôle direct : avec
  # T_0 = 2*pi*sqrt(LC) = 2,8e-4 s, on attend u_R,max ≈ R*C*omega_0*E ≈ 0,56 V,
  # soit ≈ 560 mV, au lieu des ≈ 9,7 mV tracés. CONSÉQUENCE PRATIQUE : aucune.
  # Le résultat officiel 1,1 µJ s'obtient bien avec la figure telle qu'elle est
  # imprimée, justement parce que le terme magnétique y devient négligeable.
  # L'exercice reste exploitable tel quel — mais aucune leçon et aucun exercice
  # dérivé ne doit tirer de la figure 4 une valeur d'intensité, d'inductance ou
  # d'énergie magnétique : elle n'est cohérente qu'avec elle-même.
