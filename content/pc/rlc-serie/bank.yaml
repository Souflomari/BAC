            note: "On élève les deux membres au carré AVANT d'isoler : c'est la que naissent le carré de T0 et le 4 pi carré."
          - math: '\boxed{L = \frac{T_0^{\,2}}{4\pi^{2}C}}'
            note: "Expression littérale, demandee avant l'application numérique (consigne de la page 1 du sujet)."
          - math: 'L = \frac{(0{,}30)^{2}}{4\pi^{2} \times 4{,}7\times10^{-3}} = \frac{0{,}090}{0{,}1856}'
            note: "Application numérique avec T0 = 0,30 s lu a la question 5-1 et C donne par l'énoncé."
          - math: '\boxed{L \approx 0{,}485\ \text{H}}'
            note: "Environ un demi-henry : une bobine banale. Ce controle de vraisemblance valide toute la chaîne depuis la lecture de la figure."
      - id: q7
        stem: |-
          **6-** (0,75 pt) On rappelle que l'énergie totale $E_T$ du circuit est, à chaque instant, la somme des énergies électrique et magnétique, emmagasinées respectivement dans le condensateur et la bobine.

          Montrer que l'énergie $E_T$ se conserve. Calculer sa valeur.
        reasoning: |-
          Deux demandes distinctes, et la première est une **démonstration** — pas une affirmation. C'est le cœur du chapitre 2 (le pendule d'énergie), et cette question relève aussi de la notion sœur « **Aspects énergétiques** », honorée ici sans être dupliquée : le barème est réparti, jamais compté deux fois.

          **Ce qu'il faut écrire.** L'énergie totale est la somme des deux termes :

          $$E_T = E_e + E_m = \frac{q^2}{2C} + \frac{1}{2}L\,i^2$$

          On y reporte les expressions de $q$ et de $i$ du régime établi à la question 2 : $q = Q_m\cos(\omega_0 t)$, donc $i = \dfrac{\mathrm{d}q}{\mathrm{d}t} = -Q_m\omega_0\sin(\omega_0 t)$ :

          $$E_T = \frac{Q_m^2}{2C}\cos^2(\omega_0 t) + \frac{1}{2}L\,Q_m^2\,\omega_0^2\sin^2(\omega_0 t)$$

          **Le geste qui décide de tout** : on utilise la relation $\omega_0^2 = \dfrac{1}{LC}$ de la question 2, donc $L\,\omega_0^2 = \dfrac{1}{C}$, et le second coefficient devient **identique au premier** :

          $$E_T = \frac{Q_m^2}{2C}\left[\cos^2(\omega_0 t) + \sin^2(\omega_0 t)\right] = \frac{Q_m^2}{2C}$$

          Le crochet vaut $1$ à chaque instant. **$E_T$ ne dépend plus du temps : elle est constante.** L'énergie n'est ni créée ni perdue — elle **fait l'aller-retour** entre le condensateur et la bobine, deux fois par période, exactement au rythme des arches de la figure 2.

          **Pourquoi ça ne pouvait pas être autrement, et c'est le contrôle de sens.** Le circuit ne contient **aucune résistance** : ni le résistor (hors circuit en position 2), ni la bobine (résistance négligeable, l'énoncé le dit). Or la résistance est le seul dipôle qui **dissipe** de l'énergie, par effet Joule (chapitre 4). Sans elle, rien ne s'échappe. C'est la traduction énergétique de ce qu'on avait déjà vu sur l'équation différentielle de la question 1 : pas de terme du premier ordre, pas d'amortissement, pas de perte.

          **La valeur.** Le plus simple est de l'évaluer à l'instant $t = 0$, où toute l'énergie est dans le condensateur ($i = 0$, la bobine ne stocke rien) :

          $$E_T = \frac{Q_m^2}{2C} = \frac{\left(5{,}64\times10^{-2}\right)^2}{2 \times 4{,}7\times10^{-3}} = \frac{3{,}181\times10^{-3}}{9{,}4\times10^{-3}} \approx 0{,}34\ \text{J}$$

          **Le contrôle interne qui ferme, et il vaut la peine d'être fait.** Puisque $Q_m = CE$, on peut aussi écrire $E_T = \dfrac{(CE)^2}{2C} = \dfrac{1}{2}CE^2 = \dfrac{1}{2} \times 4{,}7\times10^{-3} \times 12^2 = 0{,}3384\ \text{J}$. **Les deux chemins donnent le même nombre** — l'un passe par la charge, l'autre par la tension —, ce qui vérifie du même coup la question 4.

          **Le piège de cette question.** Écrire l'énergie magnétique avec un signe moins, ou oublier le facteur $\dfrac{1}{2}$. Les deux termes ont exactement la même forme, $\dfrac{1}{2}\times$ (grandeur au carré) $\times$ (coefficient du dipôle) : $\dfrac{1}{2}\dfrac{q^2}{C}$ pour le condensateur, $\dfrac{1}{2}Li^2$ pour la bobine. Une énergie stockée est **toujours positive** — c'est d'ailleurs une des coquilles que la vérification a relevées dans le corrigé non officiel d'un sujet voisin.
        steps:
          - math: 'E_T = E_e + E_m = \frac{q^{2}}{2C} + \frac{1}{2}L\,i^{2}'
            note: "Les deux énergies stockees. Les deux termes sont positifs et de même forme : un demi, fois une grandeur au carré, fois le coefficient du dipole."
          - math: 'q = Q_m\cos(\omega_0 t) \qquad i = \frac{\mathrm{d}q}{\mathrm{d}t} = -Q_m\omega_0\sin(\omega_0 t)'
            note: "Régime établi a la question 2 : l'intensité est la dérivée de la charge."
          - math: 'L\,\omega_0^{2} = \frac{1}{C} \quad\Longrightarrow\quad E_T = \frac{Q_m^{2}}{2C}\left[\cos^{2}(\omega_0 t) + \sin^{2}(\omega_0 t)\right]'
            note: "Geste decisif : la relation omega0 carré = 1/(LC) rend les deux coefficients identiques et permet de factoriser."
          - math: '\boxed{E_T = \frac{Q_m^{2}}{2C} = \text{constante}}'
            note: "Le crochet vaut 1 à chaque instant : E_T ne dépend plus du temps. Sans résistance, rien ne se dissipe."
          - math: '\boxed{E_T = \frac{\left(5{,}64\times10^{-2}\right)^{2}}{2 \times 4{,}7\times10^{-3}} \approx 0{,}34\ \text{J}}'
            note: "Valeur numérique, 0,3384 J exactement. Controle interne : E_T = CE carré sur 2 = 0,5 x 4,7e-3 x 144 = 0,3384 J, même nombre par un autre chemin."
