<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"
     font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
     aria-label="Entretien des oscillations : un générateur compense la perte Joule sans imposer la fréquence">

  <!--
    entretien-compensation.motion.svg  (v1 — MotionStage engine, ADR 0022)
    ─────────────────────────────────────────────────────────────────────────
    For R7 ("L'entretien des oscillations"). Teaches: the entretien generator
    COMPENSATES the Joule loss (k = R) — it does not impose a frequency.

    Engine: MotionStage.tsx (fade verb for the generator/marker/status; trace
    verb for the steady-amplitude continuation curve; replace layout model
    for the status badge).

    LAYOUT MODEL: replace
      Regions: chrome / circuit (compact RLC+generator schematic) /
      status-slot (one status badge at a time) / graph (u_C(t) timeline) /
      footer (boundary note).

    BEATS
      beat-0 (settled on load): decaying u_C(t) trace already drawn (chrome,
             no tween — beat-0 has zero tweens per the authoring contract).
             status-0 visible: "Sans entretien — l'amplitude décroît."
      beat-1: the generator glyph fades into the circuit schematic; a dashed
             "générateur activé" marker fades in on the graph at the join
             point; status-1 replaces status-0.
      beat-2: the steady, constant-amplitude curve DRAWS ON (verb: trace)
             to the right of the join point, continuing at the SAME period
             as the decaying part (T₀ is unchanged — only the envelope
             stops shrinking). status-2 replaces status-1.

    CURVE CONTINUITY: #decay-curve ends at (350,320) exactly where
    #steady-curve begins — same point, same phase — so the join reads as
    one continuous timeline, not two unrelated graphs.

    BOUNDARY §0.4: no pseudo-period formula, no damping coefficient, no
    e^{-αt} envelope. The steady curve is drawn as a plain constant-amplitude
    sinusoid — no formula for the transition is shown.

    PALETTE: var(--figure-*) tokens throughout. #decay-curve uses
    var(--figure-regime-pseudo) (this IS the pseudo-périodique regime);
    #steady-curve uses var(--figure-regime-periodic) (once entretenue, it
    behaves like the periodic/ideal case again).

    NO-FLASH CONTRACT: beat-0 elements (decay curve, status-0, circuit sans
    générateur) authored visible. Beat ≥ 1 elements (generator glyph, engage
    marker, steady curve, status-1/2) authored opacity="0". Beat-0 tweens: [].
  -->

  <!-- ── Background ────────────────────────────────────────────────────── -->
  <rect width="680" height="480" rx="8" fill="var(--figure-surface)"/>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle"
        font-size="13" font-weight="600" fill="var(--figure-ink)">
    Entretenir les oscillations : compenser la perte, pas imposer un rythme
  </text>
  <text x="340" y="44" text-anchor="middle"
        font-size="10.5" fill="var(--figure-ink-soft)">
    Le générateur u<tspan dy="3" font-size="7.5">G</tspan><tspan dy="-3"> = k·i restitue l’énergie perdue par effet Joule dans R</tspan>
  </text>


  <!-- ══════════════════════════════════════════════════════════════════════
       CIRCUIT STRIP — compact RLC loop + generator (always visible except
       the generator glyph, which joins at beat-1).
       ══════════════════════════════════════════════════════════════════════ -->

  <rect x="40" y="54" width="600" height="112" rx="6" fill="var(--figure-grid)" opacity="0.20"/>

  <!-- Loop wires -->
  <line x1="100" y1="64"  x2="580" y2="64"  stroke="var(--figure-ink-soft)" stroke-width="2"/>
  <line x1="100" y1="158" x2="580" y2="158" stroke="var(--figure-ink-soft)" stroke-width="2"/>
  <!-- Left wire, capacitor gap -->
  <line x1="100" y1="64"  x2="100" y2="102" stroke="var(--figure-ink-soft)" stroke-width="2"/>
  <line x1="100" y1="116" x2="100" y2="158" stroke="var(--figure-ink-soft)" stroke-width="2"/>
  <!-- Right wire (generator sits here, always drawn — the glyph paints
       over it once it fades in) -->
  <line x1="580" y1="64" x2="580" y2="158" stroke="var(--figure-ink-soft)" stroke-width="2"/>

  <!-- Corner nodes -->
  <circle cx="100" cy="64"  r="3" fill="var(--figure-ink-soft)"/>
  <circle cx="580" cy="64"  r="3" fill="var(--figure-ink-soft)"/>
  <circle cx="580" cy="158" r="3" fill="var(--figure-ink-soft)"/>
  <circle cx="100" cy="158" r="3" fill="var(--figure-ink-soft)"/>

  <!-- Capacitor C (left wire) -->
  <line x1="82"  y1="102" x2="118" y2="102" stroke="var(--figure-energy-C)" stroke-width="3" stroke-linecap="round"/>
  <line x1="82"  y1="116" x2="118" y2="116" stroke="var(--figure-energy-C)" stroke-width="3" stroke-linecap="round"/>
  <text x="66" y="113" text-anchor="middle" font-size="13" font-style="italic" font-weight="600" fill="var(--figure-energy-C)">C</text>

  <!-- Resistor R (top wire) -->
  <rect x="220" y="54" width="40" height="20" rx="4"
        fill="var(--figure-surface)" stroke="var(--figure-ink-soft)" stroke-width="2"/>
  <text x="240" y="69" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink)">R</text>

  <!-- Current arrow (top wire) -->
  <line x1="140" y1="64" x2="172" y2="64" stroke="var(--figure-ink-soft)" stroke-width="2"/>
  <polygon points="172,64 161,59 161,69" fill="var(--figure-ink-soft)"/>
  <text x="156" y="55" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">i</text>

  <!-- Inductor L (bottom wire, coil arcs) -->
  <path d="M380,158 a12,12 0 0,1 24,0" fill="none" stroke="var(--figure-energy-L)" stroke-width="2.5"/>
  <path d="M404,158 a12,12 0 0,1 24,0" fill="none" stroke="var(--figure-energy-L)" stroke-width="2.5"/>
  <path d="M428,158 a12,12 0 0,1 24,0" fill="none" stroke="var(--figure-energy-L)" stroke-width="2.5"/>
  <text x="458" y="150" font-size="13" font-style="italic" font-weight="600" fill="var(--figure-energy-L)">L</text>

  <!--
    GENERATOR GLYPH (beat-1) — a circle with a small sine squiggle (standard
    "controlled source" convention), sitting on the right wire, plus its
    defining relation. Authored opacity="0" — fades in at beat-1.
  -->
  <g id="generator-glyph" opacity="0">
    <circle cx="580" cy="111" r="17" fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="2"/>
    <path d="M568,111 q6,-10 12,0 t12,0" fill="none" stroke="var(--figure-accent)" stroke-width="1.8"/>
    <!-- Relation beside the circle (left of the wire) — centered under it,
         the wire strikes through the '=' (Day-6 verification). -->
    <text x="558" y="115" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--figure-accent)">
      u<tspan dy="3" font-size="7.5">G</tspan><tspan dy="-3"> = k·i</tspan>
    </text>
    <!-- Name sits WITH the glyph (below the top wire, above the circle) —
         at the canvas top edge it read as a continuation of the figure
         subtitle instead of as the glyph's label (Day-6 verification). -->
    <text x="566" y="84" text-anchor="end" font-size="9.5" fill="var(--figure-accent)">
      générateur d’entretien
    </text>
  </g>


  <!-- ══════════════════════════════════════════════════════════════════════
       STATUS SLOT — exactly ONE status badge visible at a time.
       ══════════════════════════════════════════════════════════════════════ -->

  <g id="status-0">
    <rect x="210" y="180" width="320" height="32" rx="5" fill="var(--figure-regime-pseudo)" opacity="0.12"/>
    <text x="370" y="201" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-regime-pseudo)">
      Sans entretien — l’amplitude décroît
    </text>
  </g>

  <g id="status-1" opacity="0">
    <rect x="210" y="180" width="320" height="32" rx="5" fill="var(--figure-accent)" opacity="0.12"/>
    <text x="370" y="201" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-accent)">
      Générateur en fonctionnement — u<tspan dy="3" font-size="8">G</tspan><tspan dy="-3"> = k·i</tspan>
    </text>
  </g>

  <g id="status-2" opacity="0">
    <rect x="210" y="180" width="320" height="32" rx="5" fill="var(--figure-regime-periodic)" opacity="0.12"/>
    <text x="370" y="201" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-regime-periodic)">
      k = R — oscillations entretenues à la période propre T₀
    </text>
  </g>


  <!-- ══════════════════════════════════════════════════════════════════════
       GRAPH — u_C(t) timeline: decay, then (once entretenue) constant.
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- Axes (always visible chrome) -->
  <line x1="90" y1="320" x2="650" y2="320" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
  <polygon points="650,320 639,315 639,325" fill="var(--figure-ink-soft)"/>
  <line x1="90" y1="376" x2="90" y2="248" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>
  <polygon points="90,248 85,259 95,259" fill="var(--figure-ink-soft)"/>
  <text x="654" y="324" font-size="11" fill="var(--figure-ink-soft)">t</text>
  <text x="83" y="246" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">u</text>
  <text x="88" y="253" font-size="8" fill="var(--figure-ink-soft)">C</text>
  <text x="82" y="324" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
  <line x1="86" y1="276" x2="94" y2="276" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="80" y="280" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">U₀</text>

  <!-- Decaying trace — beat-0, already drawn (chrome, no tween) -->
  <path id="decay-curve"
        d="M110,320
           C117,293 123,276 130,276
           C137,276 143,293 150,320
           C157,347 163,364 170,364
           C177,364 183,347 190,320
           C197,302 203,290 210,290
           C217,290 223,302 230,320
           C237,338 243,350 250,350
           C257,350 263,338 270,320
           C277,308 283,300 290,300
           C297,300 303,308 310,320
           C317,332 323,340 330,340
           C337,340 343,332 350,320"
        fill="none"
        stroke="var(--figure-regime-pseudo)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!--
    Steady, constant-amplitude continuation — beat-2, drawn via `trace`.
    Starts EXACTLY where #decay-curve ends: (350,320), same phase.
    Authored opacity="0" (pre-state; the engine's setPre also forces
    drawSVG:0% + autoAlpha:1 before playing).
  -->
  <path id="steady-curve"
        d="M350,320
           C357,308 363,300 370,300
           C377,300 383,308 390,320
           C397,332 403,340 410,340
           C417,340 423,332 430,320
           C437,308 443,300 450,300
           C457,300 463,308 470,320
           C477,332 483,340 490,340
           C497,340 503,332 510,320
           C517,308 523,300 530,300
           C537,300 543,308 550,320
           C557,332 563,340 570,340
           C577,340 583,332 590,320
           C597,308 603,300 610,300
           C617,300 623,308 630,320"
        fill="none"
        stroke="var(--figure-regime-periodic)"
        stroke-width="2.2"
        stroke-linejoin="round"
        opacity="0"/>

  <!--
    "Générateur activé" marker — dashed vertical line at the join point,
    fades in at beat-1 alongside the generator glyph above.
  -->
  <g id="engage-marker" opacity="0">
    <line x1="350" y1="248" x2="350" y2="376"
          stroke="var(--figure-accent)" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.6"/>
    <text x="350" y="232" text-anchor="middle" font-size="9.5" font-style="italic" fill="var(--figure-accent)">
      générateur activé
    </text>
  </g>


  <!-- ══════════════════════════════════════════════════════════════════════
       FOOTER — boundary note
       ══════════════════════════════════════════════════════════════════════ -->

  <text x="340" y="440" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">
    k = R : le générateur compense exactement la perte Joule — il ne fixe pas la fréquence.
  </text>
  <text x="340" y="457" text-anchor="middle" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">
    Aucune formule de pseudo-période amortie ni de coefficient d’amortissement affichée.
  </text>

</svg>
