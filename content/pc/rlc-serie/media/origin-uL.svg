<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    origin-uL.svg — Origine de u_L = L·di/dt
    A coil opposes changes in current (inertia for current).
    The faster the current changes, the harder it pushes back.
    So u_L ∝ rate of change of i → u_L = L·di/dt.
    No flux integrals; no self-induction derivation — only the intuition.

    Layout:
    LEFT: the coil with current ramping (increasing) and a "resistance to change" arrow
    CENTRE: the rate-of-change concept  di/dt
    RIGHT: the formula  u_L = L·di/dt

    Palette: bg #F5F3EF, panel #EDEAE5, coil/L-accent #2A2A2E / #7E9CC8,
             current arrow #3E5C86, push-back arrow warm #B06040,
             formula accent #7E9CC8, text #2A2A2E, muted #6B6B72
  -->

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="420" height="230" rx="8" fill="#F5F3EF"/>

  <!-- ── Heading ──────────────────────────────────────────────── -->
  <text x="210" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
    Pourquoi u<tspan dy="3" font-size="8.5">L</tspan><tspan dy="-3"> = L·di/dt ?</tspan>
  </text>

  <!-- ════════════════════════════════════════════════════════
       LEFT PANEL — Coil with ramping current + opposition arrow
       ════════════════════════════════════════════════════════ -->
  <rect x="12" y="30" width="168" height="186" rx="5" fill="#EDEAE5"/>

  <!-- Wire entering coil from left, wire leaving to the right -->
  <line x1="18" y1="108" x2="44"  y2="108" stroke="#4A4A52" stroke-width="2"/>
  <line x1="162" y1="108" x2="174" y2="108" stroke="#4A4A52" stroke-width="2"/>

  <!-- Coil symbol (4 arcs, x=44..162, y=108) -->
  <path d="M44,108  a14.5,12 0 0,1 29.5,0" fill="none" stroke="#2A2A2E" stroke-width="2.2"/>
  <path d="M73.5,108 a14.5,12 0 0,1 29.5,0" fill="none" stroke="#2A2A2E" stroke-width="2.2"/>
  <path d="M103,108  a14.5,12 0 0,1 29.5,0" fill="none" stroke="#2A2A2E" stroke-width="2.2"/>
  <path d="M132.5,108 a14.5,12 0 0,1 29.5,0" fill="none" stroke="#2A2A2E" stroke-width="2.2"/>

  <!-- L label above coil -->
  <text x="103" y="92" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">L</text>

  <!-- Current i arrow entering from left (increasing) -->
  <line x1="20" y1="126" x2="58" y2="126" stroke="#3E5C86" stroke-width="2"/>
  <polygon points="58,126 48,122 48,130" fill="#3E5C86"/>
  <text x="38" y="142" text-anchor="middle" font-size="11" font-style="italic" fill="#3E5C86">i ↑</text>
  <text x="38" y="155" text-anchor="middle" font-size="9" fill="#6B6B72">(croissant)</text>

  <!-- "Coil opposes the change" — push-back arrow pointing AGAINST the current -->
  <line x1="162" y1="126" x2="118" y2="126" stroke="#B06040" stroke-width="2"/>
  <polygon points="118,126 128,122 128,130" fill="#B06040"/>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#B06040">résistance</text>
  <text x="140" y="155" text-anchor="middle" font-size="10" fill="#B06040">au changement</text>

  <!-- "More di/dt → stronger u_L" qualitative arrows -->
  <text x="90" y="178" text-anchor="middle" font-size="9.5" fill="#6B6B72">plus i monte vite,</text>
  <text x="90" y="191" text-anchor="middle" font-size="9.5" fill="#6B6B72">plus la bobine résiste fort.</text>
  <!-- → u_L ∝ di/dt -->
  <text x="90" y="207" text-anchor="middle" font-size="10" fill="#7E9CC8">u<tspan dy="3" font-size="7.5">L</tspan><tspan dy="-3"> ∝ di/dt</tspan></text>

  <!-- ════════════════════════════════════════════════════════
       CENTRE PANEL — Rate of change di/dt qualitative graph
       ════════════════════════════════════════════════════════ -->
  <rect x="192" y="30" width="110" height="186" rx="5" fill="#EDEAE5"/>

  <!-- Mini axes for i(t) -->
  <line x1="206" y1="174" x2="294" y2="174" stroke="#8A8A92" stroke-width="1.3"/>
  <polygon points="294,174 286,170 286,178" fill="#8A8A92"/>
  <line x1="206" y1="174" x2="206" y2="52" stroke="#8A8A92" stroke-width="1.3"/>
  <polygon points="206,52 201,63 211,63" fill="#8A8A92"/>
  <text x="298" y="178" font-size="10" font-style="italic" fill="#6B6B72">t</text>
  <text x="198" y="51" text-anchor="end" font-size="10" font-style="italic" fill="#6B6B72">i</text>
  <text x="198" y="178" text-anchor="end" font-size="9.5" fill="#8A8A92">0</text>

  <!-- Linearly rising i(t) line -->
  <line x1="206" y1="174" x2="288" y2="66" stroke="#3E5C86" stroke-width="2.2"/>

  <!-- Slope indicator: small triangle showing di/dt -->
  <!-- Δt horizontal at x=240..270, Δi vertical -->
  <line x1="240" y1="134" x2="270" y2="134" stroke="#B06040" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="270" y1="134" x2="270" y2="93"  stroke="#B06040" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="255" y="148" text-anchor="middle" font-size="8.5" fill="#B06040">Δt</text>
  <text x="280" y="116" text-anchor="middle" font-size="8.5" fill="#B06040">Δi</text>

  <!-- di/dt label -->
  <text x="247" y="192" text-anchor="middle" font-size="10" fill="#B06040">di/dt = Δi/Δt</text>

  <!-- Panel title -->
  <text x="247" y="46" text-anchor="middle" font-size="10" fill="#6B6B72" font-weight="600">pente = di/dt</text>

  <!-- ════════════════════════════════════════════════════════
       RIGHT PANEL — Formula u_L = L·di/dt
       ════════════════════════════════════════════════════════ -->
  <rect x="314" y="30" width="94" height="186" rx="5" fill="#EDEAE5"/>

  <!-- Proportionality chain -->
  <text x="361" y="60" text-anchor="middle" font-size="9.5" fill="#6B6B72">u<tspan dy="3" font-size="7.5">L</tspan><tspan dy="-3"> ∝ di/dt</tspan></text>

  <!-- L is the constant of proportionality -->
  <text x="361" y="82" text-anchor="middle" font-size="9.5" fill="#6B6B72">L = « inertie »</text>
  <text x="361" y="95" text-anchor="middle" font-size="9.5" fill="#6B6B72">de la bobine</text>

  <!-- Arrow down to formula -->
  <text x="361" y="116" text-anchor="middle" font-size="11" fill="#8A8A92">↓</text>

  <!-- Formula box -->
  <rect x="320" y="122" width="82" height="32" rx="4" fill="#7E9CC8" fill-opacity="0.18"/>
  <text x="361" y="143" text-anchor="middle" font-size="14" font-style="italic" fill="#7E9CC8">
    u<tspan dy="4" font-size="8.5">L</tspan><tspan dy="-4"> = L·di/dt</tspan>
  </text>

  <!-- Interpretation -->
  <text x="361" y="168" text-anchor="middle" font-size="9" fill="#6B6B72">L grand :</text>
  <text x="361" y="180" text-anchor="middle" font-size="9" fill="#6B6B72">résistance forte</text>
  <text x="361" y="192" text-anchor="middle" font-size="9" fill="#6B6B72">au changement</text>
  <text x="361" y="208" text-anchor="middle" font-size="9.5" fill="#7E9CC8">sans intégrale de flux</text>

</svg>
