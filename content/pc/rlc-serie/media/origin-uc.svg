<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    origin-uc.svg — Origine de u_C = q/C
    A capacitor with charge building up on its plates, u_C rising in step.
    Two-panel layout: LEFT = capacitor diagram; RIGHT = qualitative q → u_C graph.

    Shows: more charge q on plates → bigger push-back = bigger u_C.
    The proportionality: u_C = q/C (C is the constant; C large = more charge per volt).

    Palette: bg #F5F3EF, panel #EDEAE5, plates / accent-dark #3E5C86,
             charge dots #3E5C86 (positive) / #7E9CC8 (negative),
             arrow/graph #3E5C86, text #2A2A2E, secondary #6B6B72
  -->

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="400" height="240" rx="8" fill="#F5F3EF"/>

  <!-- ── Heading ──────────────────────────────────────────────── -->
  <text x="200" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
    Pourquoi u<tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3"> = q/C ?</tspan>
  </text>

  <!-- ════════════════════════════════════════════════════════
       LEFT PANEL — Capacitor cross-section
       Plates at x=80..120 (left) and x=160..200 (right), y=50..170
       ════════════════════════════════════════════════════════ -->
  <rect x="18" y="34" width="200" height="192" rx="5" fill="#EDEAE5"/>

  <!-- Left plate (positive) -->
  <rect x="78" y="52" width="12" height="120" rx="2" fill="#3E5C86"/>
  <!-- Right plate (negative) -->
  <rect x="148" y="52" width="12" height="120" rx="2" fill="#7E9CC8"/>

  <!-- Plate labels -->
  <text x="84" y="46" text-anchor="middle" font-size="9" fill="#3E5C86" font-weight="600">+</text>
  <text x="154" y="46" text-anchor="middle" font-size="9" fill="#7E9CC8" font-weight="600">−</text>

  <!-- Charge symbols on left plate (positive charges, +) -->
  <text x="98" y="78"  font-size="11" fill="#3E5C86" font-weight="600">+</text>
  <text x="98" y="100" font-size="11" fill="#3E5C86" font-weight="600">+</text>
  <text x="98" y="122" font-size="11" fill="#3E5C86" font-weight="600">+</text>
  <text x="98" y="144" font-size="11" fill="#3E5C86" font-weight="600">+</text>
  <text x="98" y="166" font-size="11" fill="#3E5C86" font-weight="600">+</text>

  <!-- Charge symbols on right plate (negative charges, −) -->
  <text x="134" y="78"  font-size="11" fill="#7E9CC8" font-weight="600">−</text>
  <text x="134" y="100" font-size="11" fill="#7E9CC8" font-weight="600">−</text>
  <text x="134" y="122" font-size="11" fill="#7E9CC8" font-weight="600">−</text>
  <text x="134" y="144" font-size="11" fill="#7E9CC8" font-weight="600">−</text>
  <text x="134" y="166" font-size="11" fill="#7E9CC8" font-weight="600">−</text>

  <!-- Electric field arrows in gap (left to right) -->
  <line x1="106" y1="82" x2="136" y2="82" stroke="#5A7A4A" stroke-width="1.2"/>
  <polygon points="136,82 128,79 128,85" fill="#5A7A4A"/>
  <line x1="106" y1="112" x2="136" y2="112" stroke="#5A7A4A" stroke-width="1.2"/>
  <polygon points="136,112 128,109 128,115" fill="#5A7A4A"/>
  <line x1="106" y1="142" x2="136" y2="142" stroke="#5A7A4A" stroke-width="1.2"/>
  <polygon points="136,142 128,139 128,145" fill="#5A7A4A"/>

  <!-- u_C arrow spanning from left plate to right plate, below the plates -->
  <line x1="90" y1="182" x2="148" y2="182" stroke="#3E5C86" stroke-width="1.6"/>
  <polygon points="148,182 140,178 140,186" fill="#3E5C86"/>
  <!-- arrowhead on left too (double-headed for tension) -->
  <polygon points="90,182 98,178 98,186" fill="#3E5C86"/>
  <!-- u_C label -->
  <text x="119" y="198" text-anchor="middle" font-size="12" font-style="italic" fill="#3E5C86">
    u<tspan dy="4" font-size="8.5">C</tspan>
  </text>

  <!-- q label outside left plate -->
  <text x="66" y="112" text-anchor="end" font-size="11" font-style="italic" fill="#3E5C86">q</text>

  <!-- Caption inside panel -->
  <text x="119" y="218" text-anchor="middle" font-size="9.5" fill="#6B6B72">Plus q est grande,</text>
  <text x="119" y="230" text-anchor="middle" font-size="9.5" fill="#6B6B72">plus u<tspan dy="3" font-size="7.5">C</tspan><tspan dy="-3"> est grande.</tspan></text>

  <!-- ════════════════════════════════════════════════════════
       RIGHT PANEL — Qualitative graph: q → u_C (linear)
       ════════════════════════════════════════════════════════ -->
  <rect x="228" y="34" width="156" height="192" rx="5" fill="#EDEAE5"/>

  <!-- Axes -->
  <line x1="248" y1="200" x2="372" y2="200" stroke="#8A8A92" stroke-width="1.4"/>
  <polygon points="372,200 363,196 363,204" fill="#8A8A92"/>
  <line x1="248" y1="200" x2="248" y2="50" stroke="#8A8A92" stroke-width="1.4"/>
  <polygon points="248,50 243,61 253,61" fill="#8A8A92"/>
  <!-- Axis labels -->
  <text x="376" y="204" font-size="10.5" font-style="italic" fill="#6B6B72">q</text>
  <text x="240" y="50" text-anchor="end" font-size="10.5" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="7.5">C</tspan></text>
  <text x="240" y="204" text-anchor="end" font-size="9.5" fill="#8A8A92">0</text>

  <!-- Linear relationship u_C = q/C — straight line from (248,200) to (366,70) -->
  <line x1="248" y1="200" x2="366" y2="70" stroke="#3E5C86" stroke-width="2.2"/>

  <!-- Slope annotation: pente = 1/C -->
  <text x="320" y="118" text-anchor="middle" font-size="9.5" fill="#3E5C86" font-style="italic">pente = 1/C</text>

  <!-- Formula box -->
  <rect x="254" y="58" width="110" height="28" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
  <text x="309" y="77" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3E5C86">
    u<tspan dy="4" font-size="8.5">C</tspan><tspan dy="-4"> = q/C</tspan>
  </text>

  <!-- Caption -->
  <text x="309" y="218" text-anchor="middle" font-size="9.5" fill="#6B6B72">relation linéaire,</text>
  <text x="309" y="230" text-anchor="middle" font-size="9.5" fill="#6B6B72">C = charge par volt</text>

</svg>
