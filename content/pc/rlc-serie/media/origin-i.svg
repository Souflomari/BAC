<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    origin-i.svg — Origine de i = dq/dt
    Current as the flow-rate of charge through a cross-section of wire.

    Layout:
    LEFT side: a wire cross-section with charge "blobs" moving through it
    RIGHT side: the time-rate relation i = dq/dt shown graphically

    Pedagogical idea: i IS the rate at which q changes.
    Charges leaving the capacitor plate per second = i.
    The integral form q = ∫i dt is intentionally omitted (heavier than the
    origin-intuition register; not needed here).

    Palette: bg transparent, panel #EDEAE5, charge #3E5C86, wire #4A4A52,
             accent arrow #3E5C86, secondary #7E9CC8, text #2A2A2E, muted #6B6B72
  -->

  <!-- ── Background: transparent (app surface shows through) ──── -->

  <!-- ── Heading ──────────────────────────────────────────────── -->
  <text x="200" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
    Pourquoi i = dq/dt ?
  </text>

  <!-- ════════════════════════════════════════════════════════
       LEFT PANEL — Wire cross-section with flowing charges
       ════════════════════════════════════════════════════════ -->
  <rect x="14" y="30" width="186" height="148" rx="5" fill="#EDEAE5"/>

  <!-- Wire tube (horizontal) — top and bottom edges -->
  <line x1="30"  y1="76"  x2="196" y2="76"  stroke="#4A4A52" stroke-width="2"/>
  <line x1="30"  y1="126" x2="196" y2="126" stroke="#4A4A52" stroke-width="2"/>
  <!-- Left end cap -->
  <line x1="30" y1="76" x2="30" y2="126" stroke="#4A4A52" stroke-width="2"/>
  <!-- Small arrows showing continuation right -->
  <text x="194" y="104" font-size="14" fill="#4A4A52">→</text>

  <!-- Cross-section measurement line (vertical dashed) at x=110 -->
  <line x1="110" y1="66" x2="110" y2="136" stroke="#3E5C86" stroke-width="1.6" stroke-dasharray="5,3"/>
  <!-- Cross-section label -->
  <text x="110" y="62" text-anchor="middle" font-size="9" fill="#3E5C86">section S</text>

  <!-- Charge blobs (positive, moving right) — at various x positions -->
  <!-- Group 1: past the cross-section (right side) — already through -->
  <circle cx="136" cy="88"  r="7" fill="#3E5C86" fill-opacity="0.8"/>
  <text x="136" y="92" text-anchor="middle" font-size="9" fill="#F5F3EF" font-weight="600">+</text>
  <circle cx="162" cy="114" r="7" fill="#3E5C86" fill-opacity="0.8"/>
  <text x="162" y="118" text-anchor="middle" font-size="9" fill="#F5F3EF" font-weight="600">+</text>

  <!-- Group 2: approaching / crossing (left side) -->
  <circle cx="80"  cy="100" r="7" fill="#3E5C86" fill-opacity="0.5"/>
  <text x="80" y="104" text-anchor="middle" font-size="9" fill="#F5F3EF" font-weight="600">+</text>
  <circle cx="55"  cy="86"  r="7" fill="#3E5C86" fill-opacity="0.35"/>
  <text x="55" y="90" text-anchor="middle" font-size="9" fill="#F5F3EF" font-weight="600">+</text>
  <circle cx="44"  cy="114" r="7" fill="#3E5C86" fill-opacity="0.25"/>
  <text x="44" y="118" text-anchor="middle" font-size="9" fill="#F5F3EF" font-weight="600">+</text>

  <!-- Motion arrows on the charges -->
  <line x1="88" y1="100" x2="100" y2="100" stroke="#3E5C86" stroke-width="1.4"/>
  <polygon points="100,100 94,97 94,103" fill="#3E5C86"/>
  <line x1="63" y1="86" x2="75" y2="86" stroke="#3E5C86" stroke-width="1.4"/>
  <polygon points="75,86 69,83 69,89" fill="#3E5C86"/>

  <!-- i arrow overall (bulk current direction) -->
  <line x1="34" y1="148" x2="190" y2="148" stroke="#3E5C86" stroke-width="2.2"/>
  <polygon points="190,148 180,144 180,152" fill="#3E5C86"/>
  <text x="112" y="164" text-anchor="middle" font-size="13" font-style="italic" fill="#3E5C86">i</text>

  <!-- "Δq charges pass S in Δt" annotation -->
  <text x="107" y="176" text-anchor="middle" font-size="9.5" fill="#6B6B72">Δq charges passent S en Δt</text>

  <!-- ════════════════════════════════════════════════════════
       RIGHT PANEL — Time-rate relation i = dq/dt
       ════════════════════════════════════════════════════════ -->
  <rect x="210" y="30" width="176" height="148" rx="5" fill="#EDEAE5"/>

  <!-- Relation derivation, step by step -->
  <text x="298" y="58" text-anchor="middle" font-size="10.5" fill="#6B6B72">charge Δq en temps Δt :</text>

  <!-- i = Δq/Δt -->
  <text x="298" y="82" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">
    i = Δq / Δt
  </text>

  <!-- "à la limite Δt→0" -->
  <text x="298" y="104" text-anchor="middle" font-size="9.5" fill="#6B6B72">à la limite Δt → 0 :</text>

  <!-- i = dq/dt (formula, larger, highlighted) -->
  <rect x="232" y="112" width="132" height="32" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
  <text x="298" y="133" text-anchor="middle" font-size="14" font-style="italic" fill="#3E5C86">
    i = dq/dt
  </text>

  <!-- Intuition lines -->
  <text x="298" y="158" text-anchor="middle" font-size="9.5" fill="#6B6B72">i = vitesse d'écoulement</text>
  <text x="298" y="171" text-anchor="middle" font-size="9.5" fill="#6B6B72">de la charge q</text>

  <!-- Note: q = ∫i dt intentionally omitted (heavier than this register) -->

</svg>
