<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600"
     font-family="'Segoe UI', system-ui, sans-serif"
     aria-label="Animation : construction de la loi des mailles terme par terme"
     data-motion-steps="5">

  <!--
    M-3 loi-des-mailles-build.motion.svg  (v2 — click-to-advance)
    ─────────────────────────────────────────────────────────────────────────
    STEP CONTRACT (renderer drives visibility — cumulative)
      step-1  Circuit schematic + u_C highlighted; equation shows "u_C"
      step-2  + u_L highlighted; equation adds "+ u_L = 0"
      step-3  + Substitute → "q/C + L·d²q/dt² = 0"
      step-4  + Reorder → "L·q'' + q/C = 0"  +  "R n'apparaît pas" note
      step-5  + R appears on schematic; damped ODE "L·q'' + R·q' + q/C = 0";
               R·q' residue shown; ARRÊT badge. (BOUNDARY held — no solution)

    CUMULATIVE: each step adds to everything already shown.
    Renderer sets display:none on steps > current; reveals one per click.

    ENTRANCE TRANSITION
      Per-element .step-enter fades in (opacity 0→1, 350ms ease-out) when
      renderer adds .step-visible to the parent step group.
      NO autoplay timeline. Nothing fires on page load.

    REDUCED-MOTION
      @media (prefers-reduced-motion: reduce): all step groups display:block,
      opacity:1, all transitions suppressed — full static figure.

    BOUNDARY (§0.4)
      step-5 STOPS at the R·q' residue. No damped ODE solution.
      No damping coefficient. ARRÊT badge makes the stop explicit.

    LAYOUT
      Left column  (x=20…360):   RLC circuit schematic
      Right column (x=380…740):  equation build, step by step
      Divider at x=375.

    PALETTE  matches existing static SVGs
  -->

  <defs>
    <style>
      /* ── Entrance transitions ───────────────────────────────────────── */
      .step-enter {
        opacity: 0;
        transition: opacity 350ms ease-out;
      }
      .step-visible .step-enter {
        opacity: 1;
      }

      /* Component highlight rects: pulse briefly bright then settle dim   */
      .hl-enter {
        opacity: 0;
        transition: opacity 350ms ease-out;
      }
      .step-visible .hl-enter {
        opacity: 0.25;
      }

      /* ── Reduced-motion: all steps shown, no transition ────────────── */
      @media (prefers-reduced-motion: reduce) {
        [id^="step-"] {
          display: block !important;
          opacity: 1 !important;
        }
        .step-enter {
          opacity: 1 !important;
          transition: none !important;
        }
        .hl-enter {
          opacity: 0.25 !important;
          transition: none !important;
        }
      }
    </style>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CHROME (always visible)                                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <rect width="760" height="600" rx="8" fill="#F5F3EF"/>

  <text x="380" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#2A2A2E">
    Loi des mailles — construction terme par terme
  </text>
  <text x="380" y="43" text-anchor="middle" font-size="10" fill="#8A8A92">
    Cas idéal (R absente, étapes 1–4)  →  puis cas amorti (R présente, étape 5, résidu → arrêt)
  </text>

  <!-- Column divider -->
  <line x1="375" y1="55" x2="375" y2="585" stroke="#B0ADA8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- STEP 1 — Circuit schematic + u_C highlighted; equation: "u_C"        -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g id="step-1" class="step-visible">

    <!-- ── RLC SCHEMATIC (shared across all steps) ─────────────────────── -->
    <g class="step-enter">

      <!-- Wire segments -->
      <!-- Top wire (K switch): 30→155 gap 210→340 -->
      <line x1="30"  y1="70"  x2="155" y2="70"  stroke="#4A4A52" stroke-width="2"/>
      <line x1="210" y1="70"  x2="340" y2="70"  stroke="#4A4A52" stroke-width="2"/>
      <!-- Right wire: 340,70 → 340,145 (top) and 340,215 → 340,300 (bottom) -->
      <line x1="340" y1="70"  x2="340" y2="145" stroke="#4A4A52" stroke-width="2"/>
      <line x1="340" y1="215" x2="340" y2="300" stroke="#4A4A52" stroke-width="2"/>
      <!-- Bottom wire (L inductor): 30,300 → 140 gap (coil) 260,300 → 340,300 -->
      <line x1="30"  y1="300" x2="140" y2="300" stroke="#4A4A52" stroke-width="2"/>
      <line x1="260" y1="300" x2="340" y2="300" stroke="#4A4A52" stroke-width="2"/>
      <!-- Left wire (C capacitor): 30,300 → 30,195 gap (plates) 30,115 → 30,70 -->
      <line x1="30"  y1="300" x2="30"  y2="195" stroke="#4A4A52" stroke-width="2"/>
      <line x1="30"  y1="115" x2="30"  y2="70"  stroke="#4A4A52" stroke-width="2"/>

      <!-- Corner dots -->
      <circle cx="30"  cy="70"  r="3" fill="#4A4A52"/>
      <circle cx="340" cy="70"  r="3" fill="#4A4A52"/>
      <circle cx="340" cy="300" r="3" fill="#4A4A52"/>
      <circle cx="30"  cy="300" r="3" fill="#4A4A52"/>

      <!-- K — Switch (top center) -->
      <circle cx="155" cy="70" r="3" fill="#4A4A52"/>
      <circle cx="210" cy="70" r="3" fill="#4A4A52"/>
      <line x1="155" y1="70" x2="203" y2="52" stroke="#4A4A52" stroke-width="2" stroke-linecap="round"/>
      <text x="183" y="48" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">K</text>

      <!-- C — Condensateur (left wire) -->
      <line x1="5"  y1="115" x2="55" y2="115" stroke="#3E5C86" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5"  y1="195" x2="55" y2="195" stroke="#3E5C86" stroke-width="2.5" stroke-linecap="round"/>
      <text x="68" y="160" text-anchor="start" font-size="13" font-style="italic" fill="#2A2A2E">C</text>
      <!-- u_C label with dashed arrow -->
      <line x1="-10" y1="119" x2="-10" y2="191" stroke="#3E5C86" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="-10,119 -14,130 -6,130" fill="#3E5C86"/>
      <text x="-18" y="157" text-anchor="middle" font-size="11" font-style="italic" fill="#3E5C86">
        u<tspan dy="4" font-size="8">C</tspan>
      </text>

      <!-- L — Bobine (bottom wire) -->
      <path d="M140,300 a15,15 0 0,1 30,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
      <path d="M170,300 a15,15 0 0,1 30,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
      <path d="M200,300 a15,15 0 0,1 30,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
      <path d="M230,300 a15,15 0 0,1 30,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
      <text x="200" y="287" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">L</text>
      <!-- u_L label below coil -->
      <line x1="140" y1="322" x2="260" y2="322" stroke="#7E9CC8" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="140,322 151,318 151,326" fill="#7E9CC8"/>
      <text x="200" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#7E9CC8">
        u<tspan dy="4" font-size="8">L</tspan>
      </text>

      <!-- Current i — arrow on top wire -->
      <line x1="255" y1="70" x2="295" y2="70" stroke="#3E5C86" stroke-width="2"/>
      <polygon points="295,70 283,65 283,75" fill="#3E5C86"/>
      <text x="275" y="58" text-anchor="middle" font-size="13" font-style="italic" fill="#3E5C86">i</text>
    </g>

    <!-- Highlight C (soft blue glow) -->
    <rect class="hl-enter" x="-2" y="107" width="62" height="96" rx="6" fill="#3E5C86"/>

    <!-- ── RIGHT: Pass 1 badge + Step 1 equation ────────────────────────── -->
    <g class="step-enter">
      <rect x="390" y="56" width="100" height="20" rx="4" fill="#3E5C86" opacity="0.12"/>
      <text x="440" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#3E5C86">
        Passe 1 — idéal
      </text>
    </g>

    <!-- Step 1 chip + equation -->
    <g class="step-enter">
      <circle cx="400" cy="105" r="10" fill="#3E5C86" opacity="0.15"/>
      <text x="400" y="109" text-anchor="middle" font-size="10" font-weight="600" fill="#3E5C86">1</text>
      <text x="420" y="109" font-size="14" font-style="italic" fill="#3E5C86">
        u<tspan dy="4" font-size="10">C</tspan>
      </text>
    </g>
    <text class="step-enter" x="420" y="126" font-size="10" fill="#6B6B72">
      tension aux bornes du condensateur
    </text>
  </g>
  <!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- STEP 2 — + u_L highlighted; equation: "u_C + u_L = 0"               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g id="step-2" style="display:none">

    <!-- Highlight L (soft teal glow around coil) -->
    <rect class="hl-enter" x="134" y="283" width="132" height="46" rx="6" fill="#7E9CC8"/>

    <!-- Step 2 chip + equation -->
    <g class="step-enter">
      <circle cx="400" cy="158" r="10" fill="#7E9CC8" opacity="0.18"/>
      <text x="400" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#3E5C86">2</text>
      <text x="420" y="162" font-size="14" fill="#2A2A2E">
        <tspan font-style="italic" fill="#3E5C86">u<tspan dy="4" font-size="10">C</tspan></tspan>
        <tspan dy="-4" font-size="14" fill="#2A2A2E"> + </tspan>
        <tspan font-style="italic" fill="#7E9CC8">u<tspan dy="4" font-size="10">L</tspan></tspan>
        <tspan dy="-4" fill="#2A2A2E" font-size="14"> = 0</tspan>
      </text>
    </g>
    <text class="step-enter" x="420" y="178" font-size="10" fill="#6B6B72">
      boucle série sans source → somme des tensions = 0
    </text>
  </g>
  <!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- STEP 3 — Substitute → "q/C + L·d²q/dt² = 0"                         -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g id="step-3" style="display:none">
    <g class="step-enter">
      <circle cx="400" cy="215" r="10" fill="#3E5C86" opacity="0.15"/>
      <text x="400" y="219" text-anchor="middle" font-size="10" font-weight="600" fill="#3E5C86">3</text>
      <!-- q/C + L · -->
      <text x="420" y="216" font-size="13" fill="#2A2A2E">
        <tspan font-style="italic" fill="#3E5C86">q</tspan><tspan fill="#2A2A2E">/</tspan><tspan font-style="italic" fill="#3E5C86">C</tspan>
        <tspan fill="#2A2A2E"> + </tspan>
        <tspan font-style="italic" fill="#7E9CC8">L</tspan>
        <tspan fill="#2A2A2E"> · </tspan>
      </text>
      <!-- d²q/dt² fraction -->
      <text x="510" y="210" font-size="10" fill="#7E9CC8">d²q</text>
      <line x1="509" y1="213" x2="533" y2="213" stroke="#7E9CC8" stroke-width="1"/>
      <text x="510" y="223" font-size="10" fill="#7E9CC8">dt²</text>
      <!-- = 0 -->
      <text x="537" y="216" font-size="13" fill="#2A2A2E"> = 0</text>
    </g>
    <text class="step-enter" x="420" y="238" font-size="10" fill="#6B6B72">
      substitution : u<tspan dy="3" font-size="7.5">C</tspan><tspan dy="-3"> = q/C ,  i = dq/dt ,  u</tspan><tspan dy="3" font-size="7.5">L</tspan><tspan dy="-3"> = L·di/dt</tspan>
    </text>
  </g>
  <!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- STEP 4 — Reorder → "L·q'' + q/C = 0"  +  "R n'apparaît pas"         -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g id="step-4" style="display:none">
    <g class="step-enter">
      <circle cx="400" cy="272" r="10" fill="#5A7A4A" opacity="0.18"/>
      <text x="400" y="276" text-anchor="middle" font-size="10" font-weight="600" fill="#5A7A4A">4</text>
      <text x="420" y="276" font-size="14" font-style="italic" fill="#2A2A2E">
        <tspan fill="#7E9CC8">L</tspan><tspan fill="#2A2A2E"> · </tspan><tspan fill="#7E9CC8">q</tspan><tspan fill="#2A2A2E">'' + </tspan><tspan fill="#3E5C86">q</tspan><tspan fill="#2A2A2E">/</tspan><tspan fill="#3E5C86">C</tspan><tspan fill="#2A2A2E"> = 0</tspan>
      </text>
    </g>
    <text class="step-enter" x="420" y="293" font-size="10" fill="#6B6B72">
      équation du cas idéal — T₀ = 2π√(LC)
    </text>

    <!-- "R n'apparaît pas" callout box -->
    <g class="step-enter">
      <rect x="395" y="303" width="340" height="38" rx="5" fill="#5A7A4A" opacity="0.08"/>
      <text x="565" y="318" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A7A4A">
        R n'apparaît pas dans cette équation
      </text>
      <text x="565" y="334" text-anchor="middle" font-size="10" fill="#5A7A4A">
        → la période T₀ est indépendante de R
      </text>
    </g>

    <!-- "R absente" annotation on the schematic right wire -->
    <g class="step-enter">
      <rect x="346" y="152" width="72" height="20" rx="4" fill="#D4785A" opacity="0.15"/>
      <text x="382" y="166" text-anchor="middle" font-size="9.5" font-style="italic" fill="#C06040">
        R absente
      </text>
      <text x="382" y="178" text-anchor="middle" font-size="8.5" fill="#C06040">
        → T₀ sans R
      </text>
    </g>
  </g>
  <!-- /step-4 -->

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- STEP 5 — Damped: R appears on schematic; full damped ODE;            -->
  <!--           R·q' residue; ARRÊT badge. (BOUNDARY: no solution)         -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g id="step-5" style="display:none">

    <!-- Separator line between pass 1 and pass 2 equations -->
    <line class="step-enter" x1="390" y1="355" x2="740" y2="355" stroke="#B0ADA8" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Pass 2 badge -->
    <g class="step-enter">
      <rect x="390" y="361" width="130" height="20" rx="4" fill="#C06040" opacity="0.12"/>
      <text x="455" y="375" text-anchor="middle" font-size="10" font-weight="600" fill="#C06040">
        Passe 2 — amorti
      </text>
    </g>

    <!-- Resistor R on the schematic right wire (appears now for the first time) -->
    <g class="step-enter">
      <rect x="322" y="145" width="36" height="60" rx="3" fill="#F5F3EF" stroke="#2A2A2E" stroke-width="2"/>
      <text x="340" y="174" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">R</text>
      <!-- u_R label -->
      <line x1="368" y1="149" x2="368" y2="201" stroke="#7E9CC8" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="368,149 364,160 372,160" fill="#7E9CC8"/>
      <text x="384" y="178" text-anchor="middle" font-size="11" font-style="italic" fill="#7E9CC8">
        u<tspan dy="4" font-size="8">R</tspan>
      </text>
    </g>

    <!-- Highlights for all three components (pass 2) -->
    <rect class="hl-enter" x="-2"  y="107" width="62"  height="96" rx="6" fill="#3E5C86"/>
    <rect class="hl-enter" x="134" y="283" width="132" height="46" rx="6" fill="#7E9CC8"/>
    <rect class="hl-enter" x="316" y="138" width="52"  height="74" rx="6" fill="#C06040"/>

    <!-- Damped Step R1: u_C + u_L + u_R = 0 -->
    <g class="step-enter">
      <circle cx="400" cy="400" r="10" fill="#C06040" opacity="0.15"/>
      <text x="400" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#C06040">1</text>
      <text x="420" y="404" font-size="14" fill="#2A2A2E">
        <tspan font-style="italic" fill="#3E5C86">u<tspan dy="4" font-size="10">C</tspan></tspan>
        <tspan dy="-4" fill="#2A2A2E"> + </tspan>
        <tspan font-style="italic" fill="#7E9CC8">u<tspan dy="4" font-size="10">L</tspan></tspan>
        <tspan dy="-4" fill="#2A2A2E"> + </tspan>
        <tspan font-style="italic" fill="#C06040">u<tspan dy="4" font-size="10">R</tspan></tspan>
        <tspan dy="-4" fill="#2A2A2E"> = 0</tspan>
      </text>
    </g>
    <text class="step-enter" x="420" y="420" font-size="10" fill="#6B6B72">
      R présente dans la boucle → u<tspan dy="3" font-size="7.5">R</tspan><tspan dy="-3"> = R·i = R·q' apparaît</tspan>
    </text>

    <!-- Damped Step R2: L·q'' + R·q' + q/C = 0 -->
    <g class="step-enter">
      <circle cx="400" cy="448" r="10" fill="#C06040" opacity="0.15"/>
      <text x="400" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#C06040">2</text>
      <text x="420" y="452" font-size="14" font-style="italic" fill="#2A2A2E">
        <tspan fill="#7E9CC8">L</tspan><tspan fill="#2A2A2E">·</tspan><tspan fill="#7E9CC8">q</tspan><tspan fill="#2A2A2E">'' + </tspan><tspan fill="#C06040">R</tspan><tspan fill="#2A2A2E">·</tspan><tspan fill="#C06040">q</tspan><tspan fill="#2A2A2E">' + </tspan><tspan fill="#3E5C86">q</tspan><tspan fill="#2A2A2E">/</tspan><tspan fill="#3E5C86">C</tspan><tspan fill="#2A2A2E"> = 0</tspan>
      </text>
    </g>
    <text class="step-enter" x="420" y="468" font-size="10" fill="#6B6B72">
      équation différentielle amortie — résidu R·q' non nul
    </text>

    <!-- Damped Step R3: R·q' residue → ARRÊT -->
    <g class="step-enter">
      <circle cx="400" cy="496" r="10" fill="#C06040" opacity="0.25"/>
      <text x="400" y="500" text-anchor="middle" font-size="10" font-weight="600" fill="#C06040">3</text>
      <text x="420" y="490" font-size="12" fill="#6B6B72">
        si  q = Q·cos(…)  alors  R·q' =
      </text>
      <text x="420" y="506" font-size="13" font-weight="600" fill="#C06040" font-style="italic">
        −R·Q·(2π/T₀)·sin(…)  ≠ 0
      </text>
    </g>
    <text class="step-enter" x="420" y="523" font-size="10" fill="#6B6B72">
      le cosinus idéal ne vérifie pas l'équation amortie
    </text>

    <!-- ARRÊT badge (the hard boundary marker) -->
    <g class="step-enter">
      <rect x="390" y="533" width="345" height="52" rx="6" fill="#C06040" opacity="0.10"/>
      <rect x="390" y="533" width="345" height="52" rx="6" fill="none" stroke="#C06040" stroke-width="1.5" stroke-dasharray="5,3"/>
      <text x="563" y="554" text-anchor="middle" font-size="12" font-weight="600" fill="#C06040">
        ARRÊT — on établit l'équation et on s'arrête là.
      </text>
      <text x="563" y="571" text-anchor="middle" font-size="10" fill="#C06040">
        Résidu R·q' non annulable → pas de solution fermée au programme.
      </text>
    </g>
  </g>
  <!-- /step-5 -->

</svg>
