<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 414" width="620" height="414"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    regimes-uc.svg — Les trois régimes de u_C(t), progressive 3-step reveal
    step-1 : périodique seul      (R ≈ 0, sinusoïde parfaite)
    step-2 : + pseudo-périodique  (R modérée, amplitude décroissante, T marqué)
    step-3 : + apériodique        (R grande, retour monotone)

    Three EQUAL panels stacked top→bottom, each exactly 120px tall, 6px gap:
      Panel 1 : y=34..154   axis_y=94   amplitude=32px
      Panel 2 : y=160..280  axis_y=220  amplitude decays from 36px
      Panel 3 : y=286..406  axis_y=338  monotone from U₀ at y=306

    ViewBox: 620×414
    Plot x range: 100..590 (490px), period = 120px → ~4 periods visible

    Renderer crops the viewBox height to show steps 1..N with no empty space
    because each step-N group sits exactly in its own 120px band.

    T bracket appears ONLY on pseudo-périodique panel (step-2).
    T₀ bracket appears on périodique panel (step-1).

    Palette: bg transparent, panel bg #EDEAE5, accent-dark #3E5C86,
             accent-light #7E9CC8, text-primary #2A2A2E,
             text-secondary #6B6B72, axis #8A8A92
  -->

  <!-- ── Background: transparent (app surface shows through) ──── -->

  <!-- ── Shared heading ─────────────────────────────────────────── -->
  <text x="310" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
    Courbes u<tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3">(t) — les trois régimes</tspan>
  </text>

  <!-- ════════════════════════════════════════════════════════
       STEP 1 — Régime PÉRIODIQUE (R ≈ 0)
       Panel band: y=34..154  (120px)  axis_y=94  amplitude=32px
       peaks y=62, troughs y=126
       ════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Panel background -->
    <rect x="86" y="34" width="516" height="120" rx="5" fill="#EDEAE5"/>

    <!-- Axes -->
    <line x1="100" y1="94" x2="590" y2="94" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="590,94 580,89 580,99" fill="#8A8A92"/>
    <line x1="100" y1="148" x2="100" y2="40" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="100,40 95,51 105,51" fill="#8A8A92"/>
    <!-- Axis labels -->
    <text x="595" y="98" font-size="11" fill="#6B6B72">t</text>
    <text x="91" y="40" text-anchor="end" font-size="11" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="8">C</tspan></text>
    <text x="92" y="98" text-anchor="end" font-size="10" fill="#8A8A92">0</text>
    <!-- U₀ tick -->
    <line x1="96" y1="62" x2="104" y2="62" stroke="#8A8A92" stroke-width="1.2"/>
    <text x="90" y="66" text-anchor="end" font-size="9.5" fill="#8A8A92">U₀</text>

    <!-- Undamped sinusoid: amplitude=32, period=120px, axis_y=94 -->
    <path d="
      M100,94
      C108,75 122,62 130,62
      C138,62 152,75 160,94
      C168,114 182,126 190,126
      C198,126 212,114 220,94
      C228,75 242,62 250,62
      C258,62 272,75 280,94
      C288,114 302,126 310,126
      C318,126 332,114 340,94
      C348,75 362,62 370,62
      C378,62 392,75 400,94
      C408,114 422,126 430,126
      C438,126 452,114 460,94
      C468,75 482,62 490,62
      C498,62 512,75 520,94
      C528,114 542,126 550,126
      C558,126 572,114 580,94
    " fill="none" stroke="#3E5C86" stroke-width="2.2"/>

    <!-- Regime label chip -->
    <rect x="430" y="40" width="168" height="20" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
    <text x="514" y="54" text-anchor="middle" font-size="11" font-weight="600" fill="#3E5C86">Périodique  (R ≈ 0)</text>

    <!-- T₀ bracket between first two peaks: x=130 and x=250, at y=149 (inside panel bottom) -->
    <line x1="130" y1="149" x2="250" y2="149" stroke="#3E5C86" stroke-width="1.5"/>
    <line x1="130" y1="145" x2="130" y2="153" stroke="#3E5C86" stroke-width="1.5"/>
    <line x1="250" y1="145" x2="250" y2="153" stroke="#3E5C86" stroke-width="1.5"/>
    <text x="190" y="145" text-anchor="middle" font-size="11" font-style="italic" fill="#3E5C86">
      T<tspan dy="4" font-size="8">0</tspan>
    </text>
  </g><!-- /step-1 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 2 — Régime PSEUDO-PÉRIODIQUE (R modérée)
       Panel band: y=160..280  (120px)  axis_y=220
       Peak amplitudes (above axis): 36,26,18,12,8,5 px
       ════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Panel background -->
    <rect x="86" y="160" width="516" height="120" rx="5" fill="#EDEAE5"/>

    <!-- Axes -->
    <line x1="100" y1="220" x2="590" y2="220" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="590,220 580,215 580,225" fill="#8A8A92"/>
    <line x1="100" y1="274" x2="100" y2="166" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="100,166 95,177 105,177" fill="#8A8A92"/>
    <text x="595" y="224" font-size="11" fill="#6B6B72">t</text>
    <text x="91" y="165" text-anchor="end" font-size="11" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="8">C</tspan></text>
    <text x="92" y="224" text-anchor="end" font-size="10" fill="#8A8A92">0</text>
    <!-- U₀ tick (first peak = 36px above axis_y=220 → y=184) -->
    <line x1="96" y1="184" x2="104" y2="184" stroke="#8A8A92" stroke-width="1.2"/>
    <text x="90" y="188" text-anchor="end" font-size="9.5" fill="#8A8A92">U₀</text>

    <!--
      Damped sinusoid — period 120px, amplitude decays each half-period.
      axis_y=220; peaks y=184,194,202,208,212,215; troughs y=246,238,232,228,225
    -->
    <path d="
      M100,220
      C110,199 122,184 130,184
      C138,184 150,199 160,220
      C170,241 182,246 190,246
      C198,246 210,235 220,220
      C230,205 242,194 250,194
      C258,194 270,205 280,220
      C290,235 302,238 310,238
      C318,238 330,230 340,220
      C350,210 362,202 370,202
      C378,202 390,210 400,220
      C410,230 422,232 430,232
      C438,232 450,227 460,220
      C470,213 482,208 490,208
      C498,208 510,213 520,220
      C530,227 542,228 550,228
      C558,228 570,225 580,220
    " fill="none" stroke="#3E5C86" stroke-width="2.2"/>

    <!-- Decaying envelope (upper and lower, qualitative dashes) -->
    <path d="M100,220 C200,174 400,199 580,217" fill="none" stroke="#7E9CC8" stroke-width="1.2" stroke-dasharray="5,4"/>
    <path d="M100,220 C200,266 400,241 580,223" fill="none" stroke="#7E9CC8" stroke-width="1.2" stroke-dasharray="5,4"/>

    <!-- Regime label -->
    <rect x="388" y="166" width="210" height="20" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
    <text x="493" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#3E5C86">Pseudo-périodique</text>

    <!--
      T bracket — ONLY on pseudo-périodique panel.
      Between first two peaks: x=130 (y=184) and x=250 (y=194).
      Bracket line at y=272 (inside panel bottom y=280).
      Vertical dashed drops from peaks down to bracket.
    -->
    <line x1="130" y1="184" x2="130" y2="271" stroke="#7E9CC8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="250" y1="194" x2="250" y2="271" stroke="#7E9CC8" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Bracket -->
    <line x1="130" y1="273" x2="250" y2="273" stroke="#3E5C86" stroke-width="2"/>
    <line x1="130" y1="269" x2="130" y2="277" stroke="#3E5C86" stroke-width="2"/>
    <line x1="250" y1="269" x2="250" y2="277" stroke="#3E5C86" stroke-width="2"/>
    <!-- T label with accent background -->
    <rect x="179" y="266" width="22" height="15" rx="3" fill="#3E5C86"/>
    <text x="190" y="277" text-anchor="middle" font-size="11" font-style="italic" font-weight="600" fill="#F5F3EF">T</text>
    <!-- T ≈ T₀ note: inside panel -->
    <text x="285" y="277" font-size="9.5" fill="#6B6B72">
      (T ≈ T<tspan dy="3" font-size="7.5">0</tspan><tspan dy="-3"> pour faible amortissement)</tspan>
    </text>
  </g><!-- /step-2 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 3 — Régime APÉRIODIQUE (R grande)
       Panel band: y=286..406  (120px)  axis_y=338
       U₀ at y=306, monotone decay asymptoting to y=338
       ════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Panel background -->
    <rect x="86" y="286" width="516" height="120" rx="5" fill="#EDEAE5"/>

    <!-- Axes -->
    <line x1="100" y1="338" x2="590" y2="338" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="590,338 580,333 580,343" fill="#8A8A92"/>
    <line x1="100" y1="396" x2="100" y2="292" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="100,292 95,303 105,303" fill="#8A8A92"/>
    <text x="595" y="342" font-size="11" fill="#6B6B72">t</text>
    <text x="91" y="291" text-anchor="end" font-size="11" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="8">C</tspan></text>
    <text x="92" y="342" text-anchor="end" font-size="10" fill="#8A8A92">0</text>
    <!-- U₀ tick -->
    <line x1="96" y1="306" x2="104" y2="306" stroke="#8A8A92" stroke-width="1.2"/>
    <text x="90" y="310" text-anchor="end" font-size="9.5" fill="#8A8A92">U₀</text>

    <!-- Monotonic exponential-style decay from (100,306) asymptoting to y=338 -->
    <path d="
      M100,306
      C122,306 140,315 165,323
      C195,329 225,334 265,336
      C318,337.5 380,338 450,338
      C505,338.2 548,338.4 580,338.5
    " fill="none" stroke="#3E5C86" stroke-width="2.2"/>

    <!-- Regime label -->
    <rect x="380" y="292" width="215" height="20" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
    <text x="488" y="306" text-anchor="middle" font-size="11" font-weight="600" fill="#3E5C86">Apériodique  (R grande)</text>

    <!-- Structural annotation inside panel (labels the curve behaviour) -->
    <text x="290" y="362" text-anchor="middle" font-size="10" fill="#6B6B72" font-style="italic">
      retour monotone vers 0, sans oscillation
    </text>
  </g><!-- /step-3 -->

</svg>
