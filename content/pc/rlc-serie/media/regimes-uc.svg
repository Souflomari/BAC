<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    regimes-uc.svg — Les trois régimes de u_C(t), progressive 3-step reveal
    step-1 : périodique seul      (R ≈ 0, sinusoïde parfaite)
    step-2 : + pseudo-périodique  (R modérée, amplitude décroissante, T marqué)
    step-3 : + apériodique        (R grande, retour monotone)

    T bracket appears ONLY on the pseudo-périodique panel (step-2), and ONLY there.
    The T₀ bracket appears on the périodique panel (step-1) — it is the undamped period.

    Three panels stacked; each panel height=110, content rows starting at:
      Panel 1 y=42,  content axis y=97,  panel bottom=152
      Panel 2 y=162, content axis y=217, panel bottom=272
      Panel 3 y=282, content axis y=337, panel bottom=392
    Plot left x=100, right x=595, width=495
    Amplitude = 36px (peak displacement from axis)
    Period in pixels = 120px (→ 4.something periods visible across 495px)

    Palette: bg #F5F3EF, panel bg #EDEAE5, accent-dark #3E5C86, accent-light #7E9CC8,
             text-primary #2A2A2E, text-secondary #6B6B72, axis #8A8A92
  -->

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="620" height="430" rx="8" fill="#F5F3EF"/>

  <!-- ── Shared heading ─────────────────────────────────────── -->
  <text x="310" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
    Courbes u<tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3">(t) — les trois régimes</tspan>
  </text>

  <!-- ════════════════════════════════════════════════════════
       STEP 1 — Régime PÉRIODIQUE (R ≈ 0)
       ════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Panel background -->
    <rect x="86" y="42" width="516" height="110" rx="5" fill="#EDEAE5"/>

    <!-- Axes -->
    <line x1="100" y1="97" x2="590" y2="97" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="590,97 580,92 580,102" fill="#8A8A92"/>
    <line x1="100" y1="148" x2="100" y2="48" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="100,48 95,59 105,59" fill="#8A8A92"/>
    <!-- Axis labels -->
    <text x="595" y="101" font-size="11" fill="#6B6B72">t</text>
    <text x="91" y="47" text-anchor="end" font-size="11" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="8">C</tspan></text>
    <text x="92" y="101" text-anchor="end" font-size="10" fill="#8A8A92">0</text>
    <!-- U₀ tick -->
    <line x1="96" y1="61" x2="104" y2="61" stroke="#8A8A92" stroke-width="1.2"/>
    <text x="90" y="65" text-anchor="end" font-size="9.5" fill="#8A8A92">U₀</text>

    <!--
      Undamped sinusoid: amplitude=36, period=120px, start at x=100, centre y=97
      Peaks at x=100+30=130 (y=61), x=130+120=250 (y=61), x=370, x=490
      Troughs at x=190 (y=133), x=310 (y=133), x=430 (y=133), x=550 (y=133)
      Bezier shape: each quarter-period ≈ 30px
      From (100,97) rise to (130,61) fall to (190,133) rise to (250,61) … etc.
      Using symmetric cubics: cp offset = 30/2 = 15px along x, full amplitude along y
    -->
    <path d="
      M100,97
      C108,76 122,61 130,61
      C138,61 152,76 160,97
      C168,118 182,133 190,133
      C198,133 212,118 220,97
      C228,76 242,61 250,61
      C258,61 272,76 280,97
      C288,118 302,133 310,133
      C318,133 332,118 340,97
      C348,76 362,61 370,61
      C378,61 392,76 400,97
      C408,118 422,133 430,133
      C438,133 452,118 460,97
      C468,76 482,61 490,61
      C498,61 512,76 520,97
      C528,118 542,133 550,133
      C558,133 572,118 580,97
    " fill="none" stroke="#3E5C86" stroke-width="2.2"/>

    <!-- Regime label chip -->
    <rect x="430" y="48" width="168" height="20" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
    <text x="514" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#3E5C86">Périodique  (R ≈ 0)</text>

    <!-- T₀ bracket between first two peaks: x=130 and x=250, below panel at y=148+5 -->
    <line x1="130" y1="150" x2="250" y2="150" stroke="#3E5C86" stroke-width="1.5"/>
    <line x1="130" y1="146" x2="130" y2="154" stroke="#3E5C86" stroke-width="1.5"/>
    <line x1="250" y1="146" x2="250" y2="154" stroke="#3E5C86" stroke-width="1.5"/>
    <text x="190" y="147" text-anchor="middle" font-size="11" font-style="italic" fill="#3E5C86">
      T<tspan dy="4" font-size="8">0</tspan>
    </text>

    <!-- Step caption -->
    <text x="310" y="170" text-anchor="middle" font-size="10.5" fill="#6B6B72">
      R ≈ 0 : les oscillations persistent indéfiniment.
    </text>
  </g><!-- /step-1 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 2 — Régime PSEUDO-PÉRIODIQUE (R modérée)
       ════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Panel background -->
    <rect x="86" y="162" width="516" height="110" rx="5" fill="#EDEAE5"/>

    <!-- Axes -->
    <line x1="100" y1="217" x2="590" y2="217" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="590,217 580,212 580,222" fill="#8A8A92"/>
    <line x1="100" y1="268" x2="100" y2="168" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="100,168 95,179 105,179" fill="#8A8A92"/>
    <text x="595" y="221" font-size="11" fill="#6B6B72">t</text>
    <text x="91" y="167" text-anchor="end" font-size="11" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="8">C</tspan></text>
    <text x="92" y="221" text-anchor="end" font-size="10" fill="#8A8A92">0</text>
    <line x1="96" y1="181" x2="104" y2="181" stroke="#8A8A92" stroke-width="1.2"/>
    <text x="90" y="185" text-anchor="end" font-size="9.5" fill="#8A8A92">U₀</text>

    <!--
      Damped sinusoid — same period (120px), amplitude decays each half-period.
      Peak amplitudes (above axis): 36, 26, 18, 12, 8, 5 (qualitative geometric decay)
      Trough amplitudes (below axis): 26, 18, 12, 8, 5 (symmetric)
      Centre y=217; peaks y=217-A; troughs y=217+A

      Quarter-period = 30px; peaks at x=130,250,370,490; troughs at x=190,310,430,550
      Peak heights (y): 181, 191, 199, 205, 209, 212
      Trough depths (y): 243, 235, 229, 225, 222

      Bezier: symmetric cubics, cp_offset ~12px in x and ~half-amplitude in y
    -->
    <path d="
      M100,217
      C110,196 122,181 130,181
      C138,181 150,196 160,217
      C170,238 182,243 190,243
      C198,243 210,232 220,217
      C230,202 242,191 250,191
      C258,191 270,202 280,217
      C290,232 302,235 310,235
      C318,235 330,227 340,217
      C350,207 362,199 370,199
      C378,199 390,207 400,217
      C410,227 422,229 430,229
      C438,229 450,224 460,217
      C470,210 482,205 490,205
      C498,205 510,210 520,217
      C530,224 542,225 550,225
      C558,225 570,222 580,217
    " fill="none" stroke="#3E5C86" stroke-width="2.2"/>

    <!-- Decaying envelope (upper and lower, qualitative dashes) -->
    <path d="M100,217 C200,171 400,196 580,214" fill="none" stroke="#7E9CC8" stroke-width="1.2" stroke-dasharray="5,4"/>
    <path d="M100,217 C200,263 400,238 580,220" fill="none" stroke="#7E9CC8" stroke-width="1.2" stroke-dasharray="5,4"/>

    <!-- Regime label -->
    <rect x="388" y="168" width="210" height="20" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
    <text x="493" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#3E5C86">Pseudo-périodique</text>

    <!--
      T bracket — ONLY on pseudo-périodique panel.
      Between first two peaks: x=130 (y=181) and x=250 (y=191).
      Bracket line at y=268+4=272 (below panel).
      Vertical drops from peaks down to bracket.
    -->
    <line x1="130" y1="181" x2="130" y2="273" stroke="#7E9CC8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="250" y1="191" x2="250" y2="273" stroke="#7E9CC8" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Bracket -->
    <line x1="130" y1="276" x2="250" y2="276" stroke="#3E5C86" stroke-width="2"/>
    <line x1="130" y1="272" x2="130" y2="280" stroke="#3E5C86" stroke-width="2"/>
    <line x1="250" y1="272" x2="250" y2="280" stroke="#3E5C86" stroke-width="2"/>
    <!-- T label with accent background -->
    <rect x="179" y="269" width="22" height="15" rx="3" fill="#3E5C86"/>
    <text x="190" y="280" text-anchor="middle" font-size="11" font-style="italic" font-weight="600" fill="#F5F3EF">T</text>
    <!-- T ≈ T₀ note -->
    <text x="285" y="280" font-size="9.5" fill="#6B6B72">
      (T ≈ T<tspan dy="3" font-size="7.5">0</tspan><tspan dy="-3"> pour faible amortissement)</tspan>
    </text>

    <!-- Caption -->
    <text x="310" y="296" text-anchor="middle" font-size="10.5" fill="#6B6B72">
      R modérée : les oscillations s'amortissent — la pseudo-période T reste régulière.
    </text>
  </g><!-- /step-2 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 3 — Régime APÉRIODIQUE (R grande)
       ════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Panel background -->
    <rect x="86" y="306" width="516" height="100" rx="5" fill="#EDEAE5"/>

    <!-- Axes -->
    <line x1="100" y1="355" x2="590" y2="355" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="590,355 580,350 580,360" fill="#8A8A92"/>
    <line x1="100" y1="400" x2="100" y2="312" stroke="#8A8A92" stroke-width="1.5"/>
    <polygon points="100,312 95,323 105,323" fill="#8A8A92"/>
    <text x="595" y="359" font-size="11" fill="#6B6B72">t</text>
    <text x="91" y="311" text-anchor="end" font-size="11" font-style="italic" fill="#6B6B72">u<tspan dy="3" font-size="8">C</tspan></text>
    <text x="92" y="359" text-anchor="end" font-size="10" fill="#8A8A92">0</text>
    <!-- U₀ tick -->
    <line x1="96" y1="319" x2="104" y2="319" stroke="#8A8A92" stroke-width="1.2"/>
    <text x="90" y="323" text-anchor="end" font-size="9.5" fill="#8A8A92">U₀</text>

    <!--
      Monotonic exponential-style decay from (100,319) asymptoting to y=355.
      No oscillation. Curve shape: steep initial drop, slow asymptote.
    -->
    <path d="
      M100,319
      C122,319 140,327 165,335
      C195,341 225,347 265,350
      C318,353 380,354.5 450,355
      C505,355.4 548,355.6 580,355.8
    " fill="none" stroke="#3E5C86" stroke-width="2.2"/>

    <!-- Regime label -->
    <rect x="380" y="312" width="215" height="20" rx="4" fill="#3E5C86" fill-opacity="0.12"/>
    <text x="488" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#3E5C86">Apériodique  (R grande)</text>

    <!-- Annotation -->
    <text x="290" y="378" text-anchor="middle" font-size="10" fill="#6B6B72" font-style="italic">
      retour monotone vers 0, sans oscillation
    </text>

    <!-- Shared bottom note -->
    <text x="310" y="412" text-anchor="middle" font-size="10" fill="#6B6B72">
      Mêmes conditions initiales (condensateur chargé à U₀) — seule R varie.
    </text>
  </g><!-- /step-3 -->

</svg>
