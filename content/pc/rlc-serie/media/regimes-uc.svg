<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Les trois régimes de u_C(t) — périodique, pseudo-périodique, apériodique">
  <title>Courbes u_C(t) — les trois régimes</title>
  <!--
    regimes-uc.svg — Trois régimes de u_C(t), révélation cumulative 3 étapes.
    step-1 : périodique       (R ≈ 0, sinusoïde parfaite)
    step-2 : + pseudo-périodique  (amplitude décroissante, T marqué)
    step-3 : + apériodique    (retour monotone)

    §0.4 : pas de formule d'amortissement, pas de formule de pseudo-période.
           Espacement des pics régulier et identique (même pas x) sur les
           régimes périodique et pseudo-périodique.

    LAYOUT POUR LE VIEWBOX-CROP DU RENDERER :
    Total H = 420px, 3 panneaux, chacun exactement H/3 = 140px.
    Le renderer crope à (N/3)*420 + buffer(=140*0.04≈5.6) ≈ :
      N=1 → 145.6px  (bande 0..140 + marge = 0..145)
      N=2 → 285.6px  (bandes 0..280 + marge)
      N=3 → pas de crop (N ≥ totalPanels)

    Bande 1 : y=0..140    (titre + panneau périodique)
    Bande 2 : y=140..280  (panneau pseudo-périodique)
    Bande 3 : y=280..420  (panneau apériodique)

    Dans chaque bande :
      - rect de fond à y_band+8 .. y_band+132  (124px de contenu)
      - axe horizontal à y_band+74 (milieu fonctionnel)
      - amplitude 32px max → pics à y_band+42, creux à y_band+106

    Couleurs de régime : var(--figure-regime-periodic/pseudo/aperiodic)
  -->

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Régime PÉRIODIQUE  (R ≈ 0)
       Bande y=0..140, axe_y=74, amplitude=32px
       Pics : y=42, creux : y=106
       Période x = 125px ; premiers pics à x=141.5, x=266.5
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Titre (dans la bande 1) -->
    <text x="320" y="18" text-anchor="middle"
          font-size="12" font-weight="600" letter-spacing="0.01em"
          fill="var(--figure-ink)">
      Courbes u<tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3">(t) — les trois régimes</tspan>
    </text>

    <!-- Fond du panneau 1 -->
    <rect x="88" y="28" width="536" height="104" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="74" x2="604" y2="74"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="604,74 592,69.5 592,78.5" fill="var(--figure-grid)"/>
    <line x1="104" y1="124" x2="104" y2="34"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="104,34 99.5,45 108.5,45" fill="var(--figure-grid)"/>
    <text x="611" y="78" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="96" y="34" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="7.5">C</tspan></text>
    <text x="96" y="78" text-anchor="end" font-size="10"
          fill="var(--figure-grid)">0</text>

    <!-- Repère U₀ -->
    <line x1="100" y1="42" x2="108" y2="42"
          stroke="var(--figure-grid)" stroke-width="1.2"/>
    <text x="94" y="46" text-anchor="end" font-size="9.5"
          fill="var(--figure-ink-soft)">U₀</text>

    <!--
      Sinusoïde parfaite.
      axis_y=74, amplitude=32px. Pics à y=42, creux à y=106.
      Période=125px. Débute à x=104 (zéro), premier pic à x=141.5,
      puis tous les 125px : 141.5, 266.5, 391.5, 516.5.
      Creux à 204, 329, 454, 579.
    -->
    <path d="
      M104,74
      C113,52 128,42 141.5,42
      C155,42 170,52 179,74
      C188,96 203,106 216.5,106
      C230,106 245,96 254,74
      C263,52 278,42 291.5,42
      C305,42 320,52 329,74
      C338,96 353,106 366.5,106
      C380,106 395,96 404,74
      C413,52 428,42 441.5,42
      C455,42 470,52 479,74
      C488,96 503,106 516.5,106
      C530,106 545,96 554,74
      C563,52 578,42 591.5,42
      C598,42 604,48 604,54
    " fill="none"
      stroke="var(--figure-regime-periodic)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chip de régime -->
    <rect x="430" y="34" width="186" height="22" rx="5"
          fill="var(--figure-regime-periodic)" fill-opacity="0.12"/>
    <text x="523" y="49" text-anchor="middle"
          font-size="11" font-weight="600"
          fill="var(--figure-regime-periodic)">Périodique  (R ≈ 0)</text>

    <!-- Accolade T₀ entre les deux premiers pics (x=141.5 et x=266.5), y=128..136 -->
    <line x1="141.5" y1="130" x2="266.5" y2="130"
          stroke="var(--figure-regime-periodic)" stroke-width="1.6"/>
    <line x1="141.5" y1="125" x2="141.5" y2="135"
          stroke="var(--figure-regime-periodic)" stroke-width="1.6"/>
    <line x1="266.5" y1="125" x2="266.5" y2="135"
          stroke="var(--figure-regime-periodic)" stroke-width="1.6"/>
    <text x="204" y="127" text-anchor="middle"
          font-size="11" font-style="italic"
          fill="var(--figure-regime-periodic)">T<tspan dy="4" font-size="8">0</tspan>
    </text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — Régime PSEUDO-PÉRIODIQUE  (R modérée)
       Bande y=140..280, axe_y=214
       Pics (au-dessus de l'axe) : 178 (−36), 192 (−22), 202 (−12), 208 (−6), 211 (−3)
       Creux (en dessous)        : 244 (+30), 234 (+20), 227 (+13), 222 (+8), 219 (+5)
       Espacement x des pics = 125px (idem périodique — §0.4)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Fond du panneau 2 -->
    <rect x="88" y="148" width="536" height="124" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="214" x2="604" y2="214"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="604,214 592,209.5 592,218.5" fill="var(--figure-grid)"/>
    <line x1="104" y1="266" x2="104" y2="154"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="104,154 99.5,165 108.5,165" fill="var(--figure-grid)"/>
    <text x="611" y="218" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="96" y="154" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="7.5">C</tspan></text>
    <text x="96" y="218" text-anchor="end" font-size="10"
          fill="var(--figure-grid)">0</text>

    <!-- Repère U₀ (premier pic = 36px au-dessus de axis_y=214 → y=178) -->
    <line x1="100" y1="178" x2="108" y2="178"
          stroke="var(--figure-grid)" stroke-width="1.2"/>
    <text x="94" y="182" text-anchor="end" font-size="9.5"
          fill="var(--figure-ink-soft)">U₀</text>

    <!--
      Sinusoïde amortie.
      axis_y=214. Pics : 178, 192, 202, 208, 211.
      Creux : 244, 234, 227, 222, 219.
      Espacement x = 125px entre pics successifs (§0.4 — même que périodique).
      Pics aux x : 141.5, 266.5, 391.5, 516.5
      Creux aux x : 204, 329, 454, 579
    -->
    <path d="
      M104,214
      C115,188 128,178 141.5,178
      C155,178 168,192 179,214
      C190,236 203,244 216.5,244
      C230,244 243,232 254,214
      C265,196 278,192 291.5,192
      C305,192 318,202 329,214
      C340,226 353,234 366.5,234
      C380,234 393,226 404,214
      C415,202 428,202 441.5,202
      C455,202 468,208 479,214
      C490,220 503,222 516.5,222
      C530,222 543,218 554,214
      C565,210 578,209 591.5,209
      C598,209 604,211 604,213
    " fill="none"
      stroke="var(--figure-regime-pseudo)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Enveloppe décroissante (tirets discrets, haut et bas) -->
    <path d="M104,214 C220,166 420,200 604,212"
          fill="none"
          stroke="var(--figure-regime-pseudo)" stroke-width="1.2"
          stroke-dasharray="6,4" stroke-linecap="round"/>
    <path d="M104,214 C220,262 420,228 604,216"
          fill="none"
          stroke="var(--figure-regime-pseudo)" stroke-width="1.2"
          stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Chip de régime -->
    <rect x="376" y="154" width="246" height="22" rx="5"
          fill="var(--figure-regime-pseudo)" fill-opacity="0.12"/>
    <text x="499" y="169" text-anchor="middle"
          font-size="11" font-weight="600"
          fill="var(--figure-regime-pseudo)">Pseudo-périodique  (R modérée)</text>

    <!--
      Accolade T entre premiers pics (x=141.5 et x=266.5), ligne à y=270.
      Drops verticaux tiretés depuis les pics vers la ligne.
    -->
    <line x1="141.5" y1="178" x2="141.5" y2="268"
          stroke="var(--figure-regime-pseudo)" stroke-width="1"
          stroke-dasharray="3,3" stroke-linecap="round"/>
    <line x1="266.5" y1="192" x2="266.5" y2="268"
          stroke="var(--figure-regime-pseudo)" stroke-width="1"
          stroke-dasharray="3,3" stroke-linecap="round"/>
    <line x1="141.5" y1="270" x2="266.5" y2="270"
          stroke="var(--figure-regime-pseudo)" stroke-width="2"/>
    <line x1="141.5" y1="265" x2="141.5" y2="275"
          stroke="var(--figure-regime-pseudo)" stroke-width="2"/>
    <line x1="266.5" y1="265" x2="266.5" y2="275"
          stroke="var(--figure-regime-pseudo)" stroke-width="2"/>
    <!-- Pastille T -->
    <rect x="195" y="262" width="28" height="17" rx="4"
          fill="var(--figure-regime-pseudo)"/>
    <text x="209" y="274" text-anchor="middle"
          font-size="11" font-style="italic" font-weight="600"
          fill="var(--figure-surface)">T</text>
    <!-- Note T ≈ T₀ -->
    <text x="308" y="274" font-size="9.5"
          fill="var(--figure-ink-soft)">(T ≈ T<tspan
          dy="3" font-size="7.5">0</tspan><tspan
          dy="-3"> si faible amortissement)</tspan>
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — Régime APÉRIODIQUE  (R grande)
       Bande y=280..420, axe_y=352
       U₀ à y=308, retour monotone vers y=352
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Fond du panneau 3 -->
    <rect x="88" y="288" width="536" height="124" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="352" x2="604" y2="352"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="604,352 592,347.5 592,356.5" fill="var(--figure-grid)"/>
    <line x1="104" y1="404" x2="104" y2="294"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="104,294 99.5,305 108.5,305" fill="var(--figure-grid)"/>
    <text x="611" y="356" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="96" y="294" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="7.5">C</tspan></text>
    <text x="96" y="356" text-anchor="end" font-size="10"
          fill="var(--figure-grid)">0</text>

    <!-- Repère U₀ -->
    <line x1="100" y1="308" x2="108" y2="308"
          stroke="var(--figure-grid)" stroke-width="1.2"/>
    <text x="94" y="312" text-anchor="end" font-size="9.5"
          fill="var(--figure-ink-soft)">U₀</text>

    <!-- Décroissance monotone (début (104,308), asymptote y=352) -->
    <path d="
      M104,308
      C130,308 152,317 182,328
      C218,338 258,346 308,350
      C368,351.5 440,352 520,352.1
      C568,352.2 596,352.3 604,352.3
    " fill="none"
      stroke="var(--figure-regime-aperiodic)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chip de régime -->
    <rect x="384" y="294" width="230" height="22" rx="5"
          fill="var(--figure-regime-aperiodic)" fill-opacity="0.12"/>
    <text x="499" y="309" text-anchor="middle"
          font-size="11" font-weight="600"
          fill="var(--figure-regime-aperiodic)">Apériodique  (R grande)</text>

    <!-- Annotation comportement -->
    <text x="310" y="380" text-anchor="middle"
          font-size="10" font-style="italic"
          fill="var(--figure-ink-soft)">retour monotone vers 0, sans oscillation</text>
  </g><!-- /step-3 -->

</svg>
