<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Les trois régimes de u_C(t) — périodique, pseudo-périodique, apériodique">
  <title>Courbes u_C(t) — les trois régimes</title>
  <!--
    regimes-uc.svg — Trois régimes de u_C(t), révélation cumulative 3 étapes.
    step-1 : périodique  (R ≈ 0 — sinusoïde parfaite)
    step-2 : + pseudo-périodique  (amplitude décroissante, T marqué)
    step-3 : + apériodique  (retour monotone)

    §0.4 : pas de formule d'amortissement, pas de formule de pseudo-période,
           espacement des pics égaux à l'œil.

    Trois panneaux empilés verticalement, chacun 128px de haut, 8px d'écart :
      Panneau 1 : y=42..170   axis_y=106  amplitude=34px
      Panneau 2 : y=178..306  axis_y=242  amplitude décroissante depuis 36px
      Panneau 3 : y=314..432  axis_y=370  monotone depuis U₀ à y=338

    Plage x du tracé : 104..604 (500px). Période = 125px → ~4 périodes visibles.
    Couleurs de régime : var(--figure-regime-periodic/pseudo/aperiodic)
    Fond des panneaux : var(--figure-surface) + stroke var(--figure-grid)
    Axes : var(--figure-grid) ; labels : var(--figure-ink-soft)
  -->

  <!-- Titre partagé -->
  <text x="320" y="28" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Courbes u<tspan dy="3" font-size="8.5">C</tspan><tspan dy="-3">(t) — les trois régimes</tspan>
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — Régime PÉRIODIQUE  (R ≈ 0)
       Panneau : y=42..170  axis_y=106  amplitude=34px
       Pics : y=72, creux : y=140
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Fond du panneau -->
    <rect x="88" y="42" width="536" height="128" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="106" x2="604" y2="106"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="604,106 592,101.5 592,110.5" fill="var(--figure-grid)"/>
    <line x1="104" y1="162" x2="104" y2="48"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="104,48 99.5,59 108.5,59" fill="var(--figure-grid)"/>

    <!-- Labels d'axes -->
    <text x="610" y="110" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="96" y="48" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="7.5">C</tspan></text>
    <text x="96" y="110" text-anchor="end" font-size="10"
          fill="var(--figure-grid)">0</text>

    <!-- Repère U₀ -->
    <line x1="100" y1="72" x2="108" y2="72"
          stroke="var(--figure-grid)" stroke-width="1.2"/>
    <text x="94" y="76" text-anchor="end" font-size="9.5"
          fill="var(--figure-ink-soft)">U₀</text>

    <!-- Sinusoïde parfaite — amplitude=34px, période=125px, axis_y=106 -->
    <!-- pics y=72, creux y=140 -->
    <path d="
      M104,106
      C113,83 128,72 141.5,72
      C155,72 170,83 179,106
      C188,129 203,140 216.5,140
      C230,140 245,129 254,106
      C263,83 278,72 291.5,72
      C305,72 320,83 329,106
      C338,129 353,140 366.5,140
      C380,140 395,129 404,106
      C413,83 428,72 441.5,72
      C455,72 470,83 479,106
      C488,129 503,140 516.5,140
      C530,140 545,129 554,106
      C563,83 578,72 591.5,72
      C598,72 604,78 604,84
    " fill="none"
      stroke="var(--figure-regime-periodic)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chip de régime -->
    <rect x="440" y="48" width="176" height="22" rx="5"
          fill="var(--figure-regime-periodic)" fill-opacity="0.12"/>
    <text x="528" y="63" text-anchor="middle"
          font-size="11" font-weight="600"
          fill="var(--figure-regime-periodic)">Périodique  (R ≈ 0)</text>

    <!-- Accolade T₀ entre les deux premiers pics (x=141.5 et x=291.5), y=157 -->
    <line x1="141.5" y1="153" x2="291.5" y2="153"
          stroke="var(--figure-regime-periodic)" stroke-width="1.6"/>
    <line x1="141.5" y1="148" x2="141.5" y2="158"
          stroke="var(--figure-regime-periodic)" stroke-width="1.6"/>
    <line x1="291.5" y1="148" x2="291.5" y2="158"
          stroke="var(--figure-regime-periodic)" stroke-width="1.6"/>
    <!-- Label T₀ -->
    <text x="216.5" y="150" text-anchor="middle"
          font-size="11" font-style="italic"
          fill="var(--figure-regime-periodic)">T<tspan
          dy="4" font-size="8">0</tspan>
    </text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — Régime PSEUDO-PÉRIODIQUE  (R modérée)
       Panneau : y=178..306  axis_y=242
       Pics (au-dessus) y: 206, 218, 227, 233, 237, 239
       Creux (en dessous) y: 270, 260, 253, 248, 245
       Espacement des pics = 125px (idem périodique — §0.4)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Fond du panneau -->
    <rect x="88" y="178" width="536" height="128" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="242" x2="604" y2="242"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="604,242 592,237.5 592,246.5" fill="var(--figure-grid)"/>
    <line x1="104" y1="298" x2="104" y2="184"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="104,184 99.5,195 108.5,195" fill="var(--figure-grid)"/>
    <text x="610" y="246" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="96" y="184" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="7.5">C</tspan></text>
    <text x="96" y="246" text-anchor="end" font-size="10"
          fill="var(--figure-grid)">0</text>

    <!-- Repère U₀ (premier pic = 36px au-dessus de 242 → y=206) -->
    <line x1="100" y1="206" x2="108" y2="206"
          stroke="var(--figure-grid)" stroke-width="1.2"/>
    <text x="94" y="210" text-anchor="end" font-size="9.5"
          fill="var(--figure-ink-soft)">U₀</text>

    <!--
      Sinusoïde amortie.
      axis_y=242 ; pics au-dessus: 206 (−36), 218 (−24), 228 (−14), 234 (−8), 238 (−4)
      creux en dessous: 270 (+28), 260 (+18), 253 (+11), 248 (+6), 245 (+3)
      Espacement x des pics : 104, 229, 354, 479, 604 → pas de 125px (§0.4)
    -->
    <path d="
      M104,242
      C115,216 128,206 141.5,206
      C155,206 168,220 179,242
      C190,264 203,270 216.5,270
      C230,270 243,258 254,242
      C265,226 278,218 291.5,218
      C305,218 318,228 329,242
      C340,256 353,261 366.5,261
      C380,261 393,253 404,242
      C415,231 428,228 441.5,228
      C455,228 468,234 479,242
      C490,250 503,252 516.5,252
      C530,252 543,247 554,242
      C565,237 578,235 591.5,235
      C598,235 604,238 604,241
    " fill="none"
      stroke="var(--figure-regime-pseudo)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Enveloppe décroissante (haut et bas, tirets discrets) -->
    <path d="M104,242 C220,194 420,228 604,240"
          fill="none"
          stroke="var(--figure-regime-pseudo)" stroke-width="1.2"
          stroke-dasharray="6,4" stroke-linecap="round" fill-opacity="0"/>
    <path d="M104,242 C220,290 420,256 604,244"
          fill="none"
          stroke="var(--figure-regime-pseudo)" stroke-width="1.2"
          stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Chip de régime -->
    <rect x="392" y="184" width="220" height="22" rx="5"
          fill="var(--figure-regime-pseudo)" fill-opacity="0.12"/>
    <text x="502" y="199" text-anchor="middle"
          font-size="11" font-weight="600"
          fill="var(--figure-regime-pseudo)">Pseudo-périodique  (R modérée)</text>

    <!--
      Accolade T entre les deux premiers pics (x=141.5 et x=291.5), y=294.
      Drops verticaux en tirets depuis les pics.
    -->
    <line x1="141.5" y1="206" x2="141.5" y2="291"
          stroke="var(--figure-regime-pseudo)" stroke-width="1"
          stroke-dasharray="3,3" stroke-linecap="round"/>
    <line x1="291.5" y1="218" x2="291.5" y2="291"
          stroke="var(--figure-regime-pseudo)" stroke-width="1"
          stroke-dasharray="3,3" stroke-linecap="round"/>
    <!-- Barre de l'accolade -->
    <line x1="141.5" y1="293" x2="291.5" y2="293"
          stroke="var(--figure-regime-pseudo)" stroke-width="2"/>
    <line x1="141.5" y1="288" x2="141.5" y2="298"
          stroke="var(--figure-regime-pseudo)" stroke-width="2"/>
    <line x1="291.5" y1="288" x2="291.5" y2="298"
          stroke="var(--figure-regime-pseudo)" stroke-width="2"/>
    <!-- Pastille T avec fond accent -->
    <rect x="203" y="285" width="26" height="17" rx="4"
          fill="var(--figure-regime-pseudo)"/>
    <text x="216" y="297" text-anchor="middle"
          font-size="11" font-style="italic" font-weight="600"
          fill="var(--figure-surface)">T</text>
    <!-- Note T ≈ T₀ -->
    <text x="332" y="298" font-size="9.5"
          fill="var(--figure-ink-soft)">(T ≈ T<tspan
          dy="3" font-size="7.5">0</tspan><tspan
          dy="-3"> si faible amortissement)</tspan>
    </text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — Régime APÉRIODIQUE  (R grande)
       Panneau : y=314..432  axis_y=370
       U₀ à y=334, retour monotone vers 370
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- Fond du panneau -->
    <rect x="88" y="314" width="536" height="118" rx="6"
          fill="var(--figure-surface)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Axes -->
    <line x1="104" y1="370" x2="604" y2="370"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="604,370 592,365.5 592,374.5" fill="var(--figure-grid)"/>
    <line x1="104" y1="424" x2="104" y2="320"
          stroke="var(--figure-grid)" stroke-width="1.4"/>
    <polygon points="104,320 99.5,331 108.5,331" fill="var(--figure-grid)"/>
    <text x="610" y="374" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">t</text>
    <text x="96" y="320" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">u<tspan dy="3" font-size="7.5">C</tspan></text>
    <text x="96" y="374" text-anchor="end" font-size="10"
          fill="var(--figure-grid)">0</text>

    <!-- Repère U₀ -->
    <line x1="100" y1="334" x2="108" y2="334"
          stroke="var(--figure-grid)" stroke-width="1.2"/>
    <text x="94" y="338" text-anchor="end" font-size="9.5"
          fill="var(--figure-ink-soft)">U₀</text>

    <!-- Décroissance monotone exponentielle (commence en (104,334), asymptote y=370) -->
    <path d="
      M104,334
      C128,334 148,343 176,352
      C210,360 246,366 290,368
      C350,369.5 420,370 500,370.1
      C555,370.2 588,370.3 604,370.3
    " fill="none"
      stroke="var(--figure-regime-aperiodic)"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chip de régime -->
    <rect x="384" y="320" width="228" height="22" rx="5"
          fill="var(--figure-regime-aperiodic)" fill-opacity="0.12"/>
    <text x="498" y="335" text-anchor="middle"
          font-size="11" font-weight="600"
          fill="var(--figure-regime-aperiodic)">Apériodique  (R grande)</text>

    <!-- Annotation comportement -->
    <text x="300" y="396" text-anchor="middle"
          font-size="10" font-style="italic"
          fill="var(--figure-ink-soft)">retour monotone vers 0, sans oscillation</text>
  </g><!-- /step-3 -->

</svg>
