<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    rlc-schema.svg — Circuit RLC série, 4 progressive steps
    step-1 : bare LC loop + interrupteur K  (R absent — pédagogiquement délibéré)
    step-2 : + courant i et sa flèche
    step-3 : + tensions u_C, u_L (convention récepteur)
    step-4 : + résistance R et u_R  (utilisé à partir de R3)

    Renderer reveals groups one at a time; fully-revealed SVG = static fallback.

    Palette: bg transparent, raised panel #EDEAE5, wire #4A4A52,
             accent-dark #3E5C86, accent-light #7E9CC8,
             text-primary #2A2A2E, text-secondary #6B6B72
    Layout — series loop, clockwise:
      K (top wire, centre)
      C (left wire, vertical) — plates at (70,130) and (70,185)
      L (bottom wire, horizontal) — coil x=160..340 at y=250
      R (right wire, vertical) — rect at (450,130)-(450,190)
      Corners: TL(70,60) TR(450,60) BR(450,250) BL(70,250)

    u_C / C label fix: C label moved to x=100,y=162 (inside loop, right of plates)
    so it no longer collides with u_C label at x=15.
  -->

  <!-- ── Background: transparent (app surface shows through) ──── -->

  <!-- ════════════════════════════════════════════════════════
       STEP 1 — bare LC loop + interrupteur K
       (R absent, no labels yet)
       ════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Panel label -->
    <text x="260" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
      Circuit LC idéal — condensateur + bobine
    </text>

    <!-- Wire: top-left to K left terminal -->
    <line x1="70" y1="60" x2="185" y2="60" stroke="#4A4A52" stroke-width="2"/>
    <!-- Wire: K right terminal to top-right -->
    <line x1="255" y1="60" x2="450" y2="60" stroke="#4A4A52" stroke-width="2"/>

    <!-- In steps 1-3 the right wire is unbroken (R absent) -->
    <line x1="450" y1="60" x2="450" y2="250" stroke="#4A4A52" stroke-width="2"/>

    <!-- Wire: bottom BR to coil-right -->
    <line x1="340" y1="250" x2="450" y2="250" stroke="#4A4A52" stroke-width="2"/>
    <!-- Wire: bottom coil-left to BL -->
    <line x1="70" y1="250" x2="160" y2="250" stroke="#4A4A52" stroke-width="2"/>

    <!-- Wire: left side BL to C-bottom -->
    <line x1="70" y1="250" x2="70" y2="185" stroke="#4A4A52" stroke-width="2"/>
    <!-- Wire: left side C-top to TL -->
    <line x1="70" y1="130" x2="70" y2="60" stroke="#4A4A52" stroke-width="2"/>

    <!-- Corner dots -->
    <circle cx="70" cy="60" r="3" fill="#4A4A52"/>
    <circle cx="450" cy="60" r="3" fill="#4A4A52"/>
    <circle cx="450" cy="250" r="3" fill="#4A4A52"/>
    <circle cx="70" cy="250" r="3" fill="#4A4A52"/>

    <!-- ── Interrupteur K (switch, top centre) ── -->
    <circle cx="185" cy="60" r="3" fill="#4A4A52"/>
    <circle cx="255" cy="60" r="3" fill="#4A4A52"/>
    <line x1="185" y1="60" x2="248" y2="43" stroke="#4A4A52" stroke-width="2" stroke-linecap="round"/>
    <text x="220" y="38" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">K</text>

    <!-- ── Condensateur C (left wire, vertical, plates at y=130 and y=185) ── -->
    <!-- Plate 1 (top) -->
    <line x1="44" y1="130" x2="96" y2="130" stroke="#3E5C86" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Plate 2 (bottom) -->
    <line x1="44" y1="185" x2="96" y2="185" stroke="#3E5C86" stroke-width="2.5" stroke-linecap="round"/>
    <!-- C label: moved to x=100, inside loop (right of plates), no collision with u_C at x=15 -->
    <text x="102" y="162" text-anchor="start" font-size="13" font-style="italic" fill="#2A2A2E">C</text>

    <!-- ── Bobine L (bottom wire, horizontal, coil x=160..340 at y=250) ── -->
    <path d="M160,250 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <path d="M205,250 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <path d="M250,250 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <path d="M295,250 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <!-- L label, above the coil -->
    <text x="250" y="236" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">L</text>
  </g><!-- /step-1 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 2 — add current i + arrow
       ════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Current arrow on top wire (clockwise: left→right on top) -->
    <line x1="320" y1="60" x2="360" y2="60" stroke="#3E5C86" stroke-width="2.2"/>
    <polygon points="360,60 348,55 348,65" fill="#3E5C86"/>
    <!-- i label above arrow -->
    <text x="340" y="50" text-anchor="middle" font-size="14" font-style="italic" fill="#3E5C86">i</text>
  </g><!-- /step-2 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 3 — add tensions u_C and u_L (convention récepteur)
       ════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- u_C : dashed arrow on LEFT of capacitor plates, pointing downward
         u_C label at x=15 — clear of C label which is now at x=102 -->
    <line x1="32" y1="134" x2="32" y2="181" stroke="#3E5C86" stroke-width="1.4" stroke-dasharray="4,3"/>
    <polygon points="32,181 28,170 36,170" fill="#3E5C86"/>
    <text x="15" y="162" text-anchor="middle" font-size="12" font-style="italic" fill="#3E5C86">
      u<tspan dy="4" font-size="8.5">C</tspan>
    </text>

    <!-- u_L : arrow pointing LEFT along bottom wire under coil
         Convention récepteur: arrow in the direction of positive current through L -->
    <line x1="160" y1="267" x2="338" y2="267" stroke="#7E9CC8" stroke-width="1.4" stroke-dasharray="4,3"/>
    <polygon points="160,267 171,263 171,271" fill="#7E9CC8"/>
    <!-- u_L label below the dashed line -->
    <text x="250" y="283" text-anchor="middle" font-size="12" font-style="italic" fill="#7E9CC8">
      u<tspan dy="4" font-size="8.5">L</tspan>
    </text>
  </g><!-- /step-3 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 4 — add résistance R + u_R
       (used from R3 onward; R absent in steps 1–3 is deliberate)
       ════════════════════════════════════════════════════════ -->
  <g id="step-4">
    <!-- Mask the unbroken right wire from step-1 with a neutral fill,
         then draw two wire segments with the resistor rectangle in between.
         Using #EDEAE5 (panel colour) as mask — close enough when on app surface. -->
    <rect x="440" y="115" width="20" height="70" fill="#EDEAE5"/>
    <!-- Re-draw upper and lower wire stubs -->
    <line x1="450" y1="60" x2="450" y2="115" stroke="#4A4A52" stroke-width="2"/>
    <line x1="450" y1="185" x2="450" y2="250" stroke="#4A4A52" stroke-width="2"/>

    <!-- Resistor rectangle, centre (450,150), height 70, width 34 -->
    <rect x="433" y="115" width="34" height="70" rx="3" fill="#EDEAE5" stroke="#2A2A2E" stroke-width="2"/>
    <!-- R label inside -->
    <text x="450" y="156" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">R</text>

    <!-- u_R : dashed arrow on RIGHT side of resistor, pointing downward -->
    <line x1="482" y1="119" x2="482" y2="181" stroke="#7E9CC8" stroke-width="1.4" stroke-dasharray="4,3"/>
    <polygon points="482,119 478,130 486,130" fill="#7E9CC8"/>
    <!-- u_R label (right of arrow, fits within 520px viewBox) -->
    <text x="498" y="155" text-anchor="middle" font-size="12" font-style="italic" fill="#7E9CC8">
      u<tspan dy="4" font-size="8.5">R</tspan>
    </text>
  </g><!-- /step-4 -->

</svg>
