<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320"
     font-family="'Segoe UI', system-ui, sans-serif">
  <!--
    rlc-schema.svg — Circuit RLC série, 4 progressive steps
    step-1 : bare LC loop + interrupteur K  (R absent — pédagogiquement délibéré)
    step-2 : + courant i et sa flèche
    step-3 : + tensions u_C, u_L (convention récepteur)
    step-4 : + résistance R et u_R  (utilisé à partir de R3)

    Renderer reveals groups one at a time; fully-revealed SVG = static fallback.

    Palette: bg #F5F3EF, raised panel #EDEAE5, wire #4A4A52,
             accent-dark #3E5C86, accent-light #7E9CC8,
             text-primary #2A2A2E, text-secondary #6B6B72
    Layout — series loop, clockwise:
      K (top wire, centre)
      C (left wire, vertical) — plates at (70,130) and (70,185)
      L (bottom wire, horizontal) — coil x=160..340 at y=260
      R (right wire, vertical) — rect at (450,130)-(450,190)
      Corners: TL(70,60) TR(450,60) BR(450,260) BL(70,260)
  -->

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="520" height="320" rx="8" fill="#F5F3EF"/>

  <!-- ════════════════════════════════════════════════════════
       STEP 1 — bare LC loop + interrupteur K
       (R absent, no labels yet)
       ════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Panel label -->
    <text x="260" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#2A2A2E">
      Circuit LC idéal — condensateur + bobine
    </text>

    <!-- Wire: top-left to K left terminal -->
    <line x1="70" y1="60" x2="185" y2="60" stroke="#4A4A52" stroke-width="2"/>
    <!-- Wire: K right terminal to top-right -->
    <line x1="255" y1="60" x2="450" y2="60" stroke="#4A4A52" stroke-width="2"/>

    <!-- Wire: right side top to R-top (step-1: no R, so wire goes all the way down) -->
    <!-- In steps 1-3 the right wire is unbroken (R absent) -->
    <line x1="450" y1="60" x2="450" y2="260" stroke="#4A4A52" stroke-width="2"/>

    <!-- Wire: bottom BR to coil-right -->
    <line x1="340" y1="260" x2="450" y2="260" stroke="#4A4A52" stroke-width="2"/>
    <!-- Wire: bottom coil-left to BL -->
    <line x1="70" y1="260" x2="160" y2="260" stroke="#4A4A52" stroke-width="2"/>

    <!-- Wire: left side BL to C-bottom -->
    <line x1="70" y1="260" x2="70" y2="185" stroke="#4A4A52" stroke-width="2"/>
    <!-- Wire: left side C-top to TL -->
    <line x1="70" y1="130" x2="70" y2="60" stroke="#4A4A52" stroke-width="2"/>

    <!-- Corner dots -->
    <circle cx="70" cy="60" r="3" fill="#4A4A52"/>
    <circle cx="450" cy="60" r="3" fill="#4A4A52"/>
    <circle cx="450" cy="260" r="3" fill="#4A4A52"/>
    <circle cx="70" cy="260" r="3" fill="#4A4A52"/>

    <!-- ── Interrupteur K (switch, top centre) ── -->
    <!-- Terminals -->
    <circle cx="185" cy="60" r="3" fill="#4A4A52"/>
    <circle cx="255" cy="60" r="3" fill="#4A4A52"/>
    <!-- Lever, angled open (closed implied after K is fermed) -->
    <line x1="185" y1="60" x2="248" y2="43" stroke="#4A4A52" stroke-width="2" stroke-linecap="round"/>
    <!-- K label -->
    <text x="220" y="38" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">K</text>

    <!-- ── Condensateur C (left wire, vertical, plates at y=130 and y=185) ── -->
    <!-- Plate 1 (top) -->
    <line x1="44" y1="130" x2="96" y2="130" stroke="#3E5C86" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Plate 2 (bottom) -->
    <line x1="44" y1="185" x2="96" y2="185" stroke="#3E5C86" stroke-width="2.5" stroke-linecap="round"/>
    <!-- C label, beside the capacitor -->
    <text x="26" y="162" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">C</text>

    <!-- ── Bobine L (bottom wire, horizontal, coil x=160..340 at y=260) ── -->
    <!-- 4 half-arcs, each 45px wide, bumping upward (above the bottom wire) -->
    <path d="M160,260 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <path d="M205,260 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <path d="M250,260 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <path d="M295,260 a22.5,16 0 0,1 45,0" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <!-- L label, above the coil -->
    <text x="250" y="246" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">L</text>

    <!-- Step caption -->
    <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#6B6B72">
      Un condensateur chargé, relié à une bobine — rien d'autre.
    </text>
  </g><!-- /step-1 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 2 — add current i + arrow
       ════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Current arrow on top wire (clockwise: left→right on top) -->
    <line x1="320" y1="60" x2="360" y2="60" stroke="#3E5C86" stroke-width="2.2"/>
    <polygon points="360,60 348,55 348,65" fill="#3E5C86"/>
    <!-- i label above arrow -->
    <text x="340" y="50" text-anchor="middle" font-size="14" font-style="italic" fill="#3E5C86">i</text>

    <!-- Step caption (replaces step-1 caption when step-2 is active) -->
    <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#6B6B72">
      On ferme K — un courant i circule dans le circuit.
    </text>
  </g><!-- /step-2 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 3 — add tensions u_C and u_L (convention récepteur)
       ════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- u_C : arrow pointing downward on LEFT of capacitor plates
         Convention récepteur: arrow from + to − (top plate positive at t=0) -->
    <!-- dashed line from plate-top to plate-bottom on the left -->
    <line x1="32" y1="134" x2="32" y2="181" stroke="#3E5C86" stroke-width="1.4" stroke-dasharray="4,3"/>
    <!-- arrowhead pointing DOWN (conventional sense, top → bottom = + to −) -->
    <polygon points="32,181 28,170 36,170" fill="#3E5C86"/>
    <!-- u_C label -->
    <text x="15" y="162" text-anchor="middle" font-size="12" font-style="italic" fill="#3E5C86">
      u<tspan dy="4" font-size="8.5">C</tspan>
    </text>

    <!-- u_L : arrow pointing LEFT along bottom wire under coil
         Convention récepteur: arrow in the direction of positive current through L -->
    <line x1="160" y1="277" x2="338" y2="277" stroke="#7E9CC8" stroke-width="1.4" stroke-dasharray="4,3"/>
    <polygon points="160,277 171,273 171,281" fill="#7E9CC8"/>
    <!-- u_L label below the dashed line -->
    <text x="250" y="294" text-anchor="middle" font-size="12" font-style="italic" fill="#7E9CC8">
      u<tspan dy="4" font-size="8.5">L</tspan>
    </text>

    <!-- Convention récepteur small annotation -->
    <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#6B6B72">
      Tensions u<tspan dy="3" font-size="8">C</tspan><tspan dy="-3"> et u</tspan><tspan dy="3" font-size="8">L</tspan><tspan dy="-3"> en convention récepteur — loi des mailles : u</tspan><tspan dy="3" font-size="8">C</tspan><tspan dy="-3"> + u</tspan><tspan dy="3" font-size="8">L</tspan><tspan dy="-3"> = 0</tspan>
    </text>
  </g><!-- /step-3 -->

  <!-- ════════════════════════════════════════════════════════
       STEP 4 — add résistance R + u_R
       (used from R3 onward; R absent in steps 1–3 is deliberate)
       ════════════════════════════════════════════════════════ -->
  <g id="step-4">
    <!-- Mask the unbroken right wire from step-1 with background colour,
         then draw two wire segments with the resistor rectangle in between -->
    <!-- Wire top segment: TR (450,60) → R top (450,125) -->
    <!-- Wire bottom segment: R bottom (450,195) → BR (450,260) -->
    <!-- Overwrite middle of right wire with bg colour to "erase" the step-1 wire -->
    <rect x="440" y="125" width="20" height="70" fill="#F5F3EF"/>
    <!-- Re-draw upper and lower wire stubs -->
    <line x1="450" y1="60" x2="450" y2="125" stroke="#4A4A52" stroke-width="2"/>
    <line x1="450" y1="195" x2="450" y2="260" stroke="#4A4A52" stroke-width="2"/>

    <!-- Resistor rectangle, centre (450,160), height 70, width 34 -->
    <rect x="433" y="125" width="34" height="70" rx="3" fill="#EDEAE5" stroke="#2A2A2E" stroke-width="2"/>
    <!-- R label inside -->
    <text x="450" y="166" text-anchor="middle" font-size="13" font-style="italic" fill="#2A2A2E">R</text>

    <!-- u_R : dashed arrow on RIGHT side of resistor, pointing downward -->
    <line x1="482" y1="129" x2="482" y2="191" stroke="#7E9CC8" stroke-width="1.4" stroke-dasharray="4,3"/>
    <polygon points="482,129 478,140 486,140" fill="#7E9CC8"/>
    <!-- u_R label (right of arrow, fits within 520px viewBox) -->
    <text x="498" y="165" text-anchor="middle" font-size="12" font-style="italic" fill="#7E9CC8">
      u<tspan dy="4" font-size="8.5">R</tspan>
    </text>

    <!-- Updated caption -->
    <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#6B6B72">
      Avec R : u<tspan dy="3" font-size="8">C</tspan><tspan dy="-3"> + u</tspan><tspan dy="3" font-size="8">L</tspan><tspan dy="-3"> + u</tspan><tspan dy="3" font-size="8">R</tspan><tspan dy="-3"> = 0</tspan>
    </text>
  </g><!-- /step-4 -->

</svg>
