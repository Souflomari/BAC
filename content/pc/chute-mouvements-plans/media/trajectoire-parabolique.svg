<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Trajectoire parabolique d'un projectile lancé depuis l'origine avec une vitesse initiale v0 inclinée d'un angle alpha au-dessus de l'horizontale : la parabole calculée, le vecteur v0 décomposé en v0x et v0y, la flèche (hauteur au sommet) et la portée (distance au sol) marquées, et le vecteur g vers le bas.">
  <title>Trajectoire d'un projectile — décomposition de v0, flèche et portée</title>
  <!--
    trajectoire-parabolique.svg — figure STATIQUE, cœur de la partie
    "projectile" de la leçon (R2-R5).

    Reprend EXACTEMENT l'exemple numérique filé dans le texte (R2-R4) :
      v0 = 25 m/s, sinα = 0,60, cosα = 0,80  ⇒  v0x = 20 m/s, v0y = 15 m/s
      g ≈ 9,8 m/s², tanα = 0,75
      y(x) = tanα·x − g/(2·v0x²)·x² = 0,75x − 0,01225x²   (R3)
      sommet : x ≈ 30,61 m, f = y_max ≈ 11,49 m  (arrondi texte : 11,5 m)
      portée : D ≈ 61,22 m                        (arrondi texte : 61,2 m)

    Échelle du tracé (anisotrope, comme i-etablissement.svg / rl-schema.svg
    ont leur propre échelle px-par-grandeur — un choix de mise en page, pas
    une prétention à l'unité physique littérale) :
      scale_x = 8 px/m,  scale_y = 14 px/m
      origine (lancement, x=0,y=0)      : (80, 300)
      point x_px = 80 + 8·x ; y_px = 300 − 14·y

    Sous une transformation affine (x,y) → (sx·x, sy·y), une parabole reste
    une parabole (le polynôme reste du second degré) — donc la courbe
    tracée ci-dessous EST la vraie trajectoire, seulement mise à l'échelle
    pour tenir dans le panneau (portée ≫ flèche dans les faits : 61 m contre
    11,5 m — sans anisotropie, la courbe serait presque plate).

    Le vecteur v0 est tracé pour être TANGENT à la courbe à l'origine : sa
    pente en pixels vaut (scale_y/scale_x)·tanα = (14/8)×0,75 = 1,3125,
    exactement la pente initiale de la polyligne ci-dessous — v0 n'est donc
    pas une direction approchée, c'est la vraie tangente, dans le même
    repère (anisotrope) que la courbe.

    Points de la courbe (25 points intérieurs, pas de 2,5 m, + sommet exact
    + les deux extrémités), calculés depuis y(x) = 0,75x − 0,01225x² puis
    convertis par x_px = 80+8x, y_px = 300−14y :
      x=0    y=0        → (80, 300)
      x=2.5  y=1.7984   → (100, 274.82)
      x=5.0  y=3.4438   → (120, 251.79)
      x=7.5  y=4.9359   → (140, 230.90)
      x=10.0 y=6.2750   → (160, 212.15)
      x=12.5 y=7.4609   → (180, 195.55)
      x=15.0 y=8.4938   → (200, 181.09)
      x=17.5 y=9.3734   → (220, 168.77)
      x=20.0 y=10.100   → (240, 158.60)
      x=22.5 y=10.673   → (260, 150.57)
      x=25.0 y=11.094   → (280, 144.69)
      x=27.5 y=11.361   → (300, 140.95)
      x=30.0 y=11.475   → (320, 139.35)
      x=30.61 (sommet) y=11.490 → (324.9, 139.14)   ← flèche f
      x=32.5 y=11.436   → (340, 139.90)
      x=35.0 y=11.244   → (360, 142.59)
      x=37.5 y=10.898   → (380, 147.42)
      x=40.0 y=10.400   → (400, 154.40)
      x=42.5 y=9.7484   → (420, 163.52)
      x=45.0 y=8.9438   → (440, 174.79)
      x=47.5 y=7.9859   → (460, 188.20)
      x=50.0 y=6.8750   → (480, 203.75)
      x=52.5 y=5.6109   → (500, 221.45)
      x=55.0 y=4.1938   → (520, 241.29)
      x=57.5 y=2.6234   → (540, 263.27)
      x=60.0 y=0.900    → (560, 287.40)
      x=61.22 (portée D) y=0 → (569.8, 300)          ← point de chute

    Rôle des couleurs :
      courbe (la trajectoire, grandeur d'intérêt)      : --figure-accent
      v0 (résultante), g                               : --figure-ink
      v0x, v0y (composantes), axes, arc α, brackets     : --figure-ink-soft
      sommet / point de chute (sur la courbe)          : --figure-accent
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Trajectoire d'un projectile — décomposition de v<tspan dy="3" font-size="8.5">0</tspan><tspan dy="-3">, flèche et portée</tspan>
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="30" width="600" height="330" rx="6"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ── Axes (Ox, Oy) — ink-soft, chrome neutre ─────────────────────── -->
  <line x1="80" y1="300" x2="605" y2="300"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="605,300 593,295.5 593,304.5" fill="var(--figure-ink-soft)"/>
  <line x1="80" y1="300" x2="80" y2="55"
        stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
  <polygon points="80,55 75.5,66 84.5,66" fill="var(--figure-ink-soft)"/>
  <text x="612" y="304" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">x</text>
  <text x="72" y="59" text-anchor="end" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">y</text>
  <text x="72" y="312" text-anchor="end" font-size="10"
        fill="var(--figure-ink-soft)">O</text>

  <!-- ── Trajectoire — la vraie parabole calculée (grandeur d'intérêt) ─ -->
  <path d="
    M80,300
    L100,274.82 L120,251.79 L140,230.90 L160,212.15 L180,195.55
    L200,181.09 L220,168.77 L240,158.60 L260,150.57 L280,144.69
    L300,140.95 L320,139.35 L324.9,139.14 L340,139.90 L360,142.59
    L380,147.42 L400,154.40 L420,163.52 L440,174.79 L460,188.20
    L480,203.75 L500,221.45 L520,241.29 L540,263.27 L560,287.40
    L569.8,300
  " fill="none" stroke="var(--figure-accent)" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Vecteur v0 (résultante) — tangent à la courbe à l'origine ───── -->
  <line x1="80" y1="300" x2="190" y2="155.63"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="190,155.63 186.31,167.90 179.15,162.44" fill="var(--figure-ink)"/>
  <text x="113" y="212" text-anchor="middle" font-size="13" font-style="italic"
        fill="var(--figure-ink)">v<tspan dy="3" font-size="8.5">0</tspan></text>

  <!-- Composante v0x (horizontale, pointillée) -->
  <line x1="80" y1="300" x2="190" y2="300"
        stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="5,3" stroke-linecap="round"/>
  <polygon points="190,300 178,295.5 178,304.5" fill="var(--figure-ink-soft)"/>
  <text x="135" y="314" text-anchor="middle" font-size="10.5" font-style="italic"
        fill="var(--figure-ink-soft)">v<tspan dy="3" font-size="7.5">0x</tspan></text>

  <!-- Composante v0y (verticale, pointillée) -->
  <line x1="190" y1="300" x2="190" y2="155.63"
        stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="5,3" stroke-linecap="round"/>
  <polygon points="190,155.63 186.5,164.63 193.5,164.63" fill="var(--figure-ink-soft)"/>
  <text x="200" y="230" text-anchor="start" font-size="10.5" font-style="italic"
        fill="var(--figure-ink-soft)">v<tspan dy="3" font-size="7.5">0y</tspan></text>

  <!-- Arc de l'angle α, entre Ox et v0 -->
  <path d="M104,300 L103.39,294.60 L101.57,289.48 L98.65,284.90 L94.54,280.91"
        fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="115" y="283" font-size="11" font-style="italic"
        fill="var(--figure-ink-soft)">α</text>

  <!-- ── Sommet (v_y = 0) — point sur la courbe ───────────────────────── -->
  <circle cx="324.9" cy="139.14" r="3.2" fill="var(--figure-accent)"/>

  <!-- Bracket vertical : flèche f (hauteur, mesurée depuis le sol jusqu'au sommet) -->
  <line x1="324.9" y1="139.14" x2="345" y2="139.14"
        stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="345" y1="300" x2="345" y2="139.14"
        stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <line x1="340" y1="139.14" x2="350" y2="139.14"
        stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <line x1="340" y1="300" x2="350" y2="300"
        stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <text x="357" y="222" font-size="12" font-style="italic"
        fill="var(--figure-ink-soft)">f</text>

  <!-- ── Point de chute — point sur la courbe (y = 0, x = D) ──────────── -->
  <circle cx="569.8" cy="300" r="3.2" fill="var(--figure-accent)"/>

  <!-- Bracket horizontal : portée D (distance au sol, du lancement à l'arrivée) -->
  <line x1="80" y1="300" x2="80" y2="322"
        stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="569.8" y1="300" x2="569.8" y2="322"
        stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="324" x2="569.8" y2="324"
        stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <line x1="80" y1="319" x2="80" y2="329"
        stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <line x1="569.8" y1="319" x2="569.8" y2="329"
        stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
  <text x="324.9" y="340" text-anchor="middle" font-size="12" font-style="italic"
        fill="var(--figure-ink-soft)">D</text>

  <!-- ── Vecteur g — constant, vers le bas ─────────────────────────── -->
  <line x1="575" y1="42" x2="575" y2="82"
        stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="575,82 570.5,71 579.5,71" fill="var(--figure-ink)"/>
  <text x="583" y="66" font-size="13" font-style="italic"
        fill="var(--figure-ink)">g</text>

  <!-- Captions -->
  <text x="320" y="392" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">v<tspan dy="3" font-size="7.5">x</tspan><tspan dy="-3">(t) = v</tspan><tspan
        dy="3" font-size="7.5">0</tspan><tspan dy="-3"> cos α reste constante tout au long du vol ; seule v</tspan><tspan
        dy="3" font-size="7.5">y</tspan><tspan dy="-3">(t) varie et s'annule au sommet.</tspan></text>
  <text x="320" y="409" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">La flèche f (hauteur, au sommet où v<tspan
        dy="3" font-size="7.5">y</tspan><tspan dy="-3"> = 0) et la portée D (distance au sol, à l'arrivée) ne sont jamais le même nombre.</tspan></text>

</svg>
