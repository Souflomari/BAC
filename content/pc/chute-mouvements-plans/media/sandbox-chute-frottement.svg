<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Deux courbes v(t), pour deux billes de même coefficient de frottement k mais de masses différentes, tombant dans le même fluide : la bille deux fois plus lourde atteint une vitesse limite deux fois plus grande. À la dernière étape, un curseur règle la masse de la seconde bille, de 0,20 à 0,40 kg, et sa courbe, son asymptote et sa vitesse limite suivent.">
  <title>Chute avec frottement — l’effet de la masse sur v_lim (même k)</title>
  <!--
    sandbox-chute-frottement.svg — STAGED + MANIPULABLE
    (docs/design/INTERACTIVE-FIGURE-SPEC.md). C'est, depuis le 2026-09-24, le
    manipulable que la spec prescrivait (l'embed sandbox-chute-frottement,
    « curseurs m, k ») : à partir de la dernière étape (step-3), c'est
    désormais le manipulable lui-même — un curseur de masse m se
    déverrouille (k = 2,0 kg/s reste fixe) et recalcule en direct la courbe,
    l'asymptote et les étiquettes de la bille mobile
    (sandbox-chute-frottement.interactive.json,
    web/src/lib/interactive-figures/sandbox-chute-frottement.ts). La bille
    de référence (step-2, courbe --figure-ink, m₁ = 0,20 kg) reste FIXE —
    c'est la comparaison avec elle qui rend visible ce que le curseur change.

    Sert directement CH-FR-3 : "la masse ne joue jamais dans une chute
    (comme en chute libre)". Contre-exemple : avec frottement, v_lim = mg/k
    dépend de m — le plus lourd va plus vite.

    Bille 1 (fixe, step-2) = EXACTEMENT la bille filée en R7/R8 : m₁=0,20 kg,
    k=2,0 kg/s, g≈9,8 m/s² ⇒ τ₁=0,10 s, v_lim,1=0,98 m/s.
    Bille mobile (step-3, curseur) : m ∈ [0,20 ; 0,40] kg, pas 0,05 kg,
    valeur initiale 0,40 kg (= l'ancienne "bille 2", masse double) ; τ=m/k,
    v_lim=mg/k. À m=0,20 kg, la courbe mobile coïncide EXACTEMENT avec la
    bille 1 (même m, même k) — glisser le curseur vers 0,40 la fait se
    décoller et monter : la preuve visuelle de CH-FR-3. Domaine plafonné à
    0,40 kg pour que v_lim (=mg/k, max 1,96 m/s à m=0,40) reste sous la
    pointe de flèche de l'axe v (y=60) sans redessiner les axes — à m=0,40,
    l'asymptote est à y≈89,6, encore ≈30 px sous la pointe.

    Échelle (SOURCE UNIQUE, reprise à l'identique dans le module .ts) :
    origine (t=0,v=0)=(90,364). scale_t=520 px/s, scale_v=140 px/(m/s).
    Courbes tracées via v/v_lim=1−e^(−t/τ) (forme relevée
    expérimentalement — jamais dérivée dans le texte, R7 "limite du
    cadre" ; le module .ts ne fait QUE rejouer cette même forme, pour
    n'importe quel m — jamais affichée comme formule à l'écran),
    échantillonnées à s=t/τ = 0, 0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, 3, 4, 5 :

    Bille 1 (τ=0,10 ; v_lim=0,98) — points (x=90+520t, y=364−140v) :
      (90,364) (103,333.65) (116,310.0) (129,291.62) (142,277.28)
      (168,257.40) (194,245.36) (220,238.07) (246,233.63) (298,229.31)
      (350,227.72)   asymptote y = 364−140·0,98 = 227

    Bille mobile à m=0,40 kg (état initial du curseur, τ=0,20 ;
    v_lim=1,96) — mêmes points, t doublé :
      (90,364) (116,303.3) (142,256.03) (168,219.22) (194,190.55)
      (246,150.83) (298,126.74) (350,112.12) (402,103.26) (506,94.63)
      (610,91.45)    asymptote y = 364−140·1,96 = 89,6

    ids recalculés par le curseur (step-3, tous liés dans
    sandbox-chute-frottement.interactive.json) :
      #curve-mobile      — la courbe v(t) de la bille mobile
      #asymptote-mobile  — l'asymptote horizontale à v_lim
      #label-vlim-tick   — le repère "v_ℓ" sur l'axe (position suit l'asymptote)
      #label-masse       — l'étiquette "m = … kg" posée sur la courbe (position + texte)
      #label-lecture     — la phrase de lecture sous le panneau (τ = m/k, v_lim = mg/k)

    Rôle des couleurs :
      courbe bille 1 (référence FIXE, plus légère)     : --figure-ink
      asymptote bille 1                                 : --figure-ink-soft
      courbe bille mobile (curseur, plus lourde à 0,40) : --figure-accent
      asymptote bille mobile, étiquettes bille mobile   : --figure-accent
      axes                                               : --figure-ink-soft
  -->

  <!-- Titre -->
  <text x="340" y="20" text-anchor="middle" font-size="12" font-weight="600"
        letter-spacing="0.01em" fill="var(--figure-ink)">
    Deux billes, même k, masses différentes — v(t)
  </text>
  <text x="340" y="34" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">
    k = 2,0 kg/s pour les deux ; seule la masse change
  </text>

  <!-- Fond du panneau -->
  <rect x="30" y="42" width="620" height="342" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — le repère
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="90" y1="364" x2="642" y2="364" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="642,364 630,359.5 630,368.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="364" x2="90" y2="60" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,60 85.5,71 94.5,71" fill="var(--figure-ink-soft)"/>
    <text x="649" y="368" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">t</text>
    <text x="82" y="64" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">v</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — bille 1 (référence, R7/R8) : m₁ = 0,20 kg
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="90" y1="227" x2="610" y2="227" stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="82" y="231" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">v<tspan dy="2" font-size="7">ℓ,1</tspan></text>

    <path d="
      M90,364 L103,333.65 L116,310.0 L129,291.62 L142,277.28
      L168,257.40 L194,245.36 L220,238.07 L246,233.63 L298,229.31
      L350,227.72
    " fill="none" stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350,227.72 L610,227" fill="none" stroke="var(--figure-ink)" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text x="360" y="220" font-size="10.5" font-style="italic" fill="var(--figure-ink)">m₁ = 0,20 kg (la bille de l’exemple travaillé)</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — bille mobile : curseur de masse m ∈ [0,20 ; 0,40] kg
       (déverrouille la manipulation — unlockAfterStage = 3)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path id="asymptote-mobile" d="M90,89.6 L610,89.6" fill="none"
          stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="4,3"/>
    <text id="label-vlim-tick" x="82" y="93.6" text-anchor="end" font-size="10"
          fill="var(--figure-accent)">v<tspan dy="2" font-size="7">ℓ</tspan></text>

    <path id="curve-mobile" d="
      M90,364 L116,303.3 L142,256.03 L168,219.22 L194,190.55
      L246,150.83 L298,126.74 L350,112.12 L402,103.26 L506,94.63
      L610,91.45
    " fill="none" stroke="var(--figure-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="label-masse" x="420" y="84.26" font-size="10.5" font-style="italic"
          fill="var(--figure-accent)">m = 0,40 kg</text>

    <text id="label-lecture" x="340" y="404" text-anchor="middle" font-size="11"
          fill="var(--figure-accent)">m = 0,40 kg (k inchangé) → τ = m/k = 0,20 s ; v_lim = mg/k = 1,96 m/s</text>
  </g><!-- /step-3 -->

</svg>
