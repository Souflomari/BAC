<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Satellite en orbite circulaire de rayon r autour de la Terre : le vecteur vitesse v est tangent au cercle, la force gravitationnelle F pointe vers le centre de la Terre, perpendiculaire à v — une force centripète.">
  <title>Orbite circulaire — force gravitationnelle centripète</title>
  <!--
    orbite-force-centripete.svg — figure STAGED (3 étapes). Cœur du R9 :
    la force gravitationnelle est TOUJOURS dirigée vers le centre, donc
    perpendiculaire à v à chaque instant — même raisonnement qu'au R6
    (force de Lorentz).

    Géométrie (schématique — le rapport rayon Terre/rayon orbite n'est PAS
    à l'échelle réelle, choisi pour la lisibilité, comme les autres figures
    de mécanique de ce corpus) :
      Terre : centre C=(320,260), rayon R_T,px = 55.
      Orbite : cercle concentrique, rayon r_px = 170 (pointillé — c'est le
        CHEMIN, pas une force).
      Satellite S, à l'angle θ=−40° sur l'orbite :
        S = C + 170·(cos(−40°), sin(−40°)) = C + (130.22, −109.31)
          = (450.22, 150.69)
      Vecteur tangent unitaire en S (perpendiculaire au rayon CS) :
        (−sinθ, cosθ) = (0.643, 0.766) — vérifié : produit scalaire avec
        le rayon unitaire (0.766,−0.643) = 0.643·0.766+0.766·(−0.643) = 0
        (perpendicularité EXACTE, pas approchée).
      Vecteur F, de S vers C : direction (−0.766, 0.643), longueur 60 px.

    Rôle des couleurs :
      orbite (chemin, grandeur d'intérêt)     : --figure-accent (pointillé)
      Terre                                   : --figure-ink-soft (fond léger)
      v, F (vecteurs), rayon r, angle droit    : --figure-ink
      formule                                  : --figure-accent
  -->

  <!-- Titre -->
  <text x="320" y="24" text-anchor="middle" font-size="12" font-weight="600"
        letter-spacing="0.01em" fill="var(--figure-ink)">
    Satellite en orbite circulaire — la force gravitationnelle est centripète
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="36" width="600" height="420" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — données : Terre, orbite, satellite, rayon r
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Orbite (le chemin) -->
    <circle cx="320" cy="260" r="170" fill="none" stroke="var(--figure-accent)"
            stroke-width="2" stroke-dasharray="7,5"/>

    <!-- Terre -->
    <circle cx="320" cy="260" r="55" fill="var(--figure-ink-soft)" fill-opacity="0.20"
            stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <text x="320" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">Terre</text>
    <text x="320" y="271" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">M<tspan dy="3" font-size="8">T</tspan></text>

    <!-- Rayon r (mesure, pointillé) -->
    <line x1="320" y1="260" x2="450.22" y2="150.69" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="368" y="220" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">r</text>

    <!-- Satellite -->
    <circle cx="450.22" cy="150.69" r="6" fill="var(--figure-ink)"/>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — mécanisme : le vecteur vitesse, tangent à l'orbite
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="450.22" y1="150.69" x2="493.23" y2="203.11"
          stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="498,209 484.6,205.9 491.9,196.9" fill="var(--figure-ink)"/>
    <text x="503" y="215" font-size="13" font-style="italic" fill="var(--figure-ink)">v</text>
    <text x="503" y="228" font-size="9" fill="var(--figure-ink-soft)">(tangente à l’orbite)</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — lecture : la force F, centripète, perpendiculaire à v
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="450.22" y1="150.69" x2="404.26" y2="189.27"
          stroke="var(--figure-ink)" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="397,195 405.7,182.8 412.6,191.1" fill="var(--figure-ink)"/>
    <text x="378" y="188" text-anchor="end" font-size="13" font-style="italic" fill="var(--figure-ink)">F</text>

    <!-- Petit repère d'angle droit entre v et F -->
    <path d="M456.65,158.35 L448.99,164.78 L442.56,157.12"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>

    <!-- Formule -->
    <rect x="420" y="55" width="195" height="34" rx="5" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="517.5" y="77" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-accent)">F = G·M<tspan dy="3" font-size="9">T</tspan><tspan dy="-3">·m / r²</tspan></text>

    <text x="320" y="440" text-anchor="middle" font-size="11" fill="var(--figure-accent)">F toujours vers le centre → F ⊥ v → mouvement circulaire uniforme</text>
  </g><!-- /step-3 -->

</svg>
