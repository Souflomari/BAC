      confondre avec la fleche, qui est la hauteur maximale (verticale).
    solution: |
      Deux grandeurs a distinguer :
      - la FLECHE : hauteur maximale (verticale) atteinte au sommet, ou
      $v_y = 0$ ;
      - la PORTÉE : distance horizontale entre le lancement et le retour au
      sol ($y = 0$ de nouveau).

  - id: CMP-5
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Pour une vitesse initiale $v_0$ donnée (sol horizontal, frottements
      négligés), pour quel angle de lancement la portée est-elle maximale ?
    type: mcq
    choices:
      - id: A
        text: "$45^\\circ$"
        correct: true
      - id: B
        text: "$90^\\circ$"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          A $90^\circ$ le tir est vertical : la portée est nulle (le projectile
          retombe au point de départ). C'est un maximum de FLECHE, pas de
          portée.
      - id: C
        text: "$30^\\circ$"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          $30^\circ$ donne une portée, mais pas la plus grande : $\sin(2\alpha)
          = \sin 60^\circ < 1$. Le maximum de $\sin(2\alpha)$ est atteint pour
          $2\alpha = 90^\circ$.
      - id: D
        text: "$60^\\circ$"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          $60^\circ$ donne la même portée que $30^\circ$ (angles
          complementaires : $\sin 120^\circ = \sin 60^\circ$), mais pas le
          maximum, atteint a $45^\circ$.
    correct_feedback: >
      Exact : la portée vaut $D = \dfrac{v_0^2 \sin(2\alpha)}{g}$, maximale
      quand $\sin(2\alpha) = 1$, soit $2\alpha = 90^\circ$, donc
      $\alpha = 45^\circ$.
    solution: |
      La portée sur sol horizontal s'écrit :
      $$D = \frac{v_0^2 \sin(2\alpha)}{g}$$
      Elle est maximale lorsque $\sin(2\alpha) = 1$ :
      $$2\alpha = 90^\circ \implies \alpha = 45^\circ$$

  - id: CMP-6
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Une particule chargée penetre avec une vitesse $\vec v_0$ dans un champ
      magnétique uniforme $\vec B$ perpendiculaire à $\vec v_0$ (poids négligé).
      Quelle est la nature de son mouvement dans le champ ?
    type: mcq
    choices:
      - id: A
        text: "Circulaire uniforme : la force de Lorentz, perpendiculaire à la vitesse, n'en change pas la norme et courbe la trajectoire en cercle"
        correct: true
      - id: B
        text: "Parabolique, exactement comme celle d'un projectile lancé dans le champ de pesanteur"
        correct: false
        misconception: mc.physics.pc_chute_plans.force-de-lorentz-mal-comprise
        feedback: >
          C'est confondre la force de Lorentz avec une force constante comme le
          poids. La force $\vec F = q\vec v\wedge\vec B$ n'a pas une direction
          fixe : elle reste perpendiculaire a une vitesse qui tourne. Une force
          de norme constante toujours perpendiculaire à $\vec v$ donne un
          cercle, pas une parabole.
      - id: C
        text: "Rectiligne accélérée : la force de Lorentz communique sans cesse de la vitesse supplémentaire à la particule chargée"
        correct: false
        misconception: mc.physics.pc_chute_plans.force-de-lorentz-mal-comprise
        feedback: >
          La force de Lorentz est perpendiculaire à $\vec v$ : elle ne travaille
          pas, donc la norme de la vitesse ne change pas ($dv/dt = 0$). Elle
          devie la particule sans l'accélérer ni la ralentir.
      - id: D
        text: "Rectiligne uniforme : aucune force ne vient dévier la particule chargée de sa direction initiale de propagation"
        correct: false
        misconception: mc.physics.pc_chute_plans.force-de-lorentz-mal-comprise
        feedback: >
          Comme $\vec B \perp \vec v_0$, la force $\vec F = q\vec v\wedge\vec B$
          n'est pas nulle (sa norme vaut $|q|\,v_0\,B$) : elle courbe bel et
          bien la trajectoire. Le mouvement n'est pas rectiligne.
    correct_feedback: >
      Oui : $\vec F = q\vec v\wedge\vec B$ est toujours perpendiculaire a
      $\vec v$. Sa composante tangentielle étant nulle, la norme $v = v_0$ reste
      constante ; sa composante normale courbe la trajectoire en un cercle de
      rayon $R = \dfrac{m\,v_0}{|q|\,B}$. C'est un mouvement circulaire uniforme.
    solution: |
      Bilan : seule la force de Lorentz $\vec F = q\vec v\wedge\vec B$ agit
      (poids négligé), toujours perpendiculaire à $\vec v$. On projette la 2e loi
      dans la base de Freinet.
      Sur la tangente (la force n'a pas de composante tangentielle) :
      $$m\frac{dv}{dt} = 0 \implies v = v_0 = \text{constante}$$
      Sur la normale, avec $F = |q|\,v_0\,B$ et $a_N = v_0^2 / R$ :
      $$m\frac{v_0^2}{R} = |q|\,v_0\,B \implies R = \frac{m\,v_0}{|q|\,B}$$
      Vitesse de norme constante et rayon constant : mouvement circulaire
      uniforme.

