    type: mcq
    choices:
      - id: A
        text: "Elles suivent exactement la même trajectoire, car le champ magnetique ne dépend pas du signe de la charge"
        correct: false
        feedback: >
          Contrairement a la chute libre (ou la masse disparaît), le SIGNE
          de la charge intervient directement dans le sens de
          $\vec F = q\vec v\wedge\vec B$ : il ne disparaît pas.
      - id: B
        text: "La particule positive n'est pas déviée du tout, seule la négative subit la force de Lorentz"
        correct: false
