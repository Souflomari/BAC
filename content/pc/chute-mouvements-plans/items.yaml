notion: chute-mouvements-plans
skill_code: pc_chute_plans
misconceptions: []
items:
  - id: CMP-1
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un projectile est lance dans le champ de pesanteur, frottements de l'air
      negliges. Que devient la composante horizontale $v_x$ de sa vitesse
      pendant le vol ?
    type: mcq
    choices:
      - id: A
        text: "Elle reste constante, car aucune force horizontale n'agit sur le projectile"
        correct: true
      - id: B
        text: "Elle diminue progressivement jusqu'a s'annuler"
        correct: false
        feedback: >
          Rien ne freine horizontalement : les frottements sont negliges et le
          poids est vertical. Sur l'axe horizontal, $a_x = 0$, donc $v_x$ ne
          diminue pas.
      - id: C
        text: "Elle augmente, entrainee par la chute"
        correct: false
        feedback: >
          La chute agit sur la composante VERTICALE. Les deux mouvements sont
          independants : le poids etant vertical, il ne modifie pas $v_x$.
      - id: D
        text: "Elle s'annule au sommet de la trajectoire"
        correct: false
        feedback: >
          C'est $v_y$ qui s'annule au sommet, pas $v_x$. Au sommet la vitesse
          est purement horizontale et vaut justement $v_x = v_{0x}$.
    correct_feedback: >
      Exact : sur l'axe horizontal la 2e loi donne $a_x = 0$, donc
      $v_x = v_{0x}$ reste constante tout le vol. C'est ce qui rend les deux
      axes independants.
    solution: |
      Bilan : seul le poids $\vec P = m\vec g$ agit, et il est vertical.
      Projection de la 2e loi sur l'axe horizontal :
      $$m a_x = 0$$
      $$a_x = 0 \implies v_x = v_{0x} = \text{constante}$$
      Le mouvement horizontal est uniforme ; seul l'axe vertical subit $g$.

  - id: CMP-2
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Au sommet de sa trajectoire (la fleche), quelle est la vitesse du
      projectile ?
    type: mcq
    choices:
      - id: A
        text: "Horizontale et non nulle, egale a $v_{0x}$"
        correct: true
      - id: B
        text: "Nulle"
        correct: false
        feedback: >
          Au sommet, seule la composante VERTICALE $v_y$ s'annule. La
          composante horizontale $v_x = v_{0x}$ subsiste : la vitesse totale
          n'est donc pas nulle.
      - id: C
        text: "Verticale, dirigee vers le bas"
        correct: false
        feedback: >
          Juste apres le sommet la vitesse aura une composante verticale vers
          le bas, mais AU sommet $v_y = 0$ : la vitesse y est purement
          horizontale.
      - id: D
        text: "Maximale sur toute la trajectoire"
        correct: false
        feedback: >
          C'est au contraire ou la vitesse est MINIMALE (il ne reste que
          $v_x$). Elle est maximale au depart et a l'arrivee au sol.
    correct_feedback: >
      Oui : au sommet $v_y = 0$ mais $v_x = v_{0x} \neq 0$. La vitesse y est
      horizontale et minimale, jamais nulle.
    solution: |
      Le sommet est defini par $v_y = 0$ (la montee s'arrete, la descente
      commence). Mais l'axe horizontal reste uniforme :
      $$v_x = v_{0x} = v_0\cos\alpha \neq 0$$
      La vitesse au sommet vaut donc $v_{0x}$, horizontale.

  - id: CMP-3
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Deux billes de masses differentes sont lancees avec exactement la meme
      vitesse initiale (meme valeur, meme angle), frottements negliges. Que
      peut-on dire de leurs trajectoires ?
    type: mcq
    choices:
      - id: A
        text: "Elles sont identiques, car l'acceleration $\\vec a = \\vec g$ ne depend pas de la masse"
        correct: true
      - id: B
        text: "La bille la plus lourde retombe plus vite et va moins loin"
        correct: false
        feedback: >
          C'est l'intuition trompeuse. La 2e loi donne $m\vec a = m\vec g$,
          d'ou $\vec a = \vec g$ : la masse se simplifie. Meme acceleration,
          meme trajectoire.
      - id: C
        text: "La bille la plus legere va plus loin"
        correct: false
        feedback: >
          Sans frottements, la masse n'intervient pas : $\vec a = \vec g$ pour
          les deux. Les trajectoires se superposent exactement.
      - id: D
        text: "On ne peut pas savoir sans connaitre les masses"
        correct: false
        feedback: >
          On peut : justement parce que $\vec a = \vec g$ est independant de
          la masse, la valeur des masses n'a aucune importance ici.
    correct_feedback: >
      Exact. $m\vec a = m\vec g \Rightarrow \vec a = \vec g$ : la masse
      disparait. Memes conditions initiales et meme acceleration donnent la
      meme trajectoire.
    solution: |
      2e loi, le poids etant la seule force :
      $$m\vec a = m\vec g$$
      $$\vec a = \vec g$$
      L'acceleration ne depend pas de $m$. A conditions initiales egales, les
      deux billes suivent la meme trajectoire.

  - id: CMP-4
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Dans l'etude d'un tir, comment definit-on la PORTEE ?
    type: mcq
    choices:
      - id: A
        text: "La distance horizontale entre le point de lancement et le point de retour au sol"
        correct: true
      - id: B
        text: "La hauteur maximale atteinte par le projectile"
        correct: false
        feedback: >
          Ca, c'est la FLECHE (hauteur du sommet). La portee est une distance
          HORIZONTALE, mesuree au sol.
      - id: C
        text: "La longueur totale de la trajectoire parcourue"
        correct: false
        feedback: >
          La portee n'est pas la longueur de l'arc parabolique, mais la
          distance horizontale entre le depart et l'arrivee au sol.
      - id: D
        text: "La vitesse du projectile au moment de l'impact"
        correct: false
        feedback: >
          Une portee est une distance (en metres), pas une vitesse. Ne
          confonds pas la grandeur avec sa dimension.
    correct_feedback: >
      Oui : la portee est la distance horizontale sol-a-sol. A ne pas
      confondre avec la fleche, qui est la hauteur maximale (verticale).
    solution: |
      Deux grandeurs a distinguer :
      - la FLECHE : hauteur maximale (verticale) atteinte au sommet, ou
      $v_y = 0$ ;
      - la PORTEE : distance horizontale entre le lancement et le retour au
      sol ($y = 0$ de nouveau).

  - id: CMP-5
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Pour une vitesse initiale $v_0$ donnee (sol horizontal, frottements
      negliges), pour quel angle de lancement la portee est-elle maximale ?
    type: mcq
    choices:
      - id: A
        text: "$45^\\circ$"
        correct: true
      - id: B
        text: "$90^\\circ$"
        correct: false
        feedback: >
          A $90^\circ$ le tir est vertical : la portee est nulle (le projectile
          retombe au point de depart). C'est un maximum de FLECHE, pas de
          portee.
      - id: C
        text: "$30^\\circ$"
        correct: false
        feedback: >
          $30^\circ$ donne une portee, mais pas la plus grande : $\sin(2\alpha)
          = \sin 60^\circ < 1$. Le maximum de $\sin(2\alpha)$ est atteint pour
          $2\alpha = 90^\circ$.
      - id: D
        text: "$60^\\circ$"
        correct: false
        feedback: >
          $60^\circ$ donne la meme portee que $30^\circ$ (angles
          complementaires : $\sin 120^\circ = \sin 60^\circ$), mais pas le
          maximum, atteint a $45^\circ$.
    correct_feedback: >
      Exact : la portee vaut $D = \dfrac{v_0^2 \sin(2\alpha)}{g}$, maximale
      quand $\sin(2\alpha) = 1$, soit $2\alpha = 90^\circ$, donc
      $\alpha = 45^\circ$.
    solution: |
      La portee sur sol horizontal s'ecrit :
      $$D = \frac{v_0^2 \sin(2\alpha)}{g}$$
      Elle est maximale lorsque $\sin(2\alpha) = 1$ :
      $$2\alpha = 90^\circ \implies \alpha = 45^\circ$$

  - id: CMP-6
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Une particule chargee penetre avec une vitesse $\vec v_0$ dans un champ
      magnetique uniforme $\vec B$ perpendiculaire a $\vec v_0$ (poids neglige).
      Quelle est la nature de son mouvement dans le champ ?
    type: mcq
    choices:
      - id: A
        text: "Circulaire uniforme : la force de Lorentz, perpendiculaire a la vitesse, ne change pas la norme de la vitesse et courbe la trajectoire en cercle"
        correct: true
      - id: B
        text: "Parabolique, comme un projectile dans le champ de pesanteur"
        correct: false
        feedback: >
          C'est confondre la force de Lorentz avec une force constante comme le
          poids. La force $\vec F = q\vec v\wedge\vec B$ n'a pas une direction
          fixe : elle reste perpendiculaire a une vitesse qui tourne. Une force
          de norme constante toujours perpendiculaire a $\vec v$ donne un
          cercle, pas une parabole.
      - id: C
        text: "Rectiligne accelere : la force communique de la vitesse a la particule"
        correct: false
        feedback: >
          La force de Lorentz est perpendiculaire a $\vec v$ : elle ne travaille
          pas, donc la norme de la vitesse ne change pas ($dv/dt = 0$). Elle
          devie la particule sans l'accelerer ni la ralentir.
      - id: D
        text: "Rectiligne uniforme : aucune force ne devie la particule"
        correct: false
        feedback: >
          Comme $\vec B \perp \vec v_0$, la force $\vec F = q\vec v\wedge\vec B$
          n'est pas nulle (sa norme vaut $|q|\,v_0\,B$) : elle courbe bel et
          bien la trajectoire. Le mouvement n'est pas rectiligne.
    correct_feedback: >
      Oui : $\vec F = q\vec v\wedge\vec B$ est toujours perpendiculaire a
      $\vec v$. Sa composante tangentielle etant nulle, la norme $v = v_0$ reste
      constante ; sa composante normale courbe la trajectoire en un cercle de
      rayon $R = \dfrac{m\,v_0}{|q|\,B}$. C'est un mouvement circulaire uniforme.
    solution: |
      Bilan : seule la force de Lorentz $\vec F = q\vec v\wedge\vec B$ agit
      (poids neglige), toujours perpendiculaire a $\vec v$. On projette la 2e loi
      dans la base de Freinet.
      Sur la tangente (la force n'a pas de composante tangentielle) :
      $$m\frac{dv}{dt} = 0 \implies v = v_0 = \text{constante}$$
      Sur la normale, avec $F = |q|\,v_0\,B$ et $a_N = v_0^2 / R$ :
      $$m\frac{v_0^2}{R} = |q|\,v_0\,B \implies R = \frac{m\,v_0}{|q|\,B}$$
      Vitesse de norme constante et rayon constant : mouvement circulaire
      uniforme.

  - id: CMP-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un joueur de basket tire en cloche vers le panier : le ballon ralentit
      nettement en montant, puis redescend de plus en plus vite. Un eleve en
      conclut que ce ralentissement concerne tout le mouvement du ballon. Que
      peut-on dire, en realite, du deplacement horizontal (de gauche a
      droite) du ballon pendant ce meme vol ?
    type: mcq
    choices:
      - id: A
        text: "Il ralentit lui aussi en montant, avant de reprendre de la vitesse en redescendant, comme le mouvement vertical"
        correct: false
        feedback: >
          C'est confondre les deux axes. Le mouvement vertical ralentit puis
          repart, mais le mouvement horizontal n'a aucune raison d'en faire
          autant : les deux sont independants.
      - id: B
        text: "Il se poursuit a vitesse constante pendant tout le vol, sans jamais ralentir ni accelerer"
        correct: true
      - id: C
        text: "Il s'arrete completement au sommet de la trajectoire, en meme temps que le ballon cesse de monter"
        correct: false
        feedback: >
          C'est la vitesse VERTICALE qui s'annule au sommet, pas
          l'horizontale : au sommet, le ballon garde exactement sa vitesse
          horizontale de depart.
      - id: D
        text: "Il accelere progressivement du debut a la fin du vol, car le poids agit sur tout le mouvement"
        correct: false
        feedback: >
          Le poids est une force purement verticale : il n'a aucune
          composante horizontale, donc il ne peut ni accelerer ni ralentir le
          mouvement horizontal.
    correct_feedback: >
      Oui : aucune force horizontale n'agit (le poids est vertical), donc la
      vitesse horizontale ne change jamais pendant tout le vol.
    solution: |
      Seul le poids agit, et il est vertical : sa projection horizontale est
      nulle a tout instant, donc $a_x = 0$ et $v_x$ reste constante du debut
      a la fin du vol, independamment de ce que fait $v_y$.

  - id: CMP-8
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_chute_plans
    tags: []
    stem: >
      On lance, avec exactement la meme vitesse initiale (meme valeur, meme
      angle), une balle de tennis et une boule de petanque, frottements de
      l'air negliges. Laquelle va le plus loin ?
    type: mcq
    choices:
      - id: A
        text: "La boule de petanque, plus lourde, va plus loin car elle est moins freinee par sa propre inertie"
        correct: false
        feedback: >
          En chute libre, la masse disparait de la deuxieme loi
          ($\vec a = \vec g$) : une masse plus grande ne donne aucun
          avantage de portee.
      - id: B
        text: "Impossible a dire sans connaitre les masses exactes des deux objets"
        correct: false
        feedback: >
          On peut au contraire conclure sans les masses : c'est justement
          parce que $\vec a = \vec g$ ne depend pas de $m$ que leur valeur
          est inutile ici.
      - id: C
        text: "Aucune des deux : les deux suivent exactement la meme trajectoire, quelle que soit leur masse"
        correct: true
      - id: D
        text: "La balle de tennis, plus legere, va plus loin car elle est plus facile a propulser"
        correct: false
        feedback: >
          Sans frottements, la masse n'intervient nulle part dans le
          mouvement : etre plus legere ne donne aucun avantage de portee.
    correct_feedback: >
      Exact : $\vec a = \vec g$ ne depend pas de $m$. Memes conditions
      initiales, meme acceleration, donc meme trajectoire, quelle que soit la
      masse.
    solution: |
      $$m\vec a = m\vec g \implies \vec a = \vec g$$
      La masse se simplifie completement. A conditions initiales identiques,
      les deux objets suivent rigoureusement la meme trajectoire.

  - id: CMP-9
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Le poids d'un projectile est une force verticale, dirigee vers le bas.
      Cette force a-t-elle un effet sur le deplacement horizontal du
      projectile ?
    type: mcq
    choices:
      - id: A
        text: "Oui, un peu : meme verticale, une force finit toujours par influencer un peu tous les axes du mouvement"
        correct: false
        feedback: >
          Une force n'influence que les axes ou elle a une composante non
          nulle. Le poids etant purement vertical, sa composante horizontale
          est exactement nulle, pas seulement petite.
      - id: B
        text: "Oui, completement : c'est elle qui fait ralentir puis repartir le ballon horizontalement, comme elle le fait verticalement"
        correct: false
        feedback: >
          C'est confondre les deux axes. Le poids agit uniquement sur l'axe
          vertical ; l'axe horizontal n'est soumis a aucune force, donc a
          aucun ralentissement.
      - id: C
        text: "Cela depend de l'angle de lancement : plus l'angle est grand, plus le poids agit horizontalement"
        correct: false
        feedback: >
          L'angle de lancement change la direction de la vitesse initiale,
          pas la direction du poids : celui-ci reste vertical quel que soit
          l'angle choisi.
      - id: D
        text: "Non, aucun : une force purement verticale n'a pas de composante horizontale, donc elle ne peut pas modifier le mouvement horizontal"
        correct: true
    correct_feedback: >
      Exact : projete sur l'axe horizontal, le poids donne une composante
      nulle a chaque instant, donc $a_x = 0$ quel que soit l'angle de
      lancement.
    solution: |
      Le poids $\vec P = m\vec g$ est purement vertical. Sa projection sur
      un axe horizontal vaut $0$ a tout instant, donc $a_x = 0$ : aucune
      force horizontale n'agit, quel que soit l'angle de lancement.

  - id: CMP-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      On etudie une chute libre verticale avec un axe $Oy$ oriente vers le
      HAUT. Un eleve ecrit $a_y = +g$ au lieu de $a_y = -g$. D'ou vient cette
      erreur ?
    type: mcq
    choices:
      - id: A
        text: "Il a oublie que $\\vec g$ pointe vers le bas, donc dans le sens oppose a $Oy$ : sa composante sur cet axe est negative, $a_y = -g$"
        correct: true
      - id: B
        text: "Il n'y a pas d'erreur : $a_y = +g$ est toujours vrai, quel que soit le sens choisi pour l'axe"
        correct: false
        feedback: >
          Le signe de $a_y$ depend entierement du sens choisi pour $Oy$. Avec
          $Oy$ vers le haut, $\vec g$ (vers le bas) a une composante
          negative : $a_y = -g$, pas $+g$.
      - id: C
        text: "L'erreur vient d'avoir oublie la masse dans la deuxieme loi de Newton"
        correct: false
        feedback: >
          La masse n'est pas en cause ici : elle se simplifie des le depart
          ($\vec a = \vec g$). L'erreur porte uniquement sur le signe, lie a
          l'orientation de l'axe.
      - id: D
        text: "L'erreur vient d'avoir pris une vitesse initiale positive au lieu de negative"
        correct: false
        feedback: >
          Le signe de $v_{0y}$ est independant de celui de $a_y$ : c'est une
          erreur sur l'acceleration (projection de $\vec g$), pas sur la
          vitesse initiale.
    correct_feedback: >
      Avec $Oy$ vers le haut, $\vec g$ pointe dans le sens oppose a l'axe :
      $g_y = -g$, donc $a_y = -g$. Ce signe vient uniquement du choix
      d'orientation de l'axe, pas d'une regle universelle.
    solution: |
      $Oy$ vers le haut, $\vec g$ vers le bas : $\vec g$ est oppose au sens
      de l'axe, donc sa composante est negative.
      $$a_y = g_y = -g$$
      Avec $Oy$ vers le bas, on aurait trouve $a_y = +g$ : le signe suit le
      choix d'axe, il n'est pas fixe une fois pour toutes.

  - id: CMP-11
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Une balle est lancee verticalement vers le haut avec une vitesse
      initiale $v_{0y}=9{,}8\ \text{m/s}$, depuis le sol. Elle atteint son
      sommet a $t=1{,}0\ \text{s}$. Combien de temps met-elle, apres ce
      sommet, pour retomber au sol ?
    type: mcq
    choices:
      - id: A
        text: "Moins de 1,0 s, car en redescendant la balle est plus rapide donc elle met moins de temps"
        correct: false
        feedback: >
          Aller plus vite a l'arrivee ne veut pas dire mettre moins de temps :
          $y(t)$ est une parabole symetrique par rapport a son sommet, ce qui
          impose une duree de descente egale a celle de la montee.
      - id: B
        text: "Exactement 1,0 s : la montee et la descente prennent le meme temps, par symetrie de $y(t)$"
        correct: true
      - id: C
        text: "Plus de 1,0 s, car il faut d'abord que la vitesse s'annule avant de pouvoir redescendre"
        correct: false
        feedback: >
          La vitesse s'annule justement AU sommet, a $t=1{,}0\ \text{s}$ : ce
          n'est pas un delai supplementaire, c'est l'instant meme ou la
          montee se termine et la descente commence.
      - id: D
        text: "Impossible a savoir sans connaitre la hauteur exacte atteinte au sommet"
        correct: false
        feedback: >
          La symetrie de la parabole $y(t)$ donne directement
          $t_{sol} = 2\,t_{sommet}$, sans avoir besoin de calculer la hauteur
          du sommet.
    correct_feedback: >
      $t_{sol} = 2\,t_{sommet}$ : la parabole $y(t)$ est symetrique par
      rapport a son sommet, donc montee et descente prennent exactement le
      meme temps, ici $1{,}0\ \text{s}$ chacune.
    solution: |
      $y(t) = v_{0y}t - \frac{1}{2}gt^2$ est une parabole en $t$, symetrique
      par rapport a $t_{sommet}$. Donc $t_{sol} = 2\,t_{sommet} = 2{,}0\
      \text{s}$, soit $2{,}0 - 1{,}0 = 1{,}0\ \text{s}$ apres le sommet.

  - id: CMP-12
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un projectile est lance avec une vitesse initiale de norme $v_0$,
      faisant un angle $\alpha$ au-dessus de l'horizontale. Quelle est
      l'expression correcte de sa composante verticale initiale $v_{0y}$ ?
    type: mcq
    choices:
      - id: A
        text: "$v_{0y} = v_0 \\cos\\alpha$"
        correct: false
        feedback: >
          C'est l'expression de $v_{0x}$, pas de $v_{0y}$ : $\cos\alpha$
          projette sur l'axe horizontal, $\sin\alpha$ sur l'axe vertical.
      - id: B
        text: "$v_{0y} = v_0 \\tan\\alpha$"
        correct: false
        feedback: >
          $\tan\alpha$ est le rapport $v_{0y}/v_{0x}$, pas une composante de
          $v_0$ elle-meme : ce n'est pas la bonne fonction trigonometrique
          pour projeter directement $v_0$.
      - id: C
        text: "$v_{0y} = v_0 \\sin\\alpha$"
        correct: true
      - id: D
        text: "$v_{0y} = v_0$"
        correct: false
        feedback: >
          Cela reviendrait a ignorer l'angle $\alpha$, comme si tout $v_0$
          etait vertical : ce n'est vrai que dans le cas particulier
          $\alpha = 90^\circ$.
    correct_feedback: >
      Exact : $v_{0y} = v_0\sin\alpha$. Verification aux cas extremes :
      $\alpha=90^\circ$ donne $v_{0y}=v_0$ (lancer vertical), $\alpha=0^\circ$
      donne $v_{0y}=0$ (lancer horizontal).
    solution: |
      La projection de $\vec v_0$ sur l'axe vertical $Oy$ donne
      $v_{0y} = v_0\sin\alpha$, et sur l'axe horizontal $Ox$,
      $v_{0x} = v_0\cos\alpha$ — deux fonctions trigonometriques distinctes
      pour deux axes distincts.

  - id: CMP-13
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Pour un projectile soumis uniquement a son poids (frottements
      negliges), pourquoi peut-on affirmer que $a_x = 0$ a chaque instant du
      vol ?
    type: mcq
    choices:
      - id: A
        text: "Parce que la vitesse horizontale initiale $v_{0x}$ est toujours nulle"
        correct: false
        feedback: >
          $v_{0x}$ n'est nulle que dans le cas particulier d'un lancer
          vertical ($\alpha=90^\circ$). En general $v_{0x}=v_0\cos\alpha \neq
          0$, et pourtant $a_x=0$ quand meme.
      - id: B
        text: "Parce que la masse du projectile est trop faible pour que $g$ agisse horizontalement"
        correct: false
        feedback: >
          La masse n'a aucun role ici : $a_x=0$ vient uniquement de la
          direction du poids (verticale), pas de la valeur de la masse,
          petite ou grande.
      - id: C
        text: "Parce qu'au sommet de la trajectoire, la vitesse horizontale s'annule aussi, ce qui donne $a_x=0$"
        correct: false
        feedback: >
          C'est $v_y$ qui s'annule au sommet, pas $v_x$ : $v_x$ garde la
          valeur $v_{0x}$ a chaque instant, y compris au sommet.
      - id: D
        text: "Parce que le poids est une force purement verticale : sa projection sur l'axe horizontal est nulle a chaque instant"
        correct: true
    correct_feedback: >
      Oui : le poids est la seule force, et il est purement vertical, donc sa
      composante sur $Ox$ est nulle a tout instant, d'ou $a_x=0$ tout au long
      du vol.
    solution: |
      Bilan : seul $\vec P = m\vec g$ agit. Projection sur $Ox$ :
      $$m a_x = P_x = 0 \implies a_x = 0$$
      Ceci vient de la direction de $\vec P$ (verticale), et non de la masse
      ni des conditions initiales.

  - id: CMP-14
