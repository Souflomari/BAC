  - id: CMP-17
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un ballon est lance avec $v_0 = 18\ \text{m/s}$, $\sin\alpha = 0{,}50$
      (donc $v_{0y}=9{,}0\ \text{m/s}$), $g\approx 9{,}8\ \text{m/s}^2$.
      Quelle est la fleche du tir ?
    type: mcq
    choices:
      - id: A
        text: "$f \\approx 28{,}6\\ \\text{m}$"
        correct: false
        feedback: >
          C'est la formule de la PORTÉE ($v_0^2\sin(2\alpha)/g$) qui a été
          utilisée ici, pas celle de la fleche.
      - id: B
        text: "$f \\approx 8{,}3\\ \\text{m}$"
        correct: false
        feedback: >
          Ce calcul oublie le facteur $2$ au dénominateur :
          $f=v_{0y}^2/(2g)$, pas $v_{0y}^2/g$.
      - id: C
        text: "$f \\approx 16{,}5\\ \\text{m}$"
        correct: false
        feedback: >
          Ce calcul utilise $v_0^2$ au lieu de $v_{0y}^2$ : la fleche ne
          dépend que de la composante VERTICALE de la vitesse initiale.
      - id: D
        text: "$f \\approx 4{,}1\\ \\text{m}$"
        correct: true
    correct_feedback: >
      $f = v_{0y}^2/(2g) = 9{,}0^2/(2\times9{,}8) = 81/19{,}6 \approx
      4{,}1\ \text{m}$.
    solution: |
      $$f = \frac{v_{0y}^2}{2g} = \frac{9{,}0^2}{2\times 9{,}8} =
      \frac{81}{19{,}6} \approx 4{,}1\ \text{m}$$

  - id: CMP-18
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Pour un même angle de lancement $\alpha$, on double la vitesse initiale
      $v_0$ d'un tir. Que deviennent la fleche $f$ et la portée $D$ ?
    type: mcq
    choices:
      - id: A
        text: "Elles sont toutes les deux multipliees par 4, car $f$ et $D$ dependent de $v_0^2$"
        correct: true
      - id: B
        text: "Elles sont toutes les deux multipliees par 2, comme $v_0$"
        correct: false
        feedback: >
          $f$ et $D$ dependent de $v_0^2$, pas de $v_0$ : doubler $v_0$
          multiplie donc $v_0^2$ par $4$, pas par $2$.
      - id: C
        text: "Seule la portée double ; la fleche ne change pas, car elle ne dépend que de l'angle"
        correct: false
        feedback: >
          $f=v_0^2\sin^2\alpha/(2g)$ dépend elle aussi de $v_0^2$ : elle
          change avec $v_0$, exactement comme la portée.
      - id: D
        text: "Elles sont toutes les deux multipliees par 8"
        correct: false
        feedback: >
          $f$ et $D$ dependent de $v_0^2$ (une puissance 2), pas de $v_0^3$ :
          doubler $v_0$ multiplie donc par $2^2=4$, pas par $2^3=8$.
    correct_feedback: >
      $f$ et $D$ contiennent toutes deux $v_0^2$ et rien d'autre en $v_0$ :
      doubler $v_0$ multiplie donc les deux par $2^2=4$.
    solution: |
      $$f = \frac{v_0^2\sin^2\alpha}{2g} \qquad D =
      \frac{v_0^2\sin(2\alpha)}{g}$$
      Les deux formules ne contiennent $v_0$ qu'au carré : doubler $v_0$
      multiplie donc $f$ et $D$ par $2^2=4$, pas par $2$.

  - id: CMP-19
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Deux tirs, a la même vitesse $v_0$, sont effectues avec des angles
      complementaires $\alpha_1 = 20^\circ$ et $\alpha_2 = 70^\circ$. Que
      peut-on affirmer ?
    type: mcq
    choices:
      - id: A
        text: "Les deux tirs ont la même portée ET la même fleche, puisque les angles sont complementaires"
        correct: false
        feedback: >
          Seule la portée est égale pour des angles complementaires
          ($\sin(2\alpha)$ identique). La fleche dépend de $\sin^2\alpha$,
          qui diffère : le tir le plus incline monte plus haut.
      - id: B
        text: "Les deux tirs ont la même portée, mais le tir a $70^\\circ$ a la fleche la plus grande"
        correct: true
      - id: C
        text: "Le tir a $70^\\circ$ a la plus grande portée, car un angle plus grand rapproche le tir de la verticale, donc du maximum"
        correct: false
        feedback: >
          La portée dépend de $\sin(2\alpha)$, maximale a $45^\circ$ puis
          redescendante : $20^\circ$ et $70^\circ$ donnent en réalité la
          MÊME portée, ni l'un ni l'autre n'est supérieur.
      - id: D
        text: "Le tir a $20^\\circ$ a la plus grande fleche, car un angle plus petit donne un tir plus tendu et plus efficace"
        correct: false
        feedback: >
          C'est l'inverse : la fleche $f=v_0^2\sin^2\alpha/(2g)$ croit avec
          $\alpha$. Le tir le plus incline ($70^\circ$) monte plus haut, pas
          celui a $20^\circ$.
    correct_feedback: >
      $\sin(2\times20^\circ)=\sin(2\times70^\circ)$ : même portée. Mais
      $\sin^2(70^\circ) > \sin^2(20^\circ)$ : le tir le plus incline a la
      fleche la plus grande.
    solution: |
      Portée : $\sin(2\alpha_1)=\sin(40^\circ)=\sin(140^\circ)=\sin(2\alpha_2)$
      (angles complementaires), donc $D_1=D_2$.
      Fleche : $\sin^2(70^\circ) > \sin^2(20^\circ)$, donc $f_2 > f_1$.

  - id: CMP-20
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Deux particules, l'une de charge positive et l'autre de charge
