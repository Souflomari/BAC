    correct_feedback: >
      Exact : $v_\ell = mg/k$ croit avec $m$ (a $k$ égal), donc la bille la
      plus lourde ($m_2$) se stabilise a une vitesse limite plus grande que
      la bille $m_1$ — contraste direct avec la chute libre, ou la masse
