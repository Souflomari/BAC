    solution: |
      $v_\ell = mg/k$, a $k$ fixe (même forme). Une masse plus grande donne
      un $v_\ell$ plus grand : la courbe de $m_2$ monte vers une asymptote
      plus haute que celle de $m_1$. C'est « la masse qui revient » par
      rapport a la chute libre (chapitre 2 a 3), ou $v_\ell$ n'existait même
      pas ($a=g$ pour tous, quelle que soit la masse).

