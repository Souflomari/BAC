        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          $f$ et $D$ dependent de $v_0^2$, pas de $v_0$ : doubler $v_0$
          multiplie donc $v_0^2$ par $4$, pas par $2$.
      - id: C
        text: "Seule la portée double ; la fleche ne change pas, car elle ne dépend que de l'angle"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          $f=v_0^2\sin^2\alpha/(2g)$ dépend elle aussi de $v_0^2$ : elle
          change avec $v_0$, exactement comme la portée.
      - id: D
        text: "Elles sont toutes les deux multipliees par 8"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          $f$ et $D$ dependent de $v_0^2$ (une puissance 2), pas de $v_0^3$ :
          doubler $v_0$ multiplie donc par $2^2=4$, pas par $2^3=8$.
