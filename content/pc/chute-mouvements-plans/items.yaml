  - id: CMP-24
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Dans toute cette etude, on suppose les frottements de l'air
      negligeables. Dans un chapitre precedent, on a vu qu'un objet tombant
      avec frottements fluides finit par atteindre un regime permanent, a
      vitesse limite constante. Un eleve affirme : « Meme ici, si le vol dure
      assez longtemps, la vitesse horizontale $v_x$ finira par se stabiliser
      a une valeur limite, a cause de l'air. » Que penser de cette
      affirmation, dans le cadre du modele etudie ici (frottements
      negliges) ?
    type: mcq
    choices:
      - id: A
        text: "Elle est vraie : comme en chute avec frottements, $v_x$ finit toujours par se stabiliser, quel que soit le modele utilise"
        correct: false
        feedback: >
          Cela importe le resultat d'un AUTRE modele (avec frottements). Ici,
          les frottements sont explicitement negliges : rien ne peut faire
          varier $v_x$, ni la stabiliser a une limite.
      - id: B
        text: "Elle est vraie uniquement pour de tres longues portees, ou les frottements finissent par ne plus pouvoir etre negliges"
        correct: false
        feedback: >
          L'hypothese « frottements negliges » est posee pour tout le
          probleme, pas seulement pour les courtes distances : elle ne
          s'efface pas d'elle-meme au-dela d'une certaine portee.
      - id: C
        text: "Elle est hors-sujet ici : le modele etudie neglige explicitement les frottements, donc $v_x = v_{0x}$ reste rigoureusement constante, sans jamais tendre vers une valeur limite"
        correct: true
      - id: D
        text: "Elle est fausse, mais c'est la vitesse VERTICALE $v_y$, et non $v_x$, qui se stabiliserait a une vitesse limite dans ce modele"
        correct: false
        feedback: >
          Dans CE modele (frottements negliges), aucune des deux composantes
          ne se stabilise a une limite : $v_y$ croit indefiniment en valeur
          absolue, elle ne plafonne pas non plus.
    correct_feedback: >
      Le regime permanent avec vitesse limite est un resultat du modele AVEC
      frottements fluides, etudie ailleurs. Ici, les frottements sont
      negliges par hypothese : $v_x=v_{0x}$ reste rigoureusement constante,
      sans jamais tendre vers une limite.
    solution: |
      Aucune force horizontale n'agit ($a_x=0$) tant que les frottements sont
      negliges : $v_x=v_{0x}$ constante. Le regime permanent / vitesse
      limite appartient a un modele different (chute avec frottements), non
      applicable ici par hypothese.
