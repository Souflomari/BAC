          La force gravitationnelle est centripete, donc perpendiculaire a
          la vitesse : elle ne pousse jamais vers l'avant. Aucune force
          tangentielle n'est nécessaire pour maintenir le mouvement.
      - id: D
        text: "La force gravitationnelle, centripete ; mais un satellite plus lourd doit orbiter plus vite qu'un satellite léger, sur la même orbite, pour ne pas retomber"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-orbitale-depend-masse-satellite
        also_reveals: []
        feedback: >
          La vitesse orbitale $v=\sqrt{GM_T/r}$ ne contient pas la masse du
          satellite : elle se simplifie dans la 2e loi. Un satellite plus
          lourd suit la même orbite a la même vitesse qu'un satellite
          léger.
    correct_feedback: >
      Exact : la seule force est la force gravitationnelle, dirigée en
      permanence vers le centre de la Terre, donc perpendiculaire a la
      vitesse — une force centripete.
    solution: |
      La force gravitationnelle $\vec F = G\frac{M_T m}{r^2}\vec u$ pointe
      toujours vers le centre de la Terre, donc perpendiculairement a la
      vitesse (tangente au cercle). Elle est donc centripete : c'est elle
      qui courbe la trajectoire en cercle, sans jamais accélérer ni
      ralentir le satellite (elle ne travaille pas).

  - id: CMP-32
    rung: "R9"
    difficulty_level: 4
    skill_code: pc_chute_plans
    tags: [misconception_driven, gravitation_satellite, resolution]
    stem: >
      La 2e loi projetée sur la normale donne la vitesse orbitale d'un
      satellite en orbite circulaire de rayon $r$ autour de la Terre
      (masse $M_T$). Quelle est cette vitesse, et de quoi depend-elle ?
    type: mcq
    choices:
      - id: A
        text: "$v=\\sqrt{GM_T/r}$, mais un satellite deux fois plus lourd irait deux fois plus vite sur la même orbite"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-orbitale-depend-masse-satellite
        also_reveals: []
        feedback: >
          La masse du satellite apparaît des deux cotes de la 2e loi
          projetée ($mv^2/r = GM_Tm/r^2$) et se simplifie completement : la
          formule finale $v=\sqrt{GM_T/r}$ ne la contient plus.
      - id: B
        text: "La question n'a pas de sens : en orbite, aucune force n'agit, donc rien n'impose de vitesse particulière"
        correct: false
        misconception: mc.physics.pc_chute_plans.orbite-sans-gravite
        also_reveals: []
        feedback: >
          Une force agit bien : la gravite, centripete. C'est justement
          elle qui, via la 2e loi, impose la vitesse orbitale à chaque
          rayon $r$.
      - id: C
        text: "$v$ dépend de la poussée d'un moteur qui maintient le satellite sur son orbite, pas seulement de $G$, $M_T$ et $r$"
        correct: false
        misconception: mc.physics.pc_chute_plans.orbite-necessite-force-tangentielle
        also_reveals: []
        feedback: >
          Aucun moteur n'intervient : la seule force est la gravite, déjà
          centripete. La 2e loi seule, sans propulsion, donne
          $v=\sqrt{GM_T/r}$.
      - id: D
        text: "$v=\\sqrt{GM_T/r}$, indépendante de la masse du satellite (elle se simplifie dans la 2e loi)"
        correct: true
    correct_feedback: >
      Exact : en projetant la 2e loi sur la normale,
      $mv^2/r = GM_Tm/r^2$, la masse $m$ du satellite se simplifie ;
      $v=\sqrt{GM_T/r}$ ne dépend que de l'astre central et du rayon de
      l'orbite.
    solution: |
      $$
      m\frac{v^2}{r} = G\frac{M_T m}{r^2} \implies v^2 = \frac{GM_T}{r}
      \implies v = \sqrt{\frac{GM_T}{r}}
      $$
      La masse $m$ du satellite disparaît : deux satellites de masses
      différentes, sur la même orbite, ont exactement la même vitesse.

  - id: CMP-33
    rung: "R9"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, gravitation_satellite, utilisation]
    stem: >
      Pourquoi un astronaute « flotte-t-il » a l'intérieur d'une station
      spatiale en orbite ?
    type: mcq
    choices:
      - id: A
        text: "Il est en chute libre permanente : la gravite continue d'agir sur lui et sur la station, a la même accélération, et courbe leur trajectoire commune en une orbite fermée"
        correct: true
      - id: B
        text: "Il n'y a plus de gravite a cette altitude, donc plus rien ne le retient"
        correct: false
        misconception: mc.physics.pc_chute_plans.orbite-sans-gravite
        also_reveals: []
        feedback: >
          Si la gravite disparaissait, la station partirait en ligne droite
          (inertie) au lieu de suivre une orbite fermée. La gravite agit
          toujours, a peine plus faible qu'au sol.
      - id: C
        text: "La station est munie d'un système de propulsion qui compense en permanence la gravite, ce qui annule son poids"
        correct: false
        misconception: mc.physics.pc_chute_plans.orbite-necessite-force-tangentielle
        also_reveals: []
        feedback: >
          Aucune propulsion n'est nécessaire pour l'apesanteur ressentie :
          c'est la chute libre commune de l'astronaute et de la station,
          tous deux soumis a la même accélération gravitationnelle, qui
          supprime le contact différentiel.
      - id: D
        text: "Il flotte parce que sa propre masse est trop faible pour que la gravite terrestre agisse efficacement sur lui, contrairement a la station elle-même"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-orbitale-depend-masse-satellite
        also_reveals: []
        feedback: >
          La gravite agit sur toute masse, petite ou grande :
          $F=GM_Tm/r^2$ n'est jamais nulle pour $m\neq0$. Ce n'est pas une
          question de masse insuffisante.
    correct_feedback: >
      Exact : l'astronaute et la station tombent ensemble, a la même
      accélération gravitationnelle, sans jamais atteindre le sol grâce a
      leur vitesse orbitale — c'est l'apesanteur, pas une absence de
      gravite.
    solution: |
      La gravite agit sur l'astronaute exactement comme sur la station
      (même accélération, indépendante de la masse). Les deux étant en
      chute libre permanente l'un par rapport a l'autre, il n'y a pas de
      contact différentiel entre l'astronaute et les parois : c'est ce qui
      donne la sensation de flotter, sans que la gravite ait disparu.

  # ══════════════════════════════════════════════════════════════
  # R10 — 3e loi de Kepler (circulaire) et satellite geostationnaire (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: CMP-34
    rung: "R10"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, kepler_geostationnaire, resolution]
    stem: >
      Pour les satellites d'un même astre en orbite circulaire, la 3e loi
      de Kepler relie la période $T$ et le rayon $r$ de l'orbite. Laquelle
      de ces affirmations est exacte ?
    type: mcq
    choices:
      - id: A
        text: "$T^3/r^2 = 4\\pi^2/GM$ = constante"
        correct: false
        misconception: mc.physics.pc_chute_plans.kepler3-exposants-inverses
        also_reveals: []
        feedback: >
          C'est l'inverse : l'établissement (egaler $v=\sqrt{GM/r}$ et
          $v=2\pi r/T$) donne le carré sur la période et le cube sur le
          rayon, pas l'inverse.
      - id: B
        text: "Chaque rayon d'orbite possible a sa propre constante $T^2/r^3$ : rien n'empeche de choisir une orbite de n'importe quel rayon pour une période donnée"
        correct: false
        misconception: mc.physics.pc_chute_plans.geostationnaire-toute-altitude
        also_reveals: []
        feedback: >
          Au contraire, $T^2/r^3$ est LA MÊME constante pour tous les
          satellites d'un même astre (elle ne dépend que de $M$). Fixer
          $T$ determine donc un $r$ unique, pas une famille de rayons
          possibles.
      - id: C
        text: "$T^2/r^3 = 4\\pi^2/GM$ = constante, pour tous les satellites d'un même astre central — y compris un satellite géostationnaire, qui n'echappe a aucune loi physique en paraissant immobile depuis le sol"
        correct: true
      - id: D
        text: "Cette relation ne concerne que les satellites en mouvement ; un satellite géostationnaire, étant immobile, n'a pas de $T$ a proprement parler et echappe a la 3e loi"
        correct: false
        misconception: mc.physics.pc_chute_plans.geostationnaire-immobile-absolu
        also_reveals: []
        feedback: >
          Un satellite géostationnaire a bien une période
          $T\approx24\ \text{h}$ (dans le référentiel géocentrique, il
          parcourt un cercle) : la 3e loi s'applique a lui exactement comme
          aux autres satellites.
    correct_feedback: >
      Exact : en egalant $v=\sqrt{GM/r}$ (2e loi) et $v=2\pi r/T$
      (géométrie du cercle), on obtient $T^2/r^3=4\pi^2/GM$, une constante
      propre a l'astre central, valable pour tout satellite, géostationnaire
      compris.
    solution: |
      $$
      \frac{2\pi r}{T} = \sqrt{\frac{GM}{r}} \implies \frac{4\pi^2
      r^2}{T^2} = \frac{GM}{r} \implies \frac{T^2}{r^3} =
      \frac{4\pi^2}{GM}
      $$
      Le membre de droite ne dépend que de $M$ (l'astre central) :
      $T^2/r^3$ est donc la même constante pour tous ses satellites, y
      compris un satellite géostationnaire.

  - id: CMP-35
    rung: "R10"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, kepler_geostationnaire, utilisation]
    stem: >
      Un satellite géostationnaire est décrit comme « fixe au-dessus d'un
      point de l'equateur ». Est-il réellement immobile ?
    type: mcq
    choices:
      - id: A
        text: "Sa période $T$ et son rayon $r$ vérifient $T^3/r^2=4\\pi^2/GM_T$, ce qui explique à soi seul son immobilité apparente au-dessus du sol"
        correct: false
        misconception: mc.physics.pc_chute_plans.kepler3-exposants-inverses
        also_reveals: []
        feedback: >
          La formule elle-même est fausse (exposants inverses : c'est
          $T^2/r^3$, pas $T^3/r^2$), et surtout ce n'est pas une formule
          qui « explique une immobilité » — c'est une relation entre $T$ et
          $r$, qui vaut pour tout satellite, immobile ou non par rapport au
          sol.
      - id: B
        text: "Il est immobile seulement pour un observateur au sol ; dans le référentiel géocentrique, il parcourt un cercle à la vitesse $v=\\sqrt{GM_T/r}$"
        correct: true
      - id: C
        text: "Il est totalement immobile dans l'espace, sans aucune vitesse, et cela dans n'importe quel référentiel que l'on choisisse"
        correct: false
        misconception: mc.physics.pc_chute_plans.geostationnaire-immobile-absolu
        also_reveals: []
        feedback: >
          « Immobile » n'a de sens que par rapport a un référentiel. Dans
          le référentiel géocentrique, ce satellite se deplace bel et
          bien, a sa vitesse orbitale ; ce n'est que par rapport au sol
          qu'il parait fixe.
      - id: D
        text: "N'importe quel satellite, à n'importe quelle altitude, peut être rendu géostationnaire simplement en ajustant convenablement sa vitesse"
        correct: false
        misconception: mc.physics.pc_chute_plans.geostationnaire-toute-altitude
        also_reveals: []
        feedback: >
          La 3e loi impose une relation biunivoque entre $T$ et $r$ pour un
          astre donne : seul un rayon précis donne $T=T_{Terre}$. Changer
          la vitesse a un autre rayon ne redonnerait pas la bonne période.
    correct_feedback: >
      Exact : « géostationnaire » décrit une immobilité relative au sol,
      due a une vitesse angulaire égale a celle de la Terre. Dans le
      référentiel géocentrique, le satellite parcourt réellement un
      cercle, a une vitesse de l'ordre de 3 km/s.
    solution: |
      Dans le référentiel géocentrique, le satellite géostationnaire suit
      un mouvement circulaire uniforme a la vitesse $v=\sqrt{GM_T/r}$
      (chapitre 10), non nulle. Il n'est « immobile » que par rapport a un
      point du sol, parce que sa vitesse angulaire est exactement égale a
      celle de la rotation terrestre : le sol et le satellite tournent
      ensemble, d'ou l'impression de fixite relative.

  - id: CMP-36
    rung: "R10"
    difficulty_level: 4
    skill_code: pc_chute_plans
    tags: [misconception_driven, kepler_geostationnaire, resolution]
    stem: >
      Quelles conditions un satellite doit-il remplir pour être
      géostationnaire, et combien d'altitudes différentes satisfont ces
      conditions autour de la Terre ?
    type: mcq
    choices:
      - id: A
        text: "Il suffit que le satellite ait une vitesse nulle par rapport au sol dès son lancement ; aucune condition sur la période n'est alors nécessaire"
        correct: false
        misconception: mc.physics.pc_chute_plans.geostationnaire-immobile-absolu
        also_reveals: []
        feedback: >
          Une vitesse nulle par rapport au sol au lancement ne garantit
          rien pour la suite : c'est la condition sur la PÉRIODE
          ($T=T_{Terre}$), combinée au plan équatorial et au sens de
          rotation, qui maintient le satellite au-dessus du même point.
      - id: B
        text: "N'importe quelle altitude convient, du moment que le satellite décrit une orbite circulaire autour de la Terre et dans le bon sens"
        correct: false
        misconception: mc.physics.pc_chute_plans.geostationnaire-toute-altitude
        also_reveals: []
        feedback: >
          Une orbite circulaire quelconque a une période donnée par la 3e
          loi, différente de 24 h sauf a un rayon précis : un satellite
          « quelconque » derive par rapport au sol, il n'est pas
          géostationnaire.
      - id: C
        text: "Il suffit que la relation $T^3=r^2\\times(4\\pi^2/GM_T)$ soit vérifiée, ce qui laisse plusieurs rayons possibles pour une même période"
        correct: false
        misconception: mc.physics.pc_chute_plans.kepler3-exposants-inverses
        also_reveals: []
        feedback: >
          Cette formule inverse les exposants de la 3e loi (qui est
          $T^2/r^3=4\pi^2/GM_T$, pas $T^3/r^2=\ldots$) ; et même corrigée,
          elle donnerait un seul $r$ pour un $T$ donne, pas plusieurs.
      - id: D
        text: "$T=T_{\\text{Terre}}\\approx24\\ \\text{h}$, orbite dans le plan équatorial, même sens que la rotation terrestre ; la 3e loi fixe alors un rayon unique"
        correct: true
    correct_feedback: >
      Exact : les trois conditions (période terrestre, plan équatorial,
      même sens de rotation) sont simultanément nécessaires ; combinees a
      la 3e loi, elles fixent une unique valeur de $r$ (environ
      $4{,}2\times10^7\ \text{m}$ pour la Terre), donc une seule altitude
      géostationnaire possible.
    solution: |
      Trois conditions simultanees : $T=T_{Terre}\approx24\ \text{h}$ (ou
      $86\,164\ \text{s}$), orbite équatoriale, même sens que la rotation
      terrestre. La 3e loi, appliquee avec $T=T_{Terre}$, donne :
      $$
      r = \left(\frac{GM_T\,T^2}{4\pi^2}\right)^{1/3} \approx
      4{,}2\times10^7\ \text{m}
      $$
      une valeur unique : il n'existe qu'une seule altitude géostationnaire
      autour d'un astre donne.

  # ── Deux items ajoutés le 2026-09-05 pour amener
  #    `descente-plus-courte-que-montee` au plancher de 3 items du banc.
  #    Elle y siégeait à UN seul item (CMP-11) alors que le résumé de
  #    couverture ci-dessous annonçait `floor_met: true` : le résumé avait été
  #    écrit quand l'inventaire ne comptait que les 12 misconceptions R7-R10,
  #    et n'a pas été retourné quand la passe du 2026-09-05 a tagué les items
  #    hérités R0-R6/R11 et déclaré leurs neuf familles. C'est exactement le
  #    défaut que web/scripts/resume-couverture.mjs garde désormais.
  #    Les deux items visent la MÊME erreur par deux gestes distincts — lire
  #    une vitesse de retour (CMP-37), critiquer un raisonnement écrit
  #    (CMP-38) — pour ne pas être trois clones de CMP-11.
  - id: CMP-37
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: [misconception_driven, chute_libre_verticale, utilisation]
    stem: >
      Une balle est lancée verticalement vers le haut depuis le sol, avec une
      vitesse initiale $v_0 = 15\ \text{m/s}$. Les frottements sont négligés.
      Avec quelle vitesse repasse-t-elle par son point de départ ?
    type: mcq
    choices:
      - id: A
        text: "$15\\ \\text{m/s}$, dirigée vers le bas : $v_y(t)$ est une droite qui vaut $+v_0$ au départ et $-v_0$ au retour"
        correct: true
      - id: B
        text: "Plus de $15\\ \\text{m/s}$ : la balle redescend plus vite qu'elle n'est montée, donc elle repasse plus vite qu'au départ"
        correct: false
        misconception: mc.physics.pc_chute_plans.descente-plus-courte-que-montee
        also_reveals: []
        feedback: >
          C'est la même intuition que « la descente dure moins longtemps » : on
          prête au retour un avantage que la symétrie interdit. $v_y(t) = v_0 -
          gt$ est une droite ; elle vaut $+v_0$ au départ, s'annule au sommet,
          et vaut $-v_0$ quand la balle repasse à la même altitude — jamais
          davantage.
      - id: C
        text: "$15\\ \\text{m/s}$, dirigée vers le haut : sur un axe orienté vers le haut l'accélération vaut $+g$, la vitesse garde son sens"
        correct: false
        misconception: mc.physics.pc_chute_plans.signe-et-projection-mal-poses
        also_reveals: []
        feedback: >
          La valeur est juste, le sens ne l'est pas. Sur un axe $Oy$ orienté
          vers le HAUT, $\vec g$ pointe dans le sens opposé à l'axe, donc
          $a_y = -g$ : la vitesse décroît, s'annule, puis devient négative. La
          balle repasse par son point de départ en descendant.
      - id: D
        text: "Cela dépend de sa masse : une balle plus lourde repasse au point de départ plus vite qu'une balle plus légère"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-influe-en-chute-libre
        also_reveals: []
        feedback: >
          La deuxième loi donne $m\vec a = m\vec g$, donc $\vec a = \vec g$ :
          la masse se simplifie et n'apparaît nulle part dans
          $v_y(t) = v_0 - gt$. Deux balles lancées à la même vitesse repassent
          à la même vitesse, lourde ou légère.
    correct_feedback: >
      La balle repasse à $15\ \text{m/s}$, vers le bas. $v_y(t) = v_0 - gt$
      étant une droite, la vitesse perdue à la montée est exactement regagnée
      à la descente : même altitude, même valeur de vitesse, sens opposé.
    solution: |
      Axe $Oy$ vertical vers le haut, origine au sol, frottements négligés :
      $$a_y = -g \quad\Longrightarrow\quad v_y(t) = v_0 - gt$$
      Le retour au point de départ a lieu à l'instant $t_r$ tel que
      $y(t_r) = 0$, avec $y(t) = v_0 t - \tfrac{1}{2}gt^2$ :
      $$t_r = \frac{2v_0}{g}$$
      D'où
      $$v_y(t_r) = v_0 - g\cdot\frac{2v_0}{g} = -v_0 = -15\ \text{m/s}$$
      soit $15\ \text{m/s}$ dirigée vers le bas.

  - id: CMP-38
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, chute_libre_verticale, resolution]
    stem: >
      Un élève écrit, à propos d'une balle lancée verticalement vers le haut
      qui retombe à son point de départ : « La montée a duré
      $0{,}80\ \text{s}$. Comme la balle redescend de plus en plus vite, la
      descente a duré moins de $0{,}80\ \text{s}$. » Que penser de ce
      raisonnement ?
    type: mcq
    choices:
      - id: A
        text: "Sa conclusion est fausse : la descente repasse par les mêmes vitesses que la montée, dans l'ordre inverse — elle dure donc $0{,}80\\ \\text{s}$ elle aussi"
        correct: true
      - id: B
        text: "Sa conclusion est juste : la balle arrive plus vite qu'elle n'est partie, et une phase parcourue à plus grande vitesse prend donc moins de temps"
        correct: false
        misconception: mc.physics.pc_chute_plans.descente-plus-courte-que-montee
        also_reveals: []
        feedback: >
          Le raisonnement confond la vitesse FINALE et la vitesse MOYENNE. La
          descente finit plus vite que la montée n'a commencé, mais elle
          commence à zéro : les deux phases parcourent la même hauteur avec
          exactement le même profil de vitesse, l'un renversé dans le temps.
          $y(t)$ est une parabole symétrique par rapport à son sommet.
      - id: C
        text: "Sa conclusion est fausse, mais pour une autre raison : il oublie que la vitesse horizontale de la balle diminue à la montée puis repart à la descente"
        correct: false
        misconception: mc.physics.pc_chute_plans.vx-varie-pendant-le-vol
        also_reveals: []
        feedback: >
          Doublement faux : cette balle est lancée VERTICALEMENT, elle n'a
          aucune vitesse horizontale. Et même pour un lancer oblique, $v_x$ ne
          varierait pas : le poids étant vertical, $a_x = 0$ et
          $v_x(t) = v_{0x}$ du lancer à l'impact.
      - id: D
        text: "Sa conclusion dépend de la masse : pour une balle lourde la descente est plus courte, pour une balle légère les deux durées s'égalisent"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-influe-en-chute-libre
        also_reveals: []
        feedback: >
          En chute libre, $\vec a = \vec g$ : la masse s'est simplifiée et
          n'intervient dans aucune durée. Une balle de plomb et une balle de
          liège lancées à la même vitesse ont la même montée et la même
          descente — c'est le frottement, pas la masse, qui les séparerait.
    correct_feedback: >
      Le raisonnement est faux. Arriver vite ne veut pas dire mettre peu de
      temps : la descente commence à vitesse nulle et repasse exactement par
      les vitesses de la montée, dans l'ordre inverse. Les deux phases durent
      $0{,}80\ \text{s}$ chacune, et le vol entier $1{,}6\ \text{s}$.
    solution: |
      Avec $Oy$ vers le haut et l'origine au point de lancement :
      $$y(t) = v_0 t - \tfrac{1}{2}gt^2 = t\left(v_0 - \tfrac{1}{2}gt\right)$$
      C'est une parabole de sommet $t_s = v_0/g$, qui s'annule en $t = 0$ et
      en $t = 2v_0/g = 2t_s$. La courbe est symétrique par rapport à la
      verticale $t = t_s$ : la durée de montée $t_s$ et la durée de descente
      $2t_s - t_s = t_s$ sont égales.
      Ici $t_s = 0{,}80\ \text{s}$, donc la descente dure elle aussi
      $0{,}80\ \text{s}$ et le vol entier $1{,}6\ \text{s}$.

