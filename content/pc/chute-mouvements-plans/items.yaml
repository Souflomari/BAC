      - id: B
        text: "Elle est vraie uniquement pour de tres longues portees, ou les frottements finissent par ne plus pouvoir etre negliges"
        correct: false
        feedback: >
          L'hypothese « frottements negliges » est posee pour tout le
          probleme, pas seulement pour les courtes distances : elle ne
          s'efface pas d'elle-meme au-dela d'une certaine portee.
      - id: C
        text: "Elle est hors-sujet ici : le modele etudie neglige explicitement les frottements, donc $v_x = v_{0x}$ reste rigoureusement constante, sans jamais tendre vers une valeur limite"
        correct: true
      - id: D
        text: "Elle est fausse, mais c'est la vitesse VERTICALE $v_y$, et non $v_x$, qui se stabiliserait a une vitesse limite dans ce modele"
        correct: false
