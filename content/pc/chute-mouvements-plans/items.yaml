notion: chute-mouvements-plans
skill_code: pc_chute_plans
misconceptions:
  # ── la famille PROJECTILE (indépendance des axes, symétrie de la parabole).
  #    Déclarée le 2026-09-05 : les checkpoints cp-r0-predict et cp-symetrie
  #    visaient ces cinq erreurs depuis leur écriture, mais aucune n'était
  #    déclarée ici — un diagnostic sans libellé, que rien ne pouvait afficher.
  # Quatre familles ajoutées le 2026-09-05 en taguant les 24 items du banc,
  # jusque-là muets : elles couvrent la grandeur mesurée (portée, flèche,
  # angle), la mise en équation, l'orientation des axes, et la force de Lorentz.
  - id: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
    label: "« Portée, flèche et longueur de trajectoire sont interchangeables — et l'angle optimal est le plus grand »"
    description: >
      L'élève confond la PORTÉE (distance horizontale) avec la hauteur
      maximale, la longueur réelle du trajet ou la vitesse d'impact ; il place
      la portée maximale à $90^\circ$ ; il fait varier flèche et portée comme
      $v_0$ plutôt que comme $v_0^2$ ; ou il croit deux angles complémentaires
      identiques en tout.
    contradicts_principle: >
      La PORTÉE est la distance horizontale entre le lancement et le retour au
      sol ; la FLÈCHE est la hauteur maximale. La portée est maximale à
      $45^\circ$ — tirer à la verticale la réduit à zéro. Les deux varient en
      $v_0^2$ : doubler $v_0$ les quadruple. Et deux angles complémentaires
      donnent la MÊME portée, jamais la même flèche.

  - id: mc.physics.pc_chute_plans.equation-de-trajectoire-mal-etablie
    label: "« Le coefficient, le signe ou le facteur ½ de l'équation de trajectoire est faux »"
    description: >
      Dans $y(x) = \tan\alpha\\,x - \dfrac{g}{2v_0^2\cos^2\alpha}x^2$, l'élève
      oublie le facteur $2$ du dénominateur, se trompe de signe sur le terme en
      $x^2$, oublie le $\cos^2\alpha$, ou applique la formule de la flèche à la
      portée (et réciproquement).
    contradicts_principle: >
      Le terme en $x^2$ est TOUJOURS négatif — la trajectoire est une parabole
      tournée vers le bas — et son coefficient porte $2v_0^2\cos^2\alpha$ au
      dénominateur. Flèche $f = \dfrac{v_{0y}^2}{2g}$ et portée
      $D = \dfrac{v_0^2\sin 2\alpha}{g}$ sont deux formules distinctes.

  - id: mc.physics.pc_chute_plans.signe-et-projection-mal-poses
    label: "« Le signe de $a_y$ ou la projection de $v_0$ ne dépend pas de l'axe choisi »"
    description: >
      L'élève écrit $a_y = +g$ sur un axe orienté vers le haut, échange sinus et
      cosinus dans la projection de la vitesse initiale, ou justifie $a_x = 0$
      par une propriété de la vitesse plutôt que par celle de la force.
    contradicts_principle: >
      $\vec g$ pointe vers le bas : sur un axe $Oy$ orienté vers le HAUT,
      $a_y = -g$. La composante VERTICALE de $\vec v_0$ est
      $v_{0y} = v_0\sin\alpha$, l'horizontale $v_0\cos\alpha$. Et $a_x = 0$
      parce que le POIDS n'a pas de composante horizontale — pas parce que
      $v_{0x}$ serait nulle.

  - id: mc.physics.pc_chute_plans.force-de-lorentz-mal-comprise
    label: "« La force de Lorentz accélère la particule, ou ignore le signe de la charge »"
    description: >
      L'élève lui prête une trajectoire parabolique comme un projectile, une
      accélération dans le sens du mouvement, aucun effet sur une charge
      positive, ou un rayon qui augmenterait avec $B$ ou avec $|q|$.
    contradicts_principle: >
      La force de Lorentz est PERPENDICULAIRE à la vitesse : elle en change la
      direction, jamais la norme — d'où un mouvement circulaire UNIFORME. Le
      rayon vaut $R = \dfrac{m v_0}{|q|B}$ : il croît avec $v_0$ et $m$,
      décroît avec $B$ et $|q|$. Deux charges opposées tournent dans des sens
      contraires, sur des cercles de même rayon.

  - id: mc.physics.pc_chute_plans.vx-varie-pendant-le-vol
    label: "« La vitesse horizontale varie comme la verticale : elle ralentit à la montée, repart à la descente »"
    description: "L'élève lie les deux axes : il applique à $v_x$ le profil de $v_y$, comme si le mouvement était d'un seul bloc."
    contradicts_principle: "Le poids est purement vertical, donc $a_x = 0$ à chaque instant et $v_x(t) = v_{0x}$ reste constante du lancer à l'impact. Les deux axes sont indépendants : seul $v_y$ ralentit, s'annule au sommet, puis repart."

  - id: mc.physics.pc_chute_plans.vitesse-nulle-au-sommet
    label: "« Au sommet de la trajectoire, la vitesse du projectile est nulle »"
    description: "L'élève transpose à la vitesse entière ce qui ne vaut que pour sa composante verticale : il conclut que le projectile s'arrête un instant au sommet."
    contradicts_principle: "Au sommet, c'est $v_y$ qui s'annule, jamais $v_x$ : la vitesse y vaut exactement $v_{0x}$ et elle est horizontale. Un projectile ne s'arrête pas en l'air."

  - id: mc.physics.pc_chute_plans.poids-agit-sur-lhorizontale
    label: "« Le poids accélère aussi le mouvement horizontal »"
    description: "L'élève fait agir le poids sur les deux axes à la fois : la chute, en accélérant, entraînerait selon lui l'ensemble du mouvement, horizontale comprise."
    contradicts_principle: "La projection horizontale du poids est nulle. Aucune force n'agit selon $x$ (frottements négligés), donc $a_x = 0$ : le poids ne peut ni accélérer ni ralentir le mouvement horizontal."

  - id: mc.physics.pc_chute_plans.masse-influe-en-chute-libre
    label: "« En chute libre, la masse change la trajectoire (le plus lourd tombe plus vite, le plus léger va plus loin) »"
    description: "L'élève garde l'intuition d'Aristote : un corps plus lourd serait davantage entraîné vers le sol, un corps plus léger plus facile à propulser."
    contradicts_principle: "La deuxième loi donne $m\\vec{a} = m\\vec{g}$, d'où $\\vec{a} = \\vec{g}$ : la masse se simplifie et n'intervient nulle part. Mêmes conditions initiales, même accélération, donc trajectoires superposées — tant qu'il n'y a pas de frottement."

  - id: mc.physics.pc_chute_plans.descente-plus-courte-que-montee
    label: "« La descente d'un projectile est plus rapide, donc plus courte en durée, que sa montée »"
    description: "L'élève brise la symétrie de la parabole : parce que le projectile arrive vite au sol, il en déduit que la descente a duré moins longtemps que la montée."
    contradicts_principle: "$y(t)$ est une parabole symétrique par rapport à son sommet : la descente dure exactement autant que la montée. Aller plus vite à l'arrivée ne signifie pas mettre moins de temps."

  - id: mc.physics.pc_chute_plans.frottement-disparait-a-vlim
    label: "« A la vitesse limite, il n'y a plus de force / la force de frottement a disparu »"
    description: "L'élève confond « somme des forces nulle » (a=0 a v_lim) et « aucune force ne s'exerce » ; il croit que le frottement s'annule au moment ou la vitesse se stabilise."
    contradicts_principle: "A $v_\\ell$, l'accélération est nulle parce que le frottement et le poids se compensent exactement ($k\\,v_\\ell = mg$) : le frottement y est au contraire maximal, pas absent."

  - id: mc.physics.pc_chute_plans.acceleration-indefinie-avec-frottement
    label: "« Avec frottement, l'objet accelere indéfiniment / tombe de plus en plus vite tout du long »"
    description: "L'élève ignore que le frottement croit avec la vitesse et finit par compenser le poids ; il generalise le comportement du régime initial ($a=g$) a toute la chute."
    contradicts_principle: "L'accélération décroît continûment depuis $g$ (régime initial) vers 0 (régime permanent) à mesure que $kv$ se rapproche de $mg$ ; la vitesse plafonne a $v_\\ell=mg/k$, elle n'augmente pas indéfiniment."

  - id: mc.physics.pc_chute_plans.masse-jamais-determinante-en-chute
    label: "« La masse ne joue jamais dans une chute (comme en chute libre) »"
    description: "L'élève transpose la règle du chapitre 2 ($a=g$ indépendant de $m$) au cas avec frottement, sans remarquer que $v_\\ell=mg/k$ contient $m$."
    contradicts_principle: "Cette règle ne vaut que sans frottement. Des qu'un frottement fluide entre en jeu, $v_\\ell=mg/k$ dépend de $m$ : deux objets de même forme mais de masses différentes n'ont pas la même vitesse limite."

  # ── Ajoutée le 2026-09-27 pour l'extension Archimède du rung 7 (audit
  #    audit-banque-pc1.md, entrées C1/C2 : rho_fluide GAP-A la plus lourde de
  #    l'audit, tau -> k GAP-B). Aucune des 21 misconceptions déclarées jusque
  #    -là ne nommait l'erreur : la poussée d'Archimède, contrairement au
  #    frottement $kv$, ne dépend pas de $v$ — elle est déjà pleinement
  #    présente à $t=0$ et ne modifie QUE le terme constant de l'équation
  #    ($a_0$, $v_\ell$), jamais son coefficient en $v$ ($1/\tau$, donc $k$).
  #    Trois manifestations d'une seule erreur de localisation : l'oublier là
  #    où elle agit, mal construire le « $1-\rho_f/\rho_s$ », ou l'invoquer là
  #    où elle n'agit pas. Portée par CMP-39/40/41 (plancher de 3 tenu, sans
  #    marge) — puis, passe critique wave-1 du même jour (C-4, I7 :
  #    vagueA-pedagogie.md / vagueA-fidelite.md), étendue à CMP-44 (entrée
  #    qualitative, en amont de CMP-39) et CMP-45 (établissement de l'ODE
  #    elle-même, forme la plus attestée du banc) : 5 items, marge de 2.
  - id: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
    label: "« La poussée d'Archimède est mal placée dans le modèle : oubliée là où elle agit, ou invoquée là où elle n'agit pas »"
    description: >
      L'élève ne localise pas correctement où la poussée d'Archimède intervient
      dans $m\,dv/dt = mg - F_A - kv$. Tantôt il l'oublie dans le régime
      initial ou dans $v_\ell$ (il écrit $a_0=g$ comme sans Archimède, alors
      qu'elle est déjà pleinement présente dès $t=0$, contrairement au
      frottement $kv$ qui est nul à $v=0$) ; tantôt il retrouve la bonne
      structure mais oublie le « $1-$ » (il calcule $g\,\rho_f/\rho_s$ au lieu
      de $g(1-\rho_f/\rho_s)$, ou inverse $\rho_f$ et $\rho_s$) ; tantôt, à
      l'inverse, il croit qu'elle modifie aussi $\tau$ ou $k$, qui n'en
      dépendent pourtant jamais.
    contradicts_principle: >
      Dans $m\,dv/dt = mg - F_A - kv$, le terme d'Archimède $F_A=\rho_f V g$ ne
      dépend pas de $v$ : il est pleinement présent dès $t=0$ et ne modifie que
      le terme CONSTANT de l'équation. Régime initial :
      $a_0=(mg-F_A)/m=g(1-\rho_f/\rho_s)$, jamais $g$ seul dès que $\rho_f>0$.
      Régime permanent : $v_\ell=(mg-F_A)/k$. Mais le coefficient de $v$,
      $1/\tau=k/m$, ne contient pas $F_A$ : $\tau=m/k$ et $k=m/\tau$ restent
      EXACTEMENT les mêmes qu'en l'absence d'Archimède.

  - id: mc.physics.pc_chute_plans.euler-donne-valeur-exacte
    label: "« La méthode d'Euler donne la valeur exacte de $v(t)$ »"
    description: "L'élève croit que la récurrence d'Euler résout exactement l'équation différentielle, quel que soit le pas $\\Delta t$."
    contradicts_principle: "Euler suppose la pente constante sur chaque pas, ce qui n'est vrai qu'approximativement ; l'erreur diminue quand $\\Delta t$ diminue, mais ne s'annule jamais pour un pas fini."

  - id: mc.physics.pc_chute_plans.euler-oubli-dt
    label: "« $v_{i+1}=v_i+a_i$ » (oubli du facteur $\\Delta t$)"
    description: "L'élève additionne directement l'accélération a la vitesse, sans la multiplier par la durée du pas — incohérence dimensionnelle non détectée."
    contradicts_principle: "$a_i\\,\\Delta t$ est homogène a une vitesse (accélération x temps) ; $v_i+a_i$ additionnerait une vitesse et une accélération, ce qui n'a pas de sens physique."

  - id: mc.physics.pc_chute_plans.euler-pente-non-recalculee
    label: "« La pente $a_i$ reste fixe (égale à $g$) à chaque pas, comme en chute libre »"
    description: "L'élève n'actualise pas $a_i$ à partir de $v_i$ à chaque étape ; il applique implicitement le modèle sans frottement tout au long du tableau."
    contradicts_principle: "$a_i=g-\\frac{k}{m}v_i$ dépend de $v_i$ et doit être recalculée à chaque ligne : c'est cette actualisation qui fait apparaître l'effet du frottement (la pente décroît ligne après ligne)."

  - id: mc.physics.pc_chute_plans.orbite-sans-gravite
    label: "« En orbite il n'y a pas de gravite / le satellite ne subit aucune force »"
    description: "L'élève explique l'apesanteur par une absence de gravite plutôt que par une chute libre permanente."
    contradicts_principle: "La gravite est exactement la force qui courbe la trajectoire en orbite ; sans elle, par inertie, le satellite partirait en ligne droite. L'apesanteur ressentie vient d'une chute libre continue, pas d'une absence de force."

  - id: mc.physics.pc_chute_plans.orbite-necessite-force-tangentielle
    label: "« Il faut une force dans le sens du mouvement (ou un moteur) pour maintenir le satellite en orbite »"
    description: "L'élève croit qu'un mouvement circulaire uniforme necessite une force motrice tangentielle, en plus de la force centripete."
    contradicts_principle: "La seule force est centripete (perpendiculaire a la vitesse) ; elle ne pousse jamais vers l'avant. La norme de la vitesse se maintient seule, par inertie, des lors qu'aucune force tangentielle n'agit."

  - id: mc.physics.pc_chute_plans.vitesse-orbitale-depend-masse-satellite
    label: "« Un satellite plus lourd doit aller plus vite (ou plus lentement) sur la même orbite »"
    description: "L'élève croit que la masse du satellite intervient dans sa vitesse orbitale, par analogie avec d'autres contextes ou la masse compte."
    contradicts_principle: "$v=\\sqrt{GM/r}$ ne contient pas la masse $m$ du satellite : elle se simplifie dans la 2e loi. Sur une orbite de rayon donne, tous les satellites ont la même vitesse, quelle que soit leur masse."

  - id: mc.physics.pc_chute_plans.kepler3-exposants-inverses
    label: "« La 3e loi de Kepler s'écrit $T/r$, $T^3/r^2$ ou $T^2/r^2$ = constante » (exposants mal memorises)"
    description: "L'élève retient mal la position des exposants dans la 3e loi, faute de repartir de son établissement."
    contradicts_principle: "L'établissement (egaler $v=\\sqrt{GM/r}$ et $v=2\\pi r/T$) donne directement $T^2/r^3=4\\pi^2/GM$ : le carré est sur la période, le cube sur le rayon."

  # Déclarée le 2026-09-28 (vague D-E, suite du §35/§36 : le coordinateur a
  # jugé malhonnête le placeholder posé sur les deux distracteurs neufs de
  # CMP-48, qui utilisaient les BONS exposants mais des données NON
  # préparées). Portée par trois items dès sa déclaration (CMP-48, CMP-49,
  # CMP-50).
  - id: mc.physics.pc_chute_plans.kepler3-donnees-non-preparees
    label: "« La 3e loi de Kepler ($T^2/r^3$=constante) est appliquée à des données BRUTES, non préparées »"
    description: "L'élève applique $T^2/r^3=4\\pi^2/GM$ avec les BONS exposants, mais sans préparer les données au préalable : soit il prend pour $r$ la seule altitude au-dessus de la surface de l'astre, au lieu du rayon compté depuis son CENTRE ($r=R_{astre}+\\text{altitude}$) ; soit il élève au carré une durée encore exprimée en jours ou en heures, sans l'avoir d'abord convertie en secondes."
    contradicts_principle: "La 3e loi exige un rayon d'orbite mesuré depuis le CENTRE de l'astre central ($r=R_{astre}+h$, jamais l'altitude $h$ seule) et une période en SECONDES avant d'être élevée au carré (jamais en jours ou en heures) : ni l'un ni l'autre n'est une question d'exposant, mais de préparation des données AVANT de les faire entrer dans la formule."

  - id: mc.physics.pc_chute_plans.geostationnaire-immobile-absolu
    label: "« Le satellite géostationnaire est immobile dans l'espace / n'a pas de vitesse »"
    description: "L'élève confond « immobile par rapport au sol » et « immobile dans l'absolu », en oubliant le référentiel géocentrique."
    contradicts_principle: "Dans le référentiel géocentrique, le satellite géostationnaire parcourt un cercle a sa vitesse orbitale (quelques km/s) ; il n'est immobile que par rapport a un observateur au sol, parce qu'il tourne a la même vitesse angulaire que la Terre."

  - id: mc.physics.pc_chute_plans.geostationnaire-toute-altitude
    label: "« N'importe quelle altitude peut être géostationnaire »"
    description: "L'élève ne voit pas que la condition $T=T_{Terre}$ combinée a la 3e loi impose un rayon unique."
    contradicts_principle: "$T^2/r^3=4\\pi^2/GM_T$ relie $T$ et $r$ de façon biunivoque pour un astre donne : se donner $T=24\\ \\text{h}$ determine une seule valeur de $r$, pas une plage de rayons possibles."
items:
  - id: CMP-1
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un projectile est lance dans le champ de pesanteur, frottements de l'air
      négligés. Que devient la composante horizontale $v_x$ de sa vitesse
      pendant le vol ?
    type: mcq
    choices:
      - id: A
        text: "Elle reste constante, car aucune force horizontale n'agit sur le projectile"
        correct: true
      - id: B
        text: "Elle diminue progressivement au cours du vol, jusqu'à finir par s'annuler"
        correct: false
        misconception: mc.physics.pc_chute_plans.vx-varie-pendant-le-vol
        feedback: >
          Rien ne freine horizontalement : les frottements sont négligés et le
          poids est vertical. Sur l'axe horizontal, $a_x = 0$, donc $v_x$ ne
          diminue pas.
      - id: C
        text: "Elle augmente, entraînée par la chute du projectile vers le sol"
        correct: false
        misconception: mc.physics.pc_chute_plans.poids-agit-sur-lhorizontale
        feedback: >
          La chute agit sur la composante VERTICALE. Les deux mouvements sont
          indépendants : le poids étant vertical, il ne modifie pas $v_x$.
      - id: D
        text: "Elle s'annule au sommet de la trajectoire, comme la composante verticale"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-nulle-au-sommet
        feedback: >
          C'est $v_y$ qui s'annule au sommet, pas $v_x$. Au sommet la vitesse
          est purement horizontale et vaut justement $v_x = v_{0x}$.
    correct_feedback: >
      Exact : sur l'axe horizontal la 2e loi donne $a_x = 0$, donc
      $v_x = v_{0x}$ reste constante tout le vol. C'est ce qui rend les deux
      axes indépendants.
    solution: |
      Bilan : seul le poids $\vec P = m\vec g$ agit, et il est vertical.
      Projection de la 2e loi sur l'axe horizontal :
      $$m a_x = 0$$
      $$a_x = 0 \implies v_x = v_{0x} = \text{constante}$$
      Le mouvement horizontal est uniforme ; seul l'axe vertical subit $g$.

  - id: CMP-2
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Au sommet de sa trajectoire (la fleche), quelle est la vitesse du
      projectile ?
    type: mcq
    choices:
      - id: A
        text: "Horizontale et non nulle, égale à $v_{0x}$"
        correct: true
      - id: B
        text: "Nulle"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-nulle-au-sommet
        feedback: >
          Au sommet, seule la composante VERTICALE $v_y$ s'annule. La
          composante horizontale $v_x = v_{0x}$ subsiste : la vitesse totale
          n'est donc pas nulle.
      - id: C
        text: "Verticale, dirigée vers le bas"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-nulle-au-sommet
        feedback: >
          Juste après le sommet la vitesse aura une composante verticale vers
          le bas, mais AU sommet $v_y = 0$ : la vitesse y est purement
          horizontale.
      - id: D
        text: "Maximale sur toute la trajectoire"
        correct: false
        misconception: mc.physics.pc_chute_plans.vitesse-nulle-au-sommet
        feedback: >
          C'est au contraire ou la vitesse est MINIMALE (il ne reste que
          $v_x$). Elle est maximale au départ et a l'arrivée au sol.
    correct_feedback: >
      Oui : au sommet $v_y = 0$ mais $v_x = v_{0x} \neq 0$. La vitesse y est
      horizontale et minimale, jamais nulle.
    solution: |
      Le sommet est défini par $v_y = 0$ (la montée s'arrete, la descente
      commence). Mais l'axe horizontal reste uniforme :
      $$v_x = v_{0x} = v_0\cos\alpha \neq 0$$
      La vitesse au sommet vaut donc $v_{0x}$, horizontale.

  - id: CMP-3
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Deux billes de masses différentes sont lancées avec exactement la même
      vitesse initiale (même valeur, même angle), frottements négligés. Que
      peut-on dire de leurs trajectoires ?
    type: mcq
    choices:
      - id: A
        text: "Elles sont identiques, car l'accélération $\\vec a = \\vec g$ ne dépend pas de la masse"
        correct: true
      - id: B
        text: "La bille la plus lourde retombe plus vite et va moins loin"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-influe-en-chute-libre
        feedback: >
          C'est l'intuition trompeuse. La 2e loi donne $m\vec a = m\vec g$,
          d'ou $\vec a = \vec g$ : la masse se simplifie. Même accélération,
          même trajectoire.
      - id: C
        text: "La bille la plus legere va plus loin"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-influe-en-chute-libre
        feedback: >
          Sans frottements, la masse n'intervient pas : $\vec a = \vec g$ pour
          les deux. Les trajectoires se superposent exactement.
      - id: D
        text: "On ne peut pas savoir sans connaître les masses"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-influe-en-chute-libre
