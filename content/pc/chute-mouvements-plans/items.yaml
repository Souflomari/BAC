          l'augmente pas.
      - id: B
        text: "Augmenter la charge $|q|$ de la particule"
        correct: false
        misconception: mc.physics.pc_chute_plans.force-de-lorentz-mal-comprise
        feedback: >
          $|q|$ est au dénominateur : l'augmenter DIMINUE le rayon, il ne
          l'augmente pas.
      - id: C
        text: "Diminuer la masse $m$ de la particule"
        correct: false
        misconception: mc.physics.pc_chute_plans.force-de-lorentz-mal-comprise
        feedback: >
