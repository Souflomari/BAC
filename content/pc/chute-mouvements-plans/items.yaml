          existence.
      - id: C
        text: "Elles décrivent des cercles de même rayon $R=mv_0/(|q|B)$, mais courbes en sens opposés, selon le signe de la charge"
        correct: true
      - id: D
        text: "Les deux sont déviées dans le même sens, mais avec des rayons différents selon le signe de la charge"
        correct: false
        feedback: >
          $R=mv_0/(|q|B)$ ne dépend que de la VALEUR de $q$ (identique ici),
          pas de son signe : c'est le SENS de la courbure qui diffère, pas le
          rayon.
    correct_feedback: >
      $R=mv_0/(|q|B)$ est identique pour les deux (même $|q|$), mais le sens
      de $\vec F=q\vec v\wedge\vec B$ s'inverse avec le signe de $q$ : les
      deux cercles sont courbes en sens opposés.
    solution: |
      Même $m$, $v_0$, $|q|$, $B$ donc même $R$. Mais
      $\vec F = q\vec v\wedge\vec B$ change de sens quand $q$ change de
      signe : les deux trajectoires sont deux cercles de même rayon, courbes
      de part et d'autre de la direction initiale.

