      - id: B
        text: "Les deux courbes montent vers des paliers différents : la bille $m_2$ (la plus lourde) se stabilise a une vitesse limite plus grande, car $v_\\ell = mg/k$ croit avec $m$"
        correct: true
      - id: C
        text: "Ce ne sont pas de vrais paliers : si l'enregistrement durait plus longtemps, les deux courbes continueraient tranquillement de monter"
        correct: false
        misconception: mc.physics.pc_chute_plans.acceleration-indefinie-avec-frottement
        also_reveals: []
        feedback: >
          Un palier sur $v=f(t)$ marque au contraire une vraie
          stabilisation : l'accélération y est nulle parce que le
          frottement a rejoint le poids. Prolonger l'enregistrement ne
          ferait pas remonter la courbe.
      - id: D
        text: "Les deux billes devraient se stabiliser exactement à la même vitesse : la masse n'a aucun effet sur un mouvement de chute dans un fluide"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-jamais-determinante-en-chute
        also_reveals: []
