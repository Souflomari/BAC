  # R7 — chute avec frottement fluide : v_lim, tau, regimes (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: CMP-25
    rung: "R7"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, utilisation]
    stem: >
      Un solide de masse $m$ tombe verticalement dans un fluide, soumis a un
      frottement linéaire $\vec f = -k\vec v$. Après un certain temps, sa
      vitesse atteint la valeur limite $v_\ell$ et ne varie plus. Que peut-on
      affirmer, a cet instant, sur l'accélération et sur la force de
      frottement ?
    type: mcq
    choices:
      - id: A
        text: "L'accélération est nulle (la somme des forces est nulle), mais la force de frottement, elle, est à son maximum : aucune force n'a disparu, $k\\,v_\\ell = mg$"
        correct: true
      - id: B
        text: "L'accélération est nulle et la force de frottement est nulle elle aussi : puisque plus rien ne change, plus aucune force n'agit"
        correct: false
        misconception: mc.physics.pc_chute_plans.frottement-disparait-a-vlim
        also_reveals: []
        feedback: >
          Somme nulle ne veut pas dire absence de force. A $v_\ell$, le
          frottement est au contraire maximal, exactement égal au poids
          ($k v_\ell = mg$) : c'est leur somme qui s'annule, pas le
          frottement lui-même.
      - id: C
        text: "L'accélération n'atteint jamais zéro : l'objet continue d'accélérer indéfiniment, la « vitesse limite » n'est qu'une impression"
        correct: false
        misconception: mc.physics.pc_chute_plans.acceleration-indefinie-avec-frottement
        also_reveals: []
        feedback: >
          C'est l'inverse : le frottement croit avec $v$ et finit par
          egaler le poids, ce qui annule l'accélération. Une vraie vitesse
          limite existe ; ce n'est pas une illusion de mesure.
      - id: D
        text: "$v_\\ell$ est la même pour tous les objets, quelle que soit leur masse, comme en chute libre sans frottement"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-jamais-determinante-en-chute
        also_reveals: []
        feedback: >
          Ceci n'est vrai que sans frottement (chapitre 2). Avec frottement,
          $v_\ell = mg/k$ contient $m$ : deux objets de masses différentes
          n'ont pas la même vitesse limite.
    correct_feedback: >
      Exact : a $v_\ell$, $dv/dt=0$ donc la somme des forces est nulle, ce
      qui impose $k v_\ell = mg$ — le frottement y est maximal, égal au
      poids, pas nul.
    solution: |
      Bilan : poids $mg$ et frottement $kv$ (frottement linéaire), axe
      oriente vers le bas.
      $$m\frac{dv}{dt} = mg - kv \implies \frac{dv}{dt} = g - \frac{k}{m}v$$
      A $v_\ell$, l'accélération est nulle :
      $$g - \frac{k}{m}v_\ell = 0 \implies k v_\ell = mg$$
      Le frottement est donc maximal a cet instant, exactement égal au
      poids ; c'est leur somme (donc l'accélération) qui s'annule, pas le
      frottement.

  - id: CMP-26
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, resolution]
    stem: >
      Une bille de masse $m=0{,}20\ \text{kg}$ est lâchée sans vitesse
      initiale dans un liquide visqueux ; le frottement est linéaire, de
      coefficient $k=2{,}0\ \text{kg/s}$ ($g\approx9{,}8\ \text{m/s}^2$). La
      2e loi donne $\dfrac{dv}{dt}=9{,}8-10{,}0\,v$ ($v$ en m/s, $t$ en s).
      Que valent l'accélération a $t=0$ et la vitesse limite $v_\ell$ ?
    type: mcq
    choices:
      - id: A
        text: "$v_\\ell$ correspond à l'instant ou le frottement s'annule completement ; comme $k=2{,}0\\ \\text{kg/s}\\neq 0$, cette bille n'atteint jamais de vitesse limite"
        correct: false
        misconception: mc.physics.pc_chute_plans.frottement-disparait-a-vlim
        also_reveals: []
        feedback: >
          $v_\ell$ ne correspond pas a un frottement nul, mais a une
          accélération nulle : le frottement, lui, est alors maximal
          ($k v_\ell = mg$). Cette bille atteint bien une vitesse limite,
          comme tout objet soumis a un frottement qui croit avec $v$.
      - id: B
        text: "A $t=0$, $a=9{,}8\\ \\text{m/s}^2$, et cette accélération continue de croitre par la suite : la vitesse de la bille augmente donc indéfiniment"
        correct: false
        misconception: mc.physics.pc_chute_plans.acceleration-indefinie-avec-frottement
        also_reveals: []
        feedback: >
          C'est l'inverse : à mesure que $v$ augmente, le frottement $kv$
          augmente aussi et se rapproche du poids, donc l'accélération
          DIMINUE. Elle s'annule a $v_\ell=0{,}98\ \text{m/s}$ ; la vitesse
          ne croit pas indéfiniment.
      - id: C
        text: "A $t=0$, $a=9{,}8\\ \\text{m/s}^2$ (comme en chute libre, le frottement est nul car $v=0$) ; en annulant l'accélération dans l'équation, $v_\\ell = mg/k = 0{,}98\\ \\text{m/s}$"
        correct: true
      - id: D
        text: "$v_\\ell = mg/k$ ne dépend en réalité pas de $m$ : une bille deux fois plus lourde, dans le même liquide, atteindrait exactement la même vitesse limite $0{,}98\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-jamais-determinante-en-chute
        also_reveals: []
        feedback: >
          La formule $v_\ell = mg/k$ contient explicitement $m$ : une bille
          deux fois plus lourde aurait $v_\ell$ deux fois plus grand
          ($1{,}96\ \text{m/s}$), pas la même valeur.
    correct_feedback: >
      Exact : a $t=0$, $v=0$ donc le frottement est nul et
      $a=g=9{,}8\ \text{m/s}^2$ (comme en chute libre) ; en annulant
      l'accélération, $v_\ell = mg/k = 0{,}20\times9{,}8/2{,}0 =
      0{,}98\ \text{m/s}$.
    solution: |
      Régime initial ($v=0$) :
      $$a(0) = 9{,}8 - 10{,}0\times0 = 9{,}8\ \text{m/s}^2$$
      comme en chute libre, le frottement étant nul a cet instant.
      Vitesse limite ($a=0$) :
      $$0 = 9{,}8 - 10{,}0\,v_\ell \implies v_\ell = \frac{9{,}8}{10{,}0} =
      0{,}98\ \text{m/s}$$
      soit, avec les grandeurs symboliques, $v_\ell = mg/k =
      0{,}20\times9{,}8/2{,}0 = 0{,}98\ \text{m/s}$.

  - id: CMP-27
