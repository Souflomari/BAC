  - id: CMP-18
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Pour un meme angle de lancement $\alpha$, on double la vitesse initiale
      $v_0$ d'un tir. Que deviennent la fleche $f$ et la portee $D$ ?
    type: mcq
    choices:
      - id: A
        text: "Elles sont toutes les deux multipliees par 4, car $f$ et $D$ dependent de $v_0^2$"
        correct: true
      - id: B
        text: "Elles sont toutes les deux multipliees par 2, comme $v_0$"
        correct: false
        feedback: >
          $f$ et $D$ dependent de $v_0^2$, pas de $v_0$ : doubler $v_0$
          multiplie donc $v_0^2$ par $4$, pas par $2$.
      - id: C
        text: "Seule la portee double ; la fleche ne change pas, car elle ne depend que de l'angle"
        correct: false
        feedback: >
          $f=v_0^2\sin^2\alpha/(2g)$ depend elle aussi de $v_0^2$ : elle
          change avec $v_0$, exactement comme la portee.
      - id: D
        text: "Elles sont toutes les deux multipliees par 8"
        correct: false
        feedback: >
          $f$ et $D$ dependent de $v_0^2$ (une puissance 2), pas de $v_0^3$ :
          doubler $v_0$ multiplie donc par $2^2=4$, pas par $2^3=8$.
    correct_feedback: >
      $f$ et $D$ contiennent toutes deux $v_0^2$ et rien d'autre en $v_0$ :
      doubler $v_0$ multiplie donc les deux par $2^2=4$.
    solution: |
      $$f = \frac{v_0^2\sin^2\alpha}{2g} \qquad D =
      \frac{v_0^2\sin(2\alpha)}{g}$$
      Les deux formules ne contiennent $v_0$ qu'au carre : doubler $v_0$
      multiplie donc $f$ et $D$ par $2^2=4$, pas par $2$.

  - id: CMP-19
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Deux tirs, a la meme vitesse $v_0$, sont effectues avec des angles
      complementaires $\alpha_1 = 20^\circ$ et $\alpha_2 = 70^\circ$. Que
      peut-on affirmer ?
    type: mcq
    choices:
      - id: A
        text: "Les deux tirs ont la meme portee ET la meme fleche, puisque les angles sont complementaires"
        correct: false
        feedback: >
          Seule la portee est egale pour des angles complementaires
          ($\sin(2\alpha)$ identique). La fleche depend de $\sin^2\alpha$,
          qui differe : le tir le plus incline monte plus haut.
      - id: B
        text: "Les deux tirs ont la meme portee, mais le tir a $70^\\circ$ a la fleche la plus grande"
        correct: true
      - id: C
        text: "Le tir a $70^\\circ$ a la plus grande portee, car un angle plus grand rapproche le tir de la verticale, donc du maximum"
        correct: false
        feedback: >
          La portee depend de $\sin(2\alpha)$, maximale a $45^\circ$ puis
          redescendante : $20^\circ$ et $70^\circ$ donnent en realite la
          MEME portee, ni l'un ni l'autre n'est superieur.
      - id: D
        text: "Le tir a $20^\\circ$ a la plus grande fleche, car un angle plus petit donne un tir plus tendu et plus efficace"
        correct: false
        feedback: >
          C'est l'inverse : la fleche $f=v_0^2\sin^2\alpha/(2g)$ croit avec
          $\alpha$. Le tir le plus incline ($70^\circ$) monte plus haut, pas
          celui a $20^\circ$.
    correct_feedback: >
      $\sin(2\times20^\circ)=\sin(2\times70^\circ)$ : meme portee. Mais
      $\sin^2(70^\circ) > \sin^2(20^\circ)$ : le tir le plus incline a la
      fleche la plus grande.
    solution: |
      Portee : $\sin(2\alpha_1)=\sin(40^\circ)=\sin(140^\circ)=\sin(2\alpha_2)$
      (angles complementaires), donc $D_1=D_2$.
      Fleche : $\sin^2(70^\circ) > \sin^2(20^\circ)$, donc $f_2 > f_1$.

  - id: CMP-20
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Deux particules, l'une de charge positive et l'autre de charge
      negative (meme masse, meme valeur $|q|$), entrent avec la meme vitesse
      $\vec v_0$ dans le meme champ $\vec B$ perpendiculaire a $\vec v_0$.
      Que peut-on dire de leurs trajectoires ?
    type: mcq
    choices:
      - id: A
        text: "Elles suivent exactement la meme trajectoire, car le champ magnetique ne depend pas du signe de la charge"
        correct: false
        feedback: >
          Contrairement a la chute libre (ou la masse disparait), le SIGNE
          de la charge intervient directement dans le sens de
          $\vec F = q\vec v\wedge\vec B$ : il ne disparait pas.
      - id: B
        text: "La particule positive n'est pas deviee du tout, seule la negative subit la force de Lorentz"
        correct: false
        feedback: >
          La force de Lorentz agit sur toute charge non nulle, positive ou
          negative ; seul son SENS change avec le signe de $q$, pas son
          existence.
      - id: C
        text: "Elles decrivent des cercles de meme rayon $R=mv_0/(|q|B)$, mais courbes en sens opposes, selon le signe de la charge"
        correct: true
      - id: D
        text: "Les deux sont deviees dans le meme sens, mais avec des rayons differents selon le signe de la charge"
        correct: false
        feedback: >
          $R=mv_0/(|q|B)$ ne depend que de la VALEUR de $q$ (identique ici),
          pas de son signe : c'est le SENS de la courbure qui differe, pas le
          rayon.
    correct_feedback: >
      $R=mv_0/(|q|B)$ est identique pour les deux (meme $|q|$), mais le sens
      de $\vec F=q\vec v\wedge\vec B$ s'inverse avec le signe de $q$ : les
      deux cercles sont courbes en sens opposes.
    solution: |
      Meme $m$, $v_0$, $|q|$, $B$ donc meme $R$. Mais
      $\vec F = q\vec v\wedge\vec B$ change de sens quand $q$ change de
      signe : les deux trajectoires sont deux cercles de meme rayon, courbes
      de part et d'autre de la direction initiale.

  - id: CMP-21
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Le rayon de la trajectoire circulaire d'une particule chargee dans un
      champ magnetique uniforme vaut $R = \dfrac{m\,v_0}{|q|\,B}$. Laquelle
      de ces modifications, prise seule (toutes les autres grandeurs restant
      fixees), AUGMENTE ce rayon ?
    type: mcq
    choices:
      - id: A
        text: "Augmenter le champ magnetique $B$"
        correct: false
        feedback: >
          $B$ est au denominateur : l'augmenter DIMINUE le rayon, il ne
          l'augmente pas.
      - id: B
        text: "Augmenter la charge $|q|$ de la particule"
        correct: false
        feedback: >
          $|q|$ est au denominateur : l'augmenter DIMINUE le rayon, il ne
          l'augmente pas.
      - id: C
        text: "Diminuer la masse $m$ de la particule"
        correct: false
        feedback: >
          $m$ est au numerateur : la DIMINUER reduit le rayon ; c'est
          l'AUGMENTER qui l'agrandirait.
      - id: D
        text: "Augmenter la vitesse initiale $v_0$"
        correct: true
    correct_feedback: >
      $v_0$ est au numerateur de $R=mv_0/(|q|B)$ : l'augmenter augmente $R$.
      $B$ et $|q|$ sont au denominateur (les augmenter reduit $R$) ; $m$ est
      au numerateur (la diminuer reduit $R$).
    solution: |
      $$R = \frac{m\,v_0}{|q|\,B}$$
      Seule une augmentation du numerateur ($m$ ou $v_0$) augmente $R$.
      Parmi les options, seule l'augmentation de $v_0$ correspond a ce cas.

