  # R8 — methode d'Euler (3 items)
  # ══════════════════════════════════════════════════════════════

  - id: CMP-28
    rung: "R8"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, methode_euler, utilisation]
    stem: >
      Dans la méthode d'Euler appliquee a une équation différentielle
      $\dfrac{dv}{dt}=a(v)$, avec un pas de temps $\Delta t$, comment
      obtient-on $v_{i+1}$ à partir de $v_i$ ?
    type: mcq
    choices:
      - id: A
        text: "$v_{i+1}=v_i+a_i$, ou $a_i$ est l'accélération calculée à partir de $v_i$"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-oubli-dt
        also_reveals: []
        feedback: >
          Cette expression additionne une vitesse et une accélération :
          incoherence dimensionnelle. Il manque le facteur $\Delta t$
          (accélération x temps = vitesse).
      - id: B
        text: "$v_{i+1}=v_i+g\\,\\Delta t$, en gardant $a=g$ fixe à chaque pas"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-pente-non-recalculee
        also_reveals: []
        feedback: >
          Garder $a=g$ fixe revient a ignorer tout frottement (ou toute
          autre force dépendant de $v$) : ca redonne la chute libre, pas la
          solution de l'équation différentielle étudiée.
      - id: C
        text: "$v_{i+1}$ est la valeur exacte de $v$ à l'instant $t_{i+1}$, quel que soit le pas $\\Delta t$ choisi"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-donne-valeur-exacte
        also_reveals: []
        feedback: >
          C'est une approximation, pas une valeur exacte : la pente est
          supposée constante sur tout le pas, ce qui n'est vrai
          qu'approximativement. L'écart avec la vraie courbe se réduit
          quand $\Delta t$ diminue, sans jamais s'annuler pour un pas fini.
      - id: D
        text: "$v_{i+1}=v_i+a_i\\,\\Delta t$, avec $a_i$ recalcule à chaque pas à partir de l'équation différentielle en $v_i$"
        correct: true
    correct_feedback: >
      Exact : c'est la formule d'Euler. Le facteur $\Delta t$ est
      indispensable (homogénéité), et $a_i$ doit être recalcule à chaque
      pas à partir de $v_i$ courant, sinon on perd l'effet de la force qui
      dépend de $v$.
    solution: |
      $$
      v_{i+1} = v_i + \left(\frac{dv}{dt}\right)_i \Delta t = v_i +
      a_i\,\Delta t, \qquad a_i = g - \frac{k}{m}v_i
      $$
      Deux points a vérifier à chaque application : le facteur $\Delta t$
      (homogénéité) et le recalcul de $a_i$ à partir de $v_i$ courant, pas
      d'une valeur figee.

  - id: CMP-29
    rung: "R8"
    difficulty_level: 4
    skill_code: pc_chute_plans
    tags: [misconception_driven, methode_euler, resolution]
    stem: >
      Pour une bille en chute avec frottement, on relève $v_i=2{,}0\
      \text{m/s}$ et $a_i=6{,}0\ \text{m/s}^2$ (calculé à partir de
      l'équation différentielle à $v_i$), avec un pas
      $\Delta t=0{,}10\ \text{s}$. Quelle est la valeur d'Euler de
      $v_{i+1}$, et que dire de sa précision ?
    type: mcq
    choices:
      - id: A
        text: "$v_{i+1}=2{,}0+6{,}0\\times0{,}10=2{,}6\\ \\text{m/s}$, une valeur approchée (elle se rapprocherait de la vraie courbe si $\\Delta t$ était plus petit)"
        correct: true
      - id: B
        text: "$v_{i+1}=2{,}0+6{,}0=8{,}0\\ \\text{m/s}$ : on ajoute directement $a_i$ a $v_i$"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-oubli-dt
        also_reveals: []
        feedback: >
          $a_i$ doit être multiplie par $\Delta t$ avant d'être ajoute a
          $v_i$ : sans ce facteur, on additionne une vitesse et une
          accélération, ce qui n'est pas homogène.
      - id: C
        text: "$v_{i+1}=2{,}0+9{,}8\\times0{,}10\\approx2{,}98\\ \\text{m/s}$ : on utilise $g$ plutôt que de recalculer $a_i$ à partir de l'équation différentielle"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-pente-non-recalculee
        also_reveals: []
        feedback: >
          $a_i=6{,}0\ \text{m/s}^2$ est déjà la valeur correcte, issue de
          l'équation différentielle a $v_i=2{,}0\ \text{m/s}$ ; utiliser
          $g=9{,}8\ \text{m/s}^2$ a la place revient a ignorer le
          frottement déjà installe.
      - id: D
        text: "$v_{i+1}=2{,}6\\ \\text{m/s}$, exactement, quel que soit $\\Delta t$ choisi : la méthode d'Euler ne fait aucune approximation"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-donne-valeur-exacte
        also_reveals: []
        feedback: >
          La valeur $2{,}6\ \text{m/s}$ est correcte, mais elle reste
          approchée : Euler suppose la pente constante sur tout le pas, ce
          qui n'est vrai qu'a la limite $\Delta t \to 0$.
    correct_feedback: >
      Exact : $v_{i+1}=v_i+a_i\Delta t = 2{,}0+6{,}0\times0{,}10=
      2{,}6\ \text{m/s}$. Cette valeur reste une approximation, meilleure
      quand $\Delta t$ est plus petit.
    solution: |
      $$
      v_{i+1} = v_i + a_i\,\Delta t = 2{,}0 + 6{,}0\times0{,}10 =
      2{,}0+0{,}60 = 2{,}6\ \text{m/s}
      $$
      C'est une valeur approchée, obtenue en supposant la pente constante
      ($=a_i$) sur tout le pas $\Delta t$.

  - id: CMP-30
    rung: "R8"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: [misconception_driven, methode_euler, application_experimentale]
    stem: >
      Pour compléter un tableau d'Euler d'une chute avec frottement, un
      élève pressé décide de garder $a_i=9{,}8\ \text{m/s}^2$ fixe à
      toutes les lignes, au lieu de recalculer
      $a_i=9{,}8-10{,}0\,v_i$ à chaque étape. Que produit ce raccourci, et
      que dit-il, plus généralement, de la précision de la méthode
      d'Euler ?
    type: mcq
    choices:
      - id: A
        text: "Rien ne change : dans l'équation différentielle, $a_i$ ne dépend pas vraiment de $v_i$, mais seulement du temps écoulé depuis le début"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-pente-non-recalculee
        also_reveals: []
        feedback: >
          Au contraire : $a_i=g-\frac{k}{m}v_i$ dépend explicitement de
          $v_i$ (via le frottement). Garder $a_i=g$ fixe revient a annuler
          artificiellement l'effet du frottement à chaque ligne.
      - id: B
        text: "Le tableau reste exact malgré ce raccourci : la méthode d'Euler donne de toute façon la valeur exacte de $v(t)$ à chaque ligne"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-donne-valeur-exacte
        also_reveals: []
        feedback: >
          La méthode d'Euler n'est jamais exacte, même sans ce raccourci :
          elle suppose la pente constante sur chaque pas, ce qui reste une
          approximation qui s'ameliore seulement quand $\Delta t$ diminue.
      - id: C
        text: "Ce raccourci revient à ignorer le frottement, et l'on retrouve la droite de la chute libre ; la méthode d'Euler, elle, ne donne jamais qu'une valeur approchée"
        correct: true
      - id: D
        text: "Le vrai problème de ce tableau, c'est d'avoir oublié de multiplier $a_i$ par le pas $\\Delta t$ à chaque ligne — et non pas d'avoir gardé $a_i$ fixe"
        correct: false
        misconception: mc.physics.pc_chute_plans.euler-oubli-dt
        also_reveals: []
        feedback: >
          Le facteur $\Delta t$ est bien present dans la récurrence
          ($v_{i+1}=v_i+a_i\Delta t$) ; le problème décrit ici porte sur
          $a_i$ garde fixe, pas sur un $\Delta t$ manquant.
    correct_feedback: >
      Exact : garder $a_i=g$ fixe supprime l'effet du frottement (on
      retombe sur la droite de la chute libre) ; indépendamment de cela,
      Euler reste par nature une méthode approchée, d'autant meilleure que
      $\Delta t$ est petit.
    solution: |
      Avec $a_i=g$ fixe, la recurrence devient $v_{i+1}=v_i+g\Delta t$ :
      c'est exactement la suite d'Euler de la chute libre (sans
      frottement), une droite de pente $g$, qui ne rejoint jamais
      l'asymptote $v_\ell$. Le bon calcul recalcule $a_i=g-\frac{k}{m}v_i$
      à chaque ligne, ce qui fait decroitre la pente et fait tendre $v_i$
      vers $v_\ell$. Dans les deux cas, Euler ne donne que des valeurs
      approchées, d'autant plus fideles que $\Delta t$ est petit.

