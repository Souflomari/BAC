      - id: B
        text: "Les deux tirs ont la même portée, mais le tir a $70^\\circ$ a la fleche la plus grande"
        correct: true
      - id: C
        text: "Le tir a $70^\\circ$ a la plus grande portée, car un angle plus grand rapproche le tir de la verticale, donc du maximum"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          La portée dépend de $\sin(2\alpha)$, maximale a $45^\circ$ puis
          redescendante : $20^\circ$ et $70^\circ$ donnent en réalité la
          MÊME portée, ni l'un ni l'autre n'est supérieur.
      - id: D
        text: "Le tir a $20^\\circ$ a la plus grande fleche, car un angle plus petit donne un tir plus tendu et plus efficace"
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          C'est l'inverse : la fleche $f=v_0^2\sin^2\alpha/(2g)$ croit avec
          $\alpha$. Le tir le plus incline ($70^\circ$) monte plus haut, pas
          celui a $20^\circ$.
    correct_feedback: >
      $\sin(2\times20^\circ)=\sin(2\times70^\circ)$ : même portée. Mais
      $\sin^2(70^\circ) > \sin^2(20^\circ)$ : le tir le plus incline a la
      fleche la plus grande.
    solution: |
      Portée : $\sin(2\alpha_1)=\sin(40^\circ)=\sin(140^\circ)=\sin(2\alpha_2)$
      (angles complementaires), donc $D_1=D_2$.
      Fleche : $\sin^2(70^\circ) > \sin^2(20^\circ)$, donc $f_2 > f_1$.

