  - id: CMP-44
    rung: "R7"
    difficulty_level: 2
    habilete: utilisation
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, archimede]
    stem: >
      Une bille homogène est lâchée sans vitesse initiale dans un bain
      d'huile (masse volumique de l'huile non nulle, frottement linéaire,
      poussée d'Archimède non négligeable). Combien de forces agissent sur
      la bille dès l'instant du lâcher, et son accélération initiale $a_0$
      vaut-elle encore $g$, comme dans l'air sans huile ?
    type: mcq
    choices:
      - id: A
        text: "Trois forces (poids, frottement, Archimède) ; $a_0<g$ dès $t=0$, car Archimède ne dépend pas de $v$ (contrairement au frottement, nul à $v=0$) et agit déjà pleinement"
        correct: true
      - id: B
        text: "Trois forces bien présentes, mais à $t=0$ la vitesse est nulle : seul le poids agit encore, donc $a_0=g$, exactement comme dans l'air"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Le frottement, lui, dépend bien de $v$ et s'annule à $t=0$ — mais
          la poussée d'Archimède ne dépend jamais de $v$ : elle vaut déjà
          $\rho_{huile}Vg$ à l'instant même du lâcher. Elle retranche donc
          sa part au poids dès $t=0$, et $a_0$ n'est jamais $g$ dès que
          $\rho_{huile}>0$.
      - id: C
        text: "Seules deux forces agissent, le poids et le frottement : la poussée d'Archimède ne s'exerce que dans des liquides bien plus denses qu'une huile"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Tout corps immergé, quel que soit le fluide, subit une poussée
          d'Archimède : elle existe dès qu'un volume de fluide est déplacé,
          pas seulement au-delà d'un seuil de densité. L'oublier revient à
          revenir, sans le dire, au bilan à deux forces du régime sans
          Archimède.
      - id: D
        text: "Trois forces bien présentes et $a_0<g$ dès le début ; mais si $\\rho_{huile}$ se rapprochait de la masse volumique de la bille, $a_0$ resterait proche de $g$ : Archimède n'affecte que la vitesse limite, pas le régime initial"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          C'est l'inverse : $a_0=g(1-\rho_{huile}/\rho_{bille})$ tend vers
          $0$, PAS vers $g$, quand $\rho_{huile}$ se rapproche de
          $\rho_{bille}$ — une bille aussi dense que le liquide qui
          l'entoure ne coule même pas, elle flotte en équilibre. Archimède
          agit sur le régime initial tout autant que sur $v_\ell$.
    correct_feedback: >
      Exact : trois forces (poids, frottement, poussée d'Archimède), mais
      seul le frottement dépend de $v$ et s'annule à $t=0$ — Archimède, elle,
      est déjà pleinement présente. D'où $a_0=g(1-\rho_{huile}/\rho_{bille})$,
      toujours strictement inférieur à $g$ dès que $\rho_{huile}>0$, et qui
      tend vers $0$ (pas vers $g$) si le liquide se rapproche de la densité
      de la bille.
    solution: |
      Bilan à $t=0$ ($v=0$) : le poids $mg$, le frottement $kv=0$ (nul, car
      $v=0$), et la poussée d'Archimède $F_A=\rho_{huile}Vg$ (non nulle, car
      indépendante de $v$).
      $$a_0 = \frac{mg-F_A}{m} = g\left(1-\frac{\rho_{huile}}{\rho_{bille}}\right)$$
      Cette expression est strictement inférieure à $g$ dès que
      $\rho_{huile}>0$, et tend vers $0$ (pas vers $g$) quand
      $\rho_{huile}\to\rho_{bille}$ : une bille de densité égale à celle du
      liquide ne coule pas, elle flotte.

  - id: CMP-45
    rung: "R7"
    difficulty_level: 3
    habilete: résolution
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, archimede, resolution]
    stem: >
      Une bille homogène de masse $m$, de masse volumique $\rho_s$, est
      lâchée sans vitesse initiale dans un liquide de masse volumique
      $\rho_f$ (frottement linéaire $f=kv$, poussée d'Archimède non
      négligeable). En appliquant la 2e loi de Newton et en posant
      $\tau=m/k$, quelle équation différentielle vérifie $v(t)$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\dfrac{dv}{dt} + \\dfrac{1}{\\tau}v = g\\left(1-\\dfrac{\\rho_f}{\\rho_s}\\right)$"
        correct: true
      - id: B
        text: "$\\dfrac{dv}{dt} + \\dfrac{1}{\\tau}v = g$"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Cette forme est celle du bilan à DEUX forces (poids, frottement),
          sans Archimède. Dès que $\rho_f>0$, une troisième force s'ajoute
          au bilan et modifie le terme constant : ce n'est plus $g$ seul.
      - id: C
        text: "$\\dfrac{dv}{dt} + \\dfrac{1}{\\tau}v = g\\,\\dfrac{\\rho_f}{\\rho_s}$"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Ce terme oublie le « $1-$ » : le bilan (poids moins Archimède,
          divisé par $m$) donne $g(1-\rho_f/\rho_s)$, pas $g\,\rho_f/\rho_s$
          — ce qui manque, et non ce qui est retranché.
      - id: D
        text: "$\\dfrac{dv}{dt} + \\dfrac{1}{\\tau}\\left(1-\\dfrac{\\rho_f}{\\rho_s}\\right)v = g$"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          La poussée d'Archimède ne dépend pas de $v$ : elle ne peut donc
          jamais modifier le COEFFICIENT de $v$ (ici $1/\tau=k/m$, qui ne
          contient que le frottement). Elle modifie uniquement le terme
          constant, à droite.
    correct_feedback: >
      Exact : le bilan à trois forces (poids, frottement, Archimède),
      projeté et divisé par $m$ (avec $V=m/\rho_s$ substitué dans le terme
      d'Archimède), donne $\dfrac{dv}{dt}+\dfrac{1}{\tau}v=g(1-\rho_f/\rho_s)$
      — le coefficient de $v$ est inchangé par Archimède ; seul le terme
      constant en porte la trace.
    solution: |
      Bilan à trois forces, axe vers le bas :
      $$m\frac{dv}{dt} = mg - F_A - kv \qquad \text{avec} \qquad F_A=\rho_f Vg$$
      Avec $V=m/\rho_s$ (bille homogène) :
      $$m\frac{dv}{dt} = mg\left(1-\frac{\rho_f}{\rho_s}\right) - kv$$
      On divise par $m$ et on pose $\tau=m/k$ :
      $$\frac{dv}{dt} + \frac{1}{\tau}v = g\left(1-\frac{\rho_f}{\rho_s}\right)$$
      Le coefficient de $v$, $1/\tau=k/m$, ne dépend que du frottement — pas
      d'Archimède, qui ne modifie que le terme constant à droite.

