  - id: CMP-46
    rung: "R5"
    difficulty_level: 4
    habilete: résolution
    skill_code: pc_chute_plans
    tags: [misconception_driven, projectile, resolution]
    stem: >
      Un projectile est lancé depuis l'origine $O$ ; son équation de
      trajectoire est $y(x) = 0{,}53\,x - 0{,}02\,x^2$ ($x$ et $y$ en
      mètres). Il retombe sur un plan incliné qui descend depuis $O$, en
      faisant un angle $\alpha = 25^\circ$ avec l'horizontale
      ($\tan\alpha \approx 0{,}47$, $\cos\alpha \approx 0{,}91$), au point
      de chute $E$. Quelle est la distance $OE$, mesurée le long du plan ?
    type: mcq
    choices:
      - id: A
        text: >-
          $OE = 50\ \text{m}$
        correct: false
        misconception: mc.physics.pc_chute_plans.signe-et-projection-mal-poses
        feedback: >
          Cette valeur est $x_E$, l'abscisse HORIZONTALE du point $E$ — pas
          $OE$. $E$ est sur le plan incliné : la distance parcourue le long
          de la pente est plus grande que sa seule projection horizontale,
          exactement comme $v_{0x} = v_0\cos\alpha$ est plus petite que
          $v_0$. Recopier $x_E$ tel quel revient à ignorer cette
          projection.
      - id: B
        text: >-
          $OE = 26{,}5\ \text{m}$
        correct: false
        misconception: mc.physics.pc_chute_plans.equation-de-trajectoire-mal-etablie
        feedback: >
          Cette valeur annule $y(x)$ seule : c'est la portée qu'aurait ce
          tir sur un sol HORIZONTAL ($y=0$), pas le point de chute sur le
          plan incliné donné. Ici le sol d'arrivée obéit à
          $y = -x\tan\alpha$, pas à $y=0$ : il faut résoudre l'intersection
          des deux courbes, pas la portée d'un sol plat qui n'existe pas
          dans cet énoncé.
      - id: C
        text: >-
          $OE \approx 54{,}9\ \text{m}$
        correct: true
      - id: D
        text: >-
          $OE \approx 45{,}5\ \text{m}$
        correct: false
        misconception: mc.physics.pc_chute_plans.signe-et-projection-mal-poses
        feedback: >
          Le passage de $x_E$ à $OE$ se fait en DIVISANT par $\cos\alpha$
          ($x_E$ est le côté adjacent d'un triangle rectangle dont $OE$ est
          l'hypoténuse), pas en multipliant : multiplier raccourcit encore
          la distance, alors que suivre une pente l'allonge par rapport à
          sa seule projection horizontale.
    correct_feedback: >
      Il faut d'abord résoudre l'intersection trajectoire/plan pour
      trouver $x_E = 50\ \text{m}$, puis convertir cette abscisse en
      distance le long du plan : $OE = x_E/\cos\alpha \approx
      54{,}9\ \text{m}$.
    solution: |
      La droite du plan incliné, qui descend depuis $O$, s'écrit
      $y_{plan}(x) = -x\tan\alpha$. Le point $E$ vérifie à la fois la
      trajectoire et cette droite :
      $$0{,}53\,x - 0{,}02\,x^2 = -0{,}47\,x$$
      $$x\left(1{,}00 - 0{,}02\,x\right) = 0$$
      Deux solutions : $x=0$ (le point $O$ lui-même) et
      $$x_E = \frac{1{,}00}{0{,}02} = 50\ \text{m}$$
      $E$ est sur le plan incliné, pas sur un axe horizontal : la distance
      $OE$ se relie à $x_E$ par le cosinus de l'angle du plan (le triangle
      rectangle formé par $O$, le pied de $E$ sur l'axe $x$, et $E$) :
      $$OE = \frac{x_E}{\cos\alpha} = \frac{50}{0{,}91} \approx
      54{,}9\ \text{m}$$

  - id: CMP-47
    rung: "R5"
    difficulty_level: 4
    habilete: résolution
    skill_code: pc_chute_plans
    tags: [misconception_driven, projectile, resolution]
    stem: >
      On veut qu'un projectile, lancé depuis le sol avec un angle
      $\alpha$ au-dessus de l'horizontale ($\sin\alpha=0{,}60$,
      $\cos\alpha=0{,}80$), atteigne une portée $D = 76{,}8\ \text{m}$ sur
      sol horizontal. On prend $g\approx9{,}8\ \text{m/s}^2$. Quelle
      vitesse initiale $v_0$ faut-il lui donner ?
    type: mcq
    choices:
      - id: A
        text: >-
          $v_0 = 28\ \text{m/s}$
        correct: true
      - id: B
        text: >-
          $v_0 \approx 39{,}6\ \text{m/s}$
        correct: false
        misconception: mc.physics.pc_chute_plans.equation-de-trajectoire-mal-etablie
        feedback: >
          Ce calcul oublie le facteur $2$ de $\sin(2\alpha) =
          2\sin\alpha\cos\alpha$ : diviser par $\sin\alpha\cos\alpha$ seul
          revient à utiliser une portée deux fois trop petite pour le
          même $v_0$, donc à surestimer la vitesse nécessaire.
      - id: C
        text: >-
          $v_0 \approx 64{,}7\ \text{m/s}$
        correct: false
        misconception: mc.physics.pc_chute_plans.equation-de-trajectoire-mal-etablie
        feedback: >
          Cette expression est celle de la FLÈCHE ($f =
          v_0^2\sin^2\alpha/(2g)$), isolée en $v_0$ — pas celle de la
          portée. La question demande la vitesse qui donne une PORTÉE $D$
          au sol, pas une flèche $D$ en hauteur : deux formules
          distinctes, deux résultats distincts.
      - id: D
        text: >-
          $v_0 \approx 784\ \text{m/s}$
        correct: false
        misconception: mc.physics.pc_chute_plans.portee-fleche-et-angle-mal-maitrises
        feedback: >
          Cette valeur est $v_0^2$ (en m²/s²), présentée directement comme
          si c'était $v_0$ : la portée dépend de $v_0^2$, pas de $v_0$, et
          il manque la racine carrée qui ramène de l'un à l'autre.
    correct_feedback: >
      $D = v_0^2\sin(2\alpha)/g$, avec $\sin(2\alpha) =
      2\times0{,}60\times0{,}80 = 0{,}96$. En isolant $v_0$ :
      $v_0 = \sqrt{gD/\sin(2\alpha)} = \sqrt{9{,}8\times76{,}8/0{,}96} =
      \sqrt{784} = 28\ \text{m/s}$.
    solution: |
      $$D = \frac{v_0^2\sin(2\alpha)}{g} \implies v_0 =
      \sqrt{\frac{gD}{\sin(2\alpha)}}$$
      $$\sin(2\alpha) = 2\sin\alpha\cos\alpha = 2\times0{,}60\times0{,}80 =
      0{,}96$$
      $$v_0 = \sqrt{\frac{9{,}8\times76{,}8}{0{,}96}} = \sqrt{\frac{752{,}64}
      {0{,}96}} = \sqrt{784} = 28\ \text{m/s}$$

  - id: CMP-48
    rung: "R10"
    difficulty_level: 4
    habilete: résolution
    skill_code: pc_chute_plans
    tags: [misconception_driven, kepler_geostationnaire, resolution]
    stem: >
      Un satellite naturel orbite en cercle autour d'une planète de rayon
      $R = 2{,}0\times10^5\ \text{m}$, à une altitude
      $h = 2{,}8\times10^6\ \text{m}$ au-dessus de sa surface, avec une
      période $T = 1{,}25$ jours. On donne
      $G \approx 6{,}67\times10^{-11}\ \text{N.m}^2.\text{kg}^{-2}$.
      Quelle est la masse $M$ de la planète ?
    type: mcq
    choices:
      - id: A
        text: >-
          $M \approx 1{,}4\times10^{21}\ \text{kg}$
        correct: true
      - id: B
        text: >-
          $M \approx 1{,}1\times10^{21}\ \text{kg}$
        correct: false
        misconception: mc.physics.pc_chute_plans.kepler3-donnees-non-preparees
        feedback: >
          Cette valeur utilise $r = h = 2{,}8\times10^6\ \text{m}$ (l'altitude
          seule) à la place du rayon de l'orbite, mesuré depuis le CENTRE de
          la planète : $r = R + h = 2{,}0\times10^5+2{,}8\times10^6 =
          3{,}0\times10^6\ \text{m}$. La 3e loi de Kepler porte sur ce rayon
          $r$, jamais sur l'altitude seule au-dessus de la surface.
      - id: C
        text: >-
          $M \approx 7{,}9\times10^{23}\ \text{kg}$
        correct: false
        misconception: mc.physics.pc_chute_plans.kepler3-donnees-non-preparees
        feedback: >
          Cette valeur utilise $T = 1{,}25\times3\,600 = 4\,500\ \text{s}$, en
          traitant les $1{,}25$ JOURS de l'énoncé comme s'ils étaient déjà
          des HEURES avant de passer aux secondes. Il faut d'abord convertir
          les jours en heures ($\times24$), puis les heures en secondes
          ($\times3\,600$) : $T = 1{,}25\times24\times3\,600 =
          108\,000\ \text{s}$, pas $4\,500\ \text{s}$.
      - id: D
        text: >-
          $M \approx 4{,}6\times10^{14}\ \text{kg}$
        correct: false
        misconception: mc.physics.pc_chute_plans.kepler3-exposants-inverses
        feedback: >
          Cette expression vient d'une 3e loi retenue comme $T^2/r^2$ =
          constante, avec le rayon au carré au lieu du cube. L'établissement
          (égaler $v=\sqrt{GM/r}$ et $v=2\pi r/T$) donne $T^2/r^3 =
          4\pi^2/GM$ : c'est bien le CUBE de $r$ qui doit figurer au
          dénominateur une fois $M$ isolée.
    correct_feedback: >
      $T = 1{,}25\times24\times3\,600 = 108\,000\ \text{s}$ ; le rayon de
      l'orbite se mesure depuis le centre de la planète,
      $r = R+h = 2{,}0\times10^5+2{,}8\times10^6 = 3{,}0\times10^6\ \text{m}$
      (pas l'altitude $h$ seule). $M = 4\pi^2 r^3/(GT^2) \approx
      1{,}4\times10^{21}\ \text{kg}$.
    solution: |
      **Le rayon de l'orbite, pas l'altitude.** La 3e loi de Kepler porte sur
      la distance au CENTRE de la planète, pas sur la hauteur au-dessus de sa
      surface :
      $$r = R + h = 2{,}0\times10^5 + 2{,}8\times10^6 = 3{,}0\times10^6\ \text{m}$$

      **La conversion de la période, en secondes, jusqu'au bout.** $1{,}25$
      jours passe d'abord en heures ($\times24$), puis en secondes
      ($\times3\,600$) :
      $$T = 1{,}25\times24\times3\,600 = 108\,000\ \text{s} = 1{,}08\times10^5\ \text{s}$$

      **La 3e loi de Kepler**, établie en égalant $v=\sqrt{GM/r}$ et
      $v=2\pi r/T$ :
      $$\frac{T^2}{r^3} = \frac{4\pi^2}{GM} \implies M = \frac{4\pi^2 r^3}{GT^2}$$
      $$
      M = \frac{4\pi^2\times(3{,}0\times10^6)^3}
      {6{,}67\times10^{-11}\times(1{,}08\times10^5)^2}
      = \frac{39{,}48\times2{,}7\times10^{19}}
      {6{,}67\times10^{-11}\times1{,}1664\times10^{10}}
      $$
      $$M = \frac{1{,}07\times10^{21}}{0{,}778} \approx
      1{,}4\times10^{21}\ \text{kg}$$

      Deux pièges à distinguer de la bonne démarche : confondre le rayon de
      l'orbite avec l'altitude seule (donne $1{,}1\times10^{21}$), et
      confondre les jours de l'énoncé avec des heures avant de convertir en
      secondes (donne $7{,}9\times10^{23}$).

