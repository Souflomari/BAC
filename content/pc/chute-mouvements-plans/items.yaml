      - id: B
        text: "Elle n'apparaît nulle part : elle a déjà disparu des la deuxième loi de Newton ($\\vec a_G = \\vec g$), avant même d'écrire $x(t)$ et $y(t)$"
        correct: true
      - id: C
        text: "Elle est cachée dans le terme $g$, qui dépend en réalité légèrement de la masse du projectile considéré"
        correct: false
        feedback: >
          $g$ est l'accélération de pesanteur du lieu, indépendante de la
