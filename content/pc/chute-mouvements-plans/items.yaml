      $y(x) = \tan\alpha \cdot x - \dfrac{g}{2v_0^2\cos^2\alpha}x^2$ a ete
      obtenue en eliminant le temps entre $x(t)$ et $y(t)$. Que peut-on dire
      de la masse $m$ du projectile dans cette equation ?
    type: mcq
    choices:
      - id: A
        text: "Elle a disparu seulement a cette etape, en se simplifiant lors de l'elimination du temps"
        correct: false
        feedback: >
          Elle avait deja disparu bien avant : des la deuxieme loi de Newton,
          $\vec a_G = \vec g$ ne contient plus $m$. L'elimination du temps
          n'a rien simplifie de plus a ce sujet.
      - id: B
        text: "Elle n'apparait nulle part : elle a deja disparu des la deuxieme loi de Newton ($\\vec a_G = \\vec g$), avant meme d'ecrire $x(t)$ et $y(t)$"
        correct: true
      - id: C
        text: "Elle est cachee dans le terme $g$, qui depend en realite legerement de la masse du projectile"
        correct: false
        feedback: >
          $g$ est l'acceleration de pesanteur du lieu, independante de la
          masse de l'objet qui tombe : ce n'est pas une propriete du
          projectile.
      - id: D
        text: "Elle intervient implicitement a travers $v_0$, qui depend de la masse du lanceur"
        correct: false
        feedback: >
          $v_0$ est une donnee du probleme (la vitesse a laquelle l'objet est
          lance), pas une consequence de la masse de qui que ce soit dans
          cette equation.
    correct_feedback: >
      Exact : $m$ disparait des la deuxieme loi de Newton
      ($\vec a_G = \vec g$), donc elle n'a jamais figure dans $x(t)$, $y(t)$,
      ni dans $y(x)$.
    solution: |
      $m\vec a_G = m\vec g \implies \vec a_G = \vec g$ : $m$ se simplifie des
      cette premiere etape. Toutes les equations qui suivent ($x(t)$, $y(t)$,
      $y(x)$) en heritent, sans jamais faire reapparaitre $m$.

