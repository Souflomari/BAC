      - id: C
        text: "Cela dépend de l'angle de lancement : plus l'angle est grand, plus le poids agit horizontalement"
        correct: false
        feedback: >
          L'angle de lancement change la direction de la vitesse initiale,
          pas la direction du poids : celui-ci reste vertical quel que soit
          l'angle choisi.
      - id: D
        text: "Non, aucun : une force purement verticale n'a pas de composante horizontale, donc elle ne peut pas modifier le mouvement horizontal"
        correct: true
    correct_feedback: >
      Exact : projete sur l'axe horizontal, le poids donne une composante
      nulle à chaque instant, donc $a_x = 0$ quel que soit l'angle de
      lancement.
    solution: |
      Le poids $\vec P = m\vec g$ est purement vertical. Sa projection sur
      un axe horizontal vaut $0$ a tout instant, donc $a_x = 0$ : aucune
      force horizontale n'agit, quel que soit l'angle de lancement.

  - id: CMP-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      On étudie une chute libre verticale avec un axe $Oy$ orienté vers le
      HAUT. Un élève écrit $a_y = +g$ au lieu de $a_y = -g$. D'ou vient cette
      erreur ?
    type: mcq
    choices:
      - id: A
        text: "Il a oublié que $\\vec g$ pointe vers le bas, donc dans le sens opposé à $Oy$ : sa composante sur cet axe est négative, $a_y = -g$"
        correct: true
      - id: B
        text: "Il n'y a aucune erreur : $a_y = +g$ reste vrai quel que soit le sens choisi pour orienter l'axe"
        correct: false
        feedback: >
          Le signe de $a_y$ dépend entièrement du sens choisi pour $Oy$. Avec
          $Oy$ vers le haut, $\vec g$ (vers le bas) a une composante
          négative : $a_y = -g$, pas $+g$.
      - id: C
        text: "L'erreur vient d'avoir oublié la masse du projectile dans l'écriture de la deuxième loi de Newton"
        correct: false
        feedback: >
          La masse n'est pas en cause ici : elle se simplifie des le départ
          ($\vec a = \vec g$). L'erreur porte uniquement sur le signe, lie a
          l'orientation de l'axe.
      - id: D
        text: "L'erreur vient d'avoir pris une vitesse initiale positive au lieu de la prendre négative sur cet axe"
        correct: false
        feedback: >
          Le signe de $v_{0y}$ est indépendant de celui de $a_y$ : c'est une
          erreur sur l'accélération (projection de $\vec g$), pas sur la
          vitesse initiale.
    correct_feedback: >
      Avec $Oy$ vers le haut, $\vec g$ pointe dans le sens oppose a l'axe :
      $g_y = -g$, donc $a_y = -g$. Ce signe vient uniquement du choix
      d'orientation de l'axe, pas d'une règle universelle.
    solution: |
      $Oy$ vers le haut, $\vec g$ vers le bas : $\vec g$ est oppose au sens
      de l'axe, donc sa composante est négative.
      $$a_y = g_y = -g$$
      Avec $Oy$ vers le bas, on aurait trouve $a_y = +g$ : le signe suit le
      choix d'axe, il n'est pas fixe une fois pour toutes.

  - id: CMP-11
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Une balle est lancée verticalement vers le haut avec une vitesse
      initiale $v_{0y}=9{,}8\ \text{m/s}$, depuis le sol. Elle atteint son
      sommet a $t=1{,}0\ \text{s}$. Combien de temps met-elle, après ce
      sommet, pour retomber au sol ?
    type: mcq
    choices:
      - id: A
        text: "Moins de 1,0 s, car en redescendant la balle est plus rapide donc elle met moins de temps"
        correct: false
        feedback: >
          Aller plus vite a l'arrivée ne veut pas dire mettre moins de temps :
          $y(t)$ est une parabole symétrique par rapport a son sommet, ce qui
          impose une durée de descente égale a celle de la montee.
      - id: B
        text: "Exactement 1,0 s : la montee et la descente prennent le même temps, par symétrie de $y(t)$"
        correct: true
      - id: C
        text: "Plus de 1,0 s, car il faut d'abord que la vitesse s'annule avant de pouvoir redescendre"
        correct: false
        feedback: >
          La vitesse s'annule justement AU sommet, a $t=1{,}0\ \text{s}$ : ce
          n'est pas un delai supplémentaire, c'est l'instant même ou la
          montee se termine et la descente commence.
      - id: D
        text: "Impossible à savoir sans connaître la hauteur exacte atteinte au sommet"
        correct: false
        feedback: >
          La symétrie de la parabole $y(t)$ donne directement
          $t_{sol} = 2\,t_{sommet}$, sans avoir besoin de calculer la hauteur
          du sommet.
    correct_feedback: >
      $t_{sol} = 2\,t_{sommet}$ : la parabole $y(t)$ est symétrique par
      rapport a son sommet, donc montee et descente prennent exactement le
      même temps, ici $1{,}0\ \text{s}$ chacune.
    solution: |
      $y(t) = v_{0y}t - \frac{1}{2}gt^2$ est une parabole en $t$, symétrique
      par rapport a $t_{sommet}$. Donc $t_{sol} = 2\,t_{sommet} = 2{,}0\
      \text{s}$, soit $2{,}0 - 1{,}0 = 1{,}0\ \text{s}$ après le sommet.

  - id: CMP-12
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un projectile est lance avec une vitesse initiale de norme $v_0$,
      faisant un angle $\alpha$ au-dessus de l'horizontale. Quelle est
      l'expression correcte de sa composante verticale initiale $v_{0y}$ ?
    type: mcq
    choices:
      - id: A
        text: "$v_{0y} = v_0 \\cos\\alpha$"
        correct: false
        feedback: >
          C'est l'expression de $v_{0x}$, pas de $v_{0y}$ : $\cos\alpha$
          projette sur l'axe horizontal, $\sin\alpha$ sur l'axe vertical.
      - id: B
        text: "$v_{0y} = v_0 \\tan\\alpha$"
        correct: false
        feedback: >
          $\tan\alpha$ est le rapport $v_{0y}/v_{0x}$, pas une composante de
          $v_0$ elle-même : ce n'est pas la bonne fonction trigonométrique
          pour projeter directement $v_0$.
      - id: C
        text: "$v_{0y} = v_0 \\sin\\alpha$"
        correct: true
      - id: D
        text: "$v_{0y} = v_0$"
        correct: false
        feedback: >
          Cela reviendrait a ignorer l'angle $\alpha$, comme si tout $v_0$
          était vertical : ce n'est vrai que dans le cas particulier
          $\alpha = 90^\circ$.
    correct_feedback: >
      Exact : $v_{0y} = v_0\sin\alpha$. Vérification aux cas extrêmes :
      $\alpha=90^\circ$ donne $v_{0y}=v_0$ (lancer vertical), $\alpha=0^\circ$
      donne $v_{0y}=0$ (lancer horizontal).
    solution: |
      La projection de $\vec v_0$ sur l'axe vertical $Oy$ donne
      $v_{0y} = v_0\sin\alpha$, et sur l'axe horizontal $Ox$,
      $v_{0x} = v_0\cos\alpha$ — deux fonctions trigonometriques distinctes
      pour deux axes distincts.

  - id: CMP-13
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Pour un projectile soumis uniquement a son poids (frottements
      négligés), pourquoi peut-on affirmer que $a_x = 0$ à chaque instant du
      vol ?
    type: mcq
    choices:
      - id: A
        text: "Parce que la vitesse horizontale initiale $v_{0x}$ est toujours nulle au départ du mouvement"
        correct: false
        feedback: >
          $v_{0x}$ n'est nulle que dans le cas particulier d'un lancer
          vertical ($\alpha=90^\circ$). En général $v_{0x}=v_0\cos\alpha \neq
          0$, et pourtant $a_x=0$ quand même.
      - id: B
        text: "Parce que la masse du projectile est trop faible pour que $g$ puisse agir horizontalement sur lui"
        correct: false
        feedback: >
          La masse n'a aucun rôle ici : $a_x=0$ vient uniquement de la
          direction du poids (verticale), pas de la valeur de la masse,
          petite ou grande.
      - id: C
        text: "Parce qu'au sommet de la trajectoire la vitesse horizontale s'annule elle aussi, ce qui donne $a_x=0$"
        correct: false
        feedback: >
          C'est $v_y$ qui s'annule au sommet, pas $v_x$ : $v_x$ garde la
          valeur $v_{0x}$ à chaque instant, y compris au sommet.
      - id: D
        text: "Parce que le poids est une force purement verticale : sa projection sur l'axe horizontal est nulle à chaque instant"
        correct: true
    correct_feedback: >
      Oui : le poids est la seule force, et il est purement vertical, donc sa
      composante sur $Ox$ est nulle a tout instant, d'ou $a_x=0$ tout au long
      du vol.
    solution: |
      Bilan : seul $\vec P = m\vec g$ agit. Projection sur $Ox$ :
      $$m a_x = P_x = 0 \implies a_x = 0$$
      Ceci vient de la direction de $\vec P$ (verticale), et non de la masse
      ni des conditions initiales.

  - id: CMP-14
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      Un projectile est lance avec $v_0 = 20\ \text{m/s}$ et $\alpha=45^\circ$
      (donc $\sin\alpha=\cos\alpha\approx 0{,}71$, $\cos^2\alpha=0{,}50$,
      $\tan\alpha=1{,}0$), $g\approx 9{,}8\ \text{m/s}^2$. Quelle est
      l'équation de sa trajectoire $y(x)$ ?
    type: mcq
    choices:
      - id: A
        text: "$y(x) = x - 0{,}0245\\,x^2$"
        correct: true
      - id: B
        text: "$y(x) = x - 0{,}049\\,x^2$"
        correct: false
        feedback: >
          Ce coefficient oublie le facteur $2$ au dénominateur :
          $g/(2v_0^2\cos^2\alpha)$, pas $g/(v_0^2\cos^2\alpha)$.
      - id: C
        text: "$y(x) = x - 0{,}0173\\,x^2$"
        correct: false
        feedback: >
          Ce coefficient utilise $\cos\alpha$ au lieu de $\cos^2\alpha$ au
          dénominateur : la formule exige le carré de $\cos\alpha$.
      - id: D
        text: "$y(x) = x + 0{,}0245\\,x^2$"
        correct: false
        feedback: >
          Erreur de signe : la parabole s'ouvre vers le BAS (le second terme
          se retranche), conséquence directe du signe négatif de $g$ dans
          $a_y=-g$.
    correct_feedback: >
      $y(x) = \tan\alpha\cdot x - \dfrac{g}{2v_0^2\cos^2\alpha}x^2 = x -
      0{,}0245\,x^2$, avec $\tan\alpha=1{,}0$ et
      $g/(2\times400\times0{,}50)=0{,}0245$.
    solution: |
      $$y(x) = \tan\alpha \cdot x - \frac{g}{2v_0^2\cos^2\alpha}x^2$$
      $$y(x) = 1{,}0\,x - \frac{9{,}8}{2\times 400\times 0{,}50}\,x^2 =
      x - 0{,}0245\,x^2$$

  - id: CMP-15
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_chute_plans
    tags: []
    stem: >
      L'équation de la trajectoire
      $y(x) = \tan\alpha \cdot x - \dfrac{g}{2v_0^2\cos^2\alpha}x^2$ a été
