  resolution_2026_09_28_suite: >-
    Le coordinateur a jugé, à raison, le placeholder ci-dessus inacceptable :
    un distracteur tagué sur un id dont la description ne nomme pas son
    mécanisme est un tag malhonnête. Corrigé le même jour :
    `kepler3-donnees-non-preparees` est déclarée (voir le bloc
    `misconceptions`, juste après `kepler3-exposants-inverses`), décrivant
    exactement les deux gestes — rayon compté depuis la surface au lieu du
    centre, durée non convertie en secondes avant d'être élevée au carré.
    CMP-48/B et CMP-48/C sont retagués sur ce nouvel id. Deux items neufs,
    CMP-49 (R10, teste le geste du rayon) et CMP-50 (R10, teste le geste de
    la durée), portent l'id à son plancher de 3 (CMP-48, CMP-49, CMP-50).
    Chiffres propres à chaque item — aucun repris de CMP-48, du sujet 2017
    (bk-2017-n-x4/2012-r-x4 : $r'=4{,}2\times10^8$, $T_{Io}=1{,}77$ j,
    $M_J=1{,}88\times10^{27}$ kg), de l'exemple travaillé de la leçon
    ($R_T=6{,}37\times10^6$, $M_T=5{,}97\times10^{24}$, $T=24$ h,
    $r=4{,}2\times10^7$, $h=3{,}6\times10^7$), ni de CMP-36 (qui réutilise
    cette dernière valeur de rayon). Les deux AUTRES distracteurs de CMP-49
    et CMP-50 restent sur `kepler3-exposants-inverses` (T²/r² et T/r), qui
    monte de 4 à 6 items (CMP-34/35/36/48/49/50) — aucun plafond déclaré
    pour cette notion, donc rien à arbitrer là.

    ÉCART DE GRANDEUR STRUCTUREL, VÉRIFIÉ ET NON CORRIGÉ. Les distracteurs
    `kepler3-exposants-inverses` de CMP-49 et CMP-50 restent barrables par
    ordre de grandeur (10¹²–10¹⁴ kg contre des clés à 10²⁰–10²¹ kg), et ce
    n'est pas un défaut de choix de chiffres : l'écart entre la forme
    correcte ($r^3/T^2$) et une forme aux exposants inversés (par exemple
    $r^2/T^2$) vaut exactement un facteur $r$ (ici $2\times10^6$ ou
    $6\times10^6$ mètres) — et $r$, pour une orbite réelle, ne peut pas être
    proche de 1 sans cesser d'être une orbite. Vérifié sur les trois formes
    pour les deux items : $T/r$ diverge de la clé par un facteur $r^2/T$
    (~$10^7$), $T^3/r^2$ par un facteur $rT$ (~$10^{11}$, la pire des
    trois — volontairement écartée des distracteurs neufs), $T^2/r^2$ par
    un facteur $r$ (~$10^6$, comparable à l'écart déjà accepté sur le
    distracteur D de CMP-48 lui-même, $\approx3\times10^6$). Un élève qui
    connaît l'ordre de grandeur réel d'une masse planétaire peut écarter ces
    deux-là sans calcul — mais ne peut PAS, par ce seul geste, trancher
    entre la clé et le distracteur `kepler3-donnees-non-preparees` de chaque
    item (CMP-50/B, $1{,}1\times10^{24}\ \text{kg}$, est une masse tout
    aussi plausible que la clé $1{,}9\times10^{21}\ \text{kg}$) : c'est là,
    et seulement là, que le calcul complet reste nécessaire. Les deux
    distracteurs `kepler3-exposants-inverses` de CMP-49/50 ne sont donc pas
    moins bien conçus que ceux, déjà en place, de CMP-34…36 et CMP-48 — ils
    partagent la même limite mathématique, propre à cette famille d'erreur
    à cette échelle physique, et non à un choix de nombres.
