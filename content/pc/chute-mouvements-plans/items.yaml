  - id: CMP-39
    rung: "R7"
    difficulty_level: 4
    habilete: utilisation
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, resolution]
    stem: >
      Une bille homogène, de masse volumique
      $\rho_{bille} = 3{,}0\times10^3\ \text{kg/m}^3$, est lâchée sans vitesse
      initiale dans un liquide de masse volumique
      $\rho_{liquide} = 1{,}2\times10^3\ \text{kg/m}^3$ (frottement linéaire,
      poussée d'Archimède non négligeable), avec $g\approx9{,}8\ \text{m/s}^2$.
      Quelle est l'accélération initiale $a_0$ de la bille, c'est-à-dire la
      pente de la tangente à l'origine sur la courbe $v=f(t)$ ?
    type: mcq
    choices:
      - id: A
        text: "$a_0 \\approx 5{,}9\\ \\text{m/s}^2$ : strictement inférieur à $g$, la poussée d'Archimède retranchant déjà une part du poids dès $t=0$"
        correct: true
      - id: B
        text: "$a_0 = 9{,}8\\ \\text{m/s}^2$ : à $t=0$ la vitesse est nulle, donc seul le poids agit encore, exactement comme sans Archimède"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          C'est vrai que le frottement $kv$ est nul à $v=0$ — mais la poussée
          d'Archimède, elle, ne dépend pas de $v$ : elle est déjà pleinement
          présente dès le premier instant. L'accélération initiale n'est donc
          PAS $g$ dès que $\rho_{liquide}>0$, elle vaut
          $g(1-\rho_{liquide}/\rho_{bille})$.
      - id: C
        text: "$a_0 = 9{,}8\\times\\dfrac{\\rho_{liquide}}{\\rho_{bille}} \\approx 3{,}9\\ \\text{m/s}^2$ : la part que retranche la poussée d'Archimède au poids"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Ce calcul retrouve le bon rapport $\rho_{liquide}/\rho_{bille}=0{,}40$
          mais oublie le « $1-$ » : $a_0$ est l'accélération qui RESTE une fois
          la part d'Archimède retranchée du poids, pas cette part elle-même.
          Poussé à sa conséquence, ce modèle ferait CROÎTRE $a_0$ avec la
          densité du liquide au lieu de le réduire ; et pour un liquide aussi
          dense que la bille ($\rho_{liquide}=\rho_{bille}$), il donnerait
          encore $a_0=g$ — alors qu'une bille aussi dense que le liquide qui
          l'entoure ne coule même pas, elle flotte en équilibre ($a_0=0$).
      - id: D
        text: "$a_0 = 9{,}8\\times\\left(1-\\dfrac{\\rho_{bille}}{\\rho_{liquide}}\\right) \\approx -14{,}7\\ \\text{m/s}^2$ : la bille remonterait dès le départ"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Les deux masses volumiques sont interverties : c'est
          $\rho_{liquide}$ (celle du fluide déplacé) qui doit apparaître au
          numérateur du rapport retranché à $1$, jamais $\rho_{bille}$. Avec
          $\rho_{bille}>\rho_{liquide}$ ici, la bille coule bel et bien
          ($a_0>0$), elle ne remonte pas.
    correct_feedback: >
      Exact : contrairement au frottement $kv$ (nul à $v=0$), la poussée
      d'Archimède ne dépend pas de la vitesse et agit déjà pleinement à
      $t=0$. Le bilan donne
      $a_0=(mg-F_A)/m=g(1-\rho_{liquide}/\rho_{bille})=9{,}8\times(1-0{,}40)
      \approx5{,}9\ \text{m/s}^2$, strictement inférieur à $g$.
    solution: |
      Bilan à $t=0$ ($v=0$, donc frottement $kv$ nul, mais Archimède déjà
      présente) :
      $$m\frac{dv}{dt}\bigg|_{t=0} = mg - F_A = mg - \rho_{liquide}Vg$$
      Avec $m=\rho_{bille}V$ :
      $$a_0 = g - \frac{\rho_{liquide}Vg}{\rho_{bille}V} =
      g\left(1-\frac{\rho_{liquide}}{\rho_{bille}}\right)$$
      $$a_0 = 9{,}8\times\left(1-\frac{1{,}2\times10^3}{3{,}0\times10^3}\right)
      = 9{,}8\times(1-0{,}40) = 9{,}8\times0{,}60 \approx 5{,}9\ \text{m/s}^2$$

  - id: CMP-40
    rung: "R7"
    difficulty_level: 4
    habilete: résolution
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, resolution]
    stem: >
      Une bille homogène de masse volumique
      $\rho_{bille}=2{,}5\times10^3\ \text{kg/m}^3$ tombe dans un liquide
      (frottement linéaire, poussée d'Archimède non négligeable),
      $g\approx9{,}8\ \text{m/s}^2$. Sur la courbe $v=f(t)$ obtenue, la
      vitesse limite vaut $v_\ell=0{,}45\ \text{m/s}$ et la tangente à
      l'origine coupe l'asymptote au point d'abscisse $t=\tau=0{,}15\ \text{s}$.
      Quelle est la masse volumique $\rho_{liquide}$ du liquide ?
    type: mcq
    choices:
      - id: A
        text: "$\\rho_{liquide} \\approx 1{,}73\\times10^3\\ \\text{kg/m}^3$, obtenue via $a_0=v_\\ell/\\tau$ puis $\\rho_{liquide}=\\rho_{bille}(1-a_0/g)$"
        correct: true
      - id: B
        text: "$\\rho_{liquide} \\approx 2{,}39\\times10^3\\ \\text{kg/m}^3$, en prenant directement $a_0=v_\\ell=0{,}45\\ \\text{m/s}$ sans diviser par $\\tau$"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          $v_\ell$ est une VITESSE limite, pas une accélération : il faut
          d'abord obtenir $a_0=v_\ell/\tau=0{,}45/0{,}15=3{,}0\ \text{m/s}^2$
          (le régime initial), et c'est CETTE valeur, pas $v_\ell$
          directement, qui entre dans $\rho_{liquide}=\rho_{bille}(1-a_0/g)$.
      - id: C
        text: "$\\rho_{liquide} \\approx 7{,}65\\times10^2\\ \\text{kg/m}^3$, en calculant $\\rho_{bille}\\times(a_0/g)$ plutôt que $\\rho_{bille}\\times(1-a_0/g)$"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Ce calcul retrouve le bon rapport $a_0/g$ mais oublie le
          « $1-$ » : $\rho_{liquide}/\rho_{bille}$ est ce qui MANQUE au
          rapport $a_0/g$ pour atteindre $1$, pas ce rapport lui-même.
          Poussé à sa conséquence, ce modèle ferait CROÎTRE $a_0$ avec la
          densité du liquide au lieu de le réduire ; et pour un liquide
          aussi dense que la bille ($\rho_{liquide}=\rho_{bille}$), il
          donnerait encore $a_0=g$ — alors qu'une bille aussi dense que le
          liquide qui l'entoure ne coule même pas, elle flotte en équilibre
          ($a_0=0$).
      - id: D
        text: "$\\rho_{liquide} \\approx 3{,}60\\times10^3\\ \\text{kg/m}^3$, en isolant $\\rho_{liquide}$ dans $a_0=g\\!\\left(1-\\rho_{bille}/\\rho_{liquide}\\right)$"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          Les deux masses volumiques sont interverties dans la formule de
          départ : c'est $\rho_{liquide}$ qui doit apparaître au numérateur
          du rapport retranché à $1$ dans
          $a_0=g(1-\rho_{liquide}/\rho_{bille})$, jamais $\rho_{bille}$.
    correct_feedback: >
      Exact : $a_0=v_\ell/\tau=0{,}45/0{,}15=3{,}0\ \text{m/s}^2$ (le régime
      initial, lu comme au chapitre 7), puis
      $\rho_{liquide}=\rho_{bille}(1-a_0/g)=2{,}5\times10^3\times(1-3{,}0/9{,}8)
      \approx1{,}73\times10^3\ \text{kg/m}^3$.
    solution: |
      Régime initial obtenu depuis les deux lectures graphiques :
      $$a_0 = \frac{v_\ell}{\tau} = \frac{0{,}45}{0{,}15} = 3{,}0\ \text{m/s}^2$$
      Or $a_0 = g\left(1-\dfrac{\rho_{liquide}}{\rho_{bille}}\right)$, donc :
      $$\rho_{liquide} = \rho_{bille}\left(1-\frac{a_0}{g}\right) =
      2{,}5\times10^3\times\left(1-\frac{3{,}0}{9{,}8}\right) \approx
      1{,}73\times10^3\ \text{kg/m}^3$$

  - id: CMP-41
    rung: "R7"
    difficulty_level: 4
    habilete: application_experimentale
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, application_experimentale]
    stem: >
      Une bille de masse $m=0{,}15\ \text{kg}$ tombe dans un liquide
      (frottement linéaire, poussée d'Archimède non négligeable),
      $g\approx9{,}8\ \text{m/s}^2$. Sur la courbe $v=f(t)$ obtenue, la
      tangente à l'origine coupe l'asymptote horizontale au point d'abscisse
      $t=0{,}25\ \text{s}$, et la vitesse limite lue vaut
      $v_\ell=1{,}5\ \text{m/s}$. Que vaut le coefficient de frottement $k$ ?
    type: mcq
    choices:
      - id: A
        text: "$k = m/\\tau = 0{,}15/0{,}25 = 0{,}60\\ \\text{kg/s}$ : $1/\\tau$ ne contient jamais la poussée d'Archimède, qui n'affecte que le terme constant"
        correct: true
      - id: B
        text: "$k = mg/v_\\ell = 0{,}15\\times9{,}8/1{,}5 \\approx 0{,}98\\ \\text{kg/s}$ : en régime permanent, le frottement égale tout le poids"
        correct: false
        misconception: mc.physics.pc_chute_plans.archimede-mal-situee-dans-le-modele
        also_reveals: []
        feedback: >
          En régime permanent avec Archimède, c'est $mg-F_A=k v_\ell$, pas
          $mg=k v_\ell$ : cette formule oublie $F_A$. Mais surtout, $\tau$ et
          $k$ sont liés par $\tau=m/k$ SANS jamais faire intervenir Archimède :
          pas besoin de passer par $v_\ell$ ici, la seule lecture de $\tau$
          suffit.
      - id: C
        text: "Une fois la vitesse limite atteinte, le frottement a disparu : $k$ n'a alors plus de sens et vaut $0\\ \\text{kg/s}$"
        correct: false
        misconception: mc.physics.pc_chute_plans.frottement-disparait-a-vlim
        also_reveals: []
        feedback: >
          Au contraire : à $v_\ell$, le frottement est maximal, exactement
          égal au poids restant ($kv_\ell=mg-F_A$) — ce n'est pas lui qui
          disparaît, c'est la somme des forces. Le coefficient $k$ est une
          constante du dispositif : il ne dépend ni du temps ni du régime
          atteint.
      - id: D
        text: "La bille n'atteint en réalité jamais de vrai palier : la valeur lue $\\tau=0{,}25\\ \\text{s}$ ne correspond à rien de physique, et $k$ ne peut pas s'en déduire"
        correct: false
        misconception: mc.physics.pc_chute_plans.acceleration-indefinie-avec-frottement
        also_reveals: []
        feedback: >
          La courbe présente au contraire une vraie asymptote : l'accélération
          décroît continûment vers $0$ à mesure que le frottement rejoint le
          poids restant, jusqu'à un palier réel. La tangente à l'origine,
          coupant cette asymptote à $t=\tau$, donne directement $k=m/\tau$.
    correct_feedback: >
      Exact : $\tau=m/k$ vient du coefficient de $v$ dans l'équation
      différentielle, $dv/dt=A-v/\tau$ — un coefficient qui ne contient
      jamais la poussée d'Archimède (elle ne dépend pas de $v$, elle ne
      modifie que la constante $A$). Donc
      $k=m/\tau=0{,}15/0{,}25=0{,}60\ \text{kg/s}$, qu'il y ait Archimède ou
      non.
    solution: |
      L'équation différentielle, avec ou sans Archimède, garde la forme
      $$\frac{dv}{dt} = A - \frac{1}{\tau}v \qquad \text{avec} \qquad
      \tau = \frac{m}{k}$$
      seule la constante $A$ change avec Archimède ($A=g(1-\rho_f/\rho_s)$),
      jamais le coefficient $1/\tau$. La lecture graphique donne
      $\tau=0{,}25\ \text{s}$, donc :
      $$k = \frac{m}{\tau} = \frac{0{,}15}{0{,}25} = 0{,}60\ \text{kg/s}$$

  - id: CMP-42
    rung: "R7"
    difficulty_level: 4
    habilete: utilisation
    skill_code: pc_chute_plans
    tags: [misconception_driven, frottement_fluide, utilisation]
    stem: >
      Une bille de masse $m=0{,}50\ \text{kg}$ tombe dans l'air, en subissant
      un frottement quadratique $f=\alpha v^2$ (poussée d'Archimède
      négligée, comme il se doit dans l'air), $g\approx9{,}8\ \text{m/s}^2$.
      Sur la courbe $v=f(t)$ obtenue expérimentalement, on lit une vitesse
      limite $v_\ell=3{,}5\ \text{m/s}$. Quelle est la valeur du coefficient
      de frottement $\alpha$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\alpha = mg/v_\\ell^2 = 0{,}50\\times9{,}8/3{,}5^2 \\approx 0{,}40\\ \\text{kg/m}$ : en régime permanent, le frottement égale exactement le poids"
        correct: true
      - id: B
        text: "À la vitesse limite, le frottement a disparu : $\\alpha$ n'a alors plus de sens physique et ne peut pas se déduire de $v_\\ell$"
        correct: false
        misconception: mc.physics.pc_chute_plans.frottement-disparait-a-vlim
        also_reveals: []
        feedback: >
          Modèle détecté : à $v_\ell$, le frottement est au contraire
          MAXIMAL, exactement égal au poids ($\alpha v_\ell^2=mg$) — c'est
          précisément cette égalité qui permet d'en tirer
          $\alpha=mg/v_\ell^2$.
      - id: C
        text: "La bille n'atteint en réalité pas de vraie vitesse limite : la valeur $v_\\ell=3{,}5\\ \\text{m/s}$ lue n'est qu'approximative, et $\\alpha$ ne peut pas s'en déduire précisément"
        correct: false
        misconception: mc.physics.pc_chute_plans.acceleration-indefinie-avec-frottement
        also_reveals: []
        feedback: >
          La courbe présente au contraire un vrai palier : l'accélération
          décroît continûment vers $0$ à mesure que le frottement
          $\alpha v^2$ se rapproche du poids, jusqu'à un régime permanent
          réel — d'où $\alpha=mg/v_\ell^2$ directement.
      - id: D
        text: "$\\alpha = g/v_\\ell^2 \\approx 9{,}8/12{,}25 \\approx 0{,}80\\ \\text{kg/m}$, la masse n'intervenant pas dans le régime permanent (comme en chute libre)"
        correct: false
        misconception: mc.physics.pc_chute_plans.masse-jamais-determinante-en-chute
        also_reveals: []
        feedback: >
          La formule $\alpha=mg/v_\ell^2$ contient explicitement $m$ :
          l'omettre revient à traiter cette chute comme une chute libre,
          alors que dès qu'un frottement fluide entre en jeu, la masse ne
          disparaît plus. Avec $m=0{,}50\ \text{kg}$,
          $\alpha\approx0{,}40\ \text{kg/m}$, pas $0{,}80$.
    correct_feedback: >
      Exact : en régime permanent le frottement égale le poids,
      $\alpha v_\ell^2=mg$, d'où $\alpha=mg/v_\ell^2$. Numériquement,
      $\alpha=0{,}50\times9{,}8/3{,}5^2=4{,}9/12{,}25\approx0{,}40\
      \text{kg/m}$.
    solution: |
      $$\frac{dv}{dt} = g - \frac{\alpha}{m}v^2$$
      En régime permanent ($dv/dt=0$) :
      $$mg = \alpha v_\ell^2 \implies \alpha = \frac{mg}{v_\ell^2} =
      \frac{0{,}50\times9{,}8}{3{,}5^2} = \frac{4{,}9}{12{,}25} =
      0{,}40\ \text{kg/m}$$
      C'est l'inversion de la même relation que celle qui donne $v_\ell$ à
      partir de $\alpha$ : $v_\ell$ mesurée graphiquement, $m$ et $g$
      connus, il ne reste qu'à isoler $\alpha$.

  - id: CMP-43
    rung: "R11"
    difficulty_level: 4
    habilete: résolution
    skill_code: pc_chute_plans
    tags: [misconception_driven, projectile, resolution]
    stem: >
      Un projectile est lancé avec $v_0=50\ \text{m/s}$, $\sin\alpha=0{,}28$
      et $\cos\alpha=0{,}96$ (frottements négligés), $g\approx9{,}8\
      \text{m/s}^2$. Quelle est la norme $V$ de sa vitesse à l'instant
      $t=1{,}0\ \text{s}$ après le lancer ?
    type: mcq
    choices:
      - id: A
        text: "$V \\approx 48{,}2\\ \\text{m/s}$, en recomposant $v_x=48{,}0\\ \\text{m/s}$ (constante) et $v_y=4{,}2\\ \\text{m/s}$ par Pythagore"
        correct: true
      - id: B
        text: "$V \\approx 38{,}4\\ \\text{m/s}$, en prenant $v_x=v_{0x}-gt=38{,}2\\ \\text{m/s}$ : la composante horizontale ralentirait comme la verticale"
        correct: false
        misconception: mc.physics.pc_chute_plans.vx-varie-pendant-le-vol
        also_reveals: []
        feedback: >
          Le poids est purement vertical : $a_x=0$ à chaque instant, donc
          $v_x(t)=v_{0x}=48{,}0\ \text{m/s}$ reste rigoureusement constante
          tout le vol. Rien ne justifie de lui retrancher $gt$ : ce terme
          n'appartient qu'à $v_y(t)$.
      - id: C
        text: "$V \\approx 40{,}7\\ \\text{m/s}$, en prenant $v_{0y}=v_0\\cos\\alpha=48{,}0$ et $v_{0x}=v_0\\sin\\alpha=14{,}0\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_chute_plans.signe-et-projection-mal-poses
        also_reveals: []
        feedback: >
          Sinus et cosinus sont échangés : c'est $v_{0y}=v_0\sin\alpha=14{,}0\
          \text{m/s}$ qui projette $\vec v_0$ sur l'axe VERTICAL, et
          $v_{0x}=v_0\cos\alpha=48{,}0\ \text{m/s}$ sur l'axe horizontal — pas
          l'inverse.
      - id: D
        text: "$V \\approx 58{,}0\\ \\text{m/s}$, en prenant $v_x=v_{0x}+gt=57{,}8\\ \\text{m/s}$ : le poids, cause de la chute, accélérerait aussi le mouvement horizontal"
        correct: false
        misconception: mc.physics.pc_chute_plans.poids-agit-sur-lhorizontale
        also_reveals: []
        feedback: >
          Le poids est purement vertical : sa projection sur l'axe horizontal
          est nulle à chaque instant, donc $a_x=0$. Rien, dans le bilan des
          forces, n'ajoute $gt$ à $v_x$ : cette composante ne dépend que de
          $v_{0x}$, jamais du temps écoulé.
    correct_feedback: >
      Exact : $v_x(t)=v_0\cos\alpha=50\times0{,}96=48{,}0\ \text{m/s}$ reste
      constante tout le vol (axe horizontal libre de toute force), tandis que
      $v_y(t)=v_0\sin\alpha-gt=50\times0{,}28-9{,}8\times1{,}0=4{,}2\
      \text{m/s}$. La norme se recompose par Pythagore :
      $V=\sqrt{48{,}0^2+4{,}2^2}=\sqrt{2321{,}64}\approx48{,}2\ \text{m/s}$.
    solution: |
      $$v_{0x} = v_0\cos\alpha = 50\times0{,}96 = 48{,}0\ \text{m/s}
      \qquad v_{0y} = v_0\sin\alpha = 50\times0{,}28 = 14{,}0\ \text{m/s}$$
      Le mouvement horizontal est uniforme ($a_x=0$) : $v_x(t)=v_{0x}$ à tout
      instant. Le mouvement vertical subit $g$ :
      $$v_y(t) = v_{0y} - gt = 14{,}0 - 9{,}8\times1{,}0 = 4{,}2\ \text{m/s}$$
      La vitesse à l'instant $t=1{,}0\ \text{s}$ se recompose par Pythagore,
      jamais par simple somme des composantes :
      $$V = \sqrt{v_x^2+v_y^2} = \sqrt{48{,}0^2+4{,}2^2} = \sqrt{2321{,}64}
      \approx 48{,}2\ \text{m/s}$$

