# chute AVEC frottement fluide linéaire (v_l = mg/k, régimes) ; méthode d'Euler
# (seule méthode numérique au programme) ; gravitation → mouvement circulaire
# uniforme → v = √(GM/r) ; 3e loi de Kepler CAS CIRCULAIRE. Pas d'intégration
