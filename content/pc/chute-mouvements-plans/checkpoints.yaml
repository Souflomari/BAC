#                          masse-influe-en-chute-libre.
#   cp-frottement-vlim   — rupture gate: la chute AVEC frottement, vitesse limite
#                          (à v_l l'accélération est nulle, PAS le frottement).
#                          Probes frottement-disparait-a-vlim.
#   cp-euler             — rupture gate: la méthode d'Euler (valeur approchée,
#                          facteur Δt, pente recalculée). Probes
