    intro: |-
      **Étude du mouvement de chute verticale d'une bille dans un liquide visqueux (examen national, session normale 2020, Exercice V).**

      On se propose d'étudier le mouvement de la chute verticale, avec frottement fluide, dans un liquide visqueux d'une bille homogène de masse $m$.

      À l'aide d'une caméra numérique et d'un logiciel adéquat, on suit l'évolution de la vitesse du centre d'inertie $G$ de la bille lors de sa chute verticale dans un liquide visqueux. On étudie le mouvement de $G$ dans un référentiel terrestre supposé galiléen. On repère la position de $G$, à chaque instant $t$, par son ordonnée $y$ sur l'axe vertical $(O, \vec{j})$ orienté vers le bas (figure 1).

      Les forces de frottement fluide exercées sur la bille sont modélisées par la force : $\vec{f} = -k\,v\,\vec{j}$ ; avec $v$ la vitesse instantanée de $G$ et $k$ une constante positive. On néglige la poussée d'Archimède par rapport aux autres forces exercées sur la bille.

      **Données :** $g = 10\ \text{m.s}^{-2}$ ; $m = 2{,}5 \cdot 10^{-2}\ \text{kg}$.

      **Figure 1 (schéma).** Axe vertical $(O, \vec{j})$ orienté vers le bas ; la bille (centre $G$) tombe dans le liquide visqueux le long d'une règle graduée ; ordonnée $y$ croissante vers le bas.

      **Figure 2 (courbe).** $v\ (\text{m.s}^{-1})$ en fonction de $t\ (\text{s})$ ; courbe croissante depuis $0$ vers un palier (vitesse limite) au voisinage de $v_\ell \approx 1{,}5\ \text{m.s}^{-1}$ ; ordonnées graduées $0{,}3,\ 0{,}6,\ 0{,}9,\ 1{,}2,\ 1{,}5$ ; abscisses graduées $0{,}15,\ 0{,}3,\ 0{,}45,\ 0{,}6$.

      **Tableau de mesures (pour la méthode d'Euler, pas $\Delta t = 0{,}015\ \text{s}$).**

      | $t$ | $v\ (\text{m.s}^{-1})$ | $a\ (\text{m.s}^{-2})$ |
      |-----|:---:|:---:|
      | / | / | / |
      | $t_1$ | $0{,}150$ | $a_1 = \ldots$ |
      | $t_2$ | $0{,}285$ | $8{,}10$ |
      | $t_3$ | $v_3 = \ldots$ | / |
    questions:
      - id: q1
        part: "Étude du mouvement de chute avec frottement — établir le modèle"
        stem: |-
          **(0,5 pt)** En appliquant la deuxième loi de Newton sur la bille, montrer que l'équation différentielle du mouvement du centre d'inertie $G$ s'écrit : $\dfrac{dv}{dt} + \dfrac{k}{m}\,v = g$.
        reasoning: |-
          On applique la méthode du rung 7 — bilan des forces, deuxième loi, projection sur l'axe choisi. Seules deux forces s'exercent ici (la poussée d'Archimède est explicitement négligée, contrairement à d'autres sujets sur cette même expérience) : le poids $\vec P=m\vec g$ et le frottement $\vec f=-k\,v\,\vec j$. Avec l'axe $(O,\vec j)$ orienté vers le bas, le poids se projette positivement et le frottement négativement (il s'oppose au mouvement). On projette, on divise par $m$, et on range le terme en $v$ à gauche pour retrouver la forme demandée.
        steps:
          - math: 'm\vec a = \vec P + \vec f'
            note: "Deuxieme loi de Newton ; deux forces seulement, Archimede negligee par hypothese."
          - math: 'm\frac{dv}{dt} = mg - k\,v'
            note: "Projection sur (O, j) oriente vers le bas : le poids +mg, le frottement -kv."
          - math: '\frac{dv}{dt} = g - \frac{k}{m}\,v'
            note: "On divise par la masse m."
          - math: '\boxed{\frac{dv}{dt} + \frac{k}{m}\,v = g}'
            note: "On range le terme en v a gauche : c'est la forme demandee."
      - id: q2
        stem: |-
          **(0,25 pt)** Trouver l'expression de la vitesse limite $v_\ell$ de $G$ en fonction de $g$, $m$ et $k$.
        reasoning: |-
          La vitesse limite est celle du régime permanent (rung 7) : on annule l'accélération dans l'équation différentielle — un calcul d'une ligne, jamais une résolution complète — et on isole $v_\ell$. Physiquement, à cet instant le frottement a grandi jusqu'à compenser exactement le poids.
        steps:
          - math: '\frac{dv}{dt} = 0 \implies g - \frac{k}{m}\,v_\ell = 0'
            note: "En regime permanent, l'acceleration s'annule dans l'equation differentielle."
          - math: '\boxed{v_\ell = \frac{mg}{k}}'
            note: "On isole la vitesse limite."
      - id: q3
        stem: |-
          **(0,25 pt)** La courbe de la figure 2 représente l'évolution de la vitesse $v$ du centre d'inertie $G$ de la bille. Déterminer graphiquement la valeur de $v_\ell$.
        reasoning: |-
          En régime permanent, la courbe $v=f(t)$ atteint un palier horizontal (rung 7) : la vitesse limite se lit directement comme l'ordonnée de ce palier, sans aucun calcul, une simple lecture d'échelle.

          $$v_\ell \approx 1{,}5\ \text{m.s}^{-1}$$
      - id: q4
        stem: |-
          **(0,5 pt)** Vérifier que, dans le système international d'unités, l'équation différentielle du mouvement de $G$ s'écrit ainsi : $\dfrac{dv}{dt} = 10 - 6{,}67\,v$.
        reasoning: |-
          L'équation établie à la question 1 est $\dfrac{dv}{dt}=g-\dfrac{k}{m}v$, et $g=10\ \text{m.s}^{-2}$ est déjà connu. Pour le coefficient $k/m$, pas besoin de $k$ isolément : en régime permanent $g=\dfrac{k}{m}v_\ell$ (question 2), donc $k/m=g/v_\ell$, avec $v_\ell$ lu à la question 3. On remplace, et le coefficient tombe.
        steps:
          - math: '\frac{k}{m} = \frac{g}{v_\ell} = \frac{10}{1{,}5} \approx 6{,}67\ \text{s}^{-1}'
            note: "De v_lim = mg/k on tire k/m = g/v_lim, avec v_lim lu sur la figure."
          - math: '\boxed{\frac{dv}{dt} = g - \frac{k}{m}\,v = 10 - 6{,}67\,v}'
            note: "On substitue g = 10 et k/m = 6,67 : la forme annoncee est bien verifiee."
      - id: q5a
        part: "Résolution numérique par la méthode d'Euler"
        stem: |-
          **(0,5 pt)** À l'aide des données du tableau et de la méthode d'Euler, calculer l'accélération $a_1$ à l'instant $t_1$.
        reasoning: |-
          L'accélération à un instant ne se lit pas dans le tableau : elle se recalcule à partir de la vitesse de ce même instant (rung 8), via l'équation différentielle vérifiée à la question 4. On applique donc $a_1 = 10 - 6{,}67\,v_1$ avec $v_1 = 0{,}150\ \text{m.s}^{-1}$.
        steps:
          - math: 'a_1 = 10 - 6{,}67\,v_1 = 10 - 6{,}67\times 0{,}150'
            note: "On evalue l'equation differentielle en v_1 = 0,150 m/s."
          - math: '\boxed{a_1 \approx 9{,}0\ \text{m.s}^{-2}}'
            note: "Deja un peu en dessous de g = 10 : la bille freine, le frottement a commence a mordre."
      - id: q5b
        stem: |-
          **(0,5 pt)** Calculer la vitesse $v_3$ à l'instant $t_3$, sachant que le pas de calcul est $\Delta t = 0{,}015\ \text{s}$.
        reasoning: |-
          On avance d'un pas d'Euler depuis $t_2$ (rung 8) : $v_3=v_2+a_2\Delta t$. Le tableau fournit directement $v_2=0{,}285\ \text{m.s}^{-1}$ et $a_2=8{,}10\ \text{m.s}^{-2}$ — inutile de recalculer $a_2$. Réflexe d'homogénéité : $a_2\Delta t$ multiplie une accélération par un temps, donc c'est bien une vitesse.
        steps:
          - math: 'v_3 = v_2 + a_2\,\Delta t = 0{,}285 + 8{,}10\times 0{,}015'
            note: "Recurrence d'Euler entre t2 et t3, avec les valeurs du tableau."
          - math: '\boxed{v_3 \approx 0{,}41\ \text{m.s}^{-1}}'
            note: "La suite des vitesses continue de croitre vers le palier v_ell = 1,5 m/s."

