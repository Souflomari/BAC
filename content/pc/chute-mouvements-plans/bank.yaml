        $v\approx 7{,}35\ \text{km/s}$, $T_1=2\pi r/v\approx
        1{,}754\ \text{h}$ (le $T_1\approx 1{,}75\ \text{h}$ que la question
        demande de vérifier) ; troisième loi de Kepler :
        $r_2=r_1(T_2/T_1)^{2/3}\approx 4{,}23\times10^4\ \text{km}$, d'où
        $h_2\approx 3{,}6\times10^4\ \text{km}$ (altitude géostationnaire).
    intro: |-
      **Étude du mouvement d'un satellite artificiel (examen national, session normale 2022, Exercice 4 — Partie 2).**

      Les satellites artificiels sont placés en orbite autour de la Terre, pour des utilisations variées telles la météorologie, les télécommunications, la recherche scientifique ainsi que le contrôle des frontières… L'objectif de cette partie est d'étudier quelques grandeurs caractérisant le mouvement d'un satellite artificiel autour de la Terre.

      On étudie le mouvement d'un satellite artificiel $S$ de masse $m_s$ dans un référentiel géocentrique supposé galiléen.

      On admet que la Terre présente une distribution de masse à symétrie sphérique.

      On néglige toutes les forces exercées sur le satellite $S$ devant la force d'attraction universelle exercée par la Terre ainsi que les dimensions de $S$ devant la distance qui le sépare du centre $O$ de la Terre.

      **Données :** Masse de la Terre : $M_T = 5{,}97 \times 10^{24}\ \text{kg}$ ; Rayon de la Terre : $R_T = 6380\ \text{km}$ ; Constante de gravitation universelle : $G = 6{,}67 \times 10^{-11}\ \text{N.m}^2.\text{kg}^{-2}$.

      **Figure 3 (schéma).** Deux cercles concentriques centrés sur le point $O$, marqué au centre et étiqueté « Terre » juste en dessous. Le cercle intérieur, plein, représente la Terre, de rayon noté $R_T$ (segment radial étiqueté à l'intérieur du cercle). Le cercle extérieur, en pointillés, représente l'orbite du satellite ; un point sur ce cercle est étiqueté $S$. Un segment radial en pointillés, étiqueté $h_1$, relie le bord du cercle intérieur au point $S$ sur le cercle extérieur.
    questions:
      - id: q1a
        part: "1) Orbite circulaire de rayon r = R_T + h_1, avec h_1 = 1000 km"
        stem: |-
          **(0,5 pt)** Choisir, parmi les propositions suivantes, celle qui est juste. L'expression de l'intensité de la force de gravitation universelle exercée par la Terre sur le satellite est :

          | | |
          |---|---|
          | A | $F_{T/S} = G\dfrac{M_T.m_s}{h_1^2}$ |
          | B | $F_{T/S} = G\dfrac{M_T.m_s}{(R_T+h_1)^2}$ |
          | C | $F_{T/S} = G\dfrac{M_T.m_s}{R_T^2}$ |
          | D | $F_{T/S} = G\dfrac{(M_T.m_s)^2}{(R_T+h_1)^2}$ |
        reasoning: |-
          La loi de gravitation du chapitre 10 fait intervenir la **distance qui sépare les deux corps** — ici, la distance entre le centre de la Terre $O$ et le satellite, pas l'altitude toute seule. Cette distance vaut $R_T+h_1$ (le rayon de la Terre plus l'altitude), jamais $h_1$ seul ni $R_T$ seul. Ça élimine A (utilise $h_1$ seul — ce serait la distance depuis la surface d'une Terre de rayon nul) et C (utilise $R_T$ seul — ce serait la force à la surface même de la Terre, pas à l'altitude du satellite). D est éliminée pour une autre raison, dimensionnelle : elle élève le produit des masses au carré, ce qui n'a pas la forme $Gm_Am_B/r^2$ du chapitre 10. Seule B respecte à la fois la bonne distance et la bonne structure de la loi.
      - id: q1b
        stem: |-
          **(0,5 pt)** En appliquant la deuxième loi de Newton, montrer que l'expression de la vitesse $v$ de $S$ est : $v = \sqrt{\dfrac{G.M_T}{R_T+h_1}}$.
        reasoning: |-
          Exactement la méthode du chapitre 10 : la force gravitationnelle est purement centripète (dirigée vers $O$), donc sa projection sur la tangente est nulle — le mouvement est circulaire uniforme — et sa projection sur la normale égale $m_s\,v^2/r$. On identifie cette projection normale à la norme de la force trouvée en 1.1 (option B), avec $r=R_T+h_1$, puis on isole $v$.
        steps:
          - math: 'm_s\frac{v^2}{R_T+h_1} = G\frac{M_T\,m_s}{(R_T+h_1)^2}'
            note: "Deuxième loi projetée sur la normale (chapitre 10), avec la force trouvée a la question 1.1 (option B)."
          - math: 'v^2 = \frac{G\,M_T}{R_T+h_1}'
            note: "La masse m_s du satellite se simplifie des deux cotes -- même mécanisme qu'au chapitre 10."
          - math: '\boxed{v = \sqrt{\frac{G\,M_T}{R_T+h_1}}}'
            note: "On prend la racine carrée : c'est l'expression demandee."
      - id: q1c
        stem: |-
          **(0,5 pt)** Vérifier que la période de révolution du mouvement de $S$ autour de la Terre est : $T_1 \approx 1{,}75\ \text{h}$.
        reasoning: |-
          Comme au chapitre 11, on relie la vitesse orbitale à la période par la géométrie du cercle — la distance parcourue en une période est le périmètre $2\pi r$ — puis on calcule $v$ numériquement avec la formule de la question 1.2 avant de convertir.
        steps:
          - math: 'r = R_T + h_1 = 6380 + 1000 = 7380\ \text{km} = 7{,}38\times 10^6\ \text{m}'
            note: "Distance Terre-satellite en unités SI."
          - math: 'v = \sqrt{\frac{G\,M_T}{r}} = \sqrt{\frac{6{,}67\times 10^{-11}\times 5{,}97\times 10^{24}}{7{,}38\times 10^6}} \approx 7{,}35\times 10^3\ \text{m.s}^{-1}'
            note: "Application numérique de la formule établie en 1.2."
          - math: 'T_1 = \frac{2\pi r}{v} \approx \frac{2\pi\times 7{,}38\times 10^6}{7{,}35\times 10^3} \approx 6{,}31\times 10^3\ \text{s}'
            note: "Périmètre du cercle divise par la vitesse (chapitre 11) : c'est la période."
          - math: '\boxed{T_1 \approx 1{,}754\ \text{h} \approx 1{,}75\ \text{h}}'
            note: "Conversion en heures (3600 s = 1 h) : la valeur annoncée par l'énoncé est vérifiée."
      - id: q2
        part: "2) Autre orbite circulaire, T_2 = 24 h"
        stem: |-
          **(0,75 pt)** Le satellite $S$ est placé sur une autre orbite circulaire située à une altitude $h_2$ de la surface de la Terre. Il a alors un mouvement circulaire uniforme de période de révolution $T_2 = 24\ \text{h}$. En utilisant la troisième loi de Kepler, déterminer l'altitude $h_2$.
        reasoning: |-
          La troisième loi de Kepler (chapitre 11) dit que $T^2/r^3$ est la **même constante** pour toutes les orbites autour d'un même astre — donc pour les deux orbites de ce satellite, $T_1^2/r_1^3 = T_2^2/r_2^3$, avec $r_1=7380\ \text{km}$ et $T_1$ déjà connus (question 1.3). On isole $r_2$, puis on retranche $R_T$ pour obtenir l'altitude $h_2$ demandée.
        steps:
          - math: '\frac{T_1^2}{r_1^3} = \frac{T_2^2}{r_2^3} \implies r_2 = r_1\left(\frac{T_2}{T_1}\right)^{2/3}'
            note: "Troisième loi de Kepler (chapitre 11) : le rapport T^2/r^3 est le même pour les deux orbites."
          - math: 'r_2 = 7380\times\left(\frac{24}{1{,}754}\right)^{2/3} \approx 4{,}23\times 10^4\ \text{km}'
            note: "Application numérique, avec T_2 = 24 h et T_1 = 1,754 h dans la même unité."
          - math: '\boxed{h_2 = r_2 - R_T \approx 4{,}23\times 10^4 - 6{,}38\times 10^3 \approx 3{,}6\times 10^4\ \text{km}}'
            note: "On retranche le rayon terrestre : c'est l'altitude géostationnaire (chapitre 11), coherente avec T_2 = 24 h."

  # ── bk-2023-n-x4 — 2023 N, Exercice 4 (Partie I) : chute d'une balle, frottement linéaire, Euler ──
