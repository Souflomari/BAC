    sourcing:
      status: sourced
      note: >-
        2023 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/142476, course-422/upload-85304
        (Exercice 4, Partie I — balle lancée verticalement vers le haut,
        chute libre puis chute avec frottement fluide linéaire, méthode
        d'Euler ; barème de la partie = 3,25 pt sur les 5,5 pt de l'exercice
        complet, dont la Partie II — balançoire, pendule pesant — est hors
        périmètre de cette notion, voir systemes-oscillants.md).
        Transcription vérifiée : 1ʳᵉ passe de vérification adversariale
        indépendante (agent-vérificateur-adversarial, 2026-08-07), re-fetch
        AlloSchool indépendant, diff caractère par caractère de l'énoncé,
        recompte du barème et relevé au pixel de la figure 1 — aucune
        divergence (docs/sujets/pc/chute-mouvements-plans.md, statut
        « vérifié »). Physique re-dérivée et cohérente : $v_z(t)=-10t+12$,
        $z(t)=-5t^2+12t$ ⇒ $h=V_0^2/2g=7{,}2\ \text{m}$ et
        $v_{OZ}=-12\ \text{m.s}^{-1}$ ; $\tau=m/\lambda=0{,}667\ \text{s}$ ⇒
        $|v_\ell|=g\tau\approx 6{,}7\ \text{m.s}^{-1}$ ; Euler :
        $a_{i-1}=-g-v_{i-1}/\tau=5 \Rightarrow v_{i-1}=-10\ \text{m.s}^{-1}$,
        d'où $v_z(t_i)=-10+5\times0{,}066\approx -9{,}67\ \text{m.s}^{-1}$.
        SCOPE NOTE (voir l'en-tête du fichier) : la question 2-3 (méthode
        d'Euler) donne l'accélération $a_{i-1}$ et demande la vitesse
        suivante — il faut donc d'abord inverser l'équation différentielle
        de la question 2-1 pour retrouver $v_{i-1}$ avant d'appliquer la
        récurrence d'Euler standard vers l'avant, un sens que le rung 8 ne
        modélise jamais explicitement. Le pont est fait au point d'usage
        dans le raisonnement de la question q3c.
    intro: |-
      **Étude de la chute d'une balle (examen national, session normale 2023, Exercice 4 — Partie I).**

      Dans le champ de pesanteur, on lance verticalement vers le haut à l'instant $t = 0$, à partir d'un point $O$, une balle $(S)$ de masse $m$ et de centre d'inertie $G$, avec une vitesse initiale de valeur $V_0 = 12\ \text{m.s}^{-1}$ (figure 1).

      On étudie le mouvement du centre d'inertie $G$ de la balle dans un repère $(O\,;\,\vec{k})$ lié à un référentiel terrestre supposé galiléen en deux phases : mouvement de chute libre de la balle dans la première phase ; mouvement de chute de la balle avec frottement dans la deuxième phase.

      **Données :** La masse : $m = 80\ \text{g}$ ; L'intensité de la pesanteur : $g = 10\ \text{m.s}^{-2}$.

      **1- Mouvement de la balle en chute libre.** Pendant son mouvement le centre d'inertie $G$ de la balle est considéré en chute libre.

      **2- Mouvement de chute de la balle avec frottement.** À partir de l'instant du passage du centre d'inertie $G$ par le point $O$ vers le bas, qu'on prend comme nouvelle origine des dates $t_0 = 0$, la balle est soumise, en plus de son poids $\vec{P}$, à une force de frottement fluide modélisée par $\vec{f} = -\lambda\vec{v}$ avec $\vec{v} = v_z\vec{k}$ et $\lambda = 0{,}12$ S.I. (On néglige la poussée d'Archimède devant ces deux forces).

      **Figure 1 (schéma).** Axe vertical $Z$ (flèche pleine orientée vers le haut, étiquetée « Z » en haut). Une ligne horizontale en pointillés traverse l'axe, plus haut sur la figure ; un disque noir plein étiqueté « (S) » (la balle) est placé juste en dessous de cette ligne pointillée, sur l'axe. Une double flèche verticale, étiquetée « h » (une cote de longueur), relie le niveau de l'origine $O$ à cette ligne pointillée, matérialisant la hauteur maximale. En dessous de (S), une courte flèche pleine orientée vers le haut, étiquetée « $\vec{V_0}$ » (vecteur vitesse initiale). Plus bas, au niveau de l'origine, une courte flèche pleine orientée vers le haut étiquetée « $\vec{k}$ », avec le point « O » juste à droite ; une ligne horizontale en pointillés (bleue) part de O vers la gauche. L'axe $Z$ se poursuit en trait plein en dessous de O jusqu'au bas de la figure.
    questions:
      - id: q1
        part: "1- Mouvement de la balle en chute libre"
        stem: |-
          **(0,75 pt)** En appliquant la deuxième loi de Newton, déterminer les équations horaires numériques donnant la vitesse $v_z(t)$ et la position $z(t)$ du centre d'inertie $G$ de la balle.
        reasoning: |-
          Exactement la méthode du rung 1 : chute libre en une dimension, avec cette fois un axe $Z$ orienté **vers le haut** — le même choix qu'au rung 1 (contrairement au rung 7, où l'axe est choisi vers le bas). Comme au rung 1, $\vec g$ pointe en sens contraire de l'axe, donc $a_z=-g$. On primitive deux fois, avec la vitesse initiale $V_0=12\ \text{m/s}$ vers le haut (comme la balle lancée vers le haut de l'exemple travaillé du rung 1) et $z_0=0$ au point de lancement $O$.
        steps:
          - math: '\vec P = m\vec a \implies \vec a = \vec g'
            note: "Chute libre (rung 1) : seul le poids agit."
          - math: 'a_z = -g'
            note: "Axe Z oriente vers le haut (figure 1) : g pointe en sens oppose, comme au rung 1."
          - math: 'v_z(t) = V_0 - g\,t = 12 - 10\,t'
            note: "Premiere primitivation, vitesse initiale V0 = 12 m/s vers le haut (rung 1)."
          - math: '\boxed{z(t) = V_0\,t - \frac{1}{2}g\,t^2 = 12\,t - 5\,t^2}'
            note: "Seconde primitivation, avec z0 = 0 au point de lancement O."
      - id: q2a
        stem: |-
          **(0,5 pt)** En utilisant les équations $v_z(t)$ et $z(t)$ déterminer la hauteur maximale $h$ atteinte par $G$.
        reasoning: |-
          Même critère qu'au rung 1 : le sommet de la trajectoire est l'instant où la vitesse s'annule. On résout $v_z(t)=0$ pour trouver cet instant, puis on le substitue dans $z(t)$ (question précédente) pour obtenir la hauteur atteinte.
        steps:
          - math: 'v_z(t)=0 \implies 12-10\,t=0 \implies t_{sommet}=1{,}2\ \text{s}'
            note: "Meme critere qu'au rung 1 : le sommet est l'instant ou la vitesse s'annule."
          - math: 'h = z(t_{sommet}) = 12\times 1{,}2 - 5\times 1{,}2^2 = 14{,}4-7{,}2'
            note: "On substitue dans z(t) (question precedente)."
          - math: '\boxed{h \approx 7{,}2\ \text{m}}'
            note: "Hauteur maximale atteinte par G."
      - id: q2b
        stem: |-
          **(0,5 pt)** Déterminer la valeur algébrique $v_{OZ}$ de la vitesse de $G$ lors de son passage vers le bas par le point $O$.
        reasoning: |-
          Comme au rung 1 (l'exemple de la balle lancée vers le haut), l'autre instant, en plus de $t=0$, où $z(t)=0$ correspond exactement au double du temps de montée — la symétrie montée-descente. On calcule cet instant, puis on l'injecte dans $v_z(t)$ pour obtenir la valeur algébrique demandée.
        steps:
          - math: 'z(t)=0 \implies t(12-5t)=0 \implies t=0\ \text{ou}\ t_O=2{,}4\ \text{s}'
            note: "Autre racine de z(t)=0 (rung 1) : exactement le double de t_sommet = 1,2 s, la symetrie montee-descente."
          - math: 'v_{OZ} = v_z(t_O) = 12-10\times 2{,}4'
            note: "On substitue dans v_z(t) (question 1)."
          - math: '\boxed{v_{OZ} \approx -12\ \text{m.s}^{-1}}'
            note: "Negative : G repasse par O en descendant, dans le sens oppose a l'axe Z (vers le haut)."
      - id: q3a
        part: "2- Mouvement de chute de la balle avec frottement"
        stem: |-
          **(0,5 pt)** Montrer que l'équation différentielle vérifiée par la vitesse $v_z$ du centre d'inertie $G$ de la balle s'écrit : $\dfrac{dv_z}{dt} + \dfrac{1}{\tau}v_z + g = 0$ avec $\tau$ le temps caractéristique du mouvement.
        reasoning: |-
          Même bilan à deux forces qu'au rung 7 (poids + frottement linéaire), mais avec un choix d'axe différent de l'exemple travaillé du rung 7 : ici l'axe $Z$ reste orienté **vers le haut** (figure 1), et non vers le bas. Exactement la leçon du rung 1 sur l'arbitraire du signe : le poids se projette donc négativement sur cet axe, ce qui fait apparaître un « $+g$ » au lieu du « $=g$ » du rung 7 — la physique est identique, seule la convention de signe change le visage de l'équation.
        steps:
          - math: 'm\vec a = \vec P + \vec f'
            note: "Deuxieme loi de Newton (rung 7) : poids et frottement lineaire, comme au rung 7."
          - math: 'm\frac{dv_z}{dt} = -mg - \lambda\,v_z'
            note: "Projection sur l'axe Z, oriente vers le HAUT (figure 1) -- pas vers le bas comme l'exemple du rung 7 : le poids se projette donc negativement."
          - math: '\frac{dv_z}{dt} = -g - \frac{\lambda}{m}\,v_z'
            note: "On divise par la masse m."
          - math: '\boxed{\frac{dv_z}{dt} + \frac{1}{\tau}v_z + g = 0} \qquad \text{avec} \qquad \tau=\frac{m}{\lambda}'
            note: "On range tout a gauche : le +g (au lieu du =g du rung 7) vient uniquement du choix d'axe vers le haut -- exactement la lecon du rung 1 sur l'arbitraire du signe."
      - id: q3b
        stem: |-
          **(0,25 pt)** Déduire la norme de la vitesse limite du mouvement du centre d'inertie $G$ de la balle.
        reasoning: |-
          Même geste qu'au rung 7 : on annule l'accélération dans l'équation différentielle pour trouver le régime permanent, sans jamais résoudre l'équation en entier. Ici $v_\ell$ ressort négative (elle pointe vers le bas, dans le sens opposé à l'axe $Z$ choisi vers le haut) — la norme demandée est sa valeur absolue.
        steps:
          - math: '\frac{dv_z}{dt}=0 \implies -g-\frac{v_\ell}{\tau}=0 \implies v_\ell=-g\,\tau'
            note: "Regime permanent (rung 7) : on annule l'acceleration. v_ell negatif car la bille tombe, dans le sens oppose a l'axe Z."
          - math: '\tau = \frac{m}{\lambda} = \frac{0{,}080}{0{,}12} \approx 0{,}667\ \text{s}'
            note: "Application numerique de tau = m/lambda."
          - math: '\boxed{|v_\ell| = g\,\tau \approx 6{,}7\ \text{m.s}^{-1}}'
            note: "Norme de la vitesse limite demandee par l'enonce."
      - id: q3c
        stem: |-
          **(0,75 pt)** Déterminer, en utilisant la méthode d'Euler, la valeur algébrique $v_z(t_i)$ de la vitesse à l'instant $t_i$ sachant que l'accélération du mouvement à l'instant $t_{i-1}$ est $a_{i-1} = 5\ \text{m.s}^{-2}$ et on prend le pas de calcul $\Delta t = 66\ \text{ms}$.
        reasoning: |-
          Ici l'énoncé donne l'accélération $a_{i-1}$, pas la vitesse $v_{i-1}$ — l'inverse de toutes les autres applications d'Euler de cette banque, qui partent toujours d'une vitesse connue pour en déduire l'accélération. Il faut donc d'abord **inverser** l'équation différentielle de la question 2-1 pour retrouver $v_{i-1}$ à partir de $a_{i-1}$ donné (une manipulation algébrique, pas une nouvelle idée physique), puis appliquer la récurrence d'Euler standard du rung 8, $v_i=v_{i-1}+a_{i-1}\Delta t$, exactement comme d'habitude.
        steps:
          - math: 'a_{i-1} = -g-\frac{v_{i-1}}{\tau} = 5 \implies v_{i-1} = -\tau\left(g+5\right)'
            note: "On repart de l'equation differentielle (question 2-1) pour retrouver v_(i-1) a partir de a_(i-1) donne -- le rung 8 part toujours de v_i connu, jamais l'inverse ; pont fait ici."
          - math: 'v_{i-1} = -0{,}667\times(10+5) \approx -10\ \text{m.s}^{-1}'
            note: "Application numerique."
          - math: 'v_z(t_i) = v_{i-1} + a_{i-1}\,\Delta t = -10 + 5\times 0{,}066'
            note: "Recurrence d'Euler standard (rung 8), a present que v_(i-1) est connu."
          - math: '\boxed{v_z(t_i) \approx -9{,}67\ \text{m.s}^{-1}}'
            note: "Coherent : la bille continue de ralentir en valeur absolue, s'approchant de v_ell = -6,7 m/s."

