        steps:
          - math: '\alpha = \frac{mg}{V_\ell^2} = \frac{100\times 10}{5{,}0^2}'
            note: "On inverse V_ell = racine(mg/alpha), avec V_ell lu au graphe."
          - math: '\boxed{\alpha \approx 40\ \text{(unites SI)}}'
            note: "Ordre de grandeur coherent pour un frottement quadratique dans l'air."
      - id: q3
        part: "3) Distance parcourue durant le régime initial de la phase 2"
        stem: |-
          **(0,5 pt)** Sachant que la durée totale du mouvement de G depuis le début de la chute jusqu'à l'arrivée au sol est $\Delta t = 70\ \text{s}$, trouver la distance $d$ parcourue par G durant le régime initial de la phase 2.
        reasoning: |-
