    intro: |-
      **Mouvement d'un skieur dans le champ de pesanteur uniforme (examen national, session normale 2011 — Mécanique, situation 3, 2,25 points sur les 5,50 de l'exercice complet).**

      *Les deux premières situations de cet exercice — le plan incliné $A'B'$ puis le plan horizontal $B'C'$ avec frottement — sont traitées à part, sous la notion « Les lois de Newton ». Cette situation-ci est autoportante : l'angle $\theta$ et les coordonnées du point de chute $P$ suffisent — $v_D$ est l'inconnue à déterminer, pas une valeur héritée de ce qui précède.*

      Le but de cet exercice est d'étudier le mouvement d'un sportif, pratiquant le ski sur des trajectoires de glace diverses. La dernière partie du circuit, $C'D'$, est circulaire ; la trajectoire de $G$ remonte le long de cet arc jusqu'au point $D$, où $G$ quitte la piste. On modélise le sportif et ses accessoires par un solide $(S)$ de masse $m = 65\ \text{Kg}$ *(« Kg » tel qu'imprimé — majuscule au kilogramme, sans incidence)*, et de centre d'inertie $G$. On prendra : $g = 10\ \text{m.s}^{-2}$.

      **3- Étude du mouvement dans le champ de pesanteur uniforme.** Lorsque le solide $(S)$ quitte la piste, $G$ passe en $D$, à un instant considéré comme nouvelle origine des temps, avec une vitesse $\vec{v}_D$ inclinée d'un angle $\theta = 45°$ par rapport au plan horizontal. Le solide $(S)$ tombe à la position $P$. On étudie le mouvement de $G$ dans le repère galiléen $(D,\vec{i}\,', \vec{j}\,')$ , et on néglige l'action de l'air au cours du mouvement. *(L'espace avant la virgule qui suit le repère est tel qu'imprimé — défaut typographique du sujet officiel, sans incidence.)*

      **Figure (extrait pertinent à cette situation — re-décrit depuis le bitmap natif).** L'origine des axes est au point $D$, au SOMMET de l'arc $C'D'$, au-dessus de la ligne de sol : axe $Y'$ vertical vers le haut, axe $X'$ horizontal vers la droite (il court au-dessus de la ligne de sol jusqu'au bord droit de la figure) ; vecteurs unitaires $\vec{i}\,'$ (horizontal, vers la droite) et $\vec{j}\,'$ (vertical, vers le haut). La flèche $\vec{v}_D$ part de $D$ vers le haut à droite, l'angle $\theta$ étant marqué par un arc entre $\vec{v}_D$ et l'axe $X'$. Le point $P$ (étiquette grasse) est SUR la ligne de sol, à droite — cohérent avec $y_G = -5\ \text{m}$, puisque $D$, l'origine du repère, est au-dessus du sol.
    questions:
      - id: q1
        part: "3-1 — Équations horaires et trajectoire"
        stem: |-
          **3-1-** (1,25 pt) Trouver les expressions littérales des équations horaires $x(t)$ et $y(t)$ du mouvement de $G$, et déduire l'expression littérale de l'équation de la trajectoire.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement le mécanisme du chapitre 3 : l'action de l'air est négligée (énoncé), donc la SEULE force est le poids — c'est une chute libre, et la deuxième loi de Newton donne $\vec{a} = \vec{g}$, que le repère $(D, \vec{i}\,', \vec{j}\,')$ décompose en deux axes INDÉPENDANTS : $a_x = 0$ (rien n'agit horizontalement) et $a_y = -g$ ($\vec{j}\,'$ pointe vers le haut).

          **Les conditions initiales**, lues dans l'énoncé : l'origine des positions est en $D$ (l'origine du repère) et l'origine des temps à l'instant du passage en $D$ — exactement la convention des chapitres — avec une vitesse initiale $\vec{v}_D$ inclinée de $\theta$ au-dessus de l'horizontale, donc de composantes $v_D\cos\theta$ et $v_D\sin\theta$.

          **Deux primitivations successives** (chapitre 3), puis l'élimination du temps (chapitre 4) : la première équation horaire donne $t = \dfrac{x}{v_D\cos\theta}$, qu'on reporte dans la seconde pour obtenir la trajectoire.
        steps:
          - math: 'a_x = 0 \qquad a_y = -g'
            note: "Chute libre : seul le poids agit (air neglige), deuxième loi projetée dans (D, i prime, j prime) -- chapitre 3."
          - math: 'v_x(t) = v_D\cos\theta \qquad v_y(t) = -g\,t + v_D\sin\theta'
            note: "Première primitivation, avec les composantes de v_D comme conditions initiales."
          - math: '\boxed{x(t) = v_D\cos\theta\cdot t \qquad y(t) = -\frac12\,g\,t^2 + v_D\sin\theta\cdot t}'
            note: "Deuxième primitivation, origine des positions en D : x(0) = y(0) = 0."
          - math: '\boxed{y = -\frac{g\,x^2}{2\,v_D^2\cos^2\theta} + x\tan\theta}'
            note: "Élimination du temps t = x/(v_D.cos(theta)) entre les deux équations horaires (chapitre 4)."
      - id: q2
        part: "3-2 — La vitesse v_D, depuis le point de chute P"
        stem: |-
          **3-2-** (1 pt) Déterminer $v_D$, la vitesse de $G$ au moment où il quitte le point $D$, sachant que les coordonnées de $G$ à l'arrivée en $P$ sont : $x_G = 15\ \text{m}$ et $y_G = -\ 5\ \text{m}$. *(« - 5 m », avec un espace entre le signe moins et le nombre, tel qu'imprimé — défaut typographique du sujet officiel, sans incidence.)*
        reasoning: |-
          résoudre l'équation de la trajectoire EN LA VITESSE INITIALE, depuis un point de passage connu, n'est modélisé pas à pas nulle part dans la leçon — le geste est refait ici entièrement.

          Ce qu'on cherche et pourquoi ce geste. $P$ est un point de la trajectoire : ses coordonnées $(x_P = 15\ \text{m}\,;\,y_P = -5\ \text{m})$ VÉRIFIENT l'équation de la question 3-1, dans laquelle $v_D$ est la seule inconnue. On substitue, puis on isole $v_D^2$ :

          $$y_P = -\frac{g\,x_P^2}{2\,v_D^2\cos^2\theta} + x_P\tan\theta \implies \frac{g\,x_P^2}{2\,v_D^2\cos^2\theta} = x_P\tan\theta - y_P$$

          $$v_D^2 = \frac{g\,x_P^2}{2\cos^2\theta\left(x_P\tan\theta - y_P\right)} \qquad \text{soit} \qquad v_D = \frac{x_P}{\cos\theta}\sqrt{\frac{g}{2\left(x_P\tan\theta - y_P\right)}}$$

          **Le piège nommé de cette question.** Le signe de $y_P$ : le point $P$ est EN DESSOUS de $D$, donc $y_P = -5\ \text{m}$ est négatif — et le soustraire l'AJOUTE : $x_P\tan\theta - y_P = 15 - (-5) = 20\ \text{m}$. Écrire $15 - 5 = 10$ (en oubliant que $y_P$ porte déjà son signe) fausserait $v_D$ d'un facteur $\sqrt{2}$.
        steps:
          - math: 'y_P = -\frac{g\,x_P^2}{2\,v_D^2\cos^2\theta} + x_P\tan\theta'
            note: "P est un point de la trajectoire : on substitue ses coordonnées dans l équation de la question 3-1."
          - math: 'v_D^2 = \frac{g\,x_P^2}{2\cos^2\theta\left(x_P\tan\theta - y_P\right)}'
            note: "Isolation algébrique de v_D au carré -- geste hors chapitres, ponte ici pas a pas."
          - math: 'v_D^2 = \frac{10\times15^2}{2\times0{,}5\times\left(15\times1 - (-5)\right)} = \frac{2250}{20} = 112{,}5'
            note: "theta = 45 degrés : cos carré vaut 0,5 et tan vaut 1 ; x_P.tan(theta) - y_P = 15 + 5 = 20 (le piege de signe)."
          - math: '\boxed{v_D = \sqrt{112{,}5} \approx 10{,}6\ \text{m.s}^{-1}}'
            note: "Vitesse de G au moment ou il quitte D -- concordante avec le corrige non officiel (10,6 m/s)."

