        steps:
          - math: 'h_1 = \frac{1}{2}g\,\Delta t_1^2 = \frac{1}{2}\times 10\times 4^2'
            note: "Phase 1, chute libre (question 1b) : distance parcourue en un temps Delta t1, formule du rung 1."
          - math: '\boxed{h_1 = 80\ \text{m}}'
            note: "Hauteur perdue durant la phase 1 (parachute ferme)."
          - math: 't_{perm} = \Delta t - \Delta t_1 - 30 = 70 - 4 - 30 = 36\ \text{s}'
            note: "Duree du regime permanent de la phase 2 : duree totale du vol, moins la phase 1, moins les 30 s de regime initial de la phase 2 lus sur la figure 3."
          - math: 'h_{perm} = V_\ell\times t_{perm} = 5{,}0\times 36'
            note: "En regime permanent la vitesse est quasi constante (rung 7) : distance = vitesse x duree."
          - math: '\boxed{h_{perm} = 180\ \text{m}}'
            note: "Distance parcourue durant le regime permanent de la phase 2."
          - math: '\boxed{d = h - h_1 - h_{perm} = 660 - 80 - 180 = 400\ \text{m}}'
            note: "Ce qui reste de la hauteur totale une fois retirees la phase 1 et le regime permanent de la phase 2."

  # ── bk-2022-n-x4 — 2022 N, Exercice 4 (Partie 1) : bille dans l'huile de ricin, Archimède ──
  - id: bk-2022-n-x4
    title: "Chute d'une bille dans l'huile de ricin : régimes transitoire/permanent et masse volumique"
    source:
      year: 2022
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice 4 — Partie 1 : Étude de la chute d'une bille dans un liquide visqueux"
    bareme_total: 2.75
    duration_min: 17
    sourcing:
      status: sourced
      note: >-
        2022 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/136621, course-422/upload-84516
        (Exercice 4, Partie 1 — chute verticale d'une bille dans l'huile de
        ricin, poussée d'Archimède non négligeable ; barème de la partie =
        2,75 pt sur les 5 pt de l'exercice complet, dont la Partie 2 — un
        satellite artificiel — est transcrite séparément ci-dessous, entrée
