      note: >-
        2022 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/136621, course-422/upload-84516
        (Exercice 4, Partie 2 — mouvement d'un satellite artificiel en orbite
        circulaire ; barème de la partie = 2,25 pt sur les 5 pt de
        l'exercice complet, dont la Partie 1 — chute d'une bille dans
