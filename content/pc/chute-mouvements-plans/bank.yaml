    intro: |-
      **Application des lois de Kepler dans le cas d'une orbite circulaire — Jupiter et son satellite Io (examen national, session de rattrapage 2012 — exercice « Mécanique », 5,50 points).**

      La planète Jupiter est la plus grande planète du système solaire, elle constitue avec les soixante six *(sic — sans trait d'union ; et l'original arabe dit tout autre chose : Jupiter représente « à lui seul » un monde miniature où gravitent « environ » soixante-six satellites. Aucune question n'en dépend)* satellites naturels gravitant autour d'elle, un univers miniaturusé *(sic)* dans ce système.

      Le but de cet exercice est d'étudier le mouvement de Jupiter autour du soleil, et de déterminer quelques grandeurs physiques caractérisant cette planète.

      **Données :**
      - Masse du soleil : $M_S = 2\times10^{30}\ \text{kg}$ ;
      - Constante d'attraction universelle : $G = 6{,}67\times10^{-11}$ (SI) ;
      - Période de révolution de Jupiter autour du soleil : $T_J = 3{,}74\times10^{8}\ \text{s}$.

      On considères *(sic)* que le soleil et **Jupiter**
           sont à répartitions sphériques de masses, et on note la masse de Jupiter $M_J$.

      On néglige les dimensions de la planète Jupiter devant la distance qui la sépare du centre du Soleil, ainsi que les forces qui lui sont appliquées devant la force d'attraction universelle entre elle et le Soleil.

      *Cet exercice ne comporte AUCUNE figure — ni dans l'édition française, ni dans l'original arabe. Tout y est littéral et numérique.*
    questions:
      - id: q1
        part: "1- Détermination du rayon orbital de Jupiter et sa vitesse"
        stem: |-
          On considère que le mouvement de Jupiter dans le repère héliocentrique est circulaire de rayon orbital $r$.

          **1-1-** (0,5 pt) Écrire en fonction de $M_J$, $M_S$, $G$, et $r$, *(sic — le sujet imprime un double espace ici)* l'expression de l'intensité de la force de gravitation universelle exercée par le Soleil sur Jupiter.
        reasoning: |-
          C'est la loi de la gravitation universelle (chapitre 10), appliquée à deux corps qu'on a le droit de traiter comme ponctuels — et l'énoncé a pris soin de le justifier, en deux endroits :

          - « le soleil et Jupiter sont à répartitions sphériques de masses » : un corps à symétrie sphérique attire l'extérieur **comme si toute sa masse était concentrée en son centre**. C'est ce qui autorise à parler d'une distance « centre à centre » ;
          - « on néglige les dimensions de la planète Jupiter devant la distance qui la sépare du centre du Soleil » : la distance $r$ est donc bien définie, sans ambiguïté sur le point de Jupiter qu'on mesure.

          L'intensité de la force vaut alors :

          $$\boxed{F_{S/J} = G\,\frac{M_S\,M_J}{r^2}}$$

          **Comment lire cette expression plutôt que de la réciter.** Elle est **proportionnelle au produit des deux masses** — les deux corps jouent des rôles symétriques — et **inversement proportionnelle au carré** de leur distance. Ce carré n'est pas un détail décoratif : c'est lui qui fera apparaître, à la question 1-2-b, l'exposant $3$ sur $r$ dans la troisième loi de Kepler.

          **La symétrie qu'il faut avoir en tête pour la suite.** Cette force est **la même**, en norme, que celle exercée par Jupiter sur le Soleil (troisième loi de Newton) : $F_{S/J} = F_{J/S}$. Ce qui diffère, c'est l'**effet** — l'accélération vaut $F/m$, et la masse du Soleil est plus de $10^{6}$ fois celle de Jupiter, ce qui rend le Soleil quasi immobile. C'est exactement ce qui justifie de prendre le repère **héliocentrique** comme galiléen pour cette étude.

          **Le piège de cette question.** Écrire $r$ au dénominateur sans le carré, ou confondre la force de gravitation avec le poids. Ici il n'y a pas de « poids » — pas de sol, pas d'astre de référence : il n'y a que l'attraction mutuelle entre deux corps, et c'est elle qui joue, à l'échelle du système solaire, le rôle que le poids joue à la surface de la Terre.
        steps:
          - math: '\boxed{F_{S/J} = G\,\frac{M_S\,M_J}{r^{2}}}'
            note: "Loi de la gravitation universelle. Les deux corps sont traites comme ponctuels : l'énoncé le justifie par la répartition sphérique des masses."
      - id: q2
        stem: |-
          **1-2-** En appliquant la deuxième loi de Newton :

          **a-** (1,25 pt) Écrire les expressions des composantes du vecteur accélération dans le repère de Freinet *(sic — le sujet imprime « Freinet » ; le repère est celui de **Frenet**, Jean Frédéric Frenet. L'original arabe et le corrigé écrivent tous deux correctement « فريني ». Graphie imprimée préservée, comme le corpus le fait déjà pour le sujet 2025 normale)*, et déduire que le mouvement de Jupiter est circulaire uniforme.
        reasoning: |-
          C'est la question la mieux payée du sujet — $1{,}25$ point, le plus gros barème unitaire de toute l'épreuve — et elle se joue entièrement sur la **méthode**, pas sur le calcul. Quatre gestes, dans l'ordre.

          **Geste 1 — poser le système et le référentiel.** Système : la **planète Jupiter**, assimilée à son centre d'inertie. Référentiel : le **repère héliocentrique**, supposé **galiléen** — condition sans laquelle la deuxième loi de Newton ne s'applique pas.

          **Geste 2 — le bilan des forces, et il est d'une simplicité voulue.** L'énoncé dit qu'on néglige toutes les forces devant l'attraction du Soleil : il ne reste donc **qu'une seule force**,

          $$\vec{F}_{S/J} = -G\,\frac{M_S M_J}{r^2}\,\vec{u}$$

          où $\vec{u}$ est le vecteur unitaire radial **sortant** (du Soleil vers Jupiter). Le signe moins dit que la force est **attractive** : elle pointe vers le Soleil, à l'opposé de $\vec u$.

          **Geste 3 — la base de Frenet, et ce qu'elle est.** C'est une base **mobile, liée au point** : elle se déplace avec Jupiter le long de sa trajectoire. Elle a deux vecteurs — $\vec{\tau}$, **tangent** à la trajectoire et dans le sens du mouvement, et $\vec{n}$, **normal**, dirigé vers le **centre** du cercle. Son intérêt tient à ce que, dans cette base, l'accélération d'un point en mouvement circulaire de rayon $r$ s'écrit **toujours** :

          $$\vec{a} = \underbrace{\frac{\mathrm{d}V}{\mathrm{d}t}}_{a_\tau}\,\vec{\tau} \;+\; \underbrace{\frac{V^2}{r}}_{a_n}\,\vec{n}$$

          La composante tangentielle dit **comment la vitesse change en norme** ; la composante normale dit **comment la trajectoire se courbe**. Cette décomposition sépare exactement les deux questions.

          **Geste 4 — la deuxième loi de Newton, et l'identification composante par composante.** Comme $\vec{n} = -\vec{u}$ (la normale pointe vers le centre, $\vec u$ s'en éloigne) :

          $$M_J\,\vec{a} = \vec{F}_{S/J} = G\,\frac{M_S M_J}{r^2}\,\vec{n}$$

          Le second membre n'a **aucune composante selon $\vec\tau$**. On identifie donc, terme à terme :

          $$a_\tau = \frac{\mathrm{d}V}{\mathrm{d}t} = 0 \qquad\text{et}\qquad a_n = \frac{V^2}{r} = G\,\frac{M_S}{r^2}$$

          **La conclusion, en deux temps qu'il faut écrire séparément — c'est là que le barème se gagne.**

          - $a_\tau = 0$ signifie que $\dfrac{\mathrm{d}V}{\mathrm{d}t} = 0$, donc que **$V$ est constante** : le mouvement est **UNIFORME** ;
          - la trajectoire est **CIRCULAIRE** par hypothèse de l'énoncé.

          Les deux ensemble : **le mouvement est circulaire uniforme**. Remarque au passage que la masse $M_J$ **s'est simplifiée** dans la seconde relation — la vitesse orbitale ne dépend pas de la masse de la planète, exactement comme la trajectoire d'un projectile en chute libre ne dépend pas de sa masse, et pour la même raison de fond : la force est elle-même proportionnelle à $M_J$.

          **Les deux pièges de cette question.** Le premier : conclure « uniforme » **sans avoir montré $a_\tau = 0$**, en se contentant de dire que la force est centripète. C'est le raisonnement attendu, mais il faut l'écrire — l'identification composante par composante *est* la démonstration, et elle vaut à elle seule une bonne part du $1{,}25$ point. Le second : croire qu'il faut **démontrer** que la trajectoire est circulaire. Ce n'est pas démontrable ici — c'est une **hypothèse de l'énoncé** (« on considère que le mouvement … est circulaire »), et la question ne demande que l'uniformité.
        steps:
          - math: '\vec{F}_{S/J} \ \text{, force unique}'
            note: "Système : Jupiter. Référentiel héliocentrique supposé galiléen. L'énoncé impose de négliger toutes les autres forces : le bilan se réduit à un seul terme."
          - math: '\vec{F}_{S/J} = -G\,\frac{M_S M_J}{r^{2}}\,\vec{u} = G\,\frac{M_S M_J}{r^{2}}\,\vec{n}'
            note: "Force attractive : dirigée vers le Soleil, donc selon la normale n (qui pointe vers le centre) et a l'oppose du radial sortant u."
          - math: '\vec{a} = \frac{\mathrm{d}V}{\mathrm{d}t}\,\vec{\tau} + \frac{V^{2}}{r}\,\vec{n}'
            note: "Expression générale de l'accélération dans la base de Frenet pour un mouvement circulaire de rayon r."
          - math: 'M_J\,\vec{a} = \vec{F}_{S/J} \quad\Longrightarrow\quad a_\tau = \frac{\mathrm{d}V}{\mathrm{d}t} = 0 \qquad a_n = \frac{V^{2}}{r} = G\,\frac{M_S}{r^{2}}'
            note: "Identification composante par composante : la force n'a aucune composante tangentielle, donc l'accélération non plus. La masse de Jupiter se simplifie."
          - math: '\boxed{\frac{\mathrm{d}V}{\mathrm{d}t} = 0 \Rightarrow V = \text{constante} \;;\; \text{trajectoire circulaire (hypothèse)} \Rightarrow \text{mouvement circulaire uniforme}}'
            note: "Les deux moities de la conclusion, a écrire séparément : l'uniformité se demontre, la circularite est donnée."
      - id: q3
        stem: |-
          **b-** (1 pt) Montrer que la troisième loi de Kepler s'écrit : $\dfrac{T_J^{\,2}}{r^3} = \dfrac{4\pi^2}{G\,M_S}$.
        reasoning: |-
          Une démonstration en deux lignes, à condition de partir du bon endroit : **la relation dynamique de la question précédente**, et **une expression purement géométrique de la vitesse** (chapitre 11).

          **Point de départ n° 1 — ce que la dynamique a donné** à la question 1-2-a :

          $$\frac{V^2}{r} = \frac{G\,M_S}{r^2} \qquad \Longrightarrow \qquad V^2 = \frac{G\,M_S}{r}$$

          **Point de départ n° 2 — ce que la géométrie donne.** Le mouvement étant **uniforme** (on vient de le démontrer, et c'est ce qui autorise ce qui suit), Jupiter parcourt tout le périmètre de son orbite en une période, à vitesse constante :

          $$V = \frac{2\pi r}{T_J} \qquad \Longrightarrow \qquad V^2 = \frac{4\pi^2 r^2}{T_J^{\,2}}$$

          *Cette relation n'aurait aucun sens si le mouvement n'était pas uniforme : c'est précisément pour cela que la question 1-2-a précède celle-ci.*

          **La jonction.** Les deux expressions décrivent le même $V^2$, on les égale :

          $$\frac{4\pi^2 r^2}{T_J^{\,2}} = \frac{G\,M_S}{r} \qquad \Longrightarrow \qquad 4\pi^2 r^3 = G\,M_S\,T_J^{\,2} \qquad \Longrightarrow \qquad \boxed{\frac{T_J^{\,2}}{r^3} = \frac{4\pi^2}{G\,M_S}}$$

          **Ce que cette loi dit vraiment, et pourquoi elle est utile.** Le membre de droite ne contient que $G$ et $M_S$ : il **ne dépend en rien de la planète considérée**. Le rapport $\dfrac{T^2}{r^3}$ est donc **la même constante pour toutes les planètes du système solaire** — c'est l'énoncé de la troisième loi de Kepler. Et cette indépendance a une conséquence pratique immédiate, que la question 2 exploitera : si l'on connaît $T$ et $r$ d'un satellite, on remonte à la masse de l'astre **central**, jamais à celle du satellite.

          **Le contrôle des exposants, à faire si l'on doute.** L'ordre $T^2/r^3$ n'est pas à mémoriser à l'aveugle : il **sort du calcul**. Le $r^2$ du numérateur de $V^2$ (géométrie) rencontre le $r$ du dénominateur de $V^2$ (dynamique), ce qui fait $r^3$ ; et le carré vient du carré de la vitesse. Refaire ces trois lignes coûte trente secondes et évite d'écrire $T^3/r^2$.

          **Le piège de cette question.** Utiliser $V = \dfrac{2\pi r}{T}$ **avant** d'avoir établi que le mouvement est uniforme. C'est un cercle logique : cette formule suppose la vitesse constante. L'ordre des questions du sujet n'est pas arbitraire — 1-2-a fournit l'hypothèse dont 1-2-b a besoin.
        steps:
          - math: '\frac{V^{2}}{r} = \frac{G\,M_S}{r^{2}} \quad\Longrightarrow\quad V^{2} = \frac{G\,M_S}{r}'
            note: "Ce que la dynamique a donne a la question 1-2-a."
          - math: 'V = \frac{2\pi r}{T_J} \quad\Longrightarrow\quad V^{2} = \frac{4\pi^{2}r^{2}}{T_J^{\,2}}'
            note: "Expression géométrique : le périmètre parcouru en une période, valable SEULEMENT parce que le mouvement est uniforme."
          - math: '\frac{4\pi^{2}r^{2}}{T_J^{\,2}} = \frac{G\,M_S}{r} \quad\Longrightarrow\quad 4\pi^{2}r^{3} = G\,M_S\,T_J^{\,2}'
            note: "Les deux expressions décrivent le même V au carré : on les égale et on multiplie en croix."
          - math: '\boxed{\frac{T_J^{\,2}}{r^{3}} = \frac{4\pi^{2}}{G\,M_S}}'
            note: "Troisième loi de Kepler, cas circulaire. Le membre de droite ne dépend que de l'astre central, jamais de la planète."
      - id: q4
        stem: |-
          **1-3-** (0,75 pt) S'assurer que $r \approx 7{,}8\times10^{11}\ \text{m}$.
        reasoning: |-
          « S'assurer que » : la valeur est **donnée**, et il faut la **retrouver** par le calcul, pas la supposer. On inverse la loi de Kepler établie à la question précédente.

          $$\frac{T_J^{\,2}}{r^3} = \frac{4\pi^2}{G\,M_S} \qquad \Longrightarrow \qquad r^3 = \frac{G\,M_S\,T_J^{\,2}}{4\pi^2} \qquad \Longrightarrow \qquad \boxed{r = \sqrt[3]{\frac{G\,M_S\,T_J^{\,2}}{4\pi^2}}}$$

          **L'application numérique, en travaillant les puissances de dix à part** — c'est ce qui rend le calcul faisable sans calculatrice programmable (que le sujet interdit d'ailleurs en page 1) :

          $$G\,M_S\,T_J^{\,2} = 6{,}67\times10^{-11} \times 2\times10^{30} \times \left(3{,}74\times10^{8}\right)^2 = 6{,}67\times10^{-11} \times 2\times10^{30} \times 1{,}399\times10^{17}$$

          $$= 1{,}866\times10^{37} \qquad \Longrightarrow \qquad r^3 = \frac{1{,}866\times10^{37}}{39{,}48} = 4{,}727\times10^{35}\ \text{m}^3$$

          La racine cubique se prend en **ramenant l'exposant à un multiple de 3** :

          $$r = \sqrt[3]{4{,}727\times10^{35}} = \sqrt[3]{472{,}7\times10^{33}} = \sqrt[3]{472{,}7} \times 10^{11} \approx 7{,}79\times10^{11}\ \text{m}$$

          $$\boxed{r \approx 7{,}8\times10^{11}\ \text{m}} \qquad \text{conforme à la valeur annoncée, à } 0{,}13\ \% \text{ près.}$$

          **Comment conclure une question « s'assurer que », et c'est ce qui la distingue d'un simple calcul.** Il ne suffit pas d'écrire le nombre : il faut **le comparer explicitement** à la valeur donnée et dire qu'ils coïncident. C'est cette comparaison qui répond à la consigne.

          **Le contrôle de vraisemblance, qui vaut d'être fait.** $7{,}8\times10^{11}\ \text{m}$, c'est environ $5{,}2$ fois la distance Terre–Soleil ($1{,}5\times10^{11}\ \text{m}$). Jupiter est effectivement à un peu plus de cinq unités astronomiques du Soleil, et c'est cohérent avec sa période de $3{,}74\times10^{8}\ \text{s}$, soit environ **$11{,}9$ ans** — la durée de révolution de Jupiter, une valeur d'astronomie élémentaire. Deux recoupements indépendants sur la même donnée.

          **Le piège de cette question.** Prendre la racine cubique d'un exposant qui n'est pas multiple de $3$ en divisant naïvement $35$ par $3$. Il faut d'abord **réécrire** $4{,}727\times10^{35}$ en $472{,}7\times10^{33}$, puis extraire : $10^{33}$ devient $10^{11}$, et $\sqrt[3]{472{,}7} \approx 7{,}79$. Sauter cette réécriture est la faute de calcul la plus fréquente sur ce type de question.
        steps:
          - math: '\boxed{r = \sqrt[3]{\frac{G\,M_S\,T_J^{\,2}}{4\pi^{2}}}}'
            note: "Inversion de la troisième loi de Kepler établie a la question 1-2-b."
          - math: 'G\,M_S\,T_J^{\,2} = 6{,}67\times10^{-11} \times 2\times10^{30} \times 1{,}399\times10^{17} = 1{,}866\times10^{37}'
            note: "Numérateur, puissances de dix traitées a part. T_J au carré vaut 1,399 x 10^17."
          - math: 'r^{3} = \frac{1{,}866\times10^{37}}{4\pi^{2}} = \frac{1{,}866\times10^{37}}{39{,}48} = 4{,}727\times10^{35}\ \text{m}^{3}'
            note: "Rayon au cube."
          - math: 'r = \sqrt[3]{472{,}7\times10^{33}} = \sqrt[3]{472{,}7}\times10^{11}'
            note: "Reecriture préalable pour ramener l'exposant a un multiple de 3 : c'est la que se fait la faute de calcul la plus fréquente."
          - math: '\boxed{r \approx 7{,}79\times10^{11} \approx 7{,}8\times10^{11}\ \text{m}}'
            note: "Conforme a la valeur annoncée par l'énoncé, a 0,13 pour cent près. Environ 5,2 fois la distance Terre-Soleil : cohérent."
      - id: q5
        stem: |-
          **1-4-** (1 pt) Déterminer la valeur de la vitesse $V$ de révolution de Jupiter autour du soleil.
        reasoning: |-
          Le mouvement étant **circulaire uniforme** — démontré à la question 1-2-a —, la vitesse se calcule par le plus court chemin : le périmètre de l'orbite, divisé par la durée d'un tour.

          $$V = \frac{2\pi r}{T_J} = \frac{2\pi \times 7{,}8\times10^{11}}{3{,}74\times10^{8}}$$

          $$V = \frac{4{,}901\times10^{12}}{3{,}74\times10^{8}} \approx 1{,}31\times10^{4}\ \text{m.s}^{-1}$$

          $$\boxed{V \approx 1{,}31\times10^{4}\ \text{m.s}^{-1} = 13{,}1\ \text{km.s}^{-1}}$$

          **La voie alternative, et pourquoi elle est moins bonne ici.** On pourrait aussi passer par la dynamique, $V = \sqrt{\dfrac{G M_S}{r}}$, ce qui donne $1{,}31\times10^{4}\ \text{m.s}^{-1}$ également. Les deux chemins sont justes et concordent — c'est même un excellent contrôle si l'on a le temps. Mais le chemin géométrique est **plus court et moins exposé** : il n'utilise que deux données, dont l'une vient d'être établie, alors que l'autre en mobilise trois et une racine carrée.

          **Le contrôle de vraisemblance, et il est frappant.** La vitesse orbitale réelle de Jupiter est de $13{,}07\ \text{km.s}^{-1}$ : on tombe à $0{,}3\ \%$. Et l'ordre de grandeur se compare utilement à celui de la Terre, $30\ \text{km.s}^{-1}$ — Jupiter, plus loin du Soleil, va **moins vite**. C'est ce que la relation $V = \sqrt{GM_S/r}$ dit : plus l'orbite est grande, plus la vitesse est faible. Une réponse supérieure à $30\ \text{km.s}^{-1}$ devrait alerter immédiatement.

          **Le piège de cette question.** Utiliser $r$ en kilomètres, ou oublier le facteur $2\pi$ en écrivant $V = r/T$. Le premier décale le résultat de $10^{3}$, le second le divise par $6{,}28$ — et aucun des deux ne se voit sans le contrôle d'ordre de grandeur ci-dessus.
        steps:
          - math: 'V = \frac{2\pi r}{T_J}'
            note: "Périmètre de l'orbite divise par la période : valable parce que le mouvement est uniforme (question 1-2-a)."
          - math: 'V = \frac{2\pi \times 7{,}8\times10^{11}}{3{,}74\times10^{8}} = \frac{4{,}901\times10^{12}}{3{,}74\times10^{8}}'
            note: "Application numérique avec le rayon établi a la question 1-3."
          - math: '\boxed{V \approx 1{,}31\times10^{4}\ \text{m.s}^{-1} = 13{,}1\ \text{km.s}^{-1}}'
            note: "Valeur réelle de Jupiter : 13,07 km/s. Écart 0,3 pour cent, du aux données arrondies de l'énoncé."
      - id: q6
        part: "2- Détermination de la masse de Jupiter"
        stem: |-
          On considère que la lune « Io » l'un des satellites découvert *(sic — « découverts » attendu ; et l'original arabe précise « le savant Galilée », que le français supprime)* par Galilée, est en mouvement circulaire uniforme à une distance $r' = 4{,}2\times10^{8}\ \text{m}$ du centre de Jupiter.

          La période de ce mouvement est $T_I = 1{,}77\ \text{jours}$ *(sic — l'indice imprimé est un « I » seul, alors que le satellite s'appelle **Io** ; l'original arabe et le corrigé écrivent tous deux $T_{Io}$)*.

          *(On néglige les dimensions de Io devant les autres dimensions, ainsi que les forces qui lui sont appliquées devant la force d'attraction universelle entre lui et Jupiter).*

          **2-** (1 pt) En étudiant le mouvement de Io dans un repère d'origine confondu avec le centre de Jupiter et supposé galiléen, déterminer la masse $M_J$ de Jupiter.
        reasoning: |-
          **La bonne nouvelle, et il faut la voir avant de calculer : il n'y a rien de nouveau à démontrer.** Le système Jupiter–Io est le **même problème** que le système Soleil–Jupiter, avec d'autres noms : un corps central massif, un corps qui tourne autour de lui sur un cercle, une seule force. Toute la démonstration des questions 1-2-a et 1-2-b se transpose **mot pour mot**, en remplaçant le Soleil par Jupiter, Jupiter par Io, $r$ par $r'$ et $T_J$ par $T_{Io}$ :

          $$\frac{T_{Io}^{\,2}}{r'^{3}} = \frac{4\pi^2}{G\,M_J}$$

          **Et c'est ici que se révèle ce que la troisième loi a de vraiment utile.** Sa constante ne dépend que de l'astre **CENTRAL**. En l'appliquant à Io, on obtient donc une relation où figure $M_J$ — la masse de **Jupiter**, l'astre attracteur —, et où la masse de Io **n'apparaît pas du tout**. C'est ainsi qu'on pèse une planète : **en regardant tourner ce qui tourne autour d'elle**. On ne pourrait pas obtenir $M_J$ en étudiant le mouvement de Jupiter autour du Soleil, où c'est $M_S$ qui apparaît — c'est précisément pourquoi l'énoncé change de satellite pour cette question.

          On isole $M_J$ :

          $$\boxed{M_J = \frac{4\pi^2\,r'^{3}}{G\,T_{Io}^{\,2}}}$$

          **⚠️ La conversion préalable, à faire en toute première ligne.** La période est donnée **en jours** et $G$ est en unités SI : il faut passer en **secondes**.

          $$T_{Io} = 1{,}77 \times 24 \times 3600 = 152\,928\ \text{s}$$

          **L'application numérique :**

          $$M_J = \frac{4\pi^2 \times \left(4{,}2\times10^{8}\right)^3}{6{,}67\times10^{-11} \times \left(152\,928\right)^2} = \frac{39{,}48 \times 7{,}409\times10^{25}}{6{,}67\times10^{-11} \times 2{,}339\times10^{10}} = \frac{2{,}925\times10^{27}}{1{,}560}$$

          $$\boxed{M_J \approx 1{,}88\times10^{27}\ \text{kg}}$$

          **Le contrôle de vraisemblance, et il est excellent.** La masse réelle de Jupiter est $1{,}898\times10^{27}\ \text{kg}$ : on tombe à $1{,}2\ \%$, l'écart venant des données arrondies de l'énoncé. Autre recoupement, plus parlant encore : $\dfrac{M_S}{M_J} = \dfrac{2\times10^{30}}{1{,}88\times10^{27}} \approx 1\,064$ — le Soleil est environ mille fois plus massif que Jupiter, ce qui est le rapport astronomique bien connu. Et Jupiter est lui-même environ $318$ fois plus massif que la Terre : c'est ce que l'encadré de l'énoncé appelle « un univers miniaturisé » à l'intérieur du système solaire.

          **Les deux pièges de cette question.** Le premier, et c'est le plus coûteux : **oublier de convertir les jours en secondes**. Avec $T = 1{,}77$, on obtiendrait $M_J \approx 1{,}4\times10^{37}\ \text{kg}$ — sept fois la masse du Soleil, une absurdité que le contrôle d'ordre de grandeur attrape aussitôt. Le second : utiliser $r$ (le rayon de l'orbite de Jupiter autour du Soleil) au lieu de $r'$ (le rayon de l'orbite de Io autour de Jupiter). Les deux rayons diffèrent d'un facteur $2\,000$ ; il faut relire quel astre tourne autour de quel autre avant d'écrire la formule.
        steps:
          - math: '\frac{T_{Io}^{\,2}}{r^{\prime\,3}} = \frac{4\pi^{2}}{G\,M_J}'
            note: "Troisième loi de Kepler appliquee au système Jupiter-Io : même démonstration qu'aux questions 1-2-a et 1-2-b, avec Jupiter comme astre central."
          - math: '\boxed{M_J = \frac{4\pi^{2}\,r^{\prime\,3}}{G\,T_{Io}^{\,2}}}'
            note: "La constante de Kepler ne dépend que de l'astre CENTRAL : c'est ainsi qu'on pèse une planète, en regardant tourner son satellite. La masse de Io n'y figure pas."
          - math: 'T_{Io} = 1{,}77 \times 24 \times 3600 = 152\,928\ \text{s}'
            note: "Conversion préalable et séparée : la période est donnée en jours, G est en unités SI."
          - math: 'M_J = \frac{39{,}48 \times 7{,}409\times10^{25}}{6{,}67\times10^{-11} \times 2{,}339\times10^{10}} = \frac{2{,}925\times10^{27}}{1{,}560}'
            note: "Application numérique, puissances de dix traitées a part."
          - math: '\boxed{M_J \approx 1{,}88\times10^{27}\ \text{kg}}'
            note: "Valeur exacte 1,875 x 10^27 kg. La masse réelle de Jupiter est 1,898 x 10^27 kg : écart 1,2 pour cent, du aux données arrondies."
