          **(1 pt)** En appliquant la deuxième loi de Newton, montrer que l'équation différentielle vérifiée par la vitesse s'écrit sous la forme : $\dfrac{dv_G}{dt} + \dfrac{1}{\tau}.v_G = A$, en précisant l'expression du temps caractéristique $\tau$ en fonction de $k$ et $m$ et l'expression de la constante $A$ en fonction de $g$, $m$, $\rho$ et $V$.
        reasoning: |-
          On suit la méthode du chapitre 8 — bilan, deuxième loi, projection — avec le bilan à **trois** forces que le chapitre 8 établit en toute généralité. Ici l'énoncé précise que $\vec F_a$ n'est *pas* négligeable, donc on l'ajoute comme troisième force, constante, dirigée vers le haut (donc opposée au sens de l'axe $Oy$, orienté vers le bas comme au chapitre 8). On projette la deuxième loi sur cet axe, on divise par $m$, puis on regroupe : le terme en $v_G$ donne $1/\tau$ — exactement la même identification qu'au chapitre 8, inchangée par l'ajout d'Archimède, puisque seul le frottement dépend de $v_G$. Le terme constant, lui, absorbe désormais *deux* contributions — le poids et Archimède — plutôt qu'une seule ($A=g$ au chapitre 8) : c'est précisément là que la poussée d'Archimède change le résultat par rapport au cours.
        steps:
          - math: '\vec P + \vec f + \vec F_a = m\vec a'
            note: "Deuxième loi de Newton : le bilan à trois forces du chapitre 8, poussée d'Archimède comprise."
          - math: 'm\frac{dv_G}{dt} = mg - k\,v_G - \rho V g'
            note: "Projection sur (O, j) oriente vers le bas : poids +mg, frottement -k v_G, Archimede -rho V g (elle pointe vers le haut, contre le sens de l'axe)."
          - math: '\frac{dv_G}{dt} = \left(g - \frac{\rho V g}{m}\right) - \frac{k}{m}\,v_G'
            note: "On divise par m et on regroupe les termes constants d'un cote."
          - math: '\boxed{\frac{dv_G}{dt} + \frac{1}{\tau}\,v_G = A} \qquad \text{avec} \qquad \tau = \frac{m}{k} \qquad \text{et} \qquad A = g - \frac{\rho V g}{m}'
            note: "On identifie terme a terme : le coefficient de v_G donne 1/tau (inchangé par rapport au chapitre 8), le terme constant donne A (qui, lui, contient désormais Archimede)."
      - id: q2
        stem: |-
          **(0,5 pt)** Déterminer graphiquement la valeur de la vitesse limite $v_{Glim}$ et la valeur de $\tau$.
        reasoning: |-
          Même lecture graphique qu'au chapitre 8 et qu'au chapitre 9 (exemple travaillé, cette même bille) : la vitesse limite se lit à l'ordonnée du palier horizontal de la courbe $v_G(t)$ ; le temps caractéristique $\tau$ se lit à l'abscisse où la tangente à l'origine (pente $A$, l'équivalent local de $g$ ici) coupe cette asymptote. Sur la figure 2 fournie, le palier se situe à $v_{Glim}=0{,}50\ \text{m/s}$ et la tangente coupe l'asymptote à $t=54\ \text{ms}$.

          $$v_{Glim} = 0{,}50\ \text{m.s}^{-1} \qquad \tau = 54\ \text{ms} = 0{,}054\ \text{s}$$
      - id: q3
        stem: |-
          **(1 pt)** Trouver la valeur de $k$ et celle de $A$.
        reasoning: |-
          La question 1 a identifié $\tau=m/k$ et $A=g-\rho Vg/m$ — mais pour les *valeurs numériques*, pas besoin de connaître $\rho$, $V$ ni $g$ séparément : on dispose déjà de $m$ (donnée) et de $\tau$, $v_{Glim}$ (lus au graphe, question 2). $\tau=m/k$ s'inverse directement pour donner $k$. Et en régime permanent (chapitre 8 : « annuler l'accélération dans l'équation différentielle »), $0 = A - v_{Glim}/\tau$, donc $A = v_{Glim}/\tau$ — encore une fois, aucune résolution complète de l'équation différentielle, seulement une lecture au régime stabilisé.
        steps:
          - math: 'k = \frac{m}{\tau} = \frac{2\times10^{-2}}{0{,}054}'
            note: "On inverse tau = m/k (identification de la question 1), avec m donne et tau lu au graphe (question 2)."
          - math: '\boxed{k \approx 0{,}37\ \text{kg.s}^{-1}}'
            note: "Application numérique."
          - math: 'A = \frac{v_{Glim}}{\tau} = \frac{0{,}50}{0{,}054}'
            note: "En régime permanent (chapitre 8), v_Glim = A tau ; on isole A avec les deux valeurs lues au graphe."
          - math: '\boxed{A \approx 9{,}26\ \text{m.s}^{-2}}'
            note: "Cohérent avec l'équation numérique donnée a la question suivante : le pont se referme."
      - id: q4
        part: "Résolution numérique par la méthode d'Euler"
        stem: |-
          **(1 pt)** L'équation différentielle du mouvement de G s'écrit sous la forme numérique : $\dfrac{dv_G}{dt} = 9{,}26 - 18{,}52.v_G$.

          En utilisant la méthode d'Euler et les données du tableau suivant, calculer la valeur approchée de $a_3$ et celle de $v_4$.
        reasoning: |-
          Geste central d'Euler (chapitre 9) : la pente $a_i$ ne se lit jamais dans le tableau, elle se **recalcule** à chaque instant à partir de $v_i$ courant, via l'équation différentielle numérique donnée. On calcule d'abord $a_3$ en évaluant cette équation en $v_3=0{,}126\ \text{m/s}$ (la ligne $t=0{,}015\ \text{s}$) ; puis on avance d'un pas $\Delta t=0{,}005\ \text{s}$ (l'écart entre deux lignes du tableau) avec la formule $v_{i+1}=v_i+a_i\Delta t$ pour obtenir $v_4$.
        steps:
          - math: 'a_3 = 9{,}26 - 18{,}52\times v_3 = 9{,}26 - 18{,}52\times 0{,}126'
            note: "On evalue l'équation différentielle numérique en v_3 = 0,126 m/s (ligne t = 0,015 s du tableau)."
          - math: '\boxed{a_3 \approx 6{,}93\ \text{m.s}^{-2}}'
            note: "Déjà bien en dessous de A = 9,26 : le frottement mord de plus en plus, exactement le mécanisme du chapitre 8."
          - math: 'v_4 = v_3 + a_3\,\Delta t = 0{,}126 + 6{,}93\times 0{,}005'
            note: "Récurrence d'Euler entre t = 0,015 s et t = 0,020 s, avec le pas Delta t = 0,005 s lu dans le tableau."
          - math: '\boxed{v_4 \approx 0{,}161\ \text{m.s}^{-1}}'
            note: "Cohérent avec la suite du tableau (v = 0,192 m/s a t = 0,025 s), qui se reconstitue a l'identique par le même geste."

  # ── bk-2019-n-x4 — 2019 N, Exercice IV (Partie II) : saut, mouvement de projectile ──
  - id: bk-2019-n-x4
    title: "Saut en longueur à moto : mouvement d'un projectile après un tremplin"
    source:
      year: 2019
