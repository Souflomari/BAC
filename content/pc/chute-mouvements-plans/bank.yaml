    intro: |-
      **Chute verticale d'une bille dans un liquide (examen national, session normale 2024, Exercice 5 — Partie 1).**

      On étudie le mouvement, dans un liquide $(L)$, d'une bille $(S)$ de centre d'inertie $G$, homogène, de masse $m_B$, de volume $V_B$ et de masse volumique $\rho_B$.

      On étudie le mouvement de $G$ dans un repère $(O,\vec{k})$ lié à un référentiel terrestre supposé galiléen. On repère la position de $G$ à chaque instant $t$ par la cote $z$ sur l'axe vertical $(O,\vec{k})$ dirigé vers le bas.

      À l'instant de date $t_0$, prise comme origine des dates ($t_0=0$), on lâche la bille dans le liquide $(L)$ sans vitesse initiale d'une position où la cote de $G$ est nulle ($z=0$) (figure 1).

      Au cours de la chute dans le liquide, la bille $(S)$ est soumise, en plus de son poids, à : la force de frottement fluide $\vec{f} = -\mu.\vec{v}$ où $\vec{v} = v_z.\vec{k}$ et $\mu$ le coefficient de frottement fluide ; la poussée d'Archimède $\vec{F} = -\rho_L.V_B.\vec{g}$ où $g$ est l'intensité de la pesanteur et $\rho_L$ la masse volumique du liquide $(L)$.

      **Données :** Intensité de la pesanteur : $g = 10\ \text{m.s}^{-2}$ ; $m_B = 5{,}0\ \text{g}$ ; $\rho_B = 5{,}526 \times 10^{3}\ \text{kg.m}^{-3}$.

      **Figure 1 (schéma).** Le schéma occupe la marge droite de la page. À gauche du schéma, une colonne verticale grisée (parois en traits noirs, fond fermé) figure le liquide $(L)$ ; un disque noir plein y représente la bille, étiquetée « (S) » à droite de la colonne, à la hauteur de la bille. À droite de la colonne, un axe vertical orienté vers le bas porte, en haut, l'origine $O$ puis le vecteur $\vec{k}$ (courte flèche pleine orientée vers le bas) juste en dessous ; l'axe se termine en bas par une pointe de flèche étiquetée « z ». Une ligne horizontale en pointillés relie $O$ (sur l'axe) au haut de la colonne de liquide, marquant le niveau où $z = 0$ (position initiale de $G$).

      **Figure 2 (courbe).** $v_z\ (\text{m.s}^{-1})$ en fonction de $t\ (\text{s})$. Axe des ordonnées : traits principaux chiffrés $0{,}2$ et $0{,}4$, origine $0$ — 1 division principale $= 0{,}2\ \text{m.s}^{-1}$, avec un trait bleu à chaque demi-division ($0{,}1$) ; le cadre compte 4 divisions, soit $0{,}8\ \text{m.s}^{-1}$ de haut. Axe des abscisses : traits principaux chiffrés $0{,}1$ et $0{,}2$, origine $0$ — 1 division $= 0{,}1\ \text{s}$, même sous-quadrillage bleu à la demi-division ; le cadre compte 7 divisions, soit $0{,}7\ \text{s}$ de large. Courbe croissante et concave partant de l'origine $(0\,;\,0)$, tendant asymptotiquement vers un palier horizontal qui vient se coucher exactement sur le trait bleu de $v_\ell = 0{,}70\ \text{m.s}^{-1}$ (3,5 divisions au-dessus de l'axe) et le suit jusqu'au bord droit ; le palier est pratiquement atteint dès $t \simeq 0{,}4\ \text{s}$. La droite $(T)$, tracée en pointillés et étiquetée « (T) » à sa gauche, est tangente à la courbe à l'origine : elle part de $(0\,;\,0)$ et coupe l'asymptote exactement au repère $t = 0{,}1\ \text{s}$.
    questions:
      - id: q1
        part: "Établir le modèle"
        stem: |-
          **(0,75 pt)** En appliquant la deuxième loi de Newton, montrer que la vitesse $v_z(t)$ de $G$ obéit à l'équation différentielle : $\dfrac{dv_z}{dt} + \dfrac{1}{\tau}v_z = g\left(1-\dfrac{\rho_L}{\rho_B}\right)$ avec $\tau$ le temps caractéristique du mouvement de $(S)$.
        reasoning: |-
          Bilan à trois forces — poids, frottement, Archimède — comme au chapitre 8, et le même pas supplémentaire qu'au sujet 2022 : puisque la masse volumique donnée, $\rho_B$, est celle de la bille et non celle du liquide. On revient à la définition $m_B=\rho_B V_B$ pour exprimer $V_B=m_B/\rho_B$, on substitue dans le terme d'Archimède, puis on suit le chapitre 8 : projeter, diviser par $m_B$, identifier.
        steps:
          - math: 'm_B\vec a = \vec P + \vec f + \vec F'
            note: "Deuxième loi : les trois forces du chapitre 8 — poids, frottement, poussee d'Archimede."
          - math: 'm_B\frac{dv_z}{dt} = m_B g - \mu\,v_z - \rho_L V_B g'
            note: "Projection sur (O,k) oriente vers le bas : poids +m_B g, frottement -mu v_z, Archimede -rho_L V_B g."
          - math: 'm_B = \rho_B V_B \implies V_B = \frac{m_B}{\rho_B}'
            note: "La bille est homogène : définition de sa propre masse volumique rho_B -- même pont qu'au sujet 2022, ici avec rho_B au lieu de rho_a."
          - math: 'm_B\frac{dv_z}{dt} = m_B g\left(1-\frac{\rho_L}{\rho_B}\right) - \mu\,v_z'
            note: "On substitue V_B = m_B/rho_B dans le terme d'Archimede et on regroupe les termes constants."
          - math: '\boxed{\frac{dv_z}{dt} + \frac{1}{\tau}v_z = g\left(1-\frac{\rho_L}{\rho_B}\right)} \qquad \text{avec} \qquad \tau=\frac{m_B}{\mu}'
            note: "On divise par m_B : le coefficient de v_z redonne 1/tau, inchangé par Archimede."
      - id: q2a
        part: "Exploitation graphique de la figure 2"
        stem: |-
          **(0,25 pt)** Par exploitation de la courbe de la figure 2, déterminer la valeur de la vitesse limite $v_\ell$ du mouvement de $G$.
        reasoning: |-
          Comme au chapitre 8, la vitesse limite se lit directement comme l'ordonnée du palier horizontal, sans aucun calcul. Sur la figure 2, le palier vient se coucher exactement sur le trait bleu de demi-division.

          $$v_\ell \approx 0{,}70\ \text{m.s}^{-1}$$
      - id: q2b
        stem: |-
          **(0,25 pt)** Par exploitation de la courbe de la figure 2, déterminer la valeur de $\tau$ le temps caractéristique du mouvement de $G$.
        reasoning: |-
          Même lecture qu'au chapitre 8 : $\tau$ se lit à l'abscisse où la tangente à l'origine coupe le palier. Sur la figure 2, cette intersection tombe exactement sur le trait principal $t=0{,}1\ \text{s}$.

          $$\tau \approx 0{,}1000\ \text{s}$$
      - id: q2c
        stem: |-
          **(0,5 pt)** Par exploitation de la courbe de la figure 2, déterminer la valeur de l'accélération $a_0$ du mouvement de $G$ à l'instant $t_0 = 0$.
        reasoning: |-
          À $t=0$, $v_z=0$ : le frottement (qui dépend de $v_z$) est nul, mais la poussée d'Archimède, elle, ne dépend pas de $v_z$ et ne s'annule jamais — donc $a_0$ vaut exactement le terme constant de l'équation différentielle, $g(1-\rho_L/\rho_B)$, qui est aussi, par le même geste qu'au chapitre 8 (annuler l'accélération en régime permanent), égal à $v_\ell/\tau$. On peut donc obtenir $a_0$ sans nouvelle lecture graphique, à partir des deux valeurs déjà lues — exactement la méthode déjà utilisée pour $A$ au sujet 2018.
        steps:
          - math: 'a_0 = \left.\frac{dv_z}{dt}\right|_{t=0} = g\left(1-\frac{\rho_L}{\rho_B}\right) = \frac{v_\ell}{\tau}'
            note: "A t=0, v_z=0 : seul le terme constant subsiste ; régime permanent (chapitre 8) donne aussi v_ell/tau pour ce même terme."
          - math: 'a_0 = \frac{0{,}70}{0{,}1000}'
            note: "Application numérique avec les deux valeurs lues au graphe (questions 2-1 et 2-2)."
          - math: '\boxed{a_0 \approx 7{,}0\ \text{m.s}^{-2}}'
            note: "Cohérent avec la pente mesurée de la tangente (T) sur la figure 2."
      - id: q3
        stem: |-
          **(1 pt)** Déduire la valeur de $\mu$ et celle de $\rho_L$.
        reasoning: |-
          Deux inversions indépendantes : $\mu$ s'obtient en inversant $\tau=m_B/\mu$ (question 1) avec $\tau$ lu au graphe ; $\rho_L$ s'obtient en isolant $\rho_L$ dans la relation $a_0=g(1-\rho_L/\rho_B)$ établie à la question 2-3, avec $a_0$ lu (ou calculé) juste avant.
        steps:
          - math: '\mu = \frac{m_B}{\tau} = \frac{5{,}0\times 10^{-3}}{0{,}1000}'
            note: "On inverse tau = m_B/mu (question 1), avec m_B converti en kg (5,0 g = 5,0e-3 kg)."
          - math: '\boxed{\mu \approx 5{,}0\times 10^{-2}\ \text{kg.s}^{-1}}'
            note: "Application numérique."
          - math: 'a_0 = g\left(1-\frac{\rho_L}{\rho_B}\right) \implies \rho_L = \rho_B\left(1-\frac{a_0}{g}\right)'
            note: "On reprend la relation de la question 2-3 et on isole rho_L."
          - math: '\rho_L = 5{,}526\times 10^3\times\left(1-\frac{7{,}0}{10}\right)'
            note: "Application numérique."
          - math: '\boxed{\rho_L \approx 1{,}66\times 10^3\ \text{kg.m}^{-3}}'
            note: "Masse volumique du liquide (L)."

