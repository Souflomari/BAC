    intro: |-
      **Étude de la chute d'une balle (examen national, session normale 2023, Exercice 4 — Partie I).**

      Dans le champ de pesanteur, on lance verticalement vers le haut à l'instant $t = 0$, à partir d'un point $O$, une balle $(S)$ de masse $m$ et de centre d'inertie $G$, avec une vitesse initiale de valeur $V_0 = 12\ \text{m.s}^{-1}$ (figure 1).

      On étudie le mouvement du centre d'inertie $G$ de la balle dans un repère $(O\,;\,\vec{k})$ lié à un référentiel terrestre supposé galiléen en deux phases : mouvement de chute libre de la balle dans la première phase ; mouvement de chute de la balle avec frottement dans la deuxième phase.

