        figure 2, étendue du cadre jusqu'à 1,0 s / 1,0 m/s, palier
        V_ℓ = 0,880 m/s à deux traits fins au-dessus du repère 0,8, tangente
        coupant le palier à τ = 0,0995 ≈ 0,100 s, frontière zone1/zone2 à
        t = 0,50 s = 5τ, figure 1 sans graduation avec G déjà immergé), puis
        une passe de contrôle indépendante (agent-relecteur-de-contrôle,
