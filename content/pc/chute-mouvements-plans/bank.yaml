            note: "Valeur coherente avec la masse volumique tabulee de l'huile de ricin (environ 960 kg/m3)."

  # ── bk-2022-n-x4b — 2022 N, Exercice 4 (Partie 2) : satellite artificiel ──
  - id: bk-2022-n-x4b
    title: "Mouvement d'un satellite artificiel : vitesse orbitale et troisième loi de Kepler"
    source:
