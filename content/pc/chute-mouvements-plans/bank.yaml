    intro: |-
      **Mouvement d'un skieur : chute libre après un tremplin (examen national, session de rattrapage 2025 — Exercice 4, §1, 2 points).**

      *Les deux parties de cet exercice sont indépendantes. Le §2 — un pendule de torsion — est traité à part, sous la notion « Systèmes oscillants ». Rien de ce qui suit n'en dépend.*

      On étudie dans cette partie le mouvement de chute libre d'un skieur. Le skieur part du point $A$ de la piste $AO$ et arrive au point $O$ avec une vitesse $V_0 = 30\ \text{m.s}^{-1}$ (figure 1). A son arrivé au point $O$, le skieur quitte la piste et on le considère en chute libre. La trajectoire du mouvement du skieur est située dans un plan vertical. On modélise le skieur et son équipement par un solide $(S)$, de masse $m$ et de centre d'inertie $G$.

      **Donnée :** Intensité de la pesanteur : $g = 10\ \text{m.s}^{-2}$.

      On étudie le mouvement de chute libre du skieur dans un référentiel terrestre supposé galiléen. A $t = 0$, le centre d'inertie $G$ coïncide avec $O$.

      **Figure 1 (schéma, re-décrit depuis l'image, p. 5) :** repère $(O, x, y)$ : axe $y$ vertical ascendant, axe $x$ horizontal vers la droite passant par $O$. En haut à gauche, le point $A$, relié à l'axe $y$ par un trait en tirets horizontal ; de $A$ part une courbe concave (la piste) qui descend et s'infléchit pour arriver horizontalement en $O$, origine du repère. En $O$, les vecteurs unitaires $\vec{j}$ (vertical, sur l'axe $y$) et $\vec{i}$ (horizontal, sur l'axe $x$), puis le vecteur vitesse $\vec{V}_0$ horizontal vers la droite le long de l'axe $x$. Sous l'axe $x$, une droite oblique descendant de $O$ vers la droite (le plan incliné) jusqu'au point $Q$ en bas à droite ; un **segment horizontal explicite**, tracé sous l'axe $x$ et aboutissant en $Q$, matérialise l'horizontale ; l'angle entre le plan incliné et ce segment est marqué $\alpha$ (arc) en $Q$. Sur le plan incliné, le point $E$ (point noir) avec ses coordonnées repérées en tirets : $x_E$ sur l'axe $x$ (au-dessus) et $y_E$ sur l'axe $y$ (à gauche, sous $O$). Légende : « Figure 1 ».
    questions:
      - id: q1
        part: "§1 — Mouvement du skieur : établir le modèle, par la deuxième loi de Newton"
        stem: |-
          **1-** (0,5 pt) En appliquant la deuxième loi de Newton, établir, dans le repère orthonormé $(O, \vec{i}, \vec{j})$ lié au référentiel terrestre, les équations horaires numériques du mouvement $x(t)$ et $y(t)$ du centre d'inertie $G$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La deuxième loi de Newton elle-même — $\sum \vec F_{ext} = m\vec a_G$ — appartient au chapitre « Les lois de Newton », où elle est établie comme LE mécanisme central de toute la mécanique newtonienne ; c'est elle que l'énoncé demande d'appliquer, en toutes lettres. Ici on l'applique au cas particulier de la chute libre après un lancer horizontal — exactement la méthode du chapitre 3 de cette leçon-ci (« Chute libre et mouvements plans »), avec un angle de lancement particulièrement simple : $\alpha = 0$.

          **Le système, le référentiel, le bilan.** Système : le solide $(S)$, de masse $m$, réduit à son centre d'inertie $G$. Référentiel terrestre, supposé galiléen — l'énoncé le précise. « Chute libre » a un sens précis, déjà rencontré au chapitre 2 : le skieur n'est soumis qu'à son poids. Une seule force :

          $$\vec P = m\vec a_G \implies \vec a_G = \vec g$$

          La masse disparaît, comme toujours en chute libre.

          **La projection, avec le repère de la figure 1.** L'axe $y$ est vertical **ascendant**, l'axe $x$ horizontal — c'est très exactement le repère du chapitre 3, pas celui, inversé, d'un autre sujet de cette banque. $\vec g$ pointe vers le bas, donc dans le sens **opposé** à $\vec j$ :

          $$a_x = 0 \qquad a_y = -g = -10\ \text{m.s}^{-2}$$

          **Les conditions initiales.** A $t=0$, $G$ coïncide avec $O$, l'origine : $x(0)=0$, $y(0)=0$. La vitesse $\vec V_0$ est horizontale — le vecteur, sur la figure, est porté tout entier par l'axe $x$ — donc entièrement portée par $\vec i$ :

          $$V_{0x} = V_0 = 30\ \text{m.s}^{-1} \qquad V_{0y} = 0$$

          C'est le cas particulier $\alpha=0$ du chapitre 3 : $v_{0x}=v_0\cos 0^\circ=v_0$ et $v_{0y}=v_0\sin 0^\circ=0$.

          **Deux primitivations.**

          $$v_x(t) = V_0 \qquad v_y(t) = -g\,t$$

          $$\boxed{x(t) = V_0\,t = 30\,t} \qquad \boxed{y(t) = -\frac12 g\,t^2 = -5\,t^2}$$

          (en mètres, $t$ en secondes.)

          **Le piège nommé de cette question.** Décomposer $V_0$ avec un sinus et un cosinus comme si le lancer était incliné. Ici $V_0$ est **horizontale** — le vecteur $\vec V_0$ de la figure 1 est porté par l'axe $x$ tout entier — donc $V_{0y}=0$ sans aucun calcul trigonométrique à faire ; l'écrire quand même (en insérant un angle qui n'existe pas dans cette question) ne change rien numériquement ici, mais c'est le réflexe qui, à la question suivante, ferait perdre le lien direct entre le coefficient de $t^2$ et $g/2$.
        steps:
          - math: '\vec P = m\vec a_G \implies \vec a_G = \vec g'
            note: "Deuxième loi de Newton (chapitre Les lois de Newton) : chute libre, une seule force, le poids."
          - math: 'a_x = 0 \qquad a_y = -g = -10\ \text{m.s}^{-2}'
            note: "Projection sur (O, i, j) : j vertical ascendant (chapitre 3), g oppose a j."
          - math: 'V_{0x}=V_0=30\ \text{m.s}^{-1} \qquad V_{0y}=0'
            note: "V0 est horizontale sur la figure 1 : cas particulier alpha=0 du chapitre 3."
          - math: '\boxed{x(t) = 30\,t} \qquad \boxed{y(t) = -5\,t^2}'
            note: "Deux primitivations, avec les conditions initiales x(0)=y(0)=0 (G confondu avec O a t=0)."
      - id: q2
        stem: |-
          **2-** (0,5 pt) Déduire que l'équation de la trajectoire du centre d'inertie $G$ s'écrit : $y = -5{,}56\cdot10^{-3}\,x^{2}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Même geste qu'au chapitre 4 : éliminer le temps entre les deux équations horaires pour obtenir la forme géométrique $y(x)$ de la trajectoire, indépendante de l'instant considéré.

          **On isole $t$ dans la relation la plus simple.**

          $$x=30\,t \implies t=\frac{x}{30}$$

          **On reporte dans $y(t)$.**

          $$y=-5\left(\frac{x}{30}\right)^2=-\frac{5}{900}x^2$$

          **Le calcul du coefficient, chiffre par chiffre.**

          $$\frac{5}{900}=\frac{1}{180}=5{,}555\ldots\times10^{-3}\approx5{,}56\times10^{-3}$$

          $$\boxed{y=-5{,}56\times10^{-3}\,x^2}$$

          **Pourquoi il n'y a pas de terme en $x$.** Au chapitre 4, la formule générale est $y(x)=\tan\alpha\cdot x - \dfrac{g}{2v_0^2\cos^2\alpha}x^2$ ; ici $\alpha=0$, donc $\tan\alpha=0$ et le premier terme disparaît entièrement — ce n'est pas un cas oublié par la leçon, c'est exactement la limite $\alpha\to0°$ déjà vérifiée au chapitre 3 (« si $\alpha\to0°$, $v_{0y}=0$ »). Ne pas s'étonner de l'absence du terme linéaire : c'est la signature d'un lancer parfaitement horizontal.

          **Le piège nommé de cette question.** Oublier le carré au dénominateur du diviseur $30$ et écrire $-5/30=-0{,}167$ au lieu de $-5/900$. Le contrôle immédiat : $30^2=900$, jamais $30$.
        steps:
          - math: 't=\frac{x}{30}'
            note: "On isole t dans x(t) (la plus simple des deux équations, chapitre 4)."
          - math: 'y = -5\left(\frac{x}{30}\right)^2 = -\frac{5}{900}x^2'
            note: "On reporte dans y(t)."
          - math: '\boxed{y = -5{,}56\times10^{-3}\,x^2}'
            note: "5/900 = 1/180 = 5,555...e-3, arrondi a 5,56e-3."
      - id: q3
        stem: |-
          **3-** (1 pt) Le skieur tombe au point $E$ du plan incliné de l'angle $\alpha = 20°$ par rapport à l'horizontale. Trouver la distance $d = OE$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La question la plus chère de la partie, et un geste que la leçon (chapitre 5) ne montre jamais tel quel : le chapitre 5 calcule la **portée**, c'est-à-dire l'intersection de la trajectoire avec l'axe horizontal $y=0$ — un cas particulier. Ici, le sol d'atterrissage n'est pas horizontal, c'est le plan incliné de la figure 1 : il faut **poser le système** formé par les deux courbes — la trajectoire parabolique et la droite du plan incliné — et le résoudre, sans deviner.

          **L'équation de la droite du plan incliné, lue sur la figure 1.** Le plan part de $O$ et descend vers la droite jusqu'à $Q$, à l'angle $\alpha$ sous l'horizontale (l'arc marqué en $Q$, entre le plan et le segment horizontal explicite tracé sous l'axe $x$). Pour tout point du plan, d'abscisse $x\geq0$, l'ordonnée est donc :

          $$y_{plan}(x) = -x\tan\alpha$$

          (le signe moins parce que $y$ est ascendant et que le plan descend sous $O$).

          **Le système à résoudre.** Le point $E$ appartient à la fois à la trajectoire (question 2) et au plan incliné :

          $$\begin{cases} y = -5{,}56\times10^{-3}\,x^2 \\ y = -x\tan\alpha \end{cases}$$

          **On égale les deux membres de droite.**

          $$-5{,}56\times10^{-3}\,x^2 = -x\tan\alpha$$

          $$x\left(5{,}56\times10^{-3}\,x - \tan\alpha\right)=0$$

          Deux solutions : $x=0$ (c'est $O$ lui-même, le point de départ — à rejeter, ce n'est pas $E$) et :

          $$x_E = \frac{\tan\alpha}{5{,}56\times10^{-3}}$$

          **L'application numérique, chiffre par chiffre.** $\tan 20° = 0{,}36397$.

          $$x_E = \frac{0{,}36397}{5{,}56\times10^{-3}} \approx 65{,}5\ \text{m}$$

          **On reporte pour trouver $y_E$**, sur l'une ou l'autre équation (les deux doivent s'accorder — c'est le contrôle) :

          $$y_E = -x_E\tan\alpha = -65{,}5\times0{,}36397 \approx -23{,}8\ \text{m}$$

          Vérification par la trajectoire : $y_E=-5{,}56\times10^{-3}\times65{,}5^2\approx-23{,}9\ \text{m}$ — les deux méthodes s'accordent, à l'arrondi près.

          **La distance $OE$, le long du plan — pas une différence de coordonnées.** $E$ est sur le plan incliné, donc la distance $d=OE$ se relie à $x_E$ par le cosinus de l'angle du plan (le triangle rectangle formé par $O$, le pied de $E$ sur l'axe $x$, et $E$) :

          $$d = \frac{x_E}{\cos\alpha} = \frac{65{,}5}{0{,}93969}$$

          $$\boxed{d \approx 69{,}7\ \text{m}}$$

          **Le piège nommé de cette question.** Confondre $x_E$ (l'abscisse) avec $d=OE$ (la distance parcourue le long du plan). $x_E$ n'est que la projection horizontale de $OE$ ; $E$ étant sur une pente à $20°$, la distance réelle le long du plan est plus grande que $x_E$ — c'est précisément pour ça qu'on divise par $\cos\alpha$ (inférieur à 1) plutôt que de recopier $x_E$ tel quel.
        steps:
          - math: 'y_{plan}(x) = -x\tan\alpha'
            note: "Droite du plan incline, lue sur la figure 1 : part de O, descend a l'angle alpha sous l'horizontale."
          - math: '-5{,}56\times10^{-3}\,x^2 = -x\tan\alpha \implies x_E = \frac{\tan\alpha}{5{,}56\times10^{-3}}'
            note: "On pose le système trajectoire + plan incline et on ecarte la solution x=0 (le point O lui-même)."
          - math: 'x_E = \frac{0{,}36397}{5{,}56\times10^{-3}} \approx 65{,}5\ \text{m} \qquad y_E \approx -23{,}8\ \text{m}'
            note: "Application numérique ; y_E verifie par les deux équations."
          - math: '\boxed{d = OE = \frac{x_E}{\cos\alpha} \approx 69{,}7\ \text{m}}'
            note: "Distance le long du plan, pas la simple abscisse x_E : on divise par cos(alpha)."

