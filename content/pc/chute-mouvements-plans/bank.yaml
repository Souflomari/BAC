  # ── bk-2018-n-x4 — 2018 N, Exercice IV (Partie I) : bille, Archimède, Euler ──
  - id: bk-2018-n-x4
    title: "Chute d'une bille dans un liquide visqueux : poussée d'Archimède et méthode d'Euler"
    source:
      year: 2018
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice IV — Partie I- Étude du mouvement de chute verticale d'une bille dans un liquide visqueux"
    bareme_total: 3.5
    duration_min: 21
    sourcing:
      status: sourced
      note: >-
        2018 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/57726 (Exercice IV, Partie I — chute
        verticale d'une bille dans un liquide visqueux avec poussée
        d'Archimède non négligeable et méthode d'Euler ; barème de la partie
        = 3,5 pt sur les 5,5 pt de l'exercice complet, qui comporte aussi une
        Partie II sur un oscillateur solide-ressort, transcrite sous
        systemes-oscillants.md). Transcription vérifiée : re-fetch
        indépendant AlloSchool + diff caractère par caractère par un second
        agent (docs/sujets/pc/chute-mouvements-plans.md, statut « vérifié »,
        2026-08-06) ; figures 1 et 2 jugées conformes au zoom ; physique
        re-dérivée et auto-cohérente (a₃ = 6,93 m.s⁻², v₄ = 0,161 m.s⁻¹,
        v_Glim = 0,500 m.s⁻¹, τ = 0,054 s, tous corroborés par l'équation
        numérique donnée à la question 4). SCOPE NOTE (voir l'en-tête du
        fichier) : la question 1 exige d'inclure la poussée d'Archimède
        F_a = ρVg dans le bilan des forces — le rung 7 de la leçon
        (lesson.md) n'établit explicitement l'équation différentielle
        qu'avec un bilan à deux forces (poids + frottement) ; le pont est
        fait au point d'usage dans le raisonnement de la question 1.
    intro: |-
      **Étude du mouvement de chute verticale d'une bille dans un liquide visqueux, poussée d'Archimède non négligeable (examen national, session normale 2018, Exercice IV — Partie I).**

      Afin de déterminer quelques caractéristiques du mouvement de chute d'une bille dans un liquide visqueux, on réalise l'expérience suivante :

      On remplit une éprouvette graduée par un liquide visqueux et transparent, de masse volumique $\rho$, puis on libère, sans vitesse initiale dans ce liquide, une bille de masse $m = 2.10^{-2}\ \text{kg}$, de volume $V$ et de centre d'inertie G.

      On étudie le mouvement du centre d'inertie G dans un repère $(O, \vec{j})$ lié à un référentiel terrestre considéré comme galiléen. La position instantanée du centre d'inertie G est repérée sur un axe vertical $\overrightarrow{Oy}$ orienté vers le bas (figure 1). On considère que la position de G à l'instant $t = 0$ est confondue avec l'origine de l'axe $Oy$ et que la poussée d'Archimède $\vec{F_a}$ n'est pas négligeable devant les autres forces exercées sur la bille.

      La force de frottement fluide est modélisée par $\vec{f} = -k.\vec{v_G}$ ($\vec{v_G}$ étant le vecteur vitesse instantanée du centre d'inertie G et $k$ une constante positive).

      On rappelle que l'intensité de la poussée d'Archimède vaut le poids du liquide déplacé : $F_a = \rho.V.g$, où $g$ est l'intensité de pesanteur.

      Avec une caméra numérique et un logiciel adapté, on obtient, après traitement des données expérimentales, la courbe des variations de la vitesse instantanée du centre d'inertie de la bille en fonction du temps (voir figure 2).

      **Figure 1 (schéma).** Une éprouvette graduée verticale, remplie de liquide visqueux, est posée sur un pied. L'axe $(O,\vec j)$ est tracé à gauche de l'éprouvette, $\vec j$ orienté vers le bas ; un cercle en pointillés, au niveau de $O$ (en haut du liquide), marque la position initiale du centre d'inertie $G$ de la bille à $t=0$ ; plus bas dans l'éprouvette, un disque noir plein représente la bille à un instant ultérieur de sa chute.

      **Figure 2 (courbe).** $v_G$ (en m/s) en fonction de $t$ (en ms). La courbe part de l'origine, croît de façon concave, et tend asymptotiquement vers un palier horizontal à $v_{Glim} = 0{,}50\ \text{m.s}^{-1}$. Une droite en pointillés, tangente à la courbe à l'origine, coupe cette asymptote à $t = 54\ \text{ms}$.

      **Tableau de mesures (pour la méthode d'Euler, pas $\Delta t = 0{,}005\ \text{s}$ entre deux lignes consécutives).**

      | $t\ (\text{s})$ | $v_G\ (\text{m.s}^{-1})$ | $a_G\ (\text{m.s}^{-2})$ |
      |:---:|:---:|:---:|
      | ⋮ | ⋮ | ⋮ |
      | $0{,}015$ | $0{,}126$ | $a_3$ |
      | $0{,}020$ | $v_4$ | $6{,}28$ |
      | $0{,}025$ | $0{,}192$ | $5{,}70$ |
    questions:
      - id: q1
        part: "Partie I- Étude du mouvement de chute verticale d'une bille dans un liquide visqueux : établir le modèle"
        stem: |-
          **(1 pt)** En appliquant la deuxième loi de Newton, montrer que l'équation différentielle vérifiée par la vitesse s'écrit sous la forme : $\dfrac{dv_G}{dt} + \dfrac{1}{\tau}.v_G = A$, en précisant l'expression du temps caractéristique $\tau$ en fonction de $k$ et $m$ et l'expression de la constante $A$ en fonction de $g$, $m$, $\rho$ et $V$.
        reasoning: |-
          On suit la méthode du rung 7 — bilan, deuxième loi, projection — mais avec un bilan à **trois** forces, pas deux : le rung ne traite explicitement que poids + frottement, sans poussée d'Archimède. Ici l'énoncé précise que $\vec F_a$ n'est *pas* négligeable, donc on l'ajoute comme troisième force, constante, dirigée vers le haut (donc opposée au sens de l'axe $Oy$, orienté vers le bas comme au rung 7). On projette la deuxième loi sur cet axe, on divise par $m$, puis on regroupe : le terme en $v_G$ donne $1/\tau$ — exactement la même identification qu'au rung 7, inchangée par l'ajout d'Archimède, puisque seul le frottement dépend de $v_G$. Le terme constant, lui, absorbe désormais *deux* contributions — le poids et Archimède — plutôt qu'une seule ($A=g$ au rung 7) : c'est précisément là que la poussée d'Archimède change le résultat par rapport au cours.
        steps:
          - math: '\vec P + \vec f + \vec F_a = m\vec a'
            note: "Deuxieme loi de Newton : trois forces cette fois (le rung 7 du cours n'en compte que deux)."
          - math: 'm\frac{dv_G}{dt} = mg - k\,v_G - \rho V g'
            note: "Projection sur (O, j) oriente vers le bas : poids +mg, frottement -k v_G, Archimede -rho V g (elle pointe vers le haut, contre le sens de l'axe)."
          - math: '\frac{dv_G}{dt} = \left(g - \frac{\rho V g}{m}\right) - \frac{k}{m}\,v_G'
            note: "On divise par m et on regroupe les termes constants d'un cote."
          - math: '\boxed{\frac{dv_G}{dt} + \frac{1}{\tau}\,v_G = A} \qquad \text{avec} \qquad \tau = \frac{m}{k} \qquad \text{et} \qquad A = g - \frac{\rho V g}{m}'
            note: "On identifie terme a terme : le coefficient de v_G donne 1/tau (inchange par rapport au rung 7), le terme constant donne A (qui, lui, contient desormais Archimede)."
      - id: q2
        stem: |-
          **(0,5 pt)** Déterminer graphiquement la valeur de la vitesse limite $v_{Glim}$ et la valeur de $\tau$.
        reasoning: |-
          Même lecture graphique qu'au rung 7 et qu'au rung 8 (exemple travaillé, cette même bille) : la vitesse limite se lit à l'ordonnée du palier horizontal de la courbe $v_G(t)$ ; le temps caractéristique $\tau$ se lit à l'abscisse où la tangente à l'origine (pente $A$, l'équivalent local de $g$ ici) coupe cette asymptote. Sur la figure 2 fournie, le palier se situe à $v_{Glim}=0{,}50\ \text{m/s}$ et la tangente coupe l'asymptote à $t=54\ \text{ms}$.

          $$v_{Glim} = 0{,}50\ \text{m.s}^{-1} \qquad \tau = 54\ \text{ms} = 0{,}054\ \text{s}$$
      - id: q3
        stem: |-
          **(1 pt)** Trouver la valeur de $k$ et celle de $A$.
        reasoning: |-
          La question 1 a identifié $\tau=m/k$ et $A=g-\rho Vg/m$ — mais pour les *valeurs numériques*, pas besoin de connaître $\rho$, $V$ ni $g$ séparément : on dispose déjà de $m$ (donnée) et de $\tau$, $v_{Glim}$ (lus au graphe, question 2). $\tau=m/k$ s'inverse directement pour donner $k$. Et en régime permanent (rung 7 : « annuler l'accélération dans l'équation différentielle »), $0 = A - v_{Glim}/\tau$, donc $A = v_{Glim}/\tau$ — encore une fois, aucune résolution complète de l'équation différentielle, seulement une lecture au régime stabilisé.
        steps:
          - math: 'k = \frac{m}{\tau} = \frac{2\times10^{-2}}{0{,}054}'
            note: "On inverse tau = m/k (identification de la question 1), avec m donne et tau lu au graphe (question 2)."
          - math: '\boxed{k \approx 0{,}37\ \text{kg.s}^{-1}}'
            note: "Application numerique."
          - math: 'A = \frac{v_{Glim}}{\tau} = \frac{0{,}50}{0{,}054}'
            note: "En regime permanent (rung 7), v_Glim = A tau ; on isole A avec les deux valeurs lues au graphe."
          - math: '\boxed{A \approx 9{,}26\ \text{m.s}^{-2}}'
            note: "Coherent avec l'equation numerique donnee a la question suivante : le pont se referme."
      - id: q4
        part: "Résolution numérique par la méthode d'Euler"
        stem: |-
          **(1 pt)** L'équation différentielle du mouvement de G s'écrit sous la forme numérique : $\dfrac{dv_G}{dt} = 9{,}26 - 18{,}52.v_G$.

          En utilisant la méthode d'Euler et les données du tableau suivant, calculer la valeur approchée de $a_3$ et celle de $v_4$.
        reasoning: |-
          Geste central d'Euler (rung 8) : la pente $a_i$ ne se lit jamais dans le tableau, elle se **recalcule** à chaque instant à partir de $v_i$ courant, via l'équation différentielle numérique donnée. On calcule d'abord $a_3$ en évaluant cette équation en $v_3=0{,}126\ \text{m/s}$ (la ligne $t=0{,}015\ \text{s}$) ; puis on avance d'un pas $\Delta t=0{,}005\ \text{s}$ (l'écart entre deux lignes du tableau) avec la formule $v_{i+1}=v_i+a_i\Delta t$ pour obtenir $v_4$.
        steps:
          - math: 'a_3 = 9{,}26 - 18{,}52\times v_3 = 9{,}26 - 18{,}52\times 0{,}126'
            note: "On evalue l'equation differentielle numerique en v_3 = 0,126 m/s (ligne t = 0,015 s du tableau)."
          - math: '\boxed{a_3 \approx 6{,}93\ \text{m.s}^{-2}}'
            note: "Deja bien en dessous de A = 9,26 : le frottement mord de plus en plus, exactement le mecanisme du rung 7."
          - math: 'v_4 = v_3 + a_3\,\Delta t = 0{,}126 + 6{,}93\times 0{,}005'
            note: "Recurrence d'Euler entre t = 0,015 s et t = 0,020 s, avec le pas Delta t = 0,005 s lu dans le tableau."
          - math: '\boxed{v_4 \approx 0{,}161\ \text{m.s}^{-1}}'
            note: "Coherent avec la suite du tableau (v = 0,192 m/s a t = 0,025 s), qui se reconstitue a l'identique par le meme geste."

  # ── bk-2019-n-x4 — 2019 N, Exercice IV (Partie II) : saut, mouvement de projectile ──
  - id: bk-2019-n-x4
    title: "Saut en longueur à moto : mouvement d'un projectile après un tremplin"
    source:
      year: 2019
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice IV — II- Etude du mouvement de G lors de la phase du saut"
    bareme_total: 2
    duration_min: 12
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), AlloSchool NS28F, element/68300 (Exercice IV, Partie II —
        mouvement plan d'un projectile après un tremplin, sans frottement ;
        barème de la partie = 2 pt sur les 5 pt de l'exercice complet, dont
        la Partie I — plan incliné / force motrice / 2ᵉ loi — est transcrite
        sous lois-de-newton.md). Transcription vérifiée : re-fetch
        indépendant AlloSchool + diff caractère par caractère par un second
        agent, PUIS la figure 1 relue indépendamment en quatre passes
        successives (six corrections identifiées en 2ᵉ passe, deux
        corrections supplémentaires en 3ᵉ passe, aucune correction en 4ᵉ
        passe — qui promeut l'entrée après mesures au pixel ;
        docs/sujets/pc/chute-mouvements-plans.md, statut « vérifié »,
        2026-08-06). Physique re-dérivée et cohérente
        ($V_C=\sqrt{19{,}02^2+6{,}18^2}=20{,}0$ m.s⁻¹, $\tan\alpha=6{,}18/19{,}02
        \Rightarrow \alpha=18{,}0°$, retombée à $t=6{,}18/5=1{,}236$ s d'où
        $CP=23{,}5$ m $<30$ m — saut non réussi ; $V_{min}=\sqrt{30g/\sin2\alpha}
        \approx 22{,}6$ m.s⁻¹).
    intro: |-
      **Le saut en longueur à moto : mouvement du centre d'inertie d'un système mécanique (examen national, session normale 2019, Exercice IV — Partie II).**

      Le saut en longueur à moto est une épreuve sportive de performance où il y a un véritable défi de sauter le plus loin à partir d'un espace défini. Cet exercice se propose d'étudier le mouvement du centre d'inertie G d'un système (S) formé d'un motard et d'une moto se déplaçant sur une piste de compétition.

      Cette piste est formée d'une partie rectiligne A'B' inclinée d'un angle β par rapport à l'horizontale, d'un tremplin B'C' circulaire, et d'une zone d'atterrissage (π) plane et horizontale (figure 1). Dans tout l'exercice, les frottements sont négligés et l'étude du mouvement du centre d'inertie G est réalisée dans le référentiel terrestre considéré comme galiléen.

      **Données :** l'angle $\beta = 10°$ ; intensité de la pesanteur $g = 10\ \text{m.s}^{-2}$ ; masse du système (S) : $m = 190\ \text{kg}$.

      **Figure 1 (schéma — partie utile à cette Partie II).** À gauche, le plan incliné rectiligne A'B' ; puis le tremplin circulaire, de B' à C'. Le repère $(C, \vec{i_1}, \vec{j_1})$ a pour origine $C$, à l'aplomb de l'extrémité haute $C'$ du tremplin, sur la trajectoire en pointillés du centre d'inertie G : $\vec{j_1}$ est porté par l'axe vertical, fléché vers le haut ; $\vec{i_1}$ par l'axe horizontal, fléché vers la droite ; ces deux axes ne sont pas gradués. Le vecteur $\vec{V_C}$ part de $C$ en faisant l'angle $\alpha$ avec $\vec{i_1}$, tangent à la trajectoire. De $C$ part un arc en pointillés (la trajectoire du saut) qui monte, culmine, puis redescend et recoupe l'axe horizontal au point $P$ — $P$ est donc à la même hauteur que $C$ (d'où $y_G=0$ en $P$). La zone d'atterrissage (π), une bande horizontale, est tracée en dessous de cet axe, un peu plus bas que $P$.

      **II- Etude du mouvement de G lors de la phase du saut**

      À un instant choisi comme nouvelle origine des dates (t = 0), le système (S) quitte le tremplin lors du passage de G par le point C avec une vitesse $\vec{V_C}$ formant un angle $\alpha = 18°$ avec l'horizontale. (S) retombe en une position où le point G se confond avec le point P. On suppose que le système n'est soumis qu'à son poids au cours de cette phase. L'étude du mouvement est effectuée dans le repère orthonormé $(C, \vec{i_1}, \vec{j_1})$ indiqué sur la figure 1.
    questions:
      - id: q1
        part: "II — Etude du mouvement de G lors de la phase du saut : établir le modèle"
        stem: |-
          **(0,5 pt)** En appliquant la deuxième loi de Newton, montrer que les équations différentielles vérifiées par les coordonnées $x_G(t)$ et $y_G(t)$ du centre d'inertie G dans le repère $(C, \vec{i_1}, \vec{j_1})$ s'écrivent ainsi : $\dfrac{dx_G}{dt} = V_C.\cos\alpha$ et $\dfrac{dy_G}{dt} = -g.t + V_C.\sin\alpha$
        reasoning: |-
          C'est très exactement la méthode du rung 2, transposée telle quelle : le système ne subit que son poids (frottements négligés), donc $\vec a_G=\vec g$, et cette accélération se projette en deux équations **indépendantes** sur le repère $(C,\vec i_1,\vec j_1)$ — $a_x=0$, $a_y=-g$ — parce que $\vec g$ est purement vertical. Ce que l'énoncé appelle ici « équations différentielles » sont en réalité les vitesses déjà primitivées une fois, avec pour condition initiale la vitesse $\vec V_C$ au passage par $C$ (l'instant $t=0$ de cette phase) : $v_{0x}=V_C\cos\alpha$ et $v_{0y}=V_C\sin\alpha$, la même décomposition qu'au rung 2.
        steps:
          - math: '\vec P = m\vec a_G \implies \vec a_G = \vec g'
            note: "Seul le poids s'exerce (frottements negliges) : deuxieme loi de Newton, exactement comme au rung 2."
          - math: 'a_x = 0 \qquad a_y = -g'
            note: "Projection sur (C, i1, j1) : j1 vertical vers le haut, i1 horizontal, meme repere-type qu'au rung 2 (g purement vertical)."
          - math: '\boxed{\frac{dx_G}{dt} = V_C\cos\alpha \qquad \frac{dy_G}{dt} = -g\,t + V_C\sin\alpha}'
            note: "Premiere primitivation, avec la vitesse initiale V_C au point C decomposee comme au rung 2 : V_C cos(alpha) et V_C sin(alpha)."
      - id: q2
        stem: |-
          **(0,5 pt)** Les expressions numériques des équations horaires $x_G(t)$ et $y_G(t)$ du mouvement de G s'écrivent ainsi : $x_G(t) = 19{,}02.t$ et $y_G(t) = -5.t^2 + 6{,}18.t$ ($x_G$ et $y_G$ exprimées en mètre et $t$ en seconde). Vérifier que la vitesse de G au point C est : $V_C = 20\ \text{m.s}^{-1}$.
        reasoning: |-
          On identifie d'abord les deux composantes de la vitesse initiale en comparant les équations horaires numériques aux formes générales du rung 2 : le coefficient de $t$ dans $x_G(t)$ est $v_{0x}=V_C\cos\alpha$, et celui dans $y_G(t)$ (à côté du terme en $t$, sachant que le coefficient de $t^2$ vaut $-g/2$) est $v_{0y}=V_C\sin\alpha$. Une fois les deux composantes connues, on remonte à la norme par Pythagore — la démarche inverse de la décomposition $v_{0x}=v_0\cos\alpha$, $v_{0y}=v_0\sin\alpha$ vue au rung 2.
        steps:
          - math: 'x_G(t) = V_C\cos\alpha \cdot t = 19{,}02\,t \implies V_C\cos\alpha = 19{,}02\ \text{m.s}^{-1}'
            note: "On identifie le coefficient de t dans x_G(t) a V_C cos(alpha) (rung 2)."
          - math: 'y_G(t) = V_C\sin\alpha \cdot t - \frac{g}{2}t^2 = 6{,}18\,t - 5\,t^2 \implies V_C\sin\alpha = 6{,}18\ \text{m.s}^{-1}'
            note: "Meme identification sur y_G(t) : le coefficient de t donne V_C sin(alpha) (et -g/2 = -5 confirme au passage g = 10 m/s^2)."
          - math: 'V_C = \sqrt{(V_C\cos\alpha)^2 + (V_C\sin\alpha)^2} = \sqrt{19{,}02^2 + 6{,}18^2}'
            note: "Norme du vecteur vitesse : on remonte des deux composantes a V_C par Pythagore."
          - math: '\boxed{V_C \approx 20{,}0\ \text{m.s}^{-1}}'
            note: "Verification demandee par l'enonce."
      - id: q3a
        part: "Un saut réussi ou non ? (condition CP ≥ 30 m)"
        stem: |-
          **(0,5 pt)** On considère qu'un saut est réussi si la condition $CP \geq 30\ \text{m}$ est vérifiée. Montrer que le saut effectué dans ce cas n'est pas réussi.
        reasoning: |-
          Exactement la méthode « portée » du rung 4 : $P$ est le point où $G$ retombe à la même hauteur que $C$ (donc $y_G=0$), l'autre racine — en plus de $t=0$ — de $y_G(t)=0$. On la trouve en factorisant $y_G(t)$ ; puis $CP$ est la position horizontale $x_G$ à cet instant. On compare le résultat numérique aux $30\ \text{m}$ exigés : c'est en dessous, le saut échoue.
        steps:
          - math: 'y_G(t) = 0 \implies t\left(-5\,t + 6{,}18\right) = 0 \implies t = 0 \ \text{ou}\ t_P = \frac{6{,}18}{5}'
            note: "Meme geste qu'au rung 4 pour la portee : le point d'atterrissage est l'autre racine de y(t) = 0."
          - math: '\boxed{t_P \approx 1{,}236\ \text{s}}'
            note: "Instant ou G repasse par la hauteur de C (P est a la meme hauteur que C, figure 1)."
          - math: 'CP = x_G(t_P) = 19{,}02\times 1{,}236'
            note: "La portee est la position horizontale a cet instant, comme au rung 4."
          - math: '\boxed{CP \approx 23{,}5\ \text{m} < 30\ \text{m}}'
            note: "La condition CP >= 30 m n'est pas verifiee : le saut n'est pas reussi."
      - id: q3b
        stem: |-
          **(0,5 pt)** Déterminer la vitesse minimale $V_{min}$ avec laquelle doit passer G par le point C pour que le saut soit réussi.
        reasoning: |-
          On réutilise directement la formule de la portée établie au rung 4, $D=\dfrac{v_0^2\sin(2\alpha)}{g}$, en gardant l'angle $\alpha=18°$ fixé (rien dans l'énoncé ne le change) et en faisant varier seulement la vitesse au décollage $V_0=V_C$. La vitesse minimale est celle qui amène $D$ exactement au seuil de réussite, $D=30\ \text{m}$ : on résout pour $V_{min}$.
        steps:
          - math: 'D(\alpha, V_0) = \frac{V_0^2\sin(2\alpha)}{g}'
            note: "Formule de la portee du rung 4, avec alpha = 18 degres fixe (seule la vitesse au tremplin change ici)."
          - math: '30 = \frac{V_{min}^2\sin(2\times 18^\circ)}{g} \implies V_{min}^2 = \frac{30\,g}{\sin 36^\circ}'
            note: "On impose CP = 30 m exactement (le seuil de reussite) et on isole V_min."
          - math: 'V_{min}^2 = \frac{30\times 10}{0{,}588} \approx 510'
            note: "Application numerique avec g = 10 et sin(36 degres) = 0,588."
          - math: '\boxed{V_{min} \approx 22{,}6\ \text{m.s}^{-1}}'
            note: "Racine carree ; c'est la vitesse minimale au tremplin pour reussir le saut."

