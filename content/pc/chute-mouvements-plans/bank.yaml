        stem: |-
          **(0,5 pt)** Montrer que l'équation différentielle vérifiée par la vitesse $v_z$ du centre d'inertie $G$ de la balle s'écrit : $\dfrac{dv_z}{dt} + \dfrac{1}{\tau}v_z + g = 0$ avec $\tau$ le temps caractéristique du mouvement.
        reasoning: |-
          Même bilan à deux forces qu'au rung 7 (poids + frottement linéaire), mais avec un choix d'axe différent de l'exemple travaillé du rung 7 : ici l'axe $Z$ reste orienté **vers le haut** (figure 1), et non vers le bas. Exactement la leçon du rung 1 sur l'arbitraire du signe : le poids se projette donc négativement sur cet axe, ce qui fait apparaître un « $+g$ » au lieu du « $=g$ » du rung 7 — la physique est identique, seule la convention de signe change le visage de l'équation.
        steps:
          - math: 'm\vec a = \vec P + \vec f'
            note: "Deuxieme loi de Newton (rung 7) : poids et frottement lineaire, comme au rung 7."
          - math: 'm\frac{dv_z}{dt} = -mg - \lambda\,v_z'
            note: "Projection sur l'axe Z, oriente vers le HAUT (figure 1) -- pas vers le bas comme l'exemple du rung 7 : le poids se projette donc negativement."
          - math: '\frac{dv_z}{dt} = -g - \frac{\lambda}{m}\,v_z'
            note: "On divise par la masse m."
          - math: '\boxed{\frac{dv_z}{dt} + \frac{1}{\tau}v_z + g = 0} \qquad \text{avec} \qquad \tau=\frac{m}{\lambda}'
            note: "On range tout a gauche : le +g (au lieu du =g du rung 7) vient uniquement du choix d'axe vers le haut -- exactement la lecon du rung 1 sur l'arbitraire du signe."
      - id: q3b
        stem: |-
          **(0,25 pt)** Déduire la norme de la vitesse limite du mouvement du centre d'inertie $G$ de la balle.
        reasoning: |-
          Même geste qu'au rung 7 : on annule l'accélération dans l'équation différentielle pour trouver le régime permanent, sans jamais résoudre l'équation en entier. Ici $v_\ell$ ressort négative (elle pointe vers le bas, dans le sens opposé à l'axe $Z$ choisi vers le haut) — la norme demandée est sa valeur absolue.
        steps:
          - math: '\frac{dv_z}{dt}=0 \implies -g-\frac{v_\ell}{\tau}=0 \implies v_\ell=-g\,\tau'
            note: "Regime permanent (rung 7) : on annule l'acceleration. v_ell negatif car la bille tombe, dans le sens oppose a l'axe Z."
          - math: '\tau = \frac{m}{\lambda} = \frac{0{,}080}{0{,}12} \approx 0{,}667\ \text{s}'
            note: "Application numerique de tau = m/lambda."
          - math: '\boxed{|v_\ell| = g\,\tau \approx 6{,}7\ \text{m.s}^{-1}}'
            note: "Norme de la vitesse limite demandee par l'enonce."
      - id: q3c
        stem: |-
          **(0,75 pt)** Déterminer, en utilisant la méthode d'Euler, la valeur algébrique $v_z(t_i)$ de la vitesse à l'instant $t_i$ sachant que l'accélération du mouvement à l'instant $t_{i-1}$ est $a_{i-1} = 5\ \text{m.s}^{-2}$ et on prend le pas de calcul $\Delta t = 66\ \text{ms}$.
        reasoning: |-
          Ici l'énoncé donne l'accélération $a_{i-1}$, pas la vitesse $v_{i-1}$ — l'inverse de toutes les autres applications d'Euler de cette banque, qui partent toujours d'une vitesse connue pour en déduire l'accélération. Il faut donc d'abord **inverser** l'équation différentielle de la question 2-1 pour retrouver $v_{i-1}$ à partir de $a_{i-1}$ donné (une manipulation algébrique, pas une nouvelle idée physique), puis appliquer la récurrence d'Euler standard du rung 8, $v_i=v_{i-1}+a_{i-1}\Delta t$, exactement comme d'habitude.
        steps:
          - math: 'a_{i-1} = -g-\frac{v_{i-1}}{\tau} = 5 \implies v_{i-1} = -\tau\left(g+5\right)'
            note: "On repart de l'equation differentielle (question 2-1) pour retrouver v_(i-1) a partir de a_(i-1) donne -- le rung 8 part toujours de v_i connu, jamais l'inverse ; pont fait ici."
          - math: 'v_{i-1} = -0{,}667\times(10+5) \approx -10\ \text{m.s}^{-1}'
            note: "Application numerique."
          - math: 'v_z(t_i) = v_{i-1} + a_{i-1}\,\Delta t = -10 + 5\times 0{,}066'
            note: "Recurrence d'Euler standard (rung 8), a present que v_(i-1) est connu."
          - math: '\boxed{v_z(t_i) \approx -9{,}67\ \text{m.s}^{-1}}'
            note: "Coherent : la bille continue de ralentir en valeur absolue, s'approchant de v_ell = -6,7 m/s."

