        énergétique indépendant : V_0² − V_E² = 2g(y_E − y_A) donne
        y_E − y_A = 0,30 m, exactement ce que rend le calcul direct
        6 t_E − 5 t_E², et cohérent avec la figure 1 où E est au-dessus de
        C). la question 4 demande
        de RECOMPOSER la norme de la vitesse à une date intermédiaire du
