    intro: |-
      **Mouvement d'un satellite artificiel (examen national, session normale 2025, Exercice 4 — Partie 1).**

      On se propose d'étudier dans cette partie le mouvement d'un satellite artificiel autour de la Terre. Un satellite $(S)$ de centre d'inertie $G_S$ et de masse $m_S$ est destiné à l'observation des océans.

      Dans le référentiel géocentrique considéré galiléen, $(S)$ décrit une orbite circulaire autour de la Terre avec une période de révolution $T$. $(S)$ se trouve à une altitude $h$ de la surface de la Terre (figure 1). (On note que dans la figure 1 l'échelle n'est pas respectée).

      On considère que la Terre est sphérique, de centre $O$, de rayon $R_T$, de masse $m_T$ et ayant une symétrie sphérique de répartition de masse et que $(S)$ n'est soumis qu'à la force gravitationnelle exercée par la Terre.

      **Données :** Constante de gravitation universelle : $G = 6{,}67 \times 10^{-11}\ \text{kg}^{-1}.\text{m}^3.\text{s}^{-2}$ ; Rayon de la Terre : $R_T = 6380\ \text{km}$ ; Période de révolution : $T = 1\text{h}\,52\text{min}$ ; L'altitude : $h = 1336\ \text{km}$.

      **Figure 1 (schéma — échelle non respectée).** Deux cercles concentriques centrés sur le point $O$ (marqué par un point au centre) — le cercle intérieur, en trait plein et épais, représente la Terre (étiquetée « La Terre » dans un encadré relié par une flèche) ; le cercle extérieur, en pointillés, représente la trajectoire du satellite. Sur ce cercle extérieur, un point noir étiqueté « $G_S$ » (relié par une flèche à un encadré « Le satellite $(S)$ ») porte deux vecteurs, tous deux tracés en flèches pleines à pointe noire : $\vec{n}$, dirigée vers le centre $O$ (vers l'intérieur), et $\vec{u}$, tangente au cercle, orientée vers le bas à gauche du schéma (sens du mouvement). Le seul élément en pointillés hors du cercle-orbite est une double flèche verticale, étiquetée « $h$ », qui relie le cercle intérieur (Terre) au cercle extérieur (orbite) et matérialise l'altitude.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Ecrire l'expression vectorielle de la force d'attraction gravitationnelle $\vec{F}$ exercée par la Terre sur $(S)$ dans la base de Freinet $(\vec{u}\,;\,\vec{n})$ (figure 1).
        reasoning: |-
          D'après le rung 9, la force gravitationnelle qui s'exerce sur un satellite est **toujours dirigée vers le centre** de l'astre attracteur — jamais tangentielle. Or, sur la figure 1, $\vec{n}$ est précisément défini comme dirigé vers le centre $O$ : la force cherchée est donc portée entièrement par $\vec{n}$, sans aucune composante selon $\vec{u}$ (qui est tangentielle, donc perpendiculaire à la direction de la force). Il ne reste qu'à écrire sa norme, donnée par la loi de gravitation universelle du rung 9, avec $r=R_T+h$ la distance entre le centre $O$ de la Terre et le satellite $G_S$.

          $$\vec{F} = G\,\frac{m_T\,m_S}{(R_T+h)^2}\,\vec{n}$$
      - id: q2a
        part: "En appliquant la deuxième loi de Newton"
        stem: |-
          **(0,5 pt)** Montrer que le mouvement circulaire du centre d'inertie $G_S$ autour de la Terre est uniforme.
        reasoning: |-
          Exactement le raisonnement du rung 9 : on décompose l'accélération dans la base de Freinet fournie, et comme la force (question 1) est purement selon $\vec{n}$, sa projection sur $\vec{u}$ (la tangente) est nulle.
        steps:
          - math: '\vec a = \frac{dv}{dt}\vec u + \frac{v^2}{R_T+h}\vec n'
            note: "Decomposition de l'acceleration dans la base de Freinet (rung 9), comme fournie par l'enonce."
          - math: 'm_S\frac{dv}{dt} = 0'
            note: "Projection de la deuxieme loi sur u : la force (question 1) est purement selon n, donc sa composante tangentielle est nulle."
          - math: '\boxed{\frac{dv}{dt} = 0}'
            note: "La norme de la vitesse ne varie pas : mouvement circulaire UNIFORME (rung 9)."
      - id: q2b
        stem: |-
          **(0,75 pt)** Déterminer $v_S$ la norme de la vitesse de $G_S$ en fonction de $G$, $m_T$, $R_T$ et $h$.
        reasoning: |-
          Toujours le rung 9 : on projette la deuxième loi sur $\vec{n}$ cette fois, ce qui identifie la force (question 1) à $m_S v_S^2/(R_T+h)$, puis on isole $v_S$.
        steps:
          - math: 'm_S\frac{v_S^2}{R_T+h} = G\frac{m_T\,m_S}{(R_T+h)^2}'
            note: "Projection de la deuxieme loi sur n (rung 9), avec la force de la question 1."
          - math: 'v_S^2 = \frac{G\,m_T}{R_T+h}'
            note: "La masse m_S du satellite se simplifie des deux cotes."
          - math: '\boxed{v_S = \sqrt{\frac{G\,m_T}{R_T+h}}}'
            note: "Racine carree : c'est l'expression demandee."
      - id: q2c
        stem: |-
          **(0,75 pt)** Déduire la relation : $\dfrac{T^2}{(R_T + h)^3} = k$ ($k$ étant une constante), traduisant la troisième loi de Kepler relative au mouvement du centre d'inertie $G_S$ autour de la Terre.
        reasoning: |-
          Exactement la dérivation du rung 10 : deux expressions de $v_S$, celle de la question précédente et celle, géométrique, du périmètre du cercle parcouru en une période, $2\pi(R_T+h)/T$. On les égale, on élève au carré, et on réarrange.
        steps:
          - math: 'v_S = \frac{2\pi(R_T+h)}{T}'
            note: "Vitesse = perimetre du cercle / periode (mouvement circulaire uniforme, question 2-1)."
          - math: '\frac{2\pi(R_T+h)}{T} = \sqrt{\frac{G\,m_T}{R_T+h}}'
            note: "On egale les deux expressions de v_S (question 2-2 et ci-dessus), comme au rung 10."
          - math: '\frac{4\pi^2(R_T+h)^2}{T^2} = \frac{G\,m_T}{R_T+h}'
            note: "On eleve les deux membres au carre."
          - math: '\boxed{\frac{T^2}{(R_T+h)^3} = \frac{4\pi^2}{G\,m_T} = k}'
            note: "On rearrange (rung 10) : k ne depend que de la masse de l'astre central, jamais du satellite."
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer alors la valeur de la masse $m_T$.
        reasoning: |-
          On isole $m_T$ dans la relation de la question précédente, puis on convertit les données en unités SI ($T$ en secondes, $R_T+h$ en mètres) avant l'application numérique.
        steps:
          - math: 'm_T = \frac{4\pi^2(R_T+h)^3}{G\,T^2}'
            note: "On isole m_T dans la relation de la question 2-3."
          - math: 'T = 1\text{h}\,52\text{min} = 6720\ \text{s} \qquad R_T+h = 6380+1336 = 7716\ \text{km} = 7{,}716\times 10^6\ \text{m}'
            note: "Conversions en unites SI."
          - math: 'm_T = \frac{4\pi^2\times(7{,}716\times 10^6)^3}{6{,}67\times 10^{-11}\times 6720^2}'
            note: "Application numerique."
          - math: '\boxed{m_T \approx 6{,}0\times 10^{24}\ \text{kg}}'
            note: "Coherent avec la masse reelle de la Terre (environ 5,97e24 kg en table)."
