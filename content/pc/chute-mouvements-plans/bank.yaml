    intro: |-
      **Étude de la chute d'un solide dans un liquide visqueux (examen national, session normale 2012 — Mécanique, 5,5 points).**

      On remplit un tube gradué par un liquide visqueux, transparent et de masse volumique $\rho$, puis on y laisse tomber, sans vitesse initiale, à l'instant $t=0$, une bille homogène de masse $m$, et de centre d'inertie $G$. On étudie le mouvement de $G$ par rapport à un repère terrestre supposé galiléen. La position de $G$ est repérée à un instant $t$ par l'ordonnée $z$, sur l'axe $(O\vec z)$ **vertical descendant** (figure 1).

      **Figure 1 (schéma).** Un tube vertical, posé sur un socle. Le long du bord droit intérieur, une échelle de graduations non chiffrées. Un axe vertical unique traverse le tube du haut vers le bas et se termine par une flèche pointant vers le bas, étiquetée $z$ : l'axe est donc explicitement descendant. En haut de l'axe, un petit trait marque l'origine $O$. À mi-hauteur, un disque noir plein (la bille), étiqueté $G$.

      On considère que la position de $G$ est confondue avec l'origine de l'axe $(O\vec z)$ à l'instant $t=0$, et que la poussée d'Archimède $\vec F$ **n'est pas négligeable** par rapport aux autres forces appliquées sur la bille. On modélise l'action du liquide sur la bille au cours du mouvement par une force de frottement : $\vec f = -k.\vec{v_G}$, où $\vec{v_G}$ est la vitesse de $G$ à un instant $t$, et $k$ un facteur constant et positif. On rappelle que l'intensité de la poussée d'Archimède est égale au poids du liquide déplacé.

      **Données :**
      - Rayon de la bille : $r = 6{,}00.10^{-3}\ \text{m}$ ;
      - Masse de la bille : $m = 4{,}10.10^{-3}\ \text{kg}$.

      **Figure 2 (courbe, mesurée au pixel sur l'image native extraite du PDF, jusqu'à 233 dpi).** $v_G\ (\text{m.s}^{-1})$ en fonction de $t\ (\text{s})$. Graduations noires en ordonnée : $0{,}2$, $0{,}4$, $0{,}6$, $0{,}8$, $1$, $1{,}2$, $1{,}4$ (bord du cadre à $1{,}6\ \text{m/s}$). Graduations noires en abscisse : $0$, $0{,}2$, $0{,}4$, $0{,}6$, $0{,}8$, $1$, $1{,}2$ (bord du cadre à $1{,}4\ \text{s}$). Courbe croissante, concave, partant de l'origine et plafonnant à un palier horizontal, valeur atteinte vers $t \approx 1{,}25\ \text{s}$. Droite en tirets, tangente à la courbe à l'origine : elle coupe le niveau du palier $v_G = 1{,}50\ \text{m/s}$ à $t \approx 0{,}20\ \text{s}$.

      **Tableau imprimé (pour la méthode d'Euler, pas $\Delta t = 0{,}033\ \text{s}$) :**

      | $t\ (\text{s})$ | $v\ (\text{m.s}^{-1})$ | $a\ (\text{m.s}^{-2})$ |
      |---|---|---|
      | $0$ | $0$ | $7{,}57$ |
      | $0{,}033$ | $0{,}25$ | $a_1 = \ldots$ |
      | $0{,}066$ | $v_2 = \ldots$ | $5{,}27$ |
    questions:
      - id: q1
        stem: |-
          **1-** (1 pt) Par application de la deuxième loi de Newton, montrer que l'équation différentielle du mouvement de $G$ s'écrit sous la forme :
          $$\frac{dv_G}{dt} + A.v_G = B$$
          en exprimant $A$ en fonction de $k$ et $m$, et $B$ en fonction de $g$ (intensité de pesanteur), $m$, $\rho$ et $V$ (volume de la bille).
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement la méthode du chapitre 8 — bilan des forces, deuxième loi, projection sur l'axe choisi — mais avec les TROIS forces que ce chapitre couvre en toute généralité : le poids, le frottement, et la poussée d'Archimède, qui n'est ici pas négligeable (l'énoncé le précise explicitement, contrairement à d'autres sujets sur ce même dispositif).

          Bilan des forces. Trois forces s'exercent sur la bille : le poids $\vec P = m\vec g$, la poussée d'Archimède $\vec F = \rho V \vec g$ (avec $V$ le volume de la bille — rappelée par l'énoncé comme le poids du liquide déplacé), et le frottement $\vec f = -k\vec{v_G}$.

          Projection sur l'axe $(O\vec z)$, vertical **descendant** (figure 1). Le poids, orienté vers le bas, se projette positivement ; la poussée d'Archimède, orientée vers le HAUT (elle s'oppose toujours au poids), se projette négativement ; le frottement, qui s'oppose au mouvement (la bille descend), se projette lui aussi négativement.
        steps:
          - math: 'm\vec a = \vec P + \vec F + \vec f'
            note: "Deuxième loi de Newton (chapitre Lois de Newton) ; trois forces, Archimede n'est PAS négligée ici (chapitre 8)."
          - math: 'm\,\frac{dv_G}{dt} = mg - \rho V g - k\,v_G'
            note: "Projection sur (O,z) descendant : poids +mg, Archimede -rho.V.g (opposée au poids), frottement -k.v_G (oppose au mouvement)."
          - math: '\frac{dv_G}{dt} = g - \frac{\rho V g}{m} - \frac{k}{m}\,v_G'
            note: "On divise par la masse m."
          - math: '\boxed{\frac{dv_G}{dt} + \frac{k}{m}\,v_G = g - \frac{\rho V g}{m}}'
            note: "Forme demandee : A = k/m, B = g - (rho.V.g)/m."
      - id: q2
        stem: |-
          **2-** (0,75 pt) Vérifier que l'expression
          $$v_G(t) = \frac{B}{A}\,.\,\left(1 - e^{-\frac{t}{\tau}}\right)$$
          est solution de l'équation différentielle, où $\tau = \dfrac{1}{A}$ est le temps caractéristique du mouvement.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Le chapitre 8 de cette leçon établit l'équation différentielle et l'exploite pour $v_\ell$ et $\tau$, mais ne vérifie jamais lui-même qu'une solution proposée la satisfait — c'est exactement le geste enseigné en détail au chapitre 3 de la leçon « Dipôle RL », sur une équation de MÊME STRUCTURE ($\frac{di}{dt}+\frac1\tau i=\frac{I_{max}}{\tau}$, identique en forme à $\frac{dv_G}{dt}+A\,v_G=B$ ici) : on calcule la dérivée de l'expression proposée, on substitue dans l'équation, et on montre que les deux membres s'égalisent pour TOUT $t$, pas seulement à un instant particulier.

          On dérive $v_G(t)=\dfrac{B}{A}\left(1-e^{-t/\tau}\right)$ par rapport au temps — seul le terme exponentiel dépend de $t$ :

          $$\frac{dv_G}{dt} = \frac{B}{A\tau}\,e^{-t/\tau}$$

          On substitue $v_G(t)$ et $\dfrac{dv_G}{dt}$ dans le membre de gauche de l'équation différentielle, $\dfrac{dv_G}{dt}+A\,v_G$ :

          $$\frac{dv_G}{dt}+A\,v_G = \frac{B}{A\tau}e^{-t/\tau} + A\times\frac{B}{A}\left(1-e^{-t/\tau}\right) = \frac{B}{A\tau}e^{-t/\tau} + B - B\,e^{-t/\tau}$$

          Si — et seulement si — $\tau=\dfrac1A$ (l'énoncé impose précisément cette valeur), alors $\dfrac{1}{A\tau}=1$, et le premier terme devient $B\,e^{-t/\tau}$ :

          $$\frac{dv_G}{dt}+A\,v_G = B\,e^{-t/\tau} + B - B\,e^{-t/\tau} = B$$

          Les deux termes en $e^{-t/\tau}$ s'annulent exactement, et il reste $B$ — c'est-à-dire le membre de droite de l'équation. L'expression proposée est bien solution, **pour tout $t$**, à condition que $\tau=1/A$.
        steps:
          - math: '\frac{dv_G}{dt} = \frac{B}{A}\times\frac1\tau\,e^{-t/\tau} = \frac{B}{A\tau}\,e^{-t/\tau}'
            note: "Dérivée de v_G(t) : seul le terme exponentiel dépend de t."
          - math: '\frac{dv_G}{dt}+A\,v_G = \frac{B}{A\tau}e^{-t/\tau} + B\left(1-e^{-t/\tau}\right)'
            note: "Substitution dans le membre de gauche de l'équation différentielle."
          - math: '\text{Avec } \tau=\frac1A: \quad \frac{1}{A\tau}=1 \implies \frac{dv_G}{dt}+A\,v_G = B\,e^{-t/\tau} + B - B\,e^{-t/\tau}'
            note: "C'est la condition tau = 1/A, imposée par l'énoncé, qui fait tomber le coefficient du terme exponentiel a 1."
          - math: '\boxed{\frac{dv_G}{dt}+A\,v_G = B}'
            note: "Les deux termes exponentiels s'annulent exactement : l'expression proposée verifie bien l'équation, pour tout t."
      - id: q3
        stem: |-
          **3-** (0,5 pt) Écrire l'expression de la vitesse limite $V_{\ell im}$ du centre d'inertie de la bille en fonction de $A$ et $B$.
        reasoning: |-
          Exactement la méthode du chapitre 8 : on annule l'accélération dans l'équation différentielle — un calcul d'une ligne, jamais une résolution complète — et on isole la vitesse limite. On peut aussi la lire directement sur l'expression de $v_G(t)$ de la question 2 : quand $t$ devient grand, le terme $e^{-t/\tau}$ tend vers $0$, et $v_G(t)$ tend vers $\dfrac{B}{A}$ — les deux méthodes donnent le même résultat, ce qui confirme la cohérence de la solution vérifiée à la question 2.
        steps:
          - math: '\frac{dv_G}{dt} = 0 \implies A\,V_{\ell im} = B'
            note: "En régime permanent, l'accélération s'annule dans l'équation différentielle (chapitre 8)."
          - math: '\boxed{V_{\ell im} = \frac{B}{A}}'
            note: "Cohérent avec la limite de v_G(t) quand t devient grand (question 2) : e^(-t/tau) tend vers 0."
      - id: q4
        stem: |-
          **4-** (1 pt) On obtient, à l'aide d'un matériel informatique convenable, la courbe de la figure 2, représentant les variations de la vitesse $v_G$ en fonction du temps. Déterminer graphiquement les valeurs de $V_{\ell im}$ et $\tau$.
        reasoning: |-
          Deux lectures graphiques indépendantes, exactement la méthode du chapitre 8. La vitesse limite est l'ordonnée du palier horizontal que la courbe atteint en régime permanent — une simple lecture d'échelle, aucun calcul. Le temps caractéristique se lit à la tangente à l'origine (pente $g$ à $t=0$, chapitre 8) : elle coupe l'asymptote $v_G=V_{\ell im}$ à l'instant $t=\tau$.
        steps:
          - math: '\boxed{V_{\ell im} \approx 1{,}50\ \text{m.s}^{-1}}'
            note: "Ordonnée du palier de la figure 2 (régime permanent)."
          - math: '\boxed{\tau \approx 0{,}20\ \text{s}}'
            note: "Tangente à l'origine : coupe le palier V_lim a cet instant (méthode du chapitre 8)."
      - id: q5
        stem: |-
          **5-** (1 pt) Déterminer la valeur du coefficient $k$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. $k$ n'apparaît directement dans aucune lecture graphique : il faut passer par une combinaison des résultats déjà établis. La question 1 donne $A=k/m$, donc $k=mA$ ; et $\tau=1/A$ (énoncé de la question 2) donne $A=1/\tau$. On enchaîne les deux, avec $\tau$ lu à la question 4 et $m$ donné dans l'énoncé.
        steps:
          - math: 'A = \frac{k}{m} \qquad \tau = \frac1A \implies k = \frac{m}{\tau}'
            note: "On combine A=k/m (question 1) et tau=1/A (question 2) pour isoler k."
          - math: 'k = \frac{4{,}10\times10^{-3}}{0{,}20}'
            note: "Application numérique : m donne par l'énoncé, tau lu a la question 4."
          - math: '\boxed{k \approx 2{,}05\times10^{-2}\ \text{kg.s}^{-1}}'
            note: "Coefficient de frottement linéaire."
      - id: q6
        stem: |-
          **6-** (0,25 pt) Le coefficient $k$ varie avec le rayon de la bille et la viscosité $\eta$ du liquide selon la relation suivante : $k = 6\pi.\eta.r$. Déterminer la valeur de $\eta$ du liquide utilisé dans cette expérience.
        reasoning: |-
          Simple substitution : l'énoncé donne la relation $k=6\pi\eta r$ toute faite, avec $k$ trouvé à la question précédente et $r$ donné dans l'énoncé. On isole $\eta$ et on applique.
        steps:
          - math: '\eta = \frac{k}{6\pi r}'
            note: "On isole eta dans la relation donnée par l'énoncé."
          - math: '\eta = \frac{2{,}05\times10^{-2}}{6\pi\times6{,}00\times10^{-3}}'
            note: "Application numérique : k de la question 5, r donne par l'énoncé."
          - math: '\boxed{\eta \approx 0{,}181\ \text{Pa.s}}'
            note: "Viscosite du liquide."
      - id: q7
        stem: |-
          **7-** (1 pt) L'équation différentielle du mouvement de $G$ s'écrit sous la forme : $\dfrac{dv_G}{dt} = 7{,}57 - 5.v_G$. Par application de la méthode d'Euler, et les données du tableau, déterminer les valeurs de $a_1$ et $v_2$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Cette question fournit sa PROPRE équation numérique — un exercice d'Euler autonome, avec un pas $\Delta t=0{,}033\ \text{s}$ imprimé dans le tableau — indépendant des valeurs de $k$, $\eta$ trouvées plus haut. Deux gestes distincts du chapitre 9, l'un après l'autre.

          $a_1$ : l'accélération à un instant NE SE LIT PAS dans le tableau — elle se recalcule à partir de la vitesse de ce même instant, via l'équation différentielle donnée (chapitre 9) : $a_1=7{,}57-5\,v_1$, avec $v_1=0{,}25\ \text{m/s}$ (deuxième ligne du tableau).

          $v_2$ : on avance ensuite d'un pas d'Euler depuis l'instant précédent (chapitre 9), $v_2=v_1+a_1\,\Delta t$, avec le $a_1$ qu'on vient de calculer et $\Delta t=0{,}033\ \text{s}$ (pas imprimé dans le tableau).
        steps:
          - math: 'a_1 = 7{,}57 - 5\,v_1 = 7{,}57 - 5\times0{,}25'
            note: "On evalue l'équation différentielle donnée en v1 = 0,25 m/s (deuxième ligne du tableau)."
          - math: '\boxed{a_1 = 6{,}32\ \text{m.s}^{-2}}'
            note: "Déjà en dessous de 7,57 : le frottement a commence a mordre."
          - math: 'v_2 = v_1 + a_1\,\Delta t = 0{,}25 + 6{,}32\times0{,}033'
            note: "Récurrence d'Euler (chapitre 9) entre les instants t1 et t2, avec le pas imprime dans le tableau."
          - math: '\boxed{v_2 \approx 0{,}459\ \text{m.s}^{-1}}'
            note: "Cohérent avec la troisième ligne du tableau : a2 = 7,57 - 5x0,4586 = 5,277, imprime 5,27."

