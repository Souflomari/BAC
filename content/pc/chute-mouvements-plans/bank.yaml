        steps:
          - math: 'z(t)=0 \implies t(12-5t)=0 \implies t=0\ \text{ou}\ t_O=2{,}4\ \text{s}'
            note: "Autre racine de z(t)=0 (rung 1) : exactement le double de t_sommet = 1,2 s, la symetrie montee-descente."
          - math: 'v_{OZ} = v_z(t_O) = 12-10\times 2{,}4'
            note: "On substitue dans v_z(t) (question 1)."
          - math: '\boxed{v_{OZ} \approx -12\ \text{m.s}^{-1}}'
            note: "Negative : G repasse par O en descendant, dans le sens oppose a l'axe Z (vers le haut)."
