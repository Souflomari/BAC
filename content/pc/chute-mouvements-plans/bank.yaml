        double comptage. CHOIX DE L'`id` : le sujet ne numérote aucun
        exercice ; voir la note éditoriale en tête de ce bloc pour la
        POSITION AU CARTOUCHE et le découpage en trois parties. Transcription
        vérifiée : passe adversariale indépendante du 2026-08-28
        (docs/sujets/_incoming/pc-2010-n.md, statut « VÉRIFIÉ — clearé pour
        conversion »). SIGNE DE f = 140.V^2.j, ÉTABLI PAR LECTURE DIRECTE :
        la couche texte du PDF de ce sujet perd les opérateurs mathématiques
        (elle rend la ligne sans le carré ni le signe) ; le rendu vectoriel a
        600 dpi de la ligne imprimée donne sans ambiguïté un signe POSITIF
        (rien entre le = et le 140), confirme par trois recoupements
        indépendants (voir la note éditoriale en tête de ce bloc pour le
        détail) : le tableau d'Euler imprime se boucle exactement sur
        lui-même (2x1,90^2-0,7=6,52 ligne 1 ; 2x1,71^2-0,7=5,148 arrondi 5,15
        ligne 3) UNIQUEMENT avec ce signe ; le sens physique (f doit s'opposer
        a la descente, V<0, j vers le haut) l'impose aussi ; et un corrige de
        professeur retrouve pour ce sujet (non officiel) écrit lui aussi
        f=140v^2.j, signe positif. 27 questions du sujet re-derivees.
        Recalcul indépendant : dV/dt = -g + FA/m + (140/m)V^2 =
        -9,8+9,1+2V^2 = 2V^2-0,7 ; V_lim = -racine(0,7/2) approx -0,59 m/s ;
        a_(i+1) = 2x1,80^2-0,7 = 5,78 m/s2 ; V_(i+2) = -1,80+5,78x0,015 =
        -1,71 m/s.
    intro: |-
      **Mouvement vertical de G dans l'eau (examen national, session normale 2010 — Mécanique, 3ᵉ partie, 2,50 points sur les 6,00 de l'exercice complet).**

      *Les deux parties précédentes de cet exercice — le plan incliné puis le mouvement dans l'air — sont traitées à part, sous « Les lois de Newton » et sous « Chute libre et mouvements plans » (la carte précédente du même sujet). Cette partie-ci en est indépendante : elle démarre à l'entrée de $(S)$ dans l'eau, avec une nouvelle origine des temps.*

      **3- Étude du mouvement vertical de G dans l'eau.** Le solide $(S)$ poursuit son mouvement dans l'eau, avec une vitesse verticale $\vec{V}$. Il subit en plus de son poids à *(« à » en trop tel qu'imprimé sur le sujet officiel — coquille sans conséquence)* :

      - une force de frottement fluide modélisée dans le système international d'unités par : $\vec{f} = 140.V^2.\vec{j}$ ;
      - la poussée d'Archimède $\vec{F_A}$, d'intensité $F_A = 637\ \text{N}$.

      On considère l'instant d'entrée de $(S)$ dans l'eau comme nouvelle origine des temps. **Données :** $m = 70\ \text{Kg}$, $g = 9{,}8\ \text{m.s}^{-2}$. **Rappel du repère (figure 1) :** en $O$, $\vec j$ pointe vers le HAUT — c'est cette orientation qui fixe tous les signes ci-dessous, exactement comme le chapitre 8 de la leçon le rappelle : « le signe qu'on trouve dépend toujours de l'axe choisi, jamais d'une règle à mémoriser ».

      **Tableau d'Euler imprimé sur le sujet :**

      | $t\ (\text{s})$ | $V\ (\text{m.s}^{-1})$ | $a\ (\text{m.s}^{-2})$ |
      |---|---|---|
      | $t_i = 1{,}8\times10^{-1}$ | $-1{,}90$ | $6{,}52$ |
      | $t_{i+1} = 1{,}95\times10^{-1}$ | $-1{,}80$ | $a_{i+1}$ |
      | $t_{i+2} = 2{,}1\times10^{-1}$ | $V_{i+2}$ | $5{,}15$ |

      *(Pas d'Euler constant, déduit des dates : $\Delta t = 1{,}95\times10^{-1}-1{,}8\times10^{-1}=1{,}5\times10^{-2}\ \text{s}$.)*
    questions:
      - id: q1
        part: "3-1 — L'équation différentielle"
        stem: |-
          **3-1-** (1 pt) Montrer que la vitesse $V(t)$ de $G$ vérifie l'équation différentielle suivante : $\dfrac{dV(t)}{dt} - 2.V^2 + 0{,}7 = 0$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement le chapitre 8 de la leçon — bilan à TROIS forces (poids, frottement, poussée d'Archimède), deuxième loi, projection — mais avec une différence de convention à noter tout de suite : le chapitre 8 choisit un axe orienté VERS LE BAS pour simplifier l'écriture ; ici, le repère de la figure 1 impose $\vec j$ VERS LE HAUT. Le chapitre 8 le dit lui-même : « le signe qu'on trouve dépend toujours de l'axe choisi » — on refait donc la projection avec CET axe-ci, sans réutiliser une formule toute faite.

          **Le bilan**, avec $\vec j$ vers le haut : le poids $\vec P$ pointe vers le bas, donc sa composante est $-mg$ ; la poussée d'Archimède $\vec F_A$ pointe vers le haut (elle s'oppose toujours au poids), composante $+F_A$ ; le frottement $\vec f = 140V^2\vec j$ est DONNÉ selon $+\vec j$ — cohérent avec le sens physique, puisque $(S)$ descend ($V<0$) et que le frottement doit s'opposer à cette descente, donc pointer vers le haut.

          **Projection sur $\vec j$ :**

          $$m\,\frac{dV}{dt} = -mg + F_A + 140\,V^2$$

          **On divise par $m=70\ \text{kg}$**, et on regroupe les deux termes constants :
        steps:
          - math: 'm\,\frac{dV}{dt} = -mg + F_A + 140\,V^2'
            note: "Deuxième loi de Newton, projection sur j (vers le haut) : poids -mg, Archimede +FA, frottement +140V2 (signe donne)."
          - math: '\frac{dV}{dt} = -g + \frac{F_A}{m} + \frac{140}{m}\,V^2'
            note: "On divise par m = 70 kg."
          - math: '-g + \frac{F_A}{m} = -9{,}8 + \frac{637}{70} = -9{,}8+9{,}1 = -0{,}7 \qquad \frac{140}{m} = \frac{140}{70} = 2'
            note: "Les deux termes constants se regroupent en -0,7 ; le coefficient de V^2 vaut 2."
          - math: '\frac{dV}{dt} = 2\,V^2 - 0{,}7'
            note: "Substitution des deux valeurs numériques."
          - math: '\boxed{\frac{dV}{dt} - 2\,V^2 + 0{,}7 = 0}'
            note: "Forme demandee, obtenue exactement."
      - id: q2
        part: "3-2 — La vitesse limite"
        stem: |-
          **3-2-** (0,5 pt) Trouver la valeur de la vitesse limite $V_\ell$.
        reasoning: |-
          Exactement la méthode du chapitre 8 : on annule l'accélération dans l'équation différentielle — un calcul d'une ligne, jamais une résolution complète.

          $$\frac{dV}{dt} = 0 \implies 2\,V_\ell^2 - 0{,}7 = 0 \implies V_\ell^2 = 0{,}35$$

          Deux racines mathématiques, $\pm\sqrt{0{,}35}$ — mais une seule est physique. $(S)$ DESCEND dans l'eau, et $\vec j$ pointe vers le haut (question 3-1) : sa vitesse limite doit donc être NÉGATIVE.
        steps:
          - math: '2\,V_\ell^2 - 0{,}7 = 0 \implies V_\ell^2 = 0{,}35'
            note: "Régime permanent : accélération nulle dans l'équation différentielle (chapitre 8)."
          - math: 'V_\ell = -\sqrt{0{,}35}\quad(\text{racine négative retenue\,: le solide descend, V<0})'
            note: "Le solide descend et j pointe vers le haut (question 3-1) : seule la racine négative est physique."
          - math: '\boxed{V_\ell \approx -0{,}59\ \text{m.s}^{-1}}'
            note: "Vitesse limite, en valeur absolue environ 0,59 m/s vers le bas."
      - id: q3
        part: "3-3 — La méthode d'Euler"
        stem: |-
          **3-3-** (1 pt) Déterminer, à l'aide du tableau ci-dessus, et par utilisation de la méthode d'Euler, les valeurs $a_{i+1}$ et $V_{i+2}$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement les deux gestes du chapitre 9, l'un après l'autre : d'abord recalculer l'accélération à un instant à partir de la vitesse de CE MÊME instant (via l'équation différentielle de la question 3-1), puis avancer d'un pas d'Euler vers l'instant suivant.

          $a_{i+1}$ ne se lit pas dans le tableau : elle se calcule à partir de $V_{i+1}=-1{,}80\ \text{m.s}^{-1}$ (déjà connue, ligne du milieu), en réinjectant dans l'équation différentielle établie à la question 3-1 :

          $$a_{i+1} = 2\,V_{i+1}^2 - 0{,}7$$

          Puis on avance d'un pas d'Euler, $\Delta t = 1{,}5\times10^{-2}\ \text{s}$ (déduit des dates du tableau) :

          $$V_{i+2} = V_{i+1} + a_{i+1}\,\Delta t$$
        steps:
          - math: 'a_{i+1} = 2\,(-1{,}80)^2 - 0{,}7 = 2\times3{,}24-0{,}7'
            note: "On reevalue l'équation différentielle de la question 3-1 en V_(i+1) = -1,80 m/s."
          - math: '\boxed{a_{i+1} = 5{,}78\ \text{m.s}^{-2}}'
            note: "Accroissement, sous 6,52 : le frottement mord de plus en plus (chapitre 8), la vitesse se rapproche de V_lim."
          - math: 'V_{i+2} = V_{i+1} + a_{i+1}\,\Delta t = -1{,}80 + 5{,}78\times1{,}5\times10^{-2}'
            note: "Récurrence d'Euler (chapitre 9) : Delta t = 1,5e-2 s, déduit des dates du tableau."
          - math: '\boxed{V_{i+2} \approx -1{,}71\ \text{m.s}^{-1}}'
            note: "Cohérent avec la 3e ligne du tableau : 2x1,71^2-0,7 = 5,148, imprime 5,15 -- le tableau se boucle sur lui-même."

