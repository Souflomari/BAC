    intro: |-
      **Étude du mouvement d'un parachutiste (examen national, session normale 2021, Exercice V).**

      Le parachute est un dispositif destiné, après son ouverture, à freiner le mouvement d'un parachutiste en chute verticale dans l'air. Cet exercice se propose d'étudier un modèle simplifié du mouvement d'un parachutiste. Ce dernier se laisse tomber sans vitesse initiale d'un hélicoptère en vol stationnaire situé à une hauteur h au-dessus du sol. On étudie le mouvement du centre d'inertie G du système (S), constitué d'un parachutiste équipé de son parachute, dans le repère $(O, \vec{k})$ lié à un référentiel terrestre considéré comme galiléen (figure 1). On considère que la trajectoire de G est verticale et que l'accélération de la pesanteur reste constante.

      **Données :** la masse du système (S) : $m = 100\ \text{kg}$ ; accélération de la pesanteur : $g = 10\ \text{m.s}^{-2}$ ; la hauteur h : $h = 660\ \text{m}$.

      Le mouvement du système s'effectue en deux phases.

      **Figure 1.** À gauche, un axe vertical porte l'origine $O$ en haut, puis, juste en dessous, le vecteur $\vec k$ dessiné comme une courte flèche orientée vers le bas ; l'axe se termine en bas par une pointe de flèche notée « z », confirmant l'axe $(O,\vec k)$ orienté vers le bas. À droite, une photographie en niveaux de gris d'un avion en vol (aile horizontale, dérive verticale en flèche à l'arrière — *l'énoncé écrit « hélicoptère en vol stationnaire », le cliché reproduit sur le sujet montre en réalité un avion ; les deux sont transcrits fidèlement, sans correction*), sous lequel trois silhouettes sont en chute (illustration de la phase 1) ; en dessous, un parachutiste suspendu à son parachute ouvert (illustration de la phase 2).

      **1) Phase 1 : parachute fermé.** Le parachutiste se laisse tomber de l'hélicoptère sans vitesse initiale à un instant choisi comme origine des dates $t = 0$. La chute se fait durant cette phase avec le parachute fermé. On modélise l'évolution de la vitesse du centre d'inertie G du système (S) durant cette phase par la courbe de la figure 2.

      **Figure 2 (courbe, phase 1).** $v\ (\text{m.s}^{-1})$ en fonction de $t\ (\text{s})$, sur papier quadrillé. Droite croissante passant par l'origine ; elle passe par $(1\ \text{s};10\ \text{m.s}^{-1})$, $(2\ \text{s};20\ \text{m.s}^{-1})$ et $(3\ \text{s};30\ \text{m.s}^{-1})$.

      **2) Phase 2 : parachute ouvert.** Le parachutiste ouvre son parachute après une durée $\Delta t_1 = 4\ \text{s}$ depuis le début de sa chute. On choisit l'instant d'ouverture du parachute comme nouvelle origine des dates pour cette phase. Durant cette phase, le système est soumis à son poids et aux frottements de l'air modélisés par une force de contact $\vec{F} = -\alpha.v^2.\vec{k}$ avec $v$ la vitesse de G et $\alpha$ une constante positive. On modélise l'évolution de la vitesse de G durant cette phase par la courbe de la figure 3.

      **Figure 3 (courbe, phase 2).** $v\ (\text{m.s}^{-1})$ en fonction de $t\ (\text{s})$, avec $t=0$ à l'ouverture du parachute, sur papier quadrillé. Courbe décroissante partant de $v_0 = 40\ \text{m.s}^{-1}$, décroissance rapide puis aplatissement sur un palier horizontal (vitesse limite) à $V_\ell = 5{,}0\ \text{m.s}^{-1}$ ; une ligne verticale en pointillés, placée exactement à $t = 30\ \text{s}$, sépare la courbe en deux zones annotées « Régime initial » (à gauche) et « Régime permanent » (à droite).
    questions:
      - id: q1a
        part: "1) Phase 1 : parachute fermé"
        stem: |-
          **(0,5 pt)** Quelle est la nature du mouvement de G ? justifier votre réponse.
        reasoning: |-
          La figure 2 montre une droite passant par l'origine — une vitesse qui croît linéairement avec le temps, donc une accélération constante. C'est la signature graphique d'un mouvement rectiligne uniformément accéléré (le même critère qu'au chapitre 2 pour une chute verticale : une droite $v(t)$ signe un $a$ constant).

          Le mouvement de $G$ est rectiligne (trajectoire verticale) et uniformément accéléré : sa vitesse croît proportionnellement au temps (droite passant par l'origine sur la figure 2), donc son accélération est constante.
      - id: q1b
        stem: |-
          **(0,5 pt)** Peut-on considérer que le mouvement du parachutiste, durant cette phase, est une chute libre ? Justifier votre réponse.
        reasoning: |-
          On lit la pente de la droite de la figure 2 : elle vaut $10\ \text{m.s}^{-2}$ (confirmée par les points $(1;10)$, $(2;20)$, $(3;30)$), exactement $g$. Au chapitre 2, la chute libre se caractérise précisément par $a=g$ — pas approximativement, et sur toute la durée de la phase (la droite ne s'incurve jamais, contrairement à la courbe du chapitre 8 pour une chute avec frottement, qui s'aplatit vers un palier). On peut donc considérer cette phase comme une chute libre.

          Oui : $a = 10\ \text{m.s}^{-2} = g$ sur toute la phase 1 (droite, jamais de courbure) — ce mouvement est assimilable à une chute libre.
      - id: q2a
        part: "2) Phase 2 : parachute ouvert"
        stem: |-
          **(0,5 pt)** Montrer que l'équation différentielle vérifiée par la vitesse $v$ s'écrit : $\dfrac{dv}{dt} + \dfrac{\alpha}{m}.v^2 = g$.
        reasoning: |-
          Même méthode qu'au chapitre 8, mais avec le second modèle de frottement présenté là-bas — quadratique, $f=k v^2$ — ici baptisé $\alpha$ plutôt que $k$ (l'énoncé réserve la lettre $k$ à autre chose : le vecteur unitaire de l'axe $\vec k$). Le poids et le frottement sont les deux seules forces ; le frottement s'oppose au mouvement, donc pointe en sens contraire du sens de la chute — c'est-à-dire contre le sens de $\vec k$, exactement comme au chapitre 8.
        steps:
          - math: 'm\vec a = \vec P + \vec F \qquad \text{avec} \qquad \vec F = -\alpha\,v^2\,\vec k'
            note: "Deuxième loi de Newton : poids et frottement quadratique (chapitre 8, modèle f = k v^2, ici renomme alpha)."
          - math: 'm\frac{dv}{dt} = mg - \alpha\,v^2'
            note: "Projection sur l'axe (O, k), oriente vers le bas comme la chute : poids +mg, frottement -alpha v^2 (il s'oppose au mouvement)."
          - math: '\boxed{\frac{dv}{dt} + \frac{\alpha}{m}\,v^2 = g}'
            note: "On divise par m et on range le terme en v^2 à gauche."
      - id: q2b
        stem: |-
          **(0,25 pt)** Trouver l'expression de la vitesse limite $V_\ell$ du mouvement en fonction de $m$, $g$ et $\alpha$.
        reasoning: |-
          Même geste qu'au chapitre 8 : on annule l'accélération dans l'équation différentielle, sans jamais la résoudre en entier. Mais comme le frottement dépend ici de $v^2$ (et non de $v$), l'égalité poids = frottement fait apparaître un carré, d'où une racine carrée à l'arrivée — exactement la remarque faite au chapitre 8 pour le modèle quadratique.
        steps:
          - math: '\frac{dv}{dt}=0 \implies g - \frac{\alpha}{m}V_\ell^2 = 0'
            note: "Régime permanent : on annule l'accélération, comme au chapitre 8."
          - math: '\boxed{V_\ell = \sqrt{\frac{mg}{\alpha}}}'
            note: "Racine carrée car le frottement dépend de v^2 (chapitre 8, cas quadratique) et non de v directement."
      - id: q2c
        stem: |-
          **(0,25 pt)** Déterminer graphiquement $V_\ell$.
        reasoning: |-
          Comme au chapitre 8, la vitesse limite se lit directement au palier horizontal de la courbe $v=f(t)$, sans aucun calcul. Sur la figure 3, le palier se situe à la sous-graduation $5$.

          $$V_\ell \approx 5{,}0\ \text{m.s}^{-1}$$
      - id: q2d
        stem: |-
          **(0,25 pt)** En déduire la valeur de $\alpha$.
        reasoning: |-
          On isole $\alpha$ dans l'expression symbolique de la question précédente, en utilisant $V_\ell$ lu au graphe (question 2c) et $m$, $g$ donnés.
        steps:
          - math: '\alpha = \frac{mg}{V_\ell^2} = \frac{100\times 10}{5{,}0^2}'
            note: "On inverse V_ell = racine(mg/alpha), avec V_ell lu au graphe."
          - math: '\boxed{\alpha \approx 40\ \text{(unités SI)}}'
            note: "Ordre de grandeur cohérent pour un frottement quadratique dans l'air."
      - id: q3
        part: "3) Distance parcourue durant le régime initial de la phase 2"
        stem: |-
          **(0,5 pt)** Sachant que la durée totale du mouvement de G depuis le début de la chute jusqu'à l'arrivée au sol est $\Delta t = 70\ \text{s}$, trouver la distance $d$ parcourue par G durant le régime initial de la phase 2.
        reasoning: |-
          Aucune formule directe ne donne cette distance : il faut découper le vol en segments dont on connaît chacun la distance parcourue, puis retrancher du total. Trois morceaux : la phase 1, chute libre de durée $\Delta t_1=4\ \text{s}$, dont la distance se calcule par $\frac{1}{2}g\Delta t_1^2$ (chapitre 2) ; le régime permanent de la phase 2, où la vitesse est quasi constante à $V_\ell$ (chapitre 8) sur une durée qu'on obtient en comptant — durée totale $\Delta t=70\ \text{s}$, moins la phase 1, moins les $30\ \text{s}$ de régime initial de la phase 2 lus sur la figure 3 (la ligne pointillée verticale) ; et enfin le régime initial de la phase 2 lui-même, dont la distance $d$ est justement l'inconnue. La hauteur totale de chute $h$ se répartit entre ces trois segments, d'où $d = h - h_1 - h_{perm}$.
        steps:
          - math: 'h_1 = \frac{1}{2}g\,\Delta t_1^2 = \frac{1}{2}\times 10\times 4^2'
            note: "Phase 1, chute libre (question 1b) : distance parcourue en un temps Delta t1, formule du chapitre 2."
          - math: '\boxed{h_1 = 80\ \text{m}}'
            note: "Hauteur perdue durant la phase 1 (parachute ferme)."
          - math: 't_{perm} = \Delta t - \Delta t_1 - 30 = 70 - 4 - 30 = 36\ \text{s}'
            note: "Durée du régime permanent de la phase 2 : durée totale du vol, moins la phase 1, moins les 30 s de régime initial de la phase 2 lus sur la figure 3."
          - math: 'h_{perm} = V_\ell\times t_{perm} = 5{,}0\times 36'
            note: "En régime permanent la vitesse est quasi constante (chapitre 8) : distance = vitesse x durée."
          - math: '\boxed{h_{perm} = 180\ \text{m}}'
            note: "Distance parcourue durant le régime permanent de la phase 2."
          - math: '\boxed{d = h - h_1 - h_{perm} = 660 - 80 - 180 = 400\ \text{m}}'
            note: "Ce qui reste de la hauteur totale une fois retirees la phase 1 et le régime permanent de la phase 2."

