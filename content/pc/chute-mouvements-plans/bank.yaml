        (docs/sujets/pc/chute-mouvements-plans.md, statut « vérifié »).
        Physique re-dérivée et auto-cohérente : k = m/τ = 0,1 kg/s,
        ρ_r = ρ_a(1 − V_ℓ/(gτ)) = 936 kg/m³ (huile de ricin ≈ 960 kg/m³ en
        table). SCOPE NOTE (voir l'en-tête du fichier) : la question 2 exige
        d'inclure la poussée d'Archimède comme troisième force ET
        d'exprimer le volume de la bille via sa propre masse volumique
        (V = m/ρ_a) pour la substituer dans F_a — un pas supplémentaire par
