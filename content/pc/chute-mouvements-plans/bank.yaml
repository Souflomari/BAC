    intro: |-
      **Mouvement de G dans l'air (examen national, session normale 2010 — Mécanique, 2ᵉ partie, 2,00 points sur les 6,00 de l'exercice complet).**

      *La 1ère partie de cet exercice — le mouvement sur le plan incliné AB — est traitée à part, sous la notion « Les lois de Newton » ; elle réutilise sa valeur $V_B$. Cette partie-ci en est indépendante : $V_C$ est une DONNÉE, pas une valeur calculée depuis la partie 1.*

      Dans la suite de l'exercice, on étudiera le mouvement de $G$ dans le repère terrestre $\mathcal{R}(O, \vec{i}, \vec{j})$, supposé galiléen (figure 1).

      **2- Étude du mouvement de G dans l'air.** Le solide $(S)$ arrive au point $C$ avec une vitesse de vecteur horizontal, et de valeur $V_C = 4{,}67\ \text{m.s}^{-1}$, pour le quitter à un instant supposé comme nouvelle origine des temps. Le solide est soumis, en plus de son poids, à l'action d'une force de frottement de l'air *(« d'une air artificielle » tel qu'imprimé sur le sujet officiel — défaut de sujet, l'intention se lit sans ambiguïté à la ligne suivante)*, modélisée par la force d'expression : $\vec{f_1} = -f_1.\vec{i}$.

      À l'instant $t_D = 0{,}86\ \text{s}$, $G$ arrive au point $D$ se trouvant à la surface de l'eau, où s'annule la composante horizontale de sa vitesse.

      **Figure 1 — section pertinente à cette partie** *(décrite depuis le bitmap d'origine 740×540 — pas depuis l'énoncé).* En $C$, la piste devient horizontale ; un point noir marque $C$, d'où part vers la droite un trait terminé par $\vec{V_C}$ — donc $\vec V_C$ selon $+\vec i$. Une droite verticale en tirets passe par $C$ et descend jusqu'à $O$, à la surface de l'eau : $O$ est donc à l'aplomb de $C$. **En $O$ : $\vec j$ vertical vers le HAUT, $\vec i$ horizontal vers la DROITE.** Le point $D$, sur la surface de l'eau, est repéré nettement à droite de $O$. Aucune cote n'indique la hauteur de $C$ au-dessus de l'eau — c'est justement la question 2-2-b.
    questions:
      - id: q1
        part: "2-1 — La composante horizontale de la vitesse"
        stem: |-
          **2-1-** (0,5 pt) Trouver, à un instant $t$, l'expression $v_x$ de la composante horizontale du vecteur vitesse en fonction de $m$, $V_C$, $f_1$ et $t$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Le chapitre 3 de la leçon décompose un mouvement de projectile en deux axes indépendants, mais toujours SANS force horizontale ($a_x=0$ constant, parce que seul le poids agit). Ici, une force horizontale $\vec{f_1}=-f_1\vec i$ s'ajoute au poids : $a_x$ n'est donc plus nul, mais la MÉTHODE ne change pas — deuxième loi de Newton, projection sur $\vec i$, puis primitivation d'une accélération constante, exactement le geste des chapitres 2 et 3.

          **Le bilan.** Deux forces : le poids $\vec P$ (vertical, aucune composante selon $\vec i$) et $\vec{f_1}=-f_1\vec i$ (horizontal, s'oppose au mouvement puisque $(S)$ avance selon $+\vec i$).

          **Projection sur $\vec i$**, seul axe qui nous intéresse ici :

          $$m\,a_x = -f_1 \implies a_x = -\frac{f_1}{m}$$

          $a_x$ est constante ($m$ et $f_1$ le sont) : on primitive une fois, avec la condition initiale $v_x(0)=V_C$ (le solide quitte $C$ avec une vitesse horizontale $V_C$, nouvelle origine des temps) :
        steps:
          - math: 'm\,a_x = -f_1 \implies a_x = -\frac{f_1}{m}'
            note: "Deuxième loi de Newton, projection sur i (seule f1 a une composante horizontale)."
          - math: 'v_x(t) = v_x(0) + a_x\,t = V_C - \frac{f_1}{m}\,t'
            note: "Primitivation d'une accélération constante, avec v_x(0)=V_C (chapitre 3)."
          - math: '\boxed{v_x(t) = -\frac{f_1}{m}\,t + V_C}'
            note: "Forme demandee."
      - id: q2
        part: "2-2-a — L'intensité de la force de frottement"
        stem: |-
          **2-2-a-** (0,5 pt) Calculer $f_1$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. La condition qui donne $f_1$ est écrite noir sur blanc dans l'énoncé : « au point $D$... s'annule la composante horizontale de sa vitesse ». On l'exploite dans l'expression établie à la question précédente, à l'instant $t_D$.

          $$v_x(t_D) = 0 = -\frac{f_1}{m}\,t_D + V_C \implies f_1 = \frac{m\,V_C}{t_D}$$
        steps:
          - math: '0 = -\frac{f_1}{m}\,t_D + V_C \implies f_1 = \frac{m\,V_C}{t_D}'
            note: "vx(t_D)=0, condition donnée par l'énoncé (question 2-1)."
          - math: 'f_1 = \frac{70\times4{,}67}{0{,}86}'
            note: "Application numérique."
          - math: '\boxed{f_1 \approx 380{,}1\ \text{N}}'
            note: "Intensité de la force de frottement."
      - id: q3
        part: "2-2-b — La hauteur de chute"
        stem: |-
          **2-2-b-** (1 pt) Calculer l'altitude $h$ de $C$ par rapport à la surface de l'eau.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. La composante VERTICALE du mouvement est complètement indépendante de la composante horizontale (chapitre 3) : $\vec{f_1}$ est purement horizontale, donc elle n'intervient pas selon $\vec j$. Selon $\vec j$, seul le poids agit — exactement une chute libre, avec une vitesse verticale initiale NULLE (l'énoncé dit que $\vec{V_C}$ est horizontal en $C$, donc $v_y(0)=0$).

          **Projection sur $\vec j$** (vers le haut) : $m\,a_y = -mg$, donc $a_y=-g$.

          Deux primitivations, avec $v_y(0)=0$ et l'origine de position prise en $C$ :

          $$v_y(t) = -g\,t \qquad y(t) = -\frac12 g\,t^2$$

          $y(t)$ mesure ici la position VERTICALE depuis $C$ (négative, puisque $\vec j$ pointe vers le haut et que $(S)$ descend). À l'instant $t_D$, $(S)$ atteint la surface de l'eau, à une distance $h$ EN DESSOUS de $C$ :

          $$y(t_D) = -h \implies -h = -\frac12 g\,t_D^2 \implies h = \frac12 g\,t_D^2$$
        steps:
          - math: 'a_y = -g \qquad v_y(0) = 0\ (\vec{V_C}\ \text{horizontal en } C)'
            note: "Selon j : seul le poids agit (f1 est purement horizontale, chapitre 3)."
          - math: 'y(t) = -\frac12\,g\,t^2 \quad \text{(chute libre depuis C, sans vitesse verticale initiale)}'
            note: "Deux primitivations d'une accélération constante -g, origine des positions en C."
          - math: 'h = \frac12\,g\,t_D^2 = \frac12\times9{,}8\times(0{,}86)^2'
            note: "h est la distance (positive) sous C atteinte à l'instant t_D."
          - math: '\boxed{h \approx 3{,}62\ \text{m}}'
            note: "Altitude de C au-dessus de l'eau."

  - id: bk-2010-n-x4c
    title: "Chute verticale de G dans l'eau : équation différentielle avec poussée d'Archimède et frottement quadratique, vitesse limite, et méthode d'Euler"
    source:
      year: 2010
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice de Mécanique — 3ᵉ partie : mouvement vertical de G dans l'eau"
    bareme_total: 2.5
    duration_min: 15
    sourcing:
      status: sourced
      note: >-
        2010 session normale — examen national PC BIOF (Sciences Physiques,
        SPC), code sujet NS28, AlloSchool element/94443
        (course-422/upload-70311, page 6 sur 6) — Mécanique, 3ᵉ partie
