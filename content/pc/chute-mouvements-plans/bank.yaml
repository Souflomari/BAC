      **1- Mouvement de la balle en chute libre.** Pendant son mouvement le centre d'inertie $G$ de la balle est considéré en chute libre.

      **2- Mouvement de chute de la balle avec frottement.** À partir de l'instant du passage du centre d'inertie $G$ par le point $O$ vers le bas, qu'on prend comme nouvelle origine des dates $t_0 = 0$, la balle est soumise, en plus de son poids $\vec{P}$, à une force de frottement fluide modélisée par $\vec{f} = -\lambda\vec{v}$ avec $\vec{v} = v_z\vec{k}$ et $\lambda = 0{,}12$ S.I. (On néglige la poussée d'Archimède devant ces deux forces).

      **Figure 1 (schéma).** Axe vertical $Z$ (flèche pleine orientée vers le haut, étiquetée « Z » en haut). Une ligne horizontale en pointillés traverse l'axe, plus haut sur la figure ; un disque noir plein étiqueté « (S) » (la balle) est placé juste en dessous de cette ligne pointillée, sur l'axe. Une double flèche verticale, étiquetée « h » (une cote de longueur), relie le niveau de l'origine $O$ à cette ligne pointillée, matérialisant la hauteur maximale. En dessous de (S), une courte flèche pleine orientée vers le haut, étiquetée « $\vec{V_0}$ » (vecteur vitesse initiale). Plus bas, au niveau de l'origine, une courte flèche pleine orientée vers le haut étiquetée « $\vec{k}$ », avec le point « O » juste à droite ; une ligne horizontale en pointillés (bleue) part de O vers la gauche. L'axe $Z$ se poursuit en trait plein en dessous de O jusqu'au bas de la figure.
