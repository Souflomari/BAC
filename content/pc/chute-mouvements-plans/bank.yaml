#     tangente à l'origine) et bk-2021-n-x5 (frottement quadratique, modèle
#     F = -α.v².k⃗) restent, eux, strictement dans le rung 7 (les deux
#     modèles de frottement et la lecture de τ par tangente à l'origine y
#     sont explicitement enseignés) — mentionnés ici seulement pour
#     mémoire, aucun pont nécessaire.
#   - bk-2022-n-x4, q2, ET bk-2024-n-x5, q1 : même lacune que bk-2018-n-x4
#     q1 ci-dessus (poussée d'Archimède = troisième force, hors du bilan à
#     deux forces du rung 7) — MAIS avec un pas supplémentaire qu'aucune
#     entrée déjà bancarisée n'exigeait : ici la masse volumique DONNÉE est
#     celle de la bille elle-même (ρ_a / ρ_B), jamais celle du liquide
#     (l'inconnue à trouver), donc il faut d'abord exprimer le volume de la
#     bille via sa propre masse volumique (V = m/ρ_bille, une définition de
#     base, hors mécanique) avant de substituer dans F_a = ρ_liquide.V.g.
#     Ponté au point d'usage dans le raisonnement de chaque question
#     concernée.
#   - bk-2021-r-x5, q4 : la question demande de RECOMPOSER la norme du
#     vecteur vitesse à une date intermédiaire du vol (au point E, sur la
