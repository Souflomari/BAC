        photo) sont transcrits fidèlement, sans correction de l'énoncé.
        SCOPE NOTE (voir l'en-tête du fichier) : la question 3 exige de
        décomposer la durée totale du vol en segments et de cumuler des
        distances par des méthodes différentes selon le segment (rung 1
        pour la phase 1, rung 7 pour le régime permanent de la phase 2) —
