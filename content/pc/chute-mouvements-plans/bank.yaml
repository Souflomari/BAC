#     v_0x et v_0y, et le rung 4 n'annule v_y qu'au sommet ; nulle part la
#     leçon ne recompose explicitement une vitesse en cours de vol à partir
#     de ses deux composantes. Le geste est le même Pythagore qu'à la
#     question 3.3 de la même entrée, seul l'instant change — le pont est
#     fait en une phrase au point d'usage, dans le raisonnement de la
#     question 4. Le reste de l'entrée (2ᵉ loi de Newton sans frottement,
#     primitivation, lecture de pente sur v_y(t), décomposition/recomposition
#     de V_0) reste strictement dans les rungs 1 à 4.
#   - bk-2023-n-x4, q3c (question 2-3 du sujet, méthode d'Euler « à
#     l'envers ») : la question donne l'accélération a_(i-1) et demande la
#     vitesse v_z(t_i) suivante — mais, contrairement à toutes les autres
#     applications d'Euler déjà bancarisées (bk-2018-n-x4 q4, bk-2020-n-x5
#     q5a/q5b, r-bac/r-variation d'exercises.yaml), qui partent toujours
#     d'une vitesse CONNUE pour en déduire l'accélération via l'équation
#     différentielle, ici il faut d'abord inverser cette même équation pour
#     retrouver v_(i-1) À PARTIR de a_(i-1) donné, avant d'appliquer la
#     récurrence d'Euler standard vers l'avant. Le rung 8 ne modélise
#     jamais explicitement ce sens inverse ; ponté au point d'usage.
#   - bk-2025-r-x4, q3 : le point de chute E est l'intersection de la
#     trajectoire parabolique avec la droite du plan incliné — pas avec
#     l'axe horizontal y=0. Le rung 4 ne calcule que la PORTÉE (l'intersection
#     avec y=0, un cas particulier) ; il ne montre jamais explicitement la
#     résolution d'un système {parabole ; droite oblique quelconque}. La
#     méthode reste la même dans l'esprit (poser deux équations, éliminer une
#     inconnue commune) mais le geste — écrire l'équation de la droite du
#     plan à partir de sa description graphique, PUIS résoudre le système —
#     n'est modélisé nulle part pas à pas. Ponté au point d'usage dans le
#     raisonnement de la question 3.
#   - bk-2023-r-x4, q1 et q2 : l'origine du repère est au SOL, pas au
#     point de lancement. Les rungs 2 et 3 placent SYSTÉMATIQUEMENT
#     l'origine au point de lancement (« L'origine est prise au point de
#     lancement, à l'instant t=0 », rung 2), ce qui annule les deux
#     constantes d'intégration : ni l'équation horaire y(t) du rung 2 ni
#     l'équation de la trajectoire y(x) du rung 3 ne portent de terme
#     constant. Ici le point de frappe A est sur l'axe y à la hauteur
#     h = 3 m, donc y(0) = h ≠ 0 et les deux équations demandées portent
#     un « + h » que la leçon ne montre jamais. Le pont est fait au point
#     d'usage, en REFAISANT la seconde primitivation avec la constante
#     (q1) puis en montrant que cette constante traverse intacte
#     l'élimination du temps (q2) — jamais « on admet ». Le reste de
#     l'entrée (2ᵉ loi sans frottement, décomposition de V_0, lecture
#     d'une hauteur à une abscisse donnée, mouvement horizontal uniforme)
#     reste strictement dans les rungs 1 à 4.

