        Transcription vérifiée par une passe adversariale indépendante
        (2026-08-22) : re-fetch du scan, figures 1 et 2 re-décrites depuis le
        dessin et non depuis l'énoncé, mesures au pixel des quadrillages.
        Les descriptions de figure reprises ici sont CELLES DU VÉRIFICATEUR,
