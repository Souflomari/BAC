    intro: |-
      **Étude de la chute d'une bille dans un liquide visqueux (examen national, session normale 2022, Exercice 4 — Partie 1).**

      On se propose dans cette partie, de déterminer la masse volumique $\rho_r$ d'huile de ricin.

      On libère, sans vitesse initiale, une bille homogène en acier dans une éprouvette remplie d'huile de ricin. Cette bille a une masse $m$ et une masse volumique $\rho_a$.

      On étudie le mouvement du centre d'inertie $G$ de la bille dans un repère $(O, \vec{k})$ lié à un référentiel terrestre considéré comme galiléen (figure 1).

      La bille est soumise, durant sa chute verticale dans le liquide, à l'action de trois forces :
      - son poids $\vec{P}$.
      - la poussée d'Archimède $\vec{F}_a$ de direction verticale, de sens vers le haut et d'intensité $F_a = \rho_r.V.g$ où $V$ est le volume de la bille et $g$ l'accélération de la pesanteur.
      - la force de frottement fluide, modélisée par le vecteur $\vec{F} = -k.\vec{v}$ où $k$ est une constante positive et $\vec{v}$ le vecteur vitesse de $G$ à un instant $t$.

      Un système d'acquisition informatisé permet d'obtenir la courbe de la figure 2 représentant l'évolution de la vitesse $v(t)$. La droite $(T)$ étant la tangente à la courbe au point d'abscisse $t = 0$.

      **Données :** $m = 10\ \text{g}$ ; $\rho_a = 7{,}8\ \text{g.cm}^{-3}$ ; $g = 10\ \text{m.s}^{-2}$.

      **Figure 1 (schéma).** Une éprouvette verticale sans graduations. L'axe vertical est tracé à gauche de l'éprouvette, à l'extérieur. En haut, une ligne en pointillés horizontale part de la marque $O$ portée sur cet axe et traverse l'éprouvette (elle figure la surface du liquide) ; juste en dessous, la flèche $\vec{k}$ orientée vers le bas. Dans l'éprouvette, un petit cercle étiqueté $G$ est dessiné un peu au-dessous de cette ligne (la bille est figurée déjà immergée), le reste de l'éprouvette étant grisé (liquide). En bas, l'axe se poursuit et se termine par une pointe de flèche orientée vers le bas, étiquetée $z$.

      **Figure 2 (courbe).** $v\ (\text{m.s}^{-1})$ en fonction de $t\ (\text{s})$, sur quadrillage à double graduation. Axe des ordonnées chiffré $0{,}2,\ 0{,}4,\ 0{,}6,\ 0{,}8$ ; axe des abscisses chiffré $0{,}1,\ 0{,}2,\ 0{,}3$ (traits majeurs tous les $0{,}1\ \text{s}$ et $0{,}2\ \text{m.s}^{-1}$ ; le cadre s'étend en réalité jusqu'à $t=1{,}0\ \text{s}$ et $v=1{,}0\ \text{m.s}^{-1}$, mais les traits majeurs au-delà de $0{,}3\ \text{s}$ et $0{,}8\ \text{m.s}^{-1}$ ne sont pas chiffrés). Courbe croissante depuis l'origine, concave, tendant asymptotiquement vers un palier mesuré à $V_\ell = 0{,}880\ \text{m.s}^{-1}$ (deux traits fins au-dessus du repère $0{,}8$). Une droite en pointillés $(T)$, tangente à la courbe à l'origine, coupe le palier à $t = 0{,}100\ \text{s}$. Deux zones sont annotées directement sur le graphe, séparées par un trait vertical en pointillés situé exactement à $t = 0{,}50\ \text{s}$ : « zone1 » sur la portion courbée qui précède, « zone2 » sur le palier qui suit.
    questions:
      - id: q1
        part: "La figure 2 présente deux zones — identifier les régimes"
        stem: |-
          **(0,5 pt)** La courbe de la figure 2 présente deux zones. Attribuer à chaque zone le régime correspondant.
        reasoning: |-
          Même critère qu'au chapitre 8 : une courbe $v(t)$ qui croît en se courbant correspond au régime où le frottement grandit avec $v$ sans encore avoir rattrapé le poids — c'est le **régime initial** (transitoire) ; un palier horizontal correspond au régime où frottement et poids se compensent exactement, accélération nulle — c'est le **régime permanent**. Sur la figure 2, « zone1 » est la portion courbée qui précède la frontière $t=0{,}50\ \text{s}$ : c'est le régime initial. « zone2 » est le palier qui suit : c'est le régime permanent — cohérent avec le fait que cette frontière tombe exactement à $5\tau$ ($5\times 0{,}100\ \text{s}$), l'ordre de grandeur usuel où le régime transitoire s'éteint.

          $$\text{zone1} = \text{régime initial (transitoire)} \qquad \text{zone2} = \text{régime permanent}$$
      - id: q2
        stem: |-
          **(0,75 pt)** Par application de la deuxième loi de Newton, montrer que l'équation différentielle du mouvement de $G$ s'écrit ainsi : $\dfrac{dv}{dt} + \dfrac{1}{\tau}.v = g\!\left(1 - \dfrac{\rho_r}{\rho_a}\right)$ où $\tau$ est le temps caractéristique du mouvement qu'on exprimera en fonction de $m$ et $k$.
        reasoning: |-
          On suit la méthode du chapitre 8 — bilan, deuxième loi, projection — avec le bilan à **trois** forces du chapitre 8, poussée d'Archimède comprise. Il y a ici un pas de plus : l'énoncé donne la masse volumique $\rho_a$ **de la bille elle-même**, pas celle du liquide — donc $F_a=\rho_r V g$ contient encore une inconnue, $V$, qu'aucune donnée ne fournit directement. On la fait disparaître en revenant à la définition de la masse volumique de la bille, $m=\rho_a V$ (une relation de base, hors mécanique), qui donne $V=m/\rho_a$. Une fois cette substitution faite, la suite est identique au chapitre 8 : projeter, diviser par $m$, identifier le coefficient de $v$ à $1/\tau$ (inchangé, puisque seul le frottement dépend de $v$) et regrouper les deux termes constants (poids et Archimède) de l'autre côté.
        steps:
          - math: 'm\vec a = \vec P + \vec f + \vec F_a'
            note: "Deuxième loi de Newton : les trois forces du chapitre 8 — poids, frottement, poussee d'Archimede."
          - math: 'm\frac{dv}{dt} = mg - k\,v - \rho_r V g'
            note: "Projection sur (O,k) oriente vers le bas : poids +mg, frottement -kv, Archimede -rho_r V g (elle pointe vers le haut)."
          - math: 'm = \rho_a V \implies V = \frac{m}{\rho_a}'
            note: "La bille est homogène : sa propre masse volumique rho_a relie sa masse et son volume -- pas une relation du chapitre 8, mais une définition de base (masse volumique) mobilisée ici pour éliminer V."
          - math: 'm\frac{dv}{dt} = mg\left(1-\frac{\rho_r}{\rho_a}\right) - k\,v'
            note: "On substitue V = m/rho_a dans le terme d'Archimede, puis on regroupe les deux termes constants (poids et Archimede) ensemble."
          - math: '\boxed{\frac{dv}{dt} + \frac{1}{\tau}v = g\left(1-\frac{\rho_r}{\rho_a}\right)} \qquad \text{avec} \qquad \tau = \frac{m}{k}'
            note: "On divise par m : le coefficient de v redonne 1/tau comme au chapitre 8 (inchangé par Archimede, qui ne dépend pas de v) ; le terme constant, lui, contient desormais rho_r/rho_a."
      - id: q3a
        part: "Exploitation graphique de la figure 2"
        stem: |-
          **(0,5 pt)** Déterminer graphiquement la valeur de $\tau$ puis en déduire, dans le système international d'unités, la valeur de $k$.
        reasoning: |-
          Même lecture qu'au chapitre 8 : le temps caractéristique $\tau$ se lit à l'abscisse où la tangente à l'origine (pente $A$, l'équivalent local de $g$ ici) coupe l'asymptote horizontale du palier. Sur la figure 2 fournie, cette intersection tombe exactement sur $t=0{,}100\ \text{s}$.

          $$\tau \approx 0{,}100\ \text{s}$$

          Une fois $\tau$ lu, $k$ s'obtient en inversant l'identification $\tau=m/k$ de la question 2 (aucune nouvelle lecture graphique nécessaire) : c'est le même geste qu'au sujet 2018.
        steps:
          - math: 'k = \frac{m}{\tau} = \frac{0{,}010}{0{,}100}'
            note: "On inverse tau = m/k (identification de la question 2), avec m converti en kg (10 g = 0,010 kg) et tau lu au graphe."
          - math: '\boxed{k \approx 0{,}10\ \text{kg.s}^{-1}}'
            note: "Application numérique, en unités SI comme demande."
      - id: q3b
        stem: |-
          **(0,25 pt)** Déterminer graphiquement la valeur de la vitesse limite $V_\ell$.
        reasoning: |-
          Comme au chapitre 8, la vitesse limite se lit directement comme l'ordonnée du palier horizontal de la courbe $v=f(t)$, sans aucun calcul. Sur la figure 2, le palier se situe deux traits fins au-dessus du repère $0{,}8$.

          $$V_\ell \approx 0{,}880\ \text{m.s}^{-1}$$
      - id: q4
        stem: |-
          **(0,75 pt)** Trouver l'expression de la masse volumique $\rho_r$ de l'huile de ricin en fonction de $\tau$, $g$, $\rho_a$ et $V_\ell$. Calculer sa valeur.
        reasoning: |-
          L'équation de la question 2 donne, en régime permanent ($dv/dt=0$), $V_\ell/\tau = g\left(1-\rho_r/\rho_a\right)$ — exactement le même geste qu'au chapitre 8 (annuler l'accélération dans l'équation différentielle), mais appliqué ici à une équation qui contient $\rho_r/\rho_a$ au lieu de $v$ seul. On isole $\rho_r$ algébriquement, puis on convertit $\rho_a$ en unités SI ($7{,}8\ \text{g.cm}^{-3} = 7{,}8\times 10^3\ \text{kg.m}^{-3}$) avant l'application numérique.
        steps:
          - math: '\frac{V_\ell}{\tau} = g\left(1-\frac{\rho_r}{\rho_a}\right) \implies \rho_r = \rho_a\left(1-\frac{V_\ell}{g\,\tau}\right)'
            note: "Régime permanent (question 2, accélération nulle) résolu pour rho_r."
          - math: '\rho_r = 7{,}8\times 10^3\times\left(1-\frac{0{,}880}{10\times 0{,}100}\right)'
            note: "Application numérique, avec rho_a converti en kg/m3 (7,8 g/cm3 = 7,8e3 kg/m3)."
