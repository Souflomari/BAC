  # ── r-bac — the VERIFIED 2018 national sujet, volet énergétique ──────────
  # Faithful transcription of docs/sujets/pc/aspects-energetiques.md +
  # systemes-oscillants.md → "2018 — session normale — Exercice IV, Partie II :
  # étude énergétique d'un oscillateur solide-ressort". Ressort horizontal,
  # raideur K = 35 N/m, sans frottement ; référence d'E_pe à l'équilibre x = 0 ;
  # équation horaire x(t) = X_m cos(2πt/T_0 + φ). La courbe (figure 4) donne
