  - id: AE-22
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [misconception_driven, energie_potentielle_elastique, resolution]
    stem: >
      Un solide de masse $m = 0{,}40\ \text{kg}$ est accroché à un ressort
      horizontal de raideur $k = 40\ \text{N/m}$, sans frottement. On étire
      le ressort depuis sa position d'équilibre jusqu'à un allongement
      $x = 5{,}0\ \text{cm}$. Quelle est l'énergie potentielle élastique
      $E_{pe}$ emmagasinée dans le ressort à cet instant ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\approx 0{,}10\ \text{J}$, en calculant le travail comme force
          finale × distance : $kx \times x$.
        correct: false
        misconception: mc.physics.pc_energie.epe-force-rappel-traitee-constante
        also_reveals: []
        feedback: >
          Ce calcul traite la force de rappel $kx$ comme si elle valait déjà
          cette intensité dès le départ de l'étirement. En réalité elle
          croît de $0$ à $kx$ : le travail est l'aire du triangle sous
          $F(x)=kx$, soit $\frac12 kx^2$ — exactement la moitié de ce
          résultat.
      - id: B
        text: >-
          Impossible de conclure sans connaître la vitesse du solide à cet
          instant, car $E_{pe}$ dépend aussi de la vitesse.
        correct: false
        misconception: mc.physics.pc_energie.epe-depend-masse-ou-vitesse
        also_reveals: []
        feedback: >
          $E_{pe} = \frac12 kx^2$ ne dépend que de $k$ et de $x$ : la
          vitesse (comme la masse) n'y figure pas du tout, elle vit dans
          $E_c$, une grandeur séparée. On peut calculer $E_{pe}$ sans rien
          savoir de la vitesse.
      - id: C
        text: "$\\approx 0{,}05\\ \\text{J}$ (par $E_{pe} = \\tfrac12 k x^2$ ; le facteur $\\tfrac12$ vient de ce que la force croît avec l'allongement)"
        correct: true
      - id: D
        text: >-
          $\approx 0{,}20\ \text{J}$, l'énergie stockée étant de nature
          gravitationnelle : $E_{pe} = mgx$.
        correct: false
        misconception: mc.physics.pc_energie.epe-confondue-avec-epp
        also_reveals: []
        feedback: >
          Ce calcul confond $E_{pe}$ avec l'énergie potentielle de
          pesanteur $E_{pp}=mgz$. Sur ce montage horizontal, l'altitude $z$
          du solide ne change jamais : l'énergie stockée dans le ressort
          n'a rien de gravitationnel, c'est une énergie élastique, d'une
          nature différente.
    correct_feedback: >
      $E_{pe} = \frac12 kx^2 = \frac12 \times 40 \times (0{,}050)^2 =
      0{,}050\ \text{J}$. Ni la masse ni la vitesse n'interviennent, et
      l'altitude ne joue aucun rôle sur ce montage horizontal.
    solution: |
      $$E_{pe} = \frac{1}{2}kx^2 = \frac{1}{2}\times 40 \times (0{,}050)^2 = 0{,}050\ \text{J}$$

      Le facteur $\frac12$ vient de la force moyenne $\frac12 kx$ sur le
      trajet d'étirement (la force de rappel croît de $0$ à $kx$, elle ne
      vaut pas $kx$ dès le départ). Ni $m$ ni $v$ n'apparaissent dans cette
      expression : ils vivent dans $E_c$, pas dans $E_{pe}$.

  - id: AE-23
    rung: "R5"
    difficulty_level: 2
    skill_code: pc_energie
    tags: [misconception_driven, energie_potentielle_elastique, utilisation]
    stem: >
      Un même ressort, de raideur $k$, est d'abord étiré de
      $x = +3{,}0\ \text{cm}$ par rapport à sa position d'équilibre, puis
      comprimé de $x = -3{,}0\ \text{cm}$. Que peut-on dire de l'énergie
      potentielle élastique stockée dans les deux cas ?
    type: mcq
    choices:
      - id: A
        text: >-
          Elle est identique dans les deux cas, car $E_{pe} = \frac12 kx^2$
          ne dépend que de $x^2$.
        correct: true
      - id: B
        text: >-
          Elle est positive en étirement et négative en compression, car
          $x$ change de signe.
        correct: false
        misconception: mc.physics.pc_energie.epe-depend-masse-ou-vitesse
        also_reveals: []
        feedback: >
          $E_{pe} = \frac12 kx^2$ contient $x^2$, jamais $x$ seul : le carré
          d'un nombre négatif est positif, exactement comme celui d'un
