  # R6 — NEW: torsion, énergie potentielle de torsion E_p,torsion = ½Cθ² (3 items)
  # Misconceptions: torsion-moment-traite-constant, torsion-ep-depend-inertie-j,
  # torsion-ec-formule-translation — each item's 3 distractors rotate through all three.
  # ══════════════════════════════════════════════════════════════

  - id: AE-25
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [misconception_driven, energie_torsion, resolution]
    stem: >
      Un fil de torsion de constante $C = 0{,}16\ \text{N·m/rad}$ est tordu
      d'un angle $\theta = 0{,}20\ \text{rad}$ depuis sa position de repos.
      Quelle est l'énergie potentielle de torsion $E_{p,torsion}$
      emmagasinée dans le fil ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\approx 6{,}4\times10^{-3}\ \text{J}$, en calculant le travail
          comme moment final × angle : $C\theta \times \theta$.
        correct: false
        misconception: mc.physics.pc_energie.torsion-moment-traite-constant
        also_reveals: []
        feedback: >
          Ce calcul traite le moment de rappel $C\theta$ comme s'il valait
          déjà cette intensité dès le début de la torsion. En réalité il
          croît de $0$ à $C\theta$ : le travail est l'aire du triangle sous
          $M(\theta)=C\theta$, soit $\frac12 C\theta^2$ — la moitié de ce
          résultat.
      - id: B
        text: "$\\approx 3{,}2\\times10^{-3}\\ \\text{J}$ (par $E_{pt} = \\tfrac12 C\\theta^2$ ; le facteur $\\tfrac12$ vient de ce que le moment croît avec l'angle)"
        correct: true
      - id: C
        text: >-
          Impossible de calculer sans connaître le moment d'inertie $J$ du
          disque, qui intervient dans l'énergie potentielle de torsion.
        correct: false
        misconception: mc.physics.pc_energie.torsion-ep-depend-inertie-j
        also_reveals: []
        feedback: >
          $E_{p,torsion} = \frac12 C\theta^2$ ne dépend que de $C$ et de
          $\theta$ : le moment d'inertie $J$ n'y figure jamais, il
          caractérise l'énergie cinétique de rotation, un réservoir
          séparé. On peut calculer $E_{p,torsion}$ sans connaître $J$.
      - id: D
        text: >-
          Il faut connaître la vitesse linéaire $v$ d'un point du bord du
          disque, car l'énergie stockée vaut $\frac12 m v^2$.
        correct: false
        misconception: mc.physics.pc_energie.torsion-ec-formule-translation
        also_reveals: []
        feedback: >
          $\frac12 m v^2$ est la formule de l'énergie cinétique de
          TRANSLATION, pas celle de l'énergie potentielle de torsion. Ici,
          on demande l'énergie stockée dans le fil,
          $E_{p,torsion} = \frac12 C\theta^2$ — aucune vitesse n'y
          intervient.
    correct_feedback: >
      $E_{p,torsion} = \frac12 C\theta^2 = \frac12 \times 0{,}16 \times
      (0{,}20)^2 = 3{,}2\times10^{-3}\ \text{J}$. Ni $J$ ni aucune vitesse
      n'interviennent : seuls $C$ et $\theta$ comptent.
    solution: |
      $$E_{p,torsion} = \frac{1}{2}C\theta^2 = \frac{1}{2}\times 0{,}16\times(0{,}20)^2 = 3{,}2\times10^{-3}\ \text{J}$$

      Le facteur $\frac12$ vient du moment moyen $\frac12 C\theta$ sur tout
      le trajet de torsion (le moment de rappel croît de $0$ à $C\theta$).
      Le moment d'inertie $J$ n'apparaît pas : il vit dans
      $E_c = \frac12 J\dot\theta^2$, un réservoir distinct.

  - id: AE-26
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [misconception_driven, energie_torsion, utilisation]
    stem: >
      Un pendule de torsion (disque de moment d'inertie $J$, fil de
      constante de torsion $C$) oscille sans frottement à l'angle $\theta$,
      avec une vitesse angulaire $\dot\theta$. Quelle est l'expression
      correcte de son énergie mécanique $E_m$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $E_m = \frac12 C\dot\theta^2 + \frac12 J\theta^2$ (les rôles de
          $J$ et $C$ sont échangés).
        correct: false
        misconception: mc.physics.pc_energie.torsion-ep-depend-inertie-j
        also_reveals: []
        feedback: >
          Ici les deux réservoirs sont intervertis : $C$ (le rappel) s'est
          retrouvé associé à $\dot\theta$ (le mouvement), et $J$
          (l'inertie) associé à $\theta$ (l'écart). Le bon appariement est :
          $J$ avec $\dot\theta$ dans $E_c$, $C$ avec $\theta$ dans $E_p$ —
          jamais l'inverse.
      - id: B
        text: >-
          $E_m = \frac12 m v^2 + \frac12 C\theta^2$, avec $v$ la vitesse
          linéaire d'un point du disque.
        correct: false
        misconception: mc.physics.pc_energie.torsion-ec-formule-translation
        also_reveals: []
        feedback: >
          Le disque ne translate pas, il tourne : ses différents points
          n'ont pas tous la même vitesse linéaire $v$, seulement une
          vitesse angulaire $\dot\theta$ commune. L'énergie cinétique de
          rotation s'écrit $\frac12 J\dot\theta^2$, pas $\frac12 mv^2$.
      - id: C
        text: >-
          $E_m = \frac12 J\dot\theta^2 + C\theta^2$, le terme de torsion étant calculé
          comme le moment final multiplié par l'angle.
        correct: false
        misconception: mc.physics.pc_energie.torsion-moment-traite-constant
        also_reveals: []
        feedback: >
          $C\theta^2$ traite le moment de rappel comme constant, égal à sa
          valeur finale $C\theta$ dès le début de la torsion. Le vrai terme
          potentiel est l'aire du triangle sous $M(\theta)=C\theta$, soit
          $\frac12 C\theta^2$.
      - id: D
        text: "$E_m = \\frac12 J\\dot\\theta^2 + \\frac12 C\\theta^2$, somme de l'énergie cinétique de rotation et de l'énergie potentielle de torsion"
        correct: true
    correct_feedback: >
      $E_m = E_c + E_{p,torsion} = \frac12 J\dot\theta^2 + \frac12
      C\theta^2$ : l'inertie $J$ dans le terme cinétique (associée à
      $\dot\theta$), le rappel $C$ dans le terme potentiel (associé à
      $\theta$) — les deux réservoirs ne se mélangent jamais.
    solution: |
      Les deux réservoirs, côte à côte : l'inertie ($J$) vit dans
      $E_c=\frac12 J\dot\theta^2$, exactement comme $m$ vit dans
      $\frac12 mv^2$ pour le ressort ; le rappel ($C$) vit dans
      $E_p=\frac12 C\theta^2$, exactement comme $k$ vit dans
      $\frac12 kx^2$. $E_m = \frac12 J\dot\theta^2 + \frac12 C\theta^2$ est
      donc la seule expression cohérente avec cette répartition.

  - id: AE-27
    rung: "R6"
    difficulty_level: 4
    skill_code: pc_energie
    tags: [misconception_driven, energie_torsion, utilisation]
    stem: >
      Un pendule de torsion (disque de moment d'inertie $J$, fil de
      constante de torsion $C$) est tordu d'un angle $\theta_0$ puis lâché
      sans vitesse angulaire. Quelle affirmation, sur son énergie à
      l'instant du lâcher, est correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Au lâcher, toute l'énergie est stockée sous la forme
          $E_{p,torsion} = \frac12 C\theta_0^2$ ; elle ne dépend ni de $J$
          ni d'aucune vitesse.
        correct: true
      - id: B
        text: >-
          Au lâcher, l'énergie stockée vaut $C\theta_0^2$, le moment de
          rappel étant traité comme constant, égal à sa valeur finale
          $C\theta_0$.
        correct: false
        misconception: mc.physics.pc_energie.torsion-moment-traite-constant
        also_reveals: []
        feedback: >
          Le moment de rappel croît de $0$ à $C\theta_0$ pendant la
          torsion, il ne vaut pas $C\theta_0$ dès le départ. Le travail
          (donc l'énergie stockée) est l'aire du triangle sous
          $M(\theta)=C\theta$, soit $\frac12 C\theta_0^2$ — la moitié de
          $C\theta_0^2$.
      - id: C
        text: >-
          Au lâcher, l'énergie stockée dépend du moment d'inertie $J$ du
          disque : un disque plus lourd stocke plus d'énergie pour le même
          angle $\theta_0$.
        correct: false
        misconception: mc.physics.pc_energie.torsion-ep-depend-inertie-j
        also_reveals: []
        feedback: >
          $E_{p,torsion} = \frac12 C\theta_0^2$ ne dépend que de la
          constante de torsion $C$ et de l'angle $\theta_0$ : deux disques
          de moments d'inertie différents, montés sur le même fil et
          tordus au même angle, stockent exactement la même énergie. $J$
          n'intervient que dans l'énergie cinétique, nulle ici puisque le
          disque part du repos.
      - id: D
        text: >-
          Au lâcher, on ne peut rien affirmer sans connaître la vitesse
          linéaire $v$ d'un point du bord du disque, car l'énergie
          cinétique de rotation se calcule par $\frac12 m v^2$.
        correct: false
        misconception: mc.physics.pc_energie.torsion-ec-formule-translation
        also_reveals: []
        feedback: >
          Au lâcher, la vitesse angulaire est nulle par hypothèse
          ($\dot\theta_0 = 0$), donc $E_c=0$ quelle que soit la formule
          utilisée : la question ne porte que sur l'énergie potentielle,
          qui ne demande aucune vitesse. Et l'énergie cinétique d'un disque
          en rotation se calcule par $\frac12 J\dot\theta^2$, jamais par
          $\frac12 mv^2$.
    correct_feedback: >
      Au lâcher, $\dot\theta_0 = 0$ donc $E_c=0$ : toute l'énergie
      mécanique est potentielle, $E_m = E_{p,torsion} = \frac12
      C\theta_0^2$, une expression qui ne fait intervenir ni $J$ ni aucune
      vitesse.
    solution: |
      $$E_m = \frac12 J\dot\theta_0^2 + \frac12 C\theta_0^2 = \frac12 C\theta_0^2 \quad (\dot\theta_0 = 0)$$

      Toute l'énergie est, à cet instant, stockée dans le fil de torsion —
      $J$ n'intervient pas dans ce résultat, il n'aurait joué que si le
      disque avait déjà une vitesse angulaire.

