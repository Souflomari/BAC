          soit le signe de $x$.
      - id: C
        text: >-
          Elle est plus grande en étirement, car le ressort stocke alors
          aussi de l'énergie de pesanteur en plus de l'énergie élastique.
        correct: false
        misconception: mc.physics.pc_energie.epe-confondue-avec-epp
        also_reveals: []
        feedback: >
          Il n'y a pas d'énergie de pesanteur en jeu ici : le mouvement
          reste horizontal, l'altitude ne change pas. L'énergie stockée,
          dans les deux cas, est uniquement élastique — $E_{pe} = \frac12
          kx^2$, sans terme gravitationnel additionnel.
      - id: D
        text: >-
          Elle vaut $kx^2$ dans les deux cas, le travail de la force de
          rappel valant force finale × distance.
        correct: false
        misconception: mc.physics.pc_energie.epe-force-rappel-traitee-constante
        also_reveals: []
        feedback: >
          $kx^2$ correspond à une force de rappel traitée comme constante
          et égale à sa valeur finale $kx$ dès le départ. La vraie force de
          rappel croît de $0$ à $kx$ : le travail (donc $E_{pe}$) est
          l'aire du triangle, $\frac12 kx^2$ — la moitié de $kx^2$.
    correct_feedback: >
      $E_{pe}(+3{,}0\ \text{cm}) = \frac12 k (0{,}030)^2$ et
      $E_{pe}(-3{,}0\ \text{cm}) = \frac12 k (-0{,}030)^2$ : comme
      $(-0{,}030)^2 = (0{,}030)^2$, les deux valeurs sont rigoureusement
      identiques, quel que soit $k$.
    solution: |
      $x$ est élevé au carré dans $E_{pe} = \frac12 kx^2$ :
      $(+0{,}030)^2 = (-0{,}030)^2 = 9{,}0\times10^{-4}\ \text{m}^2$.
      L'énergie potentielle élastique est donc identique en étirement et en
      compression de même amplitude — elle ne dépend ni du signe de $x$, ni
      de la masse, ni de l'altitude.

  - id: AE-24
    rung: "R5"
    difficulty_level: 4
    skill_code: pc_energie
    tags: [misconception_driven, energie_potentielle_elastique, application_experimentale]
    stem: >
      Lors d'une expérience, on enregistre les courbes $E_c(x)$, $E_{pe}(x)$
      et $E_m(x)$ d'un oscillateur élastique horizontal sans frottement, en
      fonction de la position $x$. Quelle affirmation décrit correctement ce
      diagramme d'énergie ?
    type: mcq
    choices:
      - id: A
        text: >-
          La courbe $E_{pe}(x)$ dépend de la masse $m$ du solide accroché :
          deux solides de masses différentes sur le même ressort donneraient
          deux courbes $E_{pe}(x)$ différentes.
        correct: false
        misconception: mc.physics.pc_energie.epe-depend-masse-ou-vitesse
        also_reveals: []
        feedback: >
          $E_{pe} = \frac12 kx^2$ ne contient pas $m$ : la courbe $E_{pe}(x)$
          est la même quelle que soit la masse accrochée. C'est la courbe
          $E_c(x) = E_m - E_{pe}(x)$ qui dépend indirectement de $m$, via
          $E_m$ et $v_{max}$.
      - id: B
        text: >-
          La courbe $E_{pe}(x)$ est en réalité l'énergie potentielle de
          pesanteur du solide, qui varie parce que le ressort modifie
          l'altitude au cours de l'oscillation.
        correct: false
        misconception: mc.physics.pc_energie.epe-confondue-avec-epp
        also_reveals: []
        feedback: >
          Sur un ressort horizontal, l'altitude ne varie pas du tout
          pendant l'oscillation : $E_{pe}(x)$ ne peut donc pas être une
          énergie de pesanteur déguisée. C'est une énergie élastique,
          stockée dans la déformation du ressort, pas dans un changement
          d'altitude.
      - id: C
        text: >-
          La parabole $E_{pe}(x)$ atteint, à $x=X_m$, une valeur deux fois
          plus grande que $\frac12 kX_m^2$, car le travail de la force de
          rappel se calcule comme $kX_m^2$.
        correct: false
        misconception: mc.physics.pc_energie.epe-force-rappel-traitee-constante
        also_reveals: []
        feedback: >
          $kX_m^2$ suppose la force de rappel constante et égale à sa
          valeur finale dès le départ de l'étirement. La vraie courbe
          $E_{pe}(x) = \frac12 kx^2$ vaut exactement la moitié de cette
          valeur en tout point $x$ — c'est elle qui est tracée sur le
          diagramme, pas $kx^2$.
      - id: D
        text: >-
          $E_{pe}$ dessine une parabole minimale en $x=0$ ; $E_c$ dessine la
          parabole inversée, maximale en $x=0$ ; $E_m$ est une droite
          horizontale.
        correct: true
    correct_feedback: >
      Sur ce diagramme, $E_{pe} = \frac12 kx^2$ (parabole, minimum nul en
      $x=0$), $E_c = E_m - E_{pe}$ (parabole inversée, maximum en $x=0$, où
      la vitesse est maximale), et $E_m$ reste une droite horizontale — le
      plafond que ni $E_c$ ni $E_{pe}$ ne dépassent.
    solution: |
      Aux positions extrêmes $x=\pm X_m$, le solide s'arrête un instant :
      $E_c=0$, toute l'énergie est dans le ressort ($E_{pe}=E_m$). Au
      passage par l'équilibre $x=0$ : $E_{pe}=0$, toute l'énergie est
      cinétique, la vitesse y est maximale. Entre les deux, les deux
      courbes se croisent là où $E_c = E_{pe}$. $E_m$, elle, reste
      constante en tout point du diagramme — c'est la définition même de
      la conservation sans frottement.

