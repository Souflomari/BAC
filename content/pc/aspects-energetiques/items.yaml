        correct: false
        misconception: mc.physics.pc_energie.frottement-restitue-energie
        feedback: >
          Le frottement dissipe de l'énergie, il n'en restitue jamais au
          solide : son travail est toujours résistant (négatif), donc il ne
          peut qu'abaisser la vitesse d'arrivée.
      - id: C
        text: >-
          La bille sur le toboggan arrive avec une vitesse plus faible qu'en chute
          libre, car le frottement dissipe de l'énergie sur son trajet.
