      - id: D
        text: "$5{,}0\\ \\text{J}$"
        correct: true
    correct_feedback: >
      $E_c = \frac12 m v^2 = \frac12 \times 0{,}40 \times 5{,}0^2 = 5{,}0\ \text{J}$.
    solution: |
      $$E_c = \frac{1}{2} m v^2 = \frac{1}{2} \times 0{,}40 \times 5{,}0^2 = 5{,}0\ \text{J}$$

  - id: AE-11
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_energie
    tags: [energie_cinetique]
    stem: >
      La vitesse d'un mobile double, sa masse restant inchangée. Comment
      varie son énergie cinétique $E_c$ ?
    type: mcq
    choices:
      - id: A
        text: "Elle est multipliée par 4."
        correct: true
      - id: B
        text: "Elle est multipliée par 2, comme la vitesse."
        correct: false
        misconception: mc.physics.pc_energie.ec-mauvaise-dependance-en-v
        feedback: >
          $E_c$ varie comme le carré de la vitesse, pas comme la vitesse
          elle-même : doubler $v$ multiplie $v^2$ par 4, pas par 2.
      - id: C
        text: "Elle est multipliée par 8."
        correct: false
        misconception: mc.physics.pc_energie.ec-mauvaise-dependance-en-v
        feedback: >
          $E_c$ dépend de $v^2$, pas de $v^3$ : doubler $v$ multiplie $E_c$
          par $2^2 = 4$, pas par $2^3 = 8$.
      - id: D
        text: "Elle ne change pas, car seule la masse détermine l'énergie cinétique."
        correct: false
        misconception: mc.physics.pc_energie.ec-mauvaise-dependance-en-v
        feedback: >
          $E_c = \frac12 m v^2$ dépend explicitement de $v$, pas seulement
          de $m$ : faire varier la vitesse fait nécessairement varier $E_c$.
    correct_feedback: >
      $E_c \propto v^2$ : doubler $v$ multiplie $v^2$, donc $E_c$, par
      $2^2 = 4$.
    solution: |
      $$\frac{E_c'}{E_c} = \frac{\frac12 m (2v)^2}{\frac12 m v^2} = \frac{4v^2}{v^2} = 4$$
      L'énergie cinétique est multipliée par 4, jamais par 2.

