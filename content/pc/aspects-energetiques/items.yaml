        correct: false
        misconception: mc.physics.pc_energie.pendule-ralentir-egale-perdre-energie
        also_reveals: []
        feedback: >
          Le ralentissement aux écarts extrêmes est celui de $E_c$, pas de
          $E_m$. Sans frottement, la courbe $E_m(t)$ reste rigoureusement
          plate : elle ne dessine aucune baisse, même temporaire, aux
          instants où le pendule s'arrête un instant.
      - id: C
        text: >-
          Sur l'axe des altitudes utilisé pour tracer $E_{pp}$, la
          variation d'altitude est $L\theta$ (la longueur de l'arc
          parcouru), pas $L(1-\cos\theta)$.
        correct: false
        misconception: mc.physics.pc_energie.pendule-hauteur-egale-longueur-fil
        also_reveals: []
        feedback: >
          $L\theta$ est une longueur d'arc, une distance parcourue le long
          de la trajectoire courbe — pas une élévation verticale. La courbe
          $E_{pp}(t)$ est construite à partir de la vraie hauteur
          $z = L(1-\cos\theta)$, la seule cohérente avec $E_{pp}=mgz$.
      - id: D
        text: >-
          $E_{pp}$ est maximale au point le plus bas, là où le pendule va
          le plus vite.
        correct: false
        misconception: mc.physics.pc_energie.pendule-em-maximale-en-bas
        also_reveals: []
        feedback: >
          C'est l'inverse : au point le plus bas, $z=0$ donc $E_{pp}=0$ —
          c'est $E_c$ qui y est maximale, précisément parce que la vitesse
          y est la plus grande. $E_{pp}$ est maximale aux écarts extrêmes,
          où le pendule s'arrête un instant.
    correct_feedback: >
      Sur l'enregistrement, $E_c(t)$ et $E_{pp}(t)$ oscillent en antiphase
      (l'une monte quand l'autre descend), $E_c$ culminant au point bas et
      $E_{pp}$ culminant aux extrémités ; leur somme $E_m(t)$, elle, reste
      une droite horizontale — la signature d'un mouvement sans frottement.
    solution: |
      Au point le plus bas ($\theta=0$, $z=0$) : $E_{pp}=0$, $E_c$
      maximale, vitesse maximale. Aux écarts extrêmes ($\theta=\pm\theta_m$) :
      $v=0$, $E_c=0$, $E_{pp}$ maximale. Entre les deux, $E_c$ et $E_{pp}$
      s'échangent en permanence, mais leur somme $E_c+E_{pp}=E_m$ ne varie
      jamais — c'est exactement ce qu'affirme la conservation de l'énergie
      mécanique sans frottement.

  # ── Quatre items ajoutés le 2026-09-05 pour amener au plancher les SEPT
  #    familles qui y siégeaient en dessous : ec-grandeur-vectorielle (1 item),
  #    energie-oublie-g (1), force-perpendiculaire-travaille (1),
  #    travail-oublie-cos (1), confond-ec-et-em (2),
  #    ec-mauvaise-dependance-en-v (2), frottement-restitue-energie (2).
  #    Le résumé en fin de fichier annonçait `floor_met: true` : c'est la plus
  #    grosse des quatre dérives relevées par web/scripts/resume-couverture.mjs.
  #    Chaque item porte TROIS familles distinctes sur ses trois distracteurs,
  #    de sorte que quatre items suffisent à combler onze places.
  - id: AE-31
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [energie_cinetique, dependance_en_v, grandeur_scalaire]
    stem: >
      Un chariot roule à $v = 3{,}0\ \text{m/s}$ sur une table horizontale
      située à $1{,}0\ \text{m}$ au-dessus du sol. On double sa vitesse, tout
      le reste étant inchangé. Par combien son énergie cinétique est-elle
      multipliée ?
    type: mcq
    choices:
      - id: A
        text: >-
          Par 2 : l'énergie cinétique suit la vitesse, donc doubler l'une
          double l'autre
        correct: false
        misconception: mc.physics.pc_energie.ec-mauvaise-dependance-en-v
        feedback: >
          $E_c = \frac12 mv^2$ : c'est le CARRÉ de la vitesse qui intervient.
          Doubler $v$ multiplie $E_c$ par $2^2 = 4$, pas par 2 — c'est la
          raison pour laquelle une voiture qui roule deux fois plus vite met
          quatre fois plus de distance à s'arrêter.
      - id: B
        text: >-
          Par 4 : l'énergie cinétique varie comme le CARRÉ de la vitesse,
          $E_c = \frac12 mv^2$, et $2^2 = 4$
        correct: true
      - id: C
        text: >-
          Par 4 si le chariot continue dans le même sens ; s'il repart en sens
          inverse, son énergie cinétique change aussi de signe
        correct: false
        misconception: mc.physics.pc_energie.ec-grandeur-vectorielle
        feedback: >
          $E_c$ est une grandeur SCALAIRE, toujours positive : elle ne dépend
          que de la NORME de la vitesse. Un chariot lancé vers la gauche à
          $6{,}0\ \text{m/s}$ a exactement la même énergie cinétique que le
          même chariot lancé vers la droite à la même allure.
      - id: D
        text: >-
          Par 4 seulement si la table était au niveau du sol : à
          $1{,}0\ \text{m}$ de hauteur, l'énergie potentielle s'ajoute à
          l'énergie cinétique et le rapport n'est plus 4
        correct: false
        misconception: mc.physics.pc_energie.confond-ec-et-em
        feedback: >
          C'est l'énergie MÉCANIQUE $E_m = E_c + E_{pp}$ qui contiendrait ce
          terme d'altitude — pas l'énergie cinétique. $E_c = \frac12 mv^2$
          ignore complètement la hauteur : la table peut être au sol ou au
          sommet d'un immeuble, le rapport reste 4.
    correct_feedback: >
      $E_c = \frac12 mv^2$ dépend du CARRÉ de la vitesse : la multiplier par 2
      multiplie l'énergie cinétique par $2^2 = 4$. L'altitude de la table,
      elle, n'entre que dans l'énergie potentielle de pesanteur.
    solution: |
      $$
      E_c = \frac{1}{2}mv^2 \qquad\text{et}\qquad
      E_c' = \frac{1}{2}m(2v)^2 = \frac{1}{2}m \times 4v^2 = 4\,E_c
      $$
      Le rapport ne fait intervenir ni la masse (elle se simplifie), ni la
      direction du mouvement (seule la norme $v$ figure dans la formule), ni
      l'altitude (qui appartient à $E_{pp} = mgz$, pas à $E_c$).

  - id: AE-32
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [travail_force_constante, produit_scalaire, reaction_normale]
    stem: >
      Une caisse est tirée sur $d = 5{,}0\ \text{m}$ le long d'un sol
      horizontal par une force $\vec F$ de norme $F = 40\ \text{N}$, inclinée
      de $\theta = 60^\circ$ au-dessus de l'horizontale. Le sol exerce sur elle
      une réaction normale $\vec N$ verticale. Quels sont les travaux de
      $\vec F$ et de $\vec N$ sur ce déplacement ?
    type: mcq
    choices:
      - id: A
        text: >-
          $W(\vec F) = F\,d\cos 60^\circ = 40 \times 5{,}0 \times 0{,}50 =
          100\ \text{J}$, et $W(\vec N) = 0\ \text{J}$ puisque
          $\cos 90^\circ = 0$
        correct: true
      - id: B
        text: >-
          $W(\vec F) = F \times d = 200\ \text{J}$ et $W(\vec N) = 0\ \text{J}$
          : la force entière accompagne le déplacement
        correct: false
        misconception: mc.physics.pc_energie.travail-oublie-cos
        feedback: >
          Seule la composante de $\vec F$ ALIGNÉE avec le déplacement
          travaille, d'où le facteur $\cos\theta$ du produit scalaire :
          $W(\vec F) = \vec F \cdot \vec{AB} = F\,d\cos 60^\circ = 100\
          \text{J}$. La composante verticale, elle, ne déplace rien.
      - id: C
        text: >-
          $W(\vec F) = 100\ \text{J}$ et $W(\vec N) = N \times d$ : la
          réaction du sol accompagne la caisse sur toute la distance
        correct: false
        misconception: mc.physics.pc_energie.force-perpendiculaire-travaille
        feedback: >
          $\vec N$ est verticale et le déplacement horizontal : l'angle vaut
          $90^\circ$, donc $\cos 90^\circ = 0$ et $W(\vec N) = 0\ \text{J}$.
          Une force perpendiculaire au déplacement ne travaille jamais, si
          grande soit sa norme — « accompagner » n'est pas « travailler ».
      - id: D
        text: >-
          $W(\vec F) = 100\ \text{J}$, mais ce travail est dirigé vers l'avant
          : comme l'énergie cinétique qu'il produit, c'est une grandeur qui
          porte une direction
        correct: false
        misconception: mc.physics.pc_energie.ec-grandeur-vectorielle
        feedback: >
          La valeur est juste, l'interprétation non. Le travail et l'énergie
          cinétique sont des SCALAIRES : ils ont un signe, jamais une
          direction. « Moteur » ou « résistant » qualifie le SIGNE du travail
          d'une force, ce qui n'en fait pas un vecteur.
    correct_feedback: >
      $W(\vec F) = F\,d\cos\theta = 40 \times 5{,}0 \times \cos 60^\circ =
      40 \times 5{,}0 \times 0{,}50 = 100\ \text{J}$, et $W(\vec N) = 0$ car
      $\vec N$ est perpendiculaire au déplacement.
    solution: |
      Le travail d'une force constante sur un déplacement rectiligne est le
      produit scalaire de la force par le déplacement :
      $$W(\vec F) = \vec F \cdot \vec{AB} = F\,d\,\cos\theta$$
      Pour $\vec F$, $\theta = 60^\circ$ :
      $$W(\vec F) = 40 \times 5{,}0 \times 0{,}50 = 100\ \text{J}$$
      Pour $\vec N$, verticale alors que le déplacement est horizontal,
      $\theta = 90^\circ$ :
      $$W(\vec N) = N \times d \times \cos 90^\circ = 0\ \text{J}$$
      Le poids, lui aussi vertical, ne travaille pas davantage.

  - id: AE-33
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [travail_du_poids, plan_incline, reaction_normale]
    stem: >
      Un solide de masse $m = 2{,}0\ \text{kg}$ glisse de $d = 4{,}0\ \text{m}$
      le long d'un plan incliné à $30^\circ$ : il descend donc d'une hauteur
      $h = 2{,}0\ \text{m}$. La réaction normale du plan vaut
      $N = 17\ \text{N}$. On prend $g = 10\ \text{N/kg}$. Quel bilan des
      travaux du poids et de la réaction normale est correct ?
    type: mcq
    choices:
      - id: A
        text: >-
          $W(\vec P) = m\,h = 4{,}0\ \text{J}$ et $W(\vec N) = 0\ \text{J}$
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-g
        feedback: >
          Il manque l'intensité de la pesanteur : le travail du poids vaut
          $mgh$, pas $mh$. L'oubli de $g$ divise le résultat par environ 10 et
          lui retire ses unités — $m\,h$ s'exprime en $\text{kg}\cdot
          \text{m}$, ce qui n'est pas une énergie.
      - id: B
        text: >-
          $W(\vec P) = m\,g\,h = 40\ \text{J}$ et $W(\vec N) = 0\ \text{J}$
        correct: true
      - id: C
        text: >-
          $W(\vec P) = m\,g\,d = 80\ \text{J}$ et $W(\vec N) = 0\ \text{J}$ :
          le poids agit sur toute la longueur parcourue
        correct: false
        misconception: mc.physics.pc_energie.travail-oublie-cos
        feedback: >
          Remplacer $h$ par $d$, c'est oublier le $\cos\theta$ du produit
          scalaire : $W(\vec P) = P\,d\cos 60^\circ = mgd\cos 60^\circ = mgh$.
          Seule la DÉNIVELÉE compte, jamais la longueur du chemin — c'est ce
          qui fait du poids une force conservative.
      - id: D
        text: >-
          $W(\vec P) = 40\ \text{J}$ et $W(\vec N) = N\,d = 68\ \text{J}$ : la
          réaction du plan soutient le solide pendant toute la glissade
        correct: false
        misconception: mc.physics.pc_energie.force-perpendiculaire-travaille
        feedback: >
          $\vec N$ est perpendiculaire au plan, donc au déplacement qui se
          fait le long du plan : $\cos 90^\circ = 0$ et $W(\vec N) = 0$. Sa
          norme n'y change rien, et l'inclinaison du plan non plus — c'est la
          perpendicularité seule qui annule le travail.
    correct_feedback: >
      $W(\vec P) = mgh = 2{,}0 \times 10 \times 2{,}0 = 40\ \text{J}$ : la
      dénivelée, jamais la longueur du plan. Et $W(\vec N) = 0$, la réaction
      normale étant perpendiculaire au déplacement.
    solution: |
      **Le poids.** Sa direction fait un angle de $60^\circ$ avec le
      déplacement le long du plan, donc
      $$W(\vec P) = P\,d\cos 60^\circ = mg\,d\cos 60^\circ = mg\,h$$
      puisque $d\cos 60^\circ = d\sin 30^\circ = h$. Numériquement :
      $$W(\vec P) = 2{,}0 \times 10 \times 2{,}0 = 40\ \text{J}$$
      **La réaction normale.** Perpendiculaire au plan, donc au déplacement :
      $$W(\vec N) = N\,d\cos 90^\circ = 0\ \text{J}$$
      Deux contrôles à garder : $mgh$ contient TOUJOURS $g$, et une force
      perpendiculaire au déplacement a TOUJOURS un travail nul.

  - id: AE-34
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_energie
    tags: [energie_mecanique, frottement, bilan_energetique]
    stem: >
      Un skieur de masse $m = 60\ \text{kg}$ part du repos et descend une
      piste de dénivelée $h = 20\ \text{m}$. Il arrive en bas à
      $v = 15\ \text{m/s}$. On prend $g = 10\ \text{N/kg}$. Quelle énergie les
      frottements ont-ils dissipée pendant la descente ?
    type: mcq
    choices:
      - id: A
        text: >-
          $1{,}2\times10^{3}\ \text{J}$ : l'énergie disponible au départ vaut
          $m\,h = 1200\ \text{J}$, et elle a été entièrement dissipée
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-g
        feedback: >
          L'énergie potentielle de pesanteur vaut $mgz$, pas $mz$ : au départ,
          $E_{pp} = mgh = 60 \times 10 \times 20 = 1{,}2\times10^{4}\
          \text{J}$, dix fois plus. Sans $g$, le nombre obtenu n'est même pas
          une énergie.
      - id: B
        text: >-
          $1{,}88\times10^{4}\ \text{J}$ : on additionne l'énergie potentielle
          du départ et l'énergie cinétique d'arrivée
        correct: false
        misconception: mc.physics.pc_energie.signe-travail-poids
        feedback: >
          L'énergie cinétique d'arrivée n'est pas une perte : c'est
          justement la part de l'énergie de départ qui a SURVÉCU. Elle se
          soustrait, elle ne s'ajoute — sinon la piste aurait fourni plus
          d'énergie qu'elle n'en contenait.
      - id: C
        text: >-
          Rien n'est dissipé : le frottement échauffe les skis, et cette
          chaleur est restituée au mouvement, si bien que le bilan est nul
        correct: false
        misconception: mc.physics.pc_energie.frottement-restitue-energie
        feedback: >
          La chaleur produite part dans la neige et dans l'air : elle ne
          revient jamais au skieur sous forme de mouvement. Le travail du
          frottement est toujours résistant, $W(\vec f) \le 0$, donc
          $\Delta E_m \le 0$. Si rien n'était dissipé, le skieur arriverait à
          $20\ \text{m/s}$ et non à $15$.
      - id: D
        text: >-
          $5{,}25\times10^{3}\ \text{J}$ : c'est l'énergie potentielle du
          départ moins l'énergie cinétique d'arrivée
        correct: true
    correct_feedback: >
      $E_{pp}$ au départ vaut $mgh = 1{,}2\times10^{4}\ \text{J}$ ; l'énergie
      cinétique d'arrivée vaut $\frac12 mv^2 = 6{,}75\times10^{3}\ \text{J}$.
      La différence, $5{,}25\times10^{3}\ \text{J}$, est passée en chaleur :
      c'est $|W(\vec f)|$.
    solution: |
      Le skieur part du repos, donc $E_c$ initiale nulle. En prenant le bas de
      la piste comme référence d'altitude :
      $$
      E_m(\text{départ}) = mgh = 60 \times 10 \times 20 = 1{,}2\times10^{4}\
      \text{J}
      $$
      $$
      E_m(\text{arrivée}) = \frac{1}{2}mv^2 = \frac{1}{2}\times 60 \times
      15^2 = 6{,}75\times10^{3}\ \text{J}
      $$
      La variation d'énergie mécanique est égale au travail des forces non
      conservatives, ici le seul frottement :
      $$
      \Delta E_m = W(\vec f) = 6{,}75\times10^{3} - 1{,}2\times10^{4}
      = -5{,}25\times10^{3}\ \text{J}
      $$
      Les frottements ont donc dissipé $5{,}25\times10^{3}\ \text{J}$, soit
      environ 44 % de l'énergie de départ. Contrôle : sans frottement, le
      skieur arriverait à $v = \sqrt{2gh} = 20\ \text{m/s}$ ; il arrive à
      $15\ \text{m/s}$, ce qui confirme une perte.

  # ── AE-35 et AE-36 (2026-09-23) — la racine carrée oubliée, dans les deux
  # oscillateurs où l'élève remonte à une vitesse. Écrits pour ramener
  # `confusion-v-et-v-carre` au plancher après le réétiquetage honnête du
  # 2026-09-19 (AE-4 D, AE-19 C). Chaque distracteur porte une famille
  # DISTINCTE, et chacun sort d'un calcul que l'on peut refaire : le nombre
  # du distracteur est exactement celui que produit l'erreur nommée.
  - id: AE-35
    rung: "R7"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [pendule_pesant, energie_mecanique, vitesse]
    stem: >
      Un pendule simple de longueur $L = 2{,}0\ \text{m}$ est lâché sans
      vitesse initiale depuis un écart $\theta_0 = 60^\circ$ avec la verticale.
      Les frottements sont négligés et on prend $g = 10\ \text{N/kg}$. Quelle
      est la vitesse de la masse quand elle passe par la position la plus
      basse ?
    type: mcq
    choices:
      - id: A
        text: "$20\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_energie.confusion-v-et-v-carre
        feedback: >
          $2gz = 20$ est le CARRÉ de la vitesse : il s'exprime en
          $\text{m}^2/\text{s}^2$, pas en $\text{m/s}$. Il reste à prendre la
          racine, $v = \sqrt{20} \approx 4{,}5\ \text{m/s}$. Contrôle de bon
          sens : $20\ \text{m/s}$, c'est $72\ \text{km/h}$ pour une masse
          tombée d'un mètre.
      - id: B
        text: "$6{,}3\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_energie.pendule-hauteur-egale-longueur-fil
        feedback: >
          Ce nombre vient de $v^2 = 2gL$, comme si la masse descendait de toute
          la longueur du fil. Elle ne descend que de la différence d'altitude
          entre l'écart $\theta_0$ et la verticale :
          $z = L(1-\cos\theta_0) = 2{,}0 \times (1 - 0{,}5) = 1{,}0\ \text{m}$.
      - id: C
        text: "$4{,}5\\ \\text{m/s}$"
        correct: true
      - id: D
        text: "$3{,}2\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-facteur-demi
        feedback: >
          Ce nombre vient de $v^2 = gz$ : le facteur 2 a disparu. La
          conservation de l'énergie mécanique s'écrit
          $\frac12 mv^2 = mgz$, donc $v^2 = 2gz$ — le $\frac12$ de l'énergie
          cinétique devient un 2 de l'autre côté.
    correct_feedback: >
      La masse descend de $z = L(1-\cos 60^\circ) = 1{,}0\ \text{m}$ ; la
      conservation de l'énergie mécanique donne $v^2 = 2gz = 20\
      \text{m}^2/\text{s}^2$, puis $v = \sqrt{20} \approx 4{,}5\ \text{m/s}$.
    solution: |
      **La hauteur de chute.** Entre l'écart $\theta_0$ et la verticale, la
      masse descend de
      $$z = L(1-\cos\theta_0) = 2{,}0 \times (1 - 0{,}5) = 1{,}0\ \text{m}$$
      **Le bilan.** La tension du fil est perpendiculaire au déplacement, elle
      ne travaille pas ; sans frottement, l'énergie mécanique se conserve :
      $$\frac12 m v^2 = m g z \implies v^2 = 2gz = 2 \times 10 \times 1{,}0 = 20\ \text{m}^2/\text{s}^2$$
      **La vitesse.** $v = \sqrt{20} \approx 4{,}5\ \text{m/s}$.

      Deux contrôles à garder : l'unité de $2gz$ est le $\text{m}^2/\text{s}^2$
      — c'est un carré de vitesse, pas encore une vitesse ; et la masse n'a
      servi à rien, elle se simplifie.

  - id: AE-36
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [energie_potentielle_elastique, energie_mecanique, vitesse]
    stem: >
