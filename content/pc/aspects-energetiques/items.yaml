        misconception: mc.physics.pc_energie.em-conservee-malgre-frottement
        feedback: >
          La valeur exacte n'est pas nécessaire pour connaître le sens de
          l'effet : tout frottement non nul retranche de l'énergie
          cinétique, donc la bille du toboggan arrive nécessairement moins
          vite, quelle que soit l'intensité du frottement.
    correct_feedback: >
      Avec frottement sur le toboggan, le TEC ajoute un travail résistant
      supplémentaire par rapport à la chute libre : l'énergie cinétique
      finale, donc la vitesse, y est nécessairement plus faible.
    solution: |
      Sur le toboggan, le TEC devient
      $\Delta E_c = W(\vec P) + W(\vec N) + W(\vec f)$, avec $W(\vec f) < 0$.
      Le même $W(\vec P)$ qu'en chute libre est amputé de ce terme négatif :
      l'énergie cinétique, donc la vitesse d'arrivée, y est strictement
