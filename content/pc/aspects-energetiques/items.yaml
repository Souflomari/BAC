      dans les deux cas : la formule ne contient que la norme $v$, jamais
      une direction.

  - id: AE-13
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_energie
    tags: [travail_force, signe_travail]
    stem: >
      Une force constante $\vec F$, de norme $F = 10\ \text{N}$, s'exerce
      sur un solide pendant un déplacement rectiligne $AB$ de longueur
      $d = 5{,}0\ \text{m}$. L'angle entre $\vec F$ et $\vec{AB}$ vaut
      $\theta = 60^\circ$. Quel est le travail $W(\vec F)$ de cette force ?
    type: mcq
    choices:
      - id: A
        text: >-
          $50\ \text{J}$ (le travail vaut simplement $F \times d$, sans
          tenir compte de l'angle)
        correct: false
        misconception: mc.physics.pc_energie.travail-oublie-cos
        feedback: >
          Le travail est un produit scalaire, $W(\vec F) = F d \cos\theta$
          : il faut multiplier par $\cos\theta$, pas ignorer l'angle entre
          la force et le déplacement.
      - id: B
        text: >-
          $\approx 43\ \text{J}$ (en utilisant $\sin\theta$ au lieu de
          $\cos\theta$)
        correct: false
        misconception: mc.physics.pc_energie.travail-oublie-cos
        feedback: >
          C'est $\cos\theta$ qui intervient dans le travail d'une force,
          pas $\sin\theta$ : ce dernier mesurerait la composante
          perpendiculaire au déplacement, qui ne travaille jamais.
      - id: C
        text: "$25\\ \\text{J}$ (par $W = F\\,d\\cos\\theta$, l'angle intervenant par son cosinus)"
        correct: true
      - id: D
        text: >-
          $-25\ \text{J}$ (la force serait résistante dès que $\theta$
          n'est pas nul)
        correct: false
        misconception: mc.physics.pc_energie.travail-oublie-cos
        feedback: >
          Le travail n'est négatif que si $\cos\theta < 0$, c'est-à-dire
          $90^\circ < \theta \leq 180^\circ$ ; ici $\theta = 60^\circ < 90^\circ$
          donne $\cos\theta > 0$, donc un travail positif (moteur).
    correct_feedback: >
      $W(\vec F) = F d \cos\theta = 10 \times 5{,}0 \times \cos 60^\circ = 25\ \text{J}$.
    solution: |
      $$W(\vec F) = F \times d \times \cos\theta = 10 \times 5{,}0 \times 0{,}5 = 25\ \text{J}$$
      $\theta = 60^\circ < 90^\circ$ donne $\cos\theta > 0$ : la force est
      motrice, travail positif.

  - id: AE-14
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_energie
    tags: [travail_force, reaction_normale]
    stem: >
      Un solide glisse sur un plan incliné, avec frottement, sous l'effet
      de son poids, de la réaction normale $\vec N$ du plan et du
      frottement $\vec f$. Concernant le travail $W(\vec N)$ de la réaction
      normale pendant le déplacement, quelle affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          $W(\vec N) = N \times d$, car $\vec N$ agit sur toute la distance
          parcourue $d$.
        correct: false
        misconception: mc.physics.pc_energie.force-perpendiculaire-travaille
        feedback: >
          Cette formule ignore que $\vec N$ est perpendiculaire au
          déplacement : seule la composante d'une force alignée avec le
          déplacement travaille, et $\vec N$ n'en a aucune ici.
      - id: B
        text: >-
          $W(\vec N)$ est négatif, car $\vec N$ s'oppose à l'enfoncement du
          solide dans le plan.
        correct: false
        misconception: mc.physics.pc_energie.force-perpendiculaire-travaille
        feedback: >
          S'opposer à l'enfoncement (perpendiculaire au plan) n'est pas la
          même chose que s'opposer au déplacement (le long du plan) : c'est
          ce deuxième critère qui détermine le signe du travail, et ici
          l'angle est de $90^\circ$, donc le travail est nul, pas négatif.
      - id: C
        text: "$W(\\vec N)$ dépend de l'angle $\\alpha$ du plan incliné."
        correct: false
        misconception: mc.physics.pc_energie.force-perpendiculaire-travaille
        feedback: >
          C'est la norme de $N$ (par exemple $N = mg\cos\alpha$) qui dépend
          de l'angle, pas son travail : $\vec N$ reste perpendiculaire au
          déplacement quel que soit $\alpha$, donc $W(\vec N) = 0$ toujours.
      - id: D
        text: >-
          $W(\vec N) = 0$, quelle que soit la valeur de $N$, car $\vec N$
          est perpendiculaire au déplacement.
        correct: true
    correct_feedback: >
      $\vec N$ reste perpendiculaire au déplacement (qui suit le plan) à
      chaque instant : $\cos 90^\circ = 0$, donc $W(\vec N) = 0$, quelle que
      soit sa norme.
    solution: |
      $\vec N$ est toujours perpendiculaire au déplacement le long du plan,
      donc $\theta = 90^\circ$ et $\cos\theta = 0$ :
      $$W(\vec N) = N \times d \times \cos 90^\circ = 0$$
      indépendamment de la valeur de $N$ ou de l'angle $\alpha$ du plan.

  - id: AE-15
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [tec, chute_libre]
    stem: >
      Un objet est lâché sans vitesse initiale et tombe en chute libre,
      frottements négligés, d'une hauteur $h = 10\ \text{m}$. On prend
      $g \approx 9{,}8\ \text{m/s}^2$. Quelle est sa vitesse au sol,
      déterminée par le théorème de l'énergie cinétique ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 14{,}0\\ \\text{m/s}$ (par $v = \\sqrt{2gh}$, la masse n'intervenant pas)"
        correct: true
      - id: B
        text: >-
          $\approx 9{,}9\ \text{m/s}$ (en oubliant le facteur 2 dans
          $v^2 = 2gh$)
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-facteur-demi
        feedback: >
          Le TEC donne $\frac12 m v^2 = mgh$, donc $v^2 = 2gh$ : oublier le
          facteur 2 revient à écrire $E_c = mv^2$ au lieu de
          $E_c = \frac12 m v^2$.
      - id: C
        text: "Impossible de calculer sans connaître la masse de l'objet."
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-masse
        feedback: >
          La masse se simplifie des deux côtés de l'égalité TEC
          ($\frac12 m v^2 = mgh$) : $v = \sqrt{2gh}$ ne dépend pas de $m$,
          il n'est donc pas nécessaire de la connaître.
      - id: D
        text: >-
          $196\ \text{m/s}$ (en oubliant de prendre la racine carrée de
          $v^2$)
        correct: false
        misconception: mc.physics.pc_energie.confusion-v-et-v-carre
        feedback: >
          $v^2 = 2gh = 196$ est le carré de la vitesse, pas la vitesse
          elle-même : il faut encore prendre la racine carrée pour obtenir
          $v$.
    correct_feedback: >
      $v = \sqrt{2gh} = \sqrt{2 \times 9{,}8 \times 10} = \sqrt{196} = 14{,}0\ \text{m/s}$.
    solution: |
      $$\frac12 m v^2 - 0 = mgh \implies v = \sqrt{2gh} = \sqrt{2 \times 9{,}8 \times 10} = 14{,}0\ \text{m/s}$$
      La masse se simplifie : elle n'est jamais nécessaire pour ce calcul.

  - id: AE-16
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [travail_poids, energie_potentielle]
    stem: >
      Un solide de masse $m = 0{,}30\ \text{kg}$ monte d'une hauteur
      $h = 2{,}0\ \text{m}$ (chemin quelconque, sans frottement). On prend
      $g \approx 9{,}8\ \text{m/s}^2$. Quels sont le travail du poids
      $W(\vec P)$ et la variation d'énergie potentielle $\Delta E_{pp}$
      correspondants ?
    type: mcq
    choices:
      - id: A
        text: "$W(\\vec P) \\approx +5{,}9\\ \\text{J}$ ; $\\Delta E_{pp} \\approx -5{,}9\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.signe-travail-poids
        feedback: >
          Le poids s'oppose ici au déplacement, qui est vers le haut : son
          travail est donc résistant (négatif), pas positif, quelle que
          soit la distance parcourue.
      - id: B
        text: "$W(\\vec P) \\approx -5{,}9\\ \\text{J}$ ; $\\Delta E_{pp} \\approx +5{,}9\\ \\text{J}$"
        correct: true
      - id: C
        text: "$W(\\vec P) \\approx -5{,}9\\ \\text{J}$ ; $\\Delta E_{pp} \\approx -5{,}9\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.signe-travail-poids
        feedback: >
          La relation est $W(\vec P) = -\Delta E_{pp}$ : si $W(\vec P)$ est
          négatif, $\Delta E_{pp}$ doit être positif, pas de même signe.
      - id: D
        text: "$W(\\vec P) \\approx -0{,}60\\ \\text{J}$ ; $\\Delta E_{pp} \\approx +0{,}60\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-g
        feedback: >
          Ce résultat oublie le facteur $g$ dans $W(\vec P) = mgh$ (calcul
          $mh$ au lieu de $mgh$) : l'énergie potentielle de pesanteur
          contient bien $g$.
    correct_feedback: >
      Le solide monte : le poids s'y oppose, $W(\vec P) = -mgh \approx -5{,}9\ \text{J}$,
      et $\Delta E_{pp} = -W(\vec P) \approx +5{,}9\ \text{J}$.
    solution: |
      $$W(\vec P) = mg(z_A - z_B) = -mgh = -0{,}30 \times 9{,}8 \times 2{,}0 \approx -5{,}9\ \text{J}$$
      $$\Delta E_{pp} = -W(\vec P) \approx +5{,}9\ \text{J}$$
      Le solide monte : le poids résiste (travail négatif), l'énergie
      potentielle augmente.

  - id: AE-19
    rung: "R8"
    difficulty_level: 5
    skill_code: pc_energie
    tags: [tec, frottement, application_bac]
    stem: >
      Un traîneau de masse $m = 60\ \text{kg}$ part sans vitesse initiale du
      sommet d'une piste inclinée rectiligne de longueur $L = 50\ \text{m}$,
      telle que $\sin\alpha = 0{,}20$. Un frottement constant, opposé au
      mouvement, de norme $f = 30\ \text{N}$, s'exerce sur toute la piste
      inclinée. Au bas de la piste, le traîneau aborde une portion
      horizontale où le frottement devient $f' = 150\ \text{N}$, jusqu'à
      l'arrêt complet. On prend $g \approx 9{,}8\ \text{m/s}^2$. Quelle
      distance $d'$ le traîneau parcourt-il sur la portion horizontale
      avant de s'arrêter ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 29{,}2\\ \\text{m}$"
        correct: true
      - id: B
        text: "$\\approx 39{,}2\\ \\text{m}$"
        correct: false
        misconception: mc.physics.pc_energie.em-conservee-malgre-frottement
        feedback: >
          Ce résultat oublie le travail du frottement sur la piste inclinée
          (comme si $E_m$ y était conservée) : il faut retrancher
          $f \times L$ à $W(\vec P)$ avant d'aborder la portion horizontale.
      - id: C
        text: "$\\approx 186{,}0\\ \\text{m}$"
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Ce résultat utilise $mgL$ au lieu de $mgL\sin\alpha$ pour le
          travail du poids : seule la dénivelée $h = L\sin\alpha$ compte,
          pas la longueur $L$ de la piste inclinée.
      - id: D
        text: "$\\approx 146{,}0\\ \\text{m}$"
        correct: false
        misconception: mc.physics.pc_energie.em-conservee-malgre-frottement
        feedback: >
          Ce résultat utilise le frottement de la piste inclinée
          ($f = 30\ \text{N}$) au lieu de celui de la portion horizontale
          ($f' = 150\ \text{N}$) pour calculer la distance d'arrêt.
    correct_feedback: >
      $E_{c,bas} = mgL\sin\alpha - fL = 5\,880 - 1\,500 = 4\,380\ \text{J}$,
      puis $d' = E_{c,bas} / f' = 4\,380 / 150 \approx 29{,}2\ \text{m}$.
    solution: |
      $$W(\vec P) = mgL\sin\alpha = 60 \times 9{,}8 \times 50 \times 0{,}20 = 5\,880\ \text{J}$$
      $$W(\vec f) = -fL = -30 \times 50 = -1\,500\ \text{J}$$
      $$E_{c,bas} = 5\,880 - 1\,500 = 4\,380\ \text{J}$$
      Sur le plat, $W(\vec P) = 0$ : $E_{c,bas} = f' d' \implies d' = 4\,380 / 150 \approx 29{,}2\ \text{m}$.

  - id: AE-20
    rung: "R8"
    difficulty_level: 4
    skill_code: pc_energie
    tags: [energie_mecanique, frottement, raisonnement_qualitatif]
    stem: >
      Un skieur descend une piste inclinée avec frottement, en partant du
      repos. On refait l'expérience en doublant la norme du frottement sur
      la piste inclinée, toutes les autres grandeurs (masse, angle,
      distance parcourue) restant inchangées. La vitesse au bas de la piste
      sera-t-elle plus grande, plus petite, ou égale à celle du premier
      essai ?
    type: mcq
    choices:
      - id: A
        text: "Égale, car le travail du poids ne change pas."
        correct: false
        misconception: mc.physics.pc_energie.em-conservee-malgre-frottement
        feedback: >
          $\Delta E_c$ dépend de la somme de tous les travaux, pas
          seulement de $W(\vec P)$ : doubler $W(\vec f)$ (négatif) change
          nécessairement $E_c$, même si $W(\vec P)$ reste identique.
      - id: B
        text: >-
          Plus petite : doubler le frottement double la valeur absolue
          (négative) de $W(\vec f)$, donc $E_c$ en bas de la piste diminue,
          et $v$ diminue aussi.
        correct: true
      - id: C
        text: >-
          Plus grande, car un frottement plus important échauffe davantage la piste et
          lui restitue cette énergie sous forme de mouvement.
        correct: false
        misconception: mc.physics.pc_energie.frottement-restitue-energie
        feedback: >
          Le frottement dissipe de l'énergie, il n'en restitue jamais au
          solide : son travail reste résistant (négatif), donc augmenter le
          frottement ne peut qu'abaisser la vitesse finale.
      - id: D
        text: "Impossible à dire sans refaire tout le calcul numériquement."
        correct: false
        misconception: mc.physics.pc_energie.em-conservee-malgre-frottement
        feedback: >
          Le TEC permet un raisonnement qualitatif sans refaire le calcul :
          $W(\vec P)$ inchangé, $W(\vec f)$ plus négatif $\implies E_c$ plus
          petite, donc $v$ plus petite, sans recalculer aucun nombre.
    correct_feedback: >
      $E_{c,bas} = W(\vec P) + W(\vec f)$ ; $W(\vec P)$ est inchangé, mais
      $W(\vec f)$ (négatif) double en valeur absolue : $E_{c,bas}$ diminue,
      donc $v$ diminue.
    solution: |
      $E_{c,bas} = W(\vec P) + W(\vec f)$, avec $W(\vec P)$ inchangé et
      $W(\vec f)$ deux fois plus négatif. $E_{c,bas}$ diminue donc, et avec
      elle $v_{bas}$ : pas besoin de refaire le calcul numérique pour
      conclure sur le sens de la variation.

  - id: AE-21
    rung: "R8"
    difficulty_level: 5
    skill_code: pc_energie
    tags: [tec, frottement, application_bac]
    stem: >
      Un solide de masse $m = 1{,}5\ \text{kg}$ part sans vitesse initiale
      et descend une piste avec frottement. Son altitude diminue de
      $\Delta z = 3{,}0\ \text{m}$, et sa vitesse mesurée en bas de la piste
      vaut $v = 6{,}0\ \text{m/s}$. On prend $g \approx 9{,}8\ \text{m/s}^2$.
      Quel est le travail des frottements $W(\vec f)$ sur ce trajet ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 27\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.signe-travail-poids
        feedback: >
          Ce résultat ignore le travail du poids dans le bilan (comme si
          $E_{c,bas} = W(\vec f)$ seul) : il faut écrire le TEC complet,
          $E_{c,bas} = W(\vec P) + W(\vec f)$, pour isoler $W(\vec f)$.
      - id: B
        text: "$\\approx +17{,}1\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.signe-travail-poids
        feedback: >
          Le frottement est nécessairement résistant : son travail est
          négatif. Le signe correct ici est celui de
          $W(\vec f) = E_{c,bas} - W(\vec P)$, soit $-17{,}1\ \text{J}$, pas
          $+17{,}1\ \text{J}$.
      - id: C
        text: "$\\approx -17{,}1\\ \\text{J}$"
        correct: true
      - id: D
        text: "$\\approx 9{,}9\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-facteur-demi
        feedback: >
          Ce résultat oublie le facteur $\frac12$ dans $E_c = \frac12 m v^2$
          (calcul $mv^2 = 54\ \text{J}$ au lieu de $27\ \text{J}$), ce qui
          fausse ensuite $W(\vec f)$.
    correct_feedback: >
      $W(\vec P) = mg\Delta z \approx 44{,}1\ \text{J}$,
      $E_{c,bas} = \frac12 m v^2 = 27\ \text{J}$, donc par le TEC
      $W(\vec f) = E_{c,bas} - W(\vec P) \approx -17{,}1\ \text{J}$.
    solution: |
      $$W(\vec P) = mg\Delta z = 1{,}5 \times 9{,}8 \times 3{,}0 \approx 44{,}1\ \text{J}$$
      $$E_{c,bas} = \frac12 m v^2 = \frac12 \times 1{,}5 \times 6{,}0^2 = 27\ \text{J}$$
      $$E_{c,bas} = W(\vec P) + W(\vec f) \implies W(\vec f) = 27 - 44{,}1 \approx -17{,}1\ \text{J}$$

