    correct_feedback: >
      La durée du trajet dépend de la longueur du chemin (plus longue pour
      le toboggan), mais la vitesse finale ne dépend que de la dénivelée
      $h$ — les deux notions ne varient pas ensemble.
    solution: |
      Le toboggan impose un chemin plus long : le trajet y dure plus
      longtemps. Mais le travail du poids, donc la vitesse finale, ne
      dépend que de la dénivelée $h$, commune aux deux billes : "plus long"
