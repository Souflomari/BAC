  # R7 — NEW: pendule pesant, énergie mécanique (petites oscillations) (3 items)
  # Misconceptions: pendule-ralentir-egale-perdre-energie, pendule-hauteur-egale-longueur-fil,
  # pendule-em-maximale-en-bas — each item's 3 distractors rotate through all three.
  # ══════════════════════════════════════════════════════════════

  - id: AE-28
    rung: "R7"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [misconception_driven, pendule_pesant, resolution]
    stem: >
      Un pendule simple oscille sans frottement entre les écarts extrêmes
      $\pm\theta_m$. Au moment où il atteint l'écart maximal $\theta_m$
      (vitesse nulle, un instant), que peut-on dire de son énergie ?
    type: mcq
    choices:
      - id: A
        text: >-
          $E_m$ est plus petite qu'au point le plus bas, car le pendule a
          ralenti jusqu'à s'arrêter : il a perdu de l'énergie.
        correct: false
        misconception: mc.physics.pc_energie.pendule-ralentir-egale-perdre-energie
        also_reveals: []
        feedback: >
          Le pendule n'a rien perdu : ce que $E_c$ perd en ralentissant,
          $E_{pp}$ le gagne intégralement, en montant. Sans frottement,
          $E_m = E_c + E_{pp}$ reste constante — c'est une conversion, pas
          une perte.
      - id: B
        text: >-
          $E_c = 0$ et $E_m = E_{pp}$ (maximale à cet instant) ; $E_m$ a la
          même valeur qu'au point le plus bas.
        correct: true
      - id: C
        text: >-
          $E_{pp} = mgL$ à cet instant, la hauteur gagnée étant la longueur
          du fil.
        correct: false
        misconception: mc.physics.pc_energie.pendule-hauteur-egale-longueur-fil
        also_reveals: []
        feedback: >
          La longueur du fil $L$ n'est pas une hauteur. La vraie élévation,
          entre l'écart $\theta_m$ et le point le plus bas, est
          $z = L(1-\cos\theta_m)$, toujours strictement inférieure à $L$
          (sauf pour $\theta_m = 90°$).
      - id: D
        text: >-
          $E_m$ est maximale au point le plus bas, minimale à l'écart
          maximal $\theta_m$.
        correct: false
        misconception: mc.physics.pc_energie.pendule-em-maximale-en-bas
        also_reveals: []
        feedback: >
          $E_m$ ne varie pas du tout : elle n'est ni maximale ni minimale
          nulle part, c'est exactement le sens de sa conservation. C'est
          $E_c$ qui est maximale en bas et nulle à $\theta_m$ — ne pas
          confondre $E_c$ avec $E_m$.
    correct_feedback: >
      Sans frottement, $E_m$ est constante : à l'écart maximal, $v=0$ donc
      $E_c=0$, et toute l'énergie mécanique est potentielle,
      $E_m = E_{pp}(\theta_m)$ — la même valeur qu'au point le plus bas, où
      c'est $E_c$ qui portait toute l'énergie.
    solution: |
      $\Delta E_c = W(\vec P) + W(\vec T) = W(\vec P) = -\Delta E_{pp}$ (la
      tension du fil, radiale, ne travaille jamais), donc $\Delta E_m = 0$.
      À $\theta_m$, $v=0 \Rightarrow E_c=0$ et $E_m = E_{pp}(\theta_m)$,
      exactement la valeur de $E_m$ au point le plus bas — le pendule n'a
      rien perdu, il a tout converti.

  - id: AE-29
    rung: "R7"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [misconception_driven, pendule_pesant, utilisation]
    stem: >
      Un pendule simple de longueur $L = 0{,}80\ \text{m}$ est écarté d'un
      angle $\theta = 0{,}40\ \text{rad}$ par rapport à la verticale
      ($\cos 0{,}40\ \text{rad} \approx 0{,}921$). De combien son point
      matériel s'est-il élevé par rapport au point le plus bas ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\approx 0{,}80\ \text{m}$, en prenant la longueur du fil $L$
          comme hauteur.
        correct: false
        misconception: mc.physics.pc_energie.pendule-hauteur-egale-longueur-fil
        also_reveals: []
        feedback: >
          $L$ est la longueur du fil, pas une hauteur : au point le plus
          bas, le point matériel est déjà à une distance verticale $L$
          sous le point de suspension. Ce qui compte est la VARIATION de
          cette distance verticale entre $\theta$ et $\theta=0$, soit
          $L(1-\cos\theta)$, toujours plus petite que $L$.
      - id: B
        text: >-
          Cette hauteur ne sert à rien pour l'énergie potentielle : en
          montant, le pendule ralentit et perd de l'énergie mécanique, il
          n'y a pas de conservation à exploiter ici.
        correct: false
        misconception: mc.physics.pc_energie.pendule-ralentir-egale-perdre-energie
        also_reveals: []
        feedback: >
          Sans frottement, l'énergie mécanique se conserve toujours, y
          compris ici : le ralentissement du pendule en montant traduit une
          conversion de $E_c$ en $E_{pp}$, pas une perte. La hauteur
          calculée sert précisément à quantifier cette conversion via
          $E_{pp} = mgz$.
      - id: C
        text: "$\\approx 6{,}3\\ \\text{cm}$ (par $h = L(1-\\cos\\theta)$, la dénivelée du centre par rapport au point bas)"
        correct: true
      - id: D
        text: >-
          $\approx 6{,}3\ \text{cm}$, et à cet instant $E_c = E_{pp}$,
          comme c'est toujours le cas au cours du mouvement.
        correct: false
        misconception: mc.physics.pc_energie.pendule-em-maximale-en-bas
        also_reveals: []
        feedback: >
          La hauteur calculée est correcte, mais l'affirmation qui
          l'accompagne ne l'est pas : $E_c = E_{pp}$ n'est vraie qu'à des
          positions particulières (là où les deux courbes se croisent sur
          le diagramme d'énergie), jamais en permanence tout au long du
          mouvement.
    correct_feedback: >
      $z = L(1-\cos\theta) = 0{,}80\times(1-0{,}921) = 0{,}80\times0{,}079
      \approx 0{,}063\ \text{m} = 6{,}3\ \text{cm}$ — ni la longueur du fil
      $L=0{,}80\ \text{m}$, ni la longueur de l'arc $L\theta \approx
      0{,}32\ \text{m}$.
    solution: |
      $$z = L - L\cos\theta = L(1-\cos\theta) = 0{,}80\times(1-0{,}921) \approx 0{,}063\ \text{m}$$

      C'est la projection verticale géométrique de l'écart, pas la longueur
      du fil ($0{,}80\ \text{m}$) ni la longueur de l'arc parcouru
      ($L\theta \approx 0{,}32\ \text{m}$).

  - id: AE-30
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_energie
    tags: [misconception_driven, pendule_pesant, application_experimentale]
    stem: >
      Pour un pendule pesant oscillant sans frottement, on trace $E_c$,
