      - id: D
        text: "$4{,}0\\ \\text{m/s}$"
        correct: true
    correct_feedback: >
      Le ressort restitue $E_{pe} = \frac12 kx^2 = 0{,}80\ \text{J}$,
      entièrement transformée en énergie cinétique : $v^2 = 2E_c/m = 16\
      \text{m}^2/\text{s}^2$, donc $v = \sqrt{16} = 4{,}0\ \text{m/s}$.
    solution: |
      **L'énergie stockée.** Avec $x = 0{,}080\ \text{m}$ :
      $$E_{pe} = \frac12 k x^2 = \frac12 \times 250 \times 0{,}080^2 = 0{,}80\ \text{J}$$
      **Le bilan.** Le banc est horizontal ($E_{pp}$ constante) et sans
      frottement : l'énergie mécanique se conserve, et toute l'énergie
      élastique devient cinétique quand le ressort retrouve sa longueur à vide.
      $$\frac12 m v^2 = 0{,}80\ \text{J} \implies v^2 = \frac{2 \times 0{,}80}{0{,}100} = 16\ \text{m}^2/\text{s}^2$$
      **La vitesse.** $v = \sqrt{16} = 4{,}0\ \text{m/s}$.

      Attention aux unités d'entrée : $x$ en mètres ($0{,}080$, pas $8{,}0$)
      et $m$ en kilogrammes ($0{,}100$, pas $100$).

