notion: aspects-energetiques
skill_code: pc_energie

misconceptions:
  - id: mc.physics.pc_energie.epe-force-rappel-traitee-constante
    label: "« Le travail de la force de rappel vaut force × distance, sans le facteur ½ »"
    description: "L'élève applique la formule du travail d'une force CONSTANTE ($W=F\\times d$) à la force de rappel du ressort, alors que celle-ci croît linéairement de $0$ à $kx$ pendant l'étirement. Il calcule $W=kx\\times x=kx^2$, en oubliant que seule la force MOYENNE ($\\frac12 kx$) doit être multipliée par la distance."
    contradicts_principle: "Le travail d'une force variable est l'aire sous la courbe $F(x)$ : pour $F=kx$ (droite de $(0,0)$ à $(x,kx)$), cette aire est un triangle, $\\frac12\\times x\\times(kx)=\\frac12 kx^2$ — la moitié du rectangle $kx^2$ qui supposerait la force déjà égale à $kx$ dès le départ."

  - id: mc.physics.pc_energie.epe-depend-masse-ou-vitesse
    label: "« L'énergie potentielle élastique dépend de la masse ou de la vitesse du solide »"
    description: "L'élève importe dans $E_{pe}$ des habitudes propres à $E_c$ : il pense que l'énergie stockée dans le ressort dépend de la masse accrochée ou de la vitesse instantanée du solide, ou encore qu'elle change de signe selon que le ressort est étiré ou comprimé."
    contradicts_principle: "$E_{pe}=\\frac12 kx^2$ ne dépend que de la raideur $k$ et de l'écart $x$ à l'équilibre ; $x$ étant élevé au carré, $E_{pe}$ est identique en étirement et en compression de même amplitude, et ne contient ni la masse ni la vitesse — ces deux grandeurs vivent dans $E_c$, un réservoir séparé."

  - id: mc.physics.pc_energie.epe-confondue-avec-epp
    label: "« L'énergie stockée dans le ressort est de nature gravitationnelle ($E_{pp}=mgz$) »"
    description: "L'élève ne distingue pas l'énergie potentielle élastique de l'énergie potentielle de pesanteur : face à un ressort horizontal, il cherche à expliquer l'énergie stockée par une variation d'altitude, alors que $z$ ne change pas du tout dans ce montage."
    contradicts_principle: "L'énergie élastique $E_{pe}=\\frac12 kx^2$ est stockée dans la déformation du ressort, une nature physique différente de l'énergie de pesanteur $E_{pp}=mgz$ ; sur un ressort horizontal, $z$ est constante et $E_{pp}$ ne varie pas, alors que $E_{pe}$ varie bel et bien avec $x$."

  - id: mc.physics.pc_energie.torsion-moment-traite-constant
    label: "« Le travail du couple de rappel vaut moment × angle, sans le facteur ½ »"
    description: "L'élève transpose au pendule de torsion l'erreur du ressort : il traite le moment de rappel $M=C\\theta$ comme s'il valait déjà cette intensité dès le début de la torsion, et calcule $W=C\\theta\\times\\theta=C\\theta^2$, au lieu de reconnaître le moment MOYEN $\\frac12 C\\theta$ sur tout le trajet."
    contradicts_principle: "Le travail du couple de rappel est l'aire du triangle sous $M(\\theta)=C\\theta$, soit $\\frac12\\times\\theta\\times(C\\theta)=\\frac12 C\\theta^2$ — la moitié de ce que donnerait un moment supposé constant, égal à sa valeur finale dès le départ."

  - id: mc.physics.pc_energie.torsion-ep-depend-inertie-j
    label: "« L'énergie potentielle de torsion dépend du moment d'inertie J du disque »"
    description: "L'élève fusionne les deux réservoirs d'énergie du pendule de torsion : pensant que $J$ caractérise « l'énergie du disque » en général, il l'introduit dans $E_{p,torsion}$, alors que $J$ appartient exclusivement à l'énergie cinétique de rotation."
    contradicts_principle: "$E_{p,torsion}=\\frac12 C\\theta^2$ ne dépend que de la constante de torsion $C$ et de l'angle $\\theta$ ; le moment d'inertie $J$ n'intervient que dans l'énergie cinétique de rotation $E_c=\\frac12 J\\dot\\theta^2$, jamais dans le réservoir de rappel."

  - id: mc.physics.pc_energie.torsion-ec-formule-translation
    label: "« L'énergie cinétique du disque en rotation vaut ½mv² »"
    description: "L'élève applique la formule de l'énergie cinétique de TRANSLATION à un solide qui tourne, sans reconnaître qu'un disque en rotation n'a pas une vitesse unique $v$ mais une vitesse angulaire $\\dot\\theta$ commune à tous ses points."
    contradicts_principle: "Pour un solide en rotation autour d'un axe fixe, l'énergie cinétique est $E_c=\\frac12 J\\dot\\theta^2$ — l'analogue rotationnel exact de $\\frac12 mv^2$, avec $J$ (moment d'inertie) au rôle de $m$ et $\\dot\\theta$ au rôle de $v$."

  - id: mc.physics.pc_energie.pendule-ralentir-egale-perdre-energie
    label: "« Le pendule ralentit près des extrémités, donc il perd de l'énergie mécanique »"
    description: "L'élève confond la chute de l'énergie cinétique (visible dans le ralentissement) avec une perte de l'énergie mécanique totale, sans voir que ce que $E_c$ perd, $E_{pp}$ le gagne intégralement."
    contradicts_principle: "Sans frottement, $E_m=E_c+E_{pp}$ est constante (établie par le TEC, la tension du fil ne travaillant jamais) : le ralentissement près des extrémités traduit une conversion de $E_c$ vers $E_{pp}$, pas une perte d'énergie."

  - id: mc.physics.pc_energie.pendule-hauteur-egale-longueur-fil
    label: "« La hauteur gagnée par le pendule est la longueur du fil L (ou l'arc Lθ) »"
    description: "L'élève applique $E_{pp}=mgz$ en prenant pour $z$ la longueur du fil $L$, ou la longueur de l'arc parcouru $L\\theta$, au lieu de la vraie élévation verticale entre la position à l'angle $\\theta$ et le point le plus bas."
    contradicts_principle: "La hauteur gagnée est la projection géométrique $z=L(1-\\cos\\theta)$ ; ni $L$ seul (longueur du fil, une distance constante qui n'est pas une hauteur), ni $L\\theta$ (longueur de l'arc, une distance curviligne le long de la trajectoire, pas une élévation verticale)."

  - id: mc.physics.pc_energie.pendule-em-maximale-en-bas
    label: "« L'énergie mécanique est maximale en bas, ou Ec et Epp sont toujours égales »"
    description: "L'élève confond l'énergie mécanique constante avec l'énergie cinétique, qui elle varie et culmine au point bas ; ou généralise une égalité de passage ($E_c=E_{pp}$, vraie à des positions particulières) en une règle permanente valable partout."
    contradicts_principle: "$E_m$ ne varie pas : elle n'est ni maximale ni minimale nulle part. C'est $E_c$ qui est maximale au point le plus bas et $E_{pp}$ qui est maximale aux écarts extrêmes ; $E_c=E_{pp}$ seulement aux positions où les deux courbes du diagramme d'énergie se croisent."

  # ── Generic-energy misconceptions (R0–R4 / R8) — backfilled during the
  # summit-conversion pass to give every legacy item a formal misconception
  # mapping. These items were originally built as a DIFFICULTY RAMP (≈3 per
  # rung), not as a per-misconception coverage bank, so several of these
  # generic models sit BELOW the ≥3-item floor (honestly reported in
  # coverage_summary §6). Only the gate/rupture targets and the R5/R6/R7
  # oscillator set are guaranteed at floor.
  - id: mc.physics.pc_energie.travail-poids-depend-du-chemin
    label: "« Le travail du poids — donc la vitesse d'arrivée — dépend de la longueur ou de la forme du chemin »"
    description: "L'élève pense qu'un chemin plus long (ou plus court, ou d'une certaine forme) modifie le travail du poids et donc la vitesse d'arrivée : il calcule $mgs$ avec la longueur du chemin $s$, ou conclut qu'une des deux trajectoires arrive plus vite."
    contradicts_principle: "$W(\\vec P)_{A\\to B}=mg(z_A-z_B)$ ne dépend que de la dénivelée entre le départ et l'arrivée, jamais de la longueur, de la forme ou de la durée du trajet ; à dénivelée et frottements égaux, la vitesse d'arrivée est identique quel que soit le chemin."
  - id: mc.physics.pc_energie.frottement-restitue-energie
    label: "« Le frottement peut restituer de l'énergie au solide (l'échauffement lui rend de la vitesse) »"
    description: "L'élève croit que le frottement fournit de l'énergie au solide, ou que son travail peut être positif — par exemple qu'il augmente $E_m$ ou la vitesse d'arrivée."
    contradicts_principle: "Le frottement s'oppose toujours au mouvement : son travail est résistant ($W(\\vec f)\\le 0$), il ne fait que dissiper de l'énergie mécanique en chaleur. $\\Delta E_m=W(\\vec f)\\le 0$ : le frottement ne peut jamais augmenter $E_m$ ni la vitesse."
  - id: mc.physics.pc_energie.energie-oublie-facteur-demi
    label: "« Énergie cinétique sans le facteur ½ (ou $v^2=gh$ sans le facteur 2) »"
    description: "L'élève écrit $E_c=mv^2$ au lieu de $\\frac12 mv^2$, ou applique $v^2=gh$ au lieu de $v^2=2gh$ — le facteur numérique de l'énergie cinétique est omis."
    contradicts_principle: "$E_c=\\frac12 mv^2$ : le facteur $\\frac12$ vient de l'intégration du travail ; le TEC en chute libre donne $\\frac12 mv^2=mgh$, donc $v^2=2gh$, jamais $v^2=gh$."
  - id: mc.physics.pc_energie.ec-mauvaise-dependance-en-v
    label: "« L'énergie cinétique varie comme $v$ (ou $v^3$, ou pas du tout), pas comme $v^2$ »"
    description: "L'élève traite $E_c$ comme proportionnelle à $v$ (doubler $v$ doublerait $E_c$), ou à une autre puissance, ou la croit indépendante de la vitesse."
    contradicts_principle: "$E_c=\\frac12 mv^2\\propto v^2$ : doubler $v$ multiplie $E_c$ par $2^2=4$, jamais par $2$ ni par $8$ ; et $E_c$ dépend bien de $v$, pas seulement de $m$."
  - id: mc.physics.pc_energie.energie-oublie-masse
    label: "« Formule d'énergie ou de travail écrite sans la masse »"
    description: "L'élève omet la masse : il calcule $gh$ au lieu de $mgh$, ou $\\frac12 v^2$ au lieu de $\\frac12 mv^2$, ou oublie de diviser par $m$ pour remonter à la vitesse."
    contradicts_principle: "L'énergie cinétique $\\frac12 mv^2$ et le travail du poids $mgh$ contiennent tous deux la masse ; l'omettre change la valeur (et les unités) — même si la masse se simplifie parfois, elle doit d'abord être écrite des deux côtés."
  - id: mc.physics.pc_energie.ec-grandeur-vectorielle
    label: "« L'énergie cinétique est un vecteur / dépend de la direction du mouvement »"
    description: "L'élève pense que $E_c$ porte une direction (comme $\\vec v$), ou qu'elle dépend de l'orientation du mouvement, ou qu'elle est « motrice » ou « résistante »."
    contradicts_principle: "$E_c=\\frac12 mv^2$ est une grandeur scalaire, toujours positive, qui ne dépend que de la NORME $v$ de la vitesse — jamais de sa direction ; « motrice/résistante » qualifie le travail d'une force, pas l'énergie cinétique."
  - id: mc.physics.pc_energie.travail-oublie-cos
    label: "« Le travail d'une force vaut $F\\times d$ sans le $\\cos\\theta$ (ou avec $\\sin\\theta$) »"
    description: "L'élève oublie le facteur $\\cos\\theta$ du produit scalaire, utilise $\\sin\\theta$ à la place, ou se trompe sur le signe (motrice/résistante) qui en découle."
    contradicts_principle: "$W(\\vec F)=\\vec F\\cdot\\vec{AB}=F\\,d\\,\\cos\\theta$ : c'est la composante de $\\vec F$ ALIGNÉE avec le déplacement qui travaille, donc $\\cos\\theta$ (pas $\\sin\\theta$) ; le signe du travail suit celui de $\\cos\\theta$."
  - id: mc.physics.pc_energie.force-perpendiculaire-travaille
    label: "« Une force perpendiculaire au déplacement (réaction normale) travaille »"
    description: "L'élève attribue un travail non nul à la réaction normale $\\vec N$ (ou à toute force perpendiculaire au déplacement), par exemple $W(\\vec N)=N\\times d$, ou le croit dépendant de l'angle du plan."
    contradicts_principle: "$\\vec N$ reste perpendiculaire au déplacement : $\\theta=90^\\circ$, $\\cos\\theta=0$, donc $W(\\vec N)=0$ quelle que soit sa norme ou l'inclinaison du plan — une force perpendiculaire au déplacement ne travaille jamais."
  - id: mc.physics.pc_energie.energie-oublie-g
    label: "« Énergie potentielle de pesanteur ou travail du poids sans le facteur $g$ »"
    description: "L'élève écrit $E_{pp}=mz$ ou $W(\\vec P)=mh$ au lieu de $mgz$ / $mgh$ — l'intensité de la pesanteur $g$ est omise."
    contradicts_principle: "$E_{pp}=mgz$ et $W(\\vec P)=mgh$ contiennent l'intensité de la pesanteur $g\\approx 9{,}8\\ \\text{m/s}^2$ ; l'omettre divise le résultat par $\\approx 9{,}8$ et lui retire ses unités d'énergie."
  - id: mc.physics.pc_energie.confond-ec-et-em
    label: "« L'énergie cinétique est confondue avec l'énergie mécanique »"
    description: "L'élève traite $E_c$ et $E_m$ comme la même grandeur : il pose $E_c=E_m$ à un instant où l'altitude n'est pas nulle, ou en déduit une vitesse sans soustraire $E_{pp}$."
    contradicts_principle: "$E_m=E_c+E_{pp}$ : $E_c$ n'égale $E_m$ que là où $E_{pp}=0$ ; ailleurs il faut soustraire $E_{pp}$ pour obtenir $E_c$, puis la vitesse. Confondre les deux surestime systématiquement la vitesse."
  - id: mc.physics.pc_energie.em-conservee-malgre-frottement
    label: "« L'énergie mécanique se conserve toujours, même en présence de frottement »"
    description: "L'élève applique la conservation de $E_m$ sans vérifier l'absence de frottement : il ignore le terme $W(\\vec f)$ dans le bilan, ou affirme que $\\Delta E_m=0$ alors qu'un frottement agit."
    contradicts_principle: "$E_m$ ne se conserve QUE sans frottement ; dès qu'un frottement travaille, $\\Delta E_m=W(\\vec f)<0$ — l'ignorer revient à annoncer une vitesse finale plus grande que la vitesse réelle."
  - id: mc.physics.pc_energie.signe-travail-poids
    label: "« Erreur de signe sur le travail du poids ou sur la relation $W(\\vec P)=-\\Delta E_{pp}$ »"
    description: "L'élève se trompe sur le signe du travail du poids (positif en montée), ou donne à $W(\\vec P)$ et $\\Delta E_{pp}$ le même signe."
    contradicts_principle: "$W(\\vec P)=-\\Delta E_{pp}$ : à la montée, le poids résiste ($W(\\vec P)<0$) et $E_{pp}$ augmente ($\\Delta E_{pp}>0$) ; les deux sont toujours de signes opposés, jamais identiques."
  - id: mc.physics.pc_energie.confusion-v-et-v-carre
    label: "« $v^2$ confondu avec $v$ (oubli de la racine carrée) »"
    description: "L'élève annonce la valeur de $v^2$ comme si c'était la vitesse, en oubliant de prendre la racine carrée à la fin du calcul."
    contradicts_principle: "$v^2=2gh$ donne le CARRÉ de la vitesse ; il reste à extraire $v=\\sqrt{2gh}$ — livrer $v^2$ pour $v$ confond une vitesse au carré avec une vitesse."

items:
  - id: AE-1
    rung: "R3"
    difficulty_level: 2
    skill_code: pc_energie
    tags: [travail_poids, chemin]
    stem: >
      Une bille de masse $m = 0{,}20\ \text{kg}$ descend, sans frottement,
      une piste incurvée entre un point de départ $A$ et un point d'arrivée
      $B$. La dénivelée entre $A$ et $B$ vaut $h = 4{,}0\ \text{m}$, mais la
      longueur réelle du chemin suivi (le long de la piste incurvée) vaut
      $s = 6{,}0\ \text{m}$. On prend $g \approx 9{,}8\ \text{m/s}^2$. Que
      vaut le travail du poids $W(\vec P)$ entre $A$ et $B$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 7{,}8\\ \\text{J}$"
        correct: true
      - id: B
        text: "$\\approx 11{,}8\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Ce résultat vient du calcul $mgs$, en utilisant la longueur du
          chemin ($s = 6{,}0\ \text{m}$) au lieu de la dénivelée. Le travail
          du poids ne dépend que de la différence d'altitude entre le départ
          et l'arrivée, jamais de la longueur ni de la forme du chemin
          parcouru : ici seule la dénivelée $h = 4{,}0\ \text{m}$ compte.
      - id: C
        text: "$\\approx 3{,}9\\ \\text{J}$ (deux fois moins qu'en chute libre directe, car la rampe est plus longue que la dénivelée)"
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Ce choix suppose qu'un chemin plus long "dilue" le travail du
          poids sur une plus grande distance. C'est l'inverse d'une erreur
          fréquente, mais la même confusion : la longueur du chemin
          n'intervient pas du tout dans $W(\vec P)$, ni pour l'augmenter ni
          pour le diminuer. Seule la dénivelée $h$ compte.
      - id: D
        text: "$\\approx 39\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-masse
        feedback: >
          Ce nombre correspond à $gh$ seul, sans multiplier par la masse
          $m = 0{,}20\ \text{kg}$. Le travail du poids est $W(\vec P) = mgh$ :
          il manque le facteur $m$, et le résultat n'a d'ailleurs pas les
          bonnes unités pour une énergie sans lui.
    correct_feedback: >
      $W(\vec P) = mgh = 0{,}20 \times 9{,}8 \times 4{,}0 \approx 7{,}8\ \text{J}$.
      Le travail du poids ne dépend que de la dénivelée $h$ entre $A$ et
      $B$ — la longueur réelle du chemin ($6{,}0\ \text{m}$ ici) n'entre
      jamais dans le calcul.
    solution: |
      **Le travail du poids ne dépend que de l'altitude de départ et
      d'arrivée**, jamais du chemin suivi (établi au chapitre 4) :
      $$W(\vec P)_{A \to B} = mg\,(z_A - z_B) = mgh$$

      **Application numérique**, avec $h = 4{,}0\ \text{m}$ (la dénivelée,
      pas la longueur du chemin $s = 6{,}0\ \text{m}$) :
      $$W(\vec P) = 0{,}20 \times 9{,}8 \times 4{,}0 \approx 7{,}8\ \text{J}$$

      La longueur $s = 6{,}0\ \text{m}$ donnée dans l'énoncé est une
      information non pertinente pour ce calcul — elle ne sert qu'à tester
      si on sait ignorer la longueur du chemin.

  - id: AE-2
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [travail_poids, chemin]
    stem: >
      Un solide de masse $m$ descend, sans frottement, une dénivelée
      $h = 2{,}5\ \text{m}$, une fois via une rampe rectiligne, une fois
      via une rampe en forme de S (même dénivelé $h$, même masse, mais un
      chemin plus long et beaucoup plus sinueux). Compare le travail du
      poids sur les deux rampes, entre le départ et l'arrivée.
    type: mcq
    choices:
      - id: A
        text: >-
          Il est exactement le même sur les deux rampes, car il ne dépend
          que de la dénivelée $h$, pas de la forme du chemin.
        correct: true
      - id: B
        text: >-
          Il est plus grand sur la rampe en S, car le poids a plus de temps
          et plus de distance pour agir sur un chemin plus long.
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Le travail du poids ne dépend ni du temps mis à parcourir le
          chemin, ni de la longueur de ce chemin — seulement de la
          différence d'altitude $z_A - z_B$. Un chemin deux fois plus long
          ne donne pas un travail deux fois plus grand : la formule
          $W(\vec P) = mg(z_A - z_B)$ ne contient aucune longueur de chemin.
      - id: C
        text: >-
          Il est plus petit sur la rampe en S, car les virages successifs
          annulent une partie du travail du poids.
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Les détours horizontaux de la rampe en S ne retranchent rien : à
          chaque instant, seule la composante verticale du déplacement
          contribue au travail du poids (la composante horizontale lui est
          perpendiculaire, donc ne travaille jamais). Les allers-retours
          horizontaux s'annulent dans la somme, mais ils ne "coûtent" ni ne
          "font gagner" de travail au poids.
      - id: D
        text: >-
          Impossible à comparer sans connaître la forme exacte de chaque
          rampe.
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          La formule $W(\vec P) = mg(z_A - z_B)$ ne demande de connaître que
          les altitudes de départ et d'arrivée, jamais la forme du chemin.
          On peut donc comparer les deux travaux sans rien savoir de plus
          sur la forme des rampes.
    correct_feedback: >
      Le travail du poids est $mgh$ dans les deux cas, car il ne dépend que
      de la dénivelée $h = 2{,}5\ \text{m}$ — identique pour les deux
      rampes. La forme du chemin (rectiligne ou en S) ne change rien.
    solution: |
      **Le mécanisme (chapitre 4) :** décompose n'importe quel chemin entre $A$ et
      $B$ en petits déplacements rectilignes. Sur chacun, seule la
      composante verticale contribue au travail du poids (la composante
      horizontale lui est perpendiculaire). En sommant sur tout le chemin,
      les altitudes intermédiaires s'annulent deux à deux : il ne reste que
      la dénivelée totale $h$.

      **Conclusion :** $W(\vec P) = mgh$ pour les deux rampes — le
      résultat est rigoureusement identique, malgré la longueur et la
      forme très différentes des deux chemins.

  - id: AE-3
    rung: "R4"
    difficulty_level: 2
    skill_code: pc_energie
    tags: [energie_cinetique, energie_mecanique]
    stem: >
      Une bille glisse sans frottement sur une piste. Son énergie
      mécanique vaut $E_m = 6{,}0\ \text{J}$, constante tout au long du
      mouvement (référence d'altitude prise au point le plus bas de la
      piste). Au sommet de la piste, la bille est instantanément immobile
      ($v = 0$). Quelle est son énergie cinétique $E_c$ en ce point ?
    type: mcq
    choices:
      - id: A
        text: "$E_c = 0\\ \\text{J}$"
        correct: true
      - id: B
        text: "$E_c = 6{,}0\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.confond-ec-et-em
        feedback: >
          Ce choix confond $E_c$ avec $E_m$. C'est la SOMME
          $E_c + E_{pp}$ qui vaut $6{,}0\ \text{J}$ partout, pas $E_c$
          toute seule. Au sommet, $v = 0$ impose $E_c = \frac12 m v^2 = 0$
          — les $6{,}0\ \text{J}$ y sont entièrement sous forme d'énergie
          potentielle $E_{pp}$.
      - id: C
        text: >-
          On ne peut pas savoir sans connaître la masse de la bille.
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-masse
        feedback: >
          $E_c = \frac12 m v^2$ : avec $v = 0$, ce produit est nul quelle
          que soit la valeur de $m$. La masse n'est donc pas nécessaire
          ici — $v = 0$ suffit à conclure $E_c = 0$.
      - id: D
        text: >-
          $E_c = 3{,}0\ \text{J}$, la moitié de l'énergie mécanique, répartie
          également entre $E_c$ et $E_{pp}$.
        correct: false
        misconception: mc.physics.pc_energie.pendule-em-maximale-en-bas
        feedback: >
          Il n'existe aucune règle de partage à 50/50 entre $E_c$ et
          $E_{pp}$ : leur répartition dépend de la vitesse et de l'altitude
          à chaque instant, pas d'une proportion fixe. Ici, $v = 0$ impose
          $E_c = 0$ exactement, pas la moitié de $E_m$.
    correct_feedback: >
      Au sommet, $v = 0$ donc $E_c = \frac12 m v^2 = 0\ \text{J}$. Toute
      l'énergie mécanique $E_m = 6{,}0\ \text{J}$ y est stockée sous forme
      d'énergie potentielle de pesanteur : $E_c$ et $E_m$ ne sont jamais la
      même grandeur, sauf par coïncidence numérique.
    solution: |
      **Ce qui est donné :** $E_m = E_c + E_{pp} = 6{,}0\ \text{J}$,
      constante (pas de frottement). Au sommet, $v = 0$.

      **Calcul direct de $E_c$ au sommet :**
      $$E_c = \frac{1}{2} m v^2 = \frac{1}{2} m \times 0^2 = 0\ \text{J}$$

      **Conséquence pour $E_{pp}$ :** puisque $E_m = E_c + E_{pp}$ est
      constante et vaut $6{,}0\ \text{J}$, et que $E_c = 0$ au sommet,
      $E_{pp} = 6{,}0\ \text{J}$ en ce point. $E_c$ et $E_m$ ne coïncident
      qu'au hasard des instants, jamais par définition.

  - id: AE-4
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_energie
    tags: [energie_cinetique, energie_mecanique, energie_potentielle]
    stem: >
      Une bille de masse $m = 0{,}20\ \text{kg}$ part du repos au sommet
      d'une piste sans frottement. Son énergie mécanique, constante tout
      au long du mouvement, vaut $E_m = 4{,}9\ \text{J}$ (référence
      d'altitude au point le plus bas de la piste, $z = 0$). On prend
      $g \approx 9{,}8\ \text{m/s}^2$. Quelle est la vitesse de la bille
      quand elle atteint l'altitude $z = 1{,}0\ \text{m}$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\approx 5{,}4\\ \\text{m/s}$"
        correct: true
      - id: B
        text: "$7{,}0\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_energie.confond-ec-et-em
        feedback: >
          Ce résultat vient de $v = \sqrt{2 E_m / m}$, en confondant
          $E_c$ avec $E_m$ tout entière. Il faut d'abord soustraire
          l'énergie potentielle $E_{pp} = mgz$ à cette altitude : la bonne
          relation est $E_c = E_m - E_{pp}$, pas $E_c = E_m$.
      - id: C
        text: "$\\approx 2{,}4\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-masse
        feedback: >
          Ce résultat oublie de diviser par la masse dans
          $E_c = \frac12 m v^2$ : il correspond à $v = \sqrt{2 E_c}$ au
          lieu de $v = \sqrt{2 E_c / m}$. La masse doit apparaître au
          dénominateur sous la racine.
      - id: D
        text: "$\\approx 6{,}9\\ \\text{m/s}$"
        correct: false
        misconception: mc.physics.pc_energie.energie-oublie-g
        feedback: >
          Ce résultat vient d'un calcul de $E_{pp}$ sans le facteur $g$
          (soit $E_{pp} = mz$ au lieu de $E_{pp} = mgz$). L'énergie
          potentielle de pesanteur contient bien $g$ : oublier ce facteur
          fausse la valeur de $E_{pp}$ soustraite à $E_m$.
    correct_feedback: >
      $E_{pp} = mgz = 0{,}20 \times 9{,}8 \times 1{,}0 \approx 1{,}96\ \text{J}$,
      donc $E_c = E_m - E_{pp} \approx 2{,}94\ \text{J}$, et
      $v = \sqrt{2 E_c / m} \approx 5{,}4\ \text{m/s}$.
    solution: |
      **Énergie potentielle à $z = 1{,}0\ \text{m}$ :**
      $$E_{pp} = mgz = 0{,}20 \times 9{,}8 \times 1{,}0 \approx 1{,}96\ \text{J}$$

      **Énergie cinétique à cette altitude** (par $E_m = E_c + E_{pp}$,
      $E_m$ constante car pas de frottement) :
      $$E_c = E_m - E_{pp} \approx 4{,}9 - 1{,}96 \approx 2{,}94\ \text{J}$$

      **Vitesse :**
      $$v = \sqrt{\frac{2 E_c}{m}} = \sqrt{\frac{2 \times 2{,}94}{0{,}20}} \approx 5{,}4\ \text{m/s}$$

      $E_c$ n'est jamais directement égale à $E_m$ dès que l'altitude n'est
      pas nulle : il faut toujours soustraire $E_{pp}$ au préalable.

  - id: AE-6
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_energie
    tags: [energie_mecanique, frottement]
    stem: >
      Un solide de masse $m = 0{,}50\ \text{kg}$ descend une piste avec
      frottement. Entre le point $A$ (départ) et le point $B$, son
      altitude diminue de $\Delta z = 1{,}2\ \text{m}$, et le travail des
      frottements entre $A$ et $B$ vaut $W(\vec f) = -1{,}0\ \text{J}$. On
      prend $g \approx 9{,}8\ \text{m/s}^2$. Quelle est la variation
      d'énergie mécanique $\Delta E_m = E_{m,B} - E_{m,A}$ entre $A$ et
      $B$ ?
    type: mcq
    choices:
      - id: A
        text: "$\\Delta E_m = -1{,}0\\ \\text{J}$"
        correct: true
      - id: B
        text: "$\\Delta E_m = 0\\ \\text{J}$, car l'énergie mécanique se conserve toujours"
        correct: false
        misconception: mc.physics.pc_energie.em-conservee-malgre-frottement
        feedback: >
          L'énergie mécanique ne se conserve QUE en l'absence de
          frottement. Ici, un frottement agit et dissipe de l'énergie : sa
          contribution ne doit pas être oubliée dans le bilan.
          $\Delta E_m$ est exactement égale au travail du frottement, pas à
          zéro.
      - id: C
        text: "$\\Delta E_m \\approx 4{,}9\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.confond-ec-et-em
        feedback: >
          Ce résultat correspond en réalité à $\Delta E_c$ (la variation
          d'énergie cinétique, obtenue en ajoutant le travail du poids et
          celui du frottement), pas à $\Delta E_m$. La variation de
          l'énergie MÉCANIQUE est plus simple : elle est égale au seul
          travail du frottement, puisque le travail du poids est déjà
          "absorbé" dans la variation de $E_{pp}$.
      - id: D
        text: "$\\Delta E_m = +1{,}0\\ \\text{J}$"
        correct: false
        misconception: mc.physics.pc_energie.signe-travail-poids
        feedback: >
          Le travail du frottement est toujours résistant (négatif) : il
          ne peut jamais AUGMENTER l'énergie mécanique. Le signe correct
          est celui de $W(\vec f)$ lui-même, soit $-1{,}0\ \text{J}$, pas
          $+1{,}0\ \text{J}$.
    correct_feedback: >
      $\Delta E_m = W(\vec f) = -1{,}0\ \text{J}$ : la variation de
      l'énergie mécanique est exactement égale au travail du frottement,
      quelle que soit la dénivelée — le travail du poids est déjà pris en
      compte dans la variation de $E_{pp}$, il ne réapparaît pas dans
      $\Delta E_m$.
    solution: |
      **Le résultat général établi au chapitre 5 :** quand les forces qui
      s'exercent sont le poids, une réaction qui ne travaille pas, et un
      frottement, le TEC donne $\Delta E_c = -\Delta E_{pp} + W(\vec f)$,
      donc :
      $$\Delta E_m = \Delta E_c + \Delta E_{pp} = W(\vec f)$$

      **Application ici :**
      $$\Delta E_m = W(\vec f) = -1{,}0\ \text{J}$$

      Le travail du poids ($mg\Delta z \approx 5{,}88\ \text{J}$) n'entre
      PAS dans ce calcul : il est déjà comptabilisé dans la variation de
      $E_{pp}$, qui fait partie de $E_m$. Ce qui reste dans $\Delta E_m$,
      c'est uniquement l'effet des forces qui ne sont ni le poids ni une
      réaction perpendiculaire au mouvement — ici, le frottement.

  - id: AE-7
    rung: "R0"
    difficulty_level: 1
    skill_code: pc_energie
    tags: [intuition, chemin]
    stem: >
      Deux billes identiques, de même masse, sont lâchées sans vitesse
      initiale depuis la même hauteur $h$ au-dessus du sol. La première
      tombe en chute libre verticale. La seconde descend un toboggan
      incurvé, partant du même point de départ et arrivant au même niveau,
      mais par un chemin beaucoup plus long et sinueux. On néglige les
      frottements dans les deux cas. Laquelle des deux billes arrive au sol
      avec la plus grande vitesse ?
    type: mcq
    choices:
      - id: A
        text: "Les deux billes arrivent avec exactement la même vitesse."
        correct: true
      - id: B
        text: >-
          La bille en chute libre arrive plus vite, car son trajet est plus
          direct.
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Un chemin plus court ne donne pas une vitesse d'arrivée plus
          grande : le travail du poids, donc la vitesse finale, ne dépend
          que de la dénivelée $h$, identique pour les deux billes.
      - id: C
        text: >-
          La bille sur le toboggan arrive plus vite, car son trajet plus
          long lui donne plus de temps pour prendre de la vitesse.
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          Un chemin plus long ne donne pas non plus plus de vitesse : seule
          la dénivelée $h$ compte pour le travail du poids, jamais la
          longueur du trajet.
      - id: D
        text: "Impossible de savoir sans connaître la forme exacte du toboggan."
        correct: false
        misconception: mc.physics.pc_energie.travail-poids-depend-du-chemin
        feedback: >
          La forme du chemin n'intervient pas dans le résultat : la
          dénivelée commune et l'absence de frottement suffisent à conclure,
          sans connaître la géométrie précise du toboggan.
    correct_feedback: >
      Les deux billes partent et arrivent aux mêmes altitudes, sans
      frottement : leur vitesse finale ne dépend que de cette dénivelée
      commune, jamais de la forme ou de la longueur du chemin suivi.
    solution: |
      Sans frottement, seul le poids travaille, et son travail ne dépend
      que de la dénivelée $h$ (identique pour les deux billes), jamais du
      chemin suivi. Les deux billes ont donc exactement la même vitesse
      finale, malgré des trajets très différents.

  - id: AE-8
