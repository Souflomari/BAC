<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Deux chemins différents, un chemin direct incliné et un chemin sinueux, reliant les mêmes points A et B ; le travail du poids vaut mgh dans les deux cas, car il ne dépend que de la dénivelée h.">
  <title>Le travail du poids ne dépend pas du chemin suivi</title>
  <!--
    travail-poids-chemin.svg — figure STATIQUE, géométrie calculée (pas devinée).

    A = (150,100)  B = (520,270)  — points PARTAGÉS par les deux chemins.
    Chemin 1 (direct) : segment de droite A→B.
    Chemin 2 (sinueux) : polyligne calculée par
        x(t) = 150 + 370 t + 45 sin(2πt) · (-0.4176)
        y(t) = 100 + 170 t + 45 sin(2πt) · ( 0.9086)
      pour t = 0, 0.05, ..., 1.00 — c'est-à-dire la ligne directe A→B (paramétrée
      par t) plus un écart latéral perpendiculaire, d'amplitude 45px, qui
      s'annule exactement à t=0 et t=1 (donc la courbe coïncide avec A et B au
      pixel près) et s'annule aussi à t=0.5 (les deux chemins se croisent
      exactement au milieu du segment direct, en (335,185)).
      Vérifié : à t=1, x=520.0, y=270.0 = B, exactement.

    Cette construction garantit que les deux chemins partagent EXACTEMENT les
    mêmes altitudes de départ (z_A, y=100) et d'arrivée (z_B, y=270), tout en
    ayant une longueur et une forme visuellement très différentes — exactement
    le point du rung R3 : W(P) ne dépend que de z_A - z_B, jamais du chemin.

    Rôle des couleurs :
      chemin direct (droite)      : --figure-ink       (neutre, structurel)
      chemin sinueux (toboggan)   : --figure-ink-soft   (neutre, plus clair)
      vecteurs poids P, bracket h, ligne de niveau, formule : --figure-accent
        (le seul accent — réservé à ce qui compte : la verticale et le résultat)
      repères d'altitude z_A / z_B, axes            : --figure-ink-soft
  -->

  <!-- Titre -->
  <text x="320" y="22" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Le travail du poids ne dépend pas du chemin suivi
  </text>

  <!-- Fond du panneau -->
  <rect x="48" y="40" width="548" height="296" rx="8"
        fill="var(--figure-surface)"
        stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ── Formule (boîte teintée, en haut du panneau) ─────────── -->
  <rect x="170" y="46" width="300" height="40" rx="6"
        fill="var(--figure-accent)" fill-opacity="0.12"/>
  <text x="320" y="64" text-anchor="middle" font-size="13" font-style="italic"
        fill="var(--figure-accent)">W<tspan
        dy="4" font-size="9">A→B</tspan><tspan
        dy="-4"> (P) = mgh</tspan>
  </text>
  <text x="320" y="80" text-anchor="middle" font-size="9.5"
        fill="var(--figure-accent)">— même valeur, quel que soit le chemin suivi</text>

  <!-- ── Repères d'altitude z_A et z_B ────────────────────────── -->
  <line x1="90" y1="100" x2="185" y2="100"
        stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="90" y1="96" x2="90" y2="104" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="84" y="104" text-anchor="end" font-size="10"
        fill="var(--figure-ink-soft)">z<tspan dy="3" font-size="7">A</tspan></text>

  <line x1="90" y1="270" x2="545" y2="270"
        stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="90" y1="266" x2="90" y2="274" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
  <text x="84" y="274" text-anchor="end" font-size="10"
        fill="var(--figure-ink-soft)">z<tspan dy="3" font-size="7">B</tspan></text>

  <!-- ── Bracket de hauteur h (partagé par les deux chemins) ──── -->
  <line x1="108" y1="100" x2="108" y2="270"
        stroke="var(--figure-accent)" stroke-width="1.8"/>
  <line x1="103" y1="100" x2="113" y2="100" stroke="var(--figure-accent)" stroke-width="1.8"/>
  <line x1="103" y1="270" x2="113" y2="270" stroke="var(--figure-accent)" stroke-width="1.8"/>
  <text x="120" y="188" font-size="12" font-style="italic"
        fill="var(--figure-accent)">h</text>

  <!-- ── Chemin 2 — sinueux (« toboggan ») — tracé AVANT le chemin
       direct pour que le point de croisement (335,185) reste lisible ── -->
  <path d="
    M150.0,100.0
    L162.7,121.1 L176.0,141.0 L190.3,158.6 L206.1,172.9 L223.7,183.4
    L243.1,189.9 L264.3,192.6 L287.0,192.1 L310.7,189.1 L335.0,185.0
    L359.3,180.9 L383.0,178.0 L405.7,177.4 L426.9,180.1 L446.3,186.6
    L463.9,197.1 L479.7,211.4 L494.1,229.0 L507.3,248.9 L520.0,270.0
  " fill="none" stroke="var(--figure-ink-soft)" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Chemin 1 — direct (incliné) ───────────────────────────── -->
  <line x1="150" y1="100" x2="520" y2="270"
        stroke="var(--figure-ink)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ── Points A et B (partagés par les deux chemins) ─────────── -->
  <circle cx="150" cy="100" r="3.5" fill="var(--figure-ink)"/>
  <text x="150" y="90" text-anchor="middle" font-size="12"
        fill="var(--figure-ink)">A</text>
  <circle cx="520" cy="270" r="3.5" fill="var(--figure-ink)"/>
  <text x="520" y="286" text-anchor="middle" font-size="12"
        fill="var(--figure-ink)">B</text>

  <!-- ── Vecteurs poids P — un par chemin, toujours verticaux ──── -->
  <line x1="224" y1="134" x2="224" y2="160"
        stroke="var(--figure-accent)" stroke-width="2"/>
  <polygon points="224,166 217.5,154 230.5,154" fill="var(--figure-accent)"/>
  <text x="233" y="150" font-size="12" font-style="italic"
        fill="var(--figure-accent)">P</text>

  <line x1="479.7" y1="211.4" x2="479.7" y2="233"
        stroke="var(--figure-accent)" stroke-width="2"/>
  <polygon points="479.7,239.4 473.2,228 486.2,228" fill="var(--figure-accent)"/>
  <text x="489" y="225" font-size="12" font-style="italic"
        fill="var(--figure-accent)">P</text>

  <!-- ── Étiquettes des chemins (repère + fil discret, coins libres) ── -->
  <circle cx="501.5" cy="261.5" r="2.5" fill="var(--figure-ink)"/>
  <line x1="504" y1="264" x2="548" y2="303"
        stroke="var(--figure-ink-soft)" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="554" y="301" font-size="11" font-weight="600"
        fill="var(--figure-ink)">chemin direct</text>
  <text x="554" y="313" font-size="9.5"
        fill="var(--figure-ink-soft)">(incliné)</text>

  <circle cx="162.7" cy="121.1" r="2.5" fill="var(--figure-ink-soft)"/>
  <line x1="159" y1="117" x2="103" y2="72"
        stroke="var(--figure-ink-soft)" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="58" y="63" font-size="11" font-weight="600"
        fill="var(--figure-ink-soft)">chemin sinueux</text>
  <text x="58" y="75" font-size="9.5"
        fill="var(--figure-ink-soft)">(« toboggan »)</text>

  <!-- ── Captions ──────────────────────────────────────────────── -->
  <text x="320" y="358" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">Deux chemins très différents — l'un direct, l'autre sinueux — relient les mêmes points <tspan font-style="italic">A</tspan> et <tspan font-style="italic">B</tspan>.</text>
  <text x="320" y="376" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">Le poids ne « voit » que la dénivelée h = z<tspan dy="3" font-size="7.5">A</tspan><tspan dy="-3"> − z</tspan><tspan dy="3" font-size="7.5">B</tspan><tspan dy="-3"> : le travail du poids est donc identique sur les deux chemins.</tspan></text>

</svg>
