<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 826" width="640" height="826"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Conservation de l'énergie mécanique : en haut, sans frottement, quatre positions sur une trajectoire montrent Ec qui augmente et Epp qui diminue de la même quantité, la somme Em restant constante à 6,0 joules. En bas, avec frottement, la même somme Em diminue progressivement de position en position.">
  <title>Conservation (et dissipation) de l'énergie mécanique</title>
  <!--
    conservation-em.svg — figure STATIQUE, deux panneaux empilés, aucun step-group
    (rendu figé, pas de révélation progressive — c'est le rôle du motion-author).

    Panneau A (sans frottement) : 4 positions sur une trajectoire descendante ;
    sous chaque position, une barre empilée [Ec (bas) + Epp (haut)] de hauteur
    TOTALE CONSTANTE (120px = 6,0 J, échelle 20px/J). Valeurs choisies pour
    coïncider avec l'exemple chiffré du rung R4 ("Teste-le sur un exemple
    concret" : Em = 6,0 J, sommet Ec=0/Epp=6,0 J, un point où Epp=2,0 J/Ec=4,0 J) :
      position 1 : Epp=6,0 J (120px) · Ec=0
      position 2 : Epp=4,0 J (80px)  · Ec=2,0 J (40px)
      position 3 : Epp=2,0 J (40px)  · Ec=4,0 J (80px)   [le point du rung R4]
      position 4 : Epp=0             · Ec=6,0 J (120px)
    Sommes = 6,0 J partout → les 4 barres ont EXACTEMENT la même hauteur totale ;
    une ligne pointillée horizontale à y=206 le rend visible directement (pas
    besoin de calcul pour vérifier — c'est le point de la figure).

    Panneau B (avec frottement) : mêmes 4 positions, mais Em décroît à chaque
    position (perte = travail du frottement, qualitatif, aucune loi de
    décroissance explicite — R4 ne donne pas de formule fermée pour ce cas) :
      position 1 : Em=6,0 J   (Epp=6,0/Ec=0)      — identique au panneau A :
                    au tout début, le frottement n'a encore rien dissipé.
      position 2 : Em=5,6 J   (Epp=4,0/Ec=1,6)
      position 3 : Em=4,8 J   (Epp=2,0/Ec=2,8)
      position 4 : Em=3,6 J   (Epp=0  /Ec=3,6)
    Les sommets des 4 barres sont reliés par une ligne pointillée qui DESCEND
    (au lieu d'être plate) — la même construction visuelle que le panneau A,
    seule la pente change, pour rendre la comparaison immédiate.

    Géométrie des barres (identique dans les deux panneaux, décalée verticalement) :
      4 centres en x : 150, 290, 430, 570 · largeur de barre : 56px (± 28)
      Panneau A : baseline (E=0) à y=326 ; sommet max (Em=6,0J) à y=206
      Panneau B : baseline (E=0) à y=672 ; sommets variables (552,560,576,600)
      (décalage vertical constant de 346px entre les deux panneaux)

    Couleurs (tokens obligatoires, aucune valeur ad-hoc) :
      Ec (cinétique)             : --figure-energy-L (teal-green)
      Epp (potentielle)          : --figure-energy-C (slate-blue)
      Em (somme, ligne/label)    : --figure-accent   (le seul accent — la
                                    grandeur conservée, donc "ce qui compte")
      trajectoire / repères / texte : --figure-ink, --figure-ink-soft
  -->

  <!-- Titre général -->
  <text x="320" y="24" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Conservation de l'énergie mécanique le long d'une trajectoire
  </text>

  <!-- ══════════════════════════════════════════════════════════
       PANNEAU A — sans frottement, Em constante
       ══════════════════════════════════════════════════════════ -->
  <g id="panel-a">
    <rect x="40" y="40" width="560" height="330" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <text x="60" y="60" font-size="12" font-weight="600"
          fill="var(--figure-ink)">Sans frottement — E<tspan
          dy="3" font-size="8">m</tspan><tspan dy="-3"> constante</tspan>
    </text>

    <!-- Mini-trajectoire descendante, 4 positions repères -->
    <path d="M150,78 L290,96 L430,116 L570,140" fill="none"
          stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="78"  r="5" fill="var(--figure-ink)"/>
    <circle cx="290" cy="96"  r="5" fill="var(--figure-ink)"/>
    <circle cx="430" cy="116" r="5" fill="var(--figure-ink)"/>
    <circle cx="570" cy="140" r="5" fill="var(--figure-ink)"/>
    <text x="150" y="66"  text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">1</text>
    <text x="290" y="84"  text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">2</text>
    <text x="430" y="104" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">3</text>
    <text x="570" y="128" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">4</text>

    <!-- Ligne Em constante -->
    <line x1="110" y1="206" x2="598" y2="206"
          stroke="var(--figure-accent)" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="360" y="196" text-anchor="middle" font-size="11"
          fill="var(--figure-accent)">E<tspan dy="3" font-size="8">m</tspan><tspan
          dy="-3"> = 6,0 J (constante)</tspan>
    </text>

    <!-- Baseline E = 0 -->
    <line x1="110" y1="326" x2="598" y2="326"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="104" y="330" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <text x="100" y="210" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">E (J)</text>

    <!-- Barres empilées : Ec (bas, energy-L) + Epp (haut, energy-C) -->
    <!-- position 1 : Ec=0, Epp=6,0 J -->
    <rect x="122" y="206" width="56" height="120" fill="var(--figure-energy-C)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <!-- position 2 : Ec=2,0 J, Epp=4,0 J -->
    <rect x="262" y="286" width="56" height="40" fill="var(--figure-energy-L)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <rect x="262" y="206" width="56" height="80" fill="var(--figure-energy-C)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <!-- position 3 : Ec=4,0 J, Epp=2,0 J (le point du rung R4) -->
    <rect x="402" y="246" width="56" height="80" fill="var(--figure-energy-L)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <rect x="402" y="206" width="56" height="40" fill="var(--figure-energy-C)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <!-- position 4 : Ec=6,0 J, Epp=0 -->
    <rect x="542" y="206" width="56" height="120" fill="var(--figure-energy-L)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Valeurs, sous chaque barre -->
    <text x="150" y="344" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 6,0 J · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 0</tspan>
    </text>
    <text x="290" y="344" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 4,0 J · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 2,0 J</tspan>
    </text>
    <text x="430" y="344" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 2,0 J · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 4,0 J</tspan>
    </text>
    <text x="570" y="344" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 0 · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 6,0 J</tspan>
    </text>
  </g><!-- /panel-a -->

  <!-- ══════════════════════════════════════════════════════════
       PANNEAU B — avec frottement, Em diminue
       ══════════════════════════════════════════════════════════ -->
  <g id="panel-b">
    <rect x="40" y="386" width="560" height="330" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <text x="60" y="406" font-size="12" font-weight="600"
          fill="var(--figure-ink)">Avec frottement — E<tspan
          dy="3" font-size="8">m</tspan><tspan dy="-3"> diminue</tspan>
    </text>

    <!-- Mini-trajectoire descendante, mêmes 4 positions -->
    <path d="M150,424 L290,442 L430,462 L570,486" fill="none"
          stroke="var(--figure-ink-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="424" r="5" fill="var(--figure-ink)"/>
    <circle cx="290" cy="442" r="5" fill="var(--figure-ink)"/>
    <circle cx="430" cy="462" r="5" fill="var(--figure-ink)"/>
    <circle cx="570" cy="486" r="5" fill="var(--figure-ink)"/>
    <text x="150" y="412" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">1</text>
    <text x="290" y="430" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">2</text>
    <text x="430" y="450" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">3</text>
    <text x="570" y="474" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">4</text>

    <!-- Ligne Em décroissante (relie les sommets des 4 barres) -->
    <path d="M150,552 L290,560 L430,576 L570,600" fill="none"
          stroke="var(--figure-accent)" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="400" y="540" text-anchor="middle" font-size="11"
          fill="var(--figure-accent)">E<tspan dy="3" font-size="8">m</tspan><tspan
          dy="-3"> diminue (frottement)</tspan>
    </text>

    <!-- Baseline E = 0 -->
    <line x1="110" y1="672" x2="598" y2="672"
          stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="104" y="676" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <text x="100" y="556" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-ink-soft)">E (J)</text>

    <!-- Barres empilées -->
    <!-- position 1 : Ec=0, Epp=6,0 J (identique au panneau A : rien n'est encore dissipé) -->
    <rect x="122" y="552" width="56" height="120" fill="var(--figure-energy-C)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <!-- position 2 : Ec=1,6 J, Epp=4,0 J, Em=5,6 J -->
    <rect x="262" y="640" width="56" height="32" fill="var(--figure-energy-L)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <rect x="262" y="560" width="56" height="80" fill="var(--figure-energy-C)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <!-- position 3 : Ec=2,8 J, Epp=2,0 J, Em=4,8 J -->
    <rect x="402" y="616" width="56" height="56" fill="var(--figure-energy-L)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <rect x="402" y="576" width="56" height="40" fill="var(--figure-energy-C)"
          stroke="var(--figure-grid)" stroke-width="1"/>
    <!-- position 4 : Ec=3,6 J, Epp=0, Em=3,6 J -->
    <rect x="542" y="600" width="56" height="72" fill="var(--figure-energy-L)"
          stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Valeurs, sous chaque barre -->
    <text x="150" y="690" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 6,0 J · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 0</tspan>
    </text>
    <text x="290" y="690" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 4,0 J · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 1,6 J</tspan>
    </text>
    <text x="430" y="690" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 2,0 J · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 2,8 J</tspan>
    </text>
    <text x="570" y="690" text-anchor="middle" font-size="9.5" fill="var(--figure-ink-soft)">E<tspan
      dy="3" font-size="7">pp</tspan><tspan dy="-3"> = 0 · E</tspan><tspan
      dy="3" font-size="7">c</tspan><tspan dy="-3"> = 3,6 J</tspan>
    </text>
  </g><!-- /panel-b -->

  <!-- ── Légende ───────────────────────────────────────────────── -->
  <g id="legend">
    <rect x="60" y="736" width="26" height="14" fill="var(--figure-energy-L)"/>
    <text x="92" y="747" font-size="10.5" fill="var(--figure-ink)">E<tspan
      dy="3" font-size="7.5">c</tspan><tspan dy="-3"> — énergie cinétique</tspan>
    </text>

    <rect x="300" y="736" width="26" height="14" fill="var(--figure-energy-C)"/>
    <text x="332" y="747" font-size="10.5" fill="var(--figure-ink)">E<tspan
      dy="3" font-size="7.5">pp</tspan><tspan dy="-3"> — énergie potentielle de pesanteur</tspan>
    </text>

    <line x1="60" y1="768" x2="86" y2="768" stroke="var(--figure-accent)" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="92" y="772" font-size="10.5" fill="var(--figure-ink)">E<tspan
      dy="3" font-size="7.5">m</tspan><tspan dy="-3"> = E</tspan><tspan
      dy="3" font-size="7.5">c</tspan><tspan dy="-3"> + E</tspan><tspan
      dy="3" font-size="7.5">pp</tspan><tspan dy="-3"> — énergie mécanique</tspan>
    </text>
  </g>

  <!-- ── Captions ──────────────────────────────────────────────── -->
  <text x="320" y="794" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">En haut, sans frottement : E<tspan
        dy="3" font-size="7.5">m</tspan><tspan dy="-3"> reste constante — E</tspan><tspan
        dy="3" font-size="7.5">c</tspan><tspan dy="-3"> augmente exactement ce qu'E</tspan><tspan
        dy="3" font-size="7.5">pp</tspan><tspan dy="-3"> perd, à chaque position.</tspan>
  </text>
  <text x="320" y="810" text-anchor="middle" font-size="10.5"
        fill="var(--figure-ink-soft)">En bas, avec frottement : E<tspan
        dy="3" font-size="7.5">m</tspan><tspan dy="-3"> diminue peu à peu — la perte est exactement le travail (négatif) du frottement.</tspan>
  </text>

</svg>
