<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le travail de la force de rappel du ressort : la droite F égale k x, partant de l'origine ; l'aire du triangle sous cette droite, égale à un demi k x carré, mise en évidence ; la force moyenne, un demi k x, marquée par un repère horizontal ; et, en pointillé estompé, le rectangle k x carré que donnerait à tort le calcul force fois distance en traitant k x comme la force de tout le trajet — deux fois trop grand.">
  <title>Le travail de la force de rappel : l'aire du triangle, W = ½kx²</title>
  <!--
    travail-ressort-triangle.svg — figure STAGED (LESSON-EXPERIENCE-SPEC
    §2.5 : un graphe est TOUJOURS stagé, ordre canonique axes → données →
    lecture), 3 étapes, cœur du rung R5 (le mécanisme du ½).

    Repère (calculé, pas deviné) :
      origine O (x=0, F=0)   : (90, 360)
      point final (x, kx)    : (470, 110)
      base (= x, en px)      : 470 − 90 = 380
      hauteur (= kx, en px)  : 360 − 110 = 250
    La droite F(x) = kx est donc le simple segment O → (470,110).

    Aire du triangle O-(470,360)-(470,110) = ½ × base × hauteur
      = ½ × 380 × 250 = 47 500 px² = W = ½kx² (step-3).
    Rectangle fantôme (M-EPE-1, "F traitée comme constante") : même base et
    même hauteur, base × hauteur = 380 × 250 = 95 000 px² — EXACTEMENT le
    double de l'aire du triangle, la propriété même que la figure démontre
    (l'erreur donne un travail deux fois trop grand).
    Droite de la force moyenne ½kx : hauteur moitié de kx, donc à
      y = (360 + 110) / 2 = 235 — un rectangle de cette hauteur (235 à 360)
      et de même base a pour aire 380 × 125 = 47 500 px², IDENTIQUE à l'aire
      du triangle : c'est la preuve géométrique que « force moyenne ×
      distance » redonne exactement l'aire du triangle.

    Rôle des couleurs :
      droite F(x)=kx, ses repères (x, kx)      : --figure-energy-C (le
        réservoir élastique — même convention que energie-oscillateur.svg
        et conservation-em.svg pour la grandeur de rappel/potentielle)
      aire du triangle, repère de force moyenne,
        étiquette W = ½kx²                     : --figure-accent (la
        lecture — le mécanisme du ½, seul sujet de cette figure)
      rectangle fantôme kx² (faux)              : --figure-ink-soft,
        pointillé — même traitement que la « droite fantôme » de
        ec-parabole.svg pour une fausse intuition
      axes, chrome                              : --figure-ink-soft
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Le travail de la force de rappel — l'aire du triangle sous F(x) = kx
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes (repère vide)
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <rect x="20" y="32" width="600" height="350" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <line x1="90" y1="360" x2="605" y2="360"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="615,360 603,355.5 603,364.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="360" x2="90" y2="60"
          stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,50 85.5,61 94.5,61" fill="var(--figure-ink-soft)"/>

    <text x="78" y="64" text-anchor="end" font-size="12" font-style="italic"
          fill="var(--figure-ink-soft)">F</text>
    <text x="598" y="344" text-anchor="end" font-size="11"
          fill="var(--figure-ink-soft)"><tspan font-style="italic">x</tspan><tspan> (allongement)</tspan></text>
    <text x="78" y="364" text-anchor="end" font-size="10"
          fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les données : la droite F(x) = kx
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="470" y1="110" x2="470" y2="360"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="90" y1="110" x2="470" y2="110"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="3,2"/>

    <line x1="90" y1="360" x2="470" y2="110"
          stroke="var(--figure-energy-C)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="470" cy="110" r="3.5" fill="var(--figure-energy-C)"/>

    <line x1="470" y1="356" x2="470" y2="364" stroke="var(--figure-energy-C)" stroke-width="1.4"/>
    <text x="470" y="378" text-anchor="middle" font-size="11" font-style="italic"
          fill="var(--figure-energy-C)">x</text>

    <line x1="86" y1="110" x2="94" y2="110" stroke="var(--figure-energy-C)" stroke-width="1.4"/>
    <text x="80" y="114" text-anchor="end" font-size="11" font-style="italic"
          fill="var(--figure-energy-C)">kx</text>

    <!-- DESCENDUE SOUS LA DIAGONALE (2026-09-04) : à y=145 elle était couchée
         sur la droite qu'elle nomme (qui passe de y≈159 à y≈113 sur sa
         longueur) et s'en trouvait rayée sur un tiers de sa largeur. Le
         dessous de la droite, près de son sommet, est la seule bande où la
         pente ne la rattrape pas : plus à gauche, la droite redescend et
         repasserait dessus. -->
    <text x="395" y="175" font-size="12.5" fill="var(--figure-energy-C)"><tspan
          font-style="italic">F</tspan><tspan font-style="normal">(</tspan><tspan
          font-style="italic">x</tspan><tspan font-style="normal">) = </tspan><tspan
          font-style="italic">kx</tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : le triangle, la force moyenne, le
       rectangle fantôme (faux)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path d="M90,360 L470,360 L470,110 Z"
          fill="var(--figure-accent)" fill-opacity="0.18"
          stroke="var(--figure-accent)" stroke-width="1.3" stroke-linejoin="round"/>

    <text x="335" y="300" text-anchor="middle" font-size="14" font-weight="600"
          fill="var(--figure-accent)"><tspan font-style="italic">W</tspan><tspan
          font-style="normal"> = ½</tspan><tspan font-style="italic">kx</tspan><tspan
          dy="-5" font-size="10" font-style="normal">2</tspan></text>

    <!-- Force moyenne ½kx — hauteur moitié -->
    <line x1="90" y1="235" x2="470" y2="235"
          stroke="var(--figure-accent)" stroke-width="1.6" stroke-dasharray="6,4"/>
    <line x1="90" y1="231" x2="90" y2="239" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <line x1="470" y1="231" x2="470" y2="239" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <line x1="86" y1="235" x2="94" y2="235" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="80" y="239" text-anchor="end" font-size="10.5" fill="var(--figure-accent)"
      >½<tspan font-style="italic">kx</tspan></text>
    <text x="480" y="231" font-size="11.5" fill="var(--figure-accent)"><tspan
          font-style="italic">F</tspan><tspan dy="3" font-size="8">moy</tspan><tspan
          dy="-3" font-style="normal"> = ½</tspan><tspan font-style="italic">kx</tspan></text>

    <!-- Rectangle fantôme kx² (faux — M-EPE-1) -->
    <rect x="90" y="110" width="380" height="250"
          fill="var(--figure-ink-soft)" fill-opacity="0.05"
          stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="100" y="130" font-size="10.5" fill="var(--figure-ink-soft)"><tspan
          font-style="italic">kx</tspan><tspan dy="-5" font-size="8" font-style="normal">2</tspan><tspan
          dy="5" font-style="normal"> (faux)</tspan></text>
    <text x="100" y="145" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)"
      >— force supposée constante</text>
  </g><!-- /step-3 -->

</svg>
