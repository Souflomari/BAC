<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Le signe du travail d'une force selon l'angle entre la force et le déplacement AB : en haut, une force F à angle aigu θ, dont la composante F cos θ le long de AB est positive (force motrice) ; en bas à gauche, une réaction normale N perpendiculaire à un déplacement horizontal, dont le travail est nul ; en bas à droite, une force F à angle obtus, dont la composante le long de AB est négative (force résistante, comme un frottement).">
  <title>Le signe du travail — motrice, nulle, résistante</title>
  <!--
    travail-force-signe.svg — figure STAGED (LESSON-EXPERIENCE-SPEC.md §2.5 :
    schéma, staged si ≥3 couches sémantiques ET geste d'enseignement — ici
    un geste en 4 temps : établir l'outil (composante), puis diagnostiquer
    les 3 cas), 4 étapes, cœur du rung R2.

    Trois mini-scènes, chacune un solide se déplaçant de A vers B
    (horizontal), avec une force appliquée en A à un angle θ différent.
    Même longueur de vecteur (140 px) dans les 3 scènes, pour que seul
    l'ANGLE change — la comparaison visuelle porte uniquement sur le signe.

    Panneau du haut (motrice) — A=(130,200) :
      θ = 36,87° (triangle 3-4-5 : cos θ=0,8, sin θ=0,6 — angle aigu net)
      F, longueur 140 : bout = A + 140·(0,8;−0,6) = (242,116)
      Composante F·cos θ le long de AB : 140×0,8 = 112 px, du même côté que B
        (pied de la perpendiculaire = A + (112,0) = (242,200), même abscisse
        que le bout de F puisque AB est horizontal).
      Étapes 1-2 : step-1 dessine la géométrie (neutre, ink/ink-soft) ;
      step-2 AJOUTE seulement le verdict encadré (accent) — la composante
      elle-même ne bouge pas, seule son INTERPRÉTATION apparaît.

    Panneau bas-gauche (nulle) — A=(70,460) :
      θ = 90° exactement. N, longueur 120, vertical vers le haut :
      bout = (70,340). Composante le long de AB : 120×cos90° = 0.
      Reprend le cas déjà nommé au texte (R2) : la réaction normale sur un
      déplacement horizontal — celle-là même qui ne travaille jamais.
      Step-3 dessine TOUT (géométrie + verdict) en un seul temps : rien à
      établir puis réinterpréter, contrairement au panneau du haut.

    Panneau bas-droite (résistante) — A=(500,460) :
      θ = 143,13° (supplémentaire de 36,87° — même triangle 3-4-5, F
      "penche" du côté opposé) : cos θ=−0,8, sin θ=0,6.
      F, longueur 140 : bout = A + 140·(−0,8;−0,6) = (388,376).
      Composante F·cos θ : 140×(−0,8) = −112 px — le pied de la
      perpendiculaire tombe à GAUCHE de A (388,460), à l'opposé de B.
      Step-4 dessine TOUT en un temps (comme le panneau nulle).

    Arcs d'angle : Bézier quadratique, même famille de construction que
    plan-incline-forces.svg (contrôle sur la bissectrice), mais avec une
    distance de contrôle FIXE (34 px, r=26 px) plutôt que r/cos(demi-angle)
    — la formule exacte diverge pour l'angle obtus du panneau résistant
    (143°) ; une distance fixe donne un arc lisible dans les 3 cas, au prix
    de ne plus toucher exactement le cercle de rayon r (purement décoratif,
    aucun calcul de la leçon n'en dépend).

    Rôle des couleurs :
      AB, F, N, arcs d'angle, points A/B      : --figure-ink (structure)
      bracket F·cos θ du panneau moteur (step-1, pas encore interprété),
      petit repère d'angle droit (panneau nul) : --figure-ink-soft
      boîtes/texte de verdict (motrice/nulle/résistante),
      bracket F·cos θ du panneau résistant (révélé avec son verdict) : --figure-accent
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Le signe du travail d'une force — motrice, nulle, résistante
  </text>

  <!-- ══════════════════════════════════════════════════════════
       STEP 1 — panneau du haut : la géométrie (AB, F, θ, F·cos θ)
       ══════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <rect x="20" y="36" width="600" height="230" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <!-- Déplacement AB -->
    <line x1="130" y1="200" x2="548" y2="200" stroke="var(--figure-ink)" stroke-width="2.2"/>
    <polygon points="560,200 548,195.5 548,204.5" fill="var(--figure-ink)"/>
    <circle cx="130" cy="200" r="3" fill="var(--figure-ink)"/>
    <text x="130" y="222" text-anchor="middle" font-size="13" fill="var(--figure-ink)">A</text>
    <text x="560" y="216" text-anchor="middle" font-size="13" fill="var(--figure-ink)">B</text>

    <!-- Force F, angle aigu θ = 36,87° -->
    <line x1="130" y1="200" x2="232.4" y2="123.2" stroke="var(--figure-ink)" stroke-width="2.3" stroke-linecap="round"/>
    <polygon points="242,116 235.4,127.2 229.4,119.2" fill="var(--figure-ink)"/>
    <text x="250" y="112" font-size="15" font-style="italic" fill="var(--figure-ink)">F</text>

    <!-- Arc de l'angle θ -->
    <path d="M156,200 Q162.3,189.3 150.8,184.4" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="168" y="188" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">θ</text>

    <!-- Composante F·cos θ le long de AB (établie, pas encore interprétée) -->
    <line x1="130" y1="214" x2="230" y2="214" stroke="var(--figure-ink-soft)" stroke-width="1.6"/>
    <polygon points="242,214 230,209.5 230,218.5" fill="var(--figure-ink-soft)"/>
    <line x1="130" y1="210" x2="130" y2="218" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <line x1="242" y1="192" x2="242" y2="200" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="186" y="232" text-anchor="middle" font-size="11.5" fill="var(--figure-ink-soft)">F<tspan
      font-style="italic" dy="3" font-size="8">·</tspan><tspan dy="-3">cos θ</tspan></text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 2 — panneau du haut : le verdict (motrice)
       ══════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <rect x="350" y="150" width="230" height="56" rx="8" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="465" y="171" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">cos θ &gt; 0  ⇒  W(F) &gt; 0</text>
    <text x="465" y="190" text-anchor="middle" font-size="11.5" font-style="italic" fill="var(--figure-accent)">force motrice</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 3 — panneau bas-gauche : nulle (N ⊥ AB)
       ══════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <rect x="20" y="286" width="290" height="220" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <line x1="70" y1="460" x2="268" y2="460" stroke="var(--figure-ink)" stroke-width="2.2"/>
    <polygon points="280,460 268,455.5 268,464.5" fill="var(--figure-ink)"/>
    <circle cx="70" cy="460" r="3" fill="var(--figure-ink)"/>
    <text x="70" y="482" text-anchor="middle" font-size="13" fill="var(--figure-ink)">A</text>
    <text x="280" y="476" text-anchor="middle" font-size="13" fill="var(--figure-ink)">B</text>

    <line x1="70" y1="460" x2="70" y2="352" stroke="var(--figure-ink)" stroke-width="2.3" stroke-linecap="round"/>
    <polygon points="70,340 65,352 75,352" fill="var(--figure-ink)"/>
    <text x="78" y="336" font-size="15" font-style="italic" fill="var(--figure-ink)">N</text>

    <!-- Arc de l'angle θ = 90° -->
    <path d="M96,460 Q94.0,436.0 70,434" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <text x="100" y="430" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">θ</text>

    <!-- Petit repère d'angle droit -->
    <path d="M80,460 L80,450 L70,450" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>

    <text x="220" y="360" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">θ = 90°  ⇒  cos θ = 0</text>
    <text x="220" y="378" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">W(N) = 0</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 4 — panneau bas-droite : résistante (θ obtus)
       ══════════════════════════════════════════════════════════ -->
  <g id="step-4">
    <rect x="330" y="286" width="290" height="220" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

    <line x1="500" y1="460" x2="588" y2="460" stroke="var(--figure-ink)" stroke-width="2.2"/>
    <polygon points="600,460 588,455.5 588,464.5" fill="var(--figure-ink)"/>
    <circle cx="500" cy="460" r="3" fill="var(--figure-ink)"/>
    <text x="500" y="482" text-anchor="middle" font-size="13" fill="var(--figure-ink)">A</text>
    <text x="600" y="476" text-anchor="middle" font-size="13" fill="var(--figure-ink)">B</text>

    <!-- Force F, angle obtus θ = 143,13° (F penche vers l'arrière) -->
    <line x1="500" y1="460" x2="397.6" y2="383.2" stroke="var(--figure-ink)" stroke-width="2.3" stroke-linecap="round"/>
    <polygon points="388,376 394.6,387.2 400.6,379.2" fill="var(--figure-ink)"/>
    <text x="378" y="366" text-anchor="end" font-size="15" font-style="italic" fill="var(--figure-ink)">F</text>

    <!-- Arc de l'angle θ -->
    <path d="M526,460 Q510.75,427.74 479.2,444.4" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.3"/>
    <!-- θ RENTRE dans son arc. Posé à (518;418) il tombait sur « force
         résistante » (recouvrement mesuré 71 %) et se lisait dans le mot. -->
    <text x="499" y="445" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink-soft)">θ</text>

    <!-- Composante F·cos θ : négative, pied à GAUCHE de A -->
    <line x1="500" y1="474" x2="400" y2="474" stroke="var(--figure-accent)" stroke-width="1.6"/>
    <polygon points="388,474 400,469.5 400,478.5" fill="var(--figure-accent)"/>
    <line x1="500" y1="470" x2="500" y2="478" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <line x1="388" y1="466" x2="388" y2="460" stroke="var(--figure-accent)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="444" y="492" text-anchor="middle" font-size="11.5" fill="var(--figure-accent)">F<tspan
      dy="3" font-size="8">·</tspan><tspan dy="-3">cos θ &lt; 0</tspan></text>

    <text x="560" y="380" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">θ obtus  ⇒  cos θ &lt; 0</text>
    <text x="560" y="398" text-anchor="middle" font-size="12.5" fill="var(--figure-accent)">W(F) &lt; 0</text>
    <text x="560" y="414" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-accent)">force résistante</text>
    <!-- La glose « (comme un frottement) » était calée à x=378 en ancrage
         end : elle courait donc de x≈275 à 378, alors que ce panneau
         commence à x=330. Elle débordait de son cadre, traversait la
         gouttière et entrait de 55 px dans le panneau voisin. Ni la sonde
         de chevauchement (elle ne compare que des textes) ni le test de
         débordement (il compare au viewBox, pas aux panneaux) ne pouvaient
         le voir. Elle glose maintenant « force résistante », juste dessous,
         ce qui est aussi sa place logique. -->
    <text x="560" y="430" text-anchor="middle" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">(comme un frottement)</text>
  </g><!-- /step-4 -->

</svg>
