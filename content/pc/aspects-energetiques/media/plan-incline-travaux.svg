<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Solide sur un plan incliné d'angle alpha, glissant d'une distance d le long du plan, révélé en cinq temps : le décor, puis la dénivelée cachée Δz = d fois sinus alpha, puis le travail du poids mg fois Δz qui est moteur, puis la réaction normale perpendiculaire au déplacement dont le travail est nul, puis le frottement de sens opposé dont le travail est négatif, moins f fois d.">
  <title>Plan incliné — un même déplacement d, trois travaux : moteur, nul, résistant</title>
  <!--
    plan-incline-travaux.svg — figure STAGED (LESSON-EXPERIENCE-SPEC.md §2.5),
    5 étapes, loi « UNE idée par étape ».

    RESTAGING (audit stage-depth, docket MAJEUR). L'ancienne version tenait en
    3 étapes, et sa troisième calculait TROIS travaux indépendants dans une
    seule légende — W(P) via la projection Δz, W(N) = 0, W(f) = −f·d — alors
    que le travail de CHAQUE force est sa propre idée, et que la projection
    de d sur la verticale est en plus un pas géométrique caché. Découpage :
      step-1 : le décor — plan, angle α, solide en G, déplacement d jusqu'à G'
      step-2 : le pas géométrique — d cache une dénivelée Δz = d·sin α
      step-3 : le poids — porté par cette verticale, W(P) = mg·Δz, moteur
      step-4 : la réaction normale — ⊥ au déplacement, cos 90° = 0, W(N) = 0
      step-5 : le frottement — de sens opposé, cos 180° = −1, W(f) = −f·d
    Chaque force arrive donc AVEC la lecture de son propre travail : la flèche
    et son travail sont un seul et même objet de pensée. Le bilan des forces
    n'est pas perdu — il se CONSTRUIT au fil des étapes 3 à 5, et la dernière
    image porte les trois flèches ensemble.

    Reprend l'exemple numérique du texte : m = 1,0 kg, α = 30°
    (sin α = 0,5, cos α ≈ 0,866), f = 2,0 N, d = 2,0 m le long du plan.
    Géométrie calculée, pas devinée :
      pente réelle α = 30° : run 480 px, rise = 480×tan30° ≈ 277,1 px
        (donc hypoténuse totale ≈ 554,25 px, sin α = rise/hyp = 0,500 ✓)
      sommet du plan (70,80) ; pied du plan, angle α marqué (550,357).

    Position de départ G (t=0,25 le long du plan, depuis le sommet) :
      G = (70+0,25×480 ; 80+0,25×277,1) = (190 ; 149,25)
    Position d'arrivée G' (t=0,70, après le déplacement d) :
      G' = (70+0,70×480 ; 80+0,70×277,1) = (406 ; 273,9)
    Déplacement d (Δt=0,45 le long de l'hypoténuse) :
      d = 0,45 × 554,25 ≈ 249,4 px ; direction unitaire (0,866 ; 0,5)
        vérif : Δx=406−190=216=249,4×0,866 ✓  Δy=273,9−149,25=124,65=249,4×0,5 ✓

    Projection de d sur la verticale (step-2, le pas caché) :
      pied de la perpendiculaire depuis G, à l'altitude de G' : F = (190 ; 273,9)
      jambe verticale G→F, longueur 124,65 px = d·sin α
        (vérif : 249,4×0,5 = 124,7 ✓ — c'est Δz, qui alimente W(P)=mg·d·sin α)
      jambe horizontale F→G', longueur 216 px = d·cos α
        (construction seulement, non étiquetée — la réaction N ne travaille
        pas, donc cette composante ne sert à aucun calcul du texte)
      angle droit marqué en F, du côté INTÉRIEUR du triangle (haut-droite) ;
      angle α re-marqué en G' entre la jambe horizontale et d — arc r=26 px,
      de θ=180° à θ=210° : (380 ; 273,9) → (383,48 ; 260,90). C'est LUI qui
      rend le sinus lisible : d est l'hypoténuse, Δz le côté opposé à α.

    Forces en G, échelle 8 px/N (m=1,0 kg, g=9,8 m/s² ⇒ P=9,8 N,
    N=mg cos α≈8,49 N ; SEULE f=2,0 N est exagérée ×3 pour rester lisible,
    échelle divulguée en pied de figure — même convention que
    plan-incline-forces.svg / bilan-forces-caisse-horizontale.svg) :
      P (vertical, bas), longueur 78 px  : bout = (190 ; 227,25)
      N (perpendiculaire au plan, direction (0,5;−0,866)), longueur 68 px :
        bout = (224 ; 90,36)
      f (le long du plan, vers le HAUT — direction (−0,866;−0,5)),
        longueur 48 px (exagérée ×3, réel 16 px) : bout = (148,4 ; 125,25)

    Superposition assumée : la flèche de P (step-3) court sur la verticale
    de Δz (step-2), qu'elle recouvre partiellement. C'est voulu et
    informatif — P est PORTÉ par cette dénivelée, ce qui est exactement la
    raison pour laquelle W(P) = mg·Δz. Δz est révélé seul à l'étape 2, donc
    lu en entier avant d'être chevauché.

    Rôle des couleurs :
      plan, base, bloc, G, d, angle α, flèches P/N/f  : --figure-ink
      jambe horizontale de construction (d·cos α)     : --figure-ink-soft
      Δz, et les trois lectures de travail            : --figure-accent
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Plan incliné — un même déplacement d, trois travaux différents
  </text>

  <!-- Fond du panneau -->
  <rect x="20" y="40" width="600" height="380" rx="8"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- Échelle divulguée -->
  <text x="320" y="445" text-anchor="middle" font-size="10.5" fill="var(--figure-ink-soft)"
    >Échelle des forces : 8 px ↔ 1 N (m = 1,0 kg, g ≈ 9,8 m/s<tspan dy="-4" font-size="70%">2</tspan><tspan
    dy="4">). Seule la norme de </tspan><tspan font-style="italic">f</tspan><tspan> (2,0 N) est exagérée ×3 pour rester lisible.</tspan></text>

  <!-- ══════════════════════════════════════════════════════════
       STEP 1 — le décor : le plan, l'angle α, le solide en G, le
       déplacement d jusqu'à G'
       ══════════════════════════════════════════════════════════ -->
  <g id="step-1">
    <path d="M70,80 L550,357 L70,357 Z" fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1.5"/>
    <line x1="70" y1="80" x2="550" y2="357" stroke="var(--figure-ink)" stroke-width="2.5"/>
    <line x1="70" y1="357" x2="550" y2="357" stroke="var(--figure-ink-soft)" stroke-width="1.5"/>

    <!-- Angle α au pied du plan -->
    <path d="M510,357 Q510.0,346.28 515.36,337" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <text x="497" y="345" text-anchor="end" font-size="14" font-style="italic" fill="var(--figure-ink)">α<tspan font-style="normal"> = 30°</tspan></text>

    <!-- Le bloc en G (position de départ) -->
    <g transform="rotate(30 190 149.25)">
      <rect x="158" y="131.25" width="64" height="36" rx="3"
            fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="2"/>
    </g>
    <circle cx="190" cy="149.25" r="3.5" fill="var(--figure-ink)"/>
    <text x="167.5" y="188.2" text-anchor="middle" font-size="14" font-style="italic" fill="var(--figure-ink)">G</text>

    <!-- Déplacement d, le long du plan, jusqu'à G' -->
    <line x1="190" y1="149.25" x2="395.6" y2="267.9" stroke="var(--figure-ink)" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="406,273.9 398.1,263.57 393.1,272.23" fill="var(--figure-ink)"/>
    <circle cx="406" cy="273.9" r="2.8" fill="var(--figure-ink-soft)"/>
    <text x="416" y="278" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">G'</text>
    <text x="287" y="230.6" text-anchor="middle" font-size="13" font-style="italic" fill="var(--figure-ink)">d</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 2 — le pas géométrique caché : d se projette sur la
       verticale, la dénivelée vaut Δz = d·sin α
       ══════════════════════════════════════════════════════════ -->
  <g id="step-2">
    <!-- Jambe horizontale de construction (d·cos α, non étiquetée) -->
    <line x1="190" y1="273.9" x2="406" y2="273.9" stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- Repère d'angle droit en F, côté intérieur du triangle -->
    <path d="M200,273.9 L200,263.9 L190,263.9" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>

    <!-- Angle α re-marqué en G' : d est l'hypoténuse, Δz le côté opposé -->
    <path d="M380,273.9 A26,26 0 0 1 383.48,260.9" fill="none" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <text x="362" y="269" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">α</text>

    <!-- Jambe verticale : Δz = d·sin α — LE foyer de l'étape -->
    <line x1="190" y1="149.25" x2="190" y2="273.9" stroke="var(--figure-accent)" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="178" y="215" text-anchor="end" font-size="12.5" fill="var(--figure-accent)">Δz<tspan> = d·sin α</tspan></text>
    <text x="178" y="231" text-anchor="end" font-size="10.5" font-style="italic" fill="var(--figure-accent)">la dénivelée cachée dans d</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 3 — le poids : porté par cette même verticale,
       W(P) = mg·Δz = mg·d·sin α, moteur
       ══════════════════════════════════════════════════════════ -->
  <g id="step-3">
    <!-- P : poids, vertical, vers le bas, 78 px -->
    <line x1="190" y1="149.25" x2="190" y2="219.25" stroke="var(--figure-ink)" stroke-width="2.3"/>
    <polygon points="190,227.25 185,215.25 195,215.25" fill="var(--figure-ink)"/>
    <text x="200" y="222" font-size="15" font-style="italic" fill="var(--figure-ink)">P</text>

    <!-- Boîte W(P) -->
    <rect x="40" y="238" width="150" height="62" rx="6" fill="var(--figure-accent)" fill-opacity="0.12"/>
    <text x="115" y="256" text-anchor="middle" font-size="11.5" fill="var(--figure-accent)">W(P) = mg·Δz</text>
    <text x="115" y="272" text-anchor="middle" font-size="11.5" fill="var(--figure-accent)">= mg·d·sin α</text>
    <text x="115" y="289" text-anchor="middle" font-size="11.5" fill="var(--figure-accent)">= +9,8 J  (motrice)</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 4 — la réaction normale : ⊥ au déplacement,
       cos 90° = 0, donc W(N) = 0
       ══════════════════════════════════════════════════════════ -->
  <g id="step-4">
    <!-- N : réaction normale, perpendiculaire au plan, 68 px -->
    <line x1="190" y1="149.25" x2="216.6" y2="102.34" stroke="var(--figure-ink)" stroke-width="2.3"/>
    <polygon points="224,90.36 220.42,102.83 211.16,97.53" fill="var(--figure-ink)"/>
    <text x="232" y="72" text-anchor="start" font-size="15" font-style="italic" fill="var(--figure-ink)">N</text>
    <text x="232" y="88" text-anchor="start" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">(N ⊥ au plan)</text>

    <!-- La lecture : angle droit avec d ⇒ cosinus nul ⇒ travail nul -->
    <text x="360" y="66" text-anchor="start" font-size="12" fill="var(--figure-accent)">N ⊥ d  ⇒  cos 90° = 0</text>
    <text x="360" y="82" text-anchor="start" font-size="12" fill="var(--figure-accent)">⇒  W(N) = 0</text>
  </g><!-- /step-4 -->

  <!-- ══════════════════════════════════════════════════════════
       STEP 5 — le frottement : parallèle au déplacement mais de
       sens opposé, cos 180° = −1, donc W(f) = −f·d
       ══════════════════════════════════════════════════════════ -->
  <g id="step-5">
    <!-- f : frottement, le long du plan, vers le HAUT (opposé à la descente), 48 px (exagérée ×3) -->
    <line x1="190" y1="149.25" x2="161.35" y2="132.5" stroke="var(--figure-ink)" stroke-width="2.3"/>
    <polygon points="148.4,125.25 158.44,131.09 153.31,139.91" fill="var(--figure-ink)"/>
    <text x="112" y="120" text-anchor="end" font-size="15" font-style="italic" fill="var(--figure-ink)">f</text>

    <!-- La lecture : sens opposé ⇒ cosinus négatif ⇒ travail résistant -->
    <text x="240" y="108" text-anchor="start" font-size="12" fill="var(--figure-accent)">f ∥ d, de sens opposé  ⇒  cos 180° = −1</text>
    <text x="240" y="124" text-anchor="start" font-size="12" fill="var(--figure-accent)">⇒  W(f) = −f·d = −4,0 J  (résistante)</text>
  </g><!-- /step-5 -->

</svg>
