    intro: |-
      **Étude d'un système mécanique oscillant (examen national, session de rattrapage 2015 — Exercice 4, Deuxième partie, 2,50 points sur les 05,5 de l'exercice complet).** *(Le sujet officiel étiquette cette partie « Première partie (02,5 points) » — c'est la SECONDE, le sommaire de la page 1 et le barème le confirment ; défaut F2, déclaré — voir la note de sourcing.)*

      *Les deux parties de cet exercice sont indépendantes. La Première partie — le mouvement d'un skieur — vit à part, sous la notion « Lois de Newton » (entrée bk-2015-r-x4). Rien de ce qui suit n'en dépend.*

      Le pendule de torsion permet de déterminer quelques grandeurs physiques caractéristiques de la matière, comme la constante de torsion des matériaux solides déformables, et les moments d'inertie des oscillateurs mécaniques. On étudira de façon simplifiée, la méthode de détermination de la constante de torsion d'un fil métallique, et quelques grandeurs dynamiques et cinématiques, en exploitant les diagrammes d'énergie du pendule de torsion. *(« On étudira » et la virgule qui suit tels qu'imprimés — défauts du sujet officiel, sans incidence)*

      Le pendule de torsion se compose d'un fil de torsion vertical de constante de torsion $C$, et d'une barre $AB$ homogène, de moment d'inertie $J_\Delta = 2{,}4.10^{-3}\ \text{kg.m}^2$ par rapport à un axe vertical $(\Delta)$ colinéaire au fil et passant par le centre d'inertie $G$ de la barre.

      On tourne la barre, horizontalement, dans le sens positif, autour de $(\Delta)$, d'un angle $\theta_m = 0{,}4\ \text{rad}$ par rapport à la position d'équilibre, et on la lâche sans vitesse initiale à un instant $t = 0$, considéré comme origine des temps.

      On repère la position de la barre à chaque instant par son abscisse angulaire $\theta$ par rapport à sa position d'équilibre (Figure 1). On étudie le mouvement du pendule dans un repère lié à la terre et supposé galiléen. *(« lié à la terre », minuscule, tel qu'imprimé)*

      La position d'équilibre est choisie comme état de référence de l'énergie potentielle de torsion, et le plan horizontal passant par $G$ comme état de référence de l'énergie potentielle de pesanteur. On néglige tous les frottements.

      Les courbes (a) et (b) de la figure 2 représentent les variations, **en fonction de l'abscisse angulaire $\theta$**, des énergies : potentielle $E_p$ et cinétique $E_C$, de l'oscillateur. *(Le sujet officiel imprime « en fonction du temps » — contredit par l'axe $\theta$(rad) de sa propre figure 2, dont les courbes sont des paraboles en $\theta$ ; renvoi reformulé pour être vrai, défaut F3 déclaré — voir la note de sourcing.)*

      **Figure 1 (le pendule, page 7 du sujet — re-décrite depuis le bitmap natif).** En haut, un plafond hachuré ; un fil vertical fin en descend jusqu'à $G$ — étiquette « $(\Delta)$ » à gauche du fil, légende « Fil de torsion » à droite. La barre $AB$, trait épais passant par $G$, est inclinée ($A$ en bas à gauche, $B$ en haut à droite). Un trait horizontal en pointillés passant par $G$ marque la position d'équilibre ; l'angle $\theta$ est marqué par un petit arc entre les pointillés et la barre, côté $B$. En haut à droite, un signe « + » avec une flèche courbe indique le sens positif.

      **Figure 2 (les diagrammes d'énergie, page 7 du sujet — re-décrite et re-mesurée au pixel par la vérification).** Quadrillage ; axe VERTICAL au CENTRE du cadre, étiqueté « $E_P$ ; $E_C$ (mJ) », avec un tick étiqueté « 1 » à mi-hauteur (**1 carreau majeur = 0,2 mJ**) ; axe horizontal « $\theta$(rad) », gradué $-0{,}4$ / $0$ / $0{,}4$ (**1 carreau majeur = 0,1 rad**). Deux paraboles épaisses en croix : la courbe **(a)**, ouverte vers le BAS, culmine à $\theta = 0$ **sur la ligne majeure de $1{,}6\ \text{mJ}$** (huit carreaux — mesure au pixel : $1{,}598\ \text{mJ}$) et s'annule à $\theta = \pm0{,}4\ \text{rad}$ ; la courbe **(b)**, ouverte vers le HAUT, s'annule à $\theta = 0$ et atteint $\approx 1{,}6\ \text{mJ}$ à $\theta = \pm0{,}4\ \text{rad}$. Les deux se croisent vers $\theta \approx \pm0{,}29\ \text{rad}$, à $E \approx 0{,}8\ \text{mJ}$ — la moitié du sommet.
    questions:
      - id: q1
        part: "Deuxième partie — le pendule de torsion par ses énergies"
        stem: |-
          **1-** (0,5 pt) Affecter, à chaque courbe, l'énergie correspondante. Justifier.
        reasoning: |-
          On identifie chaque courbe par ses ZÉROS — le geste de lecture des diagrammes d'énergie du chapitre 6, transposé du ressort au fil de torsion (chapitre 7) :

          - la courbe **(b)** s'annule à $\theta = 0$, la position d'équilibre — or c'est exactement là que l'énergie potentielle de torsion est nulle (référence choisie par l'énoncé), et elle croît comme $\frac{1}{2}C\theta^2$ quand on s'en écarte : **(b) est $E_p$**, l'énergie potentielle de torsion ;
          - la courbe **(a)** s'annule à $\theta = \pm\theta_m = \pm0{,}4\ \text{rad}$, les élongations extrêmes — or c'est là que la barre s'immobilise un instant avant de repartir ($\dot\theta = 0$), donc que l'énergie cinétique s'annule ; et elle culmine à $\theta = 0$, au passage par l'équilibre, où la barre va le plus vite : **(a) est $E_C$**, l'énergie cinétique.

          $$\boxed{(a) = E_C \qquad (b) = E_p\ \text{(torsion)}}$$

          Et les deux lectures se recoupent : en l'absence de frottements, $E_C + E_p = E_m$ constante — les deux paraboles sont symétriques l'une de l'autre, et se croisent à mi-hauteur ($0{,}8\ \text{mJ} = E_m/2$), exactement ce que montre la figure.

          Le piège nommé de cette question. Affecter les courbes par leur ALLURE (« la parabole ouverte vers le haut, c'est l'énergie cinétique, comme $\frac{1}{2}mv^2$ ») : l'axe des abscisses est $\theta$, pas une vitesse — en fonction de $\theta$, c'est $E_p = \frac{1}{2}C\theta^2$ qui est la parabole ouverte vers le haut. Les zéros, eux, ne trompent jamais.
      - id: q2
        stem: |-
          **2-** (0,5 pt) Déterminer la valeur de la constante de torsion $C$ du fil métallique.
        reasoning: |-
          Sans frottement, l'énergie mécanique est constante (chapitre 7) : elle vaut ce que $E_C$ vaut à l'équilibre — le SOMMET de la courbe (a), sur la ligne majeure de $1{,}6\ \text{mJ}$ :

          $$E_m = E_C(\theta = 0) = 1{,}6\ \text{mJ} = 1{,}6\times10^{-3}\ \text{J}$$

          Aux élongations extrêmes $\theta = \pm\theta_m$, toute cette énergie est potentielle de torsion (la barre s'y arrête) — et le chapitre 7 donne son expression, $\frac{1}{2}C\theta^2$ :

          $$E_m = \frac{1}{2}C\,\theta_m^2 \implies C = \frac{2\,E_m}{\theta_m^2} = \frac{2\times1{,}6\times10^{-3}}{(0{,}4)^2}$$

          $$\boxed{C = 0{,}02\ \text{N.m.rad}^{-1}}$$

          *(L'objet étudié — un pendule de torsion, sa période propre $T_0 = 2\pi\sqrt{J_\Delta/C}$ — appartient à la notion « Systèmes oscillants » ; ici tout se joue en énergie, sans jamais mobiliser $T_0$.)*

          Le piège nommé de cette question. Lire le sommet à $1{,}2\ \text{mJ}$ (six carreaux) au lieu de $1{,}6$ (huit) : le comptage des carreaux est LA lecture porteuse de tout l'exercice — le sommet de (a) est posé sur la ligne majeure, huit carreaux de $0{,}2\ \text{mJ}$ au-dessus de l'axe, et deux recoupements le verrouillent : la courbe (b) atteint la même hauteur à $\pm\theta_m$, et le croisement des deux courbes est à mi-hauteur ($0{,}8\ \text{mJ}$). Une lecture à $1{,}2$ serait incompatible avec ce croisement.
        steps:
          - math: 'E_m = E_C(\theta=0) = 1{,}6\ \text{mJ}'
            note: "Sommet de (a), huit carreaux de 0,2 mJ -- verrouille par le croisement des courbes a E_m/2 = 0,8 mJ."
          - math: 'E_m = \frac{1}{2}C\,\theta_m^2 \implies C = \frac{2\,E_m}{\theta_m^2}'
            note: "Aux elongations extrêmes, toute l'énergie est potentielle de torsion (chapitre 7)."
          - math: 'C = \frac{2\times1{,}6\times10^{-3}}{0{,}16}'
            note: "theta_m = 0,4 rad (énoncé)."
          - math: '\boxed{C = 0{,}02\ \text{N.m.rad}^{-1}}'
            note: "Constante de torsion du fil."
      - id: q3
        stem: |-
          **3-** (0,75 pt) Trouver la valeur absolue de la vitesse angulaire à l'instant de passage de l'oscillateur par une position d'abscisse angulaire $\theta_1 = 0{,}2\ \text{rad}$.
        reasoning: |-
          Deux temps : lire $E_C$ à $\theta_1$, puis en extraire $\dot\theta$.

          **Lire $E_C(\theta_1)$.** Par conservation (chapitre 7) — ou directement sur la courbe (a) à $\theta = 0{,}2\ \text{rad}$ :

          $$E_C(\theta_1) = E_m - \frac{1}{2}C\,\theta_1^2 = 1{,}6\times10^{-3} - \frac{1}{2}\times0{,}02\times(0{,}2)^2 = 1{,}6\times10^{-3} - 4\times10^{-4} = 1{,}2\times10^{-3}\ \text{J}$$

          **En extraire $|\dot\theta|$.** L'énergie cinétique d'un solide en ROTATION s'écrit $E_C = \frac{1}{2}J_\Delta\,\dot\theta^2$ — l'analogue rotationnel du $\frac{1}{2}mv^2$ du chapitre 2, construit dans la notion « Rotation d'un solide autour d'un axe fixe » ($J_\Delta$ y joue le rôle de la masse, $\dot\theta$ celui de la vitesse) :

          $$|\dot\theta| = \sqrt{\frac{2\,E_C(\theta_1)}{J_\Delta}} = \sqrt{\frac{2\times1{,}2\times10^{-3}}{2{,}4\times10^{-3}}} = \sqrt{1{,}0}$$

          $$\boxed{|\dot\theta| = 1{,}0\ \text{rad.s}^{-1}}$$

          Un résultat qui tombe exactement rond — le signe, une fois de plus, que la lecture $E_m = 1{,}6\ \text{mJ}$ est la bonne.

          Le piège nommé de cette question. Mélanger les deux réservoirs : à $\theta_1 = 0{,}2\ \text{rad}$, le pendule N'EST NI à l'équilibre ni à l'élongation maximale — il faut soustraire l'énergie potentielle du moment ($4\times10^{-4}\ \text{J}$) avant d'inverser $\frac{1}{2}J_\Delta\dot\theta^2$. Utiliser $E_m$ entière donnerait $|\dot\theta| \approx 1{,}15\ \text{rad.s}^{-1}$, faux.
        steps:
          - math: 'E_C(\theta_1) = E_m - \frac{1}{2}C\,\theta_1^2 = 1{,}6\times10^{-3} - 4\times10^{-4} = 1{,}2\times10^{-3}\ \text{J}'
            note: "Conservation de E_m (chapitre 7) ; lisible aussi directement sur la courbe (a) a theta = 0,2 rad."
          - math: 'E_C = \frac{1}{2}J_\Delta\,\dot\theta^2 \implies |\dot\theta| = \sqrt{\frac{2\,E_C}{J_\Delta}}'
            note: "Énergie cinétique de rotation (notion Rotation autour d'un axe fixe) : J_Delta joue le rôle de la masse."
          - math: '|\dot\theta| = \sqrt{\frac{2\times1{,}2\times10^{-3}}{2{,}4\times10^{-3}}} = \sqrt{1{,}0}'
            note: "J_Delta = 2,4e-3 kg.m2 (énoncé)."
          - math: '\boxed{|\dot\theta| = 1{,}0\ \text{rad.s}^{-1}}'
            note: "Valeur exactement ronde : la lecture E_m = 1,6 mJ se confirme encore."
      - id: q4
        stem: |-
          **4-** (0,75 pt) Calculer le travail du couple de torsion $W_C$ lorsque l'oscillateur passe de la position d'équilibre repérée par l'abscisse angulaire $\theta = 0$, à la position repérée par l'abscisse angulaire $\theta_1$.
        reasoning: |-
          Le couple de torsion est la force de rappel du fil — celle-là même dont l'énergie potentielle de torsion $\frac{1}{2}C\theta^2$ garde la trace (chapitre 7). Son travail se calcule donc comme celui du poids au chapitre 4 : par la VARIATION d'énergie potentielle, changée de signe — jamais par « couple × angle », le couple n'étant pas constant :

          $$W_C(0 \to \theta_1) = -\Delta E_{p,torsion} = -\left(\frac{1}{2}C\,\theta_1^2 - 0\right) = -\frac{1}{2}\times0{,}02\times(0{,}2)^2$$

          $$\boxed{W_C = -4\times10^{-4}\ \text{J}}$$

          Le signe dit la physique : de $\theta = 0$ à $\theta_1 = 0{,}2\ \text{rad}$, la barre S'ÉCARTE de l'équilibre, et le couple de rappel — qui tire toujours vers l'équilibre — travaille CONTRE le mouvement : travail résistant, négatif. C'est exactement l'énergie que la question 3 a vue disparaître du réservoir cinétique ($1{,}6 - 1{,}2 = 0{,}4\ \text{mJ}$) : le théorème de l'énergie cinétique (chapitre 3) referme la boucle, puisque le couple de torsion est ici la seule action qui travaille.

          Le piège nommé de cette question. Écrire $W_C = +\frac{1}{2}C\theta_1^2$ (oublier le signe moins de $W = -\Delta E_p$), ou calculer $\frac{1}{2}C(\theta_m^2 - \theta_1^2)$ en partant de l'élongation maximale : l'énoncé fait partir le trajet de $\theta = 0$, pas de $\theta_m$ — lire les bornes du trajet AVANT de poser le calcul.
        steps:
          - math: 'W_C(0 \to \theta_1) = -\Delta E_{p,torsion} = -\left(\frac{1}{2}C\,\theta_1^2 - 0\right)'
            note: "Travail d'une force conservative = moins la variation de son énergie potentielle (même geste que le poids, chapitre 4)."
          - math: 'W_C = -\frac{1}{2}\times0{,}02\times(0{,}2)^2'
            note: "C = 0,02 N.m/rad (question 2), theta_1 = 0,2 rad, départ a theta = 0 (E_p nulle)."
          - math: '\boxed{W_C = -4\times10^{-4}\ \text{J}}'
            note: "Travail resistant (la barre s'ecarte de l'équilibre) = l'énergie perdue par le réservoir cinétique entre les questions 2 et 3."
