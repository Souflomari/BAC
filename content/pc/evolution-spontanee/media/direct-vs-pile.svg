<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Comparaison de deux montages pour la même réaction zinc / ions cuivre(II) : à gauche, contact direct — le zinc est plongé directement dans la solution de Cu2+, dans le même récipient ; les électrons sautent localement à la surface, mais aucun circuit extérieur n'existe, un ampèremètre posé là indique zéro. À droite, détour forcé (une pile) — le zinc et le cuivre sont séparés dans deux compartiments reliés par un fil et un pont salin ; les électrons sont forcés de passer par le fil, un ampèremètre inséré sur ce fil dévie. Même réaction, même constante d'équilibre K, même critère Qr,i face à K dans les deux cas — seul le montage diffère. Le test qui tranche : réactifs séparés avec un courant mesurable dans un circuit extérieur, c'est une pile ; réactifs en contact direct dans le même récipient, ce n'est pas une pile.">
  <title>Transfert direct ou pile : le test qui tranche</title>

  <!--
    direct-vs-pile.svg — STAGED (LESSON-EXPERIENCE-SPEC §2), 3 étapes,
    R4 (évolution spontanée). Contraste côte-à-côte, strictement
    schématique — ne détaille PAS l'intérieur d'une pile (chapitre futur) :
    juste assez pour lire le test qui distingue les deux montages.

    step-1 : montage gauche complet — contact direct (une lame de zinc
             plongée directement dans une solution de Cu2+, même récipient),
             avec un petit encart de rappel "e- sur place" (le mécanisme du
             rung 3) et un ampèremètre posé À CÔTÉ, non relié à rien,
             aiguille au zéro. Conclusion du panneau, en accent : "réactifs
             mélangés, même récipient — aucun courant mesurable."
    step-2 : montage droit complet — détour forcé (pile) : deux
             compartiments séparés (Zn/Zn2+ à gauche, Cu/Cu2+ à droite),
             pont salin entre les deux, fil extérieur avec ampèremètre
             inséré et flèche d'électrons — aiguille déviée. Séparateur
             pointillé entre les deux panneaux. Conclusion, en accent :
             "réactifs séparés — détour forcé — courant mesurable."
    step-3 : la lecture — un rappel neutre ("même réaction, même K, même
             critère Qr,i / K — seul le montage diffère") puis, dans un
             encadré en accent, le test qui tranche lui-même : "séparés +
             courant mesurable = pile ; contact direct, même récipient =
             pas de pile."

    Géométrie (calculée) :
      panneau gauche : x=20 y=54 w=270 h=250 rx=8 (bas=304)
      panneau droit  : x=350 y=54 w=270 h=250 rx=8 (bas=304)
      séparateur pointillé (step-2) : x=320, y=54→304
      légendes de conclusion : y=318 / y=332, sous chaque panneau
      bande de synthèse (step-3) : rappel y=372 ; encadré y=392→436

    Simplifications assumées (schéma pédagogique, pas à l'échelle,
    délibérément sous-détaillé pour la pile — le montage complet est
    l'objet d'un futur chapitre) :
      - les deux compartiments de la pile sont dessinés à demi-échelle du
        bécher unique du contact direct, pour tenir côte-à-côte dans le
        même panneau (comme pile-daniell.svg, en plus compact) ;
      - le pont salin est un simple tube arqué, sans détail de composition
        ionique (contrairement à pile-daniell.svg, où ce détail sert un
        autre rung) ;
      - l'ampèremètre "déconnecté" du montage direct est représenté posé à
        l'écart, avec deux bouts de fil non raccordés — pas une convention
        électrique standard, mais la façon la plus claire de dire "aucun
        circuit n'existe ici".

    Rôle des couleurs (contrat de rendu, 5 tokens seulement) :
      --figure-accent marque, à chaque étape, le signal qui tranche : le
      petit rappel "e- sur place" ET la conclusion du panneau gauche
      (step-1) ; la flèche d'électrons, l'aiguille déviée ET la conclusion
      du panneau droit (step-2) ; l'encadré du test final (step-3).
      Structure neutre (béchers, électrodes, ampèremètres, fils, pont
      salin, étiquettes d'espèces, rappel factuel du step-3) :
      --figure-ink / --figure-ink-soft. Fonds : --figure-surface /
      --figure-grid.
  -->

  <!-- Titre -->
  <text x="320" y="24" text-anchor="middle"
        font-size="13" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">
    Transfert direct ou pile : le test qui tranche
  </text>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — montage gauche complet : contact direct
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">

    <!-- Panneau -->
    <rect x="20" y="54" width="270" height="250" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="155" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">
      Contact direct
    </text>

    <!-- Bécher -->
    <path d="M70,110 L70,260 Q70,280 90,280 L210,280 Q230,280 230,260 L230,110"
          fill="none" stroke="var(--figure-ink)" stroke-width="2" stroke-linecap="round"/>
    <path d="M70,140 L70,260 Q70,280 90,280 L210,280 Q230,280 230,260 L230,140 Z"
          fill="var(--figure-grid)" opacity="0.6"/>
    <line x1="70" y1="140" x2="230" y2="140" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <!-- Lame de zinc, plongée directement -->
    <rect x="143" y="95" width="14" height="175" rx="2"
          fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1.1"/>
    <text x="150" y="119" text-anchor="middle" font-size="11" font-weight="600" font-style="italic"
          fill="var(--figure-surface)">Zn</text>

    <!-- Étiquette de la solution -->
    <text x="185" y="232" text-anchor="start" font-size="9.5" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">Cu</tspan><tspan dy="-4" font-size="7" font-style="normal">2+</tspan><tspan dy="4"> (aq)</tspan></text>

    <!-- Rappel : électrons sur place, au contact (callback rung 3) -->
    <line x1="163" y1="150" x2="176" y2="150" stroke="var(--figure-accent)" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="180,150 174,146.5 174,153.5" fill="var(--figure-accent)"/>
    <text x="184" y="153" text-anchor="start" font-size="8.5" fill="var(--figure-accent)"
          ><tspan font-style="italic">e</tspan><tspan dy="-4" font-size="6" font-style="normal">−</tspan><tspan dy="4"> sur place</tspan></text>

    <!-- Ampèremètre non relié, aiguille au zéro -->
    <circle cx="245" cy="90" r="15" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <text x="245" y="94.5" text-anchor="middle" font-size="12" font-style="italic" fill="var(--figure-ink)">A</text>
    <line x1="245" y1="90" x2="245" y2="79" stroke="var(--figure-ink-soft)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="232" y1="90" x2="222" y2="90" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1,3"/>
    <circle cx="220" cy="90" r="1.8" fill="var(--figure-ink-soft)"/>
    <line x1="258" y1="90" x2="268" y2="90" stroke="var(--figure-ink-soft)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1,3"/>
    <circle cx="270" cy="90" r="1.8" fill="var(--figure-ink-soft)"/>
    <text x="245" y="115" text-anchor="middle" font-size="8" font-style="italic" fill="var(--figure-ink-soft)">
      (pas de circuit)
    </text>

    <!-- Conclusion du panneau -->
    <text x="155" y="318" text-anchor="middle" font-size="10.5" fill="var(--figure-accent)">
      réactifs mélangés, même récipient —
    </text>
    <text x="155" y="332" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--figure-accent)">
      aucun courant mesurable
    </text>

  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — montage droit complet : détour forcé (pile)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">

    <!-- Séparateur -->
    <line x1="320" y1="54" x2="320" y2="304"
          stroke="var(--figure-ink-soft)" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Panneau -->
    <rect x="350" y="54" width="270" height="250" rx="8"
          fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
    <text x="485" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="var(--figure-ink)">
      Détour forcé (pile)
    </text>

    <!-- Compartiment gauche : Zn / Zn2+ -->
    <path d="M370,150 L370,260 Q370,280 385,280 L435,280 Q450,280 450,260 L450,150"
          fill="none" stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M370,175 L370,260 Q370,280 385,280 L435,280 Q450,280 450,260 L450,175 Z"
          fill="var(--figure-grid)" opacity="0.6"/>
    <rect x="403" y="130" width="12" height="150" rx="2"
          fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1"/>
    <text x="409" y="150" text-anchor="middle" font-size="9.5" font-weight="600" font-style="italic"
          fill="var(--figure-surface)">Zn</text>
    <text x="409" y="296" text-anchor="middle" font-size="8" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">Zn</tspan><tspan dy="-4" font-size="6" font-style="normal">2+</tspan><tspan dy="4">(aq)</tspan></text>

    <!-- Compartiment droit : Cu / Cu2+ -->
    <path d="M490,150 L490,260 Q490,280 505,280 L555,280 Q570,280 570,260 L570,150"
          fill="none" stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M490,175 L490,260 Q490,280 505,280 L555,280 Q570,280 570,260 L570,175 Z"
          fill="var(--figure-grid)" opacity="0.6"/>
    <rect x="525" y="130" width="12" height="150" rx="2"
          fill="var(--figure-ink-soft)" stroke="var(--figure-ink)" stroke-width="1"/>
    <text x="531" y="150" text-anchor="middle" font-size="9.5" font-weight="600" font-style="italic"
          fill="var(--figure-surface)">Cu</text>
    <text x="531" y="296" text-anchor="middle" font-size="8" fill="var(--figure-ink-soft)"
          ><tspan font-style="italic">Cu</tspan><tspan dy="-4" font-size="6" font-style="normal">2+</tspan><tspan dy="4">(aq)</tspan></text>

    <!-- Pont salin -->
    <path d="M450,175 Q470,112 490,175" fill="none" stroke="var(--figure-grid)" stroke-width="7" stroke-linecap="round"/>
    <path d="M450,175 Q470,112 490,175" fill="none" stroke="var(--figure-ink)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="450" cy="175" r="2" fill="var(--figure-ink)"/>
    <circle cx="490" cy="175" r="2" fill="var(--figure-ink)"/>
    <!-- DESCENDUE entre l'ampèremètre et l'arche (2026-09-04) : à y=102 elle
         tombait dans le cercle de l'ampèremètre (centre 470;90, rayon 13),
         qui la rayait sur 53 % de sa largeur — l'étiquette du pont salin
         posée sur un autre instrument. À y=132 elle est sous le cercle et
         au-dessus du sommet de l'arche (y≈143), donc contre ce qu'elle
         nomme. -->
    <text x="470" y="132" text-anchor="middle" font-size="8" fill="var(--figure-ink-soft)">pont salin</text>
    <text x="470" y="238" text-anchor="middle" font-size="7.5" font-style="italic" fill="var(--figure-ink-soft)">
      maintient
    </text>
    <text x="470" y="249" text-anchor="middle" font-size="7.5" font-style="italic" fill="var(--figure-ink-soft)">
      l'électroneutralité
    </text>

    <!-- Fil extérieur + ampèremètre, aiguille déviée -->
    <line x1="409" y1="130" x2="409" y2="90" stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="531" y1="130" x2="531" y2="90" stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="409" y1="90" x2="456" y2="90" stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="484" y1="90" x2="531" y2="90" stroke="var(--figure-ink)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="409" cy="130" r="2.4" fill="var(--figure-ink)"/>
    <circle cx="531" cy="130" r="2.4" fill="var(--figure-ink)"/>

    <circle cx="470" cy="90" r="13" fill="var(--figure-surface)" stroke="var(--figure-ink)" stroke-width="1.6"/>
    <text x="470" y="94.5" text-anchor="middle" font-size="11" font-style="italic" fill="var(--figure-ink)">A</text>
    <line x1="470" y1="90" x2="479" y2="80" stroke="var(--figure-accent)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Flèche d'électrons, forcée par le fil.
         PASSÉE SOUS LE FIL (2026-09-04) : dessinée à y=76, au-dessus du fil,
         elle traversait le TITRE du panneau (« Détour forcé (pile) », y=76) —
         le titre rayé par la flèche. Sous le fil (y=90), la bande jusqu'aux
         béchers est libre, et la flèche reste collée au conducteur qu'elle
         décrit. -->
    <line x1="420" y1="104" x2="445" y2="104" stroke="var(--figure-accent)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="445,104 434,99 434,109" fill="var(--figure-accent)"/>
    <text x="432" y="122" text-anchor="middle" font-size="11" fill="var(--figure-accent)"
          ><tspan font-style="italic">e</tspan><tspan dy="-5" font-size="8" font-style="normal">−</tspan></text>

    <!-- Conclusion du panneau -->
    <text x="485" y="318" text-anchor="middle" font-size="10.5" fill="var(--figure-accent)">
      réactifs séparés — détour forcé —
    </text>
    <text x="485" y="332" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--figure-accent)">
      courant mesurable
    </text>

  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la lecture : même réaction, même K ; le test
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">

    <line x1="40" y1="352" x2="600" y2="352" stroke="var(--figure-ink-soft)" stroke-width="1"/>

    <text x="320" y="372" text-anchor="middle" font-size="11" fill="var(--figure-ink)">
      même réaction, même <tspan font-style="italic">K</tspan>, même critère <tspan font-style="italic">Q</tspan><tspan
      dy="3" font-size="8">r,i</tspan><tspan dy="-3"> / </tspan><tspan font-style="italic">K</tspan> — seul le montage diffère
    </text>

    <rect x="70" y="392" width="500" height="44" rx="6"
          fill="var(--figure-surface)" stroke="var(--figure-accent)" stroke-width="1.4"/>
    <text x="320" y="410" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-accent)">
      séparés + courant mesurable = pile
    </text>
    <text x="320" y="426" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--figure-accent)">
      contact direct, même récipient = pas de pile
    </text>

  </g><!-- /step-3 -->

</svg>
