  - id: ES-22
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.equilibre-egale-arret-total
    stem: >
      Un système chimique évolue jusqu'à ce que $Q_r$ atteigne la valeur de $K$.
      Que peut-on affirmer de son état à ce moment-là ?
    type: mcq
    choices:
      - id: A
        text: >-
          Les quantités ne varient plus à l'échelle macroscopique, mais les deux
          réactions continuent à vitesses égales
        correct: true
      - id: B
        text: >-
          Les réactifs ont été totalement consommés : c'est ce que signifie
          atteindre l'équilibre
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.equilibre-egale-arret-total
        feedback: >
          $Q_r = K$ décrit un RAPPORT entre concentrations, pas une disparition.
          Si un réactif était totalement consommé, sa concentration serait nulle
          et $Q_r$ vaudrait $0$ ou serait infini — jamais une valeur finie non
          nulle. Il reste toujours des réactifs à l'équilibre.
      - id: C
        text: >-
          Rien ne permettait de le prévoir : seul le suivi expérimental peut dire
          où un système s'arrête
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.pas-de-critere-predictif
        feedback: >
          Le critère $Q_{r,i}$ face à $K$ prédit le sens d'évolution AVANT toute
          mesure : si $Q_{r,i} < K$, le système évolue dans le sens direct ; s'il
          est supérieur, dans le sens inverse. C'est tout l'intérêt du chapitre —
          remplacer l'observation par un calcul.
      - id: D
        text: >-
          Le système peut repartir spontanément en sens inverse, la spontanéité
          d'un sens entraînant celle de l'autre
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.sens-symetrique
        feedback: >
          Un sens spontané n'entraîne jamais la spontanéité de l'inverse — sans
          quoi le système oscillerait sans fin. À l'équilibre, aucun sens n'est
          privilégié : $Q_r = K$, et c'est justement pourquoi rien ne bouge plus
          globalement.
    correct_feedback: >
      $Q_r = K$ marque un équilibre DYNAMIQUE : les deux réactions se produisent
      à la même vitesse, si bien que les quantités globales cessent de varier. Il
      reste toujours des réactifs — sinon $Q_r$ ne pourrait pas valoir $K$.
    solution: |
      **Ce que $Q_r = K$ dit.** Que le rapport des concentrations a atteint la
      valeur caractéristique de la réaction à cette température.

      **Ce que cela n'est pas.** Un épuisement : les quatre espèces coexistent.
      Ni un arrêt microscopique : les deux réactions continuent, à vitesses
      égales.

      **Le contrôle par l'absurde.** Un réactif totalement consommé donnerait un
      dénominateur nul dans $Q_r$ — donc une valeur infinie, jamais égale à $K$.

  - id: ES-23
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.pas-de-critere-predictif
    stem: >
      On mélange des espèces d'un couple oxydant-réducteur et l'on calcule
      $Q_{r,i} = 10^{-3}$, alors que $K = 10^{7}$. Que va-t-il se passer ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le système évolue dans le sens direct, jusqu'à ce que $Q_r$ rejoigne
          $K$ : $Q_{r,i} < K$
        correct: true
      - id: B
        text: >-
          Impossible à prévoir : seule l'expérience peut dire dans quel sens un
          système évolue
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.pas-de-critere-predictif
        feedback: >
          C'est précisément ce que le critère permet d'éviter. Comparer
          $Q_{r,i}$ à $K$ suffit : inférieur, le système évolue dans le sens
          direct ; supérieur, dans le sens inverse ; égal, il n'évolue pas. Le
          calcul précède l'observation et la remplace.
      - id: C
        text: >-
          Le système évolue dans le sens direct, puis les réactifs disparaissent
          complètement, l'équilibre signifiant leur épuisement
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.equilibre-egale-arret-total
        feedback: >
          Le sens est juste, la fin ne l'est pas. $K = 10^{7}$ est grand : la
          transformation ira loin, mais pas jusqu'à l'épuisement. Il subsiste
          toujours des réactifs — c'est ce que signifie une valeur de $K$ finie,
          si grande soit-elle.
      - id: D
        text: >-
          Le critère ne s'applique pas ici : il est réservé aux réactions
          acido-basiques, pas à l'oxydoréduction
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.critere-limite-redox
        feedback: >
          Le critère est UNIVERSEL : il vaut pour l'oxydoréduction, l'acide-base,
          la précipitation, la complexation. Il ne dépend d'aucun mécanisme
          particulier — seulement de l'expression de $Q_r$ et de la valeur de $K$
          à la température considérée.
    correct_feedback: >
      $Q_{r,i} = 10^{-3} < K = 10^{7}$ : le système évolue dans le SENS DIRECT,
      jusqu'à ce que $Q_r$ atteigne $K$. Le critère se lit sans aucune mesure, et
      il vaut pour tous les types de réactions.
    solution: |
      **Le critère d'évolution spontanée.**
      $$Q_{r,i} < K \Rightarrow \text{sens direct} \qquad
      Q_{r,i} > K \Rightarrow \text{sens inverse} \qquad
      Q_{r,i} = K \Rightarrow \text{équilibre}$$

      **Ici.** $10^{-3} < 10^{7}$ : sens direct, et de très loin — l'écart de dix
      ordres de grandeur annonce une transformation quasi totale.

      **Sa portée.** Aucun mécanisme n'est privilégié : le critère s'applique à
      toute réaction pour laquelle on sait écrire $Q_r$ et connaître $K$.

  - id: ES-24
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.spontane-egale-instantane
    stem: >
      Une réaction est prévue spontanée par le critère $Q_{r,i} < K$, et
      pourtant rien ne semble se produire au bout d'une heure. Est-ce
      contradictoire ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non : la spontanéité dit vers OÙ le système évolue, jamais à quelle
          vitesse il y va
        correct: true
      - id: B
        text: >-
          Oui : une réaction spontanée est toujours rapide, par définition, donc
          la prévision était fausse
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.spontane-egale-instantane
        feedback: >
          « Spontané » est un terme de thermodynamique : il désigne le sens dans
          lequel le système évolue, sans rien dire de la durée. Le mélange
          dihydrogène-dioxygène est spontané et n'évolue pas en des années sans
          étincelle. Vitesse et sens relèvent de deux chapitres distincts.
      - id: C
        text: >-
          Oui : si rien ne se produit, c'est que le système est déjà à
          l'équilibre, donc que les réactifs sont épuisés
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.equilibre-egale-arret-total
        feedback: >
          Deux erreurs. $Q_{r,i} < K$ signifie justement que le système N'EST PAS
          à l'équilibre. Et l'équilibre ne signifie jamais l'épuisement des
          réactifs : les espèces coexistent, dans le rapport que fixe $K$.
      - id: D
        text: >-
          Non, et la réaction inverse est tout aussi spontanée, ce qui explique
          l'immobilité apparente
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.sens-symetrique
        feedback: >
          Les deux sens ne peuvent pas être spontanés en même temps : le critère
          compare $Q_{r,i}$ à $K$ et donne UN sens. Ici $Q_{r,i} < K$ : seul le
          sens direct est spontané. L'immobilité apparente vient de la cinétique,
          pas d'une symétrie.
    correct_feedback: >
      Aucune contradiction. Le critère prédit le SENS de l'évolution, pas sa
      DURÉE. Une réaction thermodynamiquement favorable peut être infiniment
      lente — c'est le cas du mélange dihydrogène-dioxygène, stable des années
      sans étincelle.
    solution: |
      **Deux questions, deux chapitres.**
      - *Thermodynamique* : dans quel sens, et jusqu'où ? Réponse par
        $Q_{r,i}$ face à $K$.
      - *Cinétique* : à quelle vitesse ? Réponse par la température, la
        concentration, le catalyseur.

      **L'exemple qui les sépare.** $2H_2 + O_2 \rightarrow 2H_2O$ est très
      favorable ($K$ énorme) et ne se produit pas à température ambiante sans
      amorçage.

      **La conséquence pratique.** Un catalyseur change la vitesse, jamais l'état
      final ; chauffer accélère les deux sens sans déplacer l'équilibre — seule
      la modification de $K$ le déplace.

  - id: ES-25
    rung: "R1"
    difficulty_level: 3
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.oxydation-reduction-inversees
    stem: >
      Dans la réaction entre le zinc métallique et les ions cuivre (II), le zinc
      cède deux électrons. Que subit-il, et comment écrit-on la réaction
      globale ?
    type: mcq
    choices:
      - id: A
        text: >-
          Il subit une OXYDATION ; l'équation globale s'obtient en additionnant
          les deux demi-équations, ici équilibrées en électrons
        correct: true
      - id: B
        text: >-
          Il subit une RÉDUCTION : céder des électrons, c'est se réduire
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.oxydation-reduction-inversees
        feedback: >
          Les définitions sont inversées. Oxydation = PERTE d'électrons,
          réduction = GAIN. Le moyen mnémotechnique classique : « réduction » fait
          baisser le nombre d'oxydation, donc c'est le gain d'électrons
          (négatifs). Ici le zinc perd deux électrons : il s'oxyde.
      - id: C
        text: >-
          Il subit une oxydation, et la demi-équation
          $Zn \rightarrow Zn^{2+} + 2e^{-}$ décrit à elle seule la
          transformation réelle
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.demi-equation-isolee
        feedback: >
          Une demi-équation isolée fait apparaître des électrons libres, qui
          n'existent pas en solution : ils sont nécessairement captés par un autre
          couple. Une transformation réelle combine TOUJOURS deux demi-équations
          — c'est ce qui fait disparaître les électrons du bilan.
      - id: D
        text: >-
          Il subit une oxydation, et l'on additionne les deux demi-équations sans
          se soucier du nombre d'électrons de chacune
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.electrons-non-equilibres
        feedback: >
          Il faut d'abord ÉGALISER le nombre d'électrons échangés, en multipliant
          chaque demi-équation par le facteur voulu — sans quoi des électrons
          subsistent dans le bilan final, ce qui n'a aucun sens. Ici les deux
          demi-équations en échangent déjà deux, donc l'addition est directe.
    correct_feedback: >
      Céder des électrons, c'est s'OXYDER. Le zinc s'oxyde en $Zn^{2+}$, les ions
      cuivre se réduisent en cuivre métallique, et l'équation globale s'obtient en
      additionnant les deux demi-équations une fois les électrons égalisés — ici
      deux de chaque côté.
    solution: |
      **Les deux définitions.**
      $$\text{oxydation : perte d'électrons} \qquad
      \text{réduction : gain d'électrons}$$

      **Les deux demi-équations.**
      $$Zn \rightarrow Zn^{2+} + 2e^{-} \qquad
      Cu^{2+} + 2e^{-} \rightarrow Cu$$

      **Le bilan.** Les électrons s'annulent car ils sont en nombre égal :
      $$Zn + Cu^{2+} \rightarrow Zn^{2+} + Cu$$

      **Pourquoi une demi-équation seule ne suffit pas.** Elle laisse des
      électrons libres au bilan ; en solution, ils sont toujours captés par un
      autre couple.

  - id: ES-26
    rung: "R1"
    difficulty_level: 4
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.electrons-non-equilibres
    stem: >
      On combine $Fe^{2+} \rightarrow Fe^{3+} + e^{-}$ et
      $MnO_4^{-} + 8H^{+} + 5e^{-} \rightarrow Mn^{2+} + 4H_2O$. Comment obtenir
      l'équation globale ?
    type: mcq
    choices:
      - id: A
        text: >-
          En multipliant la première demi-équation par $5$, pour que les deux
          échangent le même nombre d'électrons
        correct: true
      - id: B
        text: >-
          En additionnant les deux telles quelles : les électrons se
          simplifieront d'eux-mêmes au bilan
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.electrons-non-equilibres
        feedback: >
          Un électron d'un côté et cinq de l'autre ne se simplifient pas : il en
          resterait quatre au bilan, ce qui n'a pas de sens — les électrons ne
          s'accumulent pas en solution. Il faut d'abord multiplier la première
          par $5$, puis additionner.
      - id: C
        text: >-
          En multipliant la seconde par $5$, puisque c'est elle qui porte le plus
          grand nombre d'électrons
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.electrons-non-equilibres
        feedback: >
          Cela aggraverait l'écart : on passerait de $1$ contre $5$ à $1$ contre
          $25$. C'est la demi-équation qui en échange le MOINS qu'il faut
          multiplier, de façon à atteindre le plus petit multiple commun — ici
          $5$.
      - id: D
        text: >-
          En prenant la seule demi-équation du permanganate, qui décrit à elle
          seule la transformation, puis en vérifiant que la réaction inverse est
          également spontanée
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.demi-equation-isolee
        feedback: >
          Deux erreurs. Une demi-équation isolée laisse des électrons libres et
          ne décrit aucune transformation réelle. Et les deux sens ne sont jamais
          spontanés ensemble : le critère $Q_{r,i}$ face à $K$ en désigne un
          seul.
    correct_feedback: >
      On multiplie la demi-équation du fer par $5$, pour que les deux en
      échangent cinq. L'addition donne alors
      $MnO_4^{-} + 5Fe^{2+} + 8H^{+} \rightarrow Mn^{2+} + 5Fe^{3+} + 4H_2O$,
      sans électron résiduel.
    solution: |
      **La règle.** Avant d'additionner, égaliser le nombre d'électrons échangés
      — en multipliant chaque demi-équation par le facteur qui amène au plus petit
      multiple commun. Ici $\mathrm{ppcm}(1,5) = 5$ : on multiplie la première
      par $5$.

      **Le bilan.**
      $$MnO_4^{-} + 5Fe^{2+} + 8H^{+} \rightarrow Mn^{2+} + 5Fe^{3+} + 4H_2O$$

      **Le contrôle.** Aucun électron ne doit subsister, et les charges doivent
      s'équilibrer de part et d'autre : $-1 + 10 + 8 = +17$ à gauche,
      $+2 + 15 = +17$ à droite. ✓

  - id: ES-27
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.solide-dans-qr
    stem: >
      Pour la réaction $Zn_{(s)} + Cu^{2+}_{(aq)} \rightarrow Zn^{2+}_{(aq)} +
      Cu_{(s)}$, quelle est l'expression correcte de $Q_r$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $Q_r = \dfrac{[Zn^{2+}]}{[Cu^{2+}]}$ : les solides purs sont exclus du
          quotient de réaction, et les coefficients valent tous $1$
        correct: true
      - id: B
        text: >-
          $Q_r = \dfrac{[Zn^{2+}]\,[Cu]}{[Zn]\,[Cu^{2+}]}$ : toutes les espèces
          de l'équation doivent apparaître
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.solide-dans-qr
        feedback: >
          Un solide pur n'a pas de concentration : sa « quantité par unité de
          volume » est fixée par sa masse volumique et ne varie pas au cours de
          la réaction. Il est donc exclu de $Q_r$ par convention — de même que le
          solvant en large excès.
      - id: C
        text: >-
          $Q_r = \dfrac{[Zn^{2+}]}{[Cu^{2+}]}$, mais sans tenir compte des
          coefficients stœchiométriques, qui n'interviennent pas
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.exposants-oublies
        feedback: >
          Ici les coefficients valent tous $1$, donc l'expression est juste par
          accident — mais l'affirmation est fausse. Les coefficients
          stœchiométriques interviennent comme EXPOSANTS dans $Q_r$ : pour
          $aA + bB \rightleftharpoons cC + dD$, on écrit
          $Q_r = \frac{[C]^{c}[D]^{d}}{[A]^{a}[B]^{b}}$.
      - id: D
        text: >-
          $Q_r$ n'a pas d'expression ici : le pont salin et le fil conducteur
          jouant le même rôle, la réaction n'est pas définie tant que le montage
          ne l'est pas
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.fil-jonction-confondus
        feedback: >
          $Q_r$ se définit à partir de l'ÉQUATION, indépendamment du montage :
          transfert direct dans un bécher ou pile, l'expression est la même. Et
          les deux éléments cités n'ont pas le même rôle : le fil conduit les
          électrons, le pont salin assure l'électroneutralité des solutions.
    correct_feedback: >
      $Q_r = \dfrac{[Zn^{2+}]}{[Cu^{2+}]}$. Les solides purs — zinc et cuivre
      métalliques — sont exclus de $Q_r$ : ils n'ont pas de concentration
      variable. Les coefficients valant tous $1$, aucun exposant n'apparaît.
    solution: |
      **La règle d'écriture.** Pour
      $aA + bB \rightleftharpoons cC + dD$ :
      $$Q_r = \frac{[C]^{c}\,[D]^{d}}{[A]^{a}\,[B]^{b}}$$
      avec deux exclusions : les SOLIDES purs et le SOLVANT.

      **Pourquoi exclure les solides.** Leur « concentration » est fixée par leur
      masse volumique : elle ne varie pas quand la réaction avance. Les inclure
      reviendrait à multiplier par une constante, que la définition de $K$
      absorbe.

      **Ici.**
      $$Q_r = \frac{[Zn^{2+}]}{[Cu^{2+}]}$$

  - id: ES-28
    rung: "R4"
    difficulty_level: 4
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.fil-jonction-confondus
    stem: >
      Dans une pile, quels rôles distincts jouent le fil conducteur et le pont
      salin ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le fil conduit les électrons entre les électrodes ; le pont salin
          assure l'électroneutralité des deux solutions par migration d'ions
        correct: true
      - id: B
        text: >-
          Les deux jouent le même rôle : ils ferment le circuit, et l'on peut
          remplacer l'un par l'autre
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.fil-jonction-confondus
        feedback: >
          Ils ferment le circuit chacun à sa manière, et ne sont pas
          interchangeables : les électrons circulent dans le MÉTAL, jamais dans la
          solution ; les ions migrent dans la SOLUTION, jamais dans le fil. Retirer
          le pont salin arrête la pile en quelques instants, par accumulation de
          charges.
      - id: C
        text: >-
          Le fil transporte les ions et le pont salin les électrons, ce que
          traduit l'expression de $Q_r$ où figurent les solides des deux
          électrodes
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.solide-dans-qr
        feedback: >
          Les rôles sont intervertis, et l'argument invoqué est faux : les solides
          purs des électrodes ne figurent PAS dans $Q_r$. L'expression du
          quotient de réaction ne renseigne d'ailleurs en rien sur le montage.
      - id: D
        text: >-
          Le fil ferme le circuit et le pont salin fixe les exposants de $Q_r$,
          lesquels dépendent du montage choisi
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.exposants-oublies
        feedback: >
          Les exposants de $Q_r$ sont les coefficients stœchiométriques de
          l'équation-bilan : ils ne dépendent ni du montage, ni du pont salin, ni
          de rien d'autre que de l'équation elle-même. Une même réaction menée en
          bécher ou en pile a le même $Q_r$.
    correct_feedback: >
      Deux circuits, deux porteurs. Le fil conducteur transporte les ÉLECTRONS
      entre les électrodes ; le pont salin laisse migrer les IONS pour compenser
      les charges qui s'accumuleraient sinon dans chaque compartiment.
    solution: |
      **Le fil.** Les électrons quittent l'anode (oxydation) et rejoignent la
      cathode (réduction) en passant par le circuit extérieur. C'est ce
      déplacement que le courant mesure.

      **Le pont salin.** Sans lui, la solution d'un compartiment s'enrichirait en
      charges positives et l'autre en charges négatives : l'accumulation
      stopperait la réaction en quelques instants. Les ions du pont migrent pour
      rétablir l'électroneutralité.

      **Ce qui ne change pas selon le montage.** L'équation-bilan, l'expression de
      $Q_r$, la valeur de $K$ et le sens d'évolution prévu. Seule change la
      manière dont l'énergie est récupérée — en chaleur (transfert direct) ou en
      travail électrique (pile).

  - id: ES-29
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_evolution_spontanee
    tags: []
    primary_misconception: mc.chemistry.pc_evolution_spontanee.spontane-egale-instantane
    stem: >
      Une pile zinc-cuivre débite un courant faible pendant plusieurs jours : le
      zinc s'y consomme lentement. Que conclure de cette lenteur ?
    type: mcq
    choices:
      - id: A
        text: >-
          Rien sur le sens : la réaction est bien spontanée dans le sens observé,
          la vitesse relevant d'une autre question
        correct: true
      - id: B
        text: >-
          Qu'elle n'est pas réellement spontanée : une réaction spontanée se
          produirait quasi instantanément
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.spontane-egale-instantane
        feedback: >
          « Spontané » ne veut pas dire « rapide ». Le mot désigne le SENS dans
          lequel un système évolue de lui-même, sans apport extérieur. Une pile
          qui dure des mois est parfaitement spontanée — c'est même ce qu'on lui
          demande. La vitesse dépend de la surface des électrodes, de la
          concentration, de la résistance du circuit.
      - id: C
        text: >-
          Que le zinc se réduit lentement : céder des électrons, c'est subir une
          réduction
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.oxydation-reduction-inversees
        feedback: >
          Les définitions sont inversées : céder des électrons, c'est s'OXYDER.
          Le zinc passe de $Zn$ à $Zn^{2+}$ — il perd deux électrons, donc il
          s'oxyde, et l'électrode de zinc est l'anode de la pile.
      - id: D
        text: >-
          Que la réaction inverse est tout aussi spontanée, ce qui explique la
          lenteur du bilan observé
        correct: false
        misconception: mc.chemistry.pc_evolution_spontanee.sens-symetrique
        feedback: >
          Un seul sens est spontané, celui que désigne la comparaison de
          $Q_{r,i}$ à $K$. Si les deux l'étaient, aucun courant net ne
          circulerait et la pile ne débiterait rien. La lenteur vient de la
          cinétique du transfert, pas d'une compensation entre deux sens.
    correct_feedback: >
      La lenteur ne dit rien du sens. Le critère $Q_{r,i}$ face à $K$ établit que
      la réaction évolue spontanément dans le sens observé ; la vitesse à
      laquelle elle le fait dépend de tout autre chose — surface des électrodes,
      concentrations, résistance du circuit.
    solution: |
      **Deux questions à ne pas mêler.** Le SENS (thermodynamique, par
      $Q_{r,i}$ face à $K$) et la VITESSE (cinétique, par les conditions
      expérimentales).

      **Ce que la pile illustre.** Sa lenteur est un avantage : une réaction
      spontanée mais lente délivre son énergie progressivement, au lieu de la
      dissiper d'un coup en chaleur comme le ferait un transfert direct dans un
      bécher.

      **Le vocabulaire du transfert.** Le zinc CÈDE des électrons : il s'oxyde,
      son électrode est l'anode. Les ions cuivre les CAPTENT : ils se réduisent,
      à la cathode.

