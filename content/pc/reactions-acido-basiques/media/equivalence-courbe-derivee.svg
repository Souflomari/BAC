<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 656 444"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="En haut, rappel de la courbe pH = f(V) avec son point d’inflexion ; en bas, la courbe dérivée dpH/dV = f(V), dont le maximum tombe exactement à la verticale de ce point d’inflexion, à V_E = 15,0 mL.">
  <title>Repérer l&#8217;équivalence — courbe dérivée dpH/dV</title>
  <!--
    equivalence-courbe-derivee.svg — figure STAGED (4 étapes), rung R10,
    méthode 2 (dérivée). Panneau composite : rappel de pH=f(V) en haut,
    courbe dérivée en bas, alignées verticalement sur le même axe V.

    Géométrie du panneau du HAUT (rappel, réduit) : même x(V)=90+20·V que
    equivalence-methode-tangentes.svg ; échelle pH compressée de moitié
    (y = 155 − 8·pH au lieu de 300 − 16·pH) — donc chaque point de la courbe
    du haut est l'image EXACTE du point correspondant de la grande courbe,
    via y_ici = 5 + 0,5·y_grande (vérifié point par point, pas redessiné à
    l'oeil) :
      V=0   → (90,131.8)     V=7,5 → (240,116.6)
      V=15,0→ (390,87)  [point d'inflexion, = équivalence]
      V=25  → (590,60.6)

    Géométrie du panneau du BAS (le sujet de la figure) : dpH/dV = f(V) en
    UNITÉS ARBITRAIRES (le programme ne donne aucune valeur numérique de
    pente — seule l'ALLURE, faible loin du saut et maximale au saut, est
    exigée ; l'axe est donc étiqueté « u.a. » plutôt que doté d'une échelle
    inventée). Ligne de base (dpH/dV faible) à y=377/380 (quasi confondue
    avec l'axe, jamais EXACTEMENT nulle — cf. la mise en garde du texte),
    pic à (390,205), aligné en x sur le point d'inflexion du panneau du haut.

    Rôle des couleurs (une seule idée en accent : L'ALIGNEMENT VERTICAL entre
    le point d'inflexion du haut et le maximum du bas, à V_E) :
      lien vertical + maximum + repère V_E     : --figure-accent
      courbe pH=f(V) du rappel (ink-soft, fine): --figure-ink-soft
      courbe dérivée (le sujet)                : --figure-ink

    Mise en étapes (axes → données → lecture) :
      step-1 : rappel du panneau du haut — la courbe pH=f(V) et son point
               d'inflexion, déjà connu du rung précédent.
      step-2 : les axes du panneau du bas — V en abscisse, dpH/dV en
               ordonnée (unités arbitraires).
      step-3 : la courbe dpH/dV = f(V) se dessine.
      step-4 : le maximum de la dérivée, aligné verticalement sur le point
               d'inflexion du haut — V_E = 15,0 mL, repéré par les deux
               méthodes.
  -->

  <!-- Titre -->
  <text x="320" y="18" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Repérer l&#8217;équivalence — courbe dérivée dpH/dV</text>

  <!-- Fond des deux panneaux -->
  <rect x="40" y="28" width="592" height="140" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>
  <rect x="40" y="184" width="592" height="230" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — rappel : la courbe pH = f(V), panneau du haut
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <!-- Légende du panneau DANS le panneau, à droite de l'axe : posée à
         x=48 elle enjambait l'axe des ordonnées et imprimait « rappel » sur
         l'étiquette « pH » (recouvrement mesuré 100 %, le mot rendu
         illisible : « rappepH— pH = f(V) »). -->
    <text x="100" y="52" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">rappel — pH = f(V)</text>

    <line x1="78" y1="155" x2="612" y2="155" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <polygon points="612,155 602,151.5 602,158.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="160" x2="90" y2="38" stroke="var(--figure-ink-soft)" stroke-width="1.2"/>
    <polygon points="90,38 86.5,47 93.5,47" fill="var(--figure-ink-soft)"/>
    <text x="617" y="159" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">V</text>
    <text x="84" y="42" text-anchor="end" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">pH</text>

    <path d="M90,131.8
             C123.3,128.45 193.3,124.95 240,116.6
             C286.7,108.25 360,105.35 390,87
             C420,68.65 550,63.1 590,60.6"
          fill="none" stroke="var(--figure-ink-soft)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="390" cy="87" r="3.2" fill="var(--figure-ink-soft)"/>
    <!-- Étiquette SOUS la courbe : à y=82 elle était barrée par la courbe
         elle-même, qui remonte de (390;87) vers (420;69) et traversait le
         mot « point ». Collision texte↔tracé — invisible pour la sonde, qui
         ne compare que les textes entre eux. -->
    <text x="398" y="102" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">point d&#8217;inflexion</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — les axes du panneau du bas
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <line x1="78" y1="380" x2="612" y2="380" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="612,380 600,375.5 600,384.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="388" x2="90" y2="196" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,196 85.5,207 94.5,207" fill="var(--figure-ink-soft)"/>
    <text x="614" y="384" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">V (mL)</text>
    <text x="60" y="200" text-anchor="start" font-size="10" font-style="italic" fill="var(--figure-ink-soft)">dpH/dV (u.a.)</text>

    <line x1="90" y1="377" x2="90" y2="383" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="90" y="396" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <line x1="190" y1="377" x2="190" y2="383" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="190" y="396" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">5</text>
    <line x1="290" y1="377" x2="290" y2="383" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="290" y="396" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">10</text>
    <line x1="390" y1="377" x2="390" y2="383" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="390" y="396" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">15</text>
    <line x1="490" y1="377" x2="490" y2="383" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="490" y="396" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">20</text>
    <line x1="590" y1="377" x2="590" y2="383" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="590" y="396" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">25</text>
    <line x1="87" y1="380" x2="93" y2="380" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="383" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — la courbe dpH/dV = f(V)
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <path d="M90,377
             C160,371 220,362 270,355
             C320,345 355,260 390,205
             C425,260 460,345 510,355
             C550,362 575,372 590,377"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — le maximum, aligné verticalement sur le point
       d'inflexion du haut
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="390" y1="87" x2="390" y2="380" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="390" cy="205" r="4.5" fill="var(--figure-accent)"/>
    <text x="400" y="211" font-size="11" font-weight="600" fill="var(--figure-accent)">maximum de dpH/dV</text>
    <text x="400" y="227" font-size="11" font-weight="600"
          fill="var(--figure-accent)">V<tspan dy="3" font-size="8">E</tspan><tspan dy="-3"> = 15,0 mL</tspan></text>
  </g><!-- /step-4 -->

</svg>
