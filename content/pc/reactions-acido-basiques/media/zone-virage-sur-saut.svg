<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 656 404"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="La courbe pH = f(V) d'un dosage, pH_E ≈ 8,5 à V_E = 15,0 mL, avec trois zones de virage superposées : l'hélianthine (3,1–4,4) et le bleu de bromothymol (6,0–7,6), qui virent avant le saut, et la phénolphtaléine (8,2–10,0), dont la zone contient pH_E et coupe le saut — c'est elle qu'on retient.">
  <title>Choisir l&#8217;indicateur — zone de virage sur le saut</title>
  <!--
    zone-virage-sur-saut.svg — figure STAGED (4 étapes), rung R11.

    Même repère que equivalence-methode-tangentes.svg / equivalence-courbe-
    derivee.svg (cohérence du corpus) : x(V)=90+20·V, y(pH)=300−16·pH.
    Même courbe pH=f(V), mêmes 4 points ancrés (V_E/2=7,5→pH=4,8 ;
    V_E=15,0→pH_E≈8,5).

    Zones de virage (bornes EXACTES du texte R11), converties en y via
    y=300−16·pH :
      hélianthine      : 3,1–4,4  → y = 250,4 .. 229,6  (hauteur 20,8)
      BBT              : 6,0–7,6  → y = 204,0 .. 178,4  (hauteur 25,6)
      phénolphtaléine  : 8,2–10,0 → y = 168,8 .. 140,0  (hauteur 28,8)
    Seule la bande de la phénolphtaléine contient pH_E ≈ 8,5 (y=164, bien
    entre 140 et 168,8) — vérifié par construction, pas par coïncidence
    graphique : c'est exactement le calcul du texte.

    Rôle des couleurs (une seule idée en accent : la bande RETENUE) :
      bande phénolphtaléine (contient pH_E, coupe le saut) : --figure-accent
      bandes hélianthine / BBT (ne contiennent pas pH_E)   : --figure-ink-soft
      courbe pH=f(V), point E (rappel neutre)               : --figure-ink

    Mise en étapes (axes → données → lecture) :
      step-1 : les axes.
      step-2 : la courbe pH = f(V), avec le point d'équivalence E déjà
               repéré au rung précédent (rappel neutre).
      step-3 : les deux zones de virage qui ne conviennent pas — hélianthine
               et BBT, toutes deux avant le saut.
      step-4 : la zone de virage de la phénolphtaléine, qui contient pH_E
               et coupe le saut — c'est elle qu'on retient.
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Choisir l&#8217;indicateur — la zone de virage sur le saut</text>

  <!-- Fond du panneau -->
  <rect x="40" y="34" width="592" height="296" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="78" y1="300" x2="612" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="612,300 600,295.5 600,304.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="312" x2="90" y2="50" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,50 85.5,61 94.5,61" fill="var(--figure-ink-soft)"/>
    <text x="614" y="304" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">V (mL)</text>
    <text x="84" y="44" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">pH</text>

    <line x1="90" y1="297" x2="90" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="90" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <line x1="190" y1="297" x2="190" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="190" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">5</text>
    <line x1="290" y1="297" x2="290" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="290" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">10</text>
    <line x1="390" y1="297" x2="390" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="390" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">15</text>
    <line x1="490" y1="297" x2="490" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="490" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">20</text>
    <line x1="590" y1="297" x2="590" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="590" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">25</text>

    <line x1="87" y1="300" x2="93" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="303" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <line x1="87" y1="236" x2="93" y2="236" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="239" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">4</text>
    <line x1="87" y1="172" x2="93" y2="172" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="175" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">8</text>
    <line x1="87" y1="108" x2="93" y2="108" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="111" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">12</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la courbe pH = f(V) et le point d'équivalence E
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="M90,253.6
             C123.3,246.9 193.3,239.9 240,223.2
             C286.7,206.5 360,200.7 390,164
             C420,127.3 550,116.2 590,111.2"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="390" cy="164" r="3.6" fill="var(--figure-ink)"/>
    <text x="399" y="150" font-size="10.5" fill="var(--figure-ink)">E (pH<tspan dy="3" font-size="7.5">E</tspan><tspan dy="-3"> ≈ 8,5)</tspan></text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — hélianthine et BBT : ne contiennent pas pH_E
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <rect x="90" y="229.6" width="516" height="20.8"
          fill="var(--figure-ink-soft)" fill-opacity="0.14"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="602" y="236" text-anchor="end" font-size="10" font-weight="600" fill="var(--figure-ink-soft)">hélianthine (3,1–4,4)</text>
    <text x="602" y="249" text-anchor="end" font-size="9" font-style="italic" fill="var(--figure-ink-soft)">vire trop tôt</text>

    <rect x="90" y="178.4" width="516" height="25.6"
          fill="var(--figure-ink-soft)" fill-opacity="0.14"
          stroke="var(--figure-ink-soft)" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="602" y="187" text-anchor="end" font-size="10" font-weight="600" fill="var(--figure-ink-soft)">BBT (6,0–7,6)</text>
    <text x="602" y="200" text-anchor="end" font-size="9" font-style="italic" fill="var(--figure-ink-soft)">vire trop tôt</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — phénolphtaléine : contient pH_E, coupe le saut
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <rect x="90" y="140" width="516" height="28.8"
          fill="var(--figure-accent)" fill-opacity="0.16"
          stroke="var(--figure-accent)" stroke-width="1.6"/>
    <text x="602" y="150" text-anchor="end" font-size="10" font-weight="700" fill="var(--figure-accent)">phénolphtaléine (8,2–10,0)</text>
    <text x="602" y="163" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--figure-accent)">coupe le saut — retenue</text>
  </g><!-- /step-4 -->

</svg>
