<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 656 404"
     font-family="'IBM Plex Sans', system-ui, sans-serif"
     aria-label="Courbe pH = f(V) d’un dosage, avec la méthode des tangentes : deux tangentes parallèles de part et d’autre du saut, et leur parallèle équidistante qui coupe la courbe au point d’équivalence E, V_E = 15,0 mL, pH_E ≈ 8,5.">
  <title>Repérer l&#8217;équivalence — méthode des tangentes</title>
  <!--
    equivalence-methode-tangentes.svg — figure STAGED (4 étapes), rung R10.

    Fil rouge (repris tel quel du texte R9-R10) : dosage de l'acide
    éthanoïque par la soude, V_E = 15,0 mL, pH_E ≈ 8,5, demi-équivalence à
    V_E/2 = 7,5 mL où pH ≈ pKA ≈ 4,8.

    Géométrie du repère (échelle propre à cette figure, réutilisée par les
    figures sœurs equivalence-courbe-derivee.svg / zone-virage-sur-saut.svg /
    lecture-Ve-courbe-dosage.svg — cohérence du corpus) :
      x(V)  = 90 + 20·V     (0 → x=90, 25 mL → x=590 ; 5 mL/tick = 100 px)
      y(pH) = 300 − 16·pH   (0 → y=300, 14 → y=76 ; 2 unités/tick = 32 px)
    Points de la courbe, ancrés sur les valeurs EXACTES du texte :
      V=0   pH≈2,9   (départ schématique, valeur non fournie par le texte —
                       aucun label numérique n'est posé sur ce point)
      V=7,5 pH=4,8    (demi-équivalence = pKA, texte R4/R10)
      V=15,0 pH≈8,5   (équivalence, texte R9/R10)
      V=25  pH≈11,8  (fin schématique, non fournie par le texte — non labellée)
    La courbe elle-même (allure sigmoïde) est un tracé Bézier lissé passant
    PAR ces 4 points ancrés ; ce n'est PAS une résolution analytique du pH
    (hors-cadre, cf. texte R9 : « pH par exploitation expérimentale »ّ) — la
    forme est schématique, seuls les 2 points nommés (V_E/2 et V_E) portent
    un nombre.

    Méthode des tangentes (le sujet de la figure) : deux droites de MÊME
    pente m = −0,22 (px), l'une tangente à la portion plate AVANT le saut
    (vers V≈5 mL), l'autre APRÈS le saut (vers V≈22 mL) ; leur parallèle
    équidistante est construite pour passer EXACTEMENT par le point
    d'équivalence (390,164) — contrainte dure de la figure, vérifiée par
    construction (droite médiane = moyenne des deux ordonnées à x fixé).

    Rôle des couleurs (une seule idée en accent : LA MÉDIANE et le point E
    qu'elle repère — le reste est construction ou donnée) :
      médiane + point E + repères V_E/pH_E   : --figure-accent
      courbe pH = f(V)                        : --figure-ink
      deux tangentes (construction)           : --figure-ink-soft
      axes / ticks                            : --figure-ink-soft

    Mise en étapes (axes → données → lecture, LESSON-EXPERIENCE-SPEC §2.5) :
      step-1 : les axes.
      step-2 : la courbe expérimentale pH = f(V).
      step-3 : les deux tangentes, parallèles, de part et d'autre du saut.
      step-4 : la médiane équidistante, qui coupe la courbe au point E.
  -->

  <!-- Titre -->
  <text x="320" y="20" text-anchor="middle"
        font-size="12" font-weight="600" letter-spacing="0.01em"
        fill="var(--figure-ink)">Repérer l&#8217;équivalence — méthode des tangentes</text>

  <!-- Fond du panneau -->
  <rect x="40" y="34" width="592" height="296" rx="6"
        fill="var(--figure-surface)" stroke="var(--figure-grid)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1 — les axes
       ══════════════════════════════════════════════════════ -->
  <g id="step-1">
    <line x1="78" y1="300" x2="612" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="612,300 600,295.5 600,304.5" fill="var(--figure-ink-soft)"/>
    <line x1="90" y1="312" x2="90" y2="50" stroke="var(--figure-ink-soft)" stroke-width="1.4"/>
    <polygon points="90,50 85.5,61 94.5,61" fill="var(--figure-ink-soft)"/>
    <text x="604" y="304" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">V (mL)</text>
    <text x="84" y="44" text-anchor="end" font-size="11" font-style="italic" fill="var(--figure-ink-soft)">pH</text>

    <line x1="90" y1="297" x2="90" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="90" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <line x1="190" y1="297" x2="190" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="190" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">5</text>
    <line x1="290" y1="297" x2="290" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="290" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">10</text>
    <line x1="390" y1="297" x2="390" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="390" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">15</text>
    <line x1="490" y1="297" x2="490" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="490" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">20</text>
    <line x1="590" y1="297" x2="590" y2="303" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="590" y="316" text-anchor="middle" font-size="10" fill="var(--figure-ink-soft)">25</text>

    <line x1="87" y1="300" x2="93" y2="300" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="303" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">0</text>
    <line x1="87" y1="236" x2="93" y2="236" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="239" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">4</text>
    <line x1="87" y1="172" x2="93" y2="172" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="175" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">8</text>
    <line x1="87" y1="108" x2="93" y2="108" stroke="var(--figure-ink-soft)" stroke-width="1.1"/>
    <text x="80" y="111" text-anchor="end" font-size="10" fill="var(--figure-ink-soft)">12</text>
  </g><!-- /step-1 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 2 — la courbe pH = f(V)
       ══════════════════════════════════════════════════════ -->
  <g id="step-2">
    <path d="M90,253.6
             C123.3,246.9 193.3,239.9 240,223.2
             C286.7,206.5 360,200.7 390,164
             C420,127.3 550,116.2 590,111.2"
          fill="none" stroke="var(--figure-ink)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="560" y="98" text-anchor="middle" font-size="10.5" fill="var(--figure-ink)">pH = f(V)</text>
  </g><!-- /step-2 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 3 — deux tangentes parallèles, de part et d'autre du saut
       ══════════════════════════════════════════════════════ -->
  <g id="step-3">
    <line x1="110" y1="254.2" x2="270" y2="219.0"
          stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="5,3"/>
    <circle cx="190" cy="236.6" r="2.8" fill="var(--figure-ink-soft)"/>
    <text x="112" y="266" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">tangente avant le saut</text>

    <line x1="460" y1="133.9" x2="606" y2="101.8"
          stroke="var(--figure-ink-soft)" stroke-width="1.6" stroke-dasharray="5,3"/>
    <circle cx="530" cy="118.5" r="2.8" fill="var(--figure-ink-soft)"/>
    <!-- DESCENDUE SOUS LA PARALLÈLE (2026-09-04) : à y=146 elle était couchée
         sur la parallèle équidistante, qui descend de y=148 à y=124 sur sa
         longueur et la rayait sur 33 %. En dessous, jusqu'à l'axe, rien. -->
    <text x="462" y="166" font-size="9.5" font-style="italic" fill="var(--figure-ink-soft)">tangente après le saut</text>
  </g><!-- /step-3 -->

  <!-- ══════════════════════════════════════════════════════
       STEP 4 — la médiane équidistante, point d'équivalence E
       ══════════════════════════════════════════════════════ -->
  <g id="step-4">
    <line x1="150" y1="216.8" x2="610" y2="115.6"
          stroke="var(--figure-accent)" stroke-width="1.8"/>
    <!-- DESCENDUE de 24 px (2026-09-04) : posée sur la droite qu'elle nomme
         (30 % rayés). Descendue d'abord de 24 px, elle tombait sur la
         TANGENTE AVANT LE SAUT et sur la courbe — la bande entre les deux
         droites est plus étroite qu'elle n'en a l'air. Au-dessus de la
         parallèle, entre elle et la ligne pointillée de pH_E, la place
         existe vraiment. -->
    <text x="160" y="174" font-size="10.5" font-weight="600" fill="var(--figure-accent)">parallèle équidistante</text>

    <line x1="390" y1="164" x2="390" y2="300" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="90" y1="164" x2="390" y2="164" stroke="var(--figure-accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="390" cy="164" r="4.5" fill="var(--figure-accent)"/>
    <text x="399" y="149" font-size="12" font-weight="700" fill="var(--figure-accent)">E</text>
    <text x="404" y="200" font-size="11" font-weight="600"
          fill="var(--figure-accent)">V<tspan dy="3" font-size="8">E</tspan><tspan dy="-3"> = 15,0 mL</tspan></text>
    <text x="98" y="182" text-anchor="start" font-size="11" font-weight="600"
          fill="var(--figure-accent)">pH<tspan dy="3" font-size="8">E</tspan><tspan dy="-3"> ≈ 8,5</tspan></text>
  </g><!-- /step-4 -->

</svg>
