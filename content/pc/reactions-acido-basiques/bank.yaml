    intro: |-
      **Étude d'une solution d'acide propanoïque, puis dosage pH-métrique (examen national, session normale 2022).**

      L'acide propanoïque, de formule $\text{C}_2\text{H}_5\text{-COOH}$, est utilisé comme conservateur alimentaire et dans la synthèse des anti-inflammatoires. Toutes les mesures sont faites à $25\,^\circ\text{C}$.

      **1. Solution aqueuse d'acide propanoïque.** On prépare une solution aqueuse $S_a$ d'acide propanoïque de concentration $C_a = 5\times10^{-2}\ \text{mol/L}$. La mesure de son pH donne $\text{pH} = 3{,}1$.

      **2. Dosage.** Pour vérifier $C_a$, on dose $V_a = 20\ \text{mL}$ de $S_a$ par une solution d'hydroxyde de sodium $\left(\text{Na}^+_{(aq)} + \text{HO}^-_{(aq)}\right)$ de concentration $C_b = 5\times10^{-2}\ \text{mol/L}$. La solution $S_a$ a elle-même été préparée en diluant $10$ fois une solution $S_0$ d'acide propanoïque pur, de masse molaire $M = 74\ \text{g/mol}$.

      **Figure 2 (courbe double).** Sur un même repère : la courbe de dosage $\text{pH} = f(V_b)$ (croissante, départ mesuré $\text{pH} \approx 3{,}15$ à $V_b = 0$, cohérent avec le pH de $S_a$) et la courbe dérivée $\dfrac{d\text{pH}}{dV_b} = f(V_b)$. Le saut de la première courbe et le pic de la seconde tombent tous deux, au pixel près, exactement sur le trait de grille $V_b = 20{,}0\ \text{mL}$. La courbe dérivée n'a pas d'échelle d'ordonnée propre — un seul axe vertical, gradué en pH — donc son amplitude n'est pas lisible, seule l'abscisse de son pic compte ici. Une étiquette encadrée « $dpH/dV_b$ », munie d'une flèche, est placée sur la figure : sa pointe touche la queue descendante de la courbe dérivée, vers $V_b \approx 21{,}7\ \text{mL}$ — elle sert seulement à identifier quelle courbe est la dérivée, elle ne désigne pas le sommet du pic ni l'équivalence.
    questions:
      - id: q1
        part: "1. Solution aqueuse d'acide propanoïque"
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction entre l'acide propanoïque et l'eau.
        reasoning: |-
          La mise en solution d'un acide **faible** est une transformation **limitée** : elle s'arrête sur un équilibre, donc double flèche $\rightleftharpoons$ (rung 7). L'acide $\text{C}_2\text{H}_5\text{COOH}$ cède un proton à l'eau, qui joue ici le rôle de base (couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$).

          $$\text{C}_2\text{H}_5\text{COOH}_{(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{C}_2\text{H}_5\text{COO}^-_{(aq)} + \text{H}_3\text{O}^+_{(aq)}$$
      - id: q2
        stem: |-
          **(0,75 pt)** Calculer le taux d'avancement final $\tau$ de cette réaction. Que peut-on conclure ?
        reasoning: |-
          Le taux d'avancement final compare l'avancement atteint à l'avancement maximal, $\tau = x_f/x_{max}$ (rung 6). Chaque acide dissocié libère un $\text{H}_3\text{O}^+$, donc l'avancement final se lit sur $[\text{H}_3\text{O}^+]_{eq}$, tiré du pH ; une conversion totale de l'acide apporté donnerait $[\text{H}_3\text{O}^+]_{max} = C_a$.
        steps:
          - math: '[\text{H}_3\text{O}^+]_{eq} = 10^{-\text{pH}} = 10^{-3{,}1} \approx 7{,}9\times10^{-4}\ \text{mol/L}'
            note: "Concentration effective en ions oxonium, tiree du pH."
          - math: '\tau = \dfrac{[\text{H}_3\text{O}^+]_{eq}}{C_a} = \dfrac{7{,}9\times10^{-4}}{5\times10^{-2}} \approx 1{,}6\times10^{-2} = 1{,}6\ \%'
            note: "tau = avancement final / avancement maximal (rung 6) ; le maximal correspond a [H3O+] = Ca. Tau tres petit (1,6 %) : conclusion, l'acide propanoique est un acide faible, tres peu dissocie."
      - id: q3
        stem: |-
          **(0,75 pt)** Exprimer le quotient de réaction $Q_{r,\text{éq}}$ à l'équilibre en fonction de $C_a$ et $[\text{H}_3\text{O}^+_{(aq)}]_{\text{éq}}$. Calculer sa valeur.
        reasoning: |-
          On écrit les concentrations d'équilibre à partir du tableau d'avancement (rung 4) : chaque acide dissocié forme un $\text{C}_2\text{H}_5\text{COO}^-$ et un $\text{H}_3\text{O}^+$ en quantités égales, donc $[\text{C}_2\text{H}_5\text{COO}^-]_{eq} \approx [\text{H}_3\text{O}^+]_{eq}$ ; il reste $[\text{C}_2\text{H}_5\text{COOH}]_{eq} \approx C_a - [\text{H}_3\text{O}^+]_{eq}$ de l'acide non dissocié. On reporte dans le quotient associé à l'équation de la question 1.
        steps:
          - math: 'Q_{r,\text{éq}} = \dfrac{[\text{C}_2\text{H}_5\text{COO}^-]_{eq}\,[\text{H}_3\text{O}^+_{(aq)}]_{\text{éq}}}{[\text{C}_2\text{H}_5\text{COOH}]_{eq}} = \dfrac{[\text{H}_3\text{O}^+_{(aq)}]_{\text{éq}}^{2}}{C_a - [\text{H}_3\text{O}^+_{(aq)}]_{\text{éq}}}'
            note: "On remplace [C2H5COO-]eq par [H3O+]eq (produits formes a parts egales) et [C2H5COOH]eq par Ca - [H3O+]eq."
          - math: 'Q_{r,\text{éq}} = \dfrac{\left(7{,}9\times10^{-4}\right)^{2}}{5\times10^{-2} - 7{,}9\times10^{-4}} \approx 1{,}28\times10^{-5}'
            note: "Application numerique avec Ca = 5.10^-2 mol/L."
      - id: q4
        stem: |-
          **(0,5 pt)** En déduire la valeur du $pK_A$ du couple $\text{C}_2\text{H}_5\text{COOH}_{(aq)}/\text{C}_2\text{H}_5\text{COO}^-_{(aq)}$.
        reasoning: |-
          À l'équilibre, $Q_{r,\text{éq}}$ atteint la constante d'équilibre de la réaction de la question 1 : c'est la constante d'acidité $K_A$ du couple (rung 4). On en tire $pK_A = -\log K_A$.
        steps:
          - math: 'K_A = Q_{r,\text{éq}} \approx 1{,}28\times10^{-5}'
            note: "A l'equilibre, le quotient de reaction atteint la constante d'acidite KA (rung 4)."
          - math: 'pK_A = -\log K_A = -\log\left(1{,}28\times10^{-5}\right) \approx 4{,}89'
            note: "Valeur proche de celle tabulee pour l'acide propanoique (4,87)."
      - id: q5
        part: "2. Dosage d'une solution aqueuse d'acide propanoïque"
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction du dosage.
        reasoning: |-
          Réaction support d'un titrage : totale, rapide, unique — flèche simple (rung 9). L'acide faible $\text{C}_2\text{H}_5\text{COOH}$ cède son proton à l'ion $\text{HO}^-$ de la soude, base forte.

          $$\text{C}_2\text{H}_5\text{COOH}_{(aq)} + \text{HO}^-_{(aq)} \rightarrow \text{C}_2\text{H}_5\text{COO}^-_{(aq)} + \text{H}_2\text{O}_{(l)}$$
      - id: q6
        stem: |-
          **(0,25 pt)** Déterminer graphiquement le volume $V_{bE}$ de la solution $S_b$ versé à l'équivalence.
        reasoning: |-
          On repère $V_{bE}$ au maximum de la courbe dérivée $d\text{pH}/dV_b$ (rung 10, méthode 2) : ce maximum tombe exactement sur le trait de grille $V_b = 20\ \text{mL}$ — confirmé par le saut de la courbe $\text{pH} = f(V_b)$ elle-même, dont le point d'inflexion tombe au même endroit (rung 10 : les deux méthodes s'accordent). L'étiquette fléchée $d\text{pH}/dV_b$ de la figure désigne seulement la queue de la courbe, vers $V_b \approx 21{,}7\ \text{mL}$ — elle identifie la courbe, pas le sommet du pic ni l'équivalence.

          $$V_{bE} = 20{,}0\ \text{mL}$$
      - id: q7
        stem: |-
          **(0,5 pt)** Vérifier la valeur de la concentration $C_a$.
        reasoning: |-
          À l'équivalence, la quantité d'acide initialement présente égale la quantité de base versée : $C_a V_a = C_b V_{bE}$ (rung 9).
        steps:
          - math: 'C_a = \dfrac{C_b\,V_{bE}}{V_a} = \dfrac{5\times10^{-2} \times 20{,}0}{20} = 5\times10^{-2}\ \text{mol/L}'
            note: "VbE = 20,0 mL (question precedente), Va = 20 mL, Cb = 5.10^-2 mol/L : on retrouve exactement la valeur de Ca utilisee dans la sous-partie 1."
      - id: q8
        stem: |-
          **(0,5 pt)** La solution $S_a$ a été préparée en diluant 10 fois une solution aqueuse $S_0$ d'acide propanoïque. Déterminer la masse $m$ d'acide propanoïque pur dissout dans un litre de la solution $S_0$.
        reasoning: |-
          $S_a$ est $S_0$ diluée $10$ fois (rung 6) : sa concentration a été divisée par $10$, donc on multiplie par $10$ pour retrouver $C_0$. On convertit ensuite cette concentration molaire en masse dissoute dans $1\ \text{L}$ via la masse molaire $M$.
        steps:
          - math: 'C_0 = 10 \times C_a = 10 \times 5\times10^{-2} = 0{,}5\ \text{mol/L}'
            note: "Sa est S0 diluee 10 fois : on multiplie par 10 pour remonter a C0."
          - math: 'm = C_0 \times M = 0{,}5 \times 74 = 37\ \text{g}'
            note: "Masse dissoute dans 1 L de S0 (concentration molaire fois masse molaire)."
      - id: q9
        stem: |-
          **(0,5 pt)** Pour un volume $V_b = 5\ \text{mL}$ de la solution $S_b$ versée, déterminer le pourcentage de la forme acide du couple $\text{C}_2\text{H}_5\text{COOH}_{(aq)}/\text{C}_2\text{H}_5\text{COO}^-_{(aq)}$ dans le mélange réactionnel.
        reasoning: |-
          $V_b = 5\ \text{mL}$ est avant l'équivalence ($V_{bE} = 20{,}0\ \text{mL}$) : la réaction de dosage y est totale (rung 9), donc chaque mole de $\text{HO}^-$ versée convertit une mole de $\text{C}_2\text{H}_5\text{COOH}$ en $\text{C}_2\text{H}_5\text{COO}^-$ — même tableau d'avancement que pour l'équivalence elle-même, arrêté avant terme. Les deux formes du couple partagent le même volume total, donc le pourcentage en concentration est aussi le pourcentage en quantité de matière (rung 8, définition du pourcentage).
        steps:
          - math: 'n(\text{C}_2\text{H}_5\text{COO}^-) = C_b V_b \qquad n(\text{C}_2\text{H}_5\text{COOH}) = C_a V_a - C_b V_b = C_b V_{bE} - C_b V_b'
            note: "Reaction totale (rung 9) ; on utilise Ca Va = Cb VbE (question 7)."
          - math: '\%\,\text{C}_2\text{H}_5\text{COOH} = \dfrac{n(\text{C}_2\text{H}_5\text{COOH})}{n(\text{C}_2\text{H}_5\text{COOH}) + n(\text{C}_2\text{H}_5\text{COO}^-)}\times100 = \dfrac{V_{bE}-V_b}{V_{bE}}\times100 = \dfrac{20-5}{20}\times100 = 75\ \%'
            note: "Le facteur Cb se simplifie ; il reste un rapport de volumes (rung 8, definition du pourcentage)."

