          **2-1- (0,5 pt)** Écrire l'équation de la réaction du dosage.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Toujours la même construction (chapitre 2) : on identifie les deux couples réellement présents dans le bécher, on écrit leurs demi-équations en sens opposés, on additionne. Puis on choisit la flèche — et ce choix se justifie.

          Dans le bécher : la base $R\text{-}NH_2$ du couple $R\text{-}NH_3^{+}/R\text{-}NH_2$, et l'ion $\text{H}_3\text{O}^+$ versé, qui est l'acide du couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$. L'ion $\text{Cl}^-$ est spectateur : il accompagne l'acide chlorhydrique sans jamais échanger de proton.

          $$R\text{-}NH_{2(aq)} + H^+ \rightleftharpoons R\text{-}NH^{+}_{3(aq)} \qquad\text{et}\qquad \text{H}_3\text{O}^+_{(aq)} \rightleftharpoons \text{H}_2\text{O}_{(l)} + H^+$$

          On additionne, le $H^+$ disparaît :

          $$\boxed{R\text{-}NH_{2(aq)} + \text{H}_3\text{O}^+_{(aq)} \longrightarrow R\text{-}NH^{+}_{3(aq)} + \text{H}_2\text{O}_{(l)}}$$

          **Le contrôle qui justifie la flèche simple.** Une réaction ne sert de support à un titrage que si elle est totale, rapide et unique — donc si $K \gg 1$ (chapitre 10). Le chapitre 8 donne $K$ comme rapport des deux constantes d'acidité, celle du couple dont l'**acide** réagit sur celle du couple dont la **base** réagit :

          $$K = \frac{K_A\left(\text{H}_3\text{O}^+/\text{H}_2\text{O}\right)}{K_A\left(R\text{-}NH_3^{+}/R\text{-}NH_2\right)} = \frac{1}{10^{-10{,}8}} = 10^{10{,}8} \approx 6{,}3\cdot10^{10}$$

          Soixante milliards : la réaction est quasi totale, la flèche simple est méritée.

          **Le piège de cette question.** Ce dosage est le **miroir** de celui des chapitre 10 à 11. Dans le cours, on verse la base forte $\text{HO}^-$ sur un acide faible et le pH **monte** ; ici on verse l'acide fort $\text{H}_3\text{O}^+$ sur une base faible et le pH **descend**. Ne recopie donc pas l'équation-type $AH + \text{HO}^- \to A^- + \text{H}_2\text{O}$ : l'eau est bien encore produite, mais c'est la **base** qui est titrée et l'ion oxonium qui est consommé. Second piège, et il est spectaculaire ici : la **même** amine porte deux équations avec deux flèches différentes. Avec l'eau (question 1-1), double flèche, $\tau \approx 8\,\%$ ; avec $\text{H}_3\text{O}^+$ (ici), flèche simple, $K \approx 6\cdot10^{10}$. Rien ne se contredit — la flèche est une propriété de la **réaction** (de son $K$), jamais de l'espèce. Une base faible face à l'eau reste une base faible ; face à un acide fort, elle réagit quasi totalement.
