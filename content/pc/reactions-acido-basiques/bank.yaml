          **1-1- (0,5 pt)** Écrire l'équation de la réaction de $R\text{-}NH_2$ avec l'eau.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une réaction acido-basique combine toujours **deux couples** (chapitre 2) : on écrit les deux demi-équations en sens opposés, on additionne, et le proton $H^+$ s'annule dans la somme. Ici l'énoncé donne le premier couple — $R\text{-}NH_3^{+}/R\text{-}NH_2$, dont l'amine est la **base**. Le second est nécessairement un couple de l'eau ; comme l'amine capte un proton, c'est l'eau qui le **cède**, donc l'eau joue ici son rôle d'**acide**, dans le couple $\text{H}_2\text{O}/\text{HO}^-$.

          $$R\text{-}NH_{2(aq)} + H^+ \rightleftharpoons R\text{-}NH^{+}_{3(aq)} \qquad\text{et}\qquad \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{HO}^-_{(aq)} + H^+$$

          On additionne, le $H^+$ disparaît :

          $$\boxed{R\text{-}NH_{2(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons R\text{-}NH^{+}_{3(aq)} + \text{HO}^-_{(aq)}}$$

          **Pourquoi la double flèche, et pas une flèche simple.** L'énoncé annonce une base **faible** ; sa mise en solution est une transformation **limitée**, qui s'arrête sur un équilibre (chapitre 8). Tu peux le vérifier en deux lignes, avec les seuls chiffres de l'énoncé. Du pH on tire $[\text{H}_3\text{O}^+]$, puis $[\text{HO}^-]$ par le produit ionique de l'eau (chapitre 4) :

          $$[\text{HO}^-]_{eq} = \frac{K_e}{[\text{H}_3\text{O}^+]_{eq}} = 10^{\,\text{pH}-14} = 10^{11{,}88-14} = 10^{-2{,}12} \approx 7{,}6\cdot10^{-3}\ \text{mol.L}^{-1}$$

          Chaque amine ayant réagi produit exactement un $\text{HO}^-$, donc l'avancement final se lit sur cette concentration ; une conversion **totale** en produirait $C_B$. Le taux d'avancement final (chapitre 7) vaut donc :

          $$\tau = \frac{[\text{HO}^-]_{eq}}{C_B} = \frac{7{,}6\cdot10^{-3}}{9{,}0\cdot10^{-2}} \approx 0{,}084$$

          Environ $8\,\%$ de l'amine seulement a réagi : plus de neuf molécules sur dix sont restées intactes. La transformation est bel et bien limitée, la double flèche est méritée.

          **Le piège de cette question.** Ne fais pas produire $\text{H}_3\text{O}^+$ à une base. C'est le réflexe de l'élève qui a trop travaillé les acides : il écrit $R\text{-}NH_2 + \text{H}_2\text{O} \rightleftharpoons R\text{-}NH_3^{+} + \text{H}_3\text{O}^+$, et l'équation n'est même plus équilibrée en atomes d'hydrogène. Une **base** arrache un proton à l'eau, et l'eau appauvrie d'un proton est $\text{HO}^-$ — jamais $\text{H}_3\text{O}^+$. Second piège, celui du chapitre 2 : l'eau est un **ampholyte**. Dans la réaction d'un acide avec l'eau, elle est base (couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$) ; ici elle est acide (couple $\text{H}_2\text{O}/\text{HO}^-$). Ce n'est pas la même moitié du même couple : c'est deux couples différents, et écrire le mauvais fait rater l'équation d'entrée.
