    intro: |-
      **Étude d'une solution aqueuse d'une base (examen national, session de rattrapage 2024 — Exercice 1, Partie 2, 4,75 points).**

      Dans cette partie de l'exercice on se propose d'étudier une solution aqueuse d'une amine $R\text{-}NH_2$ où $R$ est une chaîne carbonée. Cette amine a un caractère basique, elle se transforme en son acide conjugué $R\text{-}NH_3^{+}$.

      On prépare une solution aqueuse $S_B$ de cette amine de volume $V$ et de concentration $C_B = 9{,}0\cdot10^{-2}\ \text{mol.L}^{-1}$. La mesure de son pH donne $\text{pH} = 11{,}88$. Toutes les mesures sont effectuées à $25\,^\circ\text{C}$.

      **Figure 1 — le diagramme de distribution.** Les courbes de la figure 1 représentent le diagramme de distribution de la forme acide et de la forme basique du couple $R\text{-}NH^{+}_{3(aq)}\,/\,R\text{-}NH_{2(aq)}$. Le **pourcentage %** est en ordonnée, le **pH** en abscisse. Le cadre est quadrillé (traits majeurs sombres, sous-quadrillage fin). En abscisse, traits majeurs tous les $2$ pH, chiffrés $2,\ 4,\ 6,\ 8,\ 10,\ 12,\ 14$ : le cadre commence à $\text{pH} = 0$ (l'axe des ordonnées) et s'arrête exactement au trait $14$, qui est son bord droit. En ordonnée, traits majeurs tous les $20\,\%$, chiffrés $0,\ 20,\ 40,\ 60,\ 80,\ 100$ : le trait $100\,\%$ est le bord supérieur du cadre.

