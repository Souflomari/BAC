    intro: |-
      **Étude d'une solution aqueuse de méthylamine (examen national, session de rattrapage 2022 — Exercice 1, §2, 4,75 points).**

      *La méthylamine de formule semi-développée $\text{CH}_3\text{-NH}_2$ est utilisée dans l'industrie pharmaceutique comme constituant de plusieurs produits tels que des antispasmodiques ou des anesthésiques ou comme matière première pour la fabrication des insecticides.*

      Dans cette partie, on se propose d'étudier quelques propriétés d'une solution aqueuse de méthylamine.

      *Le §1 de cet exercice, indépendant, étudie l'électrolyse d'une solution de chlorure d'or (III) pour dorer une plaque de cuivre : il vit sous la notion « Électrolyse », entrée bk-2022-r-x1.*

      **1. Étude d'une solution aqueuse de méthylamine.** On prépare un volume $V = 1\ \text{L}$ d'une solution aqueuse $S_b$ de méthylamine de concentration $C_b = 10^{-2}\ \text{mol.L}^{-1}$. La mesure du pH de la solution $S_b$ à $25\ ^\circ\text{C}$ donne $\text{pH} = 11{,}3$.

      **Donnée :** le produit ionique de l'eau à $25\ ^\circ\text{C}$ : $K_e = 10^{-14}$.

      **2. Dosage d'une solution aqueuse de méthylamine.** Pour vérifier la valeur de la concentration $C_b$ de la solution aqueuse $S_b$, on réalise le dosage pH-métrique d'un volume $V_b = 15\ \text{mL}$ de la solution aqueuse $S_b$ par une solution aqueuse $S_a$ d'acide chlorhydrique $\left(\text{H}_3\text{O}^+_{(aq)} + \text{Cl}^-_{(aq)}\right)$ de concentration $C_a = 10^{-2}\ \text{mol.L}^{-1}$. La courbe de la figure ci-contre représente les variations du pH du milieu réactionnel en fonction du volume versé $V_a$ de la solution $S_a$.

      | Indicateur coloré | Hélianthine | Bleu de bromothymol | Rouge de crésol | Phénolphtaléine |
      |---|---|---|---|---|
      | Zone de virage | 3,0 - 4,6 | 6,0 - 7,6 | 7,2 - 8,8 | 8,2 – 10,0 |

      **Figure du dosage (courbe, sans numéro imprimé — « la figure ci-contre »).** Axe des ordonnées $\text{pH}$ gradué $0,\ 2,\ 4,\ 6,\ 8,\ 10,\ 12$ (quadrillage principal noir de pas $2$ ; le cadre monte jusqu'à $14$, trait principal non chiffré) ; axe des abscisses $V_a\ (\text{mL})$ gradué $3,\ 6,\ 9,\ 12,\ 15,\ 18,\ 21$ (pas principal noir $3\ \text{mL}$ ; le bord gauche du cadre est exactement $V_a = 0$ et le cadre se prolonge au-delà de $21$ jusqu'à $24\ \text{mL}$, dernier trait principal non chiffré) ; sous-quadrillage fin bleu à $10$ subdivisions par carreau principal ($0{,}3\ \text{mL}$ et $0{,}2$ unité pH). Courbe décroissante : elle part de $\text{pH} \approx 11{,}3$ à $V_a = 0$, décroît lentement (elle passe au voisinage de $\text{pH} = 10$ vers $V_a \approx 11{,}9\ \text{mL}$ ; à la demi-équivalence $V_a = 7{,}5\ \text{mL}$ elle vaut $\approx 10{,}6$), présente une chute brutale quasi verticale centrée sur $V_a = 15\ \text{mL}$ (de $\text{pH} \approx 9{,}0$ à $\text{pH} \approx 4{,}2$), puis décroît lentement vers $\text{pH} \approx 2{,}6$ au bord droit du cadre. Deux segments en pointillés, obliques et parallèles entre eux (pentes mesurées $-0{,}66$ et $-0{,}67$ unité pH par mL), encadrent le saut de part et d'autre (construction du type méthode des tangentes) : celui du haut va d'environ $(12{,}9\ ;\ 10{,}2)$ à $(19{,}0\ ;\ 6{,}2)$ et effleure la branche supérieure au voisinage de $V_a \approx 14$ ; celui du bas va d'environ $(11{,}1\ ;\ 6{,}7)$ à $(17{,}0\ ;\ 2{,}7)$ et effleure la branche inférieure au voisinage de $V_a \approx 16{,}5$. La parallèle équidistante (non tracée, à construire par l'élève) rencontrerait la courbe au voisinage de $(15\ \text{mL}\ ;\ 6{,}5)$.
    questions:
      - id: q1
        part: "1. Étude d'une solution aqueuse de méthylamine"
        stem: |-
          **1-1- (0,25 pt)** Donner la définition d'une base selon Bronsted.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une définition de cours, payée $0{,}25$ pt : le geste est de restituer la phrase exacte du chapitre 2, sans l'approximer.

          $$\boxed{\text{Une base de Bronsted est une espece chimique capable de \textbf{capter} (d'accepter) un proton } H^+}$$

          **Le piège de cette question.** Ne dis pas « une base est une espèce qui libère des ions $\text{HO}^-$ » : c'est la définition d'**Arrhenius**, plus étroite, et elle est fausse ici — la méthylamine ne contient aucun $\text{HO}^-$ à libérer ; elle est basique parce qu'elle **capte** un proton de l'eau, pas parce qu'elle en cède un (c'est exactement l'objet de la question suivante).
      - id: q2
        stem: |-
          **1-2- (0,25 pt)** Écrire l'équation de la réaction de la méthylamine avec l'eau.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une réaction acido-basique combine toujours deux couples (chapitre 2) : la base $\text{CH}_3\text{-NH}_2$, et l'eau qui doit lui céder un proton — l'eau joue donc ici son rôle d'**acide**, dans le couple $\text{H}_2\text{O}/\text{HO}^-$, pas son rôle de base du couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$.

          $$\boxed{\text{CH}_3\text{-NH}_{2(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{CH}_3\text{-NH}^+_{3(aq)} + \text{HO}^-_{(aq)}}$$

          **Pourquoi la double flèche.** La méthylamine est une base **faible** : sa réaction avec l'eau est **limitée**, elle s'arrête sur un équilibre (chapitre 8) — c'est justement ce que la question 1-3 va chiffrer.

          **Le piège de cette question.** Ne fais pas produire $\text{H}_3\text{O}^+$ à une base : c'est le réflexe de l'élève qui a trop travaillé les acides. Une base arrache un proton à l'eau, et l'eau appauvrie d'un proton est $\text{HO}^-$ — jamais $\text{H}_3\text{O}^+$. L'eau est un **ampholyte** (chapitre 2) : ici elle est acide, pas base.
      - id: q3
        stem: |-
          **1-3- (0,5 pt)** Calculer le taux d'avancement final $\tau$ de cette réaction. Que peut-on déduire ?
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le taux d'avancement final $\tau = x_f/x_{max}$ n'est pas un outil de cette leçon-ci : sa définition et son usage appartiennent à la notion **État d'équilibre d'un système chimique** (chapitre 2-2 là-bas). On le réutilise ici, comme au chapitre 7 de cette leçon, sur le cas d'une base qui réagit avec l'eau. Chaque méthylamine qui a réagi produit exactement un ion hydroxyde (question 1-2), donc l'avancement final se lit sur $[\text{HO}^-]_{eq}$ ; une conversion **totale** de la base introduite donnerait $[\text{HO}^-]_{max} = C_b$.

          On commence par $[\text{HO}^-]_{eq}$, à partir du pH mesuré, via le produit ionique de l'eau (chapitre 4 de cette leçon) : $[\text{HO}^-]_{eq} = K_e/[\text{H}_3\text{O}^+]_{eq} = 10^{\,\text{pH}-14}$.
        steps:
          - math: '[\text{HO}^-]_{eq} = 10^{\,\text{pH}-14} = 10^{11{,}3-14} = 10^{-2{,}7} \approx 2{,}0\times10^{-3}\ \text{mol.L}^{-1}'
            note: "Produit ionique de l'eau (chapitre 4), applique a la mesure pH = 11,3."
          - math: '\tau = \dfrac{[\text{HO}^-]_{eq}}{C_b} = \dfrac{2{,}0\times10^{-3}}{1{,}0\times10^{-2}}'
            note: "tau = avancement final / avancement maximal (état d'équilibre d'un système chimique, chapitre 2-2) ; le maximal correspond a [HO-] = Cb."
          - math: '\boxed{\tau \approx 0{,}20 = 20\ \%}'
            note: "Loin de 1 : réaction limitée, la methylamine est une base faible (chapitre 7) - a peu près un cinquième seulement de la base introduite a reagi."
      - id: q4
        stem: |-
          **1-4- (0,5 pt)** Montrer que le quotient de la réaction $Q_{r,\text{éq}}$ à l'équilibre s'écrit ainsi : $Q_{r,\text{éq}} = \dfrac{C_b\,.\,\tau^2}{1-\tau}$. Calculer sa valeur.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Écrire un quotient de réaction à l'équilibre en fonction de $\tau$ est, là encore, un geste de la notion **État d'équilibre d'un système chimique** (le quotient de réaction et sa valeur à l'équilibre s'y construisent aux chapitre 4-4) : on écrit les concentrations d'équilibre à partir du tableau d'avancement, comme au chapitre 5 de cette leçon-ci.

          Chaque méthylamine transformée donne un $\text{CH}_3\text{-NH}_3^+$ et un $\text{HO}^-$ en quantités égales (question 1-2), donc $[\text{CH}_3\text{-NH}_3^+]_{eq} = [\text{HO}^-]_{eq} = \tau C_b$ ; il reste $[\text{CH}_3\text{-NH}_2]_{eq} = C_b(1-\tau)$ de base non transformée. On reporte dans le quotient associé à l'équation de la question 1-2.
        steps:
          - math: 'Q_{r,\text{éq}} = \dfrac{[\text{CH}_3\text{-NH}_3^+]_{eq}\,[\text{HO}^-]_{eq}}{[\text{CH}_3\text{-NH}_2]_{eq}} = \dfrac{(\tau C_b)(\tau C_b)}{C_b(1-\tau)}'
            note: "Concentrations d'équilibre ecrites avec tau (état d'équilibre d'un système chimique, chapitre 4-4)."
          - math: '\boxed{Q_{r,\text{éq}} = \dfrac{C_b\,\tau^{2}}{1-\tau}}'
            note: "Le Cb au numérateur se simplifie une fois : c'est l'expression demandee."
          - math: 'Q_{r,\text{éq}} = \dfrac{1{,}0\times10^{-2}\times(0{,}20)^{2}}{1-0{,}20} = \dfrac{1{,}0\times10^{-2}\times0{,}04}{0{,}80}'
            note: "Application numérique avec Cb = 1,0.10^-2 mol/L et tau = 0,20 (question 1-3)."
          - math: '\boxed{Q_{r,\text{éq}} \approx 5{,}0\times10^{-4}}'
            note: "Valeur confirmée de façon indépendante dans le sourcing de cette entrée."
      - id: q5
        stem: |-
          **1-5- (0,5 pt)** Trouver l'expression de la constante d'acidité $K_A$ du couple $\text{CH}_3\text{-NH}^+_{3(aq)}/\text{CH}_3\text{-NH}_{2(aq)}$ en fonction de $Q_{r,\text{éq}}$ et $K_e$ puis vérifier que $pK_A \approx 10{,}7$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** La réaction dont on vient de calculer $Q_{r,\text{éq}}$ (question 1-4) est celle de la **base** avec l'eau : sa constante d'équilibre est la constante de **basicité** du couple, pas directement $K_A$. Pour relier les deux, on combine cette réaction avec celle de l'acide conjugué $\text{CH}_3\text{-NH}_3^+$ avec l'eau — celle qui définit $K_A$ (chapitre 5 de cette leçon). Additionner ces deux réactions donne exactement l'autoprotolyse de l'eau (chapitre 4), de constante $K_e$ — et, tout comme au chapitre 5 de *État d'équilibre d'un système chimique*, où $K$ ne dépend que de la réaction et jamais de l'état initial, ce produit de constantes ne dépend, lui non plus, que des deux couples en présence.

          $$\text{CH}_3\text{-NH}_{2(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{CH}_3\text{-NH}^+_{3(aq)} + \text{HO}^-_{(aq)} \qquad (K = Q_{r,\text{éq}})$$

          $$\text{CH}_3\text{-NH}^+_{3(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{CH}_3\text{-NH}_{2(aq)} + \text{H}_3\text{O}^+_{(aq)} \qquad (K = K_A)$$

          En additionnant ces deux équations, les deux méthylamines s'annulent (une de chaque côté) : il reste $2\,\text{H}_2\text{O}_{(l)} \rightleftharpoons \text{H}_3\text{O}^+_{(aq)} + \text{HO}^-_{(aq)}$, dont la constante est $K_e$ (chapitre 4) — d'où $Q_{r,\text{éq}}\times K_A = K_e$.

          **Le piège de cette question.** Ne confonds pas $Q_{r,\text{éq}}$ (constante de la réaction de la **base** avec l'eau) et $K_A$ (constante de la réaction de l'**acide conjugué** avec l'eau) : elles ne sont jamais égales, seulement liées par $Q_{r,\text{éq}}\times K_A = K_e$.
        steps:
          - math: '\boxed{K_A = \dfrac{K_e}{Q_{r,\text{éq}}}}'
            note: "Combinaison des deux réactions : leur somme est l'autoprotolyse de l'eau, de constante Ke (chapitre 4)."
          - math: 'K_A = \dfrac{10^{-14}}{5{,}0\times10^{-4}} \approx 2{,}0\times10^{-11}'
            note: "Application numérique avec Qr,eq = 5,0.10^-4 (question 1-4)."
          - math: 'pK_A = -\log K_A = -\log\left(2{,}0\times10^{-11}\right)'
            note: "Définition du pKA (chapitre 5)."
          - math: '\boxed{pK_A \approx 10{,}7}'
            note: "Valeur a vérifier, conforme a l'énoncé (raccourci : pKA = 14 + log Qr,eq = 14 - 3,30 = 10,70)."
      - id: q6
        part: "2. Dosage d'une solution aqueuse de méthylamine"
        stem: |-
          **2-1- (0,5 pt)** Écrire l'équation de la réaction du dosage.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Construction habituelle (chapitre 2) : les deux couples réellement présents dans le bécher, demi-équations en sens opposés, somme, le $H^+$ s'annule. Dans le bécher : la base $\text{CH}_3\text{-NH}_2$ du couple donné, et l'ion $\text{H}_3\text{O}^+$ versé, acide du couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$ ; l'ion $\text{Cl}^-$ est spectateur.

          $$\boxed{\text{CH}_3\text{-NH}_{2(aq)} + \text{H}_3\text{O}^+_{(aq)} \longrightarrow \text{CH}_3\text{-NH}^+_{3(aq)} + \text{H}_2\text{O}_{(l)}}$$

          **Le contrôle qui justifie la flèche simple.** $K = K_A(\text{H}_3\text{O}^+/\text{H}_2\text{O})/K_A(\text{CH}_3\text{-NH}_3^+/\text{CH}_3\text{-NH}_2) = 1/10^{-10{,}7} = 10^{10{,}7} \approx 5\times10^{10}$ (chapitre 8 puis 9) : la réaction est quasi totale, la flèche simple est méritée.

          **Le piège de cette question.** Ce dosage est le **miroir** de celui du cours (chapitre 10-11, qui verse une base forte sur un acide faible et où le pH **monte**) : ici on verse l'acide fort sur une base faible, et le pH **descend** au fil du dosage — cohérent avec la courbe donnée, qui part de $11{,}3$ et décroît.
      - id: q7
        stem: |-
          **2-2- (0,5 pt)** Déterminer graphiquement les coordonnées $(V_{aE},\ \text{pH}_E)$ du point d'équivalence.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** On repère l'équivalence au **milieu du saut** (chapitre 11), jamais à une valeur de pH choisie d'avance : le point d'inflexion, encadré par deux tangentes parallèles et leur médiane équidistante.

          Sur la figure, la chute quasi verticale est centrée sur $V_a = 15\ \text{mL}$ (de $\text{pH} \approx 9{,}0$ à $\text{pH} \approx 4{,}2$), encadrée par deux segments en pointillés parallèles ; leur parallèle équidistante rencontre la courbe au voisinage de $(15\ \text{mL}\ ;\ 6{,}5)$.

          $$\boxed{V_{aE} = 15{,}0\ \text{mL} \qquad \text{pH}_E \approx 6{,}5}$$

          **Le contrôle.** $\text{pH}_E < 7$ : cohérent avec une base faible dosée par un acide fort (chapitre 10) — à l'équivalence il ne reste, comme espèce du couple, que l'acide conjugué $\text{CH}_3\text{-NH}_3^+$, qui rend le milieu acide. Ne lis jamais $V_{aE}$ à l'abscisse où $\text{pH} = 7$ : ici cette abscisse serait très en dessous de $15\ \text{mL}$, avant même que le saut n'ait commencé.
      - id: q8
        stem: |-
          **2-3- (0,5 pt)** En déduire la concentration $C_b$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'équivalence est une égalité de quantités de matière (chapitre 10) : la base présente au départ égale l'acide versé à $V_{aE}$.
        steps:
          - math: 'C_b\,V_b = C_a\,V_{aE}'
            note: "Relation d'équivalence (chapitre 10) : la quantité de base initiale egale la quantité d'acide versee."
          - math: 'C_b = \dfrac{C_a\,V_{aE}}{V_b} = \dfrac{1{,}0\times10^{-2}\times15{,}0}{15}'
            note: "VaE = 15,0 mL (question 2-2), Vb = 15 mL, Ca = 1,0.10^-2 mol/L."
          - math: '\boxed{C_b = 1{,}0\times10^{-2}\ \text{mol.L}^{-1}}'
            note: "Exactement la concentration preparee en section 1 : le dosage vient de la vérifier, comme l'énoncé l'annoncait."
      - id: q9
        stem: |-
          **2-4- (0,5 pt)** Choisir, parmi les indicateurs colorés suivants, l'indicateur adéquat pour réaliser ce dosage. Justifier votre réponse.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le critère du chapitre 12 : on retient l'indicateur dont la zone de virage **contient** $\text{pH}_E$. On teste les quatre zones contre $\text{pH}_E = 6{,}5$.

          | Indicateur | Zone de virage | $6{,}5$ est-il dedans ? |
          |---|:---:|:---:|
          | Hélianthine | $3{,}0$ – $4{,}6$ | non ($6{,}5 > 4{,}6$) |
          | Bleu de bromothymol | $6{,}0$ – $7{,}6$ | **oui** ($6{,}0 < 6{,}5 < 7{,}6$) |
          | Rouge de crésol | $7{,}2$ – $8{,}8$ | non ($6{,}5 < 7{,}2$) |
          | Phénolphtaléine | $8{,}2$ – $10{,}0$ | non ($6{,}5 < 8{,}2$) |

          $$\boxed{\text{Le bleu de bromothymol\,: sa zone de virage } 6{,}0\text{–}7{,}6 \text{ encadre } \text{pH}_E = 6{,}5}$$

          **Le piège de cette question.** Ne choisis pas un indicateur qui vire près de $7$ « parce que $7$ est neutre » : la neutralité ($pK_e/2 = 7$, chapitre 4) n'a rien à voir avec le $\text{pH}_E$ **de ce dosage précis**. Le bleu de bromothymol convient ici parce que sa zone encadre $6{,}5$ — c'est une coïncidence de ce sujet qu'il soit aussi proche de $7$, pas le critère.
      - id: q10
        stem: |-
          **2-5- (0,75 pt)** Déterminer le quotient $\dfrac{\left[\text{CH}_3\text{-NH}_{2(aq)}\right]}{\left[\text{CH}_3\text{-NH}^+_{3(aq)}\right]}$ pour le volume $V_{a1} = 20{,}4\ \text{mL}$ de la solution $S_a$ versée. En déduire l'espèce chimique prédominante.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $V_{a1} = 20{,}4\ \text{mL}$ est **au-delà** de $V_{aE} = 15{,}0\ \text{mL}$ (question 2-2) : la méthylamine, réactif limitant, a déjà été **entièrement** consommée à l'équivalence, et tout l'acide versé depuis s'accumule désormais en excès dans le bécher. Le rapport demandé se lit par la relation de prédominance (chapitre 6), $[\text{CH}_3\text{-NH}_2]/[\text{CH}_3\text{-NH}_3^+] = 10^{\,\text{pH}-pK_A}$ — il faut donc d'abord le pH à ce volume, que la figure ne donne pas directement (elle ne chiffre que $V_{aE}$ et les bornes du cadre, pas ce point précis).

          **SCOPE NOTE — technique hors des chapitres, refaite ici et non admise.** Calculer un pH à partir d'un excès de titrant n'est traité nommément par aucun chapitre : le chapitre 10 interdit explicitement tout calcul analytique du pH **aux points remarquables** (équivalence, demi-équivalence) par une formule fermée, mais $V_{a1}$ n'est ni l'un ni l'autre — c'est un point quelconque, **après** l'équivalence, où c'est le seul excès d'acide **fort** qui fixe le pH, sans qu'aucune constante $K_A$ n'intervienne dans ce premier calcul. Le geste, refait en trois temps : compter l'acide en excès par bilan de matière, le diluer dans le volume total, appliquer la définition du pH (chapitre 3).

          Tout le méthylamine initial ($C_bV_b$) a été consommé à $V_{aE}$ par une quantité égale d'acide, $C_aV_{aE}$ (question 2-3, réaction totale du chapitre 10). Au-delà, l'acide versé n'a plus personne à qui céder son proton : il reste tel quel dans le mélange.

          $$n(\text{H}_3\text{O}^+)_{\text{excès}} = C_a\,V_{a1} - C_a\,V_{aE} = C_a\left(V_{a1}-V_{aE}\right)$$

          On le dilue dans le volume total du mélange à cet instant, $V_b + V_{a1}$ (pas $V_{a1}$ seul, ni $V_b$ seul) :

          $$[\text{H}_3\text{O}^+] = \dfrac{C_a\left(V_{a1}-V_{aE}\right)}{V_b+V_{a1}}$$

          **L'application numérique.** L'excès d'acide, d'abord :

          $$n(\text{H}_3\text{O}^+)_{\text{excès}} = 1{,}0\times10^{-2}\times\left(20{,}4-15{,}0\right)\times10^{-3} = 1{,}0\times10^{-2}\times5{,}4\times10^{-3} = 5{,}4\times10^{-5}\ \text{mol}$$

          Le volume total à $V_{a1}$ :

          $$V_b+V_{a1} = 15{,}0+20{,}4 = 35{,}4\ \text{mL} = 35{,}4\times10^{-3}\ \text{L}$$

          $$[\text{H}_3\text{O}^+] = \dfrac{5{,}4\times10^{-5}}{35{,}4\times10^{-3}} \approx 1{,}53\times10^{-3}\ \text{mol.L}^{-1} \qquad\Longrightarrow\qquad \text{pH} \approx 2{,}82$$

          **Le rapport de prédominance, maintenant que le pH est connu (chapitre 6).**

          $$\log\left(\dfrac{[\text{CH}_3\text{-NH}_2]}{[\text{CH}_3\text{-NH}_3^+]}\right) = \text{pH}-pK_A = 2{,}82-10{,}7 = -7{,}88$$

          $$\boxed{\dfrac{[\text{CH}_3\text{-NH}_2]}{[\text{CH}_3\text{-NH}_3^+]} = 10^{-7{,}88} \approx 1{,}3\times10^{-8}}$$

          **L'espèce prédominante.** Le rapport est écrasé devant $1$ (chapitre 6) : l'acide conjugué $\text{CH}_3\text{-NH}_3^+$ **prédomine**, très largement — cohérent avec un excès massif d'acide fort dans le bécher, qui protone quasiment toute la méthylamine restante.

          **Le piège de cette question.** Ne réponds pas $[\text{CH}_3\text{-NH}_2] \approx 0$ « donc le rapport est nul » : le rapport reste défini et non nul (chapitre 6, prédominer n'est jamais « être seul »), il est seulement **très petit** — c'est cette petitesse chiffrée, $1{,}3\times10^{-8}$, qui est la réponse attendue, pas une affirmation qualitative. Deuxième piège : ne pas confondre $V_{a1}$ avec un volume **avant** l'équivalence — $20{,}4\ \text{mL} > V_{aE} = 15{,}0\ \text{mL}$, donc c'est l'acide qui est en excès, pas la base ; utiliser le tableau d'avancement d'avant l'équivalence ici inverserait le rôle des deux réactifs et donnerait un rapport supérieur à $1$, à l'opposé du résultat physique.
        steps:
          - math: 'n(\text{H}_3\text{O}^+)_{\text{excès}} = C_a\left(V_{a1}-V_{aE}\right) = 1{,}0\times10^{-2}\times\left(20{,}4-15{,}0\right)\times10^{-3}'
            note: "Bilan de matière : au-dela de VaE, la methylamine est déjà epuisee, tout l'acide verse en plus reste en excès."
          - math: '\boxed{n(\text{H}_3\text{O}^+)_{\text{excès}} \approx 5{,}4\times10^{-5}\ \text{mol}}'
            note: "Application numérique."
          - math: '[\text{H}_3\text{O}^+] = \dfrac{n(\text{H}_3\text{O}^+)_{\text{excès}}}{V_b+V_{a1}} = \dfrac{5{,}4\times10^{-5}}{35{,}4\times10^{-3}}'
            note: "Dilution dans le volume TOTAL du mélange a Va1, soit Vb + Va1 = 35,4 mL (pas Va1 seul, pas Vb seul)."
          - math: '\boxed{[\text{H}_3\text{O}^+] \approx 1{,}53\times10^{-3}\ \text{mol.L}^{-1} \implies \text{pH} \approx 2{,}82}'
            note: "Définition du pH (chapitre 3), appliquee a l'excès d'acide fort : la contribution du couple methylamine/methylammonium est ici totalement négligeable."
          - math: '\log\left(\dfrac{[\text{CH}_3\text{-NH}_2]}{[\text{CH}_3\text{-NH}_3^+]}\right) = \text{pH}-pK_A = 2{,}82-10{,}7'
            note: "Relation de prédominance (chapitre 6), avec le pH qu'on vient de trouver et pKA = 10,7 (question 1-5)."
          - math: '\boxed{\dfrac{[\text{CH}_3\text{-NH}_2]}{[\text{CH}_3\text{-NH}_3^+]} \approx 1{,}3\times10^{-8}}'
            note: "Rapport ecrase devant 1 : CH3-NH3+ predomine très largement, excès massif d'acide fort oblige."

  # ── bk-2023-n-x1 — 2023 N, Exercice 1 (§2) : reaction acide ethanoique / ion methanoate ──
  # SCOPE NOTE (flag, non résolu ici — à l'arbitrage du pédagogue-architecte) :
  # La question 2.3 (« Trouver l'expression du pH du mélange réactionnel en
