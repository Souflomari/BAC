    intro: |-
      **Dosage d'une solution aqueuse d'hydrogénosulfite de sodium (examen national, session normale 2025).**

      L'hydrogénosulfite de sodium $\text{NaHSO}_3$ est utilisé pour le blanchiment de la pâte à papier. L'étiquette d'un flacon contenant une solution commerciale $S_0$ d'hydrogénosulfite de sodium $\left(\text{Na}^+_{(aq)} + \text{HSO}_3^-{}_{(aq)}\right)$ porte l'indication $500\ \text{g/L}$ ; la concentration molaire de $S_0$ est $C_0$. Toutes les mesures sont faites à $25\,^\circ\text{C}$ ($K_e = 10^{-14}$). Masse molaire $M(\text{NaHSO}_3) = 104\ \text{g/mol}$ ; couple $\text{HSO}_3^-{}_{(aq)}/\text{SO}_3^{2-}{}_{(aq)}$, $pK_A = 7{,}2$.

      Pour vérifier l'indication de l'étiquette, on dilue $100$ fois $S_0$ pour obtenir une solution $S_A$ de concentration $C_A$, et on dose un volume $V_A = 20{,}0\ \text{mL}$ de $S_A$ par une solution d'hydroxyde de sodium $\left(\text{Na}^+_{(aq)} + \text{HO}^-_{(aq)}\right)$ de concentration $C_B = 0{,}10\ \text{mol/L}$. Le volume versé à l'équivalence est $V_{BE} = 9{,}6\ \text{mL}$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Écrire l'équation chimique modélisant la réaction de dosage.
        reasoning: |-
          Réaction support d'un titrage : totale, rapide, unique — flèche simple (rung 9). L'espèce $\text{HSO}_3^-$ joue ici le rôle d'acide (couple $\text{HSO}_3^-/\text{SO}_3^{2-}$) et cède son proton à l'ion $\text{HO}^-$ de la soude, base forte.

          $$\text{HSO}_3^-{}_{(aq)} + \text{HO}^-_{(aq)} \rightarrow \text{SO}_3^{2-}{}_{(aq)} + \text{H}_2\text{O}_{(l)}$$
      - id: q2
        stem: |-
          **(0,75 pt)** Déterminer la valeur de $C_A$.
        reasoning: |-
          À l'équivalence, la quantité d'acide dans la prise d'essai égale la quantité de base versée : $C_A V_A = C_B V_{BE}$ (rung 9).
        steps:
          - math: 'C_A = \dfrac{C_B\,V_{BE}}{V_A} = \dfrac{0{,}10 \times 9{,}6}{20{,}0} = 4{,}8\times10^{-2}\ \text{mol/L}'
            note: "VBE = 9,6 mL (donnee), VA = 20,0 mL, CB = 0,10 mol/L."
      - id: q3
        stem: |-
          **(0,25 pt)** Déduire que $C_0 = 4{,}80\ \text{mol/L}$.
        reasoning: |-
          $S_A$ est $S_0$ diluée $100$ fois (rung 6) : sa concentration a été divisée par $100$, donc on multiplie par $100$ pour retrouver $C_0$.
        steps:
          - math: 'C_0 = 100 \times C_A = 100 \times 4{,}8\times10^{-2} = 4{,}80\ \text{mol/L}'
            note: "S0 diluee 100 fois donne SA : on remonte en multipliant par 100."
      - id: q4
        stem: |-
          **(0,75 pt)** Justifier si l'indication inscrite sur l'étiquette du flacon est vérifiée.
        reasoning: |-
          L'étiquette donne une concentration massique, $500\ \text{g/L}$ ; on la retrouve en multipliant la concentration molaire $C_0$ trouvée par dosage par la masse molaire $M$.
        steps:
          - math: 'C_0 \times M = 4{,}80 \times 104 = 499{,}2\ \text{g/L} \approx 500\ \text{g/L}'
            note: "Concentration massique = concentration molaire fois masse molaire ; l'indication de l'etiquette est verifiee (ecart d'arrondi)."
      - id: q5
        stem: |-
          **(0,75 pt)** Déterminer la valeur de la constante d'équilibre $K$ associée à l'équation de la réaction de dosage.
        reasoning: |-
          Exactement le calcul du rung 9 : la réaction de dosage combine le couple $\text{HSO}_3^-/\text{SO}_3^{2-}$ ($pK_A = 7{,}2$) et le couple $\text{H}_2\text{O}/\text{HO}^-$, dont on retient par convention $pK_{A2} = pK_e = 14$.
        steps:
          - math: 'K = \dfrac{K_A}{K_e} = 10^{\,pK_e - pK_A} = 10^{\,14 - 7{,}2} = 10^{6{,}8} \approx 6{,}3\times10^{6}'
            note: "Meme construction qu'au rung 9 : K est enorme, ce qui justifie a posteriori la fleche simple de la question 1."
      - id: q6
        stem: |-
          **(0,75 pt)** En se basant sur le tableau d'avancement de la réaction de dosage à l'équivalence, trouver la concentration molaire $C_{eq}$ de la solution de sulfite de sodium $\left(2\text{Na}^+_{(aq)} + \text{SO}_3^{2-}{}_{(aq)}\right)$ obtenue à l'équivalence.
        reasoning: |-
          À l'équivalence, la réaction (totale, rung 9) a converti tout le $\text{HSO}_3^-$ initialement présent en $\text{SO}_3^{2-}$ : la quantité de $\text{SO}_3^{2-}$ formée égale la quantité initiale d'acide, $n(\text{SO}_3^{2-}) = C_A V_A$. Mais ce sulfite se retrouve maintenant dilué dans le volume total du mélange, $V_A + V_{BE}$ — pas dans $V_A$ seul.
        steps:
          - math: 'n(\text{SO}_3^{2-}) = C_A V_A = 4{,}8\times10^{-2} \times 20{,}0\times10^{-3} = 9{,}6\times10^{-4}\ \text{mol}'
            note: "Reaction totale a l'equivalence : tout le HSO3- initial est devenu SO3(2-)."
          - math: 'C_{eq} = \dfrac{n(\text{SO}_3^{2-})}{V_A + V_{BE}} = \dfrac{9{,}6\times10^{-4}}{20{,}0\times10^{-3} + 9{,}6\times10^{-3}} \approx 3{,}2\times10^{-2}\ \text{mol/L}'
            note: "Le volume total a l'equivalence est VA + VBE, pas VA seul : c'est une dilution."
