          $$K_A = Q_{r,eq} \approx 1{,}57\times10^{-5}$$

          $$pK_A = -\log K_A = -\log(1{,}57\times10^{-5})$$

          $$\boxed{pK_A \approx 4{,}80}$$

          Le piège nommé de cette question. « En déduire » signale qu'aucun calcul neuf n'est attendu : c'est une simple lecture de la question précédente à travers la définition $K_A = Q_{r,eq}$, puis $pK_A = -\log K_A$ (chapitre 5). Reprendre depuis les concentrations, en refaisant tout le calcul de la question 2, n'est pas faux mais fait perdre du temps que le mot « déduire » indique précisément d'économiser.
        steps:
          - math: 'K_A = Q_{r,eq} \approx 1{,}57\times10^{-5}'
            note: "L'équation donnée EST la réaction de définition de K_A (chapitre 5) : K_A = Q_r,eq directement."
          - math: 'pK_A = -\log K_A = -\log(1{,}57\times10^{-5})'
            note: "Définition du pK_A (chapitre 5)."
