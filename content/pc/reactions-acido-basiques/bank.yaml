    intro: |-
      **Dosage et identification d'un acide carboxylique (examen national, session normale 2021).**

      Un flacon à l'étiquette illisible contient une solution aqueuse $S_a$ d'un acide carboxylique de formule et de concentration inconnues. On note $\text{AH}$ l'acide et $\text{A}^-$ sa base conjuguée ; toutes les mesures sont faites à $25\,^\circ\text{C}$ ($K_e = 10^{-14}$).

      **Dosage.** On dose $V_a = 20\ \text{mL}$ de $S_a$ (concentration $C_a$) par une solution d'hydroxyde de sodium $\left(\text{Na}^+_{(aq)} + \text{HO}^-_{(aq)}\right)$ de concentration $C_b = 10^{-1}\ \text{mol/L}$. La courbe $\text{pH} = f(V_b)$ est un dosage d'acide faible par base forte : elle part de $\text{pH} \approx 3$, présente un saut d'équivalence marqué au voisinage de $V_b = 20\ \text{mL}$ (le pH montant d'environ $6$ à environ $11$), puis un palier vers $\text{pH} \approx 12$.

      **Identification.** La mesure du pH de $S_a$ donne $\text{pH} = 2{,}88$. On dispose du tableau des $pK_A$ :

      | Couple acide / base | $pK_A$ |
      |---------------------|:---:|
      | $\text{HCOOH}/\text{HCOO}^-$ | 3,75 |
      | $\text{C}_6\text{H}_5\text{COOH}/\text{C}_6\text{H}_5\text{COO}^-$ | 4,2 |
      | $\text{CH}_3\text{COOH}/\text{CH}_3\text{COO}^-$ | 4,75 |
      | $\text{CH}_3\text{CH}_2\text{COOH}/\text{CH}_3\text{CH}_2\text{COO}^-$ | 4,9 |
    questions:
      - id: q1
        part: "1) Dosage de l'acide carboxylique"
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction du dosage.
        reasoning: |-
          Réaction support d'un titrage : totale, rapide, unique — **flèche simple** (rung 9). L'acide faible $\text{AH}$ cède son proton à l'ion $\text{HO}^-$ de la soude, base forte. On combine le couple $\text{AH}/\text{A}^-$ ($\text{AH}$ en acide) et le couple $\text{H}_2\text{O}/\text{HO}^-$ ($\text{HO}^-$ en base).

          $$\text{AH}_{(aq)} + \text{HO}^-_{(aq)} \rightarrow \text{A}^-_{(aq)} + \text{H}_2\text{O}_{(l)}$$
      - id: q2
        stem: |-
          **(0,5 pt)** Déterminer graphiquement les coordonnées $\text{pH}_E$ et $V_{bE}$ du point d'équivalence.
        reasoning: |-
          L'équivalence est le **milieu du saut** de pH — le point d'inflexion de la courbe (rung 10) — et non le point où $\text{pH} = 7$. On le repère par la méthode des tangentes (deux tangentes parallèles encadrant le saut, puis leur médiane équidistante) ou par le maximum de la dérivée $d\text{pH}/dV$. Le saut étant centré vers $V_b = 20\ \text{mL}$ et s'étendant d'environ $6$ à $11$, on lit :

          $$V_{bE} \approx 20\ \text{mL} \qquad \text{pH}_E \approx 8{,}5$$

          On note $\text{pH}_E > 7$ : cohérent avec un acide faible dosé par une base forte, car à l'équivalence il ne reste, comme espèce du couple, que la base $\text{A}^-$, qui rend le milieu basique.
      - id: q3
        stem: |-
          **(0,5 pt)** Déterminer la valeur de la concentration $C_a$.
        reasoning: |-
          À l'équivalence, les réactifs ont été introduits dans les proportions stœchiométriques ($1{:}1$) : la quantité d'acide initiale égale la quantité de base versée, soit $C_a V_a = C_b V_{bE}$ — une égalité de quantités de matière, jamais une valeur de pH imposée. On isole $C_a$.
        steps:
          - math: 'C_a\,V_a = C_b\,V_{bE}'
            note: "Relation d'équivalence : égalité des quantités de matière."
          - math: 'C_a = \dfrac{C_b\,V_{bE}}{V_a} = \dfrac{0{,}1 \times 20}{20} = 0{,}1\ \text{mol/L}'
            note: "VbE = 20 mL lu au saut, Va = 20 mL, Cb = 0,1 mol/L."
      - id: q4
        part: "2) Identification de l'acide carboxylique"
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction de l'acide $\text{AH}$ avec l'eau.
        reasoning: |-
          Contrairement au dosage (total, flèche simple), la mise en solution d'un acide **faible** est **limitée** : elle s'arrête sur un équilibre, d'où la **double flèche** $\rightleftharpoons$ (rung 7). L'acide $\text{AH}$ cède un proton à l'eau, qui joue le rôle de base (couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$).

          $$\text{AH}_{(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{A}^-_{(aq)} + \text{H}_3\text{O}^+_{(aq)}$$
      - id: q5
        stem: |-
          **(0,5 pt)** Montrer que le taux d'avancement final de la réaction de $\text{AH}$ avec l'eau est $\tau \approx 1{,}32\ \%$.
        reasoning: |-
          Le taux d'avancement final compare l'avancement atteint à celui d'une réaction totale : $\tau = y_f / y_{max}$. Chaque acide dissocié libère un $\text{H}_3\text{O}^+$, donc l'avancement final se lit sur $[\text{H}_3\text{O}^+]_{eq}$ ; une conversion totale de l'acide apporté donnerait $[\text{H}_3\text{O}^+]_{max} = C_a$. On retrouve d'abord $[\text{H}_3\text{O}^+]_{eq}$ à partir du pH.
        steps:
          - math: '[\text{H}_3\text{O}^+]_{eq} = 10^{-\text{pH}} = 10^{-2{,}88} \approx 1{,}32 \times 10^{-3}\ \text{mol/L}'
            note: "Concentration effective en ions oxonium, tirée du pH."
          - math: '\tau = \dfrac{[\text{H}_3\text{O}^+]_{eq}}{C_a} = \dfrac{1{,}32 \times 10^{-3}}{0{,}1} \approx 1{,}32 \times 10^{-2} = 1{,}32\ \%'
            note: "tau = avancement final / avancement maximal ; le maximal correspond à [H3O+] = Ca."
      - id: q6
        stem: |-
          **(0,75 pt)** Déterminer l'expression du quotient de réaction $Q_{r,\text{éq}}$ à l'équilibre en fonction de $C_a$ et $\tau$, puis vérifier que $Q_{r,\text{éq}} \approx 1{,}77 \times 10^{-5}$.
        reasoning: |-
          On écrit les concentrations d'équilibre avec $\tau$ : chaque acide dissocié donne un $\text{A}^-$ et un $\text{H}_3\text{O}^+$, donc $[\text{A}^-]_{eq} = [\text{H}_3\text{O}^+]_{eq} = \tau C_a$, et il reste $[\text{AH}]_{eq} = C_a(1-\tau)$. On reporte dans le quotient associé à l'équation de la question 4.
        steps:
          - math: 'Q_{r,\text{éq}} = \dfrac{[\text{A}^-]_{eq}\,[\text{H}_3\text{O}^+]_{eq}}{[\text{AH}]_{eq}} = \dfrac{(\tau C_a)(\tau C_a)}{C_a(1-\tau)} = \dfrac{C_a\,\tau^{2}}{1-\tau}'
            note: "Concentrations d'équilibre écrites avec tau."
          - math: 'Q_{r,\text{éq}} = \dfrac{0{,}1 \times \left(1{,}32 \times 10^{-2}\right)^{2}}{1 - 1{,}32 \times 10^{-2}} \approx 1{,}77 \times 10^{-5}'
            note: "Application numérique : Ca = 0,1 mol/L et tau = 1,32 %."
      - id: q7
        stem: |-
          **(0,5 pt)** Identifier l'acide carboxylique $\text{AH}$ à l'aide du tableau des $pK_A$. Justifier.
        reasoning: |-
          À l'équilibre, $Q_{r,\text{éq}}$ atteint la constante d'équilibre de la réaction de $\text{AH}$ avec l'eau : c'est la constante d'acidité $K_A$ du couple $\text{AH}/\text{A}^-$. On en déduit $pK_A = -\log K_A$, qu'on compare au tableau.
        steps:
          - math: 'K_A = Q_{r,\text{éq}} \approx 1{,}77 \times 10^{-5}'
            note: "À l'équilibre, le quotient de réaction atteint la constante d'acidité KA."
          - math: 'pK_A = -\log K_A = -\log\left(1{,}77 \times 10^{-5}\right) \approx 4{,}75'
            note: "Valeur à confronter au tableau des pKA."
      - id: q8
        part: "3) Exploitation de la courbe de dosage"
        stem: |-
          **(0,75 pt)** Déterminer le volume $V_{b1}$ de la solution basique versée, au cours du dosage, pour que $\dfrac{[\text{AH}_{(aq)}]}{[\text{A}^-_{(aq)}]} = 2{,}24$.
        reasoning: |-
          Avant l'équivalence, la réaction de dosage est totale : chaque mole de $\text{HO}^-$ versée convertit une mole de $\text{AH}$ en $\text{A}^-$. La quantité de base conjuguée formée est $n(\text{A}^-) = C_b V_{b1}$, et il reste $n(\text{AH}) = C_a V_a - C_b V_{b1} = C_b V_{bE} - C_b V_{b1}$ (car $C_a V_a = C_b V_{bE}$). Les deux espèces partageant le même volume total, le rapport des concentrations égale le rapport des quantités de matière.
        steps:
          - math: '\dfrac{[\text{AH}]}{[\text{A}^-]} = \dfrac{n(\text{AH})}{n(\text{A}^-)} = \dfrac{C_b V_{bE} - C_b V_{b1}}{C_b V_{b1}} = \dfrac{V_{bE} - V_{b1}}{V_{b1}}'
            note: "Réaction de dosage totale ; même volume total, donc rapport des concentrations = rapport des quantités."
          - math: '\dfrac{V_{bE} - V_{b1}}{V_{b1}} = 2{,}24 \implies V_{b1} = \dfrac{V_{bE}}{1 + 2{,}24} = \dfrac{20}{3{,}24} \approx 6{,}2\ \text{mL}'
            note: "On isole Vb1 ; VbE = 20 mL. Vb1 < VbE/2 : AH reste majoritaire, cohérent avec un rapport > 1."

