    intro: |-
      **Dosage pH-métrique de l'acide lactique par l'hydroxyde de sodium (examen national, session normale 2018).**

      L'acide lactique (acide 2-hydroxypropanoïque), $CH_3-CH(OH)-COOH$, entre dans de nombreuses réactions biochimiques : on le trouve dans le lait et ses dérivés, dans des fruits et légumes ; il est utilisé comme conservateur des aliments et dans la préparation de certains produits pharmaceutiques. On le note $AH$, et sa base conjuguée $A^-$ ; toutes les mesures sont faites à $25\,^\circ\text{C}$.

      **Données :** constante d'acidité du couple $AH_{(aq)}/A^-_{(aq)}$ : $K_A = 10^{-3{,}9}$ ; zones de virage de trois indicateurs colorés :

      | Indicateur coloré | Hélianthine | B.B.T | rouge de crésol |
      |---|:---:|:---:|:---:|
      | Zone de virage | $3-4{,}4$ | $6-7{,}6$ | $7{,}2-8{,}8$ |

      On dose le volume $V_A = 15\ \text{mL}$ d'une solution aqueuse $(S_A)$ d'acide lactique $AH$ de concentration molaire $C_A$ par une solution aqueuse $(S_B)$ d'hydroxyde de sodium de concentration molaire $C_B = 3 \times 10^{-2}\ \text{mol/L}$, en suivant les variations du pH du mélange réactionnel en fonction du volume $V_B$ versé.

      **La courbe $\text{pH} = f(V_B)$** est croissante : départ vers $\text{pH} \approx 2{,}8$ pour $V_B = 0$, montée lente et régulière, puis un saut d'équivalence très raide, quasi vertical, centré exactement sur le trait de grille $V_B = 10\ \text{mL}$ ; au-delà, la courbe s'aplatit vers un palier voisin de $\text{pH} \approx 11{,}9$. Deux droites en pointillés encadrent le saut, une de part et d'autre : elles sont **parallèles** (pentes mesurées $0{,}891$ et $0{,}890$ unité de pH par mL — elles ne se croisent jamais), la construction classique des tangentes parallèles. Leur parallèle médiane, équidistante des deux, recoupe la courbe exactement à l'intersection des deux traits de grille principaux $V_B = 10\ \text{mL}$ et $\text{pH} = 8$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction de dosage.
        reasoning: |-
          La réaction support d'un titrage doit être totale, rapide et unique : on l'écrit avec une **flèche simple** (chapitre 10). Ici l'acide lactique $AH$ cède son proton à l'ion hydroxyde $HO^-$ de la soude, base forte. On combine le couple $AH/A^-$ ($AH$ en acide) et le couple $H_2O/HO^-$ ($HO^-$ en base) ; le proton échangé s'annule dans le bilan.

          $$AH_{(aq)} + HO^-_{(aq)} \rightarrow A^-_{(aq)} + H_2O_{(l)}$$
      - id: q2
        stem: |-
          **(0,5 pt)** Déterminer les coordonnées $V_{BE}$ et $\text{pH}_E$ du point d'équivalence.
        reasoning: |-
          L'équivalence est le **milieu du saut** de pH — le point d'inflexion de la courbe (chapitre 11) — et non le point où $\text{pH} = 7$. On la repère par la méthode des tangentes : deux tangentes parallèles encadrant le saut, puis leur médiane équidistante, dont le point d'intersection avec la courbe donne $V_{BE}$ et $\text{pH}_E$. Ici, la portion quasi verticale de la courbe et la médiane des deux tangentes tombent toutes deux exactement sur les traits de grille principaux :

          $$V_{BE} = 10{,}0\ \text{mL} \qquad \text{pH}_E = 8{,}0$$

          On note $\text{pH}_E > 7$ : cohérent avec un acide faible dosé par une base forte, car à l'équivalence il ne reste, comme espèce du couple, que la base conjuguée $A^-$, qui rend le milieu basique.
      - id: q3
        stem: |-
          **(0,5 pt)** Calculer la concentration $C_A$ de la solution $(S_A)$.
        reasoning: |-
          À l'équivalence, les réactifs ont été introduits dans les proportions stœchiométriques ($1{:}1$ ici) : la quantité d'acide initialement présente égale la quantité de base versée, soit $C_A V_A = C_B V_{BE}$ — une égalité de **quantités de matière** (chapitre 10), jamais une valeur de pH imposée. On isole $C_A$.
        steps:
          - math: 'C_A\,V_A = C_B\,V_{BE}'
            note: "Relation d'équivalence : égalité des quantités de matière (chapitre 10)."
          - math: 'C_A = \dfrac{C_B\,V_{BE}}{V_A} = \dfrac{3\times10^{-2} \times 10{,}0}{15} = 2{,}0\times10^{-2}\ \text{mol/L}'
            note: "VBE = 10,0 mL lu au saut (question précédente), VA = 15 mL, CB = 3.10^-2 mol/L."
      - id: q4
        stem: |-
          **(0,5 pt)** Choisir, en justifiant la réponse, l'indicateur coloré adéquat pour repérer l'équivalence.
        reasoning: |-
          Le critère (chapitre 12) : la zone de virage de l'indicateur doit **encadrer** le $\text{pH}_E$ lu à la question précédente, $\text{pH}_E = 8{,}0$, pour que le changement de couleur tombe dans le saut. On teste les trois zones : l'hélianthine ($3$–$4{,}4$) est bien trop basse ; le B.B.T ($6$–$7{,}6$) reste encore trop bas, sa borne supérieure $7{,}6$ n'atteignant pas $8{,}0$ ; seul le **rouge de crésol** ($7{,}2$–$8{,}8$) contient $\text{pH}_E = 8{,}0$. C'est lui qu'on retient — le critère n'est pas « virer à $\text{pH} = 7$ », c'est encadrer le $\text{pH}_E$ de ce dosage précis.
      - id: q5
        stem: |-
          **(0,75 pt)** Trouver le rapport $\dfrac{[A^-]}{[AH]}$ à l'ajout du volume $V_B = 10\ \text{mL}$, puis déduire l'espèce chimique prédominante $AH$ ou $A^-$.
        reasoning: |-
          Repère d'abord où tombe ce volume : $V_B = 10\ \text{mL}$ est exactement le $V_{BE}$ trouvé à la question 2 — ce n'est donc pas un volume quelconque avant l'équivalence, c'est l'équivalence elle-même. On ne peut pas ici compter les quantités de matière comme si l'acide était encore massivement en excès : à ce volume précis, le pH connu est celui de l'équivalence, $\text{pH}_E = 8{,}0$. Le bon outil est la relation pH/$pK_A$ du chapitre 6, valable en tout point de la courbe : $\dfrac{[A^-]}{[AH]} = 10^{\text{pH}-pK_A}$. Le $K_A$ étant donné, $K_A = 10^{-3{,}9}$, donc $pK_A = 3{,}9$.
        steps:
          - math: '\dfrac{[A^-]}{[AH]} = 10^{\text{pH}-pK_A} = 10^{8{,}0-3{,}9} = 10^{4{,}1} \approx 1{,}3\times10^{4}'
            note: "On évalue la formule du chapitre 6 au pH de l'équivalence, pHE = 8,0, avec pKA = 3,9 (KA = 10^-3,9 donne directement pKA)."
          - math: '\dfrac{[A^-]}{[AH]} \approx 1{,}3\times10^{4} \gg 1 \implies A^- \text{ prédomine très largement}'
            note: "Rapport très supérieur à 1 (chapitre 6) : la base conjuguée A- écrase l'acide AH, ce qui est attendu puisqu'on est à l'équivalence, où tout AH a été quasiment converti."

