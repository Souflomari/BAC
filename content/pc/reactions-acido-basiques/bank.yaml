  # ── bk-2019-n-x1 — 2019 N, Exercice I (Partie 2) : conductimétrie acide benzoïque ──
  - id: bk-2019-n-x1
    title: "Détermination du pKA de l'acide benzoïque par conductimétrie"
    source:
      year: 2019
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice I — Partie 2 (Chimie)"
    bareme_total: 5
    duration_min: 35
    sourcing:
      status: sourced
      note: >-
        2019 session normale — examen national PC BIOF (Sciences Physiques, SPC),
        AlloSchool NS28F, element/68300 (Exercice I, Partie 2 — étude
        conductimétrique d'une solution d'acide benzoïque ; barème de la partie
        ≈ 5 pt sur les 7 pt de l'exercice). Transcription vérifiée : re-fetch
        indépendant AlloSchool + diff OK (docs/sujets/pc/reactions-acido-basiques.md,
        statut « vérifié » agent-vérificateur 2026-07-11).
    intro: |-
      **Étude conductimétrique d'une solution d'acide benzoïque (examen national, session normale 2019).**

      L'acide benzoïque $\text{C}_6\text{H}_5\text{COOH}$ est un conservateur alimentaire aux propriétés antiseptiques. On se propose de déterminer le $pK_A$ du couple $\text{C}_6\text{H}_5\text{COOH}_{(aq)}/\text{C}_6\text{H}_5\text{COO}^-_{(aq)}$ par une étude conductimétrique.

      **Données** (à $25\,^\circ\text{C}$) : conductivités molaires ioniques $\lambda_1 = \lambda(\text{H}_3\text{O}^+) = 35 \times 10^{-3}\ \text{S·m}^2\text{·mol}^{-1}$ et $\lambda_2 = \lambda(\text{C}_6\text{H}_5\text{COO}^-) = 3{,}23 \times 10^{-3}\ \text{S·m}^2\text{·mol}^{-1}$ ; la conductivité d'une solution s'écrit $\sigma = \sum \lambda_i [X_i]$, somme sur les espèces ioniques $X_i$.

      On prépare une solution aqueuse $S$ d'acide benzoïque de concentration $C = 10^{-3}\ \text{mol/L}$ et de volume $V = 1\ \text{L}$. La mesure de sa conductivité donne $\sigma = 8{,}6 \times 10^{-3}\ \text{S/m}$.
    questions:
      - id: q1
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction entre l'acide benzoïque et l'eau.
        reasoning: |-
          La mise en solution d'un acide **faible** dans l'eau est une transformation **limitée** : elle s'arrête sur un équilibre, donc on l'écrit avec une **double flèche** $\rightleftharpoons$ (rung 7). L'acide $\text{C}_6\text{H}_5\text{COOH}$ cède un proton à l'eau, qui joue le rôle de base (couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$).

          $$\text{C}_6\text{H}_5\text{COOH}_{(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{C}_6\text{H}_5\text{COO}^-_{(aq)} + \text{H}_3\text{O}^+_{(aq)}$$
      - id: q2
        stem: |-
          **(0,75 pt)** Dresser le tableau d'avancement de la réaction.
        reasoning: |-
          On raisonne en **concentrations molaires** (le volume est constant), avec l'avancement volumique $y$. État initial : seul l'acide est apporté, à la concentration $C$ ; l'eau est le solvant (en excès, on ne la suit pas). Chaque coefficient stœchiométrique vaut $1$ : quand l'avancement vaut $y$, l'acide a diminué de $y$ et chacun des deux produits a augmenté de $y$.

          | État | $\text{C}_6\text{H}_5\text{COOH}$ | $\text{C}_6\text{H}_5\text{COO}^-$ | $\text{H}_3\text{O}^+$ |
          |------|:---:|:---:|:---:|
          | initial | $C$ | $0$ | $0$ |
          | en cours | $C - y$ | $y$ | $y$ |
          | final (équ.) | $C - y_{f}$ | $y_{f}$ | $y_{f}$ |

          À l'équilibre, $[\text{C}_6\text{H}_5\text{COO}^-]_{eq} = [\text{H}_3\text{O}^+]_{eq} = y_f$ : les deux produits sont formés à parts égales, ce qui servira juste après.
      - id: q3
        stem: |-
          **(0,75 pt)** En négligeant la participation des ions hydroxyde $\text{HO}^-$ à la conductivité, exprimer $\sigma$ en fonction de $\lambda_1$, $\lambda_2$ et $[\text{H}_3\text{O}^+]$ la concentration effective des ions oxonium à l'équilibre.
        reasoning: |-
          En milieu acide les ions $\text{HO}^-$ sont ultra-minoritaires : on ne garde que les deux ions issus de la réaction, $\text{H}_3\text{O}^+$ et $\text{C}_6\text{H}_5\text{COO}^-$. Le tableau d'avancement les a produits à parts égales, donc $[\text{C}_6\text{H}_5\text{COO}^-]_{eq} = [\text{H}_3\text{O}^+]_{eq}$. On reporte cette égalité dans $\sigma = \sum \lambda_i [X_i]$, ce qui met $[\text{H}_3\text{O}^+]$ en facteur.
        steps:
          - math: '\sigma = \lambda_1\,[\text{H}_3\text{O}^+] + \lambda_2\,[\text{C}_6\text{H}_5\text{COO}^-]'
            note: "On ne garde que les deux ions majoritaires (HO- négligé)."
          - math: '\sigma = \lambda_1\,[\text{H}_3\text{O}^+] + \lambda_2\,[\text{H}_3\text{O}^+] = (\lambda_1 + \lambda_2)\,[\text{H}_3\text{O}^+]'
            note: "Les deux produits sont à égale concentration (tableau d'avancement)."
      - id: q4
        stem: |-
          **(0,75 pt)** Montrer que le taux d'avancement final $\tau$ de la réaction s'écrit $\tau = \dfrac{\sigma}{C(\lambda_1 + \lambda_2)}$, puis calculer sa valeur.
        reasoning: |-
          Le taux d'avancement final compare l'avancement réellement atteint à celui d'une réaction supposée totale : $\tau = y_f / y_{max}$. Comme le volume est constant, cela revient à comparer les concentrations : l'avancement final se lit sur $[\text{H}_3\text{O}^+]_{eq}$, tandis qu'une conversion **totale** de l'acide donnerait $[\text{H}_3\text{O}^+]_{max} = C$. On tire $[\text{H}_3\text{O}^+]$ de la question précédente, puis on divise par $C$. Pour l'application numérique, $C = 10^{-3}\ \text{mol/L} = 1\ \text{mol·m}^{-3}$ (cohérence avec des $\lambda$ en $\text{S·m}^2\text{·mol}^{-1}$ et $\sigma$ en $\text{S/m}$).
        steps:
          - math: '[\text{H}_3\text{O}^+]_{eq} = \dfrac{\sigma}{\lambda_1 + \lambda_2}'
            note: "On isole [H3O+] dans l'expression de sigma."
          - math: '\tau = \dfrac{[\text{H}_3\text{O}^+]_{eq}}{C} = \dfrac{\sigma}{C(\lambda_1 + \lambda_2)}'
            note: "tau = avancement final / avancement maximal ; le maximal correspond à [H3O+] = C."
          - math: '\tau = \dfrac{8{,}6 \times 10^{-3}}{1 \times \left(35 \times 10^{-3} + 3{,}23 \times 10^{-3}\right)} \approx 0{,}22'
            note: "Application numérique avec C = 1 mol/m^3 : tau vaut environ 0,22, soit 22 %."
      - id: q5
        stem: |-
          **(0,75 pt)** Trouver l'expression de la constante d'équilibre $K$ associée à la réaction entre l'acide benzoïque et l'eau, en fonction de $C$ et $\tau$.
        reasoning: |-
          On exprime chaque concentration d'équilibre avec $\tau$. Chaque acide ayant réagi donne un $\text{C}_6\text{H}_5\text{COO}^-$ et un $\text{H}_3\text{O}^+$, donc $[\text{C}_6\text{H}_5\text{COO}^-]_{eq} = [\text{H}_3\text{O}^+]_{eq} = \tau C$ ; il reste $[\text{C}_6\text{H}_5\text{COOH}]_{eq} = C(1-\tau)$ d'acide non dissocié. On reporte dans le quotient de réaction associé à l'équation de la question 1, qui à l'équilibre vaut $K$.
        steps:
          - math: 'K = \dfrac{[\text{C}_6\text{H}_5\text{COO}^-]_{eq}\,[\text{H}_3\text{O}^+]_{eq}}{[\text{C}_6\text{H}_5\text{COOH}]_{eq}} = \dfrac{(\tau C)(\tau C)}{C(1-\tau)}'
            note: "Concentrations d'équilibre écrites avec tau : produits = tau*C, acide restant = C(1 - tau)."
          - math: 'K = \dfrac{C\,\tau^{2}}{1-\tau}'
            note: "Le C au numérateur se simplifie une fois."
      - id: q6
        stem: |-
          **(0,25 pt)** Que représente la constante d'équilibre $K$ associée à cette réaction chimique ?
        reasoning: |-
          $K$ est la constante d'équilibre de la réaction de l'acide benzoïque **avec l'eau**. Or cette réaction met en jeu l'acide $\text{C}_6\text{H}_5\text{COOH}$ face au couple de l'eau : sa constante d'équilibre est, par définition, la **constante d'acidité** $K_A$ du couple $\text{C}_6\text{H}_5\text{COOH}/\text{C}_6\text{H}_5\text{COO}^-$. C'est ce lien $K = K_A$ qui autorise, à la question suivante, le passage au $pK_A$.
      - id: q7
        stem: |-
          **(0,75 pt)** En déduire la valeur du $pK_A$ du couple $\text{C}_6\text{H}_5\text{COOH}_{(aq)}/\text{C}_6\text{H}_5\text{COO}^-_{(aq)}$.
        reasoning: |-
          Puisque $K = K_A$, on calcule d'abord $K$ avec l'expression de la question 5 et la valeur de $\tau$, puis on passe au $pK_A = -\log K_A$. La valeur obtenue, proche de $4{,}2$, est la signature de l'acide benzoïque.
        steps:
          - math: 'K_A = K = \dfrac{C\,\tau^{2}}{1-\tau} = \dfrac{10^{-3} \times (0{,}22)^{2}}{1 - 0{,}22} \approx 6{,}5 \times 10^{-5}'
            note: "Application numérique avec C = 10^-3 mol/L et tau = 0,22."
          - math: 'pK_A = -\log K_A = -\log\left(6{,}5 \times 10^{-5}\right) \approx 4{,}2'
            note: "Valeur attendue pour le couple de l'acide benzoïque."
      - id: q8
        stem: |-
          **(0,5 pt)** Déterminer, parmi $\text{C}_6\text{H}_5\text{COOH}$ et $\text{C}_6\text{H}_5\text{COO}^-$, l'espèce chimique prédominante dans la solution $S$.
        reasoning: |-
          Deux lectures équivalentes du même fait. Par le **rapport des concentrations** : $\dfrac{[\text{C}_6\text{H}_5\text{COO}^-]}{[\text{C}_6\text{H}_5\text{COOH}]} = \dfrac{\tau}{1-\tau} = \dfrac{0{,}22}{0{,}78} \approx 0{,}28 < 1$, donc la forme acide l'emporte. Par le **diagramme de prédominance** : $[\text{H}_3\text{O}^+] = \tau C = 0{,}22 \times 10^{-3}$ donne $\text{pH} = -\log(2{,}2 \times 10^{-4}) \approx 3{,}7 < pK_A \approx 4{,}2$. Sous la frontière $\text{pH} = pK_A$, c'est l'acide qui prédomine.

          L'espèce prédominante dans $S$ est donc l'acide benzoïque $\text{C}_6\text{H}_5\text{COOH}$.

  # ── bk-2020-n-x1 — 2020 N, Exercice I (Partie 1) : dosage pH-métrique d'une base faible ──
  - id: bk-2020-n-x1
    title: "Dosage pH-métrique d'une solution d'ammoniac"
    source:
      year: 2020
      session: normale
      filiere: "SPC"
      exercise_label: "Exercice I — Partie 1 (Chimie)"
    bareme_total: 4.75
    duration_min: 30
    sourcing:
      status: sourced
      note: >-
        2020 session normale — examen national PC BIOF (Sciences Physiques, SPC),
        AlloSchool NS28F, element/109742 (Exercice I, Partie 1 — dosage
        pH-métrique d'une solution d'ammoniac, base faible dosée par acide fort ;
        barème de la partie ≈ 4,75 pt sur les 7 pt de l'exercice). Transcription
        vérifiée : re-fetch indépendant AlloSchool + diff OK
        (docs/sujets/pc/reactions-acido-basiques.md, statut « vérifié »
        agent-vérificateur 2026-07-11).
    intro: |-
      **Étude d'une solution d'ammoniac (examen national, session normale 2020).**

      L'ammoniac $\text{NH}_3$ dissous dans l'eau donne une solution basique. On prépare une solution $S_b$ de volume $V$ en diluant $100$ fois une solution commerciale $S_0$ de concentration $C_0$. Toutes les mesures sont faites à $25\,^\circ\text{C}$ ; produit ionique de l'eau $K_e = 10^{-14}$.

      **Dosage.** On dose un volume $V_b = 15\ \text{mL}$ de $S_b$ (concentration $C_b$) par une solution d'acide chlorhydrique $\left(\text{H}_3\text{O}^+_{(aq)} + \text{Cl}^-_{(aq)}\right)$ de concentration $C_a = 10^{-2}\ \text{mol/L}$. La courbe $\text{pH} = f(V_a)$ **décroît** (base faible par acide fort) : elle part de $\text{pH} \approx 10{,}5$, présente un saut d'équivalence marqué au voisinage de $V_{aE} \approx 15\ \text{mL}$ (le pH chutant rapidement d'environ $8$ à environ $4$), puis un palier vers $\text{pH} \approx 2{,}7$. On dispose des indicateurs colorés suivants :

      | Indicateur coloré | Zone de virage |
      |-------------------|:---:|
      | hélianthine | 3,1 – 4,4 |
      | rouge de méthyle | 4,2 – 6,2 |
      | phénolphtaléine | 8,2 – 10 |

      **Étude de $S_b$.** La mesure du pH de la solution $S_b$ donne $\text{pH} = 10{,}6$.
    questions:
      - id: q1
        part: "1) Dosage de la solution S_b"
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction de dosage.
        reasoning: |-
          La réaction support d'un titrage doit être totale, rapide et unique : **flèche simple** (rung 9). Ici la base faible $\text{NH}_3$ capte un proton de l'ion $\text{H}_3\text{O}^+$ apporté par l'acide fort. On combine le couple $\text{NH}_4^+/\text{NH}_3$ ($\text{NH}_3$ en base) et le couple $\text{H}_3\text{O}^+/\text{H}_2\text{O}$ ($\text{H}_3\text{O}^+$ en acide) ; le proton échangé s'annule dans le bilan.

          $$\text{NH}_{3(aq)} + \text{H}_3\text{O}^+_{(aq)} \rightarrow \text{NH}_{4(aq)}^+ + \text{H}_2\text{O}_{(l)}$$
      - id: q2
        stem: |-
          **(0,5 pt)** Écrire, à l'équivalence, la relation entre $C_b$, $C_a$, $V_b$ et $V_{aE}$ le volume versé à l'équivalence.
        reasoning: |-
          L'équivalence est l'instant où les réactifs ont été introduits dans les proportions stœchiométriques ($1{:}1$ ici) : la quantité de base présente au départ égale la quantité d'acide versée. C'est une égalité de **quantités de matière** — jamais une valeur de pH imposée.

          $$C_b\,V_b = C_a\,V_{aE}$$
      - id: q3
        stem: |-
          **(0,5 pt)** Montrer que la concentration de la solution $S_b$ est $C_b = 10^{-2}\ \text{mol/L}$. En déduire $C_0$.
        reasoning: |-
          On isole $C_b$ dans la relation d'équivalence, en lisant $V_{aE} \approx 15\ \text{mL}$ au milieu du saut. Puis on remonte à la solution commerciale : $S_b$ a été obtenue en diluant $S_0$ **100 fois**, donc la concentration a été divisée par $100$ — pour retrouver $C_0$, on multiplie par $100$.
        steps:
          - math: 'C_b = \dfrac{C_a\,V_{aE}}{V_b} = \dfrac{10^{-2} \times 15}{15} = 10^{-2}\ \text{mol/L}'
            note: "VaE = 15 mL lu au saut, Vb = 15 mL, Ca = 10^-2 mol/L."
          - math: 'C_0 = 100 \times C_b = 100 \times 10^{-2} = 1\ \text{mol/L}'
            note: "Sb est S0 diluée 100 fois : on multiplie par 100 pour remonter à C0."
      - id: q4
        stem: |-
          **(0,5 pt)** Choisir, parmi les indicateurs colorés du tableau, celui qui convient à ce dosage. Justifier.
        reasoning: |-
          Le critère (rung 11) : la zone de virage de l'indicateur doit **encadrer** le pH à l'équivalence, pour que le changement de couleur tombe dans le saut. Ici la base faible est dosée par un acide fort : à l'équivalence il ne reste que l'acide conjugué $\text{NH}_4^+$, donc $\text{pH}_E < 7$ ; sur la courbe le saut est centré vers $\text{pH}_E \approx 6$. On teste les trois zones : l'hélianthine ($3{,}1$–$4{,}4$) est trop basse, la phénolphtaléine ($8{,}2$–$10$) trop haute ; seul le **rouge de méthyle** ($4{,}2$–$6{,}2$) contient $\text{pH}_E$. C'est lui qu'on retient — le critère n'est pas « virer à $\text{pH} = 7$ ».
      - id: q5
        part: "2) Étude de la solution S_b"
        stem: |-
          **(0,5 pt)** Écrire l'équation de la réaction de l'ammoniac avec l'eau.
        reasoning: |-
          Contrairement au dosage (total, flèche simple), la réaction d'une **base faible** avec l'eau est **limitée** : elle s'arrête sur un équilibre, d'où la **double flèche** $\rightleftharpoons$ (rung 7). L'ammoniac $\text{NH}_3$ arrache un proton à l'eau, qui joue ici le rôle d'acide (couple $\text{H}_2\text{O}/\text{HO}^-$).

          $$\text{NH}_{3(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{NH}_{4(aq)}^+ + \text{HO}^-_{(aq)}$$
      - id: q6
        stem: |-
          **(0,75 pt)** Calculer la concentration molaire effective des ions hydroxyde $\text{HO}^-$ dans la solution $S_b$.
        reasoning: |-
          On passe du pH à $[\text{H}_3\text{O}^+]$, puis on utilise le produit ionique de l'eau $K_e = [\text{H}_3\text{O}^+][\text{HO}^-]$ (rung 3), toujours valable en solution aqueuse à $25\,^\circ\text{C}$, pour atteindre $[\text{HO}^-]$.
        steps:
          - math: '[\text{H}_3\text{O}^+] = 10^{-\text{pH}} = 10^{-10{,}6}\ \text{mol/L}'
            note: "Définition du pH."
          - math: '[\text{HO}^-] = \dfrac{K_e}{[\text{H}_3\text{O}^+]} = 10^{\,\text{pH} - 14} = 10^{-3{,}4} \approx 4{,}0 \times 10^{-4}\ \text{mol/L}'
            note: "Produit ionique de l'eau : Ke = [H3O+][HO-] = 10^-14."
      - id: q7
        stem: |-
          **(0,5 pt)** Calculer le taux d'avancement final $\tau$ de la réaction de l'ammoniac avec l'eau.
        reasoning: |-
          Le taux d'avancement final compare l'avancement atteint à celui d'une réaction totale : $\tau = y_f / y_{max}$. Chaque $\text{NH}_3$ ayant réagi produit un $\text{HO}^-$, donc l'avancement final se lit sur $[\text{HO}^-]$ ; une conversion totale donnerait $[\text{HO}^-]_{max} = C_b$. On divise donc $[\text{HO}^-]$ par $C_b$.
        steps:
          - math: '\tau = \dfrac{[\text{HO}^-]}{C_b} = \dfrac{4{,}0 \times 10^{-4}}{10^{-2}} = 4{,}0 \times 10^{-2}'
            note: "tau vaut environ 0,04, soit 4 % : la base est faiblement dissociée."
      - id: q8
        stem: |-
          **(0,5 pt)** Vérifier que le quotient de la réaction à l'équilibre est $Q_{r,\text{éq}} = 1{,}65 \times 10^{-5}$.
        reasoning: |-
          On dresse les concentrations d'équilibre avec $\tau$ : chaque $\text{NH}_3$ transformé donne un $\text{NH}_4^+$ et un $\text{HO}^-$, donc $[\text{NH}_4^+]_{eq} = [\text{HO}^-]_{eq} = \tau C_b$, et il reste $[\text{NH}_3]_{eq} = C_b(1-\tau)$. On reporte dans le quotient associé à l'équation de la question 5 (l'eau, solvant, n'y figure pas).
        steps:
          - math: 'Q_{r,\text{éq}} = \dfrac{[\text{NH}_4^+]_{eq}\,[\text{HO}^-]_{eq}}{[\text{NH}_3]_{eq}} = \dfrac{(\tau C_b)(\tau C_b)}{C_b(1-\tau)} = \dfrac{C_b\,\tau^{2}}{1-\tau}'
            note: "Concentrations d'équilibre écrites avec tau."
          - math: 'Q_{r,\text{éq}} = \dfrac{10^{-2} \times \left(4{,}0 \times 10^{-2}\right)^{2}}{1 - 4{,}0 \times 10^{-2}} \approx 1{,}65 \times 10^{-5}'
            note: "Application numérique : Cb = 10^-2 mol/L et tau = 0,04."
      - id: q9
        stem: |-
          **(0,5 pt)** En déduire la valeur du $pK_A$ du couple $\text{NH}_4^+/\text{NH}_3$.
        reasoning: |-
          À l'équilibre, $Q_{r,\text{éq}}$ atteint la constante $K$ de la réaction de la question 5 : c'est la constante de **basicité** du couple, $K = K_e/K_A$. On en tire $K_A$, puis $pK_A = -\log K_A$. Plus court : $pK_A = 14 + \log Q_{r,\text{éq}}$. La valeur, proche de $9{,}2$, est la signature du couple $\text{NH}_4^+/\text{NH}_3$.
        steps:
          - math: 'K = Q_{r,\text{éq}} = \dfrac{K_e}{K_A} \implies K_A = \dfrac{K_e}{Q_{r,\text{éq}}} = \dfrac{10^{-14}}{1{,}65 \times 10^{-5}} \approx 6{,}1 \times 10^{-10}'
            note: "La constante de la réaction base + eau vaut Ke / KA."
          - math: 'pK_A = -\log K_A \approx 9{,}2'
            note: "Valeur attendue pour le couple ammonium / ammoniac."

