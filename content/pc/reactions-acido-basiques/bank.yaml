    intro: |-
      **Réaction entre l'acide éthanoïque et l'ion méthanoate (examen national, session normale 2023).**

      **Données nécessaires, reportées du §1 du même exercice** (transcrit intégralement sous `etat-equilibre.md`, cross-listé ici) : la solution $S_A$ d'acide éthanoïque a pour concentration $C_A = 5\times10^{-2}\ \text{mol/L}$, et le couple $\text{CH}_3\text{COOH}_{(aq)}/\text{CH}_3\text{COO}^-_{(aq)}$ a pour constante $pK_{A1} = 4{,}79$.

      On mélange un volume $V_1$ de la solution $S_A$ avec un volume $V_2 = V_1$ d'une solution aqueuse $S_B$ de méthanoate de sodium $\left(\text{Na}^+_{(aq)} + \text{HCOO}^-_{(aq)}\right)$ de concentration molaire $C_B = C_A$, sachant $pK_{A2} = pK_A\left(\text{HCOOH}_{(aq)}/\text{HCOO}^-_{(aq)}\right) = 3{,}75$.
    questions:
      - id: q1
        stem: |-
          **(0,75 pt)** Écrire l'équation de la réaction qui se produit entre les ions méthanoate et l'acide éthanoïque.
        reasoning: |-
          C'est une réaction entre deux couples (rung 7) : l'acide $\text{CH}_3\text{COOH}$ du couple 1 cède son proton à la base $\text{HCOO}^-$ du couple 2. Rien n'indique a priori que cette réaction soit totale — on garde donc la double flèche $\rightleftharpoons$, comme au rung 7, tant qu'on n'a pas calculé $K$.

          $$\text{CH}_3\text{COOH}_{(aq)} + \text{HCOO}^-_{(aq)} \rightleftharpoons \text{CH}_3\text{COO}^-_{(aq)} + \text{HCOOH}_{(aq)}$$
      - id: q2
        stem: |-
          **(0,75 pt)** Trouver l'expression du quotient de réaction à l'équilibre $Q_{r,\text{éq}}$ associée à cette réaction en fonction des constantes d'acidité $K_{A1}$ et $K_{A2}$ des couples intervenant. Calculer sa valeur sachant que $pK_{A2} = pK_A\left(\text{HCOOH}_{(aq)}/\text{HCOO}^-_{(aq)}\right) = 3{,}75$.
        reasoning: |-
          Exactement la construction du rung 7 : on réarrange le quotient en un rapport par couple, chacun s'exprimant avec $K_{A1}$ ou $K_{A2}$ et $[\text{H}_3\text{O}^+]$, qui se simplifie dans le produit.
        steps:
          - math: 'Q_{r,\text{éq}} = \dfrac{[\text{CH}_3\text{COO}^-]_{eq}\,[\text{HCOOH}]_{eq}}{[\text{CH}_3\text{COOH}]_{eq}\,[\text{HCOO}^-]_{eq}} = \dfrac{K_{A1}}{[\text{H}_3\text{O}^+]} \times \dfrac{[\text{H}_3\text{O}^+]}{K_{A2}} = \dfrac{K_{A1}}{K_{A2}}'
            note: "Meme construction qu'au rung 7 : le rapport du couple 1 vaut KA1/[H3O+], celui du couple 2 vaut [H3O+]/KA2 ; [H3O+] se simplifie."
          - math: 'Q_{r,\text{éq}} = 10^{\,pK_{A2}-pK_{A1}} = 10^{\,3{,}75-4{,}79} = 10^{-1{,}04} \approx 9{,}1\times10^{-2}'
            note: "Application numerique avec pKA1 = 4,79 (donnee du S1) et pKA2 = 3,75."
      - id: q3
        stem: |-
          **(0,5 pt)** Trouver l'expression du pH du mélange réactionnel en fonction de $pK_{A1}$ et $pK_{A2}$. Calculer sa valeur.
        reasoning: |-
          Ce résultat dépasse ce qu'établit nommément le rung 7 (voir la NOTE DE PORTÉE en tête de cette entrée) — on le re-dérive ici depuis les seules définitions de $K_{A1}$ et $K_{A2}$ (rung 4), en s'appuyant sur la symétrie du tableau d'avancement du rung 7 (exemple travaillé 2) : comme $V_2 = V_1$ et $C_B = C_A$, les deux réactifs sont apportés en quantités égales, donc à l'équilibre autant de $\text{CH}_3\text{COOH}$ a disparu que de $\text{HCOO}^-$ (même avancement). Il en résulte $[\text{CH}_3\text{COOH}]_{eq} = [\text{HCOO}^-]_{eq}$ et $[\text{CH}_3\text{COO}^-]_{eq} = [\text{HCOOH}]_{eq}$ — deux égalités croisées entre les deux couples. On exprime alors $[\text{H}_3\text{O}^+]_{eq}$ de deux façons, une par couple, et on multiplie.
        steps:
          - math: '[\text{H}_3\text{O}^+]_{eq} = K_{A1}\dfrac{[\text{CH}_3\text{COOH}]_{eq}}{[\text{CH}_3\text{COO}^-]_{eq}} \qquad [\text{H}_3\text{O}^+]_{eq} = K_{A2}\dfrac{[\text{HCOOH}]_{eq}}{[\text{HCOO}^-]_{eq}}'
            note: "Chaque KA (rung 4) isole une expression de [H3O+]eq, une par couple."
          - math: '[\text{H}_3\text{O}^+]_{eq}^{2} = K_{A1}K_{A2}\dfrac{[\text{CH}_3\text{COOH}]_{eq}\,[\text{HCOOH}]_{eq}}{[\text{CH}_3\text{COO}^-]_{eq}\,[\text{HCOO}^-]_{eq}} = K_{A1}K_{A2}'
            note: "Le produit des deux egalites croisees simplifie exactement le rapport de concentrations a 1 (quantites initiales egales)."
          - math: '\text{pH} = \dfrac{pK_{A1}+pK_{A2}}{2} = \dfrac{4{,}79+3{,}75}{2} \approx 4{,}27'
            note: "On passe au log puis au pH ; valable uniquement parce que V2 = V1 et CB = CA (melange equimolaire acide 1 / base 2)."

  # ── bk-2024-n-x1 — 2024 N, Exercice 1 (Partie 2) : dosage pH-metrique vitamine C ──
