    sourcing:
      status: sourced
      note: >-
        2021 session normale — examen national PC BIOF (Sciences Physiques, SPC),
        AlloSchool NS28F, element/127287 (Exercice I, Partie 2 — dosage
        pH-métrique d'un acide carboxylique puis identification ; barème de la
