          **Ce qu'on cherche et pourquoi ce geste.** L'équivalence est l'instant où le titrant a été versé en quantité **juste stœchiométrique** (chapitre 10) — un fait de quantités de matière, jamais une valeur de pH. La réaction de la question 2-1 est de rapport $1{:}1$ : une mole de $\text{H}_3\text{O}^+$ versée consomme une mole d'amine. Toute la base initialement dans le bécher est donc consommée par exactement autant d'acide.

          $$n_{R\text{-}NH_2}(0) = n_{\text{H}_3\text{O}^+}(V_{AE}) \quad\Longleftrightarrow\quad C_B\,V_B = C_A\,V_{AE}$$

          On isole $V_{AE}$ et on remplace :

          $$V_{AE} = \frac{C_B\,V_B}{C_A} = \frac{9{,}0\cdot10^{-2} \times 10{,}0}{4{,}5\cdot10^{-2}}$$

          Les deux concentrations apparaissent en rapport, et les deux volumes aussi : aucune conversion en litres n'est nécessaire, le résultat sort directement en millilitres.

          $$\boxed{V_{AE} = 20{,}0\ \text{mL}}$$

          **Le piège.** Ici $C_A = C_B/2$, donc $V_{AE} = 2\,V_B$. C'est une **conséquence** des données de ce sujet, pas une règle : la relation d'équivalence ne dit jamais rien sur les volumes seuls, elle égale les **produits** $CV$. Le chapitre 10 démonte d'ailleurs la confusion jumelle — « on a versé le même volume, $V_E = V_B$ » — qui n'est vraie que si les deux concentrations sont égales. Second point, et il prépare les deux questions suivantes : garde $V_{AE} = 20{,}0\ \text{mL}$ en tête, car la suite se place à $V_A = 16{,}0\ \text{mL}$. Or $16{,}0 < 20{,}0$ : on est **avant** l'équivalence. Donc l'acide versé est en défaut, la base est encore en excès, et c'est l'acide qui sera le réactif limitant — retiens-le, la question 2-4 se joue là-dessus.
      - id: q7
        stem: |-
          **2-3- (0,75 pt)** Le pH du mélange réactionnel est $\text{pH} = 10{,}2$ lorsque le volume versé de la solution $S_A$ est $V_A = 16{,}0\ \text{mL}$. En vous aidant du tableau d'avancement de la réaction de dosage, exprimer $x_f$ l'avancement de la réaction à cet état final en fonction de $C_A$, $V_A$, $V_B$ et pH. Vérifier que sa valeur est $x_f \approx 7{,}2\cdot10^{-4}\ \text{mol}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** L'énoncé impose l'outil — le tableau d'avancement — et impose la liste des symboles autorisés dans la réponse : $C_A$, $V_A$, $V_B$ et pH. Cette liste est l'indice décisif. Si l'on pouvait déclarer la réaction totale, $x_f$ vaudrait simplement $C_A V_A$ et le pH ne servirait à rien. S'il figure dans la liste, c'est que le geste attendu est de mesurer ce qui **reste** de $\text{H}_3\text{O}^+$ versé à l'état final — et le pH est précisément l'instrument qui le mesure.

          **Le tableau.** Tous les coefficients stœchiométriques valent $1$. On raisonne en quantités de matière, pas en concentrations : le volume du mélange change à chaque goutte versée.

          | État | $R\text{-}NH_2$ | $\text{H}_3\text{O}^+$ | $R\text{-}NH_3^{+}$ |
          |---|:---:|:---:|:---:|
          | initial | $C_B V_B$ | $C_A V_A$ | $0$ |
          | en cours | $C_B V_B - x$ | $C_A V_A - x$ | $x$ |
          | final | $C_B V_B - x_f$ | $C_A V_A - x_f$ | $x_f$ |

          **Chiffrer la case qui reste.** La ligne « final » de la colonne $\text{H}_3\text{O}^+$ est ce qui subsiste de l'acide versé. Or cette quantité est justement ce que le pH-mètre mesure. Par définition du pH (chapitre 3), la **concentration** en ions oxonium dans le mélange vaut $\left[\text{H}_3\text{O}^+\right]_f = 10^{-\text{pH}}$ ; pour en tirer une **quantité de matière**, on la multiplie par le volume du mélange, qui est le volume total dans le bécher, $V_A + V_B$ :

          $$n\left(\text{H}_3\text{O}^+\right)_f = \left[\text{H}_3\text{O}^+\right]_f \times \left(V_A + V_B\right) = 10^{-\text{pH}}\left(V_A + V_B\right)$$

          On identifie les deux écritures de la même case du tableau, et on isole $x_f$ :

          $$C_A V_A - x_f = 10^{-\text{pH}}\left(V_A + V_B\right) \quad\Longleftrightarrow\quad \boxed{x_f = C_A V_A - 10^{-\text{pH}}\left(V_A + V_B\right)}$$

          **L'application numérique, terme par terme.** Le premier terme, l'acide versé :

          $$C_A V_A = 4{,}5\cdot10^{-2} \times 16{,}0\cdot10^{-3} = 7{,}2\cdot10^{-4}\ \text{mol}$$

          Le second, l'acide qui n'a pas réagi, avec $V_A + V_B = 26{,}0\ \text{mL} = 26{,}0\cdot10^{-3}\ \text{L}$ :

          $$10^{-10{,}2} \times 26{,}0\cdot10^{-3} = 6{,}31\cdot10^{-11} \times 26{,}0\cdot10^{-3} \approx 1{,}6\cdot10^{-12}\ \text{mol}$$

          $$x_f = 7{,}2\cdot10^{-4} - 1{,}6\cdot10^{-12}$$

          $$\boxed{x_f \approx 7{,}2\cdot10^{-4}\ \text{mol}}$$

          Le second terme est environ **quatre milliards de fois** plus petit que le premier : il ne déplace pas même le douzième chiffre significatif. Il doit pourtant figurer dans l'**expression**, car c'est lui qui empêche d'écrire $x_f = C_A V_A$ sans démonstration.

          **Un recoupement qui referme le sujet sur lui-même.** Vérifions que le $\text{pH} = 10{,}2$ annoncé est cohérent. À cet état final il reste $C_B V_B - x_f = 9{,}0\cdot10^{-4} - 7{,}2\cdot10^{-4} = 1{,}8\cdot10^{-4}\ \text{mol}$ d'amine, face à $x_f = 7{,}2\cdot10^{-4}\ \text{mol}$ d'acide conjugué formé. Les deux partagent le même volume, donc le rapport des concentrations est le rapport des quantités :

          $$\frac{\left[R\text{-}NH_2\right]}{\left[R\text{-}NH_3^{+}\right]} = \frac{1{,}8\cdot10^{-4}}{7{,}2\cdot10^{-4}} = 0{,}25 = \frac{1}{4}$$

          Par le chapitre 6, $\text{pH} = pK_A + \log(1/4) = 10{,}8 - 0{,}60 = 10{,}2$ — exactement le pH imprimé. Et ce rapport $1/4$, c'est mot pour mot la composition $80/20$ de la question 1-2-3 : le sujet t'a fait calculer, dans sa première partie, le pH du point de dosage de sa seconde partie.

          **Le piège de cette question.** Le volume par lequel multiplier $\left[\text{H}_3\text{O}^+\right]_f$. C'est le volume du **mélange**, $V_A + V_B = 26{,}0\ \text{mL}$ — pas $V_B = 10{,}0\ \text{mL}$ (la prise d'essai avant tout ajout), pas $V_A = 16{,}0\ \text{mL}$ (le titrant seul), pas $V_B + V_{AE} = 30{,}0\ \text{mL}$ (le volume qu'on aurait à l'équivalence, où l'on n'est pas). Ici l'erreur ne change pas le résultat numérique, puisque le terme est négligeable — mais c'est l'expression qui est notée, et le correcteur y regarde. Second piège, symétrique : ne saute pas le terme sous prétexte qu'il est négligeable. L'énoncé demande $x_f$ « en fonction de $C_A$, $V_A$, $V_B$ et pH » ; une réponse où le pH n'apparaît pas ne répond pas à la question posée, même si son résultat numérique est juste.
      - id: q8
        stem: |-
          **2-4- (0,75 pt)** Déduire, en calculant $\tau$ le taux d'avancement final de la réaction pour $V_A = 16{,}0\ \text{mL}$, que la transformation associée à la réaction de dosage est totale.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le taux d'avancement final compare ce qui s'est **réellement** passé à ce qui se serait passé si la réaction avait été totale (chapitre 7 et 7) :

          $$\tau = \frac{x_f}{x_{max}}$$

          Tu possèdes déjà $x_f$ (question 2-3). Tout le travail est donc dans $x_{max}$ — et $x_{max}$, par définition, est l'avancement d'une réaction **supposée totale**, c'est-à-dire l'avancement au bout duquel le réactif **limitant** a entièrement disparu. Le geste est un inventaire : compter les deux réactifs, désigner le limitant.

          **Les deux quantités initiales, au moment considéré.**

          $$n_{R\text{-}NH_2}(0) = C_B V_B = 9{,}0\cdot10^{-2} \times 10{,}0\cdot10^{-3} = 9{,}0\cdot10^{-4}\ \text{mol}$$

          $$n_{\text{H}_3\text{O}^+}\ \text{versé} = C_A V_A = 4{,}5\cdot10^{-2} \times 16{,}0\cdot10^{-3} = 7{,}2\cdot10^{-4}\ \text{mol}$$

          Les coefficients valant $1$ de part et d'autre, on compare directement : $7{,}2\cdot10^{-4} < 9{,}0\cdot10^{-4}$, donc c'est l'**acide versé** qui manque.

          $$x_{max} = n_{\text{H}_3\text{O}^+}\ \text{versé} = C_A V_A = 7{,}2\cdot10^{-4}\ \text{mol}$$

          **Le calcul.**

          $$\tau = \frac{x_f}{x_{max}} = \frac{7{,}2\cdot10^{-4} - 1{,}6\cdot10^{-12}}{7{,}2\cdot10^{-4}} = 1 - \frac{1{,}6\cdot10^{-12}}{7{,}2\cdot10^{-4}} = 1 - 2{,}3\cdot10^{-9}$$

          $$\boxed{\tau \approx 1{,}00 \ \Longrightarrow\ \text{la transformation est totale}}$$

          **Une honnêteté sur ce nombre.** $\tau$ ne vaut pas *exactement* $1$ : il vaut $0{,}999999998$. L'écart est le terme résiduel de la question 2-3, ces $1{,}6\cdot10^{-12}\ \text{mol}$ de $\text{H}_3\text{O}^+$ qui n'ont pas réagi. Aucune mesure de laboratoire ne distingue $0{,}999999998$ de $1$, et la conclusion du sujet est juste — mais écris $\tau \approx 1$, pas $\tau = 1$ : le taux d'avancement d'une réaction chimique n'atteint jamais rigoureusement $1$, il en devient seulement indiscernable.

          **Le recoupement avec la question 2-1.** Deux chemins indépendants, une seule conclusion : par $K$, le chapitre 8 annonçait déjà une réaction quasi totale ($K \approx 6{,}3\cdot10^{10} \gg 1$) ; par $\tau$, on le mesure sur cet état final précis. Les deux s'accordent, et c'est ce qui autorise rétrospectivement la flèche simple de la question 2-1.

          **Le piège de cette question.** $x_{max}$ n'est **pas** $C_B V_B$. Tant qu'on est avant l'équivalence — et $16{,}0\ \text{mL} < V_{AE} = 20{,}0\ \text{mL}$ —, c'est toujours le **titrant versé** qui est en défaut, jamais l'espèce titrée. Prendre $x_{max} = 9{,}0\cdot10^{-4}$ donnerait $\tau = 7{,}2/9{,}0 = 0{,}80$ et la conclusion inverse, « transformation limitée » : l'erreur ne se voit pas dans le calcul, seulement dans la conclusion, et elle coûte la question entière. Second piège, plus profond : ce $\tau \approx 1$ ne dit **rien** sur la réaction de la question 1-1. La même amine, avec l'eau, réagit à $\tau \approx 0{,}084$ — huit pour cent. Une espèce n'a pas « un » taux d'avancement : $\tau$ est une propriété de la **réaction**, donc du couple d'en face. Face à l'eau, l'amine est une base faible ; face à un acide fort, elle réagit quasi totalement. Les deux affirmations sont vraies en même temps.

