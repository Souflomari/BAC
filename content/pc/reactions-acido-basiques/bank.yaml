    intro: |-
      **Étude d'une solution aqueuse d'acide éthanoïque (examen national, session de rattrapage 2025 — Exercice 1, §1, 2,75 points).**

      Dans cet exercice on se propose d'étudier une solution aqueuse d'acide éthanoïque ; une réaction d'estérification ; une hydrolyse basique d'un ester. *Les deux autres sous-parties de cet exercice de 7 points vivent ailleurs : le §2 (estérification, dosage de l'acide restant, rendement) sous la notion « Estérification et hydrolyse » ; le §3 (cinétique de la saponification) sous la notion « Suivi temporel d'une transformation — vitesse de réaction ».*

      On prépare une solution aqueuse $S_A$ d'acide éthanoïque $CH_3COOH$ de volume $V$ et de concentration molaire $C_A = 4{,}2\cdot10^{-3}\ \text{mol.L}^{-1}$. Son pH vaut $\text{pH} = 3{,}6$.

      Les courbes de la figure 1 représentent le diagramme de distribution des espèces acide et base conjuguée du couple $CH_3COOH_{(aq)}/CH_3COO^-_{(aq)}$.

      On dilue la solution $S_A$ pour obtenir une solution $S_{A1}$ de concentration $C_{A1}$ et de $pH_1 = 4{,}2$. On définit la proportion de l'espèce basique $CH_3COO^-$ dans une solution par :

      $$\alpha(CH_3COO^-) = \frac{\left[CH_3COO^-_{(aq)}\right]_{éq}}{\left[CH_3COOH_{(aq)}\right]_{éq} + \left[CH_3COO^-_{(aq)}\right]_{éq}} \times 100$$

      **Figure 1 (courbes, re-décrite depuis l'image, mesurée au pixel).** Repère « % » en ordonnée, « pH » en abscisse, sur quadrillage fin (sous-maille 10×10 : petit carreau $=0{,}1$ unité de pH $\times$ $2\ \%$). **Abscisse** : l'origine du repère est $pH = 0$ ; traits principaux tous les $1$ unité de pH, seuls $1$ et $2$ chiffrés ; le cadre s'étend jusqu'à $pH \simeq 10$ (10 traits principaux). **Ordonnée** : traits principaux tous les $20\ \%$, chiffrés $20$ et $40$ (plus le $0$ à l'origine) ; le haut du cadre est exactement $100\ \%$ (5 traits principaux).

      Deux courbes sigmoïdes en sens opposés, et **l'étiquetage est celui-ci** (tête de flèche relevée au pixel sur le tracé qu'elle désigne) :
      - la **courbe 1** — flèche « Courbe 1 » venant de la **droite** et pointant vers la gauche, sa pointe se posant sur le tracé situé **à droite** du point de croisement — est la courbe **décroissante** : elle part du haut du cadre ($100\ \%$) aux faibles pH et tend vers $0$ aux pH élevés. C'est l'espèce **acide** $CH_3COOH$ (ce que la question 1-4-2 demande de justifier) ;
      - la **courbe 2** — flèche « Courbe 2 » venant de la **gauche**, pointe posée sur le tracé situé **à gauche** du croisement — est la courbe **croissante** : elle part de $0$ aux faibles pH et sature à $100\ \%$ aux pH élevés. C'est la base conjuguée $CH_3COO^-$.

      Lectures fermes (mesure au pixel, recoupées par la re-dérivation) :
      - les deux courbes se croisent à **$50\ \%$** pour **$pH = 4{,}8$** (croisement mesuré à $pH = 4{,}76 \pm 0{,}05$) — valeur qui coïncide avec le $pK_A$ recalculé depuis $pH = 3{,}6$ et $C_A = 4{,}2\cdot10^{-3}$ ;
      - **à $pH_1 = 4{,}2$, la courbe croissante (base) passe exactement par le trait chiffré $20\ \%$** : $\alpha(CH_3COO^-) = 20\ \%$. *(Cette lecture porte toute la question 1-4-3 : sans elle l'exercice n'est pas exploitable. Elle est vérifiée par Henderson : $10^{4{,}2-4{,}8} = 0{,}251$ donne $\alpha = 0{,}251/1{,}251 = 20{,}1\ \%$.)*

      Légende : « Figure 1 ».
    questions:
      - id: q1
        stem: |-
          **1-1. (0,5 pt)** Écrire l'équation chimique modélisant la réaction de l'acide éthanoïque avec l'eau.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Une réaction acido-basique combine toujours deux couples (chapitre 2) : ici, l'acide éthanoïque $CH_3COOH$ du couple donné dans l'énoncé, et l'eau, qui doit accepter le proton cédé — l'eau joue donc ici son rôle de **base**, dans le couple $H_3O^+/H_2O$.

          $$\boxed{CH_3COOH_{(aq)} + H_2O_{(l)} \rightleftharpoons CH_3COO^-_{(aq)} + H_3O^+_{(aq)}}$$

          **Pourquoi la double flèche.** L'acide éthanoïque est un acide **faible** : sa réaction avec l'eau est **limitée**, elle s'arrête sur un équilibre (chapitre 8) — c'est exactement ce que les questions 1-2 et 1-3 vont chiffrer.

          **Le piège nommé de cette question.** Ne fais pas de l'eau un simple spectateur qu'on écrirait par réflexe sans rôle : c'est elle qui accepte le proton cédé par l'acide, dans son rôle basique du couple $H_3O^+/H_2O$ — l'eau est un **ampholyte** (chapitre 2), et confondre ce rôle avec son rôle acide (couple $H_2O/HO^-$, mobilisé plus loin dans cet exercice, au §3) fait perdre le point.
      - id: q2
        stem: |-
          **1-2. (0,5 pt)** Exprimer $\tau$, le taux d'avancement final de cette réaction, en fonction de $C_A$ et $pH$. Calculer sa valeur.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $\tau = x_f/x_{max}$, le taux d'avancement final, est une définition **générale** construite nommément au chapitre 3 de la notion **État d'équilibre d'un système chimique** ; on la réutilise ici exactement comme au chapitre 7 de cette leçon-ci, sur le cas particulier d'un acide qui réagit avec l'eau. Chaque molécule $CH_3COOH$ qui a réagi (question 1-1) produit exactement un ion $H_3O^+$, donc l'avancement final se lit sur $[H_3O^+]_{eq}$ ; une conversion **totale** de l'acide introduit aurait donné $[H_3O^+]_{max} = C_A$. Le rapport des deux, une fois le volume $V$ simplifié (chapitre 7), donne :

          $$\tau = \frac{x_f}{x_{max}} = \frac{[H_3O^+]_{eq}}{C_A}$$

          **L'application numérique, chiffre par chiffre.** D'abord $[H_3O^+]_{eq}$, directement depuis le pH mesuré (définition du pH, chapitre 3) :

          $$[H_3O^+]_{eq} = 10^{-\text{pH}} = 10^{-3{,}6} \approx 2{,}51\times10^{-4}\ \text{mol.L}^{-1}$$

          Puis le rapport, avec $C_A = 4{,}2\times10^{-3}\ \text{mol.L}^{-1}$ :

          $$\tau = \frac{2{,}51\times10^{-4}}{4{,}2\times10^{-3}}$$

          $$\boxed{\tau \approx 0{,}060 = 6{,}0\ \%}$$

          **Le piège nommé de cette question.** $\tau$ est loin de $1$ : seulement $6\,\%$ de l'acide introduit a effectivement réagi avec l'eau, le reste — $94\,\%$ — est resté sous forme $CH_3COOH$ intacte. C'est la signature d'un acide **faible** (chapitre 7) ; écrire $\tau \approx 1$ « parce que l'acide a réagi » confond avoir réagi un peu et avoir réagi presque totalement — deux choses très différentes que seul le chiffre distingue.
      - id: q3
        stem: |-
          **1-3. (0,5 pt)** Déterminer la valeur de $pK_A$ du couple $CH_3COOH_{(aq)}/CH_3COO^-_{(aq)}$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** $K_A$ est, par définition (chapitre 5 de cette leçon), la constante d'équilibre de la réaction écrite à la question 1-1 — c'est le même objet que la constante $K$ introduite nommément aux chapitre 4-4 de la notion **État d'équilibre d'un système chimique**, appliqué ici spécifiquement au couple $CH_3COOH_{(aq)}/CH_3COO^-_{(aq)}$. Il faut reconstituer les trois concentrations à l'équilibre à partir des deux seules données disponibles : le pH et $C_A$.

          $[H_3O^+]_{eq}$ vient d'être trouvée à la question précédente. Comme l'acide et l'eau produisent $CH_3COO^-$ et $H_3O^+$ en quantités égales (question 1-1), et en négligeant la contribution de l'autoprotolyse de l'eau (hypothèse valable ici, $[H_3O^+]_{eq}$ étant très supérieure à $10^{-7}\ \text{mol.L}^{-1}$) :

          $$[CH_3COO^-]_{eq} \approx [H_3O^+]_{eq} \approx 2{,}51\times10^{-4}\ \text{mol.L}^{-1}$$

          Ce qu'il reste de l'acide initial, une fois retirée la part qui a réagi :

          $$[CH_3COOH]_{eq} \approx C_A - [H_3O^+]_{eq} = 4{,}2\times10^{-3} - 2{,}51\times10^{-4} \approx 3{,}95\times10^{-3}\ \text{mol.L}^{-1}$$

          $$K_A = \frac{[CH_3COO^-]_{eq}\,[H_3O^+]_{eq}}{[CH_3COOH]_{eq}} = \frac{(2{,}51\times10^{-4})^2}{3{,}95\times10^{-3}}$$

          $$\boxed{K_A \approx 1{,}60\times10^{-5}}$$

          $$pK_A = -\log K_A = -\log(1{,}60\times10^{-5})$$

          $$\boxed{pK_A \approx 4{,}80}$$

          **Le piège nommé de cette question.** Ne calcule pas $K_A$ avec la concentration **apportée** $C_A$ au dénominateur : c'est $[CH_3COOH]_{eq}$, la concentration **restante** une fois la réaction établie, qu'il faut y placer — ici la différence est faible ($3{,}95\times10^{-3}$ contre $4{,}2\times10^{-3}\ \text{mol.L}^{-1}$) mais elle n'est pas nulle, et l'énoncé demande la valeur exacte, pas une approximation grossière.
      - id: q4
        stem: |-
          **1-4-1. (0,5 pt)** A partir du graphe, déterminer, à nouveau, la valeur du $pK_A$.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Sur un diagramme de distribution, le $pK_A$ du couple est le pH où les deux courbes se **croisent** — le point où chaque forme vaut exactement $50\,\%$ (chapitre 9) : $\%A^- = 100/(1+10^{pK_A-\text{pH}})$ vaut $50$ précisément quand l'exposant $pK_A - \text{pH}$ est nul, c'est-à-dire quand $\text{pH} = pK_A$.

          **La lecture.** Sur la figure 1, les deux courbes sigmoïdes se croisent à $50\,\%$ pour $\text{pH} = 4{,}8$.

          $$\boxed{pK_A \approx 4{,}8}$$

          **Le contrôle.** C'est exactement la valeur trouvée par le calcul à la question 1-3 ($pK_A \approx 4{,}80$) : les deux méthodes — calcul depuis une seule mesure de pH, lecture d'un diagramme construit à partir de nombreux points — se recoupent, comme elles le doivent.

          **Le piège nommé de cette question.** Ne lis pas le $pK_A$ à l'endroit où l'une des deux courbes atteint $100\,\%$ ou $0\,\%$ : ces asymptotes ne portent aucune information sur $pK_A$, seul le **croisement** à $50\,\%$ le fait (chapitre 9). Et ne cherche pas non plus ce croisement à $\text{pH} = 7$ par réflexe de neutralité : $pK_e = 14$ fixe la neutralité de l'eau, $pK_A$ est une propriété du **couple** étudié et n'a, en général, aucune raison de valoir $7$.
      - id: q5
        stem: |-
          **1-4-2. (0,25 pt)** Justifier que la courbe 1 correspond à l'espèce acide.
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Il faut relier l'**allure** de la courbe 1 à ce que dit la formule du diagramme de distribution (chapitre 9) aux deux extrêmes de pH.

          $$\%AH = \frac{100}{1+10^{\,\text{pH}-pK_A}}$$

          Aux pH **faibles** ($\text{pH} \ll pK_A$), l'exposant $\text{pH}-pK_A$ est très négatif, $10^{(\cdot)} \to 0$, donc $\%AH \to 100$. Aux pH **élevés** ($\text{pH} \gg pK_A$), l'exposant est très positif, $10^{(\cdot)} \to \infty$, donc $\%AH \to 0$ : la courbe de la forme **acide** est nécessairement **décroissante**, de $100\,\%$ vers $0\,\%$.

          Or c'est exactement l'allure de la courbe 1, décrite dans la figure 1 : elle part du haut du cadre ($100\,\%$) aux faibles pH et tend vers $0$ aux pH élevés.

          $$\boxed{\text{La courbe 1 est décroissante\,: c’est donc l’espèce acide } CH_3COOH}$$

          **Le piège nommé de cette question.** Cette question n'est pas décorative : le scan d'origine de ce sujet portait des flèches d'étiquetage « Courbe 1 » / « Courbe 2 » ambiguës, corrigées ici par mesure au pixel (voir la NOTE ÉDITORIALE en tête de cette entrée) — c'est précisément pour cette raison que la question demande de **justifier**, et pas seulement de nommer : le critère qui tranche est l'**allure** de la courbe (décroissante = acide, chapitre 9), jamais l'étiquette imprimée à côté, qui peut être trompeuse à la lecture rapide d'un scan.
      - id: q6
        stem: |-
          **1-4-3. (0,5 pt)** On dilue la solution $S_A$ pour obtenir une solution $S_{A1}$ de concentration $C_{A1}$ et de $pH_1 = 4{,}2$. En se basant sur les courbes de la figure 1, trouver la nouvelle valeur $\tau_1$ du taux d'avancement final de la réaction de l'acide éthanoïque avec l'eau. Que peut-on conclure à propos de l'effet de la dilution sur le taux d'avancement final ?
        reasoning: |-
          **Ce qu'on cherche et pourquoi ce geste.** Le pourcentage $\alpha(CH_3COO^-)$ défini par l'énoncé a exactement la forme du pourcentage $\%A^-$ construit au chapitre 9 de cette leçon : $\alpha(CH_3COO^-) = [CH_3COO^-]_{eq}/([CH_3COOH]_{eq}+[CH_3COO^-]_{eq}) \times 100$. Et le dénominateur de $\alpha$ n'est autre que la concentration totale du couple, conservée par bilan de matière : $[CH_3COOH]_{eq}+[CH_3COO^-]_{eq} = C_{A1}$, la concentration analytique de $S_{A1}$ (rien ne se perd, tout ce qui a été dissous reste sous l'une ou l'autre forme). Or c'est exactement le dénominateur de $\tau_1 = x_f/x_{max}$, une fois le volume simplifié (même geste qu'à la question 1-2) : $\tau_1 = [CH_3COO^-]_{eq}/C_{A1}$. Les deux rapports sont donc identiques :

          $$\tau_1 = \frac{[CH_3COO^-]_{eq}}{C_{A1}} = \frac{[CH_3COO^-]_{eq}}{[CH_3COOH]_{eq}+[CH_3COO^-]_{eq}} = \frac{\alpha(CH_3COO^-)}{100}$$

          **La lecture.** Sur la figure 1, à $\text{pH}_1 = 4{,}2$, la courbe croissante (la base $CH_3COO^-$) passe exactement par le trait chiffré $20\,\%$ : $\alpha(CH_3COO^-) = 20\,\%$.

          $$\boxed{\tau_1 = 0{,}20}$$

          **La conclusion sur l'effet de la dilution.** $\tau$ est passé de $0{,}060$ (question 1-2, solution $S_A$ non diluée) à $\tau_1 = 0{,}20$ (solution diluée $S_{A1}$) : **la dilution fait augmenter le taux d'avancement final**. Pourquoi, mécaniquement : reprends $K_A = C\,\tau^2/(1-\tau)$ (relation déjà établie à partir des chapitre 5 et 6 de cette leçon, pas un outil neuf). $K_A$ est fixé — c'est le même couple dans les deux béchers — donc si $C$ diminue, le facteur $\tau^2/(1-\tau)$ doit **augmenter** d'autant pour que le produit reste constant, et cette quantité croît avec $\tau$ : diluer force $\tau$ à monter. C'est le cas particulier, pour un acide, de la **loi de dilution** établie nommément au chapitre 7 de la notion **État d'équilibre d'un système chimique** : diluer un système dont le sens direct augmente le nombre d'espèces dissoutes (ici, une molécule $CH_3COOH$ donne deux entités, $CH_3COO^-$ et $H_3O^+$, contre une seule au départ — l'eau, solvant, n'est pas comptée) fait toujours **augmenter** $\tau$.

          **Le piège nommé de cette question.** Ne confonds pas la **force** de l'acide (son $K_A$, son $pK_A$ — une propriété du couple, indépendante de la concentration, chapitre 7) et son **taux d'avancement final** $\tau$ (une propriété de la **solution**, qui dépend à la fois du couple et de la concentration). $pK_A$ reste $4{,}80$ dans les deux béchers ; $\tau$, lui, quadruple presque. On ne peut jamais comparer la force de deux acides par leur seul $\tau$, sauf à concentration égale.

