    intro: |-
      **Réactions de l'acide butanoïque avec l'eau (examen national, session normale 2017, Exercice I — Partie II, §1, 2,00 points sur les 7,00 de l'exercice).**

      *La Partie I de cet exercice — la pile aluminium-cuivre — vit sous la notion « Piles ». Le §2 de cette même Partie II — estérification de l'acide butanoïque contre anhydride butanoïque sur l'éthanol — vit sous la notion « Estérification et hydrolyse ».*

      L'acide butanoïque $\text{C}_3\text{H}_7\text{COOH}$ est utilisé pour préparer des produits cosmétiques et des arômes alimentaires. On se propose dans cette partie d'étudier la réaction entre l'acide butanoïque et l'eau et de comparer les actions de cet acide et de l'anhydride butanoïque sur l'éthanol $\text{C}_2\text{H}_5\text{OH}$.

      On prépare, dans un laboratoire de chimie, une solution aqueuse d'acide butanoïque de volume $V$ et de concentration molaire $C = 1{,}0\times10^{-2}\ \text{mol.L}^{-1}$. Le pH de cette solution est $\text{pH} = 3{,}41$.

      On modélise la transformation produite par l'équation chimique suivante :

      $$\text{C}_3\text{H}_7\text{COOH}_{(aq)} + \text{H}_2\text{O}_{(l)} \rightleftharpoons \text{C}_3\text{H}_7\text{COO}^-_{(aq)} + \text{H}_3\text{O}^+_{(aq)}$$
    questions:
      - id: q1
        stem: |-
          **(0,75 pt)** Déterminer le taux d'avancement final de la réaction. En déduire.
        reasoning: |-
          Le stem est transcrit tel qu'imprimé, y compris sa phrase finale : « En déduire. », sans objet — un défaut confirmé du sujet officiel (la ligne s'arrête là au même endroit sur le PDF natif, la ligne suivante est déjà la question 1.2). Ce que le raisonnement ci-dessous traite : le calcul du taux d'avancement final $\tau$, qui est la seule partie exploitable de la question ; et, par analogie avec la question 2.3 du §2 de cette même partie (« En déduire laquelle des deux réactions chimiques est totale »), la conclusion la plus naturelle que ce calcul permet — dire si la réaction est limitée ou totale.

          Comme au chapitre 7 de cette leçon, $\tau = x_f/x_{max}$. Chaque molécule $\text{C}_3\text{H}_7\text{COOH}$ qui a réagi produit exactement un ion $\text{H}_3\text{O}^+$ (équation donnée), donc l'avancement final se lit sur $[\text{H}_3\text{O}^+]_{eq}$ ; une conversion totale de l'acide introduit aurait donné $[\text{H}_3\text{O}^+]_{max} = C$. Le volume $V$ se simplifie dans le rapport :

          $$\tau = \frac{[\text{H}_3\text{O}^+]_{eq}}{C}$$

          D'abord $[\text{H}_3\text{O}^+]_{eq}$, directement depuis le pH (chapitre 3) :

          $$[\text{H}_3\text{O}^+]_{eq} = 10^{-\text{pH}} = 10^{-3{,}41} \approx 3{,}89\times10^{-4}\ \text{mol.L}^{-1}$$

          Puis le rapport, avec $C = 1{,}0\times10^{-2}\ \text{mol.L}^{-1}$ :

          $$\boxed{\tau \approx 0{,}0389 = 3{,}89\ \%}$$

          **Ce que le contexte permet de traiter à la place de l'« En déduire » manquant.** $\tau$ est très inférieur à $1$ : seulement $3{,}89\ \%$ de l'acide introduit a réagi. On en déduit que la réaction de l'acide butanoïque avec l'eau est **limitée** — exactement le type de conclusion que le §2 de cette même partie (question 2.3) demande explicitement pour un couple de réactions comparées. C'est un acide **faible** (chapitre 7), signature cohérente avec un $pK_A$ proche de $4{,}8$ (question 3).
        steps:
          - math: '[\text{H}_3\text{O}^+]_{eq} = 10^{-\text{pH}} = 10^{-3{,}41} \approx 3{,}89\times10^{-4}\ \text{mol.L}^{-1}'
            note: "Définition du pH (chapitre 3), inversee."
          - math: '\tau = \frac{[\text{H}_3\text{O}^+]_{eq}}{C} = \frac{3{,}89\times10^{-4}}{1{,}0\times10^{-2}}'
            note: "Chapitre 7 : x_f/x_max, volume simplifie."
          - math: '\boxed{\tau \approx 0{,}0389 = 3{,}89\ \%}'
            note: "Réaction limitée (tau << 1) : c'est ce que le contexte permet de déduire, voir le raisonnement."
      - id: q2
        stem: |-
          **(0,75 pt)** Trouver, en fonction de $C$ et du $pH$, l'expression du quotient de réaction $Q_{r,eq}$ à l'équilibre, puis calculer sa valeur.
        reasoning: |-
          Comme dans l'exemple travaillé du chapitre 5, on reconstitue les trois concentrations à l'équilibre depuis les deux seules données disponibles, $C$ et le pH. L'équation (donnée) produit $\text{C}_3\text{H}_7\text{COO}^-$ et $\text{H}_3\text{O}^+$ en quantités égales, et en négligeant la contribution de l'autoprotolyse de l'eau (hypothèse valable ici, $[\text{H}_3\text{O}^+]_{eq}$ étant très supérieure à $10^{-7}\ \text{mol.L}^{-1}$) :

          $$[\text{C}_3\text{H}_7\text{COO}^-]_{eq} \approx [\text{H}_3\text{O}^+]_{eq} = 10^{-\text{pH}}$$

          Ce qu'il reste de l'acide initial, une fois retirée la part qui a réagi (chapitre 7) :

          $$[\text{C}_3\text{H}_7\text{COOH}]_{eq} \approx C - [\text{H}_3\text{O}^+]_{eq} = C - 10^{-\text{pH}}$$

          $$\boxed{Q_{r,eq} = \frac{[\text{C}_3\text{H}_7\text{COO}^-]_{eq}\,[\text{H}_3\text{O}^+]_{eq}}{[\text{C}_3\text{H}_7\text{COOH}]_{eq}} = \frac{\left(10^{-\text{pH}}\right)^2}{C-10^{-\text{pH}}}}$$

          Numériquement, avec $10^{-\text{pH}} \approx 3{,}89\times10^{-4}\ \text{mol.L}^{-1}$ (question 1) :

          $$Q_{r,eq} = \frac{(3{,}89\times10^{-4})^2}{1{,}0\times10^{-2}-3{,}89\times10^{-4}}$$

          Le piège nommé de cette question. Ne pas mettre $C$ seule au dénominateur : c'est $[\text{C}_3\text{H}_7\text{COOH}]_{eq}$, la concentration RESTANTE à l'équilibre, qu'il faut y placer — la différence est faible (question 1 vient de montrer que seulement $3{,}89\ \%$ de l'acide a réagi) mais elle n'est pas nulle.
        steps:
          - math: 'Q_{r,eq} = \frac{\left(10^{-\text{pH}}\right)^2}{C-10^{-\text{pH}}}'
            note: "Expression en fonction de C et pH (chapitre 5), même geste que l'exemple travaille du chapitre."
          - math: 'Q_{r,eq} = \frac{(3{,}89\times10^{-4})^2}{1{,}0\times10^{-2}-3{,}89\times10^{-4}}'
            note: "Application numérique."
          - math: '\boxed{Q_{r,eq} \approx 1{,}57\times10^{-5}}'
            note: "Valeur a l'équilibre."
      - id: q3
        stem: |-
          **(0,5 pt)** En déduire la valeur du $pK_A$ du couple $\text{C}_3\text{H}_7\text{COOH}_{(aq)}\,/\,\text{C}_3\text{H}_7\text{COO}^-_{(aq)}$.
