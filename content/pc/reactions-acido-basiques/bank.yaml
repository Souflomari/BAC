    intro: |-
      **Réaction de l'acide méthanoïque avec l'eau (examen national, session de rattrapage 2013 — Chimie, deuxième partie §1, 2,25 points sur les 05,00 de la deuxième partie).**

      *Le §2 de cette même deuxième partie — la synthèse du méthanoate d'éthyle (2,75 pt) — est indépendant et vit sous « Estérification et hydrolyse », entrée bk-2013-r-x1c. La Première partie du même exercice de Chimie (électrolyse, 2,00 pt) vit sous « Électrolyse », entrée bk-2013-r-x1. 2,00 + 2,25 + 2,75 = 7,00, le barème imprimé.*

      Le méthanoate d'éthyle $\text{HCOOC}_2\text{H}_5$ est utilisé comme solvant pour dissoudre les graisses et les dérivés de cellulose ; il est aussi utilisé dans l'industrie alimentaire pour donner de la saveur aux aliments synthétisés. <!-- DIVERGENCES DÉCLARÉES (D3 et D11), 2026-09-04. L'édition
           française de ce sujet est MINISTÉRIELLE (code d'examen RS28 encadré,
           imprimé à l'identique dans les deux cartouches ; pieds de page vides
           sur les six pages ; aucun crédit de traducteur) : ce qui suit est donc
           un défaut du DOCUMENT OFFICIEL francophone, pas un artefact de
           traduction professorale.
           D3 — l'original arabe écrit « كمادة تضفي نكهة التوت على الأطعمة
           المصنّعة », « une substance qui donne le goût DE MÛRE aux aliments
           transformés » : le document officiel français a supprimé le fruit et
           écrit seulement « de la saveur ».
           D11 — « الأطعمة المصنّعة » signifie « aliments TRANSFORMÉS /
           manufacturés » ; le document officiel écrit « aliments synthétisés »,
           qui ne veut rien dire en français agroalimentaire.
           Les deux sont cosmétiques : aucune question n'en dépend, et le texte
           est reproduit ici tel qu'imprimé. Voir
           docs/sujets/_incoming/pc-2013-r.md, D3 / D11 et V.7/V.8. --> Il est préparé au laboratoire par réaction l'acide méthanoïque *(sic — « par réaction **de** l'acide »)* $\text{HCOOH}$ avec l'éthanol.

      **Le but de cette partie de l'exercice** est l'étude de la réaction de l'acide méthanoïque avec l'eau et la synthèse du méthanoate d'éthyle.

      **1- Étude de la réaction de l'acide méthanoïque avec l'eau :**

      On considère une solution aqueuse d'acide méthanoïque, de volume $V$, et de concentration molaire $C = 5{,}0\ \text{mol.m}^{-3}$. La mesure de la conductivité de cette solution donne à $25\ ^\circ\text{C}$ : $\sigma = 4{,}0\times10^{-2}\ \text{S.m}^{-1}$.

      **Données :**
      - L'expression de la conductivité $\sigma$ d'une solution aqueuse est $\sigma = \sum_i \lambda_i\,[X_i]$, où $[X_i]$ est la concentrations molaires effectives *(sic)* de l'espèce ionique $X_i$ se trouvant dans la solution et $\lambda_i$ sa conductivité molaire ioniques *(sic)*.
      - $\lambda_{\text{H}_3\text{O}^+} = 35{,}0\times10^{-3}\ \text{S.m}^{2}.\text{mol}^{-1}$ ;
      - $\lambda_{\text{HCOO}^-} = 5{,}46\times10^{-3}\ \text{S.m}^{2}.\text{mol}^{-1}$ ;
      - On néglige l'action des ions $\text{HO}^-$ sur la conductivité de la solution.

      *Attention à l'unité de $C$ : elle est en $\text{mol.m}^{-3}$, pas en $\text{mol.L}^{-1}$ — c'est un choix délibéré du sujet, qui rend l'expression de la question 1-2 directement homogène.*
    questions:
      - id: q1
        part: "Chimie, deuxième partie §1 — Réaction de l'acide méthanoïque avec l'eau"
        stem: |-
          **1-1-** (0,5 pt) Dresser le tableau descriptif de l'avancement de la réaction de l'acide méthanoïque avec l'eau.
        reasoning: |-
          Avant le tableau, l'équation — et elle s'écrit avec le geste du chapitre 2 : l'acide méthanoïque $\text{HCOOH}$ **cède** un proton, l'eau le **capte**. Deux couples sont donc en jeu, jamais un seul : $\left(\text{HCOOH}/\text{HCOO}^-\right)$ et $\left(\text{H}_3\text{O}^+/\text{H}_2\text{O}\right)$. La double flèche dit que la transformation est **limitée** — c'est précisément ce que le $\tau$ de la question suivante va chiffrer.

          $$\text{HCOOH}_{(aq)} + \text{H}_2\text{O}_{(\ell)} \rightleftharpoons \text{HCOO}^-_{(aq)} + \text{H}_3\text{O}^+_{(aq)}$$

          Le tableau se dresse alors en quantités de matière, sur le volume $V$ de solution :

          | État | Avancement | $\text{HCOOH}$ | $\text{H}_2\text{O}$ | $\text{HCOO}^-$ | $\text{H}_3\text{O}^+$ |
          |---|---|---|---|---|---|
          | initial | $0$ | $C\,V$ | excès | $0$ | $0$ |
          | intermédiaire | $x$ | $C\,V - x$ | excès | $x$ | $x$ |
          | final | $x_f$ | $C\,V - x_f$ | excès | $x_f$ | $x_f$ |

          **Deux points qui décident la suite.** D'abord, l'eau est le **solvant** : sa quantité est notée « excès » et ne descend jamais, ce qui interdit de la traiter comme un réactif limitant. Ensuite, l'acide est donc le seul réactif limitant possible, ce qui fixe $x_{max} = C\,V$ — la valeur dont la question 1-2 a besoin.

          **Le piège de cette question.** Écrire une demi-équation seule ($\text{HCOOH} \rightleftharpoons \text{HCOO}^- + \text{H}^+$) : un proton ne voyage jamais libre en solution, et le chapitre 2 le dit — une réaction acido-basique met **toujours** deux couples face à face.
      - id: q2
        stem: |-
          **1-2-** (0,75 pt) Trouver l'expression du taux d'avancement final $\tau$ en fonction de $\sigma$, $\lambda_{\text{HCOO}^-}$, $\lambda_{\text{H}_3\text{O}^+}$ et $C$. Calculer sa valeur.
        reasoning: |-
          **SCOPE NOTE (technique donnée par l'énoncé, non enseignée par cette leçon).** La relation $\sigma = \sum_i \lambda_i\,[X_i]$ — la conductivité d'une solution est la somme, sur chaque ion présent, du produit de sa conductivité molaire ionique par sa concentration effective — n'est pas construite dans les chapitres 2 à 13 de cette leçon. Elle est **donnée dans l'énoncé**, et c'est ainsi qu'il faut la traiter : un outil de mesure fourni, pas un résultat à retrouver. Ce qui relève bien de la leçon, c'est tout le reste : passer d'une concentration d'ions à un avancement, et d'un avancement à un taux.

          **CROSS-LIST honoré ici (« Évolution spontanée d'un système chimique »).** Le taux d'avancement final $\tau = x_f/x_{max}$ est aussi l'outil central de cette autre notion, où il sert à mesurer à quel point une transformation est limitée. Il pèse une demi-question sur les 2,25 pt de cette entrée : la règle de la maison veut qu'un cross-list de ce poids soit honoré dans le raisonnement plutôt que dédoublé en une entrée orpheline. La démonstration est donc refaite ici en entier.

          **La chaîne, en trois maillons.**

          1. **Ce que le tableau donne.** L'acide est le seul réactif limitant (question 1-1), donc $x_{max} = C\,V$, et $\tau = \dfrac{x_f}{x_{max}} = \dfrac{x_f/V}{C} = \dfrac{[\text{H}_3\text{O}^+]_f}{C}$ — le taux est simplement le rapport de l'ion oxonium formé à l'acide introduit.
          2. **Ce que la mesure donne.** Deux ions seulement contribuent à $\sigma$ (l'énoncé fait négliger $\text{HO}^-$), et le tableau les produit **en quantités égales** : $[\text{HCOO}^-]_f = [\text{H}_3\text{O}^+]_f = x_f/V$. La somme $\sigma = \sum_i \lambda_i[X_i]$ se factorise donc par cette concentration commune.
          3. **On égalise.** La concentration commune s'exprime depuis $\sigma$, et on la reporte dans $\tau$.

          $$\boxed{\tau = \frac{\sigma}{\left(\lambda_{\text{H}_3\text{O}^+} + \lambda_{\text{HCOO}^-}\right)\,C}}$$

          **Le piège d'unité, et il est délibéré.** $C$ est donné en $\text{mol.m}^{-3}$ et les $\lambda_i$ en $\text{S.m}^{2}.\text{mol}^{-1}$ : le produit $\lambda\,C$ est alors en $\text{S.m}^{-1}$, exactement l'unité de $\sigma$, et le rapport sort **sans dimension**, comme doit l'être un taux. Convertir $C$ en $\text{mol.L}^{-1}$ ici, par réflexe, fait sortir $\tau$ d'un facteur $1000$ — et un taux d'avancement supérieur à $1$ est un résultat qui doit alerter, jamais être accepté.

          $\tau \approx 0{,}20$, soit environ $20\ \%$ : la transformation est **limitée**, un cinquième seulement de l'acide a réagi. C'est la signature d'un **acide faible**, et la question 1-4 va lui donner son $pK_a$.
        steps:
          - math: 'x_{max} = C\,V \quad\text{(l acide est le seul réactif limitant\,: l eau est le solvant)}'
            note: "Lecture du tableau d'avancement de la question 1-1."
          - math: '\tau = \frac{x_f}{x_{max}} = \frac{x_f/V}{C} = \frac{[\text{H}_3\text{O}^+]_f}{C}'
            note: "Définition du taux d'avancement final, ramenee a des concentrations."
          - math: '[\text{HCOO}^-]_f = [\text{H}_3\text{O}^+]_f = \frac{x_f}{V}'
            note: "Le tableau produit les deux ions en quantités egales, a partir de rien."
          - math: '\sigma = \left(\lambda_{\text{H}_3\text{O}^+} + \lambda_{\text{HCOO}^-}\right)\frac{x_f}{V}'
            note: "Relation donnée par l'énoncé, avec les ions HO- négligés : deux termes seulement."
          - math: '\boxed{\tau = \frac{\sigma}{\left(\lambda_{\text{H}_3\text{O}^+} + \lambda_{\text{HCOO}^-}\right)C}}'
            note: "Expression littérale demandee, en fonction des quatre grandeurs de la consigne."
          - math: '\lambda_{\text{H}_3\text{O}^+} + \lambda_{\text{HCOO}^-} = 35{,}0\times10^{-3} + 5{,}46\times10^{-3} = 40{,}46\times10^{-3}\ \text{S.m}^{2}.\text{mol}^{-1}'
            note: "Somme des deux conductivites molaires ioniques."
          - math: '\tau = \frac{4{,}0\times10^{-2}}{40{,}46\times10^{-3}\times 5{,}0} = \frac{4{,}0\times10^{-2}}{0{,}2023}'
            note: "Application numérique en unités SI : C en mol par metre cube, sans conversion."
          - math: '\boxed{\tau \approx 0{,}198 \approx 19{,}8\ \%}'
            note: "Transformation limitée : environ un cinquième de l'acide a reagi. Valeur re-derivee par la vérification : 0,1977."
      - id: q3
        stem: |-
          **1-3-** (0,5 pt) Calculer la valeur du pH de cette solution aqueuse.
        reasoning: |-
          le chapitre 3 donne la définition, dans le seul sens utile ici : $\text{pH} = -\log\left([\text{H}_3\text{O}^+]\right)$, **avec la concentration exprimée en $\text{mol.L}^{-1}$** — c'est la convention, et elle n'est pas négociable.

          La question 1-2 vient de fournir tout ce qu'il faut : $[\text{H}_3\text{O}^+]_f = \tau\,C$. Il ne reste donc qu'un calcul et **une conversion**, et c'est la conversion qui porte toute la difficulté de la question : $C$ est en $\text{mol.m}^{-3}$, et $1\ \text{mol.m}^{-3} = 10^{-3}\ \text{mol.L}^{-1}$ (un mètre cube vaut mille litres).

          **Contrôle de vraisemblance, à faire avant d'écrire la réponse.** Un acide faible à $5\times10^{-3}\ \text{mol.L}^{-1}$ ionisé à $20\ \%$ donne une concentration en $\text{H}_3\text{O}^+$ de l'ordre de $10^{-3}\ \text{mol.L}^{-1}$, donc un pH voisin de $3$. Un pH de $6$ (oubli de la conversion, dans un sens) ou de $0$ (dans l'autre) se repère à l'œil.

          **Le piège de cette question.** Passer directement de $\tau\,C = 0{,}989$ au logarithme : $-\log(0{,}989)$ vaut environ $0{,}005$, un pH absurde pour une solution d'acide faible aussi diluée. La conversion en $\text{mol.L}^{-1}$ est le geste, pas un détail.
        steps:
          - math: '[\text{H}_3\text{O}^+]_f = \tau\,C = 0{,}198\times 5{,}0 = 0{,}989\ \text{mol.m}^{-3}'
            note: "Concentration en ions oxonium, dans l'unité de l'énoncé."
          - math: '0{,}989\ \text{mol.m}^{-3} = 0{,}989\times10^{-3} = 9{,}89\times10^{-4}\ \text{mol.L}^{-1}'
            note: "Conversion obligatoire : un metre cube vaut mille litres. C'est le geste de la question."
          - math: '\text{pH} = -\log\left(9{,}89\times10^{-4}\right)'
            note: "Définition du pH (chapitre 3), avec la concentration en mol par litre."
          - math: '\boxed{\text{pH} \approx 3{,}00}'
            note: "Valeur re-derivee par la vérification : 3,005. Coherent avec un acide faible dilue."
      - id: q4
        stem: |-
          **1-4-** (0,5 pt) Trover *(sic, pour « Trouver »)* la valeur du $pKa$ du couple $\left(\text{HCOOH}_{(aq)}/\text{HCOO}^-_{(aq)}\right)$. *(Le document officiel écrit « pKa » avec un a minuscule ; l'original arabe et le corrigé écrivent $pK_A$.)*
        reasoning: |-
          le chapitre 5 donne la constante d'acidité du couple, écrite à l'équilibre :

          $$K_A = \frac{[\text{H}_3\text{O}^+]_{éq}\,[\text{HCOO}^-]_{éq}}{[\text{HCOOH}]_{éq}} \qquad\text{et}\qquad pK_A = -\log K_A$$

          Les trois concentrations se lisent sur le tableau de la question 1-1, exprimées avec $\tau$ — c'est le chemin le plus court, et il évite de repasser par $\sigma$ :

          - $[\text{H}_3\text{O}^+]_{éq} = [\text{HCOO}^-]_{éq} = \tau\,C$ ;
          - $[\text{HCOOH}]_{éq} = C - \tau\,C = C\,(1-\tau)$ — l'acide qui **reste**, c'est l'acide introduit moins celui qui a réagi.

          En reportant, le $C$ se simplifie une fois et il vient une formule qui mérite d'être retenue :

          $$K_A = \frac{(\tau C)^2}{C\,(1-\tau)} = \frac{C\,\tau^2}{1-\tau}$$

          **Ici encore, l'unité décide.** $K_A$ est défini avec des concentrations en $\text{mol.L}^{-1}$ : il faut donc entrer $C = 5{,}0\times10^{-3}\ \text{mol.L}^{-1}$, pas $5{,}0$.

          **Ce que le résultat raconte.** $pK_A \approx 3{,}6$ : c'est bien un acide **faible**, mais parmi les moins faibles des acides carboxyliques usuels — d'où le $\tau$ de $20\ \%$, nettement au-dessus de ce que donnerait l'acide éthanoïque ($pK_A = 4{,}8$) à la même concentration. le chapitre 5 le dit dans ce sens-là : $pK_A$ **petit** veut dire acide **plus fort**.

          *(La valeur tabulée de l'acide méthanoïque est $3{,}75$. L'écart vient des données choisies par le sujet, pas d'une erreur de calcul : c'est la conductivité imprimée qui fixe $\tau$, et $\tau$ qui fixe $pK_A$.)*
        steps:
          - math: 'K_A = \frac{[\text{H}_3\text{O}^+]_{eq}\,[\text{HCOO}^-]_{eq}}{[\text{HCOOH}]_{eq}}'
            note: "Définition de la constante d'acidité du couple (chapitre 5)."
          - math: '[\text{H}_3\text{O}^+]_{eq} = [\text{HCOO}^-]_{eq} = \tau\,C \qquad [\text{HCOOH}]_{eq} = C\,(1-\tau)'
            note: "Les trois concentrations a l'équilibre, lues sur le tableau de la question 1-1."
          - math: 'K_A = \frac{(\tau C)^2}{C\,(1-\tau)} = \frac{C\,\tau^2}{1-\tau}'
            note: "Le volume et un facteur C se simplifient : formule générale a retenir."
          - math: 'C = 5{,}0\ \text{mol.m}^{-3} = 5{,}0\times10^{-3}\ \text{mol.L}^{-1}'
            note: "Conversion obligatoire : KA se calcule avec des concentrations en mol par litre."
          - math: 'K_A = \frac{5{,}0\times10^{-3}\times(0{,}198)^2}{1-0{,}198} = \frac{1{,}961\times10^{-4}}{0{,}802} \approx 2{,}44\times10^{-4}'
            note: "Application numérique."
          - math: '\boxed{pK_A = -\log\left(2{,}44\times10^{-4}\right) \approx 3{,}61}'
            note: "Valeur re-derivee par la vérification : 3,613. Acide faible, mais peu : pKA petit veut dire acide plus fort (chapitre 5)."
