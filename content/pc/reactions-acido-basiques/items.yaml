        correct: true
      - id: C
        text: >-
          Ce sont deux présentations différentes de la même information :
          dès qu'on sait quelle forme prédomine, on connaît déjà son
          pourcentage exact
        correct: false
        misconception: AB-DIST-2
        feedback: >
          Deux solutions où $A^-$ prédomine peuvent être à $56\,\%$ ou à
          $99{,}9\,\%$ de $A^-$ : la prédominance ne distingue pas ces deux
          cas, seul le diagramme de distribution les distingue. Ce n'est
          donc pas la même information sous une autre forme, mais
          strictement plus d'information.
      - id: D
        text: >-
          À la frontière $\text{pH} = pK_A$ du diagramme de prédominance,
          la forme qui va prédominer juste au-dessus est déjà présente à
          la quasi-totalité
        correct: false
        misconception: AB-DIST-1
        feedback: >
          À $\text{pH} = pK_A$ pile, les deux formes sont à $50\,\%$
          chacune : c'est le point où elles sont le plus également
          représentées de toute la courbe, pas un instant de bascule vers
          la quasi-totalité.
    correct_feedback: >
      La distribution chiffre ($\%AH$, $\%A^-$) ; la prédominance ne fait
      que désigner un vainqueur. Ce n'est pas la même information : c'est
      strictement plus d'information.
    solution: |
      Le diagramme de prédominance est un axe de pH à une dimension, coupé
      par une frontière unique à $pK_A$ : il répond à « qui gagne ». Le
      diagramme de distribution est un graphe à deux dimensions (pourcentage
      en ordonnée, pH en abscisse) : il répond à « dans quelle proportion ».

  - id: RAB-30
    rung: "R8"
    difficulty_level: 5
    skill_code: pc_reactions_acido_basiques
    tags: ["lecture-graphique"]
    stem: >
      Le couple $NH_4^+/NH_3$ a $pK_A \approx 9{,}2$. Sur le diagramme de
      distribution de ce couple, à quel pH les deux courbes ($\%NH_4^+$ et
      $\%NH_3$) se croisent-elles à $50\,\%$ chacune ?
    type: mcq
    choices:
      - id: A
        text: >-
          À $\text{pH} = 7{,}0$, la neutralité, comme pour tout couple
          acide/base
        correct: false
        misconception: AB-DIST-3
        feedback: >
          $\text{pH} = 7{,}0$ fixe la neutralité de l'eau ($pK_e = 14$),
          une propriété qui ne dépend pas du couple étudié. Le croisement
          des courbes de distribution, lui, se situe à $\text{pH} = pK_A$
          du couple — ici $9{,}2$, très loin de $7$.
      - id: B
        text: >-
          À $\text{pH} = 9{,}2$, mais $NH_3$ y est déjà présent à la
          quasi-totalité, $NH_4^+$ ayant disparu
        correct: false
        misconception: AB-DIST-1
        feedback: >
          À $\text{pH} = pK_A$, l'exposant $pK_A - \text{pH}$ est nul :
          $\%NH_3 = 100/(1+10^0) = 50$. Rien n'a disparu à cet endroit,
          c'est au contraire le point d'égalité parfaite entre les deux
          formes.
      - id: C
        text: >-
          À $\text{pH} \approx 9{,}2$, le $pK_A$ du couple ; ce croisement
          n'a aucun rapport avec la neutralité de l'eau
        correct: true
      - id: D
        text: >-
          Cette question revient à demander où $NH_3$ prédomine :
          au-dessus de $pK_A$, sans qu'on puisse chiffrer davantage
        correct: false
        misconception: AB-DIST-2
        feedback: >
          On peut chiffrer bien davantage que « au-dessus de $pK_A$, $NH_3$
          prédomine » : c'est justement l'intérêt du diagramme de
          distribution de donner un pourcentage exact, ici $50\,\%$ pile au
          croisement, et non un simple verdict de prédominance.
    correct_feedback: >
      Le croisement à $50\,\%$/$50\,\%$ se situe toujours à
      $\text{pH} = pK_A$ du couple étudié — ici $9{,}2$ pour $NH_4^+/NH_3$ —
      et jamais à la neutralité $\text{pH} = 7$, qui est une propriété de
      l'eau ($pK_e$), pas du couple.
    solution: |
      $\%NH_3 = 100/(1+10^{pK_A-\text{pH}})$ vaut $50$ exactement quand
      l'exposant s'annule, soit $\text{pH} = pK_A \approx 9{,}2$. À
      $\text{pH} = 7{,}0$, on a déjà établi (chapitre 6) que
      $[NH_3]/[NH_4^+] \approx 6{,}3\times10^{-3}$ : $NH_4^+$ écrase $NH_3$,
      très loin d'un croisement à $50/50$.

  # ── R9 : titrage pH-métrique — équation support, montage, équivalence ──────
  - id: RAB-31
    rung: "R9"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale"]
    stem: >
      On dose un volume $V_A = 20{,}0$ mL d'une solution d'acide éthanoïque
      ($pK_A = 4{,}8$) par une solution de soude ($HO^-$) de concentration
      $C_B = 0{,}10$ mol/L. Concernant l'équivalence de ce dosage, quelle
      affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le pH à l'équivalence vaut exactement $7$, comme pour tout
          dosage acide-base
        correct: false
        misconception: AB-TIT-1
        feedback: >
          C'est vrai seulement pour un acide fort dosé par une base forte.
          Ici, à l'équivalence, tout l'acide éthanoïque a été converti en
          ion éthanoate $CH_3COO^-$, une base : le pH à l'équivalence est
          supérieur à $7$, pas égal à $7$.
      - id: B
        text: >-
          Le volume versé à l'équivalence vaut nécessairement
          $V_E = V_A = 20{,}0$ mL, puisqu'on neutralise ce volume
        correct: false
        misconception: AB-TIT-2
        feedback: >
          La relation à l'équivalence est $C_A V_A = C_B V_E$, donc
          $V_E = C_A V_A / C_B$. $V_E = V_A$ seulement si $C_A = C_B$ :
          rien ne le garantit ici, où $C_A$ est justement l'inconnue à
          déterminer.
      - id: C
        text: >-
          Une réaction acide-base même limitée (non totale) donnerait tout
          aussi bien une équivalence exploitable
        correct: false
        misconception: AB-TIT-3
        feedback: >
          Une réaction limitée ne va jamais jusqu'au bout : il reste, à
          tout volume versé, un mélange flou de réactifs et de produits,
          sans palier net avant/après. C'est justement pour obtenir une
          équivalence nette qu'on exige $K \gg 1$ (réaction totale, rapide
          et unique).
      - id: D
        text: >-
          Le pH à l'équivalence est supérieur à $7$ ; il se lit sur le
          saut de la courbe, sans formule fermée
        correct: true
    correct_feedback: >
      À l'équivalence, la solution ne contient, comme espèce du couple, que
      la base conjuguée $CH_3COO^-$ : le milieu est basique,
      $\text{pH}_E > 7$. Cette valeur se lit sur le saut de la courbe
      expérimentale, elle ne se calcule pas par une formule fermée.
    solution: |
      L'équivalence est un fait de stœchiométrie ($C_A V_A = C_B V_E$), pas
      une valeur de pH imposée. Pour un acide faible dosé par une base
      forte, l'espèce restante à l'équivalence est la base conjuguée :
      $\text{pH}_E > 7$, lu graphiquement au chapitre suivant.

  - id: RAB-32
    rung: "R9"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale", "TP-aspirine"]
    stem: >
      Lors d'un TP, on dose $V_A = 10{,}0$ mL d'une solution d'aspirine
      (acide acétylsalicylique, un acide faible monoacide, de concentration
      inconnue $C_A$) par une solution d'hydroxyde de sodium de
      concentration $C_B = 5{,}0 \times 10^{-2}$ mol/L. La courbe
      $\text{pH} = f(V)$ relevée donne un volume équivalent
      $V_E = 12{,}0$ mL. Quelle est la concentration $C_A$ de la solution
      d'aspirine ?
    type: mcq
    choices:
      - id: A
        text: >-
          $C_A = C_B V_E / V_A = 6{,}0\times10^{-2}$ mol/L, par la relation
          d'équivalence entre les deux espèces titrées
        correct: true
      - id: B
        text: >-
          $C_A = C_B = 5{,}0\times10^{-2}$ mol/L, car à l'équivalence les
          concentrations d'acide et de base sont nécessairement égales
        correct: false
        misconception: AB-TIT-2
        feedback: >
          La relation à l'équivalence est $C_A V_A = C_B V_E$ : elle relie
          les concentrations *aux volumes correspondants*, elle ne les rend
          pas égales entre elles. Ici $V_A \neq V_E$
          ($10{,}0 \neq 12{,}0$), donc $C_A \neq C_B$.
      - id: C
        text: >-
          Impossible à calculer : la relation $C_A V_A = C_B V_E$ ne vaut
          que si le pH à l'équivalence est $7$, ce qui n'est pas garanti
          ici
        correct: false
        misconception: AB-TIT-1
        feedback: >
          La relation $C_A V_A = C_B V_E$ est une égalité de quantités de
          matière, tirée uniquement de la stœchiométrie de la réaction :
          elle ne mentionne le pH nulle part et reste valable même quand
          $\text{pH}_E \neq 7$ (ce qui est le cas ici, l'aspirine étant un
          acide faible).
      - id: D
        text: >-
          Le résultat serait le même si la réaction acide-base n'était pas
          totale : la relation $C_A V_A = C_B V_E$ resterait valable pour
          une réaction limitée
        correct: false
        misconception: AB-TIT-3
        feedback: >
          La relation $C_A V_A = C_B V_E$ suppose une réaction support
          totale ($K \gg 1$) : c'est cette totalité qui rend le volume
          $V_E$ net et exploitable. Une réaction limitée ne donne aucune
          équivalence nette à lire sur la courbe.
    correct_feedback: >
      $C_A = C_B V_E / V_A = (5{,}0\times10^{-2} \times 12{,}0)/10{,}0 =
      6{,}0\times10^{-2}\ \text{mol/L}$.
    solution: |
      La réaction support (acide faible + $HO^-$, $K \gg 1$) est totale,
      donc l'équivalence est nette : $C_A V_A = C_B V_E$, soit
      $$
      C_A = \frac{C_B V_E}{V_A} = \frac{5{,}0\times10^{-2}\times12{,}0}{10{,}0}
      = 6{,}0\times10^{-2}\ \text{mol/L}
      $$

  - id: RAB-33
    rung: "R9"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Pourquoi la réaction support d'un titrage acido-basique doit-elle
      être totale, rapide et unique ($K \gg 1$) ?
    type: mcq
    choices:
      - id: A
        text: >-
          Pour garantir que le pH vaille exactement $7$ à l'équivalence
        correct: false
        misconception: AB-TIT-1
        feedback: >
          La totalité de la réaction ne fixe pas le pH à l'équivalence :
          elle garantit seulement qu'il existe un volume précis où tout le
          titré a été consommé. Ce pH dépend des espèces en présence, et
          n'est égal à $7$ que dans le cas particulier acide fort/base
          forte.
      - id: B
        text: >-
          Pour que l'équivalence soit une frontière stœchiométrique nette,
          exploitable par $C_A V_A = C_B V_E$
        correct: true
      - id: C
        text: >-
          Pour garantir que le volume versé à l'équivalence soit égal au
          volume initial du titré
        correct: false
        misconception: AB-TIT-2
        feedback: >
          Rien dans l'exigence $K \gg 1$ n'impose $V_E = V_A$ : cette
          égalité ne dépend que du rapport des concentrations $C_A$ et
          $C_B$, pas de la totalité de la réaction.
      - id: D
        text: >-
          Une réaction limitée (à l'équilibre) conviendrait tout aussi
          bien, du moment qu'on verse assez de titrant
        correct: false
        misconception: AB-TIT-3
        feedback: >
          Une réaction limitée ne consomme jamais totalement le réactif
          titré, quel que soit le volume versé : il subsiste toujours un
          mélange flou, sans palier net qui distingue un « avant » d'un
          « après ». Aucun volume particulier ne devient alors exploitable
          comme équivalence.
    correct_feedback: >
      $K \gg 1$ rend la réaction quasi totale : le titrant versé est
      consommé pour de bon, ce qui crée un volume $V_E$ précis où
      $C_A V_A = C_B V_E$ — une frontière stœchiométrique nette, sans
      laquelle aucune équivalence ne serait exploitable.
    solution: |
      Sans $K \gg 1$, il resterait à tout instant un mélange de réactifs et
      de produits dans des proportions floues (chapitre 8) : aucun volume ne
      marquerait un avant/après tranché, et la relation
      $C_A V_A = C_B V_E$ perdrait tout sens.

  # ── R10 : repérer l'équivalence — tangentes et dérivée ──────────────────────
  - id: RAB-34
    rung: "R10"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale", "lecture-graphique"]
    stem: >
      Sur une courbe $\text{pH} = f(V)$ d'un titrage, comment repère-t-on
      le volume équivalent $V_E$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          À l'abscisse du point où le pH de la solution titrée vaut exactement $7$
        correct: false
        misconception: AB-EQU-1
        feedback: >
          $V_E$ ne se lit pas à une valeur de pH fixée d'avance. Dans notre
          dosage, $\text{pH} = 7$ est atteint *avant* le point d'inflexion,
          sur la pente montante du saut : lire $V_E$ à cet endroit donnerait
          un volume trop petit.
      - id: B
        text: >-
          Là où la dérivée $d\text{pH}/dV$ de la courbe s'annule au cours du titrage
        correct: false
        misconception: AB-EQU-2
        feedback: >
          C'est l'inverse : à l'équivalence, $d\text{pH}/dV$ est
          **maximale**, pas nulle. La dérivée s'annule plutôt loin du saut,
          sur les paliers avant et après, là où il ne se passe presque
          rien.
      - id: C
        text: >-
          Au point d'inflexion de la courbe, au milieu du saut de pH, par la méthode des
          tangentes
        correct: true
      - id: D
        text: >-
          À l'abscisse où $\text{pH} = pK_A$, valeur que l'on relève au point de
          demi-équivalence du titrage
        correct: false
        misconception: AB-EQU-3
        feedback: >
          $\text{pH} = pK_A$ repère la **demi-équivalence** ($V_E/2$), un
          point utile mais distinct de l'équivalence : à $V_E/2$, seule la
          moitié du titré a réagi, ce n'est pas l'instant « juste
          stœchiométrique ».
    correct_feedback: >
      $V_E$ est le milieu du saut de pH, le point où la pente de la courbe
      est maximale (point d'inflexion) : on le repère géométriquement par
      les deux tangentes parallèles et leur médiane, ou par le maximum de
      la courbe dérivée.
    solution: |
      Autour de $V_E$, un tout petit ajout de titrant fait bondir le pH de
      plusieurs unités (le saut). Le point où la pente est maximale — le
      point d'inflexion — marque $V_E$ ; les deux méthodes (tangentes,
      dérivée) doivent s'accorder sur ce même volume.

  - id: RAB-35
    rung: "R10"
    difficulty_level: 5
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale", "lecture-graphique"]
    stem: >
      Sur la courbe dérivée $d\text{pH}/dV = f(V)$ d'un dosage, quel
      critère permet de repérer $V_E$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le point où $d\text{pH}/dV = 0$, comme pour tout extremum
        correct: false
        misconception: AB-EQU-2
        feedback: >
          C'est un réflexe qui vient d'ailleurs, appliqué au mauvais
          niveau : ici ce n'est pas le pH qu'on maximise, c'est sa dérivée.
          $d\text{pH}/dV$ vaut à peu près $0$ sur les paliers (loin de
          $V_E$) et culmine en un seul pic au milieu du saut — c'est ce pic
          qui marque $V_E$, pas un zéro.
      - id: B
        text: >-
          L'abscisse à laquelle le pH (lu sur la courbe $\text{pH}=f(V)$
          initiale) vaut $7$
        correct: false
        misconception: AB-EQU-1
        feedback: >
          Cette confusion plaque une valeur de pH fixée d'avance sur la
          lecture graphique. $V_E$ se lit au saut (le point d'inflexion,
          pente maximale), jamais à $\text{pH} = 7$.
      - id: C
        text: >-
          L'abscisse de la demi-équivalence, où l'on peut lire $pK_A$
        correct: false
        misconception: AB-EQU-3
        feedback: >
          La demi-équivalence ($V_E/2$, où $\text{pH} \approx pK_A$) est un
          point géométriquement distinct de l'équivalence : à cet endroit,
          la dérivée $d\text{pH}/dV$ n'est pas à son maximum, elle est
          encore en train de monter.
      - id: D
        text: >-
          Le maximum de $d\text{pH}/dV$, atteint au point d'inflexion de la courbe de pH
        correct: true
    correct_feedback: >
      Le pH varie le plus vite exactement au saut : c'est là que
      $d\text{pH}/dV$ atteint son maximum, et cette abscisse coïncide avec
      $V_E$ trouvé par la méthode des tangentes.
    solution: |
      La courbe $d\text{pH}/dV = f(V)$ monte, passe par un pic, puis
      redescend. Le pic marque l'endroit où $\text{pH}=f(V)$ varie le plus
      vite, donc $V_E$ — jamais un zéro de la dérivée.

  - id: RAB-36
    rung: "R10"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale", "lecture-graphique", "dual-tag:R4-pKA"]
    stem: >
      Sur la courbe du dosage de l'acide éthanoïque ($pK_A = 4{,}8$,
      $V_A = 20{,}0$ mL, soude $C_B = 0{,}10$ mol/L, $V_E = 15{,}0$ mL), on
      lit à $V = 7{,}5$ mL un $\text{pH} \approx 4{,}8$. Que représente ce
      point ?
    type: mcq
    choices:
      - id: A
        text: >-
          La demi-équivalence : la moitié du titré a réagi ; ce n'est pas
          l'équivalence, qui se situe à $V_E = 15{,}0$ mL
        correct: true
      - id: B
        text: >-
          L'équivalence elle-même, puisqu'on y lit un pH caractéristique
          du couple
        correct: false
        misconception: AB-EQU-3
        feedback: >
          $7{,}5$ mL est exactement la moitié de $V_E = 15{,}0$ mL : c'est
          la demi-équivalence, pas l'équivalence. Ce sont deux points
          géométriquement distincts sur la courbe — seul $V=15{,}0$ mL est
          le point d'inflexion (le saut).
      - id: C
        text: >-
          Le point où le pH de la solution vaut $7$ (la neutralité)
        correct: false
        misconception: AB-EQU-1
        feedback: >
          Le pH lu ici est $4{,}8$, pas $7$ : ce point n'a rien à voir avec
          la neutralité. Il coïncide avec $pK_A$ du couple titré, une
          propriété propre à ce couple, sans rapport avec $\text{pH}=7$.
      - id: D
        text: >-
          Un point sans intérêt : seul le point où $d\text{pH}/dV = 0$
          permettrait de conclure quoi que ce soit sur l'équivalence
        correct: false
        misconception: AB-EQU-2
        feedback: >
          Ce point est au contraire très utile : il donne accès au $pK_A$
          du couple sans calcul. Et ce n'est de toute façon pas un zéro de
          la dérivée qui marque l'équivalence, mais son maximum (au saut,
          $V=15{,}0$ mL).
    correct_feedback: >
      À $V_E/2 = 7{,}5$ mL, seule la moitié du titré initial a réagi : le
      titré reste majoritairement en excès. On y lit $\text{pH} \approx
      pK_A$ (chapitre 5) — un repère utile, mais distinct de l'équivalence, qui
      se situe au saut, $V_E = 15{,}0$ mL.
    solution: |
      À la demi-équivalence, $n_{\text{titré restant}} = n_{\text{produit
      formé}}$, donc $[AH]_{eq} \approx [A^-]_{eq}$ et
      $\text{pH} \approx pK_A$ (chapitre 5, chapitre 6). C'est un point distinct de
      l'équivalence : sur la courbe, ce n'est pas le point d'inflexion.

  # ── R11 : choisir l'indicateur coloré — la zone de virage ──────────────────
  - id: RAB-37
    rung: "R11"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale", "lecture-graphique"]
    stem: >
      Dosage d'un acide faible par une base forte, $\text{pH}_E \approx
      8{,}5$ (lu sur la courbe). Indicateurs disponibles : hélianthine
      ($3{,}1$–$4{,}4$), BBT ($6{,}0$–$7{,}6$), phénolphtaléine
      ($8{,}2$–$10{,}0$). Lequel choisir, et pourquoi ?
    type: mcq
    choices:
      - id: A
        text: >-
          L'hélianthine convient aussi : le changement de couleur donnera
          de toute façon le volume exact à l'équivalence
        correct: false
        misconception: AB-IND-3
        feedback: >
          Le changement de couleur d'un indicateur n'approche $V_E$ que si
          sa zone de virage encadre $\text{pH}_E$. La zone de l'hélianthine
          ($3{,}1$–$4{,}4$) est très loin de $\text{pH}_E \approx 8{,}5$ :
          elle virerait bien avant l'équivalence, à un volume beaucoup trop
          petit.
      - id: B
        text: >-
          La phénolphtaléine, car sa zone de virage ($8{,}2$–$10{,}0$) est
          la seule à contenir $\text{pH}_E = 8{,}5$
        correct: true
      - id: C
        text: >-
          N'importe lequel des trois convient ; le choix de l'indicateur
          n'a pas d'importance pour repérer $V_E$
        correct: false
        misconception: AB-IND-1
        feedback: >
          Un indicateur dont la zone de virage ne contient pas
          $\text{pH}_E$ vire trop tôt ou trop tard, ce qui fausse la
          lecture de $V_E$. Ici, seule la phénolphtaléine convient ;
          l'hélianthine et le BBT donneraient un volume erroné.
      - id: D
        text: >-
          Le BBT, car sa zone de virage est centrée près de
          $\text{pH} = 7$, la valeur à laquelle un indicateur doit toujours
          virer
        correct: false
        misconception: AB-IND-2
        feedback: >
          Chaque indicateur vire dans SA propre zone, fixée par son
          $pK_A$, sans rapport avec $7$. Le critère de choix est de
          contenir $\text{pH}_E$ de CE dosage — ici $8{,}5$, que le BBT
          ($6{,}0$–$7{,}6$) ne contient pas.
    correct_feedback: >
      La zone de virage doit encadrer $\text{pH}_E$. Seule la
      phénolphtaléine ($8{,}2$–$10{,}0$) contient $8{,}5$ : c'est elle qui
      donnera un changement de couleur au voisinage du saut.
    solution: |
      On superpose chaque zone de virage au saut de la courbe : la bande
      qui coupe le saut est retenue. Hélianthine et BBT sont écartés (leurs
      zones ne contiennent pas $8{,}5$) ; seule la phénolphtaléine convient.

  - id: RAB-38
    rung: "R11"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Que représente, pour un indicateur coloré, sa « zone de virage » ?
    type: mcq
    choices:
      - id: A
        text: >-
          Un intervalle de pH centré près de $7$, valable pour tous les
          indicateurs
        correct: false
        misconception: AB-IND-2
        feedback: >
          Il n'existe pas d'intervalle universel : chaque indicateur a sa
          propre zone de virage, fixée par son propre $pK_A$. Le BBT est
          simplement, par coïncidence, celui dont la zone est proche de
          $7$ — ce n'est pas une règle générale.
      - id: B
        text: >-
          Le volume exact où l'équivalence a lieu, repéré sans ambiguïté
          par le changement de couleur
        correct: false
        misconception: AB-IND-3
        feedback: >
          La zone de virage est un intervalle de pH, pas un volume. Le
          changement de couleur donne une bonne approximation de $V_E$
          seulement si cette zone encadre $\text{pH}_E$ — jamais une valeur
          exacte garantie.
      - id: C
        text: >-
          Un intervalle de pH, approximativement $pK_A(\text{indicateur})
          \pm 1$, propre à chaque indicateur
        correct: true
      - id: D
        text: >-
          N'importe quel indicateur suffit à repérer l'équivalence de
          n'importe quel dosage, quelle que soit sa zone de virage
        correct: false
        misconception: AB-IND-1
        feedback: >
          Si la zone de virage ne contient pas $\text{pH}_E$ du dosage
          considéré, l'indicateur vire à un volume qui n'a rien à voir avec
          l'équivalence : le choix de l'indicateur compte, dosage par
          dosage.
    correct_feedback: >
      Un indicateur coloré est un couple $HIn/In^-$ ; sa zone de virage,
      $\approx pK_A(\text{indicateur}) \pm 1$, est l'intervalle où les deux
      couleurs coexistent de façon perceptible.
    solution: |
      En dehors de cette zone, une seule forme (donc une seule couleur)
      domine à plus de $\sim 91\,\%$ (chapitre 9) : la zone de virage est
      justement l'intervalle où aucune des deux couleurs n'écrase l'autre.

  - id: RAB-39
    rung: "R11"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["application-experimentale"]
    stem: >
      Même avec un indicateur bien choisi (sa zone de virage encadrant
      $\text{pH}_E$), le changement de couleur donne-t-il le volume
      équivalent exact ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui, toujours et avec une précision parfaite, car l'indicateur
          définit l'équivalence
        correct: false
        misconception: AB-IND-3
        feedback: >
          L'indicateur **repère** l'équivalence, il ne la **définit** pas :
          la définition reste celle du chapitre 10, une égalité de quantités de
          matière ($C_A V_A = C_B V_E$). Le virage donne une bonne
          approximation, pas une valeur exacte garantie.
      - id: B
        text: >-
          Cela n'a pas la moindre importance : n'importe quel indicateur coloré
          donnerait ici une lecture parfaitement équivalente
        correct: false
        misconception: AB-IND-1
        feedback: >
          Seul un indicateur dont la zone de virage encadre $\text{pH}_E$
          donne une lecture proche de $V_E$. Un indicateur mal choisi (zone
          hors du saut) donne un volume franchement faux, pas simplement
          « équivalent ».
      - id: C
        text: >-
          Oui, car tout indicateur vire précisément à $\text{pH} = 7$, qui
          définit l'équivalence
        correct: false
        misconception: AB-IND-2
        feedback: >
          Ni la prémisse (chaque indicateur vire dans SA propre zone, pas à
          $7$) ni la conclusion (l'équivalence n'est pas définie par
          $\text{pH}=7$) ne sont correctes ici.
      - id: D
        text: >-
          Une bonne approximation seulement, car la zone de virage encadre
          $\text{pH}_E$ ; cela reste une lecture graphique, pas la
          définition de l'équivalence
        correct: true
    correct_feedback: >
      Le virage se produit dans l'intervalle raide du saut, donc à un
      volume très proche de $V_E$ — mais seulement une approximation, à
      condition que la zone encadre $\text{pH}_E$. La référence reste la
      lecture par tangentes ou dérivée (chapitre 11).
    solution: |
      L'indicateur repère l'équivalence sans la définir : la définition de
      référence est la relation de quantités de matière (chapitre 10),
      confirmée par la méthode des tangentes ou de la dérivée (chapitre 11).

# ── Couverture des misconceptions (plancher ≥ 3 items/misconception) ─────────
# Comptage au niveau DISTRACTEUR : chaque misconception du cluster est le
# distracteur ciblé dans exactement 3 items (un distracteur par misconception,
# par item), sur les 12 items neufs RAB-28 → RAB-39 (spec-extension.md §6). Tous
# ces distracteurs portent leur tag `misconception:` (per-distractor complet).
  # ── Trois items ajoutés le 2026-09-05 pour amener au plancher les trois
  #    dernières familles AB-BASE qui y siégeaient encore en dessous :
  #    AB-BASE-2 (2 items), AB-BASE-7 (1), AB-BASE-8 (2). Le résumé de
  #    couverture en fin de fichier annonçait `floor_met: true` en ne comptant
  #    que les douze ids AB-DIST/TIT/EQU/IND du cluster titrage : la passe qui
  #    a ensuite déclaré les huit familles AB-BASE et tagué les items hérités
  #    R0-R7/R12 n'a pas retourné le drapeau. Voir web/scripts/resume-couverture.mjs.
  - id: RAB-40
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Le pH d'une solution aqueuse vaut $4{,}0$ à $25\,^\circ\text{C}$. Un
      élève en conclut que la concentration en ions oxonium vaut
      $4{,}0\ \text{mol}\cdot\text{L}^{-1}$. Quelle est la valeur correcte de
      $[H_3O^+]$ ?
    type: mcq
    choices:
      - id: A
        text: "$[H_3O^+] = 10^{-\\text{pH}} = 10^{-4{,}0} = 1{,}0\\times10^{-4}\\ \\text{mol}\\cdot\\text{L}^{-1}$ : le pH est un logarithme, pas une concentration"
        correct: true
      - id: B
        text: >-
          $4{,}0\ \text{mol}\cdot\text{L}^{-1}$ : l'élève a raison, le pH est
          une autre écriture de la concentration en ions oxonium
        correct: false
        misconception: AB-BASE-2
        feedback: >
          Le pH n'est pas une concentration : c'est son logarithme changé de
          signe. Une concentration de $4{,}0\ \text{mol}\cdot\text{L}^{-1}$ en
          ions oxonium correspondrait à un pH d'environ $-0{,}6$, une solution
          d'acide extrêmement concentrée — pas à un pH de $4{,}0$.
      - id: C
        text: >-
          $1{,}0\times10^{4}\ \text{mol}\cdot\text{L}^{-1}$ : on écrit
          $[H_3O^+] = 10^{\text{pH}}$, le signe moins n'appartenant qu'à la
          définition du pH
        correct: false
        misconception: AB-BASE-2
        feedback: >
          Le signe moins ne disparaît pas quand on retourne la relation :
          $\text{pH} = -\log[H_3O^+]$ s'inverse en
          $[H_3O^+] = 10^{-\text{pH}}$. Le vérifier par l'absurde coûte deux
          secondes : $10^{4}\ \text{mol}\cdot\text{L}^{-1}$ est une
          concentration impossible en solution aqueuse.
      - id: D
        text: >-
          $1{,}0\times10^{-10}\ \text{mol}\cdot\text{L}^{-1}$ : on divise
          $K_e$ par $10^{-4{,}0}$ pour obtenir la concentration cherchée
        correct: false
        misconception: AB-BASE-6
        feedback: >
          Ce calcul est juste, mais il donne l'AUTRE concentration :
          $K_e/[H_3O^+] = [HO^-] = 1{,}0\times10^{-10}\ \text{mol}\cdot
          \text{L}^{-1}$. Le produit ionique relie les deux ; il ne remplace
          pas $[H_3O^+] = 10^{-\text{pH}}$.
    correct_feedback: >
      $[H_3O^+] = 10^{-\text{pH}} = 10^{-4{,}0} = 1{,}0\times10^{-4}\
      \text{mol}\cdot\text{L}^{-1}$. Un pH de $4{,}0$ décrit une solution
      acide diluée, dix mille fois moins concentrée en ions oxonium qu'une
      solution à $1\ \text{mol}\cdot\text{L}^{-1}$.
    solution: |
      La définition $\text{pH} = -\log[H_3O^+]$ s'inverse en appliquant la
      fonction $10^x$ aux deux membres :
      $$
      -\text{pH} = \log[H_3O^+] \quad\Longrightarrow\quad
      [H_3O^+] = 10^{-\text{pH}}
      $$
      Pour $\text{pH} = 4{,}0$ :
      $$
      [H_3O^+] = 10^{-4{,}0} = 1{,}0\times10^{-4}\ \text{mol}\cdot
      \text{L}^{-1}
      $$
      Contrôle de vraisemblance : en solution aqueuse, $[H_3O^+]$ reste
      comprise en pratique entre $10^{-14}$ et $1\ \text{mol}\cdot
      \text{L}^{-1}$. Toute valeur hors de cet intervalle signale une erreur
      de manipulation du logarithme.

  - id: RAB-41
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      On mélange de l'acide éthanoïque $CH_3COOH$ ($pK_A = 4{,}8$) et de
      l'ammoniac $NH_3$ ($pK_A = 9{,}2$ pour le couple $NH_4^+/NH_3$) :
      $CH_3COOH + NH_3 \rightleftharpoons CH_3COO^- + NH_4^+$. Que vaut la
      constante d'équilibre $K$, et que peut-on en dire du taux d'avancement
      final ?
    type: mcq
    choices:
      - id: A
        text: "$K = 10^{9{,}2-4{,}8} = 10^{4{,}4} \\approx 2{,}5\\times10^{4}$ : $K \\gg 1$, la réaction est quasi totale"
        correct: true
      - id: B
        text: >-
          $K = 10^{4{,}8-9{,}2} = 10^{-4{,}4}$ : la réaction est au contraire
          très limitée dans le sens écrit
        correct: false
        misconception: AB-BASE-7
        feedback: >
          L'ordre des deux $pK_A$ dans l'exposant suit le sens d'écriture :
          l'acide qui cède le proton est $CH_3COOH$, de $pK_A$ $4{,}8$, donc
          $K = K_{A}(CH_3COOH)/K_{A}(NH_4^+) = 10^{9{,}2-4{,}8}$. Inverser
          l'écart, c'est décrire la réaction inverse.
      - id: C
        text: >-
          $K = 10^{-4{,}8} \times 10^{-9{,}2} = 10^{-14}$, en multipliant les
          deux constantes d'acidité
        correct: false
        misconception: AB-BASE-7
        feedback: >
          Les deux $K_A$ se DIVISENT — c'est ainsi que le $[H_3O^+]$
          intermédiaire se simplifie entre les deux demi-équations. Les
          multiplier donne ici $10^{-14}$, qui est le produit ionique de
          l'eau : une coïncidence numérique, pas la constante cherchée.
      - id: D
        text: >-
          $K \approx 2{,}5\times10^{4}$, mais le taux d'avancement final reste
          faible : les deux $pK_A$ sont positifs, donc aucun des deux couples
          ne réagit beaucoup
        correct: false
        misconception: AB-BASE-8
        feedback: >
          Le signe des $pK_A$ ne dit rien du taux d'avancement : c'est leur
          ÉCART qui fixe $K$, et c'est $K$ qui situe $\tau$. Avec
          $K \approx 2{,}5\times10^{4} \gg 1$, l'équilibre est très déplacé
          vers la droite et $\tau$ approche $1$.
    correct_feedback: >
      $K = K_{A}(CH_3COOH)/K_{A}(NH_4^+) = 10^{pK_A(NH_4^+)-pK_A(CH_3COOH)} =
      10^{9{,}2-4{,}8} = 10^{4{,}4} \approx 2{,}5\times10^{4}$. Cette valeur
      très supérieure à $1$ situe l'équilibre presque entièrement du côté des
      produits : $\tau$ est proche de $1$.
    solution: |
      La constante d'une réaction entre deux couples se construit en divisant
      le $K_A$ de l'acide qui CÈDE le proton par le $K_A$ de l'acide conjugué
      de la base qui le CAPTE :
      $$K = \frac{K_A(CH_3COOH)}{K_A(NH_4^+)}
        = \frac{10^{-4{,}8}}{10^{-9{,}2}} = 10^{9{,}2-4{,}8} = 10^{4{,}4}$$
      soit $K \approx 2{,}5\times10^{4}$.
      L'écart des $pK_A$ vaut $4{,}4$ unités : au-delà de $4$, l'équilibre est
      considéré comme quasi total dans le sens écrit, donc
      $\tau \rightarrow 1$. C'est l'ÉCART qui décide, jamais le signe des
      $pK_A$ pris séparément.

  - id: RAB-42
    rung: "R7"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Une même réaction acido-basique entre deux couples est réalisée deux
      fois à $25\,^\circ\text{C}$ : d'abord avec des solutions concentrées,
      puis avec les mêmes solutions diluées dix fois. Que devient la constante
      d'équilibre $K$ de la réaction ?
    type: mcq
    choices:
      - id: A
        text: "Elle est inchangée : $K = K_{A1}/K_{A2}$ ne dépend que des deux couples et de la température"
        correct: true
      - id: B
        text: >-
          Elle est divisée par dix, comme les concentrations dont elle est
          construite
        correct: false
        misconception: AB-BASE-7
        feedback: >
          $K$ ne se construit pas à partir des concentrations apportées mais à
          partir des deux $K_A$, qui sont eux-mêmes des constantes. Ce sont les
          concentrations À L'ÉQUILIBRE qui s'ajustent pour que leur
          combinaison redonne la même valeur de $K$.
      - id: C
        text: >-
          Elle change, puisque le pH mesuré à l'équilibre n'est pas le même
          dans les deux expériences
        correct: false
        misconception: AB-BASE-7
        feedback: >
          Le pH final change effectivement — mais $K$, non. C'est justement ce
          qui en fait une constante : elle vaut $K_{A1}/K_{A2}$ quelles que
          soient les quantités mises en jeu, et seule la température peut la
          modifier.
      - id: D
        text: >-
          Elle augmente, car diluer un acide faible le rend plus fort et la
          réaction va donc plus loin
        correct: false
        misconception: AB-BASE-3
        feedback: >
          La dilution augmente bien le TAUX D'AVANCEMENT d'un acide faible,
          mais elle ne change pas sa FORCE : celle-ci est une propriété du
          couple, lisible dans $K_A$, et donc dans $K$. Force et avancement
          sont deux choses différentes.
    correct_feedback: >
      $K$ est inchangée. Elle vaut $K_{A1}/K_{A2}$ : un rapport de deux
      constantes du couple, qui ne dépend que de la température. Ce sont les
      concentrations à l'équilibre — et donc le pH final, et le taux
      d'avancement — qui changent avec la dilution.
    solution: |
      Pour la réaction $A_1H + A_2^- \rightleftharpoons A_1^- + A_2H$ :
      $$K = \frac{[A_1^-][A_2H]}{[A_1H][A_2^-]} = \frac{K_{A1}}{K_{A2}}$$
      Les deux $K_A$ sont des constantes d'équilibre du couple, fixées par la
      température seule. Diluer déplace l'état d'équilibre — les quatre
      concentrations changent — mais elles changent ENSEMBLE, de façon à ce
      que leur combinaison garde la même valeur.
      À retenir : la dilution modifie $\tau$, jamais $K$.

