    type: mcq
    choices:
      - id: A
        text: >-
          $[HO^-] \approx 7{,}9 \times 10^{-11}\ \text{mol/L}$ ; comme
          $[HO^-] \ll [H_3O^+]$, la solution est bien acide
        correct: true
      - id: B
        text: >-
          $[HO^-] \approx 1{,}3 \times 10^{-4}\ \text{mol/L}$, la même valeur
          que $[H_3O^+]$, car dans toute solution les deux concentrations
          sont égales
        correct: false
        misconception: AB-BASE-6
        feedback: >
          $[H_3O^+] = [HO^-]$ ne caractérise que la neutralité ($\text{pH} =
          7$) ; ici $\text{pH} = 3{,}9 \neq 7$, les deux concentrations sont
          très différentes.
      - id: C
        text: "$[HO^-] \\approx 10^{-3{,}9}\\ \\text{mol/L}$ directement, sans passer par $K_e$"
        correct: false
        misconception: AB-BASE-6
        feedback: >
          $10^{-\text{pH}}$ donne $[H_3O^+]$, pas $[HO^-]$ : il faut passer
          par $K_e = [H_3O^+][HO^-]$ pour obtenir $[HO^-]$.
      - id: D
        text: >-
          On ne peut pas calculer $[HO^-]$ sans connaître $pK_e$, qui n'est
          pas donné dans l'énoncé
        correct: false
        misconception: AB-BASE-6
        feedback: >
          $K_e = 1{,}0 \times 10^{-14}$ (donc $pK_e = 14$) à $25\,^\circ
          \text{C}$ est une valeur de référence du programme, pas une donnée
          manquante.
    correct_feedback: >
      $[H_3O^+] = 10^{-3{,}9} \approx 1{,}3 \times 10^{-4}\ \text{mol/L}$,
      donc $[HO^-] = K_e/[H_3O^+] \approx 7{,}9 \times 10^{-11}\ \text{mol/L}
      \ll [H_3O^+]$ : acide.
    solution: |
      $[H_3O^+] \approx 1{,}3\times10^{-4}$ mol/L depuis le pH ; $[HO^-] =
      K_e/[H_3O^+] \approx 7{,}9\times10^{-11}$ mol/L, bien inférieure.

  - id: RAB-26
    rung: "R12"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      À $25\,^\circ\text{C}$, une solution a $[HO^-] = 2{,}5 \times
      10^{-4}\ \text{mol/L}$. Quelle est la nature de cette solution ?
    type: mcq
    choices:
      - id: A
        text: >-
          Basique : $[H_3O^+] \approx 4{,}0 \times 10^{-11}\ \text{mol/L}$,
          très inférieure à $[HO^-]$
        correct: true
      - id: B
        text: >-
          Neutre, car le produit $[H_3O^+] \times [HO^-]$ vaut $K_e$ comme
          dans toute solution neutre
        correct: false
        misconception: AB-BASE-6
        feedback: >
          Le produit $[H_3O^+][HO^-] = K_e$ est vrai dans **toute** solution
          aqueuse à $25\,^\circ\text{C}$, pas seulement les neutres : ce
          n'est pas ce produit, mais l'égalité $[H_3O^+]=[HO^-]$, qui
          signale la neutralité.
      - id: C
        text: >-
          Acide, car $[HO^-]$ est plus grande que sa valeur dans l'eau pure,
          ce qui signale un excès d'acide
        correct: false
        misconception: AB-BASE-6
        feedback: >
          C'est l'espèce dont la concentration a *augmenté* par rapport à
          l'eau pure qu'il faut regarder ; ici c'est $[HO^-]$ qui a
          augmenté, signe d'un excès de base, pas d'acide.
      - id: D
        text: "Impossible à conclure sans mesurer directement le pH au pH-mètre"
        correct: false
        misconception: AB-BASE-6
        feedback: >
          $K_e$ et une seule des deux concentrations suffisent déjà à
          calculer l'autre et à conclure, sans mesure supplémentaire.
    correct_feedback: >
      $[H_3O^+] = K_e/[HO^-] = 10^{-14}/(2{,}5\times10^{-4}) \approx 4{,}0
      \times 10^{-11}\ \text{mol/L} < [HO^-]$ : basique.
    solution: |
      $[H_3O^+] = K_e/[HO^-] \approx 4{,}0\times10^{-11}$ mol/L, très
      inférieure à $[HO^-]$ : la solution est basique.

  - id: RAB-27
    rung: "R12"
    difficulty_level: 5
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      On mélange de l'eau pure avec une pincée de chlorure de sodium
      ($Na^+$, $Cl^-$), des ions qui ne réagissent pas avec l'eau. Le pH
      reste-t-il à $7{,}0$ à $25\,^\circ\text{C}$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui : $Na^+$ et $Cl^-$ ne modifient pas l'équilibre $[H_3O^+] =
          [HO^-]$ issu de l'autoprotolyse de l'eau, la solution reste neutre
        correct: true
      - id: B
        text: >-
          Non : toute espèce ionique dissoute dans l'eau modifie
          nécessairement $K_e$, donc le pH change
        correct: false
        misconception: AB-BASE-6
        feedback: >
          $K_e$ ne dépend que de la température, pas des espèces dissoutes :
          ajouter des ions spectateurs ne le change pas.
      - id: C
        text: >-
          Non : ajouter des ions positifs et négatifs revient à ajouter à la
          fois un acide et une base, donc le pH doit bouger
        correct: false
        misconception: AB-BASE-6
        feedback: >
          $Na^+$ et $Cl^-$ ne cèdent ni ne captent de proton dans l'eau :
          porter une charge ne suffit pas à être acide ou base au sens de
          Brønsted.
      - id: D
        text: >-
          Oui, mais seulement parce que les quantités de $Na^+$ et de $Cl^-$
          ajoutées sont rigoureusement égales — sinon le pH changerait
        correct: false
        misconception: AB-BASE-6
        feedback: >
          La neutralité électrique impose des quantités égales, mais ce
          n'est pas la raison de la neutralité *acido-basique* ici : c'est
          l'absence totale de réactivité de $Na^+$ et $Cl^-$ avec l'eau qui
          la garantit, quelles que soient leurs quantités.
    correct_feedback: >
      $Na^+$ et $Cl^-$ sont des ions spectateurs pour l'équilibre
      acido-basique : ils ne réagissent pas avec l'eau, donc n'affectent ni
      $K_e$ ni l'égalité $[H_3O^+]=[HO^-]$.
    solution: |
      Ni $Na^+$ ni $Cl^-$ ne cèdent ou ne captent de proton : l'autoprotolyse
      de l'eau seule fixe $[H_3O^+]=[HO^-]$, le pH reste $7{,}0$.

  # ── R8 : diagramme de distribution — % lus depuis pH et pKA ────────────────
  - id: RAB-28
    rung: "R8"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: ["lecture-graphique"]
    stem: >
      Diagramme de distribution du couple $CH_3COOH/CH_3COO^-$
      ($pK_A = 4{,}8$). À $\text{pH} = 4{,}8$ exactement, quelles
      proportions lit-on pour les deux formes du couple ?
    type: mcq
    choices:
      - id: A
        text: >-
          $50\,\%$ de $CH_3COOH$ et $50\,\%$ de $CH_3COO^-$ : à $\text{pH} = pK_A$, les
          deux formes sont à égalité
        correct: true
      - id: B
        text: >-
          Environ $100\,\%$ de $CH_3COOH$, la forme $CH_3COO^-$ étant en
          pratique négligeable
        correct: false
        misconception: AB-DIST-1
        feedback: >
          La frontière $\text{pH} = pK_A$ n'est pas un instant de bascule
          brutale : à cet endroit précis, l'exposant $pK_A - \text{pH}$ vaut
          $0$, donc $\%A^- = 100/(1+10^0) = 50$. Les deux formes coexistent
          à parts strictement égales, rien n'a « déjà disparu ».
      - id: C
        text: >-
          On ne peut donner qu'un verdict qualitatif ici, comme sur le
          diagramme de prédominance : aucune espèce ne l'emporte nettement,
          sans qu'on puisse chiffrer davantage
        correct: false
        misconception: AB-DIST-2
        feedback: >
          Le diagramme de distribution donne justement ce que le diagramme
          de prédominance ne donne pas : un pourcentage exact. Ici, ce
          pourcentage se calcule très précisément : $50\,\%$ et $50\,\%$,
          pas un simple constat d'égalité qualitative.
      - id: D
        text: >-
          Ce croisement à $50\,\%$/$50\,\%$ n'est possible qu'à
          $\text{pH} = 7$ (la neutralité) ; à $\text{pH} = 4{,}8$ les deux
          pourcentages ne peuvent pas être égaux
        correct: false
        misconception: AB-DIST-3
        feedback: >
          Le croisement des deux courbes de distribution se situe à
          $\text{pH} = pK_A$, une propriété du couple étudié — ici
          $4{,}8$ — et n'a aucun rapport avec la neutralité de l'eau
          ($\text{pH} = 7$, propriété de $K_e$).
    correct_feedback: >
      $\text{pH} = pK_A = 4{,}8$ annule l'exposant $pK_A - \text{pH}$ :
      $\%A^- = 100/(1+10^0) = 50$. Les deux formes sont exactement à parts
      égales.
    solution: |
      $$\%A^- = \frac{100}{1+10^{pK_A-\text{pH}}}$$

      À $\text{pH} = pK_A$, l'exposant est nul : $\%A^- = 100/(1+1) = 50$,
      et donc $\%AH = 50$ aussi, puisque $\%AH + \%A^- = 100$ toujours.

