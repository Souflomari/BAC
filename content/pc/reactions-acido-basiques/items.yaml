    correct_feedback: >
      L'acide $HCOOH$ cède son proton, l'eau (base du couple $H_3O^+/H_2O$)
      le capte : en additionnant les deux demi-équations, le $H^+$ s'annule.
    solution: |
      $HCOOH \rightleftharpoons HCOO^- + H^+$ et $H_2O + H^+ \rightleftharpoons
      H_3O^+$ s'additionnent en annulant $H^+$ des deux côtés.

  # ── R2 : mécanique du pH — définition, log, conversions ─────────────────────
  - id: RAB-13
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Une solution a $[H_3O^+] = 1{,}0 \times 10^{-4}\ \text{mol/L}$. Quel est
      son pH ?
    type: mcq
    choices:
      - id: A
        text: "$\\text{pH} = 4{,}0$, soit l'opposé de l'exposant de la puissance de $10$"
        correct: true
      - id: B
        text: "$\\text{pH} = -4{,}0$, en gardant le signe de l'exposant"
        correct: false
        misconception: AB-BASE-2
        feedback: >
          Le signe moins de la définition $\text{pH} = -\log[H_3O^+]$
          s'applique en plus de celui de l'exposant : les deux se combinent
          pour donner un pH positif ici.
      - id: C
        text: "$\\text{pH} = 10^{-4}$, le pH est directement la concentration"
        correct: false
        misconception: AB-BASE-2
        feedback: >
          Le pH n'est pas la concentration elle-même, mais son logarithme
          décimal changé de signe.
      - id: D
        text: >-
