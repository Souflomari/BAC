          l'eau, mais ici c'est l'écart entre les deux couples — très faible —
          qui gouverne $K$, pas la valeur absolue de chaque $pK_A$.
      - id: D
        text: >-
          On ne peut rien prédire du tout sans connaître les concentrations
          initiales exactes
        correct: false
        feedback: >
          $K = K_{A1}/K_{A2}$ ne dépend d'aucune concentration : sa valeur
          seule permet déjà de situer $\tau$ par rapport à $0$, $1$, ou
          entre les deux.
    correct_feedback: >
      $K \approx 1{,}6$, proche de $1$ : les deux couples sont de forces
      voisines, la réaction reste franchement partielle sans être négligeable.
    solution: |
      $K = 10^{pK_{A2}-pK_{A1}} = 10^{0{,}2} \approx 1{,}6$, proche de $1$ :
      ni $K \gg 1$ ni $K \ll 1$, donc $\tau$ reste intermédiaire.

