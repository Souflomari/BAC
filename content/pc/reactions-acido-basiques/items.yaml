        correct: false
        feedback: >
          Ceci utilise $H_3O^+$ comme réactif et $H_2O$ comme produit : c'est
          l'inverse du sens dans lequel l'eau doit agir ici, en tant que base
          qui capte le proton.
      - id: C
        text: "$HCOOH \\rightleftharpoons HCOO^- + H^+$"
        correct: false
        feedback: >
          Cette demi-équation seule laisse un $H^+$ libre : il n'existe pas
          de proton libre en solution, il faut la combiner avec le couple de
          l'eau.
      - id: D
        text: "$HCOOH + H_2O \\rightleftharpoons HCOO^- + H_3O^+ + H^+$"
        correct: false
        feedback: >
          Le $H^+$ échangé doit s'annuler exactement en additionnant les deux
          demi-équations ; il ne doit apparaître nulle part dans l'équation
          finale.
    correct_feedback: >
      L'acide $HCOOH$ cède son proton, l'eau (base du couple $H_3O^+/H_2O$)
      le capte : en additionnant les deux demi-équations, le $H^+$ s'annule.
    solution: |
      $HCOOH \rightleftharpoons HCOO^- + H^+$ et $H_2O + H^+ \rightleftharpoons
      H_3O^+$ s'additionnent en annulant $H^+$ des deux côtés.

  # ── R2 : mécanique du pH — définition, log, conversions ─────────────────────
  - id: RAB-13
    rung: "R2"
    difficulty_level: 2
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Une solution a $[H_3O^+] = 1{,}0 \times 10^{-4}\ \text{mol/L}$. Quel est
      son pH ?
    type: mcq
    choices:
      - id: A
        text: "$\\text{pH} = 4{,}0$"
        correct: true
      - id: B
        text: "$\\text{pH} = -4{,}0$, en gardant le signe de l'exposant"
        correct: false
        feedback: >
          Le signe moins de la définition $\text{pH} = -\log[H_3O^+]$
          s'applique en plus de celui de l'exposant : les deux se combinent
          pour donner un pH positif ici.
      - id: C
        text: "$\\text{pH} = 10^{-4}$, le pH est directement la concentration"
        correct: false
        feedback: >
          Le pH n'est pas la concentration elle-même, mais son logarithme
          décimal changé de signe.
      - id: D
        text: >-
          $\text{pH} = 0{,}4$, en confondant l'exposant $-4$ avec une virgule
          décimale
        correct: false
        feedback: >
          L'exposant $-4$ d'une notation scientifique n'est pas une virgule
          décimale à placer dans le résultat.
    correct_feedback: >
      $\text{pH} = -\log(1{,}0 \times 10^{-4}) = 4{,}0$.
    solution: |
      $\text{pH} = -\log[H_3O^+] = -\log(10^{-4}) = 4{,}0$.

  - id: RAB-14
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Une solution a un pH mesuré de $6{,}0$. Quelle est $[H_3O^+]$ ?
    type: mcq
    choices:
      - id: A
        text: "$[H_3O^+] = 1{,}0 \\times 10^{-6}\\ \\text{mol/L}$"
        correct: true
      - id: B
        text: >-
          $[H_3O^+] = 6{,}0\ \text{mol/L}$, le pH étant directement la
          concentration
        correct: false
        feedback: >
          Le pH n'est pas la concentration elle-même : il faut inverser la
          relation logarithmique pour la retrouver.
      - id: C
        text: >-
          $[H_3O^+] = 10^{6}\ \text{mol/L}$, en oubliant le signe moins de
          $\text{pH} = -\log[H_3O^+]$
        correct: false
        feedback: >
          En oubliant le signe moins lors de l'inversion, l'exposant change
          de signe et donne une concentration bien trop grande.
      - id: D
        text: >-
          $[H_3O^+] = -\log(6{,}0)\ \text{mol/L}$, en appliquant à nouveau le
          logarithme au lieu d'inverser la relation
        correct: false
        feedback: >
          Il faut défaire le logarithme avec $10^{(\cdot)}$, pas en
          appliquer un second sur la valeur du pH.
    correct_feedback: >
      $[H_3O^+] = 10^{-\text{pH}} = 10^{-6}\ \text{mol/L}$.
    solution: |
      On inverse $\text{pH} = -\log[H_3O^+]$ avec $10^{(\cdot)}$ des deux
      côtés : $[H_3O^+] = 10^{-\text{pH}} = 10^{-6}\ \text{mol/L}$.

  - id: RAB-15
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      $[H_3O^+]$ est multipliée par $10$ dans une solution. De combien, et
      dans quel sens, varie le pH ?
    type: mcq
    choices:
      - id: A
        text: "Le pH diminue de $1$ unité"
        correct: true
      - id: B
        text: "Le pH est multiplié par $10$ aussi"
        correct: false
        feedback: >
          Le pH est un logarithme de $[H_3O^+]$, pas une grandeur
          proportionnelle : multiplier $[H_3O^+]$ par $10$ décale le pH d'une
          unité, ne le multiplie pas par $10$.
      - id: C
        text: "Le pH augmente de $1$ unité"
        correct: false
        feedback: >
          C'est le bon écart mais le mauvais sens : à cause du signe moins
          dans $\text{pH} = -\log[H_3O^+]$, une $[H_3O^+]$ plus grande donne
          un pH plus petit.
      - id: D
        text: >-
          Le pH ne change pas, seule la concentration compte pour l'acidité
        correct: false
        feedback: >
          Le pH est construit précisément pour suivre $[H_3O^+]$ : il ne peut
          pas rester constant quand cette concentration change.
    correct_feedback: >
      $\log(10\,x) = \log x + 1$, donc $-\log(10\,x) = -\log x - 1$ : le pH
      diminue d'une unité.
    solution: |
      Multiplier $[H_3O^+]$ par $10$ ajoute $1$ à $\log[H_3O^+]$, donc
      retranche $1$ au pH (signe moins) : le pH diminue d'une unité.

  # ── R3 (complément) : Ke et neutralité, au-delà du seul sens du pH ──────────
  - id: RAB-16
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      À $25\,^\circ\text{C}$, une solution a $[HO^-] = 1{,}0 \times
      10^{-7}\ \text{mol/L}$. Que peut-on affirmer sur $[H_3O^+]$ et sur la
      nature de cette solution ?
    type: mcq
    choices:
      - id: A
        text: >-
          $[H_3O^+] = 1{,}0 \times 10^{-7}\ \text{mol/L}$ aussi ; la solution
          est neutre
        correct: true
      - id: B
        text: >-
          On ne peut rien dire sur $[H_3O^+]$ sans mesurer le pH séparément
        correct: false
        feedback: >
          $K_e = [H_3O^+][HO^-]$ relie déjà les deux concentrations à
          $25\,^\circ\text{C}$ : connaître $[HO^-]$ suffit à calculer
          $[H_3O^+]$, sans mesure supplémentaire.
      - id: C
        text: >-
          $[H_3O^+]$ est nécessairement différente de $[HO^-]$, car les deux
          espèces ne peuvent jamais être égales dans une même solution
        correct: false
        feedback: >
          L'égalité $[H_3O^+] = [HO^-]$ définit exactement la neutralité : ce
          cas n'a rien d'impossible, c'est le cas particulier étudié ici.
      - id: D
        text: "La solution est basique, car $[HO^-]$ est une valeur non nulle"
        correct: false
        feedback: >
          $[HO^-]$ est non nulle dans toute solution aqueuse, à cause de
          l'autoprotolyse de l'eau : sa seule présence ne signale pas une
          solution basique, il faut la comparer à $[H_3O^+]$.
    correct_feedback: >
      $[H_3O^+] = K_e/[HO^-] = 10^{-14}/10^{-7} = 10^{-7}\ \text{mol/L}$ :
      les deux concentrations sont égales, la solution est neutre.
    solution: |
      $K_e = [H_3O^+][HO^-]$ donne $[H_3O^+] = 10^{-7}\ \text{mol/L}$, égale à
      $[HO^-]$ : c'est la définition même de la neutralité.

  # ── R4 (complément) : comparer deux couples via KA/pKA ──────────────────────
  - id: RAB-17
    rung: "R4"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Le couple $A$ a $K_A = 4{,}0 \times 10^{-5}$, le couple $B$ a
      $K_A = 4{,}0 \times 10^{-8}$. Quelle affirmation est correcte ?
    type: mcq
    choices:
      - id: A
        text: >-
          Le couple $A$ est l'acide le plus fort : son $K_A$ est le plus
          grand, donc son $pK_A$ le plus petit
        correct: true
      - id: B
        text: >-
          Le couple $B$ est le plus fort, car son exposant ($-8$) est plus
          négatif, donc « plus fort »
        correct: false
        feedback: >
          Un exposant plus négatif donne un $K_A$ plus petit, donc un acide
          plus faible, pas plus fort : c'est le sens inverse.
      - id: C
        text: >-
          On ne peut pas comparer deux $K_A$ directement ; il faut d'abord
          convertir chacun en pH
        correct: false
        feedback: >
          $K_A$ est une propriété du couple, indépendante de toute solution
          particulière : comparer deux $K_A$ ne nécessite aucune mesure de
          pH.
      - id: D
        text: >-
          Les deux couples ont la même force, car les deux $K_A$ commencent
          par « $4{,}0$ »
        correct: false
        feedback: >
          C'est l'exposant, pas la mantisse, qui domine la comparaison : $10^{-5}$
          et $10^{-8}$ diffèrent d'un facteur $1000$.
    correct_feedback: >
      $K_{A,A} = 10^{-5} > K_{A,B} = 10^{-8}$ (soit $pK_{A,A} = 5 < pK_{A,B} =
      8$) : le couple $A$ est le plus fort.
    solution: |
      Comparer directement les deux $K_A$ (ou leurs $pK_A$ équivalents)
      suffit : $K_A$ plus grand $\Leftrightarrow$ $pK_A$ plus petit
      $\Leftrightarrow$ acide plus fort.

  # ── R5 : diagramme de prédominance ───────────────────────────────────────────
