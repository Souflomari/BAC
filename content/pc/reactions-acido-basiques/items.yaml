  # ── R1 : Brønsted — transfert de proton, couple, ampholyte ─────────────────
  - id: RAB-10
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Selon la définition de Brønsted, qu'est-ce qui définit un acide ?
    type: mcq
    choices:
      - id: A
        text: "Une espèce chimique capable de céder un proton $H^+$"
        correct: true
      - id: B
        text: "Une espèce qui rend une solution corrosive au toucher"
        correct: false
        misconception: AB-BASE-5
        feedback: >
          Brønsted ne définit ni acide ni base par une propriété macroscopique
          comme la corrosivité, mais uniquement par la capacité à céder un
          proton.
      - id: C
        text: "Une espèce capable de capter un proton $H^+$"
        correct: false
        misconception: AB-BASE-5
        feedback: >
          C'est la définition de la base, pas de l'acide : ce choix inverse
          les deux rôles du couple.
      - id: D
        text: >-
          Une espèce qui contient toujours l'atome d'hydrogène dans sa
          formule
        correct: false
        misconception: AB-BASE-5
        feedback: >
          De nombreuses bases (comme $NH_3$) contiennent aussi des atomes
          d'hydrogène ; ce n'est pas leur présence qui définit l'acide, mais
          la capacité à céder un proton.
    correct_feedback: >
      Un acide, au sens de Brønsted, est défini uniquement par sa capacité à
      céder un proton $H^+$ — rien d'autre.
    solution: |
      Brønsted définit acide et base par un seul critère : céder ou capter un
      proton $H^+$. Aucune propriété macroscopique ni aucune formule-type
      n'entre dans cette définition.

  - id: RAB-11
