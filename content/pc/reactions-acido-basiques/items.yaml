    correct_feedback: >
      $NH_4^+$ cède un proton pour donner $NH_3$ : c'est donc l'acide du
      couple, $NH_3$ sa base conjuguée.
    solution: |
      $NH_4^+ \rightleftharpoons NH_3 + H^+$ : l'espèce qui cède le proton est
      l'acide du couple, ici $NH_4^+$.

