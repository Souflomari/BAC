    type: mcq
    choices:
      - id: A
        text: "$[H_3O^+] = 1{,}0 \\times 10^{-6}\\ \\text{mol/L}$, en inversant $\\text{pH} = -\\log[H_3O^+]$"
        correct: true
      - id: B
        text: >-
          $[H_3O^+] = 6{,}0\ \text{mol/L}$, le pH étant directement la
