    correct_feedback: >
      $\text{pH} = -\log(1{,}0 \times 10^{-4}) = 4{,}0$.
    solution: |
      $\text{pH} = -\log[H_3O^+] = -\log(10^{-4}) = 4{,}0$.

  - id: RAB-14
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
