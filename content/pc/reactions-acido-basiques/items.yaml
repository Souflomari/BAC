        correct: true
      - id: B
        text: "$\\tau \\approx 1$, car les deux $pK_A$ sont positifs"
        correct: false
        misconception: AB-BASE-8
        feedback: >
          Le signe des $pK_A$ ne détermine rien ici : c'est l'écart entre les
          deux valeurs qui fixe $K$, pas leur signe.
      - id: C
        text: >-
          $\tau \approx 0$, car aucun des deux $pK_A$ n'est très petit
        correct: false
        misconception: AB-BASE-8
        feedback: >
          Un $pK_A$ « petit dans l'absolu » signale un acide fort face à
          l'eau, mais ici c'est l'écart entre les deux couples — très faible —
          qui gouverne $K$, pas la valeur absolue de chaque $pK_A$.
      - id: D
        text: >-
          On ne peut rien prédire du tout sans connaître les concentrations
          initiales exactes
        correct: false
        misconception: AB-BASE-8
        feedback: >
          $K = K_{A1}/K_{A2}$ ne dépend d'aucune concentration : sa valeur
          seule permet déjà de situer $\tau$ par rapport à $0$, $1$, ou
