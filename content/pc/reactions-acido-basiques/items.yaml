  # ── R7 : réaction entre deux couples — K = KA1/KA2, bilan ──────────────────
  - id: RAB-22
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      On fait réagir l'acide $A_1H$ (couple 1, $pK_{A1} = 3{,}0$) avec la base
      $A_2^-$ (couple 2, $pK_{A2} = 8{,}0$) : $A_1H + A_2^- \rightleftharpoons
      A_1^- + A_2H$. Quelle est la constante d'équilibre $K$ de cette
      réaction ?
    type: mcq
    choices:
      - id: A
        text: "$K = 10^{pK_{A2}-pK_{A1}} = 10^{5}$, l'exposant étant la différence prise dans cet ordre"
        correct: true
      - id: B
        text: >-
          $K = 10^{pK_{A1}-pK_{A2}} = 10^{-5}$, en inversant l'ordre des deux
          $pK_A$ dans l'exposant
        correct: false
        misconception: AB-BASE-7
        feedback: >
          $K = K_{A1}/K_{A2}$, ce qui donne l'exposant $pK_{A2}-pK_{A1}$, pas
          l'inverse : l'ordre des deux termes compte.
      - id: C
        text: >-
          $K = K_{A1} \times K_{A2}$, en multipliant directement les deux
          constantes plutôt qu'en les divisant
        correct: false
        misconception: AB-BASE-7
        feedback: >
          $K$ s'obtient en divisant $K_{A1}$ par $K_{A2}$ (le $[H_3O^+]$
          intermédiaire se simplifie ainsi), pas en les multipliant.
      - id: D
        text: >-
          $K$ dépend du pH de la solution obtenue, il faut donc le mesurer
          expérimentalement
        correct: false
        misconception: AB-BASE-7
        feedback: >
          $K = K_{A1}/K_{A2}$ ne dépend que des deux couples en présence :
          c'est justement ce qui en fait une constante, indépendante du pH.
    correct_feedback: >
      $K = K_{A1}/K_{A2} = 10^{pK_{A2}-pK_{A1}} = 10^{8{,}0-3{,}0} = 10^5$.
    solution: |
      $K = K_{A1}/K_{A2}$, indépendant du pH : $K = 10^{pK_{A2}-pK_{A1}} =
      10^5$.

  - id: RAB-23
    rung: "R7"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Le couple 1 est $NH_4^+/NH_3$, le couple 2 est $HCOOH/HCOO^-$. On fait
