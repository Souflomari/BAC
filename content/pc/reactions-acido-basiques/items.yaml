    correct_feedback: >
      $K \approx 1{,}6$, proche de $1$ : les deux couples sont de forces
      voisines, la réaction reste franchement partielle sans être négligeable.
    solution: |
      $K = 10^{pK_{A2}-pK_{A1}} = 10^{0{,}2} \approx 1{,}6$, proche de $1$ :
      ni $K \gg 1$ ni $K \ll 1$, donc $\tau$ reste intermédiaire.

  # ── R12 (sommet, ex-R8) : application — Ke, neutralité, hors du seul exercice-type ──
  - id: RAB-25
    rung: "R12"
    difficulty_level: 4
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
      Une solution d'acide propanoïque $C_2H_5COOH$ a pour pH mesuré $3{,}9$
      à $25\,^\circ\text{C}$. Calcule $[HO^-]$, et confirme la nature acide de
