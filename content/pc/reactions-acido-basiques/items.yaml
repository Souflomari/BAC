    type: mcq
    choices:
      - id: A
        text: "$HCOOH + NH_3 \\rightleftharpoons HCOO^- + NH_4^+$"
        correct: true
      - id: B
        text: "$HCOOH + NH_4^+ \\rightleftharpoons HCOO^- + NH_3$"
        correct: false
        misconception: AB-BASE-5
        feedback: >
          Ceci fait réagir l'acide du couple 2 avec l'acide du couple 1 :
          $NH_4^+$ est l'acide de son couple, pas sa base — il ne peut pas
          capter un proton en plus.
      - id: C
        text: "$HCOOH + NH_3 \\rightleftharpoons HCOO^- + NH_4^+ + H^+$"
        correct: false
        misconception: AB-BASE-5
        feedback: >
          Le $H^+$ échangé doit s'annuler en combinant les deux
          demi-équations ; il ne doit apparaître nulle part dans le bilan
          final.
      - id: D
        text: "$2\\,HCOOH + NH_3 \\rightleftharpoons HCOO^- + NH_4^+$"
        correct: false
        misconception: AB-BASE-5
        feedback: >
          Un seul proton est échangé entre les deux couples : le coefficient
          $2$ devant $HCOOH$ rompt l'équilibrage de la réaction.
    correct_feedback: >
      L'acide $HCOOH$ (couple 2) cède son proton à la base $NH_3$ (couple 1) :
      $HCOOH + NH_3 \rightleftharpoons HCOO^- + NH_4^+$.
    solution: |
      On combine l'acide du couple 2 avec la base du couple 1 ; le $H^+$
      échangé s'annule, avec un seul proton transféré de chaque côté.

  - id: RAB-24
    rung: "R7"
    difficulty_level: 5
    skill_code: pc_reactions_acido_basiques
    tags: []
    stem: >
