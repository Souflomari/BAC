  - id: LDN-28
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.mouvement-absolu
    stem: >
      Un passager assis dans un train qui roule à vitesse constante. Est-il en
      mouvement, et à quelle vitesse ?
    type: mcq
    choices:
      - id: A
        text: >-
          La question n'a de sens qu'une fois le référentiel précisé : immobile
          dans le référentiel du train, en mouvement dans celui du quai
        correct: true
      - id: B
        text: >-
          Il est en mouvement dans l'absolu, puisqu'il se déplace réellement :
          le référentiel n'est qu'une commodité de description
        correct: false
        misconception: mc.physics.pc_lois_newton.mouvement-absolu
        feedback: >
          Il n'existe pas de référentiel privilégié. Dire « il se déplace
          réellement » suppose un point de vue absolu que la physique ne connaît
          pas : le sol lui-même tourne avec la Terre, qui tourne autour du
          Soleil. Tout mouvement est relatif à un référentiel, qu'il faut donc
          nommer avant de répondre.
      - id: C
        text: >-
          Il est immobile, et le restera même si le train freine brutalement,
          le référentiel du train étant galiléen en toutes circonstances
        correct: false
        misconception: mc.physics.pc_lois_newton.referentiel-toujours-galileen
        feedback: >
          Un train qui freine est un référentiel ACCÉLÉRÉ, donc non galiléen :
          les passagers y sont projetés vers l'avant sans qu'aucune interaction
          ne les pousse. Le principe d'inertie n'y vaut plus, et c'est justement
          ce qui permet de reconnaître un référentiel non galiléen.
      - id: D
        text: >-
          Sa vitesse vaut $120$, un nombre qui suffit à la décrire entièrement
        correct: false
        misconception: mc.physics.pc_lois_newton.vitesse-scalaire
        feedback: >
          Il manque deux choses : l'unité, et surtout la DIRECTION. La vitesse
          est un vecteur — norme, direction, sens. Deux trains de même norme
          allant l'un vers l'autre n'ont pas la même vitesse, et c'est cette
          différence qui décide de ce qui va se passer.
    correct_feedback: >
      Tout mouvement est relatif : le passager est immobile dans le référentiel
      du train et en mouvement dans celui du quai. Aucune des deux descriptions
      n'est plus vraie que l'autre — il faut seulement dire laquelle on adopte.
    solution: |
      **La relativité du mouvement.** Décrire un mouvement, c'est toujours le
      rapporter à un solide de référence. Sans référentiel nommé, « il bouge »
      n'est ni vrai ni faux : la question est incomplète.

      **Les deux réponses, toutes deux correctes.**
      - Référentiel du train : le passager est immobile.
      - Référentiel du quai : il avance à la vitesse du train.

      **Le vecteur vitesse.** Il ne se réduit pas à un nombre : il porte une
      direction et un sens. C'est ce qui permettra d'écrire $\vec a$ comme sa
      variation, et de comprendre qu'un mouvement circulaire uniforme est
      accéléré bien que la norme ne change pas.

  - id: LDN-29
    rung: "R2"
    difficulty_level: 3
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.frottement-absent-accelere
    stem: >
      Un palet glisse en ligne droite à vitesse constante sur une table à
      coussin d'air, où les frottements sont négligeables. Que se passe-t-il si
      l'on supprime complètement ce qui reste de frottement ?
    type: mcq
    choices:
      - id: A
        text: >-
          Rien de plus : le palet continue à la même vitesse, en ligne droite,
          indéfiniment
        correct: true
      - id: B
        text: >-
          Il accélère : sans frottement pour le retenir, plus rien ne s'oppose à
          sa progression
        correct: false
        misconception: mc.physics.pc_lois_newton.frottement-absent-accelere
        feedback: >
          Enlever un frein n'équivaut pas à ajouter un moteur. Accélérer demande
          une force RÉSULTANTE non nulle dans le sens du mouvement ; il n'y en a
          aucune. Le principe d'inertie est explicite : sans force résultante, la
          vitesse — vecteur — reste constante.
      - id: C
        text: >-
          Il accélère, car il faut ajouter au bilan la force du mouvement qui
          l'anime et que le frottement contrariait
        correct: false
        misconception: mc.physics.pc_lois_newton.bilan-forces-incorrect
        feedback: >
          Il n'existe pas de « force du mouvement ». Chaque force doit
          correspondre à une INTERACTION identifiable avec un autre corps : le
          poids (Terre), la réaction normale (table), le frottement (table).
          Le mouvement n'est pas un partenaire d'interaction — c'est un état,
          pas une cause.
      - id: D
        text: >-
          Impossible à dire : le référentiel de la table étant accéléré, donc non
          galiléen, le principe d'inertie ne s'y applique pas
        correct: false
        misconception: mc.physics.pc_lois_newton.referentiel-toujours-galileen
        feedback: >
          Une table posée au sol n'est pas accélérée : le référentiel terrestre
          est considéré comme galiléen pour des expériences de cette durée et de
          cette échelle. Ce sont les référentiels en accélération — un bus qui
          freine, un manège qui tourne — qui ne le sont pas.
    correct_feedback: >
      Rien ne change : le palet poursuit son mouvement rectiligne uniforme. Le
      principe d'inertie dit exactement cela — sans force résultante, le vecteur
      vitesse reste constant. Supprimer une force résistante ne crée pas de force
      motrice.
    solution: |
      **Le bilan des forces.** Poids $\vec P$ (interaction avec la Terre),
      réaction normale $\vec R_N$ (interaction avec la table). Elles se
      compensent : $\sum \vec F_{ext} = \vec 0$.

      **Le principe d'inertie.** Dans un référentiel galiléen, si la somme des
      forces extérieures est nulle, le centre d'inertie est au repos ou en
      mouvement rectiligne uniforme. Ici : mouvement rectiligne uniforme,
      indéfiniment.

      **L'intuition à défaire.** Nous vivons entourés de frottements : arrêter
      demande de ne rien faire, avancer demande un effort. D'où l'idée qu'un
      mouvement « a besoin » d'une force, et qu'ôter le frein libère une
      poussée. Ni l'un ni l'autre n'est vrai.

  - id: LDN-30
    rung: "R5"
    difficulty_level: 3
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.bilan-forces-incorrect
    stem: >
      Une caisse est tirée à vitesse constante sur un sol horizontal par une
      corde horizontale. Quel bilan des forces est correct ?
    type: mcq
    choices:
      - id: A
        text: >-
          Poids, réaction normale, traction de la corde et frottement : quatre
          forces, dont la somme est nulle
        correct: true
      - id: B
        text: >-
          Poids, réaction normale, traction, frottement, plus la force d'inertie
          qui accompagne le mouvement de la caisse
        correct: false
        misconception: mc.physics.pc_lois_newton.bilan-forces-incorrect
        feedback: >
          Une force exige une interaction avec un corps identifiable : la Terre,
          le sol, la corde. Aucune « force d'inertie » n'a de partenaire dans un
          référentiel galiléen — l'inertie est la PROPRIÉTÉ qu'a un corps de
          résister au changement de vitesse, pas une force qui s'exercerait sur
          lui.
      - id: C
        text: >-
          Poids, réaction normale et traction seulement, le poids fournissant la
          composante horizontale qui freine le mouvement
        correct: false
        misconception: mc.physics.pc_lois_newton.force-verticale-composante-horizontale
        feedback: >
          Sur un sol horizontal, le poids est vertical : sa composante
          horizontale est nulle, il ne peut donc ni pousser ni freiner
          latéralement. Ce qui freine, c'est le frottement, force horizontale
          exercée par le sol et opposée au déplacement — et le bilan ne peut pas
          s'en passer.
      - id: D
        text: >-
          Le bilan dépend du référentiel : dans celui de la caisse, qui n'est pas
          galiléen, une force supplémentaire apparaît
        correct: false
        misconception: mc.physics.pc_lois_newton.referentiel-toujours-galileen
        feedback: >
          La caisse avance à vitesse CONSTANTE : son référentiel est en
          translation rectiligne uniforme par rapport au sol, donc galiléen lui
          aussi. Aucune force supplémentaire n'y apparaît. Ce sont les
          référentiels accélérés qui font surgir des forces sans interaction.
    correct_feedback: >
      Quatre forces : le poids (Terre), la réaction normale (sol), la traction
      (corde) et le frottement (sol). La vitesse étant constante, leur somme est
      nulle — les verticales se compensent entre elles, les horizontales entre
      elles.
    solution: |
      **La règle de construction d'un bilan.** Une force par INTERACTION, et une
      seule. On liste les corps en contact ou à distance :
      - la Terre → le poids $\vec P$, vertical vers le bas ;
      - le sol → la réaction normale $\vec R_N$, verticale vers le haut, et le
        frottement $\vec f$, horizontal opposé au mouvement ;
      - la corde → la traction $\vec T$, horizontale.

      **La condition de vitesse constante.**
      $$
      \sum \vec F_{ext} = \vec 0
      \quad\Longrightarrow\quad R_N = P \ \text{ et } \ T = f
      $$

      **Ce qu'on n'ajoute jamais.** Une force du mouvement, une force d'inertie,
      un élan : aucune n'a de partenaire d'interaction dans un référentiel
      galiléen.

  - id: LDN-31
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.resultante-mal-composee
    stem: >
      Un solide de masse $m = 4{,}0\ \text{kg}$ est soumis à deux forces
      horizontales de sens opposés : $F_1 = 30\ \text{N}$ vers la droite et
      $F_2 = 10\ \text{N}$ vers la gauche. Que vaut son accélération ?
    type: mcq
    choices:
      - id: A
        text: >-
          $5{,}0\ \text{m}\cdot\text{s}^{-2}$, dirigée vers la droite comme la
          résultante des deux forces
        correct: true
      - id: B
        text: >-
          $10\ \text{m}\cdot\text{s}^{-2}$ vers la droite, en additionnant les
          deux intensités avant de diviser par la masse
        correct: false
        misconception: mc.physics.pc_lois_newton.resultante-mal-composee
        feedback: >
          Deux forces de sens OPPOSÉS se retranchent : la résultante vaut
          $30 - 10 = 20\ \text{N}$, pas $40$. La deuxième loi porte sur la
          somme VECTORIELLE des forces, et le sens compte autant que
          l'intensité.
      - id: C
        text: >-
          $5{,}0\ \text{m}\cdot\text{s}^{-2}$, mais la direction ne peut pas être
          précisée : une accélération est un nombre, pas un vecteur
        correct: false
        misconception: mc.physics.pc_lois_newton.vitesse-scalaire
        feedback: >
          La valeur est juste, la conclusion non. $\sum \vec F = m\vec a$ est une
          égalité entre VECTEURS : l'accélération a la même direction et le même
          sens que la résultante — ici vers la droite. Réduire une grandeur
          vectorielle à sa norme fait perdre l'essentiel de l'information.
      - id: D
        text: >-
          $20\ \text{m}\cdot\text{s}^{-2}$, car sans frottement mentionné le
          solide accélère d'autant plus
        correct: false
        misconception: mc.physics.pc_lois_newton.frottement-absent-accelere
        feedback: >
          L'absence de frottement ne s'ajoute pas au calcul : elle signifie
          simplement qu'aucune force supplémentaire ne figure au bilan.
          L'accélération vient de la résultante des forces PRÉSENTES, divisée par
          la masse — et $20\ \text{N}$ est cette résultante, pas l'accélération.
    correct_feedback: >
      $\sum \vec F = 30 - 10 = 20\ \text{N}$ vers la droite, donc
      $a = 20/4{,}0 = 5{,}0\ \text{m}\cdot\text{s}^{-2}$, dans le même sens. La
      deuxième loi est vectorielle : le sens de l'accélération est celui de la
      résultante.
    solution: |
      **La résultante.** Les deux forces sont colinéaires et de sens opposés :
      $$
      \sum \vec F_{ext} = F_1 - F_2 = 30 - 10 = 20\ \text{N}
      \ \text{(vers la droite)}
      $$

      **La deuxième loi.**
      $$
      \sum \vec F_{ext} = m\,\vec a
      \quad\Longrightarrow\quad
      a = \frac{20}{4{,}0} = 5{,}0\ \text{m}\cdot\text{s}^{-2}
      $$
      Le vecteur $\vec a$ a la même direction et le même sens que la résultante.

      **Les deux contrôles à faire systématiquement.** Diviser par la MASSE (en
      kg), jamais par le poids $mg$ ; et composer les forces vectoriellement,
      donc en tenant compte des sens.

  - id: LDN-32
    rung: "R6"
    difficulty_level: 3
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.erreur-cinematique-uniforme
    stem: >
      Un objet est lâché sans vitesse initiale et tombe en chute libre pendant
      $t = 2{,}0\ \text{s}$. On prend $g = 10\ \text{m}\cdot\text{s}^{-2}$. De
      quelle hauteur est-il tombé ?
    type: mcq
    choices:
      - id: A
        text: >-
          $40\ \text{m}$ : la chute étant uniformément accélérée, la hauteur
          vaut $g\,t^{2}$
        correct: false
        misconception: mc.physics.pc_lois_newton.erreur-cinematique-uniforme
        feedback: >
          Le facteur $\frac12$ manque, et il double le résultat.
          $h = \frac12 g t^{2}$ : la vitesse croît LINÉAIREMENT de $0$ à $gt$,
          donc sa moyenne vaut $\frac{gt}{2}$, et la distance est cette moyenne
          multipliée par la durée. C'est le même $\frac12$ que dans l'énergie
          cinétique, et il vient du même endroit.
      - id: B
        text: >-
          $20\ \text{m}$ : la hauteur vaut $h = \frac{1}{2}g t^{2}
          = \frac{1}{2}\times 10 \times 2{,}0^{2}$
        correct: true
      - id: C
        text: >-
          $10\ \text{m}$ : la réaction du sol s'oppose au poids pendant toute la
          chute et réduit l'accélération de moitié
        correct: false
        misconception: mc.physics.pc_lois_newton.role-normale-mal-compris
        feedback: >
          Pendant la chute, l'objet n'est en contact avec rien : il n'y a aucune
          réaction normale. Celle-ci n'apparaît que lorsqu'un support s'oppose à
          l'enfoncement — donc à l'impact, brutalement. En chute libre, le poids
          est la seule force, et l'accélération vaut exactement $g$.
      - id: D
        text: >-
          $0\ \text{m}$ : le poids et la force que l'objet exerce en retour sur
          la Terre se compensent, donc il ne tombe pas
        correct: false
        misconception: mc.physics.pc_lois_newton.action-reaction-meme-corps
        feedback: >
          Les deux forces d'une paire action-réaction s'exercent sur des corps
          DIFFÉRENTS : le poids sur l'objet, l'attraction en retour sur la Terre.
          Elles ne peuvent donc jamais se compenser — se compenser suppose d'agir
          sur le même corps. Si elles le faisaient, rien ne tomberait jamais.
    correct_feedback: >
      $h = \frac{1}{2}g t^{2} = \frac{1}{2} \times 10 \times 4{,}0 =
      20\ \text{m}$. Le facteur $\frac12$ vient de l'intégration : la vitesse
      croît linéairement, la distance parcourue est la moyenne de la vitesse
      multipliée par la durée.
    solution: |
      **La mise en équation.** Chute libre : seule force le poids, donc
      $\vec a = \vec g$. En prenant l'axe vertical descendant, origine au point
      de lâcher, et $v_0 = 0$ :
      $$v(t) = g\,t \qquad h(t) = \frac{1}{2}g\,t^{2}$$

      **L'application.**
      $$h = \frac{1}{2} \times 10 \times (2{,}0)^{2} = 20\ \text{m}$$

      **D'où vient le $\frac{1}{2}$.** La vitesse passe de $0$ à $g t$
      linéairement : sa moyenne vaut $\frac{gt}{2}$, et la distance est cette
      moyenne multipliée par la durée. Oublier ce facteur double le résultat.

      **Le bilan pendant la chute.** Une seule force, le poids. Pas de réaction
      normale (aucun contact), et la force que l'objet exerce sur la Terre
      s'applique à la TERRE, pas à lui.

  - id: LDN-33
    rung: "R1"
    difficulty_level: 2
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.mouvement-absolu
    stem: >
      Deux voitures roulent côte à côte sur l'autoroute, exactement à la même
      vitesse. Un conducteur dit : « l'autre voiture est immobile ». A-t-il
      raison ?
    type: mcq
    choices:
      - id: A
        text: >-
          Oui dans son référentiel, où l'autre voiture ne se déplace pas ; non
          dans celui de la route, où les deux avancent
        correct: true
      - id: B
        text: >-
          Non : les deux voitures roulent réellement, donc elles sont en
          mouvement, et aucun point de vue ne peut rendre cela faux
        correct: false
        misconception: mc.physics.pc_lois_newton.mouvement-absolu
        feedback: >
          « Rouler réellement » suppose un référentiel absolu que la physique ne
          reconnaît pas. Dans le référentiel de la première voiture, la seconde
          est rigoureusement immobile — sa distance ne varie pas — et cette
          description est aussi légitime que l'autre. Le mouvement n'est pas une
          propriété du corps, mais une relation.
      - id: C
        text: >-
          Non : sa voiture ne peut pas servir de référentiel, puisqu'elle est
          elle-même en mouvement
        correct: false
        misconception: mc.physics.pc_lois_newton.referentiel-toujours-galileen
        feedback: >
          N'importe quel solide peut servir de référentiel — c'est même le
          principe. La question n'est pas de savoir s'il bouge (par rapport à
          quoi ?) mais s'il est GALILÉEN, c'est-à-dire non accéléré. Une voiture
          à vitesse constante l'est autant que la route.
      - id: D
        text: >-
          Oui, puisque leurs vitesses ont la même valeur : deux vitesses de même
          norme sont identiques, la direction n'entrant pas en compte
        correct: false
        misconception: mc.physics.pc_lois_newton.vitesse-scalaire
        feedback: >
          La conclusion est juste, le raisonnement non — et il tomberait en
          défaut si les deux voitures se croisaient en sens inverse : mêmes
          normes, vitesses relatives doublées. Une vitesse est un vecteur ; deux
          vitesses ne sont égales que si la direction et le sens le sont aussi.
    correct_feedback: >
      Il a raison dans son référentiel : la distance entre les deux voitures ne
      varie pas, donc l'autre y est immobile. Dans le référentiel de la route,
      les deux avancent. Les deux descriptions sont exactes — elles ne se
      rapportent pas au même solide de référence.
    solution: |
      **Le principe.** Un mouvement se décrit toujours par rapport à un
      référentiel. Changer de référentiel change la description, sans qu'aucune
      ne soit « la vraie ».

      **Les deux descriptions.**
      - Référentiel de la première voiture : la seconde est immobile.
      - Référentiel de la route : les deux avancent à la même vitesse.

      **Le critère qui compte vraiment.** Non pas « ce référentiel bouge-t-il ? »
      — la question est vide sans second référentiel — mais « est-il
      GALILÉEN ? », c'est-à-dire non accéléré. Une voiture à vitesse constante
      l'est ; la même voiture en train de freiner ne l'est plus.

  # Ajoutés le 2026-09-24 — spec pedagogy-architect
  # content/pc/lois-de-newton/spec-scene-tremplin.md §8.2-§8.3 :
  # QUATRE items (LDN-34 à LDN-37) pour le vingtième modèle,
  # acceleration-traitee-comme-un-nombre — dériver la NORME de la vitesse au
  # lieu du VECTEUR, structurellement invisible sur les 33 items rectilignes
  # existants (il y répond juste). Placés AVANT l'énoncé de la deuxième loi :
  # aucune force, aucune masse, aucun newton, aucune « centripète/centrifuge ».
  # RÉVISÉS le 2026-09-25 — revue vague 1 (item-author) : LDN-37 ne
  # discriminait pas le modèle (stem rectiligne, où a_N est structurellement
  # nul) — réécrit sur le tremplin (arc), gaz puis freinage, a_N non nul et
  # qui disparaît du produit a·v. La clause « quel que soit l'axe choisi »,
  # seul absolu des quatre clés, déplacée du choix A vers le tronc. LDN-34 :
  # formule + valeur retirées de la clé (seule à les porter). LDN-36 : le
  # dos d'âne nommé « arc de cercle » (le bac ne donne un rayon de courbure
  # que pour un arc). AJOUT de LDN-38 (R8, la composition ‖a‖=√(a_T²+a_N²),
  # Forme E déclarée ci-dessus) : CINQ items (LDN-34 à LDN-38).
  - id: LDN-34
    rung: "R3"
    difficulty_level: 2
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
    stem: >
      Un motard aborde un tremplin circulaire de rayon $R = 20\ \text{m}$ et le
      parcourt en tenant exactement sa vitesse : son compteur affiche
      $18\ \text{m/s}$ à l'entrée, au milieu et à la sortie du tremplin. Que
      peut-on dire du vecteur accélération de la moto au milieu du tremplin ?
    type: mcq
    choices:
      - id: A
        text: >-
          Non nul, perpendiculaire à la vitesse, et dirigé vers le centre
          du tremplin.
        correct: true
      - id: B
        text: >-
          Nul, puisque la vitesse affichée par le compteur ne change pas
          entre l'entrée et la sortie.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          C'est la NORME de la vitesse qui ne change pas ici ; le vecteur
          vitesse, lui, tourne de 28° entre l'entrée et la sortie du
          tremplin. L'accélération mesure la variation du VECTEUR, pas celle
          du nombre affiché au compteur : un mouvement circulaire à vitesse
          tenue est accéléré bien que sa norme reste constante.
      - id: C
        text: >-
          Perpendiculaire à la vitesse, mais dirigé vers l'extérieur du
          tremplin, loin du centre.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          La trajectoire s'incurve vers le centre du tremplin ; une
          composante d'accélération dirigée vers l'extérieur la courberait
          dans l'autre sens. Le vecteur unitaire normal pointe, par
          définition, vers le centre de courbure — jamais à l'opposé.
      - id: D
        text: >-
          Dirigé vers l'avant, dans le sens du mouvement, car il faut bien
          quelque chose pour entraîner la moto.
        correct: false
        misconception: mc.physics.pc_lois_newton.force-entretient-mouvement
        feedback: >
          Une accélération dirigée vers l'avant ferait grandir la norme de
          la vitesse ; or l'énoncé précise qu'elle reste la même du début à
          la fin du tremplin. Ce n'est pas parce qu'un mobile avance qu'il
          lui faut une accélération dans le sens du mouvement : c'est la
          variation du vecteur vitesse, direction comprise, qui définit
          l'accélération.
    correct_feedback: >
      Un vecteur vitesse peut changer de deux façons indépendantes : sa
      norme et sa direction. Ici la norme reste $18\ \text{m/s}$ tout du
      long, mais la direction tourne à mesure que la moto suit la courbe du
      tremplin — c'est cette rotation que mesure la composante normale de
      l'accélération, $v^2/R$, dirigée vers le centre.
    solution: |
      **Ce que dit le compteur, et ce qu'il ne dit pas.** La norme de la
      vitesse reste $18\ \text{m/s}$ à l'entrée, au milieu et à la sortie :
      rien ne le contredit. Mais un vecteur vitesse porte aussi une
      direction, et celle-ci tourne à mesure que la moto suit la courbe du
      tremplin — le compteur ne montre que la norme, jamais la direction.

      **Le calcul.** L'accélération se décompose en une composante le long
      du mouvement (nulle ici, puisque la norme ne change pas) et une
      composante perpendiculaire, dirigée vers le centre de courbure :
      $$a_N = \frac{v^2}{R} = \frac{18^2}{20} = \frac{324}{20} = 16{,}2\ \text{m/s}^2$$

      **Ce qu'il faut en retenir.** Un mouvement circulaire à vitesse tenue
      est accéléré, alors même que le compteur n'indique aucun changement.

  - id: LDN-35
    rung: "R8"
    difficulty_level: 3
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
    stem: >
      Sur un tremplin circulaire de rayon $R = 20\ \text{m}$ pris à vitesse
      tenue, la composante normale de l'accélération vaut
      $4{,}05\ \text{m/s}^2$ à $9{,}0\ \text{m/s}$. Que vaut-elle (i) à
      $18\ \text{m/s}$ sur ce même tremplin, puis (ii) à $18\ \text{m/s}$
      sur un tremplin de rayon $R = 10\ \text{m}$ ?
    type: mcq
    choices:
      - id: A
        text: >-
          $16{,}2\ \text{m/s}^2$, puis $32{,}4\ \text{m/s}^2$.
        correct: true
      - id: B
        text: >-
          $8{,}10\ \text{m/s}^2$, puis $16{,}2\ \text{m/s}^2$.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          Doubler la vitesse ne double pas la composante normale de
          l'accélération, il la quadruple : elle varie comme le carré de la
          vitesse, pas comme la vitesse elle-même.
      - id: C
        text: >-
          $16{,}2\ \text{m/s}^2$, puis $8{,}10\ \text{m/s}^2$.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          Le rayon est au dénominateur de $v^2/R$, pas au numérateur : un
          tremplin plus serré (rayon plus petit) réclame une composante
          normale plus grande, pas plus petite.
      - id: D
        text: >-
          $16{,}2\ \text{m/s}^2$, puis $64{,}8\ \text{m/s}^2$.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          Le carré porte sur la vitesse seule : diviser le rayon par deux
          double la composante normale, il ne la quadruple pas. $v^2/R$
          n'élève pas $R$ au carré.
    correct_feedback: >
      La composante normale de l'accélération vaut $v^2/R$ : elle varie
      comme le carré de la vitesse et comme l'inverse du rayon. Un contrôle
      simple, sans division : le produit $a_N \times R$ vaut $v^2$ dans les
      deux cas, soit $324$.
    solution: |
      **La relation.** $a_N = \dfrac{v^2}{R}$, où $R$ est le rayon du
      tremplin.

      **(i) Même tremplin, vitesse doublée.**
      $$a_N = \frac{18^2}{20} = \frac{324}{20} = 16{,}2\ \text{m/s}^2$$
      quatre fois la valeur à $9{,}0\ \text{m/s}$ ($4{,}05 \times 4 =
      16{,}2$), parce que la vitesse intervient au carré.

      **(ii) Même vitesse, rayon divisé par deux.**
      $$a_N = \frac{18^2}{10} = \frac{324}{10} = 32{,}4\ \text{m/s}^2$$
      le double de (i), parce que le rayon est au dénominateur.

      **Vérification.** $a_N \times R$ vaut $324$ dans les deux cas,
      exactement $v^2$.

  - id: LDN-36
    rung: "R8"
    difficulty_level: 4
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
    stem: >
      Une voiture franchit le sommet d'un dos d'âne, modélisé au sommet par
      un arc de cercle de rayon $R = 50\ \text{m}$, à la vitesse constante
      de $20\ \text{m/s}$. Au sommet, quelle est la direction de la
      composante normale de son accélération, et quelle est sa valeur ?
    type: mcq
    choices:
      - id: A
        text: >-
          Vers le bas, droit vers le centre de courbure ;
          $a_N = v^2/R = 8{,}0\ \text{m/s}^2$.
        correct: true
      - id: B
        text: >-
          Vers le haut, comme la route qui pousse la voiture ;
          $a_N = 8{,}0\ \text{m/s}^2$.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          Le vecteur unitaire normal ne pointe ni « vers le haut » ni « du
          côté de la route » : il pointe vers le centre de courbure,
          c'est-à-dire du côté concave de la trajectoire. Au sommet d'une
          bosse, ce centre est en dessous de la route, pas au-dessus.
      - id: C
        text: >-
          Nulle, car la vitesse de la voiture reste constante au passage du
          sommet.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          La norme de la vitesse est constante, mais sa direction ne l'est
          pas : au sommet, la voiture passe de « monter » à « descendre ».
          C'est ce changement de direction que mesure la composante normale
          de l'accélération, non nulle même à vitesse tenue.
      - id: D
        text: >-
          Vers le bas, vers le centre de courbure ;
          $a_N = v/R = 0{,}40\ \text{m/s}^2$.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          $v/R$ n'est même pas une accélération : son unité est celle de
          l'inverse d'un temps, pas celle d'une accélération. C'est
          $v^2/R$, avec la vitesse au carré, qui donne des mètres par
          seconde au carré.
    correct_feedback: >
      Au sommet d'un dos d'âne, le centre de courbure de la trajectoire est
      sous la route : la composante normale de l'accélération y pointe vers
      le bas, avec $a_N = v^2/R = 20^2/50 = 8{,}0\ \text{m/s}^2$.
    solution: |
      **Où est le centre de courbure.** Au sommet d'une bosse, la
      trajectoire est concave vers le bas : son centre de courbure se
      trouve sous la route, pas au-dessus. Le vecteur unitaire normal
      pointe toujours vers ce centre.

      **Le calcul.**
      $$a_N = \frac{v^2}{R} = \frac{20^2}{50} = \frac{400}{50} = 8{,}0\ \text{m/s}^2$$

      **Contrôle dimensionnel.** $v/R$ donnerait
      $\mathrm{m\,s^{-1}}/\mathrm{m} = \mathrm{s^{-1}}$, l'inverse d'un
      temps — pas une accélération. Seul $v^2/R$ a la bonne dimension,
      $\mathrm{L\,T^{-2}}$.

  - id: LDN-37
    rung: "R3"
    difficulty_level: 3
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
    stem: >
      Sur le tremplin circulaire de rayon $R = 20\ \text{m}$, au même point
      de l'arc, la moto passe deux fois à $v = 18\ \text{m/s}$ : une fois
      moteur relancé ($dv/dt = +4{,}5\ \text{m/s}^2$), une fois freins
      serrés ($dv/dt = -4{,}5\ \text{m/s}^2$). Pour savoir si le mouvement
      est accéléré ou retardé, on calcule le produit scalaire
      $\vec a\cdot\vec v$. Que vaut-il dans chaque cas ?
    type: mcq
    choices:
      - id: A
        text: >-
          $+81{,}0\ \text{m}^2/\text{s}^3$ moteur relancé (accéléré), puis
          $-81{,}0\ \text{m}^2/\text{s}^3$ au freinage (retardé), quel que
          soit l'axe choisi.
        correct: true
      - id: B
        text: >-
          $+81{,}0\ \text{m}^2/\text{s}^3$ dans les deux cas : tant que la
          moto avance, le produit est toujours positif.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          $\vec a\cdot\vec v$ ne dit pas dans quel sens la moto avance : il
          dit si la norme de la vitesse grandit ou diminue. Il vaut
          $a_T\,v$, avec $v>0$ : son signe est celui de $dv/dt$, pas celui
          du déplacement — ici $dv/dt$ change de signe entre les deux
          passages, donc $\vec a\cdot\vec v$ aussi.
      - id: C
        text: >-
          Au freinage, $\vec a\cdot\vec v$ devient
          $+81{,}0\ \text{m}^2/\text{s}^3$ si l'on choisit un axe orienté
          vers l'arrière : le signe dépend de l'axe.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          C'est le signe d'une COMPOSANTE qui dépend de l'axe choisi pour
          projeter $\vec a$ ; le produit scalaire $\vec a\cdot\vec v$, lui,
          n'en dépend pas — c'est exactement pour cette raison que le
          programme demande ce produit plutôt qu'un signe de composante.
      - id: D
        text: >-
          $\|\vec a\| = 16{,}8\ \text{m/s}^2$ dans les deux cas : la norme
          de l'accélération ne changeant pas, la nature du mouvement ne
          change pas non plus.
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          La norme $\|\vec a\| = \sqrt{a_T^2+a_N^2}$ est en effet la même
          aux gaz et au freinage (la composante normale
          $a_N = 16{,}2\ \text{m/s}^2$ ne dépend pas du régime) — mais la
          NATURE du mouvement ne se lit pas sur cette norme : elle se lit
          sur le SIGNE de $\vec a\cdot\vec v = a_T\,v$, qui change avec
          $dv/dt$. Deux mouvements de natures opposées peuvent avoir
          exactement la même norme d'accélération.
    correct_feedback: >
      $\vec a\cdot\vec v = a_T\,v$, car la composante normale, perpendiculaire
      à $\vec v$, ne contribue pas au produit scalaire. Avec
      $v = 18\ \text{m/s} > 0$ dans les deux cas, le signe de
      $\vec a\cdot\vec v$ est exactement celui de $dv/dt$ :
      $+81{,}0\ \text{m}^2/\text{s}^3$ moteur relancé (accéléré),
      $-81{,}0\ \text{m}^2/\text{s}^3$ au freinage (retardé) — sans qu'aucun
      axe n'ait dû être choisi.
    solution: |
      **Le produit scalaire, terme à terme.** Dans la base de Freinet,
      $\vec a = \dfrac{dv}{dt}\vec u_T + \dfrac{v^2}{R}\vec u_N$ et
      $\vec v = v\,\vec u_T$. Comme $\vec u_N$ est perpendiculaire à
      $\vec u_T$ :
      $$\vec a\cdot\vec v = \left(\frac{dv}{dt}\vec u_T + \frac{v^2}{R}\vec u_N\right)\cdot\left(v\,\vec u_T\right) = \frac{dv}{dt}\,v$$

      La composante normale $a_N = v^2/R = 18^2/20 = 16{,}2\ \text{m/s}^2$
      existe bel et bien ici (la trajectoire est un arc, pas une droite) —
      mais elle DISPARAÎT du produit, précisément parce qu'elle est
      perpendiculaire à $\vec v$.

      **L'application numérique.**
      $$\text{moteur relancé : } \vec a\cdot\vec v = (+4{,}5)\times18 = +81{,}0\ \text{m}^2/\text{s}^3 \quad\text{(accéléré)}$$
      $$\text{freinage : } \vec a\cdot\vec v = (-4{,}5)\times18 = -81{,}0\ \text{m}^2/\text{s}^3 \quad\text{(retardé)}$$

      **Pourquoi ce produit, et pas un signe de composante, ni la norme de
      $\vec a$.** Une composante de $\vec a$ change de signe selon l'axe
      choisi pour la projeter ; le produit scalaire $\vec a\cdot\vec v$,
      lui, ne dépend d'aucun axe. Et la norme
      $\|\vec a\| = \sqrt{a_T^2+a_N^2} = 16{,}8\ \text{m/s}^2$ est la MÊME
      dans les deux régimes : c'est le signe de $\vec a\cdot\vec v$, pas sa
      valeur absolue ni celle de $\vec a$, qui distingue accéléré de
      retardé.

  # Ajouté le 2026-09-25 — revue vague 1, cinquième item du vingtième
  # modèle : la COMPOSITION des deux composantes (Pythagore), qu'aucun des
  # quatre premiers n'exerçait. Situation S5 du descripteur de scène
  # (v = 12 m/s en B, R = 20 m, freinage).
  - id: LDN-38
    rung: "R8"
    difficulty_level: 4
    skill_code: pc_lois_newton
    tags: []
    primary_misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
    stem: >
      Sur le tremplin circulaire de rayon $R = 20\ \text{m}$, au point
      d'entrée $B$, la moto roule à $v = 12\ \text{m/s}$ et freine
      ($dv/dt = -4{,}50\ \text{m/s}^2$). Quelle est la norme du vecteur
      accélération en ce point ?
    type: mcq
    choices:
      - id: A
        text: >-
          $\|\vec a\| = \sqrt{a_T^2+a_N^2} = \sqrt{4{,}50^2+7{,}20^2} =
          8{,}49\ \text{m/s}^2$
        correct: true
      - id: B
        text: >-
          $\|\vec a\| = a_T + a_N = 4{,}50+7{,}20 = 11{,}7\ \text{m/s}^2$
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          $a_T$ et $a_N$ sont deux composantes PERPENDICULAIRES d'un même
          vecteur (l'une tangente à la trajectoire, l'autre normale, vers
          le centre) : les additionner comme deux nombres revient à les
          traiter comme colinéaires. Seul le théorème de Pythagore compose
          deux vecteurs orthogonaux — $\|\vec a\| = \sqrt{a_T^2+a_N^2}$ —,
          et cette norme est plus petite que la somme des deux normes.
      - id: C
        text: >-
          $\|\vec a\| = a_N - a_T = 7{,}20-4{,}50 = 2{,}70\ \text{m/s}^2$
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          Soustraire une composante de l'autre ne donnerait la norme de
          leur somme que si $a_T$ et $a_N$ étaient colinéaires, de sens
          opposés. Ici elles sont PERPENDICULAIRES ($\vec u_T \perp
          \vec u_N$ par construction de la base de Freinet) : ni la somme
          ni la différence de leurs normes ne composent correctement deux
          vecteurs orthogonaux — seul $\sqrt{a_T^2+a_N^2}$ le fait.
      - id: D
        text: >-
          $\|\vec a\| = a_T = 4{,}50\ \text{m/s}^2$ (seule la composante
          tangentielle)
        correct: false
        misconception: mc.physics.pc_lois_newton.acceleration-traitee-comme-un-nombre
        feedback: >
          Cette composante traduit bien le freinage, mais elle n'est pas
          seule : la trajectoire est courbe ici, donc une composante
          normale $a_N = v^2/R = 12^2/20 = 7{,}20\ \text{m/s}^2$ existe
          aussi — et elle est même plus grande que $a_T$ en valeur absolue.
          La norme du vecteur accélération combine les deux composantes
          par Pythagore, pas la seule composante tangentielle.
    correct_feedback: >
      $a_T$ et $a_N$ sont les deux composantes du vecteur $\vec a$ dans la
      base de Freinet, et elles sont perpendiculaires par construction : la
      norme de leur somme vectorielle suit le théorème de Pythagore, pas
      une addition ou une soustraction algébrique.
      $\|\vec a\| = \sqrt{4{,}50^2+7{,}20^2} = \sqrt{72{,}09} =
      8{,}49\ \text{m/s}^2$.
    solution: |
      **Les deux composantes, dans la base de Freinet.**
      $$a_T = \frac{dv}{dt} = -4{,}50\ \text{m/s}^2 \qquad a_N = \frac{v^2}{R} = \frac{12^2}{20} = \frac{144}{20} = 7{,}20\ \text{m/s}^2$$

      **Pourquoi Pythagore, et pas une somme.** $\vec u_T$ et $\vec u_N$
      sont, par construction, perpendiculaires : $\vec a = a_T\vec u_T +
      a_N\vec u_N$ est la somme de deux vecteurs orthogonaux, dont la norme
      se calcule comme l'hypoténuse d'un triangle rectangle de côtés
      $|a_T|$ et $a_N$ — jamais comme une somme ou une différence
      algébrique de deux nombres.

      **Le calcul.**
      $$\|\vec a\| = \sqrt{a_T^2+a_N^2} = \sqrt{(-4{,}50)^2+7{,}20^2} = \sqrt{20{,}25+51{,}84} = \sqrt{72{,}09} = 8{,}49\ \text{m/s}^2$$

