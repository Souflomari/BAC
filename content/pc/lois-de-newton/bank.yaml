    intro: |-
      **Mouvement d'un skieur sur un plan incliné puis un plan horizontal (examen national, session normale 2011 — Mécanique, situations 1 et 2, 3,25 points sur les 5,50 de l'exercice complet).**

      *La troisième situation de cet exercice — le mouvement de $G$ dans le champ de pesanteur uniforme après le point $D$ — est indépendante et traitée à part, sous la notion « Chute libre et mouvements plans » (entrée bk-2011-n-x4b). Rien de ce qui suit n'y est réutilisé.*

      Le ski sur la glace, est l'un des sports les plus répandus dans les régions montagnards. *(« la glace, est » — virgule entre sujet et verbe — et « montagnards » tels qu'imprimés sur le sujet officiel ; sans incidence.)* Les pratiquants de ce sport visent à réaliser des résultats positifs et battre des records.

      Le but de cet exercice est d'étudier le mouvement d'un sportif, pratiquant le ski sur des trajectoires de glace diverses.

      Le circuit de ski représenté sur la figure ci-dessous, est constitué de trois parties : *(« ci-dessous, est constitué » tel qu'imprimé — virgule entre sujet et verbe, sans incidence.)*
      - Une partie $A'B'$ rectiligne de longueur $A'B' = 82{,}7\ \text{m}$, inclinée d'un angle $\alpha = 14°$ par rapport au plan horizontal ;
      - Une partie $B'C'$ rectiligne horizontale, de longueur $L = 100\ \text{m}$ ;
      - Une partie $C'D'$ circulaire.

      **Figure (la piste, sans numéro sur le sujet — re-décrite depuis le bitmap natif, extrait pertinent aux situations 1 et 2).** Une ligne de sol horizontale en tirets, étiquetée « Plan horizontal », porte les points $B'$ et $C'$. Le point $A'$ — le DÉPART de la piste — est en haut à gauche, nettement au-dessus du plan horizontal : la piste (trait plein) descend de $A'$ à $B'$, l'angle $\alpha$ étant marqué par un petit arc entre ce segment et la ligne de sol au voisinage de $B'$ ; elle continue horizontalement de $B'$ à $C'$, puis remonte en arc de cercle de $C'$ vers $D'$. La trajectoire de $G$ (pointillés fins, parallèle à la piste, au-dessus d'elle) part de $A$ (au-dessus de $A'$), où est dessiné le vecteur unitaire $\vec{i}$ dirigé vers le bas de la pente, passe par le skieur dessiné (silhouette avec skis, centre marqué $G$), puis par $B$ et $C$ (au-dessus de $B'$ et $C'$).

      On modélise le sportif et ses accessoires par un solide $(S)$ de masse $m = 65\ \text{Kg}$ *(« Kg » tel qu'imprimé — majuscule au kilogramme, sans incidence)*, et de centre d'inertie $G$. On prendra : $g = 10\ \text{m.s}^{-2}$. $G$ passe au cours de son mouvement par les positions $A$, $B$, $C$ et $D$ représentées sur la figure, tel que *(« tel que » tel qu'imprimé — pour « telles que », sans incidence)* : $A'B' = AB$ et $B'C' = BC$.

      **1- Étude du mouvement sur la partie A'B'.** À l'instant $t = 0$, $G$ part de $A$ sans vitesse initiale, le solide $(S)$ glisse ainsi sans frottements sur la partie $A'B'$. On repère la position de $G$, à un instant $t$, par l'abscisse $x$ dans le repère$(A.\vec{i})$ *(« le repère(A.ı⃗) » tel qu'imprimé — pas d'espace après « repère » et un POINT entre $A$ et $\vec{i}$ au lieu de la virgule, défaut du sujet officiel S8)*, et on considère que $x_G = 0$ à l'instant $t = 0$.

      **2- Étude du mouvement sur la partie B'C'.** Le solide $(S)$ poursuit son mouvement sur la partie $B'C'$, où il subit des frottements modélisées *(« modélisées » tel qu'imprimé — accord fautif, sans incidence)* par une force $\vec{f}$ constante, tangente à la trajectoire et de sens inverse à celui du mouvement. On considère que la valeur de la vitesse de $G$ au point $B$ ne varie pas lors du passage du solide $(S)$ du plan incliné au plan horizontal. Pour étudier le mouvement de $G$ sur cette partie, on choisit, *(virgule parasite telle qu'imprimée)* un repère horizontal d'origine confondue avec le point $B$, et l'instant du passage de $G$ en ce point comme nouvelle origine des temps *(le paragraphe s'arrête là, sans point final, sur le sujet officiel)*
    questions:
      - id: q1
        part: "1-1 — L'accélération sur le plan incliné"
        stem: |-
          **1-1-** (0,75 pt) Par application de la deuxième loi de Newton, établir l'expression de l'accélération $a_G$ du mouvement de $G$ en fonction de $g$ et $\alpha$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement la méthode du chapitre 6, sur le dispositif du chapitre 8 — mais SANS le terme de frottement, puisque l'énoncé précise « glisse ainsi sans frottements ». Le bilan des forces ne compte donc que DEUX forces : le poids $\vec{P}$ (vertical, vers le bas, $P = mg$) et la réaction du plan $\vec{R}$, perpendiculaire au plan puisqu'il n'y a pas de composante de frottement.

          **La deuxième loi de Newton**, dans le référentiel terrestre supposé galiléen :

          $$\vec{P} + \vec{R} = m\,\vec{a}_G$$

          **Projection sur $\vec{i}$** (le long du plan, sens de la descente $A \to B$) : $\vec{R}$ n'a aucune composante le long du plan ; seule reste la composante motrice du poids, $mg\sin\alpha$ (même décomposition qu'au chapitre 8 — contrôle aux cas extrêmes : $\alpha \to 0°$ donne $0$, plus rien ne tire le skieur sur un plan horizontal ; $\alpha \to 90°$ donne $g$, la chute libre).
        steps:
          - math: '\vec{P} + \vec{R} = m\,\vec{a}_G'
            note: "Deuxième loi de Newton (chapitre 6), bilan a DEUX forces : pas de frottement sur A prime B prime (énoncé)."
          - math: 'm\,a_G = mg\sin\alpha \implies \boxed{a_G = g\sin\alpha}'
            note: "Projection sur i (le long de la pente, sens de la descente) : R est perpendiculaire au plan, seule la composante motrice du poids reste (chapitre 8)."
          - math: 'a_G = 10\times\sin14^\circ \approx 2{,}42\ \text{m.s}^{-2}'
            note: "Application numérique, utile aux questions suivantes."
      - id: q2
        part: "1-2 — La nature du mouvement"
        stem: |-
          **1-2-** (0,25 pt) Déterminer en justifiant votre réponse la nature du mouvement de $G$ sur cette partie.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. La nature d'un mouvement rectiligne se lit sur son accélération : $a_G = g\sin\alpha$ (question 1-1) est CONSTANTE ($g$ et $\alpha$ le sont), non nulle, et dirigée dans le sens du mouvement (la descente, avec un départ sans vitesse initiale — la vitesse ne peut que croître dans ce sens).

          $$\boxed{\text{mouvement rectiligne uniformément accelere (MRUV)}}$$

          La trajectoire est rectiligne (le segment $AB$), l'accélération est constante et de même sens que la vitesse : les deux mots de la réponse — « rectiligne » et « uniformément accéléré » — se justifient séparément, et le correcteur attend les deux.
      - id: q3
        part: "1-3 — La vitesse en B, par les équations horaires"
        stem: |-
          **1-3-** (0,75 pt) À l'aide des équations horaires du mouvement, trouver la valeur $v_B$ de la vitesse de $G$ lors du passage par la position $B$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. L'énoncé impose le chemin : les ÉQUATIONS HORAIRES du MRUV (chapitre 6), avec les conditions initiales de cette situation — départ de $A$ sans vitesse initiale, $x_G = 0$ à $t = 0$ :

          $$x(t) = \frac12\,a_G\,t^2 \qquad v(t) = a_G\,t$$

          $G$ passe en $B$ quand $x = AB = A'B' = 82{,}7\ \text{m}$ (l'énoncé pose $A'B' = AB$). On extrait la date $t_B$ de la première équation, on la reporte dans la seconde — l'élimination de $t_B$ donne $v_B = \sqrt{2\,a_G\,AB}$, sans jamais avoir besoin de la valeur de $t_B$ elle-même.
        steps:
          - math: 'x(t_B) = AB \implies t_B = \sqrt{\frac{2\,AB}{a_G}}'
            note: "Date du passage en B, extraite de l équation horaire des positions."
          - math: 'v_B = a_G\,t_B = \sqrt{2\,a_G\,AB} = \sqrt{2\times10\times\sin14^\circ\times82{,}7}'
            note: "Report dans l équation horaire des vitesses : t_B s elimine."
          - math: 'v_B^2 = 2\times10\times\sin14^\circ\times82{,}7 \approx 400{,}1'
            note: "Le 82,7 m de l énoncé est calibre pour un résultat rond."
          - math: '\boxed{v_B \approx 20{,}0\ \text{m.s}^{-1}}'
            note: "Vitesse au passage en B -- concordante avec le corrige non officiel."
      - id: q4
        part: "2-1 — La nature du mouvement sur BC"
        stem: |-
          **2-1-** (0,5 pt) En appliquant la deuxième loi de Newton, déterminer la nature du mouvement de $G$ sur le trajet $BC$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Même méthode (chapitre 6), mais le bilan compte maintenant TROIS forces : le poids $\vec{P}$, la réaction normale $\vec{R}$ du plan horizontal, et le frottement $\vec{f}$, constant, tangent à la trajectoire et opposé au mouvement (énoncé).

          $$\vec{P} + \vec{R} + \vec{f} = m\,\vec{a}_G$$

          **Projection verticale** : le mouvement reste horizontal, donc $R = P$ — les deux forces verticales se compensent et ne pilotent rien.

          **Projection sur l'axe horizontal du mouvement** (origine en $B$, sens de $B$ vers $C$) : seul $\vec{f}$ a une composante, et elle est négative puisque le frottement s'oppose au mouvement :

          $$m\,a_G = -f \implies a_G = -\frac{f}{m}$$

          $a_G$ est CONSTANTE ($f$ et $m$ le sont), non nulle, et de sens OPPOSÉ à la vitesse : le mouvement est rectiligne uniformément retardé (décéléré).
        steps:
          - math: '\vec{P} + \vec{R} + \vec{f} = m\,\vec{a}_G'
            note: "Deuxième loi de Newton, bilan a TROIS forces sur le plan horizontal (frottement constant, énoncé)."
          - math: 'm\,a_G = -f \implies a_G = -\frac{f}{m} = \text{constante} < 0'
            note: "Projection horizontale : P et R se compensent verticalement, seul le frottement reste, oppose au mouvement."
          - math: '\boxed{\text{mouvement rectiligne uniformément retarde (decelere)}}'
            note: "Accélération constante de sens oppose a la vitesse."
      - id: q5
        part: "2-2 — L'intensité du frottement"
        stem: |-
          **2-2-** (1 pt) Trouver l'expression de l'intensité $f$ de la force de frottement en fonction de $m$, $L$, $v_B$ et $v_C$ vitesse de $G$ au point $C$ *(apposition sans virgule d'ouverture, telle qu'imprimée — sans incidence)*, puis calculer $f$.

          On donne : $v_C = 12\ \text{m.s}^{-1}$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Le mouvement sur $BC$ est un MRUV d'accélération $a_G = -f/m$ (question 2-1) ; aucune durée n'est donnée, mais les DEUX vitesses ($v_B$, $v_C$) et la DISTANCE ($BC = B'C' = L$) le sont — exactement la configuration de la relation vitesse-déplacement du MRUV, $v^2 - v_0^2 = 2\,a\,d$, qu'on retrouve au besoin en éliminant $t$ entre les deux équations horaires (le même geste qu'à la question 1-3).

          $$v_C^2 - v_B^2 = 2\,a_G\,L = -\frac{2\,f\,L}{m}$$

          On isole $f$ — le signe s'occupe de lui-même : $v_C < v_B$, donc le membre de gauche est négatif, et $f$ sort positive, comme une intensité doit l'être.

          **Le piège nommé de cette question.** Prendre $v_B$ de la question 1-3 est correct ($20{,}0\ \text{m.s}^{-1}$), parce que l'énoncé précise que la vitesse « ne varie pas lors du passage du plan incliné au plan horizontal » — mais attention à l'ordre du carré : c'est $v_B^2 - v_C^2$ au numérateur (la vitesse DIMINUE), pas l'inverse, sans quoi $f$ sortirait négative.
        steps:
          - math: 'v_C^2 - v_B^2 = 2\,a_G\,L = -\frac{2\,f\,L}{m}'
            note: "Relation vitesse-deplacement du MRUV entre B et C, avec a_G = -f/m (question 2-1) et BC = L."
          - math: '\boxed{f = \frac{m\left(v_B^2 - v_C^2\right)}{2L}}'
            note: "Expression demandee : f positive car v_B > v_C."
          - math: 'f = \frac{65\times\left(20^2 - 12^2\right)}{2\times100} = \frac{65\times256}{200}'
            note: "Application numérique avec v_B = 20,0 m/s (question 1-3, conservée au passage en B) et v_C = 12 m/s."
          - math: '\boxed{f \approx 83{,}2\ \text{N}}'
            note: "Intensité du frottement -- concordante avec le corrige non officiel (83,2 N, par deux méthodes)."

