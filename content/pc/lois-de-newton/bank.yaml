    intro: |-
      **Mouvement sur un plan incliné, sans frottement (examen national, session normale 2010 — Mécanique, 1ère partie, 1,50 point sur les 6,00 de l'exercice complet).**

      *Les deux parties suivantes de cet exercice — le mouvement de G dans l'air puis la chute de G dans l'eau — sont traitées à part, sous la notion « Chute libre et mouvements plans » (entrées bk-2010-n-x4b et bk-2010-n-x4c). Elles réutilisent la valeur $V_C = 4{,}67\ \text{m.s}^{-1}$, une DONNÉE de l'énoncé de la partie 2, indépendante de ce qui est calculé ici.*

      Les toboggans dans les piscines permettent aux nageurs de glisser et de plonger dans l'eau. On modélise un toboggan par une piste $ABC$ constituée d'une partie $AB$ inclinée d'un angle $\alpha$ par rapport au plan horizontal et d'une partie circulaire $BC$, et on modélise le nageur par un solide $(S)$ de centre d'inertie $G$ et de masse $m$ (figure 1).

      **Données :** $AB = 2{,}4\ \text{m}$, $\alpha = 20°$, $g = 9{,}8\ \text{m.s}^{-2}$, $m = 70\ \text{Kg}$. *(« Kg » tel qu'imprimé sur le sujet officiel — coquille de casse, sans incidence sur la valeur.)*

      **1- Étude du mouvement sur la partie AB.** Le solide $(S)$ part de la position $A$, supposée confondue avec $G$, à l'instant $t=0$, sans vitesse initiale, et glisse SANS FROTTEMENT sur la piste $AB$ (figure 1). On étudie le mouvement de $G$ dans le repère terrestre $\mathcal{R}_1(A, \vec{i_1}, \vec{j_1})$, supposé galiléen.

      **Figure 1 — extrait pertinent à cette partie** *(décrite depuis le bitmap d'origine 740×540, agrandi ×2 puis ×4 — pas depuis l'énoncé).* Un segment droit part de $A$ (en haut à gauche) et descend vers $B$ (en bas à droite). En $A$, le repère $\mathcal{R}_1$ : $\vec{i_1}$ le long du plan, dirigé de $A$ vers $B$ ; $\vec{j_1}$ perpendiculaire au plan, dirigé vers le haut, du côté opposé au plan. Le solide $(S)$, petit rectangle gris avec un point noir en son centre (c'est $G$), est posé à mi-pente. L'angle $\alpha$ est marqué en $B$, entre le plan et une horizontale en tirets.
    questions:
      - id: q1
        part: "1-1 — Les composantes de l'accélération"
        stem: |-
          **1-1-** (0,5 pt) Par application de la deuxième loi de Newton, déterminer les composantes du vecteur accélération $\vec{a_G}$ dans le repère $\mathcal{R}_1(A, \vec{i_1}, \vec{j_1})$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. Exactement la méthode du chapitre 6 de la leçon, sur le cas du chapitre 8 — mais SANS le terme de frottement, puisque l'énoncé précise « glisse sans frottement ». Le bilan des forces ne compte donc que DEUX forces, pas trois : le poids $\vec{P}$ (vertical, vers le bas, $P=mg$) et la réaction normale du plan $\vec{N}$ (perpendiculaire au plan, vers l'extérieur).

          **La deuxième loi de Newton :**

          $$\vec{P} + \vec{N} = m\,\vec{a_G}$$

          **Projection sur $\vec{i_1}$** (le long du plan, sens de la descente $A\to B$) : $\vec{N}$ n'a aucune composante le long du plan ; seul le poids en a une, sa composante motrice $mg\sin\alpha$ (même décomposition qu'au chapitre 8, testée aux deux cas extrêmes $\alpha\to0°$ et $\alpha\to90°$).

          $$m\,a_x = mg\sin\alpha \implies a_x = g\sin\alpha$$

          **Projection sur $\vec{j_1}$** (perpendiculaire au plan) : le solide reste SUR le plan, donc $a_y=0$ — la même conclusion géométrique qu'au chapitre 6.

          $$a_y = 0$$
        steps:
          - math: '\vec{P} + \vec{N} = m\,\vec{a_G}'
            note: "Deuxième loi de Newton, bilan a DEUX forces seulement (pas de frottement, énoncé)."
          - math: 'a_x = g\sin\alpha = 9{,}8\times\sin20^\circ'
            note: "Projection sur i1 (le long du plan) : seule la composante motrice du poids agit, N n'a pas de composante ici."
          - math: '\boxed{a_x \approx 3{,}35\ \text{m.s}^{-2} \qquad a_y = 0}'
            note: "a_y = 0 car le solide reste sur le plan (projection sur j1)."
      - id: q2
        part: "1-2 — La vitesse en B"
        stem: |-
          **1-2-** (0,5 pt) Déterminer $V_B$, la vitesse de $G$ au point $B$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. L'accélération $a_x$ est constante (question précédente) : le mouvement sur $AB$ est rectiligne uniformément varié, avec un départ sans vitesse initiale en $A$. La relation de Torricelli du MRUV, $V^2 = V_0^2 + 2\,a\,d$, relie directement la vitesse en un point à la distance parcourue, sans passer par le temps — exactement ce que la question demande, puisque la durée du trajet $AB$ n'est pas donnée.

          $$V_B^2 = V_A^2 + 2\,a_x\,AB = 0 + 2\,a_x\,AB$$
        steps:
          - math: 'V_B^2 = 2\,a_x\,AB = 2\times3{,}35\times2{,}4'
            note: "Relation vitesse-distance du MRUV (V_A=0, départ sans vitesse initiale en A)."
          - math: 'V_B^2 \approx 16{,}08\ \text{m}^2.\text{s}^{-2}'
            note: "Calcul intermédiaire."
          - math: '\boxed{V_B = \sqrt{16{,}08} \approx 4{,}01\ \text{m.s}^{-1}}'
            note: "Racine carrée du résultat précédent. Cette valeur ne sert pas a la suite : la partie 2 utilise V_C, une donnée indépendante."
      - id: q3
        part: "1-3 — La réaction du plan"
        stem: |-
          **1-3-** (0,5 pt) Déterminer l'intensité $R$ de la force associée à l'action du plan $AB$ sur le solide $(S)$.
        reasoning: |-
          Ce qu'on cherche et pourquoi ce geste. La réaction du plan sur le solide est exactement la force $\vec{N}$ du bilan de la question 1-1 (l'énoncé la note $R$ ici — même grandeur, autre lettre). Sa valeur est déjà cachée dans la projection sur $\vec{j_1}$ qu'on a laissée de côté à la question 1-1 : puisque $a_y=0$, les deux forces perpendiculaires au plan se compensent exactement.

          $$0 = N - mg\cos\alpha \implies N = mg\cos\alpha$$

          Même test aux deux cas extrêmes qu'au chapitre 8 : si $\alpha\to0°$ (plan horizontal), $N\to mg$, tout le poids repose sur le plan — cohérent. Si $\alpha\to90°$ (plan vertical), $N\to0$, plus rien ne presse sur un plan qui ne soutient plus rien — cohérent aussi.
        steps:
          - math: 'R = N = mg\cos\alpha = 70\times9{,}8\times\cos20^\circ'
            note: "Projection sur j1 (question 1-1) : a_y=0 donc N=mg.cos(alpha). L'énoncé nomme cette force R."
          - math: 'mg = 70\times9{,}8 = 686\ \text{N}'
            note: "Poids du solide, calcul intermédiaire."
          - math: '\boxed{R \approx 686\times0{,}9397 \approx 644{,}6\ \text{N}}'
            note: "Résultat demande."

