      **Étude du mouvement d'un skieur (examen national, session de rattrapage 2015 — Exercice 4, Première partie, 3,00 points sur les 05,5 de l'exercice complet).**

      *Les deux parties de cet exercice sont indépendantes — le sujet imprime « Les deux partie sont indépendantes » [sic]. La seconde partie — l'étude énergétique d'un pendule de torsion — vit à part, sous la notion « Aspects énergétiques » (entrée bk-2015-r-x4b). Rien de ce qui suit n'en dépend.*

      La pratique du sport du ski, dans les stations des montagnes, attire de plus en plus l'intension des jeunes marocains, parcequ'elle intégre les qualités du plasir et l'aventure. *(« l'intension », « parcequ'elle », « intégre », « plasir » et « et l'aventure » tels qu'imprimés — défauts du sujet officiel, sans incidence)*

      Le but de cet exercice est d'étudier le mouvement du centre d'inertie d'un skieur et ses accessoires sur le circuit du ski. *(« et ses accessoires », sans « de », tel qu'imprimé — tournure répétée six fois sur la page)*

      La figure ci-dessous, représente un circuit de ski constitué de deux parties :
      - Partie $A'B'$ rectiligne et inclinée d'un angle $\alpha$ par rapport au plan horizontal ;
      - Partie $B'C'$ rectiligne et horizontale.

      **Figure (le circuit de ski, page 6 du sujet, sans numéro — re-décrite depuis le bitmap natif).** Une ligne pleine descend de gauche à droite du point $A'$ au point $B'$ (bas de pente), puis continue horizontalement de $B'$ à $C'$. L'angle $\alpha$ est marqué par un petit arc entre la pente et une ligne horizontale en pointillés au pied de la pente. Sur la pente, le repère incliné : le point $A$ (posé SUR la pente, au-dessus de $A'$), l'axe $y'$ en pointillés perpendiculaire à la pente avec le vecteur $\vec{j'}$, le vecteur $\vec{i'}$ dirigé vers le BAS de la pente, et l'axe $x'$ en pointillés parallèle à la pente, passant par $G$ — un point noir au centre d'un petit dessin de skieur, entre $A$ et $B'$. Sur la partie horizontale : le point $B$ (au-dessus de $B'$), le vecteur $\vec{i}$ vers la droite, et l'axe $X$ en pointillés passant par $C$ (au-dessus de $C'$).

      **Données :**
      - $g = 9{,}8\ \text{m.s}^{-2}$ ;
      - Longueur de la partie $A'B'$ : $A'B' = 80\ \text{m}$ ;
      - Masse du skieur et ses accessoires : $m = 60\ \text{kg}$ ;
      - L'angle d'inclinaison : $\alpha = 18°$. *(Le sujet imprime « L'angled'inclinaison » sans espace visible — défaut de composition, sans incidence)*

      **1- Étude du mouvement du skieur et ses accessoires sur la partie inclinée sans frottements.**

      On étudie le mouvement du centre d'inertie $G$ du système $(S)$, formé du skieur et ses accessoires, dans le repère $(\text{A}, \vec{i'}, \vec{j'})$ lié à la terre et supposé galiléen. *(« lié à la terre », minuscule, tel qu'imprimé)*

      A un instant $t = 0$, choisi comme origine des temps, le système $(S)$ part sans vitesse initiale d'une position où $G$ coincide avec $A$. *(« coincide » tel qu'imprimé)*

      Le mouvement de $G$ se fait suivant la ligne de plus grande pente du plan incliné $AB$, tel que : $AB = A'B'$.

      **2- Étude du mouvement du skieur et ses accessoires sur la partie horizontale avec frottements.**

      Le mouvement de $G$ se fait sur la partie $BC$, tel que : $BC = B'C'$. On étudie le mouvement du centre d'inertie $G$ du système $(S)$ formé du skieur et ses accessoires dans le repère $(\text{B}, \vec{i})$ lié à la terre et supposé galiléen. On prend $x_G = 0$, à un instant $t = 0$, considéré comme nouvelle origine des dates.

      Le système subit au cours de son mouvement deux types de frottements :
      - Frottements dus au contact entre la partie $B'C'$ et le système $(S)$, modélisés par une force constante : $\vec{f_1} = -6.\vec{i}$ ;
      - Frottements dus à l'action de l'air, modélisés par la force : $\vec{f_2} = -0{,}06.v^2.\vec{i}$, où $v$ représente la vitesse du centre d'inertie $G$.

      *(Les intensités des deux frottements sont imprimées SANS unité — défaut de notation du sujet officiel : il faut lire $6$ en newtons et $0{,}06$ en $\text{N.s}^2\text{.m}^{-2}$ pour que l'équation de la question 2-1 soit homogène.)*
    questions:
      - id: q1-1
        part: "1 — Sur la partie inclinée, sans frottements"
        stem: |-
          Par application de la deuxième loi de Newton, trouver :

          **1-1-** (0,5 pt) La valeur de l'accélération $a_G$ du mouvement du centre d'inertie $G$.
        reasoning: |-
          La méthode du chapitre 8, dans sa version SANS frottement : système $(S)$ réduit à $G$, référentiel terrestre supposé galiléen (énoncé), bilan à DEUX forces seulement — le poids $\vec{P} = m\vec{g}$ et la réaction du plan $\vec{R}$, perpendiculaire au plan puisque le contact est sans frottement.

          $$\vec{P} + \vec{R} = m\,\vec{a_G}$$

          **Projection sur $\vec{i'}$** (le long de la pente, vers le bas) : le poids se décompose comme au chapitre 8 — composante $mg\sin\alpha$ le long de la pente, motrice ; $\vec{R}$, perpendiculaire à $\vec{i'}$, ne projette rien.

          $$m\,a_G = mg\sin\alpha \implies a_G = g\sin\alpha = 9{,}8\times\sin 18°$$

          $$\boxed{a_G \approx 3{,}03\ \text{m.s}^{-2}}$$

          L'accélération ne dépend pas de la masse — les $60\ \text{kg}$ ne servent qu'à la question suivante.

          Le piège nommé de cette question. Confondre $\sin$ et $\cos$ : le contrôle en deux secondes, faire tendre $\alpha \to 0$ (piste horizontale) — le skieur ne doit plus accélérer, ce que donne $\sin 0 = 0$, jamais $\cos 0 = 1$.
        steps:
          - math: '\vec{P} + \vec{R} = m\,\vec{a_G}'
            note: "Deuxième loi de Newton (chapitre 8), bilan a DEUX forces : sans frottement, R est normale au plan."
          - math: 'm\,a_G = mg\sin\alpha'
            note: "Projection sur i' : le poids projette mg.sin(alpha), R ne projette rien."
          - math: '\boxed{a_G = g\sin\alpha = 9{,}8\times\sin 18° \approx 3{,}03\ \text{m.s}^{-2}}'
            note: "Indépendante de la masse."
      - id: q1-2
        stem: |-
          **1-2-** (0,5 pt) L'intensité $R$ de la force modélisant l'action du plan incliné sur $(S)$.
        reasoning: |-
          On récupère la projection sur $\vec{j'}$, laissée de côté à la question 1-1 : le système reste SUR le plan, donc l'accélération perpendiculaire au plan est nulle, et les deux forces perpendiculaires se compensent exactement (chapitre 8) :

          $$0 = R - mg\cos\alpha \implies R = mg\cos\alpha = 60\times9{,}8\times\cos 18°$$

          $$\boxed{R \approx 559\ \text{N}}$$

          Sans frottement, l'action du plan se réduit à sa composante normale : $R$ EST cette composante, il n'y a rien à composer.

          Le piège nommé de cette question. Répondre $R = mg = 588\ \text{N}$ : la réaction ne compense le poids EN ENTIER que sur un plan horizontal — sur un plan incliné, elle ne compense que la composante perpendiculaire, $mg\cos\alpha$, le reste du poids étant précisément ce qui accélère le skieur (question 1-1). Et à l'inverse du skieur de 2017 (bk-2017-n-x4, dans cette même banque), il n'y a PAS de Pythagore à faire ici : le contact est sans frottement, l'action du plan est purement normale.
        steps:
          - math: '0 = R - mg\cos\alpha'
            note: "Projection sur j' (chapitre 8) : le système reste sur le plan, accélération perpendiculaire nulle."
          - math: 'R = mg\cos\alpha = 60\times9{,}8\times\cos 18°'
            note: "Sans frottement, l'action du plan est purement normale -- pas de Pythagore ici."
          - math: '\boxed{R \approx 559\ \text{N}}'
            note: "Inférieure a mg = 588 N : la réaction ne compense que la composante perpendiculaire du poids."
      - id: q1-3
        stem: |-
          **1-3-** (0,5 pt) La valeur $v_B$ de la vitesse de $G$ au passage par la position $B$.
        reasoning: |-
          L'accélération est constante (question 1-1) et le départ se fait sans vitesse depuis $A$ : mouvement rectiligne uniformément accéléré, et la relation vitesse-distance du MRUV (chapitre 7) relie directement $v_B$ à la longueur parcourue $AB = 80\ \text{m}$, sans passer par le temps :

          $$v_B^2 - v_A^2 = 2\,a_G\,AB \implies v_B = \sqrt{2\,a_G\,AB} = \sqrt{2\times3{,}03\times80}$$

          $$\boxed{v_B \approx 22{,}0\ \text{m.s}^{-1}}$$

          (soit environ $79\ \text{km.h}^{-1}$ — plausible pour un skieur lancé sur $80\ \text{m}$ de pente, et cohérent avec le tableau de la question 2-2, où $v$ vaut encore $21{,}77\ \text{m.s}^{-1}$ à $0{,}4\ \text{s}$ après le passage en $B$).

          Le piège nommé de cette question. Écrire $v_B = a_G\,t$ et chercher un temps que l'énoncé ne donne pas : la relation $v^2 = 2\,a\,d$ existe précisément pour court-circuiter le chronomètre quand on connaît la distance — c'est la voie directe ici.
        steps:
          - math: 'v_B^2 = 2\,a_G\,AB'
            note: "Relation vitesse-distance du MRUV (chapitre 7), départ sans vitesse initiale."
          - math: 'v_B = \sqrt{2\times3{,}03\times80}'
            note: "a_G de la question 1-1, AB = A'B' = 80 m (donnée)."
          - math: '\boxed{v_B \approx 22{,}0\ \text{m.s}^{-1}}'
            note: "Cohérent avec le tableau d'Euler de la partie 2 (v = 21,77 m/s a t = 0,4 s)."
      - id: q2-1
        part: "2 — Sur la partie horizontale, avec frottements"
        stem: |-
          **2-1-** (0,5 pt) Par application de la deuxième loi de Newton, montrer que l'équation différentielle vérifiée par la vitesse $v$, s'écrit sous la forme : $\dfrac{dv}{dt} + 10^{-3}.v^2 + 0{,}1 = 0$. *(La virgule après « la vitesse $v$ » est telle qu'imprimée — défaut du sujet officiel, sans incidence)*
        reasoning: |-
          La méthode du chapitre 6, sur le plan horizontal : bilan à QUATRE forces — le poids $\vec{P}$, la réaction normale du plan $\vec{R_N}$, et les DEUX frottements de l'énoncé, $\vec{f_1} = -6.\vec{i}$ (contact) et $\vec{f_2} = -0{,}06.v^2.\vec{i}$ (air).

          $$\vec{P} + \vec{R_N} + \vec{f_1} + \vec{f_2} = m\,\vec{a_G}$$

          **Projection sur $\vec{i}$** (horizontal) : $\vec{P}$ et $\vec{R_N}$ sont verticaux, leurs projections sont nulles — il ne reste que les frottements, tous deux opposés au mouvement :

          $$m\,\frac{dv}{dt} = -6 - 0{,}06\,v^2$$

          On divise par $m = 60\ \text{kg}$ :

          $$\frac{dv}{dt} = -\frac{6}{60} - \frac{0{,}06}{60}\,v^2 = -0{,}1 - 10^{-3}\,v^2$$

          $$\boxed{\frac{dv}{dt} + 10^{-3}.v^2 + 0{,}1 = 0}$$

          — exactement la forme imprimée : $6/60 = 0{,}1$ et $0{,}06/60 = 10^{-3}$, les deux coefficients tombent juste.

          Le piège nommé de cette question. Oublier de diviser par la masse (écrire $dv/dt + 0{,}06\,v^2 + 6 = 0$) : la deuxième loi donne $m\,a$, pas $a$ — et le contrôle est offert par l'énoncé lui-même, puisque la forme cible est imprimée : si tes coefficients ne sont pas $10^{-3}$ et $0{,}1$, c'est la division par $60$ qui manque.
        steps:
          - math: '\vec{P} + \vec{R_N} + \vec{f_1} + \vec{f_2} = m\,\vec{a_G}'
            note: "Deuxième loi de Newton (chapitre 6), bilan a quatre forces sur le plan horizontal."
          - math: 'm\,\frac{dv}{dt} = -6 - 0{,}06\,v^2'
            note: "Projection sur i : P et R_N verticaux ne projettent rien ; les deux frottements s'opposent au mouvement."
          - math: '\boxed{\frac{dv}{dt} + 10^{-3}.v^2 + 0{,}1 = 0}'
            note: "Division par m = 60 : 6/60 = 0,1 et 0,06/60 = 1e-3 -- la forme imprimée retombe exactement."
      - id: q2-2
        stem: |-
          **2-2-** (1 pt) En exploitant le tableau ci-contre, et en utilisant la méthode d'Euler, calculer les valeurs : $a_{i+1}$ et $v_{i+2}$.

          | $t\,(\text{s})$ | $v\,(\text{m.s}^{-1})$ | $a\,(\text{m.s}^{-2})$ |
          |---|---|---|
          | $t_i = 0{,}4$ | $21{,}77$ | $-0{,}57$ |
          | $t_{i+1} = 0{,}8$ | $21{,}54$ | $a_{i+1}$ |
          | $t_{i+2} = 1{,}2$ | $v_{i+2}$ | $-0{,}55$ |
        reasoning: |-
          La méthode d'Euler n'est construite pas à pas par aucun chapitre de CETTE leçon — c'est le geste central de la leçon « Chute libre et mouvements plans », qu'on transpose ici : à chaque ligne du tableau, l'équation différentielle donne l'accélération À PARTIR de la vitesse de la même ligne, et la vitesse de la ligne suivante s'obtient en avançant d'un pas $\Delta t = t_{i+1} - t_i = 0{,}4\ \text{s}$.

          **Premier calcul — $a_{i+1}$, par l'équation différentielle évaluée à la ligne $i+1$** (question 2-1) :

          $$a_{i+1} = -\left(10^{-3}\,v_{i+1}^2 + 0{,}1\right) = -\left(10^{-3}\times(21{,}54)^2 + 0{,}1\right) = -(0{,}464 + 0{,}1)$$

          $$\boxed{a_{i+1} \approx -0{,}56\ \text{m.s}^{-2}}$$

          **Second calcul — $v_{i+2}$, par le pas d'Euler depuis la ligne $i+1$** :

          $$v_{i+2} = v_{i+1} + a_{i+1}\times\Delta t = 21{,}54 + (-0{,}564)\times0{,}4$$

          $$\boxed{v_{i+2} \approx 21{,}3\ \text{m.s}^{-1}}$$

          Le contrôle qui rassure : la valeur trouvée s'insère exactement dans la logique du tableau — $a_{i+1} \approx -0{,}56$ tombe entre les $-0{,}57$ et $-0{,}55$ imprimés (la décélération faiblit à mesure que $v$ décroît, puisque le terme en $v^2$ diminue), et $v_{i+2} = 21{,}3 < 21{,}54$ : le skieur ralentit bien.

          Le piège nommé de cette question. Avancer $v_{i+2}$ avec la MAUVAISE accélération — $a_i = -0{,}57$ (la ligne du dessus) ou $a_{i+2} = -0{,}55$ (la ligne d'arrivée) au lieu de $a_{i+1}$ qu'on vient de calculer : le pas d'Euler part TOUJOURS de l'état courant ($t_{i+1}$) avec l'accélération de CET état. Second piège : oublier que le pas vaut $0{,}4\ \text{s}$ (lu sur la colonne des temps), pas $1\ \text{s}$.
        steps:
          - math: 'a_{i+1} = -\left(10^{-3}\times(21{,}54)^2 + 0{,}1\right)'
            note: "L'équation différentielle (question 2-1) evaluee avec la vitesse de la MÊME ligne, $v_{i+1}$ = 21,54 m/s."
          - math: '\boxed{a_{i+1} \approx -0{,}56\ \text{m.s}^{-2}}'
            note: "Tombe entre -0,57 et -0,55 : la deceleration faiblit avec v (terme en v^2)."
          - math: 'v_{i+2} = v_{i+1} + a_{i+1}\,\Delta t = 21{,}54 - 0{,}564\times0{,}4'
            note: "Pas d'Euler, Delta t = 0,4 s lu sur la colonne des temps -- méthode construite dans la leçon Chute et mouvements plans."
          - math: '\boxed{v_{i+2} \approx 21{,}3\ \text{m.s}^{-1}}'
            note: "Le skieur ralentit : cohérent avec le tableau."
