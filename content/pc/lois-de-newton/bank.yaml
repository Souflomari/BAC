            note: "Instant d'arrêt du système."
      - id: q7
        part: "2.3 — La distance parcourue"
        stem: |-
          **(0,5 pt)** Déduire la distance $BC$ parcourue par $G$.
        reasoning: |-
          « Déduire » : la relation vitesse-distance du MRUV (chapitre 7), $v^2 = v_0^2+2\,a_x\,d$, relie directement la vitesse à la distance sans repasser par le temps — utile ici puisqu'on connaît déjà l'accélération et qu'à l'arrêt $v=0$.

          $$0 = v_0^2 + 2\,a_x\,BC \implies BC = -\frac{v_0^2}{2\,a_x}$$

          Le contrôle qui rassure. On peut aussi retrouver $BC$ par $BC = v_0\,t_c + \frac{1}{2}a_x\,t_c^2$ avec $t_c \approx 8{,}33\ \text{s}$ (question 2.2) : $25\times8{,}33 - \frac{1}{2}\times3\times8{,}33^2 \approx 208{,}3-104{,}2 \approx 104{,}2\ \text{m}$ — les deux méthodes se recoupent.
        steps:
          - math: 'BC = -\frac{v_0^2}{2\,a_x} = -\frac{25^2}{2\times(-3)}'
            note: "Relation vitesse-distance du MRUV (chapitre 7) : v^2 = v0^2+2.a_x.d, avec v=0 a l'arrêt."
          - math: '\boxed{BC \approx 104{,}17\ \text{m}}'
            note: "Distance parcourue de B a C, vérifiée indépendamment par BC = v0.t_c + 0,5.a_x.t_c^2."

