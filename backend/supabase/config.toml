# Supabase project configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.external.google]
enabled = false

[functions]
# Edge functions
[functions.next-session]
verify_jwt = false

[functions.submit-answer]
verify_jwt = false

[functions.progress]
verify_jwt = false

[functions.daily-quests]
verify_jwt = false

[functions.record-notion-event]
# JWT is verified INSIDE the function (anon client auth.getUser → 401),
# same pattern as submit-answer; gateway verification stays off so the
# CORS preflight (OPTIONS) can pass. item-misconceptions.json is read at
# runtime via Deno.readTextFile — it must ship as a static file.
verify_jwt = false
static_files = ["./functions/record-notion-event/item-misconceptions.json"]
